<script type="application/json" id="altm-items">[{"id":"q-1.3.1-A-1","lo":"TM-1.3.1","cluster":"1.3.1-A","clusterName":"リスクベースドテストの主な活動と、その区画","variantAxis":"リスク分析とリスクコントロールの区画の境界を、活動の振る舞いから判別する","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、リスクベースドテストの進め方を新しいメンバーに説明している。","question":"リスクコントロールにあたる活動として最も適切なものはどれか。1つ選べ。","choices":["挙がっている懸念の進み具合を追い、新しく出てきた懸念を一覧に加える","関係する部署から、どこが壊れると業務が止まるかを挙げてもらう","挙がった項目を、起こりやすさと起きたときの痛みの度合いで段位付けする","一覧の見直しは、テストを一巡して全体の姿が見えてから、まとめて行う"],"answer":[0],"explanation":{"signals":"効くのは「リスクコントロールか」という区画の指定だけである。新しいメンバーへの説明という場面は、どの区画の話かを指しているだけで、どれが答えかを変えない。4つとも現場で実際に行う活動であり、実務上の正しさでは区別がつかない。","why":"シラバスはリスクベースドテストの主な活動を2階層に分けている。リスク分析はリスク識別とリスクアセスメントからなり、リスクコントロールはリスクモニタリングとリスク軽減からなる。挙がっている懸念の進展を追い、新たに出てきたものを一覧に加える行為はリスクモニタリングにあたり、リスクコントロールの側に属する。シラバスはテストモニタリングにリスクモニタリングを含めるべきだと述べ、その内容として既知の品質リスクの進展の追跡に加え、新たな品質リスクを分析してリスクレジスターを調整することまで挙げている。","distractors":[null,"どこが壊れると業務が止まるかを関係者から挙げてもらう行為はリスク識別であり、リスク分析の側に属する。リスクベースドテストの入口にある活動なので「まずこれをやる」という順序の感覚から選ばれやすいが、問われているのは順序ではなく区画である","起こりやすさと痛みの度合いから段位を付けるのはリスクアセスメントであり、これもリスク分析の側である。リスクレベルを扱う点がコントロールらしく見えるが、レベルを決める段と、決めたあとの進展を追う段は別の区画にある","一覧の見直しを後ろへ寄せる進め方である。全体像が見えてからの方が精度が高いという論拠は現場で実際に語られるが、シラバスはリスクモニタリングをテストモニタリングに含めるべきものとしており、1.3.6 もリスク分析を継続的でイテレーティブな活動としている。まとめて一度行うものではない"],"flip":[null,null,null,null],"flipNote":{"2":"どこが壊れると業務が止まるかを関係者から挙げてもらう行為は、シラバスがリスク分析の一方の柱として挙げるリスク識別にあたる。行為の中身は正しく、誤っているのはそれをリスクコントロールの側に置いた点だけである。したがってこの肢が正解になるのは、問う区画そのものを入れ替えたときであり、それはシナリオや選択肢の条件の変更ではなく設問の変更である。しかも問う区画をリスク分析に入れ替えると、同じリスク分析の側にある、起こりやすさと痛みの度合いで段位を付ける肢も同時に正しくなり、正答が2つになって1つ選べの形が壊れる","3":"起こりやすさと痛みの度合いから段位を付ける行為は、シラバスがリスク分析のもう一方の柱として挙げるリスクアセスメントであり、リスクレベルの決定の手順そのものである。リスクレベルを扱う点はコントロールらしく見えるが、区画は分析の側である。この肢が正解になるのは問う区画を入れ替えたときだけで、それは条件の変更ではなく設問の変更である。しかも問う区画をリスク分析に入れ替えると、同じ側にある、どこが壊れると業務が止まるかを挙げてもらう肢も同時に正しくなり、正答が2つになって1つ選べの形が壊れる","4":"この肢の誤りは行為の中身ではなく、見直しを一度にまとめて後ろへ寄せた点にある。シラバスはリスクモニタリングをテストモニタリングに含めるべきものとし、1.3.6 はリスク分析を継続的でイテレーティブな活動であって初めに一度だけ実施するものではないと述べている。どの区画を問う設問に変えても、まとめて一度行う進め方を支える記述が原文に無い"},"quote":"リスク分析は、リスク識別およびリスクアセスメントからなる。リスクコントロールは、リスクモニタリングとリスク軽減からなる。","ref":"1.3.1","misconception":"リスクベースドテストの活動を「分析してから対応する」という時間順でしか覚えておらず、リスク分析とリスクコントロールという2つの区画に、それぞれどの活動が属するかを区別できていない"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスク分析","リスクコントロール","リスクモニタリング"],"distractorIntent":["リスク識別をリスクコントロールの側に置く","リスクアセスメントをリスクコントロールの側に置く","リスクの見直しは後でまとめて行えばよいと考える"],"distractorTypes":["D1","D1","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.1 の2階層の列挙（リスク分析＝識別＋アセスメント／リスクコントロール＝モニタリング＋軽減）。公式サンプル SET B 問2（TM-1.1.2・K2、D1＋D7×2）の構成に合わせ、誤答は隣の区画の正しい活動2つと先送り1つで作った","mistakePatterns":["MP-30"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答・quote は原文どおり。flipNote「2」「3」が、区画を入れ替えれば自分だけが正解になると読める（実際は2つ立つ）","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"8eae39d05c19","explSig":"39231033a457","fieldSig":{"explanation.flipNote[2]":"205c815bf6ce","syllabus":"79c0ba4a0756"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"D1×2 は区画を知らないと消せない。選択肢4は弱いが選ぶ思考は書ける","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"8eae39d05c19","explSig":"39231033a457","fieldSig":{}}]}},{"id":"q-1.3.1-A-2","lo":"TM-1.3.1","cluster":"1.3.1-A","clusterName":"リスクベースドテストの主な活動と、その区画","variantAxis":"リスク軽減がテスト計画・テスト分析・テスト実行に分散して現れる形を選ぶ","variant":2,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、洗い出した懸念をテストの進め方にどう反映するかを整理している。","question":"リスクの軽減がテスト活動に分散して現れる例として最も適切なものはどれか。1つ選べ。","choices":["新しく出てきた懸念の扱いは、次のイテレーションの計画をつくるときにまとめて検討する","洗い出した項目それぞれに、起こりやすさと痛みの度合いから段位を割り当てる","事前の洗い出しの結果を使い、適した技法を選んで重い領域にテストを集中させる","重い懸念には、あらかじめ回避策を用意し、外部から調達する部分については供給元に引き取ってもらう"],"answer":[2],"explanation":{"signals":"効くのは「リスクの軽減がテスト活動に分散して現れる例か」という一点である。整理をしているという場面設定は区画を指しているだけで、どれが答えかを変えない。4つとも実際に行う活動であり、行為として妥当かどうかでは絞れない。","why":"シラバスはリスク軽減を、いくつかのテスト活動に分散して行われるものと位置づけ、3つの現れ方を挙げている。品質リスク分析の結果を、正しい技法を使って正しい領域にテストを集中させるためにテスト計画に使うこと、テスト分析でリスクレベルがカバーすべきテスト条件の選択の指針となること、テスト実行でリスクを基にした優先順位付けが実行の順序を決定することである。事前の洗い出しの結果から技法と対象を決める案は、この1つ目にそのまま対応する。","distractors":["新しく出てきた懸念の検討を次の計画づくりまで持ち越す進め方である。まとめて扱う方が段取りがよいという論拠は現場で通るが、シラバスはテストモニタリングにリスクモニタリングを含め、新たな品質リスクを分析してリスクレジスターを調整することまで含めるべきだと述べている","起こりやすさと痛みの度合いから段位を割り当てるのはリスクアセスメントであり、リスク分析の側の活動である。軽減の土台を作る行為なので軽減そのものに見えるが、シラバスはリスク分析とリスクコントロールを別の区画として並べている",null,"回避策の用意と供給元への引き取りは、シラバスが 1.3.4 でその他のリスク軽減の手段として挙げているコンティンジェンシープランとサードパーティへのリスク移転にあたり、重い懸念への対応としてそれ自体は正しい。しかしどちらもテスト活動ではない。シラバスがここで述べているのは、リスク軽減がいくつかのテスト活動に分散して行われることであり、その現れはテスト計画・テスト分析・テスト実行の3つである"],"flip":[null,null,null,null],"flipNote":{"1":"設問が問うているのは、リスク軽減がテスト活動に分散して現れる例であり、シラバスがその現れとして挙げるのはテスト計画・テスト分析・テスト実行の3つである。新しく出てきた懸念の扱いを次の計画づくりまで持ち越す進め方はそのどれにも当たらず、シラバスはむしろテストモニタリングに新たな品質リスクの分析とリスクレジスターの調整を含めるべきだとしている。持ち越す相手を変えても、この肢を正解にする条件は原文の中に無い","2":"起こりやすさと痛みの度合いから段位を割り当てる行為は、シラバスがリスク分析に置くリスクアセスメントである。シラバスはリスク分析とリスクコントロールを別の区画として並べており、軽減の分散先にこの活動が移る条件はシナリオにも選択肢にも無い。問う区画を入れ替えれば選ぶ側に立つが、それは条件の変更ではなく設問の変更である","4":"回避策の用意と供給元への引き取りは、シラバスが 1.3.4 でその他のリスク軽減の手段として挙げるコンティンジェンシープランとサードパーティへのリスク移転にあたり、重い懸念への手立てとしては正しい。しかしどちらもテスト活動ではなく、設問が問うているのはリスク軽減がテスト活動に分散して現れる例（テスト計画・テスト分析・テスト実行）である。テストの外側の手段を問う形に変えれば正解になるが、それは条件の変更ではなく設問の変更である"},"quote":"リスク軽減は、いくつかのテスト活動に分散して行われる。例えば、品質リスク分析の結果は、正しい技法を使って正しい領域にテストを集中させるためにテスト計画に使用する。テスト分析では、リスクレベルがカバーすべきテスト条件の選択の指針となる。テスト実行では、リスクを基にした優先順位付けが、テスト実行の順序を決定する。","ref":"1.3.1, 1.3.4","misconception":"リスク軽減をテスト実行の段だけの話と考え、テスト計画での技法と領域の選択や、テスト分析でのテスト条件の選択も軽減の現れであることを結び付けられていない"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスク軽減","リスクアセスメント","テスト条件の選択"],"distractorIntent":["リスクアセスメントを軽減の分散先として数える","新たに出た懸念の扱いを次の計画づくりまで持ち越す","テスト以外のリスク軽減の手段を、テスト活動に分散した軽減の例として数える"],"distractorTypes":["D1","D7","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.1 の「リスク軽減は、いくつかのテスト活動に分散して行われる」以下の3つの現れ方。1問目が区画の境界を問うのに対し、こちらは軽減がどのテスト活動に現れるかという別の面を測る","mistakePatterns":["MP-05","MP-08"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flipNote 3本とも帰属が原文と一致（肢4のコンティンジェンシープラン／サードパーティへの移転は 1.3.4 に実在）","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"7ca0b26c23cb","explSig":"421338aa70d5","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答4が入れ替わり、選ぶ思考を書ける（1.3.4 の軽減手段リストを覚えていて、設問の「テスト活動」という限定を読み落とす人）。実質3択は解消","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12-r2.md","sig":"7ca0b26c23cb","explSig":"421338aa70d5","fieldSig":{}}]}},{"id":"q-1.3.2-A-1","lo":"TM-1.3.2","cluster":"1.3.2-A","clusterName":"品質リスクの識別技法","variantAxis":"場面に現れた定義属性から、どの識別技法かを特定する（技法名を問う）","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、開発・運用・営業・問い合わせ窓口の担当者を1つの部屋に集めた。進行役を立て、前回のリリースで起きた不具合も引き合いに出しながら、あらかじめ用意した観点の一覧に沿って、どこが壊れると業務が止まるかを順に挙げてもらった。","question":"ここで用いた品質リスクの識別技法として最も適切なものはどれか。1つ選べ。","choices":["過去の経験の参照","ブレーンストーミング","チェックリスト","リスクワークショップ"],"answer":[3],"explanation":{"signals":"効くのは場面に現れた属性の組み合わせである。立場の異なる複数の担当者が、1つの場に、同時に集まり、進行役が付き、あらかじめ用意した観点に沿って進んでいる。前回の不具合を引き合いに出した点と、観点の一覧を用意した点は、それぞれ別の技法にも現れる属性であり、そこだけを見ると答えが割れる。","why":"シラバスは品質リスクの識別に使える技法として、専門家インタビュー、独自のアセスメント、ふりかえり、リスクワークショップ、ブレーンストーミング、チェックリスト、過去の経験の参照を挙げている。この場面は、複数のステークホルダーが同じ場に同時に集まり、進行役のもとで、用意された観点に沿って協働して洗い出している。発想を広げる手法でも、一覧に沿った確認でも、過去の事例の参照でもなく、それらを内側に含む形で場として組まれている点が、リスクワークショップの姿である。","distractors":["前回のリリースで起きた不具合を引き合いに出している点が一致する。過去の事例を参照することは独立した技法として挙げられているが、この場面ではあくまで材料の1つであり、複数の関係者を集めた場を指す語ではない","自由に意見を出し合って挙げていく点は共通しており、実際にワークショップの中で使われることもある。しかしこの場面には進行役と用意された観点があり、進め方が構造化されている。発想を広げる手法そのものを指す語では、この場面の説明として足りない","あらかじめ用意した観点の一覧に沿っている点が一致するため、最も引かれやすい。ただし一覧はここでは進行の道具として使われているにすぎず、複数の部署の担当者を同時に集めて協働させるという、場そのものの性格を説明していない",null],"flip":[null,null,null,null],"flipNote":{"1":"この語が答えになるには、複数の関係者を集めた場が無いことと、あらかじめ用意した観点の一覧が無いことの両方が要る。場だけを外すと、用意された一覧を上から確認する姿が残り、チェックリストの側が答えになってしまう。条件が2つ必要なため、1つの条件では反転しない","2":"自由に発想を出し合って挙げていく手法は、シラバスが品質リスクの識別技法の1つとして挙げているものであり、行為の中身そのものは誤っていない。ただしこの場面でリスクワークショップを支えている属性は、立場の違う担当者を1つの部屋に集めたという場（第1文）と、進行役を立てて用意した観点に沿って進めたという進め方（第2文）に分かれて置かれている。第2文だけを、思いついたものを自由に出していくだけの場に差し替えても、第1文の場はそのまま残るため、その場を指す語と並び立って正答が2つになる。場も同時に外すには条件が2つ要るため、1つの条件では反転しない","3":"あらかじめ用意した観点の一覧に沿って確認する姿は、この場面に既に現れている。シラバスはチェックリストを識別技法の1つとして挙げており、行為の中身は誤っていないが、ここでの一覧は進行の道具として使われているにすぎない。この語が最も適切になるには、複数の担当者を1つの部屋に集めた場（第1文）を外すことと、進行役のもとで順に挙げてもらう進め方（第2文）を一人で一覧を確認する形に替えることの、2か所の書き換えが要る。第2文だけを替えれば第1文の場が残り、その場を指す語が答えのまま並び立って正答が2つになる。条件が2つ必要なため、1つの条件では反転しない"},"quote":"ステークホルダーは、以下の技法の1つ以上を通じて、品質リスクを識別することができる：専門家インタビュー／独自のアセスメント／ふりかえり／リスクワークショップ／ブレーンストーミング／チェックリスト／過去の経験の参照","ref":"1.3.2","misconception":"場面に出てきた目立つ道具（用意した観点の一覧、過去の不具合）を手がかりに技法名を決めてしまい、複数のステークホルダーを同時に集めて進行役のもとで協働させるという、場の性格そのものを見ていない"},"meta":{"concept":"品質リスクの識別","relatedConcepts":["リスクワークショップ","ブレーンストーミング","チェックリスト","過去の経験の参照"],"distractorIntent":["複数人で挙げる場をすべて発想法と呼ぶ","観点の一覧があることを技法の決め手にする","過去の不具合を材料にしたことを技法そのものと取り違える"],"distractorTypes":["D8","D8","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.2 の識別技法7つの列挙。公式サンプル SET B 問10（TM-1.3.2・K2、D8×3。定義属性を5つ並べ、惜しい誤答が4つを共有する）と SET A 問10（用意された表が識別を導く場をワークショップと裁定）の構造をなぞった。なお「技法の定義属性の取り違え」に対応する MP はまだ未登録であり、最も近い MP-08 を記録している","mistakePatterns":["MP-31"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"残る flip 2本ともダイヤルとして成立しない。flip[2] は2文の差し替え、flip[1] は肢4が並び立つ","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"66ee56907495","explSig":"52f3fd77293f","fieldSig":{"explanation.flip[2]":"01ba4719c80b","scenario":"1ea24c99262c","explanation.flipNote[1]":"c47374c32f18","explanation.flip[1]":"01ba4719c80b"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"場面の属性が誤答3つに1対1で配られており、公式 SET B 問10 と同型","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"66ee56907495","explSig":"52f3fd77293f","fieldSig":{}}]}},{"id":"q-1.3.2-A-2","lo":"TM-1.3.2","cluster":"1.3.2-A","clusterName":"品質リスクの識別技法","variantAxis":"識別の進め方として正しいものの中に、リスクベースドテストの焦点ではない扱いを1つ混ぜる（否定形）","variant":2,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、関係者から品質上の懸念を集める段取りを組んでいる。","question":"この段取りの進め方として**適切でないもの**はどれか。1つ選べ。","choices":["副産物として出た納品の遅れや環境の不備も、品質上の懸念と同じ一覧に載せてテストで減らす","日程が合わない人には、少なくとも代理を立てて意見を出してもらう機会を用意する","参加してもらう人の顔ぶれに欠けがないかを、プロジェクトマネージャーと突き合わせて合意しておく","懸念の重さは対象の中で場所ごとに違うという前提で、機能のまとまりごとに個別に洗い出す"],"answer":[0],"explanation":{"signals":"効くのは、問われているのが品質リスクの識別としての進め方である点だけである。4つとも実際の段取りで出てくる行為であり、単独で見ればどれも不自然ではない。分かれ目は、リスクベースドテストが何を焦点に置いているかにある。","why":"シラバスは、リスク識別がしばしば副産物を生み出すと述べ、そのうえでプロジェクトリスクは品質リスク識別の副産物としてしばしば識別されるが、リスクベースドテストの焦点ではないと明記している。納品の遅れやテスト環境の不備は、プロジェクトの進行が損なわれる事象であって、プロダクトに品質問題が存在する状況ではない。テストマネージャーがそれらを取り上げて関係者に示すこと自体は役割として述べられているが、品質上の懸念と同じ一覧に並べ、テストで減らす対象として扱うことは、焦点の置き方として誤っている。","distractors":[null,"シラバスは、関係するステークホルダー全員に参加の機会を与えることが重要であり、参加できない場合は少なくともタスクを委任する機会を与えるべきだと述べている。日程の都合で外れる人が出ることは避けられないため実務でも悩ましく見えるが、ここに書かれているのはシラバスが求めている手当てそのものである","シラバスは、参加するステークホルダーのリストが包括的でありプロジェクトマネージャーと合意していることを確認することが不可欠であるとし、重要なステークホルダーが欠けている識別は大きな問題となる可能性があると述べている。正しい進め方であり、否定形の設問では残す側にあたる","シラバスは、リスクはテスト対象内に一様に分布しないことを理解することが重要であるとし、さまざまなテストアイテムの個々のリスクを識別することはテスト計画において重要なタスクだと述べている。これも正しい進め方である"],"flip":[null,null,null,null],"flipNote":{"2":"この記述は、参加できないステークホルダーに少なくともタスクを委任する機会を与えるべきだというシラバスの求めそのものであり、原文が変わらない限り不適切にはならない。設問を肯定形にすれば選ぶ側に立つが、そのときは残る2つの誤答も同時に正しくなり、1つ選べの形が成り立たない","3":"参加するステークホルダーのリストが包括的でありプロジェクトマネージャーと合意していることの確認を、シラバスは不可欠だと述べている。設問を肯定形にすると、この記述も残る2つの誤答も同時に正しくなる。1つの条件でこの肢だけを正解にすることはできない","4":"リスクはテスト対象内に一様に分布しないという前提でテストアイテムごとに識別することを、シラバスはテスト計画において重要なタスクだと述べている。肯定形にすれば選ぶ側に立つが、そのとき正しくなる肢は3つになる"},"quote":"プロジェクトリスクは、品質リスク識別の副産物としてしばしば識別されるが、リスクベースドテストの焦点ではない。","ref":"1.3.2","misconception":"識別の場に挙がったものはすべてリスクベースドテストの対象になると考え、プロダクトの品質問題とプロジェクトの進行の問題を同じ一覧で扱ってしまう"},"meta":{"concept":"品質リスクの識別","relatedConcepts":["プロジェクトリスク","ステークホルダーの参加","リスクの分布"],"distractorIntent":["参加者の包括性の確認を、識別の進め方から外れたものと見る","代理を立てる機会の用意を、識別の進め方から外れたものと見る","リスクが一様に分布しない前提を、識別の進め方から外れたものと見る"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.2。公式の否定形7問はすべて K2/K3 であり、誤答はそのカテゴリーの真のメンバー（D12）で構成されている。ここでも誤答3つはいずれも 1.3.2 が明記する正しい進め方で、正答だけが隣接する区画（プロジェクトリスク）に属する","mistakePatterns":["MP-01"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"否定形。flipNote 3本とも「肯定形にすると3つ同時に正しくなる」と正しく数えている","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"ab7f0ae9731e","explSig":"f5f27974b5cc","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"正答の語彙が浮く点は中で報告","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"ab7f0ae9731e","explSig":"f5f27974b5cc","fieldSig":{}}]}},{"id":"q-1.3.3-A-1","lo":"TM-1.3.3","cluster":"1.3.3-A","clusterName":"リスクレベルを決める要因","variantAxis":"リスク可能性の要因とリスク影響の要因の帰属を分ける","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、挙がってきた懸念それぞれについて、どれくらい起こりやすいかを見積もろうとしている。","question":"その起こりやすさを左右する要因として最も適切なものはどれか。1つ選べ。","choices":["影響を受ける機能が日常の業務で使われる頻度の高さ","不具合が出ても業務を回せる回避策が用意されていないこと","上流の段階で品質を確かめる活動が行われていないこと","止まったときに損なわれるビジネス上の目標の重さ"],"answer":[2],"explanation":{"signals":"効くのは「起こりやすさの側か、起きたときの痛みの側か」という一点である。4つともシラバスが要因として挙げているものであり、要因として正しいかどうかでは絞れない。どちらのリストに載っているかだけが分かれ目になる。同じ「用意されていない」という形で書かれた2つが並んでいる点にも注意がいる。","why":"シラバスはリスクレベルの決定を、リスク可能性とリスク影響という2つのアセスメントに分け、それぞれに要因のリストを与えている。リスク可能性の側に並ぶのは、複雑度、組織の成熟度、個人の課題事項、チーム内の対立、地理的な分散、プレッシャー、変更率の高さなど、作る過程と体制に関わるものであり、早期の品質保証活動の欠如もここに入る。上流で品質を確かめていなければ、欠陥が作り込まれたまま先へ進む度合いが上がるからである。リスク影響の側に並ぶのは、使用頻度、ビジネスゴールの重要性、事業収入の損失、法的制裁、適切な回避策の欠如など、故障が起きたあとにビジネスが受ける損害である。見積ろうとしているのが起こりやすさである以上、選ぶべきは前者のリストの要因になる。","distractors":["影響を受ける機能の使用頻度は、シラバスがリスク影響を左右する要因の先頭に挙げているものである。よく使われる機能ほど不具合に当たる場面が増えるという読み方ができるため可能性の側と感じられやすいが、シラバスの帰属は影響の側にある","適切な回避策の欠如は、シラバスがリスク影響を左右する要因として挙げているものである。正答と同じ「用意されていない」という形で書かれているため最も紛らわしいが、回避策の有無は欠陥が作り込まれる度合いを変えるものではなく、出たあとに業務を続けられるかどうかを決める",null,"影響を受けるビジネスゴールの重要性も、リスク影響を左右する要因である。重要な目標に関わる箇所ほど慎重に作られるはずだという読み方から可能性の側に寄せられることがあるが、シラバスはこれを、故障したときに何を失うかを表す要因として置いている"],"flip":[null,null,null,null],"flipNote":{"1":"影響を受ける機能の使用頻度は、シラバスがリスク影響を左右する要因の先頭に挙げているものである。設問を影響の側に変えればこの記述は正しくなるが、残る2つの誤答も同じ影響側のリストの項目なので同時に正しくなり、1つ選べの形が壊れる。影響側のリストの中でこの項目だけを選ばせる条件は原文に無い","2":"適切な回避策の欠如も、シラバスがリスク影響を左右する要因として挙げているものである。設問を影響の側に変えると、この記述だけでなく残る2つの誤答も同時に正解になる。なお回避策を用意することは 1.3.4 のコンティンジェンシープランにあたり、可能性ではなく影響の側を下げる手立てである","4":"影響を受けるビジネスゴールの重要性も、シラバスの影響側のリストの項目である。設問を影響の側に変えれば正しくなるが、そのとき正解になる肢は3つになり、一意にならない"},"quote":"品質リスクにおけるリスク可能性を左右する要因には、以下のようなものがある：技術、ツール、またはシステムアーキテクチャの複雑度／組織の成熟度／使用しているSDLCに関する知識を含む、スキル、可用性、モチベーション、または作業に関する自主性といった個人の課題事項／チーム内の対立／サプライヤーとの契約上の問題／地理的に分散したチーム／経営陣や技術陣のリーダーシップが弱い／時間、リソース、予算、マネジメントからのプレッシャー／早期の品質保証活動の欠如／テストベース、プロダクト、人員の変更率が高い。リスク影響を左右する要因には以下を含む：影響を受ける機能の使用頻度／影響を受ける機能の重要性／影響を受けるビジネスゴールの重要性／評判へのダメージ／事業収入の損失／財政的、環境的、または社会的な損失、もしくは賠償責任の可能性／民事または刑事上の法的制裁／インターフェースや統合の課題事項／適切な回避策の欠如／安全性のニーズ","ref":"1.3.3","misconception":"「〜が用意されていない／行われていない」という形の要因をひとまとめに扱い、早期の品質保証活動の欠如が起こりやすさの側、適切な回避策の欠如が痛みの側にあるという帰属の違いを区別できていない"},"meta":{"concept":"品質リスクアセスメント","relatedConcepts":["リスク可能性","リスク影響","リスクレベル"],"distractorIntent":["適切な回避策の欠如を起こりやすさの側に置く","使用頻度の高さを起こりやすさと読み替える","ビジネスゴールの重要性を起こりやすさの側に置く"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.3 の2つの閉じたリスト（可能性の要因10／影響の要因10）。K2 誤答の最多型である D1（帰属先の取り違え）を隣のリストの正しいメンバーで構成し、正答と最も紛らわしい誤答を同じ「欠如」の形に揃えて、語形から正解を当てられないようにした","mistakePatterns":["MP-03"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"4肢の可能性側／影響側の帰属は原文どおり。flipNote 3本の数え方も正しい","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"94a9bf612288","explSig":"be756c97dc26","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"D1×3 で本線。罠の向きと語彙経路は中で報告","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"94a9bf612288","explSig":"be756c97dc26","fieldSig":{"選択肢3":"bf5cf3c38074","選択肢2":"b6f8e7c061e9"}}]}},{"id":"q-1.3.3-A-2","lo":"TM-1.3.3","cluster":"1.3.3-A","clusterName":"リスクレベルを決める要因","variantAxis":"順序尺度でしか把握できない場面での、リスクレベルの総合の仕方（振る舞い）","variant":2,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたのプロジェクトには使える統計データが乏しく、関係者は起こりやすさも痛みの度合いも「非常に高い／高い／中程度／低い／非常に低い」の段階でしか言えない。","question":"この状況でリスクレベルを総合する進め方として最も適切なものはどれか。1つ選べ。","choices":["5段階を5から1の数値に置き換えて積を求め、その合計が基準を下回る項目を受容する","2つの段階をマトリクスで組み合わせ、総合した結果を相対的な順位として扱う","起こりやすさの段階が高い順に並べ、痛みの度合いは同じ段階に並んだ項目の順序を決めるときに使う","総合して出た段階を、案件をまたいで意味の変わらない水準として読み、他の案件で同じ段階が付いた項目と同じ重さで扱う"],"answer":[1],"explanation":{"signals":"効くのは、関係者が段階でしか言えないという一点である。統計として使えるデータが乏しいことが明示されており、パーセンテージや金額は与えられていない。手元にあるのが順序の情報だけであることが、総合の仕方を決める。","why":"シラバスは、リスク分析が広範かつ統計的に有効なリスクデータに基づいている場合は定量的アセスメントが適切であり、リスクレベルは2つの要因の積として計算できると述べる。しかし通常は順序尺度でのみ定性的にしか把握できないとし、その場合はリスク可能性とリスク影響の値をリスクマトリクスで組み合わせて総合したリスクレベルを作り、それを順序尺度による定性的な相対評価として解釈すべきだとしている。この場面は後者にあたるため、総合した結果は項目どうしの相対的な位置づけとして扱う。","distractors":["段階を数値に置き換えて積を取り、合計に基準を引く進め方である。数字になると議論が収束しやすく実務でも見かける形だが、順序尺度には段階どうしの間隔の情報がない。シラバスは総合したリスクレベルを順序尺度による定性的な相対評価として解釈すべきだと述べており、基準値による受容の判定は、存在しない精度を作り出している",null,"起こりやすさを主な軸に置き、痛みの度合いを同じ段階に並んだ項目の並べ替えにだけ使う進め方である。両方の情報を使っている形になっているため見分けにくいが、この置き方では、起こりにくいが起きれば致命的な項目が上位に来ることはない。シラバスはリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、片方を従属させた並びは組み合わせたことにならない","2つの段階を組み合わせて総合するところまでは、この場面の進め方に合っている。案件をまたいで同じ言葉で危険度を語りたいという要求は組織の中に実際にあるが、シラバスは、総合したリスクレベルは順序尺度による定性的な相対評価として解釈すべきだと述べている。段階の意味は、その分析に参加したステークホルダーの主観的認識と、そのプロジェクトの項目の並びに依存しており、別の案件の同じ段階と同じ重さを持つ保証はない"],"flip":["この案件の5段階が、広範かつ統計的に有効なリスクデータに裏付けられた区間として定義されている場面であれば、段階を数値に置き換えて積を求め、基準で受容を判定する進め方が正しくなる。シラバスは、統計的に有効なリスクデータに基づいている場合は定量的アセスメントが適切であり、リスクレベルは2つの要因の積として計算できると述べている",null,null,null],"flipNote":{"3":"シラバスはリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、片方を主な軸に置き他方を同順位の並べ替えにだけ使う形を支える記述は無い。痛みの度合いがどの項目でも同程度である場面を仮定しても、マトリクスで組み合わせる肢が同じ順序を返して正しいままであり、この肢が単独の正解にはならない","4":"総合したリスクレベルを案件をまたいで同じ重さで読むには、この案件の段階が統計的に有効なデータで裏付けられていることに加えて、比較する相手の案件でも同じ裏付けと同じ定義が使われている必要がある。条件が2つ要り、しかも前者だけを満たすと、段階を数値に置き換えて積を求める肢のほうが同時に正しくなってしまう"},"quote":"リスク可能性とリスク影響の値は、リスクマトリクスで組み合わし、総合したリスクレベルが作成される。この総合したリスクレベルは、順序尺度による定性的な相対評価として解釈すべきである。","ref":"1.3.3","misconception":"順序尺度のラベルを数値に置き換えれば計算してよいと考え、段階どうしの間隔が定義されていないため、積や合計や閾値には意味が生まれないことに気づいていない"},"meta":{"concept":"品質リスクアセスメント","relatedConcepts":["定量的アセスメント","定性的アセスメント","リスクマトリクス"],"distractorIntent":["順序尺度を数値に置き換えて計算してよいと考える","起こりやすさを主な軸に置き、痛みの度合いを従属的な指標に落とす","総合したリスクレベルを、案件をまたいで通用する絶対的な水準として解釈する"],"distractorTypes":["D6","D4","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.3 の定量／定性の条件分岐。1問目が要因リストの帰属を問うのに対し、こちらは尺度の性質から総合の仕方を選ばせる面を測る","mistakePatterns":["MP-06","MP-03"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flip[0] はシナリオ1文の差し替えで成立するダイヤル型。flipNote 2本も妥当","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"d0b09364fc93","explSig":"788d3ba72802","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答3・4とも自己開示が消え、どちらも選ぶ思考を書ける。ただし4が正答の裏返しになった（■中2）","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12-r2.md","sig":"d0b09364fc93","explSig":"788d3ba72802","fieldSig":{"選択肢2":"9d9c8ced1204","選択肢4":"b9f9895f1bc9"}}]}},{"id":"q-1.3.5-A-1","lo":"TM-1.3.5","cluster":"1.3.5-A","clusterName":"重量的な技法と軽量的な技法","variantAxis":"セーフティクリティカルな文脈で採る進め方を、技法名を伏せて振る舞いから選ぶ","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは鉄道の信号制御ソフトウェアのテストマネージャーである。この装置は故障すると人命に関わり、安全関連規格に基づく認証を受ける必要がある。","question":"この案件で採るリスク分析の進め方として最も適切なものはどれか。1つ選べ。","choices":["テストチームと一部の関係者で、起こりやすさと痛みの度合いを順序尺度で整理し、計画の土台にする","認証の審査に出せる形で手順と記録の様式を定め、幅広い関係者を集めて、起こりやすさと痛みの度合いを合議で段階に落とす","手順と様式は定めるが、参加は開発とテストの担当者にとどめ、要因は各自の経験で見積もる","手順と様式を定めて文書に残し、幅広い関係者を集め、詳細な要因から定めた数式で算出する"],"answer":[3],"explanation":{"signals":"効くのは、人命に関わり安全関連規格に基づく認証を受けるという2つの記述だけである。鉄道という業種そのものは判断を変えない。この対象がセーフティクリティカルであることが、どちらの種類の技法を採るかを決める。","why":"シラバスは、リスクベースドテストの技法を重量的と軽量的の2種類に分け、セーフティクリティカルなシステムでは重量的な技法を使うことが多く、セーフティクリティカルではないアプリケーションでは通常は軽量的な技法を採用すると述べている。重量的な技法の姿として挙げられているのは、形式的であること、定義された手順と詳細な文書を用いること、幅広いステークホルダーグループが関与すること、詳細な要因を用い、それらから可能性と影響を計算する数式を用いることである。この4つをすべて備えているものが、この対象に対する進め方になる。","distractors":["テストチームと限られた関係者で、順序尺度により整理する進め方は、シラバスが軽量的な技法として述べている姿そのものである。労力が少なくて済むのは事実だが、この対象はセーフティクリティカルであり、重量的な技法を使うことが多いと述べられている側にある","手順と記録の様式を定める点と、幅広い関係者を集める点は重量的な技法の姿と一致しており、認証を受ける案件の進め方として実際に通る。しかし、起こりやすさと痛みの度合いを合議で段階に落とすのは、リスク要因を順序尺度に基づいて整理する軽量的な技法の側の姿である。重量的な技法におけるリスクアセスメントは、リスク可能性とリスク影響に関する詳細な要因を用い、それらの要因から可能性と影響を計算する数式を用いる","手順と様式を定める点は重量的な技法と一致しており、最も紛らわしい。しかし参加を開発とテストの担当者に絞っている点と、要因を各自の経験で見積もっている点の2つが外れている。重量的な技法は幅広いステークホルダーグループの関与と、詳細な要因からの数式による算出を伴う",null],"flip":["対象がセーフティクリティカルではなく、短いイテレーションで進む業務アプリケーションであれば、この進め方が正しくなる。誤っているのは進め方そのものではなく、この対象に当てているという点である",null,null,null],"flipNote":{"2":"この肢は、重量的な技法の形式性（定義された手順と詳細な文書、幅広いステークホルダーグループの関与）と、軽量的な技法のアセスメント（順序尺度による整理）を混ぜている。対象からセーフティクリティカルという条件を外すと、労力の少ない軽量的な肢が同時に正しくなり、外さなければ、詳細な要因とそこから可能性と影響を計算する数式が欠けたままである。1つの条件でこの肢だけが正解になる置き方が無い","3":"この肢は、幅広いステークホルダーグループの関与と、詳細な要因からの数式による算出という2つを欠いている。欠けが2つあるため条件を1つ動かしても重量的な技法の姿にはならず、逆に重量的な技法が求められない対象に変えると、順序尺度で整理する軽量的な肢が同時に正しくなる"},"quote":"技法には、基本的に重量的と軽量的の2種類がある。セーフティクリティカルなシステムでは、重量的な技法を使うことが多い。セーフティクリティカルではないアプリケーションでは、通常、軽量的な技法を採用する。重量的な技法は形式的であり、定義された手順と詳細な文書を用いる。これらの手法には、幅広いステークホルダーグループが関与する。重量的な技法におけるリスクアセスメントは、リスク可能性とリスク影響に関する詳細な要因を用いる。そして、それらの要因からリスク可能性とリスク影響を計算する数式を用いる。","ref":"1.3.5","misconception":"重量的な技法を「手順を決めて文書を残すこと」とだけ覚えており、幅広いステークホルダーの関与と、詳細な要因からの数式による算出まで含むことを見落としている"},"meta":{"concept":"リスクベースドテストの技法","relatedConcepts":["重量的な技法","軽量的な技法","規制要件"],"distractorIntent":["セーフティクリティカルな対象に軽量的な進め方を当てる","手順と文書さえ整えれば重量的だと考える","手順・文書・幅広い関与まで揃えれば重量的だと考え、詳細な要因からの数式による算出を順序尺度の合議に置き換える"],"distractorTypes":["D1","D3","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.5 の重量的／軽量的の対比と、セーフティクリティカルか否かによる選択条件。公式サンプル SET B 問13 は誤答3つがすべて絶対化表現で、選択肢の文法だけで解けてしまう作りだったため、そこは模倣せず、隣の区画の正しい振る舞い・1要素欠落・定義属性の入れ替えで構成した。なお「重量的と軽量的を状況と逆に選ぶ」に対応する MP はまだ未登録であり、最も近い MP-06 を記録している","mistakePatterns":["MP-32"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flip[0] は「対象の性質で採る技法が決まる」型のダイヤルで成立。flipNote 2本も妥当","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"46c2c781b3ba","explSig":"eeade2c6fd73","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答2が重量的の属性を3つ備えた惜しい案になり、実質3択は解消。厳格さの階段は残った（■中1）","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12-r2.md","sig":"46c2c781b3ba","explSig":"eeade2c6fd73","fieldSig":{"選択肢3":"ff751fb59dd6","選択肢2":"fa9aea2864cc","選択肢4":"3c8f8efb755b"}}]}},{"id":"q-1.3.5-A-2","lo":"TM-1.3.5","cluster":"1.3.5-A","clusterName":"重量的な技法と軽量的な技法","variantAxis":"具体的な技法名が重量的と軽量的のどちらに属するかを分ける（否定形・技法名を問う）","variant":2,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、リスクベースドテストの技法を重量的なものと軽量的なものに整理している。","question":"軽量的な技法の例として**適切でないもの**はどれか。1つ選べ。","choices":["体系的ソフトウェアテスト(SST)","故障モード影響解析(FMEA)","プラグマティックリスク分析マネジメント(PRAM)","プロダクトリスクマネジメント(PRISMA)"],"answer":[1],"explanation":{"signals":"効くのは「軽量的な技法の例か」という区分だけである。4つともシラバスが 1.3.5 で名前を挙げている実在の技法であり、聞き覚えがあるかどうかでは絞れない。分かれ目は、重量的と軽量的のどちらの側の例として挙げられているかにある。","why":"シラバスは 1.3.5 で、重量的な技法の例としてハザード分析、エクスポージャーコスト、故障モード影響解析とその派生、フォールトツリー解析の4つを挙げ、軽量的な技法として体系的ソフトウェアテスト、プラグマティックリスク分析マネジメント、プロダクトリスクマネジメントを挙げている。故障モード影響解析は、品質リスクとその潜在的な原因および影響する度合いを識別し、重要度・優先度・検出率を割り当てるもので、詳細な要因と数式を用いる重量的な技法の側にある。したがって軽量的な技法の例としては適切でない。","distractors":["体系的ソフトウェアテストは軽量的な技法として挙げられている。シラバスはこれを、要件仕様が提供されている場合にだけ使う技法として他と区別しているため、条件が付く点で別物に見えるが、区分としては軽量的の側である",null,"プラグマティックリスク分析マネジメントも軽量的な技法として挙げられている。名前にリスク分析という語が入っているため重量的に見えることがあるが、シラバスは、リスク分析の入力として要件やその他の仕様を使うか、ステークホルダーからの入力に基づいて機能することもできる技法として位置づけている","プロダクトリスクマネジメントも軽量的な技法である。マネジメントという語から形式的な枠組みを連想しやすいが、こちらもステークホルダーからの入力に基づいて機能できる側に挙げられている"],"flip":[null,null,null,null],"flipNote":{"1":"体系的ソフトウェアテストは、シラバスがプラグマティックリスク分析マネジメント・プロダクトリスクマネジメントと並べて軽量的な技法として挙げているものであり、区分そのものが正しい以上、この技法が軽量的でなくなる条件はシナリオにも選択肢にも無い。シラバスは軽量的な技法のうちこの技法にだけ、要件仕様が提供されている場合にだけ使うという限定を付けており、その限定を問う形にすればこの技法だけが外れるが、それは条件の変更ではなく設問の変更である","3":"プラグマティックリスク分析マネジメントとプロダクトリスクマネジメントは、シラバスの同じ1文の中で、リスク分析の入力として要件やその他の仕様を使うか、もしくはステークホルダーからの入力に基づいて完全に機能することもできる技法として、同じ性質のまま並記されている。2つを分ける条件が原文に無いため、一方だけを正解にする条件は書けない。設問を肯定形にすれば選ぶ側に立つが、そのとき正しくなる肢は3つになる","4":"プロダクトリスクマネジメントは、プラグマティックリスク分析マネジメントと同じ1文で同じ性質のものとして挙げられており、2つを分ける条件が原文に無い。設問を肯定形に変えても、セーフティクリティカルな対象で採る技法を問う形に変えても、軽量的な3つが同時に同じ側へ回るため、この肢だけが選ばれる形にはならない"},"quote":"重量的な技法の例としては、以下のようなものがある：ハザード分析／エクスポージャーコスト／故障モード影響解析(FMEA)とその派生／フォールトツリー解析","ref":"1.3.5","misconception":"1.3.5 に出てくる技法名をひとまとめに「リスクベースドテストの技法」として覚えており、それぞれが重量的と軽量的のどちらの例として挙げられているかを区別していない"},"meta":{"concept":"リスクベースドテストの技法","relatedConcepts":["重量的な技法","軽量的な技法","SST","PRAM","PRISMA"],"distractorIntent":["要件仕様が要る技法は重量的だと考える","名前にリスク分析が入っていると重量的だと考える","マネジメントという語から形式的な枠組みを連想する"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.5 の重量的4技法と軽量的3技法の列挙。公式サンプル SET A は TM-1.3.5 を具体的な技法名から選ばせる形で出題している（SET B は一般的な区別）ので、1問目の振る舞い型に対してこちらを技法名型に振り分けた","mistakePatterns":["MP-32"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"FMEA＝重量的、SST / PRAM / PRISMA＝軽量的の帰属を原文で確認。flipNote 3本とも真","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"83e645932a95","explSig":"527ee5c9549a","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"技法名の帰属。K1 寄りである点は中で報告","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"83e645932a95","explSig":"527ee5c9549a","fieldSig":{}}]}},{"id":"q-1.3.6-A-1","lo":"TM-1.3.6","cluster":"1.3.6-A","clusterName":"リスクベースドテストの成功メトリクスと困難さ","variantAxis":"ふりかえりで答える質問の中に、テスト進捗の量を測る問いを1つ混ぜる（否定形）","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、ふりかえりの場で、リスクベースドテストの利点をどれだけ実現できたかを測ろうとしている。","question":"そこで答える質問として**適切でないもの**はどれか。1つ選べ。","choices":["懸念ごとに割り当てたテストを、計画した件数どおり実行できたか","関係する人たちが洗い出しに加わったか、その意見が結果に反映されたか","優先度の高い欠陥のほとんどを、テスト実行の早い段階で見つけられたか","実行を見送ったテストは、実行したものより関連する懸念が軽かったか"],"answer":[0],"explanation":{"signals":"効くのは、測ろうとしているのが「リスクベースドテストの利点をどれだけ実現できたか」である点である。テストが計画どおり進んだかではない。4つとも実際のふりかえりで口にされる問いなので、自然さでは絞れない。","why":"シラバスは、ふりかえりでテストチームがリスクベースドテストの利点をどの程度実現できたかを測定すべきだとし、答えるべき質問を6つ列挙している。ステークホルダーが分析に関与したか、関与は適切だったか、深刻な欠陥の見逃しによる本番のインシデントは解決されたか、優先度の高い欠陥のほとんどをテスト実行の早い段階で発見したか、テスト結果をステークホルダーにリスクの観点から説明できたか、スキップしたテストは実行したテストよりも関連するリスクレベルが低かったか、である。計画した件数どおりに実行できたかは、ここに含まれない。件数の達成はテストの進捗を表すが、リスクに照らした配分と説明が適切だったかには答えない。","distractors":[null,"ステークホルダーがリスク分析に関与したか、意見が反映されたかは、シラバスが挙げる質問そのものである。否定形の設問なので、正しい質問であることが選ばない理由になる","優先度の高い欠陥のほとんどをテスト実行の早い段階で発見したかも、挙げられている質問である。高いリスクの早期軽減が効いたかを見る問いであり、リスクベースドテストの利点に直結する","スキップしたテストは実行したテストよりも関連するリスクレベルが低かったか、も挙げられている質問である。落とした側の正当性を事後に確かめる問いであり、労力をリスクレベルに比例させられたかを測る"],"flip":[null,null,null,null],"flipNote":{"2":"ステークホルダーがリスク分析に関与したか、意見が反映されたかは、シラバスがふりかえりで答えるべきものとして挙げている6つの質問の1つである。設問を肯定形にすればこの質問を選ぶことになるが、そのときは残る2つの誤答も同じ6つの中にあるため同時に正しくなり、1つ選べの形が成り立たない","3":"優先度の高い欠陥のほとんどをテスト実行の早い段階で発見したかも、シラバスの6つの質問の1つである。肯定形に変えると、この質問も残る2つの誤答も同時に正しくなる。6つのリストの中でこの質問だけを選ばせる条件は原文に無い","4":"スキップしたテストは実行したテストよりも関連するリスクレベルが低かったかも、シラバスの6つの質問の1つである。時間切れでテストを打ち切った案件ではこの問いが重く働くが、重く働くことと一意の正解になることは別であり、肯定形に変えれば正しくなる肢は3つになる"},"quote":"ふりかえりでは、テストチームは、リスクベースドテストの利点をどの程度実現できたかを測定すべきである。多くの場合、これには、メトリクスの利用やコンサルティングを通じて、以下の質問の一部またはすべてに答えることを含む：関連するステークホルダーはリスク分析に関与したか、または意見を反映したか？／リスク分析へのステークホルダーの関与は適切だったか？／深刻な欠陥の見逃しで深刻なインシデントが本番で発生した場合、それらは解決されたか？／優先度の高い欠陥のほとんどは、テスト実行の早い段階で発見されたか？／テストチームはテスト結果をステークホルダーにリスクの観点から説明できたか？／スキップしたテストは、実行したテストよりも関連するリスクレベルが低かったか？","ref":"1.3.6","misconception":"リスクベースドテストの成功を、テストがどれだけ実行できたかという進捗の量で測れると考え、リスクに照らした配分と説明ができたかを問う質問群であることを捉えていない"},"meta":{"concept":"リスクベースドテストの成功メトリクス","relatedConcepts":["ふりかえり","テスト進捗メトリクス","残存リスクの報告"],"distractorIntent":["ステークホルダーの関与を問う質問を、成功の測定から外れたものと見る","早期発見を問う質問を、成功の測定から外れたものと見る","スキップの正当性を問う質問を、成功の測定から外れたものと見る"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.6 のふりかえりの質問6つ（閉じたリスト）。誤答はすべてそのリストの真のメンバー（D12）とし、正答だけが隣接する区画（2.1 のテスト進捗メトリクス）から取った。実行量で応えようとする誤解は公式 SET B 問7 の裁定でも否定されている","mistakePatterns":["MP-07"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"肢2・3・4が6つの質問に実在し、肢1が無いことを原文で確認。flipNote 3本とも妥当","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"36e98171477a","explSig":"c40ad0fbf594","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"正答だけがリスク語を持たない点は中で報告","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"36e98171477a","explSig":"c40ad0fbf594","fieldSig":{"選択肢1":"81347b25287b","explanation.signals":"62af5f70e163"}}]}},{"id":"q-1.3.6-A-2","lo":"TM-1.3.6","cluster":"1.3.6-A","clusterName":"リスクベースドテストの成功メトリクスと困難さ","variantAxis":"症状からどの困難さかを見分け、それと対になる解決策を選ぶ（振る舞い）","variant":2,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"プロジェクトのたびに似たような懸念ばかりが並ぶため、関係者が一覧を流し読みするようになり、油断が生じているとあなたは感じている。","question":"この困難さへの対処として最も適切なものはどれか。1つ選べ。","choices":["過去のデータを持ち出し、主要な関係者に見積もりを出してもらう","洗い出しに適した人を参加させ、重要なものに絞って軽減する","定期的に様子を見て、関係者へ報告することを続ける","顔ぶれが変わることを前提に、分析を繰り返し続ける"],"answer":[1],"explanation":{"signals":"効くのは、症状が「毎回同じような懸念ばかりが並び、油断が生じている」であることだけである。見積りが難しいわけでも、報告が滞っているわけでも、関係者が入れ替わったわけでもない。4つとも、シラバスが別々の困難さに対して挙げている解決策であり、対処として正しいかどうかでは絞れない。","why":"シラバスは 1.3.6 で、リスクマネジメントが遭遇する困難を5つ挙げ、それぞれに解決策を対にしている。ここに書かれた症状は「デジャブ」にあたり、プロジェクトごとに同じようなリスクが提起されるため、リスクに対する油断が生じているという記述と一致する。これに対する解決策としてシラバスが挙げているのは、リスク識別に適切な人材を参加させ、重要なリスクのみを軽減することである。参加者を入れ替えて新しい目を入れ、対象を重要なものに絞ることが、流し読みされる一覧に実質を取り戻させる。","distractors":["過去のデータを使い、主要なプロジェクトステークホルダーにアセスメントを求めることは、シラバスが「リスクレベルのアセスメントが困難」に対して挙げている解決策である。影響と可能性の見積りが難しい場面では正しいが、ここで起きているのは見積りの難しさではなく、同じ一覧が繰り返されることによる油断である",null,"リスクの定期的なモニタリングとステークホルダーへの報告は、シラバスが「適切な開始」に対して挙げている解決策である。短期的な成功への高いプレッシャーの中でアプローチの維持が軽視される場面に効くものであり、この症状への手当てではない","リスク分析が継続的でイテレーティブな活動になることは、シラバスが「ステークホルダーの変化」に対して述べていることである。関係者が入れ替わって新たなリスクが発生する場面では正しいが、ここでは同じ顔ぶれから同じ懸念が繰り返し出ていることが問題になっている"],"flip":["関係者が起こりやすさや痛みの度合いを言い当てられず、段位付けが進まない場面であれば、この対処が正解になる。誤っているのは対処の中身ではなく、当てている困難さの方である",null,"短期の成果に追われてリスクの扱いが後回しになり、アプローチが立ち上がらない場面であれば、この対処が正解になる","担当者の異動が続いて前提が変わっているのに、一覧が初期のままである場面であれば、この対処が正解になる"],"quote":"デジャブ：プロジェクトごとに同じようなリスクが提起されるため、リスクに対する油断が生じている。解決策：リスク識別に適切な人材を参加させ、重要なリスクのみを軽減する。","ref":"1.3.6","misconception":"1.3.6 の困難さと解決策を、ばらばらの一般的な助言として覚えており、どの症状にどの解決策が対応づけられているかを結び付けていない"},"meta":{"concept":"リスクベースドテストの困難さ","relatedConcepts":["デジャブ","適切な開始","ステークホルダーの変化"],"distractorIntent":["リスクレベルのアセスメントが困難な場合の解決策を当てる","適切な開始が妨げられている場合の解決策を当てる","ステークホルダーの変化に対する解決策を当てる"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.6 の困難さ5つと、それぞれに対になった解決策。誤答は隣の困難さに対する正しい解決策（D1）で構成した。1問目が成功メトリクスの面を測るのに対し、こちらは困難さの面を測る","mistakePatterns":["MP-08"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"症状↔解決策の1対1ダイヤル。残る flip 3本とも当てはめて一意になることを確認","ref":"jstqb-al-tm/kb/reviews/K2-1.3-syllabus-2026-09-13-t3.md","sig":"17d6c4b410da","explSig":"b1852c56aea2","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"症状→困難さ→解決策の2段。誤答3つとも別の困難さの正規の解決策で、機能している","ref":"jstqb-al-tm/kb/reviews/K2-1.3-item-2026-09-12.md","sig":"17d6c4b410da","explSig":"b1852c56aea2","fieldSig":{}}]}},{"id":"q-1.4.1-A-1","lo":"TM-1.4.1","cluster":"1.4.1-A","clusterName":"テストアプローチの典型的な選択肢","variantAxis":"テストアプローチに属する決定事項と、テスト戦略側に属する決定事項の境界（否定形）","variant":1,"chapter":1,"section":"1.4","k":2,"points":1,"type":"single","minutes":1,"scenario":"新しい基幹システムの開発が始まり、テストマネージャーがプロジェクトテスト戦略の草案を書いている。","question":"テストアプローチを選ぶときの重要な決定事項に**含まれないもの**はどれか。1つ選べ。","choices":["静的テストと動的テストをそれぞれどこまで用いるかを決めること","テスト目的の達成度を何の数値で測るかを決め、測る周期を定めること","どのテストレベルを実施し、それぞれで何を確かめるかを決めること","機能面と非機能面のどちらに重みを置くかなど、テストタイプの組み合わせを決めること"],"answer":[1],"explanation":{"signals":"効くのは「テストアプローチを選ぶときの決定事項か」という一点だけである。基幹システムであることや、草案を書いている段階であることは、どの区画の話かを指しているだけで、どれが答えかを変えない。選択肢はいずれもテスト計画の場で実際に決める事柄であり、実務上の正しさでは区別がつかない。","why":"シラバスは、テストアプローチを「テストタスクの実装方法であり、特に静的テストと動的テストのためのテストレベル、テストタイプ、テスト技法、およびテスト実践の選択と組み合わせ」と定義している。1.4.1 も重要な決定事項として、静的テスト・動的テスト・その他のテスト実践・テストレベル・テストタイプ・テスト技法の選択を挙げる。つまりアプローチに属するのは「どう実施するか」の組み合わせであり、何をもって達成とみなし、それを何で測るかはテスト戦略の側の要素である。メトリクスはテスト計画でプロジェクトテスト戦略から定義されるものであって、アプローチの構成要素ではない。","distractors":["静的テストと動的テストの使い分けは、1.4.1 が重要な決定事項の先頭に挙げているものであり、アプローチの構成要素そのものである。技法の選択と同じ層の決定なので、区画の境界を覚えていないと、他の3つと区別できずに残してしまう",null,"テストレベルの選択は 0.11 の定義にも 1.4.1 の列挙にも明記されており、アプローチに属する。どのレベルを置くかは工程設計の話に見えるため、戦略側の決定と感じて選ばれやすいが、シラバスの区画ではアプローチの中核にあたる","テストタイプの選択も 0.11 と 1.4.1 の双方が挙げる構成要素である。機能面と非機能面の重み付けは品質目標の議論に近く見えるので、測る話と混同されやすいが、決めているのは実施の組み合わせであってアプローチの内側にある"],"flip":[null,null,null,null],"flipNote":{"1":"静的テストと動的テストの使い分けは、1.4.1 が重要な決定事項の先頭に挙げているアプローチの構成要素である。設問をプロジェクトテスト戦略やテスト計画書という外側の枠に広げると、この記述だけでなく残る2つの誤答も、さらに正解であるメトリクスの記述までが同時に含まれてしまう。この肢だけを選ばせる条件が無い","3":"テストレベルの選択も、テストアプローチの定義と 1.4.1 の列挙の双方に明記された構成要素である。外側の枠を問う設問に広げると残る2つの誤答も同時に含まれ、アプローチという狭い区画を問う限りこの記述は外れない","4":"テストタイプの選択も同じ列挙の中にある。1.4.1 はテストレベル・テストタイプ・テスト技法を選択し組み合わせることがテストの効率性と有効性に大きく影響すると述べており、効率性と有効性を問う設問に変えても、この記述と残る2つの誤答が同時に立つ"},"quote":"重要な決定事項には、静的テスト、動的テスト、その他のテスト実践（例えば、手動テスト、バックツーバックテスト）、テストレベル、テストタイプ、テスト技法の選択を含む。","ref":"1.4.1 / 0.11","misconception":"テストアプローチを「テスト計画で決めること全般」と広く取り、メトリクスや終了基準のような測る側の取り決めまでアプローチの構成要素だと考えている"},"meta":{"concept":"テストアプローチの選択","relatedConcepts":["プロジェクトテスト戦略","テストメトリクス","テストレベル","テストタイプ"],"distractorIntent":["静的テストと動的テストの使い分けを戦略側の決定だと思う","テストレベルの選択を工程設計であってアプローチ外だと思う","テストタイプの重み付けを品質目標の議論とみなす"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス 1.4.1 の決定事項の列挙と 0.11 のテストアプローチの定義。公式サンプル SET A 問14・SET B 問14（いずれも TM-1.4.1・K2）がアプローチと戦略の境界を同じ形で問うており、誤答はリストの真のメンバー（D12）で構成した","mistakePatterns":["MP-09"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"否定形。肢1・3・4 が 1.4.1 の重要な決定事項の列挙に実在し、メトリクスが無いことを原文で確認。flipNote 3本とも真","ref":"jstqb-al-tm/kb/reviews/TM-1.4.1-syllabus-2026-09-13-t3.md","sig":"bbbb8ad50e52","explSig":"d1468d7e369d","fieldSig":{"explanation.quote":"2123daff40c1","explanation.why":"45174908721c"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つは 1.4.1 の真メンバーで否定根拠は原文にある。誤答型の偏りは中","ref":"jstqb-al-tm/kb/reviews/K2-1.4-item-2026-09-12.md","sig":"bbbb8ad50e52","explSig":"d1468d7e369d","fieldSig":{"meta.distractorTypes":"cafe7c875a3a","選択肢2":"825e1547cf02"}}]}},{"id":"q-1.4.1-A-2","lo":"TM-1.4.1","cluster":"1.4.1-A","clusterName":"テストアプローチの典型的な選択肢","variantAxis":"組織的テスト戦略・プロジェクトテスト戦略・テストアプローチの3層で、誰がどこを決めるか","variant":2,"chapter":1,"section":"1.4","k":2,"points":1,"type":"single","minutes":1,"scenario":"全社の組織的テスト戦略には自動化とレビューの進め方が定めてあるが、今回の通信機器向け開発で必要になる性能面の扱いは書かれていない。","question":"このプロジェクトのテストマネジメントの進め方として最も適切なものはどれか。1つ選べ。","choices":["定めてある部分はそのまま適用し、書かれていない部分は関係者とともに明確にして、このプロジェクトの組み合わせを決める","今回の事情に合うように全社向けの取り決めの側を改訂し、改訂したものを本プロジェクトにも適用していく","自動化とレビューは全社の取り決めどおりに進め、書かれていない性能面は、各テストレベルの担当者がテスト設計の段階で技法を選ぶ中で決める","性能面の扱いが定まっていないことをプロジェクトのリスクとしてテスト計画に記録し、リスクの大きさに見合う範囲で性能テストを組み込んで進める"],"answer":[0],"explanation":{"signals":"効くのは2点である。1つは全社の取り決めが既に存在していること、もう1つは必要な側面の一部が書かれていないことである。前者は上位の枠が与件であることを、後者は不足時の行動が問われていることを指している。通信機器という領域は、どの区画の話かを決めるだけで、答えは変えない。","why":"シラバスは組織的テスト戦略を与えられたものとして扱うと明記しており、テストマネージャーの仕事は確立した戦略を適用し技法を選択することであって、それらを開発することではないと述べている。したがって上位の枠は入力であり、プロジェクト側で書き換える対象ではない。そのうえで、必要な側面がカバーされていない場合の行動も本文が定めており、関連するステークホルダーとともに不足している詳細を明確にするよう努めなければならない、としている。適用と、不足分の明確化と、プロジェクト固有の組み合わせの決定という3つが、この状況でテストマネジメントが担う範囲である。","distractors":[null,"上位の取り決めを現実に合わせて直すのは、組織としては筋の通った動きに見える。しかしシラバスは組織的テスト戦略を与件として扱うと明示し、その開発とメンテナンスを上位のシラバスと規格の領分に置いている。プロジェクト側の判断で組織レベルの成果物を書き換えることは、本シラバスが想定する役割の外にある","上位の枠は守ったうえで、技法の選択は実際に設計する人に近いところで決めるという分担は、現場では珍しくない。しかしシラバスは、テストレベル・テストタイプ・テスト技法の選択と組み合わせをプロジェクトテスト戦略の重要な決定事項として挙げ、確立した戦略を適用しテスト技法を選択することをテストマネージャーの仕事だと述べている。決める場所がテスト設計の側に一段下がっており、書かれていない領域を関係者とともに明確にする段が抜けている","不足を明示し、リスクの大きさに応じて厚みを決めるのは、計画づくりの手順としては筋が通って見える。しかしここで欠けているのは製品の危険度の見積りではなく、上位の取り決めが触れていない領域についての取り決めそのものである。シラバスは、組織的テスト戦略が必要とされる側面をカバーしていない場合に、関連するステークホルダーとともに不足している詳細を明確にするよう求めており、記録する先をテスト計画のリスクに替えても、その明確化は行われないままになる"],"flip":[null,null,null,null],"flipNote":{"2":"組織的テスト戦略の開発とメンテナンスは、本シラバスが Expert Level のテストマネジメントや大規模アジャイルのテストリーダーシップという別の文脈に置いているものであり、その担当範囲に立てば上位文書を改訂する行動も筋が通る。ただしその場合でも、定めてある部分を適用し、書かれていない部分を関係者とともに明確にするという進め方は正しいまま残るため、この肢が単独の正解になることはない","3":"この肢には誤りが2つある。決める場所がテスト設計の側へ一段下がっている点と、書かれていない領域を関係者とともに明確にする段が抜けている点である。加えて、組織的テスト戦略が性能面まで定めている場面に変えると、この肢が前提にしている「書かれていない性能面」そのものが場面から消えてしまう。1つの条件では反転しない","4":"性能面が今回のスコープの外にある場面に変えれば、前半のリスクとして記録するという判断は成り立つが、同じ条件が後半の「リスクの大きさに見合う範囲で性能テストを組み込む」と噛み合わなくなる。さらに、組織的テスト戦略が必要とされる側面をカバーしていない場合に関連するステークホルダーとともに不足している詳細を明確にするというシラバスの求めは、記録先をテスト計画のリスクに替えても満たされない"},"quote":"組織的テスト戦略が存在しない場合や、必要とされる側面をカバーしていない場合、テストマネジメントは、関連するステークホルダーとともに不足している詳細を明確にするよう努めなければならない。","ref":"1.4 / 1.2","misconception":"組織的テスト戦略の不足を、プロジェクト側での改訂や、設計時の技法選択、リスクとしての記録で埋められると考えており、上位の枠は与件であり、不足はステークホルダーとともに明確にするという役割分担を捉えていない"},"meta":{"concept":"テストアプローチの選択","relatedConcepts":["組織的テスト戦略","プロジェクトテスト戦略","テストマネージャーの役割"],"distractorIntent":["組織レベルの成果物をプロジェクト側で改訂してよいと考える","アプローチの選択を、テスト設計時の技法選びの層に降ろす","取り決めの不足を、テスト計画にリスクとして記録すれば扱えると考える"],"distractorTypes":["D1","D8","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス 1.4 イントロ（組織的テスト戦略は与件／不足時はステークホルダーとともに明確にする）、1.2 イントロ（確立した戦略を適用しテスト技法を選択するのであって開発するのではない）、1.4.1（テストレベル・テストタイプ・テスト技法の選択はプロジェクトテスト戦略の重要な決定事項）。誤答は3つとも帰属先の取り違えで、組織レベル・テスト設計レベル・リスク記録へと外し先を変えている","mistakePatterns":["MP-10","MP-09"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"組織的テスト戦略は与件、不足はステークホルダーとともに明確化。quote は 1.4 イントロと一字一句一致。flipNote 3本とも真","ref":"jstqb-al-tm/kb/reviews/TM-1.4.1-syllabus-2026-09-13-t3.m だけ○が付き、要件カバレッジは両方の欄に○が付く。カバレッジという語は、どちらの欄に載るかを決めていない"],"flip":[null,null,null,null],"flipNote":{"1":"この肢は「実際のテストコスト 対 計画したテストコストは完了でのみ使う」と「プロダクトリスクカバレッジはモニタリングとコントロールでのみ使う」の2つの対応を同時に主張している。表2 は前者にテストモニタリングとテストコントロールの欄だけ○を付け、後者には両方の欄に○を付けており、どちらも食い違う。片方の条件だけを動かしても残る片方が誤りのままなので、この肢は答えにならない。答えになるのは表2 の○が2か所とも変わったときだけであり、それは条件の変更ではなく原文の変更である。","2":"この肢は「実際の自動化テストケース 対 計画した自動化テストケースはモニタリングとコントロールでのみ使う」と「テストケースのステータスごとの実行割合 対 計画したテストケースは完了でのみ使う」の2つを同時に主張している。表2 は前者にテスト完了の欄だけ○を、後者には両方の欄に○を付けており、2組とも配置が合わない。片方だけを条件で動かしても残る片方が誤りのまま残るため、この肢は答えにならない。","4":"この肢は「コードカバレッジは完了でのみ使う」と「要件カバレッジはモニタリングとコントロールでのみ使う」の2つを同時に主張している。表2 はコードカバレッジにモニタリングとテストコントロールの欄だけ○を、要件カバレッジには両方の欄に○を付けている。カバレッジのどちらか一方について条件を動かしても、もう一方が誤りのまま残るため、この肢は答えにならない。"},"quote":"テストモニタリングとテストコントロールで ○ が付いているメトリクスは、主に進捗を測定するために使い、テスト進捗レポート(CTFL)で報告する。テスト完了に ○ が付いているメトリクスは、主にテスト目的の達成度を測定するために使い、テスト完了レポート(CTFL)で報告する。両方の欄に ○ が付いているメトリクスは、どちらにも使用できる。","ref":"2.1.1","misconception":"表2 の○の位置を、メトリクスの意味からの推測で決めており、コストは完了時の総括、自動化の実績は日々の進捗、という直感が表の配置と逆であることを知らない"},"meta":{"concept":"テストマネジメント活動のためのメトリクス","relatedConcepts":["テストモニタリングとテストコントロール","テスト完了","テスト進捗レポート","テスト完了レポート"],"distractorIntent":["金額は完了時の総括、リスクの消化は進捗と推測する","自動化の実績を進捗、テストケースの消化を達成度と推測する","カバレッジという語で、2つの指標の帰属を振り分ける"],"distractorTypes":["D14","D14","D14"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス 2.1.1 の表2 と、表の読み方を定める直後の本文。公式サンプル SET B 問27・SET A 問27（いずれも TM-2.1.1・K2）は誤答3個すべてが単一転置であり、その構成に合わせた","mistakePatterns":["MP-29"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"表2 の配置は explanation の記述どおりで正答は一意。flipNote 3本とも「2か所とも外れている」を正しく数えている","ref":"jstqb-al-tm/kb/reviews/K2-2.1-syllabus-2026-09-13-t3.md","sig":"fc2c2301587e","explSig":"a678fb79714a","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"D14×3 で公式問27 と同型。排他と収束の手がかりは残るが門ではない","ref":"jstqb-al-tm/kb/reviews/K2-2.1-item-2026-09-12.md","sig":"fc2c2301587e","explSig":"a678fb79714a","fieldSig":{"選択肢1":"1f0e45a48ab9","選択肢3":"4aeea39ade80","選択肢2":"dd953f8428b9"}}]}},{"id":"q-2.1.1-A-2","lo":"TM-2.1.1","cluster":"2.1.1-A","clusterName":"テスト目的を達成するためのメトリクスの例","variantAxis":"プロジェクト終了時に報告する5カテゴリーのうち、コストとテスト労力に属するメトリクスの範囲","variant":2,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"自治体向けの窓口システムのテストが終わり、報告する数値をカテゴリーごとに仕分けている。","question":"シラバスがコストとテスト労力のカテゴリーに挙げているものはどれか。1つ選べ。","choices":["テストに費やしたリソース時間についての、計画に対する実績","識別したプロダクトリスクのうち、テストケースによって軽減した割合","テストレベルやイテレーションごとの、欠陥の混入件数・検出件数・修正件数","テストしていないコンポーネントに欠陥がある場合の、潜在的な影響と可能性"],"answer":[3],"explanation":{"signals":"シナリオが指しているのは、仕分けの基準がカテゴリーの定義だけだという点である。自治体という領域も、テストが終わった段階であることも、どれがどのカテゴリーかを変えない。4つはいずれも 2.1.3 に実在するメトリクスであり、指標として妥当かどうかでは選り分けられない。","why":"シラバスは、プロジェクト終了時に測定し報告するものとして、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力を挙げ、続けてカテゴリーごとにメトリクスを列挙している。コストとテスト労力の項に置かれているのは、テストしていないコンポーネントの残存リスクと、テストコストの計画に対する実績の2つだけである。残存リスクという語からはプロダクトリスクの項を連想しやすいが、シラバスはこれを、テストしなかったことで引き受けている損失として金額と労力の側に置いている。一方、時間で測る労力はテスト進捗の項にテスト工数として置かれており、カテゴリーが分かれている。","distractors":["計画に対する実績という形はテストコストと同じであり、労力という語もカテゴリー名に含まれるため、最も紛れやすい。しかしシラバスはこれをテスト工数としてテスト進捗のカテゴリーに置いている。時間で測るものは進捗側、金額で測るものはコスト側という分かれ方になっている","リスクをどれだけ消化したかは、テストしていない部分の残存リスクと対になる情報に見える。だがシラバスはこの指標をカバレッジのカテゴリーに、プロダクトリスクのカバレッジとして置いている。同じリスクという語を使っていても、属する項が違う","混入と検出の件数はテストの効率を語る数字であり、かけた労力の話に見える。しかしシラバスはこれを欠陥のカテゴリーに、欠陥の数または割合の内訳の1つとして置いている。欠陥の検出と解決のプロセスをモニタリングするための指標であって、コストや労力を測るものではない",null],"flip":[null,null,null,null],"flipNote":{"1":"この指標は原文がテスト進捗のカテゴリーに「テスト工数：テストに費やしたリソース時間の計画に対する実績」として置いている。この肢が答えになるのは設問がテスト進捗のカテゴリーを問うたときであり、それは条件の変更ではなく設問の変更である。選択肢の側で「リソース時間」を「テストコスト」に替えればコストとテスト労力に移るが、そのとき正解の肢も同じカテゴリーに残るため、正答が2つになり1つ選べが成り立たない。","2":"この指標は原文がカバレッジのカテゴリーに「プロダクトリスクのカバレッジ：識別したプロダクトリスクのうち、テストケースによって軽減した割合」として置いている。この肢が答えになるのは設問がカバレッジのカテゴリーを問うたときであり、それは条件の変更ではなく設問の変更である。選択肢の側を書き替えてコストとテスト労力に移しても、正解の肢が同じカテゴリーに残るため正答が2つになる。","3":"この指標は原文が欠陥のカテゴリーに「欠陥の数または割合の内訳」の1項目（テストレベルまたはイテレーションでの混入件数、検出件数、修正件数）として置いている。この肢が答えになるのは設問が欠陥のカテゴリーを問うたときであり、それは条件の変更ではなく設問の変更である。選択肢の側を書き替えても、正解の肢がコストとテスト労力に残るため正答が2つになる。"},"quote":"コストとテスト労力に関するメトリクスは以下の通り：テストしていないコンポーネントの残存リスク：テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性。テストコスト：テストコストの計画に対する実績。","ref":"2.1.3","misconception":"5つのカテゴリーへの割り当てを語の印象で決めており、残存リスクはプロダクトリスクの項、計画対比の時間はコストと労力の項にあるはずだと考えている","note":"4つの選択肢はいずれもシラバス 2.1.3 に実在するメトリクスであり、記述として誤っているものはない。問われているのは所属するカテゴリーである。"},"meta":{"concept":"テスト報告の5カテゴリー","relatedConcepts":["テスト進捗","カバレッジ","欠陥","残存リスク"],"distractorIntent":["計画対比の時間をコストと労力の項だと思う","リスクの軽減割合をコストと労力の対と思う","欠陥の混入・検出件数を労力の指標だと思う"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス 2.1.3 の5カテゴリーの列挙。概念ノート WHAT-7 が指摘する落とし穴（工数は進捗側・コストはコスト側／残存リスクはコストと労力側）をそのまま誤答の材料にし、誤答3つをテスト進捗・カバレッジ・欠陥の3区画から1つずつ取った","mistakePatterns":["MP-29","MP-28"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"5カテゴリーの帰属は 2.1.3 どおり。flipNote 3本とも所属カテゴリーの名指しが原文と一致する","ref":"jstqb-al-tm/kb/reviews/K2-2.1-syllabus-2026-09-13-t3.md","sig":"f219658f6bc3","explSig":"4c0faf3d4959","fieldSig":{"explanation.ref":"06e19dead69d"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"D1×3。直感とずれる帰属を正答側に置けている。この6問で最も強い","ref":"jstqb-al-tm/kb/reviews/K2-2.1-item-2026-09-12.md","sig":"f219658f6bc3","explSig":"4c0faf3d4959","fieldSig":{}}]}},{"id":"q-2.1.2-A-1","lo":"TM-2.1.2","cluster":"2.1.2-A","clusterName":"メトリクスによるテスト進捗のコントロール","variantAxis":"テストコントロールの活動と、テスト完了・テストモニタリングの活動の境界（否定形）","variant":1,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"物流会社の配車システムのテストが始まり、週ごとにメトリクスを集めて状況を見ている。","question":"シラバスが挙げるテストコントロールの例として**適切でないもの**はどれか。1つ選べ。","choices":["手戻りが生じた対象について、開始基準や終了基準を満たすかどうかを評価し直す","イテレーションの区切りで、学んだ教訓やテストウェアを集めて統合する","課題事項になったリスクが出てきたため、テストの優先順位を付け直す","提供が遅れているテスト環境に合わせて、テストの日程を後ろにずらす"],"answer":[1],"explanation":{"signals":"効くのは、週ごとに集めた数値を受けて何をするかという場面設定である。4つはいずれもテストマネジメントが実際に行う活動であり、良し悪しでは分かれない。分かれるのは、それがモニタリングからの情報を使って進め方を変える活動か、マイルストーンで区切って情報をまとめる活動かという点である。","why":"シラバスはテストコントロールを、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する活動と定義している。例として挙がっているのは、識別したリスクが課題事項となった場合のテストの再優先順位付け、手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価、テスト環境の提供の遅れを考慮したテストスケジュールの調整、必要なとき必要な場所での新しいリソースの追加である。一方、教訓やテストウェアを統合する活動は、同じ 2.1.2 がテスト完了の説明として述べているものであり、テストレベルやイテレーションの完了といったマイルストーンで発生する。","distractors":["開始基準と終了基準の再評価も、シラバスがテストコントロールの例として明記しているものである。基準の確認という語からモニタリングの側に見えるが、手戻りを受けて判断をやり直す行為であり、是正の一部として挙げられている",null,"これはシラバスがテストコントロールの例の筆頭に挙げている再優先順位付けそのものである。リスクの話であるためリスクマネジメント側の活動に見えることがあるが、モニタリングで得た情報を受けて進め方を変えている点でコントロールにあたる","テスト環境の遅れを受けた日程の調整も、シラバスがテストコントロールの例として挙げている。日程の調整はプロジェクトマネジメントの仕事に見えるため外しやすいが、本文はテストコントロールの例に含めている"],"flip":[null,null,null,null],"flipNote":{"1":"手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価は、原文がテストコントロールの例として名指しで挙げている。原文が変わらない限り、この行為が「テストコントロールの例として適切でないもの」になることはない。設問をテスト完了の活動でないものを選ぶ形に替えると、この肢だけでなく選択肢3 と選択肢4 も同時に答えになり、1つ選べが成り立たない。","3":"識別したリスクが課題事項となった場合のテストの再優先順位付けは、原文がテストコントロールの例の筆頭に挙げている。原文が変わらない限り「適切でないもの」にはならない。設問をテスト完了の活動でないものを選ぶ形に替えると、この肢と選択肢1・選択肢4 が同時に答えになるため、1つ選べが成り立たない。","4":"テスト環境の提供の遅れを考慮したテストスケジュールの調整も、原文がテストコントロールの例として挙げている。設問をテストモニタリングにあたる活動を選ばせる形に替えても、この肢はデータを収集する活動ではないため答えの側には回らない。この肢が答えになるのは、テストコントロールの例の一覧そのものが変わったときだけである。"},"quote":"テストコントロールに関する例には、識別したリスクが課題事項となった場合のテストの再優先順位付け、手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価、テスト環境の提供の遅れを考慮したテストスケジュールの調整、必要なとき必要な場所での新しいリソースの追加などが含まれる。","ref":"2.1.2","misconception":"テストコントロールを「テスト中に行うマネジメント活動の総称」と広く取り、マイルストーンで情報を締めるテスト完了の活動との境界を持っていない"},"meta":{"concept":"モニタリング、コントロール、完了","relatedConcepts":["テストモニタリング","テスト完了","テストメトリクス","終了基準"],"distractorIntent":["基準の再評価をモニタリングの側と思う","日程の調整をプロジェクトマネジメントの側と思う","再優先順位付けをリスクマネジメント側の活動と思う"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス 2.1.2 のテストコントロールの例の列挙と、同項のテスト完了の説明。公式サンプル SET B 問28（TM-2.1.2・K2）が同じ4つの区画の境界を問うており、誤答はコントロールの真のメンバー（D12）で構成した","mistakePatterns":["MP-21"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"コントロールの4例は原文どおりで、選択肢2 だけが同項のテスト完了側。flipNote 3本の数え方も正しい","ref":"jstqb-al-tm/kb/reviews/K2-2.1-syllabus-2026-09-13-t3.md","sig":"97bf18a1d7af","explSig":"1a04be8ee11d","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"否定根拠は 2.1.2 の列挙にある。誤答型の偏りは中","ref":"jstqb-al-tm/kb/reviews/K2-2.1-item-2026-09-12.md","sig":"97bf18a1d7af","explSig":"1a04be8ee11d","fieldSig":{"meta.distractorTypes":"cafe7c875a3a","選択肢2":"a53099f21c6d"}}]},"noShuffle":true},{"id":"q-2.1.2-A-2","lo":"TM-2.1.2","cluster":"2.1.2-A","clusterName":"メトリクスによるテスト進捗のコントロール","variantAxis":"進捗のコントロールに効くメトリクスの条件（計画との対比と、時系列での傾向）","variant":2,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"医療機器の付属アプリのテストが後半に入り、期日までに終えられるかを早めに見極めたい。","question":"テストの進み具合をコントロールするためのメトリクスの使い方として最も適切なものはどれか。1つ選べ。","choices":["テストに充てた時間を計画と並べ、週ごとの推移から期日までの見通しを立てる","テストへ充てた時間の累計を集計し、その総量を週次の報告に載せる","しきい値を下回った指標が、テストの優先順位を自動で組み替えるようにしておく","自動化したテストケースの数を計画した数と毎週対比し、その達成割合で進み具合を評価する"],"answer":[0],"explanation":{"signals":"効くのは、期日までに終えられるかを早めに見極めたいという目的である。この一文があるため、測っていること自体ではなく、測った値から進め方の変更が導けるかどうかが判定軸になる。医療機器という領域は、どの区画の話かを決めるだけで、答えは変えない。","why":"シラバスはテストメトリクスを、テストがどこまで進んだか、終了基準や関連するテストタスクが達成されたかどうかを示す指標だと述べ、テストコントロールはそのモニタリングからの情報を利用して、ガイダンスと是正措置を提供する活動だとしている。したがって使い方の良否は、示された値から是正が導けるかで決まる。表2 はテスト活動の実績を計画時の見積りと対比する形で挙げ、2.1.3 もテスト工数を計画に対する実績と定義しており、比較の相手がなければ遅れの有無は言えない。加えて 2.1.3 は、ある時点のスナップショットとしてだけでなく、傾向を評価するために時系列の変遷として報告できるとしている。期日までの見通しは、計画との対比を時系列で追うことから得られる。","distractors":[null,"数値としては具体的で、労力を報告しているという点ではカテゴリーも合っている。しかし比較の相手がないため、多いのか少ないのか、遅れているのかが読み取れない。シラバスが挙げるのは計画に対する実績、表2 が挙げるのは実績 対 見積りであり、総量だけの指標からは是正措置が導けない","遅れを検知したら手を打つという流れは、コントロールの狙いに沿って見える。しかしシラバスはメトリクスを進捗や達成を示す指標と定義しており、ガイダンスと是正措置を提供するのはテストコントロールの側である。指標そのものが優先順位を決める形は、この役割分担を飛び越えている","計画した数との対比があり、毎週見るという点でも進捗の管理らしく見える。しかし表2 で「実際の自動化テストケース 対 計画した自動化テストケース」に ○ が付いているのはテスト完了の欄だけで、テストモニタリングとテストコントロールの欄には付いていない。テスト完了に ○ が付く指標は主にテスト目的の達成度を測るために使うものであり、期日に間に合うかを見て是正を導く指標ではない。自動化の実績は進捗だという直感で帰属を決めると、この違いを見落とす"],"flip":[null,null,null,null],"flipNote":{"2":"テストに充てた時間は、シラバスがテスト進捗のメトリクスとして「テストに費やしたリソース時間の計画に対する実績」と定義しているものであり、この肢が欠いているのは比較の相手だけである。ただし比較の相手を足すと、この肢は計画と実績を週ごとに並べる使い方になり、正解の肢とほぼ同じものになる。正解の肢には手が加わらず正しいまま残るため、正答が2つになって1つ選べが成り立たない。1つの条件でこの肢だけを答えにすることはできない。","3":"是正の判断をメトリクスから人に戻せば、この使い方自体は原文の役割分担に沿ったものになる。ただし正解の肢には手が加わらないため、しきい値を合図に人が優先順位を見直す運びと、計画との対比を時系列で追って見通しを立てる使い方の2つが同時に成り立ち、1つ選べが成り立たない。","4":"表2 は「実際の自動化テストケース 対 計画した自動化テストケース」にテスト完了の欄だけ○を付けている。シナリオの目的をテストレベルやイテレーションの完了時点での到達度の評価に置き替えても、設問が問うているのは進み具合をコントロールするためのメトリクスの使い方であるため、この肢は答えにならない。この指標が進捗の側に回るのは表2 の配置そのものが変わったときだけである。"},"quote":"メトリクスは、ある時点におけるメトリクスのスナップショットとして報告することも、傾向を評価するために時系列的なメトリクスの変遷として報告することもできる。","ref":"2.1.2 / 2.1.3","misconception":"測った数値が計画と並んでいれば進捗をコントロールできると考えており、指標がどの活動に帰属するか、時系列の変化がなければ是正の判断につながらないこと、判断の主体がメトリクスではないことを捉えていない"},"meta":{"concept":"モニタリング、コントロール、完了","relatedConcepts":["テスト工数","スナップショットと傾向","テストコントロール","テスト進捗レポート","表2 のメトリクスの帰属"],"distractorIntent":["工数を計画対比ではなく総量で報告する","メトリクスが是正措置の主体だと考える","テスト完了の欄にだけ ○ が付く指標を、進捗のコントロールにも使えると考える"],"distractorTypes":["D3","D10","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス 2.1.2（メトリクスは示す指標／コントロールが是正措置を提供する）、2.1.1 表2（テスト活動の実績 対 計画時の見積りはモニタリングとコントロール側、実際の自動化テストケース 対 計画した自動化テストケースはテスト完了のみ）、2.1.3（スナップショットと傾向、テスト工数は計画に対する実績）。概念ノートの Official 裁定 M8 と、表2 の帰属（MP-29）に対応する","mistakePatterns":["MP-21","MP-23","MP-29"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flipNote「2」が挙げる2条件は同時に成り立たない（中）。既知の quote / ref の中も未返済（中）","ref":"jstqb-al-tm/kb/reviews/K2-2.1-syllabus-2026-09-13-t3.md","sig":"ee21bee0ef14","explSig":"d118c371000d","fieldSig":{"syllabus":"79c0ba4a0756","選択肢2":"f15e52bfda6c","explanation.ref":"3ccb57036198"}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答3つとも選ぶ思考を1文で書け、落とす根拠も1つずつ特定できる。実質3択は解消（残るのは■中の語の反復）","ref":"jstqb-al-tm/kb/reviews/K2-2.1-item-2026-09-12-r2.md","sig":"ee21bee0ef14","explSig":"d118c371000d","fieldSig":{"scenario":"34cb91cc9b6c","選択肢1":"b4300a841b93","選択肢4":"b12ca6c388ef"}}]}},{"id":"q-3.1.1-A-2","lo":"TM-3.1.1","cluster":"3.1.1-A","clusterName":"4つの能力領域の帰属","variantAxis":"専門的能力と方法論的能力の境界（および「学ぶ能力」と「学ぶ意欲」の分かれ目）","variant":2,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーのスキルを4つの能力領域に分類するとき、**方法論的能力**の例として適切なものはどれか。1つ選べ。","choices":["テスト対象の業務や、実装に使われている技術について深い知識を持つこと","テストの作業と要員の割り当てを取りまとめ、進め方を管理できること","使ったことのない技術やツールでも、自分で調べて使えるようになれること","新しいことを学ぼうとする意欲と、同僚を助けようとする姿勢を持っていること"],"answer":[2],"explanation":{"signals":"判断に効くのは、そのスキルが「テストという専門の業務に固有のものか」「領域を限定しない一般的な遂行能力か」「他者との関わりで働くものか」「自分自身の態度や意欲か」のどれに当たるかである。語の印象ではなく、この4つの問いのどれに答えるかで区画が決まる。とりわけ「学ぶ」は、能力として述べられているか意欲として述べられているかで区画が変わる。","why":"シラバスは方法論的能力を「ある領域で独自に使用でき、複雑度または新規性の高い課題を独自に遂行できる一般的な能力」と定義し、分析力・概念力・判断力を例に挙げる。初めて扱う技術やツールを自力で調べて使えるようになることは、まさに新規性の高い課題を独自に遂行する一般的な能力であり、方法論的能力にあたる。公式サンプル問題も「新しい技術やツールを学ぶ能力」を方法論的能力と裁定している。","distractors":["アプリケーション領域における技術的専門知識とビジネス専門知識は、いずれもシラバスが専門的能力の例に挙げている。領域を限定した知識そのものであり、領域を限定しない一般的な遂行能力を指す方法論的能力とは別区画である","テストタスクと要員のマネジメントは、シラバスが専門的能力の例に挙げるプロジェクトマネジメントスキルにあたる。「管理」「取りまとめ」という語感から一般的な遂行能力に見えるが、シラバスはこれを専門的能力側に置いている",null,"助け合いや学ぶ意欲は、シラバスが個人の能力の例に挙げている。「学ぶ」という語が正解と共通するため紛らわしいが、分かれ目は能力か意欲かにある。学んで使えるようになる力は方法論的能力、学ぼうとする姿勢は個人の能力である"],"flip":[null,null,null,null],"flipNote":{"1":"アプリケーション領域における技術的専門知識とビジネス専門知識は、原文が専門的能力の例に挙げている。この記述を、領域を限定しない一般的な遂行能力の記述に書き替えれば方法論的能力に移るが、そのとき正解の肢も方法論的能力に残るため、正答が2つになり1つ選べが成り立たない。この肢が答えになるのは設問が専門的能力を問うたときであり、それは条件の変更ではなく設問の変更である。","2":"テストの作業と要員の割り当てを取りまとめることは、原文が専門的能力の例に挙げるプロジェクトマネジメントスキルにあたり、ISTQB が重点を置く専門的能力の中身としてもテストタスクのマネジメントが列挙されている。記述を一般的な遂行能力に書き替えれば方法論的能力に移るが、正解の肢も方法論的能力に残るため正答が2つになる。この肢が答えになるのは設問が専門的能力を問うたときである。","4":"助け合いや学ぶ意欲は、原文が個人の能力の例に挙げている。「学ぼうとする意欲」を「習得して使いこなせる能力」に替えると方法論的能力に移るが、その記述は正解の肢と同じ内容になるため、正答が2つになり1つ選べが成り立たない。この肢が答えになるのは設問が個人の能力を問うたときであり、それは条件の変更ではなく設問の変更である。"},"quote":"方法論的能力：ある領域で独自に使用でき、複雑度または新規性の高い課題を独自に遂行できる一般的な能力を含む。例えば、分析力、概念力、判断力などがある。 専門的能力：専門的な業務を遂行するためのスキルで構成される。例えば、テスト技法のスキル、アプリケーション領域における技術的専門知識、ビジネス専門知識、プロジェクトマネジメントスキルなどがある。","ref":"3.1.1","misconception":"「マネジメントとあれば方法論的」「学ぶとあれば個人」のように語の印象で4つの能力領域を振り分けており、専門の業務に固有か／領域を限定しない一般的な遂行能力かという区画の基準を持っていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["4つの能力領域","専門的能力への重点"],"distractorIntent":["プロジェクトマネジメントスキルを方法論的能力だと考える（正: 専門的能力）","領域固有の知識を方法論的能力だと考える（正: 専門的能力）","「学ぶ意欲」と「学ぶ能力」を同じ区画に入れる（正: 意欲は個人の能力）"],"distractorTypes":["D1","D1","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.1 の4領域の定義と例。公式 SET A 問42 c（テストタスクとリソースのマネジメント＝専門的能力）と問42 d（新しい技術やツールを学ぶ能力＝方法論的能力）、SET B 問45 b（技術的専門知識＝専門的能力）の裁定に合わせた。既存の q-3.1.1-A-1 が個人と社会の境界を否定形で問うのに対し、本問は専門的と方法論的の境界を肯定形で問う","mistakePatterns":["MP-14"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答と4区画の帰属は原文どおり。quote が選択肢4を落とす一文を含まず、弁別点が渡っていない（中）","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"41ea1b2ca679","explSig":"70e6ae07f219","fieldSig":{"explanation.quote":"9598e079ddc4","syllabus":"79c0ba4a0756"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"罠（学ぶ能力→方法論的）が正答側にあり公式 問42 と同じ向き。誤答3つとも帰属の取り違えで機能する","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12.md","sig":"41ea1b2ca679","explSig":"70e6ae07f219","fieldSig":{}}]}},{"id":"q-3.1.3-A-1","lo":"TM-3.1.3","cluster":"3.1.3-A","clusterName":"スキルアセスメントの技法","variantAxis":"実演によるアセスメントが測る能力領域（専門的・方法論的か、社会的・個人か）","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーの専門的能力と方法論的能力をアセスメントする方法として、シラバスが挙げているものはどれか。1つ選べ。","choices":["レビューで受けた指摘の受け止め方と返し方を観察し、その様子から見極める","テスト戦略の概要を作成させ、その草案について同僚と話し合わせる","担当範囲が重なったときの調整のしかたを本人に実演させ、その立ち回りから判断する","割り込みが多い週に自分のテスト作業の量と時間をどう管理しているかを確かめる"],"answer":[1],"explanation":{"signals":"選択肢はどれも、本人にやってもらったり様子を見たりして現有スキルを見極める行為である。分かれ目は、その行為で何が見えるかにある。シラバスは、専門的能力と方法論的能力については典型的なテストタスクを実際にやってもらうことでアセスメントできるとしており、対人のやり取りや自分自身への構えから見えるものは、4つの能力領域の別の区画にある。","why":"シラバスは、テストチームメンバーの専門的・方法論的能力は典型的なテストタスクを実際にやってもらうことでアセスメントできるとし、その例の1つ目に「テスト戦略を概説して、同僚とフィードバックを話し合う」を挙げている。正解はこの実演タスクそのものであり、公式サンプル問題も、テスト戦略の概要を起草して上級テスターと議論させるタスクについて、戦略を組み立てて筋道を説明させる点から専門的能力と方法論的能力の双方を測れると裁定している。残る3つも現有スキルを見極める行為ではあるが、そこで見えるのは他者とのやり取りや自分自身に向けた構えであり、シラバスが4つの能力領域のうち社会的能力と個人の能力に置いているものである。測る行為かどうかではなく、何を測っているかで分かれる。","distractors":["指摘の受け止め方と返し方から見えるのは、批判を受ける能力という個人の構えと、フィードバックのやり取りという相互作用である。公式サンプル問題は、フィードバックのやり取りの処理を社会的能力とし、批判を受ける姿勢は個人の能力であってやり取りのプロセスそのものではないと裁定している。正解にも同僚との話し合いが含まれるため紛らわしいが、そちらで見ているのは本人が作った戦略の草案の中身である",null,"調整のしかたの実演から見えるのは対立解決のスキルであり、シラバスが社会的能力の例に挙げているものである。公式サンプル問題も、開発担当者とテスト担当者の対立の解決は対人のコミュニケーションと対立マネジメントのスキルを伴う社会的能力の例だと裁定している。実演させて見るという形は正解と同じだが、やらせているのが典型的なテストタスクではないため、測っている領域が設問の求めるものと違う","自分の作業量と時間を自分で管理できているかから見えるのはセルフマネジメント能力であり、シラバスが個人の能力の例に挙げているものである。シラバスが専門的能力に挙げる「テストタスクのマネジメント」と語が近いため専門的能力に見えるが、そちらはテストという専門領域のタスクを回すスキルであって、自分自身の管理ではない"],"flip":[null,null,null,null],"flipNote":{"1":"指摘の受け止め方とやり取りから見えるのは、批判を受ける能力（個人の能力）とフィードバックの相互作用（社会的能力）である。この肢を、原文が挙げる5つの実演タスクのいずれか（例えばテストベースをレビューし発見事項を伝える）に書き替えれば専門的・方法論的能力のアセスメントになるが、そのとき正解の肢も同じ一覧に残るため、正答が2つになり1つ選べが成り立たない。","3":"担当範囲が重なったときの調整の実演から見えるのは対立解決スキルであり、原文が社会的能力の例に挙げているものである。この肢を、原文が挙げる実演タスク（例えば特定のテスト目的を達成するためのテスト技法を決定する）に書き替えれば専門的・方法論的能力のアセスメントになるが、正解の肢も同じ一覧に残るため正答が2つになる。","4":"自分の作業量と時間を自分で管理できているかから見えるのはセルフマネジメント能力であり、原文が個人の能力の例に挙げているものである。この肢を、原文が挙げる実演タスク（例えばテスト結果のアセスメントを含むテスト完了レポートを作成する）に書き替えれば成立するが、正解の肢も同じ一覧に残るため正答が2つになる。"},"quote":"テストチームメンバーの専門的、方法論的能力は、典型的なテストタスクを実際にやってもらうことでアセスメントすることができる：テスト戦略を概説して、同僚とフィードバックを話し合う。テストベースをレビューし、発見事項を伝える中で、コミュニケーション能力も明らかになる場合がある。特定のプロジェクトのコンテキストに応じて、特定のテスト目的を達成するためのテスト技法を決定する。さまざまなテスト技法を適切に適用する。テスト結果のアセスメントを含むテスト完了レポートを作成する。","ref":"3.1.3","misconception":"アセスメントの技法を「どうやって見るか」の形だけで選んでおり、その技法で見えるのが4つの能力領域のどれなのかを見ていない。対人のやり取りや自分自身への構えから見えるのは社会的能力と個人の能力であって、専門的能力と方法論的能力ではない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["スキルアセスメントの技法","4つの能力領域"],"distractorIntent":["フィードバックの受け止め方（社会的能力・個人の能力）から専門的・方法論的能力が測れると考える","対立の場での立ち回り（社会的能力）から専門的・方法論的能力が測れると考える","自分の作業の管理（個人の能力のセルフマネジメント）を、専門的能力のテストタスクのマネジメントと取り違える"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.3 の実演タスク5項目と3.1.1 の4領域の帰属。誤答は3つとも現有スキルを見極める行為として書き、違いを「どの能力領域が見えるか」の一点に置いた（D1＝測る対象の取り違え。公式 SET A 問45／SET B 問45 と同じ型）。否定根拠は公式裁定（対立の解決＝社会的能力、フィードバックのやり取り＝社会的能力で批判を受ける姿勢＝個人の能力）とシラバス3.1.1（セルフマネジメント能力＝個人の能力）。公式 K2 26問がすべて4択の単一選択であることに従い、4択ONEで構成した","mistakePatterns":["MP-17"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"実演タスク5項目の帰属は原文どおり。flipNote 3本とも原文に実在する項目を名指ししており真","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"17d125fcde14","explSig":"cd7af9f225dd","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"4肢がすべて「本人にやらせる／様子を見る」同じ土俵に乗り、自己開示は消えた。誤答3つとも選ぶ人の思考を書ける","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12-r2.md","sig":"17d125fcde14","explSig":"cd7af9f225dd","fieldSig":{"選択肢2":"00923fbc46ac","syllabus":"79c0ba4a0756"}}]}},{"id":"q-3.1.3-A-2","lo":"TM-3.1.3","cluster":"3.1.3-A","clusterName":"スキルアセスメントの技法","variantAxis":"性格・役割タイプを扱うモデルで測れる能力領域の限界","variant":2,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームのスキルをアセスメントする方法について、シラバスの記述に**合わないもの**はどれか。1つ選べ。","choices":["テスト完了レポートを作成させ、その内容から専門的能力と方法論的能力を見る","外部で取得した資格や認定、これまでの実務経験や学位から判断する","ふりかえりに定期的に参加して受けたフィードバックから、求められるスキルを見極める","性格や役割のタイプを扱うモデルで、専門的能力と方法論的能力を評価する"],"answer":[3],"explanation":{"signals":"アセスメントの技法は、どれを使うかだけでなく、その技法で何が測れて何が測れないかまでが問われる。シラバスは、性格や役割のタイプを扱うモデルについて、チームにどのようなスキルがあり何が不足しているかの識別に役立つとは書いているが、専門的能力や方法論的能力を評価できるとは書いていない。","why":"シラバスは、専門的・方法論的能力については典型的なテストタスクを実際にやってもらうこと、および外部の資格・認定・実務経験・学位によってアセスメントできると述べ、アジャイルではふりかえりへの参加とフィードバックによってチームが求めるスキルを識別するとしている。一方、性格や役割のタイプを扱うモデルについては、公式サンプル問題が、この種のモデルは社会的・個人のスキルに焦点があり、技術的・方法論的能力の評価には適さないと明示的に裁定している。なお、この選択肢が測ろうとする対象が社会的能力と個人の能力であれば、シラバスの記述に沿う。誤っているのはモデルを使うこと自体ではなく、そのモデルを専門的能力と方法論的能力の評価に当てていることである。","distractors":["テスト結果のアセスメントを含むテスト完了レポートの作成は、シラバスが挙げる実演タスクの5番目そのものであり、専門的能力と方法論的能力のアセスメントとして適切である","シラバスは実演タスクに加えて、外部の資格、認定、実務経験、学位によってもスキルをアセスメントできると明記している。公式サンプル問題も外部の証跡による評価は有効であると裁定している","シラバスはアジャイルソフトウェア開発について、定期的にふりかえりに参加しフィードバックを受けることでチームが求めるスキルを識別すると述べている。開発アプローチではなく、求められるスキルを見極める経路として書かれている",null],"flip":[null,null,null,null],"flipNote":{"1":"テスト結果のアセスメントを含むテスト完了レポートの作成は、原文が実演タスクの5つ目として挙げているものである。記述を崩せばこの肢も「シラバスの記述に合わないもの」の側に回るが、正解の肢は合わないまま残るため、正答が2つになり1つ選べが成り立たない。","2":"原文は「さらに、スキルは外部の資格、認定、実務経験、学位によってアセスメントすることができる」と、条件を付けずに述べている。資格が必要なスキルと対応していない場合という限定は原文に無く、それを仮定するのは原文に無い前提を置くことになる。仮に置いてもこの肢と正解の肢が同時に「合わないもの」になるため、1つ選べが成り立たない。","3":"原文はアジャイルソフトウェア開発について「定期的にふりかえりに参加し、フィードバックを受けることで、チームが求めるスキルを識別する」と述べており、ふりかえりが評価の場として運用される場合という限定は原文に無い。それを仮定してもこの肢と正解の肢が同時に「合わないもの」になるため、1つ選べが成り立たない。"},"quote":"チームやチームメンバーがより効果的に機能するモデルがある（例えば、Meredith Belbin の「チームの役割」、DISG® またはPCM® ）。Belbin によれば(Belbin, 2010)、チームは異なる性格や役割のタイプで構成されることで、効果的に機能する。これらのモデルは、チームにどのようなスキルがあり、どのようなスキルが不足しているかを識別するのに役立つ。 さらに、スキルは外部の資格、認定、実務経験、学位によってアセスメントすることができる。","ref":"3.1.3","misconception":"チームの役割や性格のタイプを扱うモデルを万能のアセスメント手段だと考え、そのモデルが焦点を当てているのが社会的能力と個人の能力であることを見ていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["スキルアセスメントの技法","4つの能力領域"],"distractorIntent":["実演タスクの正メンバー（テスト完了レポートの作成）","外部の資格・認定・実務経験・学位という正メンバー","アジャイルにおけるふりかえりとフィードバックという正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.3。否定形はK2/K3に置く方針に従い、誤答3つをすべて3.1.3 の正メンバーにした（D12）。正解は公式 SET A 問45 b の裁定（チーム役割モデルは技術的・方法論的能力の評価には適さない）に一致する","mistakePatterns":["MP-17"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"監査が申告した2本（flipNote「2」「3」）は原文を正しく述べている。原文に無い限定は残っていない","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"1114e7daf61d","explSig":"e754e1d43afe","fieldSig":{"syllabus":"79c0ba4a0756"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"否定形だが、正答（性格・役割モデルで専門/方法論を測る）は MP-17 の中心で機能する","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12.md","sig":"1114e7daf61d","explSig":"e754e1d43afe","fieldSig":{}}]}},{"id":"q-3.1.4-A-1","lo":"TM-3.1.4","cluster":"3.1.4-A","clusterName":"スキル開発のアプローチ","variantAxis":"能力領域と開発アプローチの適合（社会的・個人の能力に推奨されるのはトレーニングとコーチング）","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストチームのスキル一覧を見直したところ、不足していたのは対立の解決と自己主張に関わるスキルだった。","question":"これらのスキルを伸ばすアプローチとして、シラバスの記述に沿うものはどれか。1つ選べ。","choices":["書籍や録画教材を渡し、各自が一人で学ぶ時間を業務の中に確保する","テストタスクのマネジメントの進め方について、あらかじめ内容を決めた研修を教室形式で行う","複雑度の高いテスト分析の課題を一人ずつ割り当て、独力でやり切ってもらう機会を増やす","教室形式の研修を受けさせたうえで、個別に指導する担当者を付ける"],"answer":[3],"explanation":{"signals":"効くのは、不足しているスキルがどの能力領域のものかである。対立の解決と自己主張は、シラバスが社会的能力の例に挙げている。判断は2段になる。①その案が伸ばすのはどの能力領域のスキルか。②その領域を伸ばすのにシラバスが推奨しているアプローチか。この2つを両方満たすものは1つしかない。","why":"シラバスは、自己学習やトレーニングは専門的・方法論的な能力開発に適しているとしたうえで、社会的および個人の能力を開発するためにはトレーニングやコーチングのアプローチを利用することを推奨し、その理由をこれらが自己学習よりも効果が期待できることが多いためだと述べている。さらに、社会的交流、フィードバック、内省が社会的能力と個人の能力を開発するための重要な成功要因だとしている。教室形式の研修（トレーニング）と個別に指導する担当者（コーチング）を組み合わせることは、この推奨に名指しで対応する唯一の選択肢である。","distractors":["一人で書籍や録画教材に取り組むのは自己学習であり、シラバスは自己学習を専門的・方法論的な能力開発に適したものとして位置づけている。社会的能力と個人の能力の開発には社会的交流とフィードバックが要るため、この領域では効果が期待しにくい。安価で着手しやすいので実務では選ばれやすい","教室で、あらかじめ定義された知識や実践例を教えるのはシラバスの言うトレーニングであり、形としては社会的能力と個人の能力の開発に推奨されている側にある。しかしここで教えるテストタスクのマネジメントは、シラバスが専門的能力として挙げているスキルである（4つの能力領域の説明で専門的能力の例にプロジェクトマネジメントスキルが挙がり、ISTQBが重点を置く専門的能力の中身としてテストタスクのマネジメントが列挙されている）。シラバスは自己学習やトレーニングを専門的・方法論的な能力開発に適したものと位置づけており、この案が伸ばすのは不足していない領域である。対立の解決と自己主張は社会的能力であり、この研修では伸びない","複雑度または新規性の高い課題を独自に遂行できる能力は、シラバスが方法論的能力として定義しているものであり、その例として分析力、概念力、判断力が挙がっている。つまりこの案が伸ばすのは方法論的能力であって、不足している社会的能力ではない。加えて、一人で課題をやり切る形には社会的交流もフィードバックも入らないが、シラバスは社会的交流、フィードバック、内省を、社会的能力と個人の能力を開発するための重要な成功要因としている。難しい仕事をやり切らせれば自信や主張も付いてくると考えやすく、実務では選ばれやすい",null],"flip":[null,null,null,null],"flipNote":{"1":"原文は「自己学習やトレーニングは、専門的・方法論的な能力開発に適している」と両方を並べて挙げている。したがって不足しているスキルを専門的・方法論的な領域に置き替えると、自己学習を勧めるこの肢と、教室形式の研修を含む正解の肢が同時に原文の記述に沿うことになり、正答が2つになって1つ選べが成り立たない。","2":"この肢が答えになるには、不足しているスキルがテストタスクのマネジメントであることに加えて、同じく専門的・方法論的な能力開発に適しているとされる自己学習の肢が外れることが要る。原文が自己学習とトレーニングの両方を適しているとしている以上、条件は1つでは足りない。","3":"一人ずつ割り当てて独力でやり切ってもらう形は、原文が挙げる5つの能力開発アプローチ（トレーニングと教育、自己学習、ピアラーニング、メンタリングやコーチング、OJT）のどれにもあたらない。経験豊富なメンバーが助言と支援を継続して与える形に書き替えればメンタリングやコーチングになるが、そのとき正解の肢もコーチングを含んだまま残るため、正答が2つになる。"},"quote":"例えば、自己学習やトレーニングは、専門的・方法論的な能力開発に適している。このため、テストに関する基本的な知識は、ISTQB®のトレーニングに参加するか、ISTQB®のシラバスに基づいて自己学習することで身に付けることができる。しかし、社会的および個人の能力を開発するためには、トレーニングやコーチングのアプローチを利用することを推奨する。これらは自己学習よりも効果が期待できることが多いためである。社会的交流、フィードバック、内省は、社会的能力、個人の能力を開発するための重要な成功要因である。","ref":"3.1.4","misconception":"能力開発のアプローチを手軽さや実務への近さで選んでおり、そのアプローチが伸ばすのがどの能力領域のスキルかを、不足している領域と突き合わせていない。とりわけ社会的能力と個人の能力についてシラバスが推奨しているのがトレーニングとコーチングであることを見ていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["スキル開発の5アプローチ","4つの能力領域"],"distractorIntent":["社会的能力の開発に自己学習を当てる","推奨されている形（トレーニング）であることに引かれ、教える中身が専門的能力のスキルであることを見ない","難しい課題を独力でやり切らせれば社会的能力も伸びると考え、伸びるのが方法論的能力であることを見ない"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.4 の領域別の適合と、3.1.1 の4つの能力領域の帰属。誤答3つは D1（帰属先の取り違え）で、不足している社会的能力ではない領域に効く手当てを置いた。誤答1は自己学習（原文が推奨文で名指しで対比している唯一の手段）、誤答2は専門的能力のスキル（テストタスクのマネジメント）を教えるトレーニング、誤答3は方法論的能力の定義そのもの（複雑度の高い課題を独自に遂行する）で、いずれも原文の記述1つで落ちる。公式 SET B 問46 a の裁定（自己学習は社会的・個人のスキル開発には推奨されない）に一致させた","mistakePatterns":["MP-17"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flipNote 3本とも真。r3 の中2件は解説の書き換え後も未返済（材料）","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"b657168afe61","explSig":"d1d4b0fd9465","fieldSig":{"explanation.ref":"a6d3cac4cc8d"}},{"lens":"item","date":"2026-09-12","round":3,"result":"pass","note":"自己開示は消えたまま。実質4択で、誤答3つとも選ぶ人を1文で書ける（常識で届く経路は中）","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12-r3.md","sig":"b657168afe61","explSig":"d1d4b0fd9465","fieldSig":{"選択肢1":"8c2d5c35c31e","選択肢3":"e23b345b1d65","選択肢4":"bf74c99b1fc7"}}]}},{"id":"q-3.1.4-A-2","lo":"TM-3.1.4","cluster":"3.1.4-A","clusterName":"スキル開発のアプローチ","variantAxis":"5つのアプローチの定義の弁別（学ぶ形態と人数）","variant":2,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーのスキルを向上させるアプローチの説明として、**適切でないもの**はどれか。1つ選べ。","choices":["ピアラーニングは、同僚同士が知識やアイデア、経験を共有し、互いに学び合うことである","自己学習は、教室で勉強するのではなく、書籍や録画教材などを使って一人で学ぶことである","メンタリングやコーチングは、複数の参加者にあらかじめ定めた内容を同時に教えることである","OJTは、自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたものである"],"answer":[2],"explanation":{"signals":"5つのアプローチは、学ぶ形態と関わる人数で分かれる。一人か、同僚同士か、経験者から未経験者へ個別にか、教室で複数人に一斉にか。この2軸で見ると、どの説明が別のアプローチのものかが決まる。","why":"シラバスはメンタリングやコーチングを、ある役割に就いて間もないチームメンバーがコーチから個別に指導を受けたり、経験豊富なメンターから知識やスキルや経験を得たりするアプローチだと定義している。複数の参加者にあらかじめ定義された知識や実践例を教えるのは、シラバスがトレーニングと教育として定義しているものである。公式サンプル問題も、トレーニングは通常複数の参加者と定義済みの内容を伴うのに対し、コーチングは個別で個人に合わせたものだと裁定している。なお、この記述の主語がトレーニングと教育であれば、シラバスの定義に一致する。誤っているのは記述の内容そのものではなく、その内容をメンタリングやコーチングに結び付けている点である。","distractors":["同僚同士が知識、アイデア、経験を共有し互いに学び合うという記述は、シラバスのピアラーニングの定義そのままである","教室で勉強するのではなく1人で勉強すること、という記述はシラバスの自己学習の定義そのままであり、本を読む、録画したビデオを見るといった例も原文に挙げられている",null,"自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたもの、という記述はシラバスのOJTの定義そのままである。トレーニングと教育が組み合わせの対象に入っていない点も原文どおりである"],"flip":[null,null,null,null],"flipNote":{"1":"この記述は原文のピアラーニングの定義そのままである。主語や中身を崩せばこの肢も「適切でないもの」の側に回るが、正解の肢は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。原文の定義が変わらない限り、この肢は答えにならない。","2":"この記述は原文の自己学習の定義そのままであり、本を読む・録画したビデオを見るという例も原文に挙げられている。記述を崩せばこの肢も「適切でないもの」の側に回るが、正解の肢は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。","4":"この記述は原文のOJT の定義そのままであり、組み合わせの対象にトレーニングと教育が入っていない点も原文どおりである。組み合わせの対象を書き替えればこの肢も「適切でないもの」の側に回るが、正解の肢は適切でないまま残るため、正答が2つになる。"},"quote":"トレーニングと教育は、通常は（バーチャルな）教室で、あらかじめ定義された知識や実践例を教えることである（例えば、トレーニングコースに人を派遣する、社内でトレーニングセッションを行う、自分たち向けのトレーニングを開発する、ライブのe ラーニングコースを利用する）。自己学習とは、（バーチャルな）教室で勉強するのではなく、1 人で勉強することである（例えば、本を読んだり、録画したビデオを見たり、インターネットのリソースを調べたりする）。ピアラーニングは、同僚同士が知識、アイデア、経験を共有し、互いに学び合うことである。メンタリングやコーチングは、ある役割に就いて間もないチームメンバーが、コーチから個別に指導を受けたり、経験豊富なメンターから知識やスキル、および/または経験を得たりするアプローチである。経験者は、アドバイスや支援を提供する継続的なリソースとして機能する。OJT は、自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたもので、広く知られている。","ref":"3.1.4","misconception":"能力開発のアプローチを名前でしか覚えておらず、個別か複数人か、教える内容があらかじめ定義されているか、といった定義の決め手で弁別できていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["スキル開発の5アプローチ"],"distractorIntent":["ピアラーニングの正しい定義","自己学習の正しい定義","OJTの正しい定義"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.4 の5アプローチの定義。否定形＋D12（誤答はすべて正しい定義）で構成し、正解にはコーチングとトレーニングの定義を入れ替えた記述を置いた。公式 SET B 問46 d／SET A 問46 a の裁定に一致する","mistakePatterns":["MP-17"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"4肢とも 3.1.4 の定義と逐語で照合できる。flipNote 3本とも真","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"0b2820434852","explSig":"676c8fec883f","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"定義の入れ替えは公式 問46 と同型。ただし正答は一般常識で切れる（中）","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12.md","sig":"0b2820434852","explSig":"676c8fec883f","fieldSig":{"meta.distractorTypes":"cafe7c875a3a","選択肢2":"cf2cf074ddd5","選択肢3":"ad1ec47f6403"}}]}},{"id":"q-3.1.5-A-1","lo":"TM-3.1.5","cluster":"3.1.5-A","clusterName":"テストチームのマネジメントスキル","variantAxis":"マネジメントスキルの層の区別（率いるために不可欠な社会的・個人の能力）","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームを率いるうえで不可欠な成功要因として、シラバスが社会的能力と個人の能力に挙げているものはどれか。1つ選べ。","choices":["困難が続いても立て直せることと、作業を他のメンバーに任せられること","作業の計画を立て、進み具合を追い、状況を関係者に報告できること","用いる開発ライフサイクルを理解し、テスト技法を選んで使えること","職場や社会の状況と労働条件を分析し、その結果を人材の確保に生かせること"],"answer":[0],"explanation":{"signals":"シラバスはマネジメントスキルを層に分けて書いている。計画・モニタリング・コントロール・報告といった基本的なマネジメント活動は専門的かつ方法論的な能力、テストアプローチやSDLCの知識は専門的能力、そして率いることとコーチすることに不可欠なものとして社会的能力と個人の能力を置いている。設問が求めているのは最後の層である。","why":"シラバスは、テストチームを率いるには社会的能力と個人の能力が不可欠な成功要因であるとし、これには回復力、委任する能力、テストチームに受け入れられる資質が含まれるとしている。困難が続いても立て直せることは回復力に、作業を他のメンバーに任せられることは委任する能力にそのまま対応する。残る3つもシラバスがマネジメントスキルとして挙げているものではあるが、基本的なマネジメント活動は専門的かつ方法論的な能力、テスト固有の知識は専門的能力、人材確保のための状況分析は別の段落に置かれており、率いるために不可欠な社会的能力・個人の能力としては列挙されていない。","distractors":[null,"計画、進捗のモニタリング、コントロール、報告は、シラバスが基本的なマネジメント活動として挙げ、そこに必要なのは専門的かつ方法論的な能力だとしている層である。マネジメントスキルではあるが、率いるために不可欠な社会的能力・個人の能力としては挙げられていない","異なるテストアプローチの知識、テスト技法の使用、適用するSDLCの理解は、シラバスが特定のテストマネジメントの知識とスキルとして挙げているものであり、専門的能力の側に属する。テストを預かる者に必須の知識ではあるが、問われている層とは別である","社会やチームの状況および労働条件を分析するスキルは、シラバスがテストチームの人材を確保するために求められるものとして別に挙げている。必要なスキルである点は正しいが、率いるために不可欠な社会的能力・個人の能力として列挙されているものではなく、分析という点では方法論的能力に寄る"],"flip":[null,null,null,null],"flipNote":{"2":"計画、進捗のモニタリング、コントロール、報告は、原文が「基本的なマネジメント活動における専門的かつ方法論的な能力」として挙げている層である。この記述を、立場の異なるステークホルダーとの合意形成や対立の解消の話に書き替えれば社会的能力に移るが、そのとき正解の肢（回復力と委任する能力）も残るため、正答が2つになり1つ選べが成り立たない。","3":"異なるテストアプローチの知識、テスト技法の使用、適用するSDLC の理解は、原文が「特定のテストマネジメントの知識とスキル」として別に挙げている層である。原文が率いるために不可欠な社会的能力・個人の能力として挙げているのは、回復力、委任する能力、テストチームに受け入れられる資質に加えて、テストの利益を主張し利点を促進すること、すべてのステークホルダーとコミュニケーションを取って対立を解決する能力であり、この肢が挙げる知識とスキルはそのどれにも当たらない。記述を社会的能力の側に寄せて書き替えても、正解の肢（回復力と委任する能力）はそのまま正しいため、正答が2つになり1つ選べが成り立たない。","4":"社会やチームの状況および労働条件を分析するスキルは、原文がテストチームの人材を確保するための段落に置いているものである。条件の調整と合意の取り付けまで含む記述に書き替えれば社会的能力の要素が入るが、原文が率いるために不可欠なものとして挙げる一覧に加わるわけではなく、加わったとしても正解の肢が残るため正答が2つになる。"},"quote":"テストチームを成功に導こうとする人は誰でもマネジメントスキルがなければならない。これには、基本的なマネジメント活動における専門的かつ方法論的な能力を含む（例：計画、進捗のモニタリング、コントロール、および報告）。テストには、特定のテストマネジメントの知識とスキルが必要である（例：異なるテストアプローチの知識、テスト戦略の開発、テスト技法の使用、または適用するSDLC の理解）。テストチームをリードする、またはコーチすることは、他のテストチームメンバーとの関係において適切に行動し、変化する状況に応じて成長する能力と意欲を持つことを意味する。したがって、テストチームを率いるには、社会的能力、個人の能力が不可欠な成功要因である。これには、回復力、委任する能力、テストチームに受け入れられる資質が含まれる。さらに、プロジェクトにおけるテストの利益を主張し、テストの利点を促進し、すべてのステークホルダーとコミュニケーションを取って対立を解決する能力も含まれる。","ref":"3.1.5","misconception":"マネジメントスキルを一枚岩の塊として覚えており、計画や報告といった基本的なマネジメント活動と、率いることやコーチすることに不可欠な社会的能力・個人の能力が、シラバスでは別の層として書かれていることを見ていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["マネジメントスキルの4層","4つの能力領域"],"distractorIntent":["基本的なマネジメント活動（専門的かつ方法論的）を社会的・個人の能力だと考える","テスト固有の知識（専門的能力）を社会的・個人の能力だと考える","人材確保のための分析スキルを、率いるために不可欠な社会的・個人の能力の列挙に含める"],"distractorTypes":["D1","D1","D3"],"conceptNote": :[0],"explanation":{"signals":"テスト担当者が日々の不満として挙げるもの（環境、仕様、修正されない欠陥）と、モチベーションを上げる要因は一致しない。シラバスは前者を衛生要因の側に置いており、満たしても自動的に満足感が増すわけではないが欠ければモチベーションが下がるものとして扱っている。","why":"シラバスはモチベーションを上げる要因として、仕事の達成に対する承認と評価、責任と自律性の向上、興味深く有意義でやりがいのあるタスク、プロフェッショナルとしての昇進と成長の4つを挙げている。一方、快適な労働条件は衛生要因に分類され、その例として曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境が挙げられている。テスト環境の安定、仕様の明確さ、欠陥の修正はこの例にそのまま含まれるため、モチベーションを上げる要因の例としては誤りである。なお原文は、これらの項目に条件を付けずに、快適な労働条件すなわち衛生要因の例として置いている。責任と自律性の向上の例として原文が挙げているのはテストチーム内でテストプロセスを定義することであり、テスト環境や仕様や欠陥の整備そのものではない。","distractors":[null,"テストチーム内でテストプロセスを定義することは、責任と自律性の向上の例としてシラバスが明記している","仕事の達成に対する承認と評価であり、シラバスがモチベーションを上げる要因の1つ目に挙げているものである。個別アプローチという例も原文に含まれる","経験豊富なテスト担当者からテストプロセスオーナーになるための成長は、プロフェッショナルとしての昇進と成長の例としてシラバスが明記している"],"flip":[null,null,null,null],"flipNote":{"2":"テストチーム内でテストプロセスを定義することは、原文が責任と自律性の向上の例として条件を付けずに挙げている。裁量が形式的である場合という限定は原文に無い。仮にそれを置いてこの肢を「適切でないもの」にしても、正解の肢（快適な労働条件＝衛生要因）は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。","3":"仕事の達成に対する承認と評価は、原文がモチベーションを上げる要因の1つ目に挙げており、テストチームメンバーが評価されるような個別アプローチという例も原文に含まれる。承認が形だけになる場合という限定は原文に無く、それを置いてもこの肢と正解の肢が同時に「適切でないもの」になるため、1つ選べが成り立たない。","4":"経験豊富なテスト担当者からテストプロセスオーナーになるための成長は、原文がプロフェッショナルとしての昇進と成長の例として明記している。到達できる枠が無い場合という限定は原文に無く、それを置いてもこの肢と正解の肢が同時に「適切でないもの」になるため、1つ選べが成り立たない。"},"quote":"モチベーションを上げる要因は意識的に認識され、成長と満足感につながる。これは以下を含む：仕事の達成に対する承認と評価（例えば、インセンティブや、テストチームメンバーが評価されるような個別アプローチ）責任と自律性の向上（例えば、テストチーム内でテストプロセスの定義すること）テストチームメンバーが、達成可能であり、同時に努力する価値があると認識する、興味深く、有意義で、やりがいのあるタスク（例：テスト自動化のための新しいツールの選択と導入）プロフェッショナルとしての昇進と成長（例えば、経験豊富なテスト担当者からテストマネージャーやテストプロセスオーナーになるための成長） 衛生要因は通常、当然のものと見なされる。それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていれば、テストチームのメンバーのモチベーションが下がる可能性がある：適切な報酬（例えば、市場に見合った給与、時間外手当、充実した社会保障）評価される人事方針とマネジメントスタイル（例えば、無駄のないマネジメント、現実的な目標、外部からの干渉や過負荷からの保護）快適な労働条件（例えば、曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境）。最低限必要な安全性（例えば、安全な職場と合意事項の遵守）良好な対人関係（例：同僚や上司との関係）","ref":"3.1.6","misconception":"テスト担当者が不満を言う対象を改善すればモチベーションが上がると考え、テスト環境の安定や仕様の明確さといった労働条件を、衛生要因ではなくモチベーションを上げる要因に分類している"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["モチベーション要因と衛生要因"],"distractorIntent":["承認と評価というモチベーション要因の正メンバー","責任と自律性の向上というモチベーション要因の正メンバー","昇進と成長というモチベーション要因の正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.6 のモチベーション要因4項目と衛生要因5項目。否定形＋D12 で構成し、正解には衛生要因「快適な労働条件」の例をそのまま置いた。公式 SET A 追加問題 #A11 の裁定（報酬・労働条件は衛生要因、承認と評価はモチベーション要因）に一致する","mistakePatterns":["MP-19"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flipNote 3本は真だが、監査が flip から外した「原文に無い限定」が why に残っている（中）","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"583a25212d85","explSig":"7335de0d3b46","fieldSig":{"explanation.why":"28354879a1e3","syllabus":"79c0ba4a0756"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"正答（テスト環境の安定＝衛生要因）が直感とずれる側にあり、MP-19 を正面から突く","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12.md","sig":"583a25212d85","explSig":"7335de0d3b46","fieldSig":{}}]}},{"id":"q-3.1.6-A-2","lo":"TM-3.1.6","cluster":"3.1.6-A","clusterName":"モチベーション要因と衛生要因","variantAxis":"衛生要因の性質（満たしても満足は増えないが、欠ければ下がる）","variant":2,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"シラバスが衛生要因について述べている内容として、適切なものはどれか。1つ選べ。","choices":["意識的に認識される要因であり、チームメンバーの成長と満足感につながるものである","当然のものと見なされ、満たしても満足感が増すとは限らず、欠ければモチベーションが下がる","満たされている限り意識されないため、テストマネジメントが継続的に取り除くべきものである","満たすことで生産性とパフォーマンスが直接高まり、プロジェクトの成功に大きな影響を与える"],"answer":[1],"explanation":{"signals":"衛生要因は、どの項目が属するかだけでなく、満たしたときと欠けたときで働き方が非対称であることまでが問われる。満たす方向では満足を生まず、欠ける方向ではモチベーションを下げる。この非対称性が、モチベーションを上げる要因との決定的な違いである。","why":"シラバスは衛生要因を、通常当然のものと見なされ、それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていればテストチームのメンバーのモチベーションが下がる可能性があるものだと述べている。したがって、衛生要因への投資は不満を防ぐことはできても、満足を買うことはできない。テストマネジメントに求められるのは、モチベーションを下げる要因を継続的に排除し、同時にモチベーションを上げる要因を作り出し強化することである。","distractors":["意識的に認識され、成長と満足感につながるのは、シラバスがモチベーションを上げる要因について述べている内容である。両者の説明を入れ替えて覚えていると選んでしまう",null,"継続的に排除すべきものとしてシラバスが挙げているのはモチベーションを下げる要因であり、衛生要因そのものではない。衛生要因は取り除く対象ではなく、欠けないように満たしておく対象である。語が近いため取り違えやすい","生産性とパフォーマンスを向上させ、プロジェクトの成功に大きな影響を与えるとシラバスが述べているのは、満足しモチベーションが高いテストチームメンバーについてである。衛生要因を満たすこと自体がその状態を作るわけではない"],"flip":[null,null,null,null],"flipNote":{"1":"選択肢は主語を持たず、何について述べた記述かは設問の「衛生要因について」が決めている。意識的に認識され、成長と満足感につながるのは原文がモチベーションを上げる要因について述べている内容であり、衛生要因についての記述としては原文と食い違ったままである。この肢が答えになるのは設問がモチベーションを上げる要因を問うたときであり、それは条件の変更ではなく設問の変更である。","3":"原文が「継続的に排除すべき」としているのはモチベーションを下げる要因であり、衛生要因は欠けないように満たしておく対象である。選択肢の対象を決めているのは設問の「衛生要因について」であるため、記述の対象をモチベーションを下げる要因に読み替えることは設問の変更にあたり、条件の変更ではない。衛生要因についての記述としては、原文と向きが逆のままである。","4":"生産性とパフォーマンスを向上させ、プロジェクトの成功に大きな影響を与えると原文が述べているのは、満足しモチベーションが高いテストチームメンバーについてである。選択肢の対象は設問の「衛生要因について」が決めているため、主語を読み替えることは設問の変更にあたる。衛生要因を満たすこと自体がその状態を作るという主張は、原文には無い。"},"quote":"衛生要因は通常、当然のものと見なされる。それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていれば、テストチームのメンバーのモチベーションが下がる可能性がある：適切な報酬（例えば、市場に見合った給与、時間外手当、充実した社会保障）評価される人事方針とマネジメントスタイル（例えば、無駄のないマネジメント、現実的な目標、外部からの干渉や過負荷からの保護）快適な労働条件（例えば、曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境）。最低限必要な安全性（例えば、安全な職場と合意事項の遵守）良好な対人関係（例：同僚や上司との関係）","ref":"3.1.6","misconception":"衛生要因を「満たせば満足が増えるもの」と読み、満たす方向では満足を生まず欠ける方向でのみモチベーションを下げるという非対称性を捉えていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["モチベーション要因と衛生要因"],"distractorIntent":["モチベーションを上げる要因の説明を衛生要因の説明だと考える","衛生要因と「モチベーションを下げる要因」を同一視し、排除の対象だと考える","衛生要因を満たすこと自体が生産性を直接高めると考える"],"distractorTypes":["D1","D8","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.6 の衛生要因の定義文と、モチベーションが生産性に効く経路を述べた冒頭の文。同一クラスタの q-3.1.6-A-1 が帰属（どちらの要因か）を問うのに対し、本問は要因の性質そのものを問う","mistakePatterns":["MP-19"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"衛生要因の非対称性は原文どおり。flipNote 3本の「設問の変更であって条件の変更ではない」も妥当","ref":"jstqb-al-tm/kb/reviews/K2-3.1-syllabus-2026-09-13-t3.md","sig":"e7f43c6a3329","explSig":"018f9f381b90","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答1（モチベーション要因の定義）・誤答3（下げる要因との混同）とも選ぶ理由を書ける","ref":"jstqb-al-tm/kb/reviews/K2-3.1-item-2026-09-12.md","sig":"e7f43c6a3329","explSig":"018f9f381b90","fieldSig":{}}]}},{"id":"q-1.2.7-A-1","lo":"TM-1.2.7","cluster":"1.2.7-A","clusterName":"プロジェクトのコンテキストからテストマネジメント活動を決める","variantAxis":"本番で表面化した症状から、欠けているテストマネジメント活動を逆にたどる（公式問7型・症状の列挙／5択TWO）","variant":1,"chapter":1,"section":"1.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは航空券と宿泊をまとめて予約できるオンライン旅行サービスのテストマネージャーである。開発は2週間の反復で進め、できた機能は随時本番に出している。利用者の8割はスマートフォンから予約し、決済は3社の代行サービスを使い分けている。\n\n先週の連休直前に出した版で、次の3つが起きた。ひとつ、予約が集中した時間帯に検索が返らなくなったが、応答時間や同時に使える人数は、そもそも確認すべき項目として挙がっていなかった。ふたつ、国内拠点と海外拠点が同じ画面を二重に見ていた一方、在庫連携の異常系はどちらの担当でもないまま抜けていた。みっつ、欠陥の滞留も反復ごとの計画とのずれも、出荷判定の会議で初めて共有された。","question":"次の反復から手を打つ。この3つに直接応えるテストマネジメント活動として、優先して着手すべきものを2つ選べ。","choices":["機能の要求と非機能の要求の両方を洗い出して計画上のテストの範囲に入れ直し、あわせて拠点ごとの担当範囲と役割、拠点間で何をいつ引き継ぐかの段取りを計画に書き込む。","反復ごとに各拠点で探索的テストのセッションを設け、回帰テストのケース数も1.5倍に増やして、これまで表に出ていなかった不具合を数多く見つける。","反復ごとの計画に照らして実行の進み具合と欠陥の滞留を継続的に確かめる枠組みを置き、そこで見えたずれを受けて、本番へ出してよいかを何を根拠に誰が決めるのかを先に取り決める。","性能の確認まで手が回らない状況なので、来月から実行担当を2名増やし、拠点ごとに反復あたりのテスト実行件数の目標値を割り当てて進み具合を測る。","性能テストと回帰テストをCI/CDパイプラインに組み込んで毎晩自動で流し、実行結果と欠陥の滞留を、拠点を問わず全員が見られるダッシュボードに常時映し出す。"],"answer":[0,2],"explanation":{"signals":"効くのは3つの症状そのものである。ひとつ目は、応答時間や同時に使える人数が確認すべき項目として挙がっていなかったこと。ふたつ目は、二重に見ていた画面と誰の担当でもない抜けが同時に起きたこと。みっつ目は、欠陥の滞留と計画とのずれが出荷判定の会議まで共有されなかったことである。3つとも、実行した量ではなく、範囲の決め方・役割の決め方・状況を追って進退を決める段取りという、計画とモニタリングとコントロールの側に原因がある。利用者の8割がスマートフォンであることと、決済代行を3社使い分けていることは、どの選択肢の当否にも関与しない。","why":"症状をひとつずつ活動に戻す。応答時間や同時に使える人数が確認すべき項目として挙がっていなかったのは、実行の失敗ではなく範囲の決め方の失敗である。シラバスは包括的なスコープ定義について、完全なテストカバレッジを確保するためにすべての機能要件と非機能要件を識別することを含む、と述べている。したがって手当ては、機能と非機能の両方を洗い出して計画上の範囲に入れ直すことになる。二重に見ていた画面と誰の担当でもない抜けが同時に起きたのは、拠点の間で誰が何を持つかが決まっていないからである。シラバスはリソース配置戦略を単なる配置にとどまらないものとし、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含むとしたうえで、分散している環境ではこの点の維持がとりわけ重要になると名指ししている。この2つはどちらもテスト計画の活動なので、1つの案にまとめられる。\n残るみっつ目は性質が違う。欠陥の滞留も計画とのずれも、起きていた事実は同じでも、出荷判定の会議まで誰の目にも留まらなかったことが問題である。シラバスは実行の監視を、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることと定めている。ただし追うだけでは出荷の場面は変わらない。シラバスは品質ゲートマネジメントをテストコントロールの項目に置き、何が品質ゲートかを定義し、情報に基づいた意思決定を行うことを含むとしている。追跡する枠組みと、本番へ出してよいかを何を根拠に誰が決めるのかを先に決めておくことが組になって、初めてみっつ目の症状に応える。計画とモニタリングとコントロールの3群のうち、どれか1つで閉じた案はこの3つの症状を覆えない。","distractors":[null,"3つの症状はどれも、実行した量が足りないという形では現れていない。シラバスは包括的なスコープ定義に、完全なテストカバレッジを確保するためにすべての機能要件と非機能要件を識別することを含むと述べており、応答時間や同時に使える人数が落ちたのは識別の段階の欠落である。すでに挙がっているケースを1.5倍に増やしても、挙がっていない要求は増えた分のどこにも現れない。探索的テストを反復ごとに回すこと自体は有効で、抜けていた異常系が偶然見つかることもあるため、手数を増やす案は現場で最も早く効きそうに見える。しかしそれは誰がどこを持つかという役割の空白も、滞留とずれが会議まで共有されない段取りも動かさない。",null,"性能の確認に人手が回るようになる点で、ひとつ目の症状には届いているように見える。しかしシラバスはリソース配置戦略について、これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む、と述べている。人数を足して拠点ごとに実行件数の目標値を配ることは、この文が単なる配置と呼んでそれだけでは足りないとしている側で止まっており、在庫連携の異常系をどちらの拠点が持つのかという空白はそのまま残る。実行件数を測ることが進み具合の追跡に見えるのも、確立した計画に照らしたレビューではなく、出来高の集計にとどまる点で異なる。","この案は3つの症状のうち2つに正面から触れている。性能テストをパイプラインに載せる点も、欠陥の滞留を全員に見えるようにする点も、それ自体は正しい。足りないのは、見えたずれを受けて何を変えるのかである。シラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することと定め、品質ゲートマネジメントには何が品質ゲートかを定義し、情報に基づいた意思決定を行うことを含めている。出荷判定の会議で初めて分かったという症状は、数字が表示されていなかったから起きたのではなく、何をもって出してよいとするかと、それを決める人が先に決まっていなかったから起きている。加えて、毎晩自動で流す対象は計画上の範囲に入っているものに限られるため、そもそも挙がっていなかった非機能の要求はパイプラインに載せる段階でも現れない。"],"flip":[null,null,null,null,null],"flipNote":{"2":"この案が正面の答えになるのは、ひとつ目の症状が「応答時間や同時に使える人数は確認すべき項目として挙がっていたが、反復の中で消化しきれず未実施のまま出荷した」という形に変わったときである。ただしそのときも、ふたつ目の症状（誰の担当でもない抜け）に応える案と、みっつ目の症状に応える案はどちらも正しいままなので、優先して着手すべきものが3つになり、2つ選べという形式が成り立たなくなる。範囲の決め方と役割の決め方という2つの症状を1つの案がまとめて引き受けている構造なので、症状をひとつ動かしてもこの案が入る席はできない。","4":"この案には独立した誤りが2つある。増員が効くのは、性能の確認が計画上の範囲には入っていたのに手が回らなかった場合だが、ここで起きているのは項目そのものの挙げ漏れである。もう1つは追う尺度で、拠点ごとの実行件数は出来高の集計であって、確立した計画に照らしたレビューではない。前者だけを動かしても後者が残り、両方を動かすと今度は優先して着手すべきものが3つになって2つ選べが成り立たない。1条件では反転しない。","5":"この案が欠いているのは、見えたずれを受けて何を変えるのかの取り決めである。それを補うには、みっつ目の症状を「滞留とずれを追う枠組みも、本番へ出してよいかの根拠と決定者も定まっているのに、拠点ごとに別々の表で見ていて全員が同じ数字を見られない」という形に変える必要があり、追う枠組みと出荷の取り決めという2つをどちらも既にあるものとしなければならない。片方だけでは、その2つを組にして置く案が正しいまま残り、この案は2つ目の席を取れない。1条件では反転しないため、条件は書かない。"},"quote":"これには、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別す
