対象に入らないままで、裏付けの側も、実行件数と欠陥が解決するまでの日数という目安からは取り出せない。シラバスも、テストが多すぎると、リスクレベルを軽減する利点よりもコストが高くなる可能性がある、と述べている。"],"flip":[null,null,null,null],"flipNote":{"1":"扱う個人情報の範囲が広がったという一文を、範囲は当初のままだという内容に差し替えても、差し替えの外に3つの文が残る。運用開始の前に外部の監査を受けることが決まったという一文、追ってきた目安が反復あたりの実行件数と欠陥が解決するまでの日数だという一文、そして庁内が最優先に置いた、どの要件をどのテストで確認したのかを裏付けとともに示せる状態にするという一文である。監査は4名の枠の中で何を先に確かめるかの決め直しを求め、その最優先に照らせば、実行件数と日数という目安のままでは要件とテストの対応は示せない。この案は、様式を固め、これまでの結果と挙げてある懸念を整理し直し、同じ様式で記録を積み上げて監査の窓口へ渡すという運びで、対象と優先度の組み替えにも目安の張り直しにも触れない。一方、懸念を洗い直して対象と優先度を組み替え、目安まで置き換える案は、範囲を戻しても、後ろ2つの要素がその3文に正面から応えるので立ったままである。妥当な案が2つになるので、この案だけを答えにするには、範囲の差し替えに加えて、監査が対象と優先度の決め直しを求めないことか、追ってきた目安がすでに要件とテストの対応を示すものであることまで要る。条件が2つになるので、ここには条件を書かない。","3":"この案が置かれているのは、シラバスがテストモニタリングの側に挙げている開発チームとのコラボレーションである。協働そのものは求められており、広がった範囲を扱ってもいる。ただしこの状況で庁内が置いた最優先は、確認したことを裏付けとともに示せる状態にすることであり、それを作るのは読み合わせの場ではなく、何を確かめるべきかの洗い直しと、それに合わせて張り直した目安である。最優先の一文を、設計の段階で行き違いを減らすことに差し替えると、今度は広がった範囲を何で確かめるのかが誰にも決まっていないという状態が残り、懸念を洗い直して計画に反映する案がそのまま正しいので、妥当な案が2つになる。","4":"この案には独立した誤りが2つある。ひとつは、足りないものを量と読んだことで、直近の反復でも計画どおりの件数を消化しているという一文がこれを退ける。もうひとつは、増やした件数の中身が着手時に一度きり行った洗い出しの内側にとどまることで、広がった分はそこに挙がっていない。件数を消化しきれていない状況に差し替えても、広がった分が対象に入らないことは変わらず、洗い出しをやり直した世界にすると、今度は対象と優先度を組み替える案が先に立つ。どちらか一方を動かしても残る誤りがこの案を退けるので、ひとつの条件では入れ替わらない。"},"quote":"テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。","ref":"1.1.1（再計画）、1.1.2（モニタリングの枠組み）、1.2.7（リスクアセスメントと軽減計画／適応的なプロセスマネジメント）、3.2.2（テストの費用対効果の関係）","misconception":"途中で外からの求めが加わったときに、テストの対象と手数だけを足し引きして、着手時に置いた懸念の洗い出しと、計画に照らして追ってきた目安のほうを張り直さない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["監査に示す様式を整えることを先に置き、広がった範囲の懸念がまだ挙がっていないことを見ていない","開発との協働の場を、確認の裏付けを作る手立ての代わりに置く","広がった範囲に対して実行件数と時間の増加で応え、足りないのが量ではないことを見ていない"],"distractorTypes":["D4","D4","D13"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-34","MP-07"]}},{"id":"q-1.2.7-D-2","lo":"TM-1.2.7","cluster":"1.2.7-D","variant":2,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは電力小売会社の料金計算システムのテストマネージャーである。稼働は来年4月の制度改定に合わせる予定で、残り5か月ある。開発は2週間の反復で進めている。ここまでの経過は次のとおりである。\n\n・着手時: 懸念を挙げて重みを付け、確かめる対象と順位を決めた。この挙げ方はいまもそのまま使っている\n・以後の各反復: 反復あたりのケース消化数と、欠陥が閉じるまでの日数を目安に、計画に照らして追ってきた\n・先月: 蓄電池を置く家庭向けの買取メニューも同じ仕組みで扱うことが決まり、計算の対象が広がった\n・同じ先月: 稼働の前に本社の内部監査を受けることが決まった\n・今月: 経営企画から、いちばんに置くのは、稼働までに、どの料金の決まりをどのテストで確かめたのかを裏付けとともに示せる状態にすることだと示された\n\n稼働の日も、テストにあてられる5名の要員も変えられない。直近の反復でも計画どおりのケースを消化しており、反復の初めに計画を見直す時間はこれまでどおり取れている。問い合わせは検針の直後に増える。","question":"残り5か月のテストマネジメント活動として、最も適切な判断はどれか。1つ選べ。","choices":["扱う計算の型が増えた分は手数で吸収することにして、反復あたりのケース消化数の目標を引き上げ、テストにあてる時間を一日あたり延ばして、残りの反復で消化する。","広がった計算の決まりについて、開発と設計の担当を交えた読み合わせの場を反復ごとに設け、確かめるべき観点を設計の段階から出し合って、取り違えを早いうちに見つける。","内部監査の求めに合わせた提出物の雛形を先に決め、これまでの実施の記録と挙がっている懸念を、どの決まりをどのテストで確かめたのかが読み取れる形に並べ替えて、以後の反復も同じ雛形で積み上げる。","広がった対象について懸念を挙げ直して重みを付け替え、5名のままで何をどの順で確かめるかを計画の側で引き直し、これまでの目安も、どの決まりをどのテストで確かめられたのかが見えるものへ入れ替える。"],"answer":[3],"explanation":{"signals":"読むべきは、経過の中で変わったものと、変わらずに続いているものの組である。変わったのは、蓄電池を置く家庭向けの買取メニューも同じ仕組みで扱うことが決まって計算の対象が広がったこと、稼働の前に本社の内部監査を受けることになったこと、そして経営企画がいちばんに置くものを示したことである。続いているのは、着手時に懸念を挙げて重みを付けたその挙げ方をいまもそのまま使っていることと、追ってきた目安が反復あたりのケース消化数と欠陥が閉じるまでの日数であることである。稼働の日も5名の要員も変えられない。直近の反復でも計画どおりのケースを消化していることは、足りないのが手数ではないことを示す。問い合わせが検針の直後に増えることは、どの案の当否にも効かない。","why":"採るべきは、広がった対象について懸念を挙げ直して重みを付け替え、5名のままで何をどの順で確かめるかを計画の側で引き直し、これまでの目安も、どの決まりをどのテストで確かめられたのかが見えるものへ入れ替える案である。途中で扱うものと求められるものが変わったのに、懸念の挙げ方も追う目安も着手時のまま使われている、という一点がこれを選ばせている。\nまず計画の側へ戻る理由である。先月、蓄電池を置く家庭向けの買取メニューも同じ仕組みで扱うことが決まり、計算の対象が広がった。シラバスは、テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである、と述べ、テストコントロールについても、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めている。何を確かめるべきかを決めているのは着手時の挙げ方であり、着手時: 懸念を挙げて重みを付け、確かめる対象と順位を決めた。この挙げ方はいまもそのまま使っている、という経過が示すとおり、そこへ戻らない限り広がった分はどの活動の対象にも入らない。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、としている。\n次に、目安まで入れ替える理由である。稼働の日も、テストにあてられる5名の要員も変えられない以上、挙げ直しの結果は何をどの順で確かめるかの引き直しとして現れる。ところが追ってきたのは、以後の各反復: 反復あたりのケース消化数と、欠陥が閉じるまでの日数を目安に、計画に照らして追ってきた、というものである。引き直したあとにこの目安を据え置くと、追う数字は引き直す前の計画に対するものになり、今月: 経営企画から、いちばんに置くのは、稼働までに、どの料金の決まりをどのテストで確かめたのかを裏付けとともに示せる状態にすることだと示された、という求めにも届かない。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。目安は計画書や戦略の目的につながっている必要があり、目的が動いたならつなぎ直す側も動く。これを人を足さずに置けるのは、反復の初めに計画を見直す時間がこれまでどおり取れているからである。","distractors":["対象が広がった分だけ確かめることが増えるという読みは自然で、消化数の目標を上げて時間を延ばす案は、いちばん早く動かせる手にも見える。しかしこの経過で足りていないのは手数ではない。直近の反復でも計画どおりのケースを消化しており、反復の初めに計画を見直す時間はこれまでどおり取れている。そのうえ経営企画が示したのは消化数ではなく、どの料金の決まりをどのテストで確かめたのかを裏付けとともに示せる状態である。消化数の目標を上げても、着手時の挙げ方の外にある決まりは対象に入らないままで、シラバスがテストマネージャーに求める、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めること、には近づかない。","広がった計算の決まりについて開発と設計の担当を交えて読み合わせ、確かめるべき観点を設計の段階から出し合うことは、シラバスが開発チームとのコラボレーションとしてテストモニタリングの側に挙げている活動であり、広がった対象に正面から向き合ってもいる。取り違えを早く見つけられれば、残り5か月の手戻りも減る。それでも、今月: 経営企画から、いちばんに置くのは、稼働までに、どの料金の決まりをどのテストで確かめたのかを裏付けとともに示せる状態にすることだと示された。読み合わせの場を反復ごとに重ねても、どの決まりがどのテストで確かめられたのかは、それ自体としては残らない。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、としている。","内部監査の求めに合わせて提出物の雛形を先に決め、これまでの記録と挙がっている懸念を読み取れる形に並べ替えるこの案は、経営企画が示した求めに正面から応えているように見えるし、この並べ替えは稼働までにどこかで要る作業でもある。届かないのは対象のほうである。着手時: 懸念を挙げて重みを付け、確かめる対象と順位を決めた。この挙げ方はいまもそのまま使っている、という経過のとおり、買取メニューが加わって広がった分はまだそこに挙がっていない。挙がっていない決まりは、雛形をどれだけ整えても記録の中に現れない。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、と述べており、雛形を整えることはこの分析の代わりにはならない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案には独立した誤りが2つある。1つは、足りないものを手数と読んだことで、直近の反復でも計画どおりのケースを消化しており、反復の初めに計画を見直す時間はこれまでどおり取れている、という経過がこれを退ける。もう1つは、増やした消化の中身が着手時の挙げ方の内側にとどまることで、買取メニューが加わって広がった分はそこに挙がっていない。消化が追いつかない状況に差し替えても、広がった分が対象に入らないことは変わらず、挙げ直しが済んだ世界にすると、今度は何をどの順で確かめるかを引き直す案が先に立つ。どちらか一方を動かしても残る誤りがこの案を退けるので、1つの条件では入れ替わらない。","2":"この案が置いているのは、シラバスがテストモニタリングの側に挙げている開発チームとのコラボレーションである。協働そのものは求められており、広がった対象も扱っている。ただしこの経過で経営企画が示したのは、確かめたことを裏付けとともに示せる状態にすることであり、それを作るのは読み合わせの場ではなく、何を確かめるべきかの挙げ直しと、それに合わせて張り直した目安である。いちばんに置くものを、設計の段階で取り違えを減らすことに差し替えると、今度は広がった対象を何で確かめるのかが誰にも決まっていない状態が残り、懸念を挙げ直して計画へ戻す案がそのまま正しいので、妥当な案が2つになる。","3":"計算の対象が広がったという経過の一行を、対象は当初のままだという内容に差し替えても、差し替えの外に3つが残る。稼働の前に内部監査を受けることが決まったこと、追ってきた目安が反復あたりのケース消化数と欠陥が閉じるまでの日数であること、そして経営企画が示した、どの料金の決まりをどのテストで確かめたのかを裏付けとともに示せる状態にすることである。監査は5名の枠の中で何を先に確かめるかの決め直しを求め、その求めに照らせば、消化数と日数という目安のままでは決まりとテストの対応は示せない。この案は雛形と並べ替えと積み上げで止まり、何をどの順で確かめるかの引き直しにも目安の張り直しにも触れない。一方、挙げ直して引き直し、目安まで入れ替える案は、対象を戻しても後ろ2つの要素がその3つに応えるので立ったままである。この案だけを答えにするには、対象の差し替えに加えて、監査が決め直しを求めないことか、追ってきた目安がすでに決まりとテストの対応を示すものであることまで要り、条件が2つになる。"},"quote":"テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。","ref":"1.1.1（再計画）、1.1.2（モニタリングの枠組み）、1.2.7（リスクアセスメントと軽減計画／適応的なプロセスマネジメント）、3.2.2（テストの費用対効果の関係）","misconception":"途中で扱うものと求められるものが変わったときに、確かめる手数や提出物の体裁だけを動かして、着手時に置いた懸念の挙げ方と、計画に照らして追ってきた目安のほうを張り直さない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["広がった対象に消化数と時間の増加で応え、足りないのが手数ではないことを見ていない","開発・設計との読み合わせの場を、確かめたことの裏付けを作る手立ての代わりに置く","監査に出す雛形を整えることを先に置き、広がった対象の懸念がまだ挙がっていないことを見ていない"],"distractorTypes":["D13","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-34","MP-07"]}},{"id":"q-1.2.7-D-3","lo":"TM-1.2.7","cluster":"1.2.7-D","variant":3,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは総合病院の検体検査システムのテストマネージャーである。開発は4週間の反復で進めており、来年度初めの本稼働まで残り6か月ある。テストはこれまで、反復あたりの確認済み項目数と、不具合が直るまでの日数を目安に、計画に照らして追ってきた。懸念の挙げ出しは着手のときに一度行ったきりで、その重み付けもそのまま使っている。\n\n先々月、遺伝子検査の項目もこの仕組みで扱うことが決まり、外部の検査機関とのやり取りが増えた。あわせて、本稼働の前に第三者機関の点検を受けることが決まった。本稼働の日も、テストにあてられる6名の要員も動かせない。運営会議では、いちばんに置くのは、本稼働までに、どの検査の手順をどのテストで確かめたのかを裏付けとともに示せる状態にすることだと確認された。\n\n直近の反復でも予定どおりの項目を確認できている。反復の初めに計画を見直す時間は、これまでどおり取れている。外来の受付は午前に集中する。","question":"残り6か月について、テストマネージャーが下す判断として最も妥当なものはどれか。1つ選べ。","choices":["増えた項目について懸念の一覧を作り直して重み付けをやり直し、6名の枠を動かさずに確かめる対象と順位を組み直して計画へ戻し、いまの目安の中身も、どの手順をどのテストで確かめられたのかが読み取れるものへ差し替える。","扱う項目が増えた分は手数で吸収することにして、反復あたりの確認済み項目数の目標を引き上げ、テストにあてる時間を一日あたり延ばして、残りの反復で確認する。","第三者機関へ出す資料の体裁を先に決め、これまでの確認の記録と挙がっている懸念を、どの手順をどのテストで確かめたのかが読み取れる形に並べ直し、以後の反復も同じ体裁で積み上げて点検の担当へ渡す。","増えた項目について外部の検査機関と開発を交えた読み合わせの場を反復ごとに設け、確かめるべき観点を設計の段階から出し合って、取り違えを早いうちに見つける。"],"answer":[0],"explanation":{"signals":"効くのは、途中で加わったものと、着手時のまま続いているものの対である。加わったのは、遺伝子検査の項目もこの仕組みで扱うことが決まって外部の検査機関とのやり取りが増えたこと、本稼働の前に第三者機関の点検を受けることになったこと、そして運営会議が置いた最優先である。続いているのは、懸念の挙げ出しが着手のときの一度きりで重み付けもそのままであることと、追ってきた目安が反復あたりの確認済み項目数と不具合が直るまでの日数であることである。本稼働の日も6名の要員も動かせない。直近の反復でも予定どおりの項目を確認できていることは、足りないのが手数ではないことを示す。外来の受付が午前に集中することは、どの案の当否にも効かない。","why":"下すべき判断は、増えた項目について懸念の一覧を作り直して重み付けをやり直し、6名の枠を動かさずに確かめる対象と順位を組み直して計画へ戻し、いまの目安の中身も、どの手順をどのテストで確かめられたのかが読み取れるものへ差し替えることである。扱うものと求められるものが途中で変わったのに、懸念の挙げ出しも追う目安も着手時のまま使われている、という一点がこれを選ばせている。\nまず計画へ戻る理由である。先々月、遺伝子検査の項目もこの仕組みで扱うことが決まり、外部の検査機関とのやり取りが増えた。シラバスは、テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである、と述べ、テストコントロールについても、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めている。何を確かめるべきかを決めているのは着手時の挙げ出しであり、懸念の挙げ出しは着手のときに一度行ったきりで、その重み付けもそのまま使っている以上、そこへ戻らない限り増えた項目はどの活動の対象にも入らない。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、としている。\n次に、目安まで差し替える理由である。本稼働の日も、テストにあてられる6名の要員も動かせないのだから、一覧の作り直しの結果は対象と順位の組み直しとして現れる。ところが、テストはこれまで、反復あたりの確認済み項目数と、不具合が直るまでの日数を目安に、計画に照らして追ってきた。組み直したあとにこの目安を残すと、追う数字は組み直す前の計画に対するものになり、運営会議が置いた、いちばんに置くのは、本稼働までに、どの検査の手順をどのテストで確かめたのかを裏付けとともに示せる状態にすることだと確認された、という求めにも届かない。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。目安は計画書や戦略の目的につながっている必要があり、目的が動けばつなぎ直す側も動く。これを人を足さずに置けるのは、反復の初めに計画を見直す時間がこれまでどおり取れているからである。","distractors":[null,"項目が増えた分だけ確かめることが増えるという読みは自然で、確認済み項目数の目標を引き上げて時間を延ばす案は、現場でいちばん早く動かせる手にも見える。しかしこの状況で足りていないのは手数ではない。直近の反復でも予定どおりの項目を確認できている。そのうえ運営会議が置いたのは項目数ではなく、どの検査の手順をどのテストで確かめたのかを裏付けとともに示せる状態である。目標を引き上げても、着手のときの挙げ出しの外にある手順は対象に入らないままで、シラバスがテストマネージャーに求める、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めること、には近づかない。","第三者機関へ出す資料の体裁を先に決め、これまでの記録と挙がっている懸念を読み取れる形に並べ直すこの案は、運営会議の求めに正面から応えているように見えるし、この並べ直しは本稼働までにどこかで要る作業でもある。届かないのは対象のほうである。懸念の挙げ出しは着手のときに一度行ったきりで、その重み付けもそのまま使っている。遺伝子検査の項目が加わって増えた分は、まだそこに挙がっていない。挙がっていない手順は、体裁をどれだけ整えても記録の中に現れない。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、と述べており、体裁を決めることはこの分析の代わりにはならない。","増えた項目について外部の検査機関と開発を交えて読み合わせ、確かめるべき観点を設計の段階から出し合うことは、増えた項目に正面から向き合っている。このうち開発と交わす部分は、シラバスが開発チームとのコラボレーションとしてテストモニタリングの側に挙げている、開発チームと緊密な協力関係を維持することに当たる。ただし、外部の検査機関を交えることのほうは、シラバスが計画・モニタリング・コントロールの活動として挙げているどの項目にも出てこない。取り違えを早く見つけられれば、残り6か月の手戻りも減る。それでも、いちばんに置くのは、本稼働までに、どの検査の手順をどのテストで確かめたのかを裏付けとともに示せる状態にすることだと確認された。読み合わせの場を反復ごとに重ねても、どの手順がどのテストで確かめられたのかは、それ自体としては残らない。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、としている。"],"flip":[null,null,null,null],"flipNote":{"2":"この案には独立した誤りが2つある。1つは、足りないものを手数と読んだことで、直近の反復でも予定どおりの項目を確認できているという一文がこれを退ける。もう1つは、引き上げた項目数の中身が着手のときの挙げ出しの内側にとどまることで、遺伝子検査の項目が加わって増えた分はそこに挙がっていない。項目を消化しきれていない状況に差し替えても、増えた分が対象に入らないことは変わらず、挙げ出しをやり直した世界にすると、今度は対象と順位を組み直す案が先に立つ。どちらか一方を動かしても残る誤りがこの案を退けるので、1つの条件では入れ替わらない。","3":"外部の検査機関とのやり取りが増えたという一文を、扱う項目は当初のままだという内容に差し替えても、差し替えの外に3つが残る。本稼働の前に第三者機関の点検を受けることが決まったこと、追ってきた目安が反復あたりの確認済み項目数と不具合が直るまでの日数であること、そして運営会議が置いた、どの検査の手順をどのテストで確かめたのかを裏付けとともに示せる状態にすることである。点検は6名の枠の中で何を先に確かめるかの決め直しを求め、その求めに照らせば、項目数と日数という目安のままでは手順とテストの対応は示せない。この案は体裁と並べ直しと積み上げで止まり、対象と順位の組み直しにも目安の差し替えにも触れない。一方、一覧を作り直して組み直し、目安まで差し替える案は、項目を戻しても後ろ2つの要素がその3つに応えるので立ったままである。この案だけを答えにするには、項目の差し替えに加えて、点検が決め直しを求めないことか、追ってきた目安がすでに手順とテストの対応を示すものであることまで要り、条件が2つになる。","4":"この案が開発と交わす部分は、シラバスがテストモニタリングの側に挙げている開発チームとのコラボレーションに当たる。ただし、外部の検査機関を交えることのほうは、シラバスが計画・モニタリング・コントロールの活動として挙げているどの項目にも出てこない。開発との協働そのものは求められており、増えた項目も扱っている。そして、この状況で運営会議が置いたのは、確かめたことを裏付けとともに示せる状態にすることであり、それを作るのは読み合わせの場ではなく、何を確かめるべきかの一覧の作り直しと、それに合わせて差し替えた目安である。いちばんに置くものを、設計の段階で取り違えを減らすことに差し替えると、今度は増えた項目を何で確かめるのかが誰にも決まっていない状態が残り、懸念の一覧を作り直して計画へ戻す案がそのまま正しいので、妥当な案が2つになる。"},"quote":"テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。","ref":"1.1.1（再計画）、1.1.2（モニタリングの枠組み）、1.2.7（リスクアセスメントと軽減計画／適応的なプロセスマネジメント）、3.2.2（テストの費用対効果の関係）","misconception":"途中で扱うものと求められるものが加わったときに、確かめる手数や提出物の体裁だけを動かして、着手時に置いた懸念の挙げ出しと、計画に照らして追ってきた目安のほうを張り直さない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["増えた項目に確認済み項目数と時間の増加で応え、足りないのが手数ではないことを見ていない","点検に出す資料の体裁を整えることを先に置き、増えた項目の懸念がまだ挙がっていないことを見ていない","外部の検査機関と開発を交えた読み合わせの場を、確かめたことの裏付けを作る手立ての代わりに置く"],"distractorTypes":["D13","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-34","MP-07"]}},{"id":"q-1.3.1-A-1","lo":"TM-1.3.1","cluster":"1.3.1-A","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、リスクベースドテストの進め方を新しいメンバーに説明している。","question":"リスクコントロールにあたる活動として最も適切なものはどれか。1つ選べ。","choices":["挙がっている懸念の進み具合を追い、新しく出てきた懸念を一覧に加える","関係する部署から、どこが壊れると業務が止まるかを挙げてもらう","挙がった項目を、起こりやすさと起きたときの痛みの度合いで段位付けする","一覧の見直しは、テストを一巡して全体の姿が見えてから、まとめて行う"],"answer":[0],"explanation":{"signals":"効くのは「リスクコントロールにあたるか」という指定だけである。新しいメンバーへの説明という場面は、リスク分析とリスクコントロールのどちらの話をしているかを示すだけで、どれが答えかを変えない。4つとも現場で実際に行う活動であり、実務上の正しさでは区別がつかない。","why":"挙がっている懸念の進み具合を追い、新しく出てきた懸念を一覧に加える ── これがリスクモニタリングであり、シラバスはリスクコントロールをリスクモニタリングとリスク軽減で構成している。だからこの活動がリスクコントロールに当たる。関係する部署にどこが壊れると業務が止まるかを挙げてもらうのはリスク識別、挙がった項目を起こりやすさと痛みの度合いで段位付けするのはリスクアセスメントであり、シラバスはどちらもリスク分析の側に置いている。一覧の見直しをテスト一巡後にまとめて行うという話は、活動がどちらに属するかではなく、いつ行うかの話である。さらにシラバスは、テストモニタリングにリスクモニタリングを含めるべきだとし、既知の品質リスクの進展をモニタリングすることに加え、新たな品質リスクを分析してリスクレジスターを調整することも含めるべきだと述べている。懸念の進展を追いながら新しいものを一覧に加える行為は、この記述にそのまま重なる。","distractors":[null,"どこが壊れると業務が止まるかを関係者から挙げてもらう行為はリスク識別であり、リスク分析の側に属する。リスクベースドテストの入口にある活動なので「まずこれをやる」という順序の感覚から選ばれやすいが、問われているのは順序ではなく、リスク分析とリスクコントロールのどちらに属するかである","起こりやすさと痛みの度合いから段位を付けるのはリスクアセスメントであり、これもリスク分析の側である。リスクレベルを扱う点がコントロールらしく見えるが、レベルを決める段はリスク分析に、決めたあとの進展を追う段はリスクコントロールにあり、属する側が違う","一覧の見直しを後ろへ寄せる進め方である。全体像が見えてからの方が精度が高いという論拠は現場で実際に語られるが、シラバスはリスクモニタリングをテストモニタリングに含めるべきものとしており、1.3.6 もリスク分析を継続的でイテレーティブな活動としている。まとめて一度行うものではない"],"flip":[null,null,null,null],"flipNote":{"2":"どこが壊れると業務が止まるかを関係者から挙げてもらう行為は、シラバスがリスク分析の一方の柱として挙げるリスク識別にあたる。行為の中身は正しく、誤っているのはそれをリスクコントロールの側に置いた点だけである。したがってこの選択肢が正解になるのは、リスクコントロールとリスク分析のどちらを問うかを入れ替えたときであり、それはシナリオや選択肢の条件の変更ではなく設問の変更である。しかも問う先をリスク分析に替えると、同じリスク分析の側にある、起こりやすさと痛みの度合いで段位を付ける記述も同時に正しくなり、正解が2つになって1つ選べの形が壊れる","3":"起こりやすさと痛みの度合いから段位を付ける行為は、シラバスがリスク分析のもう一方の柱として挙げるリスクアセスメントであり、リスクレベルの決定の手順そのものである。リスクレベルを扱う点はコントロールらしく見えるが、属しているのは分析の側である。この選択肢が正解になるのは、リスクコントロールとリスク分析のどちらを問うかを入れ替えたときだけで、それは条件の変更ではなく設問の変更である。しかも問う先をリスク分析に替えると、同じ側にある、どこが壊れると業務が止まるかを挙げてもらう記述も同時に正しくなり、正解が2つになって1つ選べの形が壊れる","4":"この選択肢の誤りは行為の中身ではなく、見直しを一度にまとめて後ろへ寄せた点にある。シラバスはリスクモニタリングをテストモニタリングに含めるべきものとし、1.3.6 はリスク分析を継続的でイテレーティブな活動であって初めに一度だけ実施するものではないと述べている。リスク分析とリスクコントロールのどちらを問う設問に変えても、まとめて一度行う進め方を支える記述が原文に無い"},"quote":"リスク分析は、リスク識別およびリスクアセスメントからなる。リスクコントロールは、リスクモニタリングとリスク軽減からなる。","ref":"1.3.1","misconception":"リスクベースドテストの活動を「分析してから対応する」という時間順でしか覚えておらず、リスク識別とリスクアセスメントがリスク分析に、リスクモニタリングとリスク軽減がリスクコントロールに属するという対応を区別できていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["リスク識別をリスクコントロールの側に置く","リスクアセスメントをリスクコントロールの側に置く","リスクの見直しは後でまとめて行えばよいと考える"],"distractorTypes":["D1","D1","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-30"]}},{"id":"q-1.3.1-A-2","lo":"TM-1.3.1","cluster":"1.3.1-B","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、洗い出した懸念をテストの進め方にどう反映するかを整理している。","question":"リスクの軽減がテスト活動に分散して現れる例として最も適切なものはどれか。1つ選べ。","choices":["新しく出てきた懸念の扱いは、次のイテレーションの計画をつくるときにまとめて検討する","洗い出した項目それぞれに、起こりやすさと痛みの度合いから段位を割り当てる","事前の洗い出しの結果を使い、適した技法を選んで重い領域にテストを集中させる","重い懸念には、あらかじめ回避策を用意し、外部から調達する部分については供給元に引き取ってもらう"],"answer":[2],"explanation":{"signals":"効くのは「リスクの軽減がテスト活動に分散して現れる例か」という一点である。洗い出した懸念を進め方に反映しようとしている場面設定は、話題の在りかを示すだけで、どれが答えかを変えない。4つとも実際に行う活動であり、行為として妥当かどうかでは絞れない。","why":"事前の洗い出しの結果を使い、適した技法を選んで重い領域にテストを集中させる ── シラバスがリスク軽減の現れとして挙げている例の1つが、そのままこの形である。シラバスはリスク軽減がいくつかのテスト活動に分散して行われると述べ、例えば品質リスク分析の結果は、正しい技法を使って正しい領域にテストを集中させるためにテスト計画に使用する、としている。同じ箇所は、テスト分析ではリスクレベルがカバーすべきテスト条件の選択の指針となること、テスト実行ではリスクを基にした優先順位付けが実行の順序を決定することも、分散して現れる形として挙げている。起こりやすさと痛みの度合いから段位を割り当てるのはリスクアセスメントであり、シラバスがリスク分析の側に置いている活動である。回避策の用意と供給元への引き取りは、1.3.4 がその他のリスク軽減の手段として挙げるコンティンジェンシープランとサードパーティへのリスク移転にあたり、軽減の手立てではあるがテスト活動ではない。新しく出てきた懸念の扱いを次のイテレーションの計画づくりまでまとめて持ち越す進め方は、テストモニタリングに新たな品質リスクの分析とリスクレジスターの調整まで含めるべきだという記述の側から外れる。","distractors":["新しく出てきた懸念の検討を次の計画づくりまで持ち越す進め方である。まとめて扱う方が段取りがよいという論拠は現場で通るが、シラバスはテストモニタリングにリスクモニタリングを含め、新たな品質リスクを分析してリスクレジスターを調整することまで含めるべきだと述べている","起こりやすさと痛みの度合いから段位を割り当てるのはリスクアセスメントであり、リスク分析の側の活動である。軽減の土台を作る行為なので軽減そのものに見えるが、シラバスはリスク分析（リスク識別とリスクアセスメント）とリスクコントロール（リスクモニタリングとリスク軽減）を別のまとまりとして並べている",null,"回避策の用意と供給元への引き取りは、シラバスが 1.3.4 でその他のリスク軽減の手段として挙げているコンティンジェンシープランとサードパーティへのリスク移転にあたり、重い懸念への対応としてそれ自体は正しい。しかしどちらもテスト活動ではない。シラバスがここで述べているのは、リスク軽減がいくつかのテスト活動に分散して行われることであり、その例として挙がるのがテスト計画・テスト分析・テスト実行である"],"flip":[null,null,null,null],"flipNote":{"1":"設問が問うているのは、リスク軽減がテスト活動に分散して現れる例であり、シラバスがその例として挙げているのはテスト計画・テスト分析・テスト実行での現れ方である。新しく出てきた懸念の扱いを次の計画づくりまで持ち越す進め方はそのどれにも当たらず、シラバスはむしろテストモニタリングに新たな品質リスクの分析とリスクレジスターの調整を含めるべきだとしている。持ち越す相手を変えても、この選択肢を正解にする条件は原文の中に無い","2":"起こりやすさと痛みの度合いから段位を割り当てる行為は、シラバスがリスク分析に置くリスクアセスメントである。シラバスはリスク分析とリスクコントロールを別のまとまりとして並べており、この活動がリスク軽減の分散先の側へ移る条件はシナリオにも選択肢にも無い。リスク分析に当たる活動を問う形にすれば選ぶ側に立つが、それは条件の変更ではなく設問の変更である","4":"この選択肢がつまずいているのは手立ての中身ではなく置き場所である。回避策の用意はコンティンジェンシープラン、供給元への引き取りはサードパーティへのリスク移転にあたり、シラバスは 1.3.4 でどちらもリスク軽減の手段として挙げているので、手立てとしての正しさのほうは動かしようがない。動かせるとすれば「テスト活動に分散して現れる例」という問いの側だが、テストの外側の手段を問う形に替えることは条件の変更ではなく設問の変更である。書かれている行為のままテスト計画・テスト分析・テスト実行のどれかへ寄せる道は無い"},"quote":"リスク軽減は、いくつかのテスト活動に分散して行われる。例えば、品質リスク分析の結果は、正しい技法を使って正しい領域にテストを集中させるためにテスト計画に使用する。テスト分析では、リスクレベルがカバーすべきテスト条件の選択の指針となる。テスト実行では、リスクを基にした優先順位付けが、テスト実行の順序を決定する。","ref":"1.3.1, 1.3.4","misconception":"リスク軽減をテスト実行の段だけの話と考え、テスト計画での技法と領域の選択や、テスト分析でのテスト条件の選択も軽減の現れであることを結び付けられていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["リスクアセスメントを軽減の分散先として数える","新たに出た懸念の扱いを次の計画づくりまで持ち越す","テスト以外のリスク軽減の手段を、テスト活動に分散した軽減の例として数える"],"distractorTypes":["D1","D7","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-05","MP-08"]}},{"id":"q-1.3.2-A-1","lo":"TM-1.3.2","cluster":"1.3.2-A","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、開発・運用・営業・問い合わせ窓口の担当者を1つの部屋に集めた。進行役を立て、前回のリリースで起きた不具合も引き合いに出しながら、あらかじめ用意した観点の一覧に沿って、どこが壊れると業務が止まるかを順に挙げてもらった。","question":"ここで用いた品質リスクの識別技法として最も適切なものはどれか。1つ選べ。","choices":["過去の経験の参照","ブレーンストーミング","チェックリスト","リスクワークショップ"],"answer":[3],"explanation":{"signals":"効くのは場面に現れた属性の組み合わせである。立場の異なる複数の担当者が、1つの場に、同時に集まり、進行役が付き、あらかじめ用意した観点に沿って進んでいる。前回の不具合を引き合いに出した点と、観点の一覧を用意した点は、それぞれ別の技法にも現れる属性であり、そこだけを見ると答えが割れる。","why":"立場の違う担当者を1つの部屋に集め、進行役のもとで用意した観点に沿って懸念を挙げてもらう ── この場そのものを名指す技法がリスクワークショップである。シラバスは、ステークホルダーが品質リスクを識別するために使える技法として、専門家インタビュー、独自のアセスメント、ふりかえり、リスクワークショップ、ブレーンストーミング、チェックリスト、過去の経験の参照を並べ、この1つ以上を通じて識別できると述べている。ここで起きているのは、複数の部署のステークホルダーを同時に集めて協働させることであり、それを指す語がリスクワークショップである。過去の経験の参照とチェックリストも同じ一覧に載っている独立した技法だが、ここでは前回の不具合が材料として、用意した観点の一覧が進行の道具として、場の内側で使われているにすぎず、場の性格そのものを説明していない。自由に発想を出し合って挙げていく技法も同じ一覧にあるが、この場面の聴取は用意した観点に沿って順に挙げてもらう形であり、思いついたものを自由に出していく進め方はここには現れていない。","distractors":["前回のリリースで起きた不具合を引き合いに出している点が一致する。過去の事例を参照することは独立した技法として挙げられているが、この場面ではあくまで材料の1つであり、複数の関係者を集めた場を指す語ではない","複数人が口頭で懸念を挙げていく形は似ており、発想を広げる手法がワークショップの中で使われることもある。しかしこの場面には進行役と用意された観点があり、進め方が構造化されている。発想を広げる手法そのものを指す語では、この場面の説明として足りない","あらかじめ用意した観点の一覧に沿っている点が一致するため、最も引かれやすい。ただし一覧はここでは進行の道具として使われているにすぎず、複数の部署の担当者を同時に集めて協働させるという、場そのものの性格を説明していない",null],"flip":[null,null,null,null],"flipNote":{"1":"この語が答えになるまでに外すものは、第1文の、担当者を1つの部屋に集めた場と、第2文の、進行役を立てて順に挙げてもらう進め方の、2か所である。第1文だけを外しても第2文の進行役と「順に挙げてもらった」が残り、進行役のもとで複数人が用意した観点に沿って洗い出す姿はそのままなので、答えはその場を指す語のまま1つで、この語は立たない。第2文だけを過去の不具合を見返すだけの形に替えると、第1文の場が残り、その場を指す語と並び立って正答が2つになる。しかも2か所を替えてなお、あらかじめ用意した観点の一覧が残れば、答えは一覧に沿って確認する語の側へ移る。この語は、その一覧も落として手がかりを過去の不具合だけに絞って初めて答えになる。条件が2つ必要なため、1つの条件では反転しない","2":"自由に発想を出し合って挙げていく手法は、シラバスが品質リスクの識別技法の1つとして挙げているものであり、行為の中身そのものは誤っていない。ただしこの場面でリスクワークショップを支えている属性は、立場の違う担当者を1つの部屋に集めたという場（第1文）と、進行役を立てて用意した観点に沿って進めたという進め方（第2文）に分かれて置かれている。第2文だけを、思いついたものを自由に出していくだけの場に差し替えても、第1文の場はそのまま残るため、その場を指す語と並び立って正答が2つになる。場も同時に外すには条件が2つ要るため、1つの条件では反転しない","3":"あらかじめ用意した観点の一覧に沿って確認する姿は、この場面に既に現れている。シラバスはチェックリストを識別技法の1つとして挙げており、行為の中身は誤っていないが、ここでの一覧は進行の道具として使われているにすぎない。この語が最も適切になるには、複数の担当者を1つの部屋に集めた場（第1文）を外すことと、進行役のもとで順に挙げてもらう進め方（第2文）を一人で一覧を確認する形に替えることの、2か所の書き換えが要る。第2文だけを替えれば第1文の場が残り、その場を指す語が答えのまま並び立って正答が2つになる。条件が2つ必要なため、1つの条件では反転しない"},"quote":"ステークホルダーは、以下の技法の1つ以上を通じて、品質リスクを識別することができる：専門家インタビュー／独自のアセスメント／ふりかえり／リスクワークショップ／ブレーンストーミング／チェックリスト／過去の経験の参照","ref":"1.3.2","misconception":"場面に出てきた目立つ道具（用意した観点の一覧、過去の不具合）を手がかりに技法名を決めてしまい、複数のステークホルダーを同時に集めて進行役のもとで協働させるという、場の性格そのものを見ていない"},"meta":{"concept":"品質リスクの識別","distractorIntent":["複数人で挙げる場をすべて発想法と呼ぶ","観点の一覧があることを技法の決め手にする","過去の不具合を材料にしたことを技法そのものと取り違える"],"distractorTypes":["D8","D8","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-31"]}},{"id":"q-1.3.2-A-2","lo":"TM-1.3.2","cluster":"1.3.2-B","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、関係者から品質上の懸念を集める段取りを組んでいる。","question":"この段取りの進め方として**適切でないもの**はどれか。1つ選べ。","choices":["副産物として出た納品の遅れや環境の不備も、品質上の懸念と同じ一覧に載せてテストで減らす","日程が合わない人には、少なくとも代理を立てて意見を出してもらう機会を用意する","参加してもらう人の顔ぶれに欠けがないかを、プロジェクトマネージャーと突き合わせて合意しておく","懸念の重さは対象の中で場所ごとに違うという前提で、機能のまとまりごとに個別に洗い出す"],"answer":[0],"explanation":{"signals":"効くのは、問われているのが品質リスクの識別としての進め方である点だけである。4つとも実際の段取りで出てくる行為であり、単独で見ればどれも不自然ではない。分かれ目は、リスクベースドテストが何を焦点に置いているかにある。","why":"副産物として出た納品の遅れや環境の不備を、品質上の懸念と同じ一覧に載せてテストで減らす ── この進め方だけが、リスクベースドテストの焦点から外れている。シラバスは、リスク識別がしばしば副産物を生み出すと述べたうえで、プロジェクトリスクは品質リスク識別の副産物としてしばしば識別されるが、リスクベースドテストの焦点ではないと明記している。納品の遅れやテスト環境の不備は、プロジェクトの進行が損なわれる事象であって、プロダクトに品質問題が存在する状況ではない。テストマネージャーがこれらの副産物を強調し、品質が全員の関心事であることを明確にする役割を果たすことはシラバスも述べているが、それは品質上の懸念と同じ一覧に並べ、テストで減らす対象として扱うことではない。残る3つ ── 参加できない人に少なくとも代理を立てて意見を出してもらう機会を用意すること、参加してもらう人の顔ぶれに欠けがないかをプロジェクトマネージャーと突き合わせて合意しておくこと、リスクはテスト対象内に一様に分布しないという前提で機能のまとまりごとに個別に洗い出すこと ── は、いずれもシラバスが品質リスクの識別の進め方として求めていることである。","distractors":[null,"シラバスは、関係するステークホルダー全員に参加の機会を与えることが重要であり、参加できない場合は少なくともタスクを委任する機会を与えるべきだと述べている。日程の都合で外れる人が出ることは避けられないため実務でも悩ましく見えるが、ここに書かれているのはシラバスが求めている手当てそのものである","シラバスは、参加するステークホルダーのリストが包括的でありプロジェクトマネージャーと合意していることを確認することが不可欠であるとし、重要なステークホルダーが欠けている識別は大きな問題となる可能性があると述べている。正しい進め方であり、否定形の設問では残す側にあたる","シラバスは、リスクはテスト対象内に一様に分布しないことを理解することが重要であるとし、さまざまなテストアイテムの個々のリスクを識別することはテスト計画において重要なタスクだと述べている。これも正しい進め方である"],"flip":[null,null,null,null],"flipNote":{"2":"この記述は、参加できないステークホルダーに少なくともタスクを委任する機会を与えるべきだというシラバスの求めそのものであり、原文が変わらない限り不適切にはならない。設問を肯定形にすれば選ぶ側に立つが、そのときは同じく原文が求めている残り2つの進め方も並び立ち、1つ選べの形が成り立たない","3":"参加するステークホルダーのリストが包括的でありプロジェクトマネージャーと合意していることの確認を、シラバスは不可欠だと述べている。設問を肯定形にすると、この記述だけでなく、原文が同じく求めている残り2つの進め方も正しい答えになる。1つの条件でこの選択肢だけを正解にすることはできない","4":"リスクはテスト対象内に一様に分布しないという前提でテストアイテムごとに識別することを、シラバスはテスト計画において重要なタスクだと述べている。肯定形にすれば選ぶ側に立つが、そのとき正しくなる選択肢は3つになる"},"quote":"プロジェクトリスクは、品質リスク識別の副産物としてしばしば識別されるが、リスクベースドテストの焦点ではない。","ref":"1.3.2","misconception":"識別の場に挙がったものはすべてリスクベースドテストの対象になると考え、プロダクトの品質問題とプロジェクトの進行の問題を同じ一覧で扱ってしまう"},"meta":{"concept":"品質リスクの識別","distractorIntent":["参加者の包括性の確認を、識別の進め方から外れたものと見る","代理を立てる機会の用意を、識別の進め方から外れたものと見る","リスクが一様に分布しない前提を、識別の進め方から外れたものと見る"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-01"]}},{"id":"q-1.3.3-A-1","lo":"TM-1.3.3","cluster":"1.3.3-A","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、挙がってきた懸念それぞれについて、どれくらい起こりやすいかを見積もろうとしている。","question":"その起こりやすさを左右する要因として最も適切なものはどれか。1つ選べ。","choices":["影響を受ける機能が日常の業務で使われる頻度の高さ","不具合が出ても業務を回せる回避策が用意されていないこと","上流の段階で品質を確かめる活動が行われていないこと","止まったときに損なわれるビジネス上の目標の重さ"],"answer":[2],"explanation":{"signals":"効くのは「起こりやすさの側か、起きたときの痛みの側か」という一点である。4つともシラバスが要因として挙げているものであり、要因として正しいかどうかでは絞れない。どちらのリストに載っているかだけが分かれ目になる。同じ『〜ていない』という欠如の形で書かれた2つが並んでいる点にも注意がいる。","why":"上流の段階で品質を確かめる活動が行われていないこと ── シラバスが「早期の品質保証活動の欠如」としてリスク可能性を左右する要因に並べている項目がこれであり、だから起こりやすさの側の要因になる。シラバスはリスクレベルの決定を、リスク可能性とリスク影響のアセスメントに分け、それぞれに要因のリストを与えている。リスク可能性の側に並ぶのは、技術・ツール・システムアーキテクチャの複雑度、組織の成熟度、個人の課題事項、チーム内の対立、地理的に分散したチーム、時間やリソースからのプレッシャー、変更率の高さなど、作る過程と体制に関わるものである。上流で品質を確かめていなければ、欠陥が作り込まれたまま先へ進む度合いが上がる。残る3つ ── 影響を受ける機能の使用頻度、適切な回避策の欠如、影響を受けるビジネスゴールの重要性 ── は、どれもリスク影響を左右する要因のリストの側に並んでおり、故障が起きたあとにビジネスが何を失うかを決める。見積ろうとしているのが起こりやすさである以上、選ぶのは可能性のリストに載っている要因になる。","distractors":["影響を受ける機能の使用頻度は、シラバスがリスク影響を左右する要因の先頭に挙げているものである。よく使われる機能ほど不具合に当たる場面が増えるという読み方ができるため可能性の側と感じられやすいが、シラバスの帰属は影響の側にある","適切な回避策の欠如は、シラバスがリスク影響を左右する要因として挙げているものである。正答と同じ『〜が行われていない／用意されていない』という欠如の形で書かれているため最も紛らわしいが、回避策の有無は欠陥が作り込まれる度合いを変えるものではなく、出たあとに業務を続けられるかどうかを決める",null,"影響を受けるビジネスゴールの重要性も、リスク影響を左右する要因である。重要な目標に関わる箇所ほど慎重に作られるはずだという読み方から可能性の側に寄せられることがあるが、シラバスはこれを、故障したときに何を失うかを表す要因として置いている"],"flip":[null,null,null,null],"flipNote":{"1":"影響を受ける機能の使用頻度は、シラバスがリスク影響を左右する要因の先頭に挙げているものである。設問を影響の側に変えればこの記述は正しくなるが、残る2つの選択肢も同じ影響側のリストの項目なので同時に正しくなり、1つ選べの形が壊れる。影響側のリストの中でこの項目だけを選ばせる条件は原文に無い","2":"適切な回避策の欠如も、シラバスがリスク影響を左右する要因として挙げているものである。設問を影響の側に変えると、この記述だけでなく残る2つの選択肢も同時に正解になる。なお回避策を用意することは 1.3.4 のコンティンジェンシープランにあたり、可能性ではなく影響の側を下げる手立てである","4":"影響を受けるビジネスゴールの重要性も、シラバスの影響側のリストの項目である。設問を影響の側に変えれば正しくなるが、そのとき正解になる選択肢は3つになり、一意にならない"},"quote":"品質リスクにおけるリスク可能性を左右する要因には、以下のようなものがある：技術、ツール、またはシステムアーキテクチャの複雑度／組織の成熟度／使用しているSDLCに関する知識を含む、スキル、可用性、モチベーション、または作業に関する自主性といった個人の課題事項／チーム内の対立／サプライヤーとの契約上の問題／地理的に分散したチーム／経営陣や技術陣のリーダーシップが弱い／時間、リソース、予算、マネジメントからのプレッシャー／早期の品質保証活動の欠如／テストベース、プロダクト、人員の変更率が高い。リスク影響を左右する要因には以下を含む：影響を受ける機能の使用頻度／影響を受ける機能の重要性／影響を受けるビジネスゴールの重要性／評判へのダメージ／事業収入の損失／財政的、環境的、または社会的な損失、もしくは賠償責任の可能性／民事または刑事上の法的制裁／インターフェースや統合の課題事項／適切な回避策の欠如／安全性のニーズ","ref":"1.3.3","misconception":"「〜が用意されていない／行われていない」という形の要因をひとまとめに扱い、早期の品質保証活動の欠如が起こりやすさの側、適切な回避策の欠如が痛みの側にあるという帰属の違いを区別できていない"},"meta":{"concept":"品質リスクアセスメント","distractorIntent":["適切な回避策の欠如を起こりやすさの側に置く","使用頻度の高さを起こりやすさと読み替える","ビジネスゴールの重要性を起こりやすさの側に置く"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-03"]}},{"id":"q-1.3.3-A-2","lo":"TM-1.3.3","cluster":"1.3.3-B","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたのプロジェクトには使える統計データが乏しく、関係者は起こりやすさも痛みの度合いも「非常に高い／高い／中程度／低い／非常に低い」の段階でしか言えない。","question":"この状況でリスクレベルを総合する進め方として最も適切なものはどれか。1つ選べ。","choices":["5段階を5から1の数値に置き換えて積を求め、その合計が基準を下回る項目を受容する","2つの段階をマトリクスで組み合わせ、総合した結果を相対的な順位として扱う","起こりやすさの段階が高い順に並べ、痛みの度合いは同じ段階に並んだ項目の順序を決めるときに使う","総合して出た段階を、案件をまたいで意味の変わらない水準として読み、他の案件で同じ段階が付いた項目と同じ重さで扱う"],"answer":[1],"explanation":{"signals":"効くのは、関係者が段階でしか言えないという一点である。統計として使えるデータが乏しいことが明示されており、パーセンテージや金額は与えられていない。手元にあるのが順序の情報だけであることが、総合の仕方を決める。","why":"2つの段階をリスクマトリクスで組み合わせ、出てきた総合したリスクレベルを相対的な順位として扱う ── これがこの場面で採る進め方である。シラバスは、リスク分析が広範かつ統計的に有効なリスクデータに基づいている場合は定量的アセスメントが適切であり、リスクレベルは2つの要因の積として計算できるとする一方、通常はリスク可能性とリスク影響が順序尺度でのみ定性的にしか把握できないとし、その場合は両者をリスクマトリクスで組み合わせて総合したリスクレベルを作り、それを順序尺度による定性的な相対評価として解釈すべきだと述べている。使える統計データが乏しく、関係者が段階でしか言えないと明示されているこの場面は後者にあたる。段階を5から1の数値に置き換えて積と基準値を作る進め方は、順序尺度が持っていない間隔の情報を持ち込む。起こりやすさを主な軸に置き、痛みの度合いを同じ段階に並んだ項目の並べ替えにだけ使う進め方は、リスク可能性とリスク影響を組み合わせてリスクレベルを決定するという形になっていない。総合して出た段階を案件をまたいで意味の変わらない水準として読む進め方は、相対評価として解釈すべきだという記述に反する。","distractors":["段階を数値に置き換えて積を取り、合計に基準を引く進め方である。数字になると議論が収束しやすく実務でも見かける形だが、順序尺度には段階どうしの間隔の情報がない。シラバスは総合したリスクレベルを順序尺度による定性的な相対評価として解釈すべきだと述べており、基準値による受容の判定は、存在しない精度を作り出している",null,"起こりやすさを主な軸に置き、痛みの度合いを同じ段階に並んだ項目の並べ替えにだけ使う進め方である。両方の情報を使っている形になっているため見分けにくいが、この置き方では、起こりにくいが起きれば致命的な項目が上位に来ることはない。シラバスはリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、片方を従属させた並びは組み合わせたことにならない","2つの段階を組み合わせて総合するところまでは、この場面の進め方に合っている。案件をまたいで同じ言葉で危険度を語りたいという要求は組織の中に実際にあるが、シラバスは、総合したリスクレベルは順序尺度による定性的な相対評価として解釈すべきだと述べている。段階の意味は、その分析に参加したステークホルダーの主観的認識と、そのプロジェクトの項目の並びに依存しており、別の案件の同じ段階と同じ重さを持つ保証はない"],"flip":[null,null,null,null],"flipNote":{"1":"可能性をパーセンテージで、痛みの度合いを金額で見積もれるだけの統計データがこの案件にあれば、2つを掛け合わせて積を求めるところまでは正しくなる。シラバスが定量的アセスメントの例として挙げているのはその形である。しかしこの進め方はそこからさらに、求めた積を合計し、その合計が基準を下回る項目を受容するところまで含んでいる。積を合計することも、基準値を下回る項目をまとめて受容することも 1.3.3 には述べられておらず、残存リスクとして受容してよいのは相対的に最も低い位置にあるリスクだとする公式サンプル問題の解説とも向きが逆である。データの性質を替えても誤りがもう1つ残るため、1つの条件では反転しない","3":"シラバスはリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、片方を主な軸に置き他方を同順位の並べ替えにだけ使う形を支える記述は無い。痛みの度合いがどの項目でも同程度である場面を仮定しても、2つの段階をマトリクスで組み合わせる進め方が同じ順序を返して正しいままであり、この選択肢が単独の正解にはならない","4":"総合したリスクレベルを案件をまたいで同じ重さで読むには、この案件の段階が統計的に有効なデータで裏付けられていることに加えて、比較する相手の案件でも同じ裏付けと同じ定義が使われている必要がある。条件が2つ要るため、1つの条件では反転しない。シラバスがこの場面のような順序尺度について述べているのは、総合したリスクレベルを順序尺度による定性的な相対評価として解釈すべきだということであり、段階の意味を案件をまたいで動かない水準として読む形を支える記述は無い"},"quote":"リスク可能性とリスク影響の値は、リスクマトリクスで組み合わし、総合したリスクレベルが作成される。この総合したリスクレベルは、順序尺度による定性的な相対評価として解釈すべきである。","ref":"1.3.3","misconception":"順序尺度のラベルを数値に置き換えれば計算してよいと考え、段階どうしの間隔が定義されていないため、積や合計や閾値には意味が生まれないことに気づいていない"},"meta":{"concept":"品質リスクアセスメント","distractorIntent":["順序尺度を数値に置き換えて計算してよいと考える","起こりやすさを主な軸に置き、痛みの度合いを従属的な指標に落とす","総合したリスクレベルを、案件をまたいで通用する絶対的な水準として解釈する"],"distractorTypes":["D6","D4","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-06","MP-03"]}},{"id":"q-1.3.4-A-1","lo":"TM-1.3.4","cluster":"1.3.4-A","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはオンライン損害保険の契約申込システムのテストマネージャーである。このシステムは金融庁の監督指針の対象で、保険料計算の正確性については検証の根拠を記録として残すことが求められている。利用者は個人・代理店・法人窓口と幅広い。\n\n制約として、本番同等の負荷環境は月に1回・4時間しか確保できず、リリースまでに使える枠は1回だけである。実機での表示確認は、情報セキュリティ規程により外部の端末サービスを使えないため、社内に用意した主要3機種までしかできない。リリースは繁忙期の直前で、日程は動かせない。\n\n洗い出した懸念とその評価は次のとおりである。","table":{"caption":"洗い出した懸念の評価（影響額の単位は百万円）","headers":["ID","内容","発生可能性","影響額"],"rows":[["A","保険料の計算を誤り、過少請求のまま契約が成立する","20%","400"],["B","申込のピーク時に応答が遅延し、利用者の離脱が発生する","60%","80"],["C","保険料試算結果のグラフが一部の端末で崩れる","70%","10"],["D","本人確認書類のアップロードでデータが破損する","15%","200"]]},"question":"評価された数値と、明記された制約の両方を踏まえた対応計画として、最も適切なものはどれか。1つ選べ。","choices":["Cのグラフ崩れを主要3機種で確認して表示系に人手を厚く配分し、Bには4時間の枠をそのまま充てる。AとDは結合テストの範囲にとどめ、検証の根拠はその記録をもって残す。","Aは開発と並行して探索的テストで確認し、Bには本番同等の環境をもう1系統用意して長時間の負荷テストを行う。Dは結合テストで確認し、Cは主要3機種で確認する。","Aを要件由来のテストで網羅的に検証して根拠を記録に残し、成立後は独立に実装した参照計算と突合して差異を検知し訂正につなぐ。Bは4時間の枠をピーク時間帯に絞って使い、Dは結合レベルでデータ完全性を確認する。Cは主要3機種にとどめて受容する。","Dにはデータ完全性のテストを厚く配分し、Bには4時間の枠のうち1時間を割いて傾向を確認する。Aは要件を網羅するテストで検証して根拠を記録に残し、成立後は別に実装した参照計算との突合で差異を拾い出し、訂正に回す。Cは主要3機種にとどめて受容する。"],"answer":[2],"explanation":{"signals":"効くのは表の8つの数値と、本文に置かれた制約である。保険料計算の正確性については検証の根拠を記録として残すこと、本番同等の負荷環境はリリースまでに1回・4時間しか使えないこと、実機での表示確認は主要3機種までであること。積を取ると A=80 > B=48 > D=30 > C=7 となり、発生可能性だけの順（C>B>A>D）とも影響額だけの順（A>D>B>C）とも一致しない。どの案も並べ方の原則を宣言していないので、順位は配分の中身から読み取るほかなく、自分で積を計算しないと決まらない。主要3機種の上限はどの案も守っているので、そこでは差が付かない。記録と負荷環境の枠で落ちるのは、本番同等の環境をもう1系統用意するとした案である。残る3案の当否を決めるのは、積の順に配れているかどうかである。うち、保険料計算に最も厚く配る案と、本人確認書類のアップロードを厚くして負荷の枠を1時間に削る案は、最上位の保険料計算に対するテスト以外の手当てを同じ形で持っているので、この2案の差は2番手をどちらに置くかに絞られる。表示崩れに人手を厚く寄せる案は、順位で外れるうえに、保険料計算については結合テストの記録を残すだけで、成立後に誤りを拾う手当ては置いていない。「利用者は個人・代理店・法人窓口と幅広い」は、どの案の当否にも関与しないノイズである。","why":"発生可能性と影響額の積を取ると、保険料計算の誤りが 0.2×400＝80 で4件のうち最も重く、以下は応答遅延（0.6×80＝48）、アップロードのデータ破損（0.15×200＝30）、グラフ崩れ（0.7×10＝7）と続く（単位は百万円）。だから正解は、その保険料計算に最も厚く配り、要件由来のテストで網羅的に検証して検証の根拠を記録に残したうえで、成立後は独立に実装した参照計算と突き合わせて差異を訂正につなぐ案である。この案は労力をその順に配ったうえで、検証の根拠を記録に残すという監督指針由来の求め、負荷環境が1回・4時間であること、実機での表示確認が主要3機種までであることのいずれにも収まっている。\nシラバスは、テストの開発と実行に関連する時間と労力はリスクレベルに比例すべきであり、高いリスクレベルに対するテストは早期に開始してより厳密なテスト技法を用いるべきであるとしている。そのうえで、テストを通じて全体的なリスクを最もよく軽減するために、テストアイテム・品質特性・テストレベルとテストタイプ・SDLC・テストチーム・規制要件といったコンテキストに基づく要因を分析して適切なテストアプローチを選択すべきだとしている。保険料計算を要件由来のテストで網羅的に検証して根拠を記録に残すことは規制要件に、応答遅延の確認を4時間の枠に収めることはテスト環境の可用性に、データ破損を結合レベルで扱うことはテストレベルの選択に、それぞれ対応している。\nさらに保険料計算については、テストの外側にも手当てが置かれている。シラバスはテストを最も重要な品質リスク軽減活動としたうえで、その他のリスク軽減の手段としてコンティンジェンシープラン（回避策の提供など）、サードパーティへのリスク移転、リスク受容などが考えられるとしている。成立後に差異を検知して訂正につなぐこの手続きが、原文の挙げるどれに当たるのかを言い切る必要はない。効いているのは、テストで取り切れなかった誤りを受け止める手当てがテストの外に用意されていること、そして突合の相手が独立に実装した参照計算であることである。同じロジックで再計算しても、料率の取り違えや区分の当てはめ誤りは同じ結果を再現するだけで差異は出ない。また検知だけでは軽減にならず、過少請求のまま成立した契約をどう訂正するかまで用意して初めて、テストの外で受け止めたことになる。\nこの計画が引き受けるものも見ておく。グラフ崩れは主要3機種の外を受容するので、それ以外の端末で試算結果のグラフが崩れたまま繁忙期を迎える可能性が残る。応答遅延は枠が1回しかないため、測って直して測り直す反復ができず、合否のしきい値を先に決めた1回勝負になる。データ破損を結合レベルに限定することは、破損の条件がストレージや変換の実装に依存する場合にシステムレベルの確認が残ることを意味する。比例配分は、これらを「なぜ薄くしたのか」に答えられる形で残す判断とセットになる。","distractors":["記録も、負荷環境の枠も、主要3機種の上限も守っている。外れているのは順位である。グラフ崩れの積は7で4件のうち最も軽く、保険料計算の80とは一桁違う。その最も軽い懸念に人手を厚く配る一方で、最も重い保険料計算を結合テストの範囲にとどめている。発生可能性だけを見れば グラフ崩れ(70%) と応答遅延(60%) が上位に来るので、可能性の高いものから手当てするという読み方をした人がこれを選ぶ。しかしシラバスはテストマネージャーがリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、時間と労力はそのリスクレベルに比例すべきである。記録は残しているので規制要件には触れないが、最も重いリスクに最も薄い労力が当たる点で比例原則から外れている。保険料計算については結合テストの記録を残すだけで、成立後に誤りを拾う手当ても置いていない","この案は明記された制約に2つ同時に反している。1つは負荷環境の枠で、本番同等の負荷環境はリリースまでに1回・4時間しか使えないと明記されているのに、この案はもう1系統を用意することを前提にしている。もう1つは記録で、保険料計算の正確性については検証の根拠を記録として残すことが求められているのに、最も重いその懸念について手当てが計画に含まれていない。シラバスは規制要件をテストアプローチの選択で分析すべきコンテキスト要因に挙げ、テストマネージャーはこれらの規格が守られていることを保証しなければならないとしている。なお、開発と並行して着手すること自体は、高いリスクレベルに対するテストを早期に開始するという記述にむしろ沿っており、そこが誤りなのではない",null,"明記された制約にはいずれも従っている。保険料計算への対応も、応答遅延を4時間の枠に収めることも、表示確認を主要3機種にとどめることもそうである。最上位の保険料計算に対するテスト以外の手当ても、正解と同じ形で置いている。外れているのは順位である。アップロードのデータ破損の積は30で、応答遅延（48）より軽い3番目にあたる。そこを厚く配分して応答遅延には4時間のうち1時間しか充てないと、より重いリスクに薄い労力が当たることになる。影響額はデータ破損が200で応答遅延の80より大きく、そこだけを見た人がこれを選ぶ。しかし時間と労力が比例すべき相手は影響額ではなくリスクレベルであり、リスクレベルは可能性と影響の組み合わせで決まる"],"flip":[null,null,null,"Dの発生可能性が仮に30%であれば積は60となってB（48）を上回り、DをBより厚く扱うこの配分が正しくなる。この選択肢は3つの制約すべてに従い、テスト以外の手当ても正解と同じ形で置いているので、積を計算しない限り正解と区別できない。誤っているのは配分の仕方ではなく、順位の出し方である"],"flipNote":{"1":"発生可能性の順にそのまま配るこの案が正しくなるのは、影響額の列が4件とも同じ高さに並んだときである。だが4つの値は表にそれぞれ独立に置かれており、まとめて動かす一文はシナリオのどこにもない。表の数値を1つだけ動かしても順位は作れない。グラフ崩れの影響額を上げてそこを首位にしても、保険料計算（積80）が応答遅延（積48）を上回ったまま残るので、応答遅延に4時間の枠を充てて保険料計算を結合どまりにするこの配分は比例しない。逆に保険料計算側の数値をどれだけ下げても、応答遅延（積48）とデータ破損（積30）は動かないので、グラフ崩れ（積7）がこの2件を上回ることはなく、下位にとどまる懸念にいちばん厚く人手を充てる形が残る。反転にはグラフ崩れを上げることと保険料計算を下げることの2つが要る。誤っているのは可能性を見たことではなく、影響額と組み合わせなかったことである。","2":"この案の誤りは2つある。本番同等の負荷環境はリリースまでに1回・4時間と明記されているのにもう1系統を用意することを前提にしている点と、保険料計算について求められている検証の根拠の記録を引き受けていない点である。片方だけを動かしてももう片方が残る。両方を動かしても、積が最も大きい保険料計算に充てているのが開発と並行した探索的テストにとどまるため、それを要件由来のテストで網羅的に検証し独立に実装した参照計算との突合まで置く案のほうが、労力をリスクレベルに比例させるという原則に沿ったまま残る。1条件では反転しない。"},"quote":"テスト計画において、テストの開発と実行に関連する時間と労力は、リスクレベルに比例すべきである。高いリスクレベルに対するテストは、早期に開始し、より厳密なテスト技法を用いるべきであるが、低いリスクレベルに対するテストは、後半に開始する場合があってよく、厳密ではないテスト技法を用いるべきである。／テストマネージャーは、リスク可能性とリスク影響を組み合わせて、リスクレベルを決定する。","ref":"1.3.4（比例原則・コンテキスト要因）／1.3.3（リスクレベルの決定）","misconception":"リスクの順位を発生可能性か影響額の一方だけで決めており、両者の積で決まること、および明記された制約をすべて守っていても順位を誤れば計画は成立しないことを踏まえていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["発生可能性の高いものを厚くし、積を取らない","明記された資源の上限を超え、最上位のリスクに求められている記録の手当てを置かない","制約はすべて守るが、積の順位でDをBより上に置く（宣言軸を担う誤答）"],"distractorTypes":["D4","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-03"]}},{"id":"q-1.3.4-A-2","lo":"TM-1.3.4","cluster":"1.3.4-B","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"multi","minutes":4,"scenario":"公共交通のIC乗車券システムを刷新している。1日の利用は延べ400万件で、朝夕のピークに集中する。改札機のファームウェアは鉄道会社11社ごとに版が異なり、自社で検証できるのは主要4社ぶんまでで、残る7社ぶんは各社が自社の受入検証で確認する取り決めになっている。リリース日は運賃改定に合わせており、動かせない。\n\n洗い出した懸念について、重さの評価と、それがどういう状態で現れるかを次のように整理した。","table":{"caption":"洗い出した懸念と、それが現れる条件","headers":["ID","内容","重さ","現れる条件"],"rows":[["A","残高計算を誤り、運賃が過大に引き落とされる","重い","計算のロジック単体で再現できる"],["B","ピーク時に改札機との通信が遅延し、入場に失敗する","重い","改札機と連携した状態でのみ現れる"],["C","利用履歴画面の表示順が誤る","軽い","画面単体で再現できる"],["D","定期券の期限判定を誤り、期限切れでも通過できる","重い","日付をまたぐ運用条件でのみ現れる"]]},"question":"各懸念の重さと現れ方を分析したとき、テスト活動の割り当てとして適切なものを2つ選べ。","choices":["Aには単体のレベルで最も厳密な技法を充て、最も適任の担当者を割り当てる","Cは短い時間で終えられるため、まずここから着手して早い段階で片付ける","Dには期限判定のロジックを対象に、単体のレベルで最も厳密な技法を充てて軽減を終える","Bは主要4社ぶんの版を対象に、改札機と連携したレベルで軽減する","残る7社ぶんは主要4社ぶんの結果で代表できるとみなし、不具合が出た時点で各社に確認を依頼する"],"answer":[0,3],"explanation":{"signals":"効くのは重さの評価そのものではなく、現れる条件の列である。残高計算の誤り・ピーク時の通信遅延・定期券の期限判定はいずれも重いと評価されており、重さだけではこの3件の扱いを分けられない。分けるのは、その不具合がどういう状態で現れるかである。シラバスは「ある種のリスクは、特定のテストレベルで動的にテストするだけでよい」としており、どのレベルなら軽減できるかは現れ方で決まる。加えて、自社で検証できるのは主要4社ぶんまでで、残る7社ぶんは各社が自社の受入検証で確認する取り決めがあることが効く。残る7社ぶんを自社の判断で代表とみなしてよいかは、この取り決めが決める。1日400万件という規模は状況の重さを伝えるだけで、どの割り当ての当否も決めない。","why":"選ぶべきは、計算のロジック単体で再現できる残高計算の誤りを単体のレベルで扱ってそこに最も厳密な技法と最も適任の担当者を置く割り当てと、改札機と連携した状態でのみ現れるピーク時の通信遅延を、自社で検証できる主要4社ぶんの版を対象に連携したレベルで軽減する割り当てである。どちらを採るかを決めているのは重さではなく、現れる条件の列である。\n残高計算の誤り・通信遅延・期限判定の誤りは、いずれも重いと評価されている。だから重さの列を見ても、この3件のどれをどのレベルで扱うかは決まらない。シラバスは「ある種のリスクは、特定のテストレベルで動的にテストするだけでよい」としており、どのレベルなら軽減できるかは、その不具合がどういう状態で現れるかで決まる。残高計算の誤りは計算のロジック単体で再現できるため、統合を待たずにそのレベルで軽減できる。重いリスクに対して最も厳密な技法を充てることは労力をリスクレベルに比例させるという記述に沿い、最もリスクレベルの高いテストアイテムは最も適任な担当者がテストすべきであるという記述にも沿う。通信遅延は同じく重いが、改札機と連携した状態でのみ現れるため、単体のレベルでいくら厚く見ても軽減できない。連携したレベルで扱い、かつ自社で検証できる主要4社ぶんに対象を収めている点が、明記された制約と整合する。\n重さは労力の量を決め、現れ方は労力を置く場所を決める。この2つを分けて読むことが、この状況で求められている分析である。\nこの割り当てが残すものもある。通信遅延は主要4社ぶんの版でしか確認できないため、残る7社ぶんの版に固有の通信の挙動は自社では取り切れず、各社の受入検証に依存する。期限判定についても、日付をまたぐ運用条件を再現できる枠をどこに確保するかが別途の課題として残る。","distractors":[null,"外れているのは、着手の早さを何で決めるかである。この案は軽いものから着手する理由として、作業が短い時間で終わることを挙げている。しかし着手の早さを決めるのはリスクレベルである。シラバスはリスクレベルが高いほどテストを早期に開始すべきであるとし、低いリスクレベルに対するテストは後半に開始する場合があってよいとしている。短時間で終わる利用履歴画面の確認を先に片付けること自体に害はなく、実務でもよく行われる。害が出るのは、それが重い3件の着手を遅らせるときであり、この案は「まずここから」と着手順の先頭に置いている点で順序の根拠を取り違えている","重さの側は満たしている。定期券の期限判定が重いという評価は正しく、重いものに最も厳密な技法を充てるという方向も比例原則に沿っている。外れているのは、軽減するレベルの選び方である。期限判定の誤りが現れるのは日付をまたぐ運用条件であって、期限判定のロジックを単体で確認しても、その条件自体は再現されない。重さが同じでも、単体で再現できる残高計算と、運用条件でのみ現れる期限判定を同じ扱いにはできない。重さの列だけを見れば残高計算への割り当てと区別がつかず、現れる条件の列を読んで初めて誤りが分かる",null,"外れているのは、取り決めの範囲と、確認をいつ行うかの2点である。残る7社ぶんは各社が自社の受入検証で確認する取り決めになっており、自社が一方的に代表とみなしてよいかを決める話ではない。加えて、不具合が出た時点で各社に確認を依頼するという進め方は、リリース前にリスクを軽減する機会を使っていない。シラバスは、テストで欠陥が明らかになった場合にリリース前に欠陥に気づき対処する機会を提供することでテストがプロダクトリスクの軽減に役立つとし、可能な限り早期にすべてのテストアイテムのテストを行うことで、ライフサイクルの後期に重大な欠陥が発見され、内部失敗コストや遅延が増大するリスクを軽減できるとしている。リスク受容やサードパーティへのリスク移転は、テスト以外の正規の軽減手段としてシラバスに挙げられている。この案が誤るのは移転したことではなく、取り決めの範囲を自社の判断で広げ、確認を不具合の後に回している点である"],"flip":[null,null,null,null,null],"flipNote":{"2":"着手順の根拠を作業時間の短さに置いてよくなるのは、利用履歴画面の表示順の誤りの重さが他の3件と並ぶときである。ただしそのときも、計算のロジック単体で再現できる残高計算を単体のレベルで扱う割り当てと、改札機と連携した状態でのみ現れる通信遅延を連携したレベルで扱う割り当ては、どちらも正しいまま残る。適切な割り当てが3つになり、2つ選べという形式が成り立たない。重さの列をどう動かしても、この案が2つの席のどちらかを奪う形にはならない。","3":"期限判定の現れる条件が「日付をまたぐ運用条件でのみ現れる」ではなく「ロジック単体で再現できる」であれば、この割り当て自体は正しくなる。ただしそのときも、残高計算を単体のレベルで扱う割り当てと、通信遅延を連携したレベルで扱う割り当ては正しいままなので、適切な割り当てが3つになり、2つ選べが成り立たない。この案が2つのうちの1つになるには、あわせて残高計算が単体では再現できない形に変わることまで必要で、条件が2つになる。","5":"この案の誤りは2つある。各社の受入検証という取り決めの範囲を自社の判断で広げて代表とみなしたことと、確認をリリース前ではなく不具合が出た後に回したことである。渡す確認の内容と合否の基準を事前に取り決めて各社の同意を得ることと、基準からの逸脱が出た場合に照会する手順を決めることは別々の条件であり、どちらか一方だけでは成り立たない。しかも両方を置いたときには、残高計算を単体のレベルで扱う割り当てと、通信遅延を連携したレベルで扱う割り当ても正しいまま残るため、適切な割り当てが3つになって2つ選べが成り立たない。"},"quote":"ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。他のリスクは、静的テスト（例えば、保守性のための静的解析とコードレビュー）、またはその両方の組み合わせ（例えば、アーキテクチャのレビューとセキュリティの脆弱性のための統合したシステムの動的テスト）によってテストを行う。","ref":"1.3.4","misconception":"リスクの重さだけでテストの厚みとレベルを決め、その不具合がどういう状態で現れるか（＝どのテストレベルなら軽減できるか）を見ていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["作業の短さを着手順の根拠にする","重さには比例させるが、現れる条件と軽減するレベルが噛み合わない（宣言軸を担う誤答）","移転の取り決めを代表確認と事後依頼に置き換える"],"distractorTypes":["D4","D2","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-03","MP-02"]}},{"id":"q-1.3.4-A-3","lo":"TM-1.3.4","cluster":"1.3.4-C","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"クラウド会計SaaSに、他社サービスからのデータ移行機能を追加する。利用者の多くは小規模事業者で、確定申告期に処理が集中する。リリースは確定申告期の受付開始に合わせており、日程は動かせない。\n\n経営陣は3週間後の経営会議で、リリース可否を決める材料として、追加する機能全体の品質がどうなっているかの説明を求めている。\n\n洗い出した懸念について、見込まれる損失はすでに算出されている。","table":{"caption":"洗い出した懸念と、算出済みの見込み損失（単位は百万円）","headers":["ID","内容","見込まれる損失"],"rows":[["A","移行したデータから仕訳を生成する際に勘定科目のマッピングを誤る","48"],["B","確定申告期のピークに移行処理が滞留する","20"],["C","移行後の帳票でフォントの表示が崩れる","3"],["D","他社サービスからの移行でデータの欠損が生じる","45"]]},"question":"この状況を分析したとき、テスト実行の進め方として最も妥当なものはどれか。1つ選べ。","choices":["どの件も未着手のまま残さないよう、4件に1つずつテストを配って一巡させる。そのあとは残りのテストを4件へ同じ数ずつ割り振り、どれも同じ厚みで確認してから報告する。","見込まれる損失の大きいものから厳格に降順で実行する。Aを深く掘り下げきってからDに移り、Aで分かった欠陥の傾向はDの計画に反映してから着手する。BとCは前の2件が終わってから着手する。最も大きい損失を可能な限り早期に軽減することを優先し、各件の残存リスクを報告に載せる。","AとDを深く掘り下げることに割り当てた時間を使い切ることを前提に計画し、BとCは今回のテストの範囲から外す。外した2件は、残っているリスクを受け入れる前提で経営会議に報告する。","A〜Dのそれぞれに、まず最優先のテストを少なくとも1つずつ割り当てて一巡させる。一巡したあとの残りのテストは、見込まれる損失の大きいものから順に優先順位を付けて進め、各件の残存リスクを報告に載せる。"],"answer":[3],"explanation":{"signals":"効くのは数値そのものよりも、経営陣がリリース可否を決める材料として、追加する機能全体の品質がどうなっているかの説明を求めているという一文である。シラバスはテスト実行の優先順位の付け方を2つ挙げ、どちらが適するかをステークホルダーの求めで分けている。算出済みの数値（A=48 > D=45 > B=20 > C=3）は、一巡したあとの残りの優先順位を決めるために使う。勘定科目のマッピング誤り（48）とデータ欠損（45）の差がわずか3しかないことも効く。降順に進めるとマッピング誤りだけで3週間を使い切りかねない。利用者の多くが小規模事業者であることは、どの案の当否にも関与しない。","why":"取るべきは、各懸念にまず少なくとも1つテストを割り当てて一巡させ、残りをリスクの高さ順に進める横型探索である。3週間後の経営会議がリリース可否の材料として求めているのは、追加する機能全体の品質がどうなっているかの説明であり、シラバスは横型探索を「各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」進め方と定義して、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適するとしている。算出済みの見込み損失を残りの順位に反映することと、各件の残存リスクを報告に載せることも、この進め方の中でそのまま満たされる。\nシラバスはもう一方の進め方として縦型探索を挙げ、テスト実行の優先順位をカバーするリスクレベルの高いものから厳格に降順とするこの進め方は、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適するとしている。どちらも正規の進め方で、適する場面を分けているのはステークホルダーの求めである。この状況でそれを決めているのが、経営会議がリリース可否の材料として機能全体の品質の説明を求めているという一文にあたる。\n加えてシラバスは、リスクベースドテストが任意の時点における残存リスクレベルに関するテスト進捗の報告を可能にし、これにより開発チームとステークホルダーが、残存リスクレベルに基づいてリリースの判定を含むソフトウェア開発のモニタリングとコントロールを行うことを支援するとしている。各件の残存リスクを報告に載せることで、一巡して得た全体像がリリース判定に使える形になる。\nこの進め方が失うものもある。一巡に時間を使う分、最も重い勘定科目のマッピング誤り（48）の掘り下げは、厳格に降順で進めた場合より遅れる。全体像を早く得ることと、最も重いリスクを最速で下げることは同時には取れず、この状況では経営陣の求めが前者を選ばせている。","distractors":["落としているのは、算出済みの数値を残りの優先順位に反映することである。前半の一巡は横型探索の定義どおりで正しい。しかし後半で4件に同じ数ずつ割り振っている点が、「その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」という定義の後半に反し、労力をリスクレベルに比例させるという原則にも反する。フォントの表示崩れ（3）に勘定科目のマッピング誤り（48）と同じ数のテストを充てることになり、分析して算出した数値が計画に反映されない","落としているのは、機能全体の品質の説明を3週間後に出せることである。これは縦型探索であり、進め方として自己矛盾はない。マッピング誤りで分かった欠陥の傾向をデータ欠損の計画に反映してから着手するという段取りは、順に掘り下げるこの進め方だからこそ取れるもので、それ自体に誤りはない。シラバスは縦型探索を、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適するとしており、正規の進め方である。多くの状況ではこちらが妥当であり、この案が誤るのは一点だけ——この状況のステークホルダーの求めと噛み合わないことである。マッピング誤り（48）とデータ欠損（45）の差は3しかなく、マッピング誤りを掘り下げきる前に3週間が尽きればデータ欠損すら手つかずになる。ピーク時の滞留とフォントの表示崩れが未着手のまま経営会議を迎えれば、残存リスクを報告してもその2件については「まだ何も分かっていない」としか言えず、機能全体の品質がどうなっているかという求めに答えられない","落としているのは、やはり機能全体の品質の説明である。ピーク時の滞留とフォントの表示崩れを最初から範囲の外に置く計画で、その2件を一度もテストしないため、報告できるのは損失の見積りだけになる。ピーク時の滞留（20）は4件のうち3番目で、計画段階で落とす根拠が数値にない。またシラバスは、割り当てた時間が計画したテストをすべて実行できないまま消費されることがあると認めたうえで、その時点でテストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することがリスクベースドテストの利点だとしている。ここでは受容が提案ではなく前提として持ち込まれており、経営陣には選ぶ余地が残らない",null],"flip":[null,"経営陣の求めが「全体像」ではなく「最も重い懸念をリリース前に潰すこと」であれば、厳格に降順で進めるこの進め方が正解になる。誤っているのは進め方そのものではなく、この状況の求めと噛み合っていない点だけである。求めを読まなければ、この選択肢は正解と区別できない",null,null],"flipNote":{"1":"一巡したあとの残りを同じ数ずつ割り振ることが結果として比例配分になるのは、4件の見込み損失が同程度のときである。ただしそのときは、残りを見込み損失の大きい順に優先順位を付ける進め方も同じ配分に行き着くため、2つを分ける根拠が無くなり、どちらか一方を選べない。一巡後の配分を決めているのは算出済みの数値だけなので、この案が単独で正解になる条件は、数値の側にも経営陣の求めの側にも無い。","3":"経営陣の求めを、最も重い2件を掘り下げた結果と、残る2件を受け入れてよいかの判断に差し替えると、同じ一文が厳格に降順で進める案の唯一の誤りも同時に消す。降順で進める案が誤るのは進め方そのものではなく、この状況の求めと噛み合わない一点だけだからである。条件を当てると妥当な進め方が2つ立つ。しかも降順で進める案は範囲から何も落とさず各件の残存リスクを報告するので、テストを延長するか残ったリスクを受け入れるかの提案をマネジメントに上げるという原文には、受容を提案ではなく前提として持ち込むこの案よりも近い。この案だけが残るには、求めの差し替えに加えて、ピーク時の滞留（20）を計画段階で範囲外にしてよい数値まで併せて要る。"},"quote":"あるいは、各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける。このアプローチは横型探索(breadth-first)と呼び、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適している。","ref":"1.3.4","misconception":"実行順序はリスクの大きい順に決まるものだと思い込み、ステークホルダーが全体像を求めている場合に横型探索を選ぶ判断を持っていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["一巡は正しいが、後半で算出済みの数値を使わない","縦型探索として整合した計画を、全体像を求める文脈に当てる（宣言軸を担う誤答）","2件を計画段階で範囲から外し、受容を提案ではなく前提として報告する"],"distractorTypes":["D3","D2","D2+D3"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-07"]}},{"id":"q-1.3.4-A-4","lo":"TM-1.3.4","cluster":"1.3.4-D","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは自動車メーカーの車載ソフトウェア無線更新（OTA）基盤のテストマネージャーである。この基盤は走行中を除くタイミングで車両のソフトウェアを更新する。日欧向けの型式認証の対象であり、更新の完全性を保証する仕組みについては、申請時に検証の記録を提出する必要がある。\n\n提携する通信事業者は地域ごとに異なる。\n\n洗い出した懸念とその評価、および使える検証環境と要員は次のとおりである。","table":{"caption":"洗い出した懸念と、算出済みの見込み損失（単位は百万円）","headers":["ID","内容","見込まれる損失"],"rows":[["A","更新中の電源断で車両が起動不能になる","240"],["B","地域ごとの通信事業者の差により更新が中断する","56"],["C","更新後の設定画面の文言が一部の言語で崩れる","4"],["D","更新パッケージの署名検証を誤り、不正な更新を受け入れる","200"]]},"table2":{"caption":"利用できる検証環境と要員","headers":["資源","利用できる量","備考"],"rows":[["実車","月2台・各3日","更新失敗時にどこまで戻せるかは実車でしか確認できない"],["模擬環境","常時2台","電源断・通信断に加え、地域ごとの事業者網の接続設定とタイムアウトの挙動まで再現できる。車両の起動挙動は再現できない"],["署名検証の専門要員","1名","暗号実装の経験10年。検証専任で代われる者がいない"],["多言語表示の確認","外部委託が可能","費用は軽微で、日程の制約もない"]]},"question":"2つの表と明記された制約を分析したとき、検証計画として最も適切なものはどれか。1つ選べ。","choices":["Dの署名検証は型式認証の申請時に検証の記録を求められるため、実車の枠をすべてここに充てる。Aの電源断とBの通信中断、更新失敗時の復帰は模擬環境で確認し、Cの文言崩れは外部に委託する。","Dの署名検証には専門要員を専任で充て、申請に提出できる形の検証記録を残す。Aの電源断は模擬環境で再現し、実車の枠は更新失敗時の復帰の確認に充てる。Bの通信事業者の差は模擬環境の地域設定を切り替えて確認し、Cは外部に委託する。","Aの電源断は模擬環境で再現し、実車の枠はBの地域ごとの通信事業者の差の確認に充てる。Dの署名検証は要員の手当てが付く範囲に絞り、浮いた工数をAとBの確認に回す。Cは費用の軽い外部委託にとどめる。","Aの電源断を実車で再現して月2台の枠をすべて使い、Dの署名検証は専門要員が他の作業と兼務しながら進める。Bの通信事業者の差は模擬環境で確認し、Cは外部に委託する。"],"answer":[1],"explanation":{"signals":"1つ目の表は算出済みの損失を与えるだけで、この問題の難しさはそこにない。効くのは2つ目の表との対応関係である。実車でしか確認できないのは更新失敗時の復帰であること、電源断・通信断の再現も、地域ごとの事業者網の接続設定とタイムアウトの挙動の再現も模擬環境で行えること、署名検証の要員は1名で代われる者がいないこと、多言語表示の確認は費用も日程も制約なく外部に委託できること。この4行が、どの資源をどこに充てるかを決める。型式認証の申請に検証の記録を提出するという義務は、署名検証をどこまで見て何を残すかの下限を与える与件であって、4つの案の優劣そのものを決めるわけではない。","why":"実車でしか確認できないのは更新失敗時の復帰であって、署名検証でも電源断の再現でもない。そこから正解が決まる。月2台・各3日しかない実車の枠を復帰の確認に充て、代われる者がいない署名検証の専門要員を専任に置いて申請に提出できる形の記録まで残し、模擬環境で再現できるもの（更新中の電源断、地域ごとの事業者網の接続設定とタイムアウトの挙動）は模擬環境で確認し、費用も日程の制約もない多言語表示の確認は外部に委託する計画である。これを選ばせている決め手は損失の順位そのものではなく、2つ目の表が書いている「何がどの資源でしか確認できないか」という対応である。\n見込まれる損失は算出済みで、更新中の電源断による起動不能（240）＞署名検証の誤り（200）＞地域差による更新中断（56）＞文言崩れ（4）である。順位は労力の量を決めるが、その労力を置く場所までは決めない。置く場所を決めるのが2つ目の表である。電源断は2段で軽減する。電源断を起こすこと自体は模擬環境で再現でき、その後に車両が起動不能にならずに戻せるかは実車でしか確認できない。したがって月2台・各3日しかない実車の枠は復帰の確認に充てるのが合理的で、電源断の再現そのものに使い切る必要はない。署名検証は代われる者がいない専門要員を専任にし、申請に提出できる形の記録まで残す。型式認証で求められる記録は、リスクの重さとは独立に下限を与える。比例配分はその下限の上で働くので、記録を残すことと専任を置くことは択一ではない。シラバスは、リスクレベルが高いほどテストは早期に開始して労力をより集中させて長期間にわたって行うべきであるとし、時間と労力はリスクレベルに比例すべきであるとしている。地域差による更新中断は接続設定とタイムアウトの挙動まで切り替えられる模擬環境で確認でき、文言崩れは最も軽いうえ外部委託に費用も日程の制約もないため委託で足りる。シラバスはテストアイテム・品質特性・テストレベルとテストタイプ・テストチームといったコンテキストに基づく要因を分析して適切なテストアプローチを選択すべきだとしており、この計画はいずれの要因にも整合する。\nこの計画が引き受けるものもある。実車は月2台・各3日しかないため、復帰の確認は限られた条件でしか行えず、車種と地域の組み合わせすべてを実車で見ることはできない。事業者網の確認を模擬環境で行う以上、実際の商用網でしか出ない挙動は確認しないまま残る。また署名検証を1名に専任させることは、その1名が単一障害点になることを引き受ける判断でもあり、知識の移転や外部の評価機関への一部移転を別途手当てする必要がある。","distractors":["前提そのものは正しい。署名検証は型式認証の申請時に検証の記録を求められる対象であり、記録を残す必要がある。外れているのは希少な資源の充て先である。署名検証は実車でしか確認できない性質のものではなく、実車でしか確認できないのは更新失敗時の復帰のほうである。実車の枠をすべて署名検証に充てたうえで復帰の確認を模擬環境に回しているが、模擬環境では車両の起動挙動を再現できないと2つ目の表に明記されている。しかもこの案は、代われる者がいない専門要員をどう置くかには触れていない。どの資源でしか確認できないかは2つ目の表にしか書かれておらず、損失の順位からは決まらない。損失の順位だけを追っている限り、この案は不自然には映らない。2つ目の表を読んで初めて誤りが分かる",null,"外れているのは、実車の枠の充て先と署名検証の厚みである。実車の枠については、地域ごとの通信事業者の差は模擬環境の地域設定を切り替えれば確認できるのに、月2台・各3日しかない実車をそこに使っており、実車でしか確認できない更新失敗時の復帰の確認が計画から消える。厚みについては、手元の要員で手当てできる範囲まで署名検証を絞っている。署名検証の誤りの見込み損失は200で4件のうち2番目に重い。資源が足りないことは、そのリスクを軽減しなくてよいことを意味しない。シラバスは時間と労力をリスクレベルに比例させるべきだとしており、比例させる相手はリスクレベルであって手元の要員数ではない。要員が不足するのであれば、それ自体を制約として示し、移転や増員を含めて判断を仰ぐ筋になる。なお、電源断を模擬環境で再現するところまでは正解と同じである","外れているのは、実車の枠の充て先と署名検証の厚みである。実車の枠については、電源断は模擬環境で再現できるため、実車の枠をその再現に使い切る根拠がない。使い切ると、実車でしか確認できない復帰の確認が残らない。厚みについては、署名検証を他の作業と兼務しながら進める点が、リスクレベルが高いほどテストは労力をより集中させて行うべきであり、時間と労力はリスクレベルに比例すべきであるという記述から外れる。署名検証の誤りは200で2番目に重く、労力を分散させる相手ではない"],"flip":[null,null,null,null],"flipNote":{"1":"実車の枠をすべて署名検証に充てるこの案を正しくするには、2つ目の表の2行をどちらも書き換える必要がある。署名検証が実車の上でしか成立しない仕組みに変えても、更新失敗時の復帰は依然として実車でしか確認できないため、実車の枠を署名検証に使い切るこの計画では復帰の確認が残らない。逆に復帰を模擬環境で確認できる仕組みに変えても、署名検証に実車を充てる理由は生まれず、代われる者のいない専門要員を専任に置く計画のほうが残る。1条件では反転しない。","3":"この案の誤りは2つある。模擬環境の地域設定を切り替えれば確認できる事業者差に月2台・各3日しかない実車を充てて、実車でしか確認できない更新失敗時の復帰を計画から落としたことと、署名検証の厚みを手元の要員数に合わせて絞ったことである。地域ごとの事業者網を実車でしか確かめられない仕組みに変えても、復帰の確認が計画から消えることは変わらない。署名検証の絞り込みが正当になるのは同等の経験を持つ要員が他にいるか、署名検証の誤りが最も軽い場合で、いずれも別の条件になる。1条件では反転しない。","4":"この案の誤りは2つある。模擬環境で再現できる電源断に月2台の実車の枠をすべて使ったことと、見込み損失が2番目に重い署名検証を兼務で進めたことである。電源断が模擬環境では再現できない仕組みに変えれば実車を充てる理由は立つが、そのときも枠を使い切れば更新失敗時の復帰の確認が残らず、労力を集中させるべき署名検証を兼務にする点も変わらない。兼務を正当化するには4件の見込み損失が同程度であることまで必要で、条件が2つになる。"},"quote":"1.3 リスクベースドテスト…リスクレベルが高いほど、テストは早期に開始して、労力をより集中させて長期間にわたって行うべきである。…1.3.4 適切なテストによる品質リスク軽減…テスト計画において、テストの開発と実行に関連する時間と労力は、リスクレベルに比例すべきである。…テストを通じて全体的なリスクを最もよく軽減するために、テストマネージャーは、次のようなコンテキストに基づく要因を分析し、適切なテストアプローチを選択すべきである：…テストアイテム：…品質特性：…テストレベルとテストタイプ：…SDLC：…テストチーム：最もリスクレベルの高いテストアイテムは、最も適任な担当者がテストすべきである。…規制要件：一部の安全関連規格（IEC 61508 規格など）では、インテグリティレベルに基づいてテスト技法と必須のカバレッジを規定している。","ref":"1.3.4（コンテキスト要因・比例原則）／1.3（労力の集中）","misconception":"リスクの重さだけで資源を配分し、その資源でしか確認できないものは何かという観点を持っていない。また資源が足りないことを、リスクを軽減しなくてよい理由として使ってしまう"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["希少な資源を、それでしか確認できない対象に充てない（宣言軸を担う誤答）","希少な資源を模擬環境で足りる相手に充て、資源の不足を上位のリスクの範囲を絞る理由にする","模擬で足りる対象に希少資源を使い切り、上位のリスクに労力を集中させない"],"distractorTypes":["D2","D2+D3","D2+D4"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-05","MP-04"]}},{"id":"q-1.3.4-A-5","lo":"TM-1.3.4","cluster":"1.3.4-E","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"総合ECモールで週次のリリースを回している。テスト要員は8名で、うちセキュリティ診断の経験者は2名である。性能を測れる環境は週に1回・6時間しか確保できない。\n\n決済はカード情報を扱う部分を外部の決済代行サービスに委ねている。自社に残る代行との連携部分は、直近の四半期に外部の脆弱性診断を受けて指摘の是正まで終えており、今週のリリースにこの部分の変更は入っていない。レビュー投稿は画像と自由記述を受け付け、そのまま商品ページに表示する。\n\n各機能について、品質特性ごとの重さを次のように整理した。","table":{"caption":"機能ごとの重さ（品質特性別）","headers":["機能","セキュリティ","性能効率性","機能適合性"],"rows":[["決済","中","高","高"],["会員認証","高","中","中"],["検索","低","高","中"],["レビュー投稿","高","低","中"]]},"question":"この整理と制約を分析したとき、テスト活動の割り当てとして最も適切なものはどれか。1つ選べ。","choices":["セキュリティ診断の経験者2名を会員認証とレビュー投稿に1名ずつ置き、決済のセキュリティは代行との連携部分に絞る。性能環境の週1枠は決済と検索に使い、機能面の厚みは決済に寄せる。","セキュリティ診断の経験者2名は決済と会員認証に1名ずつ充て、レビュー投稿のセキュリティは通常の確認にとどめる。検索と決済には週1回の性能環境を割り当て、代行との連携部分を含む決済の機能面も厚く確認する。","変更した画面数の多い機能から順に労力を配分し、セキュリティ診断の経験者2名は変更量の多い機能に割り当てる。週1回の性能環境は、その週に変更のあった機能の確認に充てる。","週の前半は4機能を一巡して様子を見ることに充て、どこに労力を寄せるかはその結果を見てから決める。週1回の性能環境は、一巡で気になった機能の確認に充てる。"],"answer":[0],"explanation":{"signals":"効くのは機能×品質特性の12マスと、本文に置かれた2つの但し書き、そして2つの資源の制約である。12マスのうち「高」が立っているのは5つで、その5つがどこにあるかが配分を決める。決済は、自社に残る代行との連携部分について直近の四半期に外部の脆弱性診断と是正を終えており、今週のリリースにその部分の変更が入っていない。この2つがこの週の可能性を下げているため、セキュリティは中に置かれている。カード情報を扱う部分を決済代行に委ねたことで、自社が見る範囲は代行との連携部分に絞られている。そのうえでこの週は、その部分の可能性も下がっている。一方でレビュー投稿は画像と自由記述をそのまま商品ページに表示するため、セキュリティが高に置かれている。ECの一般的な感覚では決済のセキュリティが最も重く、レビュー投稿は軽いと考えがちなので、表と但し書きを読まずに配分すると、ここで外れる。セキュリティ診断の経験者が2名であること、性能を測れる環境が週1回・6時間しかないことが、配分の上限を決める。表は数値ではなく高・中・低の順序尺度なので、積を計算するのではなく、高が立っている軸を見る。","why":"限られたスキルと環境の置き先を指しているのは、表で「高」が立っている場所である。セキュリティが高いのは会員認証とレビュー投稿、性能効率性が高いのは決済と検索、機能適合性が高いのは決済 ── 正解は、セキュリティ診断の経験者2名を会員認証とレビュー投稿に1名ずつ置き、決済のセキュリティは代行との連携部分に絞り、週1回・6時間の性能環境を決済と検索に使い、機能面の厚みを決済に寄せる案で、3軸とも表のとおりに置いている。\nシラバスは、特定の品質特性に影響するリスクは、特定のテスト労力・テスト環境・テストスキルを必要とする関連するテストタイプによって軽減されるべきであるとし、最もリスクレベルの高いテストアイテムは最も適任な担当者がテストすべきであるとしている。したがって、限られたセキュリティ診断の経験者2名はセキュリティが高い会員認証とレビュー投稿に1名ずつ充てるのが、スキルという資源の置き方として正しい。決済のセキュリティは中であり、自社に残る攻撃面が代行との連携部分に集中していることを踏まえて、そこに絞るのが妥当である。週1回しかない性能環境は、性能効率性が高い決済と検索に配分する。機能適合性が高いのは決済なので、機能面の厚みは決済に寄せる。\nこの配分が残すものもある。性能環境が週1回・6時間である以上、決済と検索の測定は事前にピークのシナリオとしきい値を決めた一度きりになり、測って直して測り直す反復はその週には入らない。決済のセキュリティを連携部分に絞ることは、代行側の実装に依存する部分を自社では見ないという判断でもあり、その範囲は代行との取り決めで押さえておく必要がある。決済の重さが中なのは、代行への移転で自社が見る範囲が連携部分に絞られ、そのうえでこの週はその部分の可能性も下がっているからである。移転による範囲の絞り込みはこの先も続くが、可能性の低下はこの週の条件に依存するので、決済まわりに変更が入る週や、診断からの間隔が空いた時点では、この配分をそのまま持ち越せない。","distractors":[null,"3軸のうち外れているのはセキュリティの軸である。性能環境と機能面の配分は正解と同じである。この案はセキュリティの重さを、整理した表からではなく機能の名前から判断している。決済とセキュリティ、レビュー投稿と軽さという結び付きは多くのECで実際に成り立つため、この配分はもっともらしく見える。しかしこの状況の表では決済のセキュリティは中、レビュー投稿のセキュリティは高であり、その理由は本文に書かれている。決済は代行との連携部分について直近の四半期に診断と是正を終えており、今週のリリースにその部分の変更が入っていない。レビュー投稿は画像と自由記述をそのまま商品ページに表示する。限られた経験者2名を、高が立っていない決済に1名充て、高が立っているレビュー投稿を通常の確認にとどめる点が、最もリスクレベルの高いテストアイテムに最も適任な担当者を充てるという記述から外れる","3軸のいずれについても、配分の根拠を表に置いていない。代わりに変更した画面数を基準にしている。週次リリースで変更のあったところを見るのは実務でよく行われる進め方であり、それ自体が誤りというわけではない。誤りは、品質特性ごとの重さを整理した表があるのに、それを別の指標で置き換えている点である。変更率はリスク可能性を左右する要因の1つであり、表に織り込むべき入力であって、表を上書きする指標ではない。この基準では、セキュリティが高い会員認証やレビュー投稿にその週の変更が無ければ、経験者2名がそこに充てられない","3軸のいずれについても、配分の根拠を表ではなく一巡の結果に置いている。シラバスは、特定の品質特性に影響するリスクは、特定のテスト労力・テスト環境・テストスキルを必要とする関連するテストタイプによって軽減されるべきであるとしており、どの機能にどの特性の重さが立っているかはすでに整理されている。週1回しかない性能環境を「一巡で気になった機能」に充てることは、性能効率性が高いと整理された決済と検索にその枠が渡る保証がないことを意味する。また、リスクレベルが高いほどテストは早期に開始すべきであり、経験者の割り当てを一巡のあとまで待つ理由が表からは出てこない"],"flip":[null,"レビュー投稿が画像と自由記述をそのまま商品ページに表示せず、あらかじめ用意した定型の評価だけを選ばせる仕組みで、表のレビュー投稿のセキュリティが低であれば、セキュリティが高いのは会員認証だけになり、限られた経験者2名は会員認証と、次に重い決済に置くことになるので、この配分が正しくなる。誤っているのは決済にセキュリティの手を入れたことではなく、高が立っている機能を表で確かめずに機能の名前で配ったことである。",null,null],"flipNote":{"3":"変更した画面数を配分の起点にしてよいのは、品質特性ごとの重さの整理が手元に無いときである。しかしその整理はこの状況に与えられた入力そのものであり、取り去れば、整理と制約を分析してどこに労力を置くかを決めるという問い自体が立たなくなる。表を残したまま変更量を正しい起点に変える条件は状況の側に無い。変更率はリスク可能性を左右する要因として表に織り込むべき入力であって、表を置き換える指標ではないからである。","4":"一巡して様子を見てから配分を決めるのが合理的になるのは、機能ごとの重さが事前に分かっていないときである。しかし品質特性ごとの重さの整理はこの状況に与えられた入力そのもので、それを取り去る条件は問い自体を消してしまう。表が与えられたまま一巡を先に置く理由は、経験者2名・週1回6時間の性能環境という資源の制約の側からも出てこない。どちらの資源も、どこに置くかは表を読めば決まるからである。"},"quote":"品質特性：特定の品質特性に影響するリスクは、特定のテスト労力、テスト環境、テストスキルを必要とする関連するテストタイプによって軽減されるべきである。／テストチーム：最もリスクレベルの高いテストアイテムは、最も適任な担当者がテストすべきである。","ref":"1.3.4","misconception":"品質特性ごとの重さを、整理された表ではなく機能の名前や変更量から決めてしまい、限られたスキルと環境をどこに置くかを常識で配ってしまう"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["セキュリティの重さを表ではなく機能の名前から判断する（宣言軸を担う誤答）","整理された表を変更量で置き換える","配分の判断を一巡の結果まで待つ"],"distractorTypes":["D4","D2","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-05","MP-03"]}},{"id":"q-1.3.4-B-2","lo":"TM-1.3.4","cluster":"1.3.4-B","variant":2,"chapter":1,"section":"1.3","k":4,"points":3,"type":"multi","minutes":4,"scenario":"物流倉庫の在庫管理と自動搬送の仕組みを入れ替える。出荷の山は月末に来る。搬送機の制御版はメーカー3社ごとに違い、自社で試験できるのは2社ぶんまでで、残る1社ぶんはメーカーが自社の受入試験で確認する取り決めになっている。稼働日は繁忙期の前に置いており、動かせない。\n\n洗い出した懸念について、重さと、それがどういう状態で現れるかを次のように整理した。","table":{"caption":"洗い出した懸念の重さと、現れ方","headers":["記号","内容","重さ","現れる条件"],"rows":[["ア","引当を誤り、同じ在庫が二重に引き当てられる","重い","引当の計算単体で再現できる"],["イ","出荷の山で搬送機との通信が詰まり、搬送の指示が抜ける","重い","搬送機とつないだ状態でのみ現れる"],["ウ","在庫一覧の並び順が指定と違う","軽い","一覧の出力単体で再現できる"],["エ","棚卸の締めをまたぐと在庫数がずれる","重い","締めをまたぐ運用条件でのみ現れる"]]},"question":"各懸念の重さと現れ方を分析したとき、テストの割り当てとして妥当なものを2つ選べ。","choices":["在庫一覧の並び順は短い手間で済むので、最初に手を付けて早いうちに終わらせる","引当の誤りは引当の計算を対象に単体の段階で追い込み、そこに最も厳密な技法と最も腕の立つ担当者を置く","残る1社ぶんの制御版は2社ぶんの結果で代表できるとみなし、現場で不具合が出た時点でメーカーに確認を頼む","棚卸の締めをまたぐ在庫数のずれには、締めの計算を単体で厳しく突く技法を当て、その段階で手当てを打ち切る","搬送の指示の抜けは、自社で試験できる2社ぶんの制御版を対象に、搬送機とつないだ段階で潰す"],"answer":[1,4],"explanation":{"signals":"効くのは重さの評価そのものではなく、現れる条件の列である。引当の誤り・搬送の指示の抜け・棚卸の締めをまたぐ在庫数のずれはいずれも 重い と評価されており、重さだけではこの三件の扱いを分けられない。分けるのは、その不具合がどういう状態で現れるかである。加えて、自社で試験できるのは2社ぶんまでで残る1社ぶんはメーカーの受入試験で見る取り決めがあることが効く。出荷の山が月末に来ることは状況の背景で、どの割り当ての当否も決めない。","why":"選ぶのは、引当の計算単体で再現できる引当の誤りを単体の段階で追い込む割り当てと、搬送機とつないだ状態でのみ現れる搬送の指示の抜けを、自社で試験できる2社ぶんの制御版を対象につないだ段階で潰す割り当てである。二つを分けているのは重さではなく、現れる条件の列である。\n引当の誤り・搬送の指示の抜け・棚卸の締めをまたぐ在庫数のずれは、いずれも重いと評価されている。だから重さの列を見ても、この三件をどの段階で扱うかは決まらない。シラバスは「ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。」としており、どの段階なら軽減できるかは、その不具合がどういう状態で現れるかで決まる。引当の誤りは引当の計算単体で再現できるので、組み上がりを待たずにその段階で軽減できる。重いと評価された懸念に最も厳密な技法を当てることは、時間と労力をリスクレベルに比例させるという記述に沿い、最もリスクレベルの高いテストアイテムは最も適任な担当者がテストすべきであるという記述にも沿う。出荷の山で搬送機との通信が詰まり、搬送の指示が抜ける件も同じく重いが、搬送機とつないだ状態でのみ現れるので、計算の段階をいくら厚く見ても軽減できない。つないだ段階で扱い、しかも 自社で試験できるのは2社ぶんまでで、残る1社ぶんはメーカーが自社の受入試験で確認する取り決めになっている から、対象を2社ぶんに収めている点が取り決めと噛み合う。\n重さは労力の量を決め、現れ方は労力を置く場所を決める。この二つを分けて読むことが、この状況で求められている分析である。\nこの割り当てが残すものもある。搬送の指示の抜けは2社ぶんの制御版でしか確かめられないので、残る1社ぶんに固有の通信の癖は自社では取り切れず、メーカーの受入試験に委ねることになる。棚卸の締めをまたぐ在庫数のずれについても、締めをまたぐ運用条件を再現できる環境をどこに用意するかが別の課題として残る。","distractors":["外れているのは、手を付ける順を何で決めるかである。この案は軽いものから始める理由に、作業が短い手間で済むことを挙げている。在庫一覧の並び順の重さは表で 軽い と評価されており、手を付ける順を決めるのはリスクレベルのほうである。シラバスは、高いリスクレベルに対するテストは早期に開始すべきであり、低いリスクレベルに対するテストは後半に開始する場合があってよいとしている。短い手間で済む確認を先に片付けること自体に害はなく、現場でもよく行われる。害が出るのは、それが重い三件の着手を遅らせるときであり、この案は「最初に」と順の先頭に置いている点で、順の根拠を取り違えている。",null,"外れているのは、取り決めの範囲と、確認をいつ行うかの二点である。自社で試験できるのは2社ぶんまでで、残る1社ぶんはメーカーが自社の受入試験で確認する取り決めになっている のであって、自社が一方的に代表とみなしてよいかを決める話ではない。加えて、現場で不具合が出た時点でメーカーに確認を頼むという進め方は、稼働前にリスクを下げる機会を使っていない。シラバスは、可能な限り早期にすべてのテストアイテムのテストを行うことで、ライフサイクルの後期に重大な欠陥が発見され、内部失敗コストや遅延が増大するリスクを軽減することができるとしている。作り手に確認を委ねること自体は、サードパーティへのリスク移転として原文が正規の手段に挙げている。この案が誤るのは委ねたことではなく、取り決めの範囲を自社の判断で広げ、確認を不具合の後に回している点である。","重さの側は満たしている。棚卸の締めをまたぐ在庫数のずれが重いという評価は表のとおりで、重いものに厳しい技法を当てるという向きも比例に沿っている。外れているのは、軽減する段階の選び方である。このずれが現れるのは 締めをまたぐ運用条件でのみ現れる とされている条件であって、締めの計算を単体で確かめても、その条件そのものは再現されない。重さが同じでも、計算単体で再現できる引当の誤りと、運用条件でのみ現れるこのずれを同じ扱いにはできない。重さの列だけを見れば引当の誤りへの割り当てと見分けがつかず、現れる条件の列を読んで初めて誤りが分かる。",null],"flip":[null,null,null,null,null],"flipNote":{"1":"手を付ける順の根拠を作業の短さに置いてよくなるのは、在庫一覧の並び順の重さが残る三件と並ぶときである。ただしそのときも、引当の計算単体で再現できる引当の誤りを単体の段階で扱う割り当てと、搬送機とつないだ状態でのみ現れる搬送の指示の抜けをつないだ段階で扱う割り当ては、どちらも正しいまま残る。妥当な割り当てが三つになり、二つ選べという形が成り立たない。重さの列をどう動かしても、この案が二つの席のどちらかを奪う形にはならない。","3":"この案の誤りは二つある。メーカーの受入試験という取り決めの範囲を自社の判断で広げて代表とみなしたことと、確認を稼働前ではなく不具合の後に回したことである。渡す確認の中身と合否の線を先に取り決めてメーカーの同意を得ることと、線を外れたときに照会する手順を決めることは別々の条件で、どちらか一方だけでは成り立たない。しかも両方を置いたときには、引当の誤りを単体の段階で扱う割り当ても、搬送の指示の抜けをつないだ段階で扱う割り当ても正しいまま残るため、妥当な割り当てが三つになって二つ選べが成り立たない。","4":"棚卸の締めをまたぐ在庫数のずれの現れる条件が「締めをまたぐ運用条件でのみ現れる」ではなく「計算単体で再現できる」であれば、この割り当て自体は正しくなる。ただしそのときも、引当の誤りを単体の段階で扱う割り当てと、搬送の指示の抜けをつないだ段階で扱う割り当ては正しいままなので、妥当な割り当てが三つになり、二つ選べが成り立たない。この案が二つのうちの一つになるには、あわせて引当の誤りが計算単体では再現できない形に変わることまで必要で、条件が二つになる。"},"quote":"ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。他のリスクは、静的テスト（例えば、保守性のための静的解析とコードレビュー）、またはその両方の組み合わせ（例えば、アーキテクチャのレビューとセキュリティの脆弱性のための統合したシステムの動的テスト）によってテストを行う。","ref":"1.3.4","misconception":"懸念の重さだけでテストの厚みと段階を決め、その不具合がどういう状態で現れるか（＝どの段階なら軽減できるか）を見ていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["作業の短さを着手順の根拠にする","移転の取り決めを代表確認と事後依頼に置き換える","重さには比例させるが、現れる条件と軽減する段階が噛み合わない（宣言軸を担う誤答）"],"distractorTypes":["D4","D7","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-03","MP-02"]}},{"id":"q-1.3.4-B-3","lo":"TM-1.3.4","cluster":"1.3.4-B","variant":3,"chapter":1,"section":"1.3","k":4,"points":3,"type":"multi","minutes":4,"scenario":"スマートフォン決済の加盟店向け精算の仕組みを入れ替える。加盟店の数は三万店を超える。店舗端末は端末メーカー5社ごとに版が違い、自社で確かめられるのは2社ぶんまでで、残る3社ぶんは各メーカーが自社の適合確認で見る取り決めになっている。切替日はすでに加盟店へ案内しており、動かせない。\n\n洗い出した懸念について、重さと、それがどういう状態で現れるかを次のように整理した。","table":{"caption":"洗い出した懸念の重さと、現れ方","headers":["記号","内容","重さ","現れる条件"],"rows":[["カ","按分を誤り、加盟店への入金が不足する","重い","按分の計算単体で再現できる"],["キ","締めが集中したときに店舗端末との通信が詰まり、精算の締めが遅れる","重い","店舗端末とつないだ状態でのみ現れる"],["ク","精算明細の並び順が帳票の指定と違う","軽い","帳票の出力単体で再現できる"],["ケ","前月の返品を含む精算で残高が合わない","重い","月をまたぐ運用条件でのみ現れる"]]},"question":"重さの評価と現れ方を分析したとき、テスト活動の置き場所として妥当なものを2つ選べ。","choices":["残る3社ぶんの店舗端末は2社ぶんの結果で代表できるとみなし、加盟店から申し出があった時点でメーカーに照会する","前月の返品を含む残高の不一致には、返品の計算を取り出して厳しい技法で確かめ、その段階で手当てを終える","精算の締めの遅れは、自社で確かめられる2社ぶんの端末を対象に、店舗端末とつないだ段階で下げる","按分の誤りは按分の計算を対象に単体の段階で詰め、最も厳密な技法といちばん経験のある担当者をそこに集める","精算明細の並び順は手数が少ないため、そこから取りかかって初週のうちに終える"],"answer":[2,3],"explanation":{"signals":"効くのは重さの評価そのものではなく、現れる条件の列である。按分の誤り・精算の締めの遅れ・前月の返品を含む残高の不一致はいずれも 重い と評価されており、重さだけではこの三件の扱いを分けられない。分けるのは、その不具合がどういう状態で現れるかである。加えて、自社で確かめられるのは2社ぶんまでで残る3社ぶんは各メーカーの適合確認で見る取り決めがあることが効く。加盟店の数が三万店を超えることは状況の規模を伝えるだけで、どの置き場所の当否も決めない。","why":"選ぶのは、按分の計算単体で再現できる按分の誤りを単体の段階で詰める割り当てと、店舗端末とつないだ状態でのみ現れる精算の締めの遅れを、自社で確かめられる2社ぶんの端末を対象につないだ段階で下げる割り当てである。二つを分けているのは重さではなく、現れる条件の列である。\n按分の誤り・精算の締めの遅れ・前月の返品を含む精算の残高の不一致は、いずれも 重い と評価されている。だから重さの列を見ても、この三件をどの段階で扱うかは決まらない。シラバスは「ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。」としており、どの段階なら軽減できるかは、その不具合がどういう状態で現れるかで決まる。按分を誤り、加盟店への入金が不足する件は按分の計算単体で再現できるので、つなぎ込みを待たずにその段階で軽減できる。重いと評価された懸念に最も厳密な技法を当てることは、時間と労力をリスクレベルに比例させるという記述に沿い、最もリスクレベルの高いテストアイテムは最も適任な担当者がテストすべきであるという記述にも沿う。締めが集中したときに店舗端末との通信が詰まり、精算の締めが遅れる件も同じく重いが、店舗端末とつないだ状態でのみ現れるので、計算の段階をいくら厚く見ても軽減できない。つないだ段階で扱い、しかも 自社で確かめられるのは2社ぶんまでで、残る3社ぶんは各メーカーが自社の適合確認で見る取り決めになっている から、対象を2社ぶんに収めている点が取り決めと噛み合う。\n重さは労力の量を決め、現れ方は労力を置く場所を決める。この二つを分けて読むことが、この状況で求められている分析である。\nこの割り当てが残すものもある。締めの遅れは2社ぶんの端末でしか確かめられないので、残る3社ぶんに固有の通信の癖は自社では取り切れず、各メーカーの適合確認に委ねることになる。前月の返品を含む残高の不一致についても、月をまたぐ運用条件を再現できる環境をどこに用意するかが別の課題として残る。","distractors":["外れているのは、取り決めの範囲と、確かめをいつ行うかの二点である。自社で確かめられるのは2社ぶんまでで、残る3社ぶんは各メーカーが自社の適合確認で見る取り決めになっている のであって、自社が一方的に代表とみなしてよいかを決める話ではない。加えて、加盟店から申し出があった時点でメーカーに照会するという進め方は、切替の前にリスクを下げる機会を使っていない。シラバスは、可能な限り早期にすべてのテストアイテムのテストを行うことで、ライフサイクルの後期に重大な欠陥が発見され、内部失敗コストや遅延が増大するリスクを軽減することができるとしている。作り手に確かめを委ねること自体は、サードパーティへのリスク移転として原文が正規の手段に挙げている。この案が誤るのは委ねたことではなく、取り決めの範囲を自社の判断で広げ、確かめを申し出の後に回している点である。","重さの側は満たしている。前月の返品を含む精算で残高が合わない件が重いという評価は表のとおりで、重いものに厳しい技法を当てるという向きも比例に沿っている。外れているのは、軽減する段階の選び方である。この不一致が現れるのは 月をまたぐ運用条件でのみ現れる とされている条件であって、返品の計算を取り出して確かめても、その条件そのものは再現されない。重さが同じでも、計算単体で再現できる按分の誤りと、運用条件でのみ現れるこの不一致を同じ扱いにはできない。重さの列だけを見れば按分の誤りへの割り当てと見分けがつかず、現れる条件の列を読んで初めて誤りが分かる。",null,null,"外れているのは、取りかかる順を何で決めるかである。この案は軽いものから始める理由に、手数が少ないことを挙げている。精算明細の並び順の重さは表で 軽い と評価されており、取りかかる順を決めるのはリスクレベルのほうである。シラバスは、高いリスクレベルに対するテストは早期に開始すべきであり、低いリスクレベルに対するテストは後半に開始する場合があってよいとしている。手数の少ない確認を先に済ませること自体に害はなく、現場でもよく行われる。害が出るのは、それが重い三件の着手を遅らせるときであり、この案は初週のうちにと期限まで添えて順の先頭に置いている点で、順の根拠を取り違えている。"],"flip":[null,null,null,null,null],"flipNote":{"1":"この案の誤りは二つある。各メーカーの適合確認という取り決めの範囲を自社の判断で広げて代表とみなしたことと、確かめを切替の前ではなく申し出の後に回したことである。渡す確かめの中身と合否の線を先に取り決めて各メーカーの同意を得ることと、線を外れたときに照会する手順を決めることは別々の条件で、どちらか一方だけでは成り立たない。しかも両方を置いたときには、按分の誤りを単体の段階で扱う割り当ても、締めの遅れをつないだ段階で扱う割り当ても正しいまま残るため、妥当な割り当てが三つになって二つ選べが成り立たない。","2":"前月の返品を含む残高の不一致の現れる条件が「月をまたぐ運用条件でのみ現れる」ではなく「計算単体で再現できる」であれば、この割り当て自体は正しくなる。ただしそのときも、按分の誤りを単体の段階で扱う割り当てと、締めの遅れをつないだ段階で扱う割り当ては正しいままなので、妥当な割り当てが三つになり、二つ選べが成り立たない。この案が二つのうちの一つになるには、あわせて按分の誤りが計算単体では再現できない形に変わることまで必要で、条件が二つになる。","5":"取りかかる順の根拠を手数の少なさに置いてよくなるのは、精算明細の並び順の重さが残る三件と並ぶときである。ただしそのときも、按分の計算単体で再現できる按分の誤りを単体の段階で扱う割り当てと、店舗端末とつないだ状態でのみ現れる締めの遅れをつないだ段階で扱う割り当ては、どちらも正しいまま残る。妥当な割り当てが三つになり、二つ選べという形が成り立たない。重さの列をどう動かしても、この案が二つの席のどちらかを奪う形にはならない。"},"quote":"ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。他のリスクは、静的テスト（例えば、保守性のための静的解析とコードレビュー）、またはその両方の組み合わせ（例えば、アーキテクチャのレビューとセキュリティの脆弱性のための統合したシステムの動的テスト）によってテストを行う。","ref":"1.3.4","misconception":"懸念の重さだけでテストの厚みと段階を決め、その不具合がどういう状態で現れるか（＝どの段階なら軽減できるか）を見ていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["移転の取り決めを代表確認と事後照会に置き換える","重さには比例させるが、現れる条件と軽減する段階が噛み合わない（宣言軸を担う誤答）","作業の短さを着手順の根拠にする"],"distractorTypes":["D7","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-03","MP-02"]}},{"id":"q-1.3.4-C-2","lo":"TM-1.3.4","cluster":"1.3.4-C","variant":2,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"食品メーカーの生産管理システムを受託で刷新している。工場は3交替で動き、仕込みは深夜から始まる。稼働開始日は原材料の契約切替に合わせており、動かせない。\n\n発注元の情報システム部は、受け入れの条件として、いちばん重い懸念を可能な限り早い時期に下げることを挙げている。全体の品質の見通しは稼働開始前の最終報告で受け取れればよく、途中で領域ごとの一覧を出す必要はないと回答している。範囲から外す件があれば、残るリスクの大きさと回避の手立てを示したうえで、外すかどうかは発注元が決める。\n\n洗い出した懸念を、発注元と合意した重い順に並べる。重さは相対的な並びとしてのみ合意しており、金額には換算していない。\n\n・ア 製造指図の数量を取り違え、実際と異なる量で仕込みが始まる\n・イ 原材料のロット追跡が途切れ、回収時に対象を特定できない\n・ウ 夜勤帯の締め処理が遅れ、翌日の生産計画の作成に間に合わない\n・エ 作業者向け画面の一部で、ボタンの並びが仕様と異なる\n\n作業者向け画面は日本語のほかにベトナム語でも表示できる。","question":"洗い出した懸念と発注元の求めを分析したとき、テスト実行の進め方として最も妥当なものはどれか。1つ選べ。","choices":["アに用意したテストをすべて実行し、見つかった欠陥の修正確認まで終えてからイに移る。イも同じように仕上げてウ、最後にエへ進む。着手の順は合意した重さのとおりとし、最終報告には懸念ごとにどこまで確認できたかと残っているリスクを書く。","アから重い順に掘り下げ、前の件を仕上げてから次に移る。最終報告には、計画したテストのうち実行できた件数と合格した件数を載せ、消化の割合をもって全体の状態を示す。","まず4件のどれにも1つずつテストを当てて全体を一度通し、そこで分かったことを持ち帰ってから、残りのテストを合意した重さの順に割り振って実行する。最終報告には懸念ごとに残っているリスクを書く。","ウとエを今回の範囲に入れず、空いた期間をアとイの掘り下げに充てる。範囲に入れなかった2件は、残るリスクを受け入れ済みのものとして最終報告に記す。"],"answer":[0],"explanation":{"signals":"効くのは、発注元の情報システム部が受け入れの条件に挙げているものである。いちばん重い懸念を可能な限り早い時期に下げることを条件とし、全体の品質の見通しは最終報告で受け取れればよく、途中で領域ごとの一覧は要らないと述べている。シラバスはテスト実行の優先順位の付け方を2つ挙げ、どちらが適するかをステークホルダーの求めで分けている。合意した重い並び（ア→イ→ウ→エ）は着手の順そのものになり、範囲から外すかどうかを発注元が決めるという取り決めも効く。作業者向け画面がベトナム語でも表示できることは、どの案の当否にも関与しない。","why":"取るべきは、合意した重い順に厳格な降順で実行し、上の件を仕上げてから次に移る縦型探索である。発注元が受け入れの条件に挙げているのは、いちばん重い懸念を可能な限り早い時期に下げることであり、シラバスは縦型探索を「場合によっては、テスト実行の優先順位を、カバーするリスクレベルの高いものから厳格に降順とする」進め方と定義して、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適するとしている。合意した並びをそのまま着手の順にすること、懸念ごとに確認できた範囲と残っているリスクを最終報告に書くことも、この進め方の中で無理なく収まる。\nシラバスはもう一方の進め方として横型探索を挙げ、各リスクに少なくとも1つのテストを最優先で割り当て、その他のテストをカバーするリスクのレベルで順位付けするこの形は、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適するとしている。2つは正規の進め方として並んでおり、適する場面を分けるのはステークホルダーの求めのほうである。ここでは発注元が、途中で領域ごとの一覧を出す必要はなく全体の見通しは最終報告でよいと明言しており、早く全体像を得ることに価値が置かれていない。だから適するのは縦型探索の側になる。\n報告の中身については、シラバスが、リスクベースドテストは任意の時点における残存リスクレベルに関するテスト進捗の報告を可能にし、これにより開発チームとステークホルダーが残存リスクレベルに基づいてリリースの判定を含むモニタリングとコントロールを行うことを支援する、と述べている。懸念ごとの残りを書くことは、縦型で進めても横型で進めても必要になる。\nこの進め方が失うものもある。ウとエは終盤まで一度も触られず、途中で期間が尽きればその2件については何も分からないまま稼働開始を迎える。最も重い懸念を最速で下げることと、全領域の見通しを早く得ることは同時には取れない。ここでは発注元の条件が前者を選ばせている。","distractors":[null,"落としているのは、リスクの観点からの報告である。重い順に掘り下げ、前の件を仕上げてから次に移る段取りそのものは、この状況に合っている。しかし最終報告に載せるものが実行できた件数と合格した件数、そして消化の割合になっており、どの懸念がどこまで下がったのかが出てこない。シラバスは、ステークホルダーが理解できる方法でテスト結果をリスクの観点から報告することが必要だとし、任意の時点における残存リスクレベルに関するテスト進捗の報告をリスクベースドテストの利点に挙げている。消化の割合は、ウとエに手が回らなかったときに何が残っているのかを発注元に伝えない。進め方の側が合っているぶん、報告の欄だけが入れ替わっていることに気づきにくい","落としているのは、いちばん重い懸念を可能な限り早い時期に下げることである。これは横型探索であり、進め方として自己矛盾はない。4件を一度通し、そのあとの残りを合意した重さの順に割り振る形は、シラバスが横型探索として定義しているとおりで、多くの状況ではこちらが妥当である。この案が誤るのは一点だけ——発注元が受け入れの条件に挙げたものと噛み合わないことである。一度通しているあいだ、アの掘り下げは始まらない。一巡で手に入るのは途中時点の領域ごとの一覧だが、発注元はそれを出す必要はないと回答しており、受け入れの条件に挙げているのはいちばん重い懸念を早い時期に下げることのほうである。最終報告で受け取るとされている全体の品質の見通しは、重い順に進めた場合でも、懸念ごとにどこまで確認できたかと残っているリスクを書くことで満たせる。つまり一巡に使った時間は、この状況の受け入れの条件が求めているものを買っていない","落としているものが2つある。1つは、ウとエを範囲に入れないという判断を、結論の側から置いていることである。範囲から外す件があれば、残るリスクの大きさと回避の手立てを示したうえで外すかどうかを発注元が決める、と取り決められており、この案は受け入れ済みという結果だけを最終報告に記している。シラバスは、割り当てた時間が計画したテストをすべて実行できないまま消費されることがあると認めたうえで、その時点でテストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することがリスクベースドテストの利点だとしている。もう1つは、ウを落とす根拠である。合意した並びでウはエより上にあり、計画の段階で外す理由は並びの側にない"],"flip":[null,null,null,null],"flipNote":{"2":"最終報告に何を載せるかを決めているのは、この状況の側ではなくシラバスの側である。ステークホルダーが理解できる方法でテスト結果をリスクの観点から報告することが必要だと述べ、任意の時点における残存リスクレベルに関するテスト進捗の報告をリスクベースドテストの利点として挙げているからである。発注元が消化の割合での報告を望むという一文を置いても、それはこの案を正しくするのではなく、シラバスが必要としている報告を求めない相手を置くだけになる。動かせるのは発注元の求めであって、報告が満たすべき形ではない。","4":"この案を退けている文は2つあり、別々に効く。1つは、範囲から外す件があれば残るリスクの大きさと回避の手立てを示したうえで外すかどうかは発注元が決める、という取り決めである。この案は受け入れ済みという結果だけを最終報告に記しており、決める側に判断を渡していない。もう1つは、発注元と合意した重い並びで、夜勤帯の締め処理はボタンの並びより上に置かれていることである。計画の段階でこれを落とす根拠は並びの側にない。範囲を削る動機になる与件 ── 期間が全件に届かない見込み ── も、この状況には置かれていない。ただしその一文を足したとしても、外す件を決めるのは発注元だという取り決めのほうは残る。案の側で受け入れの判断を発注元に戻す書き方に替えても、並びの3番目を外す根拠は出てこない。並びのほうを動かして夜勤帯の締め処理をいちばん下に置けば、今度は受け入れを済ませた結果だけを報告する点が同じ取り決めで退けられる。片方を動かしても、もう片方が同じようにこの案を落とす。","3":"この案を退けている発注元の求めは、2つの一文に分かれて置かれている。1つは、受け入れの条件としていちばん重い懸念を可能な限り早い時期に下げることを挙げた一文。もう1つは、全体の品質の見通しは稼働開始前の最終報告で受け取れればよく、途中で領域ごとの一覧を出す必要はないと回答した一文である。前者を「稼働開始前のどの時点でも4件それぞれの確認状況を示せること」に差し替えても後者が残り、残った回答は差し替えた条件と正面から食い違う。求めが二枚になった状況では、先に全体を一度通すこの案を正解と言い切れない。後者だけを落としても、いちばん重い懸念を早く下げるという条件が残って同じようにこの案を退ける。動かす先が1つでは足りない。4件のどれにも1つずつ当てて通し、残りを合意した重さの順に配る形そのものは、シラバスが横型探索として定義しているとおりで、プロダクト品質の全体像をできるだけ早い段階で把握したい相手には適する。"},"quote":"場合によっては、テスト実行の優先順位を、カバーするリスクレベルの高いものから厳格に降順とする。このアプローチは縦型探索(depth-first)と呼び、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適している。","ref":"1.3.4","misconception":"実行順序はまず全領域を一度通してから決めるものだと思い込み、最も重い懸念の早期の軽減が求められている場合に縦型探索を選ぶ判断を持っていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["縦型探索として整合しているが、報告を件数の消化に置き換える","横型探索として整合した計画を、最も重い懸念の早期軽減を求める文脈に当てる（宣言軸を担う誤答）","下位2件を計画の段階で範囲から外し、受容を発注元の判断ではなく済んだこととして置く"],"distractorTypes":["D3","D2","D2+D3"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-26","MP-07"]}},{"id":"q-1.3.4-C-3","lo":"TM-1.3.4","cluster":"1.3.4-C","variant":3,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"電力小売の料金計算と請求のシステムに、新しい料金メニューを追加する。切替の受付は来月に始まる。\n\n提供開始の可否は、営業・カスタマーサポート・法務が集まる合同レビューで判定する。合同レビューは、追加する部分について何がどこまで確認できているのかを、領域を落とさずに一覧で示すことを求めている。手つかずの領域が一つでも残ると、その回は判定を見送り、提供開始が1か月ずれる運びになっている。期間を延ばすか残るリスクを受け入れるかも、合同レビューが決める。\n\n懸念は4つある。新メニューの割引が二重に適用されて請求額が過少になること、切替月の日割り計算を誤って境目の請求額がずれること、請求書の発行が締め日に滞留すること、料金内訳の並びが案内資料と違うことである。重さは、二重適用がいちばん重く、次が日割り計算、その次が発行の滞留で、内訳の並びがいちばん軽いという順で関係者の合意がとれている。相対的な並びとしてのみ合意しており、金額には換算していない。\n\nこのシステムは3年前に基盤を刷新しており、その移行は別のチームが担当した。","question":"合同レビューの求めと合意した重さを分析したとき、テスト実行の進め方として最も妥当なものはどれか。1つ選べ。","choices":["まず4つの領域それぞれに最優先のテストを1つ当てて通す。そのうえで掘り下げる先は、通しで欠陥が出た領域に絞り、欠陥が出なかった領域は重さに関わらず以後は触らない。合同レビューには領域ごとの確認結果を並べて示す。","合意した重さが上のものから厳格に降順で進め、二重適用に用意したテストを最優先で実行し、確認を仕上げてから日割り計算に移る。残る2つの領域は、その2件を仕上げた時点で残り時間に応じて着手する。重い懸念ほど早く下がるので、合同レビューにはそこまでの結果と残っているリスクを示す。","どの懸念にも最優先のテストを1件は先に当てて、4つの領域を一度通す。通し終えたあとの残りは、合意した重さが上のものから順に優先度を付けて配分する。合同レビューには、領域ごとに確認できた範囲と残っているリスクを並べて示す。","重い2件の確認に期間を使い切る計画とし、発行の滞留と内訳の並びは今回の対象に入れない。対象に入れなかった2つは、起きても窓口の運用で回避できるものとして、残るリスクを受け入れたうえで合同レビューに報告する。"],"answer":[2],"explanation":{"signals":"効くのは、合同レビューが提供開始の可否を判定する場であり、追加する部分について何がどこまで確認できているのかを、領域を落とさずに一覧で示すよう求めているという一文である。手つかずの領域が一つでも残れば判定は見送りになり、提供開始が1か月ずれる。シラバスはテスト実行の優先順位の付け方を2つ挙げ、どちらが適するかをステークホルダーの求めで分けている。合意した重さの並び（二重適用→日割り計算→発行の滞留→内訳の並び）は、一度通したあとの配分を決めるために使う。3年前の基盤刷新を別のチームが担当したことは、どの案の当否にも関与しない。","why":"取るべきは、どの懸念にもまず最優先のテストを当てて4つの領域を一度通し、そのあとの残りを合意した重さの順に配る横型探索である。合同レビューが提供開始の可否を判定するために求めているのは領域を落とさない一覧であり、シラバスは横型探索を「各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」進め方と定義して、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適するとしている。合意した重さを通しのあとの配分に使うことも、領域ごとの残りを示すことも、この進め方の内側でそのまま満たされる。\nシラバスはもう一方の進め方として縦型探索を挙げ、テスト実行の優先順位をカバーするリスクレベルの高いものから厳格に降順とするこの形は、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適するとしている。どちらも正規の進め方で、適する場面を分けているのはステークホルダーの求めである。ここでそれを決めているのは、手つかずの領域が一つでも残ればその回の判定を見送るという合同レビューの運びのほうであり、重い懸念を早く下げること自体を急ぐ事情はこの状況には書かれていない。\n報告の形については、シラバスが、リスクベースドテストは任意の時点における残存リスクレベルに関するテスト進捗の報告を可能にし、これにより開発チームとステークホルダーが残存リスクレベルに基づいてリリースの判定を含むモニタリングとコントロールを行うことを支援する、と述べている。領域ごとの残りを並べて示すことで、一度通して得た全体像が判定に使える形になる。\nこの進め方が失うものもある。通しに時間を使う分、いちばん重い二重適用の掘り下げは、厳格に降順で進めた場合より遅れる。全体像を早く得ることと、最も重いリスクを最速で下げることは同時には取れない。ここでは判定の運びが前者を選ばせている。","distractors":["落としているのは、通したあとの掘り下げ先を重さで決めることである。前半の通しは横型探索の定義どおりで正しい。しかし後半で掘り下げる先を、通しで欠陥が出た領域に絞っている点が、「その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」という定義の後半から外れる。一度当てたテストで欠陥が出なかったことは、その領域が軽いことを意味しない。いちばん重い二重適用で最初の1件が通れば、合意した並びの最上位が以後まったく触られないまま判定の回を迎え、関係者が付けた重さが配分に反映されない。欠陥が出た場所を手がかりにする発想は保守の現場では働くが、ここでは重さの合意が先にある","落としているのは、領域を落とさない一覧を判定の回までに出せることである。これは縦型探索であり、進め方として自己矛盾はない。重い順に仕上げてから次へ移る段取りもシラバスが縦型探索として定義しているとおりで、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合には、むしろこちらが適する。この案が誤るのは一点だけ——この状況の合同レビューの求めと噛み合わないことである。残る2つに着手できるかどうかは残り時間次第なので、発行の滞留と内訳の並びが手つかずのまま判定の回を迎えうる。手つかずの領域が一つでも残れば判定は見送りになり、提供開始は1か月ずれる",null,"落としているのは、やはり領域を落とさない一覧である。発行の滞留と内訳の並びを最初から対象の外に置く計画で、その2つには一度もテストを当てないため、判定の回に示せるのは重さの見立てだけになる。合意した並びで発行の滞留は3番目にあり、計画の段階で対象から外す根拠は並びの側にない。またシラバスは、割り当てた時間が計画したテストをすべて実行できないまま消費されることがあると認めたうえで、その時点でテストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することがリスクベースドテストの利点だとしている。窓口の運用で回避できるという見立ても含めて、受け入れるかどうかは合同レビューが決める事柄であり、ここでは受け入れたあとの姿だけが持ち込まれている"],"flip":[null,null,null,null],"flipNote":{"1":"掘り下げ先を欠陥の出た領域に絞ることが結果として重さの順と一致するのは、通しの1件で欠陥が出る領域が、合意した並びの上から順に並んでいるときだけである。それは通してみるまで分からないので、計画の段階の進め方としては置けない。残りのテストの優先順位をカバーするリスクのレベルに基づいて付けるという線はシラバスが引いており、通しの結果がその線を置き換えてよいと述べる一文を、この状況の側に足すこともできない。","4":"この案を退けている文は3つあり、どれも独立に効く。関係者が合意した重さの並びでは、請求書の発行の滞留は料金内訳の並びより上にあり、計画の段階で対象から外す根拠が並びの側にない。手つかずの領域が一つでも残ればその回は判定を見送るという運びは、2つの領域に一度もテストを当てないこの案をそのまま落とす。そして、期間を延ばすか残るリスクを受け入れるかも合同レビューが決めるという取り決めが、受け入れたあとの姿だけを持ち込むこの案を退ける。窓口の運用で回避できるという見立ても、この状況が与えたものではなくこの案が自分で置いたもので、その見立ての当否ごと、受け入れるかどうかは合同レビューが決める。どれか1つを外しても残る2つが同じようにこの案を落とすので、動かす先が1つでは足りない。","2":"この案を退けている文はシナリオに2つあり、どちらも独立に効く。1つは、追加する部分について何がどこまで確認できているのかを領域を落とさずに一覧で示すよう合同レビューが求めている一文。もう1つは、手つかずの領域が一つでも残るとその回は判定を見送り、提供開始が1か月ずれるという運びの一文である。求めのほうを「いちばん重い二重適用を提供開始までに確実に下げたという確認」に差し替えても、判定を見送る運びは残る。残る2つの領域への着手を残り時間に委ねるこの案は、発行の滞留と内訳の並びが手つかずのまま判定の回を迎えうるので、その運びに掛かって落ち続け、4つの領域を通す案のほうが残る。逆に判定の運びだけを外しても、領域を落とさない一覧という求めが同じ理由でこの案を退ける。動かす先が1つでは足りない。合意した重さの上から厳格に降順で進めること自体はシラバスが挙げる正規の進め方で、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合には適する。"},"quote":"あるいは、各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける。このアプローチは横型探索(breadth-first)と呼び、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適している。","ref":"1.3.4","misconception":"全体像は重いものから順に積み上げれば自然に出てくると思い込み、判定の場が領域を落とさない一覧を求めている場合に横型探索を選ぶ判断を持っていない"},"meta":{"concept":"リスクベースドテスト","distractorIntent":["前半の通しは正しいが、後半の掘り下げ先を合意した重さではなく通しの結果で決める","縦型探索として整合した計画を、領域を落とさない一覧を求める文脈に当てる（宣言軸を担う誤答）","軽い2領域を計画の段階で対象から外し、受容を判定ではなく済んだこととして持ち込む"],"distractorTypes":["D3","D2","D2+D3"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-05","MP-26"]}},{"id":"q-1.3.5-A-1","lo":"TM-1.3.5","cluster":"1.3.5-A","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは鉄道の信号制御ソフトウェアのテストマネージャーである。この装置は故障すると人命に関わり、安全関連規格に基づく認証を受ける必要がある。","question":"この案件で採るリスク分析の進め方として最も適切なものはどれか。1つ選べ。","choices":["テストチームと一部の関係者で、起こりやすさと痛みの度合いを順序尺度で整理し、計画の土台にする","認証の審査に出せる形で手順と記録の様式を定め、幅広い関係者を集めて、起こりやすさと痛みの度合いを合議で段階に落とす","手順と様式は定めるが、参加は開発とテストの担当者にとどめ、要因は各自の経験で見積もる","手順と様式を定めて文書に残し、幅広い関係者を集め、詳細な要因から定めた数式で算出する"],"answer":[3],"explanation":{"signals":"効くのは、人命に関わり安全関連規格に基づく認証を受けるという2つの記述だけである。鉄道という業種そのものは判断を変えない。この対象がセーフティクリティカルであることが、どちらの種類の技法を採るかを決める。","why":"手順と様式を定めて文書に残し、幅広い関係者を集め、詳細な要因から定めた数式で算出する ── シラバスが重量的な技法の姿として述べていることを、この進め方だけが揃えている。この案件は人命に関わり安全関連規格に基づく認証を受ける対象であり、シラバスはセーフティクリティカルなシステムでは重量的な技法を使うことが多い、セーフティクリティカルではないアプリケーションでは通常は軽量的な技法を採用する、と述べている。その重量的な技法の姿として挙げられているのは、形式的であること、定義された手順と詳細な文書を用いること、幅広いステークホルダーグループが関与すること、リスクアセスメントに詳細な要因を用い、それらの要因からリスク可能性とリスク影響を計算する数式を用いることである。テストチームと一部の関係者で起こりやすさと痛みの度合いを順序尺度で整理する進め方は、シラバスが軽量的な技法として述べている姿そのものである。手順と記録の様式を定めて幅広い関係者を集めながら、起こりやすさと痛みの度合いを合議で段階に落とす進め方は、アセスメントの部分が順序尺度による整理、すなわち軽量的な側の姿にとどまっている。手順と様式は定めても参加を開発とテストの担当者にとどめ、要因を各自の経験で見積もる進め方は、幅広いステークホルダーグループの関与と、詳細な要因からの数式による算出の両方を欠いている。","distractors":["テストチームと限られた関係者で、順序尺度により整理する進め方は、シラバスが軽量的な技法として述べている姿そのものである。労力が少なくて済むのは事実だが、この対象はセーフティクリティカルであり、重量的な技法を使うことが多いと述べられている側にある","手順と記録の様式を定める点と、幅広い関係者を集める点は重量的な技法の姿と一致しており、認証を受ける案件の進め方として実際に通る。しかし、起こりやすさと痛みの度合いを合議で段階に落とすのは、リスク要因を順序尺度に基づいて整理する軽量的な技法の側の姿である。重量的な技法におけるリスクアセスメントは、リスク可能性とリスク影響に関する詳細な要因を用い、それらの要因から可能性と影響を計算する数式を用いる","手順と様式を定める点は重量的な技法と一致しており、最も紛らわしい。しかし参加を開発とテストの担当者に絞っている点と、要因を各自の経験で見積もっている点の2つが外れている。重量的な技法は幅広いステークホルダーグループの関与と、詳細な要因からの数式による算出を伴う",null],"flip":["対象がセーフティクリティカルではなく、短いイテレーションで進む業務アプリケーションであれば、この進め方が正しくなる。誤っているのは進め方そのものではなく、この対象に当てているという点である",null,null,null],"flipNote":{"2":"この選択肢は、重量的な技法の形式性（定義された手順と詳細な文書、幅広いステークホルダーグループの関与）と、軽量的な技法のアセスメント（順序尺度による整理）を混ぜている。対象からセーフティクリティカルという条件を外すと、テストチームと一部の関係者で順序尺度により整理する軽量的な進め方が同時に正しくなり、外さなければ、詳細な要因とそこから可能性と影響を計算する数式が欠けたままである。1つの条件でこの選択肢だけが正解になる置き方が無い","3":"この選択肢は、幅広いステークホルダーグループの関与と、詳細な要因からの数式による算出という2つを欠いている。欠けが2つあるため条件を1つ動かしても重量的な技法の姿にはならず、逆に重量的な技法が求められない対象に変えると、順序尺度で整理する軽量的な進め方が同時に正しくなる"},"quote":"技法には、基本的に重量的と軽量的の2種類がある。セーフティクリティカルなシステムでは、重量的な技法を使うことが多い。セーフティクリティカルではないアプリケーションでは、通常、軽量的な技法を採用する。重量的な技法は形式的であり、定義された手順と詳細な文書を用いる。これらの手法には、幅広いステークホルダーグループが関与する。重量的な技法におけるリスクアセスメントは、リスク可能性とリスク影響に関する詳細な要因を用いる。そして、それらの要因からリスク可能性とリスク影響を計算する数式を用いる。","ref":"1.3.5","misconception":"重量的な技法を「手順を決めて文書を残すこと」とだけ覚えており、幅広いステークホルダーの関与と、詳細な要因からの数式による算出まで含むことを見落としている"},"meta":{"concept":"リスクベースドテストの技法","distractorIntent":["セーフティクリティカルな対象に軽量的な進め方を当てる","手順と文書さえ整えれば重量的だと考える","手順・文書・幅広い関与まで揃えれば重量的だと考え、詳細な要因からの数式による算出を順序尺度の合議に置き換える"],"distractorTypes":["D1","D3","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-32"]}},{"id":"q-1.3.5-A-2","lo":"TM-1.3.5","cluster":"1.3.5-B","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストマネージャーが、リスクベースドテストの技法を重量的なものと軽量的なものに整理している。","question":"軽量的な技法の例として**適切でないもの**はどれか。1つ選べ。","choices":["体系的ソフトウェアテスト(SST)","故障モード影響解析(FMEA)","プラグマティックリスク分析マネジメント(PRAM)","プロダクトリスクマネジメント(PRISMA)"],"answer":[1],"explanation":{"signals":"効くのは「軽量的な技法の例か」という一点である。4つともシラバスが 1.3.5 で名前を挙げている実在の技法であり、聞き覚えがあるかどうかでは絞れない。分かれ目は、重量的と軽量的のどちらの側の例として挙げられているかにある。","why":"故障モード影響解析(FMEA)は、シラバスが重量的な技法の例として名前を挙げている側にある。だから軽量的な技法の例としては適切でない。シラバスが重量的な技法の例として挙げているのは、ハザード分析、エクスポージャーコスト、故障モード影響解析とその派生、フォールトツリー解析といったものであり、故障モード影響解析については、品質リスク、その潜在的な原因、および影響する度合いを識別し、重要度、優先度、および検出率を割り当てる技法だと説明している。詳細な要因を用いる重量的な技法の側の姿である。残る3つは、軽量的な技法を説明する箇所で名前が挙がっている。体系的ソフトウェアテストは、要件仕様が提供されている場合にだけ使う技法として、プラグマティックリスク分析マネジメントとプロダクトリスクマネジメントは、リスク分析の入力として要件やその他の仕様を使うか、もしくはステークホルダーからの入力に基づいて完全に機能することもできる技法として置かれている。","distractors":["体系的ソフトウェアテストは軽量的な技法として挙げられている。シラバスはこれを、要件仕様が提供されている場合にだけ使う技法として他と区別しているため、条件が付く点で別物に見えるが、区分としては軽量的の側である",null,"プラグマティックリスク分析マネジメントも軽量的な技法として挙げられている。名前にリスク分析という語が入っているため重量的に見えることがあるが、シラバスは、リスク分析の入力として要件やその他の仕様を使うか、ステークホルダーからの入力に基づいて機能することもできる技法として位置づけている","プロダクトリスクマネジメントも軽量的な技法である。マネジメントという語から形式的な枠組みを連想しやすいが、こちらもステークホルダーからの入力に基づいて機能できる側に挙げられている"],"flip":[null,null,null,null],"flipNote":{"1":"体系的ソフトウェアテストは、シラバスがプラグマティックリスク分析マネジメント・プロダクトリスクマネジメントと並べて軽量的な技法として挙げているものであり、区分そのものが正しい以上、この技法が軽量的でなくなる条件はシナリオにも選択肢にも無い。シラバスは軽量的な技法のうちこの技法にだけ、要件仕様が提供されている場合にだけ使うという限定を付けており、その限定を問う形にすればこの技法だけが外れるが、それは条件の変更ではなく設問の変更である","3":"プラグマティックリスク分析マネジメントとプロダクトリスクマネジメントは、シラバスの同じ1文の中で、リスク分析の入力として要件やその他の仕様を使うか、もしくはステークホルダーからの入力に基づいて完全に機能することもできる技法として、同じ性質のまま並記されている。2つを分ける条件が原文に無いため、一方だけを正解にする条件は書けない。設問を肯定形にすれば選ぶ側に立つが、そのとき正しくなる選択肢は3つになる","4":"プロダクトリスクマネジメントは、プラグマティックリスク分析マネジメントと同じ1文で同じ性質のものとして挙げられており、2つを分ける条件が原文に無い。設問を肯定形に変えても、セーフティクリティカルな対象で採る技法を問う形に変えても、軽量的な3つが同時に同じ側へ回るため、この選択肢だけが選ばれる形にはならない"},"quote":"重量的な技法の例としては、以下のようなものがある：…故障モード影響解析(FMEA)とその派生：品質リスク、その潜在的な原因、および影響する度合いを識別し、重要度、優先度、および検出率を割り当てる。","ref":"1.3.5","misconception":"1.3.5 に出てくる技法名をひとまとめに「リスクベースドテストの技法」として覚えており、それぞれが重量的と軽量的のどちらの例として挙げられているかを区別していない"},"meta":{"concept":"リスクベースドテストの技法","distractorIntent":["要件仕様が要る技法は重量的だと考える","名前にリスク分析が入っていると重量的だと考える","マネジメントという語から形式的な枠組みを連想する"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-32"]}},{"id":"q-1.3.6-A-1","lo":"TM-1.3.6","cluster":"1.3.6-A","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、ふりかえりの場で、リスクベースドテストの利点をどれだけ実現できたかを測ろうとしている。","question":"そこで答える質問として**適切でないもの**はどれか。1つ選べ。","choices":["懸念ごとに割り当てたテストを、計画した件数どおり実行できたか","関係する人たちが洗い出しに加わったか、その意見が結果に反映されたか","優先度の高い欠陥のほとんどを、テスト実行の早い段階で見つけられたか","実行を見送ったテストは、実行したものより関連する懸念が軽かったか"],"answer":[0],"explanation":{"signals":"効くのは、測ろうとしているのが「リスクベースドテストの利点をどれだけ実現できたか」である点である。テストが計画どおり進んだかではない。4つとも実際のふりかえりで口にされる問いなので、自然さでは絞れない。","why":"懸念ごとに割り当てたテストを、計画した件数どおり実行できたか ── これだけが、シラバスの挙げるふりかえりの質問に無い。件数を消化できたかは進捗の確認であって、リスクベースドテストの利点をどれだけ実現できたかを測る問いではないからである。シラバスは、ふりかえりでテストチームがその利点をどの程度実現できたかを測定すべきだとし、答えることを含む質問として、関連するステークホルダーはリスク分析に関与したか（または意見を反映したか）、リスク分析へのステークホルダーの関与は適切だったか、深刻な欠陥の見逃しで深刻なインシデントが本番で発生した場合それらは解決されたか、優先度の高い欠陥のほとんどはテスト実行の早い段階で発見されたか、テストチームはテスト結果をステークホルダーにリスクの観点から説明できたか、スキップしたテストは実行したテストよりも関連するリスクレベルが低かったか、を並べている。関係する人たちが洗い出しに加わったか意見が結果に反映されたか、優先度の高い欠陥のほとんどをテスト実行の早い段階で見つけられたか、実行を見送ったテストは実行したものより関連する懸念が軽かったか ── 残る3つはこの並びにそのまま載っている。","distractors":[null,"ステークホルダーがリスク分析に関与したか、意見が反映されたかは、シラバスが挙げる質問そのものである。否定形の設問なので、正しい質問であることが選ばない理由になる","優先度の高い欠陥のほとんどをテスト実行の早い段階で発見したかも、挙げられている質問である。高いリスクの早期軽減が効いたかを見る問いであり、リスクベースドテストの利点に直結する","スキップしたテストは実行したテストよりも関連するリスクレベルが低かったか、も挙げられている質問である。落とした側の正当性を事後に確かめる問いであり、労力をリスクレベルに比例させられたかを測る"],"flip":[null,null,null,null],"flipNote":{"2":"ステークホルダーがリスク分析に関与したか、意見が反映されたかは、シラバスがふりかえりで答えるべきものとして挙げている6つの質問の1つである。設問を肯定形にすればこの質問を選ぶことになるが、そのときは残る2つの質問も同じ6つの中にあるため同時に正しくなり、1つ選べの形が成り立たない","3":"優先度の高い欠陥のほとんどをテスト実行の早い段階で発見したかも、シラバスの6つの質問の1つである。肯定形に変えると、この質問も残る2つの質問も同時に正しくなる。6つのリストの中でこの質問だけを選ばせる条件は原文に無い","4":"スキップしたテストは実行したテストよりも関連するリスクレベルが低かったかも、シラバスの6つの質問の1つである。時間切れでテストを打ち切った案件ではこの問いが重く働くが、重く働くことと一意の正解になることは別であり、肯定形に変えれば正しくなる選択肢は3つになる"},"quote":"ふりかえりでは、テストチームは、リスクベースドテストの利点をどの程度実現できたかを測定すべきである。多くの場合、これには、メトリクスの利用やコンサルティングを通じて、以下の質問の一部またはすべてに答えることを含む：関連するステークホルダーはリスク分析に関与したか、または意見を反映したか？／リスク分析へのステークホルダーの関与は適切だったか？／深刻な欠陥の見逃しで深刻なインシデントが本番で発生した場合、それらは解決されたか？／優先度の高い欠陥のほとんどは、テスト実行の早い段階で発見されたか？／テストチームはテスト結果をステークホルダーにリスクの観点から説明できたか？／スキップしたテストは、実行したテストよりも関連するリスクレベルが低かったか？","ref":"1.3.6","misconception":"リスクベースドテストの成功を、テストがどれだけ実行できたかという進捗の量で測れると考え、リスクに照らした配分と説明ができたかを問う質問群であることを捉えていない"},"meta":{"concept":"リスクベースドテストの成功メトリクス","distractorIntent":["ステークホルダーの関与を問う質問を、成功の測定から外れたものと見る","早期発見を問う質問を、成功の測定から外れたものと見る","スキップの正当性を問う質問を、成功の測定から外れたものと見る"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-07"]}},{"id":"q-1.3.6-A-2","lo":"TM-1.3.6","cluster":"1.3.6-B","variant":1,"chapter":1,"section":"1.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"プロジェクトの
