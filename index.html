は、再現の手順が書かれていないレポートを、却下へ移して理由を選ぶこともせずに一覧から消した扱いである。調べるのに足りる情報が報告に無いことは、(2)が挙げる無効な情報という理由の当てはまる場合として、そのまま書かれている。その理由を選ばずに済ませたので、この1件はどの理由にも数えられない。さらに(3)は、作った欠陥レポートは却下したものも含めて消さずに残すと決めているので、一覧から消した時点で、四半期の内訳からも、重複と偽陽性の割合の分母からも落ちる。(2)と(3)の両方から外れている。この取り決めが却下を残す形をとっている背景は、シラバスの記述にある。シラバスは却下について、欠陥レポートはそれを処理した人（通常は開発者やアナリスト）が却下しており、却下の理由はさまざまであり、その情報は欠陥レポートへ追加する、と述べている。そこで挙がっている無効な情報・誤ったテスト・欠陥レポートの重複は例であって、組織が使える理由の全部ではない。だからこの組織は理由を4つに定め、それぞれ当てはまる場合まで書いた。シラバスはさらに、重複欠陥や偽陽性欠陥は、別のステータス、または却下理由の選択と却下ステータスを組み合わせて表すべきであり、これらはテストプロセスの改善を目的とした欠陥分析に役立つ可能性があると述べている。取り決め(2)と(3)は、このうち後者 ── 却下の理由を選び、レポートを残して四半期ごとに内訳を数える ── を採ったものであり、理由を選ばず記録も残さない扱いは、その仕組みを成り立たせている2つの条を同時に外す。","distractors":["この扱いは(1)(2)(3)のとおりである。テストの側に原因があったものもまず欠陥レポートを作るのが(1)で、製品に問題は無くテストの環境かデータの側に原因があったものには、偽陽性という理由が(2)に用意されている。レポートを残したまま偽陽性を選んで却下へ移すのはそのままの運用であり、偽陽性の割合を四半期ごとに数えるという(3)の使い道も、この1件が残っていて初めて成り立つ。製品に問題が無かったと分かったのだから、レポートは残さず環境の課題として別に持つほうが欠陥の一覧が濁らずに済む ── その整理は現場でよく行われるので、従っていない扱いに見えてしまう","重複は(2)が挙げる4つの理由の1つで、当てはまる場合も、登録済みの欠陥と同じ現象、と書かれている。理由に重複を選んで却下へ移し、レポートを消さずに残すのは取り決めのとおりの扱いである。観察した内容を先のレポートに書き足すことも、どの条も禁じていないうえ、(3)の数え方を妨げない。同じ現象の2件目は1件目にまとめて消すのが普通で、重複をわざわざ却下として残すのは一覧を増やすだけだ ── そう考えると、この扱いのほうが取り決めから外れているように見える","(1)はテストの側に原因があったものもまず欠陥レポートを作ると決めており、(2)は手順か期待結果が仕様と合っていないものに、誤ったテストという理由を用意している。理由を選んで却下へ移し、レポートを残したうえでテストを直すのは、取り決めのとおりの扱いである。テストの手順や期待結果の誤りは製品の欠陥ではないのだから、欠陥レポートにせずテストチームの中で直せば足りる、という読み方をすると、この扱いは行き過ぎに見える",null],"flip":[null,null,null,null],"quote":"却下：欠陥レポートは、それを処理した人 （通常は開発者やアナリスト） が却下している。却下の理由はさまざまであり（例えば、無効な情報、誤ったテスト、欠陥レポートの重複）、その情報は欠陥レポートへ追加する。…重複欠陥や偽陽性欠陥は、別のステータス、または却下理由の選択と 却下ステータスを組み合わせて表すべきである。これらは、テストプロセスの改善を目的とした欠陥分析に役立つ可能性がある。","ref":"2.3.1","misconception":"却下と分かったレポートを、残しても使い道の無い記録とみなし、消す・理由を選ばずに閉じるといった形で片づけてしまう。却下の理由を選んでレポートを残すからこそ、重複や偽陽性の割合が数えられ、報告の仕方の見直しに使える","flipNote":{"1":"この扱いを取り決めから外すには、製品に問題が無かったものの行き先を却下の外に置くよう、偽陽性という理由の使い道そのものを差し替えることになる。しかしそれだけでは、再現の手順が書かれていないレポートを、理由を選ばないまま一覧から消した扱いは、取り決めから外れたままである。従っていない扱いが2つになり、1つ選べが成り立たない。この扱いが置かれているのは、原因がテストの環境やデータにあったと分かった不正に、却下の理由のどれを選ぶかという話であって、欠陥レポートを作るか作らないかという話ではない","2":"重複と分かったものを却下ではない別の扱いにすれば、この扱いは取り決めから外れる。ただしその差し替えは、重複を却下の理由から抜くことと、抜いたあとの行き先を決めることの両方を要する。しかもそのうえで、理由を選ばずレポートも残していない扱いはやはり外れたままなので、従っていない扱いが2つになる。この扱いが寄りかかっているのは、重複を却下の理由として選んでレポートを残すという(2)と(3)の組み合わせであり、それはシラバスの示す重複欠陥の表し方 ── 別のステータスを使うか、却下理由の選択と却下ステータスを組み合わせるか ── のうちの後者である","3":"手順や期待結果の誤りによる不合格を欠陥レポートにしないと決めれば、この扱いは取り決めから外れる。しかしそれは(1)の前半、すなわちテストの側に原因があったものもまず欠陥レポートを作るという行を書き換えることであり、書き換えたあとも、理由を選ばずレポートを消した扱いは外れたままである。従っていない扱いが2つになる。この扱いの居場所は、誤ったテストという却下の理由が用意されているところであって、欠陥レポートを作るか作らないかというところではない"}},"meta":{"concept":"欠陥マネジメントの実装","distractorIntent":["製品に問題が無かったと分かった不正を、欠陥レポートの外へ出して管理するほうが一覧が濁らないと考え、偽陽性という却下の理由が置かれていることを見落とす","同じ現象の2件目は1件目にまとめて消すものだと考え、重複を却下の理由として残すことが後の集計の材料であることを見落とす","テストの手順や期待結果の誤りは製品の欠陥ではないので欠陥レポートにしないと考え、テストの側に原因があったものも作ると決めた条を飛ばす"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-72","MP-86"]}},{"id":"q-2.3.2-A-1","lo":"TM-2.3.2","cluster":"2.3.2-A","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"保険の契約管理システムを、社内の開発チームと2社のサプライヤーで作っている。テストマネージャー、開発とサプライヤーの代表、プロダクトオーナーが集まる欠陥マネジメント委員会を置き、トリアージミーティングを毎週開いている。","question":"この欠陥マネジメント委員会が担うものとして最も適切なものはどれか。1つ選べ。","choices":["欠陥ステータスの名称と、ステータス間の遷移の規則と、各ステータスに責任を持つ役割を、全社共通の標準として定める","解決へ移された欠陥について、レポートに書かれた再現手順にしたがって確認テストを行い、修正で本当に直ったかを見極める","上がってきたレポートが有効な欠陥かを見極め、利点とリスクと費用を見比べて、直すか却下するか先送りするかを決める","専任の欠陥マネージャーを置いたときは、有効な欠陥かどうかと直すかどうかを、その担当者に委ねる"],"answer":[2],"explanation":{"signals":"効くのは「この欠陥マネジメント委員会が担うもの」という主体の指定だけである。保険という業種も、トリアージミーティングを毎週開いていることも、どの活動が委員会の持ち分かを動かさない。4つはどれも欠陥マネジメントの現場で実際に行われている活動なので、活動の中身が正しいかどうかでは絞れず、シラバスがその活動を誰に割り当てているかで分かれる。","why":"上がってきたレポートが有効な欠陥かを見極め、直すか却下するか先送りするかを決める ── これがこの委員会の持ち分である。シラバスは、欠陥マネジメント委員会が各欠陥レポートが有効な欠陥であるかどうかを判断し、その欠陥を修正すべきか、却下すべきか、延期すべきかを決定するとし、この判定には委員会が欠陥の修正に関連する利点、リスク、コストを検討する必要があると続けている。「利点とリスクと費用を見比べて」は、この検討にそのまま当たる。毎週開いているトリアージミーティングも、原文がこの検討を議論する場として有益だとしているものである。残る3つも欠陥マネジメントの現場で現に行われている活動だが、原文はそれぞれを別の相手に置いている ── 全社共通の標準づくりは、全体的な欠陥マネジメントプロセスと欠陥マネジメントツールを所有していることが多いとされるテスト組織とテストマネージャーの側、確認テストはテスト担当者の仕事、専任の欠陥マネージャーが担うのは委員会のミーティングでの意思決定の準備とフォローである。原文が委員会に割り当てているのは特定のプロジェクトの欠陥マネジメント、すなわちこの判断そのものである。","distractors":["全社共通の標準として定める、という適用範囲がこの活動の持ち主を決めている。欠陥ステータスの名称、ステータス間の遷移の規則、各ステータスに責任を持つ役割は欠陥ワークフローを形づくる要素で、シラバスは欠陥ワークフローを、可能であれば、すべてのプロジェクトで統一された欠陥マネジメントを行うために、組織全体で定義すべきだとしている。全体的な欠陥マネジメントプロセスと欠陥マネジメントツールを所有していることが多いのも、原文ではテスト組織とテストマネージャーである。仕組みを日々使う顔ぶれが仕組みも決めると考えると選びたくなるが、委員会に割り当てられているのは特定のプロジェクトの欠陥マネジメントである","確認テストで修正が本当に効いたかを見極める作業は、シラバスが欠陥ワークフローの解決ステータスの説明の中でテスト担当者に割り当てているものである。トリアージの場では修正の進み具合も話題になるため、直ったかどうかの確認まで委員会が引き取るように見えるが、原文が委員会に置いているのはその前段、すなわち有効な欠陥かどうかの判断と、修正・却下・延期の決定である",null,"シラバスが専任の欠陥マネージャーの任命を挙げているのは、委員会のミーティングでの意思決定の準備およびフォローに必要な労力を考慮した場合であって、判断そのものを移すためではない。非常に大規模なプロジェクトでは担当者を決めて捌いた方が速いという実感から選ばれるが、有効な欠陥かどうかと直すかどうかを決めるのは委員会のままである"],"flip":[null,null,null,null],"flipNote":{"1":"欠陥ステータスの名称と遷移の規則と責任を持つ役割を全社共通の標準として定めることは、シラバスが組織全体で定義すべきだとしている欠陥ワークフローの側の話であり、その所有者として原文が挙げているのはテスト組織とテストマネージャーである。委員会に置かれているのは特定のプロジェクトの欠陥マネジメントで、この活動を委員会へ移す記述は原文に無い。全社の標準を誰が定めるかを問う設問にすれば正しくなるが、それは条件の変更ではなく設問の変更である","2":"確認テストを行って修正で本当に直ったかを見極めるという作業そのものは正しく、外れているのはその実行者を委員会に置いた点だけである。シラバスは解決ステータスの説明でこれをテスト担当者の仕事としており、実行者を委員会へ移す記述はどこにも無い。誰が確認テストを実施するかを問う設問なら答えになるが、それはシナリオや選択肢の条件ではなく設問そのものを動かすことになる。委員会が担うものを問うている限り、この選択肢は立たない","4":"専任の欠陥マネージャーを置く理由としてシラバスが述べているのは、委員会のミーティングでの意思決定の準備とフォローに要する労力であって、判断の委譲ではない。この選択肢が答えになるには欠陥マネージャーに有効性と修正可否の決定権があることが要るが、それは受験者が動かせるシナリオや選択肢の条件ではなく原文の書き換えである。決定を委員会に割り当てている文が残る限り、答えは委員会の判断を述べたもののままである"},"quote":"テスト組織とテストマネージャーは、全体的な欠陥マネジメントプロセスと欠陥マネジメントツールを所有していることが多いが、通常、特定のプロジェクトの欠陥マネジメントは、機能横断的なチームが担当する。…欠陥マネジメント委員会は、各欠陥レポートが有効な欠陥であるかどうかを判断し、その欠陥を修正すべきか…却下すべきか、延期すべきかを決定する。この判定には、欠陥マネジメント委員会が、欠陥の修正に関連する利点、リスク、コストを検討する必要がある。","ref":"2.3.2, 2.3.1","misconception":"欠陥マネジメントに関わる顔ぶれを一括りにしてしまい、欠陥マネジメント委員会が下す判断と、テスト担当者が行う確認テスト、テスト組織とテストマネージャーが所有する全体的なプロセスの定義、専任の欠陥マネージャーが担う意思決定の準備とフォローを、それぞれの持ち分として切り分けられていない"},"meta":{"concept":"機能横断的な欠陥マネジメント","distractorIntent":["テスト組織が所有する全体プロセスの定義を、委員会の持ち分に置く","テスト担当者が行う確認テストを、委員会の持ち分に置く","委員会の意思決定の準備とフォローを担う欠陥マネージャーに、判断そのものを移す"],"distractorTypes":["D1","D1","D10"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-101"]}},{"id":"q-2.3.2-B-1","lo":"TM-2.3.2","cluster":"2.3.2-B","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"物流会社の倉庫管理システムを社内チームとサプライヤーで開発している。欠陥マネジメント委員会があり、欠陥ワークフローとレポートの属性は定義して全員に共有済み、ツールは全員に行き渡り、担当分の更新も毎日滞りない。却下と延期の決定はツール上のステータス変更だけで伝えられ、その理由が開発とサプライヤーの担当者に届かないまま、同じ不正が別のレポートとして何度も上がってくる。","question":"効果的かつ効率的な欠陥マネジメントに必要なもののうち、欠けているものを補う取り組みはどれか。1つ選べ。","choices":["判断のやり取りはツール上で完結させることにして、却下と延期の理由を書く欄を必須にし、更新の通知が開発とサプライヤーの担当者にも届くよう宛先を広げる","却下と延期をそれぞれ別のステータスに分け、遷移の規則と次に動かす役割を決め直して、レポートの記入項目に加える","委員会のメンバーに、担当分だけでなく却下と延期になったレポートも毎日見直し、気づいた点をその場で書き込むよう求める","却下と延期は、修正の利点とリスクと費用をトリアージミーティングで議論して決め、その結論と理由を開発とサプライヤーの担当者に伝える"],"answer":[3],"explanation":{"signals":"効くのは、何が働いていて何が働いていないかを述べたシナリオの記述である。欠陥ワークフローとレポートの属性は定義して全員に共有済み、ツールは全員に行き渡り、担当分の更新も毎日滞りない ── ここまでは揃っている。揃っていないのは、却下と延期の決定がツール上のステータス変更だけで伝えられ、なぜそう決まったかが開発とサプライヤーの担当者に届かないという1点である。倉庫管理システムという題材は、どの取り組みの当否も変えない。","why":"欠けているのはコミュニケーションで、それを補うのは、却下と延期を修正の利点とリスクと費用を見ながらトリアージミーティングで決め、その結論と理由を開発とサプライヤーの担当者に伝える取り組みである。シラバスは、効果的かつ効率的な欠陥マネジメントには、コミュニケーション、適切なツールサポート、明確に定義された欠陥ワークフロー（欠陥レポートの属性を含む。）そして、欠陥マネジメントチームの積極的な関与がすべて必要である、としている。このうち欠陥ワークフローとレポートの属性、ツール、メンバーの関与については、揃っているとシナリオが明言している。残るコミュニケーションのところに、そのまま症状が出ている ── 却下と延期の決定はツール上のステータス変更だけで伝えられ、なぜそう決まったかが担当者に届かないまま、同じ不正が別のレポートとして何度も上がってくる。委員会が置かれていること自体は、判断の理由が伝わっていることを意味しない。原文は、欠陥を修正すべきか、却下すべきか、延期すべきかの判定には、欠陥マネジメント委員会が欠陥の修正に関連する利点、リスク、コストを検討する必要があるとし、この検討はミーティング（しばしばトリアージミーティングと呼ばれる）で議論することが有益だと述べている。議論する場となる委員会はこのプロジェクトにすでにあるので、そこで決めた結論と理由を担当者へ返せば、届いていなかったものが届く。原文はあわせて、欠陥マネジメントツールを優れたコミュニケーションの代用として使用すべきではないとも述べている。","distractors":["却下と延期の理由を書く欄を必須にして通知の宛先を広げても、判断のやり取りはツールの中で完結したままである。シラバスは、欠陥マネジメントツールを優れたコミュニケーションの代用として使用すべきではないと明示的に述べている。症状に最短で応えるうえ記録も残るので実務では真っ先に挙がる案だが、シナリオはツールが全員に行き渡っていると述べており、ここで足りていないのはツールの機能ではない。","却下と延期をそれぞれ別のステータスに分け、遷移の規則と次に動かす役割を決め直して記入項目に加えることは、原文が必要だとしているもののうち、明確に定義された欠陥ワークフローと欠陥レポートの属性を厚くする取り組みである。しかしシナリオは、欠陥ワークフローとレポートの属性は定義して全員に共有済みだと述べている。ステータスが分かれていないから伝わらないのだと読むと選びたくなるが、届いていないのは、却下と延期のどちらに決まったかではなく、なぜそう決まったかである。","却下と延期になったレポートも毎日見直して気づいた点をその場で書き込むよう求めることは、原文が必要だとしているもののうち、欠陥マネジメントチームの積極的な関与を厚くする取り組みである。しかしシナリオは、担当分の更新は毎日滞りないと述べており、メンバーの関与が止まっているわけではない。同じ不正が何度も上がってくるのを見張りで止めたくなるが、決定がツール上のステータス変更だけで伝えられている以上、見直す回数を増やしてもレポートに判断の理由は現れない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けている文は2つあり、どちらか片方を変えるだけでは足りない。1つは、欠陥マネジメントツールを優れたコミュニケーションの代用として使用すべきではないというシラバスの文、もう1つは、ツールは全員に行き渡っているというシナリオの文である。シナリオの側を、ツールが行き渡っておらず理由を記録する場所もない状況に差し替えれば、この案は適切なツールサポートを補う取り組みとして立ちうるが、判断の理由が開発とサプライヤーの担当者に届かないという症状の文はそのまま残るため、補うべきものが2つになり、答えも2つになる。原文の側の代用の禁止は、受験者が動かせるものではない。","2":"この案が厚くしようとしているのは、原文が必要だとしている明確に定義された欠陥ワークフローと欠陥レポートの属性である。シナリオの「欠陥ワークフローとレポートの属性は定義して全員に共有済み」を、ワークフローが未定義で記入項目も定まっていない状況に差し替えれば、この案はそこを補う取り組みとして立つ。しかし、なぜ却下や延期になったかが開発とサプライヤーの担当者に届かないという症状は別の文が述べており、差し替えても残る。その結果、補うべきものがワークフローとコミュニケーションの2つになり、1つ選べが成り立たない。","3":"この案が厚くしようとしているのは、原文が必要だとしている欠陥マネジメントチームの積極的な関与である。シナリオの「担当分の更新も毎日滞りない」を、担当分が何日も放置される状況に差し替えれば、この案は関与を補う取り組みとして立つ。しかし理由が開発とサプライヤーの担当者に届かないという症状の文は残るため、答えが2つになる。さらにこの状況では決定がツール上のステータス変更だけで伝えられているので、見直す回数を増やしてもレポートに判断の理由が書かれておらず、症状そのものには届かない。"},"quote":"この判定には、欠陥マネジメント委員会が、欠陥の修正に関連する利点、リスク、コストを検討する必要がある。この検討については、ミーティング（しばしばトリアージミーティングと呼ばれる）で議論することが有益である。…欠陥マネジメントツールを、優れたコミュニケーションの代用として使用すべきではなく、欠陥マネジメント委員会も、優れた欠陥マネジメントツールを効果的に使用する代用として使用すべきではない。効果的かつ効率的な欠陥マネジメントには、コミュニケーション、適切なツールサポート、明確に定義された欠陥ワークフロー（欠陥レポートの属性を含む。）そして、欠陥マネジメントチームの積極的な関与がすべて必要である。","ref":"2.3.2","misconception":"効果的かつ効率的な欠陥マネジメントに必要なものを対等な必要条件として見ておらず、すでに揃っているものを厚くすれば欠けているものの代わりになると考えている。とりわけ、欠陥マネジメントツールの記録と通知を、人どうしのコミュニケーションの代用に置いている"},"meta":{"concept":"機能横断的な欠陥マネジメント","distractorIntent":["判断の理由を人に伝えるコミュニケーションを、ツールの入力欄と通知で代用させる","必要な要素のうち、シナリオが揃っていると述べた欠陥ワークフローとレポートの属性を、欠けているものとして選ばせる","必要な要素のうち、シナリオが揃っていると述べたチームの積極的な関与を、厚くすれば症状が止まると考えさせる"],"distractorTypes":["D11","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-79"]}},{"id":"q-2.3.3-A-1","lo":"TM-2.3.3","cluster":"2.3.3-A","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"同じフロアの1チームで進めてきたアジャイル開発に、時差のある国の委託先チームが加わる。扱う機能には、規制当局への届け出が要るものも入る。これまで不具合は口頭で伝え、その日のうちに直すことが多かった。","question":"この変化を受けた欠陥マネジメントの扱いとして、シラバスの説明に最も合うものはどれか。1つ選べ。","choices":["アジャイルソフトウェア開発では軽量的で形式的でない扱いが基本なので、口頭で伝えてその日に直す進め方を委託先にも広げる","どこまで形式ばらせるかはチームで話し合って決めればよく、決めた内容を書き残すのは、委託先との契約が求めたときでよい","形式化の程度もレポートを作る引き金も組織的テスト戦略が定める事柄なので、チームでは決めず、戦略が改訂されるのを待つ","チームの配置と数、規制の要件が変わったのだから、形式化の程度とレポートを作る引き金を、この顔ぶれに合わせて決め直す"],"answer":[3],"explanation":{"signals":"効くのは、同じフロアの1チームだった体制に時差のある国の委託先チームが加わること、そして扱う機能に規制当局への届け出が要るものが入ることである。不具合を口頭で伝えてその日のうちに直してきたという経緯は、変わる前の姿を示すだけで、変わった後の扱いを決めない。","why":"答えは、形式化の程度とレポートを作る引き金を、いまの顔ぶれに合わせて決め直すことである。シラバスは、欠陥マネジメントの形式化のレベルや欠陥レポートを作成するアプローチが反映すべきものを列挙していて、そこに挙がっているのがチームメンバーの共通の作業場所、時間帯を超えたチームメンバーの配置、プロダクト開発に参画するチームの数、チームの成熟性、チームの規模、プロダクトに関するリスク、規制、契約、またはその他の要件である。この状況で動いたのは、まさにその列挙に載っているもの ── 同じフロアで作業する状態が崩れ、時間帯を超えた配置になり、参画するチームが増え、規制の要件が入った。だから扱いを据え置く理由がない。決める主体についても原文は書いており、欠陥マネジメントの基本は組織的テスト戦略で定めるべきであるが、形式化のレベル、欠陥レポートを作成するトリガー、取り込むべき欠陥の属性など、多くの側面はアジャイルチームメンバーの合意に任されている、としている。つまり戦略の改訂を待つのでもなく、このチームが決め直す。そして原文は、アジャイルチームによる欠陥マネジメントの詳細に関する最終決定は、常に文書化すべきであるとしている。","distractors":["アジャイルなら軽量でよい、という読み方で選ばれる。形式的な欠陥レポートがなくても情報交換を行うことが多いとシラバスが述べているのは、アジャイルチームが同じ場所にいる場合、またはコミュニケーション手段が十分に確立されている場合である。時差のある国の委託先が加わり、規制当局への届け出が要る機能も入った後は、原文が形式化のレベルに反映すべきだとしている共通の作業場所も、時間帯を超えた配置も、参画するチームの数も、規制の要件も変わっている。変わる前の扱いをそのまま委託先まで広げることは、この列挙と食い違う","どこまで形式ばらせるかをチームで話し合って決めるという前半は原文に沿う。外れるのは後半で、決めた内容を書き残す条件を委託先との契約の求めに限っている点である。シラバスは、アジャイルチームによる欠陥マネジメントの詳細に関する最終決定は常に文書化すべきであるとしており、契約の有無で分けていない。合意さえ取れていれば口頭で足りるという現場の感覚から選ばれる","組織的テスト戦略で定めるべきだとシラバスが述べているのは、欠陥マネジメントの基本である。形式化のレベル、欠陥レポートを作成するトリガー、取り込むべき欠陥の属性など、多くの側面はアジャイルチームメンバーの合意に任されていると明記されている。チームで勝手に決めると全社の統制から外れるという心配から選ばれるが、原文は形式化の程度とレポートを作る引き金をチーム側の持ち分として名指ししている",null],"flip":[null,null,null,null],"flipNote":{"1":"口頭で伝え合う扱いが成り立つ前提としてシラバスが置いているのは、アジャイルチームが同じ場所にいる場合、またはコミュニケーション手段が十分に確立されている場合であり、変化の前のこのチームはそこに当たっていた。外れているのは、時差のある委託先と規制の要件が加わった後もその前提が続くとした点だけである。この案が答えになるのは委託先が加わらず規制の要件も入らない場合、つまりこの問いを立てている変化そのものを取り去ったときで、それは条件の差し替えではなく設問の入力の削除にあたる","2":"外れている点は1つで、決めた内容を書き残す条件を委託先との契約の求めに限ったところにある。どこまで形式ばらせるかをチームで話し合って決めるという前半は、原文がアジャイルチームメンバーの合意に任せている範囲そのものである。そこを直して、決めた内容は常に書き残す、としたときには、原文に沿う選択肢がもう1つ立ち、正答が2つになって1つ選べの形が壊れる","3":"形式化の程度と欠陥レポートを作成するトリガーは、シラバスが名指しでアジャイルチームメンバーの合意に任されているとしている側の事柄である。組織的テスト戦略で定めるべきだと原文が述べているのは欠陥マネジメントの基本であって、この2つではない。この案を正しくするには、どちらがどちらの持ち分かという原文の割り当てを入れ替えるほかなく、それは受験者が動かせる条件ではない"},"quote":"欠陥マネジメントの基本は組織的テスト戦略で定めるべきであるが、形式化のレベル、欠陥レポートを作成するトリガー、取り込むべき欠陥の属性など、多くの側面はアジャイルチームメンバーの合意に任されている。一般的に、欠陥マネジメントの形式化のレベルや欠陥レポートを作成するアプローチは、以下を反映すべきである：…チームメンバーの共通の作業場所…時間帯を超えたチームメンバーの配置…プロダクト開発に参画するチームの数…規制、契約、またはその他の要件（該当する場合）…アジャイルチームによる欠陥マネジメントの詳細に関する最終決定は、常に文書化すべきである","ref":"2.3.3","misconception":"アジャイルソフトウェア開発の欠陥マネジメントは軽量的あるいは形式的でないことが多い、という前半の記述だけを覚えてしまい、形式化のレベルが共通の作業場所・時間帯を超えた配置・参画するチームの数・規制の要件などを反映して決まること、そしてその決定がアジャイルチームメンバーの合意に委ねられたうえで常に文書化されるべきことを取り落としている"},"meta":{"concept":"アジャイルチームにおける欠陥マネジメントの特徴","distractorIntent":["アジャイルの軽量さを条件に依らない原則として扱い、体制が変わっても形式化を見直さない","合意の文書化を、契約上の要請があるときだけの作業と考える","チームの合意に委ねられた事柄を、組織的テスト戦略の管轄と読む"],"distractorTypes":["D6","D6","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-86"]}},{"id":"q-2.3.3-B-1","lo":"TM-2.3.3","cluster":"2.3.3-B","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"同じ部屋で作業する1チームのアジャイル開発で、不具合はこれまで口頭で伝え合ってきた。スプリントの作業はプロダクトバックログの上位から取っている。今回見つかった故障は外部から購入した帳票部品の中で起きており、直せるのは供給元だけで、今のスプリントの終わりまでには直らない見込みである。","question":"この故障の扱いとして、シラバスの記述に最も合うものはどれか。1つ選べ。","choices":["これまでどおり、テスト担当者から開発者と顧客担当者へ朝会で口頭で伝え、供給元への連絡はその場で開発者が引き受ける","欠陥レポートを作成し、供給元の修正が届き次第すぐ取り込めるよう、この故障は欠陥管理ツールの別のリストで管理して、毎スプリントの初めにチームで状況を確認する","欠陥レポートを作成し、この故障をプロダクトバックログに追加して、後のイテレーションで他の欠陥やユーザーストーリーとともに優先順位を付けられるようにする","供給元に原因と修正時期を問い合わせ、その回答が届いた時点で、欠陥レポートを起票してプロダクトバックログに載せるかどうかを次のスプリントの計画の場で決める"],"answer":[2],"explanation":{"signals":"効くのは、直せるのは供給元だけであること、今のスプリントの終わりまでには直らない見込みであること、そしてスプリントの作業をプロダクトバックログの上位から取っていることである。同じ部屋で作業してきたことと、不具合をこれまで口頭で伝え合ってきたことは、原文が形式的な欠陥レポートなしで情報交換を行う場合として認めている姿に当たるが、それは前の2つが成り立つ前の扱いを示すだけで、この故障をどう扱うかを決めない。","why":"この故障は欠陥レポートを作成すべき場合に当たり、作ったレポートはプロダクトバックログに追加して、後のイテレーションで他の欠陥やユーザーストーリーとともに優先順位を付けられるようにする。シラバスは、アジャイルチームが同じ場所にいる場合、またはコミュニケーション手段が十分に確立されている場合には、形式的な欠陥レポートがなくても、テスト担当者、顧客担当者、開発者の間で欠陥や故障に関する情報交換を行うことが多いと述べたうえで、それでも欠陥レポートを作成すべき場合を挙げている。そこには、サプライヤーが解決しなければならない欠陥と、同じイテレーション内で解決できない欠陥が並んでいる。直せるのは供給元だけで、今のスプリントの終わりまでには直らない見込みだというこの故障は、その両方に当たる。だから同じ部屋にいることは、ここでは口頭で済ませてよい理由にならない。置き場所についても原文は書いていて、同じイテレーション内で解決できない欠陥をプロダクトバックログに追加し、後のイテレーションのために他の欠陥やユーザーストーリーの中で優先順位を付けられるようにすることが一般的な実践例である、としている。このチームはスプリントの作業をプロダクトバックログの上位から取っているので、その置き場所がそのまま働く。","distractors":["朝会で口頭で伝え合うところは、アジャイルチームが同じ場所にいる場合に形式的な欠陥レポートがなくてもテスト担当者、顧客担当者、開発者の間で欠陥や故障に関する情報交換を行うことが多い、というシラバスの記述に重なり、このチームの経緯にも合って見える。しかし原文は、そのうえでサプライヤーが解決しなければならない欠陥と、同じイテレーション内で解決できない欠陥を、欠陥レポートを作成すべき場合として挙げている。この故障は直せるのが供給元だけで、今のスプリントの終わりまでには直らない見込みであり、その両方に当たる。連絡を誰が引き受けるかは、レポートを作成すべきかどうかの判定を動かさない","欠陥レポートを作成するところまでは原文に沿っており、供給元の修正が届き次第すぐ取り込めるようにするという狙いも実務では通りやすい。外れるのはその後の置き場所である。同じイテレーション内で解決できない欠陥について、シラバスが一般的な実践例として挙げているのは、プロダクトバックログに追加し、後のイテレーションのために他の欠陥やユーザーストーリーの中で優先順位を付けられるようにすることである。欠陥管理ツールの別のリストで管理して毎スプリントの初めに状況を確認する形は、他の欠陥やユーザーストーリーと並べて優先順位を付けられる場にこの故障を置かない。欠陥を製品の要求とは別の台帳で追う現場の習慣から選ばれる",null,"原因と修正時期が分かってから起票するかどうかを決めるという順序は、無駄な起票を避けたい現場の感覚に合う。しかしシラバスは、サプライヤーが解決しなければならない欠陥と、同じイテレーション内で解決できない欠陥を、いずれも欠陥レポートを作成すべき場合として挙げている。この故障は供給元しか直せず、今のスプリントの終わりまでには直らない見込みで、どちらもすでに成り立っている。原文はさらに、欠陥レポートが明示的に求められている欠陥の例として、開発者がすぐに修正に取りかかれない場合を挙げており、すぐ修正へ取りかかれないことは、起票を待つ理由ではなく起票する理由の側に置かれている"],"flip":[null,null,null,null],"flipNote":{"1":"この進め方が寄りかかっているのは、アジャイルチームが同じ場所にいる場合に形式的な欠陥レポートなしで情報交換を行うことが多い、というシラバスの記述であり、その部分は正しい。外れているのは、直せるのが供給元だけで今のスプリント内には直らないという状況にまでそれを広げた点だけである。したがってこれが答えになるのは、供給元しか直せないことと、今のスプリント内に直らない見込みであることの両方が無い場合であり、それはこの設問に与えられた状況そのものを取り去ることになる。条件の差し替えではなく、入力の削除にあたる。","2":"外れているのは、欠陥レポートを作るかどうかではなく、作ったあとの置き場所である。同じイテレーション内で解決できない欠陥をプロダクトバックログに追加し、後のイテレーションのために他の欠陥やユーザーストーリーの中で優先順位を付けられるようにする、というのがシラバスの挙げる一般的な実践例である。置き場所を欠陥管理ツールの別のリストからプロダクトバックログへ移すと、これは正答と同じことを述べる選択肢になり、原文に沿うものが2つ立って1つ選べの形が壊れる。","4":"この進め方は、原因と修正時期が分かるまでは起票するかどうかもプロダクトバックログに載せるかどうかも決めない、という順序を置いている。シラバスの順序は逆で、サプライヤーが解決しなければならない欠陥と同じイテレーション内で解決できない欠陥は、それだけで欠陥レポートを作成すべき場合に挙げられており、開発者がすぐに修正に取りかかれない場合は、レポートが明示的に求められている欠陥の例として置かれている。これを正しくするには、レポートの作成を原因の判明後に回す順序を原文に持ち込むほかなく、それは受験者が動かせる条件ではない。"},"quote":"しかし、次のような場合は欠陥レポートを作成すべきである：…同じイテレーション内で解決できない欠陥。…サプライヤーが解決しなければならない欠陥。…一般的な実践例は、同じイテレーション内で解決できない欠陥をプロダクトバックログに追加し、後のイテレーションのために他の欠陥やユーザーストーリーの中で優先順位を付けられるようにすることである。","ref":"2.3.3","misconception":"アジャイルソフトウェア開発では欠陥を口頭で扱えばよいという前半の記述だけを覚え、原文がそのあとに欠陥レポートを作成すべき場合を挙げて限定していること、そして同じイテレーション内で解決できない欠陥はプロダクトバックログに追加して他の欠陥やユーザーストーリーの中で優先順位を付けられるようにするのが一般的な実践例であることを取り落としている"},"meta":{"concept":"アジャイルチームにおける欠陥マネジメントの特徴","distractorIntent":["同じ場所にいるチームは形式的な欠陥レポートなしで情報交換を行うことが多い、という原文の記述を、そのあとに置かれた欠陥レポートを作成すべき場合の列挙より先に当てる","欠陥レポートを作るところまでは合わせたうえで、同じイテレーション内で解決できない欠陥の置き場所を、原文が一般的な実践例として挙げるプロダクトバックログの外に取る","原因と修正時期が分かってから起票とプロダクトバックログへの掲載を決めるという実務の順序を、欠陥レポートを作成すべき場合の判定より先に置く"],"distractorTypes":["D6","D6","D7"],"conceptNote":"未作成","mistakePatterns":["MP-86"]}},{"id":"q-2.3.4-A-1","lo":"TM-2.3.4","cluster":"2.3.4-A","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"シーケンシャル開発モデルで進める社内チームが全体を取りまとめ、サブシステムの1つをアジャイル開発の委託先が作っている。両者は別々の欠陥管理ツールを使っている。","question":"この体制での欠陥マネジメントの進め方として、シラバスの説明に**合わないもの**はどれか。1つ選べ。","choices":["アジャイルの委託先と社内とで別々の欠陥管理ツールを使い続けるなら、ツールの間の同期を、できれば自動で行えるように整える","委託先のアジャイルチームにも社内の進め方に合わせてもらい、欠陥マネジメントのミーティングは従来どおり月に1回だけ開く","プロダクトオーナーが欠陥マネジメントのミーティングに加わり、欠陥に伴う結果とリスクの情報を自分から積極的に求める","欠陥修正の作業も新規開発の作業も、両方のチームで同じプロジェクト計画書に沿わせる"],"answer":[1],"explanation":{"signals":"効くのは、取りまとめる社内チームがシーケンシャル開発モデル、サブシステムを作る委託先がアジャイル開発であること、そして両者が別々の欠陥管理ツールを使っていることである。サブシステムが1つだという規模は、どの進め方が原文に合わないかを変えない。","why":"シラバスの説明から外れるのは、委託先のアジャイルチームに社内の進め方へ合わせてもらい、欠陥マネジメントのミーティングを従来どおり月に1回だけ開く、という進め方である。外れ方もはっきりしていて、原文は歩調を合わせる相手と向きを名指ししている ── アジャイルソフトウェア開発では、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせるために、シーケンシャル開発モデルよりも欠陥マネジメントミーティングを頻繁に開催すべきである、と。合わせる向きが逆で、頻度も据え置かれている。ほかの進め方は、原文が複合チーム環境の課題について述べている扱いをなぞっている ── 各チームが異なる欠陥マネジメントツールを使うのが実際には一般的だと認めたうえでの、ツール間の同期（できれば自動的に）。プロダクトオーナーが欠陥マネジメントミーティングに関与し、欠陥に関連する結果とリスクに関する情報を積極的に求めること。アジャイルソフトウェア開発モデルを使用しているか、シーケンシャル開発モデルを使用しているかに関係なく、すべてのチームの仕事を同じプロジェクト計画書に合わせ、欠陥修正を含むすべての成果物をその計画に沿わせること。なお原文は、アジャイルチームではこれらのミーティングは短くてもよいとも述べており、頻繁に開くことと1回を短く保つことは両立する。","distractors":["別々のツールを使い続けるなら、ツール間の同期を確立することが望ましい（できれば自動的に）、とシラバスが述べているとおりの内容である。理想的なシナリオではすべてのチームが1つの欠陥マネジメントツールを使用する、と原文が書いているため、別々のまま同期でつなぐのは妥協であって原文の求めに合わない、と読むと、これを外れているほうに数えてしまう。しかし原文は、各チームが異なるツールを使用するのが一般的だと認めたうえで、その場合の扱いとして同期を挙げている",null,"プロダクトオーナーは欠陥マネジメントミーティングに関与し、欠陥に関連する結果とリスクに関する情報を積極的に求めるべきである、というシラバスの記述をそのままなぞる内容である。欠陥の優先順位付けはテストマネージャーや欠陥マネジメント委員会が扱う仕事だと考えていると、プロダクトオーナーが自分から情報を求めに行くのは役割の越境に見えて、外れているほうに数えてしまう","欠陥修正を含むすべての成果物は、このプロジェクト計画に沿ったものでなければならない、というシラバスの記述に沿う内容である。アジャイル側はプロダクトバックログで動くのだから、シーケンシャル側の計画書に沿わせるのは片方の流儀の押し付けだ、と読むと、これを外れているほうに数えてしまう。原文は、どちらの開発モデルを使用しているかに関係なく、すべてのチームの仕事は同じプロジェクト計画書に合わせるべきだとしている"],"flip":[null,null,null,null],"flipNote":{"1":"ツール間の同期をできれば自動で確立することは、原文が複合チーム環境の課題の1つ目、すなわち欠陥の属性とツールに関する整合性への望ましい扱いとして現に挙げている事柄である。これを外れているものにするには、原文の側がこれを望ましくないと扱っていなければならないが、原文は各チームが異なるツールを使うのが一般的だと認めたうえで同期を求めている。設問を肯定形に戻しても、原文が挙げる残り2つの進め方が同時に正しくなるため、正答が3つになって1つ選べの形が壊れる","3":"プロダクトオーナーが欠陥マネジメントミーティングに関与し、結果とリスクに関する情報を積極的に求めることは、原文が複合チーム環境の課題の2つ目、すなわち欠陥の優先順位付けへの扱いとして名指ししている事柄である。これを外れているものにするには原文の側を書き換えるほかない。設問を肯定形に戻した場合も、原文が挙げる残り2つの進め方が同時に正しくなり、正答が3つになる","4":"欠陥修正を含むすべての成果物を同じプロジェクト計画書に沿わせることは、原文が複合チーム環境の課題の3つ目、すなわち計画書の整合性と透明性への扱いとして述べている事柄であり、どちらの開発モデルを使用しているかに関係なく求められている。これを外れているものにする条件は原文の書き換えにあたる。設問を肯定形に戻しても、原文が挙げる残り2つの進め方が同時に正しくなり、正答が3つになる"},"quote":"アジャイルソフトウェア開発では、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせるために、シーケンシャル開発モデルよりも欠陥マネジメントミーティングを頻繁に開催すべきである。しかし、アジャイルチームでは、これらのミーティングは短くてもよい。…アジャイルソフトウェア開発モデルを使用しているか、シーケンシャル開発モデルを使用しているかに関係なく、すべてのチームの仕事は同じプロジェクト計画書に合わせるべきである。欠陥修正を含むすべての成果物は、このプロジェクト計画に沿ったものでなければならない。","ref":"2.3.4","misconception":"ハイブリッド開発では、取りまとめている側の開発モデルの流儀に相手を合わせさせれば整合が取れると考え、欠陥マネジメントミーティングをアジャイルチームの開発から提供までの速さに歩調を合わせて頻繁に開くという、原文が向きまで明示した要求を見落としている"},"meta":{"concept":"ハイブリッドソフトウェア開発における欠陥マネジメントの課題","distractorIntent":["ツールを1つに統一する理想を絶対視し、同期による現実的な扱いを原文外と読む","優先順位付けをテストマネージャー側の仕事と考え、プロダクトオーナーの関与を越境と読む","共通のプロジェクト計画書への整合を、シーケンシャル側の流儀の押し付けと読む"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-102"]}},{"id":"q-2.3.4-B-1","lo":"TM-2.3.4","cluster":"2.3.4-B","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"通信会社の料金計算システムを、社内のアジャイル開発チームとサプライヤーが作る。社内チームは2週間ごとに動くものを出し、サプライヤーはシーケンシャル開発モデルで工程の区切りごとに納める。欠陥マネジメントミーティングは月に1回60分で開いてきた。欠陥管理ツールは両者で別々で、会議はオンラインで日程は取りやすい。","question":"欠陥マネジメントミーティングの開き方として、シラバスの説明に沿うものはどれか。1つ選べ。","choices":["ミーティングは毎週に増やすが、出席者は両チームのテスト担当者に絞り、プロダクトオーナーには決まった内容を後から議事録で伝える","ミーティングは、アジャイル側の開発から提供までの速さに歩調を合わせてこれまでより頻繁に開き、1回は短く切り上げる","ミーティングはサプライヤーの工程の区切りに合わせて開き、区切りの間に見つかった欠陥は、両チームの欠陥管理ツールの自動同期で共有する","ミーティングは、アジャイル側もシーケンシャル側も同じ60分の枠と同じ議題で運営し、開催の間隔もプロジェクト全体で一本化する"],"answer":[1],"explanation":{"signals":"効くのは、提供のリズムが2つ並んでいることである ── 社内チームはアジャイル開発で2週間ごとに動くものを出し、サプライヤーはシーケンシャル開発モデルで工程の区切りごとに納める。原文は、このどちらに歩調を合わせるかを名指ししている。欠陥管理ツールが両者で別々であることは、ツール間の同期を持ち出す案が成り立つための与件であり、会議がオンラインで日程を取りやすいことは、開催を増やす案を状況の側から退ける理由が無いことを示す。","why":"沿うのは、アジャイル側の開発から提供までの速さに歩調を合わせてこれまでより頻繁に開き、1回は短く切り上げる開き方である。シラバスは合わせる相手を名指ししていて、アジャイルソフトウェア開発では、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせるために、シーケンシャル開発モデルよりも欠陥マネジメントミーティングを頻繁に開催すべきである、としている。社内チームが2週間ごとに動くものを出しているのに対し、ミーティングは月に1回のままで、その速さに追いついていない。回数を増やすと時間を取られるように見えるが、原文はアジャイルチームではこれらのミーティングは短くてもよいとも述べており、頻繁に開くことと1回を短く保つことは両立する。会議はオンラインで日程も取りやすいので、増やせない事情もこの状況には無い。原文はあわせて、プロダクトオーナーは欠陥マネジメントミーティングに関与し、欠陥に関連する結果とリスクに関する情報を積極的に求めるべきである、としている。頻度だけを上げて出席者を絞る進め方は、この記述と食い違う。","distractors":["頻度を毎週に上げる点だけは原文の向きに沿う。しかしシラバスは、プロダクトオーナーは欠陥マネジメントミーティングに関与し、欠陥に関連する結果とリスクに関する情報を積極的に求めるべきである、としている。出席者を両チームのテスト担当者に絞り、決まった内容を後から議事録で伝える形は、この関与の求めと食い違う。多忙な責任者の時間を守りながら回数だけ増やせる折衷案に見えるため、頻度の話だけを原文の要求だと読んだ人が選ぶ",null,"開催をサプライヤーの工程の区切りに縛ると、歩調を合わせる相手が原文の名指しと逆になる。シラバスは、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせるために、シーケンシャル開発モデルよりも欠陥マネジメントミーティングを頻繁に開催すべきだとしている。なお、欠陥管理ツールの自動同期そのものは、この状況のように各チームが異なるツールを使う場合の扱いとして原文が望ましいとしている事柄であり、そこが外れているのではない。両者の節目をそろえれば整合が取れるという見方から選ばれる","長さも議題も間隔も両者でそろえれば整合が取れる、という考え方に立った案である。すべてのチームの仕事は同じプロジェクト計画書に合わせるべきだとシラバスが述べているのは計画についての要求で、会議の運営まで一律にそろえよという記述は原文に無い。会議について原文が書いているのはむしろ逆向きのことで、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせてシーケンシャル開発モデルよりも頻繁に開催すべきであり、アジャイルチームではこれらのミーティングは短くてもよい、としている。この案が開催の間隔を合わせているのはアジャイル側の速さではなくプロジェクト全体の都合であり、そこが外れている。そろえること自体が整合だと考える人が選ぶ"],"flip":[null,null,null,null],"flipNote":{"1":"プロダクトオーナーが欠陥マネジメントミーティングに関与し、結果とリスクに関する情報を自分から求めることは、シラバスが欠陥の優先順位付けの扱いとして名指ししている事柄である。この案を答えにするには、参加者をテスト担当者に絞ってよいと原文の側が述べていなければならず、それは受験者が動かせる条件ではない。かりに出席者の扱いだけを直すと、この案は毎週開くという頻度の求めも満たしてしまい、正答が2つ立って1つ選べの形が壊れる。","3":"この案が開催の拠りどころにしているのはサプライヤーの工程の区切りであり、原文が歩調を合わせよと言う相手ではない。シナリオの1文を差し替えてサプライヤーの区切りが2週間ごとに来るようにすると、確かに開催の間隔はアジャイル側の速さに並ぶが、そのときアジャイル側の速さに合わせて頻繁に開くという進め方も同じように成り立つため、正答が2つになる。合わせる相手の名指しを動かさないかぎり、これは一意の答えにならない。","4":"長さと議題と間隔をそろえるという考え方は、すべてのチームの仕事は同じプロジェクト計画書に合わせるべきだというシラバスの記述を、計画から会議の運営へ移したものである。この案を答えにするには、原文が会議の運営についても一律化を求めていなければならず、それは原文の書き換えにあたる。かりに間隔の一本化だけを外して2週間ごとにそろえると、アジャイル側の速さに歩調を合わせるという求めに正面から応えることになり、正答が2つになる。"},"quote":"プロダクトオーナーは欠陥マネジメントミーティングに関与し、欠陥に関連する結果とリスクに関する情報を積極的に求めるべきである。アジャイルソフトウェア開発では、アジャイルチームのプロダクトインクリメントの開発から提供までの速さに歩調を合わせるために、シーケンシャル開発モデルよりも欠陥マネジメントミーティングを頻繁に開催すべきである。しかし、アジャイルチームでは、これらのミーティングは短くてもよい。","ref":"2.3.4","misconception":"ハイブリッド開発では、会議の運営を両者で一律にそろえるか、納入側の工程の節目に合わせれば整合が取れると考え、欠陥マネジメントミーティングをアジャイルチームの開発から提供までの速さに歩調を合わせて頻繁に、ただし1回は短く開くという、原文が向きまで示した要求を取り落とす"},"meta":{"concept":"ハイブリッドソフトウェア開発における欠陥マネジメントの課題","distractorIntent":["頻度を上げることだけを原文の要求と読み、プロダクトオーナーの関与を会議の効率と引き換えにできる手続きだと考える","歩調を合わせる相手を取り違え、納入側の工程の節目に開催をそろえれば複合チームの整合が取れると考える","同じプロジェクト計画書に合わせるという計画についての要求を、会議の長さと開催の間隔まで一律にそろえる要求へ広げる"],"distractorTypes":["D6","D6","D5"],"conceptNote":"未作成","mistakePatterns":["MP-102"]}},{"id":"q-2.3.5-A-1","lo":"TM-2.3.5","cluster":"2.3.5-A","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"スーパーマーケット向けのセルフレジソフトを作っている会社で、欠陥管理ツールを入れ替えることになった。旧ツールでは起票時の必須欄が14個あり、テスト担当者からは、埋め終わるまでに時間がかかる、何を書く欄なのか分からずとりあえずの値を選んでいる、という声が続いていた。\n\n新しいツールでは必須欄を絞り直すことにし、残っている4つの欄について、必須のままにするか任意にするかを決める。ここでいう必須欄とは、欠陥レポートとして必ず値を持たせる欄のことで、起票した人が埋めるか、後から担当者が埋めるかは問わない。なお、タイトルと不具合の概要を書く欄は起票の入り口にあたるため、今回の見直しの対象から外してある。","question":"欠陥レポートをマネジメントするほとんどの環境で「必須」とされる情報に、含まれないものはどれか。1つ選べ。","choices":["どのレジ端末で、本体とレシートプリンタのどの版を組み合わせたときに見つけたのかを選ばせる欄","どの操作をどの順に行ったときに起きたのかと、そのとき画面や機器が実際にどうなったのかを書かせる欄","その不具合を抱えたまま使われた場合に、店舗の運営と買い物客にどれだけの支障が出るのかを5段階から選ばせる欄","他に抱えている作業と見比べて、どれだけ先に手を着けるべきかを4段階から選ばせる欄"],"answer":[0],"explanation":{"signals":"この判定を動かすのは、まずシナリオが必須欄をどう定めたかである。必須欄とは「欠陥レポートとして必ず値を持たせる欄」で、起票した人が埋めるか後から担当者が埋めるかは問わない——だから、誰がいつ値を決めるかを理由に必須から外すことはできない。次に効くのが、タイトルと不具合の概要を書く欄を見直しの対象から外してあることで、原文がほとんどの環境で必須として並べる項目のうち1つが先に取り除かれている。残る4つの欄は、必須の箇条書きに載っている側と、目的ごとにまとめた箇条書きの「欠陥解決に役立てる」側に分かれる。必須欄が14個あって埋めるのに時間がかかり、何を書く欄か分からないままとりあえずの値を選んでいたという経緯は、欄を絞り直す動機ではあるが、どの欄が必須にあたるかの線引きは動かさない。","why":"外れるのは、どのレジ端末で、本体とレシートプリンタのどの版を組み合わせたときに見つけたのかを選ばせる欄である。シラバスがこれにあたる情報を置いているのは必須の箇条書きではなく、目的ごとにまとめた箇条書きの「欠陥解決に役立てる」側——不正が観察された特定のテストアイテムおよびそのリリース番号、欠陥が観察されたテスト環境——だからである。原文が「欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である」として並べているのは、欠陥のタイトルと不正の簡単な概要、故障を再現する手順を含む不正の詳細な説明、テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度、不正を修正する優先度であり、このうちタイトルと概要の欄は見直しの対象から外してある。だから残る3つの欄——操作の順序とそのとき実際に起きたこと、店舗の運営と買い物客に出る支障の大きさ、他に抱えている作業と見比べた着手の早さ——は、そのまま残りの必須項目に当たる。なお「必須に含まれない」は「集めなくてよい」ではない。原文は、欠陥レポートでは多くのデータ項目を収集することができ、テストマネージャーはプロジェクトのコンテキストに応じてどの情報が効果的な欠陥マネジメントに適しているかを判断する必要がある、と述べたうえで、属性を追加するたびに欠陥レポート作成に費やす時間が長くなり、入力する担当者の混乱を招く可能性があるため、特定のコンテキストにおける欠陥マネジメントに必要なデータ、および/またはプロセス改善に使用されるデータのみを収集することが望ましい、としている。端末と版の組み合わせは直す人には要る情報なので、この会社が必須のまま残すと決めることもできる。ここで問われているのは、原文がどちら側に置いているかである。","distractors":[null,"どの操作をどの順に行ったときに起きたのかと、そのとき画面や機器が実際にどうなったのかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「故障を再現する手順を含む不正の詳細な説明」そのものである。この欄が選ばれるのは、再現手順は再現できたときだけ書けばよい任意の情報だと考えている場合か、必須欄を14個から絞るという話につられて、書く量がいちばん多い欄を落とせば入力が速くなると読んだ場合である。原文が集めるものを絞るよう述べているのは、そのコンテキストの欠陥マネジメントにもプロセス改善にも使わない属性であって、必須として名指しされた項目ではない。","その不具合を抱えたまま使われた場合に店舗の運営と買い物客にどれだけの支障が出るのかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度」に当たる。重要度と優先度は結局同じことを別の言い方にしただけで、どちらか一方を必須にすれば足りる——そう考えている人がこの欄を外す。原文は両者を別々の項目として並べており、不具合が与える影響の大きさと、他に抱えている作業に対する修正の急ぎ度は、それぞれ記録するものである。","他に抱えている作業と見比べて、どれだけ先に手を着けるべきかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「不正を修正する優先度」に当たる。優先度を決めるのは起票した人ではなくトリアージの場だから、起票時に埋まらない欄を必須にはできない——という読みがこの欄を外させる。だがシナリオは必須欄を、欠陥レポートとして必ず値を持たせる欄と定め、起票した人が埋めるか後から担当者が埋めるかは問わないと書いている。誰がいつ値を入れるかは、この判定に効かない。"],"flip":[null,null,null,null],"flipNote":{"2":"再現手順を含む詳細な説明は、原文がほとんどの環境で必須と名指ししている項目であり、シナリオのどの条件を動かしてもその位置は変わらない。この欄を答えにするには、原文の必須の一覧から再現手順を外したうえで、端末と版の組み合わせをそこへ入れ直すことになる。原文の記述は受験者が動かせる条件ではないし、外す側と入れる側の2か所を同時に変える話でもある。外すほうだけを変えれば、必須に含まれない欄が2つ並び、1つ選べが成り立たなくなる。","3":"ステークホルダーへの影響の重要度も、原文がほとんどの環境で必須と名指ししている項目である。5段階の刻みを変えても、誰が段位を付けるかをシナリオで動かしても、必須の側にあることは変わらない。重要度を一覧から落とす変更を考えても、端末と版の組み合わせは必須の外に残ったままなので、条件に合う欄が2つになって1つ選べが崩れる。1つに戻すには端末と版の組み合わせを必須の側へ入れる変更も要り、どちらも原文の書き換えであって、シナリオの条件の変更ではない。","4":"不正を修正する優先度も、原文がほとんどの環境で必須と名指ししている項目である。4段階の刻みを変えても、値を入れるのをトリアージの場に限っても、必須の側にあることは動かない。優先度を一覧から落とす変更を考えた場合も、端末と版の組み合わせが必須の外に残るので、必須に含まれない欄が2つ並ぶ。この欄が一意の答えになる世界を作るには原文の箇条書きを2か所書き替えることになり、それは受験者が動かせる条件ではない。"},"quote":"欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である：／欠陥のタイトルと不正の簡単な概要／故障を再現する手順を含む不正の詳細な説明／テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度／不正を修正する優先度…欠陥解決に役立てる：欠陥が存在するサブシステムまたはコンポーネント、不正が観察された特定のテストアイテムおよびそのリリース番号、または欠陥が観察されたテスト環境。","ref":"2.3.5","misconception":"現場では必ず埋めさせている情報だからという理由で、原文がほとんどの環境で必須と名指ししている項目と同じ扱いにしてしまう"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["選択肢2: 再現手順を含む詳細な説明を、書く量が多いので任意に落とせる欄だと読む（必須の4項目のうち1つを任意側に数える）","選択肢3: ステークホルダーへの影響の大きさを、優先度と同じものとみなし、片方あれば足りると読む","選択肢4: 修正の優先度を、決めるのがトリアージの場だからレポートの必須欄ではないと読む"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-82","MP-88"]}},{"id":"q-2.3.5-A-2","lo":"TM-2.3.5","cluster":"2.3.5-B","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"multi","minutes":3,"scenario":"テレビ会議サービスを自社で開発している会社で、四半期ごとに、開発とテストのやり方のどこが弱いのかを数字で見たい、という要望が出た。その土台として、欠陥レポートで集める項目を決め直す。どの手を打つかは、数字がそろってから別に決める。\n\n今のツールは、不具合が見つかったテストレベルと日時を起票時に自動で記録し、そのまま四半期の集計に使える。修正がどの版で取り込まれ、どの工程で確認が取れたのかも、リリース管理の仕組みと連携して自動で埋まり、月次で集計されている。\n\n修正を担当した開発者は、直す前に、何がどこで間違っていたのかを必ず調べている。その結果は自由記述のコメントに書かれるだけで、書き方は人それぞれのため、数えられる形にはなっていない。入力の手間が増えるので、新たに設ける欄は2つまでとする。","question":"開発とテストのやり方の弱いところを四半期ごとに数字で見るために、欠陥レポートで新たに集める項目として適切なものはどれか。2つ選べ。","choices":["不具合がどのテストレベルの、いつの実行で見つかったのかを記録する欄を新たに設ける","要件、設計、実装のどの段階で作り込まれたのかを、あらかじめ決めた区分から選ばせる欄を設ける","その不具合によって損なわれたのは性能か、使いやすさか、互換性かを、区分から選ばせる欄を設ける","不具合を生んだ原因を、担当者間の伝達漏れ、古い版の資料の参照、決められた確認の省略といった型で記録させる","修正がどの版で取り込まれ、どの工程で確認が取れたのかを、欠陥レポートの欄として記録させる"],"answer":[1,3],"explanation":{"signals":"ここで効くのは、四半期ごとに見たいものが何かと、いま何が既に数えられているかである。見たいのは「開発とテストのやり方のどこが弱いのか」であって、できあがったプロダクトの品質の状態ではない。そのうえでシナリオは、不具合が見つかったテストレベルと日時は起票時にツールが自動で記録してそのまま四半期の集計に使えること、修正がどの版で取り込まれどの工程で確認が取れたのかもリリース管理の仕組みと連携して自動で埋まり月次で集計されていることを、わざわざ書いている。この2か所は、中身が正しくても新しく欄を設ける値打ちが無いことを示す。逆に、開発者が直す前に必ず調べている「何がどこで間違っていたのか」は自由記述のコメントにしか残らず、書き方も人それぞれで数えられる形になっていない——足せば数えられるようになるものが、ここに置かれている。新たに設ける欄は2つまでという制限は、候補を絞り切れという指示である。","why":"新たに設けるのは、要件、設計、実装のどの段階で作り込まれたのかを区分から選ばせる欄と、不具合を生んだ原因を、担当者間の伝達漏れ・古い版の資料の参照・決められた確認の省略といった型で記録させる欄である。四半期ごとに数字で見たいのが開発とテストのやり方の弱さであり、そこに答える情報のうち、まだ数えられる形で残っていないのがこの2つだからである。シラバスは、欠陥レポートで集めうる情報を「意図する目的にしたがって情報をグループ化したもの」として並べ、プロセス能力をアセスメントするためのグループを「開発プロセスの有効性と効率性をモニタリングするための情報」と説明して、その例に「欠陥または欠陥の根本原因に対する混入、検出、除去の SDLC フェーズ」を挙げている。どこで作り込まれたかは、この例がそのまま挙げている混入の SDLC フェーズにあたる。原因の型そのものは例の並びには出てこないが、その例は「欠陥または欠陥の根本原因に対する」と書いて根本原因を名指ししており、それを区分にして数える欄は、このグループの総説が言う「開発プロセスの有効性と効率性をモニタリングするための情報」に当たる。ただしグループに載っていることは、それだけでは欄を足す理由にならない。検出がどこで起きたかにあたるテストレベルと日時は起票時に自動で記録されて四半期の集計に使え、除去がどこで起きたかにあたる取り込み版と確認の工程も自動で埋まって月次で集計されている。既に数えられる形で取れているものを欄として持たせても、集まる情報は増えず、入力の手間だけが増える。残る2つは互いに別の軸で、片方が決まっても他方は決まらない。担当者間の伝達漏れも、古い版の資料の参照も、決められた確認の省略も、要件・設計・実装のどの段階でも起こりうるからである。段階だけを集めれば、弱いのが特定の工程なのか、どの工程にも共通する進め方なのかが分かれず、原因だけを集めれば、どこに手を入れればよいのかが決まらない。値はどちらも、開発者が直す前に必ず行っている調査から取れる。「どこで」が作り込みの段階、「何が」が原因の型にあたり、いま自由記述のコメントに散っているものを、区分を決めた欄に移すだけである。数えるための欄なので、区分は互いに重ならないように決め、1件の不具合がどれか1つに当たるようにしておく必要がある。原文が、属性を追加するたびに作成の時間が長くなり入力する担当者の混乱を招く可能性があるとして、特定のコンテキストにおける欠陥マネジメントに必要なデータ、および/またはプロセス改善に使用されるデータのみを収集することが望ましいとしている点からも、足すのはこの2つに絞られる。ここで足す2つは、そのうちプロセス改善に使うデータの側にあたる。","distractors":["不具合がどのテストレベルの、いつの実行で見つかったのかは、シナリオでは起票時にツールが自動で記録し、そのまま四半期の集計に使えると書かれている。同じ内容を欄として作り直しても、数えられる情報は増えない。それでも手が伸びるのは、検出がどこで起きたかがプロセス能力を見る側の情報として原文の例に挙がっているからで、混入・検出・除去をそろえなければ意味がない、という筋で読むとこの欄が要るように見える。原文はこれを「例えば」として挙げているだけで、3つをそろえよとは述べていない。",null,"その不具合によって損なわれたのが性能か、使いやすさか、互換性かは、原文では「プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする」ためのグループに、欠陥によって影響を受けた品質特性/副特性として挙がっている。今回数字で見たいのは、できあがったものの品質ではなく、それをどう作っているかの弱さであり、答えるグループが違う。どの品質特性が壊れやすいかが分かればやり方の弱点も見えるはずだ、と考えるとこの欄が魅力的に見えるが、この欄から出てくるのは、弱いのがどの作り方かではなく、弱いのがどの品質かである。",null,"修正がどの版で取り込まれ、どの工程で確認が取れたのかは、シナリオではリリース管理の仕組みと連携して自動で埋まり、月次で集計されている。除去がどこで起きたかもプロセス能力を見る側の情報として原文の例に挙がっているため選びたくなるが、同じ値が既に自動で埋まって月次で集計されているので、これを新たに設ける欄として立て直しても、数えられる情報は増えず、入力の手間だけが増える。新たに設ける欄は2つまでという制限の中では、この枠をここに使うこと自体が、足すべき欄を1つ押し出す。"],"flip":[null,null,null,null,null],"flipNote":{"1":"テストレベルと日時の欄に値打ちが出るのは、それがツールに自動で記録されず、四半期の集計に使える形で残っていない案件である。ところがその1文を差し替えても、作り込みの段階と原因の型はやはり足す必要があるので、足すべき欄が3つになり、2つ選べという形式も、新たに設ける欄は2つまでという制限も成り立たなくなる。3つを2つに戻すには、開発者の調査が自由記述にしか残っていないという条件も同時に動かすことになる。","3":"品質特性の欄が答えになるのは、四半期ごとに見たいものが、開発とテストのやり方の弱さではなく、できあがったプロダクトのどの品質がどれだけ損なわれているかに変わったときである。それはシナリオの条件の変更ではなく、設問が何を求めているかの変更にあたる。しかもそう変えると、プロダクト品質の観点から状態を見るための情報はこの欄しか残らず、2つ選べという形式が立たなくなる。この欄が置かれているのは、プロセス能力を見るグループではなく、プロダクトインクリメントの状態を見るグループの側である。","5":"取り込み版と確認の工程の欄も同じで、値打ちが出るのはリリース管理の仕組みから自動で埋まらず、月次の集計にも出てこない案件である。その1点を動かすと、作り込みの段階・原因の型と合わせて足すべき欄が3つになり、2つ選べが成り立たない。この欄の中身そのものは、開発プロセスの有効性と効率性をモニタリングするための情報として原文が例に挙げている側にある。誤っているのは中身ではなく、既に取れている同じ値をもう一度持たせようとしている点である。"},"quote":"テストマネージャーは、プロジェクトのコンテキストに応じて、どの情報が効果的な欠陥マネジメントに適しているかを判断する必要がある。属性を追加するたびに、欠陥レポート作成に費やす時間が長くなり、欠陥レポートを入力する担当者の混乱を招く可能性があるため、特定のコンテキストにおける欠陥マネジメントに必要なデータ、および/またはプロセス改善に使用されるデータのみを収集することが望ましい。…以下の箇条書きは、意図する目的にしたがって情報をグループ化したものである：…プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする：欠陥の種類（通常、欠陥分類法に対応する）、欠陥が混入した作業成果物、または欠陥によって影響を受けた品質特性/副特性。／プロセス能力をアセスメントする：開発プロセスの有効性と効率性をモニタリングするための情報（例えば、欠陥または欠陥の根本原因に対する混入、検出、除去の SDLC フェーズ）。","ref":"2.3.5","misconception":"見たい目的に対応するグループを取り違え、さらに、原文のグループに名前が挙がっていること自体を、新しく欄を設ける理由にしてしまう"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["選択肢1: 検出のフェーズがプロセス能力の材料であることだけを見て、ツールが既に自動で記録し集計に使えるという制約を読み飛ばす","選択肢3: 損なわれた品質特性（プロダクト品質の側の分類）を、プロセス能力を見るための分類と取り違える","選択肢5: 除去のフェーズがプロセス能力の材料であることだけを見て、リリース管理の仕組みから自動で埋まり月次で集計されているという制約を読み飛ばす"],"distractorTypes":["D2a","D4","D2a"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-83","MP-84"]}},{"id":"q-2.3.5-A-3","lo":"TM-2.3.5","cluster":"2.3.5-C","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"ネット証券の取引アプリを作る会社で、不具合の報告に使う欄を全社で決め直している。これまで欄は開発プロジェクトごとに違い、全社をまとめて数えることができなかった。\n\n今回決まったのは次の2つである。\n・どのプロジェクトでも同じにする核の欄は、タイトルと概要、再現の手順を含む詳しい説明、影響の重要度、修正の優先度の4つとする。\n・核の欄を増やすと起票にかかる時間が延びて書く人が迷うため、核の欄はこれ以上増やさない。\n\n性能テストの担当からは、どんな負荷をかけたとき（同時に注文を出した人数、注文の間隔、続けた時間）に起きたのかが分からなければ開発側は再現できない、という声が出ている。性能の不具合を起票するのはこの担当で、負荷の設定はこのチームのツールにしか残らず、開発の環境で同じ負荷をかけ直すことはできない。","question":"負荷のかけ方を集めるための欄の設け方として、適切なものはどれか。1つ選べ。","choices":["負荷のかけ方を核の欄に加え、性能以外の不具合のレポートでも、どのプロジェクトでも同じように記入を求める","性能の不具合は専用の様式に分け、そこでは核の4欄を外して、負荷のかけ方と測った値を中心にした欄の組を使う","負荷のかけ方の欄を新しく設け、性能に関わる不具合に限って記入を求める。核の4欄はそのまま使う","負荷のかけ方は欄にせず、修正を割り当てられた開発者が、条件を変えながら試して突き止めた値を経過の記録に書き足す"],"answer":[2],"explanation":{"signals":"効くのは、全社で決まった2つの事項と、負荷の値を誰が持っているかである。核の欄は4つとし、増やすと起票にかかる時間が延びて書く人が迷うためこれ以上増やさない——これが、負荷のかけ方を核に入れる道を閉じる。核の欄はどのプロジェクトでも同じにする——これが、性能の不具合だけ別の様式に切り替える道を閉じる。そして、負荷の設定は性能テストのチームのツールにしか残らず、開発の環境で同じ負荷をかけ直すことはできない——これが、その値を誰が書けるのかを決める。欄がプロジェクトごとに違って全社をまとめて数えられなかったという経緯は、核をそろえる動機ではあるが、負荷のかけ方を核に入れるかどうかは決めない。","why":"負荷のかけ方は新しい欄として設け、記入を求めるのは性能に関わる不具合に限る。核の4欄はそのまま使う——これが答えである。シラバスは「欠陥マネジメントとプロジェクトのステータスに必要な情報は、欠陥が SDLC の中でいつ検出されたかによって変わる。さらに、非機能品質特性に関連する欠陥レポートは、より多くの情報を必要とするかもしれない（例えば、性能課題の負荷条件）。しかしながら、収集される核となる情報は、SDLC 全体で、理想的には組織内のすべてのプロジェクトで一貫しているべきである」と述べており、情報が増えうる側と、一貫させる側とを同時に置いている。負荷条件は、増えうる側の例として原文が名指ししているものである。この案は、その増える分を性能に関わる不具合に限って足し、一貫させると決めた核の4欄には手を付けない。核の4欄を性能の不具合から外すほうは、収集される核となる情報は SDLC 全体で一貫しているべきだ、という原文の求めを崩す。原文が条件を付けずに求めているのはこの SDLC 全体での一貫で、組織内のすべてのプロジェクトにまで揃えることは理想として添えられている。一方、負荷のかけ方を核に加えて性能以外の不具合にまで広げるほうを落としているのは原文ではなく、核の欄はこれ以上増やさないという今回の決定である。原文が非機能について述べているのは情報が増えうることであって、増やす先を非機能に限れという求めではない。原文はさらに「属性を追加するたびに、欠陥レポート作成に費やす時間が長くなり、欠陥レポートを入力する担当者の混乱を招く可能性があるため、特定のコンテキストにおける欠陥マネジメントに必要なデータ、および/またはプロセス改善に使用されるデータのみを収集することが望ましい」としており、必要なコンテキストに限って集めるという形は、ここにもそのまま重なる。その欄が実際に埋まるかも、シナリオで足りている。性能の不具合を起票するのは性能テストの担当であり、負荷の設定はそのチームのツールに残っているので、起票の時点で書ける値である。","distractors":["負荷のかけ方を核の欄に加え、性能以外の不具合のレポートにまで記入を求めるこの案は、核の欄を増やすと起票にかかる時間が延びて書く人が迷うため核の欄はこれ以上増やさない、という今回決まった事項を正面から破る。原文が属性を追加することのコストとして挙げているのも、欠陥レポート作成に費やす時間が長くなることと、入力する担当者の混乱を招く可能性の2つで、決定と同じ向きを向いている。欄は全社でそろっていたほうが数えやすい、これまでばらばらだったのだからなおさらだ——という読みがこの案を選ばせる。だが原文が一貫を求めているのは収集される核となる情報についてであって、非機能品質特性に関連する欠陥レポートで増える情報まで、どのプロジェクトのどの不具合にも書かせよとは述べていない。","核の欄はどのプロジェクトでも同じにする——これも今回決まった事項であり、性能の不具合についてだけ核の4欄を外すこの案はそこに反する。原文も「収集される核となる情報は、SDLC 全体で、理想的には組織内のすべてのプロジェクトで一貫しているべきである」と述べている。性能は測り方も直し方も他と違うのだから、専用の様式のほうが速く正確に書ける——という考えがこの案を選ばせる。しかし核を外せば、欄がプロジェクトごとに違って全社をまとめて数えられなかった元の状態に、性能の不具合だけが戻る。原文が非機能について認めているのは情報が増えうることであって、核を差し替えてよいということではない。",null,"負荷の設定は性能テストのチームのツールにしか残らず、開発の環境で同じ負荷をかけ直すことはできない、とシナリオに書かれている。修正を割り当てられた開発者が条件を変えながら試しても、そのとき実際にかかっていた負荷には届かない。起票の手間はできるだけ増やしたくない、技術的な値は直す人が測ったほうが正確だ——という考えがこの案を選ばせる。それが当たるのは、その値を後から誰でも取り直せる場合であり、ここでは観測した側だけが値を持っている。"],"flip":["シナリオの「どのプロジェクトでも同じにする核の欄は、タイトルと概要、再現の手順を含む詳しい説明、影響の重要度、修正の優先度の4つとする」の1文が、「……影響の重要度、修正の優先度に、起きたときの負荷のかけ方を加えた5つとする」に置き換わると、負荷のかけ方は、コンテキストによって増える情報ではなく、どのプロジェクトでも一貫して集める核の情報になる。核の一覧そのものがそう定まるので、もう1つの決定である「核の欄はこれ以上増やさない」は、この5つを超えて増やさないという意味になり、この案とは食い違わない。そのとき、性能に関わる不具合だけに欄を足して核の4欄をそのままにする案は決まった核の一覧に足りず、負荷のかけ方を核の欄に加え、どのプロジェクトでも同じように記入を求める案が一意の正答になる。",null,null,null],"flipNote":{"2":"この案が一意の答えになるには、収集される核となる情報を SDLC 全体で一貫させるという原文の求めが消えていなければならない。原文は受験者が動かせる条件ではない。しかもこの案を退ける文は2つある。原文のその1文と、核の欄はどのプロジェクトでも同じにするというシナリオの決定である。シナリオの側を差し替えても原文の求めは残り、核の4欄を外した専用の様式は退けられたままになる。この案が外しているのは、非機能で増える側の情報ではなく、残すと決めた核の側である。","4":"この案に値打ちが出るのは、かかっていた負荷を後から開発側でも取り出せる場合である。ところが、負荷の設定は性能テストのチームのツールにしか残らないというシナリオの1文を差し替えると、負荷のかけ方をどこに残すかという問いの前提そのものが消え、欄を設ける案と設けない案を比べる土台が無くなる。負荷条件は、非機能品質特性に関連する欠陥レポートで増える情報の例として原文が挙げているものであり、観測した側が起票の時点で書ける値である。切り分けを経て初めて分かる事柄とは、値を持っている人が違う。"},"quote":"欠陥マネジメントとプロジェクトのステータスに必要な情報は、欠陥が SDLC の中でいつ検出されたかによって変わる。さらに、非機能品質特性に関連する欠陥レポートは、より多くの情報を必要とするかもしれない（例えば、性能課題の負荷条件）。しかしながら、収集される核となる情報は、SDLC 全体で、理想的には組織内のすべてのプロジェクトで一貫しているべきである。…属性を追加するたびに、欠陥レポート作成に費やす時間が長くなり、欠陥レポートを入力する担当者の混乱を招く可能性があるため、特定のコンテキストにおける欠陥マネジメントに必要なデータ、および/またはプロセス改善に使用されるデータのみを収集することが望ましい。","ref":"2.3.5","misconception":"非機能品質特性に関わる欠陥で情報が増えることを、核となる情報を SDLC 全体で一貫させることと引き換えにしなければならないものと考える"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["選択肢1: 非機能の欠陥で増える情報を、核となる情報と同じ層に置き、どのプロジェクトのどの不具合にも広げる（増やすことのコストを見ない）","選択肢2: 非機能で情報が増えることを、核の情報を差し替えてよいことだと読む（一貫させる対象を取り違える）","選択肢4: 観測した側にしか残らない値を、修正を割り当てられた人が後から突き止めるものとして扱う（値を持っている人の取り違え）"],"distractorTypes":["D2a","D2a","D10"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-85"]}},{"id":"q-2.3.5-A-4","lo":"TM-2.3.5","cluster":"2.3.5-D","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"自動車部品の工場で使う生産管理システムを、社内のテストチームが検証している。開発は外部の会社に委託していて、起票された不具合の報告はそのまま委託先のツールに渡る。\n\n欄を決めるにあたり、起票の時点で分かっていることだけを欄に置き、その時点で分からないことは欄にしない、という方針を決めた。空のままの欄が並ぶと、後から見た人が、まだ分からないのか書き忘れなのかを区別できないためである。\n\nテスト担当は、どの版のソフトをどの試験設備に載せて流したのかを実行の記録として持っている。工場の現場に通って運用も見ているので、不具合が残ったまま使われたときに現場に出る支障の大きさも、起票の時点で見積もれる。一方、その故障がソフトのどこの作り込みから来ているのかは、委託先がコードを調べて切り分けて初めて分かる。","question":"起票の時点で記入させる欄として、この方針に「合わない」ものはどれか。1つ選べ。","choices":["同じ故障をもう一度出すための操作の順序と、そこで期待していた動きと、実際に起きた動きを書かせる","故障が出たときに流していたソフトの版と、載せていた試験設備の構成を、実行の記録から転記させる","その不具合を抱えたまま現場で使われた場合に、生産ラインの稼働と作業者の手順にどれだけの支障が出るのかを、用意した区分から選ばせる","故障のもとにある誤りが、入力値の検査漏れか、計算式の取り違えか、画面への対応付けの誤りかを選ばせる"],"answer":[3],"explanation":{"signals":"当てはめる規則は今回の方針で、欄に置くのは起票の時点で分かっていることだけ、その時点で分からないことは欄にしない——空のままの欄が並ぶと、まだ分からないのか書き忘れなのかを後から見た人が区別できないからである。あとは、4つの欄それぞれについて、その値を誰がいつ持つのかをシナリオから読めばよい。テスト担当は、流したソフトの版と載せた試験設備の構成を実行の記録として持ち、工場の現場に通って運用も見ているので、不具合が残ったまま使われたときの支障の大きさも起票の時点で見積もれる。一方、その故障がソフトのどこの作り込みから来ているのかは、委託先がコードを調べて切り分けて初めて分かる。起票された報告がそのまま委託先のツールに渡るという段取りは、誰が読むかを決めるだけで、どの欄が起票時に埋まるかには効かない。","why":"方針に合わないのは、故障のもとにある誤りが、入力値の検査漏れか、計算式の取り違えか、画面への対応付けの誤りかを選ばせる欄である。その値を持っているのは起票するテスト担当ではなく、コードを調べて切り分けた委託先であり、起票の時点では埋めようがないからである。今回の方針は、起票の時点で分かっていることだけを欄に置き、その時点で分からないことは欄にしない、というものだった。残る3つは、いずれもその時点で値が出ている。操作の順序と、そこで期待していた動きと、実際に起きた動きは、試験を流したテスト担当がその場で見ている。流していたソフトの版と載せていた試験設備の構成は実行の記録に残っている。生産ラインの稼働と作業者の手順に出る支障の大きさも、現場に通って運用を見ている担当が見積もれる。シラバスの側から見れば、4つはどれも欠陥レポートに載りうる正しい項目である。再現の手順を含む詳しい説明と、ステークホルダーへの影響の重要度は、ほとんどの環境で必須である項目として原文が名指ししている。版と試験設備の構成は「欠陥解決に役立てる」ための情報の側にあり、作り込みの誤りの区分は「プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする」ための情報の、欠陥の種類（通常、欠陥分類法に対応する）に当たる。つまり原文だけでは4つを分けられない。分けているのは、その値がいつ手に入るかという今回の方針のほうである。だから、この区分を集めてはならないという話ではない。切り分けが済んでから埋まる情報だ、ということである。","distractors":["同じ故障をもう一度出すための操作の順序と、期待していた動きと、実際に起きた動きは、試験を流したテスト担当がその場で見ているので、起票の時点で分かっている。原文もこれを「故障を再現する手順を含む不正の詳細な説明」として、ほとんどの環境で必須である項目に挙げている。4つの中で書く量がいちばん多い欄なので、起票の負担を軽くするならここから外す——という読みがこの欄を選ばせる。今回の方針が外すのは、書くのに手間がかかるものではなく、起票の時点で値が出ていないものである。","故障が出たときに流していたソフトの版と、載せていた試験設備の構成は、テスト担当が実行の記録として持っている、とシナリオに書かれている。転記するだけなので、起票の時点で埋まる。原文はこれを「欠陥解決に役立てる」ための情報——不正が観察された特定のテストアイテムおよびそのリリース番号、欠陥が観察されたテスト環境——の側に挙げており、必須として名指しされた項目ではない。必須でない情報まで欄にするのは集めすぎだ——という読みがこの欄を選ばせるが、今回の方針は必須かどうかで欄を分けていない。分けているのは、起票の時点でその値が分かるかどうかである。","その不具合を抱えたまま現場で使われた場合に、生産ラインの稼働と作業者の手順にどれだけの支障が出るのかは、工場の現場に通って運用を見ているテスト担当が起票の時点で見積もれる、とシナリオに書かれている。原文も「テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度」を、ほとんどの環境で必須である項目に挙げている。支障の大きさを決めるのは現場の責任者や委託先で、テスト担当が起票のときに埋めるものではない——という読みがこの欄を選ばせる。だが、最終的に誰がその値を承認するかということと、起票の時点でその値が分かるかどうかは別である。",null],"flip":[null,null,null,null],"flipNote":{"1":"再現の手順を含む詳しい説明は、原文がほとんどの環境で必須と名指ししている項目であり、しかも試験を流した本人がその場で見ている値である。この欄を答えにするには、操作の順序が起票の時点では分からない案件——たとえば試験が夜間に自動で流れ、順序は委託先がログを解析して初めて分かる場合——に置き換えることになる。ところがそう置き換えても、作りのどこが誤っているかの区分が切り分けを経て初めて分かることは動かない。方針に合わない欄が2つ並び、1つ選べが成り立たなくなる。1つに戻すには、その区分を起票時に選べるようにする変更も同時に要る。","2":"流した版と試験設備の構成は、原文が「欠陥解決に役立てる」ための情報として挙げている側にあり、ほとんどの環境で必須である項目には入っていない。ただし今回の方針は必須かどうかを問うていないので、必須でないことはこの欄を外す理由にならない。この欄を答えにするには、実行の記録が起票の時点で残っていない案件に置き換えることになるが、そうしても、作りのどこが誤っているかの区分は依然として起票時には分からず、方針に合わない欄が2つになる。","3":"ステークホルダーへの影響の重要度は、原文がほとんどの環境で必須と名指ししている項目である。この欄を答えにするには、支障の大きさが起票の時点では見積もれない案件——たとえばテスト担当が工場の現場の運用を知らされていない場合——に置き換えることになる。しかしその1文を差し替えても、作りのどこが誤っているかの区分が切り分けを経て初めて分かることは動かないので、方針に合わない欄が2つ並び、1つ選べが成り立たない。"},"quote":"欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である：欠陥のタイトルと不正の簡単な概要／故障を再現する手順を含む不正の詳細な説明／テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度／不正を修正する優先度…以下の箇条書きは、意図する目的にしたがって情報をグループ化したものである：…プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする：欠陥の種類（通常、欠陥分類法に対応する）、欠陥が混入した作業成果物、または欠陥によって影響を受けた品質特性/副特性。","ref":"2.3.5","misconception":"原文が挙げている項目かどうかだけを見て、その値が起票の時点で手に入るかどうかを確かめない"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["選択肢1: 起票の負担という理由で、書く量の多い必須項目を欄から外す（方針が外す対象を取り違える）","選択肢2: 必須の4項目に入っていないことを、欄にしない理由として使う（必須でない＝集めない、と読む）","選択肢3: 値を最終的に承認する人が別にいることを、起票の時点でその値が分からないことと同一視する"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-87"]}},{"id":"q-2.3.5-A-5","lo":"TM-2.3.5","chapter":2,"section":"2.3","cluster":"2.3.5-A","variant":2,"k":3,"points":2,"type":"single","scenario":"病院向けの電子カルテを開発している会社で、不具合の起票画面を作り直している。移行前の画面は入力欄が21個あり、起票に平均12分かかっていた。\n\n作り直しで決まったことは、次のとおりである。\n・欄は「必ず値を持つ欄」と「気づいた人が書き足す欄」の2つに分ける。\n・必ず値を持つ欄とは、値が空のままでは不具合の記録として残せない欄をいう。起票した人が入れるか、あとから受け持ちの担当者が入れるかは問わない。\n・修正に手を着ける順番は毎朝の調整会議で決めており、その結果を書き込む欄はすでに必ず値を持つ欄として確定しており、今回の判断からは外す。\n・電子カルテは受付・処方・検査・会計の4つの機能に分かれており、どの機能で起きたのかは、あらかじめ決めておいた区分の中から選ばせる形にする。\n・残る4つの欄を、どちらに入れるかこれから決める。","question":"欠陥レポートをマネジメントするほとんどの環境で「必須」とされる情報に、当たらないものはどれか。1つ選べ。","choices":["一覧に並べたときに見分けがつくよう、何が起きたのかを一行の見出しにまとめ、あわせて短い説明を添えさせる欄","不具合が出ているのが電子カルテのどの機能なのかを、あらかじめ決めておいた区分の中から選ばせる欄","電子カルテの画面で何をどの順にたどってその状態に行き着いたのかと、そのとき画面に出ていた内容を書かせる欄","直さないまま診療に使われた場合に、外来の運びと患者にどこまで響くのかを3段階から選ばせる欄"],"answer":[1],"explanation":{"signals":"この判定を動かすのは、まずシナリオが必ず値を持つ欄をどう定めたかである。値が空のままでは不具合の記録として残せない欄がそれにあたり、起票した人が入れるか、あとから受け持ちの担当者が入れるかは問わない——だから、値を入れるのが誰かを理由に必須の側から外すことはできない。次に効くのが、修正に手を着ける順番を書き込む欄がすでに確定していて今回の判断から外れていることで、原文がほとんどの環境で必須として並べる4つの項目のうち1つが先に取り除かれている。残る4つの欄は、必須の箇条書きに載っている側と、目的ごとにまとめた箇条書きの「欠陥解決に役立てる」側とに分かれる。移行前の画面に入力欄が21個あって起票に平均12分かかっていたことは、画面を作り直す動機ではあるが、どの欄が必須にあたるかの線引きには効かない。","why":"外れるのは、不具合が出ているのが電子カルテのどの機能なのかを、あらかじめ決めておいた区分の中から選ばせる欄である。シラバスがこれにあたる情報を置いているのは必須の箇条書きではなく、目的ごとにまとめた箇条書きの「欠陥解決に役立てる：欠陥が存在するサブシステムまたはコンポーネント」の側だからである。この会社では、電子カルテは受付・処方・検査・会計の4つの機能に分かれており、どの機能で起きたのかは、あらかじめ決めておいた区分の中から選ばせる形にする、と決めてある。つまりこの欄が集めるのは、不具合がどの構成部分にあるのかという、直す人のための情報である。一方、原文が「欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である」として並べているのは、欠陥のタイトルと不正の簡単な概要、故障を再現する手順を含む不正の詳細な説明、テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度、不正を修正する優先度の4つであり、このうち修正に手を着ける順番を書き込む欄は、すでに必ず値を持つ欄として確定していて今回の判断から外れている。だから残る3つの欄——見出しと短い説明、たどった順序とそのとき画面に出ていた内容、診療に使われたときに外来の運びと患者へ響く度合い——は、そのまま残りの必須項目に当たる。なお、必須に含まれないことは、集めなくてよいことを意味しない。原文は、欠陥レポートでは多くのデータ項目を収集することができ、テストマネージャーはプロジェクトのコンテキストに応じて、どの情報が効果的な欠陥マネジメントに適しているかを判断する必要がある、と述べている。どの機能で起きたのかは修正に取りかかる人がまず見る情報なので、この会社が必ず値を持つ欄として残すと決めることもできる。ここで問われているのは、原文がどちら側に置いているかである。","distractors":["一覧で見分けがつくようにする一行の見出しと、あわせて添えさせる短い説明は、原文が、ほとんどの環境で必須であるとして箇条書きに置く「欠陥のタイトルと不正の簡単な概要」そのものである。この欄が選ばれるのは、見出しと概要はあとから一覧を眺めるためのもので、記録として値が要るのは中身のほうだと読んだ場合か、起票の時間を縮める話につられて、書き手の手間になる文章の欄から落とそうと考えた場合である。原文が集める情報を絞るよう述べているのは、そのコンテキストの欠陥マネジメントにもプロセス改善にも使わない属性についてであって、必須として名指しされた項目についてではない。",null,"電子カルテの画面で何をどの順にたどってその状態に行き着いたのかと、そのとき画面に出ていた内容は、原文が、ほとんどの環境で必須であるとして箇条書きに置く「故障を再現する手順を含む不正の詳細な説明」に当たる。この欄を外すのは、電子カルテのように操作の経路が枝分かれする対象では手順を書き切れないことがあるのだから、書ける人が書き足す側に回せばよい、と考えた場合である。だが原文は、再現の手順を含む詳細な説明を、書ける場合に付ける情報としては扱っていない。書きにくさは欄の作り方の問題であって、必須の側にあるかどうかを変えるものではない。","直さないまま診療に使われた場合に外来の運びと患者にどこまで響くのかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度」に当たる。この欄を外す人は、響き方の大きさは結局のところ修正に手を着ける順番に現れるのだから、順番が毎朝の調整会議で決まって欄に入る以上、二重に持つ必要はないと読んでいる。しかし原文は、影響の重要度と修正の優先度を別々の項目として並べている。どれだけの支障が出るかと、他の作業に対してどれだけ急ぐかは、同じ値の言い換えではない。"],"flip":[null,null,null,null],"flipNote":{"1":"欠陥のタイトルと不正の簡単な概要は、原文がほとんどの環境で必須と名指ししている項目であり、シナリオのどの条件を動かしてもその置かれ方は変わらない。この欄を答えにするには、原文の必須の一覧から見出しと概要を外し、そのうえで機能の区分を選ばせる欄をそこへ入れ直すことになる。原文の記述は受験者が動かせる条件ではないし、外す側と入れる側の2か所を同時に変える話でもある。外すほうだけを変えれば、必須に当たらない欄が2つ並び、1つ選べが成り立たなくなる。","3":"故障を再現する手順を含む不正の詳細な説明も、原文がほとんどの環境で必須と名指ししている項目である。書かせる分量を減らしても、書く人を起票した人から受け持ちの担当者に移しても、必須の側にあることは動かない。この欄を一覧から落とす変更を考えた場合も、機能の区分を選ばせる欄は必須の外に残ったままなので、条件に合う欄が2つになって1つ選べが崩れる。1つに戻すには機能の区分を必須の側へ入れる変更も要り、どちらも原文の書き換えであって、シナリオの条件の変更ではない。","4":"テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度も、原文がほとんどの環境で必須と名指ししている項目である。3段階という刻みを変えても、段位を付ける人をシナリオで動かしても、必須の側にあることは変わらない。重要度を一覧から落とす変更を考えても、機能の区分を選ばせる欄が必須の外に残るので、必須に当たらない欄が2つ並ぶ。この欄が一意の答えになる世界を作るには原文の箇条書きを2か所書き替えることになり、それは受験者が動かせる条件ではない。"},"quote":"欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である：／欠陥のタイトルと不正の簡単な概要／故障を再現する手順を含む不正の詳細な説明／テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度／不正を修正する優先度…欠陥解決に役立てる：欠陥が存在するサブシステムまたはコンポーネント、不正が観察された特定のテストアイテムおよびそのリリース番号、または欠陥が観察されたテスト環境。","ref":"2.3.5","misconception":"起票の手間を減らすという動機を、必須として名指しされた項目を任意に落としてよい理由と取り違え、原文が目的ごとの箇条書きに置いた情報と、必須の箇条書きに置いた情報との線を引き直してしまう"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["見出しと短い説明の欄: タイトルと概要を、一覧を眺めるための飾りであって記録として値が要る欄ではないと読む（必須の4項目のうち1つを任意側に数える）","たどった順序と画面に出ていた内容の欄: 再現手順を含む詳細な説明を、書ける人が書ける場合に付ければよい情報と読み、必須から外す","外来の運びと患者への響き方を3段階で選ばせる欄: ステークホルダーへの影響の重要度を、修正に手を着ける順番と同じ値の言い換えとみなし、片方あれば足りると読む"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-82","MP-88"]}},{"id":"q-2.3.5-A-6","lo":"TM-2.3.5","chapter":2,"section":"2.3","cluster":"2.3.5-A","variant":3,"k":3,"points":2,"type":"single","scenario":"宅配便の配送管理システムを開発している会社で、不具合票の様式を全社の規程として定め直している。下敷きにしたのは、社内規程の次の2条である。\n\n第12条　不具合票の欄は、必ず記入する欄と、記入を任意とする欄に分ける。必ず記入する欄とは、その不具合票を閉じるまでに値が入っていなければならない欄をいい、見つけた者が入れるか、引き取った者が後から入れるかは問わない。\n\n第13条　不具合の起こし方をたどり直すための記述は、様式のどこに置くかを別に定める。よって今回の見直しでは、その記述を扱う欄を対象から除く。\n\n不具合を見つけた時点で端末に入っていたアプリの版は、配布済みの一覧から選ばせる。様式案に残る4つの欄を、どちらに入れるかこれから決める。","question":"欠陥レポートをマネジメントするほとんどの環境で「必須」とされる情報に、当たらないものはどれか。1つ選べ。","choices":["不具合を見つけたときに、配送端末に入っていたアプリの版を、配布済みの一覧から選ばせる欄","そのまま集荷と配達に使われた場合に、荷主と受取人にどの程度の不利益が及ぶのかを4段階から選ばせる欄","不具合票を並べたときにそれと分かる一行の題と、何が起きたのかの短いあらましを入れさせる欄","順番待ちになっている他の修正に対して、どれだけ急いで直すべきかを3段階から選ばせる欄"],"answer":[0],"explanation":{"signals":"この判定を動かすのは、まず第12条が必ず記入する欄をどう定めたかである。不具合票を閉じるまでに値が入っていなければならない欄がそれにあたり、見つけた者が入れるか、引き取った者が後から入れるかは問わない——だから、値を入れるのが誰かを理由に必ず記入する欄から外すことはできない。次に効くのが第13条で、不具合の起こし方をたどり直すための記述を扱う欄が今回の対象から除かれており、原文がほとんどの環境で必須として並べる4つの項目のうち1つが先に取り除かれている。残る4つの欄は、必須の箇条書きに載っている側と、目的ごとにまとめた箇条書きの「欠陥解決に役立てる」側とに分かれる。版を配布済みの一覧から選ばせるという入力の形は、書き手の手間を左右するが、どの欄が必須にあたるかの線引きには効かない。","why":"外れるのは、不具合を見つけたときに、配送端末に入っていたアプリの版を、配布済みの一覧から選ばせる欄である。シラバスがこれにあたる情報を置いているのは必須の箇条書きではなく、目的ごとにまとめた箇条書きの「欠陥解決に役立てる」側——「不正が観察された特定のテストアイテムおよびそのリリース番号」——だからである。この会社でも、不具合を見つけた時点で端末に入っていたアプリの版は、配布済みの一覧から選ばせる、と決めてある。つまりこの欄が集めるのは、どの版で起きたのかという、直す人が切り分けに使う情報である。一方、原文が「欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である」として並べているのは、欠陥のタイトルと不正の簡単な概要、故障を再現する手順を含む不正の詳細な説明、テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度、不正を修正する優先度の4つであり、このうち不具合の起こし方をたどり直すための記述を扱う欄は、第13条が今回の見直しの対象から除いている。だから残る3つの欄——一行の題と短いあらまし、荷主と受取人に及ぶ不利益の度合い、他の修正に対する急ぎ具合——は、そのまま残りの必須項目に当たる。なお、必須に含まれないことは、集めなくてよいことを意味しない。原文は、欠陥レポートでは多くのデータ項目を収集することができ、テストマネージャーはプロジェクトのコンテキストに応じて、どの情報が効果的な欠陥マネジメントに適しているかを判断する必要がある、と述べている。版が分からないと切り分けが進まない以上、この会社が必ず記入する欄として残すと決めることもできる。ここで問われているのは、原文がどちら側に置いているかである。","distractors":[null,"そのまま集荷と配達に使われた場合に荷主と受取人にどの程度の不利益が及ぶのかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度」に当たる。この欄を外す人は、不利益の大きさは急ぎ具合に言い換えられるのだから、急ぎ具合の欄があれば足りると読んでいる。だが原文は、影響の重要度と修正の優先度を別々の項目として並べている。荷主と受取人にどれだけの不利益が及ぶかと、他の修正に対してどれだけ急ぐかは、同じ値の言い換えではない。","不具合票を並べたときにそれと分かる一行の題と、何が起きたのかの短いあらましは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「欠陥のタイトルと不正の簡単な概要」そのものである。この欄が選ばれるのは、題とあらましは一覧を見やすくするためのもので、規程が言う「値が入っていなければならない欄」には当たらないと読んだ場合か、第13条が不具合の起こし方をたどり直すための記述を扱う欄を対象から除いたのを、文章を書かせる欄はどれも様式の外へ回せる合図と読んだ場合である。だが第13条が対象から除くと述べているのは、不具合の起こし方をたどり直すための記述を扱う欄であって、文章を書かせる欄をまとめて外す定めではない。原文が集める情報を絞るよう述べているのも、そのコンテキストの欠陥マネジメントにもプロセス改善にも使わない属性についてであって、必須として名指しされた項目についてではない。","順番待ちになっている他の修正に対してどれだけ急いで直すべきかは、原文が、ほとんどの環境で必須であるとして箇条書きに置く「不正を修正する優先度」に当たる。この欄を外すのは、急ぎ具合を決めるのは不具合票を書く人ではなく修正を割り振る側なのだから、票の様式に必ず記入する欄として置くのは筋が違う、と読んだ場合である。だが第12条は、必ず記入する欄を、その不具合票を閉じるまでに値が入っていなければならない欄と定め、見つけた者が入れるか引き取った者が後から入れるかは問わないとしている。誰がいつ値を入れるかは、この判定に効かない。"],"flip":[null,null,null,null],"flipNote":{"2":"テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度も、原文がほとんどの環境で必須と名指ししている項目である。4段階という刻みを変えても、段位を付ける人を規程で動かしても、必須の側にあることは変わらない。重要度を一覧から落とす変更を考えても、アプリの版を選ばせる欄は必須の外に残ったままなので、条件に合う欄が2つになって1つ選べが崩れる。1つに戻すにはアプリの版を必須の側へ入れる変更も要り、どちらも原文の書き換えであって、規程やシナリオの条件の変更ではない。","3":"欠陥のタイトルと不正の簡単な概要は、原文がほとんどの環境で必須と名指ししている項目であり、規程のどの条を動かしてもその置かれ方は変わらない。この欄を答えにするには、原文の必須の一覧から題とあらましを外し、そのうえでアプリの版を選ばせる欄をそこへ入れ直すことになる。原文の記述は受験者が動かせる条件ではないし、外す側と入れる側の2か所を同時に変える話でもある。外すほうだけを変えれば、必須に当たらない欄が2つ並び、1つ選べが成り立たなくなる。","4":"不正を修正する優先度も、原文がほとんどの環境で必須と名指ししている項目である。3段階という刻みを変えても、値を入れるのを修正の割り振りの場に限っても、必須の側にあることは動かない。優先度を一覧から落とす変更を考えた場合も、アプリの版を選ばせる欄が必須の外に残るので、必須に当たらない欄が2つ並ぶ。この欄が一意の答えになる世界を作るには原文の箇条書きを2か所書き替えることになり、それは受験者が動かせる条件ではない。"},"quote":"欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である：／欠陥のタイトルと不正の簡単な概要／故障を再現する手順を含む不正の詳細な説明／テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度／不正を修正する優先度…欠陥解決に役立てる：欠陥が存在するサブシステムまたはコンポーネント、不正が観察された特定のテストアイテムおよびそのリリース番号、または欠陥が観察されたテスト環境。","ref":"2.3.5","misconception":"値を入れるのが誰かという都合を持ち込んで、原文が必須として名指ししている項目と、目的ごとの箇条書きに置いている情報との線を引き直してしまう"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","distractorIntent":["荷主と受取人に及ぶ不利益を4段階で選ばせる欄: ステークホルダーへの影響の重要度を、修正の急ぎ具合に言い換えられるとみなし、片方あれば足りると読む","一行の題と短いあらましの欄: タイトルと概要を、一覧を見やすくするためのもので値が入っていなければならない欄には当たらないと読む（必須の4項目のうち1つを任意側に数える）","他の修正に対する急ぎ具合を3段階で選ばせる欄: 修正の優先度を、決めるのが割り振る側だから票の必須欄ではないと読む"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-82","MP-88"]}},{"id":"q-2.3.6-A-1","lo":"TM-2.3.6","cluster":"2.3.6-A","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"イテレーションのふりかえりで、欠陥レポートの集計をプロセス改善に使うことにした。今回見たいのは、開発者が欠陥を直す作業そのものの質である。集計はどの項目でも取り出せる。","question":"このふりかえりで見るために、欠陥レポートから取る統計として最も適切なものはどれか。1つ選べ。","choices":["解決とされた欠陥が、その後どれだけ再オープンされているか","欠陥が混入したフェーズごとの件数が、要件、設計、実装にどう分かれているか","起票された欠陥のうち、重複や却下として終結したものがどれだけあるか","欠陥の発生箇所が、どのコンポーネントに偏っているか"],"answer":[0],"explanation":{"signals":"効くのは「今回見たいのは、開発者が欠陥を直す作業そのものの質である」という1文だけである。4つはどれも実在する有効な欠陥統計で、統計そのものが誤っているものは1つも無い。集計はどの項目でも取り出せるとあるので、取れるかどうかでも絞れない。","why":"取るべきは、解決とされた欠陥がその後どれだけ再オープンされているかである。今回見たいのは開発者が欠陥を直す作業そのものの質、すなわちデバッグの際の実装の品質であり、シラバスはそのアセスメントに、再オープンした欠陥に関する情報を対応させている。原文はこの対応を目的ごとに並べていて、混入フェーズの情報は欠陥が最も多く混入するフェーズの分析と欠陥予防のための的を絞った改善へ、欠陥の発生箇所に関する情報は欠陥のクラスター分析と、（リスクベースドテストのための）技術的リスクの理解、問題のあるコンポーネントのリファクタリングへ、重複した欠陥や却下した欠陥に関する情報は欠陥レポート作成の品質のアセスメントへ、それぞれ結び付けられている。集計はどの項目でも取り出せるのだから、選ぶ基準は取れるかどうかではなく、ふりかえりで見たい対象に原文がどの情報を割り当てているかになる。","distractors":[null,"混入フェーズごとの件数の分布が答えるのは、欠陥がどこで作り込まれているかという問いであって、作り込まれた欠陥を直す作業の質ではない。シラバスがこの情報を結び付けているのは、欠陥が最も多く混入するフェーズの分析と、欠陥予防のための的を絞った改善である。実装フェーズの件数が多ければ開発者の質の話だと読み替えると選んでしまうが、混入は修正より前の段階で起きている","重複や却下として終結した欠陥の割合が見せるのは、欠陥レポートを書く側の質である。シラバスはこの情報を、欠陥レポート作成の品質をアセスメントするために使うとしている。却下された分だけ修正の手戻りが生じているように見えるため、直す作業の質の指標として選ばれやすいが、直した結果がどうだったかはここには現れない","コンポーネントごとの偏りが答えるのは、どこに欠陥が集まっているかという場所の問いである。シラバスはこの情報を欠陥のクラスター分析に使い、技術的リスクをよりよく理解して問題のあるコンポーネントのリファクタリングを可能にするとしている。修正が集中している箇所が見えれば修正の質も見えるように思えるが、偏りが示すのはプロダクトの弱い箇所であって、直す作業の質ではない"],"flip":[null,"ふりかえりで見たい対象が、欠陥を作り込まないようにするための的を絞った改善であれば、原文がその目的に対応させているのは混入フェーズの情報なので、この選択肢が一意の正答になる","ふりかえりで見たい対象が、欠陥を直す作業の質ではなく、欠陥レポートを書く側の質であれば、原文がその目的に対応させているのは重複した欠陥や却下した欠陥の情報なので、この選択肢が一意の正答になる","ふりかえりで見たい対象が、技術的リスクを把握して問題のあるコンポーネントのリファクタリングにつなげることであれば、原文がその目的に対応させているのは発生箇所の情報なので、この選択肢が一意の正答になる"],"quote":"欠陥情報は、ふりかえりで議論されるようなプロセス改善のための施策をサポートすべきである。…欠陥が最も多く混入するフェーズの分析に混入フェーズの情報を使用して、欠陥予防のための的を絞った改善を可能にする。…欠陥の発生箇所に関する情報を使用して、欠陥のクラスター分析を行い、（リスクベースドテストのための）技術的リスクをよりよく理解して、問題のあるコンポーネントのリファクタリングを可能にする。…再オープンした欠陥に関する情報を使用して、デバッグの際の実装の品質をアセスメントする。…重複した欠陥や却下した欠陥に関する情報を使用して、欠陥レポート作成の品質をアセスメントする。","ref":"2.3.6","misconception":"欠陥レポートの統計を、有効な品質指標かどうかだけで選んでしまい、原文が目的ごとに情報を対応させていること、つまりふりかえりで見たいその対象にその統計が直接答えるかどうかが判定の軸であることを使えていない"},"meta":{"concept":"欠陥レポート情報を用いたプロセス改善アクションの定義","distractorIntent":["欠陥予防に対応する統計を、修正作業の質の統計として選ぶ","欠陥レポート作成の品質に対応する統計を、修正作業の質の統計として選ぶ","クラスター分析に対応する統計を、修正作業の質の統計として選ぶ"],"distractorTypes":["D4","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-28"]}},{"id":"q-2.3.6-B-1","lo":"TM-2.3.6","cluster":"2.3.6-B","variant":1,"chapter":2,"section":"2.3","k":2,"points":1,"type":"single","minutes":1,"scenario":"旅行予約サイトを運営する会社の保守チームは、起票の手間を減らそうと欠陥レポートの入力項目を絞ってきた。いま全件にそろっているのは、欠陥が現れたモジュール、重要度、修正した開発者、修正に要した時間の4つだけで、それ以外の欄は何年も空のままである。次のふりかえりでは、この記録を使ってプロセス改善を考えたい。","question":"残っている記録だけで着手できるプロセス改善として、最も適切なものはどれか。1つ選べ。","choices":["欠陥のクラスター分析を行い、技術的リスクの理解を深めてリファクタリングにつなげる","欠陥が最も多く混入するフェーズを見極めて、欠陥予防のための的を絞った改善に取り組む","デバッグの際の実装の品質をアセスメントし、修正作業の進め方そのものを見直す","欠陥レポート作成の品質をアセスメントし、起票の仕方をそろえる取り決めを設ける"],"answer":[0],"explanation":{"signals":"効くのは、全件にそろっている項目を挙げた1文だけである。4つはどれも原文がプロセス改善の施策として挙げているもので、施策そのものが誤っているものは1つも無い。修正した開発者と修正に要した時間が残っている点は、直す作業の質なら測れそうに見せる材料だが、原文がデバッグの際の実装の品質に対応させているのは再オープンした欠陥に関する情報である。重要度は、原文が例として挙げるどの施策にも材料として出てこない。","why":"いま着手できるのは、欠陥のクラスター分析を行って技術的リスクの理解を深め、リファクタリングにつなげる改善である。全件にそろっている項目のうち、欠陥が現れたモジュールは原文が言う欠陥の発生箇所に当たり、シラバスは、欠陥の発生箇所に関する情報を使用して欠陥のクラスター分析を行い、（リスクベースドテストのための）技術的リスクをよりよく理解して、問題のあるコンポーネントのリファクタリングを可能にする、としている。全件そろっているのだから、どのコンポーネントに集まっているかの集計もそのまま取れる。ほかの施策は、原文がそれぞれに対応させている情報がこのチームに残っていない ── 欠陥予防のための的を絞った改善を可能にするのは混入フェーズの情報、デバッグの際の実装の品質のアセスメントを可能にするのは再オープンした欠陥に関する情報、欠陥レポート作成の品質のアセスメントを可能にするのは重複した欠陥や却下した欠陥に関する情報で、その欄はどれも何年も空のままである。欠陥を追跡しないという決定について原文が、信頼できるサポートデータが不足し、上記で提案した改善の実施を困難にすると述べているのと、同じかたちが、記録する項目を絞ってきたこのチームで起きている。","distractors":[null,"欠陥予防のための的を絞った改善は、原文が混入フェーズの情報を使って欠陥が最も多く混入するフェーズを分析することで可能になるとしているものである。このチームは欠陥を作り込んだフェーズを記録しておらず、その欄は空のままなので、どのフェーズに多いかを見極める材料が無い。施策の中身は原文どおりで正しいため、手元に何が残っているかを確かめずに選んでしまう。","デバッグの際の実装の品質は、原文が再オープンした欠陥に関する情報からアセスメントするとしているものである。このチームに全件そろっている項目のうち修正に関わるのは、修正した開発者と修正に要した時間で、直す側の質を測る材料に見えるが、原文がこのアセスメントに対応させているのは再オープンの情報のほうであり、それは空欄のままである。残っている項目の名前が修正に関わるものなので、手元のデータと結び付けた気になって選ばれやすい。","欠陥レポート作成の品質は、原文が重複した欠陥や却下した欠陥に関する情報からアセスメントするとしているものである。終結時に重複や却下として閉じたかどうかはこのチームの記録に無いため、その割合を出せない。起票の手間を減らしてきたという経緯から、起票の仕方そのものを見直す話につなげたくなるが、見直しの材料が残っていない。"],"flip":[null,"全件にそろっている項目が、欠陥が現れたモジュールではなく欠陥を作り込んだフェーズであれば、原文は混入フェーズの情報が欠陥予防のための的を絞った改善を可能にするとしているので、この選択肢が一意の正答になる","全件にそろっている項目が、欠陥が現れたモジュールではなく、いったん解決とした欠陥が再オープンされた履歴であれば、原文はその情報からデバッグの際の実装の品質をアセスメントするとしているので、この選択肢が一意の正答になる","全件にそろっている項目が、欠陥が現れたモジュールではなく、終結時に重複や却下として閉じたかどうかの区分であれば、原文はその情報から欠陥レポート作成の品質をアセスメントするとしているので、この選択肢が一意の正答になる"],"quote":"欠陥が最も多く混入するフェーズの分析に混入フェーズの情報を使用して、欠陥予防のための的を絞った改善を可能にする。…欠陥の発生箇所に関する情報を使用して、欠陥のクラスター分析を行い、（リスクベースドテストのための）技術的リスクをよりよく理解して、問題のあるコンポーネントのリファクタリングを可能にする。…再オープンした欠陥に関する情報を使用して、デバッグの際の実装の品質をアセスメントする。…重複した欠陥や却下した欠陥に関する情報を使用して、欠陥レポート作成の品質をアセスメントする。…これは、信頼できるサポートデータが不足し、上記で提案した改善の実施を困難にする。","ref":"2.3.6","misconception":"原文が挙げるプロセス改善の施策を、施策として正しいかどうかだけで選び、その改善を可能にするのはどの欠陥情報かという対応と、その情報が手元に残っているかとを突き合わせない。原文は、欠陥を追跡しないという決定が信頼できるサポートデータの不足を招き、提案した改善の実施を困難にすると述べており、記録が欠けた項目に対応する改善は裏づけを持てないことになる、という読み方ができていない"},"meta":{"concept":"欠陥レポート情報を用いたプロセス改善アクションの定義","distractorIntent":["混入フェーズの情報に対応する改善を、その情報が記録されていない状況で選ぶ","再オープンした欠陥の情報に対応する改善を、修正者と修正時間が残っていることを材料と取り違えて選ぶ","重複・却下の情報に対応する改善を、起票の手間という状況の言葉に引かれて選ぶ"],"distractorTypes":["D4","D4","D4"],"conceptNote":"未作成","mistakePatterns":["MP-28"]}},{"id":"q-3.1.1-A-1","lo":"TM-3.1.1","cluster":"3.1.1-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"人のスキルを4つの能力領域に分けるとき、**個人の能力に含まれないもの**はどれか。1つ選べ。","choices":["自分の仕事の進め方を自分で管理し、決めたことを守れること","他者と協力し、相手や場面に合わせて自分の振る舞いを変えられること","批判を受け止められること、および変化を受け入れる姿勢を持てること","自信を持って行動できること、および人から信頼されること"],"answer":[1],"explanation":{"signals":"各選択肢は能力を2つずつ束ねて書いてある。だから見るのは束の片方ではなく両方で、「個人の能力に含まれないもの」と言えるのは、束ねられた両方が個人の能力の外にあるときである。分かれ目は、その能力が自分自身に向くもの（自分を成長させる態度や個性）なのか、他者とのやり取りの中ではじめて働くものなのかである。紛らわしい言い方が2か所に仕込んである。「変化を受け入れる姿勢」は社会的能力の例にある「適応性」と語が近いが、原文は前者を個人の能力の例に置いている。「人から信頼される」も他者が出てくる言い方だが、原文の語は「信頼性」である。","why":"個人の能力の外にあるのは、他者と協力し、相手や場面に合わせて自分の振る舞いを変えられることである。原文は「協力」を社会的能力そのものの説明に置き、「適応性」をその例に挙げている。束ねられた両方が社会的能力の側なので、この能力は個人の能力には入らない。シラバスは社会的能力を、内部および異文化間のコンテキストにおけるコミュニケーション、協力、対立マネジメントに関するスキルを含み、ある状況において適切に行動し、個人および共通のゴールを達成するために他者との関わりを可能にするものだとし、例としてコミュニケーションスキル、対立解決スキル、チームワーク、適応性、自己主張を挙げている。いっぽう個人の能力は、自分自身を成長させ、才能、モチベーション、実行意欲の他、具体的な態度や個人の個性を伸ばす能力と意欲を含むものとされ、例としてセルフマネジメント能力、個人的責任感、批判を受ける能力、信頼性、回復力、自信を持って行動する能力、規律正しさ、変化を受け入れる姿勢、助け合いや学ぶ意欲、任せる能力が並ぶ。残る選択肢に書かれているのは、いずれもこの並びの語を言い換えたものである。ただし、どちらの並びも「例えば…など」と書かれた例示であって閉じた一覧ではない。だから、並びに無い言い回しが出てきたときは語の一致では決まらず、その能力が自分自身に向くのか、他者との関わりの中ではじめて働くのかで見分けることになる。語感で寄せると外す。委任はマネジメントの語感があるので専門的能力（プロジェクトマネジメントスキル）に見えやすいが、原文は「任せる能力」を個人の能力の例に置いており、3.1.5 も、テストチームを率いるには社会的能力・個人の能力が不可欠な成功要因だとしたうえで、そこに委任する能力を挙げている。帰属を取り違えると打ち手がずれる。3.1.4 は、自己学習やトレーニングが専門的・方法論的な能力の開発に適しているとする一方、社会的能力と個人の能力を開発するにはトレーニングやコーチングのアプローチを推奨し、社会的交流、フィードバック、内省をその重要な成功要因に挙げている。対人の問題に技法研修を当てても届かないのは、この違いによる。","distractors":["自分の段取りを自分で決めて守るというこの束は、原文が個人の能力の例に挙げているセルフマネジメント能力と規律正しさの言い換えで、どちらも個人の能力の内側にある。「自分で管理する」という言い方がマネジメントに見えて専門的能力へ寄せたくなるところだが、ここで管理する対象は自分の仕事の進め方であって、他者との関わりは出てこない。",null,"批判を受ける能力と、変化を受け入れる姿勢の言い換えで、原文はどちらも個人の能力の例に挙げている。これが選ばれるのは「変化を受け入れる」を社会的能力の例にある「適応性」と同じものと見たときである。語は近いが、原文は適応性を社会的能力の例に、変化を受け入れる姿勢を個人の能力の例に書き分けている。社会的能力の側は他者との関わりの中で働くものなので、相手や場面に合わせて出方を変える話がそちらに入る。","自信を持って行動する能力と信頼性の言い換えで、原文はどちらも個人の能力の例に挙げている。「人から信頼される」という言い方に他者が出てくるため、他者との関わりで働く能力に見えるというのが、これが選ばれる道筋である。原文の語は「信頼性」で、他者へ働きかける力ではなく、任された作業を約束どおり仕上げるという本人側の属性を指す。"],"flip":[null,null,null,null],"flipNote":{"1":"この選択肢は「自分の仕事の進め方を自分で管理する」と「決めたことを守れる」を束ねており、原文はそれぞれをセルフマネジメント能力、規律正しさとして個人の能力の例に挙げている。ここを他者との関わりの中で働くもの（作業分担の調整や合意の取り付け）へ書き替えても、答えは移らない。設問は否定形で、正解は協力と適応性が社会的能力の例であることだけで立っており、この選択肢の文面に左右されないからである。束の片方だけを替えれば残る片方が個人の能力の例にとどまり、両方を替えれば「個人の能力に含まれないもの」と言えるものが2つ並んで、1つ選べが成り立たない。なお「自分で管理する」を「他のメンバーに任せる」に替えても行き先は動かない。原文は「任せる能力」を個人の能力の例に挙げている。","3":"この選択肢は「批判を受け止められる」と「変化を受け入れる姿勢」を束ねており、原文はどちらも、批判を受ける能力・変化を受け入れる姿勢として個人の能力の例に挙げている。前者を対立を収める側の話に、後者を相手や場面に合わせて出方を変える話に替えれば、たしかに社会的能力の側へ移る。それでも答えはここへ来ない。設問は否定形で、正解は協力と適応性という社会的能力の例で立っていて、この選択肢をどう書き替えても正解のままだからである。片方だけを替えれば残る片方が個人の能力の例にとどまり、両方を替えれば「個人の能力に含まれないもの」と言えるものが2つ並んで、1つ選べが成り立たない。","4":"この選択肢は「自信を持って行動できる」と「人から信頼される」を束ねており、原文の語では自信を持って行動する能力と信頼性、どちらも個人の能力の例である。前者を場での自己主張に、後者を協働を引き出す働きかけに替えれば社会的能力の側へ動くが、それでも答えはこちらへ来ない。正解は協力と適応性が社会的能力の例であることだけで決まっていて、この選択肢の文面に依存しないからである。片方だけの差し替えでは残る片方が個人の能力の例にとどまり、両方を差し替えると「個人の能力に含まれないもの」と言えるものが2つ並んで、1つ選べが成り立たない。また「人から」という言い方を残したままでは行き先は動かない。原文の信頼性は、任された作業が約束どおり仕上がるという本人側の属性だからである。"},"quote":"個人の能力：自分自身を成長させ、才能、モチベーション、実行意欲の他、具体的な態度や個人の個性を伸ばす能力と意欲を含む。例えば、セルフマネジメント能力、個人的責任感、批判を受ける能力、…回復力、自信を持って行動する能力、規律正しさ、変化を受け入れる姿勢、助け合いや学ぶ意欲、任せる能力などが挙げられる。","ref":"3.1.1","misconception":"4つの能力領域を語感で振り分けており、その能力が自分自身に向くのか、他者との関わりの中ではじめて働くのかという分かれ目で見ていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["個人の能力の正メンバー","個人の能力の正メンバー（適応性と紛らわしい）","個人の能力の正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-14"]}},{"id":"q-3.1.1-A-2","lo":"TM-3.1.1","cluster":"3.1.1-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーのスキルを4つの能力領域に分類するとき、**方法論的能力**の例として適切なものはどれか。1つ選べ。","choices":["テスト対象の業務や、実装に使われている技術について深い知識を持つこと","テストの作業と要員の割り当てを取りまとめ、進め方を管理できること","使ったことのない技術やツールでも、自分で調べて使えるようになれること","新しいことを学ぼうとする意欲と、同僚を助けようとする姿勢を持っていること"],"answer":[2],"explanation":{"signals":"効くのは、そのスキルをシラバスが4つの能力領域のどの説明の下に置いているかである。専門的な業務を遂行するためのスキルか、領域を限定しない一般的な遂行能力か、他者との関わりを可能にするスキルか、自分自身を成長させる能力と意欲か。語の印象ではなく、この4つのどの説明に当てはまるかで決まる。とりわけ「学ぶ」は、身に付けて使えるようになる能力として書かれているか、学ぼうとする意欲として書かれているかで、置かれる側が変わる。","why":"初めて触る技術やツールでも、自分で調べて使えるようになれること。これが方法論的能力の例である。シラバスは方法論的能力を「ある領域で独自に使用でき、複雑度または新規性の高い課題を独自に遂行できる一般的な能力」と定義しており、使ったことのないものを自力で扱えるようになる力は、まさに新規性の高い課題を独自に遂行する一般的な能力にあたるからである。原文がこの領域の例に挙げているのは分析力、概念力、判断力で、いずれも特定の業務に結び付かない遂行の力である。公式サンプル問題も「新しい技術やツールを学ぶ能力」について、複雑で新しい課題を独自に完了させることを可能にする一般的な知識・スキル・能力を伴うとして、方法論的能力と裁定している。残る3つは、テスト対象の業務や実装技術についての知識とテストの作業・要員のマネジメントがシラバスの挙げる専門的能力の例、学ぼうとする意欲と助け合う姿勢が個人の能力の例である。","distractors":["テスト対象の業務についての知識と、実装に使われている技術についての知識は、シラバスが専門的能力の例に挙げているビジネス専門知識とアプリケーション領域における技術的専門知識にあたる。深い知識を持っていることと、領域を限定せずに新規性の高い課題を独自に遂行できることは別で、方法論的能力の定義が指しているのは後者である","テストの作業と要員の割り当てを取りまとめ、進め方を管理することは、シラバスが専門的能力の例に挙げるプロジェクトマネジメントスキルにあたる。ISTQB が重点を置く専門的能力の中身としても、テストタスクのマネジメントが最初に挙がっている。「管理」「取りまとめ」という語感から領域を限定しない一般的な遂行能力に見えるが、シラバスはこれを専門的能力の側に置いている",null,"新しいことを学ぼうとする意欲も、同僚を助けようとする姿勢も、シラバスが個人の能力の例に挙げている「助け合いや学ぶ意欲」そのものである。「学ぶ」という語が正解と重なるため紛らわしいが、分かれ目は能力か意欲かにある。学んで使えるようになる力は方法論的能力、学ぼうとする姿勢は個人の能力である"],"flip":[null,null,null,null],"flipNote":{"1":"テスト対象の業務や実装技術についての深い知識は、原文が専門的能力の例に挙げているビジネス専門知識とアプリケーション領域における技術的専門知識である。この記述を、領域を限定しない一般的な遂行能力の記述に書き替えれば方法論的能力に移るが、そのとき正解の選択肢も方法論的能力に残るため、正答が2つになり1つ選べが成り立たない。この記述が答えになるのは設問が専門的能力を問うたときであり、それは条件の変更ではなく設問の変更である。","2":"テストの作業と要員の割り当てを取りまとめることは、原文が専門的能力の例に挙げるプロジェクトマネジメントスキルにあたり、ISTQB が重点を置く専門的能力の中身としてもテストタスクのマネジメントが列挙されている。記述を一般的な遂行能力に書き替えれば方法論的能力に移るが、正解の選択肢も方法論的能力に残るため正答が2つになる。この記述が答えになるのは設問が専門的能力を問うたときである。","4":"新しいことを学ぼうとする意欲と同僚を助けようとする姿勢は、原文が個人の能力の例に挙げる「助け合いや学ぶ意欲」である。「学ぼうとする意欲」を「習得して使いこなせる能力」に替えると方法論的能力に移るが、その記述は正解の選択肢と同じ中身になるため、正答が2つになり1つ選べが成り立たない。この記述が答えになるのは設問が個人の能力を問うたときであり、それは条件の変更ではなく設問の変更である。"},"quote":"専門的能力：専門的な業務を遂行するためのスキルで構成される。例えば、テスト技法のスキル、アプリケーション領域における技術的専門知識、ビジネス専門知識、プロジェクトマネジメントスキルなどがある。方法論的能力：ある領域で独自に使用でき、複雑度または新規性の高い課題を独自に遂行できる一般的な能力を含む。例えば、分析力、概念力、判断力などがある。","ref":"3.1.1","misconception":"「マネジメントとあれば方法論的」「学ぶとあれば個人」のように語の印象で4つの能力領域に振り分けており、専門的な業務を遂行するためのスキルなのか、領域を限定しない一般的な遂行能力なのかという分かれ目を持っていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["プロジェクトマネジメントスキルを方法論的能力だと考える（正: 専門的能力）","領域固有の知識を方法論的能力だと考える（正: 専門的能力）","「学ぶ意欲」と「学ぶ能力」を同じ区画に入れる（正: 意欲は個人の能力）"],"distractorTypes":["D1","D1","D8"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-14"]}},{"id":"q-3.1.2-A-1","lo":"TM-3.1.2","cluster":"3.1.2-A","variant":1,"chapter":3,"section":"3.1","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは医療機器メーカーで、植込み型の心臓デバイスの遠隔モニタリングシステムのテストマネージャーを務めている。このシステムは医療機器プログラムとして薬事の対象であり、要件と検証の対応づけを記録として残し、当局の照査で提示できる状態に保つことが求められている。\n\nテストチームは5名で、うち1名が来月退職する。その1名が担っていたのは次の3つである。\n\n・要件仕様と個々のテストケースの対応づけを維持し、照査でいつでも提示できる状態に保つ\n・心拍データの異常判定について、臨床側の担当者と何をもって異常とするかを詰め、テストできる条件に落とす\n・実機とシミュレータのテスト環境を構築し、版ごとの差分を管理する\n\nなお今回の体制変更にあわせて、テスト環境の構築と版の管理はインフラ担当のチームへ移管することが決まっている。また、リリース可否の報告と関係部署との調整は、従来どおりあなたが行う。","question":"後任に求める能力として、優先して確認すべきものを2つ選べ。","choices":["要件と個々のテストの対応づけを維持し、第三者の照査に耐える形で示せること","テスト自動化の基盤を設計し、実機とシミュレータの環境を版ごとに構築できること","臨床の担当者と何をもって異常とするかを詰め、あいまいな取り決めをテストできる条件に落とせること","リリースしてよいかを関係部署に説明し、部署間で意見が割れたときにまとめられること","探索的テストに習熟し、短い時間で多くの不具合を見つけられること"],"answer":[0,2],"explanation":{"signals":"効くのは、退職する1名が担っていた3項目と、そのあとに置かれた2つの断りである。片方は移管の断りで、実機とシミュレータのテスト環境の構築と版ごとの差分の管理はインフラ担当のチームへ移ることが決まっている。もう片方は継続の断りで、リリース可否の報告と関係部署との調整は、従来どおりテストマネージャーであるあなたが行う。前者は3項目のうち1つを後任の担当から外し、後者は、3項目には挙がっていない仕事をあなたの側に留め置く。冒頭の、医療機器プログラムとして薬事の対象であり要件と検証の対応づけを当局の照査で提示できる状態に保つことが求められているという記述も効く。これが、後任に残る仕事の一方に求められる厳密さの水準を決めている。一方、テストチームが5名であることは規模を伝えるだけで、どの能力が要るかは左右しない。","why":"後任に優先して確認すべきは、要件と個々のテストの対応づけを維持し第三者の照査に耐える形で示せることと、臨床の担当者と何をもって異常とするかを詰めてあいまいな取り決めをテストできる条件に落とせることである。退職する1名が抱えていた仕事のうち、実機とシミュレータのテスト環境の構築と版ごとの差分の管理はインフラ担当のチームへ移すと決まっているので、後任がそのまま引き受けるのはこの2つになる。ここで求めるのは「優秀なテスト担当者の一般的な条件」ではなく、この体制変更のあとに実際に空く仕事を埋める能力である。\nシラバスは人員配置をテスト計画の中の活動と位置づけ、そこにはテスト戦略でテストを実装するために必要な人員の役割とスキルを特定するタスクが含まれるとし、プロジェクトに必要なスキルを決定するには詳細な状況分析が必要だとしている。この状況でその分析にあたるのが、誰がどこまでを担うのかという境界を引く作業である。\n対応づけの維持に要る水準を決めているのは、このシステムが医療機器プログラムとして薬事の対象であり、要件と検証の対応づけを記録として残して当局の照査で提示できる状態に保つことが求められている、という条件である。だから後任に必要なのは対応表を作れる程度ではなく、第三者に見せて通る形で示せることまでである。\n異常判定のほうは性質が違う。何をもって異常とするかは臨床側の担当者が持っている知識であり、後任の仕事はそれを引き出して、テストできる条件に落とすことになる。シラバスは、システムの機能適合性をアセスメントするためにはアプリケーションドメインのビジネスに関する専門知識が必要だとしている。加えて、ソフトウェア開発とソフトウェアテストは通常（異なる）グループの異なるメンバーによって行われコミュニケーションを通じてタスクを調整するとし、プロジェクトの成功にはコミュニケーションスキル、チームワークや対立解決の能力が求められるとしている。あいまいなままの取り決めを別の分野の相手と詰めて条件に落とす仕事は、この両方を同時に要求する。","distractors":[null,"実機とシミュレータの環境を版ごとに構築するという後半は、退職者が担っていた3項目の3つ目にそのまま重なって見える。しかしその環境の構築と版の管理は、今回の体制変更にあわせてインフラ担当のチームへ移管することが決まっており、後任が引き受ける仕事ではない。シラバスも、テストチーム外の人々がさらに特定のスキルを提供することもあるとし、理想的なテストチームは与えられたテストタスクに必要なスキルをすべて持っているか、または必要なスキルを持つタスクのみを担当する、としている。さらに、この選択肢が先頭に置く「テスト自動化の基盤を設計し」は、退職者の3項目のどこにも挙がっていない。移管の一文に行き着く前に、3項目との突き合わせだけでも外れる",null,"リリースの可否を関係部署に説明し、割れた意見をまとめる仕事は、いまもテストマネージャーであるあなたのものである。シナリオは「リリース可否の報告と関係部署との調整は、従来どおりあなたが行う」と書いており、退職によって空く仕事ではない。だから後任に優先して確認すべき能力にはならない。シラバスが社会的能力として挙げるコミュニケーション、協調性、対立解決スキルは、テストチームメンバーにも求められるものである。この選択肢がもっともらしく見えるのはそのためだが、外れる理由は能力そのものではなく、ここで埋めるべき仕事がどれかにある","探索的テストの習熟そのものは、シラバスがテスト実行に求められる技術的専門知識の例として、自動化テストの実行やテスト結果の評価と並べて挙げている実在の能力である。外れるのは能力の質ではなく、この状況との結びつきである。退職者が担っていた3項目のどれもこの能力を要求しておらず、体制変更の2つの断りもこの能力を呼び出さない。シラバスは、プロジェクトに必要なスキルを決定するには詳細な状況分析が必要だとしている。一般にどれだけ望ましいかで選ぶと、ここで実際に空く仕事が埋まらないまま残る"],"flip":[null,null,null,null,"退職者の責務の2つ目が、臨床側と何をもって異常とするかを詰めることではなく、リリース前の短い期間に未知の不具合を洗い出すことであったなら、環境の構築と版の管理は移管されるため、後任に残る責務は1つ目とその項目の2つになり、この能力が正解の一方になる。ここでは責務が3つとも明示されており、そこに探索的テストは含まれていない"],"flipNote":{"2":"自動化の基盤の設計と環境の版ごとの構築を並べたこの選択肢が正解の一方になるには、2つの変更がそろわなければならない。1つは、インフラ担当のチームへ移るのが実機とシミュレータの環境の構築と版の管理ではなく、要件仕様と個々のテストケースの対応づけの維持のほうであること。もう1つは、退職者が担っていた環境の仕事が、版ごとの構築に加えて、その確認を自動化する基盤の設計まで含んでいることである。移管の一文だけを置き換えても、この選択肢が先頭に置く「テスト自動化の基盤を設計し」は退職者の3項目のどこにも書かれていないままなので、3項目との突き合わせの段階で外れ続ける。","4":"リリース可否の説明と部署間の取りまとめを挙げたこの選択肢を正解の一方にするには、まずこの仕事を担っていたのが今回退職する1名で、あなたがそれを引き取らないことが要る。だがそれだけでは足りない。その世界で後任に残るのは、対応づけの維持、異常判定の詰め、そしてリリース可否の報告と調整になり、対応する能力が3つ立つ。優先して確認すべきものを2つ選ぶという形が成り立たなくなるので、要件と個々のテストケースの対応づけの維持を品質保証部門などの別の担い手が引き取ることも同時に要る。シナリオの一文を1本動かすだけでは届かない。"},"quote":"人員配置はテスト計画の中の活動である。これには、テスト戦略でテストを実装するために必要な人員の役割とスキルを特定するタスクが含まれる。プロジェクトに必要なスキルを決定するには、詳細な状況分析が必要である。","ref":"3.1 イントロダクション、3.1.2","misconception":"この状況で実際に空く仕事から必要な能力を導かず、一般に価値の高いスキルを「あった方がよい」で選んでしまう"},"meta":{"concept":"テストチームのスキル","distractorIntent":["移管済みの責務に対応する能力","テストマネージャー自身の職務に対応する能力","責務に直結しない一般的に有用な能力"],"distractorTypes":["D2","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-16","MP-15"]}},{"id":"q-3.1.2-A-2","lo":"TM-3.1.2","cluster":"3.1.2-B","variant":1,"chapter":3,"section":"3.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは生命保険会社で、保険金の請求受付から給付査定までを扱う新しいオンラインサービスのテストマネージャーを務めている。開発の進め方はハイブリッドで、契約者が使う請求画面と請求の流れは2週間ごとの反復で作り込み、当局へ提出する帳票と約款に基づく給付額の計算部分は、テストレベルを順に踏む逐次の進め方を取る。テストチームは現在4名で、今回2名を新たに採用する。\n\nこのプロジェクトには次の特性がある。\n\n・監督当局の照査に備え、給付の可否を決める要件と、それを確認したテストの対応を、いつでも示せる記録として残すことが求められている\n・請求の流れに関する要件は反復のたびに見直しが入り、医療機関への照会、本人確認、送金を担う3つの外部サービスと連携する\n・メンバーは国内の拠点と時差7時間の海外の拠点に分かれており、全員が顔を合わせるのは月に1回である\n・請求書類には傷病名や治療歴が含まれ、契約者の情報の取り扱いに関する要件が厳しい\n\n欠陥の管理に使うツールは全社共通のもので、今回の増員にあわせて変更する予定はない。","question":"新たに採用する2名に求める能力の組み合わせとして、最も適切と判断できるものはどれか。","choices":["反復と逐次の作法を切り替えられること、約款と給付査定の業務に通じ要件とテストの対応を記録として示せること、外部サービスとの受け渡しや権限のない参照から情報が漏れる経路を検証できること、時差のある拠点と意思疎通を保てること、および繰り返す確認を自動化して保守できること","保険金の給付査定の業務と約款の内容に通じていること、要件と実施したテストの対応を証跡として残し照査の場で取り出せること、テストレベルごとの開始基準と終了基準を管理できること、反復する確認をスクリプトにして維持できること、および当局や内部監査の担当者に手順と結果を筋道立てて説明できること","要件の見直しに合わせてテストを組み替えられること、時差のある拠点と意思疎通を保てること、外部サービスの応答を模擬する仕組みを用意できること、探索的テストで短い時間に問題を洗い出せること、および回帰の確認を自動化して回せること","テスト設計の結果を詳細なテスト仕様書として書き起こし要件との対応を残せること、テストレベルごとの開始基準と終了基準を管理できること、既存の基幹バッチ処理の構造と運用手順に通じていること、業務部門を取りまとめて受け入れテストを運営できること、および手動で行う回帰の確認を統率できること"],"answer":[0],"explanation":{"signals":"効くのは、冒頭の2文と箇条書きの4項目である。扱うのは生命保険の給付査定で、約款に基づく給付額の計算部分と当局へ提出する帳票はテストレベルを順に踏む逐次、契約者が使う請求画面と請求の流れは2週間ごとの反復で進む。箇条書きが挙げるのは、当局の照査に備えて給付の可否を決める要件とそれを確認したテストの対応を記録に残すこと、請求の流れの要件が反復のたびに見直され、医療機関への照会・本人確認・送金を担う3つの外部サービスと連携すること、拠点が国内と時差7時間の海外に分かれ全員が顔を合わせるのは月に1回であること、請求書類に傷病名や治療歴が含まれ契約者の情報の取り扱いに関する要件が厳しいことである。加えて、反復と逐次を並行させるという冒頭の進め方からは、同じ確認が版を重ねるたびに戻ってくることが読める。一方、テストチームが現在4名であることと、欠陥の管理に使うツールが全社共通で今回は変更しないことは、どの能力が要るかを左右しない。","why":"採るべきは、反復と逐次の作法を切り替えられること、約款と給付査定の業務に通じ要件とテストの対応を記録として示せること、外部サービスとの受け渡しや権限のない参照から情報が漏れる経路を検証できること、時差のある拠点と意思疎通を保てること、繰り返す確認を自動化して保守できることを並べた組み合わせである。これを残りと分けている決め手は、契約者の情報が漏れる経路を確かめる能力を持っているのがこれだけだという点にある。請求書類には傷病名や治療歴が含まれ、その取り扱いに関する要件は厳しいと書かれていて、しかも本人確認や送金までを外部のサービスに預ける。シラバスは、プロジェクトで使用するソフトウェアやシステムのアーキテクチャや技術には、例えばプログラミング言語、インターフェース技術、セキュリティの脆弱性などの技術的専門知識が求められるとしている。外部サービスとの受け渡しと権限のない参照は、この項目がそのまま指している対象である。\n残る4つも、同じようにこの状況の記述から出ている。シラバスは、プロジェクトコンテキストは求められる専門的能力に関する価値ある情報を提供するとして、システムドメイン、アーキテクチャや技術、SDLC を挙げる。システムドメインが求めるのはアプリケーション分野のビジネス専門知識で、ここでは約款と給付査定の業務がそれに当たる。当局の照査に備えた記録も、給付の可否を決める要件と、それを確認したテストのどれとどれを対応づけるのかを判断できなければ維持できないので、業務の知識と記録の能力は切り離せない。SDLC が求めるのはテストレベルやテストの役割、特定のテスト技法に関する知識で、ここでは、当局へ提出する帳票と給付額の計算をテストレベルを順に踏んで確かめる側と、2週間ごとに回る側の双方の作法を身につけ、反復のたびの要件の見直しに合わせて行き来できることがこれに当たる。\n社会的能力についてシラバスは、コミュニケーション、協調性、対立解決スキルを挙げたうえで、求められる水準はプロジェクトのコンテキストによって異なる場合があるとしている。国内の拠点と時差7時間の海外の拠点に分かれ、全員が顔を合わせるのが月に1回という条件のもとでは、離れた相手と意思疎通を保てることがこの組み合わせに要る。\n自動化だけは、箇条書きの4項目からは直接出てこない。出どころは冒頭の進め方と、請求の流れに関する要件が反復のたびに見直されるという記述である。見直しが入るということは、いちど確かめた範囲を確かめ直すということであり、それを逐次側と並行させる以上、同じ確認が版を重ねるたびに戻ってくる。だから繰り返す確認を自動化して保守できることが要る。\nなお、この組み合わせは採用する2名が分け合って持つものであって、1名にすべてを求めるものではない。シラバスも、すべてのチームがテストタスクを成功裏に完了するためには、スキルの適切な組み合わせが重要な要素であるとしている。","distractors":[null,"業務と約款の知識、証跡として残して照査の場で取り出せること、テストレベルごとの開始基準と終了基準、反復する確認のスクリプト化、当局や内部監査の担当者への説明まで並び、当局の照査に備えた記録の要求と逐次で進む部分の運営には厚く応えているので、いちばん惜しく見える。しかし、契約者の情報の取り扱いに応える能力が1つも入っていない。請求書類に傷病名や治療歴が含まれ要件が厳しいと明記されており、シラバスはセキュリティの脆弱性に関する技術的専門知識を、プロジェクトで使用するソフトウェアやシステムのアーキテクチャや技術から導かれるものとして挙げている。医療機関への照会・本人確認・送金を担う3つの外部サービスとの受け渡しも同じ項目に属するが、連携の経路そのものを確かめる能力がない。時差をはさんだ拠点との意思疎通にも、2週間ごとに回る側の作法への切り替えにも触れていない","要件の見直しへの追従、離れた拠点との意思疎通、外部サービスの応答を模擬する仕組み、探索的テスト、回帰の自動化は、反復で進む部分だけを見れば過不足がない。外部サービスに触れてはいるが、触れ方が応答を模擬する側に寄っていて、受け渡しの経路から情報が漏れないかを確かめる能力にはなっていない。そのうえ、当局の照査に備えた記録と逐次で進む部分の作法、契約者の情報の取り扱いに応える能力がまとめて欠けており、給付査定という業務そのものの知識にも触れていない。このサービスは反復で進む部分と逐次で進む部分の両方を持ち、当局へ提出する帳票と給付額の計算部分は後者に属する。反復側だけに合わせた組み合わせでは、監督当局の照査に備える責任を負える人を採れない","詳細なテスト仕様書、テストレベルごとの開始基準と終了基準、基幹バッチ処理の構造と運用手順の知識、受け入れテストの運営、手動で行う回帰の統率は、要件を固めて逐次に進める既存システムの改修であれば筋の通った組み合わせであり、要件との対応を残すという点では照査の要求にも一見合っているように見える。しかしこのサービスは2週間ごとの反復を含み、要件は反復のたびに見直され、3つの外部サービスと連携し、拠点は時差をはさんで分かれ、請求書類には傷病名や治療歴が含まれる。手動で行う回帰を統率する形は、同じ確認が版を重ねるたびに戻ってくる進め方とかみ合わない。そもそも既存の基幹バッチ処理は、このシナリオのどこにも出てこない"],"flip":[null,null,null,null],"flipNote":{"2":"業務と約款の知識、証跡、テストレベルごとの基準、確認のスクリプト化、当局への説明を並べたこの組み合わせが最も適切になるには、メンバーが1か所に集まって働くこと、契約者の情報の取り扱いと3つの外部サービスとの受け渡しの検証を別の担い手が専任で受け持つこと、そして請求画面と請求の流れも含めてすべてを逐次の進め方で作り、要件を各テストレベルの開始前に確定することが、いずれもそろう必要がある。どれか1つを動かしても、この組み合わせが持っていない能力が、残りの特性に応えないまま残る。誤っているのは並んでいる能力の中身ではなく、いまの状況で欠かせないものを含んでいないという点である。","3":"要件の見直しへの追従と外部サービスの模擬を軸に据えたこの組み合わせがそのまま採用の要件になるには、当局へ提出する帳票と約款に基づく給付額の計算部分を逐次側の既存のチームが引き続き担うこと、契約者の情報の取り扱いが要件どおりかを別の担い手が検証すること、そして今回採用する2名が2週間ごとの反復で進む請求画面と請求の流れだけを受け持つことが、いずれもそろう必要がある。1つだけを動かすと、照査に備えた記録の要求か、情報の取り扱いの要件のどちらかが、応える能力を欠いたまま残る。","4":"詳細なテスト仕様書と手動で行う回帰の統率を軸にしたこの組み合わせが最も合うのは、この請求サービスが既存の基幹バッチ処理を置き換える一括移行として計画され、要件を凍結して逐次の進め方だけで進み、外部サービスとの連携も既存の仕組みをそのまま引き継ぎ、メンバーが1か所に集まって働き、契約者の情報の取り扱いの検証を別の担い手が受け持つ場合である。つまり、いま置かれている条件のほとんどを別のものに置き換えることになる。誤っているのは能力の水準ではなく、この組み合わせが想定している進め方と対象が、このプロジェクトのものと違うことである。"},"quote":"加えて、プロジェクトコンテキストは、求められる専門的能力に関する価値ある情報を提供する：•システムドメインには、情報技術、自動車産業、ギャンブリング産業など、アプリケーション分野のビジネス専門知識が求められる。•プロジェクトで使用するソフトウェアやシステムのアーキテクチャや技術には、例えばプログラミング言語、インターフェース技術、セキュリティの脆弱性などの技術的専門知識が求められる。•SDLC では、例えば、テストレベル、テストの役割、特定のテスト技法に関する知識が求められる。","ref":"3.1 イントロダクション、3.1.2","misconception":"特性の一部にうまく応える組み合わせを見つけると、残りの特性に応える能力が入っているかを確かめずに選んでしまう"},"meta":{"concept":"テストチームのスキル","distractorIntent":["情報の保護と離れた拠点との協働、反復側への適応が欠落した逐次寄りの束","規制側の記録と業務知識、情報の保護が欠落した反復寄りの束","逐次の進め方だけのシステムに向けた束"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-15","MP-16"]}},{"id":"q-3.1.2-C-1","lo":"TM-3.1.2","cluster":"3.1.2-B","variant":2,"chapter":3,"section":"3.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは通信事業者で、料金プランと契約の管理を行う社内システムのテストマネージャーを務めている。テスト担当者は6名で、これまでは年2回の大きな更改を、テストレベルを順に踏む進め方で確かめてきた。日々の段取りと作業の割り当てはあなたが決め、進み具合を集めて報告してきた。\n\n来期から次のように変わる。\n\n・更改は2週間ごとの反復になり、テスト担当者は開発者と同じ1つのチームに入って、その場で仕様を詰めながら確かめていく\n・日々の段取りと作業の割り当ては、あなたではなくチーム自身が決める。あなたは複数のチームをまたいで相談に応じる側に回る\n・料金プランの改定日は法令と広告の都合で動かせず、反復ごとの区切りは前倒しも延期もしない\n・テストの手順そのものも、反復のたびに見直して作り変えていく\n\n扱う業務も実装に使う技術もこれまでと変わらず、6名はいずれも料金計算と契約の状態の移り変わりに通じていて、実装に使っている言語とインターフェースの仕組みも読める。社内の問い合わせ窓口の受付時間は来期も変わらない。","question":"来期の体制のもとで、6名に新たに求める力の組み合わせとして、最も妥当と判断できるものはどれか。","choices":["開発者と同じ場で仕様を詰めるためのこれまでより高い水準の意思疎通と協調、意見が割れたときに落としどころを作る力、反復ごとの区切りに合わせて他のチームの担当者と手順をすり合わせる力、決まったことを一人ひとりに伝えて記録に残す力、および2週間ごとに回す進め方でのテストの役割とテストレベルの捉え方","料金計算と契約の状態の移り変わりについての理解をさらに深めること、実装に使っている言語とインターフェースの仕組みについての技術の知識を広げること、テストレベルごとの開始と終了の見極めを管理すること、詳細な手順書を整えて次の担当者が読める記録として残すこと、および更改のたびに結果をまとめて関係する部署に報告すること","区切りが動かない中で仕上げきる信頼性と立て直す力、開発者と同じ場で仕様を詰めるためのこれまでより高い水準の意思疎通と協調、手順が変わり続ける中で学ぼうとする意欲と変化への前向きな姿勢、自分たちで段取りを決めるための一人ひとりの自己管理と規律、および2週間ごとに回す進め方でのテストの役割とテストレベルの捉え方","一人ひとりが受け持ちを最後までやり切る責任感、区切りが動かない中で仕上げきる信頼性、開発者から受け取った仕様を自分で読み解いて進める粘り強さ、批判を受け止める度量と自信を持って踏み込む姿勢、経験の長い担当者が新しく入った人に手順を教える面倒見のよさ、および決めたことを記録に残す几帳面さ"],"answer":[2],"explanation":{"signals":"効くのは、来期からの変わり方を並べた4行と、その後ろに置かれた一文である。4行が挙げているのは、テスト担当者が開発者と同じ1つのチームに入ってその場で仕様を詰めること、日々の段取りと作業の割り当てをチーム自身が決めること、料金プランの改定日が動かず反復ごとの区切りを前倒しも延期もしないこと、テストの手順そのものを反復のたびに見直して作り変えることである。後ろの一文は、扱う業務も実装に使う技術もこれまでと変わらず、6名がすでにどちらにも通じていると述べていて、4行の外側を閉じている。一方、社内の問い合わせ窓口の受付時間が来期も変わらないことは、だれに何を求めるかを動かさない。","why":"6名に新たに求めるのは、区切りが動かない中で仕上げきる信頼性と立て直す力、開発者と同じ場で仕様を詰めるためのこれまでより高い水準の意思疎通と協調、手順が変わり続ける中で学ぼうとする意欲と変化への前向きな姿勢、自分たちで段取りを決めるための一人ひとりの自己管理と規律、そして2週間ごとに回す進め方でのテストの役割とテストレベルの捉え方である。これを選ばせている決め手は、来期に変わるのが進め方とチームの運び方だけだという点にある。扱う業務も実装に使う技術もこれまでと変わらず、6名はいずれも料金計算と契約の状態の移り変わりに通じていて、実装に使っている言語とインターフェースの仕組みも読める。足りなくなるのは知識の量ではなく、新しい運び方が要求する振る舞いのほうである。\nシラバスは、人員配置はテスト計画の中の活動であるとし、プロジェクトに必要なスキルを決定するには詳細な状況分析が必要であるとしている。この状況でその分析にあたるのが、変わる行を1つずつ力に置き換える作業である。\n開発者と同じ1つのチームに入ってその場で仕様を詰める形については、シラバスは、求められる社会的スキルのレベルはプロジェクトのコンテキストによって異なる場合があるとし、例として、アジャイルソフトウェア開発では、ドキュメント中心のシーケンシャル開発モデルや離れた場所で行うテストよりも高い社会的スキルが求められる場合がある、としている。この一文が比べているのは、アジャイルソフトウェア開発と、ドキュメント中心のシーケンシャル開発モデルや離れた場所で行うテストである。来期の形は前者の側に寄り、年2回の更改をテストレベルを順に踏んで確かめてきたこれまでの形は後者に近い。だから、同じ6名に求める社会的スキルの水準は上がる側に動く。\n残る3行が求めるのは、シラバスが個人の能力と呼んでいる側である。シラバスは、自己組織化されたアジャイルチームで働く場合、チームメンバー全員に対して、より高いレベルで自身をマネジメントすることと規律を求めるかもしれないとし、特に時間厳守が求められるプロジェクトでは、高い信頼性と回復力が求められることが多いとし、すべてのSDLCモデルにおけるプロセスの変化では、助け合いや学ぼうとする意欲、変化に対するオープンな姿勢が重要であるとしている。段取りを自分たちで決めること、区切りを前倒しも延期もしないこと、手順そのものを作り変え続けることが、それぞれこの3つに対応する。\n最後の1つは知識の側である。シラバスは、プロジェクトコンテキストは求められる専門的能力に関する価値ある情報を提供するとし、SDLC では、例えば、テストレベル、テストの役割、特定のテスト技法に関する知識が求められる、としている。進め方が2週間ごとの反復に変わる以上、どのテストをどの段でだれが受け持つのかの捉え方は、6名が新しく身につける側に入る。","distractors":["開発者と同じ場で仕様を詰めるためのこれまでより高い水準の意思疎通と協調は、来期の変わり方の1行目がそのまま求めているものであり、そこに落としどころ作り、他のチームの担当者との手順のすり合わせ、決まったことの伝達と記録、そして2週間ごとに回す進め方でのテストの役割とテストレベルの捉え方まで並ぶので、いちばん惜しく見える。ただし末尾に置かれたその捉え方は、採るべき組み合わせにも一字一句同じ文言で並んでいる知識であり、ここで差はつかない。しかし、残る4つはいずれも他者とのやり取りに関わる力で、この組み合わせが欠いているのは自分自身に向かう側である。反復ごとの区切りに合わせて手順をすり合わせることは書かれていても、区切りが動かない中で仕上げきる信頼性と立て直す力には触れていない。決まったことを一人ひとりに伝えることは書かれていても、その一人ひとりが自分たちで段取りを決めて守る側、すなわち自己管理と規律には触れていない。手順そのものが変わり続けることに対する学ぼうとする意欲と変化への前向きな姿勢も入っていない。シラバスは、自己組織化されたアジャイルチームで働く場合にはチームメンバー全員により高いレベルで自身をマネジメントすることと規律を求めるかもしれないとし、時間厳守が求められるプロジェクトでは高い信頼性と回復力が求められることが多いとしている","料金計算と契約の状態の移り変わりの理解を深めること、実装に使っている言語とインターフェースの仕組みの知識を広げることは、いずれも実在の力である。シラバスも、プロジェクトコンテキストは求められる専門的能力に関する価値ある情報を提供するとし、システムドメインにはアプリケーション分野のビジネス専門知識が、プロジェクトで使用するソフトウェアやシステムのアーキテクチャや技術にはプログラミング言語やインターフェース技術などの技術的専門知識が求められるとしている。外れるのは力の質ではなく、この状況ではその2つが動かないからである。扱う業務も実装に使う技術もこれまでと変わらず、6名はいずれもどちらにも通じている、と書かれている。残るテストレベルごとの開始と終了の見極め、詳細な手順書、更改ごとの報告は、年2回の更改をテストレベルを順に踏んで確かめてきた運び方を前提にしたものであり、来期の4行のどれも、これを新たに求めてはいない",null,"受け持ちを最後までやり切る責任感、批判を受け止める度量、自信を持って踏み込む姿勢は、シラバスが個人の能力の例に挙げているものである。区切りが動かない中で仕上げきる信頼性に至っては、この状況が実際に求めているものの1つでもあるので、態度の側に目を向けた人ほど選びやすい。しかし、この組み合わせは、開発者と同じ場で仕様を詰めるために上がる意思疎通と協調の水準に触れておらず、段取りを自分たちで決めることが求める自己管理と規律にも、手順が変わり続けることが求める学ぼうとする意欲と変化への前向きな姿勢にも応えていない。開発者から受け取った仕様を自分で読み解いて進める粘り強さに至っては、来期に変わるのが、開発者と同じ1つのチームに入ってその場で仕様を詰める形のほうである以上、向きが逆である"],"flip":[null,null,null,null],"flipNote":{"1":"同じ場で仕様を詰めるための水準の引き上げから、落としどころ作り、他のチームとのすり合わせ、決まったことの伝達と記録までを並べたこの組み合わせが最も妥当になるには、来期の変わり方のうち3行が同時に別のものになる必要がある。日々の段取りと作業の割り当てをチーム自身が決めること、反復ごとの区切りを前倒しも延期もしないこと、テストの手順そのものを作り変え続けること ── この3行が残るかぎり、一人ひとりの自己管理と規律、仕上げきる信頼性と立て直す力、学ぼうとする意欲と変化への前向きな姿勢を、どこにも持たないままになる。1行を入れ替えても、残る2行が同じ理由でこの組み合わせを退ける。","2":"業務の理解と実装技術の知識を深め、テストレベルごとの開始と終了の見極めや詳細な手順書、更改ごとの報告を並べたこの組み合わせは、年2回の更改をテストレベルを順に踏んで確かめてきたこれまでの進め方のもとでなら筋が通る。ここで選ばれないのは、扱う業務も実装に使う技術も変わらず、6名がすでにどちらにも通じていると書かれているからである。仮にその一文が、業務の範囲も実装の基盤も入れ替わって6名のだれも触れたことがない、という内容に変わったとしても、来期の変わり方の4行が求めているものは1つも入らないままである。置き換えるべきなのは、この組み合わせが向いている先のほうである。","4":"受け持ちをやり切る責任感、区切りが動かない中で仕上げきる信頼性、受け取った仕様を自分で読み解く粘り強さ、批判を受け止める度量と自信、手順を教える面倒見のよさを並べたこの組み合わせが最も妥当になるには、テスト担当者が開発者と同じ1つのチームに入ってその場で仕様を詰めるという行と、日々の段取りと作業の割り当てをチーム自身が決めるという行と、テストの手順そのものを作り変え続けるという行が、そろって別のものになる必要がある。どれか1行だけを戻しても、残る行が求める意思疎通と協調の水準、自己管理と規律、学ぼうとする意欲のいずれかを、この組み合わせは欠いたままである。"},"quote":"テストチームメンバーの有効性と効率性は、彼らのスキルや態度、それらを向上する意欲にも左右される。例えば、自己組織化されたアジャイルチームで働く場合、チームメンバー全員に対して、より高いレベルで自身をマネジメントすることと規律を求めるかもしれない。…特に時間厳守が求められるプロジェクトでは、高い信頼性と回復力が求められることが多い。加えて、すべてのSDLC モデルにおけるプロセスの変化では、助け合いや学ぼうとする意欲、変化に対するオープンな姿勢が重要である。","ref":"3.1.2","misconception":"進め方やチームの運び方が変わっても、必要なのは業務と技術の知識を積み増すことだと考え、その変化が求める社会的スキルの水準と、個人の能力の側が動くことを見落とす"},"meta":{"concept":"テストチームのスキル","distractorIntent":["他者とのやり取りに関わる力4つに、正答と同じ知識1つを添えた束。自分自身に向かう個人の能力3つが動くことを見落とす","変わらないと書かれている業務と技術の知識を積み増し、これまでの進め方の運び方をそのまま持ち込んだ束","自分自身に向かう態度を集めたが、同じ場で仕様を詰めることが求める水準と、手順が変わり続けることへの構えを欠いた束"],"distractorTypes":["D3","D2","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-15"]}},{"id":"q-3.1.2-D-1","lo":"TM-3.1.2","cluster":"3.1.2-D","variant":1,"chapter":3,"section":"3.1","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは、国内の路線バス事業者に運行管理サービスを提供する会社でテストマネージャーを務めている。顧客はすべて国内の事業者で、海外に売る計画は無い。\n\nこのサービスの中核である、ダイヤと乗務員の交番（だれがどの便に乗るか）を組む部分を、別の言語で作り直す。今回のテストで答えを出すよう経営から求められているのは次の2つである。\n\n・作り直した部分が、事業者ごとの運用の取り決めと、乗務員の勤務時間に関する法令のとおりに動くか\n・作り直した後のコードが、毎年の法令改正と事業者ごとの要望による改修に、この先も耐えられる作りか\n\nテスト担当は4名である。4名とも、画面の操作とこれまで使ってきた試験の手順には長く親しんでおり、どの試験項目を今回も流すかは自分たちで決められる。一方、ダイヤと交番を組むときの取り決めは前任の1名が一人で抱えており、その人は昨年退職した。作り直しで使う言語とその構造を読んだ経験は、4名とも無い。\n\nこのサービスの利用者数は昨年から1割増えている。","question":"今回のテストのために新たに確保すべきものとして、優先度の高いものを2つ選べ。","choices":["事業者ごとの運用の取り決めと乗務員の勤務時間に関する法令に通じ、作り直した部分の動きがそのとおりかを見て取れること","これまで使ってきた試験の手順と画面の操作に通じ、今回どの試験項目を流すかを自分たちで見極められること","作り直しで使う言語とコードの構造を読み、この先の改修に耐える作りかどうかを見極められること","海外の事業者への展開を見据え、異なる文化のあいだで意思疎通し、多言語の表示を確かめられること","毎年の法令改正や勤務時間の決まりの見直しのたびに繰り返す確認を、作り直しで使う言語でスクリプトにして夜間に流し続けられること"],"answer":[0,2],"explanation":{"signals":"効くのは、経営が答えを求めている2つと、4名がいま何を持ち何を持っていないかを述べた段落、そして顧客がすべて国内の事業者で海外に売る計画が無いという一文である。求められているのは、作り直した部分が事業者ごとの運用の取り決めと乗務員の勤務時間に関する法令のとおりに動くかと、作り直した後のコードが毎年の改修にこの先も耐えられる作りかの2つである。4名は画面の操作とこれまでの試験の手順には長く親しむ一方、取り決めを抱えていた前任の1名は昨年退職し、作り直しで使う言語とその構造を読んだ経験は4名とも無い。一方、利用者数が昨年から1割増えていることは、どの力を確保するかを動かさない。","why":"新たに確保すべきは、事業者ごとの運用の取り決めと乗務員の勤務時間に関する法令に通じて動きがそのとおりかを見て取れることと、作り直しで使う言語とコードの構造を読んでこの先の改修に耐える作りかどうかを見極められることである。この2つを選ばせているのは、経営が答えを求めているものと、いまのチームが持っているものとのずれである。取り決めを抱えていた1名は昨年退職しており、作り直しで使う言語とその構造を読んだ経験は4名とも無い。\nシラバスは、テストタイプやテストレベルが異なれば、求められるスキルも異なるとし、その例として、システムの機能適合性をアセスメントするためには、アプリケーションドメインのビジネスに関する専門知識が必要であり、コードの保守性をアセスメントするためには、技術的な専門知識が必要である、と述べている。
