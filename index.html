たびに似たような懸念ばかりが並ぶため、関係者が一覧を流し読みするようになり、油断が生じているとあなたは感じている。","question":"この困難さへの対処として最も適切なものはどれか。1つ選べ。","choices":["過去のデータを持ち出し、主要な関係者に見積もりを出してもらう","洗い出しに適した人を参加させ、重要なものに絞って軽減する","定期的に様子を見て、関係者へ報告することを続ける","顔ぶれが変わることを前提に、分析を繰り返し続ける"],"answer":[1],"explanation":{"signals":"効くのは、症状が「毎回同じような懸念ばかりが並び、油断が生じている」であることだけである。見積りが難しいわけでも、報告が滞っているわけでも、関係者が入れ替わったわけでもない。4つとも、シラバスが 1.3.6 で別々の困難さに結び付けている手当てであり、対処として正しいかどうかでは絞れない。","why":"洗い出しに適した人を参加させ、重要なものに絞って軽減する ── シラバスがデジャブという困難さに置いている解決策がこれである。デジャブの記述は、プロジェクトごとに同じようなリスクが提起されるため、リスクに対する油断が生じている、というものであり、毎回似た懸念ばかりが並んで関係者が一覧を流し読みしているというこの場面の症状がそのまま当たる。参加者を入れ替えて新しい目を入れ、対象を重要なものに絞ることが、流し読みされる一覧に実質を取り戻させる。シラバスは 1.3.6 で、リスクマネジメントが遭遇する困難さを症状ごとに並べ、それぞれに手当てを対応づけている。過去のデータを持ち出して主要なプロジェクトステークホルダーに見積もりを求めることは、リスク影響とリスク可能性を見積ることは非常に困難であるという「リスクレベルのアセスメントが困難」に置かれた解決策である。リスクの定期的なモニタリングとステークホルダーへの報告は、短期的な成功への高いプレッシャーの中でアプローチの設定と維持がしばしば軽視されるという「適切な開始」に置かれた解決策である。顔ぶれが変わることを前提に分析を繰り返し続けることは、「ステークホルダーの変化」の項でシラバスが、ステークホルダーは時間とともに変わる可能性があり新たなリスクが発生することもあるため、リスク分析は継続的でイテレーティブな活動となると述べていることにあたる。どれも手当てとしては正しいが、いま起きている症状の相手ではない。","distractors":["過去のデータを使い、主要なプロジェクトステークホルダーにアセスメントを求めることは、シラバスが「リスクレベルのアセスメントが困難」に対して挙げている解決策である。影響と可能性の見積りが難しい場面では正しいが、ここで起きているのは見積りの難しさではなく、同じ一覧が繰り返されることによる油断である",null,"リスクの定期的なモニタリングとステークホルダーへの報告は、シラバスが「適切な開始」に対して挙げている解決策である。短期的な成功への高いプレッシャーの中でアプローチの維持が軽視される場面に効くものであり、この症状への手当てではない","リスク分析が継続的でイテレーティブな活動となり、初めに一度だけ実施するものではないことは、シラバスが「ステークホルダーの変化」の項で述べていることである。関係者が入れ替わって新たなリスクが発生する場面では正しいが、ここでは同じ顔ぶれから同じ懸念が繰り返し出ていることが問題になっている"],"flip":["関係者が起こりやすさや痛みの度合いを言い当てられず、段位付けが進まない場面であれば、この対処が正解になる。誤っているのは対処の中身ではなく、当てている困難さの方である",null,"短期の成果に追われてリスクの扱いが後回しになり、アプローチが立ち上がらない場面であれば、この対処が正解になる","担当者の異動が続いて前提が変わっているのに、一覧が初期のままである場面であれば、この対処が正解になる"],"quote":"デジャブ：プロジェクトごとに同じようなリスクが提起されるため、リスクに対する油断が生じている。解決策：リスク識別に適切な人材を参加させ、重要なリスクのみを軽減する。","ref":"1.3.6","misconception":"1.3.6 の困難さと解決策を、ばらばらの一般的な助言として覚えており、どの症状にどの解決策が対応づけられているかを結び付けていない"},"meta":{"concept":"リスクベースドテストの困難さ","distractorIntent":["リスクレベルのアセスメントが困難な場合の解決策を当てる","適切な開始が妨げられている場合の解決策を当てる","ステークホルダーの変化に対する解決策を当てる"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","mistakePatterns":["MP-08"]}},{"id":"q-1.4.1-A-1","lo":"TM-1.4.1","cluster":"1.4.1-A","variant":1,"chapter":1,"section":"1.4","k":2,"points":1,"type":"single","minutes":1,"scenario":"新しい基幹システムの開発が始まり、テストマネージャーがプロジェクトテスト戦略の草案を書いている。","question":"テストアプローチを選ぶときの重要な決定事項に**含まれないもの**はどれか。1つ選べ。","choices":["静的テストと動的テストをそれぞれどこまで用いるかを決めること","テスト目的の達成度を何の数値で測るかを決め、測る周期を定めること","どのテストレベルを実施し、それぞれで何を確かめるかを決めること","機能面と非機能面のどちらに重みを置くかなど、テストタイプの組み合わせを決めること"],"answer":[1],"explanation":{"signals":"効くのは、シラバスがテストアプローチの重要な決定事項として名前を挙げているかどうか、この一点だけである。新しい基幹システムであることも、プロジェクトテスト戦略の草案を書いている段階であることも、場面を作っているだけで答えを変えない。4つの記述はどれもテスト計画の場で実際に決める事柄なので、実務として正しいかどうかでは見分けがつかない。","why":"答えは、テスト目的の達成度を何の数値で測るかを決め、測る周期を定めることである。これは実施の仕方ではなく測り方の取り決めで、シラバス 1.4.1 が重要な決定事項として並べた中に名前が無い。原文が挙げるのは静的テスト、動的テスト、その他のテスト実践、テストレベル、テストタイプ、テスト技法の選択であり、0.11 もテストアプローチを、テストタスクの実装方法、すなわち静的テストと動的テストのためのテストレベル・テストタイプ・テスト技法・テスト実践の選択と組み合わせだと定義している。静的テストと動的テストの使い分け、テストレベルの選択、テストタイプの組み合わせは、どれもこの並びにそのまま載っている。いっぽうテストメトリクスについて原文が述べているのは 2.1.1 のほうで、テスト計画においてプロジェクトテスト戦略からテスト目的に合うものを定義する、という位置づけである。決める場がテストアプローチを組み立てるところではないので、測る数値と周期の取り決めが外れる。","distractors":["静的テストと動的テストをそれぞれどこまで用いるかという決定は、1.4.1 が重要な決定事項として並べた先頭にあり、0.11 の定義も、静的テストと動的テストのための選択と組み合わせという形でこれを含んでいる。テスト技法の選択と同じ層の決定なのだが、原文の並びを思い出せないと、どこまで使うかという程度の加減の話に見えてしまい、実施の組み合わせを決める残りの記述と区別がつかなくなる。",null,"どのテストレベルを実施し、それぞれで何を確かめるかという決定は、0.11 の定義にも 1.4.1 の並びにも明記されている。どの工程を置くかという段取りの話に見えるため、実施の仕方そのものとは別だと感じて残しやすいが、原文はテストレベル・テストタイプ・テスト技法の適切な選択と組み合わせがテストの有効性と効率性に大きな影響を与えると述べ、これをテストアプローチの選択の中心に置いている。","機能面と非機能面のどちらに重みを置くかというテストタイプの組み合わせの決定も、0.11 の定義と 1.4.1 の並びの双方にある。品質のどの面を重く見るかという言い方が品質目標の議論に聞こえるので、達成度を測る取り決めと同じ側に寄せてしまいやすいが、ここで決めているのは実施するテストの組み合わせそのものである。"],"flip":[null,null,null,null],"flipNote":{"1":"静的テストと動的テストをどこまで用いるかは、1.4.1 が重要な決定事項として並べた先頭にある。これを外れる側に回すには、問いをテストアプローチからプロジェクトテスト戦略やテスト計画書という外側の枠に広げるほかないが、それは与件を1つ変えたのではなく、問いそのものを別のものに取り替えたことになる。しかもその枠には、テストレベルの選択もテストタイプの組み合わせも、さらには達成度を測る数値と周期の取り決めまで同時に入ってくるので、外れるものが残らない。","3":"どのテストレベルを実施するかの決定は、0.11 のテストアプローチの定義と 1.4.1 の並びの双方に明記されている。実施するテストレベルが1つに固定された場面を置いても、決める余地が消えるだけで、この記述がテストアプローチの外に移るわけではない。テストアプローチが何を含むかを問うている限り、外れる側に回るのは測る数値と周期の取り決めのほうである。","4":"テストタイプの選択も同じ並びの中にある。1.4.1 は、テストレベル、テストタイプ、テスト技法を選択し組み合わせることがテストの効率性と有効性に大きく影響するため、効果的なプロジェクトテスト戦略にとって非常に重要であると述べている。そのため効率性と有効性への効き方を問う形に変えても、この記述はテストレベルの選択や静的テストと動的テストの使い分けと並んで立ったままになる。どれか1つだけを外れる側に置ける条件が、原文にもこの場面にも無い。"},"quote":"重要な決定事項には、静的テスト、動的テスト、その他のテスト実践（例えば、手動テスト、バックツーバックテスト）、テストレベル、テストタイプ、テスト技法の選択を含む。","ref":"1.4.1 / 0.11","misconception":"テストアプローチを「テスト計画で決めること全般」と広く取り、メトリクスや終了基準のような測る側の取り決めまでテストアプローチの構成要素だと考えている"},"meta":{"concept":"テストアプローチの選択","distractorIntent":["静的テストと動的テストの使い分けを戦略側の決定だと思う","テストレベルの選択を工程設計であってアプローチ外だと思う","テストタイプの重み付けを品質目標の議論とみなす"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-09"]}},{"id":"q-1.4.1-A-2","lo":"TM-1.4.1","cluster":"1.4.1-B","variant":1,"chapter":1,"section":"1.4","k":2,"points":1,"type":"single","minutes":1,"scenario":"全社の組織的テスト戦略には自動化とレビューの進め方が定めてあるが、今回の通信機器向け開発で必要になる性能面の扱いは書かれていない。","question":"このプロジェクトのテストマネジメントの進め方として最も適切なものはどれか。1つ選べ。","choices":["定めてある部分はそのまま適用し、書かれていない部分は関係者とともに明確にして、このプロジェクトの組み合わせを決める","今回の事情に合うように全社向けの取り決めの側を改訂し、改訂したものを本プロジェクトにも適用していく","自動化とレビューは全社の取り決めどおりに進め、書かれていない性能面は、各テストレベルの担当者がテスト設計の段階で技法を選ぶ中で決める","性能面の扱いが定まっていないことをプロジェクトのリスクとしてテスト計画に記録し、リスクの大きさに見合う範囲で性能テストを組み込んで進める"],"answer":[0],"explanation":{"signals":"効くのは、全社の組織的テスト戦略がすでに存在していることと、今回必要になる性能面の扱いがそこに書かれていないことである。前者は上位の取り決めを入力として扱うのかどうかを、後者は書かれていない領域が出てきたときに誰がどこで決めるのかを問うている。通信機器向けという領域は場面を作っているだけで、答えを変えない。","why":"取るべきは、定めてある自動化とレビューはそのまま適用し、書かれていない性能面は関係者とともに明確にしたうえで、このプロジェクトの組み合わせを決める進め方である。そう決まるのは、シラバスが 1.4 の冒頭で、本シラバスでは組織的テスト戦略は与えられたものとして扱うと明記し、続けて、組織的テスト戦略が存在しない場合や必要とされる側面をカバーしていない場合には、テストマネジメントが関連するステークホルダーとともに不足している詳細を明確にするよう努めなければならない、と定めているからである。1.2 の冒頭も、テストマネージャーの仕事は確立したテスト戦略を適用しテスト技法を選択することであり、それらを開発することではないと述べている。つまり上位の枠は書き換える対象ではなく入力であって、書かれていない部分を関係者とともに埋め、そのうえで 1.4.1 が重要な決定事項として挙げるテストレベル・テストタイプ・テスト技法の組み合わせをこのプロジェクトのために決める、という順序になる。","distractors":[null,"全社向けの取り決めのほうを今回の事情に合わせて改訂するのは、組織としては筋の通った動きに見える。しかしシラバスは組織的テスト戦略を与えられたものとして扱うと明示し、その開発とメンテナンスは ISO/IEC/IEEE 29119-3 や ISTQB Expert Level - Test Management、ISTQB Certified Tester Agile Test Leadership at Scale のシラバスのコンテキストで検討するとしている。プロジェクト側の判断で組織レベルの成果物を書き換えることは、本シラバスがテストマネージャーに置いている役割の外にある。","上位の取り決めは守ったうえで、技法の選択は各テストレベルの担当者に任せ、テスト設計の段階で決めるという分担は、現場では珍しくない。しかし 1.4.1 はテストレベル、テストタイプ、テスト技法を選択し組み合わせることをプロジェクトテスト戦略の重要な決定事項として挙げ、1.2 の冒頭も、確立したテスト戦略を適用しテスト技法を選択することをテストマネージャーの仕事だと述べている。決める場所がテスト設計の段階まで下がっているうえ、書かれていない性能面を関係者とともに明確にする段が丸ごと抜けている。","定まっていないことを明示し、リスクの大きさに応じて厚みを決めるのは、計画づくりの手順としては筋が通って見える。しかしここで足りていないのは製品の危険度の見積りではなく、上位の取り決めが触れていない領域についての取り決めそのものである。シラバスは、必要とされる側面をカバーしていない場合に関連するステークホルダーとともに不足している詳細を明確にするよう求めており、記録する先をテスト計画のリスクに替えても、その明確化は行われないままになる。"],"flip":[null,null,null,null],"flipNote":{"2":"組織的テスト戦略の開発とメンテナンスを、シラバスは ISO/IEC/IEEE 29119-3 や Expert Level のテストマネジメント、大規模アジャイルのテストリーダーシップのシラバスのコンテキストで検討するとしている。その立場に立てば、全社の取り決めを改訂する行動も筋が通る。ただしその場合でも、定めてある部分を適用し、書かれていない部分を関係者とともに明確にしてこのプロジェクトの組み合わせを決めるという進め方は正しいまま残るため、改訂を先に置く進め方が単独で最も適切になることはない。","3":"この記述が外れている箇所は1つではない。プロジェクトテスト戦略の重要な決定事項であるテストレベル・テストタイプ・テスト技法の選択が、テスト設計の段階まで下りている点と、書かれていない性能面を関係者とともに明確にする段が無い点である。前者だけを直しても後者が同じ理由で退け、後者を足すと、定めてある部分を適用して不足を明確にする進め方そのものになる。さらに、全社の取り決めが性能面まで定めている場面に変えると、この記述が寄りかかっている「書かれていない性能面」自体が場面から消えてしまう。","4":"性能面が今回のスコープの外にある場面に変えれば、定まっていないことをリスクとして記録するという前半は成り立つが、同じ条件が後半の「リスクの大きさに見合う範囲で性能テストを組み込んで進める」と噛み合わなくなる。加えて、必要とされる側面をカバーしていない場合に関連するステークホルダーとともに不足している詳細を明確にするという 1.4 冒頭の求めは、記録先をテスト計画のリスクに替えても満たされないままである。"},"quote":"組織的テスト戦略が存在しない場合や、必要とされる側面をカバーしていない場合、テストマネジメントは、関連するステークホルダーとともに不足している詳細を明確にするよう努めなければならない。","ref":"1.4 / 1.2","misconception":"組織的テスト戦略の不足を、プロジェクト側での改訂や、設計時の技法選択、リスクとしての記録で埋められると考えており、上位の枠は与件であり、不足はステークホルダーとともに明確にするという役割分担を捉えていない"},"meta":{"concept":"テストアプローチの選択","distractorIntent":["組織レベルの成果物をプロジェクト側で改訂してよいと考える","アプローチの選択を、テスト設計時の技法選びの層に降ろす","取り決めの不足を、テスト計画にリスクとして記録すれば扱えると考える"],"distractorTypes":["D1","D8","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-10","MP-09"]}},{"id":"q-1.4.2-A-1","lo":"TM-1.4.2","cluster":"1.4.2-A","variant":1,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは商用車の電動パーキングブレーキの制御ソフトのテストマネージャーである。開発はV字モデルで、機能安全の規格への適合を社外の審査で示す。ハードウェアと一部のソフトウェアは3社のサプライヤから調達し、残りは自社で開発する。納入物にはソースコードと設計書が含まれ、中身を自社で見られる。\n\n組織のテスト方針は、テストレベルごとの検証の記録と、要件から個々のテストまでの対応づけを全社に求める。コンポーネント単位の実行は開発用の模擬環境で行えるが、結合から先は実際のハードウェアがつながるため台上の設備でしか行えない。設備は1式で他の車種が通年で押さえ、審査まで6週間しか取れず、増設も借用も間に合わない。この枠は、3社と自社がつながった状態でしか見られない項目でほぼ埋まる。3社の納入は審査の4か月前に終わり、模擬環境での作業は枠の前に収まる。\n\nただし、次の3点がある。\n\n・3社のうち2社はコンポーネント単位の検証の記録に消極的で、納入時の適合の宣言までだと回答している。契約は締結済みで提出を新たに義務づけられない。残る1社は記録を出すが、自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても使えない\n・経営層は、納期を1か月縮めるため形式的な静的解析の工程を省くことを検討している。審査機関は、納入分も含めたコード全体の静的解析と規約適合の証拠を、コンポーネントの段階でそろえて示すよう求めている\n・前回の審査では、不具合の分類が担当者ごとにばらつき、レビューの網羅の記録がないと指摘された","question":"この状況を分析したうえで、テストアプローチとして最も適切なものはどれか。1つ選べ。","choices":["記録を出す1社の分は提出された記録を受け入れの根拠とし、残る2社の分を自社で見る。静的解析は納入分について結合の前に終え、規約適合の証拠までそろえるが、コンポーネントテストは工数の山を避けて着手を台上の枠が始まる時期にそろえ、結合の確認と並行して行う。対応づけはどのレベルでも切らさず、レビューの網羅と不具合の分類の統一、根本原因の分析を行い、サプライヤの不具合報告にも自社の区分を当てる。","3社から納入されたコンポーネントは、いずれも受け入れの時点で自社が静的解析とコンポーネントテストを行い、結合を始める前に終えて記録に残す。台上の枠は、つないだときにしか現れない事象を見ることに充てる。対応づけは全テストレベルで保ち、形式的なレビューの網羅と、統一した区分による不具合の分類および根本原因の分析も行う。","記録の出る1社については提出された記録を受け入れの判断に用い、残る2社の分は自社が静的解析とコンポーネントテストを行って結合の前に終える。静的解析は、安全上の影響が大きいと分類した部位に絞って納期を1か月縮める案に応じ、空いた工数は台上での確認の厚みに回す。対応づけはテストレベルを問わず保ち、レビューの網羅も記録し、不具合の分類の統一と根本原因の分析も行う。","提出される記録がある1社については自社での実施を省き、納入時の適合の宣言までだとする2社の分は受け入れの時点で静的解析とコンポーネントテストを済ませ、結合に入る前に終える。結合の確認は開発用の模擬環境で一通り前倒しして済ませ、台上の6週間は最終の確認に絞る。対応づけはユニットから受け入れまで切らさず、レビューの網羅を記録し、不具合の分類をそろえて根本原因まで分析する。"],"answer":[1],"explanation":{"signals":"判断に効くのは、末尾の3点の箇条書きと、その前に置かれた記録と資源の条件である。納入物にソースコードと設計書が含まれ、中身を自社で見られることは、納入されたコンポーネントに自社が静的解析とコンポーネントテストを行う道が開いていることを意味する。コンポーネント単位の実行は開発用の模擬環境で行えるが、実際のハードウェアがつながる結合から先は台上の設備でしか行えず、その台上は1式で6週間しか取れないうえ、3社と自社がつながった状態でしか見られない項目で枠がほぼ埋まる。3社の納入は審査の4か月前に終わり、模擬環境での作業は枠の前に収まる。組織のテスト方針は、テストレベルごとの検証の記録と、要件から個々のテストまでの対応づけを全社に求めており、プロジェクトの側で外せない。箇条書きの1点目は、2社が記録を出さず契約でも新たに義務づけられないことに加え、記録を出す残る1社の記録も自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても使えないと述べる。2点目は、経営層の省略案に対して、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠をコンポーネントの段階でそろえて示すよう求めていることを置く。3点目の前回の審査の指摘、すなわち不具合の分類のばらつきとレビューの網羅の記録の欠落は、答えに欠かせない要素だが、4案とも網羅の記録・分類の統一・根本原因の分析を載せているので、案の間で差は付かない。対応づけをテストレベルをまたいで保つ点も同じく4案に共通する。一方、短縮の幅が1か月であることと、ハードウェアが混在すること自体は、どの案の当否も決めない。","why":"採るべきは、3社から納入されたコンポーネントをいずれも受け入れの時点で自社が静的解析とコンポーネントテストにかけ、結合を始める前に終えて記録に残し、台上の枠はつないだときにしか現れない事象を見ることに充てる案である。これを選ばせているのは、3社のどこからも方針が求める形の検証の記録と対応づけが手に入らないこと、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠をコンポーネントの段階でそろえて示すよう求めていること、そして結合から先が台上でしか行えないのにその台上は1式で6週間しかなく、つながった状態でしか見られない項目でほぼ埋まることである。\n\n記録から見る。2社はコンポーネント単位の検証の記録に消極的で、契約は締結済みのため新たに義務づけられない。記録を出す残る1社も、自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても使えない。組織のテスト方針はテストレベルごとの検証の記録と要件から個々のテストまでの対応づけを全社に求めているので、この穴は自社で埋めるほかない。埋める手立てはシナリオが先に置いている ── 納入物にはソースコードと設計書が含まれ、中身を自社で見られる。\n\n静的解析は、審査機関の求めが対象の範囲と示す時点の両方を縛っている。納入分も含めたコード全体で、しかもコンポーネントの段階でそろえて示すことを求めているのだから、対象を絞ることも、後段に回すこともできない。シラバスは、適切なテストアプローチを選択するために分析しなければならない要因の1つにドメインを挙げ、ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があると述べている。機能安全の規格への適合を社外の審査で示すこのプロジェクトでは、その規制の側の求めが審査機関の要求として具体的に書かれており、経営層の検討はこれに勝てない。\n\n台上の枠は、シラバスがテストリソースの可用性に関するあらゆる制約として考慮を求めているものにあたる。ここでは、結合から先が台上でしかできない一方、その1式6週間がつながった状態でしか見られない項目でほぼ埋まるという形で現れる。だから、模擬環境で先に取り除ける欠陥をこの枠に流し込まない配分 ── 静的解析とコンポーネントテストを結合の前に終え、枠はつないだときにしか現れない事象に充てる配分 ── が要る。記録を出す1社の分まで自社で見る工数はこの案が引き受けるコストだが、3社の納入は審査の4か月前に終わり、模擬環境での作業は枠の前に収まるので、実行できる。受け入れの根拠を何に置いたかが自社の記録として残るため、審査の場でもそのまま説明できる。\n\n前回の審査で指摘された不具合の分類のばらつきとレビューの網羅の記録の欠落には、網羅の記録と、統一した区分による分類および根本原因の分析が応える。ここは4案が共通して載せている部分で、案を分けるのは上の3つのほうである。シラバスは、組織的テスト戦略、プロジェクトコンテキスト、テストに関連するその他の要因や制約を満たす最適なアプローチとして、テスト技法、テストレベル、テストタイプの組み合わせを決定しなければならないとしており、この案はその組み合わせにあたる。","distractors":["この案がつまずくのは、記録を出す1社の分を提出された記録で済ませる点と、コンポーネントテストの着手を台上の枠が始まる時期にそろえる点である。前者について本文は、その1社の記録が自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても使えないと述べており、この配分では1社ぶんの検証の記録と対応づけが埋まらない。後者では、模擬環境で先に取り除けたはずの欠陥が、1式で6週間しかなく、つながった状態でしか見られない項目でほぼ埋まる枠の中で、3社と自社がつながった状態から切り分けられることになる。シラバスはテストツール、テストインフラ、技術、開発環境などテストリソースの可用性に関するあらゆる制約を考慮しなければならないとしており、希少な設備の枠を前段で片づく作業に使うこの配分は、その制約に応えていない。静的解析を納入分について結合の前に終えて規約適合の証拠までそろえ、対応づけとレビューの網羅の記録、不具合の分類の統一と根本原因の分析まで覆い、さらにサプライヤの不具合報告にも自社の区分を当てる上乗せまである点は、自社の工数を記録の出ない2社に集中させる配分として最も効率よく見えるところである。",null,"この案がつまずくのは、静的解析を安全上の影響が大きいと分類した部位に絞り、納期を1か月縮める案に応じる点である。本文は、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠を、コンポーネントの段階でそろえて示すよう求めていると述べており、絞った範囲の証拠ではこの求めに届かない。シラバスも、ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるとしており、機能安全の規格への適合を社外の審査で示す立場では、日程を理由に示す証拠の範囲を狭める交換は成り立たない。加えてこの案も、記録の出る1社の記録を受け入れの判断に用いるが、その記録は方針が求める形では使えない。日程の短縮に応じて空いた工数を台上での確認の厚みに回す交換は、限られた資源の使い方として現場では通りやすく、残る2社の分は結合の前に自社で見ており、対応づけ、レビューの網羅の記録、不具合の分類の統一と根本原因の分析も覆っている。","この案がつまずくのは、結合の確認を開発用の模擬環境で一通り前倒しして済ませる点と、提出される記録がある1社について自社での実施を省く点である。本文は、コンポーネント単位の実行は開発用の模擬環境で行えるが、結合から先は実際のハードウェアがつながるため台上の設備でしか行えないと述べている。前倒しは、この1文が正面から否定した前提の上に立っており、そのぶんは実行できない。自社での実施を省いた1社については、その記録が方針の求める検証の記録としても対応づけとしても使えないため、記録の穴がそのまま残る。希少な台上の6週間を最終の確認に絞るという組み立ては、限られた設備の使い方として最も筋が通って見え、納入時の適合の宣言までだとする2社の分を結合の前に自社で見る点、対応づけをユニットから受け入れまで切らさない点、レビューの網羅の記録と不具合の分類の統一も覆っている。"],"flip":[null,null,null,null],"flipNote":{"1":"この案を退ける条件は独立に2つある。記録を出す1社の分を提出された記録で済ませる点は、その記録が自社の要件と結びつかない独自の項目立てで方針の求める形では使えないという本文の1文が退ける。コンポーネントテストの着手を台上の枠が始まる時期にそろえる点は、台上が1式で6週間しか取れず、つながった状態でしか見られない項目でほぼ埋まるという条件が退ける。1社の記録が方針の求める形で出てくる世界に変えても、模擬環境で済む作業を希少な枠に持ち込む配分はそのまま残り、逆に枠が潤沢な世界に変えても、記録の穴は埋まらない。条件を1つ動かしてこの案を採らせる書き方はない。","3":"この案を退ける条件も独立に2つある。静的解析を安全上の影響が大きいと分類した部位に絞る点は、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠をコンポーネントの段階で求めるという1文が退け、記録を出す1社の記録を受け入れの判断に用いる点は、その記録が方針の求める検証の記録としても対応づけとしても使えないという1文が退ける。求められる証拠の範囲が狭い世界に変えても記録の穴は残り、記録が使える世界に変えても、示す証拠の範囲が審査機関の求めに届かないままである。","4":"この案を退ける条件も独立に2つある。結合の確認を開発用の模擬環境で前倒しして済ませる点は、実際のハードウェアがつながる結合から先は台上の設備でしか行えないという1文が退け、記録がある1社について自社での実施を省く点は、その記録が方針の求める形では使えないという1文が退ける。模擬環境で見られる範囲が広がる世界に変えても、省いた1社ぶんの検証の記録と対応づけは埋まらず、その1社の記録が使える世界に変えても、結合の確認を模擬環境に移す前提は立たない。"},"quote":"適切なテストアプローチを選択するためには、通常以下の要因を分析しなければならない：……ドメイン：プロダクトが作成または修正されるドメイン。ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性がある。……テストリソース：プロジェクトで使用するテストツール、テストインフラ、技術、開発環境、また利用可能なテスト要員とそのスキルなど、テストリソースの可用性に関するあらゆる制約を考慮しなければならない。……テストマネージャーは、組織的テスト戦略、プロジェクトコンテキスト、テストに関連するその他の要因や制約を満たす最適なアプローチとして、テスト技法、テストレベル、テストタイプの組み合わせを決定しなければならない。","ref":"1.4.2","misconception":"手元にある記録や設備をそのまま使えるものとして数えてしまい、その記録が方針の求める形になっているか、その設備で行える範囲はどこまでかを、書かれた条件と1つずつ突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["記録の出る1社の分を提出記録で済ませたうえで、模擬環境で行えるコンポーネントテストの着手を、1式で6週間しかない台上の枠にそろえる（前段で取れる欠陥を希少な枠に持ち込む）","記録の出る1社の分を提出記録で済ませたうえで、審査機関がコード全体に求めている静的解析を、影響の大きい部位に絞って日程の短縮と交換する","記録の出る1社の分の自社実施を省いたうえで、結合の確認を模擬環境で前倒しできるという、本文が否定した前提に立つ"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-32","MP-02"]}},{"id":"q-1.4.2-A-2","lo":"TM-1.4.2","cluster":"1.4.2-B","variant":1,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは資金移動業の会社で送金アプリのテストマネージャーである。開発は3週間のスプリントで進め、サービスの拡張には当局の審査と監査人の確認を受ける。\n\n組織のコンテキスト\n・テストの方針は、進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くことを求める\n・要件とテストと実行結果の対応づけを記録に残し、当局や監査人の照会に速やかに提示できる状態に置く\n・自動化の度合いを高めることをゴールに掲げるが、自動テストを保守できる要員は2名で成熟度は中程度である\n・品質のゴールは不具合の検出の効率と、不正な送金を防ぐセキュリティに置く\n\nプロジェクトのコンテキスト\n・スプリントごとにリリース候補を作り、そのたびに送金の主要な経路を確認する。審査まで11回ある\n・予算は追加できず要員も増やせない。審査は8か月後で日程を動かせない\n・外部の決済ネットワーク2社と接続する。先方は模擬応答を返す窓口を常時提供するが、実際の接続で流せるのは調整した期間に限られる。端から端までの通しは応答の型の組み合わせが多く、自動化しても保守の負担が大きい\n・対象の端末とOSの版は多岐にわたり、担当者6名のうち3名はこの領域が初めてである","question":"組織とプロジェクトのコンテキストを分析したとき、採るべきテストアプローチはどれか。1つ選べ。","choices":["ユニットから受け入れまでの4つのテストレベルを置き、それぞれに開始と終了の条件を定める。ユニットと統合は開発者と組み、不正な送金に関わる経路から順に、2名で保守できる範囲で自動化する。経路の確認は各テストレベルに割り振り、端から端まで一度に流すのは実接続が使える時期に限る。対応づけはスプリントのたびに更新し、照会に個々のテストと実行結果をそのまま示せる形で保つ。","4つのテストレベルを置き、レベルごとに開始と終了の条件も定める。実行は手順を書いたチェックリストによる手動の確認を主軸に据え、自動化は要員を増やせた段階で不正な送金に関わる経路から広げる。リリース候補ごとに、先方の模擬応答を使って端から端まで通しで流す。対応づけは要件とテストと実行結果を結んだままスプリントごとに更新し、当局や監査人の照会に速やかに提示できる状態に置く。","テストレベルは分けず、スプリントごとにリリース候補が受け入れの条件を満たすかを確認し、足りない分を探索的テストで補う。自動化は回帰の確認に絞り、不正な送金に関わる経路には探索的テストの時間を多めに割く。毎スプリントのリリース候補では、先方の模擬応答を相手に端から端まで通す。対応づけの更新はスプリントの終わりに行い、当局や監査人の照会にはそのつど示せるようにする。","4つのテストレベルと、レベルごとの開始と終了の条件を置く。自動化は不正な送金に関わる経路を中心に、2名で保守できる範囲にとどめる。リリース候補を作るたびに、先方の模擬応答で端から端までの通しを流し、実接続の確認は調整できた期間にまとめて行う。対応づけの更新は審査に向けた節目でまとめて行い、審査の時点で当局や監査人の照会に示せる形に整える。"],"answer":[0],"explanation":{"signals":"効くのは組織のコンテキストの4項目すべてと、プロジェクトのコンテキストの前の3項目である。テストレベルの明示とレベルごとの開始・終了の条件、および照会に速やかに提示できる状態に置く対応づけの記録は、開発の進め方によらず全社に求められる与件である。自動化はゴールでありながら、保守できる要員は2名で成熟度は中程度にとどまり、予算も要員も増やせない。品質のゴールは不具合の検出の効率と、不正な送金を防ぐセキュリティに置かれている。送金の主要な経路を確認する回はスプリントごとに発生して審査まで11回ある。接続先については、先方が模擬応答を返す窓口を常時提供する一方、実際の接続で流せるのは調整した期間に限られ、しかも端から端までの通しは応答の型の組み合わせが多く、自動化しても保守の負担が大きいと置かれている。つまり、模擬応答があるかどうかではなく、11回ぶんの通しを、手動で流すにせよ自動化するにせよ、増やせない要員で負えるかが論点である。最後の1項目、すなわち端末とOSの版の多さと、担当者6名のうち3名がこの領域に初めて携わることは、どの案の当否も決めないノイズである。","why":"採るべきは、ユニットから受け入れまでの4つのテストレベルを置いて開始と終了の条件を定めたうえで、経路の確認を各テストレベルに割り振り、端から端まで一度に流すのは実接続が使える時期に限り、自動化は不正な送金に関わる経路から順に2名で保守できる範囲にとどめ、対応づけをスプリントのたびに更新する案である。これを選ばせているのは、テストレベルの明示とレベルごとの開始・終了の条件が進め方によらず求められていること、端から端までの通しが自動化しても保守の負担が大きいのに確認の回が審査まで11回あり、予算も要員も増やせないこと、そして対応づけを当局や監査人の照会に速やかに提示できる状態に置くよう求められていることである。\n\nまず、3週間のスプリントで進めていること自体は、テストレベルを置かない理由にならない。シラバスはプロジェクトに使用するソフトウェア開発ライフサイクルモデルを分析すべき要因に挙げているが、それは並ぶ要因の1つにすぎない。ドメインの要因は、ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるというものであり、組織のゴールの要因は、テスト自動化の度合いを高める必要性や、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含み、これらによって適応すべきテストレベルやテストタイプを決定することがあるというものである。当局の審査と監査人の確認を受けるこの会社では、テストの方針が進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くよう求めており、スプリントの側から下ろせない。\n\nもっとも、4つのテストレベルを置くだけでは決まらない。分かれ目は、送金の主要な経路の確認をどこで行うかと、対応づけをいつ照会に出せる状態にするかである。確認の回はスプリントごとに発生して審査まで11回あり、端から端までの通しは応答の型の組み合わせが多く、自動化しても保守の負担が大きい。自動テストを保守できる要員は2名で成熟度は中程度、予算も要員も増やせない。だから通しを毎回積み上げる形は、自動化すれば2名で保守できる範囲を超え、手作業で流せば増やせない人手が11回とも繰り返すことになる。どちらに振っても増やせない資源を食うので、確認を各テストレベルに配分し、端から端までの通しは実際の接続で流せる調整した期間に合わせることになる。シラバスも、他のシステムとのインターフェースを分析すべき要因に挙げ、システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠であると述べている。外部の決済ネットワーク2社とつなぐこの案件で問われているのも、先方の窓口の都合を織り込んだうえで確認をどのテストレベルに置くかである。\n\n残るのは、自動化を何から始めるかと記録である。品質のゴールが不具合の検出の効率と不正な送金を防ぐセキュリティに置かれているので、2名で保守できる範囲の自動化は不正な送金に関わる経路から順に当てる。対応づけはスプリントのたびに更新して個々のテストと実行結果をそのまま示せる形で保ち、当局や監査人の照会に速やかに応えられる状態を常に保つ。","distractors":[null,"この案がつまずくのは、実行の主軸を手順を書いたチェックリストによる手動の確認に据え、自動化を要員を増やせた段階に回す点である。本文は予算は追加できず要員も増やせないと述べているので、増員を待つという前提そのものが立たず、組織が掲げる自動化の度合いを高めるというゴールに近づかない。しかも送金の主要な経路を確認する回はスプリントごとに発生して審査まで11回あり、手動の主軸はその11回を人手で繰り返す形になる。リリース候補ごとに先方の模擬応答で端から端まで通す点も同じことで、応答の型の組み合わせが多い確認を、増やせない担い手が11回とも人手で流すことになり、不具合の検出の効率という品質のゴールから遠ざかる。テストレベルと開始・終了の条件を置き、対応づけを要件とテストと実行結果を結んだままスプリントごとに更新して照会に出せる状態にし、模擬応答を使った通しの確認まで計画に入れている点は必要な項目に一通り答えており、自動テストを保守できる要員が限られることを理由に手動を主軸に置く判断も、現場では筋が通って見える。","この案がつまずくのは、テストレベルを分けない点である。組織のテストの方針は、進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くことを求めており、受け入れの条件を満たすかの確認と探索的テストで代えるこの案はそこに応えていない。反復型の開発で広く使われている進め方を、ドメインと組織の方針が課す条件より前に置いてしまっている。さらに、本文が自動化しても保守の負担が大きいとする端から端までの通しをリリース候補ごとに流す形は、確認の回が11回あり要員を増やせない条件のもとで、その確認の手間を回数ぶん積み上げる。スプリントごとにリリース候補が受け入れの条件を満たすかを確認し、足りない分を探索的テストで補う進め方は反復型では妥当な形であり、対応づけをスプリントの終わりに更新する点も満たしている。","この案がつまずくのは、対応づけの更新を審査に向けた節目にまとめる点である。組織の方針は、対応づけを記録に残し、当局や監査人の照会に速やかに提示できる状態に置くことを求めており、節目までその状態が空く計画はこれを満たさない。照会は審査の時点にだけ来るとは書かれていない。加えて、本文が自動化しても保守の負担が大きいとする端から端までの通しをリリース候補ごとに流す形は、確認の回が11回あり予算も要員も増やせない条件のもとで、その確認の手間を回数ぶん積み上げる。ただしこの案は自動化を不正な送金に関わる経路を中心に2名で保守できる範囲にとどめると自ら限っており、リリース候補のたびに流す模擬応答での通しは、その自動テストの保守の枠の外で回る作業である。退ける決め手は、記録をいつ照会に出せる状態にするかにある。4つのテストレベルと開始・終了の条件を置き、自動化を保守できる範囲にとどめ、実接続の確認を調整できた期間にまとめる点は条件に沿っており、更新をまとめて行うのは限られた要員の使い方として現場では通りやすい。"],"flip":[null,null,null,null],"flipNote":{"2":"この案を退けているのは、実行の主軸を手動の確認に置き、自動化を要員を増やせた段階に回すという一点である。増員は本文が正面から否定しており、その主軸のままでは、送金の主要な経路の確認も、リリース候補ごとの端から端までの通しも、審査までの11回を人手で繰り返すことになる。要員を増やせる世界に変えても、確認を各テストレベルに割り振って通しを実接続の時期に寄せる案はどの条件にも触れずに成り立ったままなので、この案がそれに代わって選ばれることにはならない。","3":"この案を退けているのは、テストレベルを分けないという一点である。進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くことは組織のテストの方針が求めており、受け入れの条件を満たすかの確認と探索的テストで代えるこの案は、そこに応えていない。では方針がテストレベルの置き方をプロジェクトに委ねる世界に変えればこの案が選ばれるかというと、そうはならない。確認を各テストレベルに割り振り、端から端までの通しを実際の接続が使える時期に寄せる案は、その求めに寄りかかって立っているわけではないので、条件を当てても成り立ったままである。しかもこの案は毎スプリントのリリース候補で通しを流すため、本文が自動化しても保守の負担が大きいとする確認を審査までに11回重ねることになり、予算も要員も増やせない条件のもとで、その案より前に出る理由が無い。","4":"この案を退けているのは、対応づけの更新を審査に向けた節目にまとめるという一点である。組織の方針は対応づけを記録に残し、当局や監査人の照会に速やかに提示できる状態に置くことを求めており、節目と節目のあいだその状態が空く計画はこれを満たさない。では照会が審査の時点にまとめて来る世界に変えればこの案が選ばれるかというと、そうはならない。この案が置く4つのテストレベルと開始・終了の条件、不正な送金に関わる経路を中心に2名で保守できる範囲にとどめる自動化、実接続の確認を調整できた期間に行う点は、いずれも採るべき案と重なっている。条件を当てても埋まるのはこの案の欠けだけで、対応づけをスプリントのたびに更新して照会にそのまま出せる形に保つ案が退けられるわけではない。しかもこの案はリリース候補を作るたびに端から端までの通しを流すため、本文が自動化しても保守の負担が大きいとする確認を審査までに11回重ねることになる。その通しは、この案が自ら2名で保守できる範囲にとどめた自動化の枠の外で回るので、増やせない人手がその回数ぶんを繰り返す。照会の時期を動かしても、端から端まで一度に流すのを実接続が使える時期に限る案より前に出る理由は無い。"},"quote":"組織のゴールと包括的な品質の特徴：組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含む。これらによって、適応すべきテストレベルやテストタイプを決定することがある。……他のシステムとのインターフェース：システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠である。","ref":"1.4.2","misconception":"反復型の開発では軽くしてよいという一般的な傾向を、ドメインと組織の方針が課す条件より前に置き、さらに、端から端まで通しで確認する回を増やすほど手厚いと考えて、その負担を審査までに何回、何人で負うのかまでは突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["必要な項目には一通り答えるが、手動のチェックリストを主軸に据え、自動化を増員の後に回す（繰り返しの回数と、増やせない要員に合わない）","反復型の一般則に従いテストレベルを明示せず、受け入れの条件と探索的テストで代える","正答と同じ範囲を覆うが、対応づけの更新を審査の節目にまとめ、保守の負担が大きい通しの確認をリリース候補ごとに積み上げる"],"distractorTypes":["D3","D2","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-11","MP-07"]}},{"id":"q-1.4.2-B-2","lo":"TM-1.4.2","cluster":"1.4.2-B","variant":2,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは医薬品メーカーで、錠剤の製造ラインを動かす製造管理システムを刷新する案件のテストマネージャーである。開発は2週間の反復で進め、稼働の前に当局の査察と、製造を委託している製薬会社の監査を受ける。\n\n全社のテストの方針は、開発の進め方にかかわらず、どのテストレベルを置くかを文書に示し、レベルごとに入口と出口の基準を定めることを求めている。仕様と個々のテストと実行の結果のつながりを台帳に残し、査察官や監査人から求めがあればその場で示せる状態に保つことも、同じ方針が全社に課している。組織のゴールには自動テストの割合を高めることが入っているが、その自動テストを保守できる担当は3名で、社内の成熟度は中程度と評価されている。品質のゴールは、欠陥検出の効率と、投与量の指図を取り違えさせない安全性に置かれている。\n\n反復ごとに検証用の版を作り、そのたびに製造の指図から出荷の判定までの主要な流れを確かめる。査察までにその回は16回ある。予算は積み増せず、担当も増やせない。査察は9か月後で日付を動かせない。上流の受注のシステムと下流の倉庫の搬送設備につながり、どちらの相手も模擬の応答を返す窓口を常時使えるが、実際の設備につないで流せるのはラインを止める調整の期間だけである。指図から出荷の判定までを一続きに流す確認は、品目と工程の組み合わせが多く、自動化しても保守の手間が大きい。開発の拠点は国内2か所に分かれ、反復の計画の会議は映像でつないで行う。","question":"組織とプロジェクトの条件を分析したとき、採るべきテストアプローチはどれか。1つ選べ。","choices":["ユニットから受け入れまでの4つのテストレベルを置き、レベルごとに入口と出口の基準を定める。実行は手順書にそって人が確かめる形を中心に据え、自動化は担当を増やせた時点で投与量の指図に関わる流れから広げる。検証用の版を作るたびに、相手の模擬の応答を使って指図から出荷の判定までを一続きに流す。台帳は反復のたびに更新し、仕様と個々のテストと実行の結果をそのまま並べて、査察官や監査人の求めにその場で示せる状態に保つ。","テストレベルはユニットから受け入れまでの4つを置き、レベルごとに入口と出口の基準を定める。主要な流れの確かめは、テストレベルごとに割り当てる。指図から出荷の判定までを一続きに流すのは、実際の設備につなげる調整の期間に寄せる。自動化は投与量の指図に関わる流れから順に、3名で保守できる範囲にとどめる。台帳は反復のたびに更新し、個々のテストと実行の結果をそのまま読み取れる形に保つ。","台帳の更新は査察に向けた節目でまとめて行い、査察の時点で査察官や監査人に示せる形に整える。4つのテストレベルと、レベルごとの入口と出口の基準を置く。自動化は投与量の指図に関わる流れを中心に、3名で保守できる範囲にとどめる。検証用の版を作るたびに、相手の模擬の応答で指図から出荷の判定までを一続きに流し、実際の設備につなぐ確認は調整の期間にまとめて行う。","テストレベルの区分は設けず、反復ごとの検証用の版が受け入れの条件を満たすかを確かめ、足りない分を探索的テストで補う。自動化は退行の確認に絞り、投与量の指図に関わる流れには探索的テストの時間を厚く取る。検証用の版のたびに、相手の模擬の応答で指図から出荷の判定までを一続きに流す。台帳の更新は反復の終わりに行い、査察官や監査人の求めにはそのつど応じる。"],"answer":[1],"explanation":{"signals":"効くのは、全社のテストの方針が求める2つのこと、自動テストを保守できる担当の数、品質のゴール、そして反復の回数と接続の相手の都合である。方針は、開発の進め方にかかわらず、どのテストレベルを置くかを文書に示し、レベルごとに入口と出口の基準を定めることを求めている。同じ方針は、仕様と個々のテストと実行の結果のつながりを台帳に残し、査察官や監査人から求めがあればその場で示せる状態に保つことも課している。その自動テストを保守できる担当は3名で、社内の成熟度は中程度と評価されており、予算は積み増せず、担当も増やせない。品質のゴールは、欠陥検出の効率と、投与量の指図を取り違えさせない安全性に置かれている。反復ごとに検証用の版を作って主要な流れを確かめる回は、査察までにその回は16回ある。接続の相手については、模擬の応答を返す窓口が常時使える一方、実際の設備につないで流せるのはラインを止める調整の期間だけであり、しかも指図から出荷の判定までを一続きに流す確認は、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいと置かれている。つまり論点は、模擬の応答があるかどうかではなく、16回ぶんの通しを、増やせない担い手で負えるかである。開発の拠点が国内2か所に分かれ、反復の計画の会議を映像でつないで行うことは、どの案の当否も動かさないノイズである。","why":"答えは、ユニットから受け入れまでの4つのテストレベルを置いて入口と出口の基準を定めたうえで、主要な流れの確かめをテストレベルごとに割り当て、一続きの通しは実際の設備につなげる調整の期間に寄せ、自動化は投与量の指図に関わる流れから順に3名で保守できる範囲にとどめ、台帳を反復のたびに更新する案である。これを選ばせているのは、方針が進め方によらずテストレベルの文書化と基準を求めていること、一続きに流す確認が重いのに確かめる回が多く担い手を増やせないこと、そして記録をいつでも示せる状態に保つよう求められていることの3つである。\n\nまず、2週間の反復で進めていること自体は、テストレベルを置かない理由にならない。シラバスはプロジェクトに使用するソフトウェア開発ライフサイクルモデルを分析すべき要因に挙げているが、それは並ぶ要因の1つにすぎない。組織のゴールと包括的な品質の特徴についてシラバスが述べているのは、組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含むということであり、これらによって、適応すべきテストレベルやテストタイプを決定することがあるとしている。この会社では全社の方針が、どのテストレベルを置くかを文書に示し、レベルごとに入口と出口の基準を定めることを求めているのだから、反復の側から下ろせない。\n\nつぎに分かれ目になるのは、主要な流れの確認をどこで行うかである。本文は、指図から出荷の判定までを一続きに流す確認は、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいと置いている。しかも、査察までにその回は16回ある。その自動テストを保守できる担当は3名で、社内の成熟度は中程度と評価されているうえ、予算は積み増せず、担当も増やせない。だから通しを毎回積み上げる形は、自動化すれば3名で負える保守の範囲を超え、人手で流せば増やせない担い手が16回とも同じ作業を繰り返すことになる。どちらに振っても増やせない資源を食うので、確認を各テストレベルに配分し、一続きの通しは、実際の設備につないで流せるのはラインを止める調整の期間だけであるという枠のほうに寄せることになる。シラバスも、他のシステムとのインターフェースを分析すべき要因に挙げ、システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠であると述べている。\n\n残るのは、自動化を何から始めるかと記録である。品質のゴールは、欠陥検出の効率と、投与量の指図を取り違えさせない安全性に置かれているので、3名で保守できる範囲の自動化はその流れから順に当てる。記録については、仕様と個々のテストと実行の結果のつながりを台帳に残し、査察官や監査人から求めがあればその場で示せる状態に保つことも、同じ方針が全社に課している。だから台帳の更新は反復のたびに行い、個々のテストと実行の結果をそのまま読み取れる形に保つ。","distractors":["この案がつまずくのは、実行を手順書にそって人が確かめる形に据え、自動化を担当を増やせた時点に回す点である。本文は、予算は積み増せず、担当も増やせないと置いているので、増員を待つという前提そのものが立たず、組織のゴールに掲げた自動テストの割合を高めることにも近づかない。しかも主要な流れを確かめる回は、査察までにその回は16回あるのだから、人手を軸に置けばその回数ぶんを人が繰り返す。検証用の版を作るたびに模擬の応答で一続きに流す点も同じで、品目と工程の組み合わせが多い確認を、増やせない担い手が16回とも流すことになり、欠陥検出の効率という品質のゴールから遠ざかる。テストレベルと入口と出口の基準を置き、台帳を反復のたびに更新して求めにその場で応じられる状態にし、模擬の応答を使った通しまで計画に入れている点は必要な項目に一通り答えており、自動テストを保守できる担当が限られることを理由に人手を軸に置く判断も、現場では筋が通って見える。",null,"この案がつまずくのは、台帳の更新を査察に向けた節目にまとめる点である。方針は、仕様と個々のテストと実行の結果のつながりを台帳に残すだけでなく、査察官や監査人から求めがあればその場で示せる状態に保つことも、同じ方針が全社に課しており、節目と節目のあいだその状態が空く計画はこれを満たさない。求めが査察の時点にだけ来るとは本文に書かれていない。加えて、検証用の版を作るたびに一続きの通しを流す形は、査察までにその回は16回あり予算も担当も増やせない条件のもとで、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいとされた確認を回数ぶん積み上げる。ただしこの案は自動化を投与量の指図に関わる流れを中心に3名で保守できる範囲にとどめると自ら限っており、版のたびに流す模擬の応答での通しは、その自動テストの保守の枠の外で回る作業である。退ける決め手は、記録をいつ求めに応じられる状態にするかにある。4つのテストレベルと入口と出口の基準を置き、自動化を保守できる範囲にとどめ、実際の設備につなぐ確認を調整の期間にまとめる点は条件に沿っており、更新をまとめて行うのは限られた担い手の使い方として現場では通りやすい。","この案がつまずくのは、テストレベルの区分を設けない点である。全社のテストの方針は、開発の進め方にかかわらず、どのテストレベルを置くかを文書に示し、レベルごとに入口と出口の基準を定めることを求めており、検証用の版が受け入れの条件を満たすかの確かめと探索的テストで代えるこの案は、そこに応えていない。反復型の開発で広く使われている進め方を、組織の方針が課す条件より前に置いてしまっている。シラバスも、組織のゴールと包括的な品質の特徴について、これらによって、適応すべきテストレベルやテストタイプを決定することがあるとしている。さらに、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいとされた通しの確認を検証用の版のたびに流す形は、確かめる回が査察までに16回あり担当を増やせない条件のもとで、その手間を回数ぶん積み上げる。反復ごとの版が受け入れの条件を満たすかを確かめ、足りない分を探索的テストで補う進め方は反復型では妥当な形であり、台帳の更新を反復の終わりに行う点も、記録を残すという求めには一応答えている。"],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは、独立した2つの与件である。1つは増員の道で、本文は、予算は積み増せず、担当も増やせないと置いている。もう1つは繰り返しの数で、査察までにその回は16回ある。人手を軸に置くという組み立てを残したまま、担い手を増やせる世界に変えても、16回ぶんの通しを積み上げる形が、確認を各テストレベルに割り振って通しを調整の期間に寄せる案より前に出る理由にはならない。逆に確かめる回が数回で済む世界に変えても、増員を待つあいだ自動化が進まないことは残る。だから条件を1つ動かしてこの案を採らせることはできない。","3":"この案を退けているのは、記録の求めと通しの重さの2つである。方針は、査察官や監査人から求めがあればその場で示せる状態に保つことも、同じ方針が全社に課しているとしており、節目にまとめる更新ではその状態が空く。さらに、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいとされた通しを、この案は版のたびに流す。求めが査察の時点にまとめて来る世界に変えても、後者は残る。しかもこの案が置くテストレベルと入口と出口の基準、保守できる範囲にとどめた自動化、調整の期間にまとめる実際の設備での確認は、いずれも採るべき案と重なっているので、条件を当てて埋まるのはこの案の欠けだけであり、台帳を反復のたびに更新する案が退けられるわけではない。","4":"この案を退けているのも2つの与件である。1つは全社の方針で、どのテストレベルを置くかを文書に示し、レベルごとに入口と出口の基準を定めることを求めている。もう1つは通しの重さで、品目と工程の組み合わせが多く、自動化しても保守の手間が大きいと書かれた確認を、この案は検証用の版のたびに流す。方針がテストレベルの置き方をプロジェクトに委ねる世界に変えても、版のたびの通しが16回ぶん積み上がることは変わらない。また、確認を各テストレベルに割り振って通しを調整の期間に寄せる案は、方針の求めに寄りかかって立っているわけではないので、その条件を当てても成り立ったままである。"},"quote":"組織のゴールと包括的な品質の特徴：組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含む。これらによって、適応すべきテストレベルやテストタイプを決定することがある。……他のシステムとのインターフェース：システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠である。","ref":"1.4.2","misconception":"反復の回数が増えるほど確認が手厚くなると考えて一続きの通しを版ごとに積み上げ、その手間を負う担い手の数と、記録をいつ示せる状態にしておくかという組織の求めを、同じ表に載せて突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["必要な項目には一通り答えるが、実行を人手の確かめに据え、自動化を増員の後に回す（確かめる回の数と、増やせない担い手に合わない）","正答と同じ範囲を覆うが、台帳の更新を査察の節目にまとめ、保守の手間が大きい通しの確認を版ごとに積み上げる","反復型の一般則に従ってテストレベルの区分を置かず、受け入れの条件の確かめと探索的テストで代える"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-11","MP-07"]}},{"id":"q-1.4.2-B-3","lo":"TM-1.4.2","cluster":"1.4.2-B","variant":3,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは通信事業者で、携帯電話の契約と回線の管理を行うシステムを刷新する案件のテストマネージャーである。開発は1週間の反復で進め、切り替えの前に監督官庁への報告と、外部の監査法人による点検を受ける。他の事業者2社とは番号の持ち運びのためにつながり、どちらも試験用の応答を返す窓口を常時開けているが、実際の回線をつないで流せるのは先方と取り決めた夜間の枠に限られる。申込から開通までを一続きに流す確認は、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えない。\n\nすでに決まっていること\n・社内のテストの方針は、反復で進めるかどうかにかかわらず、どのテストレベルを置くかを示し、レベルごとに着手と完了の判定の基準を定めることを全社に求める\n・要件と個々のテストと実行の結果を結んだ突き合わせ表を保ち、監督官庁や監査法人からの照会に日をおかず出せる状態にしておく\n・組織のゴールに自動テストの割合を高めることを掲げる一方、自動テストの手入れに充てられるのは4名で、社内の成熟度は中程度である\n・品質のゴールは、欠陥検出の効率と、他人名義の申込を通さない本人確認の確かさに置く\n・切り替えは7か月後で延ばせず、要員も費用も今の枠から増やせない。反復ごとに配信の候補を作り、そのたびに申込から開通までの主要な流れを確かめるので、その回は切り替えまでに28回ある\n\n窓口の受付の担当は、刷新のあいだも今の体制のまま変わらない。","question":"この会社の条件を分析したうえで、テストアプローチとして最も適切なものはどれか。1つ選べ。","choices":["ユニットから受け入れまでの4つのテストレベルを置き、レベルごとに着手と完了の判定の基準を定める。実行は手順を書いた確認表をなぞる人手の作業を軸に置き、自動化は手入れに充てられる人を増やせた段階で本人確認に関わる流れから広げる。配信の候補を作るたびに、先方の試験用の応答を相手に申込から開通までを一続きに流す。突き合わせ表は要件と個々のテストと実行の結果を結んだまま反復のたびに更新し、監督官庁や監査法人の照会に日をおかず出せる状態にする。","テストレベルの区分は設けず、反復ごとの配信の候補が受け入れの条件を満たすかを確かめ、残る不安は経験に基づくテストで埋める。自動化は退行の確認に絞り、本人確認に関わる流れには経験に基づくテストの時間を厚く取る。配信の候補のたびに、先方の試験用の応答で申込から開通までを一続きに流す。突き合わせ表の更新は反復の終わりに回し、監督官庁や監査法人の照会にはそのつど応じる。","4つのテストレベルと、レベルごとの着手と完了の判定の基準を置く。自動化は本人確認に関わる流れを中心に、4名で手入れできる範囲にとどめる。配信の候補を作るたびに、先方の試験用の応答で申込から開通までを一続きに流し、実際の回線をつなぐ確認は夜間の枠にまとめて行う。突き合わせ表の更新は切り替えに向けた節目でまとめて行い、切り替えの時点で監督官庁や監査法人に示せる形に整える。","テストレベルはユニットから受け入れまでの4つを置き、レベルごとに着手と完了の判定の基準を定める。主要な流れは、テストレベルに分けて確かめる。申込から開通までを一続きに流すのは、実際の回線をつなげる夜間の枠に寄せる。自動化は本人確認に関わる流れから順に、4名で手入れできる範囲にとどめる。突き合わせ表は反復のたびに更新し、個々のテストと実行の結果をそのまま出せる形に保つ。"],"answer":[3],"explanation":{"signals":"効くのは、社内のテストの方針が求める2つのこと、自動テストの手入れに充てられる人の数、品質のゴール、そして反復の回数と接続の相手の都合である。方針は、反復で進めるかどうかにかかわらず、どのテストレベルを置くかを示し、レベルごとに着手と完了の判定の基準を定めることを全社に求める。あわせて、要件と個々のテストと実行の結果を結んだ突き合わせ表を保ち、監督官庁や監査法人からの照会に日をおかず出せる状態にしておくことも決まっている。自動テストの手入れに充てられるのは4名で、社内の成熟度は中程度であり、要員も費用も今の枠から増やせない。品質のゴールは、欠陥検出の効率と、他人名義の申込を通さない本人確認の確かさに置く。反復ごとに配信の候補を作って主要な流れを確かめる回は、その回は切り替えまでに28回ある。接続の相手については、試験用の応答を返す窓口が常時開いている一方、実際の回線をつないで流せるのは先方と取り決めた夜間の枠に限られ、しかも申込から開通までを一続きに流す確認は、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないと置かれている。つまり論点は、試験用の応答があるかどうかではなく、28回ぶんの通しを、増やせない担い手で負えるかである。窓口の受付の担当が刷新のあいだも今の体制のまま変わらないことは、どの案の当否も動かさないノイズである。","why":"選ぶべきは、ユニットから受け入れまでの4つのテストレベルを置いて着手と完了の判定の基準を定めたうえで、主要な流れをテストレベルに分けて確かめ、一続きの通しは実際の回線をつなげる夜間の枠に寄せ、自動化は本人確認に関わる流れから順に4名で手入れできる範囲にとどめ、突き合わせ表を反復のたびに更新する案である。これを選ばせているのは、方針が進め方によらずテストレベルの明示と判定の基準を全社に求めていること、一続きに流す確認が重いのに確かめる回が多く、要員も費用も増やせないこと、そして表をいつでも出せる状態にしておくよう求められていることの3つである。\n\nまず、1週間の反復で進めていること自体は、テストレベルを置かない理由にならない。シラバスはプロジェクトに使用するソフトウェア開発ライフサイクルモデルを分析すべき要因に挙げているが、それは並ぶ要因の1つにすぎない。組織のゴールと包括的な品質の特徴についてシラバスが述べているのは、組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含むということであり、これらによって、適応すべきテストレベルやテストタイプを決定することがあるとしている。この会社では社内の方針が、どのテストレベルを置くかを示し、レベルごとに着手と完了の判定の基準を定めることを全社に求めているのだから、反復の側から下ろせない。\n\nつぎに分かれ目になるのは、主要な流れの確認をどこで行うかである。本文は、申込から開通までを一続きに流す確認は、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないと置いている。しかも、その回は切り替えまでに28回ある。自動テストの手入れに充てられるのは4名で、社内の成熟度は中程度であるうえ、要員も費用も今の枠から増やせない。だから通しを毎回積み上げる形は、自動化すれば4名で負える手入れの範囲を超え、人手で流せば増やせない担い手が28回とも同じ作業を繰り返すことになる。どちらに振っても増やせない資源を食うので、確認を各テストレベルに配分し、一続きの通しは、実際の回線をつないで流せるのは先方と取り決めた夜間の枠に限られるという枠のほうに寄せることになる。シラバスも、他のシステムとのインターフェースを分析すべき要因に挙げ、システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠であると述べている。\n\n残るのは、自動化を何から始めるかと記録である。品質のゴールは、欠陥検出の効率と、他人名義の申込を通さない本人確認の確かさに置くとされているので、4名で手入れできる範囲の自動化はその流れから順に当てる。記録については、要件と個々のテストと実行の結果を結んだ突き合わせ表を保ち、監督官庁や監査法人からの照会に日をおかず出せる状態にしておくことが決まっている。だから表の更新は反復のたびに行い、個々のテストと実行の結果をそのまま出せる形に保つ。","distractors":["この案がつまずくのは、実行を手順を書いた確認表をなぞる人手の作業に置き、自動化を手入れに充てられる人を増やせた段階に回す点である。本文は、要員も費用も今の枠から増やせないと置いているので、増員を待つという前提そのものが立たず、組織のゴールに掲げた自動テストの割合を高めることにも近づかない。しかも主要な流れを確かめる回は、その回は切り替えまでに28回あるのだから、人手を軸に置けばその回数ぶんを人が繰り返す。配信の候補を作るたびに試験用の応答で一続きに流す点も同じで、料金の組み合わせと端末の種類が多い確認を、増やせない担い手が28回とも流すことになり、欠陥検出の効率という品質のゴールから遠ざかる。テストレベルと着手と完了の判定の基準を置き、突き合わせ表を反復のたびに更新して照会に日をおかず出せる状態にし、試験用の応答を使った通しまで計画に入れている点は必要な項目に一通り答えており、自動テストの手入れに充てられる人が限られることを理由に人手を軸に置く判断も、現場では筋が通って見える。","この案がつまずくのは、テストレベルの区分を設けない点である。社内のテストの方針は、反復で進めるかどうかにかかわらず、どのテストレベルを置くかを示し、レベルごとに着手と完了の判定の基準を定めることを全社に求めており、配信の候補が受け入れの条件を満たすかの確かめと経験に基づくテストで代えるこの案は、そこに応えていない。反復型の開発で広く使われている進め方を、組織の方針が課す条件より前に置いてしまっている。シラバスも、組織のゴールと包括的な品質の特徴について、これらによって、適応すべきテストレベルやテストタイプを決定することがあるとしている。さらに、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないとされた通しの確認を配信の候補のたびに流す形は、確かめる回が切り替えまでに28回あり要員を増やせない条件のもとで、その手入れを回数ぶん積み上げる。反復ごとの候補が受け入れの条件を満たすかを確かめ、残る不安を経験に基づくテストで埋める進め方は反復型では妥当な形であり、突き合わせ表の更新を反復の終わりに回す点も、記録を残すという求めには一応答えている。","この案がつまずくのは、突き合わせ表の更新を切り替えに向けた節目にまとめる点である。決まっているのは、要件と個々のテストと実行の結果を結んだ突き合わせ表を保つことだけでなく、監督官庁や監査法人からの照会に日をおかず出せる状態にしておくことでもあり、節目と節目のあいだその状態が空く計画はこれを満たさない。照会が切り替えの時点にだけ来るとは本文に書かれていない。加えて、配信の候補を作るたびに一続きの通しを流す形は、その回は切り替えまでに28回あり要員も費用も増やせない条件のもとで、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないとされた確認を回数ぶん積み上げる。ただしこの案は自動化を本人確認に関わる流れを中心に4名で手入れできる範囲にとどめると自ら限っており、候補のたびに流す試験用の応答での通しは、その自動テストの手入れの枠の外で回る作業である。退ける決め手は、記録をいつ照会に応じられる状態にするかにある。4つのテストレベルと着手と完了の判定の基準を置き、自動化を手入れできる範囲にとどめ、実際の回線をつなぐ確認を夜間の枠にまとめる点は条件に沿っており、更新をまとめて行うのは限られた担い手の使い方として現場では通りやすい。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは、独立した2つの与件である。1つは増員の道で、本文は、要員も費用も今の枠から増やせないと置いている。もう1つは繰り返しの数で、その回は切り替えまでに28回ある。人手を軸に置くという組み立てを残したまま、担い手を増やせる世界に変えても、28回ぶんの通しを積み上げる形が、確認を各テストレベルに割り振って通しを夜間の枠に寄せる案より前に出る理由にはならない。逆に確かめる回が数回で済む世界に変えても、増員を待つあいだ自動化が進まないことは残る。だから条件を1つ動かしてこの案を採らせることはできない。","2":"この案を退けているのも2つの与件である。1つは社内の方針で、どのテストレベルを置くかを示し、レベルごとに着手と完了の判定の基準を定めることを全社に求めている。もう1つは通しの重さで、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないと書かれた確認を、この案は配信の候補のたびに流す。方針がテストレベルの置き方をプロジェクトに委ねる世界に変えても、候補のたびの通しが28回ぶん積み上がることは変わらない。また、確認を各テストレベルに割り振って通しを夜間の枠に寄せる案は、方針の求めに寄りかかって立っているわけではないので、その条件を当てても成り立ったままである。","3":"この案を退けているのは、記録の求めと通しの重さの2つである。決まっているのは、監督官庁や監査法人からの照会に日をおかず出せる状態にしておくことであり、節目にまとめる更新ではその状態が空く。さらに、料金の組み合わせと端末の種類が多く、自動化しても手入れが絶えないとされた通しを、この案は候補のたびに流す。照会が切り替えの時点にまとめて来る世界に変えても、後者は残る。しかもこの案が置くテストレベルと着手と完了の判定の基準、手入れできる範囲にとどめた自動化、夜間の枠にまとめる実際の回線での確認は、いずれも採るべき案と重なっているので、条件を当てて埋まるのはこの案の欠けだけであり、突き合わせ表を反復のたびに更新する案が退けられるわけではない。"},"quote":"組織のゴールと包括的な品質の特徴：組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含む。これらによって、適応すべきテストレベルやテストタイプを決定することがある。……他のシステムとのインターフェース：システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠である。","ref":"1.4.2","misconception":"反復の刻みが細かいほど確認が行き届くと考えて一続きの通しを候補ごとに積み上げ、その手入れを負う人の数と、突き合わせ表をいつ出せる状態にしておくかという全社の求めを、同じ表に載せて突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["必要な項目には一通り答えるが、実行を人手の確認表に置き、自動化を増員の後に回す（確かめる回の数と、増やせない担い手に合わない）","反復型の一般則に従ってテストレベルの区分を置かず、受け入れの条件の確かめと経験に基づくテストで代える","正答と同じ範囲を覆うが、突き合わせ表の更新を切り替えの節目にまとめ、手入れの絶えない通しの確認を候補ごとに積み上げる"],"distractorTypes":["D3","D2","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-11","MP-07"]}},{"id":"q-1.4.2-C-1","lo":"TM-1.4.2","cluster":"1.4.2-C","variant":1,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは電力小売の会社で、料金の計算と請求を行うシステムを刷新する案件のテストマネージャーである。契約の種別、時間帯ごとの単価、季節の割引、途中解約の精算が組み合わさり、請求額の算出の型は数万通りに及ぶ。社内の移行の基準は、この組み合わせを覆った結果と、実際の契約の分布で現行のシステムと一致することの両方を示すよう定めている。組み合わせを覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を費やす見込みである。\n\n料金の規則は当局へ届け出た文書として明文化されており、移行が終わるまで変更しない。期間は18か月あり、予算は確保済みで、規則を仕様の形に整えて保守する担当を2名充てられる。開発は2週間の反復で進み、反復ごとに増えるのは実装した範囲だけである。\n\nテストに使える本番の契約データは個人情報を匿名化した写しに限られ、その写しを作る基盤が使えるのは開始から4か月後である。テスト担当者は6名で、うち3名はこの料金体系の業務を扱った経験がない。現行のシステムを保守してきた運用の部門は、移行後も体制を変えない。","question":"テストデータの用意の仕方と、確認をどこに置くかを分析したうえで、採るべきテストアプローチはどれか。1つ選べ。","choices":["料金の規則に通じた担当者が、契約の種別ごとに誤りの出やすい箇所を見当づけて確認の観点を洗い出し、その観点に沿って現行のシステムと結果を突き合わせる。データは実際の契約で多く現れる型から用意し、匿名化した写しが使える時期からは本番の分布にも同じ観点を当てる。観点の一覧は反復ごとに見直して増やす。","テストデータは実際の契約で多く現れる型から順に人手で作り、反復ごとに用意する件数の目標を置いて積み上げる。目標に届かない反復では他の作業を止めてデータ作りに人を回す。現行のシステムとの突き合わせは用意できた分から行い、匿名化した写しが使える時期に本番の分布での照合を加える。","料金の規則をモデルとして書き起こし、そこからテストデータと期待結果を生成し、同じデータを現行のシステムにも流して、組み合わせを覆った結果を突き合わせで示す。生成したデータでの確認は反復ごとに実装した範囲へ当てて開始の時点から進め、実際の契約の分布での照合は写しが使える時期以降に置く。モデルの整備と保守は2名が担う。","生成したデータは匿名化の手続きを待たずに使えるため、料金の規則をモデルとして書き起こし、そこからテストデータと期待結果を作って組み合わせを覆う。開始の時点から反復ごとに現行のシステムと突き合わせ、判定にはこの網羅の結果を示す。実際の契約の分布での照合は、移行の当日に本番の契約データを取り込む手順の確認で代える。"],"answer":[2],"explanation":{"signals":"効くのは、請求額の算出の型が数万通りに及ぶこと、社内の移行の基準が組み合わせを覆った結果と実際の契約の分布で現行のシステムと一致することの両方を求めていること、その組み合わせを覆うテストデータを人手で作ると作成だけで期間の大半を費やす見込みであること、料金の規則が届け出た文書として明文化され移行が終わるまで変更されないこと、18か月の期間と予算と、規則を仕様の形に整えて保守する2名の担当が確保されていること、本番の契約データが匿名化した写しに限られ、その写しを作る基盤が使えるのは開始から4か月後であることである。テスト担当者6名のうち3名がこの料金体系の業務を扱った経験がないことと、現行のシステムを保守してきた運用の部門が移行後も体制を変えないことは、どの案の当否も動かさない。","why":"採るべきは、料金の規則をモデルとして書き起こし、そこからテストデータと期待結果を生成して組み合わせを覆い、実際の契約の分布での照合は匿名化した写しが使える時期以降に置く案である。これを選ばせているのは、テストデータの作成そのものがこの案件で最大の工数になること、その作成を機械に肩代わりさせる条件がそろっていること、そして移行の基準が組み合わせの網羅と実際の分布での一致の2つを求めていることである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因の1つにテストデータの可用性を挙げ、本番環境から匿名化されたテストデータが必要である場合などの制約を考慮しなければならないとしたうえで、モデルベースドテストはテストデータの作成とテストデータのマネジメントをサポートできると述べている。この案件では、数万通りの組み合わせを覆うデータを人手で作ると、その作成だけで期間の大半が消える。一方で料金の規則は当局へ届け出た文書として明文化されており、そこからモデルを起こせばテストデータと期待結果を機械的に作れる。モデルを作って保守することには初めの手間がかかるが、規則は移行が終わるまで変更されず、18か月の期間と予算、そして規則を仕様の形に整えて保守する担当2名が確保されているので、その手間を引き受けられる。\n\nもう一方の要因はデータを入手できる時期である。本番の契約データは匿名化した写しに限られ、その写しを作る基盤が使えるのは開始から4か月後である。モデルから作るデータは本番の契約データではないので、この4か月を待たずに使える。だから、組み合わせを覆う確認は開始の時点から反復ごとに実装した範囲へ当てて進め、実際の契約の分布での照合だけを写しが使える時期以降に置く。移行の基準が求める2つを、それぞれ材料を調達できる時期に合わせて配分した形になる。\n\n技法そのものの優劣で決めているのではない。規則に通じた担当者が契約の種別ごとに誤りの出やすい箇所を見当づけ、確認の観点を洗い出す進め方も、限られた工数を効かせる筋として実際に採られる。それをこの案件で退けているのは1つ、移行の基準が組み合わせを覆った結果を示すよう求めていることである。シラバスが経験ベースのテストに求めているのは十分なドメイン知識を持つテスト担当者であって、担当者の全員がその知識を持つことではない。6名のうち3名がこの料金体系の業務を扱った経験がないことは、この案を退ける理由にはならない。","distractors":["この案がつまずくのは、テストデータを実際の契約で多く現れる型から用意する点である。社内の移行の基準は、数万通りに及ぶ組み合わせを覆った結果を示すよう定めているが、多く現れる型から順に選んだデータと、そこに当てる確認の観点では、覆ったことを示せない。観点の一覧を反復ごとに見直して増やしても、どこまで覆えたかを示せる形にはならない。規則に通じた担当者が契約の種別ごとに誤りの出やすい箇所を見当づける進め方そのものは、限られた工数を効かせる筋として実際に採られており、匿名化した写しが使える時期から本番の分布にも同じ観点を当てる点は、移行の基準のもう一方、すなわち実際の契約の分布で現行のシステムと一致することを示す側に向いている。シラバスが経験ベースのテストに求めるのは十分なドメイン知識を持つテスト担当者であり、この案は観点の洗い出しを料金の規則に通じた担当者が行うと自ら書いているので、6名のうち3名にこの料金体系の業務の経験がないことは、この案を退ける根拠にはならない。退ける決め手は、覆ったことを示すという求めの1つである。","この案がつまずくのは、人手でデータを作るという前提を置いたまま、件数の目標と人の投入で量を積み上げようとする点である。本文は、組み合わせを覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を費やす見込みだと述べている。目標に届かない反復で他の作業を止めてデータ作りに人を回せば、その見込みをそのまま実現することになり、確認そのものに充てる時間が削られる。用意できた分から突き合わせを進める形も、組み合わせを覆ったことを示せる時期を最後まで決められない。数万通りという量に対して作る件数を増やすことで応えるのは分かりやすい打ち手であり、進み具合を件数で測れる点も管理しやすく見える。",null,"この案がつまずくのは、移行の基準が求める2つのうち、実際の契約の分布で現行のシステムと一致することを、移行の当日に行う取り込みの手順の確認に置き換えている点である。社内の移行の基準は、組み合わせを覆った結果と、実際の契約の分布での一致の両方を示すよう定めている。モデルから作ったデータは、規則の上で起こりうる組み合わせを覆えるが、実際の契約がどう分布しているかは映さない。規則をモデルとして書き起こして生成したデータで組み合わせを覆う点と、匿名化の手続きを待たずに開始の時点から反復ごとに確認を進める点は、この案件の条件にそのまま合っており、覆ったことを示せるのだからそれで足りると考えるのは自然である。欠けているのは、示すよう求められている2つのうちの1つである。"],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは1つ、移行の基準が組み合わせを覆った結果を示すよう求めていることである。ではその求めを外した世界に変えればこの案が採るべき案になるかというと、そうはならない。組み合わせを覆った結果と実際の契約の分布での一致の両方を示すという移行の基準は、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たなくなる。担当者の側を動かしても同じで、6名全員がこの料金体系の業務に通じている状況に変えても、実際の契約で多く現れる型から選んだデータで覆った結果を示すことはできない。","2":"この案が寄りかかっているのは、必要なデータが人手で作れる量に収まっているという前提である。ところが組み合わせが数万通りに及ぶことと、人手で作ると作成だけで期間の大半を費やすという見積りは、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たなくなる。人を足せる、期間を延ばせるといった条件を当てても、数万通りを人手で作る作業量そのものは変わらないので、この案が前に出ることはない。","4":"この案に足りないのは、実際の契約の分布で現行のシステムと一致することを示す部分である。では移行の基準が組み合わせを覆った結果だけを求める世界に変えればこの案が採るべき案になるかというと、そうはならない。規則をモデルとして書き起こし、生成したデータで組み合わせを覆い、匿名化の手続きを待たずに開始の時点から確認を進めるという骨格は、採るべき案と同じものである。基準から一致の求めを外すと、両者の違いは写しが使える時期以降に照合を置くかどうかだけになり、それは求められていない作業を行うかどうかの差にすぎないので、どちらを採るかが決まらない。"},"quote":"テストデータの可用性：テストデータの可用性に関する制約、例えば、本番環境から匿名化されたテストデータが必要である場合や、AI テスト用のデータのように、提供が困難で有効性が必要な特定のテストデータを作成する必要があることを考慮しなければならない。例えば、モデルベースドテストは、テストデータの作成とテストデータのマネジメントをサポートできる。","ref":"1.4.2","misconception":"テストデータをどう用意するかを技法の優劣や作業量の問題として扱い、規則が文書として確定していること、期間と担当が確保されていること、本番の写しが使えるのは4か月後であることといった、その技法が成り立つ条件と材料を調達できる時期を突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["担当者の見当づけによる確認の観点で組み合わせの網羅を代えさせる（多く現れる型から用意したデータでは、覆った結果を示すという移行の基準に応えられないことを読み落とす）","人手でデータを作る前提のまま、件数の目標と人の投入で量を積み上げさせる（作成そのものが期間の大半を食うという本文の見積りを読み落とす）","モデルから生成したデータで組み合わせは覆うが、実際の契約の分布での照合を移行の当日の手順の確認に置き換えさせる（移行の基準が求める2つのうち1つを欠く）"],"distractorTypes":["D2","D13","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-07"]}},{"id":"q-1.4.2-C-2","lo":"TM-1.4.2","cluster":"1.4.2-C","variant":2,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは市の情報システム部門で、住民税と国民健康保険料の賦課の計算を行うシステムを刷新する案件のテストマネージャーである。\n\nこの案件の与件\n・所得の区分、控除の組み合わせ、軽減の判定、年度の途中で世帯の構成が変わったときの月割りが重なり、算定の型は十数万通りに及ぶ\n・市が定めた移行の判定は、算定の型を覆った結果と、実際の課税対象者の分布で現行のシステムと答えが一致することの両方を示すよう求める\n・算定の型を覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を使う見込みである\n・賦課の計算は条例と通知に定められ、告示された文書として確定しており、移行が終わるまで改正しない\n・期間は24か月、費用は確保済みで、規則を仕様の形に整えて手入れする担当を3名充てられる。開発は3週間の反復で進み、反復ごとに出来上がるのは実装した範囲だけである\n・テストに使える本番の課税のデータは匿名にした抽出に限られ、その抽出を作る環境が使えるのは着手から6か月後である\n・テスト担当は7名で、うち4名はこの賦課の業務を扱った経験がない\n\n窓口で賦課の問い合わせを受ける市民課の担当は、刷新のあいだも人数を変えない。","question":"テストデータをどう用意し、2つの比較をどこに置くかを分析したうえで、テストアプローチとして最も妥当なものはどれか。1つ選べ。","choices":["条例と通知に定められた賦課の計算をモデルに写し取り、そこからテストデータと見込みの答えを機械で作り出す。同じテストデータを現行のシステムにも通して答えを比べ、算定の型を覆ったことを示す。機械で作ったテストデータでの比較は、反復ごとに実装の済んだ範囲へ当てて着手の時点から回す。実際の課税対象者の分布での比較は、匿名にした抽出が使える時期から行う。モデルの手入れには3名を充てる。","匿名にする手続きを待たずに使えるので、条例と通知に定められた賦課の計算をモデルに写し取り、そこから機械で作ったテストデータと見込みの答えで算定の型を覆う。着手の時点から反復ごとに現行のシステムと答えを比べ、移行の判定にはこの覆った結果を出す。実際の課税対象者の分布での比較は、匿名にした抽出が使える時期を待たずに移行の判定を出し、移行の後に運用の部門が行う月次の点検に委ねる。","テストデータは実際の課税で多く現れる型から用意し、賦課の業務に通じた担当が所得の区分ごとに誤りの出やすい箇所を見当づけて、確かめる観点を洗い出す。その観点に沿って現行のシステムと答えを比べ、匿名にした抽出が使える時期からは実際の課税対象者の分布にも同じ観点を当てる。観点の一覧は反復ごとに見直して増やす。","テストデータは算定の型の一覧から人手で書き起こし、反復ごとに作る件数の目標を置いて積み上げる。目標に届かない反復では他の作業を止めて人をデータ作りに回し、足りなければ短期の応援を入れる。現行のシステムとの比較は作れた分から始め、匿名にした抽出が使える時期に実際の課税対象者の分布での比較を加える。"],"answer":[0],"explanation":{"signals":"効くのは、算定の型が十数万通りに及ぶこと、市が定めた移行の判定が2つの示し方を求めること、算定の型を覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を使う見込みであること、賦課の計算が条例と通知に定められ、告示された文書として確定していて移行が終わるまで改正しないこと、期間は24か月、費用は確保済みで、規則を仕様の形に整えて手入れする担当を3名充てられること、そして、テストに使える本番の課税のデータは匿名にした抽出に限られ、その抽出を作る環境が使えるのは着手から6か月後であることである。反復ごとに出来上がるのは実装した範囲だけであることは、機械で作ったテストデータをいつ・どこへ当てるかを決める。テスト担当7名のうち4名がこの賦課の業務を扱った経験がないことと、窓口で賦課の問い合わせを受ける市民課の担当が刷新のあいだも人数を変えないことは、どの案の当否も動かさない。","why":"この案件で正しいのは、条例と通知に定められた賦課の計算をモデルに写し取り、そこからテストデータと見込みの答えを機械で作って算定の型を覆い、実際の課税対象者の分布での比較は匿名にした抽出が使える時期から行う案である。これを選ばせているのは、テストデータの作成そのものがこの案件で最大の工数になること、その作成を機械に肩代わりさせる条件がそろっていること、そして移行の判定が2つの示し方を求めていることである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因の1つにテストデータの可用性を挙げ、テストデータの可用性に関する制約、例えば、本番環境から匿名化されたテストデータが必要である場合を考慮しなければならないとしたうえで、例えば、モデルベースドテストは、テストデータの作成とテストデータのマネジメントをサポートできると述べている。この案件では、所得の区分、控除の組み合わせ、軽減の判定、年度の途中で世帯の構成が変わったときの月割りが重なり、算定の型は十数万通りに及ぶ。そのうえ、算定の型を覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を使う見込みである。一方で、賦課の計算は条例と通知に定められ、告示された文書として確定しており、移行が終わるまで改正しないのだから、そこからモデルを起こせばテストデータと見込みの答えを機械で作れる。モデルを作って手入れする初めの手間は要るが、期間は24か月、費用は確保済みで、規則を仕様の形に整えて手入れする担当を3名充てられるので、その手間を引き受けられる。\n\nもう一方の要因は、材料を調達できる時期である。テストに使える本番の課税のデータは匿名にした抽出に限られ、その抽出を作る環境が使えるのは着手から6か月後である。機械で作るテストデータは本番の課税のデータではないので、この6か月を待たずに使える。だから覆いを示す比較は着手の時点から進め、反復ごとに出来上がるのは実装した範囲だけであるという進み方に合わせて、実装の済んだ範囲へ当てていく。市が定めた移行の判定は、算定の型を覆った結果と、実際の課税対象者の分布で現行のシステムと答えが一致することの両方を示すよう求めるので、もう一方の比較だけを、抽出が使える時期から行う。移行の判定が求める2つを、それぞれ材料を調達できる時期に合わせて配分した形になる。\n\n技法の優劣で決めているのではない。賦課の業務に通じた担当が誤りの出やすい箇所を見当づける進め方も、限られた工数を効かせる筋として実際に採られる。それをこの案件で退けているのは、覆った結果を示すよう求められていることの一点であって、テスト担当7名のうち4名がこの賦課の業務を扱った経験がないことではない。","distractors":[null,"この案がつまずくのは、移行の判定が求める2つのうち、実際の課税対象者の分布で現行のシステムと答えが一致することを、移行の後に運用の部門が行う月次の点検に委ねる点である。市が定めた移行の判定は、算定の型を覆った結果と、実際の課税対象者の分布で現行のシステムと答えが一致することの両方を示すよう求めており、移行の後に行う点検は、移行してよいかを決める材料にならない。モデルから作ったテストデータは、規則の上で起こりうる算定の型を覆えるが、実際の課税対象者がどう分かれているかは映さない。規則をモデルに写し取って機械でテストデータを作る点と、匿名にする手続きを待たずに着手の時点から比較を進める点は、この案件の条件にそのまま合っており、覆ったことを示せるのだからそれで足りると考えるのは自然である。","この案がつまずくのは、テストデータを実際の課税で多く現れる型から用意する点である。市が定めた移行の判定は、算定の型を覆った結果と、実際の課税対象者の分布で現行のシステムと答えが一致することの両方を示すよう求めるが、多く現れる型から選んだテストデータと、そこに当てる観点では、十数万通りの算定の型を覆ったことを示せない。観点の一覧を反復ごとに見直して増やしても、どこまで覆えたかを示せる形にはならない。賦課の業務に通じた担当が誤りの出やすい箇所を見当づける進め方そのものは、限られた工数を効かせる筋として実際に採られており、匿名にした抽出が使える時期から実際の課税対象者の分布にも同じ観点を当てる点は、移行の判定のもう一方に向いている。この案は観点の洗い出しを賦課の業務に通じた担当が行うと自ら書いているので、テスト担当7名のうち4名にこの賦課の業務の経験がないことは、この案を退ける根拠にはならない。退ける決め手は、覆ったことを示すという求めのほうである。","この案がつまずくのは、人手でテストデータを作るという前提を置いたまま、件数の目標と人の投入で量を積み上げようとする点である。本文は、算定の型を覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を使う見込みであると述べている。目標に届かない反復で他の作業を止めて人をデータ作りに回し、短期の応援まで入れれば、その見込みをそのまま実現することになり、比較そのものに充てる時間が削られる。作れた分から比較を始める形も、算定の型は十数万通りに及ぶのだから、覆ったことを示せる時期を最後まで決められない。量に対して作る件数を増やすことで応えるのは分かりやすい打ち手であり、進み具合を件数で測れる点も管理しやすく見える。"],"flip":[null,null,null,null],"flipNote":{"2":"この案に足りないのは、実際の課税対象者の分布で現行のシステムと答えが一致することを示す部分である。では移行の判定が算定の型を覆った結果だけを求める世界に変えればこの案が採るべき案になるかというと、そうはならない。規則をモデルに写し取り、機械で作ったテストデータで算定の型を覆い、匿名にする手続きを待たずに着手の時点から比較を進めるという骨格は、採るべき案と同じものである。求めを1つに減らすと、両者の違いは抽出が使える時期から分布での比較を置くかどうかだけになり、それは求められていない作業を行うかどうかの差にすぎないので、どちらを採るかが決まらない。","3":"この案を退けているのは、市が定めた移行の判定は、算定の型を覆った結果と、実際の課税対象者の分布で現行のシステムと答えが一致することの両方を示すよう求める、という一文である。ではその求めを外した世界に変えればこの案が採るべき案になるかというと、そうはならない。2つを示すという移行の判定は、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たない。担当の側を動かしても同じで、テスト担当の全員がこの賦課の業務に通じている世界に変えても、実際の課税で多く現れる型から選んだテストデータで、十数万通りを覆ったことを示すことはできない。","4":"この案が寄りかかっているのは、必要なテストデータが人手で書ける量に収まっているという前提である。ところが、算定の型は十数万通りに及ぶことと、算定の型を覆うだけのテストデータを人手で作ると、その作成だけで期間の大半を使う見込みであることは、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たない。人を足せる、期間を延ばせるといった条件を当てても、十数万通りを人手で書く作業量そのものは変わらないので、この案が前に出ることはない。"},"quote":"テストデータの可用性：テストデータの可用性に関する制約、例えば、本番環境から匿名化されたテストデータが必要である場合や、AI テスト用のデータのように、提供が困難で有効性が必要な特定のテストデータを作成する必要があることを考慮しなければならない。例えば、モデルベースドテストは、テストデータの作成とテストデータのマネジメントをサポートできる。","ref":"1.4.2","misconception":"テストデータの作り方を技法の好みや作業量の問題として選び、その技法が成り立つ条件（規則が告示された文書として確定していること、期間と担当が確保されていること）と、材料が手に入る時期（抽出は着手から6か月後）と、示すよう求められている2つを、同じ表に載せて突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["モデルから作ったテストデータで算定の型は覆うが、実際の課税対象者の分布での比較を移行の後の月次の点検に置き換えさせる（求められている2つのうち1つを欠く）","担当の見当づけによる観点で算定の型の網羅を代えさせる（多く現れる型から用意したテストデータでは、覆った結果を示すという求めに応えられないことを読み落とす）","人手でテストデータを作る前提のまま、件数の目標と人の投入で量を積み上げさせる（作成そのものが期間の大半を使うという本文の見積りを読み落とす）"],"distractorTypes":["D3","D2","D13"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-07"]}},{"id":"q-1.4.2-C-3","lo":"TM-1.4.2","cluster":"1.4.2-C","variant":3,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは鉄道会社で、運賃と定期券の金額を計算するシステムを作り直す案件のテストマネージャーである。\n\n前提\n・区間の組み合わせ、経路の選び方、乗り継ぎの割引、通学と通勤の別、有効期間の長さが重なり、金額の出し方の型は数十万通りに達する\n・切り替えの判定は、金額の出し方の型を覆った結果と、実際に売れている券の分布で今のシステムと金額が一致することの両方を示すよう社内で定めている\n・運賃の規則は国へ届け出た約款として明文化され、切り替えが済むまで改定しない\n・期間は15か月、費用は手当て済みで、規則を仕様の形に直して手入れする担当を4名置ける。開発は1か月の反復で進み、反復ごとに仕上がるのは作った範囲だけである\n\n制約\n・型を覆うだけのテストデータを人の手で書くと、その作成だけで期間の大半が消える見込みである\n・テストに回せる実際の販売のデータは匿名にした写しに限られ、その写しを作る仕組みが整うのは開始から5か月後である\n・テスト担当は8名で、うち5名はこの運賃の制度を扱った経験がない\n\n駅の窓口で定期券を売る係の人数は、切り替えの後も変えない。","question":"テストデータの用意の仕方と、2つの照合を置く時期を分析したうえで、採るべきテストアプローチはどれか。1つ選べ。","choices":["テストデータは型の一覧から人の手で書き起こし、反復ごとに仕上げる件数の目標を置いて積み上げる。目標に届かない反復では他の作業を止めて人をデータ作りに寄せ、足りなければ他の部署から応援を入れる。今のシステムとの照合は書けた分から始め、匿名にした写しが整う時期に実際に売れている券の分布での照合を加える。","届け出た約款の運賃の規則をモデルに起こし、そこからテストデータと見込みの金額を機械で作る。同じテストデータを今のシステムにも流して金額を照らし合わせ、金額の出し方の型を覆ったことを示す。機械で作ったテストデータでの照合は、反復ごとに仕上がった範囲へ当て、開始の時点から進める。実際に売れている券の分布での照合は、匿名にした写しが整う時期から行う。モデルの手入れは4名で担う。","匿名にする手続きを待たずに使えるので、届け出た約款の運賃の規則をモデルに起こし、そこから作ったテストデータと見込みの金額で金額の出し方の型を覆う。開始の時点から、反復ごとに仕上がった範囲を今のシステムと照らし合わせ、切り替えの判定にはこの覆った結果を出す。実際に売れている券の分布での照合は、匿名にした写しが整う時期を待たず、切り替えの後に営業の部門が行う月次の売上の点検に委ねる。","テストデータは実際に売れている券で多く現れる型から用意し、運賃の制度に通じた担当が区間の種類ごとに誤りの出やすい箇所を見当づけて、照らし合わせる観点を洗い出す。その観点に沿って今のシステムと金額を照らし合わせ、匿名にした写しが整う時期からは実際に売れている券の分布にも同じ観点を当てる。観点の一覧は反復ごとに見直して増やす。"],"answer":[1],"explanation":{"signals":"効くのは、金額の出し方の型が数十万通りに達すること、切り替えの判定が2つの示し方を求めること、型を覆うだけのテストデータを人の手で書くと、その作成だけで期間の大半が消える見込みであること、運賃の規則は国へ届け出た約款として明文化され、切り替えが済むまで改定しないこと、期間は15か月、費用は手当て済みで、規則を仕様の形に直して手入れする担当を4名置けること、そして、テストに回せる実際の販売のデータは匿名にした写しに限られ、その写しを作る仕組みが整うのは開始から5か月後であることである。反復ごとに仕上がるのは作った範囲だけであることは、機械で作ったテストデータをいつ・どこへ当てるかを決める。テスト担当8名のうち5名がこの運賃の制度を扱った経験がないことと、駅の窓口で定期券を売る係の人数が切り替えの後も変わらないことは、どの案の当否も動かさない。","why":"正しいのは、届け出た約款の運賃の規則をモデルに起こし、そこからテストデータと見込みの金額を機械で作って金額の出し方の型を覆い、実際に売れている券の分布での照合は匿名にした写しが整う時期から行う案である。これを選ばせているのは、テストデータの作成そのものがこの案件で最大の工数になること、その作成を機械に肩代わりさせる条件がそろっていること、そして切り替えの判定が2つの示し方を求めていることである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因の1つにテストデータの可用性を挙げ、テストデータの可用性に関する制約、例えば、本番環境から匿名化されたテストデータが必要である場合を考慮しなければならないとしたうえで、例えば、モデルベースドテストは、テストデータの作成とテストデータのマネジメントをサポートできると述べている。この案件では、区間の組み合わせ、経路の選び方、乗り継ぎの割引、通学と通勤の別、有効期間の長さが重なり、金額の出し方の型は数十万通りに達する。そのうえ、型を覆うだけのテストデータを人の手で書くと、その作成だけで期間の大半が消える見込みである。一方で、運賃の規則は国へ届け出た約款として明文化され、切り替えが済むまで改定しないのだから、そこからモデルを起こせばテストデータと見込みの金額を機械で作れる。モデルを作って手入れする初めの手間は要るが、期間は15か月、費用は手当て済みで、規則を仕様の形に直して手入れする担当を4名置けるので、その手間を引き受けられる。\n\nもう一方の要因は、材料が手に入る時期である。テストに回せる実際の販売のデータは匿名にした写しに限られ、その写しを作る仕組みが整うのは開始から5か月後である。機械で作るテストデータは実際の販売のデータではないので、この5か月を待たずに使える。だから覆いを示す照合は開始の時点から進め、反復ごとに仕上がるのは作った範囲だけであるという進み方に合わせて、仕上がった範囲へ当てていく。切り替えの判定は、金額の出し方の型を覆った結果と、実際に売れている券の分布で今のシステムと金額が一致することの両方を示すよう社内で定めているので、もう一方の照合だけを、写しが整う時期から行う。切り替えの判定が求める2つを、それぞれ材料が手に入る時期に合わせて配分した形になる。\n\n技法の優劣で決めているのではない。運賃の制度に通じた担当が誤りの出やすい箇所を見当づける進め方も、限られた工数を効かせる筋として実際に採られる。それをこの案件で退けているのは、覆った結果を示すよう求められていることの一点であって、テスト担当8名のうち5名がこの運賃の制度を扱った経験がないことではない。","distractors":["この案がつまずくのは、人の手でテストデータを書くという前提を置いたまま、件数の目標と人の投入で量を積み上げようとする点である。本文は、型を覆うだけのテストデータを人の手で書くと、その作成だけで期間の大半が消える見込みであると述べている。目標に届かない反復で他の作業を止めて人をデータ作りに寄せ、他の部署から応援まで入れれば、その見込みをそのまま実現することになり、照合そのものに充てる時間が削られる。書けた分から照合を始める形も、金額の出し方の型は数十万通りに達するのだから、覆ったことを示せる時期を最後まで決められない。量に対して書く件数を増やすことで応えるのは分かりやすい打ち手であり、進み具合を件数で測れる点も管理しやすく見える。",null,"この案がつまずくのは、切り替えの判定が求める2つのうち、実際に売れている券の分布で今のシステムと金額が一致することを、切り替えの後に営業の部門が行う月次の売上の点検に委ねる点である。切り替えの判定は、金額の出し方の型を覆った結果と、実際に売れている券の分布で今のシステムと金額が一致することの両方を示すよう社内で定めており、切り替えの後に行う点検は、切り替えてよいかを決める材料にならない。モデルから作ったテストデータは、規則の上で起こりうる型を覆えるが、実際に売れている券がどう分かれているかは映さない。規則をモデルに起こして機械でテストデータを作る点と、匿名にする手続きを待たずに開始の時点から照合を進める点は、この案件の条件にそのまま合っており、覆ったことを示せるのだからそれで足りると考えるのは自然である。","この案がつまずくのは、テストデータを実際に売れている券で多く現れる型から用意する点である。切り替えの判定は、金額の出し方の型を覆った結果と、実際に売れている券の分布で今のシステムと金額が一致することの両方を示すよう社内で定めているが、多く現れる型から選んだテストデータと、そこに当てる観点では、数十万通りの型を覆ったことを示せない。観点の一覧を反復ごとに見直して増やしても、どこまで覆えたかを示せる形にはならない。運賃の制度に通じた担当が誤りの出やすい箇所を見当づける進め方そのものは、限られた工数を効かせる筋として実際に採られており、匿名にした写しが整う時期から実際に売れている券の分布にも同じ観点を当てる点は、切り替えの判定のもう一方に向いている。この案は観点の洗い出しを運賃の制度に通じた担当が行うと自ら書いているので、テスト担当8名のうち5名にこの運賃の制度の経験がないことは、この案を退ける根拠にはならない。退ける決め手は、覆ったことを示すという求めのほうである。"],"flip":[null,null,null,null],"flipNote":{"1":"この案が寄りかかっているのは、必要なテストデータが人の手で書ける量に収まっているという前提である。ところが、金額の出し方の型は数十万通りに達することと、型を覆うだけのテストデータを人の手で書くと、その作成だけで期間の大半が消える見込みであることは、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たない。人を足せる、期間を延ばせるといった条件を当てても、数十万通りを人の手で書く作業量そのものは変わらないので、この案が前に出ることはない。","3":"この案に足りないのは、実際に売れている券の分布で今のシステムと金額が一致することを示す部分である。では切り替えの判定が金額の出し方の型を覆った結果だけを求める世界に変えればこの案が採るべき案になるかというと、そうはならない。規則をモデルに起こし、機械で作ったテストデータで型を覆い、匿名にする手続きを待たずに開始の時点から照合を進めるという骨格は、採るべき案と同じものである。求めを1つに減らすと、両者の違いは写しが整う時期から分布での照合を置くかどうかだけになり、それは求められていない作業を行うかどうかの差にすぎないので、どちらを採るかが決まらない。","4":"この案を退けているのは、切り替えの判定は、金額の出し方の型を覆った結果と、実際に売れている券の分布で今のシステムと金額が一致することの両方を示すよう社内で定めている、という一文である。ではその求めを外した世界に変えればこの案が採るべき案になるかというと、そうはならない。2つを示すという切り替えの判定は、テストデータをどう用意するかを選ばせるこの状況の入力そのもので、そこを取り去ると問いが立たない。担当の側を動かしても同じで、テスト担当の全員がこの運賃の制度に通じている世界に変えても、実際に売れている券で多く現れる型から選んだテストデータで、数十万通りを覆ったことを示すことはできない。"},"quote":"テストデータの可用性：テストデータの可用性に関する制約、例えば、本番環境から匿名化されたテストデータが必要である場合や、AI テスト用のデータのように、提供が困難で有効性が必要な特定のテストデータを作成する必要があることを考慮しなければならない。例えば、モデルベースドテストは、テストデータの作成とテストデータのマネジメントをサポートできる。","ref":"1.4.2","misconception":"テストデータの作り方を技法の好みや作業量の問題として選び、その技法が成り立つ条件（規則が届け出た約款として明文化され改定されないこと、期間と担当が置けること）と、材料が手に入る時期（写しは開始から5か月後）と、示すよう求められている2つを、同じ表に載せて突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["人の手でテストデータを書く前提のまま、件数の目標と人の投入で量を積み上げさせる（作成そのものが期間の大半を消すという本文の見積りを読み落とす）","モデルから作ったテストデータで型は覆うが、実際に売れている券の分布での照合を切り替えの後の月次の点検に置き換えさせる（求められている2つのうち1つを欠く）","担当の見当づけによる観点で型の網羅を代えさせる（多く現れる型から用意したテストデータでは、覆った結果を示すという求めに応えられないことを読み落とす）"],"distractorTypes":["D13","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-07"]}},{"id":"q-1.4.2-D-1","lo":"TM-1.4.2","cluster":"1.4.2-D","variant":1,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはウェブで自動車保険を扱う会社のテストマネージャーである。次のリリースには2つの部分が入る。1つは一般の利用者が使う見積と申込の画面の刷新で、会社は申込に至る割合を上げることをゴールに置く。経営は、この画面を全利用者に出すかどうかを、比較で得たその割合の見込みで決めるとしている。この画面は1日に数千件の利用があり、複数の案を振り分けて1週間で比べられる基盤が社内にある。\n\nもう1つは、提携先の自動車販売会社1社の窓口で申込を代行する機能である。契約書には受け入れの基準が22項目として定められ、締結時に確定して変更できず、先方の検収で1つずつ確認される。窓口を使うのは提携先の販売店だけで、1日の利用は数十件にとどまり、振り分けて比べられる件数にならない。\n\n今回の変更に、約款や保険料の算出に関わる部分と、当局への届出を要する部分は含まれない。社内のテストの方針は、届出に関わる変更でない限り文書化の水準をプロジェクトの判断に委ねている。期間は8週間で、要員は4名から増やせない。テストの環境は本番と同じ構成が1式あり、両方に使える。","question":"受け入れの確認を部分ごとにどう設計するかを分析し、採るべきテストアプローチはどれか。1つ選べ。","choices":["2つの案を用意して実際の使い手に振り分け、使いやすさと申込に至る割合を比べる形を、どちらの部分の受け入れの判断にも用いる。契約書の受け入れの基準は、この比較の結果をまとめた報告で満たしたものとする。8週間に収めるため、比較の期間はそれぞれ1週間に区切る。","確認の項目を機能の一覧から起こし、窓口の代行機能については契約書の22項目を1つずつ覆うテストで受け入れを判断する。見積と申込の画面は不具合が残っていないことを確かめたうえで全利用者に出し、申込に至る割合は運用を始めてから月ごとの実績を前の版と比較して見る。8週間は項目の消化を優先して配分する。","要件から個々のテストまでの対応づけを画面ごとに作り、形式的なレビューを経たうえで全機能を覆う確認を、どちらの部分にも行う。保険の商品を扱う以上、記録は当局の照会に備えて残す。申込に至る割合の比較は、この確認を終えたあとに運用のなかで行う。","見積と申込の画面は、複数の案を実際の利用者に振り分け、使いやすさと申込に至る割合の比較で受け入れを判断する。窓口の代行機能は、契約書の22項目を1つずつ覆うテストを作り、先方の検収の前に自社で全項目を通す。限られた期間で回すため、どちらの部分も影響の大きい経路から順に実行する。"],"answer":[3],"explanation":{"signals":"効くのは、会社が見積と申込の画面で申込に至る割合を上げることをゴールに掲げ、経営が全利用者に出すかどうかを比較で得た見込みで決めるとしていること、その画面には1日に数千件の利用があり複数の案を1週間で比べられる基盤が社内にあること、窓口の代行機能には契約書で確定した22項目の受け入れの基準があり先方の検収で1つずつ確認されること、窓口の利用は1日数十件で案を振り分けて比べられる件数にならないこと、今回の変更に約款や保険料の算出に関わる部分と届出を要する部分が含まれず社内の方針が文書化の水準をプロジェクトの判断に委ねていること、期間が8週間で要員を4名から増やせないことである。本番と同じ構成のテストの環境が1式あり両方に使えることは、どの案でも同じなので判断を動かさない。","why":"採るべきは、見積と申込の画面については複数の案を実際の利用者に振り分けて使いやすさと申込に至る割合の比較で受け入れを判断し、窓口の代行機能については契約書の22項目を1つずつ覆うテストを作って先方の検収の前に自社で全項目を通す案である。同じリリースの中で受け入れの確認の中身を作り分けさせているのは、この2つの部分で、何をもって受け入れられたとするかの根拠が違うからである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因としてドメインを挙げ、その例として、ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれないと述べている。プロジェクトのゴールとプロジェクトのタイプの要因では、顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがあるとしている。見積と申込の画面は不特定の利用者に向けた部分で、会社のゴールは申込に至る割合であり、経営はその見込みで全利用者に出すかを決めるとしている。窓口の代行機能は提携先1社に向けた部分で、受け入れの基準は契約書に22項目として確定し、先方の検収で1つずつ確認される。前者の受け入れは比べてはじめて答えが出る問いであり、後者は項目を覆ったかどうかで答えが出る問いである。\n\nどちらの側も、この状況の中で材料がそろっている。見積の画面は1日に数千件の利用があり、複数の案を振り分けて1週間で比べられる基盤が社内にあるので、8週間のうちに比較を回して経営の判断に間に合わせられる。窓口は1日数十件で、同じやり方を持ち込んでも比べられる件数にならない。22項目は契約の締結時に確定していて変更されず、先方の検収でも同じ項目が確認されるので、自社で先に通す対象がぶれない。\n\n厳密さの水準も、この状況から決まる。シラバスはドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があると述べているが、今回の変更に約款や保険料の算出に関わる部分と当局への届出を要する部分は含まれず、社内のテストの方針も、届出に関わる変更でない限り文書化の水準をプロジェクトの判断に委ねている。8週間で要員を増やせない以上、限られた時間は影響の大きい経路から順に当てることになる。","distractors":["この案がつまずくのは、窓口の代行機能にも案を振り分けて比べる形を持ち込み、その結果をまとめた報告で契約書の受け入れの基準を満たしたものとする点である。窓口を使うのは提携先の販売店だけで、1日の利用は数十件にとどまり、案を振り分けて比べられる件数にならないと本文に置かれている。さらにその基準である22項目は締結時に確定して変更できず、先方の検収で1つずつ確認されるので、比較の結果の報告に置き換えられるものではない。見積と申込の画面について振り分けて比べる判断は会社のゴールにも社内の基盤にも合っており、同じ考え方で全体をそろえれば設計も運用も簡単になる。そろえてよいかどうかを分けているのは、利用の件数と、受け入れの根拠が契約書にあるかどうかである。","この案がつまずくのは、見積と申込の画面の受け入れを、不具合が残っていないことの確認だけで済ませ、申込に至る割合の確かめを運用が始まってからの月ごとの実績の比較に回す点である。会社はこの画面で申込に至る割合を上げることをゴールに掲げ、経営は刷新した画面を全利用者に出すかどうかを、比較で得た申込に至る割合の見込みで決めるとしている。出したあとで前の版との実績を比べても、出すかどうかを決める時点にその材料は無い。複数の案を1週間で比べられる基盤が社内にあり、8週間のうちに回せることも使われない。窓口の代行機能について契約書の22項目を1つずつ覆う点は状況に合っており、機能の一覧から確認の項目を起こして消化する進め方も、期間が短いときの管理として通りやすい。","この案がつまずくのは、今回の変更に及んでいない規制を理由に、画面ごとの対応づけと形式的なレビュー、全機能を覆う確認という重い進め方を、どちらの部分にも持ち込む点である。今回の変更に約款や保険料の算出に関わる部分と、当局への届出を要する部分は含まれず、社内のテストの方針も、届出に関わる変更でない限り文書化の水準をプロジェクトの判断に委ねている。シラバスがテストの厳密さや求められる文書化を変える可能性があるとしているのはドメイン固有の規制、標準、慣行であって、保険を扱う会社であることだけから水準が決まるのではない。しかもこの案は申込に至る割合の比較を確認のあとの運用に回すため、経営が全利用者に出すかを決める材料が8週間のうちに出ない。保険という商品を扱う以上、記録を厚く残しておけば当局の照会にも先方の検収にも耐えるという見方は、この業種では実際に語られる。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは、窓口の利用が比べられる件数に満たないことと、契約書の受け入れの基準である22項目が先方の検収で1つずつ確認されることの2つである。窓口の利用が振り分けて比べられるだけの件数に達する状況に変えても、その基準を比較の結果の報告で満たしたものとする扱いは検収に通らない。逆に基準の確認を自社の報告で代えられる契約に変えても、1日数十件では比較そのものが成り立たない。片方を直しても、もう片方が同じようにこの案を退ける。","2":"この案に足りないのは、見積と申込の画面の受け入れを、比べて得た申込に至る割合で判断することである。では経営が全利用者に出すかどうかをその見込みでは決めない状況に置き直せばこの案が採るべき案になるかというと、そうはならない。会社がこの画面で申込に至る割合を上げることをゴールに掲げていることと、複数の案を1週間で比べられる基盤が社内にあることは残るので、受け入れの中身をその割合で確かめる側が引き続き状況に合う。この案が前に出るには、ゴールと基盤の側も一緒に動かす必要がある。","3":"この案が寄りかかっているのは、保険を扱うのだから厳密さと文書化の水準を上げるべきだ、という読みである。今回の変更が当局への届出を要する部分に及ぶ状況に置き換えれば、その水準を上げる筋自体は通る。それでもこの案は、申込に至る割合の比較を確認のあとの運用に回しており、経営が全利用者に出すかを決める材料が8週間のうちに出ないという欠けが残る。届出の有無を動かしても、見積と申込の画面の受け入れの中身を決めそこねている点は直らない。"},"quote":"ドメイン：プロダクトが作成または修正されるドメイン。ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性がある。…ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれない。…顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがある。","ref":"1.4.2","misconception":"受け入れの確認は同じリリースなら1つのやり方にそろえるものだと考え、不特定の利用者に向けた部分と提携先1社に向けた部分とで、受け入れられたと言える根拠が市場での比較と契約書の基準に分かれることを見ていない。あるいは業種の名前だけで厳密さの水準を決め、今回の変更がその規制に及んでいるかを確かめていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["市場向けの部分で正しい比べ方を、提携先1社に向けた部分にもそろえさせる（利用の件数と、受け入れの根拠が契約書にあることを読み落とす）","契約の側の確認の仕方を全体にそろえ、市場向けの部分の受け入れから申込に至る割合の比較を外させる（会社のゴールと、経営が判断に使うと述べた材料を読み落とす）","業種の名前から厳密さと文書化の水準を決めさせる（今回の変更が届出に関わらないことと、文書化の水準がプロジェクトの判断に委ねられていることを読み落とす）"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-32"]}},{"id":"q-1.4.2-D-2","lo":"TM-1.4.2","cluster":"1.4.2-D","variant":2,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはオンラインの宿泊予約を扱う会社のテストマネージャーである。次のリリースには2つの部分が入る。\n\n一般の利用者が使う検索と予約の画面\n・刷新の狙いは、会社が掲げる予約に至る割合を上げることである\n・経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしている\n・この画面は1日に2万件ほど使われ、複数の案を利用者に振り分けて10日で比べられる仕組みが社内にある\n\n提携先の旅行代理店1社に向けた法人予約の代行機能\n・協定の契約書に受け入れの基準が18項目として書かれ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる\n・この機能を使うのは提携先の営業所だけで、1日の利用は30件ほどにとどまり、案を振り分けて比べられる件数にならない\n\n共通の条件\n・今回の変更に、取引の条件の表示と宿泊の約款に関わる部分と、観光庁への届出を要する部分は含まれない\n・社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている\n・期間は10週間で、人は5名から増やせない\n・テストの環境は本番と同じ構成が2式あり、どちらの部分にも使える","question":"受け入れの確認を部分ごとにどう設計するかを分析し、テストアプローチとして最も適切なものはどれか。1つ選べ。","choices":["検索と予約の画面については、複数の案を実際の使い手に割り当てて、使いやすさと予約に至る割合を比べ、その結果で受け入れを決める。法人予約の代行機能については、契約書に書かれた受け入れの基準を1項目ずつ覆うテストを用意し、先方の検収の手前で、自社が全項目を通しておく。期間が限られるので、どちらの部分でも利用の多い経路を先に流す。","要件から個々のテストまでの対応づけを画面ごとに作り、形式ばったレビューを通したうえで、全機能を覆う確認をどちらの部分にも行う。旅行の取引を扱う以上、記録は行政の照会に備えて厚く残す。予約に至る割合の比べ合いは、この確認を終えたあとの運用のなかで行う。","2つの案を用意して実際の使い手に割り当て、使いやすさと予約に至る割合を比べる形を、どちらの部分の受け入れの判断にも用いる。契約書に書かれた受け入れの基準は、この比べ合いの結果をまとめた報告で満たしたものとする。10週間に収めるため、比べる期間はそれぞれ10日に区切る。","確認の項目を機能の一覧から起こし、法人予約の代行機能については契約書に書かれた受け入れの基準を1項目ずつ覆うテストで受け入れを決める。検索と予約の画面は不具合が残っていないことを確かめたうえで全利用者に出し、予約に至る割合は運用を始めてから月ごとの実績を前の版と比べて見る。期間は項目の消化を優先して配分する。"],"answer":[0],"explanation":{"signals":"効くのは、刷新の狙いは、会社が掲げる予約に至る割合を上げることであること、経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしていること、この画面は1日に2万件ほど使われ、複数の案を利用者に振り分けて10日で比べられる仕組みが社内にあること、協定の契約書に受け入れの基準が18項目として書かれ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられること、この機能を使うのは提携先の営業所だけで、1日の利用は30件ほどにとどまり、案を振り分けて比べられる件数にならないこと、今回の変更に、取引の条件の表示と宿泊の約款に関わる部分と、観光庁への届出を要する部分は含まれないこと、社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねていること、そして、期間は10週間で、人は5名から増やせないことである。テストの環境が本番と同じ構成で2式あり、どちらの部分にも使えることは、どの案でも同じなので判断を動かさない。","why":"取るべき形は、検索と予約の画面については複数の案を実際の使い手に割り当てて使いやすさと予約に至る割合を比べ、その結果で受け入れを決め、法人予約の代行機能については契約書に書かれた受け入れの基準を1項目ずつ覆うテストを用意して、先方の検収の手前で、自社が全項目を通しておく、という作り分けである。同じリリースの中で受け入れの確認の中身を分けさせているのは、この2つの部分で、何をもって受け入れられたとするかの根拠が違うからである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因としてドメインを挙げ、その例として、ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれないと述べている。プロジェクトのゴールとプロジェクトのタイプの要因では、顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがあるとしている。検索と予約の画面は不特定の利用者に向けた部分で、刷新の狙いは、会社が掲げる予約に至る割合を上げることである。そのうえ、経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしている。法人予約の代行機能は提携先1社に向けた部分で、協定の契約書に受け入れの基準が18項目として書かれ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる。前者の受け入れは比べてはじめて答えの出る問いであり、後者は項目を覆ったかどうかで答えの出る問いである。\n\nどちらの側も、この状況の中で材料がそろっている。この画面は1日に2万件ほど使われ、複数の案を利用者に振り分けて10日で比べられる仕組みが社内にあるので、経営の判断に間に合う形で比べ合いを回せる。一方、この機能を使うのは提携先の営業所だけで、1日の利用は30件ほどにとどまり、案を振り分けて比べられる件数にならないのだから、同じやり方を持ち込んでも答えが出ない。契約書の基準は締結の時に確定していて変えられないので、自社で先に通す対象もぶれない。\n\n厳密さの水準も、この状況から決まる。シラバスはドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるとしているが、今回の変更に、取引の条件の表示と宿泊の約款に関わる部分と、観光庁への届出を要する部分は含まれない。社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。そのうえ期間は10週間で、人は5名から増やせないのだから、限られた時間は利用の多い経路から先に当てることになる。","distractors":[null,"この案がつまずくのは、今回の変更が及んでいない規制を持ち出して、画面ごとの対応づけと形式ばったレビュー、全機能を覆う確認という重い進め方を、どちらの部分にも当てる点である。今回の変更に、取引の条件の表示と宿泊の約款に関わる部分と、観光庁への届出を要する部分は含まれない。社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。シラバスが、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるとしているのはドメイン固有の規制、標準、慣行であって、旅行の取引を扱う会社であることだけから水準が決まるのではない。しかもこの案は予約に至る割合の比べ合いを確認のあとの運用に回すので、経営が全利用者に出すかを決める材料が出そろわない。記録を厚く残しておけば行政の照会にも先方の検収にも耐えるという見方は、この業種では実際に語られる。","この案がつまずくのは、法人予約の代行機能にも案を割り当てて比べる形を持ち込み、その結果をまとめた報告で契約書の受け入れの基準を満たしたものとする点である。この機能を使うのは提携先の営業所だけで、1日の利用は30件ほどにとどまり、案を振り分けて比べられる件数にならないと本文が置いている。さらに、協定の契約書に受け入れの基準が18項目として書かれ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられるのだから、比べ合いの結果の報告に置き換えられるものではない。検索と予約の画面について割り当てて比べる判断は会社の狙いにも社内の仕組みにも合っており、同じ考え方で全体をそろえれば設計も運用も簡単になる。そろえてよいかどうかを分けているのは、利用の件数と、受け入れの根拠が契約書にあるかどうかである。","この案がつまずくのは、検索と予約の画面の受け入れを不具合の有無の確かめだけで済ませ、予約に至る割合の確かめを運用が始まってからの月ごとの実績の比べ合いに回す点である。刷新の狙いは、会社が掲げる予約に至る割合を上げることであり、経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしている。出したあとで前の版との実績を比べても、出すかどうかを決める時点にその材料は無い。この画面は1日に2万件ほど使われ、複数の案を利用者に振り分けて10日で比べられる仕組みが社内にあることも使われない。法人予約の代行機能について契約書の基準を1項目ずつ覆う点は状況に合っており、機能の一覧から確認の項目を起こして消化する進め方も、期間が短いときの管理として通りやすい。"],"flip":[null,null,null,null],"flipNote":{"2":"この案が寄りかかっているのは、旅行の取引を扱うのだから厳密さと文書に残す水準を上げるべきだ、という読みである。ここで効いている与件は1つ、届出の及ぶ範囲である。今回の変更に、取引の条件の表示と宿泊の約款に関わる部分と、観光庁への届出を要する部分は含まれない。文書の水準の決め方はその範囲に従っていて、社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。だから今回の変更が届出に及ぶ状況に置き換えれば、2つは同時に動き、水準を上げる筋自体は通る。それでもこの案が前に出ないのは、3つ目の事情による ── 予約に至る割合の比べ合いを、確認を終えたあとの運用に回している点である。経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしているので、届出の有無をどう動かしても、10週間のうちにその材料が出ないという欠けは残る。検索と予約の画面の受け入れの中身を決めそこねている点は、届出の側の条件では直らない。","3":"この案を退けているのは、利用の件数と契約書の基準の2つである。この機能を使うのは提携先の営業所だけで、1日の利用は30件ほどにとどまり、案を振り分けて比べられる件数にならない。また、協定の契約書に受け入れの基準が18項目として書かれ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる。利用が比べられるだけの件数に届く状況に変えても、その基準を比べ合いの報告で満たしたものとする扱いは検収に通らない。逆に基準の確認を自社の報告で代えられる契約に変えても、1日30件ほどでは比べ合いそのものが成り立たない。片方を直しても、もう片方が同じようにこの案を退ける。","4":"この案に足りないのは、検索と予約の画面の受け入れを、比べて得た予約に至る割合で決めることである。では、経営は、この画面を全利用者に出すかどうかを、比べて得たその割合の見込みで決めるとしている、という与件を置き直せばこの案が採るべき案になるかというと、そうはならない。刷新の狙いは、会社が掲げる予約に至る割合を上げることであり、この画面は1日に2万件ほど使われ、複数の案を利用者に振り分けて10日で比べられる仕組みが社内にあることも残るので、受け入れの中身をその割合で確かめる側が引き続き状況に合う。この案が前に出るには、狙いと仕組みの側も一緒に動かす必要があり、それは条件を1つ動かすことではない。"},"quote":"ドメイン：プロダクトが作成または修正されるドメイン。ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性がある。…ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれない。…顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがある。","ref":"1.4.2","misconception":"受け入れの確かめ方は同じリリースなら1つにそろえるものだと考えて、不特定の利用者に向けた部分と提携先1社に向けた部分とで受け入れられたと言える根拠が分かれることを見ていない。あるいは業種の名前だけで厳密さと文書の水準を決め、今回の変更がその届出に及んでいるかを確かめていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["業種の名前から厳密さと文書の水準を決めさせる（今回の変更が届出に関わらないことと、水準がプロジェクトの判断に委ねられていることを読み落とす）","市場向けの部分で正しい比べ方を、提携先1社に向けた部分にもそろえさせる（利用の件数と、受け入れの根拠が契約書にあることを読み落とす）","契約の側の確かめ方を全体にそろえ、市場向けの部分の受け入れから予約に至る割合の比べ合いを外させる（会社の狙いと、経営が判断に使うと述べた材料を読み落とす）"],"distractorTypes":["D2","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-32"]}},{"id":"q-1.4.2-D-3","lo":"TM-1.4.2","cluster":"1.4.2-D","variant":3,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは求人と応募を扱うサイトの会社のテストマネージャーである。次のリリースには2つの部分が入る。1つは、一般の求職者が使う求人の検索と応募の画面の作り直しで、会社は応募に至る割合を上げることをゴールに置く。経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしている。この画面は1日に1万件ほど使われ、複数の案を求職者に振り分けて2週間で比べられる仕組みが社内にある。\n\nもう1つは、提携先の大学1校のキャリアセンターに向けて、学内の求人票を取り込んで学生の応募を取り次ぐ機能である。協定の契約書には受け入れの基準が書き並べられ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる。この機能を使うのはその大学の職員と学生だけで、1日の利用は40件ほどにとどまり、案を振り分けて比べられる件数にならない。\n\n今回の前提\n・今回の変更に、紹介の手数料の表示と労働の条件の明示に関わる部分と、行政への届出を要する部分は含まれない\n・社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている\n・期間は6週間で、人は3名から増やせない\n・テストの環境は本番と同じ構成が1式あり、どちらの部分にも使える","question":"部分ごとに受け入れの確かめ方をどう設計するかを分析し、採るべきテストアプローチはどれか。1つ選べ。","choices":["確認の項目は機能の一覧から起こす。応募を取り次ぐ機能は、契約書の受け入れの基準を1項目ずつ覆うテストで受け入れを決める。求人の検索と応募の画面は、残っている不具合が無いことを確かめてから全利用者に出し、応募に至る割合は運用に入ってから月ごとの実績を前の版と比べる。期間の配分は項目の消化を先にする。","要件から個々のテストまでの対応づけをどちらの部分にも作り、形式ばったレビューを経てから全機能を覆う確認を行う。人の就職に関わる情報を扱うのだから、記録は行政の照会に備えて厚く残す。応募に至る割合の比べ合いは、その確認が済んだあとの運用のなかで見る。","求人の検索と応募の画面は、複数の案を実際の求職者に振り分けて、使いやすさと応募に至る割合を比べ、比べた結果で受け入れを決める。応募を取り次ぐ機能は、契約書の受け入れの基準を1項目ずつ覆うテストをそろえ、先方の検収を受ける前に自社で通しておく。日数が足りないので、二つの部分とも、止まると困る流れから先に当てる。","複数の案を実際の使い手に振り分け、使いやすさと応募に至る割合を比べる形を、どちらの部分の受け入れの判断にも当てる。契約書の受け入れの基準は、この比べ合いの結果をまとめた報告で満たしたものとする。6週間に収めるため、比べる期間はそれぞれ2週間に区切る。"],"answer":[2],"explanation":{"signals":"効くのは、会社は応募に至る割合を上げることをゴールに置くこと、経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしていること、この画面は1日に1万件ほど使われ、複数の案を求職者に振り分けて2週間で比べられる仕組みが社内にあること、協定の契約書には受け入れの基準が書き並べられ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられること、この機能を使うのはその大学の職員と学生だけで、1日の利用は40件ほどにとどまり、案を振り分けて比べられる件数にならないこと、今回の変更に、紹介の手数料の表示と労働の条件の明示に関わる部分と、行政への届出を要する部分は含まれないこと、社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねていること、そして、期間は6週間で、人は3名から増やせないことである。テストの環境が本番と同じ構成で1式あり、どちらの部分にも使えることは、どの案でも同じなので判断を動かさない。","why":"適しているのは、求人の検索と応募の画面については複数の案を実際の求職者に振り分けて使いやすさと応募に至る割合を比べ、比べた結果で受け入れを決め、応募を取り次ぐ機能については契約書の受け入れの基準を1項目ずつ覆うテストをそろえて、先方の検収を受ける前に自社で通しておく、という作り分けである。同じリリースの中で受け入れの確かめ方を分けさせているのは、この2つの部分で、何をもって受け入れられたとするかの根拠が違うからである。\n\nシラバスは、適切なテストアプローチを選択するために分析しなければならない要因としてドメインを挙げ、その例として、ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれないと述べている。プロジェクトのゴールとプロジェクトのタイプの要因では、顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがあるとしている。求人の検索と応募の画面は不特定の利用者に向けた部分で、会社は応募に至る割合を上げることをゴールに置く。そのうえ、経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしている。応募を取り次ぐ機能は提携先1校に向けた部分で、協定の契約書には受け入れの基準が書き並べられ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる。前者の受け入れは比べてはじめて答えの出る問いであり、後者は項目を覆ったかどうかで答えの出る問いである。\n\nどちらの側も、この状況の中で材料がそろっている。この画面は1日に1万件ほど使われ、複数の案を求職者に振り分けて2週間で比べられる仕組みが社内にあるので、経営の判断に間に合う形で比べ合いを回せる。一方、この機能を使うのはその大学の職員と学生だけで、1日の利用は40件ほどにとどまり、案を振り分けて比べられる件数にならないのだから、同じやり方を持ち込んでも答えが出ない。\n\n厳密さの水準も、この状況から決まる。シラバスはドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるとしているが、今回の変更に、紹介の手数料の表示と労働の条件の明示に関わる部分と、行政への届出を要する部分は含まれない。社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。そのうえ期間は6週間で、人は3名から増やせないのだから、限られた時間は止まると困る流れから先に当てることになる。","distractors":["この案がつまずくのは、求人の検索と応募の画面の受け入れを不具合の有無の確かめだけで済ませ、応募に至る割合の確かめを運用に入ってからの月ごとの実績に回す点である。会社は応募に至る割合を上げることをゴールに置く。そのうえ、経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしている。出したあとで前の版との実績を比べても、出すかどうかを決める時点にその材料は無い。この画面は1日に1万件ほど使われ、複数の案を求職者に振り分けて2週間で比べられる仕組みが社内にあることも使われない。応募を取り次ぐ機能について契約書の基準を1項目ずつ覆う点は状況に合っており、機能の一覧から確認の項目を起こして消化する進め方も、日数が短いときの管理として通りやすい。","この案がつまずくのは、今回の変更が及んでいない規制を持ち出して、両方の部分に対応づけと形式ばったレビュー、全機能を覆う確認という重い進め方を当てる点である。今回の変更に、紹介の手数料の表示と労働の条件の明示に関わる部分と、行政への届出を要する部分は含まれない。社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。シラバスが、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性があるとしているのはドメイン固有の規制、標準、慣行であって、人の就職に関わる情報を扱うことだけから水準が決まるのではない。しかもこの案は応募に至る割合の比べ合いを確認のあとの運用に回すので、経営が全利用者に出すかを決める材料が出そろわない。記録を厚く残しておけば行政の照会にも先方の検収にも耐えるという見方は、この業種では実際に語られる。",null,"この案がつまずくのは、応募を取り次ぐ機能にも案を振り分けて比べる形を当て、その結果をまとめた報告で契約書の受け入れの基準を満たしたものとする点である。この機能を使うのはその大学の職員と学生だけで、1日の利用は40件ほどにとどまり、案を振り分けて比べられる件数にならないと本文が置いている。さらに、協定の契約書には受け入れの基準が書き並べられ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられるのだから、比べ合いの結果の報告に置き換えられるものではない。求人の検索と応募の画面について振り分けて比べる判断は会社のゴールにも社内の仕組みにも合っており、同じ考え方で全体をそろえれば設計も運用も簡単になる。そろえてよいかどうかを分けているのは、利用の件数と、受け入れの根拠が契約書にあるかどうかである。"],"flip":[null,null,null,null],"flipNote":{"1":"この案に足りないのは、求人の検索と応募の画面の受け入れを、比べて得た応募に至る割合で決めることである。では、経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしている、という与件を置き直せばこの案が採るべき案になるかというと、そうはならない。会社は応募に至る割合を上げることをゴールに置くのであり、この画面は1日に1万件ほど使われ、複数の案を求職者に振り分けて2週間で比べられる仕組みが社内にあることも残るので、受け入れの中身をその割合で確かめる側が引き続き状況に合う。この案が前に出るには、ゴールと仕組みの側も一緒に動かす必要があり、それは条件を1つ動かすことではない。","2":"この案が寄りかかっているのは、人の就職に関わる情報を扱うのだから厳密さと文書に残す水準を上げるべきだ、という読みである。ここで効いている与件は1つ、届出の及ぶ範囲である。今回の変更に、紹介の手数料の表示と労働の条件の明示に関わる部分と、行政への届出を要する部分は含まれない。文書の水準の決め方はその範囲に従っていて、社内のテストの方針は、届出に関わる変更でない限り、文書に残す水準をプロジェクトの判断に委ねている。だから今回の変更が届出に及ぶ状況に置き換えれば、2つは同時に動き、水準を上げる筋自体は通る。それでもこの案が前に出ないのは、3つ目の事情による ── 応募に至る割合の比べ合いを、その確認が済んだあとの運用に回している点である。経営は、この画面を全利用者に出すかどうかを、案を比べて得たその割合の見込みで決めるとしているので、届出の有無をどう動かしても、6週間のうちにその材料が出ないという欠けは残る。求人の検索と応募の画面の受け入れの中身を決めそこねている点は、届出の側の条件では直らない。","4":"この案を退けているのは、利用の件数と契約書の基準の2つである。この機能を使うのはその大学の職員と学生だけで、1日の利用は40件ほどにとどまり、案を振り分けて比べられる件数にならない。また、協定の契約書には受け入れの基準が書き並べられ、締結の時に確定していて変えられず、先方の検収で1項目ずつ確かめられる。利用が比べられるだけの件数に届く状況に変えても、その基準を比べ合いの報告で満たしたものとする扱いは検収に通らない。逆に基準の確認を自社の報告で代えられる協定に変えても、1日40件ほどでは比べ合いそのものが成り立たない。片方を直しても、もう片方が同じようにこの案を退ける。"},"quote":"ドメイン：プロダクトが作成または修正されるドメイン。ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性がある。…ウェブベースの保険アプリケーションのユーザー受け入れテストは、A/B テストを通じて、使用性と新規保険契約の可能性を高めることに焦点を当てるかもしれない。…顧客向けに特化したプロダクト開発では、事前に定義された契約による受け入れ基準をカバーするテストが必要になることがある。","ref":"1.4.2","misconception":"1つのリリースなら受け入れの確かめ方は1つにそろうはずだと考えて、不特定の求職者に向けた部分と提携先1校に向けた部分とで受け入れられたと言える根拠が分かれることを見ていない。あるいは扱う情報の重さだけで文書の水準を決め、今回の変更がその届出に及んでいるかを確かめていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","distractorIntent":["契約の側の確かめ方を全体にそろえ、市場向けの部分の受け入れから応募に至る割合の比べ合いを外させる（会社のゴールと、経営が判断に使うと述べた材料を読み落とす）","扱う情報の重さから厳密さと文書の水準を決めさせる（今回の変更が届出に関わらないことと、水準がプロジェクトの判断に委ねられていることを読み落とす）","市場向けの部分で正しい比べ方を、提携先1校に向けた部分にもそろえさせる（利用の件数と、受け入れの根拠が契約書にあることを読み落とす）"],"distractorTypes":["D3","D2","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-32"]}},{"id":"q-1.4.3-A-1","lo":"TM-1.4.3","cluster":"1.4.3-A","variant":1,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは私立大学の履修登録システムを刷新するプロジェクトのテストマネージャーである。履修登録の確定は、教務基幹システムの履修データ更新と、外部の学費収納サービスへの納入状況照会を経る。学費収納サービスには検証用の接続先があり、照会の応答は本番と同じ平均2秒で、本プロジェクトでは改善できない。\n\n教務部長からは「4月の履修登録が集中しても止まらず、速く動くシステムにしてほしい」と伝えられている。プロジェクトのゴールは、履修登録の期間に窓口へ回る問い合わせを前年より増やさないことだと合意されている。\n\nテスト担当は3名。応答時間を測れる検証環境は1系統で、負荷ツールで測れるのはそこに置いた自大学のシステムに限られる。システムテストは3月20日に終える計画である。前年、同時に操作した学生は最多の時間帯で1,200人前後であった。","question":"教務部長の要望を書き直した次の案のうち、スマートの法則を適用したテスト目的として最も適切なものはどれか。","choices":["教務基幹システムと学費収納サービスへの連携を含めた履修登録の確定処理が、同時3,000人でも1秒以内に応答することを、3月20日までに確認すること","履修登録の確定までの一連の処理で、同時1,500人の応答が3秒以内であることを、3月20日までに確認すること","他大学が導入している同種のシステムと比べて、履修登録の応答が2割以上速く、より安定して動くことを、3月20日までに確認すること","履修登録の確定処理について、性能に関する3つの指標がいずれも基準値を満たしていることを、リリース前までに確認すること"],"answer":[1],"explanation":{"signals":"判断を分けるのは、確定処理が通る経路と、検証側にできることである。履修登録の確定が学費収納サービスへの納入状況照会を経ること、その照会は検証用の接続先でも本番と同じ平均2秒で本プロジェクトでは改善できないこと、応答時間を測れる検証環境が1系統で、負荷ツールで測れるのはそこに置いた自大学のシステムに限られること ── この3点が、案の掲げる水準にこのプロジェクトの手が届くか、そもそも測れるか（A）の物差しになる。前年の最も多い時間帯で同時1,200人前後という実績は、掲げる同時利用数が見込みの延長にあるかの目安である。合意されたゴール、すなわち履修登録の期間に窓口へ回る問い合わせを前年より増やさないことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になり、システムテストを3月20日に終える計画は、完了期限（T）を日付で書ける状態にあることを示す。テスト担当が3名であることは、どの案の当否も分けない。","why":"書き直しとして採るべきは、履修登録の確定までの一連の処理について、同時1,500人の応答が3秒以内であることを3月20日までに確認する、と置いた案である。手の届く水準を決めているのは、確定処理が必ず経由する学費収納サービスへの照会で、この照会だけで応答は平均2秒かかり、検証用の接続先でも本番と同じで、本プロジェクトでは改善できない。\nシラバスは A（達成可能な）を「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」と定めている。3秒という水準は、縮められない照会の2秒を含んだうえで残りを自大学側の処理に充てられる幅であり、同時1,500人も前年の最も多い時間帯の1,200人前後の延長にある。しかも照会先には検証用の接続先が用意されているので、外部を含めた経路のまま負荷をかけて測れる。測る条件を1本に絞っているため、検証環境が1系統でも3月20日までに実施できる。ここで A が立つ。\n残る要素も原文の定義にそのまま当たる。測る対象を「履修登録の確定までの一連の処理」と書いているので S（「明確あるべきで曖昧ではないものであるべきである」）が立ち、同時1,500人・応答3秒以内という、達成したかどうかを判断できる進捗基準を持つので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。R（「プロジェクト全体の目的に沿ったものでなければならない」）を測る物差しになるのは、このプロジェクトで合意されているゴール ── 履修登録の期間に窓口へ回る問い合わせを前年より増やさないこと ── である。履修登録が集中する時間帯に確定処理が返ってくるかどうかを測るこの案は、そのゴールに沿っており、R が立つ。3月20日という完了期限があるので T（「具体的な時間枠と完了期限を定めるべきである」）も立つ。\n止まらないことと速いことは、教務部長から伝えられた要望であって、合意されたゴールそのものではない。しかも要望のほうは、測る対象も水準も期限も置いていない。書き直すとは、その要望を、合意されたゴールを崩さないために保つべき水準として、状況の側の数値に置き直すことである。","distractors":["落ちるのは A（達成可能な）である。この案は学費収納サービスへの照会を含む確定処理を対象にしているが、その照会だけで応答に平均2秒かかり、検証用の接続先でも本番と同じで、本プロジェクトでは改善できない。照会を含む処理が1秒以内に応答することは、この系の「能力」では実現しない。同時3,000人が前年の最大1,200人前後の倍を超える点も見込みからの乖離を示すが、落とす決め手は照会の2秒のほうである。対象も期限も数値も揃っていて、正解の案より高い水準を掲げているぶん良い案に見えるのがこの案の吸引力だが、数値が入っていることと達成できることは別であり、シナリオの数値と突き合わせて初めて落とせる。",null,"落ちるのは S（具体的な）と A（達成可能な）である。比べる相手が「他大学が導入している同種のシステム」としか書かれておらず、どの大学のどのシステムを指すのかが定まらない。「より安定して動く」にも基準が置かれていない。ここで S を欠く。測る手段の側も、他大学のシステムは本プロジェクトの管理下になく、シナリオは負荷ツールで測れるのは検証環境に置いた自大学のシステムに限られると明記している。同じ負荷・同じ経路で相手方を測る手立てがこのプロジェクトに無いので A も欠ける。人や環境を足せば済む話ではない。他と比べるという形が基準のあるように読ませるのが吸引力だが、基準の所在が外にあることと、基準が定まっていることは違う。なお、速く安定して動くという方向そのものは教務部長が伝えた要望の側にあるもので、窓口へ回る問い合わせを前年より増やさないという合意されたゴールから外れる向きでもない。この案が落ちているのは R（妥当な）ではない。","落ちるのは S（具体的な）と T（タイムリーな）である。「性能に関する3つの指標」が何であるかも、「基準値」がいくつであるかも、この文からは定まらない。入っている数字は指標の個数であって達成の水準ではないので、測る対象を履修登録の確定処理と書いていても S は立たない。期限のほうも、「リリース前までに」では、シラバスが T に求める「具体的な時間枠と完了期限」にならない。シナリオはシステムテストを3月20日に終えると置いており、日付で書ける状態にありながら工程の手前を漠然と指している。指標の個数と「基準値」という言い方が、どこかに定義が用意されているかのように読ませるのが、この案の吸引力である。"],"flip":[null,null,null,null],"flipNote":{"1":"この案が A（達成可能な）を満たすには、履修登録の確定処理の経路から学費収納サービスへの照会が外れるか、その平均2秒が1秒を大きく下回るまで縮む必要がある。ただしその条件を置いても、同時1,500人で3秒以内と書いた案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。この案だけが残る形にするには、前年の同時利用が3,000人規模であったという条件まで併せて要り、動かす条件が2つになる。","3":"比べる相手を特定の製品に定めても、「より安定して動く」に基準が置かれていないので、S（具体的な）はなお立たない。S を立てるには、相手を定めることと、どこまで揺れなければ達成なのかを数で置くことの2か所を、案の文面の側で書き直す必要がある。さらに、その相手が本プロジェクトの管理下になく、負荷ツールで測れるのが検証環境に置いた自大学のシステムに限られることは、それでは変わらない。同じ条件で測った相手の応答時間が手に入るという条件まで置いて初めて A（達成可能な）が立つので、動かすところは S だけで2か所、A で1か所の合わせて3つになる。しかもその3つを置いても、同時1,500人で3秒以内と書いた案は5つの要素を満たしたまま残る。","4":"3つの指標が何かと基準値を書き出せば S（具体的な）が立ち、完了期限を3月20日のように日付で示せば T（タイムリーな）が立つ。ただしそれは状況の側の条件を動かすことではなく案そのものを書き直すことであり、しかも2つを同時に行う必要がある。書き直したあとも、同時1,500人で3秒以内と書いた案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値が書かれていることをもって測定可能だと判断し、その水準にこの系の能力で到達できるか、そもそもこのプロジェクトの環境で測れるか（A）をシナリオの条件と突き合わせないまま、最も高い水準を掲げた案を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「同時3,000人でも1秒以内」の案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、改善できない外部照会（検証用の接続先でも平均2秒）を含む処理は1秒以内に到達しない。シナリオの明示条件1つだけで落ちる","「他大学の同種システムより2割速く、より安定して」の案: S（具体的な）と A（達成可能な）が欠ける。比べる相手が定まらず、「より安定」に基準が無く、他大学のシステムは管理外で、測れるのは自大学のシステムに限られると明記されている","「リリース前までに3つの指標が基準値を満たす」の案: S（具体的な）と T（タイムリーな）が欠ける。指標の中身と基準値が定まらず、完了期限が日付ではなく工程の手前で示されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-A-2","lo":"TM-1.4.3","cluster":"1.4.3-B","variant":1,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは物流倉庫のピッキング用ハンディ端末アプリを刷新するプロジェクトのテストマネージャーである。\n\nプロジェクトのゴールは、繁忙期に作業員を増やさず出荷量をさばききることと、棚と品目の取り違えによる出荷の誤りを前年より減らすことの2つと合意されている。情報システム部から端末とサーバ間の通信量を減らす要望も出ているが、今回のゴールには含めない。\n\n・テスト担当は2名。実機は5台まで借りられ、倉庫での検証は週2日の夜間のみ\n・指示の投入から完了応答までは検証用の仕組みで自動化でき、実機で受けられる。取り違えの確認は作業員役が実機で行う\n・受け入れテストは11月15日に終える\n・前年の繁忙期はピーク1時間に1,100件前後の指示を処理し、取り違えによる出荷の誤りは指示件数の0.8%前後だった\n・今年の繁忙期の始まりはまだ読めていない","question":"次のテスト目的の候補のうち、スマートの法則を使用したとき5つの要素をすべて満たすものはどれか。","choices":["11月15日までに、1時間あたり1,200件のピッキング指示を実機5台で処理し、指示された棚と品目の取り違えによる誤りが0.5%未満にとどまることを確認すること","11月15日までに、テストで新たに見つかる欠陥が3週続けて週20件を下回ったことをもって、ピッキング指示の棚と品目の取り違えが起きにくくなっていることを確認すること","11月15日までに、端末とサーバ間の1日あたりの通信量が、新アプリでは現行の7割以下に収まっていることをサーバ側の通信ログで確認すること","繁忙期が始まるまでに、ピッキング1件あたりの所要時間が現行より15%短くなっていることを、倉庫の実機で確認すること"],"answer":[0],"explanation":{"signals":"まず効くのは、ゴールとして合意された範囲である。繁忙期に作業員を増やさず出荷量をさばききることと、棚と品目の取り違えによる出荷の誤りを前年より減らすことがゴールで、情報システム部から出ている通信量の削減は今回のゴールには含めないと明記されている ── これが妥当性（R）の判定基準になる。次に、テスト担当2名・実機5台まで・倉庫での検証は週2日の夜間という枠と、指示の投入から完了応答までは検証用の仕組みで自動化でき実機で受けられること、取り違えの確認は作業員役が実機で行うことが、掲げた水準を実際に確かめられるか（A）を決める。前年の繁忙期はピーク1時間に1,100件前後、取り違えによる誤りは指示件数の0.8%前後という実績は、目標値が届く範囲にあり、かつ前年より減らす方向にあるかの物差しになる。受け入れテストを11月15日に終えることは完了期限（T）を日付で書ける状態にあることを示し、今年の繁忙期の始まりが読めていないことは、繁忙期を期限の代わりに使えないことを示す。","why":"採るべきは、合意されたゴールをそのまま数に直した案である。繁忙期に作業員を増やさず出荷量をさばききるという1つ目は、1時間あたり1,200件のピッキング指示を実機5台で処理することに、棚と品目の取り違えによる出荷の誤りを前年より減らすという2つ目は、取り違えによる誤りが0.5%未満にとどまることに置き換えられ、期限は受け入れテストの終了日である11月15日に置かれている。シラバスが R（妥当な）に求める「プロジェクト全体の目的に沿ったものでなければならない」は、この対応関係でそのまま満たされる。\n掲げた数字に手が届くことも、状況の側が支えている。前年の繁忙期のピークが1時間1,100件前後だから1,200件は見込みの延長にあり、指示の投入から完了応答までは検証用の仕組みで自動化でき実機で受けられるので、1時間規模の計測は人手に依らず、担当2名・倉庫は週2日の夜間という枠にも収まる。取り違えの確認は作業員役が実機で行うと定められており、前年の0.8%前後に対する0.5%未満は、分母を同じ指示件数に揃えたうえで減らす方向にある水準である。分母が揃っているから、指示あたりの取り違えが減れば出荷の誤りも減る。ここでシラバスが A（達成可能な）に求める「リソースの可用性、時間枠、能力を考慮し、実現可能」が立つ。\n残る要素も原文の定義どおりに読める。測る対象をピッキング指示の処理件数と取り違えによる誤りに絞っているので S（「明確あるべきで曖昧ではないものであるべきである」）、1時間1,200件と0.5%未満という進捗基準を置いているので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）、11月15日という完了期限があるので T（「具体的な時間枠と完了期限を定めるべきである」）が立つ。残る3案は、数値と期限を備えていても、測る手段が対象を測っていない、ゴールに含めないと合意した指標を据えている、期限を日付で置いていない、という形で外れる。","distractors":[null,"落ちるのは M（測定可能な）である。シラバスが M に求めているのは「達成状況を判断するための具体的な進捗基準」で、測る手段が測りたい対象を測っていなければ、数値が入っていても成立しない。テストで新たに見つかる欠陥の件数は、テストの進み具合やどこを重点的に試したかで増減する数であって、作業員が棚と品目を取り違える頻度を表さない。取り違えの起きにくさを知りたいのであれば取り違えそのものを数える必要があり、シナリオは作業員役が実機で確認するという手段を用意している。欠陥が減ってきたことを品質の目安にするのは現場でよく行われており、3週続けて週20件という数値も11月15日という期限も入っているため、測れているように読めるのがこの案の吸引力である。","落ちるのは R（妥当な）である。シラバスは R を「プロジェクト全体の目的に沿ったものでなければならない」と定めているが、このプロジェクトのゴールは出荷量をさばききることと取り違えによる誤りを減らすことであり、通信量の削減は「今回のゴールには含めない」とシナリオに明記されている。現行の7割以下という水準も、11月15日という期限も、サーバ側の通信ログという測る手段も揃っており、しかも情報システム部から実際に出ている要望なので、目的として通る案に見える。だが、ステークホルダーから要望が出ていることと、それがプロジェクトの目的に組み込まれていることは別であり、この案を追うと、測れて達成もできるのに合意したゴールの達成度を何も語らない数字が残る。","落ちるのは T（タイムリーな）である。シラバスは T を「具体的な時間枠と完了期限を定めるべきである」と定めているが、「繁忙期が始まるまでに」はいつまでに終えるのかを示していない。今年の繁忙期の始まりはまだ読めていないとシナリオに明記されているので、この書き方は日付に置き換わらない。受け入れテストの完了は11月15日と決まっており、期限を書ける状態にありながら書いていない。現行との比較で15%という基準を置き、測る対象も1件あたりの所要時間として定まっており、倉庫の実機で確かめるという手段も現実的であるぶん、期限だけが抜けていることに気づきにくい。"],"flip":[null,null,"今回のプロジェクトのゴールが、繁忙期に出荷量をさばききることと取り違えによる誤りを減らすことではなく、端末とサーバ間の通信量を減らすことだと合意されているのであれば、この案は R（妥当な）が立ち、5つの要素をすべて満たす唯一の案になる。そのとき、1時間あたりの処理件数と取り違えの率を掲げた案のほうが、合意されたゴールの達成度を語らないという理由で R を欠くことになる。",null],"flipNote":{"2":"この案が M（測定可能な）を満たすには、数える対象を、テストで新たに見つかる欠陥の件数から、作業員役の試行に現れる取り違えそのものに置き換えるしかない。それは状況の側の条件を動かすことではなく、案の中身を別の案に書き直すことである。仮に書き直しても、1時間1,200件と0.5%未満を掲げた案は5つの要素を満たしたまま残るので、5つの要素をすべて満たすものはどれかという問いに対して答えが2つになる。","4":"この案が T（タイムリーな）を満たすには、「繁忙期が始まるまでに」を11月15日のような日付に書き換えるしかない。今年の繁忙期の始まりはまだ読めていないのだから、状況の側にそれを完了期限へ変える条件は無く、書き換えは条件の変更ではなく案の書き直しである。しかも日付を入れれば、1件あたりの所要時間が現行より15%短くなることは出荷量をさばききるというゴールに沿っているため5つの要素が揃い、1時間1,200件と0.5%未満を掲げた案と並んで答えが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値と期限が並んでいれば測定可能だと判断し、その数値がゴールそのものを測っているか、またその指標がプロジェクトのゴールとして合意されたものかを確かめない。とくにステークホルダーから出た要望を、そのままプロジェクトの目的と取り違える"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「テストで見つかる欠陥が3週続けて週20件を下回ったことをもって確認する」案: M（測定可能な）が欠ける。数値と期限はあるが、測る手段が測りたい対象（ピッキング指示の取り違えの起きにくさ）を測っていない","「通信量が現行の7割以下」の案: R（妥当な）が欠ける。S・M・A・T は揃うが、通信量の削減は「今回のゴールには含めない」とシナリオに明記された指標であり、プロジェクト全体の目的に沿っていない","「繁忙期が始まるまでに所要時間を15%短縮」の案: T（タイムリーな）が欠ける。完了期限が日付で定まっておらず、今年の繁忙期の始まりは読めないと明記されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-A-3","lo":"TM-1.4.3","cluster":"1.4.3-C","variant":1,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは総合病院の電子カルテを新しい版へ入れ替えるプロジェクトのテストマネージャーである。合意されたゴールは、検査オーダーと結果の取り違えによる再検査を無くすことである。テスト目的は「検査部門システムとの連携で取り違えが起きないことを示す」と定めてあり、いまは終了基準を決める段階にある。\n\n・検査部門システムの実機とつなげるのは連携環境だけ、外来集中時と同じ1時間900件の検査オーダーを流せるのは負荷環境だけである\n・サーバ枠の都合で2つの環境を同じ期間には立ち上げられない。連携環境は12月の4週間、負荷環境は1月の第1週から2週間を使う\n・連携環境では検査オーダーの投入と結果の受信を自動で繰り返せる。1週間あたり1,800件を流した実績がある\n・負荷環境は検査部門システムの代わりに同じ電文を返す仕組みを使う\n・システムテストは1月31日に終える","question":"この目的から導く終了基準として、スマートの法則を使用したとき最も適切なものはどれか。","choices":["1月31日までに、検査部門システムの実機につないだまま1時間900件の検査オーダーを流し、その状態で結果の取り違えが0件であること","1月31日までに、検査部門システムとの連携が安定して動いており、外来が集中する時間帯でも支障が無いことを、検査部門と情報システム部の責任者が確認していること","1月31日までに、連携環境で流した検査オーダー7,200件の結果に取り違えが0件であり、負荷環境で1時間900件を流したときにも取り違えが0件であること","連携環境と負荷環境での確認がひととおり済んだ段階で、どちらの環境でも検査オーダーと結果の取り違えが0件であること"],"answer":[2],"explanation":{"signals":"判断は箇条書きの1行目と2行目で決まる。検査部門システムの実機とつなげるのは連携環境だけ、外来集中時と同じ1時間900件の検査オーダーを流せるのは負荷環境だけであり、サーバ枠の都合でこの2つを同じ期間には立ち上げられない。案の掲げる状態をこのプロジェクトで作れるか（A）は、ここで決まる。連携環境が12月の4週間あり1週間あたり1,800件を流した実績がある
