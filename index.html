経営が求めている1つ目は、作り直した部分が取り決めと法令のとおりに動くかであって、決められたとおりに機能するかを確かめる問いにあたる。2つ目は、作り直した後のコードがこの先の改修に耐える作りかであって、保守性を見る問いにあたる。原文が挙げるこの2例が、そのまま今回の2つに重なる。\nシラバスはまた、人員配置はテスト計画の中の活動であり、これにはテスト戦略でテストを実装するために必要な人員の役割とスキルを特定するタスクが含まれるとし、プロジェクトに必要なスキルを決定するには、詳細な状況分析が必要であるとしている。ここでの分析は、求められている問いを力に置き換えるところで終わらない。新たに確保するかどうかは、その力をいまのチームが持っているかどうかで決まるからである。画面の操作とこれまでの試験の手順は4名がすでに持っており、外から確保する対象にはならない。\nなお、ここで決まるのは、どの力が足りないのかまでである。その力を採用で埋めるのか、いる人を育てて埋めるのかは、この先に決めることになる。","distractors":[null,"これまで使ってきた試験の手順と画面の操作に通じ、今回どの試験項目を流すかを見極めることは、中核を作り直す以上は確かに要る仕事であり、既存の確認の範囲を決める判断として推したくなる。だが、新たに確保するものではない。4名ともその手順と操作には長く親しんでおり、どの試験項目を今回も流すかは自分たちで決められる、とシナリオに書かれている。すでにチームの中にある力は、外から補うか育てるかを考える対象にならない。加えて、既存の試験項目をどこまで流すかという判断は、経営が答えを求めている2つ、すなわち取り決めと法令のとおりに動くかと、この先の改修に耐える作りかのどちらにも、直接は答えない",null,"海外の事業者への展開を見据えた異文化間の意思疎通と多言語の表示の確認は、それ自体としては実在の力であり、サービスを売る先が広がる場面では要件になる。外れるのは、この会社の顧客がすべて国内の事業者で、海外に売る計画は無いと書かれているからである。シラバスは、プロジェクトコンテキストは求められる専門的能力に関する価値ある情報を提供するとし、システムドメインには、情報技術、自動車産業、ギャンブリング産業など、アプリケーション分野のビジネス専門知識が求められるとしている。ここでのシステムドメインは国内の路線バスの運行であって、その外側に置かれた力は、どれほど一般に価値があっても今回の要件にはならない","毎年の法令改正や勤務時間の決まりの見直しのたびに繰り返す確認を、作り直しで使う言語でスクリプトにして夜間に流し続けられることは、毎年手が入るこのサービスでは確かに値打ちがある。シラバスも、テスト実行には、自動化テストの実行、探索的テストの実施、テスト結果の評価などの技術的専門知識が求められるとしている。それでも今回の優先には入らない。経営が答えを求めているのは、作り直した部分が取り決めと法令のとおりに動くかと、作り直した後のコードがこの先の改修に耐える作りかの2つであり、繰り返す確認を自動で流せることは、そのどちらにも直接は答えないからである。確認を何度も流せることと、コードの作りを読んで見極められることは別の力である"],"flip":[null,null,null,null,"経営が答えを求めている2つ目が、作り直した後のコードがこの先の改修に耐える作りかではなく、毎年の改正のたびに必要になる確認を決められた期間の中で何度も回しきれるかであったなら、コードの構造を読んで作りを見極める力は求められなくなり、繰り返す確認を自動で流せることが、取り決めと法令に通じることと並んで、確保すべき2つの一方になる。"],"flipNote":{"2":"これまでの試験の手順と画面の操作に通じ、どの試験項目を流すかを見極める力がここで選ばれるには、まず、4名ともその手順に長く親しんでいるという記述が別のものに変わる必要がある。だが、それだけでは足りない。経営が答えを求めているのは、作り直した部分が取り決めと法令のとおりに動くかと、作り直した後のコードが改修に耐える作りかの2つであり、既存の試験項目をどこまで流すかという判断は、そのどちらにも直接は答えない。手持ちの有無を入れ替えても、優先すべき2つがこの力に移ることはない。","4":"海外への展開を見据えた異文化間の意思疎通と多言語の表示の確認がここで選ばれるには、顧客がすべて国内の事業者で海外に売る計画が無いという一文を、海外の事業者にも売り出すという内容に置き換えるだけでは足りない。その一文を置き換えても、経営が答えを求めているのは、取り決めと法令のとおりに動くかと、この先の改修に耐える作りかのままである。海外向けの力は要るものが1つ増えるだけで、いま優先すべき2つのどちらかを押しのける位置には来ない。"},"quote":"テストタイプやテストレベルが異なれば、求められるスキルも異なる（例えば、システムの機能適合性をアセスメントするためには、アプリケーションドメインのビジネスに関する専門知識が必要であり、コードの保守性をアセスメントするためには、技術的な専門知識が必要である）。","ref":"3.1.2","misconception":"テストに答えを求められている問いごとに要る力が違うことと、その力をいまのチームが持っているかどうかの2つを重ねて見ずに、一般に値打ちのある力から選んでしまう"},"meta":{"concept":"テストチームのスキル","distractorIntent":["すでにチームが持っている力を、新たに確保すべきものとして数える","顧客の範囲が国内に限られていると書かれているのに、海外展開を見越した力を要件に積む","毎年手が入るという記述から自動化の値打ちを読み取り、求められている2つの問いに直結しない力を優先する"],"distractorTypes":["D2","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-15"]}},{"id":"q-3.1.3-A-1","lo":"TM-3.1.3","cluster":"3.1.3-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーの専門的能力と方法論的能力をアセスメントする方法として、シラバスが挙げているものはどれか。1つ選べ。","choices":["レビューで受けた指摘の受け止め方と返し方を観察し、その様子から見極める","テスト戦略の概要を作成させ、その草案について同僚と話し合わせる","担当範囲が重なったときの調整のしかたを本人に実演させ、その立ち回りから判断する","割り込みが多い週に自分のテスト作業の量と時間をどう管理しているかを確かめる"],"answer":[1],"explanation":{"signals":"選択肢はどれも、本人にやってもらったり様子を見たりして現有スキルを見極める行為である。分かれ目は、その行為で何が見えるかにある。シラバスは、専門的能力と方法論的能力については典型的なテストタスクを実際にやってもらうことでアセスメントできるとしており、対人のやり取りや自分自身への構えから見えるものは、シラバスが社会的能力と個人の能力の例に挙げている側にある。","why":"テスト戦略の概要を作らせ、その草案を同僚と話し合わせる。シラバスが専門的・方法論的能力のアセスメントとして挙げる実演タスクの1つ目、「テスト戦略を概説して、同僚とフィードバックを話し合う」が、そのままこの案だからである。原文は、テストチームメンバーの専門的、方法論的能力は典型的なテストタスクを実際にやってもらうことでアセスメントすることができるとし、続けて5つのタスクを並べている。公式サンプル問題も、テスト戦略の概要を起草して上級テスターと議論させるタスクについて、概要の起草はテストに特化した業務だから専門的能力を、戦略を組み立てて筋道を説明することは方法論的能力を測ると裁定している。残る3つも現有スキルを見極める行為ではあるが、そこで見えるのは他者とのやり取りや自分自身に向けた構えであり、シラバスが社会的能力と個人の能力の例に置いているものである。測る行為の形ではなく、何が見えるかで分かれる。","distractors":["レビューで受けた指摘の受け止め方と返し方から見えるのは、批判を受ける能力という個人の構えと、フィードバックのやり取りという相互作用である。公式サンプル問題は、フィードバックのやり取りの処理を社会的能力とし、批判を受ける姿勢は個人の能力であってやり取りのプロセスそのものではないと裁定している。正解にも同僚との話し合いが含まれるため紛らわしいが、そちらで見ているのは本人が作った戦略の草案の中身である",null,"担当範囲が重なったときの調整のしかたを実演させて見えるのは対立解決スキルであり、シラバスが社会的能力の例に挙げているものである。公式サンプル問題も、開発担当者とテスト担当者の対立の解決は対人のコミュニケーションと対立マネジメントのスキルを伴う社会的能力の例だと裁定している。実演させて見るという形は正解と同じだが、やらせているのが典型的なテストタスクではないため、見えるのは設問の求めている領域ではない","自分の作業量と時間を自分で管理できているかから見えるのはセルフマネジメント能力であり、シラバスが個人の能力の例に挙げているものである。シラバスが専門的能力に挙げる「テストタスクのマネジメント」と語が近いため専門的能力に見えるが、そちらはテストという専門領域のタスクを回すスキルであって、自分自身の管理ではない"],"flip":[null,null,null,null],"flipNote":{"1":"指摘の受け止め方とやり取りから見えるのは、批判を受ける能力（個人の能力）とフィードバックの相互作用（社会的能力）である。この記述を、原文が挙げる5つの実演タスクのいずれか（例えばテストベースをレビューし発見事項を伝える）に書き替えれば専門的・方法論的能力のアセスメントになるが、そのとき正解の選択肢も同じ一覧に残るため、正答が2つになり1つ選べが成り立たない。","3":"担当範囲が重なったときの調整の実演から見えるのは対立解決スキルであり、原文が社会的能力の例に挙げているものである。この記述を、原文が挙げる実演タスク（例えば特定のテスト目的を達成するためのテスト技法を決定する）に書き替えれば専門的・方法論的能力のアセスメントになるが、正解の選択肢も同じ一覧に残るため正答が2つになる。","4":"自分の作業量と時間を自分で管理できているかから見えるのはセルフマネジメント能力であり、原文が個人の能力の例に挙げているものである。この記述を、原文が挙げる実演タスク（例えばテスト結果のアセスメントを含むテスト完了レポートを作成する）に書き替えれば成立するが、正解の選択肢も同じ一覧に残るため正答が2つになる。"},"quote":"テストチームメンバーの専門的、方法論的能力は、典型的なテストタスクを実際にやってもらうことでアセスメントすることができる：テスト戦略を概説して、同僚とフィードバックを話し合う。テストベースをレビューし、発見事項を伝える中で、コミュニケーション能力も明らかになる場合がある。特定のプロジェクトのコンテキストに応じて、特定のテスト目的を達成するためのテスト技法を決定する。さまざまなテスト技法を適切に適用する。テスト結果のアセスメントを含むテスト完了レポートを作成する。","ref":"3.1.3","misconception":"アセスメントの方法を「どうやって見るか」の形だけで選んでおり、その方法で見えるのが4つの能力領域のどれなのかを見ていない。対人のやり取りや自分自身への構えから見えるのは社会的能力と個人の能力であって、専門的能力と方法論的能力ではない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["フィードバックの受け止め方（社会的能力・個人の能力）から専門的・方法論的能力が測れると考える","対立の場での立ち回り（社会的能力）から専門的・方法論的能力が測れると考える","自分の作業の管理（個人の能力のセルフマネジメント）を、専門的能力のテストタスクのマネジメントと取り違える"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-17"]}},{"id":"q-3.1.3-A-2","lo":"TM-3.1.3","cluster":"3.1.3-B","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームのスキルをアセスメントする方法について、シラバスの記述に**合わないもの**はどれか。1つ選べ。","choices":["テスト完了レポートを作成させ、その内容から専門的能力と方法論的能力を見る","外部で取得した資格や認定、これまでの実務経験や学位から判断する","ふりかえりに定期的に参加して受けたフィードバックから、求められるスキルを見極める","性格や役割のタイプを扱うモデルで、専門的能力と方法論的能力を評価する"],"answer":[3],"explanation":{"signals":"アセスメントの方法は、何を使うかだけでなく、その方法で何が測れて何が測れないかまでが問われる。シラバスは、性格や役割のタイプを扱うモデルについて、チームにどのようなスキルがあり何が不足しているかの識別に役立つとは書いているが、専門的能力や方法論的能力を評価できるとは書いていない。","why":"外れるのは、性格や役割のタイプを扱うモデルで専門的能力と方法論的能力を評価する、という方法である。シラバスがこの種のモデルについて述べているのは、チームにどのようなスキルがあり、どのようなスキルが不足しているかを識別するのに役立つ、というところまでで、専門的能力と方法論的能力のアセスメントとして原文が挙げているのは典型的なテストタスクを実際にやってもらうことだからである。公式サンプル問題は、Belbin のチームの役割のモデルについて、異なる性格と役割のタイプでチームの役割を特徴づけるものであり、社会的・個人のスキルに焦点があるため技術的・方法論的能力のアセスメントには適さない、と明示的に裁定している。誤っているのはモデルを使うこと自体ではなく、そのモデルを専門的能力と方法論的能力の評価に当てている点である。残る3つは、実演タスクの5つ目、外部の資格・認定・実務経験・学位、アジャイルにおけるふりかえりとフィードバックで、いずれもシラバスがスキルをアセスメントする経路として書いているものである。","distractors":["テスト結果のアセスメントを含むテスト完了レポートの作成は、シラバスが挙げる実演タスクの5番目そのものであり、専門的能力と方法論的能力のアセスメントとして適切である","シラバスは実演タスクに加えて、外部の資格、認定、実務経験、学位によってもスキルをアセスメントできると明記している。公式サンプル問題も外部の証跡による評価は有効であると裁定している","シラバスはアジャイルソフトウェア開発について、定期的にふりかえりに参加しフィードバックを受けることでチームが求めるスキルを識別すると述べている。開発アプローチの話ではなく、求められるスキルを見極める経路として書かれている",null],"flip":[null,null,null,null],"flipNote":{"1":"テスト結果のアセスメントを含むテスト完了レポートの作成は、原文が実演タスクの5つ目として挙げているものである。記述を崩せばこの選択肢も「シラバスの記述に合わないもの」の側に回るが、正解の選択肢は合わないまま残るため、正答が2つになり1つ選べが成り立たない。","2":"原文は「さらに、スキルは外部の資格、認定、実務経験、学位によってアセスメントすることができる」と、条件を付けずに述べている。資格が必要なスキルと対応していない場合という限定は原文に無く、それを仮定するのは原文に無い前提を置くことになる。仮に置いても、この選択肢と正解の選択肢が同時に「合わないもの」になるため、1つ選べが成り立たない。","3":"原文はアジャイルソフトウェア開発について「定期的にふりかえりに参加し、フィードバックを受けることで、チームが求めるスキルを識別する」と述べており、ふりかえりが評価の場として運用される場合という限定は原文に無い。それを仮定しても、この選択肢と正解の選択肢が同時に「合わないもの」になるため、1つ選べが成り立たない。"},"quote":"チームやチームメンバーがより効果的に機能するモデルがある（例えば、Meredith Belbin の「チームの役割」、DISG® またはPCM® ）。Belbin によれば(Belbin, 2010)、チームは異なる性格や役割のタイプで構成されることで、効果的に機能する。これらのモデルは、チームにどのようなスキルがあり、どのようなスキルが不足しているかを識別するのに役立つ。テストチームメンバーの専門的、方法論的能力は、典型的なテストタスクを実際にやってもらうことでアセスメントすることができる：テスト戦略を概説して、同僚とフィードバックを話し合う。テストベースをレビューし、発見事項を伝える中で、コミュニケーション能力も明らかになる場合がある。特定のプロジェクトのコンテキストに応じて、特定のテスト目的を達成するためのテスト技法を決定する。さまざまなテスト技法を適切に適用する。テスト結果のアセスメントを含むテスト完了レポートを作成する。さらに、スキルは外部の資格、認定、実務経験、学位によってアセスメントすることができる。特に、アジャイルソフトウェア開発においては、定期的にふりかえりに参加し、フィードバックを受けることで、チームが求めるスキルを識別する。","ref":"3.1.3","misconception":"チームの役割や性格のタイプを扱うモデルを万能のアセスメント手段だと考え、そのモデルが焦点を当てているのが社会的能力と個人の能力であることを見ていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["実演タスクの正メンバー（テスト完了レポートの作成）","外部の資格・認定・実務経験・学位という正メンバー","アジャイルにおけるふりかえりとフィードバックという正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-17"]}},{"id":"q-3.1.4-A-1","lo":"TM-3.1.4","cluster":"3.1.4-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"テストチームのスキル一覧を見直したところ、不足していたのは対立の解決と自己主張に関わるスキルだった。","question":"これらのスキルを伸ばすアプローチとして、シラバスの記述に沿うものはどれか。1つ選べ。","choices":["書籍や録画教材を渡し、各自が一人で学ぶ時間を業務の中に確保する","テストタスクのマネジメントの進め方について、あらかじめ内容を決めた研修を教室形式で行う","複雑度の高いテスト分析の課題を一人ずつ割り当て、独力でやり切ってもらう機会を増やす","教室形式の研修を受けさせたうえで、個別に指導する担当者を付ける"],"answer":[3],"explanation":{"signals":"効くのは、不足しているスキルがどの能力領域のものかである。対立の解決と自己主張は、シラバスが社会的能力の例に挙げている。判断は2段になる。その案が伸ばすのはどの能力領域のスキルか。そして、その領域を伸ばすのにシラバスが推奨しているアプローチか。","why":"採るのは、教室形式の研修を受けさせたうえで個別に指導する担当者を付ける案である。不足していた対立の解決と自己主張はシラバスが社会的能力の例に挙げているスキルであり、原文は社会的および個人の能力を開発するためにはトレーニングやコーチングのアプローチを利用することを推奨する、と名指しで述べているからである。その理由として原文が置いているのは、これらが自己学習よりも効果が期待できることが多いという点で、あわせて社会的交流、フィードバック、内省を、社会的能力と個人の能力を開発するための重要な成功要因だとしている。教室であらかじめ定義された知識や実践例を教えるのがトレーニングと教育、コーチから個別に指導を受けるのがメンタリングやコーチングという原文の定義に照らすと、この案は推奨されている2つをそのまま並べたものである。","distractors":["書籍や録画教材で一人で学ぶ形は、シラバスの定義する自己学習である。原文は自己学習やトレーニングを専門的・方法論的な能力開発に適したものとして挙げたうえで、社会的および個人の能力にはトレーニングやコーチングを推奨し、これらが自己学習よりも効果が期待できることが多いとしている。不足しているのは社会的能力なので、この案は推奨されている側ではない。安価で着手しやすいため、実務では選ばれやすい","教室であらかじめ定義された知識や実践例を教えるのはシラバスの言うトレーニングと教育であり、形としては社会的能力と個人の能力の開発に推奨されている側にある。しかしここで教えるテストタスクのマネジメントは、シラバスが専門的能力として挙げているスキルである（4つの能力領域の説明で専門的能力の例にプロジェクトマネジメントスキルが挙がり、ISTQB が重点を置く専門的能力の中身としてテストタスクのマネジメントが列挙されている）。この研修で伸びるのは不足していない領域であり、対立の解決と自己主張は伸びない","複雑度または新規性の高い課題を独自に遂行できる能力は、シラバスが方法論的能力として定義しているものであり、その例として分析力、概念力、判断力が挙がっている。つまりこの案が伸ばすのは方法論的能力であって、不足している社会的能力ではない。加えて、一人で課題をやり切る形には社会的交流もフィードバックも入らないが、シラバスはこの2つと内省を、社会的能力と個人の能力を開発するための重要な成功要因としている。難しい仕事をやり切らせれば自信や主張も付いてくると考えやすく、実務では選ばれやすい",null],"flip":[null,null,null,null],"flipNote":{"1":"原文は「自己学習やトレーニングは、専門的・方法論的な能力開発に適している」と両方を並べて挙げている。したがって不足しているスキルを専門的・方法論的な領域に置き替えると、自己学習を勧めるこの選択肢と、教室形式の研修を含む正解の選択肢が同時に原文の記述に沿うことになり、正答が2つになって1つ選べが成り立たない。","2":"この選択肢が答えになるには、不足しているスキルがテストタスクのマネジメントであることに加えて、同じく専門的・方法論的な能力開発に適しているとされる自己学習の選択肢が外れることが要る。原文が自己学習とトレーニングの両方を適しているとしている以上、条件は1つでは足りない。","3":"一人ずつ割り当てて独力でやり切ってもらう形は、原文が挙げる5つの能力開発のアプローチ（トレーニングと教育、自己学習、ピアラーニング、メンタリングやコーチング、OJT）のどれにもあたらない。経験豊富なメンバーが助言と支援を継続して与える形に書き替えればメンタリングやコーチングになるが、そのとき正解の選択肢もコーチングを含んだまま残るため、正答が2つになる。"},"quote":"例えば、自己学習やトレーニングは、専門的・方法論的な能力開発に適している。このため、テストに関する基本的な知識は、ISTQB®のトレーニングに参加するか、ISTQB®のシラバスに基づいて自己学習することで身に付けることができる。しかし、社会的および個人の能力を開発するためには、トレーニングやコーチングのアプローチを利用することを推奨する。これらは自己学習よりも効果が期待できることが多いためである。社会的交流、フィードバック、内省は、社会的能力、個人の能力を開発するための重要な成功要因である。","ref":"3.1.4","misconception":"能力開発のアプローチを手軽さや実務への近さで選んでおり、そのアプローチが伸ばすのがどの能力領域のスキルかを、不足している領域と突き合わせていない。とりわけ社会的能力と個人の能力についてシラバスが推奨しているのがトレーニングとコーチングであることを見ていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["社会的能力の開発に自己学習を当てる","推奨されている形（トレーニング）であることに引かれ、教える中身が専門的能力のスキルであることを見ない","難しい課題を独力でやり切らせれば社会的能力も伸びると考え、伸びるのが方法論的能力であることを見ない"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-17"]}},{"id":"q-3.1.4-A-2","lo":"TM-3.1.4","cluster":"3.1.4-B","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームメンバーのスキルを向上させるアプローチの説明として、**適切でないもの**はどれか。1つ選べ。","choices":["ピアラーニングは、同僚同士が知識やアイデア、経験を共有し、互いに学び合うことである","自己学習は、教室で勉強するのではなく、書籍や録画教材などを使って一人で学ぶことである","メンタリングやコーチングは、複数の参加者にあらかじめ定めた内容を同時に教えることである","OJTは、自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたものである"],"answer":[2],"explanation":{"signals":"5つのアプローチは、学ぶ形態と関わる人数で分かれる。一人で学ぶのか、同僚同士で学び合うのか、経験者から個別に受けるのか、教室で複数人にまとめて教えるのか。この2つの手がかりで見ると、どの説明が別のアプローチのものかが決まる。","why":"メンタリングやコーチングを「複数の参加者にあらかじめ定めた内容を同時に教えること」と説明した記述が、原文と食い違っている。シラバスはメンタリングやコーチングを、ある役割に就いて間もないチームメンバーがコーチから個別に指導を受けたり、経験豊富なメンターから知識やスキル、経験を得たりするアプローチだと定義し、経験者はアドバイスや支援を提供する継続的なリソースとして機能する、と続けているからである。複数の参加者にあらかじめ定義された知識や実践例を教えるのは、原文がトレーニングと教育として定義している中身である。公式サンプル問題も、トレーニングは通常複数の参加者と定義済みの内容を伴うのに対し、コーチングは個別で個人に合わせたものだと裁定している。この記述の主語がトレーニングと教育であれば、原文の定義に一致する。誤っているのは記述の中身そのものではなく、その中身をメンタリングやコーチングに結び付けている点である。","distractors":["同僚同士が知識、アイデア、経験を共有し互いに学び合うという記述は、シラバスのピアラーニングの定義そのままである","教室で勉強するのではなく1人で勉強すること、という記述はシラバスの自己学習の定義そのままであり、本を読む、録画したビデオを見るといった例も原文に挙げられている",null,"自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたもの、という記述はシラバスのOJTの定義そのままである。トレーニングと教育が組み合わせの対象に入っていない点も原文どおりである"],"flip":[null,null,null,null],"flipNote":{"1":"この記述は原文のピアラーニングの定義そのままである。主語や中身を崩せばこの選択肢も「適切でないもの」の側に回るが、正解の選択肢は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。原文の定義が変わらない限り、この記述は答えにならない。","2":"この記述は原文の自己学習の定義そのままであり、本を読む・録画したビデオを見るという例も原文に挙げられている。記述を崩せばこの選択肢も「適切でないもの」の側に回るが、正解の選択肢は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。","4":"この記述は原文のOJT の定義そのままであり、組み合わせの対象にトレーニングと教育が入っていない点も原文どおりである。組み合わせの対象を書き替えればこの選択肢も「適切でないもの」の側に回るが、正解の選択肢は適切でないまま残るため、正答が2つになる。"},"quote":"トレーニングと教育は、通常は（バーチャルな）教室で、あらかじめ定義された知識や実践例を教えることである（例えば、トレーニングコースに人を派遣する、社内でトレーニングセッションを行う、自分たち向けのトレーニングを開発する、ライブのe ラーニングコースを利用する）。自己学習とは、（バーチャルな）教室で勉強するのではなく、1 人で勉強することである（例えば、本を読んだり、録画したビデオを見たり、インターネットのリソースを調べたりする）。ピアラーニングは、同僚同士が知識、アイデア、経験を共有し、互いに学び合うことである。メンタリングやコーチングは、ある役割に就いて間もないチームメンバーが、コーチから個別に指導を受けたり、経験豊富なメンターから知識やスキル、および/または経験を得たりするアプローチである。経験者は、アドバイスや支援を提供する継続的なリソースとして機能する。OJT は、自己学習、ピアラーニング、メンタリングまたはコーチングを組み合わせたもので、広く知られている。","ref":"3.1.4","misconception":"能力開発のアプローチを名前でしか覚えておらず、個別か複数人か、教える内容があらかじめ定義されているか、といった定義の決め手で弁別できていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["ピアラーニングの正しい定義","自己学習の正しい定義","OJTの正しい定義"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-17"]}},{"id":"q-3.1.5-A-1","lo":"TM-3.1.5","cluster":"3.1.5-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームを率いるうえで不可欠な成功要因として、シラバスが社会的能力と個人の能力に挙げているものはどれか。1つ選べ。","choices":["困難が続いても立て直せることと、作業を他のメンバーに任せられること","作業の計画を立て、進み具合を追い、状況を関係者に報告できること","用いる開発ライフサイクルを理解し、テスト技法を選んで使えること","職場や社会の状況と労働条件を分析し、その結果を人材の確保に生かせること"],"answer":[0],"explanation":{"signals":"シラバスはマネジメントスキルを層に分けて書いている。計画・進捗のモニタリング・コントロール・報告といった基本的なマネジメント活動は専門的かつ方法論的な能力、テストアプローチの知識やSDLC の理解は特定のテストマネジメントの知識とスキル、そして率いることとコーチすることに不可欠なものとして社会的能力と個人の能力を置いている。設問が求めているのは最後の層である。","why":"困難が続いても立て直せることと、作業を他のメンバーに任せられること。シラバスがテストチームを率いるために不可欠だとしている回復力と委任する能力が、この2つにそのまま対応する。原文は、テストチームをリードする、またはコーチすることは、他のテストチームメンバーとの関係において適切に行動し、変化する状況に応じて成長する能力と意欲を持つことを意味するとしたうえで、したがってテストチームを率いるには社会的能力、個人の能力が不可欠な成功要因であり、これには回復力、委任する能力、テストチームに受け入れられる資質が含まれる、と述べている。さらにテストの利益を主張して利点を促進すること、すべてのステークホルダーとコミュニケーションを取って対立を解決する能力も、続けてこの一覧に挙げられている。残る3つもシラバスがマネジメントスキルとして書いているものではあるが、計画・進捗のモニタリング・コントロール・報告は基本的なマネジメント活動における専門的かつ方法論的な能力、テストアプローチの知識やSDLC の理解は特定のテストマネジメントの知識とスキル、労働条件の分析は人材の確保の話であり、いずれもこの一覧の外にある。","distractors":[null,"計画、進捗のモニタリング、コントロール、報告は、シラバスが基本的なマネジメント活動として挙げ、そこに必要なのは専門的かつ方法論的な能力だとしている層である。マネジメントスキルではあるが、率いるために不可欠な社会的能力・個人の能力としては挙げられていない","異なるテストアプローチの知識、テスト技法の使用、適用するSDLCの理解は、シラバスが特定のテストマネジメントの知識とスキルとして挙げているものであり、専門的能力の側に属する。テストを預かる者に必須の知識ではあるが、問われている層とは別である","社会やチームの状況および労働条件を分析するスキルは、シラバスがテストチームの人材を確保するために求められるものとして、率いるために不可欠な能力とは別に挙げている。テストチームが労働条件に適合すること、可能であれば労働条件をテストチームに適応させることの確認に役立つスキルであり、必要である点は正しいが、率いるために不可欠な社会的能力・個人の能力として列挙されているものではない"],"flip":[null,null,null,null],"flipNote":{"2":"計画、進捗のモニタリング、コントロール、報告は、原文が「基本的なマネジメント活動における専門的かつ方法論的な能力」として挙げている層である。この記述を、立場の異なるステークホルダーとの合意形成や対立の解消の話に書き替えれば社会的能力に移るが、そのとき正解の選択肢（回復力と委任する能力）も残るため、正答が2つになり1つ選べが成り立たない。","3":"異なるテストアプローチの知識、テスト技法の使用、適用するSDLC の理解は、原文が「特定のテストマネジメントの知識とスキル」として別に挙げている層である。原文が率いるために不可欠な社会的能力・個人の能力として挙げているのは、回復力、委任する能力、テストチームに受け入れられる資質に加えて、テストの利益を主張し利点を促進すること、すべてのステークホルダーとコミュニケーションを取って対立を解決する能力であり、この記述が挙げる知識とスキルはそのどれにも当たらない。記述を社会的能力の側に寄せて書き替えても、正解の選択肢（回復力と委任する能力）はそのまま正しいため、正答が2つになり1つ選べが成り立たない。","4":"社会やチームの状況および労働条件を分析するスキルは、原文がテストチームの人材を確保するための段落に置いているものである。条件の調整と合意の取り付けまで含む記述に書き替えれば社会的能力の要素が入るが、原文が率いるために不可欠なものとして挙げる一覧に加わるわけではなく、加わったとしても正解の選択肢が残るため正答が2つになる。"},"quote":"テストチームを成功に導こうとする人は誰でもマネジメントスキルがなければならない。これには、基本的なマネジメント活動における専門的かつ方法論的な能力を含む（例：計画、進捗のモニタリング、コントロール、および報告）。テストには、特定のテストマネジメントの知識とスキルが必要である（例：異なるテストアプローチの知識、テスト戦略の開発、テスト技法の使用、または適用するSDLC の理解）。テストチームをリードする、またはコーチすることは、他のテストチームメンバーとの関係において適切に行動し、変化する状況に応じて成長する能力と意欲を持つことを意味する。したがって、テストチームを率いるには、社会的能力、個人の能力が不可欠な成功要因である。これには、回復力、委任する能力、テストチームに受け入れられる資質が含まれる。さらに、プロジェクトにおけるテストの利益を主張し、テストの利点を促進し、すべてのステークホルダーとコミュニケーションを取って対立を解決する能力も含まれる。","ref":"3.1.5","misconception":"マネジメントスキルを一枚岩の塊として覚えており、計画や報告といった基本的なマネジメント活動と、率いることやコーチすることに不可欠な社会的能力・個人の能力が、シラバスでは別の層として書かれていることを見ていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["基本的なマネジメント活動（専門的かつ方法論的）を社会的・個人の能力だと考える","テスト固有の知識（専門的能力）を社会的・個人の能力だと考える","人材確保のための分析スキルを、率いるために不可欠な社会的・個人の能力の列挙に含める"],"distractorTypes":["D1","D1","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-14"]}},{"id":"q-3.1.5-A-2","lo":"TM-3.1.5","cluster":"3.1.5-B","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"立ち上げたばかりのテストチームで、担当範囲をめぐって意見が正面からぶつかり、議論が収まらなくなっている。","question":"この状況でチームを率いる人に求められるスキルはどれか。1つ選べ。","choices":["チームの内部で起きている衝突を解きほぐし、合意へ導ける能力","合意した価値観やルールを守らせる規律と、目標を示すリーダーシップ","メンバー一人ひとりに責任を持たせるため、作業を任せていける能力","新しく加わる人が溶け込めるよう、参加を後押ししようとする意欲"],"answer":[0],"explanation":{"signals":"状況を特定する手がかりは「意見が正面からぶつかり、議論が収まらない」という一文である。役割や進め方をめぐって主張が衝突している段階であり、まだ共有のルールが定まっていない。段階が決まれば、シラバスが各段階に対応づけたスキルから答えが決まる。","why":"求められるのは、テストチーム内の対立を解決する能力である。担当範囲をめぐって主張が正面からぶつかり、議論が収まらない状態は混乱期にあたり、シラバスが混乱期に対応づけているスキルがこれだからである。原文は、テストチームが動的な開発プロセスに影響を受けるため状況に応じたスキルを必要とするとし、小集団開発のTuckman モデルのフェーズにしたがって、参加を支援する意欲を形成期に、対立を解決する能力を混乱期に、合意された価値観やルールを確実に守るための規律と目標指向のリーダーシップを統一期に、自分自身の責任を持たせるための委任能力を機能期に、離れるメンバーに感謝と信頼を持って接する能力を散会期に置いている。立ち上げたばかりという記述だけを見ると形成期に見えるが、段階を決めているのは主張がぶつかって議論が収まらないという事実のほうである。","distractors":[null,"合意された価値観やルールを確実に守るための規律と目標指向のリーダーシップは、シラバスが統一期に対応づけている。守らせる対象となるルールがまだ合意されていない段階では前提を欠く","自分自身の責任を持たせるための委任能力は、シラバスが機能期に対応づけているものである。主張がぶつかっている段階で任せると、調整されないまま作業が分かれてしまう。公式サンプル問題も、委任は機能期の特徴であるとして同種の選択肢を否定している","テストチームへの参加を支援する意欲は、シラバスが形成期に対応づけている。立ち上げたばかりという記述から形成期に見えるが、意見の衝突が起きている時点でチームは次の段階に入っており、この段階で最も必要とされるスキルではない"],"flip":[null,"衝突が収まり、働き方の合意ができた直後であれば統一期であり、合意された価値観やルールを守らせる規律と目標指向のリーダーシップが求められるスキルになる","チームが立ち上げの時期を過ぎて共有のルールを固め、各自が安定して成果を出せるようになっていれば機能期であり、自分自身の責任を持たせるための委任がその段階に求められるスキルになる","メンバーが集まって間もなく、まだ互いを知らず遠慮がある状態であれば形成期であり、参加を後押しする意欲がその段階に求められるスキルになる"],"quote":"テストチームメンバーのテストチームへの参加を支援する意欲（形成期）。テストチーム内の対立を解決する能力（混乱期）。合意された価値観やルールを確実に守るための規律と目標指向のリーダーシップ（統一期）テストチームに自分自身の責任を持たせるための委任能力（機能期）。テストチームを離れるメンバーに対して感謝と信頼を持って接する能力（散会期）","ref":"3.1.5","misconception":"委任、自律の促進、規律の徹底、感謝を示すことを常に良いリーダーシップだと考え、チームがどの段階にいるかによって必要なスキルが変わることを見ていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["機能期に対応するスキルを混乱期に当てる","統一期に対応するスキルを混乱期に当てる","立ち上げ直後という語から形成期と判断し、衝突が起きている事実を見ない"],"distractorTypes":["D1","D1","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-18"]}},{"id":"q-3.1.6-A-1","lo":"TM-3.1.6","cluster":"3.1.6-A","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"テストチームのモチベーションを上げる要因の例として、**適切でないもの**はどれか。1つ選べ。","choices":["テスト環境を安定させ、仕様の曖昧さと未修正の欠陥をなくしておくこと","テストの進め方をチームの中で自分たちで決められるようにすること","仕事の達成を認め、一人ひとりに合わせた形で評価を伝えること","経験を積んだ担当者がテストプロセスのオーナーに進める道を用意すること"],"answer":[0],"explanation":{"signals":"テスト担当者が日々の不満として挙げるもの（環境、仕様、修正されない欠陥）と、モチベーションを上げる要因は一致しない。シラバスはこれらを衛生要因の側に置いており、満たしても自動的に満足感が増すわけではないが、欠ければモチベーションが下がるものとして扱っている。","why":"テスト環境を安定させ、仕様の曖昧さと未修正の欠陥をなくしておくこと。これはモチベーションを上げる要因ではなく衛生要因であり、だからモチベーションを上げる要因の例としては外れる。シラバスは快適な労働条件を衛生要因の1つとして挙げ、その例に曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境を並べているからである。衛生要因は通常当然のものと見なされ、それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていればモチベーションが下がる可能性がある、というのが原文の扱いである。モチベーションを上げる要因としてシラバスが挙げているのは、仕事の達成に対する承認と評価、責任と自律性の向上、興味深く有意義でやりがいのあるタスク、プロフェッショナルとしての昇進と成長で、残る3つはこのうち責任と自律性の向上、承認と評価、昇進と成長の例にそのまま対応する。なお原文は、これらの労働条件に条件を付けずに、快適な労働条件の例として置いている。","distractors":[null,"テストチーム内でテストプロセスを定義することは、責任と自律性の向上の例としてシラバスが明記している","仕事の達成に対する承認と評価であり、シラバスがモチベーションを上げる要因の1つ目に挙げているものである。テストチームメンバーが評価されるような個別アプローチという例も原文に含まれる","経験豊富なテスト担当者からテストプロセスオーナーになるための成長は、プロフェッショナルとしての昇進と成長の例としてシラバスが明記している"],"flip":[null,null,null,null],"flipNote":{"2":"テストチーム内でテストプロセスを定義することは、原文が責任と自律性の向上の例として条件を付けずに挙げている。裁量が形式的である場合という限定は原文に無い。仮にそれを置いてこの選択肢を「適切でないもの」にしても、正解の選択肢（快適な労働条件＝衛生要因）は適切でないまま残るため、正答が2つになり1つ選べが成り立たない。","3":"仕事の達成に対する承認と評価は、原文がモチベーションを上げる要因の1つ目に挙げており、テストチームメンバーが評価されるような個別アプローチという例も原文に含まれる。承認が形だけになる場合という限定は原文に無く、それを置いてもこの選択肢と正解の選択肢が同時に「適切でないもの」になるため、1つ選べが成り立たない。","4":"経験豊富なテスト担当者からテストプロセスオーナーになるための成長は、原文がプロフェッショナルとしての昇進と成長の例として明記している。到達できる枠が無い場合という限定は原文に無く、それを置いてもこの選択肢と正解の選択肢が同時に「適切でないもの」になるため、1つ選べが成り立たない。"},"quote":"モチベーションを上げる要因は意識的に認識され、成長と満足感につながる。これは以下を含む：仕事の達成に対する承認と評価（例えば、インセンティブや、テストチームメンバーが評価されるような個別アプローチ）責任と自律性の向上（例えば、テストチーム内でテストプロセスの定義すること）テストチームメンバーが、達成可能であり、同時に努力する価値があると認識する、興味深く、有意義で、やりがいのあるタスク（例：テスト自動化のための新しいツールの選択と導入）プロフェッショナルとしての昇進と成長（例えば、経験豊富なテスト担当者からテストマネージャーやテストプロセスオーナーになるための成長） 衛生要因は通常、当然のものと見なされる。それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていれば、テストチームのメンバーのモチベーションが下がる可能性がある：適切な報酬（例えば、市場に見合った給与、時間外手当、充実した社会保障）評価される人事方針とマネジメントスタイル（例えば、無駄のないマネジメント、現実的な目標、外部からの干渉や過負荷からの保護）快適な労働条件（例えば、曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境）。最低限必要な安全性（例えば、安全な職場と合意事項の遵守）良好な対人関係（例：同僚や上司との関係）","ref":"3.1.6","misconception":"テスト担当者が不満を言う対象を改善すればモチベーションが上がると考え、テスト環境の安定や仕様の明確さといった労働条件を、衛生要因ではなくモチベーションを上げる要因に分類している"},"meta":{"concept":"テストチームのスキル","distractorIntent":["承認と評価というモチベーション要因の正メンバー","責任と自律性の向上というモチベーション要因の正メンバー","昇進と成長というモチベーション要因の正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-19"]}},{"id":"q-3.1.6-A-2","lo":"TM-3.1.6","cluster":"3.1.6-B","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"シラバスが衛生要因について述べている内容として、適切なものはどれか。1つ選べ。","choices":["意識的に認識される要因であり、チームメンバーの成長と満足感につながるものである","当然のものと見なされ、満たしても満足感が増すとは限らず、欠ければモチベーションが下がる","満たされている限り意識されないため、テストマネジメントが継続的に取り除くべきものである","満たすことで生産性とパフォーマンスが直接高まり、プロジェクトの成功に大きな影響を与える"],"answer":[1],"explanation":{"signals":"衛生要因は、どの項目が属するかだけでなく、満たしたときと欠けたときで働き方が非対称であることまでが問われる。満たす方向では満足を生まず、欠ける方向ではモチベーションを下げる。この非対称性が、モチベーションを上げる要因との決定的な違いである。","why":"衛生要因は、当然のものと見なされ、満たしても満足感が増すとは限らず、欠ければモチベーションが下がる。この非対称な働き方を述べた選択肢が答えである。シラバスが衛生要因を、通常当然のものと見なされ、それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていればテストチームのメンバーのモチベーションが下がる可能性があるものだと述べているからである。裏返せば、衛生要因への手当ては不満を防ぐことはできても、満足を買うことはできない。だからシラバスはテストマネジメントに対して、モチベーションを下げる要因を継続的に排除し、同時にモチベーションを上げる要因を作り出し強化すべきだとしている。","distractors":["意識的に認識され、成長と満足感につながるのは、シラバスがモチベーションを上げる要因について述べている内容である。両者の説明を入れ替えて覚えていると選んでしまう",null,"継続的に排除すべきものとしてシラバスが挙げているのはモチベーションを下げる要因であり、衛生要因そのものではない。衛生要因は取り除く対象ではなく、欠けないように満たしておく対象である。語が近いため取り違えやすい","生産性とパフォーマンスを向上させ、プロジェクトの成功に大きな影響を与えるとシラバスが述べているのは、満足しモチベーションが高いテストチームメンバーについてである。衛生要因を満たすこと自体がその状態を作るわけではない"],"flip":[null,null,null,null],"flipNote":{"1":"選択肢は主語を持たず、何について述べた記述かは設問の「衛生要因について」が決めている。意識的に認識され、成長と満足感につながるのは原文がモチベーションを上げる要因について述べている内容であり、衛生要因についての記述としては原文と食い違ったままである。この記述が答えになるのは設問がモチベーションを上げる要因を問うたときであり、それは条件の変更ではなく設問の変更である。","3":"原文が「継続的に排除すべき」としているのはモチベーションを下げる要因であり、衛生要因は欠けないように満たしておく対象である。記述の対象を決めているのは設問の「衛生要因について」であるため、対象をモチベーションを下げる要因に読み替えることは設問の変更にあたり、条件の変更ではない。衛生要因についての記述としては、原文と向きが逆のままである。","4":"生産性とパフォーマンスを向上させ、プロジェクトの成功に大きな影響を与えると原文が述べているのは、満足しモチベーションが高いテストチームメンバーについてである。記述の対象は設問の「衛生要因について」が決めているため、主語を読み替えることは設問の変更にあたる。衛生要因を満たすこと自体がその状態を作るという主張は、原文には無い。"},"quote":"衛生要因は通常、当然のものと見なされる。それを満たすことは自動的により大きな満足感をもたらすわけではないが、欠けていれば、テストチームのメンバーのモチベーションが下がる可能性がある：適切な報酬（例えば、市場に見合った給与、時間外手当、充実した社会保障）評価される人事方針とマネジメントスタイル（例えば、無駄のないマネジメント、現実的な目標、外部からの干渉や過負荷からの保護）快適な労働条件（例えば、曖昧ではない仕様、成熟したテスト対象、適切に修正された欠陥、適切な職場、安定したテスト環境）。最低限必要な安全性（例えば、安全な職場と合意事項の遵守）良好な対人関係（例：同僚や上司との関係）","ref":"3.1.6","misconception":"衛生要因を「満たせば満足が増えるもの」と読み、満たす方向では満足を生まず欠ける方向でのみモチベーションを下げるという非対称性を捉えていない"},"meta":{"concept":"テストチームのスキル","distractorIntent":["モチベーションを上げる要因の説明を衛生要因の説明だと考える","衛生要因と「モチベーションを下げる要因」を同一視し、排除の対象だと考える","衛生要因を満たすこと自体が生産性を直接高めると考える"],"distractorTypes":["D1","D8","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","mistakePatterns":["MP-19"]}},{"id":"q-3.2.1-A-1","lo":"TM-3.2.1","cluster":"3.2.1-A","variant":1,"chapter":3,"section":"3.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、今期にかかった支出を品質コストの4つのカテゴリーに仕分けている。","question":"評定（アプレイザル）コストの例にあたるものはどれか。1つ選べ。","choices":["リリース候補に対して、担当チームが静的テストと動的テストを実施するためにかけた費用","テストベースとなる要件定義書を可能な限り早い段階でレビューし、品質の低い仕様が下流へ流れるのを防ぐためにかけた費用","システムテストで見つかった欠陥を修正し、暫定の回避策を用意するためにかけた費用","顧客から報告されたフィールド欠陥を、リリース後に再現して修正するのに要した費用"],"answer":[0],"explanation":{"signals":"効くのは「評定（アプレイザル）コスト」という設問の指定だけである。4つとも品質コストのどれかのカテゴリーに実際に入る支出なので、支出として妥当かどうかでは切れない。分かれるのは、その費用をかける目的が低品質を未然に防ぐことか、すでにある欠陥を見つけることか、見つかった欠陥に対処することか、そしてその欠陥が顧客に届いた後かどうかである。","why":"リリース候補に静的テストと動的テストをかける費用は、欠陥を見つけるための支出である ── だからこれが評定（アプレイザル）コストにあたる。シラバスは品質コストを欠陥予防コスト、評定（アプレイザル）コスト、内部失敗コスト、外部失敗コストのカテゴリーに分類し、評定（アプレイザル）コストを「欠陥検出を目的としたすべての活動のコスト」と定義したうえで、例として「静的テストおよび動的テストの実施、作業成果物のレビュー」を挙げている。担当チームがリリース候補にかける静的テストと動的テストは、この定義にも例にも正面から当たる。仕分けを決めているのは活動の名前ではなく、その活動を何のために行うかである ── 同じレビューでも、低品質を防ぐために早い段階で行うものは欠陥予防コストの側に置かれ、同じテストでも、顧客に届いた欠陥に応じるためにリリース後に行うものは外部失敗コストの側に置かれる。","distractors":[null,"テストベースの可能な限り早期のレビューは、シラバスが欠陥予防コストの例として名指ししているものである。欠陥予防コストは「低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト」と定義されており、品質の低い仕様が下流へ流れるのを防ぐという目的がそのまま予防の側を指す。評定（アプレイザル）コストの例にも「作業成果物のレビュー」があるため、レビューという活動の名前だけで評定の側へ寄せた人が選ぶ","テスト中に発見した欠陥の修正と回避策の提供は、シラバスが内部失敗コストの例として挙げているものである。内部失敗コストは「すべての対処的な活動にかかるコスト」と定義されており、欠陥を見つけるための活動ではなく、見つかった欠陥に応じる活動である。システムテストという場面から、テスト工程で生じる費用をまとめて評定（アプレイザル）コストに数えた人が選ぶ","顧客から報告されたフィールド欠陥の修正は、シラバスが外部失敗コストの例として挙げているものである。シラバスは外部失敗コストの例に「（リリース後の）欠陥の修正、テスト、デプロイ」まで含めているので、再現のために行うテストもこちら側に入る。「テスト」という語があるために評定（アプレイザル）コストと読んだ人が選ぶが、境界はテストかどうかではなく、欠陥が顧客に届いたかどうかである"],"flip":[null,null,null,null],"flipNote":{"2":"テストベースの可能な限り早期のレビューは、シラバスが欠陥予防コストの例として置いているものである。品質の低い仕様が下流へ流れるのを防ぐという目的を外し、完成した作業成果物から欠陥を検出するためのレビューに書き替えれば評定（アプレイザル）コストへ移るが、そのときリリース候補への静的テストと動的テストを述べた記述も評定（アプレイザル）コストのまま残るので、当てはまるものが2つになる。この記述がそのまま答えになるのは欠陥予防コストを問われたときで、それは問題の条件を変えることではなく設問そのものを変えることである。","3":"テスト中に発見した欠陥の修正と回避策の提供は、シラバスが内部失敗コストの例として置いているものである。これを欠陥検出のための活動の話に書き替えれば評定（アプレイザル）コストへ移るが、それは対処という中身を捨てて別の活動に差し替えることであり、しかもそのときリリース候補への静的テストと動的テストを述べた記述も評定（アプレイザル）コストのまま残るので、当てはまるものが2つになる。修正と回避策という中身を残す限り、品質コストの4つのカテゴリーのうちこの支出が入るのは内部失敗コストである。","4":"リリース後に顧客から報告された欠陥の修正と、そのために行うテストやデプロイは、シラバスが外部失敗コストの例として名指ししているものである。この記述を欠陥検出のためのテストに近づけるには、「リリース後に」と「顧客から報告された」の両方を外すことになり、直す箇所が1つで済まない。しかも外したところで、リリース候補への静的テストと動的テストを述べた記述も評定（アプレイザル）コストのまま残るため、当てはまるものが2つになる。内部失敗と外部失敗を分けているのは、欠陥が顧客に届いたかどうかの一点である。"},"quote":"評定（アプレイザル）コスト：欠陥検出を目的としたすべての活動のコスト（例えば、静的テストおよび動的テストの実施、作業成果物のレビュー）","ref":"3.2.1","misconception":"品質コストのカテゴリーを活動の名前で覚えており、同じレビューやテストでも目的が違えば入るカテゴリーが変わること、内部失敗と外部失敗を分けるのは欠陥が顧客に届いたかどうかの一点であることを押さえていない"},"meta":{"concept":"品質コストの4カテゴリーと例","distractorIntent":["テストベースの早期レビューを、レビューという活動名から評定コストに数える","テスト中に見つかった欠陥への対処を、テスト工程の費用として評定コストに数える","リリース後の欠陥の再現テストを、テストという語から評定コストに数える"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-3.2.1 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-61","MP-60"]}},{"id":"q-3.2.1-B-1","lo":"TM-3.2.1","cluster":"3.2.1-B","variant":1,"chapter":3,"section":"3.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはビルの空調を制御するソフトウェアを開発する部門のテストマネージャーで、次期プロジェクトで見込む支出を品質コストのカテゴリー別に積み上げている。","question":"次の支出のうち、欠陥予防コストの例に**含まれないもの**はどれか。1つ選べ。","choices":["保守性の高いコードやセキュアなコードを書けるようにするための研修を、開発担当者に受けさせるためにかける費用","テストの基となる要件仕様を可能な限り早い段階でレビューし、質の低い仕様のまま下流へ流れるのを防ぐためにかける費用","開発担当者が自分の担当タスクが適格であることを確かめられるよう、チーム内で日常的に意思疎通を図るためにかける費用","完成した設計書に残っている欠陥を検出することを目的として、レビューを実施するためにかける費用"],"answer":[3],"explanation":{"signals":"効くのは「欠陥予防コストの例に含まれないもの」という否定形の指定と、その支出を何のために使うかである。4つとも品質コストのどれかに入る支出なので、支出として妥当かどうかでは切れない。分かれるのは、低品質が作り込まれるのを未然に防ぐために計画的かつ積極的に行うものか、すでに作り込まれた欠陥を見つけるために行うものかである。レビューという言葉は2つの選択肢に出てくるが、言葉そのものはどちらの側も指さない。","why":"完成した設計書に残っている欠陥を検出するために行うレビュー ── これだけが、シラバスが欠陥予防コストの例として挙げているものの中に無い。目的が欠陥の検出である以上、シラバスはこの種のレビューを評定（アプレイザル）コストの側に置いているからである。シラバスは欠陥予防コストを「低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト」と定義し、その例として、保守性を高めるまたはセキュアなコードを作成するためのトレーニング、テストベースの可能な限り早期のレビュー、チーム内での適切なコミュニケーションなどを挙げ、これらを開発担当者が自分のタスクが適格であることを確認するための活動としてまとめている。開発担当者への研修も、早い段階での要件仕様のレビューも、チーム内の日常的な意思疎通も、この例に正面から当たる。いっぽう評定（アプレイザル）コストは「欠陥検出を目的としたすべての活動のコスト」と定義され、その例に作業成果物のレビューが挙げられている。同じ「レビュー」がシラバスの予防の例にも評定の例にも現れることが示すとおり、どちらに入るかを決めるのは活動の名前ではなく、その活動を何のために行うかである。","distractors":["保守性を高めるまたはセキュアなコードを作成するためのトレーニングは、シラバスが欠陥予防コストの例として挙げているものである。欠陥予防コストは低品質を防ぐために計画的かつ積極的に行われる活動のコストであり、開発担当者が最初から欠陥を作り込みにくくするための研修はその例に直接あたる。研修は人を育てるための支出であって品質コストの内訳には入らない、と考えた人が選ぶ","テストベースの可能な限り早期のレビューは、シラバスが欠陥予防コストの例として挙げているものである。同じレビューでも、質の低い仕様が下流へ流れるのを未然に防ぐために早い段階で行うものは予防の側に置かれる。レビューと名の付くものはすべて作業成果物のレビューであり評定（アプレイザル）コストだ、と活動の名前で線を引いた人が選ぶ","チーム内での適切なコミュニケーションは、シラバスが欠陥予防コストの例として挙げているものであり、シラバスはこうした例を開発担当者が自分のタスクが適格であることを確認するための活動としてまとめている。日々の意思疎通は支出として積み上げる対象ではない、あるいは欠陥に直接触れていないので品質コストではない、と考えた人が選ぶ",null],"flip":[null,null,null,null],"flipNote":{"1":"保守性を高めるまたはセキュアなコードを作成するためのトレーニングは、シラバスが欠陥予防コストの例として挙げているものである。これを欠陥予防コストの外へ出すには、研修という中身を欠陥検出のための活動に差し替えるしかなく、そのとき完成した設計書のレビューを述べた記述も欠陥検出を目的とするまま残るので、含まれないものが2つになって1つだけを選べなくなる。予防か評定（アプレイザル）かを決めるのは活動の名前ではなく目的であり、この支出の目的が低品質を防ぐことである限り、品質コストのカテゴリーのうちこれが入るのは欠陥予防コストである。","2":"テストベースの可能な限り早期のレビューは、シラバスが欠陥予防コストの例として挙げているものである。質の低い仕様が下流へ流れるのを未然に防ぐという目的を外し、完成した成果物から欠陥を検出するためのレビューに書き替えれば評定（アプレイザル）コストへ移るが、そのとき完成した設計書のレビューと目的が同じものになり、欠陥予防コストに含まれないものが2つ立つ。これだけを答えにするには、同時に設計書のレビューのほうを予防の側へ動かさなければならず、直す箇所が1つで済まない。","3":"チーム内での適切なコミュニケーションは、シラバスが欠陥予防コストの例として挙げているものであり、シラバスはそれを開発担当者が自分のタスクが適格であることを確認するための活動としてまとめている。これを予防の外へ出すには、日々の意思疎通という中身を欠陥検出のための活動に差し替えるしかなく、そのとき完成した設計書のレビューを述べた記述も欠陥検出を目的とするまま残るため、含まれないものが2つになる。支出として積み上げられるかどうかは、どのカテゴリーに入るかを決める条件ではない。"},"quote":"欠陥予防コスト：低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト（例えば、保守性を高めるまたはセキュアなコードを作成するためのトレーニング、テストベースの可能な限り早期のレビュー、チーム内での適切なコミュニケーションなど、開発担当者が自分のタスクが適格であることを確認するための活動、）。…評定（アプレイザル）コスト：欠陥検出を目的としたすべての活動のコスト（例えば、静的テストおよび動的テストの実施、作業成果物のレビュー）","ref":"3.2.1","misconception":"品質コストの分類をレビューやテストといった活動の名前で覚えており、シラバスが同じレビューを、質の低いものが下流へ流れるのを防ぐために早期に行うものは欠陥予防コストの例、欠陥検出を目的とする作業成果物のレビューは評定（アプレイザル）コストの例として、目的で分けていることを押さえていない"},"meta":{"concept":"品質コストの4カテゴリーと例","distractorIntent":["セキュアなコードのための研修を、人を育てる支出として品質コストの外に置く","テストベースの早期レビューを、レビューという活動の名前から評定（アプレイザル）コストに寄せる","チーム内の日常の意思疎通を、支出として積み上げる対象ではないとして品質コストの外に置く"],"distractorTypes":["D12","D12","D12"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-3.2.1 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-61"]}},{"id":"q-3.2.2-A-1","lo":"TM-3.2.2","cluster":"3.2.2-A","variant":1,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、個人事業主向けの確定申告ソフトを開発して販売する会社のテストマネージャーである。来月の経営会議で、テストにかけている費用について説明することになった。\n経理部門と直近1年の実績を整理し、欠陥1件あたりの平均額を算出した。リリース前の検出にかかる評定コストが3万円、リリース前に見つけた欠陥の修正にかかる内部失敗コストが2万円、出荷後に利用者から報告された欠陥の調査・修正・問い合わせ対応・修正版の配布にかかる外部失敗コストが26万円であった。\nこの会社では、1件の欠陥について、リリース前に見つかれば評定コストと内部失敗コストが、利用者に届いてしまえば外部失敗コストが発生するものとして集計している。同じ欠陥で両方が発生することはなく、届いてしまった場合は外部失敗コストが評定コストと内部失敗コストを置き換える。","question":"テストの費用対効果について経営会議で述べる説明として、最も適切なものはどれか。1つ選べ。","choices":["欠陥1件あたりの品質コストは、評定コストと内部失敗コストと外部失敗コストを合計した31万円であり、テストにはこれだけの費用がかかっていると説明する。","外部失敗コストの平均から評定コストと内部失敗コストの平均を引いた21万円が、欠陥1件を流出前に見つけることによる平均節約額だと説明する。","テストの実行に充てる工数を絞れば、評定コストと、そこで見つかる欠陥の修正にかかる内部失敗コストがともに下がるため、品質コストを抑えられると説明する。","出荷前に見つかる欠陥が少ない期ほど、かけた費用に対する効果は大きいので、検出件数の少なさをテストの費用対効果の高さとして説明する。"],"answer":[1],"explanation":{"signals":"効くのは3つの平均額と、最後の集計規則である。1件の欠陥は、リリース前に見つかれば評定コスト3万円と内部失敗コスト2万円の計5万円で済み、利用者に届けば外部失敗コスト26万円がかかる。同じ欠陥で両方は発生せず、届いた場合は外部失敗コストが前の2つを置き換える、と明記されている。この規則があるため、3つを足し合わせる操作はこの会社の数値に対しては成り立たない。26万円が5万円の5倍を超えるという大小関係は、テストを薄くしたときにどちらの費目が動くかを見る物差しになる。確定申告ソフトという繁忙期のある商材であることは、どの説明が成り立つかを分けない。","why":"経営会議で示すべき数字は21万円である。欠陥1件を利用者に届く前に見つけることで避けられている額が、26万円 −（3万円＋2万円）＝21万円 だからである。シラバスは「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と計算すると述べており、この会社の平均額を当てはめた結果がこの額にあたる。式が引き算の形をとるのは、1件の欠陥について、リリース前に見つかった場合にかかる費目と、流出した場合にかかる費目が排他だからである。シナリオの最終段落はそれを明文化していて、届いてしまえば外部失敗コストが評定コストと内部失敗コストを置き換える。だから3つを積み上げる読み方は、この会社の数値に対しては成り立たない。なお、式が「評価コスト」と呼んでいる費目は、3.2.1 が4カテゴリーの1つとして挙げる評定（アプレイザル）コストと同じものである（日本語版は式では「評価」、カテゴリー名では「評定」と表記している）。この21万円が、シラバスの言う「欠陥あたりの品質コスト」という観点から見たテストの付加価値であり、シラバスはテストマネージャーに対して「これらの利点と欠陥あたりの品質コストという観点からテストの付加価値を伝えるようにすべきである」と求めている。ただしこれは欠陥1件あたりの額なので、総額にするにはリリース前に見つけた件数を掛ける。","distractors":["外れているのは足し方である。同じ欠陥について評定コスト＋内部失敗コストと外部失敗コストの両方が発生することはなく、流出した場合は後者が前者を置き換えると、シナリオの最終段落が明記している。31万円は、この会社では起こり得ない積み上げ方で作った額であり、どの1件の欠陥にも対応しない。品質コストが4つのカテゴリーに分かれていると聞くと、費目は1件の欠陥に同時に積み上がるものに見えるうえ、経営会議では合計額のほうが説明しやすいという事情も、この読み方を後押しする。さらに、外部失敗コストは利用者に届いてしまった欠陥への対処にかかる費用であって、テストにかけている費用ではないため、「テストにはこれだけの費用がかかっている」という言い方にも合わない。",null,"削れるのは1件あたり5万円の側であり、代わりに動くのはその5倍を超える側である。テストを薄くして欠陥が流出すれば、1件につき26万円の外部失敗コストが発生する。評定コストは予算書に単独の費目として見えるため、そこを削れば品質コストの総額が下がるように見え、テストを減らせば見つかる欠陥も減って内部失敗コストも一緒に下がるという読みも、当期の数字の上では成り立つ。しかしシラバスは 3.2.1 で「評価コストと内部失敗コストの合計は、通常、外部失敗コストよりも大幅に少ない」と述べ、3.2.2 で「テストが少なすぎれば、見逃した欠陥が高いリスクとなり、省略したテストのコストよりも高いコストが発生する可能性がある」と述べている。","検出件数の少なさは、テストが薄いのか欠陥の混入そのものが減ったのかを区別しないので、費用対効果の指標にならない。この会社では1件を流出前に見つけるたびに21万円を避けているのだから、検出件数が減れば、避けられている額の合計も減る。欠陥が少ないことは品質が良いことの表れなので、検出件数が少ない期は良い期だと読めてしまうところが、この説明のもっともらしさである。シラバスが定量的な利点として挙げているのは「リリース前に発見した欠陥」「予防した欠陥」「修正された欠陥」などであり、件数の少なさのほうを利点に数えてはいない。"],"flip":[null,null,"外部失敗コストの平均が26万円ではなく、利用者に届いた欠陥を自動更新でほぼ無償に直せるために1件あたり4万円にとどまる案件であれば、リリース前にかかる5万円（評定3万円＋内部失敗2万円）を下回るため、テストの実行に充てる工数を絞るほうが品質コストの総額は下がり、この説明が成り立つ",null],"quote":"評価コストと内部失敗コストの合計は、通常、外部失敗コストよりも大幅に少ない。そのため、テストは非常に価値のあるものとなる。…欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）…テストが少なすぎれば、見逃した欠陥が高いリスクとなり、省略したテストのコストよりも高いコストが発生する可能性がある。","ref":"3.2.2（欠陥あたりの平均節約額の式、テストが少なすぎる場合）、3.2.1（評価コストと内部失敗コストの合計）","misconception":"品質コストの4つのカテゴリーを1件の欠陥に同時に積み上がる費目だと読み、リリース前に見つけた場合の費目と流出した場合の費目が排他であること（流出すれば外部失敗コストが置き換わること）を踏まえずに、合計額をテストの費用や価値として示してしまう","flipNote":{"1":"この案は2つの点で外れている。1つは、同じ欠陥で評定コスト＋内部失敗コストと外部失敗コストの両方は発生せず、流出すれば後者が前者を置き換えるという集計規則に反する足し方をしていること。もう1つは、外部失敗コストがテストにかけている費用ではないのに、その合計をテストにかかっている費用として示していることである。集計規則を加算に変えても2つ目が残り、さらに費用対効果を問う設問に対して費用の合計を答えることになるため、条件を1つ動かして正解になる選択肢ではない","4":"検出件数の少なさそのものを費用対効果の高さとする説明は、原文が定量的な利点としてリリース前に発見した欠陥や修正された欠陥の件数を挙げていることに正面から反しており、単価や件数をシナリオでどう動かしても成り立たない。検出件数が減ったことが良い知らせになるのは、レビューや教育で混入そのものが減ったときだけであり、そのときでも費用対効果を示す数字は件数ではなく、1件を流出前に見つけることで避けられた額である"}},"meta":{"concept":"テストの費用対効果の計算","distractorIntent":["排他である費目を足して31万円を作り、それを1件あたりの費用として示す案: シナリオ最終段落の置換規則が否定する（MP-54）","評定コストを削れば品質コストの総額が下がるという案: 削れる5万円と代わりに動く26万円の大小、および「テストが少なすぎれば……より高いコストが発生する可能性がある」が否定する（MP-57）","検出件数の少なさを費用対効果の高さとして示す案: 定量的な利点が件数の多い側であること、および1件あたり21万円×件数という関係が否定する（MP-58）"],"distractorTypes":["D11","D6","D6"],"conceptNote":"jstqb-al-tm/kb/concepts/test-cost-benefit-calculation.md","mistakePatterns":["MP-54","MP-57","MP-58"]}},{"id":"q-3.2.2-A-2","lo":"TM-3.2.2","cluster":"3.2.2-B","variant":1,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、全国にホテルを展開する会社で、客室予約システムの開発と保守を担当するテストマネージャーである。来期の品質関連の予算を検討するため、経理部門と直近の四半期の実績を欠陥1件あたりの平均額に直した。欠陥予防コスト（設計段階のレビューや開発担当者への教育）が3万円、評定コスト（静的テストと動的テストの実施）が6万円、内部失敗コスト（リリース前に見つけた欠陥の修正）が4万円、外部失敗コスト（利用者に届いた欠陥の修正・再テスト・問い合わせ対応）が50万円である。\nこの会社では、1件の欠陥について、リリース前に見つかれば評定コストと内部失敗コストが、利用者に届けば外部失敗コストが発生するものとして集計しており、同じ欠陥で両方が発生することはない。直近の四半期は、リリース前に80件を検出し、5件が利用者に届いた。","question":"欠陥1件あたりの平均節約額を算出したうえで経営会議で述べる説明として、**適切でないもの**はどれか。1つ選べ。","choices":["欠陥の予防に充てる支出を1件あたり8万円に増やすと、欠陥1件あたりの平均節約額は32万円に下がる。","外部失敗コストの平均が50万円ではなく30万円にとどまる案件では、欠陥1件あたりの平均節約額は20万円まで縮む。","内部失敗コストの平均が4万円から9万円に上がった場合、欠陥1件あたりの平均節約額は35万円になる。","直近の四半期にリリース前で見つけた80件について、外部失敗コストを避けたことによる節約額の合計は3,200万円であり、これが今期のテストが会社に残した額である。"],"answer":[0],"explanation":{"signals":"効くのは4つの平均額のうち、式に入る3つと入らない1つの区別である。欠陥1件あたりの平均節約額は 50万円 −（6万円＋4万円）＝40万円 で、動かした変数がこの3項のどれかであれば節約額は動き、欠陥予防コストであれば動かない。総額を出すときに掛ける件数は、リリース前に検出した80件である（利用者に届いた5件ではない）。客室予約という業種や、4つの費目に添えた活動の例は、値を分けない。","why":"外れているのは、欠陥の予防に充てる支出を1件あたり8万円に増やすと平均節約額が32万円に下がる、という説明である。欠陥予防コストは節約額の式に入らないので、予防への支出をいくら動かしても、この会社の欠陥1件あたりの平均節約額は 50万円 −（6万円＋4万円）＝40万円 のまま動かない。シラバスは「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と述べており、式に入るのは3項である。原文の計算例がその証拠になる。例は「欠陥予防コスト：180 ドル」を提示したうえで、節約額を「4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル」と計算しており、提示した予防コストを一度も使っていない。この式が測っているのは、テストが1件の欠陥を届く前に見つけたことの価値であり、予防はそもそも欠陥を混入させずに済ませる活動なので、数える対象が違うからである。残る3つの説明は、外部失敗コストの平均・内部失敗コストの平均・総額にする段で掛ける件数という、この式とその総額化に実際に効くところを動かしており、値も向きも合っている。なお、これは予防への投資が無駄だという意味ではない。シラバスは「テストマネージャーは、欠陥予防コスト対内部コストと外部コストの最適な関係を見つけるように努力すべきである」と述べており、予防に投じる額の当否は、欠陥1件あたりの平均節約額という1つの数字の上では決まらない、ということである。","distractors":[null,"この説明が引き合いに出しているのは、外部失敗コストの平均が30万円にとどまる別の案件であり、評定コスト6万円と内部失敗コスト4万円はそのままである。そこでの節約額は 30万円 −（6万円＋4万円）＝20万円 となり、計算も、避けられる外部失敗コストが小さいほど節約額も小さくなるという向きも、式のとおりである。「テストの価値が下がる」という結論が直感に反するために誤りに見えるが、これは式の本体そのもので、テストの価値が、避けられる外部失敗コストの大きさに支えられていることを示す説明になっている。","内部失敗コストの平均を4万円から9万円に置き換えると 50万円 −（6万円＋9万円）＝35万円 となり、計算も、内部失敗コストが上がれば節約額が減るという向きも、式のとおりである。変数を動かした説明はどれも疑わしく見えるが、この記述が動かしているのは式に入る3項のうちの1つであり、数値も合う。","欠陥1件あたりの平均節約額40万円に、外部失敗コストの発生を避けられた件数、すなわちリリース前に検出した80件を掛けると3,200万円になる。利用者に届いた5件のほうを掛ける取り違えを疑わせる書き方だが、この記述は取り違えていない。シラバスも「平均の欠陥予防コスト、評価コスト、内部失敗コストは、リリース前に発見した欠陥数を用いて計算し」と述べており、リリース前の側の費目とリリース前に発見した欠陥数が結び付いている。"],"flip":[null,null,null,null],"quote":"欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）…欠陥予防コスト：180 ドル…欠陥1 件あたりの平均節約額＝4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル","ref":"3.2.2（欠陥あたりの平均節約額の式と計算例）","misconception":"品質コストが4つのカテゴリーに分かれているのだから式にも4つとも入ると考え、欠陥予防コストの増減を欠陥1件あたりの平均節約額の増減として報告してしまう","flipNote":{"2":"20万円を崩せるのは、この説明が自分で置いた30万円という想定か、シナリオの評定コスト6万円・内部失敗コスト4万円である。20万円は 30万円 −（6万円＋4万円）で出た額だからである。どれを動かしてもこの説明は適切でない側に回る（シナリオ側の2つなら、80件を掛けた総額の説明の数値も同時に合わなくなる）。しかし欠陥予防コストが式に入らない以上、予防への支出を増やすと平均節約額が下がるとする説明は適切でないまま残るので、適切でないものが2つ以上になり、1つ選べが成り立たない。シナリオの外部失敗コスト50万円のほうはこの引き算に入っていないので、動かしても20万円は動かず、合わなくなるのは「50万円ではなく」という前提の言い方である。予防コストが式に入る形に変えればその説明は適切になるが、そのときはこの選択肢を含む残り3つの数値がすべて合わなくなる","3":"上がった後の内部失敗コストの想定を動かせば、35万円という値は合わなくなり、この選択肢は適切でない側に回る。しかしそれをしても、欠陥予防コストは式に入らないため、正解である予防コストの記述は適切でないまま残り、適切でないものが2つになる。予防コストが式に入る形に変えれば正解の側は適切になるが、そのときはこの選択肢を含む残り3つの数値がすべて合わなくなる","4":"掛ける件数を80件から動かせば、3,200万円という合計は合わなくなり、この選択肢は適切でない側に回る。しかしそれをしても、欠陥予防コストは式に入らないため、正解である予防コストの記述は適切でないまま残り、適切でないものが2つになる。予防コストが式に入る形に変えれば正解の側は適切になるが、そのときはこの選択肢を含む残り3つの数値がすべて合わなくなる"}},"meta":{"concept":"テストの費用対効果の計算","distractorIntent":["内部失敗コストを上げたときの節約額を正しく計算した結論: 式に入る3項の1つを動かしており、値も向きも合う（否定形の正メンバー）","外部失敗コストが低い案件では節約額が縮むという正しい結論: 結論が直感に反するため誤りに見えるが、式のとおり（否定形の正メンバー）","欠陥1件あたりの節約額にリリース前の検出件数を掛けた総額の正しい結論: 掛ける件数の取り違えを疑わせるが取り違えていない（否定形の正メンバー）"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-cost-benefit-calculation.md","mistakePatterns":["MP-55"]}},{"id":"q-3.2.2-A-3","lo":"TM-3.2.2","cluster":"3.2.2-C","variant":1,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、工場設備の遠隔監視サービスを提供する会社のテストマネージャーである。来週の取締役会で、テストにかけている費用について説明することになった。\n経理部門と今期の実績を突き合わせ、費目ごとに欠陥1件あたりの平均額を算出した。この会社は、欠陥1件ごとに、出荷までに手当てできたものは評定コストと内部失敗コストで、利用者の設備で不具合として現れたものは外部失敗コストで集計している。同じ欠陥が両方に数えられることはない。","table":{"caption":"今期の費目ごとの平均額（欠陥1件あたり）と欠陥の実績","headers":["費目・実績","値"],"rows":[["欠陥予防コスト（設計レビューと開発者教育）","2万円"],["評定コスト（静的テストと動的テストの実施）","4万円"],["内部失敗コスト（出荷前の欠陥の修正と再テスト）","3万円"],["外部失敗コスト（利用者の設備での不具合の対応）","39万円"],["今期に出荷までに手当てできた欠陥","150件"],["今期に利用者の設備で現れた欠陥","20件"]]},"question":"今期のテストの費用対効果について取締役会に示す説明として、最も適切なものはどれか。1つ選べ。","choices":["利用者の設備で現れていれば1件あたり39万円が発生していたので、出荷までに手当てできた150件分の5850万円を、テストが避けた額として示す。","外部失敗コストの平均は利用者に届いた欠陥数から計算するものなので、1件あたりの差額32万円に届いた20件を掛けた640万円を、今期の節約額として示す。","1件を利用者に届く前に手当てするたびに32万円を避けている計算になるので、出荷までに手当てできた150件分の4800万円を、今期の節約額として示す。","テストの効果は金額に換算できないので、今期のテストの実行件数と、出荷までに手当てできた150件という実績を、テストが会社に残したものとして示す。"],"answer":[2],"explanation":{"signals":"効くのは、式に入る3つの平均額と、総額にする段で掛ける件数である。評定コスト4万円と内部失敗コスト3万円は出荷までに手当てできた欠陥に、外部失敗コスト39万円は利用者の設備で現れた欠陥にかかり、同じ欠陥が両方に数えられることはない。欠陥予防コスト2万円は、この会社が予防に投じている額ではあるが、欠陥1件あたりの平均節約額の式には現れない。利用者の設備で現れた20件は、外部失敗コストが実際に発生した件数であって、避けられた件数ではない。遠隔監視という業種は、どの説明が成り立つかを分けない。","why":"取締役会に示す額は4800万円である。利用者の設備で不具合として現れる前に1件を手当てするたびに32万円を避けており、今期それに当たるのが150件だからである。まず1件あたりの額を出す。シラバスは「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と計算すると述べており（式が「評価コスト」と呼ぶ費目は、3.2.1 が4カテゴリーの1つとして挙げる評定（アプレイザル）コストと同じものである）、表の値を当てはめると 39万円 −（4万円＋3万円）＝32万円 になる。式が引き算になっているのは、1件の欠陥について、出荷までに手当てした場合の費目と利用者に届いた場合の費目が排他だからであり、シナリオの集計もそうなっている。次が総額にする段である。32万円は欠陥1件あたりの値であり、原文の計算例も「欠陥1 件あたりの平均節約額」と単位を明示している。掛ける先は、外部失敗コストの発生を避けられた欠陥の数、すなわち出荷までに手当てできた150件である。利用者の設備で現れた20件については外部失敗コストが現に発生しており、避けてはいない。よって 32万円 × 150件 ＝ 4800万円 となる。表にある欠陥予防コスト2万円は式に入らないため、この計算のどこにも現れない。","distractors":["落ちているのは、出荷までに手当てする側にも費用がかかっている点である。1件を出荷前に手当てするには評定コスト4万円と内部失敗コスト3万円、合わせて7万円が実際にかかっており、150件では1050万円が投じられている。避けた額はその差であって、外部失敗コストの丸ごとではない。シラバスの式が引き算の形になっているのは、ここに費用が残るからである。「利用者の設備で現れていれば1件39万円かかっていた。だからその分を避けた」という言い方は、取締役会でそのまま通りやすく、額も大きく見える。","利用者の設備で現れた20件には外部失敗コスト39万円が現に発生しており、この20件について避けられた額は無い。32万円という差が生まれるのは、届く前に手当てできた欠陥1件ごとであり、今期それに当たるのは150件である。640万円は、節約が起きていない件数を掛けた額になっている。シラバスが「平均の外部失敗コストは、リリース後に発見した欠陥数を用いて計算される」と述べているため、外部失敗コストを含む差額にも届いた欠陥の数を掛けるのが筋に見えるが、この一文が決めているのは費目の平均額の出し方であって、節約額に掛ける件数ではない。",null,"この会社は費目ごとの平均額と実績を持っており、欠陥1件あたりの平均節約額を算出できる。それをせずに件数だけを示すのは、シラバスが問題として名指ししている状態そのものである。シラバスは「テストマネージャーを含め、その価値を定量化し、説明し、明確にできるマネージャーはほとんどいない」とその状態を挙げたうえで、「これらの利点と欠陥あたりの品質コストという観点からテストの付加価値を伝えるようにすべきである」と述べている。品質は金額にならない、件数で語るほうが安全だ、という感覚は現場に根強く、それがこの説明のもっともらしさである。なお、出荷前に手当てできた件数そのものは、シラバスが定量的な利点に挙げる「リリース前に発見した欠陥」に当たるが、テストの実行件数は挙げられていない。"],"flip":[null,null,null,null],"flipNote":{"1":"5850万円が避けた額になるのは、出荷までに手当てする側に費用がかからないときだけである。表はそこに評定コスト4万円と内部失敗コスト3万円の2つを置いており、どちらか一方を0にしても残る側が引かれるため、5850万円にはならない。表の1マスを動かして成り立たせることはできず、2つのマスを同時に動かす必要がある。外部失敗コストの丸ごとを避けた額として語れるのは、テストに費用がかからない世界である","2":"640万円が正しい総額になるのは、出荷までに手当てできた欠陥もちょうど20件だった場合である。つまり動かすことになるのは、この説明が根拠に置いている「届いた欠陥の数」ではなく、表の「今期に出荷までに手当てできた欠陥」のマスのほうであり、そのときも節約が生じているのは手当てできた側の20件である。外部失敗コストの平均を届いた欠陥数から計算するという原文の記述は、費目の平均額の出し方を述べたものであって、節約額に掛ける件数を決めてはいない。2つの件数がたまたま同じ値になれば数字は一致するが、この説明が置いている理由のほうは正しくならない","4":"この説明は、表の「今期に出荷までに手当てできた欠陥 150件」という実績はそのまま示す一方、費目ごとの平均額（単価）を金額に換算する入力としては使わないと述べている。表には費目ごとの平均額と今期の実績があり、そのどの1マスを動かしても、金額では示せないという前提は成り立たない。金額で語れなくなるのは費目の実績が1つも取れていない状況だが、それはこの設問の入力を取り去ることであって、条件を1つ変えることではない。実績が無い場面で数値を仮定して計算してはならないという話は、それとは別の状況に属する"},"quote":"欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）…平均の欠陥予防コスト、評価コスト、内部失敗コストは、リリース前に発見した欠陥数を用いて計算し、平均の外部失敗コストは、リリース後に発見した欠陥数を用いて計算される。…欠陥1 件あたりの平均節約額＝4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル","ref":"3.2.2（欠陥あたりの平均節約額の式、リリース前に発見した欠陥数とリリース後に発見した欠陥数の使い分け、計算例）、3.2.1（評定（アプレイザル）コストの呼び名）","misconception":"欠陥1件あたりの平均節約額を出したところで計算が終わったと考え、総額にする段で、外部失敗コストの発生を避けられた欠陥の数ではなく、外部失敗コストが現に発生した件数や、外部失敗コストの単価そのものを持ち出してしまう"},"meta":{"concept":"テストの費用対効果の計算","distractorIntent":["外部失敗コストの単価をそのまま避けた額として件数に掛ける案: 出荷までに手当てする側にかかる評定4万円＋内部失敗3万円を数えておらず、式が引き算である理由が落ちている","欠陥1件あたりの差額に、外部失敗コストが現に発生した件数（届いた20件）を掛ける案: シナリオの集計により、届いた20件では節約が起きていない","テストの価値は金額にならないとして実行件数と検出件数で報告する案: 費目ごとの平均額と実績が現にあり、原文は欠陥あたりの品質コストという観点から付加価値を伝えるよう求めている"],"distractorTypes":["D11","D11","D5"],"conceptNote":"jstqb-al-tm/kb/concepts/test-cost-benefit-calculation.md","mistakePatterns":["MP-103","MP-104","MP-105"]}},{"id":"q-3.2.2-A-4","lo":"TM-3.2.2","cluster":"3.2.2-D","variant":1,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、大学向けの履修・成績管理システムを提供する会社のテストマネージャーである。経理部門と昨年度の費用を突き合わせ、欠陥1件あたりの平均額を算出した。\n経理規程は、低品質を防ぐために計画的かつ積極的に行う活動の費用を欠陥予防コスト、欠陥の検出を目的とする活動の費用を評定コスト、社内で見つかった欠陥への対処を内部失敗コスト、教務課に届いた欠陥への対処を外部失敗コストに計上すると定めており、同じ欠陥が両方に計上されることはない。昨年度に届いた欠陥は、いずれもリリース時点で把握できていなかった。\n内訳は次のとおりである。\n・実装前に欠陥の入りやすい機能を洗い出し、設計とレビューの重点を決める作業 3万円\n・保守しやすいコードの書き方を開発担当者に教える研修 2万円\n・静的テストと動的テストの実施 5万円\n・社内で見つかった欠陥の修正と再テスト 4万円\n・教務課に届いた欠陥の調査・修正・問い合わせ対応 45万円","question":"テストの付加価値の説明として、最も適切なものはどれか。1つ選べ。","choices":["欠陥の検出に向けて事前に行う作業として、欠陥の入りやすい機能を洗い出す作業の3万円を静的テストと動的テストの5万円に加え、欠陥1件あたりの平均節約額は33万円になると説明する。","既知の欠陥を修正し終えるまでリリースを待つ運用に改め、1件あたり45万円の外部失敗コストを発生させないことが、テストの最も大きな付加価値になると説明する。","欠陥1件あたりの平均節約額は36万円であり、この額をさらに増やすために、社内で見つかった欠陥の修正と再テストにかかる4万円の削減から着手すると説明する。","欠陥1件あたりの平均節約額は45万円から9万円を引いた36万円であり、1件を教務課に届く前に社内で見つけるたびに、この額を避けていると説明する。"],"answer":[3],"explanation":{"signals":"効くのは、経理規程が置いた費目の定義と、5つの活動のどれがどの費目に落ちるかである。欠陥の入りやすい機能を洗い出して設計とレビューの重点を決める作業の3万円と、保守しやすいコードの書き方を教える研修の2万円は、低品質を防ぐために計画的かつ積極的に行う活動なので欠陥予防コストに落ち、式には入らない。式に入るのは、欠陥の検出を目的とする静的テストと動的テストの実施の5万円、社内で見つかった欠陥への対処の4万円、教務課に届いた欠陥への対処の45万円である。昨年度に届いた欠陥がリリース時点で把握できていなかったという一文は、既知の欠陥を直し終えてから出す案が外部失敗コストを消せるかどうかを分ける。","why":"1件を教務課に届く前に社内で見つけるたびに避けている額は36万円で、これが説明すべきテストの付加価値である。45万円 −（5万円＋4万円）＝36万円 ── 内訳のうち式に入れるのは、教務課に届いた欠陥の調査・修正・問い合わせ対応の45万円、静的テストと動的テストの実施の5万円、社内で見つかった欠陥の修正と再テストの4万円である。シラバスは「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と計算すると述べており、欠陥予防コストはこの式に入らない。原文の計算例が「欠陥予防コスト：180 ドル」を提示しながら、節約額を「欠陥1 件あたりの平均節約額＝4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル」と計算していることがその証拠になる。だから数値を式に入れる前に、どの活動がどの費目に当たるかを決めることになる。経理規程の切り分けは、シラバス 3.2.1 が置いた定義と同じ軸を使っている。3.2.1 は欠陥予防コストを「低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト」、評定（アプレイザル）コストを「欠陥検出を目的としたすべての活動のコスト」と定義しており、分かれ目は活動の名前ではなく目的である。実装前に欠陥の入りやすい機能を洗い出して設計とレビューの重点を決める作業は、すでにある欠陥を見つけるための活動ではなく、混入そのものを減らすために先回りして行う活動なので、欠陥予防コストに落ちる。保守しやすいコードの書き方を教える研修も同じである。この2つ（3万円と2万円）は式に現れないため、引く側は評定コスト5万円と内部失敗コスト4万円の合計9万円にとどまる。","distractors":["欠陥の入りやすい機能を先に洗い出して設計とレビューの重点を決める作業は、すでにある欠陥を見つける活動ではなく、混入を防ぐために先回りする活動なので、経理規程では欠陥予防コストに落ちる。規程は評定コストを「欠陥の検出を目的とする活動の費用」、欠陥予防コストを「低品質を防ぐために計画的かつ積極的に行う活動の費用」と定めており、決め手は活動の名前ではなく目的である。予防に落ちた費用は式に入らないため、評定コストは5万円のままであり、節約額は36万円になる。「テストのために事前にやる作業なのだから、テストの費用に入る」という読み方は、費目を活動の名前で決めるときに自然に出てくるもので、その作業の成果が実際にテストの重点の決め方に使われることも、この読みを後押しする。","昨年度に届いた欠陥は、いずれもリリース時点で把握できていなかったとシナリオに書かれている。だから既知の欠陥を修正し終えるまでリリースを待つ運用に改めても、1件あたり45万円の外部失敗コストは消えない。そのうえシラバスは「既知の欠陥を抱えたままで本番稼動する方が、欠陥が解決するまで本番稼動を待つよりもはるかによい場合もある」と述べ、「このような欠陥が許容されるケースでは、欠陥の発生確率と重要度が大きく関係する」としている。修正を待つかどうかは発生確率と重要度で決めることであって、全件修正が前提ではない。「欠陥は全部直してから出すのが筋だ」という言い方は、品質にこだわる立場としてそのまま通りやすいところが、この説明のもっともらしさである。","外れているのは着手の順位である。この会社の平均額では、社内で見つかった欠陥の修正と再テストの4万円を仮に半分にしても、欠陥1件あたりの節約額が増えるのは2万円だが、1件を教務課に届く前に見つければ36万円を避けられる。シラバスも 3.2.1 で「評価コストと内部失敗コストの合計は、通常、外部失敗コストよりも大幅に少ない」と述べており、額が大きいのは避けられる側である。社内の手戻りは目に見えるうえ、式の上でも4万円を下げれば節約額はその分だけ増えるので、改善の着手先として自然に見える。手戻りを減らすこと自体は誤りではないが、最も大きな節約は、欠陥を教務課に届かせないことから生まれる。",null],"flip":[null,null,null,null],"flipNote":{"1":"33万円が正しくなるのは、洗い出しの作業が欠陥予防コストではなく評定コストに落ちるときだけである。だが費目を決めているのは経理規程の定義であり、その定義はシラバス 3.2.1 の「低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト」「欠陥検出を目的としたすべての活動のコスト」と同じ軸に立っている。定義そのものを書き換えれば費目は動くが、それは当てはめる規則を入れ替えることであって、当てはめる先の条件を1つ変えることではない。活動の説明を変えても同じで、そのときこの選択肢が名指ししている作業は別の作業になる","2":"この選択肢の誤りは2つあり、支えている文も2つある。既知の欠陥を全部直してから出すという立場については、原文が「既知の欠陥を抱えたままで本番稼動する方が…はるかによい場合もある」と述べて全件修正を前提に置かず、判断材料として発生確率と重要度を挙げている。45万円が消えるという見込みのほうは、昨年度に届いた欠陥がリリース時点で把握できていなかったというシナリオの一文が退ける。どちらか一方を動かしても、もう一方が同じようにこの説明を退けるため、条件を1つ変えて正解にすることができない","3":"この選択肢が挙げている36万円という額は正しい。外れているのは、どこから着手するかという順位のほうである。順位を決めているのはシナリオの1つの金額ではなく、社内の手戻りを減らしても下がるのはその手戻りの分だけであるのに対し、欠陥を教務課に届かせなければ外部失敗コストが丸ごと発生しない、というコストの構造である。内部失敗コストの平均額をシナリオで動かせば節約額の値そのものが変わり、この説明が挙げる36万円のほうが合わなくなるので、動かしても正解の側には回らない"},"quote":"低品質を防ぐために計画的かつ積極的に行われるすべての活動のコスト…欠陥検出を目的としたすべての活動のコスト…既知の欠陥を抱えたままで本番稼動する方が、欠陥が解決するまで本番稼動を待つよりもはるかによい場合もある。…欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）","ref":"3.2.2（欠陥あたりの平均節約額の式、既知の欠陥を抱えたままの本番稼動）、3.2.1（欠陥予防コストと評定（アプレイザル）コストの定義）","misconception":"品質コストの費目を活動の名前で決めてしまい、欠陥の混入を先回りして防ぐための作業をテストの費用（評定コスト）に数えた結果、欠陥1件あたりの平均節約額の式に、本来そこに入らない欠陥予防コストを持ち込んでしまう"},"meta":{"concept":"テストの費用対効果の計算","distractorIntent":["混入を先回りして防ぐための作業を評定コストに数え、その分だけ節約額を小さく見積もる案: 経理規程の定義（目的で分ける）とシラバス3.2.1 の定義が否定する（MP-61）","既知の欠陥を修正し終えるまでリリースを待ち、外部失敗コストを発生させないことを付加価値とする案: 原文が別の立場を明示し、届いた欠陥が把握できていなかったというシナリオの一文も否定する","節約額は正しく出したうえで、改善の着手先を社内の手戻りの削減に置く案: 内容ではなく順位が誤っており、単価の大小と3.2.1 の記述が否定する（MP-59）"],"distractorTypes":["D11","D6","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-cost-benefit-calculation.md","mistakePatterns":["MP-61","MP-59"]}}]</script>
