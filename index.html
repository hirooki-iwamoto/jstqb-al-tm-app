  /* ===================================================================
   * 22. 保存（Store 経由のみ。失敗しても画面は進む）
   * =================================================================== */

  function save(mutator) {
    var r;
    try {
      r = Store.set(mutator);
    } catch (e) {
      /* 不変条件違反（同一セッション×同一問題）。書き込みは行われていない。 */
      S.notice = { kind: 'dup', text: '同じ回の同じ問題を2度記録しようとしました。この操作は取り消されました（' + (e && e.code ? e.code : 'error') + '）。' };
      return { ok: false, code: 'exception' };
    }
    if (!r.ok) {
      S.notice = { kind: r.code, text: noticeText(r.code, r.error) };
    }
    return r;
  }
  function noticeText(code, detail) {
    if (code === 'quota') return 'この端末の保存容量がいっぱいです。設定から記録を書き出してから、古い記録を消してください。解いた内容は画面の上では保たれています。';
    if (code === 'frozen') return 'この記録より新しい版で作られた記録があるため、書き込みを止めています。';
    if (code === 'unavailable' || code === 'blocked') return 'この端末では記録を保存できません（プライベートモードなど）。解いた内容はこの画面を閉じると消えます。';
    return '記録を保存できませんでした' + (detail ? '（' + detail + '）' : '') + '。画面はそのまま進みます。';
  }

  /* 解説画面を開いた事実を必ず残す（SPEC §8.4・門 F-T5） */
  function markSeen(sessionId, itemId) {
    save(function (draft) { Rec.markSeen(draft, sessionId, itemId); });
  }

  /* ===================================================================
   * 23. セッションの開始・進行
   * =================================================================== */

  /* 全期間のやり直しで実際に始まる数。ホームのラベルと startSession の両方が
     この1本を通るので、数字が食い違わない（M-02）。 */
  function reviewStartCount(poolCount) {
    if (poolCount <= 0) return 0;
    return Math.min(effectiveCount(poolCount), poolCount);
  }

  /* 未完了の枠を確かめてから始める（SPEC §9。模試1つ＋演習1つまで） */
  function startSession(mode, filter, profile) {
    var c = ctx();
    var slot = mode === 'exam' ? 'exam' : 'practice';
    var act = Rec.activeSessions(c.rec);
    if (act[slot]) {
      askResume(act[slot], function () { reallyStart(mode, filter, profile); });
      return;
    }
    reallyStart(mode, filter, profile);
  }

  function askResume(sess, proceed) {
    openSheet('中断中の' + (sess.mode === 'exam' ? '模試' : '演習') + 'があります',
      [h('p', null, Filter.sessionLabel(sess, Bank) + '（' + sess.itemIds.length + '問）をどうしますか。')],
      [
        { text: '中断したほうを再開', cls: 'act act-main', run: function () { closeSheet(); resumeSession(sess.id); } },
        { text: '破棄して新しく始める', cls: 'act act-danger', run: function () { closeSheet(); discardSession(sess.id, true); proceed(); } },
        { text: 'やめる', cls: 'act act-quiet', run: function () { closeSheet(); } }
      ]);
  }

  function reallyStart(mode, filter, profile) {
    var c = ctx();
    var ids, n;
    if (mode === 'exam') {
      var set = Bank.examSet(profile);
      if (!set || !set.length) { S.notice = { kind: 'stock', text: 'この模試のセットを組めません。' }; render(); return; }
      ids = set.map(function (it) { return it.id; });
    } else if (mode === 'review') {
      var sid0 = filter && filter.sessionId ? filter.sessionId : null;
      var pool = Stats.reviewPool(c.rec, Bank, sid0);
      /* ★ボタンに出した件数と、実際に出る問題数を一致させる（SPEC §7.2）。
         回を指定したやり直しは「その回の間違い全部」なので、問題数チップで丸めない。
         全期間は母数が青天井なのでチップで丸めるが、そのぶんラベルに両方書く。 */
      n = sid0 ? Math.max(1, pool.count) : reviewStartCount(pool.count);
      var rv = Sched.review(n, { bank: Bank, rec: c.rec, now: c.now, sessionId: sid0 });
      ids = rv.ids;
      if (rv.relaxed.indexOf('count') >= 0) {
        S.notice = { kind: 'stock', text: '在庫が足りないので ' + ids.length + '問で始めます。' };
      }
      filter = null;
    } else {
      var stockIds = filter ? Filter.itemIds(filter, Bank) : Bank.all().map(function (it) { return it.id; });
      var stock = stockIds ? stockIds.length : 0;
      n = effectiveCount(stock);
      if (n <= 0) { S.notice = { kind: 'stock', text: 'この範囲には問題がありません。' }; render(); return; }
      var pk = Sched.pick(n, { bank: Bank, attempts: c.rec.attempts, now: c.now, mode: 'practice', filter: filter });
      ids = pk.ids;
      if (pk.relaxedCount) {
        S.notice = { kind: 'stock', text: '在庫が足りないので ' + ids.length + '問で始めます（' + n + '問を予定していました）。' };
      }
    }
    if (!ids.length) { S.notice = { kind: 'stock', text: '出題できる問題がありません。' }; render(); return; }

    var sid = null;
    var r = save(function (draft) {
      sid = Rec.nextId(draft, 'session');
      var sess = Rec.makeSession({
        id: sid, mode: mode, profile: mode === 'exam' ? profile : null,
        filter: filter, itemIds: ids, now: c.now,
        opts: { explainMode: draft.settings.explainMode, shuffleChoices: draft.settings.shuffleChoices },
        remainingMs: mode === 'exam' ? (EXAM.profiles[profile] ? EXAM.profiles[profile].minutes * 60000 : 3600000) : null
      });
      draft.sessions.push(sess);
    });
    if (!sid) { render(); return; }

    var rt = { id: sid, mode: mode, index: 0, selected: [], itemStart: Date.now(), bodyEl: null };
    if (mode === 'exam') {
      S.live.exam = rt;
      startTimer();
      go('exam', {});
    } else {
      S.live.practice = rt;
      go('practice', {});
    }
  }

  function resumeSession(sid) {
    var c = ctx();
    var sess = Rec.findSession(c.rec, sid);
    if (!sess) { render(); return; }
    var pos = Rec.resumeIndex(sess);
    var rt = { id: sid, mode: sess.mode, index: Math.min(pos.index, sess.itemIds.length - 1), selected: [], itemStart: Date.now(), bodyEl: null };
    if (sess.mode === 'exam') {
      rt.index = Math.min(sess.cursor || 0, sess.itemIds.length - 1);
      rt.selected = answersOf(sess, sess.itemIds[rt.index]);
      S.live.exam = rt;
      startTimer();
      go('exam', {});
    } else {
      if (pos.done) { finishPractice(sid); return; }
      S.live.practice = rt;
      go('practice', {});
    }
  }

  function discardSession(sid, silent) {
    save(function (draft) {
      var s = Rec.findSession(draft, sid);
      if (s) s.state = 'discarded';
    });
    var c = ctx();
    var s2 = Rec.findSession(c.rec, sid);
    if (s2 && s2.mode === 'exam') { S.live.exam = null; stopTimer(); }
    else S.live.practice = null;
    if (!silent) render();
  }

  /* 解答の確定（1問ごとに attempts を積む。模試は積まない） */
  function doAnswer() {
    var rt = S.live.practice;
    if (!rt) return;
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess) return;
    var itemId = sess.itemIds[rt.index];
    var item = Bank.get(itemId);
    if (!item) { nextAfterAnswer(); return; }
    if (rt.selected.length !== item.pickCount) return;

    var ms = Math.max(0, Date.now() - rt.itemStart);
    var chosen = rt.selected.slice().sort(function (a, b) { return a - b; });
    var correct = Stats.grade(item, chosen);
    var immediate = sess.opts.explainMode === 'immediate';

    save(function (draft) {
      var s = Rec.findSession(draft, rt.id);
      s.answers[itemId] = chosen;
      s.spentMs[itemId] = ms;
      s.cursor = rt.index;
      var a = Rec.makeAttempt({
        id: Rec.nextId(draft, 'attempt'), itemId: itemId, sessionId: s.id,
        mode: s.mode, chosen: chosen, correct: correct, ms: ms, now: Date.now(),
        seenExplanation: false
      });
      Rec.appendAttempt(draft, a);
    });

    if (immediate) {
      S.armedAt = Date.now();
      go('explainOne', {}, true);
    } else {
      nextAfterAnswer();
    }
  }

  function nextAfterAnswer() {
    var rt = S.live.practice;
    if (!rt) { go('home', {}, true); return; }
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess) { go('home', {}, true); return; }
    if (rt.index >= sess.itemIds.length - 1) { finishPractice(rt.id); return; }
    rt.index += 1;
    rt.selected = [];
    rt.itemStart = Date.now();
    S.armedAt = Date.now();
    go('practice', {}, true);
  }

  /* 解説を読み終えたときの行き先。結果が残っていればそこへ、無ければホームへ。 */
  function explainDone(sid) {
    var c = ctx();
    var sess = sid ? Rec.findSession(c.rec, sid) : null;
    S.stack = [];
    if (sess && sess.state === 'done') go('result', { sessionId: sid }, true);
    else go('home', {}, true);
  }

  /* 同じ条件でもう1セット（B-20） */
  function startAgain(sid) {
    var c = ctx();
    var sess = sid ? Rec.findSession(c.rec, sid) : null;
    if (!sess) { go('home', {}, true); return; }
    S.stack = [];
    if (sess.mode === 'exam') startSession('exam', null, sess.profile);
    else startSession('practice', sess.filter || null, null);
  }

  function finishPractice(sid) {
    save(function (draft) {
      var s = Rec.findSession(draft, sid);
      if (s) { s.state = 'done'; s.endedAt = ALTM.util.iso(Date.now()); }
    });
    S.live.practice = null;
    S.stack = [];
    go('result', { sessionId: sid }, true);
  }

  /* --- 模試 --- */
  function examAnswerCurrent() {
    var rt = S.live.exam;
    if (!rt) return;
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess) return;
    var itemId = sess.itemIds[rt.index];
    var ms = Math.max(0, Date.now() - rt.itemStart);
    var chosen = rt.selected.slice().sort(function (a, b) { return a - b; });
    save(function (draft) {
      var s = Rec.findSession(draft, rt.id);
      if (chosen.length) s.answers[itemId] = chosen;
      s.spentMs[itemId] = (s.spentMs[itemId] || 0) + ms;
      s.cursor = rt.index;
    });
    rt.itemStart = Date.now();
  }

  function examGoto(index) {
    var rt = S.live.exam;
    if (!rt) return;
    examAnswerCurrent();
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    rt.index = Math.max(0, Math.min(index, sess.itemIds.length - 1));
    rt.selected = answersOf(sess, sess.itemIds[rt.index]);
    rt.itemStart = Date.now();
    render();
  }

  function examSubmit(timeUp) {
    var rt = S.live.exam;
    if (!rt) return;
    examAnswerCurrent();
    var sid = rt.id;
    save(function (draft) {
      var s = Rec.findSession(draft, sid);
      if (!s) return;
      for (var i = 0; i < s.itemIds.length; i++) {
        var id = s.itemIds[i];
        var ans = answersOf(s, id);
        var item = Bank.get(id);
        var blank = ans.length === 0;
        var a = Rec.makeAttempt({
          id: Rec.nextId(draft, 'attempt'), itemId: id, sessionId: s.id, mode: 'exam',
          chosen: blank ? [] : ans, unanswered: blank,
          correct: blank ? null : (item ? Stats.grade(item, ans) : false),
          ms: (s.spentMs || {})[id] || 0, now: Date.now(),
          seenExplanation: false
        });
        Rec.appendAttempt(draft, a);
      }
      s.state = 'done';
      s.endedAt = ALTM.util.iso(Date.now());
      if (timeUp) s.remainingMs = 0;
    });
    stopTimer();
    S.live.exam = null;
    S.stack = [];
    go('result', { sessionId: sid }, true);
  }

  var timerHandle = null;
  function startTimer() {
    stopTimer();
    if (typeof global.setInterval !== 'function') return;
    timerHandle = global.setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerHandle !== null && typeof global.clearInterval === 'function') global.clearInterval(timerHandle);
    timerHandle = null;
  }
  function tick() {
    var rt = S.live.exam;
    if (!rt) { stopTimer(); return; }
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess || sess.state !== 'active') { stopTimer(); return; }
    var left = Math.max(0, (sess.remainingMs || 0) - 1000);
    save(function (draft) {
      var s = Rec.findSession(draft, rt.id);
      if (s) s.remainingMs = left;
    });
    /* 残り時間だけは作り直さずに書き換える（DESIGN §8.2 の例外） */
    if (rt.timerEl && S.screen === 'exam') {
      rt.timerEl.textContent = fmtClock(left);
      at(rt.timerEl, 'class', 'timer' + (left <= 5 * 60000 ? ' is-urgent' : ''));
    }
    if (left <= 0) examSubmit(true);
  }

  /* ===================================================================
   * 24. ダイアログ
   * =================================================================== */

  function openSheet(title, bodyNodes, actions) {
    closeSheet();
    var dlg = h('dialog', 'sheet');
    at(dlg, 'aria-label', title);
    add(dlg, h('p', 'sheet-head', title));
    var body = h('div', 'sheet-body');
    add(body, bodyNodes);
    add(dlg, body);
    var acts = h('div', 'sheet-acts');
    for (var i = 0; i < actions.length; i++) {
      var a = actions[i];
      var b = btn(a.cls, 'sheet-run', { i: String(i) }, a.text);
      add(acts, b);
    }
    add(dlg, acts);
    add(root, dlg);
    S.sheet = { el: dlg, actions: actions };
    if (typeof dlg.showModal === 'function') { try { dlg.showModal(); } catch (e) { at(dlg, 'open', ''); } }
    else at(dlg, 'open', '');
  }
  function closeSheet() {
    if (!S.sheet) return;
    var el = S.sheet.el;
    if (typeof el.close === 'function') { try { el.close(); } catch (e) { /* 無視 */ } }
    if (el.parentNode) el.parentNode.removeChild(el);
    S.sheet = null;
  }

  /* ===================================================================
   * 25. イベント（委譲1本）
   * =================================================================== */

  function onClick(ev) {
    var node = actOf(ev.target);
    if (!node) return;
    if (node.disabled || node.getAttribute('aria-disabled') === 'true') { return; }
    /* <input> に付いた口は change で拾う。click でも拾うと、ラベル活性で2度飛ぶ。 */
    if (node.tagName === 'INPUT') return;
    var act = node.getAttribute('data-act');
    if (ARMED[act] && (Date.now() - S.armedAt) < ARM_MS) return;   /* 二度押しで飛ばさない */
    if (ev.preventDefault) ev.preventDefault();
    dispatch(act, node, ev);
  }
  var ARMED = { answer: 1, 'explain-next': 1, 'exam-submit': 1 };

  function onChange(ev) {
    var node = actOf(ev.target);
    if (!node) return;
    var act = node.getAttribute('data-act');
    if (act === 'set-minsec') {
      var v = Number(ev.target.value);
      if (!isFinite(v) || v < 0) v = 0;
      save(function (draft) { draft.settings.minSecondsPerItem = v; });
      render();
    } else if (act === 'set-shuffle') {
      var on = !!ev.target.checked;
      save(function (draft) { draft.settings.shuffleChoices = on; });
      render();
    } else if (act === 'import-text') {
      /* 描き直すと入力中の焦点が飛ぶので、値を控えるだけにする */
      S.importPaste = String(ev.target.value === undefined ? '' : ev.target.value);
    } else if (act === 'toggle-review') {
      setReviewTo(node.getAttribute('data-item'), !!ev.target.checked);
    } else {
      dispatch(act, node, ev);
    }
  }

  function dispatch(act, node, ev) {
    var d = function (k) { return node.getAttribute('data-' + k); };
    switch (act) {
      case 'tab': S.tab = d('tab'); S.stack = []; S.screen = d('tab'); S.params = {}; render(); break;
      case 'back': back(); break;
      case 'go-home': S.stack = []; go('home', {}, true); break;
      case 'dismiss-notice': S.notice = null; render(); break;

      case 'set-count':
        S.count = Number(d('n'));
        save(function (draft) { draft.settings.count = S.count; });
        render();
        break;
      case 'start-practice': startSession('practice', null, null); break;
      case 'start-review': startSession('review', null, null); break;
      case 'start-review-session': startSession('review', { sessionId: d('sid') }, null); break;
      case 'start-weak-lo': startSession('practice', { kind: 'lo', value: d('key') }, null); break;
      case 'start-weak-dtype': startSession('practice', { kind: 'distractorType', value: d('key') }, null); break;
      case 'open-picker': S.picker = { kind: d('kind'), key: null, keyKind: null }; go('picker', {}); break;
      /* 記録の行から「自分で選ぶ」の同じ絞り込みへ跳ぶ（弱点 → 演習の道） */
      case 'open-picker-at':
        S.picker = { kind: d('kind') === 'lo' ? 'lo' : (d('kind') === 'chapter' ? 'section' : d('kind')),
                     key: d('key'), keyKind: d('kind') };
        go('picker', {});
        break;
      case 'picker-tab': S.picker = { kind: d('kind'), key: null, keyKind: null }; render(); break;
      case 'picker-select': S.picker.key = d('key'); S.picker.keyKind = d('kind') || S.picker.kind; render(); break;
      case 'set-stock-only': S.stockOnly = d('on') === '1'; render(); break;
      case 'start-filtered':
        if (S.picker.key) startSession('practice', Filter.fromUnit({ kind: S.picker.keyKind || S.picker.kind, key: S.picker.key }), null);
        break;
      case 'open-exam': go('examIntro', { profile: d('profile') }); break;
      case 'pick-profile': S.params = { profile: d('profile') }; render(); break;
      case 'start-exam': startSession('exam', null, d('profile')); break;

      case 'pick': togglePick(Number(d('oidx'))); break;
      case 'answer': doAnswer(); break;
      case 'explain-next': nextAfterAnswer(); break;
      case 'suspend': suspendPractice(); break;

      case 'resume': resumeSession(d('sid')); break;
      case 'discard': confirmDiscard(d('sid')); break;
      case 'regrade': regrade(d('sid')); break;

      case 'open-explain-all': S.explainWrongOnly = false; go('explainAll', { sessionId: d('sid'), index: Number(d('index') || 0) }); break;
      case 'open-explain-at': go('explainAll', { sessionId: d('sid'), index: Number(d('index') || 0) }); break;
      case 'explain-done': explainDone(d('sid')); break;
      case 'start-again': startAgain(d('sid')); break;
      case 'explain-page': case 'explain-goto':
        S.params = { sessionId: S.params.sessionId, index: Number(d('index')) }; render(); break;
      case 'toggle-wrong-only': S.explainWrongOnly = !S.explainWrongOnly; render(); break;
      case 'toggle-review': toggleReview(d('item')); break;

      case 'exam-flag': examFlag(d('item')); break;
      case 'exam-goto': examGoto(Number(d('index'))); break;
      case 'exam-submit-confirm': confirmSubmit(); break;
      case 'exam-submit': closeSheet(); examSubmit(false); break;
      case 'exam-suspend-confirm': confirmExamSuspend(); break;
      case 'exam-suspend': closeSheet(); suspendExam(); break;

      case 'history-tab': S.history.tab = d('tab'); render(); break;

      case 'export': doExport(); break;
      case 'copy-export': doCopy(); break;
      case 'ack-export': ackExport(); break;
      case 'import-pick': doImportPick(); break;
      case 'go-recover': S.notice = null; S.stack = []; go('settings', {}, true); break;
      case 'recover-show': doRecoverShow(d('kind')); break;
      case 'recover-restore': doRecoverRestore(d('kind')); break;
      case 'recover-drop': confirmRecoverDrop(d('kind')); break;
      case 'import-paste': doImportPaste(); break;
      case 'import-commit': doImportCommit(); break;
      case 'import-cancel': S.importState = null; render(); break;
      case 'clear-step': S.clearStep += 1; render(); break;
      case 'clear-cancel': S.clearStep = 0; render(); break;
      case 'clear-do': doClear(); break;
      case 'set-explainMode': save(function (dr) { dr.settings.explainMode = d('value'); }); render(); break;
      case 'set-theme': setTheme(d('value')); break;
      case 'sheet-run':
        if (S.sheet) {
          var a = S.sheet.actions[Number(d('i'))];
          if (a && a.run) a.run();
        }
        break;
      default: break;
    }
  }

  function togglePick(oidx) {
    var rt = S.screen === 'exam' ? S.live.exam : S.live.practice;
    if (!rt) return;
    if (!isArr(rt.selected)) rt.selected = [];   /* 復帰で壊れた値が入っていても落ちない */
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess) return;
    var item = Bank.get(sess.itemIds[rt.index]);
    if (!item) return;
    var i = rt.selected.indexOf(oidx);
    if (item.pickCount === 1) {
      rt.selected = (i >= 0) ? [] : [oidx];
    } else if (i >= 0) {
      rt.selected.splice(i, 1);
    } else if (rt.selected.length < item.pickCount) {
      rt.selected.push(oidx);
    } else {
      rt.selected.shift();
      rt.selected.push(oidx);
    }
    if (S.screen === 'exam') examAnswerCurrent();
    repaintChoices();
  }

  function toggleReview(itemId) {
    var c = ctx();
    setReviewTo(itemId, !reviewOf(c.rec, itemId));
  }
  function setReviewTo(itemId, on) {
    save(function (draft) { Rec.setReview(draft, itemId, on); });
    render();
  }

  function suspendPractice() {
    var rt = S.live.practice;
    var done = 0, total = 0;
    if (rt) {
      var c0 = ctx();
      var s0 = Rec.findSession(c0.rec, rt.id);
      if (s0) { total = s0.itemIds.length; done = Rec.resumeIndex(s0).index; }
      save(function (draft) {
        var s = Rec.findSession(draft, rt.id);
        if (s) s.cursor = rt.index;
      });
    }
    S.stack = [];
    /* 押した瞬間に何も言われないと「消えたのか」が分からない（B-19）。
       演習は1問ごとに記録しているので確認は挟まないが、残ることは必ず伝える。 */
    S.notice = { kind: 'suspend', text: '演習を中断しました（' + done + ' / ' + total + '問）。'
      + '解いたぶんは記録に残っています。下の「中断中」から続きを再開できます。' };
    go('home', {}, true);
  }

  /* 模試は60分ぶんが懸かるので、抜ける前に確認する（B-19） */
  function confirmExamSuspend() {
    var rt = S.live.exam;
    if (!rt) { suspendExam(); return; }
    examAnswerCurrent();
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    if (!sess) { suspendExam(); return; }
    var answered = sess.itemIds.length - blankCount(sess);
    openSheet('模試を中断しますか',
      [h('p', null, 'いま ' + answered + ' / ' + sess.itemIds.length + '問に解答しています。'),
       h('p', null, '解答と残り時間（' + fmtClock(sess.remainingMs || 0) + '）はそのまま残ります。'
         + 'ホームの「中断中」から、この続きを再開できます。'),
       h('p', 'note', '提出はされません。採点もまだです。')],
      [
        { text: '中断する', cls: 'act act-main', run: function () { closeSheet(); suspendExam(); } },
        { text: '模試に戻る', cls: 'act act-quiet', run: function () { closeSheet(); } }
      ]);
  }

  function suspendExam() {
    var rt = S.live.exam;
    var msg = '模試を中断しました。解答と残り時間はそのまま残っています。';
    if (rt) {
      examAnswerCurrent();
      var c = ctx();
      var sess = Rec.findSession(c.rec, rt.id);
      if (sess) {
        msg = '模試を中断しました（' + (sess.itemIds.length - blankCount(sess)) + ' / ' + sess.itemIds.length
          + '問・残り ' + fmtClock(sess.remainingMs || 0) + '）。解答と残り時間はそのまま残っています。'
          + '下の「中断中」から再開できます。';
      }
    }
    stopTimer();
    S.stack = [];
    S.notice = { kind: 'suspend', text: msg };
    go('home', {}, true);
  }

  function confirmDiscard(sid) {
    var c = ctx();
    var sess = Rec.findSession(c.rec, sid);
    if (!sess) return;
    var n = 0;
    for (var i = 0; i < sess.itemIds.length; i++) {
      if (answersOf(sess, sess.itemIds[i]).length > 0) n++;
    }
    var isExam = sess.mode === 'exam';
    openSheet('破棄しますか',
      [isExam
        /* §6.0 が琥珀を求めている「破棄」。マゼンタ（＝不正解）で出すと
           「◯問の解答が採点されません」が「不正解でした」に見える。 */
        ? h('p', 'caveat', '未提出の解答 ' + n + '問は採点されません。'
            + '記録は残るので、記録画面の試行一覧からあとで採点し直せます。')
        : h('p', null, 'この演習を破棄します。解いた ' + n + '問はすでに記録に残っているので消えません。')],
      [
        { text: '破棄する', cls: 'act act-danger is-armed', run: function () { closeSheet(); discardSession(sid, false); } },
        { text: 'やめる', cls: 'act act-quiet', run: function () { closeSheet(); } }
      ]);
  }

  function confirmSubmit() {
    var rt = S.live.exam;
    if (!rt) return;
    examAnswerCurrent();
    var c = ctx();
    var sess = Rec.findSession(c.rec, rt.id);
    var blanks = blankCount(sess);
    var body = [];
    /* ★「未解答を残したまま提出しようとしている」は、このアプリで最も引き返すべき瞬間。
       素の本文色ではなく注意（琥珀）で出す（SPEC §6.0 の状態の色4つのうち「注意」）。
       .caveat は自分で面と縦線を持つので、.sheet-body の中でもそのまま効く
       （bandRow は .wrap の全幅へはみ出す負の余白を持つので、シートには合わない）。
       全問解答して出すときは琥珀を出さない —— 危なくない場面で注意を鳴らすと、
       本当に危ない場面の琥珀が効かなくなる。 */
    if (blanks > 0) {
      body.push(h('p', 'caveat', '未解答が ' + blanks + '問 あります。'
        + 'そのまま提出すると、その ' + blanks + '問は0点として採点されます。'));
    }
    body.push(h('p', null, '全 ' + sess.itemIds.length + '問中 ' + (sess.itemIds.length - blanks) + '問に解答済み・'
      + 'フラグ ' + (sess.flagged || []).length + '問。提出すると解答を変えられません。'));
    openSheet('提出しますか', body,
      [
        { text: '提出する', cls: 'act act-main', run: function () { closeSheet(); examSubmit(false); } },
        { text: '戻る', cls: 'act act-quiet', run: function () { closeSheet(); } }
      ]);
  }

  function examFlag(itemId) {
    var rt = S.live.exam;
    if (!rt) return;
    save(function (draft) {
      var s = Rec.findSession(draft, rt.id);
      if (!s) return;
      var i = s.flagged.indexOf(itemId);
      if (i >= 0) s.flagged.splice(i, 1); else s.flagged.push(itemId);
    });
    render();
  }

  /* 破棄した模試を「やはり採点する」（SPEC §6.5 / §6.6） */
  function regrade(sid) {
    var c = ctx();
    var sess = Rec.findSession(c.rec, sid);
    if (!sess) return;
    var already = false;
    for (var i = 0; i < c.rec.attempts.length; i++) if (c.rec.attempts[i].sessionId === sid) already = true;
    save(function (draft) {
      var s = Rec.findSession(draft, sid);
      if (!s) return;
      if (!already) {
        for (var j = 0; j < s.itemIds.length; j++) {
          var id = s.itemIds[j];
          var ans = answersOf(s, id);
          var item = Bank.get(id);
          var blank = ans.length === 0;
          Rec.appendAttempt(draft, Rec.makeAttempt({
            id: Rec.nextId(draft, 'attempt'), itemId: id, sessionId: s.id, mode: s.mode,
            chosen: blank ? [] : ans, unanswered: blank,
            correct: blank ? null : (item ? Stats.grade(item, ans) : false),
            ms: (s.spentMs || {})[id] || 0, now: Date.now(), seenExplanation: false
          }));
        }
      }
      s.state = 'done';
      if (!s.endedAt) s.endedAt = ALTM.util.iso(Date.now());
    });
    go('result', { sessionId: sid });
  }

  /* ===================================================================
   * 26. 書き出し・読み込み・消去（SPEC §6.7）
   * =================================================================== */

  function doExport() {
    var out = Store.export();
    var res = Platform.saveText(out.filename, out.text);
    /* verified は常に false。成立したかは確かめられないので、全文の段を必ず出す（門 A-T4） */
    S.exportState = { filename: out.filename, text: out.text, started: res.ok, acked: false };
    S.notice = { kind: 'export', text: res.ok
      ? 'ファイルの保存を開始しました。保存できたかどうかは確かめられないので、下の全文も控えてください。'
      : 'ファイルとして保存できませんでした。下の全文をコピーして控えてください。' };
    render();
  }
  function doCopy() {
    var txt = S.exportState ? S.exportState.text : '';
    var nav = global.navigator;
    if (nav && nav.clipboard && typeof nav.clipboard.writeText === 'function') {
      try {
        nav.clipboard.writeText(txt);
        S.notice = { kind: 'export', text: 'コピーしました。貼り付け先で全文が入っているか確かめてください。' };
      } catch (e) {
        S.notice = { kind: 'export', text: '自動コピーができませんでした。全文を選んで手でコピーしてください。' };
      }
    } else {
      S.notice = { kind: 'export', text: 'この環境では自動コピーができません。全文を選んで手でコピーしてください。' };
    }
    render();
  }
  function ackExport() {
    if (!S.exportState) return;
    S.exportState.acked = true;
    save(function (draft) { draft.settings.lastExportAt = ALTM.util.iso(Date.now()); });
    S.notice = { kind: 'export', text: '控えたことを記録しました。' };
    render();
  }

  /* 退避した記録を取り出す（M-01）。全文表示と書き出しは、通常の書き出しと同じ段を通る。 */
  function doRecoverShow(kind) {
    var rc = Store.recover(kind);
    if (!rc.ok) {
      S.notice = { kind: 'recover', text: '取り出せませんでした（' + (rc.code || 'unknown') + '）。' };
      render();
      return;
    }
    var res = Platform.saveText(rc.filename, rc.text);
    S.exportState = { filename: rc.filename, text: rc.text, started: res.ok, acked: false };
    S.notice = { kind: 'recover', text: (RECOVER_LABEL[kind] || kind) + 'を取り出しました。'
      + (res.ok ? 'ファイルの保存を始めましたが、成立したかは確かめられません。' : 'ファイルには保存できませんでした。')
      + '下の全文を控えてください。' };
    render();
  }
  /* 取り出した本文を、読み込みと同じ確認（差分 → 書き出しを控える → 置換）に流す。 */
  function doRecoverRestore(kind) {
    var rc = Store.recover(kind);
    if (!rc.ok) {
      S.notice = { kind: 'recover', text: '取り出せませんでした（' + (rc.code || 'unknown') + '）。' };
      render();
      return;
    }
    S.importPaste = rc.text;
    S.importState = { text: rc.text, res: Store.import(rc.text) };
    S.notice = { kind: 'recover', text: (RECOVER_LABEL[kind] || kind) + 'を読み込む用意ができました。下で差分を確かめてください。' };
    render();
  }
  function confirmRecoverDrop(kind) {
    openSheet('この退避を消しますか',
      [h('p', 'caveat', (RECOVER_LABEL[kind] || kind) + 'を消します。消すと二度と取り出せません。'),
       h('p', 'note', '先に「全文を見る・書き出す」で控えておくことをおすすめします。')],
      [
        { text: '消す', cls: 'act act-danger is-armed', run: function () {
          closeSheet();
          var r = Store.dropRecovery(kind);
          S.notice = { kind: 'recover', text: r.ok ? '退避を消しました。' : '消せませんでした（' + (r.code || '') + '）。' };
          render();
        } },
        { text: 'やめる', cls: 'act act-quiet', run: function () { closeSheet(); } }
      ]);
  }

  function doImportPick() {
    var p = Platform.pickText();
    if (!p || typeof p.then !== 'function') {
      S.notice = { kind: 'import', text: 'この環境ではファイルを開けません。' };
      render();
      return;
    }
    p.then(function (r) {
      if (!r || !r.ok) {
        if (!r || r.code !== 'cancel') S.notice = { kind: 'import', text: 'ファイルを読めませんでした。' };
        render();
        return;
      }
      S.importState = { text: r.text, res: Store.import(r.text) };
      render();
    });
  }
  /* 貼り付けた本文を読み込む。ファイル選択と同じ確認（差分 → 書き出しを控える
     → 置換）を通るので、入口が増えるだけで手順は緩まない。 */
  function doImportPaste() {
    var text = S.importPaste || '';
    if (importTextEl && typeof importTextEl.value === 'string') text = importTextEl.value;
    S.importPaste = text;
    if (!text || !text.replace(/\s+/g, '')) {
      S.notice = { kind: 'import', text: '貼り付けた本文が空です。' };
      render();
      return;
    }
    S.importState = { text: text, res: Store.import(text) };
    render();
  }

  function doImportCommit() {
    if (!S.importState || !S.importState.res.ok) return;
    if (!(S.exportState && S.exportState.acked)) return;
    var r = Store.import(S.importState.text, { commit: true });
    S.importState = null;
    S.importPaste = '';
    S.notice = { kind: 'import', text: r.committed ? '読み込みました。' : '読み込めましたが保存できませんでした。' };
    S.live = { practice: null, exam: null };
    render();
  }

  function doClear() {
    var r = Store.clear();
    S.clearStep = 0;
    S.live = { practice: null, exam: null };
    S.exportState = null;
    S.importState = null;
    S.notice = { kind: 'clear', text: r.ok ? '記録を全部消しました。' : '消せませんでした（' + (r.code || '') + '）。' };
    render();
  }

  function setTheme(v) {
    save(function (draft) { draft.settings.theme = v; });
    applyTheme(v);
    render();
  }
  function applyTheme(v) {
    var el = D.documentElement;
    if (!el || !el.setAttribute) return;
    if (v === 'light' || v === 'dark') el.setAttribute('data-theme', v);
    else if (el.removeAttribute) el.removeAttribute('data-theme');
  }

  /* ===================================================================
   * 27. 起動
   * =================================================================== */

  function boot(mountId) {
    var mount = D.getElementById(mountId || 'app');
    if (!mount) return null;
    buildShell(mount);
    try {
      S.bootInfo = Bank.boot();
      S.booted = true;
    } catch (e) {
      S.bootError = (e && e.message) || String(e);
      S.booted = false;
      render();
      return S;
    }
    var rec = Store.get();
    var st = Store.status();
    S.count = readCount(rec);
    applyTheme(rec.settings.theme);
    if (st.report && (st.report.broken || st.report.newer || st.report.lost)) {
      /* 「退避してあります」と言うなら、そこへ行く道を同じ場所に置く（B-15）。
         黙って空の記録で始めると、学習者には「全部消えた」としか読めない。 */
      S.notice = st.report.broken
        ? { kind: 'records', act: { act: 'go-recover', text: '取り出す' },
            text: '記録を読み取れなかったので、新しく作り直しました。前の記録は退避してあるので、設定から取り出せます。' }
        : (st.report.newer
          ? { kind: 'records', text: 'この端末には、このアプリより新しい版で作られた記録があります。書き込みを止めています。' }
          : { kind: 'records', act: (st.hasPrev || st.hasBak) ? { act: 'go-recover', text: '取り出す' } : null,
              text: '以前あった記録が見つかりませんでした（端末側で消された可能性があります）。' });
    } else if (!st.writable) {
      S.notice = { kind: 'readonly', text: noticeText(st.lastErrorCode || 'unavailable') };
    }
    /* 中断中の模試があればタイマーは動かさない（再開を選ばせる。SPEC §9） */
    S.screen = 'home';
    S.tab = 'home';
    historyInit();
    render();
    return S;
  }

  /* ===================================================================
   * 28. 外に出す口（デバッグと検算）
   * =================================================================== */

  global.ALTM_UI = {
    boot: boot,
    render: render,
    go: go,
    state: S,
    screens: screens,
    get root() { return root; },
    /* 検算用の入口。描画そのものは上の render を通る */
    parts: {
      questionBody: renderQuestionBody,
      explainOne: renderExplainOne,
      dtypeBadge: dtypeBadge,
      rich: rich,
      setRich: setRich,
      mdPlain: mdPlain,
      mdSplit: mdSplit,
      rateText: rateText,
      readCount: readCount,
      levelOf: levelOf,
      levelLabel: levelLabel,
      LEVELS: LEVELS,
      countPicker: countPicker,
      forecastSeries: forecastSeries
    },
    setArm: function (ms) { ARM_MS = ms; },
    dispatch: dispatch
  };

  /* shell.html の #app に自動で載る。テストは自前で boot を呼ぶ。
     器が見つからないときも黙らない —— #app が無いと shell.html の砦の見張りも
     「まだ起動中か」を見分けられず黙るので、ここが最後の報せ手になる。 */
  if (D.getElementById && D.getElementById('app')) boot('app');
  else bootBail('#app（描画先の器）', 'ページの中に、画面を入れる器（id="app"）が見つかりません。');

})(typeof window !== 'undefined' ? window : this);
</script>

</body>
</html>
