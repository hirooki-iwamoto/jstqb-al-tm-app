  function pill(text, kind) { return h('span', 'pill' + (kind ? ' is-' + kind : ''), text); }

  function kPill(k) { return pill('K' + k, 'k' + k); }

  /* 問題数チップ（5/10/15/20/25）。在庫を超える段は押せない（SPEC §7.0）。 */
  function countPicker(stock, titleText) {
    var box = h('div', 'countpicker');
    add(box, h('p', 'countpicker-title', titleText || '問題数'));
    var set = h('div', 'chipset');
    at(set, 'role', 'group');
    at(set, 'aria-label', '1回の問題数');
    var steps = Sched.countSteps(stock);
    var any = false;
    for (var i = 0; i < steps.length; i++) if (steps[i].enabled) any = true;
    if (!any) {
      /* 在庫が最小段（5問）に満たない。実数を1つだけ出す（DESIGN §7.9）。 */
      var c0 = btn('chip is-on', 'set-count', { n: String(Math.max(1, stock)) }, Math.max(1, stock) + '問');
      at(c0, 'aria-pressed', 'true');
      add(set, c0);
      add(box, set);
      add(box, h('p', 'note', '在庫が ' + stock + '問なので、この回は ' + Math.max(1, stock) + '問で始まります。'));
      return box;
    }
    /* 選択中の印は「実際に始まる数」に付ける。S.count は好みとして覚えたまま、
       在庫が戻れば元の段に戻る。 */
    var eff = effectiveCount(stock);
    for (var j = 0; j < steps.length; j++) {
      var st = steps[j];
      var on = st.enabled && st.n === eff;
      var c = btn('chip' + (on ? ' is-on' : ''), 'set-count', { n: String(st.n) }, String(st.n));
      at(c, 'aria-pressed', on ? 'true' : 'false');
      if (!st.enabled) lock(c, '在庫 ' + stock + '問。' + st.n + '問は選べません');
      add(set, c);
    }
    add(box, set);
    if (steps[steps.length - 1].enabled === false) {
      var note = '在庫は ' + stock + '問。これを超える段は選べません。';
      if (eff !== S.count) note += 'いまは ' + eff + '問で始まります（' + S.count + '問は在庫が戻れば選ばれます）。';
      add(box, h('p', 'note', note));
    }
    return box;
  }

  /* 実際に始める問題数（B-10）。
     在庫で丸めた結果が主ボタンに出るので、チップの選択状態もこの値に合わせる。
     そうしないと「丸で囲まれた5」「取り消し線だが選択中の10」「主ボタンの6問」の
     3つが同時に見えて、どれが選ばれているのか読めない。
     在庫が最小段（5）に満たないときだけ実数で始める（DESIGN §7.9）。 */
  /* 問題数の好み（B-9）。
     「1駅で5問」が想定なのに毎朝いちばん最初の操作が「5を押し直す」になるのは
     おかしいので、記録に覚える。
     ★core.js の DEFAULT_SETTINGS にまだ count が無いため、いまは Store の
       射影（project）で落とされる＝起動のたびに10に戻る。core が count を
       足した瞬間、このまま覚えるようになる（画面側の書き換えは要らない）。 */
  function readCount(rec) {
    var v = rec && rec.settings ? rec.settings.count : null;
    var steps = Sched.COUNT_STEPS;
    for (var i = 0; i < steps.length; i++) if (steps[i] === v) return v;
    return 10;
  }

  function effectiveCount(stock) {
    if (stock <= 0) return 0;
    var steps = Sched.COUNT_STEPS;
    if (stock < steps[0]) return stock;
    var best = steps[0];
    for (var i = 0; i < steps.length; i++) {
      if (steps[i] <= stock && steps[i] <= S.count) best = steps[i];
    }
    return best;
  }

  /* ===================================================================
   * 7. 問題本文（4経路で共有する1本。門 G-T6）
   *
   *   renderQuestionBody(item, seed, {shuffle, selected, mode})
   *   mode = 'answer'（肢が押せる）| 'read'（肢は押せず正誤の印が付く）
   * =================================================================== */

  function renderQuestionBody(item, seed, opts) {
    opts = opts || {};
    var body = h('div', 'q-body');

    var meta = h('div', 'q-meta');
    at(meta, 'data-qb', 'meta');
    add(meta, kPill(item.k));
    add(meta, h('span', null, item.points + '点'));
    add(meta, h('span', null, '学習目標 ' + item.lo));
    add(meta, h('span', null, '節 ' + item.section));
    add(body, meta);

    /* 1. シナリオ（無い8問は枠ごと出さない） */
    if (item.scenario) {
      var det = h('details', 'scenario');
      at(det, 'data-qb', 'scenario');
      at(det, 'open', '');
      add(det, h('summary', null, 'シナリオ'));
      add(det, rich('p', 'scenario-text', item.scenario));
      add(body, det);
    }

    /* 2. 表（table ＋ table2 を畳んだもの。落とすと解答不能。SPEC §4.2） */
    for (var t = 0; t < item.tables.length; t++) {
      add(body, tableBox(item.tables[t], t));
    }

    /* 3. 設問 */
    var q = rich('p', 'qtext', item.question);
    at(q, 'data-qb', 'question');
    add(body, q);

    /* 4. 選択肢。表示は必ず Bank.view を通す（門 G-T5） */
    var view = Bank.view(item, seed, opts.shuffle !== false);
    var list = h('div', 'choices');
    at(list, 'data-qb', 'choices');
    var multi = item.pickCount > 1;
    at(list, 'role', multi ? 'group' : 'radiogroup');
    at(list, 'aria-label', multi ? item.pickCount + 'つ選ぶ' : '選択肢');

    var sel = opts.selected || [];
    var els = [];
    for (var i = 0; i < view.ordered.length; i++) {
      var ch = view.ordered[i];
      var picked = sel.indexOf(ch.idx) >= 0;
      var cls = 'choice';
      if (opts.mode === 'read') {
        if (ch.isAnswer && picked) cls += ' is-ok';
        else if (ch.isAnswer) cls += ' is-missed';
        else if (picked) cls += ' is-no';
      } else if (picked) cls += ' is-sel';

      var b = btn(cls, opts.mode === 'read' ? null : 'pick', { oidx: String(ch.idx) });
      at(b, 'data-oidx', String(ch.idx));
      at(b, 'role', multi ? 'checkbox' : 'radio');
      at(b, 'aria-checked', picked ? 'true' : 'false');
      if (opts.mode === 'read') { at(b, 'aria-disabled', 'true'); b.disabled = true; b.setAttribute('disabled', ''); }
      add(b, h('span', 'choice-tile', tileChar(i)));
      var bodyEl = rich('span', 'choice-body', ch.text);
      if (opts.mode === 'read' && ch.isAnswer && !picked) {
        add(bodyEl, h('br'), h('span', 'note', '選ばなかった'));
      }
      add(b, bodyEl);
      if (opts.mode === 'read') {
        /* 正解の肢は、選んだかどうかに関わらず ○。帯の凡例（○ 正解 / ✕ 不正解 /
           — 未解答）と食い違わせない。選べていない事実は記号ではなく文字で添える
           （色や形だけに頼らないという規律を、記号にも通す）。 */
        var mark = ch.isAnswer ? '○' : (picked ? '✕' : '');
        if (mark) {
          var mk = h('span', 'choice-mark', mark);
          at(mk, 'aria-label', ch.isAnswer ? (picked ? '正解・選んだ' : '正解・選ばなかった') : '不正解・選んだ');
          add(b, mk);
        }
      }
      add(list, b);
      els.push(b);
    }
    add(body, list);
    body._choiceEls = els;
    body._view = view;
    return body;
  }

  function tableBox(tb, idx) {
    var box = h('div', 'tbl');
    at(box, 'data-qb', 'tables');
    at(box, 'role', 'region');
    at(box, 'tabindex', '0');
    at(box, 'aria-label', '表' + (tb.caption ? '：' + mdPlain(tb.caption) : ' ' + (idx + 1)));
    var table = h('table');
    /* 1列目の固定は、見出しと1列目の文字が短いときだけ（可視幅を食い潰さない。
       DESIGN §8.8「max-content は使わない」「40% を超えるなら付けない」） */
    var wide = (tb.headers[0] || '').length;
    for (var r0 = 0; r0 < tb.rows.length; r0++) {
      var c0 = String(tb.rows[r0][0] === undefined ? '' : tb.rows[r0][0]);
      if (c0.length > wide) wide = c0.length;
    }
    var stick = wide <= 8 && tb.headers.length > 2;

    var thead = h('thead'), trh = h('tr');
    for (var i = 0; i < tb.headers.length; i++) {
      var th = rich('th', (stick && i === 0) ? 'stick' : null, tb.headers[i]);
      at(th, 'scope', 'col');
      add(trh, th);
    }
    add(thead, trh);
    add(table, thead);
    var tbody = h('tbody');
    for (var r = 0; r < tb.rows.length; r++) {
      var tr = h('tr');
      for (var c = 0; c < tb.rows[r].length; c++) {
        add(tr, rich('td', (stick && c === 0) ? 'stick' : null, tb.rows[r][c]));
      }
      add(tbody, tr);
    }
    add(table, tbody);
    add(box, table);
    if (tb.caption) add(box, rich('p', 'tbl-cap', tb.caption));
    return box;
  }

  /* ===================================================================
   * 8. 解説1問ぶん（SPEC §6.3 の表示順を data-expl で固定する）
   * =================================================================== */

  function renderExplainOne(item, chosenIdx, unanswered, seed, shuffle) {
    var box = h('div', 'expl');
    var chosen = chosenIdx || [];
    var correct = !unanswered && Stats.grade(item, chosen);

    /* 0. 正誤 */
    var vk = unanswered ? 'blank' : (correct ? 'ok' : 'no');
    var v = h('div', 'verdict is-' + vk);
    at(v, 'data-expl', 'verdict');
    at(v, 'tabindex', '-1');
    add(v, h('span', 'verdict-mark', unanswered ? '—' : (correct ? '○' : '✕')));
    var vt = h('span', 'verdict-text', unanswered ? '未解答' : (correct ? '正解です' : '不正解です'));
    add(vt, h('span', 'verdict-sub', item.lo + '・K' + item.k + '・' + item.points + '点'));
    add(v, vt);
    add(box, v);

    /* 1. あなたの解答（必ず出る。門 G-T2） */
    var mine = h('div', null);
    at(mine, 'data-expl', 'mine');
    add(mine, bandRow('mine', 'あなたの解答'));
    if (unanswered || chosen.length === 0) {
      add(mine, h('p', 'expl-text', '解答していません。'));
    } else {
      for (var m = 0; m < chosen.length; m++) add(mine, choiceLine(item, chosen[m], true));
    }
    add(box, mine);

    /* 2. なぜ違うのか（選んだ肢のうち誤答だったものだけ） */
    var wrongPicked = [];
    for (var w = 0; w < chosen.length; w++) if (!item.choices[chosen[w]].isAnswer) wrongPicked.push(chosen[w]);
    if (wrongPicked.length) {
      var wb = h('div', null);
      at(wb, 'data-expl', 'wrong');
      add(wb, bandRow('wrong', 'なぜ違うのか'));
      for (var x = 0; x < wrongPicked.length; x++) add(wb, wrongBlock(item, wrongPicked[x]));
      add(box, wb);
    }

    /* 2.5 この思い込み（B-18）
       ★「なぜ違うのか」の直後に置く。思い込みの名前は「なぜ間違えたのか」の
       答えそのもので、このアプリの差別化そのもの。最下部（4,000px の下端）に
       置くと、電車で読む人はそこまで到達せず、名前が「後日談」になる。 */
    var mc = h('div', null);
    at(mc, 'data-expl', 'misconception');
    add(mc, bandRow('hold', 'この思い込み'));
    add(mc, rich('p', 'expl-text', item.misconception || ''));
    add(box, mc);

    /* 3. 正解 */
    var ab = h('div', null);
    at(ab, 'data-expl', 'answer');
    add(ab, bandRow('answer', '正解'));
    for (var a = 0; a < item.answerIdx.length; a++) {
      var picked2 = chosen.indexOf(item.answerIdx[a]) >= 0;
      add(ab, choiceLine(item, item.answerIdx[a], false, picked2 ? 'これは合っていた' : '選ばなかった'));
    }
    add(box, ab);

    /* 3b. 解説 */
    var wy = h('div', null);
    at(wy, 'data-expl', 'why');
    add(wy, bandRow('answer', '解説'));
    add(wy, rich('p', 'expl-text', item.why || ''));
    add(box, wy);

    /* 4. どこを見るか */
    var sg = h('div', null);
    at(sg, 'data-expl', 'signals');
    /* 琥珀＝注意（ここを読み落とすな）。青（is-mine）は「自分のこと」専用にする */
    add(sg, bandRow('warn', 'どこを見るか'));
    add(sg, rich('p', 'expl-text', item.signals || ''));
    add(box, sg);
    if (item.note) {
      var nt = h('div', null);
      at(nt, 'data-expl', 'note');
      add(nt, rich('p', 'note', item.note));
      add(box, nt);
    }

    /* 6. シラバス原文と参照節 */
    var qb = h('div', null);
    at(qb, 'data-expl', 'quote');
    /* 出典は状態ではないので、色を持たない中立の帯（.band の素） */
    add(qb, bandRow(null, 'シラバス'));
    var bq = rich('blockquote', 'quote', item.quote || '');
    add(bq, rich('cite', 'quote-cite', item.ref || ''));
    add(qb, bq);
    add(box, qb);

    /* 7. 他の誤答（選ばなかったもの）は折りたたみ */
    var others = [];
    for (var o = 0; o < item.wrongIdx.length; o++) {
      if (chosen.indexOf(item.wrongIdx[o]) < 0) others.push(item.wrongIdx[o]);
    }
    if (others.length) {
      var det = h('details', 'fold');
      at(det, 'data-expl', 'others');
      add(det, h('summary', null, '他の誤答（' + others.length + '件）'));
      var bodyO = h('div', 'fold-body');
      for (var y = 0; y < others.length; y++) add(bodyO, wrongBlock(item, others[y]));
      add(det, bodyO);
      add(box, det);
    }
    return box;
  }

  /* 肢1本の表示（記号タイル＋全文）。元添字で引く。 */
  function choiceLine(item, oidx, mineSide, noteText) {
    var ch = item.choices[oidx];
    var row = h('div', 'choice' + (ch.isAnswer ? ' is-ok' : (mineSide ? ' is-no' : '')));
    at(row, 'aria-disabled', 'true');
    at(row, 'data-oidx', String(oidx));
    add(row, h('span', 'choice-tile', tileChar(oidx)));
    var body = rich('span', 'choice-body', ch.text);
    /* 添えるのは文字。記号を変えて「選んだか」を表すと、○ の意味が2つになる。 */
    if (noteText) add(body, h('br'), h('span', 'note', noteText));
    add(row, body);
    return row;
  }

  /* 誤答1本ぶん（否定根拠・誤答型・作問の意図・裏返し条件） */
  function wrongBlock(item, oidx) {
    var ch = item.choices[oidx];
    var box = h('div', 'card');
    add(box, choiceLine(item, oidx, true));

    /* 2a. なぜ違うのか（159/159 完備） */
    var why = rich('p', 'expl-text', ch.why || '');
    at(why, 'data-expl', 'wrong-why');
    add(box, why);

    /* 2b. 誤答型（記号＋名前＋色＋形） */
    var types = h('p', null);
    at(types, 'data-expl', 'wrong-type');
    add(types, dtypeBadges(ch.dtype));
    add(box, types);

    /* 2b'. 作問者が突いた誤解。折りたたみの中でよいので必ず出す（SPEC §4.2） */
    if (ch.intent) {
      var det = h('details', 'fold');
      at(det, 'data-expl', 'wrong-intent');
      add(det, h('summary', null, 'この誤答が突いているもの'));
      add(det, rich('p', 'fold-body', ch.intent));
      add(box, det);
    }

    /* 2c / 2c'. 裏返し条件 */
    if (ch.flip) {
      var f = h('p', 'expl-text');
      f.appendChild(D.createTextNode('この肢が正解になるのは、'));
      setRich(f, ch.flip);
      f.appendChild(D.createTextNode(' のときだけです。'));
      at(f, 'data-expl', 'wrong-flip');
      add(box, f);
    } else {
      var nf = h('p', 'noflip', 'この肢が正解になる条件は作れません。');
      at(nf, 'data-expl', 'wrong-noflip');
      add(box, nf);
      if (ch.flipNote) {
        var d2 = h('details', 'fold');
        add(d2, h('summary', null, 'なぜ条件を作れないか（作問上の理由）'));
        add(d2, rich('p', 'fold-body', ch.flipNote));
        add(box, d2);
      }
    }
    return box;
  }

  /* ===================================================================
   * 9. ドック（下部固定バー）
   * =================================================================== */

  function setDock(rows, hint, dockH) {
    empty(dockEl);
    dockEl.hidden = false;
    var inner = h('div', 'dock-inner');
    for (var i = 0; i < rows.length; i++) {
      var r = h('div', 'dock-row');
      add(r, rows[i]);
      add(inner, r);
    }
    if (hint) add(inner, h('p', 'dock-hint', hint));
    add(dockEl, inner);
    var sec = screens[S.screen];
    at(sec, 'class', sec.getAttribute('class').replace(/\s*has-dock/, '') + ' has-dock');
    if (dockH) cssVar(sec, '--dock-h', dockH);
    else if (sec.style && sec.style.removeProperty) sec.style.removeProperty('--dock-h');
  }
  function clearDock() {
    empty(dockEl);
    dockEl.hidden = true;
  }

  /* 「あとで復習する」（新しい試行を作らない。§4.7・門 A-T6） */
  function laterFlag(itemId, on) {
    var lab = h('label', 'laterflag' + (on ? ' is-on' : ''));
    /* data-act は <input> だけに置く。<label> にも置くと、ラベル活性で
       click が label と input の2回飛び、印が2度裏返る。 */
    var inp = h('input');
    at(inp, 'type', 'checkbox');
    at(inp, 'data-act', 'toggle-review');
    at(inp, 'data-item', itemId);
    inp.checked = !!on;
    if (on) at(inp, 'checked', '');
    add(lab, inp, h('span', null, 'あとで復習する'));
    return lab;
  }

  /* ===================================================================
   * 10. 画面の切り替え
   * =================================================================== */

  /* 端末の「戻る」（iPhone の縁スワイプ）でアプリごと抜けないようにする（M-06）。
   *
   * 画面を積むたびに履歴を1つ積み、popstate で1つ戻す。積みが空のときだけ
   * ブラウザに任せる（袋小路を作らないため、出られなくはしない）。
   * 解く画面・模試画面では、まず「残っている」ことを伝えてから戻す。
   *
   * pushState には URL を渡さない —— file:// で URL 付きの pushState は
   * origin が null なので SecurityError になる。状態だけなら通る。
   * artifact（sandbox された iframe）で塞がれていても try/catch で黙って諦める。
   */
  var histSeq = 0, histOk = false;

  function historyPush() {
    if (!histOk) return;
    try { global.history.pushState({ altm: ++histSeq }, ''); } catch (e) { histOk = false; }
  }
  function historyInit() {
    try {
      if (!global.history || !global.history.pushState || !global.addEventListener) return;
      global.history.replaceState({ altm: 0 }, '');
      global.addEventListener('popstate', onPopState, false);
      histOk = true;
    } catch (e) { histOk = false; }
  }
  function onPopState() {
    if (!S.booted) return;
    /* 60分の模試が1回のスワイプで飛ばないように、まず確認する */
    if (S.screen === 'exam') { historyPush(); confirmExamSuspend(); return; }
    if (S.screen === 'practice') { historyPush(); suspendPractice(); return; }
    if (S.stack.length > 0) { back(); return; }
    if (S.screen !== 'home') { historyPush(); S.stack = []; go('home', {}, true); return; }
    /* ホームで積みも無い。ここは塞がない（出られないほうが袋小路） */
  }

  function go(screen, params, replace) {
    if (S.screen !== screen || !replace) {
      if (ROOTS[screen]) S.stack = [];
      else if (!replace) S.stack.push({ screen: S.screen, params: S.params });
    }
    var pushed = !replace && !ROOTS[screen];
    S.screen = screen;
    S.params = params || {};
    if (ROOTS[screen]) S.tab = ROOTS[screen];
    S.armedAt = Date.now();
    if (pushed) historyPush();
    render();
  }
  function back() {
    var prev = S.stack.pop();
    if (prev) { S.screen = prev.screen; S.params = prev.params; }
    else { S.screen = S.tab; S.params = {}; }
    S.armedAt = Date.now();
    render();
  }

  function render() {
    if (!S.booted) { renderBootError(); showOnly('bootError'); return; }
    clearDock();
    pendingScroll = null;
    /* 器の class を毎回素へ戻す（has-dock と --dock-h が前の画面から残らないように） */
    var sec0 = screens[S.screen];
    if (sec0) {
      at(sec0, 'class', BASECLS[S.screen]);
      if (sec0.style && sec0.style.removeProperty) sec0.style.removeProperty('--dock-h');
    }
    switch (S.screen) {
      case 'home': renderHome(); break;
      case 'history': renderHistory(); break;
      case 'settings': renderSettings(); break;
      case 'picker': renderPicker(); break;
      case 'practice': renderPractice(); break;
      case 'explainOne': renderExplainOneScreen(); break;
      case 'explainAll': renderExplainAll(); break;
      case 'result': renderResult(); break;
      case 'examIntro': renderExamIntro(); break;
      case 'exam': renderExam(); break;
      default: renderBootError(); break;
    }
    showOnly(S.screen);
    renderTabs();
  }

  function showOnly(name) {
    for (var k in screens) if (Object.prototype.hasOwnProperty.call(screens, k)) screens[k].hidden = (k !== name);
    var off = !!TABS_OFF[name];
    at(root, 'class', 'app' + (off ? ' tabs-off' : ''));
    var sec = screens[name];
    if (sec && sec.focus) { try { sec.focus(); } catch (e) { /* 無視 */ } }
    /* 画面を出してから送る。隠れている間は寸法が出ないので動かない。 */
    if (pendingScroll) {
      var target = pendingScroll;
      pendingScroll = null;
      try {
        if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest', inline: 'center' });
      } catch (e2) {
        try { if (target.scrollIntoView) target.scrollIntoView(false); } catch (e3) { /* 無視 */ }
      }
    }
  }

  function say(text) { if (liveEl) liveEl.textContent = text; }

  /* ===================================================================
   * 11. 集計のひとまとまり（毎回作り直す）
   * =================================================================== */

  function ctx() {
    var rec = Store.get();
    var now = Date.now();
    return { rec: rec, now: now, base: Stats.base(rec, Bank, now) };
  }

  /* ===================================================================
   * 12. 起動失敗・空の状態
   * =================================================================== */

  function renderBootError() {
    var sec = screens.bootError;
    empty(sec);
    add(sec, appbar({ title: 'JSTQB AL-TM 学習' }));
    var w = wrap();
    var e = h('div', 'error');
    at(e, 'role', 'alert');
    add(e, h('p', 'error-title', '問題データを読み込めませんでした'));
    add(e, h('p', null, 'このアプリはファイル1枚で動きます。ファイルが途中で欠けているか、保存のときに壊れた可能性があります。'));
    if (S.bootError) add(e, h('pre', 'error-detail', String(S.bootError)));
    add(w, e);
    add(w, h('p', 'note', '学習の記録は問題データとは別に保存されています。この画面からは消えません。'));
    add(sec, w);
    clearDock();
  }

  /* ===================================================================
   * 13. ホーム（SPEC §6.1）
   * =================================================================== */

  function renderHome() {
    var sec = screens.home;
    empty(sec);
    var c = ctx();
    var status = Store.status();

    add(sec, appbar({ title: 'JSTQB AL-TM 学習' }));

    var stock = Bank.all().length;
    if (stock === 0) {
      var w0 = wrap();
      add(w0, emptyBox('◻', '出題できる問題がありません', '問題データが空か、すべて隔離されています。設定のいちばん下に詳しい状態が出ています。'));
      add(sec, w0);
      return;
    }

    /* ---- 紺の色面 ---- */
    var panel = h('div', 'brandpanel');
    var pw = wrap();

    /* 中断中のセッション。主ボタンの文言と、下の「中断中」の枠の両方が使う。 */
    var act = Rec.activeSessions(c.rec);
    var actives = [];
    if (act.practice) actives.push(act.practice);
    if (act.exam) actives.push(act.exam);
    /* 新しいほうを主ボタンが引き受ける。同じ時刻なら模試を先に —— 模試だけが
       残り時間を持っていて、放っておくと時間切れになる。 */
    actives.sort(function (x, y) {
      var d = ALTM.util.parseAt(y.startedAt) - ALTM.util.parseAt(x.startedAt);
      if (d) return d;
      return (y.mode === 'exam' ? 1 : 0) - (x.mode === 'exam' ? 1 : 0);
    });

    /* リング（分母＝今日やると決めた問題数、分子＝今日解いた数）。
       ★何の 0 / 10 なのかを、リングの中と下の両方に書く。
       初めて開いた人に、説明なしで読めることだけを基準にする。 */
    var today = Stats.today(c.base, c.now);
    var denom = Math.max(1, effectiveCount(stock));
    var box1 = h('div', 'brandpanel-box');
    var grid = h('div', 'brandpanel-grid');

    var ringCol = h('div', null);
    var ring = h('div', 'ring');
    cssVar(ring, '--ring-pct', Math.max(0, Math.min(100, Math.round(today.count / denom * 100))));
    at(ring, 'role', 'img');
    at(ring, 'aria-label', '今日 ' + today.count + '問 / 今日の目標 ' + denom + '問');
    var lab = h('div', 'ring-label');
    add(lab, h('span', 'ring-unit', '今日'));
    add(lab, h('span', 'ring-value num', String(today.count)));
    add(lab, h('span', 'ring-unit', '/ ' + denom + '問'));
    add(ring, lab);
    add(ringCol, ring);
    add(ringCol, h('p', 'note', '解いた数 / 今日の目標'));
    add(grid, ringCol);

    /* 曜日の棒。表しているのは Stats.daily の count＝その日に解いた問題数
       （白紙・5秒未満・重複は入らない）。高さはその日の目標に対する割合。
       ★見出しと凡例を必ず添える。記号だけで「何かの棒」に見せない。 */
    var weekCol = h('div', null);
    add(weekCol, h('p', 'card-title', 'この7日に解いた数'));
    var week = h('div', 'weekbars');
    at(week, 'role', 'img');
    var daily = Stats.daily(c.base, c.now, 7);
    var weekTotal = 0, weekLabel = [];
    for (var d2 = 0; d2 < daily.length; d2++) {
      var dd = new Date(daily[d2].start);
      var isToday = d2 === daily.length - 1;
      var cnt = daily[d2].count;
      weekTotal += cnt;
      var bar = h('div', 'weekbar' + (isToday ? ' is-today' : ''));
      var track = h('div', 'weekbar-track');
      var fill = h('div', 'weekbar-fill');
      /* 目標を満杯とする。いちばん多い日を満杯にすると、1問しか解かなかった日でも
         その日だけなら棒が満杯になり、量を読み違える。 */
      cssVar(fill, '--bar', Math.max(0, Math.min(100, Math.round(cnt / denom * 100))));
      add(track, fill);
      add(bar, track, h('span', 'weekbar-day', WEEKDAY[dd.getDay()]));
      var one = (dd.getMonth() + 1) + '/' + dd.getDate() + '（' + WEEKDAY[dd.getDay()] + '）'
        + (isToday ? '・今日' : '') + ' ' + cnt + '問';
      at(bar, 'title', one);
      add(week, bar);
      weekLabel.push(one);
    }
    at(week, 'aria-label', 'この7日に解いた数：' + weekLabel.join('、'));
    add(weekCol, week);
    add(weekCol, h('p', 'note', weekTotal === 0
      ? 'この7日はまだ1問も解いていません。1回やると、その日の棒が伸びます。'
      : '棒は日ごとに解いた数（合計 ' + weekTotal + '問）。いちばん上まで伸びると、その日の目標 ' + denom + '問に届いた印です。'));
    add(grid, weekCol);

    add(box1, grid);
    add(pw, box1);

    /* 問題数チップと主ボタン */
    add(pw, countPicker(stock, '今日やる問題数'));
    var n = effectiveCount(stock);
    /* ★まだ何もしていない人に「続ける」と言わない。
       中断中があるならその続きが最も価値のある1タップなので、主ボタンが引き受ける
       （下の「中断中」の枠からは、その1件ぶんの再開を外して役割を重ねない）。 */
    var promoted = null;
    var freshText = today.count === 0 ? ('はじめる（' + n + '問）') : ('続ける（' + n + '問）');
    if (actives.length) {
      var top = actives[0];
      promoted = top.id;
      var pos = Rec.resumeIndex(top);
      var at1 = Math.min(pos.index + 1, top.itemIds.length);
      add(pw, btn('act act-hero', 'resume', { sid: top.id },
        (top.mode === 'exam' ? '模試の続きから' : '続きから')
        + '（' + at1 + '問目 / ' + top.itemIds.length + '問）'));
      /* 続きがあっても、新しく始める道は1タップのまま残す（門 D-T3） */
      add(pw, btn('act act-sub', 'start-practice', null, '新しく ' + freshText));
    } else {
      add(pw, btn('act act-hero', 'start-practice', null, freshText));
    }

    /* 数値カード3つ */
    var cards = h('div', 'statcards');
    var streak = Stats.streak(c.base, c.now);
    var totalMs = 0;
    for (var r = 0; r < c.base.rows.length; r++) totalMs += c.base.rows[r].ms || 0;
    add(cards, statcard(String(streak.days), '日', '連続日数', streak.days > 0));
    add(cards, statcard(String(c.base.rows.length), '問', '総解答', null));
    var mins = Math.round(totalMs / 60000);
    add(cards, statcard(mins >= 60 ? String(Math.floor(mins / 60)) : String(mins), mins >= 60 ? '時間' + pad2(mins % 60) + '分' : '分', '学習時間', null));
    add(pw, cards);
    add(panel, pw);
    add(sec, panel);

    /* ---- 明るい地。空の枠は出さない。典型的な状態で4つ以内 ---- */
    var lw = wrap();
    var nt = noticeNode();
    if (nt) add(lw, nt);
    /* 通知（消せる）と同じことを段落（消せない）でも言わない（B-16）。
       通知を閉じたあとは、事実が消えないように段落のほうが残る。 */
    if (!status.writable && !(S.notice && S.notice.kind === 'readonly')) {
      add(lw, bandRow('warn', status.frozen
        ? 'この端末には、このアプリより新しい版で作られた記録があります。書き込みを止めています。'
        : 'この端末では記録を保存できません（プライベートモードなど）。解いた内容はこの画面を閉じると消えます。'));
    }

    /* 中断中（あるときだけ。最大2件）。
       主ボタンが引き受けた1件は、ここでは「破棄」と内訳だけを持つ。
       両方に「続き」を出すと、どちらが何なのか分からない。 */
    if (actives.length) {
      var fr0 = section('中断中', 'resume');
      for (var a = 0; a < actives.length; a++) add(fr0, resumeRow(c, actives[a], actives[a].id === promoted));
      add(lw, fr0);
    }

    /* 予想得点 */
    add(lw, forecastFrame(c));

    /* 弱いところから（1枠に2行） */
    add(lw, weakFrame(c));

    /* 自分で選ぶ */
    var fr3 = section('自分で選ぶ', 'picker');
    var chips = h('div', 'chipset');
    add(chips, btn('chip', 'open-picker', { kind: 'dtype' }, '誤答型'));
    add(chips, btn('chip', 'open-picker', { kind: 'section' }, '章・節'));
    add(chips, btn('chip', 'open-picker', { kind: 'lo' }, '学習目標'));
    add(fr3, chips);
    add(lw, fr3);

    /* 間違えた問題・模試（この2つで1枠） */
    var pool = Stats.reviewPool(c.rec, Bank, null);
    var profiles = Bank.examProfiles();
    if (pool.count > 0 || profiles.length > 0) {
      var fr4 = section('やり直す・試す', 'review-exam');
      var cd = card();
      if (pool.count > 0) {
        var rn = reviewStartCount(pool.count);
        add(cd, btn('act act-main', 'start-review', null,
          '間違えた問題（全期間 ' + pool.count + '問 のうち ' + rn + '問）'));
      }
      if (profiles.length > 0) {
        var row = h('div', 'chipset');
        for (var p = 0; p < profiles.length; p++) {
          var pr = EXAM.profiles[profiles[p]];
          add(row, btn('act act-sub', 'open-exam', { profile: profiles[p] }, pr ? pr.label : profiles[p]));
        }
        add(cd, row);
        if (!Bank.fullUnlocked()) add(cd, h('p', 'note', 'フル模試（50問）は在庫が2回ぶんに届いたら開きます。'));
      }
      add(fr4, cd);
      add(lw, fr4);
    }
    add(sec, lw);
  }

  /* 「同じ条件でもう1セット」のラベル。回の性格は (mode, profile, filter) から
     毎回導く（表示文字列は保存しない。門 A-T8）。 */
  function againLabel(sess) {
    if (!sess) return null;
    if (sess.mode === 'exam') {
      var p = sess.profile && EXAM.profiles[sess.profile] ? EXAM.profiles[sess.profile] : null;
      return 'もう1回（' + (p ? p.label : '模試') + '）';
    }
    var stockIds = sess.filter ? Filter.itemIds(sess.filter, Bank) : Bank.all().map(function (it) { return it.id; });
    var n = effectiveCount(stockIds ? stockIds.length : 0);
    if (n <= 0) return null;
    var range = sess.filter ? Filter.label(sess.mode, null, sess.filter, Bank) : null;
    return 'もう1セット（' + (range ? range + '・' : '') + n + '問）';
  }

  function statcard(num, unit, label, hot) {
    var c = h('div', 'statcard');
    if (label === '連続日数') {
      var st = h('span', 'streak' + (hot ? '' : ' is-cold'));
      add(st, h('span', 'streak-flame', '▲'));
      add(st, h('span', 'statcard-num num', num));
      add(st, h('span', 'statcard-unit', unit));
      add(c, st);
    } else {
      add(c, h('span', 'statcard-num num', num));
      add(c, h('span', 'statcard-unit', unit));
    }
    add(c, h('p', 'statcard-label', label));
    return c;
  }

  function resumeRow(c, sess, promoted) {
    var r = h('div', 'resume');
    var pos = Rec.resumeIndex(sess);
    var label = Filter.sessionLabel(sess, Bank);
    var detail = label + '（' + Math.min(pos.index, sess.itemIds.length) + ' / ' + sess.itemIds.length + '問）';

      detail += '・残り ' + fmtClock(sess.remainingMs);

    if (!promoted) add(acts, btn('act act-main', 'resume', { sid: sess.id }, '再開'));
    add(acts, btn('act act-quiet', 'discard', { sid: sess.id }, '破棄'));
    add(r, acts);

  /* 予想得点（SPEC §8.4）。first.score が null なら2本目も出さない。 */
  function forecastFrame(c) {
    var f = Stats.forecast(c.base);
    var fr = section('予想得点', 'forecast');
    var cd = card();
    if (f.first.score === null) {
      add(cd, h('p', 'forecast-unknown', '推定不能'));
      var need = [];
      var ks = [2, 3, 4];
      for (var i = 0; i < ks.length; i++) {
        if (f.first.need[ks[i]] > 0) need.push('K' + ks[i] + ' あと' + f.first.need[ks[i]] + '件');
      }
      add(cd, h('p', 'note', '各 K レベルで3件ずつ解説まで読むと出せます（' + (need.join('・') || '—') + '）。'));
      add(cd, h('p', 'note', '初見 ' + f.first.n + '問に基づく。'));
    } else {
      var head = h('div', 'forecast-head');
      add(head, h('span', 'forecast-score num', String(f.first.score)));
      add(head, h('span', 'forecast-max', '/ ' + f.max + '点'));
      var gap = f.pass - f.first.score;
      add(head, pill(gap > 0 ? '合格' + f.pass + '点まであと' + gap + '点' : '合格ライン到達', gap > 0 ? 'warn' : 'ok'));
      add(cd, head);

      var bar = h('div', 'forecast-bar');
      at(bar, 'role', 'img');
      at(bar, 'aria-label', '予想得点 ' + f.first.score + ' / ' + f.max + '点。合格ラインは ' + f.pass + '点');
      var fill = h('div', 'forecast-bar-fill' + (f.first.score >= f.pass ? ' is-pass' : ''));
      cssVar(fill, '--pct', Math.max(0, Math.min(100, f.first.score / f.max * 100)));
      add(bar, fill);
      var line = h('div', 'forecast-pass');
      cssVar(line, '--at', f.pass / f.max * 100);
      add(bar, line);
      var lbl = h('span', 'forecast-pass-label', '合格 ' + f.pass + '点');
      cssVar(lbl, '--at', f.pass / f.max * 100);
      add(bar, lbl);
      add(cd, bar);

      add(cd, h('p', 'note', '初見 ' + f.first.n + '問に基づく。'));
      if (f.all.score !== null) {
        add(cd, h('p', 'note', '全試行ベース（覚え込みを含む）は ' + f.all.score + '点。差が開いているほど「覚えているだけ」のサインです。'));
      }
      add(cd, h('p', 'caveat', '48目標のうち25目標しか問題がありません。K4 は1問の正誤で約2.5点動きます。合格可能性は出しません。'));
    }
    add(fr, cd);
    return fr;
  }

  /* 弱いところから（1つの枠の中に2行。SPEC §6.1） */
  function weakFrame(c) {
    var fr = section('弱いところから', 'weak');
    var cd = card();
    var lo = Stats.weakSpots(c.base, Bank, 3);
    var dt = Stats.weakDtypes(c.base, Bank, 3);

    add(cd, h('h4', 'card-title', lo.mode === 'weak' ? '学習目標' : 'まずはここから'));
    var list1 = h('div', 'weaklist');
    if (!lo.rows.length) {
      add(list1, h('p', 'note', '在庫のある学習目標がありません。'));
    }
    for (var i = 0; i < lo.rows.length; i++) {
      var r = lo.rows[i];
      var b = btn('rowlink', 'start-weak-lo', { key: r.lo });
      var main = h('span', 'rowlink-main');
      add(main, h('span', 'rowlink-name', r.lo + ' ' + r.text));
      add(b, main);
      /* meta は .rowlink の直下（別の flex 要素）に置く。main の中に入れると
         名前と同じ行に流れ込み、行の高さを超える中身と重なる。
         .unit-stock を重ねるのは flex:0 0 auto と white-space:nowrap のため
         （これが無いと「未着手 · 2問」が1文字ずつ縦に割れる）。
         ★CSS 担当へ：.rowlink-meta 自身がこの2つを持てば、この重ね掛けは要らない。 */
      add(b, h('span', 'rowlink-meta unit-stock', rateText(r) + ' · ' + r.itemCount + '問'));
      add(list1, b);
    }
    add(cd, list1);

    add(cd, h('h4', 'card-title', dt.mode === 'weak' ? '誤答の型' : '誤答の型（まずはここから）'));
    var list2 = h('div', 'weaklist');
    for (var j = 0; j < dt.rows.length; j++) {
      var t = dt.rows[j];
      var b2 = btn('rowlink', 'start-weak-dtype', { key: t.code });
      /* 誤答型のバッジは inline-flex で行の高さ（18px）より高い（32px）。
         .rowlink-name（インライン）の中に入れると、同じ行に続く meta と
         重なる。バッジは .rowlink-main の中身そのものにして、meta は
         .rowlink 直下の別の flex 要素に出す。 */
      var m2 = h('span', 'rowlink-main');
      /* チップは記号だけ。名前はその隣にテキストで置く。名前までチップに
         入れると 320px で4行に折り返し、角丸 999px のせいで丸い塊になる。 */
      add(m2, dtypeBadge(t.code, null, t.shown === 0, true));
      add(m2, h('span', 'rowlink-name', ' ' + t.name));
      add(b2, m2);
      var tlv2 = levelOf(t);
      var meta = tlv2 === 'measured' ? ('選んだ率 ' + Math.round(t.rate * 100) + '%')
        : (tlv2 === 'excluded' ? ('計測できず ' + excludedCount(t) + '件')
          : (t.shown === 0 ? '未出題' : 'n=' + t.shown));
      add(b2, h('span', 'rowlink-meta unit-stock', meta + ' · ' + t.itemCount + '問'));
      add(list2, b2);
    }
    add(cd, list2);
    add(fr, cd);
    return fr;
  }

  /* ===================================================================
   * 14. 自分で選ぶ（SPEC §6.8）
   * =================================================================== */

  var PICKER_TABS = [['dtype', '誤答型'], ['section', '章・節'], ['lo', '学習目標']];

  function renderPicker() {
    var sec = screens.picker;
    empty(sec);
    var c = ctx();
    add(sec, appbar({ title: '自分で選ぶ', back: { act: 'back', label: '戻る' } }));
    var w = wrap();

    var seg = h('div', 'segbar');
    at(seg, 'role', 'tablist');
    for (var i = 0; i < PICKER_TABS.length; i++) {
      var t = PICKER_TABS[i];
      var b = btn('seg' + (S.picker.kind === t[0] ? ' is-current' : ''), 'picker-tab', { kind: t[0] }, t[1]);
      at(b, 'role', 'tab');
      at(b, 'aria-selected', S.picker.kind === t[0] ? 'true' : 'false');
      add(seg, b);
    }
    add(w, seg);

    /* 「章・節」のタブは章3件と節11件の両方を出す（SPEC §6.8「3章 → 11節」）。
       章で絞れないと、依頼主が名指しした「弱い章だけ集中して取り組む」が作れない。
       行ごとに data-kind を持たせ、選んだ単位の種類をそのまま filter にする。 */
    var rows = S.picker.kind === 'section' ? chapterSectionRows(c)
      : Stats.units(c.base, Bank, S.picker.kind).map(function (u) { return { unit: u, kind: S.picker.kind }; });

    add(w, h('p', 'note', S.picker.kind === 'dtype'
      ? '選んでしまった率が高い順。「その型の誤答肢を含む問題」を集めます（その型で間違えた問題ではありません）。'
      : (S.picker.kind === 'section' ? '章3つと、その下の節11。章を選ぶとその章の全問から出ます。在庫のない節も出します。'
        : 'シラバスの順。48目標すべてを出します。')));

    var withStock = 0;
    for (var q = 0; q < rows.length; q++) if (rows[q].unit.itemCount > 0) withStock++;
    /* 学習目標は48件中25件しか在庫が無い。絞り込みを一覧の手前に置く（B-7）。 */
    if (S.picker.kind === 'lo' && rows.length > 20) add(w, stockOnlyToggle(rows.length, withStock));
    if (S.stockOnly) {
      var kept = [];
      for (var q2 = 0; q2 < rows.length; q2++) if (rows[q2].unit.itemCount > 0) kept.push(rows[q2]);
      rows = kept;
    }

    var list = h('div', 'unitlist');
    var selected = null;
    for (var u = 0; u < rows.length; u++) {
      var un = rows[u].unit, kind = rows[u].kind;
      var on = S.picker.key === un.key && S.picker.keyKind === kind;
      var row = btn('unit-row' + (on ? ' is-current' : ''), 'picker-select', { key: un.key, kind: kind });
      var code = kind === 'chapter' ? ('章' + un.key) : un.key;
      add(row, h('span', 'unit-code', code));
      var main = h('span', 'unit-main');
      /* 記号は unit-code がすでに出しているので、名前だけを置く
         （「D8｜D8 近接用語の混同」のように2度出ていた）。 */
      add(main, h('span', 'unit-name', unitName(un, code)));
      add(row, main);
      var metaText = un.itemCount + '問';
      if (kind === 'chapter') metaText = '章まるごと・' + metaText;
      /* meta は unit-main の外へ出す。中に入れると名前と同じ行に続いて
         「近接用語の混同6問」のようにくっつく。 */
      add(row, h('span', 'unit-meta', metaText));
      /* 在庫0も一覧に出す。押せない状態＋「在庫なし」（門 F-T2） */
      if (un.itemCount === 0) {
        add(row, h('span', 'unit-stock', '在庫なし'));
        lock(row, 'この単位には問題がありません');
      } else {
        add(row, h('span', 'unit-rate', kind === 'dtype' ? dtypeRateText(un) : rateText(un)));
        if (on) selected = un;
      }
      add(list, row);
    }
    add(w, list);

    var legend = h('div', 'legend');
    var LEG2 = { nostock: '在庫なし', none: '未着手', excluded: '計測できず',
      thin: 'データ不足（n<3）', measured: '測定済み' };
    for (var lg2 = 0; lg2 < LEVELS.length; lg2++) add(legend, legendItem(LEVELS[lg2], LEG2[LEVELS[lg2]]));
    add(w, legend);
    add(sec, w);

    if (selected) {
      var stock = selected.itemCount;
      var n = effectiveCount(stock);
      var picker = countPicker(stock, selected.label + ' を何問');
      var startBtn = btn('act act-main', 'start-filtered', null, '始める（' + n + '問）');
      setDock([[picker], [startBtn]], null, '168px');
    } else {
      setDock([[h('p', 'dock-hint', '範囲を選ぶと問題数を決められます')]], null, '88px');
    }
  }

  /* Bank.units のラベルは「記号 + 空白 + 名前」で組まれている。
     記号を別の欄（unit-code）で出すので、ラベル側からは落とす。 */
  function unitName(un, code) {
    var label = String(un.label === undefined || un.label === null ? '' : un.label);
    if (label.indexOf(code + ' ') === 0) return label.slice(code.length + 1);
    if (label === code) return '';
    return label;
  }

  /* 章3件と節11件を、章 → その章の節 の順に1本へ畳む。
     Stats.units は節がどの章に属するかを返さないので、対応は Bank.sections() から引く。 */
  function chapterSectionRows(c) {
    var chs = Stats.units(c.base, Bank, 'chapter');
    var secs = Stats.units(c.base, Bank, 'section');
    var chOf = {}, raw = Bank.sections(), i, j;
    for (i = 0; i < raw.length; i++) chOf[String(raw[i].no)] = String(raw[i].chapter);
    var out = [], placed = {};
    for (i = 0; i < chs.length; i++) {
      out.push({ unit: chs[i], kind: 'chapter' });
      for (j = 0; j < secs.length; j++) {
        if (chOf[secs[j].key] !== chs[i].key) continue;
        out.push({ unit: secs[j], kind: 'section' });
        placed[secs[j].key] = true;
      }
    }
    /* どの章にも紐づかない節があっても落とさない（一覧から消さない。門 F-T2） */
    for (j = 0; j < secs.length; j++) if (!placed[secs[j].key]) out.push({ unit: secs[j], kind: 'section' });
    return out;
  }

  function dtypeRateText(un) {
    if (un.itemCount === 0) return '在庫なし';
    /* 解いたのに全部除外された場合を「未出題」と言わない */
    if (levelOf(un) === 'excluded') return '計測できず ' + excludedCount(un) + '件';
    if (un.shown === 0 || un.shown === null) return '未出題';
    if (un.chosenRate === null || un.chosenRate === undefined) return 'n=' + un.shown;
    return '選んだ率 ' + Math.round(un.chosenRate * 100) + '%';
  }

  /* 48目標のうち23目標は永久に埋まらない（B-7 / B-21）。
     在庫0を一覧から消さないのは原則（何が無いかを隠さない・門 F-T2）なので、
     既定は全部出したまま、絞り込みを1タップで用意する。
     押した瞬間の画面が押せない行で埋まるのは、この入口を先頭に置くことで解く。 */
  function stockOnlyToggle(total, withStock) {
    var box = h('div', 'chipset');
    at(box, 'role', 'group');
    at(box, 'aria-label', '表示する範囲');
    var all = btn('chip' + (S.stockOnly ? '' : ' is-on'), 'set-stock-only', { on: '0' }, 'すべて（' + total + '）');
    at(all, 'aria-pressed', S.stockOnly ? 'false' : 'true');
    var only = btn('chip' + (S.stockOnly ? ' is-on' : ''), 'set-stock-only', { on: '1' }, '問題のあるものだけ（' + withStock + '）');
    at(only, 'aria-pressed', S.stockOnly ? 'true' : 'false');
    add(box, all, only);
    return box;
  }

  /* 章ごとに畳める入れ物。3章を見るのに11画面ぶんスクロールさせない（B-21）。 */
  function chapterFold(chapter, title, rows, open) {
    var det = h('details', 'fold');
    at(det, 'data-chapter', String(chapter));
    if (open) at(det, 'open', '');
    add(det, h('summary', null, '章' + chapter + (title ? ' ' + title : '') + '（' + rows + '件）'));
    return det;
  }

  function legendItem(kind, text) {
    var it = h('span', 'legend-item');
    add(it, h('span', 'legend-key' + (kind ? ' is-' + kind : '')));
    add(it, h('span', null, text));
    return it;
  }

  /* ===================================================================
   * 15. 演習（SPEC §6.2）
   * =================================================================== */

  function renderPractice() {
    var sec = screens.practice;
    empty(sec);
    var rt = S.live.practice;
    var c = ctx();
    var sess = rt ? Rec.findSession(c.rec, rt.id) : null;
    if (!rt || !sess) { go('home', {}, true); return; }

    var itemId = sess.itemIds[rt.index];
    var item = Bank.get(itemId);
    if (!item) { nextAfterAnswer(); return; }

    var n = rt.index + 1, N = sess.itemIds.length;
    add(sec, appbar({
      title: Filter.sessionLabel(sess, Bank),
      /* 矢印だけだと、押した先で何が起きるか（記録が残るのか）が伝わらない（B-19） */
      back: { act: 'suspend', label: '中断する', mark: '← 中断' },
      meta: n + ' / ' + N
    }));
    add(sec, progress(rt.index / N * 100));

    var w = wrap();
    var nt = noticeNode();
    if (nt) add(w, nt);
    var cd = card();
    var body = renderQuestionBody(item, sess.id + '|' + itemId, {
      shuffle: sess.opts.shuffleChoices, selected: rt.selected, mode: 'answer'
    });
    rt.bodyEl = body;
    add(cd, body);
    add(w, cd);
    add(sec, w);
    say(n + '問目 / ' + N + '問');

    var last = rt.index === N - 1;
    var ready = rt.selected.length === item.pickCount;
    var mainBtn = btn('act act-main', 'answer', null, last ? '解答して結果へ' : '解答する');
    if (!ready) lock(mainBtn, item.pickCount + 'つ選んでください');
    var hint = item.pickCount > 1
      ? item.pickCount + 'つ選ぶ（あと' + Math.max(0, item.pickCount - rt.selected.length) + 'つ）'
      : '1つ選んで「解答する」';
    setDock([[mainBtn]], hint);
  }

  /* 肢の選択だけは作り直さずに印を付け替える（DESIGN §8.2 の例外） */
  function repaintChoices() {
    var rt = S.live[S.screen === 'exam' ? 'exam' : 'practice'];
    if (!rt || !rt.bodyEl || !rt.bodyEl._choiceEls) { render(); return; }
    var els = rt.bodyEl._choiceEls;
    for (var i = 0; i < els.length; i++) {
      var oidx = Number(els[i].getAttribute('data-oidx'));
      var on = rt.selected.indexOf(oidx) >= 0;
      at(els[i], 'class', 'choice' + (on ? ' is-sel' : ''));
      at(els[i], 'aria-checked', on ? 'true' : 'false');
    }
    /* 主ボタンの活性は作り直す（ドックだけ） */
    if (S.screen === 'practice') renderPracticeDock();
    else renderExamDock();
  }
  function renderPracticeDock() {
    var rt = S.live.practice;
    var c = ctx();
    var sess = rt ? Rec.findSession(c.rec, rt.id) : null;
    if (!sess) { render(); return; }
    var item = Bank.get(sess.itemIds[rt.index]);
    if (!item) { render(); return; }
    var last = rt.index === sess.itemIds.length - 1;
    var ready = rt.selected.length === item.pickCount;
    var mainBtn = btn('act act-main', 'answer', null, last ? '解答して結果へ' : '解答する');
    if (!ready) lock(mainBtn, item.pickCount + 'つ選んでください');
    var hint = item.pickCount > 1
      ? item.pickCount + 'つ選ぶ（あと' + Math.max(0, item.pickCount - rt.selected.length) + 'つ）'
      : '1つ選んで「解答する」';
    setDock([[mainBtn]], hint);
  }

  /* ===================================================================
   * 16. 解説（1問。immediate）（SPEC §6.3）
   * =================================================================== */

  function renderExplainOneScreen() {
    var sec = screens.explainOne;
    empty(sec);
    var rt = S.live.practice;
    var c = ctx();
    var sess = rt ? Rec.findSession(c.rec, rt.id) : null;
    if (!rt || !sess) { go('home', {}, true); return; }

    var itemId = sess.itemIds[rt.index];
    var item = Bank.get(itemId);
    var chosen = answersOf(sess, itemId);
    var N = sess.itemIds.length;

    /* ★解説画面を開いたら初見を消費する（SPEC §8.4・門 F-T5） */
    markSeen(sess.id, itemId);

    add(sec, appbar({
      title: '解説',
      back: { act: 'suspend', label: '中断する', mark: '← 中断' },
      meta: (rt.index + 1) + ' / ' + N
    }));
    var w = wrap();
    var cd = card();
    if (item) {
      add(cd, renderExplainOne(item, chosen, chosen.length === 0, sess.id + '|' + itemId, sess.opts.shuffleChoices));
      var det = h('details', 'fold');
      add(det, h('summary', null, '問題をもう一度読む'));
      var fb = h('div', 'fold-body');
      add(fb, renderQuestionBody(item, sess.id + '|' + itemId, { shuffle: sess.opts.shuffleChoices, selected: chosen, mode: 'read' }));
      add(det, fb);
      add(cd, det);
    } else {
      add(cd, emptyBox('◻', 'この問題は今の問題データにありません', '記録は残っています。'));
    }
    add(w, cd);
    add(sec, w);
    say('解説 ' + (rt.index + 1) + '問目');

    var last = rt.index === N - 1;
    var nextBtn = btn('act act-main', 'explain-next', null, last ? '結果へ' : '次へ');
    setDock([[laterFlag(itemId, reviewOf(c.rec, itemId))], [nextBtn]], null, '140px');
  }

  function reviewOf(rec, itemId) {
    var best = -Infinity, on = false;
    for (var i = 0; i < rec.attempts.length; i++) {
      var a = rec.attempts[i];
      if (a.itemId !== itemId) continue;
      var t = ALTM.util.parseAt(a.at);
      if (t >= best) { best = t; on = a.review === true; }
    }
    return on;
  }

  /* ===================================================================
   * 17. 解答解説（全問）（SPEC §6.3 / DESIGN §7.5）
   * =================================================================== */

  function renderExplainAll() {
    var sec = screens.explainAll;
    empty(sec);
    var c = ctx();
    var sid = S.params.sessionId;
    var res = sid ? Stats.sessionResult(c.rec, Bank, sid) : null;
    if (!res) { go('home', {}, true); return; }

    var rows = res.rows;
    var shown = [];
    for (var i = 0; i < rows.length; i++) {
      if (!S.explainWrongOnly) { shown.push(i); continue; }
      var r = rows[i];
      if (r.correct === false || r.unanswered || reviewOf(c.rec, r.itemId)) shown.push(i);
    }
    if (!shown.length) shown = [0];
    var pos = S.params.index || 0;
    if (shown.indexOf(pos) < 0) pos = shown[0];

    var row = rows[pos];
    /* ★解説を開いたら初見を消費する（門 F-T5） */
    markSeen(sid, row.itemId);

    add(sec, appbar({
      title: '解答解説',
      back: { act: 'back', label: '戻る', mark: '← 戻る' },
      act: { act: 'toggle-wrong-only', text: '間違いだけ', on: S.explainWrongOnly },
      meta: (shown.indexOf(pos) + 1) + ' / ' + shown.length
    }));

    var w = wrap();
    /* インデックス帯 */
    var strip = h('div', 'idx-strip');
    at(strip, 'role', 'tablist');
    at(strip, 'aria-label', '問題の一覧');
    for (var s = 0; s < shown.length; s++) {
      var idx = shown[s];
      var rr = rows[idx];
      var kind = rr.unanswered ? 'blank' : (rr.correct ? 'ok' : 'no');
      var cell = btn('idx-cell is-' + kind + (idx === pos ? ' is-current' : ''), 'explain-goto', { index: String(idx) }, String(idx + 1));
      at(cell, 'aria-label', (idx + 1) + '問目 ' + (rr.unanswered ? '未解答' : (rr.correct ? '正解' : '不正解')));
      if (idx === pos) at(cell, 'aria-current', 'true');
      add(strip, cell);
      /* 25問の帯は幅1296pxで可視域358px。現在地が画面外のままだと、
         8問目以降は自分がどこにいるか帯から読めない（B-4）。 */
      if (idx === pos) pendingScroll = cell;
    }
    add(w, strip);
    var lg = h('div', 'legend');
    add(lg, legendItem('ok', '○ 正解'), legendItem('no', '✕ 不正解'), legendItem('thin', '— 未解答'));
    add(w, lg);

    var cd = card();
    if (row.item) {
      var seed = sid + '|' + row.itemId;
      add(cd, renderExplainOne(row.item, row.chosenIdx || [], row.unanswered, seed, true));
      var det = h('details', 'fold');
      add(det, h('summary', null, '問題をもう一度読む'));
      var fb = h('div', 'fold-body');
      add(fb, renderQuestionBody(row.item, seed, { shuffle: true, selected: row.chosenIdx || [], mode: 'read' }));
      add(det, fb);
      add(cd, det);
    } else {
      add(cd, emptyBox('◻', 'この問題は今の問題データにありません', row.itemId));
    }
    add(w, cd);
    add(sec, w);
    say('解説 ' + (pos + 1) + '問目 / 全' + rows.length + '問');

    var at1 = shown.indexOf(pos);
    var last = at1 === shown.length - 1;
    var prev = btn('act act-sub', 'explain-page', { index: String(shown[Math.max(0, at1 - 1)]) }, '← 前へ');
    if (at1 === 0) lock(prev, '先頭です');
    var pager = h('div', 'pager');
    add(pager, prev);
    /* ★最後のページで「押せない次へ」だけを残さない（B-20）。
       下タブも隠れている画面なので、出口がヘッダの矢印1つになってしまう。
       読み終えた直後は、いちばん次をやる気がある瞬間でもある。 */
    if (last) add(pager, btn('act act-main', 'explain-done', { sid: sid }, '読み終わった'));
    else add(pager, btn('act act-main', 'explain-page', { index: String(shown[at1 + 1]) }, '次へ →'));
    setDock([[laterFlag(row.itemId, reviewOf(c.rec, row.itemId))], [pager]],
      last ? '最後の1問です' : null, '140px');
  }

  /* ===================================================================
   * 18. 結果（SPEC §6.4 / §6.5）
   * =================================================================== */

  function renderResult() {
    var sec = screens.result;
    empty(sec);
    var c = ctx();
    var sid = S.params.sessionId;
    var res = sid ? Stats.sessionResult(c.rec, Bank, sid) : null;
    if (!res) { go('home', {}, true); return; }
    var isExam = res.mode === 'exam';
    var sess = Rec.findSession(c.rec, sid);

    add(sec, appbar({ title: isExam ? '模試の結果' : '結果', back: { act: 'go-home', label: 'ホームへ' } }));
    var w = wrap();
    var nt = noticeNode();
    if (nt) add(w, nt);
    if (res.timeUp) add(w, bandRow('warn', '時間切れで自動提出しました。'));

    /* 分母を3つとも出す（SPEC §6.4）。
       ★主役は正答率（B-8）。学習アプリの結果画面で真っ先に見たい数字がこれ。
       得点は本番の配点なので消さないが、9 が何なのかを必ず添える。
       模試だけは合格ラインがあるので得点を主役にする。 */
    var head = h('div', 'result-head');
    var score = h('div', 'score');
    if (isExam) {
      add(score, h('span', 'score-num num', String(res.points.got)));
      add(score, h('span', 'score-unit', '/ ' + res.points.max + '点'));
    } else {
      var pct = res.answered > 0 ? Math.round(res.correct / res.answered * 100) : null;
      add(score, h('span', 'score-num num', pct === null ? '—' : String(pct)));
      add(score, h('span', 'score-unit', pct === null ? '解答なし' : '% 正解'));
    }
    add(head, score);
    var den = h('p', 'score-denoms');
    add(den, D.createTextNode('正解 '));
    add(den, h('b', 'num', String(res.correct)));
    add(den, D.createTextNode(' / 解答 '));
    add(den, h('b', 'num', String(res.answered)));
    add(den, D.createTextNode('（未解答 '));
    add(den, h('b', 'num', String(res.blank)));
    add(den, D.createTextNode('）・全 ' + res.count + '問・' + fmtDur(res.ms.total)));
    add(head, den);
    /* 得点の分母（9 など）は K レベル別の配点合計。説明が無いと、
       5問解いた人に分母の違う2つの数が黙って並ぶ（B-8）。 */
    var pts = h('p', 'score-denoms');
    if (!isExam) {
      add(pts, D.createTextNode('得点 '));
      add(pts, h('b', 'num', String(res.points.got)));
      add(pts, D.createTextNode(' / ' + res.points.max + '点'));
    }
    add(pts, h('span', 'setrow-sub', '点は本番と同じ配点で数えています（K2＝1点 / K3＝2点 / K4＝3点）。'
      + 'この回の ' + res.count + '問ぶんの合計が ' + res.points.max + '点です。'));
    add(head, pts);
    add(w, head);

    if (isExam) {
      var ex = card('模試の読み方');
      add(ex, h('p', null, '合格ライン ' + res.points.pass + '点。' +
        (res.passed === null ? '' : (res.passed ? '到達しています。' : 'まだ届いていません。'))));
      var conv = res.points.max > 0 ? Math.round(res.points.got / res.points.max * EXAM.real.points) : 0;
      add(ex, h('p', null, '88点満点への換算は ' + conv + '点（参考値）。'));
      var kr = h('div', 'breakdown');
      var ks = [2, 3, 4];
      for (var i = 0; i < ks.length; i++) {
        var b = res.byK[ks[i]];
        var r0 = h('div', 'bd-row');
        add(r0, h('span', 'bd-label', 'K' + ks[i]));
        add(r0, h('span', 'bd-count num', b.got + ' / ' + b.max + '点'));
        var bar = h('div', 'bd-bar');
        var fill = h('div', 'bd-bar-fill is-ok');
        cssVar(fill, '--pct', b.max > 0 ? b.got / b.max * 100 : 0);
        add(bar, fill);
        add(r0, bar);
        add(kr, r0);
      }
      add(ex, kr);
      add(ex, h('p', 'caveat', '合格可能性は出しません。在庫53問は48目標のうち25目標しか覆っておらず、模試の得点から本番の得点は推定できません。'));
      add(w, ex);
    }

    add(w, btn('act act-main', 'open-explain-all', { sid: sid }, '解答解説を見る（' + res.count + '問）'));

    /* 落とした型 */
    if (res.dtype.length) {
      var fr = section('落とした型');
      var cd = card();
      var lg = h('div', 'legend');
      add(lg, legendItem(null, '選んでしまった回数（棒の長さはこの回の' + res.count + '問に対する割合）'));
      add(cd, lg);
      var bd = h('div', 'breakdown');
      /* 分母をその回の最大値にすると、4種が1回ずつのとき4本とも振り切れて
         「全部の型で最悪」に読める（B-14）。この回の問題数を分母にして、
         1回ずつなら短い棒が同じ長さで並ぶようにする。 */
      var maxChosen = 0;
      for (var d = 0; d < res.dtype.length; d++) if (res.dtype[d].chosen > maxChosen) maxChosen = res.dtype[d].chosen;
      var max = Math.max(res.count, maxChosen, 1);
      for (var e = 0; e < res.dtype.length; e++) {
        var t = res.dtype[e];
        var row = h('div', 'bd-row');
        var lab = h('span', 'bd-label');
        add(lab, dtypeBadge(t.code, null, false));
        add(row, lab);
        add(row, h('span', 'bd-count num', t.chosen + '回'));
        var bar2 = h('div', 'bd-bar');
        var sh = DT_SHAPE[t.code];
        var f2 = h('div', 'bd-bar-fill' + (sh ? ' dt-' + sh[0] : ''));
        cssVar(f2, '--pct', t.chosen / max * 100);
        add(bar2, f2);
        add(row, bar2);
        add(bd, row);
      }
      add(cd, bd);
      add(cd, h('p', 'note', '複合表記（D2+D3 など）は両方に1ずつ数えるので、型別の合計は誤答の数と一致しません。'));
      add(fr, cd);
      add(w, fr);
    }

    var pool = Stats.reviewPool(c.rec, Bank, sid);

    /* 次に何をするか（B-20）。1回を終えた直後が、いちばん次をやる気がある瞬間。
       ここに道が無いと「ホーム → 問題数を選び直す → 続ける」まで戻ることになる。 */
    var nx = section('次にやること', 'next');
    var nc = card();
    var again = againLabel(sess);
    if (again) add(nc, btn('act act-main', 'start-again', { sid: sid }, again));
    if (pool.count > 0) {
      add(nc, btn('act act-sub', 'start-review-session', { sid: sid },
        'この回の間違いをやり直す（' + pool.count + '問）'));
    }
    add(nc, btn('act act-quiet', 'go-home', null, 'ホームへ'));
    add(nx, nc);
    add(w, nx);

    /* 全問の一覧 */
    var fr2 = section('この回の全' + res.count + '問');
    var list = h('div', 'itemlist');
    for (var r2 = 0; r2 < res.rows.length; r2++) {
      var rr = res.rows[r2];
      var kind = rr.unanswered ? 'blank' : (rr.correct ? 'ok' : 'no');
      var b2 = btn('item-row', 'open-explain-at', { sid: sid, index: String(r2) });
      add(b2, h('span', 'item-no num', String(r2 + 1)));
      var mk = h('span', 'item-mark is-' + kind, rr.unanswered ? '—' : (rr.correct ? '○' : '✕'));
      at(mk, 'aria-label', rr.unanswered ? '未解答' : (rr.correct ? '正解' : '不正解'));
      add(b2, mk);
      add(b2, h('span', 'item-id', rr.item ? rr.item.lo : rr.itemId));
      var main = h('span', 'item-main');
      add(main, D.createTextNode(rr.item ? mdPlain(rr.item.question).slice(0, 40) : '（問題データにありません）'));
      add(b2, main);
      if (rr.item) add(b2, kPill(rr.item.k));
      add(b2, h('span', 'item-time num', Math.round((rr.ms || 0) / 1000) + '秒'));
      add(list, b2);
    }
    add(fr2, list);
    add(w, fr2);
    add(sec, w);
    if (sess) say(Filter.sessionLabel(sess, Bank) + ' の結果');
  }

   * =================================================================== */

  function renderExamIntro() {
    var sec = screens.examIntro;
    empty(sec);
    var c = ctx();
    add(sec, appbar({ title: '模試', back: { act: 'back', label: '戻る' } }));
    var w = wrap();
    var profiles = Bank.examProfiles();

      add(w, emptyBox('◻', '受けられる模試がありません', '問題の在庫が足りないと模試は組めません。'));
      add(sec, w);
      return;

    var chosen = S.params.profile || profiles[0];
    var set = h('div', 'radioset');
    for (var i = 0; i < profiles.length; i++) {
      var p = profiles[i];

      at(inp, 'type', 'radio');
      at(inp, 'name', 'exam-profile');

      if (chosen === p) at(inp, 'checked', '');
      add(lab, inp, h('span', null, pr ? pr.label : p));

      if (doneAt) add(lab, h('span', 'pill', '受験済み（' + fmtDate(doneAt) + '）'));
      add(set, lab);

    var pr2 = EXAM.profiles[chosen];
    var cd = card('始める前に');
    var dl = h('dl', 'resume-detail');
    add(dl, h('dt', null, '問題数'), h('dd', null, (pr2 ? pr2.count : 25) + '問'));
    add(dl, h('dt', null, '制限時間'), h('dd', null, (pr2 ? pr2.minutes : 60) + '分'));
    add(dl, h('dt', null, '配点'), h('dd', null, (pr2 ? pr2.points : 44) + '点満点'));
    add(dl, h('dt', null, '合格点'), h('dd', null, (pr2 ? pr2.pass : 29) + '点'));
    add(cd, dl);
    add(cd, h('p', 'caveat', '解説は提出まで出ません。合格可能性は出しません。'));
    add(w, cd);
    add(sec, w);
    setDock([[btn('act act-main', 'start-exam', { profile: chosen }, '模試を始める')]]);
  }

  function lastExamAt(rec, profile) {
    var best = null;
    for (var i = 0; i < rec.sessions.length; i++) {
      var s = rec.sessions[i];
      if (s.mode !== 'exam' || s.profile !== profile || s.state !== 'done') continue;
      var t = ALTM.util.parseAt(s.endedAt || s.startedAt);
      if (!isNaN(t) && (best === null || t > best)) best = t;
    }
    return best;
  }

  function renderExam() {
    var sec = screens.exam;
    empty(sec);
    var rt = S.live.exam;
    var c = ctx();
    var sess = rt ? Rec.findSession(c.rec, rt.id) : null;
    if (!rt || !sess) { go('home', {}, true); return; }

    var itemId = sess.itemIds[rt.index];
    var item = Bank.get(itemId);
    var N = sess.itemIds.length;
    var remain = sess.remainingMs === null || sess.remainingMs === undefined ? 0 : sess.remainingMs;
    var urgent = remain <= 5 * 60000;

    var bar = appbar({
      title: Filter.sessionLabel(sess, Bank),
      /* 模試は60分が懸かるので、抜ける前に必ず確認する（B-19） */
      back: { act: 'exam-suspend-confirm', label: '中断する', mark: '← 中断' },
      meta: (rt.index + 1) + ' / ' + N
    });
    var tm = h('span', 'timer' + (urgent ? ' is-urgent' : ''), fmtClock(remain));
    at(tm, 'aria-label', '残り ' + fmtClock(remain));
    at(tm, 'data-timer', '1');
    add(bar, tm);
    rt.timerEl = tm;
    add(sec, bar);
    add(sec, progress(rt.index / N * 100));

    var w = wrap();
    var nt = noticeNode();
    if (nt) add(w, nt);
    var cd = card();
    if (item) {
      var body = renderQuestionBody(item, sess.id + '|' + itemId, {
        shuffle: sess.opts.shuffleChoices, selected: rt.selected, mode: 'answer'
      });
      rt.bodyEl = body;
      add(cd, body);
    } else {
      add(cd, emptyBox('◻', 'この問題は今の問題データにありません', itemId));
    }
    var flagged = (sess.flagged || []).indexOf(itemId) >= 0;
    add(cd, btn('flagbtn' + (flagged ? ' is-on' : ''), 'exam-flag', { item: itemId }, flagged ? '⚑ フラグ済み' : '⚐ フラグを付ける'));
    add(w, cd);

    /* 未解答一覧＋任意の問題への移動 */
    var det = h('details', 'fold');
    add(det, h('summary', null, '全' + N + '問へ移動（未解答 ' + blankCount(sess) + '問・フラグ ' + (sess.flagged || []).length + '問）'));
    var fb = h('div', 'fold-body');
    var grid = h('div', 'gridsheet');
    for (var i = 0; i < N; i++) {
      var id = sess.itemIds[i];
      var done = answersOf(sess, id).length > 0;
      var fl = (sess.flagged || []).indexOf(id) >= 0;
      var cls = 'gridcell ' + (fl ? 'is-flag' : (done ? 'is-done' : 'is-blank')) + (i === rt.index ? ' is-current' : '');
      var cell = btn(cls, 'exam-goto', { index: String(i) }, String(i + 1));
      at(cell, 'aria-label', (i + 1) + '問目 ' + (done ? '解答済み' : '未解答') + (fl ? '・フラグ' : ''));
      add(grid, cell);
    }
    add(fb, grid);
    var lg = h('div', 'legend');
    add(lg, legendItem('ok', '解答済み'), legendItem('thin', '未解答'), legendItem('hold', 'フラグ ⚑'));
    add(fb, lg);
    add(det, fb);
    add(w, det);
    add(sec, w);
    say((rt.index + 1) + '問目 / ' + N + '問');

    renderExamDock();
  }

  function renderExamDock() {
    var rt = S.live.exam;
    var c = ctx();
    var sess = rt ? Rec.findSession(c.rec, rt.id) : null;
    if (!sess) { clearDock(); return; }
    var N = sess.itemIds.length;
    var prev = btn('act act-sub', 'exam-goto', { index: String(Math.max(0, rt.index - 1)) }, '← 前へ');
    if (rt.index === 0) lock(prev, '先頭です');
    var next = btn('act act-sub', 'exam-goto', { index: String(Math.min(N - 1, rt.index + 1)) }, '次へ →');
    if (rt.index === N - 1) lock(next, '最後です');
    var pager = h('div', 'pager');
    add(pager, prev, next);
    setDock([[pager], [btn('act act-main', 'exam-submit-confirm', null, '提出する')]], null, '140px');
  }

  function blankCount(sess) {
    var n = 0;
    for (var i = 0; i < sess.itemIds.length; i++) {
      if (answersOf(sess, sess.itemIds[i]).length === 0) n++;
    }
    return n;
  }

  /* ===================================================================
   * 20. 記録（SPEC §6.6。4つのタブ）
   * =================================================================== */

  var HIST_TABS = [['trend', '推移'], ['dtype', '誤答型'], ['lo', '学習目標'], ['tries', '試行一覧']];

  function renderHistory() {
    var sec = screens.history;
    empty(sec);
    var c = ctx();
    add(sec, appbar({ title: '記録' }));
    var w = wrap();
    var nt = noticeNode();
    if (nt) add(w, nt);

    var seg = h('div', 'segbar');
    at(seg, 'role', 'tablist');
    for (var i = 0; i < HIST_TABS.length; i++) {
      var t = HIST_TABS[i];

  /* --- 推移。主役は予想得点が合格ラインにどう近づいているか ---
   *
   * ただし線が引けるまでには時間がかかる（各 K レベルで3問ずつ解説まで読む）。
   * その間もここは「記録」を開いた最初の画面なので、空のカードと内部語の壁に
   * しない（B-1）。上に「今週どれだけやったか」を置き、集計の内訳は
   * 折りたたみへ下げる。
   */
  function histTrend(c) {
    var box = h('div', null);
    var f = Stats.forecast(c.base);
    var series = forecastSeries(c);

    /* 1. まず自分の進み具合。線が引ける前から必ず読める数字だけで組む。 */
    add(box, weekCard(c));

    /* 2. 推移の図 */
    var chart = h('div', 'chart');
    var plot = h('div', 'chart-plot');
    var drawn = series.length > 0;
    if (!drawn) {
      add(plot, h('p', 'chart-empty', 'まだ線を引けません。各レベルで3問ずつ解説まで読むと、ここに予想得点の推移が出ます。'));
    } else {
      add(plot, trendSvg(series, f));
    }
    add(chart, plot);

    /* 描いていない線の凡例と、その読み方を出さない（B-1）。
       線が無いのに「2本が開いているのは」と書いてあるのは説明ではない。 */
    var lg = h('div', 'legend');
    if (drawn) {
      add(lg, lineLegend(null, '初見ベース（実力）'));
      if (f.all.score !== null) add(lg, lineLegend('memo', '全試行ベース（覚え込み）'));
    }
    add(lg, lineLegend('pass', '合格ライン ' + f.pass + '点'));
    add(chart, lg);
    if (drawn && f.all.score !== null) {
      add(chart, h('p', 'note', '2本が開いているのは「覚えているだけで理解していない」のサインです。閉じていれば本物。'));
    }
    add(box, chart);

    /* 3. 予想得点。門 F-T4 の「何問の初見に基づくか」は畳まずに出す。 */
    var cd = card('予想得点');
    if (f.first.score === null) {
      add(cd, h('p', 'forecast-unknown', '推定不能'));
      var need = [], ks = [2, 3, 4];
      for (var i = 0; i < ks.length; i++) if (f.first.need[ks[i]] > 0) need.push('K' + ks[i] + ' あと' + f.first.need[ks[i]] + '問');
      add(cd, h('p', 'note', '各レベルで3問ずつ解説まで読むと出せます' + (need.length ? '（' + need.join('・') + '）' : '') + '。'));
    } else {
      var head = h('div', 'forecast-head');
      add(head, h('span', 'forecast-score num', String(f.first.score)));
      add(head, h('span', 'forecast-max', '/ ' + f.max + '点'));
      var gap = f.pass - f.first.score;
      add(head, pill(gap > 0 ? '合格' + f.pass + '点まであと' + gap + '点' : '合格ライン到達', gap > 0 ? 'warn' : 'ok'));
      add(cd, head);
    }
    add(cd, h('p', 'note', 'はじめて解いた ' + f.first.n + '問に基づく（初見 ' + f.first.n + '問）。'));

    /* 集計の内訳は畳んでおく（B-1）。母数・初見・計測できなかった・白紙は
       どれもこのアプリの内部語で、記録を開いた最初の画面に並べる中身ではない。
       ただし隠しはしない —— 何が無いかを隠さないのがこのアプリの原則。 */
    var det = h('details', 'fold');
    at(det, 'data-fold', 'forecast-detail');
    add(det, h('summary', null, 'この数字の作り方（くわしく）'));
    var fb = h('div', 'fold-body');
    var dl = h('dl', 'resume-detail');
    add(dl, h('dt', null, 'はじめて解いた問題'), h('dd', null, f.first.n + '問（この正誤だけで計算します）'));
    add(dl, h('dt', null, '数えられなかった問題'), h('dd', null, f.unmeasured.count + '問'));
    add(dl, h('dd', null, '内訳：読んでいない（5秒未満）' + f.unmeasured.outlier + '問 ／ 問題が無くなった ' + f.unmeasured.orphan + '問'));
    add(dl, h('dt', null, '白紙で出した問題'), h('dd', null, f.blankScored + '問（0点として数に入れています）'));
    if (f.all.score !== null) add(dl, h('dt', null, '覚え込みを含めた点'), h('dd', null, f.all.score + '点'));
    if (f.unseenAttempts > 0) {
      add(dl, h('dt', null, '解説を見ずに離脱'), h('dd', null, f.unseenAttempts + '件（次に解いたときが「はじめて」になります）'));
    }
    add(fb, dl);
    add(fb, h('p', 'caveat', '48目標のうち25目標しか問題がありません。K4 は1問の正誤で約2.5点動きます。合格可能性は出しません。'));
    add(det, fb);
    add(cd, det);
    add(box, cd);

    /* 直近のセッション一覧。種類は mode / profile / filter から毎回導く（門 A-T8） */
    var fr = section('直近のセッション');
    var trend = Stats.trend(c.base, 20, c.rec);
    if (!trend.length) {
      add(fr, emptyBox('◻', 'まだ記録がありません', 'ホームの「続ける」から1回解くとここに出ます。'));
    } else {
      var list = h('div', 'tries');
      for (var i = trend.length - 1; i >= 0; i--) {
        var t = trend[i];
        var row = btn('try-row', 'open-explain-all', { sid: t.sessionId });
        add(row, h('span', 'item-no num', fmtDate(t.ts)));
        add(row, h('span', 'item-main', t.label));
        add(row, h('span', 'try-reason', t.n + '問'));
        add(row, h('span', 'item-time num', t.rate === null ? 'n=' + t.n : Math.round(t.rate * 100) + '%'));
        add(list, row);
      }
      add(fr, list);
    }
    add(box, fr);
    return box;
  }

  /* 「記録」を開いていちばん最初に読む数字（B-1）。
     線が引ける前から必ず出せるものだけで組む：今週の問題数・正答率・連続日数。 */
  function weekCard(c) {
    var cd = card('いまの調子');
    var daily = Stats.daily(c.base, c.now, 7);
    var week = 0;
    for (var i = 0; i < daily.length; i++) week += daily[i].count;
    var ov = Stats.overall(c.base);
    var streak = Stats.streak(c.base, c.now);
    var cards = h('div', 'statcards');
    add(cards, statCell(String(week), '問', '直近7日'));
    add(cards, ov.level === 'measured'
      ? statCell(String(Math.round(ov.rate * 100)), '%', '正答率（直近' + ov.n + '問）')
      : statCell(String(ov.n), '問', ov.n === 0 ? '正答率はまだ出ません' : '正答率はあと' + (3 - ov.n) + '問で出ます'));
    add(cards, statCell(String(streak.days), '日', '連続'));
    add(cd, cards);
    if (week === 0) {
      add(cd, h('p', 'note', 'この7日はまだ解いていません。ホームの「続ける」から1回やると、ここが動きます。'));
    }
    return cd;
  }
  /* .statcard は紺の色面の上に載る前提の面（--brand-card）なので、白いカードの
     上では青い箱になる。ここは中立の .big + .unit + .note で組む。 */
  function statCell(num, unit, label) {
    var e = h('div', null);
    var line = h('p', null);
    add(line, h('span', 'big num', num));
    add(line, h('span', 'unit', unit));
    add(e, line);
    add(e, h('p', 'note', label));
    return e;
  }

  /* 線の凡例。kind = null（実線・初見ベース）/ 'memo'（点線・全試行ベース）/
     'pass'（破線・合格ライン）。色と線種の両方で分かれる（門 E-T3）。 */
  function lineLegend(kind, text) {
    var it = h('span', 'legend-item');
    add(it, h('span', 'legend-line' + (kind ? ' is-' + kind : '')));
    add(it, h('span', null, text));
    return it;
  }

  /* 各セッション終了時点の予想得点。公開 API だけで作る。 */
  function forecastSeries(c) {
    var trend = Stats.trend(c.base, 20, c.rec);
    var out = [];
    for (var i = 0; i < trend.length; i++) {
      var ts = trend[i].ts;
      var subs = [];
      for (var j = 0; j < c.rec.attempts.length; j++) {
        if (ALTM.util.parseAt(c.rec.attempts[j].at) <= ts) subs.push(c.rec.attempts[j]);
      }
      var b2 = Stats.base({ attempts: subs, sessions: c.rec.sessions, settings: c.rec.settings }, Bank, c.now);
      var f2 = Stats.forecast(b2);
      out.push({ ts: ts, first: f2.first.exact, all: f2.all.exact });
    }
    /* 1本も数字が出ていないなら描かない */
    var any = false;
    for (var k = 0; k < out.length; k++) if (out[k].first !== null) any = true;
    return any ? out : [];
  }

  function trendSvg(series, f) {
    var W = 320, H = 150, L = 26, R = 8, T = 8, B = 22;
    var s = sv('svg');
    at(s, 'viewBox', '0 0 ' + W + ' ' + H);
    at(s, 'role', 'img');
    at(s, 'aria-label', '予想得点の推移。縦軸0〜' + f.max + '点、合格ラインは' + f.pass + '点');
    var max = f.max;
    function X(i) { return series.length <= 1 ? L : L + (W - L - R) * i / (series.length - 1); }
    function Y(v) { return T + (H - T - B) * (1 - v / max); }

    var ticks = [0, Math.round(max / 2), max];
    for (var g = 0; g < ticks.length; g++) {
      var gl = sv('line', 'chart-grid');
      at(gl, 'x1', L); at(gl, 'y1', Y(ticks[g])); at(gl, 'x2', W - R); at(gl, 'y2', Y(ticks[g]));
      add(s, gl);
      var tx = sv('text', 'chart-ytick');
      at(tx, 'x', L - 4); at(tx, 'y', Y(ticks[g]) + 4); at(tx, 'text-anchor', 'end');
      tx.textContent = String(ticks[g]);
      add(s, tx);
    }
    var ax = sv('line', 'chart-axis');
    at(ax, 'x1', L); at(ax, 'y1', T); at(ax, 'x2', L); at(ax, 'y2', H - B);
    add(s, ax);

    /* 合格ライン。色と破線の両方（門 E-T3） */
    var pl = sv('line', 'chart-passline');
    at(pl, 'x1', L); at(pl, 'y1', Y(f.pass)); at(pl, 'x2', W - R); at(pl, 'y2', Y(f.pass));
    add(s, pl);
    var plb = sv('text', 'chart-passlabel');
    at(plb, 'x', W - R); at(plb, 'y', Y(f.pass) - 4); at(plb, 'text-anchor', 'end');
    plb.textContent = '合格 ' + f.pass + '点';
    add(s, plb);

    function path(key, cls) {
      var d = '', started = false;
      for (var i = 0; i < series.length; i++) {
        var v = series[i][key];
        if (v === null || v === undefined) continue;
        d += (started ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1);
        started = true;
      }
      if (!started) return null;
      var p = sv('path', cls);
      at(p, 'd', d);
      return p;
    }
    var pAll = path('all', 'chart-line is-memo');
    if (pAll) add(s, pAll);
    var pFirst = path('first', 'chart-line');
    if (pFirst) add(s, pFirst);

    for (var i2 = 0; i2 < series.length; i2++) {
      if (series[i2].all !== null && series[i2].all !== undefined) {
        var d2 = sv('circle', 'chart-dot is-memo');
        at(d2, 'cx', X(i2).toFixed(1)); at(d2, 'cy', Y(series[i2].all).toFixed(1)); at(d2, 'r', '3');
        add(s, d2);
      }
      if (series[i2].first !== null && series[i2].first !== undefined) {
        var d1 = sv('circle', 'chart-dot');
        at(d1, 'cx', X(i2).toFixed(1)); at(d1, 'cy', Y(series[i2].first).toFixed(1)); at(d1, 'r', '3.5');
        add(s, d1);
      }
    }
    /* 横軸の目盛は端の2つだけ（詰めると読めない） */
    var ends = series.length > 1 ? [0, series.length - 1] : [0];
    for (var e = 0; e < ends.length; e++) {
      var xt = sv('text', 'chart-xtick');
      at(xt, 'x', X(ends[e])); at(xt, 'y', H - 6); at(xt, 'text-anchor', e === 0 ? 'start' : 'end');
      xt.textContent = fmtDate(series[ends[e]].ts);
      add(s, xt);
    }
    return s;
  }

  /* --- 誤答型タブ --- */
  function histDtype(c) {
    var box = h('div', null);
    var d = Stats.dtype(c.base, Bank);
    var rows = h('div', 'dtrows');
    var max = 1;
    for (var i = 0; i < d.types.length; i++) if (d.types[i].shown > max) max = d.types[i].shown;
    for (var j = 0; j < d.types.length; j++) {
      var t = d.types[j];
      /* 行そのものが「自分で選ぶ」の誤答型の絞り込みへの入口（袋小路にしない）。
         14種すべてに在庫があるので、押せない行は出ない。 */
      var row = btn('dt-row', 'open-picker-at', { kind: 'dtype', key: t.code });
      at(row, 'aria-label', t.code + ' ' + t.name + ' に絞って解く');
      var head = h('div', 'dt-head');
      /* バッジが記号と名前の両方を持つ。ここで名前をもう一度出さない
         （14行すべてが「D1 帰属先の取り違え｜帰属先の取り違え」になっていた）。 */
      add(head, dtypeBadge(t.code, null, t.shown === 0));
      add(row, head);
      var tlv = levelOf(t);
      if (tlv === 'excluded') {
        add(row, h('span', 'dt-figure', '—'));
        add(row, h('p', 'dt-never', '計測できず（除外された試行 ' + excludedCount(t) + '件）'));
      } else if (t.shown === 0) {
        add(row, h('span', 'dt-figure', '—'));
        add(row, h('p', 'dt-never', 'まだ出題されていません'));
      } else {
        add(row, h('span', 'dt-figure num',
          (tlv === 'measured' ? Math.round(t.rate * 100) + '%' : 'n=' + t.shown) + '（' + t.chosen + ' / ' + t.shown + '）'));
        var bar = h('div', 'bd-bar');
        var sh = DT_SHAPE[t.code];
        var fill = h('div', 'bd-bar-fill' + (sh ? ' dt-' + sh[0] : ''));
        cssVar(fill, '--pct', t.chosen / max * 100);
        add(bar, fill);
        add(row, bar);
      }
      add(rows, row);
    }
    add(box, rows);
    var lg = h('div', 'legend');
    add(lg, legendItem(null, '選んでしまった回数（分母は提示回数）'), legendItem('thin', '未出題はラベルで示します'));
    add(box, lg);
    add(box, h('p', 'note', '複合表記（D2+D3 など）は両方に1ずつ数えるので、型別の合計は誤答スロット数と一致しません。'
      + '行を押すと、その型の誤答肢を含む問題に絞って解けます。'));
    if (d.unknown.count > 0) {
      add(box, h('p', 'caveat', '語彙表に無い記号が ' + d.unknown.count + '件あります（' + d.unknown.codes.join('・') + '）。'));
    }
    return box;
  }

  /* --- 学習目標タブ。48目標を4状態で。在庫なしの23目標も出す --- */
  function histLo(c) {
    var box = h('div', null);
    var rows = Stats.byLo(c.base, Bank);
    var counts = {};
    for (var z = 0; z < LEVELS.length; z++) counts[LEVELS[z]] = 0;
    var withStock = 0;
    for (var z2 = 0; z2 < rows.length; z2++) if (rows[z2].itemCount > 0) withStock++;
    /* 48行・9,010px の平たい一覧に、絞り込みと章の畳みを入れる（B-21） */
    add(box, stockOnlyToggle(rows.length, withStock));

    var byChapter = {}, chapterOrder = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var lv = levelOf(r);
      if (counts[lv] === undefined) counts[lv] = 0;    // 知らない状態でも NaN にしない
      counts[lv]++;
      /* 弱点が見えたら、そこから演習へ行けること。行そのものが
         「自分で選ぶ」の同じ絞り込みへの入口になる。
         在庫0の23目標は押せない（押しても1問も出ない袋小路。門 F-T2）。 */
      var row = btn('lo-row is-' + lv, 'open-picker-at', { kind: 'lo', key: r.lo });
      add(row, h('span', 'lo-code', r.lo));
      add(row, h('span', 'lo-name', r.text));
      var st = h('span', 'lo-state');
      add(st, h('span', 'lo-swatch'));
      add(st, h('span', null, levelLabel(lv)));
      if (lv === 'measured') add(st, h('span', 'lo-rate num', Math.round(r.rate * 100) + '%'));
      else if (lv === 'thin') add(st, h('span', 'lo-rate num', 'n=' + r.n));
      /* 「計測できず」は件数を添える。数が無いと、なぜそうなったのかが分からない。
         見取り図（.lo-swatch）は .lo-row.is-excluded が「実線の枠＋横一文字」で
         描き分けるので、ここは他の状態と同じ .lo-rate でよい。 */
      else if (lv === 'excluded') add(st, h('span', 'lo-rate num', excludedCount(r) + '件'));
      add(row, st);
      if (r.itemCount === 0) lock(row, 'この学習目標には問題がありません');
      else at(row, 'aria-label', r.lo + ' ' + r.text + '（' + levelLabel(lv) +
        (lv === 'excluded' ? '・除外された試行 ' + excludedCount(r) + '件' : '') + '）この目標に絞って解く');
      /* 数えるのは全48行。絞り込みは見せ方だけで、集計は動かさない。 */
      if (S.stockOnly && r.itemCount === 0) continue;
      var ch = String(r.chapter);
      if (!byChapter[ch]) { byChapter[ch] = []; chapterOrder.push(ch); }
      byChapter[ch].push(row);
    }
    add(box, h('p', 'note', '48目標のうち ' + counts.nostock + '目標には問題がまだありません（解いても埋まりません）。'
      + '在庫のある行は押すと、その目標に絞って解けます。'));
    var secTitle = {};
    var secs = Bank.sections();
    for (var si = 0; si < secs.length; si++) secTitle[String(secs[si].chapter)] = secs[si].chapterTitle || '';
    for (var ci = 0; ci < chapterOrder.length; ci++) {
      var key = chapterOrder[ci];
      var det = chapterFold(key, secTitle[key], byChapter[key].length, true);
      var inner = h('div', 'lorows');
      for (var ri = 0; ri < byChapter[key].length; ri++) add(inner, byChapter[key][ri]);
      add(det, inner);
      add(box, det);
    }
    if (!chapterOrder.length) add(box, emptyBox('◻', '出す行がありません', '「すべて」に戻すと48目標が並びます。'));
    var LEG = {
      nostock: '在庫なし', none: '未着手', excluded: '計測できず',
      thin: 'データ不足 n<3', measured: '測定済み'
    };
    var lg = h('div', 'legend');
    for (var g = 0; g < LEVELS.length; g++) {
      add(lg, legendItem(LEVELS[g], LEG[LEVELS[g]] + '（' + counts[LEVELS[g]] + '）'));
    }
    add(box, lg);
    /* 「計測できず」の理由は、行ごとではなく一覧に1度だけ書く。
       行に内訳まで入れると48行が読めなくなる。件数は行が持っている。 */
    if (counts.excluded > 0) {
      var ov = Stats.overall(c.base);
      var why = [];
      if (ov.excluded.outlier) why.push('5秒未満 ' + ov.excluded.outlier + '件');
      if (ov.excluded.blank) why.push('白紙 ' + ov.excluded.blank + '件');
      if (ov.excluded.badAt) why.push('日時が読めない ' + ov.excluded.badAt + '件');
      if (ov.excluded.orphan) why.push('問題が無くなった ' + ov.excluded.orphan + '件');
      if (ov.excluded.dup) why.push('同じ回の重複 ' + ov.excluded.dup + '件');
      add(box, h('p', 'caveat', '「計測できず」は、解いたのに全部が集計から外れた状態です'
        + (why.length ? '（全体の内訳：' + why.join(' / ') + '）' : '')
        + '。時間をかけて解き直すと埋まります。'));
    }
    return box;
  }

  /* --- 試行一覧。先頭に中断・破棄したセッションを畳んで置く --- */
  function histTries(c) {
    var box = h('div', null);
    var odd = [];
    for (var i = 0; i < c.rec.sessions.length; i++) {
      var s = c.rec.sessions[i];
      if (s.state === 'active' || s.state === 'discarded') odd.push(s);
    }
    var det = h('details', 'fold discarded');
    add(det, h('summary', null, '中断・破棄したセッション（' + odd.length + '件）'));
    var fb = h('div', 'fold-body');
    if (!odd.length) {
      add(fb, h('p', null, 'ありません。'));
    } else {
      for (var j = 0; j < odd.length; j++) {
        var ss = odd[j];
        var row = h('div', 'try-row is-excluded');
        add(row, h('span', 'item-main', Filter.sessionLabel(ss, Bank) + '（' + ss.itemIds.length + '問）'));
        add(row, h('span', 'try-reason', ss.state === 'active' ? '中断中' : '破棄済み'));
        if (ss.state === 'discarded') {
          add(row, btn('act act-quiet', 'regrade', { sid: ss.id }, 'やはり採点する'));
        } else {
          add(row, btn('act act-quiet', 'resume', { sid: ss.id }, '再開'));
        }
        add(fb, row);
      }
    }
    add(det, fb);
    add(box, det);

    var recent = Stats.recent(c.rec, Bank, 60);
    if (!recent.length) {
      add(box, emptyBox('◻', 'まだ試行がありません', '1問解くとここに残ります。'));
      return box;
    }
    var list = h('div', 'tries');
    var REASON = { orphan: '問題が無くなった', dup: '同一回の重複', blank: '白紙', outlier: '5秒未満' };
    for (var k = 0; k < recent.length; k++) {
      var t = recent[k];
      var row2 = btn('try-row' + (t.excluded ? ' is-excluded' : ''), 'open-explain-all',
        { sid: t.sessionId, index: String(Math.max(0, t.indexInSession)) });
      add(row2, h('span', 'item-no num', fmtDateTime(t.ts)));
      var mk = t.unanswered ? '—' : (t.correct ? '○' : '✕');
      add(row2, h('span', 'item-mark is-' + (t.unanswered ? 'blank' : (t.correct ? 'ok' : 'no')), mk));
      add(row2, h('span', 'item-id', t.itemMissing ? t.itemId : t.lo));
      var main = h('span', 'item-main');
      add(main, D.createTextNode(t.item ? mdPlain(t.item.question).slice(0, 30) : '（問題データにありません）'));
      add(row2, main);
      if (t.review) add(row2, pill('復習', 'hold'));
      if (t.excluded) add(row2, h('span', 'try-reason', '集計から除外：' + (REASON[t.excluded] || t.excluded)));
      add(row2, h('span', 'item-time num', Math.round((t.ms || 0) / 1000) + '秒'));
      add(list, row2);
    }
    add(box, list);
    add(box, h('p', 'note', '除外した試行も消さずに残しています（白紙・5秒未満・重複・問題の消滅）。'));
    return box;
  }

  var RECOVER_LABEL = {
    broken: '読み取れなかった記録',
    prev: '読み込みで置き換える前の記録',

  function setRow(label, sub, ctl) {

  function radio(name, value, label, on) {

    return lab;
