担が軽いものを望んでいる。調達部門は取引実績のあるベンダーへ集約したいと考えている。\n\n年間の保守費は導入費用の20%である。評価・教育・移行に要する工数は、下表の削減見込みには含めていない。この工数は、習得期間が最も長い候補でも3年間で200万円を超えない。","table":{"caption":"候補3製品の比較（金額の単位は万円）","headers":["ツール","導入費用","年間の削減見込み","要件から結果までの追跡","セキュリティテストの管理","習得期間"],"rows":[["P","600","1,300","検査結果のみ記録（要件との対応付けは手作業）","対応なし","2週間"],["Q","1,000","1,200","要件から結果まで自動で記録","対応なし","4週間"],["R","1,600","1,000","要件から結果まで自動で記録","計画と結果を管理できる","8週間"]]},"question":"どの候補をどう扱うかの判断として、最も適切なものはどれか。1つ選べ。","choices":["要件から結果までの追跡とセキュリティテストの管理をともに満たすRを採る。3年でプラスの投資回収に達することを確かめたうえで、導入費と初期教育の工数は非経常のコスト、毎年の保守費は経常のコスト、習得の8週間に費やす時間は機会コストとして計画に見込む。","要件から結果までの追跡を自動で記録でき、3年間の投資回収額もRを上回るQを採る。セキュリティテストは外部の診断サービスに年2回委託し、その報告書を審査の場に提出する。","3候補とも3年でプラスの投資回収に達するため、投資回収の差は決め手にならない。追跡とセキュリティテストの管理の差も運用手順の整備で吸収できる範囲なので、最も早く立ち上げられる候補から段階的に導入する。","3年間の導入費と保守費の合計が最も低く、年間の削減見込みが最も大きく、習得期間も2週間で済むPを採る。要件との対応付けとセキュリティテストの記録は、現行の管理台帳を審査用に整えて示す。"],"answer":[0],"explanation":{"signals":"効くのは、審査で求められる2点（要件から検査結果までの追跡を記録で示すこと、セキュリティテストの計画と結果を同じツール上で管理すること）と、経営層が置いた3年以内のプラスの投資回収という条件、そして表の数値である。数値は候補の順位を直接には決めない。保守費を導入費用の20%として3年分を出すと、費用の合計はPが960、Qが1,600、Rが2,560、削減見込みの3年分はPが3,900、Qが3,600、Rが3,000である。削減見込みに含めていない評価・教育・移行の工数は3年間で200万円を超えないので、これを費用側に加えてもP、Q、Rの順に2,740、1,800、240の余裕が残るので、3候補とも条件を満たす。つまり投資回収は足切りとしてしか働かず、残る差は審査で求められる2点の充足だけである。開発チームの習得期間の希望、運用部門の保守負担、調達部門のベンダー集約は、いずれも審査の求めを代替しない。調達部門の集約の希望は、表のどの列とも結びつかないノイズである。","why":"シラバスは、経営幹部にとってプラスの ROI が要件となるとし、取得または構築の前に費用対効果分析を行い、経常的なコストと非経常的なコストの両方を考慮すべきだとしている。まずこの足切りを表の数値で確かめる。年間の保守費は導入費用の20%だから、3年間の費用はPが600＋360＝960、Qが1,000＋600＝1,600、Rが1,600＋960＝2,560である。削減見込みの3年分はそれぞれ3,900、3,600、3,000で、どの候補も費用を上回る。削減見込みに含めていない評価・教育・移行の工数は、習得期間が最も長い候補でも3年間で200万円を超えないから、これを費用に加えてもPは2,740、Qは1,800、Rは240の余裕が残り、最も余裕の小さいRでもプラスは崩れない。したがって「プラスの投資回収に達すること」という条件は3候補とも通過し、投資回収の大小は順位づけの根拠にならない。\n次に、候補を分ける要件を立てる。認定の審査で求められる2点は、交渉によって外せる性質のものではない。この2点が開発チーム・運用部門・調達部門の希望に優先するのは、審査がそれを求めるとシナリオが明示しているからである。シラバスの側から言えるのは、最適なツールを評価し特定するためにすべてのステークホルダーから要件を収集せよということまでで、集めた要件のうちどれが外せないかは、この状況が決める。シラバスはツールの利点の1つに、ツールがサポートする特定のテストタイプのカバレッジ向上を挙げており、セキュリティテストを扱えるかどうかは、このツールがどの範囲の品質リスクを引き受けられるかを直接に決める。追跡についても同じで、記録で示せなければ認定が維持できない。表を見ると、この2点をともに満たすのはRだけである。Pは2点とも欠き、Qは追跡は満たすがセキュリティテストの管理を欠く。\nRは導入費用が最も高く、削減見込みが最も小さく、習得にも8週間かかる。しかしコストと使用性の優位は、審査で求められる要件の欠落を埋め合わせない。加えてシラバスは、初期使用のためのツールの購入、適応、開発やツールの初期トレーニングを非経常的なコストに、定期的なライセンス料とサポート料およびメンテナンスコストを経常的なコストに数え、機会コストとして、ツールの評価・管理・トレーニング・使用に費やした時間は本来のテスト作業に充てられたはずだと述べている。導入費と初期の教育の工数は非経常のコスト、毎年発生する保守費は経常のコスト、習得の8週間に費やす時間は機会コストであり、3分類を分けたうえでいずれも計画に見込むべきものであって、候補を落とす理由にはならない。","distractors":[null,"Qは要件から結果までの追跡を自動で記録でき、3年間の投資回収額もRを上回るため、審査への備えと経済性を両立しているように見える。欠けているのは1点だけである。しかしその1点が、セキュリティテストの計画と結果を同じツール上で管理するという審査の求めそのものである。外部の診断サービスへの委託は、テストの実施を外に出すだけで、計画と結果がツール上で管理される状態を作らない。欠落が1つでも、認定を維持できるかどうかの結論は変わらない","3候補とも3年でプラスの投資回収に達するという計算は正しく、そこから投資回収が決め手にならないと読むところまでも正しい。誤りはその先にある。投資回収が候補を分けないのなら、残った差でこそ決めなければならないのに、この案はその差まで無視できる範囲だと扱っている。追跡とセキュリティテストの管理は、認定の審査が求めている2点であり、運用手順の整備で吸収できる性質のものではない。投資回収が候補を分けないからこそ、審査が求める2点をどれだけ満たすかという残った差で決めなければならない","3年間の費用が最も低く、削減見込みが最も大きく、立ち上げも最も早いのはPであり、経営層の条件も満たす。コストと使用性の両面で最良なので、最初に手が伸びる案である。しかしPは審査で求められる2点をどちらも欠く。要件との対応付けが手作業のままで、セキュリティテストの管理には対応していない。現行の管理台帳を整えて示すという補い方は、セキュリティテストの計画と結果を同じツール上で管理するという求めには届かない。コストと使用性の優位は、審査で求められる要件の欠落を埋め合わせない"],"flip":[null,"セキュリティテストの計画と結果を同じツール上で管理するという求めが、外部の診断サービスの報告書で代替できるのであれば、追跡を自動で記録でき投資回収額も大きいQが最良の選択になる",null,null],"flipNote":{"3":"この案が成り立つのは、審査で求められる2点を3候補とも満たすか、その2点が運用手順で補ってよいものになるかのどちらかである。しかしどちらの条件を置いても、同じく最も安く最も早く立ち上がるPを採ると述べている案が同時に正しくなり、最も適切なものが2つになる。この案だけを残すには、表の費用や削減見込みの並びまで併せて動かす必要があり、条件が2つ以上になる。","4":"認定の審査が、要件との対応付けやセキュリティテストの記録を台帳での提示で認めるのであれば、3年間の費用が最も低く削減見込みも最大のPを採るこの案は正しくなる。ただし同じ条件のもとでは、追跡とセキュリティテストの管理の差は運用手順の整備で吸収できるとして最も早く立ち上げられるPから入れる案も同時に正しくなり、最も適切なものが2つになる。この案だけを残す条件は、審査の求めの側にも表の側にも1つでは見つからない。"},"quote":"経営幹部にとっては、プラスのROI が要件となる。…ツールの取得または構築の前に、それが組織にとって有益であることを確実にするために、費用対効果分析を行うべきである。この分析では、経常的なコストと非経常的なコストの両方を考慮に入れるべきである。非経常的な活動およびコストには以下のものを含む：…初期使用のためのツールの購入、適応、開発…ツールの初期トレーニング…経常的な活動やコストには以下のものを含む：…定期的なライセンス料とサポート料…メンテナンスコスト…機会コストも考慮しなければならない。つまり、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性がある。…ツールがサポートする特定のテストタイプのカバレッジ向上","ref":"1.6.3（プラスのROI・費用対効果分析の経常／非経常のコスト・機会コスト・ツールの利点）／1.6.2（ステークホルダーの要件: すべてのステークホルダーから要件を収集する）","misconception":"プラスの投資回収を順位づけの指標だと読み、コストと使用性の優位が、規制・認定に由来する要件の欠落を埋め合わせると考える"},"meta":{"concept":"テストツールの選定とROI","relatedConcepts":["必須要件と足切り","ツールがサポートするテストタイプ","非経常コストと機会コスト"],"distractorIntent":["コストと使用性の優位で、審査に由来する要件を2つとも欠く候補を選ぶ","欠落が1点だけの候補を、外部委託で補えると考えて選ぶ（惜しい誤答）","全候補がプラスの投資回収に達することから、候補間の差そのものを無視できると扱う"],"distractorTypes":["D3","D3","D5"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-39","MP-41","MP-43","MP-46"],"confidence":"高","basis":"シラバス 1.6.3（プラスのROI・費用対効果分析・機会コスト・利点6項目）＋公式サンプル SET B 問25 の構造（比較表＋必須要件の充足個数で階段／4択ONE／D3遠い・D3惜しい・D5）。業種と表の項目を差し替え、全候補が足切りを通過するよう数値を設計して、計算だけでは順位が決まらないようにした","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は審査の求める2点で一意。flip[2] と flip[3] を対称に null にした監査の判断を支持する（下の裁定）。flip[1] は成立","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-syllabus-2026-09-13-t3.md","sig":"75df8ffd7571","explSig":"a9d20fa5beae","fieldSig":{"explanation.flip[1]":"3ad93bdd3d93","選択肢2":"de1348af249d","scenario":"d8f47138f188"}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"r1 の T1（足切りの確認が与件でできない）は工数上限の1文で解消。数値を自分で再計算して確認した。中1件","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-qa-2026-09-12-r2.md","sig":"75df8ffd7571","explSig":"a9d20fa5beae","fieldSig":{"scenario":"d8f47138f188","table":"b7bb83f7443e"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3個とも T1/T2 に当たらず。計算は足切りの確認にしか効いておらず設計どおり。足切りの成立余地が中1件","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-item-2026-09-12.md","sig":"75df8ffd7571","explSig":"a9d20fa5beae","fieldSig":{"scenario":"d8f47138f188","explanation.why":"a4e68b984cee","選択肢1":"c5398a398a6e"}}]},"variantAxis":"比較表から、認定の審査に由来する必須要件（追跡・セキュリティテストの管理）で候補を先に落とし、投資回収を足切りに留めてコストと使用性の優位を後段に回す（公式問25型・表＋4択ONE）。「カバーできるリスク」は読み②＝ツールがサポートするテストタイプでカバーされる品質リスクで採る"},{"id":"q-2.1.3-A-1","lo":"TM-2.1.3","cluster":"2.1.3-A","clusterName":"リリース判定に効くテスト報告の組み立て","variantAxis":"残存リスクの扱いと、決める人・提案する人の境界","variant":1,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"食品メーカーの受発注システムを刷新中で、2日後にリリース判定の会議がある。リリースの可否を決めるのは、会議に出る事業部長である。終了基準は着手前に関係者で合意し、以後見直していない。\n\nまだテストが済んでいないのは、取引先ごとの単価の適用と、締め日をまたぐ受注の扱いの2つで、誤れば請求金額や売上の計上先がずれる。どちらも連携先の基幹システムの改修待ちで、連携先はこの改修でインターフェースの仕様自体を見直している。仕様が固まるのは改修の完了と同時であるため、模擬データで先に流すこともできない。\n\n日次バッチの結果はそのまま会計に渡り、請求書を出す前に人が確かめる工程はない。旧システムはリリース当日に停止する。\n\n改修完了は6週間後との回答で、そこから2週間でこの2つは流せる。リリース予定日は取引先に通知済みで、延期には再調整が要る。新規の欠陥は直近2週間で週14件から3件に減った。","table":{"caption":"合意済みの終了基準と、会議2日前の現状","headers":["合意した終了基準","会議2日前の現状"],"rows":[["重い品質リスク12件すべてのテストを終えていること","10件が完了。2件は未着手"],["未解決の重大な欠陥がないこと","0件"],["テストケースの実行率が90%以上であること","94%"]]},"question":"テスト結果を分析し、リリース判定の会議に向けた報告として最も妥当なものはどれか。1つ選べ。","choices":["連携先の改修完了を待たず、インターフェースの仕様に沿った模擬データで単価の適用と締め日をまたぐ受注を先に流し、残るのは本番接続での疎通確認だけになるという見通しを添えて、予定どおりのリリースを提案する。","済んでいない2つが何であり、残したまま出せば業務のどこがどこまで狂い、それがどの程度起こりうるのかを示したうえで、8週間延ばして2つを流す案と、残したまま予定どおり出す案を、それぞれ何を引き受けるのかとともに並べて報告する。","済んでいない2つを流し終えるまではリリースできないと判断し、リリースを8週間延ばすことをテストマネージャーとして決めたうえで、再判定までの日程、追加で必要になるテストの工数、延期の間に旧システムを動かし続ける段取り、取引先への再調整の要否を整理して報告する。","合意した終了基準として決めた3項目はいずれも満たされており、済んでいない2つはその対象に入っていないものとして、各項目の達成状況の一覧に、2つが連携先の改修待ちであることを添えて報告する。"],"answer":[1],"explanation":{"signals":"効くのは4つである。①リリースするかどうかを決めるのは事業部長であり、2日後に決まること。②表の1行目の突き合わせ——合意した終了基準は「重い品質リスク12件すべてのテストを終えていること」であり、現状は10件、済んでいない2つはこの12件の中にある。合意は着手前に決めたきりで見直していないため、対象の範囲を報告の側で動かすことはできない。③済んでいない2つが取引先ごとの単価の適用と締め日をまたぐ受注の扱いであり、誤れば請求金額と売上の計上先が狂うこと。連携先の仕様は改修が終わるのと同時にしか固まらず、請求書を出す前に人が確かめる工程も無いため、先に模擬データで確かめる道も、出してから当てて直す道も無いこと。④旧システムはリリース当日まで動くので延期そのものは取れ、その代償は取引先への再調整であること。表の残り2行（重大な欠陥は0件、実行率は基準以上）と、新規欠陥が週14件から3件に減っていることは、手が付いていない領域が残っているうちは判断を分けない。","why":"シラバスは、報告に使えるメトリクスとして、テストしていないコンポーネントの残存リスク、すなわちテストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性を挙げている。表を突き合わせると、合意した終了基準のうち「重い品質リスク12件すべて」は満たされておらず、残る2件は連携先の改修待ちで手が付いていない。したがってこの場面は、基準の達成を報告すれば済む場面ではない。シラバスは、テスト実行を継続し識別される欠陥が少なくなってきたら終了の判断を下すことができるとしたうえで、この判断はメトリクスの報告と合意された終了基準に基づくべきであるとも述べており、合意した基準が1つ未達のまま終了を語ることはできない。残るのは、延ばすか、残ったリスクを引き受けて出すかの選択である。シラバスは、リスクベースドテストが、この時点でテストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にすると述べており、リリースの判定を行うのは開発チームとステークホルダーである。またシラバスは、メトリクスを報告する目的はマネジメントの目的のために情報に対する素早い理解を提供することであるとしている。この選択肢は、済んでいない2つが何であり、残したまま出せば何がどこまで狂い、それがどの程度起こりうるのかを示したうえで、延ばす案と出す案の双方について何を引き受けることになるのかを並べており、2日後に決める事業部長が比べられる形になっている。どちらか一方に寄せて結論を出しているわけでも、基準の達成だけを伝えているわけでもない。","distractors":["外部システムの完成を待たずに模擬データで先へ進めるのは、待ちが生じた場面で実際によく取られる手であり、日程を動かさずに残存リスクを疎通確認だけに縮められるなら、判定会議に出す案としては強い。しかしシナリオは、連携先がこの改修でインターフェースの仕様自体を見直しており、仕様が固まるのは改修が終わるのと同時だと述べている。突き合わせる相手が無いだけでなく、模擬データを組み立てる元になる仕様がまだ存在しない。先に流して確かめることはできず、残るのが疎通確認だけになるという見通しにも根拠がない。この報告は、取れない道を選択肢として事業部長に示すことになる",null,"未検証のまま出さないという構えも、6週間と2週間から出した8週間という期間も、日程・工数・旧システムの延伸・取引先への再調整という整理の軸も、いずれも妥当である。外しているのは、誰がそれを決めるかである。シラバスは、リスクベースドテストが、テストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にするとし、リリースの判定は開発チームとステークホルダーが行うとしている。会議に出るのはリリースするかどうかを決める事業部長であり、延期を決めたうえで段取りを報告するこの形は、判定を先に済ませて事後の通知に変えている。提案と判定の境界を越えている","満たした基準を一覧にして示すこと自体は報告の形として正しく、済んでいない2つについて理由も添えており、自分たちの手の届かない遅れを抱えた場面では説得力がある。しかし表の1行目の合意は「重い品質リスク12件すべてのテストを終えていること」であり、現状は10件で、済んでいない2つはこの12件の中にある。3項目はいずれも満たされているという記述も、2つが対象に入っていないという整理も、表と合わない。終了基準は着手前に関係者の合意で決めたきりで見直していないため、対象の範囲を報告の側で動かすこともできない"],"flip":[null,null,null,null],"flipNote":{"4":"表の1行目の合意を、連携先に依存する項目を除いた範囲で定められていたと読み替えれば、この一覧は表と食い違わなくなる。ただしそれだけでは、この報告が判定の材料として選ばれることにはならない。済んでいない2つは請求金額と売上の計上先に関わり、請求書を出す前に人が確かめる工程も無いため、テストしていない部分の影響と可能性を示す報告のほうが、2日後に可否を決める立場には依然として必要である。この肢が選ばれる側に回るには、終了基準の範囲と、残っている危険の大きさの両方が動く必要がある。","1":"連携先のインターフェースの仕様が既に固まっていて模擬データで先に流せる、という条件を当てても、この肢が選ばれる側に回ることにはならない。合意した終了基準の1行目「重い品質リスク12件すべて」は2件が未着手のまま未達であり、改修完了は6週間後であるから、本番接続での疎通確認はリリース後にしか行えない。請求金額と売上の計上先に関わる危険は残ったままで、可否を決めるのは会議に出る事業部長である。その影響と可能性を示し、延ばす案と残したまま出す案を、それぞれ何を引き受けるのかとともに並べる報告は依然として必要であり、条件を当てた世界でも判定の材料として筋の通る報告が2つ立って、1つ選べが成り立たない。","3":"この報告で足りるのは、2日後の会議が可否を決める場でなくなったときだけで、それは与件の条件の変更ではなく、「リリース判定の会議に向けた報告」を問うている設問そのものの変更である。動かせるほうの与件だけ、つまり決定者を事業部長からテストマネージャーに差し替える1文だけを当てても、済んでいない2つは請求金額と売上の計上先に関わり、請求書を出す前に人が確かめる工程も無いのだから、その影響と可能性を示して延ばす案と出す案を並べる報告が、会議に出す材料としては依然として要る。この肢は延期という結論だけを先に置いており、決定者が変わっても、引き受けるものを比べられる形にはならない。延ばすか残ったリスクを受け入れるかを決めるのは提案の受け手であるという線も、この条件では動かない。"},"quote":"テストしていないコンポーネントの残存リスク：テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性。／テスト実行を継続し、識別される欠陥が少なくなってきたら、テストを終了する判断を下すことができる。この判断は、メトリクスの報告と合意された終了基準に基づくべきである。／リスクベースドテストは、この時点でテストを延長するか、残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にする。","ref":"2.1.3 / 1.3.4","misconception":"テスト報告を「合意した基準に届いたかどうかの答え合わせ」だと考えており、届かなかった部分について、決定者が何を引き受けることになるのかを示す材料だとは捉えていない"},"meta":{"concept":"テストメトリクスと報告","relatedConcepts":["残存リスク","リリース判定","終了基準","リスク受容","提案と判定の境界"],"distractorIntent":["連携先を待たずに模擬データで先に確かめ、残存リスクを疎通確認だけに縮めて予定どおり出す（シナリオの明示条件で成立しない案）","延期という結論をテストマネージャーが先に決め、判定を事後の報告に変える","合意した終了基準の対象を取り違え、3項目とも満たしたものとして達成状況の一覧で済ませる"],"distractorTypes":["D2","D10","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス2.1.3（テストしていないコンポーネントの残存リスク＝潜在的な影響と可能性／終了の判断はメトリクスの報告と合意された終了基準に基づく／報告の目的は素早い理解）＋1.3.4（延長か受容かの正当な提案・判定を行うのは開発チームとステークホルダー）。誤答を先に書き、それぞれを殺す明示条件を表とシナリオに1つずつ用意した——模擬データでの先行検証案は「仕様が固まるのは改修の完了と同時」の1文で、延期をテストマネージャーが決める案は「リリースの可否を決めるのは事業部長」（1.3.4 の提案と判定の境界）で、合意の対象を取り違えた達成報告は表の1行目（重い品質リスク12件すべて／現状10件）で落ちる。合意した終了基準の文面は表にしか無く、シナリオは未実施の2つが合意の対象に入るかを述べないため、3つ目は表を読まなければ落とせない。型は公式 TM-2.1.3 の本線 D3 に D2 と D10 を添え、1つの型に寄らないようにした","mistakePatterns":["MP-25","MP-26","MP-27"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"本文・正答・quote は r4 どおり健全。ただし監査が残した flip 2本は、どちらも T3 を通らない（1本は正答が並び立ち、1本は設問の書き換えを含む）","ref":"jstqb-al-tm/kb/reviews/TM-2.1.3-syllabus-2026-09-13-t3.md","sig":"b91514a9acde","explSig":"a9b8d246da22","fieldSig":{"explanation.flip[1]":"01ba4719c80b","table":"20a8a81c4411","scenario":"dc7f5e07c50b","選択肢2":"94603bf0d42b","explanation.flip[3]":"01ba4719c80b","question":"43251372b31f"}},{"lens":"qa","date":"2026-09-12","round":5,"result":"pa っている項目のうちテストケースで確認できている割合／テストに投入した時間の計画に対する実績","重点箇所のうち、テストが全件通ったものと一部が不合格のものの割合／システムテストと受け入れテストで見つけた欠陥を、混入した工程で分けた件数の内訳／計画したテストのうち実行を終えたものの割合と、その週ごとの推移／重点箇所のうち、テストケースで軽減できている割合／テストに費やした時間の計画に対する実績","重点箇所のうち、テストが全件通ったものの割合／欠陥の重要度ごとの件数と、そのうち解決を終えた件数／実行したテストケースのうち合格したものと不合格のものの件数／仕様書の項目のうち、テストケースで検証できている割合／テストに要した時間の計画に対する実績","単体と結合の工程で得たステートメントとブランチの網羅率の推移／変更管理委員会に持ち込まれた仕様変更の件数の月ごとの推移／欠陥のステータス別（オープン、クローズ、却下など）の件数／計画したテストのうち実行を終えた件数とブロックされている件数／テストに使った時間の計画と実績の差"],"answer":[0],"explanation":{"signals":"効くのは5つである。①査察で、仕様書に書かれた項目の一つひとつについて検証した記録を示す必要があること、②工程を順に進め、各工程の成果物を文書に残す進め方であること、③仕様が凍結され、今期の変更が0件であること、④単体と結合が開発部門の担当で、今回のレポートの範囲に入らないこと、⑤重点箇所の中に、まだ着手できていないものが残っていること。①は、カバレッジの分母を仕様書の項目に置くことを外せなくする。⑤は、出荷の可否を見通すために、消化済みと不合格だけでなく、まだ手が付いていない分が見える形を外せなくする。③は仕様変更の件数を動かない数値にし、②と④は下位の工程で取る網羅率をこのレポートの外へ押し出す。テスト環境が3拠点に分かれている点は、いずれも同じ構成であり、どの組み合わせを選ぶかには効かない。","why":"シラバスは、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力が特定の方法で測定され報告されると述べる一方で、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきであるとしている。4つの候補はいずれも 2.1.3 が名前を挙げているメトリクスから組まれており、プロダクトリスク・欠陥・テスト進捗・カバレッジという枠の埋まり方でも、計画に対する実績という形の整い方でも分かれない。分かれるのは、このレポートが担う2つの役目——査察に向けて示す記録と、出荷の可否についての見通し——に対して、要るものが要る形で入っているかである。査察が示せと求めるのは仕様書に書かれた項目の一つひとつについての検証の記録であるから、カバレッジの分母は仕様書の項目でなければならない。これはシラバスがカバレッジの下に置く「要件カバレッジ：テストケースによってカバーしている要件の割合」にあたる。出荷の可否を見通すほうは、重点箇所の消化状況が、全件通ったもの・一部が不合格のものに加えて、まだ手が付いていないものまで分かれている必要がある。シラバスがプロダクトリスクのメトリクスとして挙げる3つは、すべてのテストが合格したリスクの割合、一部またはすべてのテストが不合格になったリスクの割合、まだ全部がテストできていないリスクの割合であり、着手できていない重点箇所が残っている以上、3つ目が落ちると、残っている危険の量が読めない。欠陥の累計と解決済みの累計は「欠陥数累計に対する解決済み欠陥数累計」、計画したテストの総数に対する実行・合格・不合格・ブロックの件数は、テスト進捗の「テスト実行状況：計画、実装、実行、合格、不合格、ブロック、スキップしたテストの総数」にあたる。投入した時間の計画に対する実績は、シラバスがテスト進捗の下に置く「テスト工数：テストに費やしたリソース時間の計画に対する実績」であって、コストの枠ではない。","distractors":[null,"5項目はいずれも 2.1.3 が名前を挙げるメトリクスから取られ、計画に対する実績という形も崩れていない。混入した工程で分けた欠陥の内訳は、どの工程で作り込み、どこで取り逃がしているかを示すため、検出を前工程へ寄せる改善に取り組む場面では最も効く組み合わせである。外しているのは、このレポートが担う2つの役目のほうである。カバレッジは重点箇所のうち軽減できている割合で置かれており、分母が自分たちで洗い出した重点箇所であるため、査察が示せと求める仕様書の項目ごとの検証記録には答えない。重点箇所の消化も、全件通ったものと一部が不合格のものの2区分にとどまり、まだ手が付いていない分が読めないため、出荷の可否の見通しにも届かない。指標として誤っているものは1つも無く、向いている目的が違う","査察が求める仕様書の項目ごとの確認状況を持ち、欠陥も解決の進みまで示し、時間も計画に対する実績で出している。この組み合わせは、重点箇所の消化を全件通ったものの割合だけで示している点を除けば、そのまま定例レポートとして通る作りになっている。しかし重点箇所の一覧にはまだ着手できていないものが残っており、全件通った割合だけでは、残りが不合格で止まっているのか、そもそも手が付いていないのかが区別できない。シラバスがプロダクトリスクのメトリクスに、まだ全部がテストできていないリスクの割合を別立てで挙げているのはこのためで、出荷の可否を見通す役員にとっては、この区分が最も知りたい数である","ステートメントとブランチの網羅率は、コードをどこまで実行したかを測る指標として実在し、数値としても明快である。しかし単体と結合の工程は開発部門が担当し今回のレポートの範囲に入らないうえ、シラバスは構造カバレッジのメトリクスを、コンポーネントテストやコンポーネント統合テストのようなより低いレベルのテストに適用できるものとして位置づけている。仕様変更の件数も、仕様が凍結され今期の変更が0件である以上、報告の枠を1つ使って動かない数値を載せることになる。欠陥のステータス別の件数も、実行とブロックの件数も、時間の計画と実績の差も妥当であるため、2つを空費している点が見えにくい"],"flip":[null,null,null,null],"flipNote":{"2":"この組み合わせが最も効くのは、レポートの役目が、査察への備えや出荷の可否ではなく、どの工程で欠陥を作り込みどこで取り逃がしているかを突き止めることに変わったときである。それは設問が定めるレポートの役目そのものの変更であって、シナリオの条件の変更では届かない。シナリオの側で査察の求めや重点箇所の残り方を動かしても、この組み合わせのカバレッジの分母は自分たちで洗い出した重点箇所のままであり、仕様書の項目ごとの検証の記録には答えない。","3":"重点箇所の一覧に未着手のものが残っていないという条件を置けば、全件通った割合だけでも消化の状況は言い尽くせる。ただしこの組み合わせは、進捗を実行したテストケースのうち合格したものと不合格のものの件数で置くにとどまり、計画したテストの総数を分母に持たない。テストが実行の途中である以上、出荷の可否を見通すには、どこまで進んでどれだけ残っているかが読める形が要る。反転には、重点箇所の区分と、進捗を測る分母の2つを動かす必要がある。","4":"この組み合わせには、査察が求める仕様書の項目ごとの検証の記録にあたる指標も、重点箇所の消化を示す指標も入っていない。単体と結合の結果をレポートの範囲に含める条件や、仕様が頻繁に変更される条件を置いても、この2つの欠落は埋まらない。反転にはレポートが担う2つの役目そのものを置き換える必要があり、条件を1つ変えて届く距離ではない。"},"quote":"プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力は、プロジェクト終了時に特定の方法で測定され、報告される。／まだ全部がテストできていないリスクの割合／要件カバレッジ：テストケースによってカバーしている要件の割合。／テストマネジメントは、テストがテスト対象システムの構造をどの程度実行しているかを測定するためにコードカバレッジのメトリクスを使用することができるが、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。／テスト工数：テストに費やしたリソース時間の計画に対する実績","ref":"2.1.3","misconception":"メトリクスを1つずつの妥当性や、カテゴリーの枠が埋まっているかで選べると考えており、そのレポートが果たす役目に対して、要るものが要る形（分母と区分）で入っているかで見ていない"},"meta":{"concept":"テストメトリクスと報告","relatedConcepts":["要件カバレッジ","プロダクトリスクのメトリクス","構造カバレッジとテストレベル","規制対応の報告"],"distractorIntent":["早期の欠陥検出を改善する目的には最も効く整った集合を置き、査察の記録の単位と出荷可否の見通しという、このレポートの目的から外す","査察の記録の単位も計画対比の工数も満たした整った集合から、まだ着手できていない重点箇所の区分だけを落とす","シナリオが無効化した指標（下位レベルの網羅率・仕様変更の件数）を一般論の妥当性で選ぶ"],"distractorTypes":["D4","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","confidence":"高","basis":"シラバス2.1.3（報告すべきメトリクスの列挙／プロダクトリスクの3区分に「まだ全部がテストできていないリスクの割合」が入る／要件カバレッジ／より高いレベルの報告はコンテキストとニーズに合わせる／構造カバレッジはより低いレベルのテストに適用／テスト工数は「テスト進捗」配下で計画に対する実績）。公式サンプル SET B 問30・SET A 問30 の構造（この文脈に合うかで否定）と、概念ノートの裁定 M7・M9・M10・M13 に合わせた。誤答を先に書き、4肢のうち3肢が同じカテゴリーの枠を埋め、形の崩れた項目（総量の工数など）を持たないようにしたうえで、分岐を査察の記録の単位（カバレッジの分母）と未着手の可視化という文脈適合の2点だけに残した。設問文に目的を書いたため、主型は D4（別の目的には効くが、この目的に答えない）になる","mistakePatterns":["MP-24","MP-25","MP-28"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答は一意、3誤答の否定根拠はシナリオに実在、quote は 2.1.3 に逐語一致。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-2.1.3-syllabus-2026-09-13-t3.md","sig":"faefd8ae8fd7","explSig":"71f39fe97b9e","fieldSig":{"explanation.why":"525b186e0488","選択肢4":"de484b11e0ee"}},{"lens":"qa","date":"2026-09-12","round":5,"result":"pass","note":"正答の5指標に T1／T2 を当てたが、どちらにも当たらない。旧重大は flip の成立性のみ","ref":"jstqb-al-tm/kb/reviews/TM-2.1.3-qa-2026-09-12-r5.md","sig":"faefd8ae8fd7","explSig":"71f39fe97b9e","fieldSig":{"explanation.flip[4]":"e3b0c44298fc","explanation.flip[3]":"01ba4719c80b","選択肢3":"d55e9057a799"}},{"lens":"item","date":"2026-09-12","round":5,"result":"pass","note":"3誤答とも否定根拠がシナリオに実在し、選ぶ人の思考も3つとも書ける。T1・T2 に当たらない","ref":"jstqb-al-tm/kb/reviews/TM-2.1.3-item-2026-09-12-r5.md","sig":"faefd8ae8fd7","explSig":"71f39fe97b9e","fieldSig":{"question":"d420b6226757","選択肢1":"2deeac423741","選択肢3":"d55e9057a799"}}],"unfrozen":{"date":"2026-09-12","decidedBy":"user","reason":"凍結の理由書きどおり、r4 の重大は 2026-09-12 の門で判定し直した。qa・item を r5 として一から当て直し、4観点とも重大0。凍結時の本文から1文字も変えていない（sig 不変）。各 r5 は「門の改訂で落ちた」のか「手順を当てても立たない」のかを分けて記録している。","previouslyFrozen":{"date":"2026-09-12","decidedBy":"user","reason":"r4 まで回しても qa・item の重大が残り、修正2巡の上限を超えた（発散）。syllabus は両問とも pass で、シラバス上の正しさは確認できている。残る重大は 2026-09-12 の新しい門ではほぼ中に落ちる種類のため、ユーザーの判断で今の版のまま凍結し、backlog に送る。作り直しはしない。"}}}},{"id":"q-2.2.3-A-1","lo":"TM-2.2.3","cluster":"2.2.3-A","clusterName":"コンテキストに応じたテスト見積り技法の選択","variant":1,"chapter":2,"section":"2.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは、倉庫の入出荷を扱うシステムを自社で作っている会社のテストマネージャーである。開発は2週間の反復で進めており、同じ顔ぶれのチームが4年続いている。反復ごとに、どの懸念の確認にどれだけ時間を使ったかを毎回記録に残してある。\n\n次の反復のテストの進め方は、3つに分けて決めた。中心は、出荷が止まる恐れの大きい箇所から順に確かめる進め方である。今回確かめる懸念は、前の反復の終わりに行ったリスクの見直しで選び出してあり、その件数は計画会議を待たずに確定している。荷主ごとの料金計算の画面は毎回作り替えが入るため、ここは手順を先に書かず、画面を操作しながら確かめる。この役は、この業務を10年見てきた運用担当者2名が引き受ける。基幹の在庫更新については、自動化済みの確認のうち一部だけを今回の対象とすることが決まっている。\n\n次の反復で開発側が積む総作業量は、反復の計画会議が終わるまで確定しない。テストの見積りは、その会議の前に出す必要がある。倉庫の現場からは、画面の文字が小さいという声が前から届いている。","question":"この状況で、次の反復のテスト工数の見積りの作り方として適切なものはどれか。2つ選べ。","choices":["在庫更新については、自動化済みの確認を端から端まで通す前提に立ち、1件あたりの実行時間に確認の全件数を掛けて工数を出す。","出荷が止まる恐れの大きい箇所から順に確かめる分は、これまでの反復の記録から、1件の懸念の確認に実際にかかった時間の平均を出し、今回挙げた件数に掛けて工数を出す。","反復の総作業量に対するテストの割合をこれまでの反復の記録から求め、その割合を次の反復の総作業量に掛けて、3つの進め方をまとめた1つの値として出す。","毎回作り替えが入る画面の分は、長く現場を見ている2名の判断で、1回に確かめる時間の枠と確かめる回数を決め、その積を工数とする。","長く現場を見ている2名の判断で、中心の進め方と画面を操作して確かめる分を合わせた1つの値を置いて今回のテストの見積りとし、自動化済みの在庫更新の確認は人手がかからないため、この値の中で吸収できるものとして扱う。"],"answer":[1,3],"explanation":{"signals":"効くのは4つである。①テストの進め方が3つに分けて決まっていること、②反復ごとに、どの懸念の確認にどれだけ時間を使ったかの記録が残っており、今回確かめる懸念の件数も前の反復の終わりのリスクの見直しで確定していること、③在庫更新は自動化済みの確認のうち一部だけが今回の対象であること、④次の反復の総作業量が計画会議まで確定せず、見積りはその前に出す必要があること。①は見積りの対象範囲を、②は1件あたりの実績と数える対象という2つの入力がそろっていることを、③は対象の広さを、④は反復の総作業量を母数とする手だけが掛ける相手を持てないことを決めている。見積りの時点で確定しているのは懸念の件数であって、反復の総作業量ではない。作り替えが入る画面の確認を業務を10年見てきた運用担当者2名が引き受ける点は、人の判断を入力とする手が使えることを示す。画面の文字が小さいという現場の声は、どの手を選ぶかには関与しないノイズである。","why":"シラバスは、テスト見積りがテストプロセスに関わるすべての活動を対象とすべきであると述べている。したがって、3つに分けて決めた進め方は、いずれも見積りの対象に入る。ただし、対象に入ることと、その分を見積る手が選択肢に用意されていることは別である。在庫更新のうち今回の対象と決まった一部を見積る手を述べた選択肢は無く、唯一そこに触れる選択肢1は、対象が一部だけと決まっているのに全件を通す前提に立っている点で外れる。ここで選ぶのは3本すべてを覆う組ではなく、入力が揃っていて対象の限定にも反しない手である。そのうえでシラバスは、技法の選択がデータの可用性や専門家の可用性などに左右されるとし、比率や外挿による見積りは過去のデータに依存し、デルファイ法やプランニングポーカーは専門家やチームメンバーの意見や判断に依存すると述べている。つまり技法はそれぞれ入力を要求し、入力が無ければ根拠のない値しか出ない。ここでは、懸念1件あたりに実際にかかった時間という履歴が残り、今回確かめる懸念の件数も前の反復の終わりのリスクの見直しで確定しているため、中心の進め方には履歴と件数を入力とする手が当たる。この手は、今回選び出した懸念の重さの構成が過去の反復と大きく違わないことを前提にする。シラバスは、テスト見積りにおける前提条件は常に見積りの一部として文書化すべきであるとし、見積りは新しい情報や変化する情報を反映して更新されるべきであるとも述べているので、この前提は書き出しておき、偏りが分かった時点で見積りを更新する。掛ける相手が本文のどこにも無い選択肢3と違い、ここでは掛ける件数そのものが確定しているため、この前提は手の成立を妨げない。一方、作り替えが入る画面は手順を先に書かないため件数を数える対象が無く、代わりに業務を長く見てきた2名の判断が得られるので、確かめる時間の枠と回数を人の判断で置く手が当たる。入力の種類が進め方ごとに違う以上、1つの技法に統一せず、進め方ごとに手を変えて併用することが、この状況での見積りの作り方になる。なお、原文 2.2.1 はアジャイルプロジェクトではテスト活動を開発作業の中で見積ることが多いと述べているが、それはテストの工数をどの単位で示すかについての記述であり、本問が問うているのは、その値をどの技法で作れるかである。技法の選択を決めるのは 2.2.3 が挙げる入力の可用性であって、開発モデルではない。","distractors":["自動化済みの確認は端から端まで通すのではなく、そのうち一部だけを今回の対象とすることが決まっている。対象でない確認まで件数に数えれば、実際には行わない作業を見積りに積むことになる。自動化済みなら全件通しても費用は変わらないという感覚から、限定を読み飛ばして選ばれやすい。",null,"割合を掛ける相手である次の反復の総作業量が、計画会議が終わるまで確定しない。見積りはその会議の前に出す必要があるため、掛ける母数が無い。確定しているのは今回確かめる懸念の件数であって、割合が掛かる相手である反復の総作業量ではない。割合そのものは記録から求められるので、履歴があるという一点だけを見ると成立しているように見える。",null,"在庫更新の確認は、今回の対象として決まった進め方の1つである。人手がかからないことは工数が無いことを意味せず、対象に入っている活動を他の値の中に吸収させれば、その分だけ見積りが低く出る。2名の判断を使うこと自体は妨げられないが、それは見積りの対象範囲を狭めてよい理由にはならない。自動化済みの作業を工数の外に置く現場の習慣から選ばれやすい。"],"flip":[null,null,null,null,null],"flipNote":{"1":"今回の対象が自動化済みの確認の全件であれば、1件あたりの実行時間に全件数を掛ける作り方は、その分の見積りとしては筋が通る。ただしこの問いは2つを選ぶ形であり、対象の限定を外しても、懸念1件あたりの実績と件数がそろう中心の進め方の手も、2名の判断が得られる画面の分の手も、そのまま成り立ったままである。適切な手が3つになって2つを選ぶという形が成り立たなくなるため、対象の限定を外すだけではこの肢は選ばれる側に回らない。","3":"次の反復の総作業量が見積りを出す時点で確定していれば、割合を掛ける相手は手に入る。ただしそれだけでは、履歴と件数がそろう中心の進め方の手も、2名の判断で置く画面の分の手もそのまま成り立ち、適切な手が3つになって2つを選ぶ形が壊れる。しかも割合の元になるのは反復ごとの記録であり、その記録が無い条件を置けば、この手自身も同時に入力を失う。掛ける母数の有無だけでこの肢を正答の側へ動かすことはできない。","5":"この扱いが成り立つのは、在庫更新の確認が今回の進め方から外れて見積りの範囲が2つになり、かつ反復ごとの記録が残っておらず2名の判断に頼るほかない場合である。前者だけでは、懸念1件あたりの実績と件数がそろう中心の進め方に履歴を使う手が当たるため、2名の判断で1つにまとめる必要がない。後者だけでは、今回の対象と決まっている在庫更新の確認を他の値に吸収させる点が残り、その分だけ見積りが低く出る。2つの条件がそろってはじめて、この扱いが選ばれる側に回る。"},"quote":"テスト見積りは、テストプロセスに関わるすべての活動を対象とすべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。","ref":"2.2.3（見積りの対象範囲、データの可用性、専門家の可用性）","misconception":"進め方が複数明記されていても、1つの技法にまとめたり、対象と決まった活動を他の値に吸収させたりしてよいと考え、技法がそれぞれ要求する入力（履歴・人の判断・掛ける母数）を確かめずに選ぶ。"},"meta":{"concept":"テスト見積り技法の選択","relatedConcepts":["メトリクスベースとエキスパートベース","データの可用性","専門家の可用性","見積りの対象範囲"],"distractorIntent":["限定表現（一部だけが対象）を読み飛ばし、自動化済みの確認を全件通す前提で積む","履歴があることだけを見て割合による見積りを選び、割合を掛ける母数が未確定であることを見落とす","熟練者の判断という与件だけを見て全体を1つの値で置き、対象と決まった活動を、自動化済みで人手がかからないという理由でその値に吸収させる"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-50"],"confidence":"高","basis":"シラバス 2.2.3（すべての活動を対象とすべきである／データの可用性／専門家の可用性）＋公式サンプル SET B 問32 の構造（テスト方針を N 本立てで明記し、誤答は1本を落とすか限定に矛盾させる5択TWO）。業種（保険のアジャイル分散→倉庫の入出荷）と方針の組、および母数未確定という制約を差し替えた","notes":"誤答3（割合を掛ける手）が突く誤解——履歴データがあることだけを見て、その技法が要求する他の成立条件（掛ける母数）を確かめない——に対応する MP が未登録。MP-51 は専門家ベース限定のため使っていない","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答2肢は入力の可用性で一意に決まり、3誤答の否定根拠はシナリオの明示文に実在。quote は 2.2.3 に逐語一致。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-syllabus-2026-09-13-t3.md","sig":"3aa9437c6e8d","explSig":"ddd9d4cb5859","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"T1・T2 とも該当なし。前巡の重大（正答の柱「今回挙げた件数」が見積り時点で与えられていない）は、件数の確定を明示した1文で解消","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-qa-2026-09-12-r2.md","sig":"3aa9437c6e8d","explSig":"ddd9d4cb5859","fieldSig":{"選択肢2":"ac58be2f20da","explanation.why":"7bbdb48af089"}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答3個は T1・T2 のどちらにも当たらない","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-item-2026-09-12-r2.md","sig":"3aa9437c6e8d","explSig":"ddd9d4cb5859","fieldSig":{}}]},"variantAxis":"明記された3つの進め方それぞれについて、その進め方の入力（履歴データ／人の判断）が揃っている手を当て、併用として選ぶ（公式問32型・散文の制約層・5択TWO）。限定表現と母数の未確定が誤答を殺す","noShuffle":true},{"id":"q-2.2.3-A-2","lo":"TM-2.2.3","cluster":"2.2.3-A","clusterName":"コンテキストに応じたテスト見積り技法の選択","variant":2,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、電力会社の検針データを処理して請求額を出すシステムの更改を請け負う会社のテストマネージャーである。開発は工程を順に進める形で、契約で決めた範囲と期日は動かせない。要件定義書は先週承認され、確認すべき要件の一覧は確定している。\n\n同じ発注元の更改は、これまでに2度、同じ体制で担当した。そのときのテストの実績は、要件1件あたりに何時間かかったかまで社内に残してある。\n\n今回のテストの担当者の顔ぶれは、要員の調整がつく来月まで決まらない。この分野に詳しい技術者はいずれも別の案件に出ており、今回の見積りに意見を出してもらえる見込みは薄い。設計と製造を合わせた今回の総工数は、分担が決まる来月まで確定しない。見積りは来週の契約前の会議に一度で出す必要があり、関係者が集まって突き合わせを重ねる時間は取れない。作業場所は今回から発注元の事務所ではなく自社の拠点になる。","question":"この状況で、契約前の会議に出すテスト工数の見積りをどう作るかを判断する。最も適切なものはどれか。1つ選べ。","choices":["承認された要件の一覧の件数に、これまで2度担当した更改で残した1件あたりの実績時間の平均を当てはめて全体の工数を積み上げ、置いた前提を見積りに添える。","これまで2度担当した更改の実績から、開発工数に対するテストの割合を求め、今回の総工数にその割合を掛けた値を全体の工数とする。","要件1件あたりに何時間かかるかを、今回の担当予定者とこの分野の有識者の見立てで、楽観的な値、悲観的な値、最も可能性の高い値の3つとして置き、期待値とばらつきを計算して全体の工数にまとめる。","経験のある担当者がそれぞれ個別に値を出し、差の大きい項目を持ち寄って根拠を説明し合い、値が寄るまで繰り返したうえで、合意した値と置いた前提を見積りに添える。"],"answer":[0],"explanation":{"signals":"効くのは4つである。①要件の一覧が承認され確定していること、②同じ更改を2度担当し、要件1件あたりの実績時間が社内に残っていること、③この分野に詳しい技術者から今回の見積りに意見を出してもらえる見込みが薄いこと、④今回の総工数が来月まで確定せず、見積りは来週の会議に一度で出す必要があり、突き合わせを重ねる時間が取れないこと。①と②は数えられる対象と1件あたりの実績という2つの入力を与え、③は人の判断を入力とする手を、④は全体の工数を母数とする手と、繰り返して値を寄せる手を、それぞれ成り立たなくする。見積りの時点で確定しているのは要件の件数であって、設計と製造を合わせた総工数ではない。工程を順に進める形であることは、どの手が使えるかを決めない。作業場所が今回から自社の拠点になることも、使える手を入れ替えはしない。ただし、残っている実績は同じ体制で発注元の事務所にいたときに出た値なので、それを今回にそのまま当てはめてよいかという前提には関わる。これは技法を選び直す理由ではなく、選んだ手に添える前提として書き出す対象である。","why":"シラバスは、見積り技法の選択がデータの可用性や専門家の可用性などの要因に左右されるとし、専門家の可用性については、知識と経験を持つ専門家の関与が要件となる手法があると述べている。技法はそれぞれ入力を要求するのだから、その入力が揃っているかを先に見る。この状況で正答を立てているのは、まずデータの可用性である。シラバスは、手法によっては過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここでは同じ発注元の更改を2度、同じ体制で担当し、要件1件あたりに何時間かかったかまで社内に残っているので、履歴データを要件とする手が、その要件を満たす。掛ける相手である要件の件数も、要件定義書が承認されて一覧が確定していることで揃っている。なお、シラバスが一般的な実践例として挙げるのは、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることであり、この作り方が数えるのはテストケースではなく要件そのものの件数だから、実践例とそのまま重なるわけではない。実践例はここでは、テストベースが確定していることがこの種の手の成立条件だと示す補助として読む。正答を支えているのは、履歴データと数える対象がどちらも手元にあるという一点である。この手は、担当者の顔ぶれが決まっていなくても、また意見を出せる技術者がいなくても値を出せる点で、人の判断を入力とする手と決定的に違う。さらにシラバスは、見積りにおける前提条件を常に見積りの一部として文書化すべきであると述べており、実績の平均が今回も当てはまるという前提を添えることで、後に条件が変わったときに見積りを更新する根拠が残る。添える前提の中身はここにある。過去の実績は同じ体制で発注元の事務所にいたときの値であり、今回は顔ぶれが未定で作業場所も変わるのだから、その平均をそのまま当てはめられるという判断そのものが前提である。なお、工程を順に進める形であることから技法を決めてはならない。シラバスが開発モデルと技法を結びつけている段落は「例えば」で始まり、述語は「使用できる」であって、可用性のように要件となるとは書かれていない。","distractors":[null,"割合を掛ける相手である今回の総工数が、分担が決まる来月まで確定しない。見積りは来週の会議に出す必要があるため、掛ける母数が無い。割合そのものは2度の更改の実績から求められるので、社内に実績が残っているという一点だけを見ると成立しているように見える。工程を順に進める形で範囲が固定されている案件には割合による見積りが向く、という知識からも選ばれやすい。","この作り方は、3つの値を今回の担当予定者とこの分野の有識者の見立てから置くとしている。ところが担当者の顔ぶれは要員の調整がつく来月まで決まらず、この分野に詳しい技術者はいずれも別の案件に出ていて、今回の見積りに意見を出してもらえる見込みは薄い。3つの値を置く人が見積りの時点でいないため、この手は入力を持てない。期待値とばらつきを数式で出す見た目から、人の見立てを入力としない客観的な手だと受け取られやすい。","値が寄るまで繰り返す進め方は、参加する者が決まっていることと、繰り返すための時間があることを前提にする。担当者の顔ぶれは来月まで決まらず、見積りは来週の会議に一度で出す必要があり、突き合わせを重ねる時間も取れない。工程を順に進める形では有効だという知識から選ばれやすい。"],"flip":[null,null,null,null],"flipNote":{"2":"見積りを出す時点で今回の総工数が確定していれば、割合を掛ける相手は手に入る。ただしそれだけでは、承認された要件の一覧の件数と、2度の更改で残した要件1件あたりの実績時間という、より直接の入力がそろった作り方が何も失わずに残っている。この肢が選ばれる側に回るには、掛ける母数が手に入ることに加えて、要件1件あたりの実績が残っていないなど、直接の作り方が入力を失う条件も同時に要る。","3":"3つの値を見立てで置くには、見立てを出す人が要る。担当者の顔ぶれが来月まで決まらないことと、この分野に詳しい技術者が別の案件に出ていることは別々の条件で、どちらか一方が変わっても、残る一方が同じ理由でこの手の入力を欠かせる。さらに両方がそろっても、要件の件数と1件あたりの実績という実測の入力がある以上、見立てを入力とするこの手がそれに代わって選ばれることにはならない。","4":"値が寄るまで繰り返す進め方には、参加する者が決まっていることと、繰り返すための時間があることの2つが要る。担当者の顔ぶれが来月まで決まらないことと、見積りを来週の会議に一度で出す必要があり突き合わせを重ねる時間が取れないことは別々の条件で、片方だけを動かしても、残る片方がこの手の前提を欠かせる。加えて実測の入力がそろっている以上、両方が満たされてもこの手が直接の作り方に代わって選ばれることにはならない。"},"quote":"見積り技法の選択は、以下のようなさまざまな要因に左右される…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。…一般的な実践例は、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることである。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。","ref":"2.2.3（見積り技法の選択を左右する要因、一般的な実践例、前提条件の文書化）","misconception":"技法が要求する入力（判断を出せる人、掛ける母数、繰り返す時間）が揃っているかを確かめる前に、開発モデルや技法の一般的な長所で見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","relatedConcepts":["データの可用性","専門家の可用性","時間的制約","前提条件の文書化"],"distractorIntent":["3つの値を置く手を、数式を使うからデータに基づく手だと読み、3つの値を見立てで置く人が見積りの時点でいないことを見落とす","社内に実績が残っていることだけを見て割合による見積りを選び、割合を掛ける母数が未確定であることを見落とす","繰り返して値を寄せる手を、工程を順に進める形に合う手として選び、参加者と時間の条件を見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-47","MP-48","MP-51"],"confidence":"高","basis":"シラバス 2.2.3（見積り技法の選択を左右する要因、一般的な実践例、前提条件の文書化）＋公式サンプル SET B 問33 の構造（逐次型・スコープ固定の状況で、技法を事実に照合させる4択ONE）。業種（政府向け→電力の検針・請求）と事実の組を差し替え、誤答の1つをエキスパートベースからメトリクスベース側（自社の実績から求めた割合）に替えて、分類だけで正答が浮かばないようにし、社内の実績を使う肢を正答だけに残さないようにした","notes":"誤答の否定根拠はいずれもシナリオの1文。公式解説の語彙（テストチャーター、固定の時間枠、data-driven estimation）はシラバス 2.2 節に無いため quote には使っていない","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"同上。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-syllabus-2026-09-13-t3.md","sig":"1e5d0b226565","explSig":"1ee4b01a9702","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"T1・T2 とも該当なし。正答の3要素はいずれもシナリオの資源で実行でき、かつシナリオが先回りして満たしてもいない","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-qa-2026-09-12-r2.md","sig":"1e5d0b226565","explSig":"1ee4b01a9702","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"誤答3個は T1・T2 のどちらにも当たらない。申し送りの双子は逐語では立たない（実測）","ref":"jstqb-al-tm/kb/reviews/TM-2.2.3-item-2026-09-12-r2.md","sig":"1e5d0b226565","explSig":"1ee4b01a9702","fieldSig":{"選択肢3":"416e2448faf6","scenario":"94323f4ac66d"}}]},"variantAxis":"技法4つを、シナリオの4つの事実（要件の一覧が確定・1件あたりの実績時間あり・意見を出せる技術者なし・総工数未確定かつ一度で提出）に照合し、入力が揃う手を1つ選ぶ（公式問33型・4択ONE）。開発モデルからではなく可用性から決める経路を測る"},{"id":"q-2.3.1-A-1","lo":"TM-2.3.1","cluster":"2.3.1-A","clusterName":"欠陥ワークフローの実装","variantAxis":"書き出された欠陥報告規程と唯一の例外を、個々の状況に当てはめて、欠陥レポートで追跡するかどうかを判定する","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"業務用複合機の組込みソフトウェアを開発している。コンポーネントの実装はテスト駆動開発で進めており、開発者は実装より先に自動コンポーネントテストを書く。\n\n社内の欠陥報告規程は次の3つである。\n(1) (3)に当たる場合を除き、実際の結果が期待する結果と違うことを確認したら、原因の切り分けが済んでいなくても欠陥レポートを作成する。テスト環境やテストケースの側に原因があると後で分かったときは、理由を選んで却下へ移す。\n(2) すでに登録されている欠陥と同じ現象は、新しいレポートを作らずそのレポートを更新する。確認テストで同じ現象が再現したときは、そのレポートを再オープンする。\n(3) 例外はこれだけである。テスト駆動開発として書いた自動コンポーネントテストが、対応する機能の実装が終わる前に不合格になるものは、レポートを作成せず開発タスクの中で扱う。","question":"この規程を適用したとき、欠陥レポートによって追跡しないのはどれか。1つ選べ。","choices":["結合テストで用紙サイズの判定が誤った。調べるとテスト環境の給紙センサーの設定が本番機と違っており、製品側の問題ではない可能性が高い。","給紙元を選ぶ処理は、開発者がテストを先に書いて実装を進めている途中である。判定はまだ書かれておらず、この自動コンポーネントテストは不合格のままである。","解決へ移された用紙詰まりの誤検知について、テスト担当者が確認テストを実施したところ、同じ誤検知が再現した。","トナー残量の換算処理は先週実装を終えて結合済みである。今朝の自動コンポーネントテストの一括実行で、この換算処理のテストが1本不合格になり、以後の実行でも不合格が続いている。"],"answer":[1],"explanation":{"signals":"効くのは3つである。①規程(3)が「例外はこれだけである」と述べており、レポートを作らない道はここにしかないこと。②その例外は、テスト駆動開発として書いた自動コンポーネントテストであることと、対応する機能の実装が終わる前の不合格であることを、両方そろって要求していること。③規程(1)が、原因の切り分けが済んでいなくても作成するとしたうえで、テスト環境やテストケースの側に原因があった場合の行き先を却下と定めており、規程(2)が、確認テストでの再現を再オープンと定めていること。つまり(1)と(2)の道はいずれもレポートの上を通る。不合格が繰り返し出ているか一度きりかは、規程のどの条にも現れない。","why":"シラバスは、テストが不合格だとしても欠陥レポートが作成されるとは限らないとしたうえで、その例としてテスト駆動開発を挙げ、自動化されたコンポーネントテストが実行可能な設計仕様書の一形態として使用される場合、コンポーネントの開発が完了するまではテストの一部または全部を最初は不合格にしなければならず、このようなテスト結果は必ずしも欠陥が原因とは限らないため通常は欠陥レポートによって追跡されることはない、と述べている。規程(3)はこの記述をそのまま社内の規則にしたものであり、テスト駆動開発として書いた自動コンポーネントテストであること、対応する機能の実装が終わる前の不合格であること、の2つを条件にしている。給紙元を選ぶ処理は、開発者がテストを先に書いて実装を進めている途中であり、給紙元の判定はまだ書かれていない。すなわちテストは実装に先立つ仕様の形で置かれており、不合格であることは実装が済んでいないことの表れである。2つの条件がそろっているので、規程(3)により欠陥レポートは作成せず、開発タスクの中で扱う。これが規程の中で唯一、レポートによる追跡を行わない場合である。","distractors":["原因が製品ではなくテスト環境の設定にあると見えている以上、製品の欠陥として記録するのは筋違いであり、環境を直せば済む、という読み方は現場では珍しくない。しかし規程(1)は、原因の切り分けが済んでいなくても欠陥レポートを作成すると定めており、テスト環境やテストケースの側に原因があると後で分かったときの行き先まで、理由を選んで却下へ移す、と書いている。切り分けの結果が環境であることは、レポートを作らない理由ではなく、作ったレポートに付ける却下の理由である。規程(3)の例外は自動コンポーネントテストについてのものなので、結合テストで観測されたこの不一致には掛からない",null,"欠陥レポートは1つの故障につき1つ作るものであり、そのレポートはすでに存在するのだから、確認テストの結果はテスト実行の記録に書けばよい、と考えると選ぶ。たしかに新しいレポートは作らないが、設問が問うているのは欠陥レポートによって追跡するかどうかである。規程(2)は、確認テストで同じ現象が再現したときはそのレポートを再オープンすると定めており、この再現は既存のレポートの状態を動かす形で扱われる。つまり追跡はレポートの上で続く。新規に作らないことと、レポートの外で扱うことは別である","自動コンポーネントテストの不合格は開発チームの中で片づく話で、欠陥レポートは結合以降のテストが使うものだ、と覚えていると選ぶ。規程(3)の例外は自動コンポーネントテストであることだけでは成立せず、対応する機能の実装が終わる前の不合格であることをあわせて要求している。この換算処理は先週実装を終えて結合済みであり、実装が終わった後の不合格である。不合格が続いていることも、例外の条件とは関係しない。したがって例外には当たらず、規程(1)により欠陥レポートを作成する。実装を終えたコンポーネントのテストが不合格になったことは、設計仕様としてのテストが実装に先行している状態ではなく、通常の不一致である"],"flip":["規程(3)の例外が、テスト駆動開発の自動コンポーネントテストではなく、「調べた結果、製品側の問題ではない可能性が高いと判断したものは、欠陥レポートを作成せず環境課題の一覧で扱う」と定められていれば、規程(1)はこの場合を除いて適用されるため、欠陥レポートによって追跡しないのはこの状況になる",null,null,null],"quote":"テストが不合格だとしても、欠陥レポートが作成されるとは限らない。（例えば、テスト駆動開発では、通常自動化されたコンポーネントテストが、実行可能な設計仕様書の一形態として使用される）。コンポーネントの開発が完了するまでは、テストの一部または全部を、最初は不合格にしなければならない。したがって、このようなテスト結果は、必ずしも欠陥が原因とは限らず、通常、欠陥レポートによって追跡されることはない。","ref":"2.3.1","misconception":"「欠陥レポートを作らない」場合を、却下されそうなもの・自動テストの失敗・すでにレポートがあるものまで広げてしまい、原文が例外としているのがテスト駆動開発の自動コンポーネントテストで実装が終わる前の不合格に限られることを見ていない","flipNote":{"3":"この再現を欠陥レポートの外に出すには、確認テストでの再現を再オープンとしている規程(2)の後段を、実行の結果報告の中で扱う形に変える必要がある。しかしそれだけでは、規程(3)の例外に当たるテスト駆動開発の不合格も追跡の外に残るため、追跡しないものが2つになり、1つ選べが成り立たない。規程(3)の例外そのものをこの場合に置き換えれば1つに絞れるが、今度は再オープンを定める規程(2)と食い違う","4":"この肢は、規程(3)の例外が要求する2つの条件のうち、テスト駆動開発として書いた自動コンポーネントテストであることは満たし、対応する機能の実装が終わる前の不合格であることだけを満たしていない。実装が終わる前という条件を外して例外を実装後の不合格まで広げると、実装前の不合格も例外のままなので、追跡しないものが2つになる。例外を実装後の不合格だけに限れば1つに絞れるが、それは規程(3)が写している原文——コンポーネントの開発が完了するまではテストの一部または全部を最初は不合格にしなければならず、そのような結果は必ずしも欠陥が原因とは限らない——を裏返すことになる"}},"meta":{"concept":"欠陥マネジメントの実装","relatedConcepts":["欠陥レポートの作成判断","不正の調査","却下ステータス","確認テストと再オープン","テスト駆動開発の例外"],"distractorIntent":["原因が製品ではなく環境にあると切り分けたことを、レポートを作らない理由として扱う（規程が定める行き先は却下であって不作成ではない）","テスト駆動開発の例外を、自動コンポーネントテスト一般と実装完了後の不合格にまで広げる","新規のレポートを作らないことと、欠陥レポートの外で追跡することを同一視する"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","confidence":"高","basis":"シラバス2.3.1（テストが不合格だとしても欠陥レポートが作成されるとは限らない／テスト駆動開発の自動コンポーネントテストは実行可能な設計仕様書の一形態で、開発が完了するまでは不合格にしなければならず通常は欠陥レポートによって追跡されない／却下は処理した人が却下し、無効な情報や誤ったテストなどの理由をレポートへ追加する／解決は確認テストを行う状態）。公式 TM-2.3.1 の面①（規程を事例に当てはめる否定形。SET B 問34・SET A 問34 が2セットとも同じ配置）に合わせ、規程と唯一の例外を本文に書き出してから4つの状況に当てはめさせた。誤答は先に書き、それぞれを殺す文を規程に置いた——環境起因は規程(1)の「原因の切り分けが済んでいなくても作成する／環境やテストケース側の原因は理由を選んで却下へ移す」で、実装完了後の自動コンポーネントテストは規程(3)の「対応する機能の実装が終わる前」で、確認テストの再現は規程(2)の「そのレポートを再オープンする」で落ちる。型はこの目標の公式実測（D12 50%／D11 50%）のうち、面①側の唯一の型である D12 を3つ","mistakePatterns":["MP-72","MP-73","MP-74"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2）は規程(3)の2条件で一意。本文不変につき前回判定を維持。flip[0] は「条件の変更」として認めるが、置換文の発動条件が肢の書きぶりと噛み合っていない（中1件）","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-syllabus-2026-09-13-t3.md","sig":"c181178b9756","explSig":"2c26de61a881","fieldSig":{"explanation.flip[0]":"d41b8d94755e","選択肢1":"4a22cbe67a3b","scenario":"b9d12d329c9a"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"規程と唯一の例外が本文にそろい、正答の2条件は選択肢側にも明示されている。T1・T2 いずれにも当たらない。規程(1)の適用範囲が広すぎる点は中。","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-qa-2026-09-12.md","sig":"c181178b9756","explSig":"2c26de61a881","fieldSig":{"scenario":"b9d12d329c9a","選択肢4":"4b8748676dae"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つとも接地あり・選ぶ理由を書ける。伏せ確度95（自己開示経路）は報告","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-item-2026-09-12.md","sig":"c181178b9756","explSig":"2c26de61a881","fieldSig":{"選択肢2":"9233805d09eb","選択肢4":"4b8748676dae","選択肢1":"4a22cbe67a3b","scenario":"b9d12d329c9a"}}]}},{"id":"q-2.3.1-A-2","lo":"TM-2.3.1","cluster":"2.3.1-A","clusterName":"欠陥ワークフローの実装","variantAxis":"追加する状態の定義と、許可形で列挙された遷移規則を、遷移の設計案に照合して規則違反の有無を見る","variant":2,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"全社共通の欠陥ワークフローを見直している。いまの状態はオープン、進行中、却下、解決、クローズの5つで、欠陥はオープンから始まり、進行中で分析と修正を行い、済むと解決へ移して確認テストを行う。\n\nここに2つ足す。明確化は、報告の内容だけでは分析を始められず、報告者に追加の情報を求めている状態。受け入れは、分析の結果として直すと決まったが、まだ修正に着手していない状態である。\n\n追加にあたっての規則は次の4つである。\n(1) 明確化へ移してよいのは、オープンまたは進行中の欠陥である。報告者から回答が得られた欠陥は進行中へ移す。\n(2) 受け入れへ移してよいのは、進行中で分析を終えた欠陥である。受け入れの欠陥は、修正に着手するときに進行中へ移す。\n(3) 終端ステータスはクローズだけとする。\n(4) ここに挙げた遷移だけを認め、他は追加しない。","question":"2つの状態を足す遷移の設計として、4つの規則をすべて満たすのはどれか。1つ選べ。","choices":["オープン→明確化、進行中→明確化、明確化→進行中、進行中→受け入れ、受け入れ→進行中。情報が足りない報告は明確化へ送り、分析を終えて直すと決まった欠陥は受け入れで待たせる。","進行中→明確化、明確化→進行中、明確化→却下、進行中→受け入れ、受け入れ→解決。回答が返ってこない報告は明確化から却下へ落とし、直し終えた欠陥は受け入れから解決へ送る。","オープン→明確化、明確化→進行中、進行中→受け入れ、受け入れ→クローズ、クローズ→明確化。分析の結果として直さないと決めた欠陥は受け入れからクローズし、異議が出たものはクローズから明確化へ戻す。","却下→明確化、明確化→進行中、オープン→受け入れ、進行中→受け入れ、受け入れ→進行中。却下に異議のある報告は明確化へ送り、報告の時点で直すと決まった欠陥はオープンから受け入れへ送る。"],"answer":[0],"explanation":{"signals":"効くのは4つである。①規則(1)が明確化の入口をオープンと進行中に限り、出口を進行中と定めていること。②規則(2)が受け入れの入口を進行中で分析を終えた欠陥に限り、出口を進行中と定めていること。③規則(3)が終端をクローズだけとしており、クローズから出ていく遷移を引けば、クローズは終端ではなくなること。④規則(4)が、認める遷移を(1)から(3)が挙げたものに閉じていること。したがって、禁止の文が無いことは追加してよい理由にならない。2つの状態の定義文も同じ働きをする。明確化は報告者に追加の情報を求めている状態、受け入れは分析の結果として直すと決まった状態であり、どちらも入口の条件を言い直している。","why":"シラバスは、単純な欠陥ワークフローが、与えられたコンテキストに関連する他の欠陥状態（例えば、再オープン、受け入れ、明確化、見送り）を使用することによって拡張されると述べているが、その状態の遷移のルールまでは定めていない。定めるのは組織であり、シラバスは、欠陥ワークフローがステータスの名称、ステータス間の遷移のルール、ステータスのタスクに責任を持つ役割という点で組織によって異なるとしている。したがってここで照合の相手になるのは、本文に書かれた4つの規則と2つの定義だけである。この設計を1本ずつ当てる。オープン→明確化と進行中→明確化は、規則(1)が挙げた2つの入口そのものである。明確化→進行中は、規則(1)の後段が定める復帰先である。進行中→受け入れは、規則(2)が挙げた入口である。受け入れ→進行中は、規則(2)の後段が定める復帰先である。5本すべてが規則の認める遷移であり、規則(4)に反する追加も無い。またクローズから出ていく遷移を持たないので、規則(3)の終端がクローズだけであることも保たれる。シラバスも、1つの終端ステータスのみを使用することを推奨し、終端ステータスを除く各欠陥ステータスには1つ以上の遷移先を持つべきであるとしており、明確化にも受け入れにも遷移先がある。","distractors":[null,"回答が返ってこない報告をいつまでも明確化に置くわけにいかず、無効な情報として却下するのは実務では自然であり、直し終えた欠陥を解決へ送るのも修正の流れに沿って見える。しかし規則(1)が明確化について定める行き先は、報告者から回答が得られた欠陥を進行中へ移す、の1つだけであり、明確化から却下への遷移は挙げられていない。規則(4)は認める遷移をこれらに閉じているので、禁止の文が無いことは引いてよい理由にならない。受け入れ→解決も、規則(2)が定める復帰先が進行中であることに反する。受け入れは、修正に着手していない状態として定義されており、そこから修正済みを表す解決へ直接進むことはできない。違反は2つである","修正しないという結論も終結の一種であり、クローズへ直行させたくなる。異議が出たものを戻す道を用意するのも、閉じたまま放置しない工夫として説得力がある。しかし規則(2)は、受け入れの欠陥は修正に着手するときに進行中へ移すと定めており、受け入れからクローズへの遷移は挙げられていない。さらにクローズ→明確化は、規則(3)が終端ステータスをクローズだけとしていることに反する。ある状態から出ていく遷移を引けば、その状態はそこで終わらない状態になり、終端ではなくなる。違反は2つである","却下に納得しない報告者から追加の情報が出てくることはあり、明確化へ送って議論を続けたくなる。報告の時点で直すと決まっている欠陥を、分析の手間をかけずに受け入れへ送るのも、待ち時間を減らす工夫に見える。しかし規則(1)が明確化の入口として挙げるのはオープンと進行中の2つであり、却下は入っていない。規則(2)が受け入れの入口として挙げるのは進行中で分析を終えた欠陥であり、オープンから直接移すことはできない。受け入れの定義も、分析の結果として直すと決まった状態、と分析を経ることを述べている。違反は2つである"],"flip":[null,null,null,null],"quote":"単純な欠陥ワークフローは、多くの組織で使用され、与えられたコンテキストに関連する他の欠陥状態（例えば、再オープン、受け入れ、明確化、見送り）を使用することによって拡張される。…欠陥ワークフローは、欠陥ステータスの名称、欠陥ステータス間の遷移のルール、特定の欠陥ステータスのタスクに責任を持つ役割という点で、組織によって異なる場合がある。…1 つの終端ステータス（例えば、クローズ）のみを使用することを推奨する。…終端ステータスを除く各欠陥ステータスには、次のステップに関して責任を持つ役割が判断できるように、1 つ以上の遷移先を持つべきである。","ref":"2.3.1","misconception":"列挙された遷移規則を開いた集合として読み、禁止の文が無い遷移は引いてよいと考える。また状態の定義文を説明とみなして照合に使わず、終端に指定した状態から出ていく遷移を引いてしまう","flipNote":{"2":"この設計には、規則が挙げていない遷移が2本ある（明確化→却下と、受け入れ→解決）。片方を認める形に規則を変えても、もう片方が規則(4)に掛かって誤答のままである。両方を認めるには規則(1)の後段と規則(2)の後段を同時に書き換えることになり、条件を1つ動かした結果ではない","3":"この設計は、受け入れ→クローズが規則(2)の定める行き先と違う点と、クローズ→明確化が終端をクローズだけとする規則(3)に反する点の、2つで外れている。片方だけを認めても、もう片方が残る。両方を認める形に規則(2)と規則(3)を書き換えると、今度は正解の設計も4つの規則を満たしたままなので、すべてを満たすものが2つになる","4":"この設計は、却下→明確化が規則(1)の挙げる明確化の入口（オープンと進行中）に無い点と、オープン→受け入れが規則(2)の挙げる受け入れの入口（進行中で分析を終えた欠陥）に無い点の、2つで外れている。片方だけを広げても、もう片方が残る。両方を広げる形に規則(1)と規則(2)を書き換えると、正解の設計もそのまま4つの規則を満たすため、すべてを満たすものが2つになる"}},"meta":{"concept":"欠陥マネジメントの実装","relatedConcepts":["拡張した欠陥状態","遷移のルール","終端ステータス","閉じた規則集合","状態の定義"],"distractorIntent":["規則が挙げていない出口（明確化から却下）を、禁止されていないから引いてよいと読み、あわせて受け入れの復帰先を解決に取り違える","修正しないという結論を終端へ直行させ、さらに終端に指定した状態から戻る道を引いて、終端をクローズだけとする規則を崩す","明確化と受け入れの入口を、規則が挙げた状態の外（却下・オープン）へ広げ、受け入れが分析を経た後の状態であるという定義を飛ばす"],"distractorTypes":["D11","D11","D11"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","confidence":"高","basis":"シラバス2.3.1（拡張状態として再オープン・受け入れ・明確化・見送りを挙げるのみで遷移規則は書かれていない／欠陥ワークフローは名称・遷移のルール・役割の点で組織によって異なる／終端ステータスは1つを推奨／終端を除く各ステータスは1つ以上の遷移先を持つべき）。原文に拡張状態の遷移規則が無いため、公式 TM-2.3.1 の面②（SET B 問35・SET A 問35）と同じく規則を本文に書き出して照合させた。公式が使った再オープンと見送りは避け、原文が名前を挙げるもう2つの状態（明確化・受け入れ）を材料にして、面は同じまま入力を変えた。誤答は先に書き、規則(1)(2)(3)のいずれかに実際に当たる違反を各2つ持たせている。規則(4)は、規則に挙げられていない遷移を「禁止されていないから可」と読む経路を殺すために置いた制約文である。既存状態は原文どおり5つ（オープン・進行中・却下・解決・クローズ）とした。型はこの目標の公式実測（D12 50%／D11 50%）のうち、面②側の唯一の型である D11 を3つ","mistakePatterns":["MP-75","MP-77","MP-78"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は規則(1)(2)が挙げた5遷移そのもので一意。flipNote 3本はいずれも原文・規則と照合して成立。新規の指摘なし","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-syllabus-2026-09-13-t3.md","sig":"07f493de3f70","explSig":"5e080563b631","fieldSig":{"explanation.flipNote[\"2\"]":"b580e4f095bf"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"正答の5本はすべて規則(1)(2)が挙げたもので、実行可能性・判別性ともに成立。T1・T2 いずれにも当たらない。閉世界文の射程と難度は中。","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-qa-2026-09-12.md","sig":"07f493de3f70","explSig":"5e080563b631","fieldSig":{"scenario":"4ebead9eb1b2","選択肢1":"2b0c4825844b"}},{"lens":"item","date":"2026-09-13","round":1,"result":"pass","note":"上流訂正（公式は2/3/3）を原典で確認。旧「中3 違反数の階段が無い」は前提ごと取り下げ。門の判定は変えていない","ref":"jstqb-al-tm/kb/reviews/TM-2.3.1-item-2026-09-13-amend.md","sig":"07f493de3f70","explSig":"5e080563b631","fieldSig":{"explanation.distractors[2]":"fce69f253e38","meta.basis":"dd84e2ddc407","選択肢2":"8c538d9d8d7d","scenario":"4ebead9eb1b2"}}]}},{"id":"q-2.3.5-A-1","lo":"TM-2.3.5","cluster":"2.3.5-A","clusterName":"欠陥レポートで何を集めるか","variantAxis":"必須として列挙された項目と、コンテキストによって集める情報との境界を、欄の候補に当てはめて判定する","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"スーパーマーケット向けのセルフレジソフトを作っている会社で、欠陥管理ツールを入れ替えることになった。旧ツールでは起票時の必須欄が14個あり、テスト担当者からは、埋め終わるまでに時間がかかる、何を書く欄なのか分からずとりあえずの値を選んでいる、という声が続いていた。\n\n新しいツールでは必須欄を絞り直すことにし、残っている4つの欄について、必須のままにするか任意にするかを決める。ここでいう必須欄とは、欠陥レポートとして必ず値を持たせる欄のことで、起票した人が埋めるか、後から担当者が埋めるかは問わない。なお、タイトルと不具合の概要を書く欄は起票の入り口にあたるため、今回の見直しの対象から外してある。","question":"欠陥レポートをマネジメントするほとんどの環境で「必須」とされる情報に、含まれないものはどれか。1つ選べ。","choices":["どのレジ端末で、本体とレシートプリンタのどの版を組み合わせたときに見つけたのかを選ばせる欄","どの操作をどの順に行ったときに起きたのかと、そのとき画面や機器が実際にどうなったのかを書かせる欄","その不具合を抱えたまま使われた場合に、店舗の運営と買い物客にどれだけの支障が出るのかを5段階から選ばせる欄","他に抱えている作業と見比べて、どれだけ先に手を着けるべきかを4段階から選ばせる欄"],"answer":[0],"explanation":{"signals":"効くのは3点である。①見直しの対象が「欠陥レポートとして必ず値を持たせる欄」であり、起票した人が埋めるか後から担当者が埋めるかは問わないと書かれていること。②タイトルと不具合の概要の欄が対象から外してあること——原文が必須として挙げる4つのうち1つを先に抜いてあるので、残る候補は3つの必須項目と、それ以外の1つになる。③4つの欄が、原文の「必須である」の箇条書きに載っている側と、「欠陥解決に役立てる」ための情報として挙げられている側に分かれていること。必須欄を14個から絞るきっかけ（作成に時間がかかる、入力する人が混乱する）は、絞れという原文の求めと同じ向きだが、4つのうちどれが必須にあたるかの判定そのものには効かない。","why":"シラバスは「欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である」として、タイトルと概要、再現手順を含む詳細な説明、ステークホルダーへの影響の重要度、修正の優先度の4つだけを挙げている。一方、どの端末でどの版の組み合わせのときに見つけたのかは、原文では「欠陥解決に役立てる」ための情報——欠陥が観察されたテスト環境、不正が観察されたテストアイテムとそのリリース番号——の側に置かれており、コンテキストによって集めるものである。したがって、必須に含まれないのはこの欄だけになる。ここで「必須でない」は「集めなくてよい」ではない。原文は、属性を増やすたびに作成の時間が延び、入力する担当者の混乱を招くとしたうえで、必要なデータのみを集めることを求めており、判断の基準は「その欄がこのコンテキストの欠陥マネジメントに必要か、プロセス改善に使われるか」である。端末と版の組み合わせは、直す人には要る情報であり、この会社が必須のままにすると決めることもできる。問われているのは、原文がどこに置いているかである。","distractors":[null,"原文は必須の箇条書きに「故障を再現する手順を含む不正の詳細な説明」を置いている。どの操作をどの順に行ったときに何が起きたのかは、この必須項目そのものである。再現手順は再現できたときだけ書けばよい任意項目だと考えている人や、14個を減らす話につられて、書く量の多い欄から落とせば入力が速くなると考えた人が選ぶ。減らす対象は、必須の4項目ではなく、コンテキストによって集める側の項目である。","原文は「テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度」を必須として挙げている。その不具合を抱えたまま使われたときに店舗の運営と買い物客にどれだけの支障が出るかは、この影響の大きさにあたる。重要度と優先度は結局同じことなので片方あれば足りる、と考えている人が選ぶ。原文は両者を別の箇条書きに分けており、影響の大きさと、他の作業に対する修正の急ぎ度は、別に記録するものである。","原文は「不正を修正する優先度」を必須として挙げている。他に抱えている作業と見比べて、どれだけ先に手を着けるべきかは、この優先度そのものである。優先度は起票した人ではなくトリアージの場が決めるものだから、レポートの欄として必須にはしない、と考えている人が選ぶ。ただしシナリオは、必須欄を欠陥レポートとして必ず値を持たせる欄と定め、起票した人が埋めるか後から担当者が埋めるかは問わないと書いている。決める人が誰かは、この判定に効かない。"],"flip":[null,null,null,null],"flipNote":{"2":"再現手順を含む詳細な説明は原文が必須の箇条書きに置いており、シナリオのどの条件を動かしても任意の側には移らない。この欄が答えになるには、原文が再現手順を必須から外し、そのうえでテスト環境や版の組み合わせを必須の側に入れる必要があり、シナリオの条件の変更では届かない","3":"ステークホルダーへの影響の重要度も原文が必須の箇条書きに置いており、シナリオのどの条件を動かしても任意の側には移らない。重要度を必須から外すだけでは、どの端末でどの版の組み合わせのときに見つけたのかを選ばせる欄が依然として必須の外に残るため、必須に含まれないものが2つになり、1つ選べが成り立たない。この欄が答えになるには、原文の必須の一覧から重要度を外し、そのうえでテスト環境と版の組み合わせを必須の側に入れる、外す側と入れる側の2つの変更が要り、どちらもシナリオの条件の変更では届かない","4":"不正を修正する優先度も原文が必須の箇条書きに置いている。誰が値を決めるか、いつ埋まるかをシナリオで動かしても、必須かどうかは変わらない。優先度を必須から外すだけでは、どの端末でどの版の組み合わせのときに見つけたのかを選ばせる欄が必須の外に残ったままなので、必須に含まれないものが2つになり、1つ選べが成り立たない。この欄が答えになるには、原文の必須の一覧から優先度を外し、あわせてテスト環境と版の組み合わせを必須の側に入れる2つの変更が要り、どちらもシナリオの条件の変更では届かない"},"quote":"欠陥レポートをマネジメントするほとんどの環境では、以下のことが必須である：／欠陥のタイトルと不正の簡単な概要／故障を再現する手順を含む不正の詳細な説明／テスト対象システムおよび/またはプロダクトのステークホルダーへの影響の重要度／不正を修正する優先度…欠陥解決に役立てる：欠陥が存在するサブシステムまたはコンポーネント、不正が観察された特定のテストアイテムおよびそのリリース番号、または欠陥が観察されたテスト環境。","ref":"2.3.5","misconception":"実務で必ず書かせている情報を、原文が必須として挙げる4項目と同じ層にあるものとして数えてしまう"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","relatedConcepts":["欠陥レポート情報","必須のデータ項目","欠陥解決に役立てる情報","重要度と優先度"],"distractorIntent":["選択肢2: 再現手順を含む詳細な説明を、書く量が多いので任意に落とせる欄だと読む（必須の4項目のうち1つを任意側に数える）","選択肢3: ステークホルダーへの影響の大きさを、優先度と同じものとみなし、片方あれば足りると読む","選択肢4: 修正の優先度を、決めるのがトリアージの場だからレポートの必須欄ではないと読む"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-82","MP-88"],"confidence":"高","basis":"シラバス2.3.5の3層構造（必須4項目／ツールが作ることが多い8項目／目的別グループ4群）。否定形・4択ONEで誤答をすべてD12（必須の箇条書きの正メンバー）にする作りは、この目標の公式2問（SET B 問39・SET A 問39）と同じで、公式はいずれも「欠陥解決に役立てる」側の項目を正答に置いている。公式が使った衛生注記（重要度は既に必須）とは別の項目（タイトルと概要）を対象外にして、残る必須3項目を誤答に充てた。業種と欄の書き方は公式と重ならないようにし、選択肢には用語名（重要度・優先度・テスト環境）を出さず、振る舞いだけを書いた。誤答を先に置き、優先度の誤答に対しては『誰が埋めるかは問わない』の1文をシナリオに足して、決める人が誰かという実務上の反論で正誤が動かないようにした","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は「必須の4項目」と「欠陥解決に役立てる」の区画の違いで一意。flipNote[\"3\"] に、訂正済みの A-1 note と**同じ型の嘘**が残っている（中1件）","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-syllabus-2026-09-13-t3.md","sig":"86585d7a4e4e","explSig":"4aff77464728","fieldSig":{"explanation.flipNote[\"3\"]":"d2f66dfa3e08","explanation.flipNote[\"2\"]":"3e213a8e8514","syllabus":"79c0ba4a0756"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"「誰がいつ埋めるかは問わない」の回避は T1/T2 のどちらにも当たらない。ただし枠づけの語が実装できる形になっておらず、見直しの動機（起票時の入力負荷）と噛み合っていない","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-qa-2026-09-12.md","sig":"86585d7a4e4e","explSig":"4aff77464728","fieldSig":{"scenario":"a7d8e3d3a6c5"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3個はすべて必須4項目の正メンバーで T1/T2 に当たらない。ただし重要度／優先度が双子になり、知識なしの消去経路が残る","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-item-2026-09-12.md","sig":"86585d7a4e4e","explSig":"4aff77464728","fieldSig":{"選択肢3":"300d1c43de55","選択肢4":"6ea4152acd39","scenario":"a7d8e3d3a6c5"}}]},"noShuffle":true},{"id":"q-2.3.5-A-2","lo":"TM-2.3.5","cluster":"2.3.5-A","clusterName":"欠陥レポートで何を集めるか","variantAxis":"目的を1つ指定し、既に集計できる形で取れている情報を差し引いて、その目的に対応するグループから足す項目を構成する","variant":2,"chapter":2,"section":"2.3","k":3,"points":2,"type":"multi","minutes":3,"scenario":"テレビ会議サービスを自社で開発している会社で、四半期ごとに、開発とテストのやり方のどこが弱いのかを数字で見たい、という要望が出た。その土台として、欠陥レポートで集める項目を決め直す。どの手を打つかは、数字がそろってから別に決める。\n\n今のツールは、不具合が見つかったテストレベルと日時を起票時に自動で記録し、そのまま四半期の集計に使える。修正がどの版で取り込まれ、どの工程で確認が取れたのかも、リリース管理の仕組みと連携して自動で埋まり、月次で集計されている。\n\n修正を担当した開発者は、直す前に、何がどこで間違っていたのかを必ず調べている。その結果は自由記述のコメントに書かれるだけで、書き方は人それぞれのため、数えられる形にはなっていない。入力の手間が増えるので、新たに設ける欄は2つまでとする。","question":"開発とテストのやり方の弱いところを四半期ごとに数字で見るために、欠陥レポートで新たに集める項目として適切なものはどれか。2つ選べ。","choices":["不具合がどのテストレベルの、いつの実行で見つかったのかを記録する欄を新たに設ける","要件、設計、実装のどの段階で作り込まれたのかを、あらかじめ決めた区分から選ばせる欄を設ける","その不具合によって損なわれたのは性能か、使いやすさか、互換性かを、区分から選ばせる欄を設ける","不具合を生んだ原因を、担当者間の伝達漏れ、古い版の資料の参照、決められた確認の省略といった型で記録させる","修正がどの版で取り込まれ、どの工程で確認が取れたのかを、欠陥レポートの欄として記録させる"],"answer":[1,3],"explanation":{"signals":"効くのは4点である。①見たいのは「開発とテストのやり方のどこが弱いか」であって、できあがったプロダクトの品質の状態ではないこと。②不具合が見つかったテストレベルと日時は、起票時にツールが自動で記録し、そのまま四半期の集計に使えること。③修正が取り込まれた版と確認が取れた工程も、リリース管理の仕組みと連携して自動で埋まり、月次で集計されていること。④開発者が直す前に調べている「何がどこで間違っていたのか」は、自由記述のコメントにしか残らず、数えられる形になっていないこと。②と③は、正しい情報でも足す値打ちが無いことを示す制約であり、④は、足せば数えられるようになるものを1か所に示している。","why":"シラバスは、欠陥レポートで集める情報を「意図する目的にしたがって情報をグループ化したもの」として並べ、プロセス能力をアセスメントするための情報として「欠陥または欠陥の根本原因に対する混入、検出、除去の SDLC フェーズ」を挙げている。今回見たいのは、作っているもの自体の品質ではなく、開発とテストのやり方の弱さであるから、効くのはこのグループである。ただしグループに載っているだけでは足す理由にならない。検出のフェーズにあたるテストレベルと日時は既に自動で記録され四半期の集計に使え、除去のフェーズにあたる取り込み版と確認の工程も自動で埋まって月次で集計されている。既に数えられる形で取れているものを欄として足しても、集まる情報は増えず、入力の手間だけが増える。5つの候補のうち残るのは、混入の段階（どこで作り込まれたか）と、根本原因の区分（なぜ作り込まれたか）である。この2つは交差表になる別の軸である。担当者間の伝達漏れも、古い版の資料の参照も、決められた確認の省略も、要件・設計・実装のどの段階でも起こりうるため、段階が分かっても原因は決まらず、原因が分かっても段階は決まらない。片方だけでは、弱いのが特定の段階のやり方なのか、どの段階にも共通する進め方なのかが分かれず、打ち手が決まらない。シナリオで開発者が直す前に必ず調べている「何がどこで間違っていたのか」は、「どこで」が混入の段階、「何が」が原因の型にあたり、2つの欄の値はどちらもこの調査から取れる。その結果が自由記述のコメントにしか残っていないので、欄にして区分を決めれば、四半期ごとに数えられるようになる。原文が、属性を増やすたびに作成の時間が延び入力する担当者の混乱を招くとして、必要なデータのみを集めることを求めている点からも、足すのはこの2つに絞られる。","distractors":["シナリオは、不具合が見つかったテストレベルと日時をツールが起票時に自動で記録し、そのまま四半期の集計に使えると書いている。検出のフェーズは原文がプロセス能力の側に挙げる情報であり、だからこそもっともらしく見えるが、既に数えられる形で取れているものを欄として足しても、集まる情報は増えない。混入・検出・除去の3つを揃えなければ意味がない、という筋だけで読むとこの肢に手が伸びる。",null,"損なわれた品質特性は、原文が「プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする」ための情報として挙げているものである。今回数字で見たいのは、できあがったものの品質ではなく、それをどう作っているかの弱さであり、対応するグループが違う。どの品質特性が壊れやすいかが分かればやり方の弱点も見える、と考えた人が選ぶ。この欄で分かるのは、弱いのがどの作り方かではなく、弱いのがどの品質かである。",null,"修正がどの版で取り込まれ、どの工程で確認が取れたのかは、シナリオではリリース管理の仕組みと連携して自動で埋まり、月次で集計されている。除去のフェーズも原文がプロセス能力の側に挙げているため選びたくなるが、既に集計できている以上、同じ内容を欠陥レポートの欄として持たせても数えられる情報は増えず、入力の手間と転記の食い違いが増えるだけである。"],"flip":[null,null,null,null,null],"flipNote":{"1":"この欄に足す値打ちが出るのは、不具合が見つかったテストレベルと日時がツールに自動で記録されず、四半期の集計に使える形で残っていない案件である。しかしその1点を動かしただけでは、混入の段階と根本原因の型と合わせて足すべき欄が3つになり、2つ選べという形式も、新たに設ける欄は2つまでという制約も成り立たない。3つを2つに戻すには、開発者が調べた結果が自由記述にしか残っていないというもう1つの条件も同時に動かす必要がある","3":"品質特性の欄が答えになるのは、四半期ごとに見たいものを、開発とテストのやり方の弱さから、できあがったプロダクトの品質の状態（どの品質特性がどれだけ損なわれているか）に変えたときだけである。それはシナリオの条件の変更ではなく設問の目的そのものの変更であり、しかもそのように変えると、プロダクト品質の側に属する肢はこの1つしか残らないため、2つ選べという形式が成り立たない","5":"この欄も同じで、足す値打ちが出るのは、修正の取り込み版と確認の取れた工程がリリース管理の仕組みから自動で埋まらず、月次の集計にも出てこない案件である。その1点だけを動かすと、混入の段階・根本原因の型と合わせて足すべき欄が3つになり、2つ選べが成り立たない"},"quote":"以下の箇条書きは、意図する目的にしたがって情報をグループ化したものである：…プロダクトインクリメントの状態をプロダクト品質の観点からアセスメントする：欠陥の種類（通常、欠陥分類法に対応する）、欠陥が混入した作業成果物、または欠陥によって影響を受けた品質特性/副特性。／プロセス能力をアセスメントする：開発プロセスの有効性と効率性をモニタリングするための情報（例えば、欠陥または欠陥の根本原因に対する混入、検出、除去の SDLC フェーズ）。","ref":"2.3.5","misconception":"プロダクトの品質を見るための分類と、プロセス能力を見るための分類を同じものとして扱い、また、原文のグループに載っているというだけで、既に取れている情報を足そうとする"},"meta":{"concept":"欠陥マネジメントの実装 — ワークフローで何を決め、欠陥レポートで何を集めるか","relatedConcepts":["目的別グループ","プロセス能力のアセスメント","混入・検出・除去のフェーズ","根本原因","収集項目の絞り込み"],"distractorIntent":["選択肢1: 検出のフェーズがプロセス能力の材料であることだけを見て、ツールが既に自動で記録し集計に使えるという制約を読み飛ばす","選択肢3: 損なわれた品質特性（プロダクト品質の側の分類）を、プロセス能力を見るための分類と取り違える","選択肢5: 除去のフェーズがプロセス能力の材料であることだけを見て、リリース管理の仕組みから自動で埋まり月次で集計されているという制約を読み飛ばす"],"distractorTypes":["D2a","D4","D2a"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-83","MP-84"],"confidence":"中","basis":"シラバス2.3.5の目的別グループ（G3 プロダクト品質／G4 プロセス能力）と、冒頭の4目的との1対1対応。公式 SET B 問40・SET A 問40 と同じ面（不足の補完・5択TWO・無効化文2つ）だが、入力の形を『受け手の訴え』から『4目的のうち1つの指定』に変えた（概念ノートが未使用の素材として挙げている形）。誤答を先に書き、無効化文を2つ（検出＝起票時に自動記録して四半期の集計に使える／除去＝リリース管理と連携して自動で埋まり月次で集計）シナリオに明記して2つの誤答を殺し、残る1つはグループの取り違えで落ちるようにした。正答の実行可能性は『修正を担当した開発者は直す前に何がどこで間違っていたのかを必ず調べている』の1文で担保し、同じ文が『ただし自由記述で数えられない』と述べることで、正答の柱をシナリオが先に満たしてしまうことを避けた。D4 としたのは、品質特性が誤りの情報ではなく、指定された目的に対する関連度で劣るためである","confidenceNote":"G3とG4の割り当ては原文が明示しているが、品質特性の肢を『関連度で劣る』と読むか『別グループなので誤り』と読むかには解釈が入るため中とした","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2・4）はプロセス能力の区画で一意。flipNote 3本は原文の区画・数え方と照合して成立。新規の指摘なし","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-syllabus-2026-09-13-t3.md","sig":"59462e8c5fdc","explSig":"7137b2cbf5e5","fieldSig":{"scenario":"524bb59f29a6"}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"正答2肢は別軸で交差しており、T1（成立不能）・T2（判別不能）とも当たらない。接地の言い方と欄の設計に中3件","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-qa-2026-09-12-r2.md","sig":"59462e8c5fdc","explSig":"7137b2cbf5e5","fieldSig":{"scenario":"524bb59f29a6","選択肢4":"30f7e8fd302a"}},{"lens":"item","date":"2026-09-12","round":2,"result":"pass","note":"門（T1/T2）に当たる誤答は無い。書き換えた選択肢4は選択肢2と直交しており、他肢との新しい双子も解説の置き去りも無い。中3件は手がかりと語の不整合","ref":"jstqb-al-tm/kb/reviews/TM-2.3.5-item-2026-09-12-r2.md","sig":"59462e8c5fdc","explSig":"7137b2cbf5e5","fieldSig":{"scenario":"524bb59f29a6","選択肢5":"e4820a496dfb","選択肢3":"26dd0731cb1f","question":"97425475d743","選択肢4":"30f7e8fd302a","選択肢1":"59c8a82f3bbe"}}]},"noShuffle":true},{"id":"q-3.1.1-A-1","lo":"TM-3.1.1","cluster":"3.1.1-A","clusterName":"4つの能力領域の帰属","variantAxis":"個人の能力と社会的能力の境界","variant":1,"chapter":3,"section":"3.1","k":2,"points":1,"type":"single","minutes":1,"question":"人のスキルを4つの能力領域に分けるとき、**個人の能力に含まれないもの**はどれか。1つ選べ。","choices":["自分の仕事の進め方を自分で管理し、決めたことを守れること","他者と協力し、相手や場面に合わせて自分の振る舞いを変えられること","批判を受け止められること、および変化を受け入れる姿勢を持てること","自信を持って行動できること、および人から信頼されること"],"answer":[1],"explanation":{"signals":"個人の能力と社会的能力は、**その能力がどこで働くか**で分かれる。個人の能力は自分自身の成長・態度・個性として本人の側に備わるもの、社会的能力は他者とのやり取りの中ではじめて働くものである。各選択肢は2つの能力を束ねて書いてあるので、**束の両方**がどちらに属するかを見る。「含まれない」と言えるのは、束の片方ではなく両方が個人の能力の外にあるときだけである。「変化を受け入れる姿勢」と「適応性」は言葉が近いが、シラバスは前者を個人の能力、後者を社会的能力の例に挙げている。「人から信頼される」も他者が出てくるが、原文の語は「信頼性」で、任された作業が約束どおり仕上がるという本人側の属性を指す。","why":"シラバスは個人の能力を「自分自身を成長させ、才能、モチベーション、実行意欲の他、具体的な態度や個人の個性を伸ばす能力と意欲」と定義し、例としてセルフマネジメント能力、個人的責任感、批判を受ける能力、信頼性、回復力、自信を持って行動する能力、規律正しさ、変化を受け入れる姿勢、助け合いや学ぶ意欲、任せる能力を挙げている。一方、社会的能力は「内部および異文化間のコンテキストにおけるコミュニケーション、協力、対立マネジメントに関するスキル」と定義され、例としてコミュニケーションスキル、対立解決スキル、チームワーク、適応性、自己主張が挙げられている。どちらも「例えば」で始まる例示であって、閉じた一覧ではない。他者と協力し、相手や場面に合わせて振る舞いを変えることは、協力と適応性にあたり、社会的能力である。なお、個人の能力の例には「任せる能力」も入っている。委任は語感がマネジメントに寄るため専門的能力（プロジェクトマネジメントスキル）に見えやすいが、シラバスの帰属は個人の能力であり、3.1.5 もテストチームを率いるための「社会的能力、個人の能力」の側に委任する能力を置いている。委任を持ち出しても領域は個人のまま動かない。領域を見分けることが要るのは、埋め方が領域ごとに違うためである。3.1.4 は、自己学習やトレーニングは専門的・方法論的な能力開発に適しているが、社会的能力・個人の能力にはトレーニングやコーチングを勧め、社会的交流・フィードバック・内省を重要な成功要因に挙げている。帰属を誤ると、対人の問題に技法研修を当てるような打ち手のずれが起きる。","distractors":["セルフマネジメント能力と規律正しさにあたり、いずれも個人の能力に含まれる",null,"批判を受ける能力と、変化を受け入れる姿勢にあたり、いずれも個人の能力に含まれる。「変化を受け入れる」は社会的能力の例にある「適応性」と語感が近いが、シラバスはこれを個人の能力に置いている","自信を持って行動する能力と信頼性にあたり、いずれも個人の能力に含まれる。「人から信頼される」は他者から見た言い方だが、シラバスの語「信頼性」は、任された作業を約束どおり仕上げるという本人側の属性であり、他者への働きかけではない"],"flip":[null,null,null,null],"flipNote":{"1":"この肢は「自分の仕事の進め方を自分で管理する」と「決めたことを守れる」の2つを束ねており、原文はそれぞれをセルフマネジメント能力と規律正しさとして個人の能力の例に挙げている。ただし、この束を他者との関わりの中で働くもの（作業分担の調整と合意の取り付けなど）へ移す条件を当てても、この肢が答えになることはない。設問は否定形であり、正答（選択肢2）は協力と適応性という社会的能力の例だけで立っていて、その正しさはこの肢の文面に左右されない。束の片方だけを替えれば残る片方が個人の能力の例にとどまり、両方を替えれば「個人の能力に含まれない」と言える肢が選択肢2とこの肢の2つになって、1つ選べが成り立たない。なお「自分で管理する」を「他のメンバーに任せる」に替えても領域は動かない。3.1.1 は「任せる能力」を個人の能力の例に挙げている。","3":"この肢も「批判を受け止められる」と「変化を受け入れる姿勢」の2つを束ねており、原文はどちらも、批判を受ける能力・変化を受け入れる姿勢として個人の能力の例に挙げている。前者を対立を収める側の話に、後者を相手や場面に合わせて出方を変える話に替えても、この肢が答えになることはない。設問は否定形であり、正答（選択肢2）は協力と適応性という社会的能力の例で立っていて、この肢の文面とは無関係に正しい。束の片方だけを替えれば残る片方が個人の能力の例にとどまり、両方を社会的能力へ移せば「個人の能力に含まれない」と言える肢が2つになって、1つ選べが成り立たない。「変化を受け入れる姿勢」は社会的能力の例である「適応性」と語感が近いが、原文の帰属は個人の能力である。","4":"この肢も「自信を持って行動できる」と「人から信頼される」の2つを束ねており、原文の語ではそれぞれ自信を持って行動する能力と信頼性で、どちらも個人の能力の例である。前者を場での自己主張に、後者を協働を引き出す働きかけに替えても、この肢が答えになることはない。設問は否定形で、正答（選択肢2）は協力と適応性という社会的能力の例で立っており、この肢をどう書き替えても正答のままだからである。束の片方だけを替えれば残る片方が個人の能力の例にとどまり、両方を社会的能力へ移せば「個人の能力に含まれない」と言える肢が2つになって、1つ選べが成り立たない。「信頼性」は任された作業が約束どおり仕上がるという本人側の属性なので、「人から」という言い方を残したままでは領域は動かない。"},"quote":"個人の能力：自分自身を成長させ、才能、モチベーション、実行意欲の他、具体的な態度や個人の個性を伸ばす能力と意欲を含む。例えば、セルフマネジメント能力、個人的責任感、批判を受ける能力、…回復力、自信を持って行動する能力、規律正しさ、変化を受け入れる姿勢、助け合いや学ぶ意欲、任せる能力などが挙げられる。","ref":"3.1.1","misconception":"4つの能力領域を語感で振り分けており、その能力が自分自身に向くのか他者との関わりで働くのかという分け方の基準を持っていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["4つの能力領域"],"distractorIntent":["個人の能力の正メンバー","個人の能力の正メンバー（適応性と紛らわしい）","個人の能力の正メンバー"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.1 の4つの能力領域の定義と例。否定形はK2/K3に置くという方針（公式の否定形7問はすべてK2/K3）に従い、D12（カテゴリーの正メンバーを誤答にする）で構成","mistakePatterns":["MP-14"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"flip 3本を null に落とした結論は正しい。ただし flipNote が述べる理由（束の両方を置き換えれば反転する）は原文と選択肢に照らして成り立たず、返済が要る","ref":"jstqb-al-tm/kb/reviews/TM-3.1.1-syllabus-2026-09-13-t3.md","sig":"eff8b5c138d4","explSig":"762f1b4d9979","fieldSig":{"question":"816535d2af96","選択肢2":"8a802b09d348","syllabus":"79c0ba4a0756","explanation.quote":"20240b214a34","explanation.distractors[4]":"b56074e5f429"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3個はいずれも T1（接地なし）にも T2（選ばれない誤答）にも当たらない。旧巡の重大（常識で解ける）は現行の門では reportOnly の面なので「中」に置いた","ref":"jstqb-al-tm/kb/reviews/TM-3.1.1-item-2026-09-12.md","sig":"eff8b5c138d4","explSig":"762f1b4d9979","fieldSig":{"syllabus":"79c0ba4a0756","explanation.distractors[1]":"46cb1b44b742","explanation.distractors[4]":"b56074e5f429","選択肢1":"9bfcad3d9b73","explanation.distractors[3]":"db9fa14ea2b3","選択肢2":"8a802b09d348","explanation.signals":"d136125686f5","選択肢4":"be18a7d701ab","meta.distractorTypes":"cafe7c875a3a","question":"816535d2af96","explanation.flip[1]":"01ba4719c80b"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"3件の flip はいずれも束の両方を外へ出す形に直っており、T1／T2 のどちらにも当たらない。残るのは flip 条件下で正答が一意でなくなる点など、門の外（gates.reportOnly）の面だけ","ref":"jstqb-al-tm/kb/reviews/TM-3.1.1-qa-2026-09-12.md","sig":"eff8b5c138d4","explSig":"762f1b4d9979","fieldSig":{"explanation.flip[1]":"01ba4719c80b","選択肢2":"8a802b09d348","explanation.flip[3]":"01ba4719c80b","explanation.signals":"d136125686f5","選択肢4":"be18a7d701ab"}}]},"noShuffle":true},{"id":"q-3.1.2-A-1","lo":"TM-3.1.2","cluster":"3.1.2-A","clusterName":"プロジェクトのコンテキストから必要な能力を判断する","variantAxis":"既に他者が担う領域を除外する（公式問43型・欠員の補充）","variant":1,"chapter":3,"section":"3.1","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは医療機器メーカーで、植込み型の心臓デバイスの遠隔モニタリングシステムのテストマネージャーを務めている。このシステムは医療機器プログラムとして薬事の対象であり、要件と検証の対応づけを記録として残し、当局の照査で提示できる状態に保つことが求められている。\n\nテストチームは5名で、うち1名が来月退職する。その1名が担っていたのは次の3つである。\n\n・要件仕様と個々のテストケースの対応づけを維持し、照査でいつでも提示できる状態に保つ\n・心拍データの異常判定について、臨床側の担当者と何をもって異常とするかを詰め、テストできる条件に落とす\n・実機とシミュレータのテスト環境を構築し、版ごとの差分を管理する\n\nなお今回の体制変更にあわせて、テスト環境の構築と版の管理はインフラ担当のチームへ移管することが決まっている。また、リリース可否の報告と関係部署との調整は、従来どおりあなたが行う。","question":"後任に求める能力として、優先して確認すべきものを2つ選べ。","choices":["要件と個々のテストの対応づけを維持し、第三者の照査に耐える形で示せること","テスト自動化の基盤を設計し、実機とシミュレータの環境を版ごとに構築できること","臨床の担当者と何をもって異常とするかを詰め、あいまいな取り決めをテストできる条件に落とせること","リリースしてよいかを関係部署に説明し、部署間で意見が割れたときにまとめられること","探索的テストに習熟し、短い時間で多くの不具合を見つけられること"],"answer":[0,2],"explanation":{"signals":"効くのは退職者の責務3項目と、その後に置かれた**2つの移管の宣言**である。テスト環境の構築と版の管理はインフラ担当のチームへ移ることが決まっており、リリース可否の報告と関係部署の調整はテストマネージャー自身が引き続き行う。したがって残る責務は3項目のうち2つであり、後任に求める能力もその2つに対応する。ここで2つ目の宣言がいう「関係部署との調整」は、リリース可否をめぐって部署間の意見が割れたときにまとめる、あなたが従来から担ってきた職務を指す。責務の2つ目にある、臨床側の担当者と何をもって異常とするかを詰める作業は、退職者の責務として明示されており、2つの宣言のどちらもこれを取り上げていない。チームが5名であることは規模を伝えるだけで、どの選択肢の当否も決めない。","why":"シラバスは人員配置をテスト計画の中の活動と位置づけ、テスト戦略を実装するために必要な人員の**役割とスキルを特定する**タスクが含まれるとしている。ここで特定すべきは「一般に優秀なテスト担当者の条件」ではなく、**この状況で空く責務を埋める能力**である。残る責務の1つ目は、要件と個々のテストの対応づけを維持し照査で示せる状態に保つことで、薬事の対象であるという文脈がその厳密さを規定している。2つ目は、何をもって異常とするかを臨床側と詰めることで、これは専門的能力だけでは足りない。シラバスは社会的能力について、テストチームメンバーが他のチームメンバーとの関係において適切に振る舞い、テスト目的を達成することを可能にするものとし、コミュニケーション、協調性、対立解決スキルを挙げている。この2つが、移管されずに残る責務にそのまま対応する。","distractors":[null,"能力そのものは価値が高く、責務の3つ目にも対応しているように見える。しかしテスト環境の構築と版の管理はインフラ担当のチームへ移管することが決まっており、後任が担う責務ではない。シラバスは、テストチーム外の人々が特定のスキルを提供することもあるとし、理想的なテストチームは必要なスキルをすべて持っているか、**必要なスキルを持つタスクのみを担当する**としている。なお、この肢が先頭に置く「テスト自動化の基盤を設計し」も、退職者の3つの責務のどこにも挙がっていない。移管の宣言に行き着く前に、責務リストとの照合だけでも外れる肢である",null,"リリース可否の説明と部署間の調整は、テストマネージャーであるあなたが従来どおり行うと明記されている。後任に求める能力ではない。テストチームをリードする側に求められるマネジメントスキルと、テストチームメンバーに求められるスキルは別の節で扱われており、ここで問われているのは後者である","探索的テストの習熟は多くの現場で有用であり、それ自体は正しい能力である。しかし退職者が担っていた3つの責務のいずれにも直結せず、この欠員を埋める根拠にならない。求めるスキルは、一般的な望ましさではなく、詳細な状況分析から決まる"],"flip":[null,null,null,null,"退職者の責務の2つ目が、臨床側と何をもって異常とするかを詰めることではなく、リリース前の短い期間に未知の不具合を洗い出すことであったなら、環境の構築と版の管理は移管されるため、後任に残る責務は1つ目とその項目の2つになり、この能力が正解の一方になる。ここでは責務が3つとも明示されており、そこに探索的テストは含まれていない"],"flipNote":{"2":"この肢が正解の一方になるには、2つの条件がそろう必要がある。1つは、インフラ担当のチームへ移るのが退職者の責務の3つ目ではなく1つ目の「要件仕様と個々のテストケースの対応づけの維持」であること。もう1つは、責務の3つ目が、実機とシミュレータの環境を版ごとに構築することに加えて、その確認を自動化する基盤を設計することまで含んでいることである。移管の1文だけを動かしても、この肢が先頭に置く「テスト自動化の基盤を設計し」は3つの責務のどこにも書かれていないため、責務リストとの照合の段階で外れたままになる。","4":"この肢が正解の一方になるには、リリース可否の報告と関係部署との調整を担っていたのが今回退職する1名であり、あなたがそれを引き取らないことに加えて、要件と個々のテストケースの対応づけの維持を品質保証部門などの別の担い手が引き取ることも要る。前者だけを変えると後任に残る責務が3つになり、対応する能力も3つ立つため、2つを選ぶという形が成り立たない。"},"quote":"人員配置はテスト計画の中の活動である。これには、テスト戦略でテストを実装するために必要な人員の役割とスキルを特定するタスクが含まれる。プロジェクトに必要なスキルを決定するには、詳細な状況分析が必要である。","ref":"3.1.2","misconception":"一般に価値の高いスキルを「あった方がよい」で選んでしまい、この状況で誰がどこまでを担うのかという境界から必要な能力を導いていない"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["4つの能力領域","人員配置","役割の境界"],"distractorIntent":["移管済みの責務に対応する能力","テストマネージャー自身の職務に対応する能力","責務に直結しない一般的に有用な能力"],"distractorTypes":["D2","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1 イントロダクション・3.1.1・3.1.2・3.1.5。公式サンプル SET B 問43（欠員の責務から必要能力を導き、Noteが誤答2つを同時に殺す）の構造","mistakePatterns":["MP-16","MP-15"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答2肢は「残る責務」から一意に決まり、3誤答の否定根拠はシナリオの明示文に実在。quote は 3.1.2 に逐語一致。残った flip 1本は T3 を通り、flipNote 2本も成立","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-syllabus-2026-09-13-t3.md","sig":"07396af65b67","explSig":"4c9dee158b6d","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"門（T1/T2）は不該当。ただし「関係部署との調整は従来どおりあなたが行う」の射程が、正答の一方（選択肢3）の責務まで飲み込むように読める","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-qa-2026-09-12.md","sig":"07396af65b67","explSig":"4c9dee158b6d","fieldSig":{"scenario":"e3c59b6176fb","選択肢4":"4222d476907c","選択肢3":"9a928ae9d560"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つとも T1（接地）・T2（選ばれる思考）を満たす。逐語言い換えと装置の二重掛けは報告","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-item-2026-09-12.md","sig":"07396af65b67","explSig":"4c9dee158b6d","fieldSig":{"scenario":"e3c59b6176fb","選択肢3":"9a928ae9d560","選択肢1":"f90e3dc25869","選択肢2":"e9d2832ca303"}}]}},{"id":"q-3.1.2-A-2","lo":"TM-3.1.2","cluster":"3.1.2-A","clusterName":"プロジェクトのコンテキストから必要な能力を判断する","variantAxis":"プロジェクト特性から必要な能力を束として組み上げる（公式問44型・新規採用）","variant":2,"chapter":3,"section":"3.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは生命保険会社で、保険金の請求受付から給付査定までを扱う新しいオンラインサービスのテストマネージャーを務めている。開発の進め方はハイブリッドで、契約者が使う請求画面と請求の流れは2週間ごとの反復で作り込み、当局へ提出する帳票と約款に基づく給付額の計算部分は、テストレベルを順に踏む逐次の進め方を取る。テストチームは現在4名で、今回2名を新たに採用する。\n\nこのプロジェクトには次の特性がある。\n\n・監督当局の照査に備え、給付の可否を決める要件と、それを確認したテストの対応を、いつでも示せる記録として残すことが求められている\n・請求の流れに関する要件は反復のたびに見直しが入り、医療機関への照会、本人確認、送金を担う3つの外部サービスと連携する\n・メンバーは国内の拠点と時差7時間の海外の拠点に分かれており、全員が顔を合わせるのは月に1回である\n・請求書類には傷病名や治療歴が含まれ、契約者の情報の取り扱いに関する要件が厳しい\n\n欠陥の管理に使うツールは全社共通のもので、今回の増員にあわせて変更する予定はない。","question":"新たに採用する2名に求める能力の組み合わせとして、最も適切と判断できるものはどれか。","choices":["反復と逐次の作法を切り替えられること、約款と給付査定の業務に通じ要件とテストの対応を記録として示せること、外部サービスとの受け渡しや権限のない参照から情報が漏れる経路を検証できること、時差のある拠点と意思疎通を保てること、および繰り返す確認を自動化して保守できること","保険金の給付査定の業務と約款の内容に通じていること、要件と実施したテストの対応を証跡として残し照査の場で取り出せること、テストレベルごとの開始基準と終了基準を管理できること、反復する確認をスクリプトにして維持できること、および当局や内部監査の担当者に手順と結果を筋道立てて説明できること","要件の見直しに合わせてテストを組み替えられること、時差のある拠点と意思疎通を保てること、外部サービスの応答を模擬する仕組みを用意できること、探索的テストで短い時間に問題を洗い出せること、および回帰の確認を自動化して回せること","テスト設計の結果を詳細なテスト仕様書として書き起こし要件との対応を残せること、テストレベルごとの開始基準と終了基準を管理できること、既存の基幹バッチ処理の構造と運用手順に通じていること、業務部門を取りまとめて受け入れテストを運営できること、および手動で行う回帰の確認を統率できること"],"answer":[0],"explanation":{"signals":"効くのは冒頭の2文と箇条書きの4つの特性である。扱うのは生命保険の給付査定であり、約款に基づく給付額の計算部分と当局へ提出する帳票は逐次、契約者が使う請求画面と請求の流れは2週間ごとの反復で進む。特性は、①当局の照査に備えて要件とテストの対応を記録に残すこと、②要件が反復のたびに見直され、医療機関への照会・本人確認・送金を担う3つの外部サービスと連携すること、③時差7時間をはさんで拠点が分かれ対面が月1回であること、④請求書類に傷病名や治療歴が含まれ情報の取り扱いの要件が厳しいこと、の4つである。加えて反復と逐次を並行させる進め方からは、同じ確認を繰り返す作業が毎回発生することが読める。一方、チームが現在4名であることと、欠陥の管理に使うツールが全社共通で変えないことは、どの能力が要るかを左右しない。","why":"シラバスは人員配置をテスト計画の中の活動と位置づけ、必要な人員の役割とスキルを特定するには詳細な状況分析が必要だとしている。そこでこの状況を1つずつ能力に写す。シラバスは、プロジェクトコンテキストが求められる専門的能力に関する価値ある情報を提供するとして3つを挙げている。1つ目のシステムドメインは、アプリケーション分野のビジネス専門知識を求める。ここでは生命保険の給付査定と約款の内容がそれに当たり、①の記録も、何と何を対応づけるのかを判断できなければ維持できない。2つ目のアーキテクチャや技術は、インターフェース技術やセキュリティの脆弱性などの技術的専門知識を求める。②の後半が挙げる3つの外部サービスとの受け渡しと、④の傷病名や治療歴の取り扱いは、どちらもこの2つ目に属し、受け渡しの経路と権限のない参照をあわせて見る能力が要る。3つ目のSDLCは、例えばテストレベルやテストの役割、特定のテスト技法に関する知識を求める。当局提出の帳票と給付額の計算をテストレベルを順に踏んで確かめる逐次側と、2週間ごとに回る反復側の双方の作法を身につけ、②の前半にある反復ごとの見直しに合わせて行き来できることがこれに当たる。シラバスは社会的能力の水準がプロジェクトのコンテキストによって異なるとしており、③の分かれた拠点と月1回の対面は、離れた相手と意思疎通を保つ力を求める。残る1つの自動化は、箇条書きの4つの特性ではなく、冒頭の進め方と②の前半から導かれる。②がいう反復のたびの見直しは、いちど確かめた範囲を確かめ直すことを意味し、その反復を逐次側と並行させる以上、同じ確認が毎回戻ってくる。だからそれを自動化して保守できることが要る。つまりこの5つは、①を業務知識と記録の能力に、②の後半と④を受け渡しと権限のない参照をあわせて見る能力に、③を離れた相手と意思疎通を保つ力に、そして冒頭の進め方と②の前半を、逐次と反復の作法を行き来する力と繰り返す確認を自動化して保守する力に、それぞれ写したものであり、この状況の記述から導けない能力は含んでいない。なお、この5つはチームとして2名で分けて持つ前提であり、1名にすべてを求めるものではない。どれを採用で埋め、どれを育成や外部の専門家で埋めるかは、この束を決めたあとの判断になる。","distractors":[null,"業務と約款の知識、記録と証跡、テストレベルごとの基準、反復する確認のスクリプト化、当局と内部監査への説明まで並び、①の要求と逐次側の運営に厚く対応しているため最も惜しく見える。しかし④に対応する能力が1つも入っていない。請求書類に傷病名や治療歴が含まれ情報の取り扱いの要件が厳しいと明記されており、シラバスはセキュリティの脆弱性に関する技術的専門知識を、プロジェクトで使用するアーキテクチャや技術から導かれるものとして挙げている。②の後半にある3つの外部サービスとの受け渡しも同じ項目に属するが、連携の経路そのものを確かめる能力がない。さらに③の時差をはさんだ拠点間の意思疎通にも、反復側へ作法を切り替える適応にも触れていない","要件の見直しへの追従、離れた拠点との意思疎通、外部サービスの模擬、探索的テスト、回帰の自動化は、②と③の特性にそのまま対応しており、反復で進む部分だけを見れば過不足がない。しかし①の照査に備えた記録と逐次側の作法、④の情報の取り扱いに対応する能力がまとめて欠けており、給付査定という業務そのものの知識にも触れていない。このサービスは反復で進む部分と逐次で進む部分の両方を持ち、当局へ提出する帳票と給付額の計算部分は後者に属する。反復側だけに合わせた束では、監督当局の照査に備える責任を負える人を採れない","詳細なテスト仕様書、テストレベルごとの入退場の基準、基幹バッチの知識、受け入れテストの運営、手動の回帰の統率は、逐次の進め方を取る既存システムの改修であれば筋の通った束であり、①の記録の要求にも一見合っているように見える。しかしこのサービスは2週間ごとの反復を含み、要件は反復のたびに見直され、3つの外部サービスと連携し、拠点は時差をはさんで分かれている。手動の回帰を統率する形は、同じ確認が毎回繰り返される進め方とかみ合わない。②③④のいずれにも対応する能力がなく、この状況に合わせて選ばれた束になっていない"],"flip":[null,null,null,null],"flipNote":{"2":"この束が最も適切になるには、少なくとも3つの条件が同時に変わる必要がある。メンバーが1か所に集まって働くこと、契約者の情報の取り扱いと3つの外部サービスとの受け渡しの検証を別の担い手が専任で受け持つこと、そして請求画面と請求の流れも含めてすべてを逐次の進め方で作って要件を各テストレベルの開始前に確定することである。どれか1つを動かしても、この束が持っていない能力が、残りの特性に対応しないまま残る。誤っているのは並んでいる能力の中身ではなく、いまの状況で欠かせないものを含んでいないという点である。","3":"この束がそのまま採用の要件になるには、当局へ提出する帳票と約款に基づく給付額の計算部分を逐次側の既存のチームが引き続き担うこと、契約者の情報の取り扱いが要件どおりかを別の担い手が検証すること、そして今回採用する2名が2週間ごとの反復で進む請求画面と請求の流れだけを受け持つことが、いずれもそろう必要がある。1つだけを動かしても、照査に備えた記録の要求か、情報の取り扱いの要件のどちらかが、対応する能力を欠いたまま残る。","4":"この束が最も合うのは、この請求サービスが既存の基幹バッチを置き換える一括移行として計画され、要件を凍結して逐次の進め方だけで進み、外部サービスとの連携も既存の仕組みをそのまま引き継ぎ、メンバーが1か所に集まって働き、契約者の情報の取り扱いの検証を別の担い手が受け持つ場合である。箇条書きの4つの特性のうち、要件の見直しと外部連携、拠点の分散、情報の取り扱いのいずれにも対応する能力がないため、条件を1つ変えても届かない。誤っているのは能力の水準ではなく、想定している進め方と対象がこのプロジェクトのものと違うことである。"},"quote":"加えて、プロジェクトコンテキストは、求められる専門的能力に関する価値ある情報を提供する：・システムドメインには、情報技術、自動車産業、ギャンブリング産業など、アプリケーション分野のビジネス専門知識が求められる。・プロジェクトで使用するソフトウェアやシステムのアーキテクチャや技術には、例えばプログラミング言語、インターフェース技術、セキュリティの脆弱性などの技術的専門知識が求められる。・SDLC では、例えば、テストレベル、テストの役割、特定のテスト技法に関する知識が求められる。","ref":"3.1.2","misconception":"特性の一部にうまく対応する束を見つけると、残りの特性に対応する能力が入っているかを確かめずに選んでしまう"},"meta":{"concept":"テストチームのスキル","relatedConcepts":["4つの能力領域","人員配置","プロジェクトコンテキストの分析"],"distractorIntent":["情報の保護と離れた拠点との協働、反復側への適応が欠落した逐次寄りの束","規制側の記録と業務知識、情報の保護が欠落した反復寄りの束","逐次の進め方だけのシステムに向けた束"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/test-team-skills.md","confidence":"高","basis":"シラバス3.1.2（写像A〜E。特にプロジェクトコンテキストから求められる専門的能力の3項目、社会的能力の水準、個人の能力の4条件）と3.1.1。公式サンプル SET B 問44（プロジェクト特性の箇条書き4項目から5要素のスキル束を選ぶ・正答が最長でない）の構造","mistakePatterns":["MP-15","MP-16"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答は一意、3誤答とも4特性のどれかに対応する能力を欠く。quote は 3.1.2 に逐語一致。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-syllabus-2026-09-13-t3.md","sig":"2e1e4ae80470","explSig":"43e7334ed487","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"門（T1/T2）は不該当。正答5要素のうち自動化の1つだけが4特性のどれにも紐づかない。旧重大の flip は現行の門では reportOnly","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-qa-2026-09-12.md","sig":"2e1e4ae80470","explSig":"43e7334ed487","fieldSig":{"explanation.why":"fbdf8da430e4","選択肢2":"0f4ce6793d5a","選択肢3":"90bcc54c6fce","explanation.flip[2]":"01ba4719c80b","explanation.flip[4]":"e3b0c44298fc","scenario":"45ae5c9ccd5b","explanation.signals":"707f89ecb3ee"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つとも T1・T2 を満たす。旧巡の重大は収束（reportOnly）に当たるため中へ降格","ref":"jstqb-al-tm/kb/reviews/TM-3.1.2-item-2026-09-12.md","sig":"2e1e4ae80470","explSig":"43e7334ed487","fieldSig":{"選択肢1":"08bdd142841e","選択肢3":"90bcc54c6fce","選択肢4":"c65eb1e16613","scenario":"45ae5c9ccd5b","explanation.distractors[4]":"091a4dfd9a37"}}]}},{"id":"q-3.2.2-A-1","lo":"TM-3.2.2","cluster":"3.2.2-A","clusterName":"テストの費用対効果の計算を適用する","variantAxis":"3カテゴリーの単価と「流出したら外部失敗コストが置き換わる（加算ではない）」という集計規則から、欠陥1件あたりの平均節約額の値を出す（公式問49型・4択ONE）","variant":1,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、個人事業主向けの確定申告ソフトを開発して販売する会社のテストマネージャーである。来月の経営会議で、テストにかけている費用について説明することになった。\n経理部門と直近1年の実績を整理し、欠陥1件あたりの平均額を算出した。リリース前の検出にかかる評定コストが3万円、リリース前に見つけた欠陥の修正にかかる内部失敗コストが2万円、出荷後に利用者から報告された欠陥の調査・修正・問い合わせ対応・修正版の配布にかかる外部失敗コストが26万円であった。\nこの会社では、1件の欠陥について、リリース前に見つかれば評定コストと内部失敗コストが、利用者に届いてしまえば外部失敗コストが発生するものとして集計している。同じ欠陥で両方が発生することはなく、届いてしまった場合は外部失敗コストが評定コストと内部失敗コストを置き換える。","question":"テストの費用対効果について経営会議で述べる説明として、最も適切なものはどれか。1つ選べ。","choices":["欠陥1件あたりの品質コストは、評定コストと内部失敗コストと外部失敗コストを合計した31万円であり、テストにはこれだけの費用がかかっていると説明する。","外部失敗コストの平均から評定コストと内部失敗コストの平均を引いた21万円が、欠陥1件を流出前に見つけることによる平均節約額だと説明する。","テストの実行に充てる工数を絞れば、評定コストと、そこで見つかる欠陥の修正にかかる内部失敗コストがともに下がるため、品質コストを抑えられると説明する。","出荷前に見つかる欠陥が少ない期ほど、かけた費用に対する効果は大きいので、検出件数の少なさをテストの費用対効果の高さとして説明する。"],"answer":[1],"explanation":{"signals":"効くのは3つの平均額と、最後の集計規則である。1件の欠陥は、リリース前に見つかれば評定3万円と内部失敗2万円の計5万円で済み、利用者に届けば外部失敗26万円がかかる。同じ欠陥で両方は発生せず、届いた場合は外部失敗コストが前の2つを置き換える、と明記されている。この規則があるため、3つを足し合わせる操作はこの会社の数値に対しては成り立たない。26万円が5万円の5倍を超えるという大小関係は、テストを薄くしたときにどちらの費目が動くかを見る物差しになる。確定申告ソフトという繁忙期のある商材であることは、どの説明が成り立つかを分けない。","why":"シラバスは、テストの欠陥あたりの品質コストを「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と計算すると述べている。ここでいう評価コストは、3.2.1 が4カテゴリーの1つとして挙げる評定（アプレイザル）コストと同じ費目を指す（日本語版は式では「評価」、カテゴリー名では「評定」と表記している）。引き算になっているのは、1件の欠陥について、リリース前に見つかった場合の費目と、流出した場合の費目が排他だからである。シナリオの集計規則はこれを明文化しており、流出すれば外部失敗コストが評定コストと内部失敗コストを置き換える。したがって、テストが1件を流出前に見つけることで避けられている額は 26万円 −（3万円＋2万円）＝21万円 である。この数字がテストの付加価値であり、シラバスが「これらの利点と欠陥あたりの品質コストという観点からテストの付加価値を伝えるようにすべきである」と求めているものに当たる。なお、この節約額は欠陥1件あたりの値であり、総額にするにはリリース前に見つけた件数を掛ける。","distractors":["4つのカテゴリーは同時に積み上がる費目だと読むと、提示された3つを足した31万円が「1件の欠陥にかかる費用」に見える。経営会議では合計額のほうが説明しやすいという事情も、この案を後押しする。落ちるのはシナリオ最終段落の集計規則である。同じ欠陥で評定＋内部失敗と外部失敗の両方が発生することはなく、流出した場合は後者が前者を置き換えると明記されている。31万円は、起こり得ない足し方で作った額であり、どの1件の欠陥にも対応しない。そのうえ外部失敗コストはテストにかけている費用ではないため、テストの費用としても数えられない。",null,"評定コストは予算書に単独の費目として見えるため、そこを削れば品質コストの総額が下がるように見える。テストを減らせば見つかる欠陥も減り、内部失敗コストも一緒に下がるという読みも、当期の数字の上では成り立つ。落ちるのは、シナリオの単価とシラバスの記述である。テストを薄くして欠陥が流出すれば、1件につき26万円の外部失敗コストが発生する。削れるのは1件あたり5万円の側であり、代わりに動くのはその5倍を超える側である。シラバスも「評価コストと内部失敗コストの合計は、通常、外部失敗コストよりも大幅に少ない」と述べ、「テストが少なすぎれば、見逃した欠陥が高いリスクとなり、省略したテストのコストよりも高いコストが発生する可能性がある」と述べている。","欠陥が少ないことは品質が良いことの表れなので、検出件数が少ない期は良い期だと読める。落ちるのは、シラバスが定量的な利点として挙げている項目と、シナリオの単価である。シラバスは定量的な利点に「リリース前に発見した欠陥」「予防した欠陥」「修正された欠陥」を挙げており、いずれも件数が多い側が利点である。この会社では1件を流出前に見つけるたびに21万円を避けているため、検出件数が減れば避けられている額の合計も減る。検出件数の少なさそのものは、テストが薄いのか欠陥の混入が減ったのかを区別しないため、費用対効果の指標にならない。"],"flip":[null,null,"外部失敗コストの平均が26万円ではなく、利用者に届いた欠陥を自動更新でほぼ無償に直せるために1件あたり4万円にとどまる案件であれば、リリース前にかかる5万円（評定3万円＋内部失敗2万円）を下回るため、テストの実行に充てる工数を絞るほうが品質コストの総額は下がり、この説明が成り立つ",null],"quote":"評価コストと内部失敗コストの合計は、通常、外部失敗コストよりも大幅に少ない。そのため、テストは非常に価値のあるものとなる。…欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）…テストが少なすぎれば、見逃した欠陥が高いリスクとなり、省略したテストのコストよりも高いコストが発生する可能性がある。","ref":"3.2.2（欠陥あたりの平均節約額の式、テストが少なすぎる場合）、3.2.1（評価コストと内部失敗コストの合計）","misconception":"品質コストの4カテゴリーを1件の欠陥に同時に積み上がる費目だと読み、リリース前に見つけた場合の費目と流出した場合の費目が排他であること（流出すれば外部失敗コストが置き換わること）を踏まえずに、合計額をテストの費用や価値として示してしまう","flipNote":{"1":"この肢は2つの点で外れている。1つは、同じ欠陥で評定コスト＋内部失敗コストと外部失敗コストの両方は発生せず、流出すれば後者が前者を置き換えるという集計規則に反する足し方をしていること。もう1つは、外部失敗コストがテストにかけている費用ではないのに、その合計をテストにかかっている費用として示していることである。集計規則を加算に変えても2つ目が残り、さらに費用対効果を問う設問に対して費用の合計を答えることになるため、条件を1つ動かして正解になる肢ではない","4":"検出件数の少なさそのものを費用対効果の高さとする説明は、原文が定量的な利点としてリリース前に発見した欠陥や修正された欠陥の件数を挙げていることに正面から反しており、単価や件数をシナリオでどう動かしても成り立たない。検出件数が減ったことが良い知らせになるのは、レビューや教育で混入そのものが減ったときだけであり、そのときでも費用対効果を示す数字は件数ではなく、1件を流出前に見つけることで避けられた額である"}},"meta":{"concept":"テストの費用対効果の計算","relatedConcepts":["品質コストの4カテゴリー","テストの付加価値の伝達"],"distractorIntent":["排他である費目を足して31万円を作り、それを1件あたりの費用として示す案: シナリオ最終段落の置換規則が否定する（MP-54）","評定コストを削れば品質コストの総額が下がるという案: 削れる5万円と代わりに動く26万円の大小、および「テストが少なすぎれば……より高いコストが発生する可能性がある」が否定する（MP-57）","検出件数の少なさを費用対効果の高さとして示す案: 定量的な利点が件数の多い側であること、および1件あたり21万円×件数という関係が否定する（MP-58）"],"distractorTypes":["D11","D6","D6"],"conceptNote":"jstqb-al-tm/kb/concepts/test-cost-benefit-calculation.md","mistakePatterns":["MP-54","MP-57","MP-58"],"confidence":"高","basis":"シラバス3.2.2（式1と、テストが少なすぎる場合の記述）および3.2.1（評価コストと内部失敗コストの合計は通常、外部失敗コストよりも大幅に少ない）。公式サンプル SET B 問49 の構造（3カテゴリーの単価＋『流出したら外部失敗コストが置き換わる』適用条件の明文化＋1計算・4択ONE、誤答は加算1個と実務通念2個）に合わせた。数値・業種・文面は公式問題と重ならないよう独自に置いた","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2）は式1（外部失敗 −（評価＋内部失敗）＝21万円）で一意。**flip[2] は1条件で成立**（当てて解き直し済み）。flipNote 2本も成立","ref":"jstqb-al-tm/kb/reviews/TM-3.2.2-syllabus-2026-09-13-t3.md","sig":"ba3a71ac602c","explSig":"cc05acb33c83","fieldSig":{"explanation.quote":"6b965e1c540e","explanation.flip[2]":"4c3992a8ee88"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"T1/T2 とも当たらない。単価の桁も実務として成立。flip が1本反転していない（材料）","ref":"jstqb-al-tm/kb/reviews/TM-3.2.2-qa-2026-09-12.md","sig":"ba3a71ac602c","explSig":"cc05acb33c83","fieldSig":{"explanation.flip[4]":"e3b0c44298fc","選択肢4":"79b484230f34"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つとも選ぶ人の思考を1文で書ける。T1/T2 に当たらない","ref":"jstqb-al-tm/kb/reviews/TM-3.2.2-item-2026-09-12.md","sig":"ba3a71ac602c","explSig":"cc05acb33c83","fieldSig":{}}]}},{"id":"q-3.2.2-A-2","lo":"TM-3.2.2","cluster":"3.2.2-A","clusterName":"テストの費用対効果の計算を適用する","variantAxis":"4カテゴリーの単価と実績件数を置き、変数を1つ動かしたときの節約額の値と向きを判定させる（公式 SET A 問50型・感度分析・否定形4択ONE）","variant":2,"chapter":3,"section":"3.2","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、全国にホテルを展開する会社で、客室予約システムの開発と保守を担当するテストマネージャーである。来期の品質関連の予算を検討するため、経理部門と直近の四半期の実績を欠陥1件あたりの平均額に直した。欠陥予防コスト（設計段階のレビューや開発担当者への教育）が3万円、評定コスト（静的テストと動的テストの実施）が6万円、内部失敗コスト（リリース前に見つけた欠陥の修正）が4万円、外部失敗コスト（利用者に届いた欠陥の修正・再テスト・問い合わせ対応）が50万円である。\nこの会社では、1件の欠陥について、リリース前に見つかれば評定コストと内部失敗コストが、利用者に届けば外部失敗コストが発生するものとして集計しており、同じ欠陥で両方が発生することはない。直近の四半期は、リリース前に80件を検出し、5件が利用者に届いた。","question":"欠陥1件あたりの平均節約額を算出したうえで経営会議で述べる説明として、**適切でないもの**はどれか。1つ選べ。","choices":["欠陥の予防に充てる支出を1件あたり8万円に増やすと、欠陥1件あたりの平均節約額は32万円に下がる。","外部失敗コストの平均が50万円ではなく30万円にとどまる案件では、欠陥1件あたりの平均節約額は20万円まで縮む。","内部失敗コストの平均が4万円から9万円に上がった場合、欠陥1件あたりの平均節約額は35万円になる。","直近の四半期にリリース前で見つけた80件について、外部失敗コストを避けたことによる節約額の合計は3,200万円であり、これが今期のテストが会社に残した額である。"],"answer":[0],"explanation":{"signals":"効くのは4つの平均額のうち、式に入る3つと入らない1つの区別である。欠陥1件あたりの平均節約額は50万円 −（6万円＋4万円）＝40万円で、動かした変数がこの3項のどれかであれば節約額は動き、予防コストであれば動かない。総額を出すときに掛ける件数は、リリース前に検出した80件である（利用者に届いた5件ではない）。客室予約という業種や、4つの費目に添えた活動の例は、値を分けない。","why":"シラバスは「欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）」と述べている。式に入るのは3項であり、欠陥予防コストは入らない。シラバスの計算例がその証拠になる。例は「欠陥予防コスト：180 ドル」を提示したうえで、節約額を「4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル」と計算しており、提示した予防コストを一度も使っていない。式1が測るのはテストが見つけた欠陥1件の価値であり、予防はそもそも欠陥を混入させずに済ませる活動なので、数える対象が違うからである。この会社の現在の節約額は50万円 −（6万円＋4万円）＝40万円であり、予防コストを1件あたり3万円から8万円に増やしても40万円のままである。したがって「32万円に下がる」という説明は成り立たない。これは、予防への投資が無駄だという意味ではない。シラバスは「Boehm の曲線は、内部失敗のコスト、すなわち欠陥を修正するコストは、SDLC において欠陥が発見されるのが遅くなるほど増加する」と述べており、予防の価値は後段で発生する欠陥の件数を減らすことに現れる。式1の値ではなく件数の側に現れる、ということである。","distractors":[null,"外部失敗コストの平均を30万円に置き換えると、30万円 −（6万円＋4万円）＝20万円となる。外部失敗コストが下がれば節約額も下がるという向きは式のとおりで、テストの価値は、避けられる外部失敗コストの大きさに支えられていることを示す説明になっている。「テストの価値が下がる」という結論が直感に反するために誤りに見えるが、計算も向きも正しい。","内部失敗コストの平均を4万円から9万円に置き換えると、50万円 −（6万円＋9万円）＝35万円となり、計算も、内部失敗コストが上がれば節約額が減るという向きも、式のとおりである。変数を動かした説明はどれも疑わしく見えるが、この記述は式に入る3項のうちの1つを動かしており、数値も合う。","欠陥1件あたりの平均節約額40万円に、リリース前に検出した80件を掛けると3,200万円になる。掛ける件数をリリース前の検出数にすることも、シラバスの式が評価コストと内部失敗コストをリリース前に発見した欠陥数と結び付けていることに合う。件数の取り違え（利用者に届いた5件を掛ける）を疑わせる肢だが、この記述は取り違えていない。"],"flip":[null,null,null,null],"quote":"欠陥あたりの平均節約額＝外部失敗コストの平均 −（評価コストの平均＋内部失敗コストの平均）…欠陥予防コスト：180 ドル…欠陥1 件あたりの平均節約額＝4,000 ドル-（500 ドル＋200 ドル）＝3,300 ドル","ref":"3.2.2（欠陥あたりの平均節約額の式と計算例）","misconception":"品質コストが4カテゴリーなのだから式にも4つとも入ると考え、欠陥予防コストの増減を欠陥1件あたりの平均節約額の増減として報告してしまう","flipNote":{"2":"この肢が置いている30万円という想定や、シナリオの外部失敗コストを動かせば、20万円という値は合わなくなり、この肢は適切でない側に回る。しかしそれをしても、正解である「予防コストを増やすと欠陥1件あたりの平均節約額が下がる」という記述は、欠陥予防コストが式に入らない以上、適切でないまま残る。適切でないものが2つになり、1つ選べが成り立たない。予防コストが式に入る形に変えれば正解の側は適切になるが、そのときはこの肢を含む残り3つの数値がすべて合わなくなる","3":"上がった後の内部失敗コストの想定を動かせば、35万円という値は合わなくなり、この肢は適切でない側に回る。しかしそれをしても、欠陥予防コストは式に入らないため、正解である予防コストの記述は適切でないまま残り、適切でないものが2つになる。予防コストが式に入る形に変えれば正解の側は適切になるが、そのときはこの肢を含む残り3つの数値がすべて合わなくなる","4":"掛ける件数を80件から動かせば、3,200万円という合計は合わなくなり、この肢は適切でない側に回る。しかしそれをしても、欠陥予防コストは式に入らないため、正解である予防コストの記述は適切でないまま残り、適切でないものが2つになる。予防コストが式に入る形に変えれば正解の側は適切になるが、そのときはこの肢を含む残り3つの数値がすべて合わなくなる"}},"meta":{"concept":"テストの費用対効果の計算","relatedConcepts":["品質コストの4カテゴリー","Boehm 曲線","総節約額と検出件数"],"distractorIntent":
