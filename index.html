けである——四半期ごとの申告が柱の隣に残るので、報告の作りとして選ばれるところまでは届かない。後者、つまり網羅率が取れないという与件に置き換えれば、今度はコードの網羅率を報告から外す作りのほうが立つ。どこが書き換わったかはリポジトリの差分から取れ、スイートを流したときのコードの網羅率も実行のたびに取れていると書かれている以上、熟練者の申告は、割合として測って出す値の代わりにはならない。","4":"この作りは、状況の与件を2つとも動かしても答えになりようがない。動かせそうに見える与件は2つある。1つは「配送枠の割り当てのコードにはほぼ毎週手が入る」という変更の頻度そのもの。もう1つは「8か月前に組んだ自動化スイートが、その後に書き換わった部分を通せているかは確かめていない」という積み残しである。どちらも当てはめで動かせる側にあるが、どちらか一方を動かしただけでは、この作りを退ける理由が残る。頻度のほうだけを落として、コードに手が入るのも反映も半年に一度にすると、原文が例に挙げる頻繁に変更される環境ではなくなる。それでも、その手前に置かれた「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」は動かず、半年ごとに書き換わった部分をスイートが踏めているか分からないままなら、その網羅率はこの報告のニーズに当たり続ける。逆に積み残しのほうだけを消しても、ほぼ毎週手が入る以上、次に書き換わる部分への追随を追う理由は消えない。さらにこの作りは柱を重点箇所の消化と置き配の仕様の押さえ方の2つに絞っており、「消化状況と欠陥の解決状況は毎週取れる」のに、見つかった欠陥がどこまで解決したかが落ちている。この欠落はどちらの与件を動かしても残り、欠陥の解決を柱に据えている作りのほうが残る。"},"quote":"システムテスト、システム統合テスト、受け入れテスト、セキュリティテストのようなより高いレベルのテストでは、主要なテストベースは、通常、要件仕様書、ユースケース、ユーザーストーリー、プロダクトリスクのような作業成果物である。構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。テストマネジメントは、テストがテスト対象システムの構造をどの程度実行しているかを測定するためにコードカバレッジのメトリクスを使用することができるが、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することである。…プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力は、プロジェクト終了時に特定の方法で測定され、報告される。…カバレッジに関するメトリクスは以下の通り：…要件カバレッジ：テストケースによってカバーしている要件の割合。…コードカバレッジ：テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合。","ref":"2.1.3（構造カバレッジはより低いレベルのテストに適用できる／より高いレベルの報告はプロジェクトのコンテキストとニーズに合わせる／頻繁に変更される環境でのコードカバレッジ／構造カバレッジ100％でも高いレベルでの対処は残る／報告の目的／要件カバレッジとコードカバレッジ）","misconception":"コードの網羅率は低いレベルのテストのものだから高いレベルの報告には載せない、あるいは逆に、低いレベルで100%に達したのだからそれを品質の裏づけに置いて高いレベルの報告は絞ってよい、と一律に決めてしまい、頻繁に変更される環境かどうかという、シラバスが例に挙げる場面によってその扱いが変わることを見ていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["下の工程で取った網羅率の100%を品質の裏づけに置き、システムテストの結果の報告を重い側に絞ってよいと読ませる","測って出せる網羅率を、熟練者の安定度の申告に置き換えさせる","コードの網羅率は低いレベルのものという対応だけで決めさせ、頻繁に変更される環境という条件のついた但し書きを落とさせる"],"distractorTypes":["D2","D10","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-24","MP-22","MP-28","MP-109"]}},{"id":"q-2.1.3-D-3","lo":"TM-2.1.3","cluster":"2.1.3-D","variant":3,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"クラウド型の勤怠管理サービスを、動かしながら作り替えている。あなたはシステムテストのテストマネージャーで、月次の事業会議に出す報告の作りを決める。会議に出る事業責任者がそこで決めたいのは、来期に大手チェーン向けのシフト自動作成を売り出してよいかどうかである。下の表は、この現場でいま取れる値である。検証用の端末は台数を増やしたばかりで、実行の待ちは出ていない。","table":{"caption":"この現場でいま取れる値と、その中身","headers":["取れる値","中身"],"rows":[["反映と改修の頻度","反映は週3回。打刻の取り込みのコードは毎週書き換わる"],["自動化スイートの追随","10か月前に組んだまま。書き換わった部分を踏めているかは未確認"],["変更箇所と網羅率","変更箇所は構成管理から取れ、網羅率は実行のたびに取れる"],["下位の工程の網羅率","先月ステートメント100%。同じ月、そこを通っていた月締めで、給与の外部サービスとつないだ時だけ出る不具合が本番で1件"],["重点箇所と欠陥","打刻の二重計上や深夜割増の取り違えなどの消化と、欠陥の解決は毎週取れる"]]},"question":"テスト結果を分析し、この会議に出す報告の作りとして最も適切なものはどれか。1つ選べ。","choices":["開発チームが自動で回している工程の網羅率が100%に届いたことを品質の裏づけとして先に示し、システムテストの結果は重点箇所のうち影響の大きいものに絞って報告する。","自動化スイートがどこまで追いつけているかは数値にしづらいという見方をとり、開発チームの古株が月ごとに付ける安定度の評点を重点箇所の消化に添え、コードの網羅率に替えて報告する。","報告の中心は重点箇所の消化と欠陥の片付き具合に置き、毎週の書き換えに自動化スイートがどれだけ追いつけているかを、スイート実行のつど得られる網羅率で並べて報告する。","コードの網羅率は下の工程で扱う指標だとして報告から外し、重点箇所の消化と、シフト自動作成の仕様のうちテストケースで確かめられている割合を並べて中心に据える。"],"answer":[2],"explanation":{"signals":"判断を分けるのは表の次の行である。「反映は週3回。打刻の取り込みのコードは毎週書き換わる」と、自動化スイートが「10か月前に組んだまま。書き換わった部分を踏めているかは未確認」こと——この2つが、コードの網羅率をこの報告に置く理由を作る。「変更箇所は構成管理から取れ、網羅率は実行のたびに取れる」こと——これが、その置き方を実際に測れるものにする。「先月ステートメント100%。同じ月、そこを通っていた月締めで、給与の外部サービスとつないだ時だけ出る不具合が本番で1件」——これが、下の工程の100%を品質の裏づけとして先に示し、システムテストの側を影響の大きいものに絞る根拠にさせない。事業責任者が決めたいのは、来期に大手チェーン向けのシフト自動作成を売り出してよいかどうかであること——これが報告の中心を、重点箇所の消化と欠陥の片付きに定める。\n判断を分けないもの: 検証用の端末を増やしたばかりで実行の待ちが出ていないことは、どの作りを選ぶかに効かない。","why":"採るべきは、報告の中心は重点箇所の消化と欠陥の片付き具合に置き、毎週の書き換えに自動化スイートがどれだけ追いつけているかを、スイート実行のつど得られる網羅率で並べて報告する作りである。この会議で決めるのは来期に大手チェーン向けのシフト自動作成を売り出してよいかどうかで、その材料になるのは重点箇所の消化と欠陥の片付きのほうであり、コードの網羅率はそれに代わるものではない。並べて示すのは、この場面が、シラバスがコードカバレッジを有用であろうと述べた例——頻繁に変更される環境——にそのまま当たるからである。\nシラバスは「構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。」としたうえで、「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」とし、その一例として「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。」と続けている。表にあるとおり「反映は週3回。打刻の取り込みのコードは毎週書き換わる」のだから、ここは原文の言う頻繁に変更される環境にあたる。そして原文がそこで挙げている用途——テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別すること——が、自動化スイートが「10か月前に組んだまま。書き換わった部分を踏めているかは未確認」という積み残しにそのまま当たる。しかも「変更箇所は構成管理から取れ、網羅率は実行のたびに取れる」ので、並べる値は実際に測れる。\n中心を重点箇所の消化と欠陥の片付きに置く根拠も同じ節にある。シラバスは、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力が、プロジェクト終了時に特定の方法で測定され報告されるとしており、メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することだとしている。シフト自動作成を売り出してよいかを決める人が読むのは、「打刻の二重計上や深夜割増の取り違えなどの消化と、欠陥の解決は毎週取れる」という、その中身のほうである。\nなお、下の工程でステートメントの網羅率が100%に達していることは、それを品質の裏づけとして先に示し、システムテストの結果を影響の大きいものに絞ってよい理由にはならない。シラバスは「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」と述べており、表の「先月ステートメント100%。同じ月、そこを通っていた月締めで、給与の外部サービスとつないだ時だけ出る不具合が本番で1件」という行が、それをそのまま示している。","distractors":["下の工程で取った網羅率が100%に届いたことを品質の裏づけに据え、システムテストの側を影響の大きい重点箇所に絞る作りである。だがシラバスは「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」と述べている。表の「先月ステートメント100%。同じ月、そこを通っていた月締めで、給与の外部サービスとつないだ時だけ出る不具合が本番で1件」という行は、その通りのことが起きた例である。100%という数字は動かしようがなく、開発チームが自動で回して取ったものなので、報告の先頭に置きたくなる。加えて、この会議で決めたいのは、来期に大手チェーン向けのシフト自動作成を売り出してよいかどうかである以上、影響の大きいものに絞れば、決める人には残りが見えなくなる。","重点箇所の消化を載せるところまでは同じで、そこから先で、自動化スイートの追随という測った値を人の評点に置き換える作りである。古株の見立てを添えること自体は報告を厚くするが、ここではコードの網羅率に替えるとしており、書き換わった部分をスイートがどれだけ踏んでいるかという測った値が報告から消える。しかも、数値にしづらいというこの案自身の見方が、この場面では成り立たない。表には「変更箇所は構成管理から取れ、網羅率は実行のたびに取れる」とある。シラバスがカバレッジのメトリクスとして挙げる「コードカバレッジ：テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合。」も、測って出す値である。自動化スイートの追随を数字で語りにくいという現場の実感があるため、もっともらしく響く。",null,"重点箇所の消化に、シフト自動作成の仕様のうちテストケースで確かめられている割合を並べる中心の置き方は、シラバスがカバレッジのメトリクスに挙げる要件カバレッジそのもので、誤りではない。外れるのは、コードの網羅率を下の工程で扱う指標だとして報告から外した点である。シラバスは確かに「構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。」としているが、同じ節で「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」とし、「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。」と続けている。表の「反映は週3回。打刻の取り込みのコードは毎週書き換わる」という行と、自動化スイートの「10か月前に組んだまま。書き換わった部分を踏めているかは未確認」という行がある以上、その続きのほうが効く。テストレベルと指標の対応だけを覚えていると、条件のついた但し書きが落ちる。"],"flip":[null,null,null,null],"flipNote":{"1":"この作りには、独立に効く誤りが2つある。1つは、下の工程で取った網羅率100%を品質の裏づけとして先に示していることで、これを退けているのはシラバスの「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」という一文である。受験者が当てはめで動かせる側には無く、表の「先月ステートメント100%。同じ月、そこを通っていた月締めで、給与の外部サービスとつないだ時だけ出る不具合が本番で1件」という行は、その一文が起きたところを見せている例にすぎない。もう1つは、システムテストの結果を影響の大きい重点箇所に絞っていることで、この会議で決めたいのは、来期に大手チェーン向けのシフト自動作成を売り出してよいかどうかである以上、絞れば決める人には残りが見えなくなる。こちらはこの案の側で絞るのをやめれば動かせるが、動かせるのはそちらだけで、前者は原文の側にある。片方を直しても、もう片方が同じ理由でこの案を退ける。","2":"この作りが答えになるには、2つのうちどちらかが動かなければならないが、どちらを当てても1つには絞られない。1つは、コードの網羅率に替えるという置き換えをやめて並べる形にすること。もう1つは、数値にしづらいというこの案自身の見方が成り立つ場面にすることである。前者は選択肢の中身そのものの入れ替えで、後者は表の1マスの入れ替えである。前者を当てても、この案には欠陥の片付き具合が無く、月ごとの評点が中心の隣に残るので、報告の作りとして選ばれるところまでは届かない。後者、つまり網羅率が取れないという行に置き換えれば、今度はコードの網羅率を報告から外す作りのほうが立つ。表に「変更箇所は構成管理から取れ、網羅率は実行のたびに取れる」とある以上、古株の評点は、割合として測って出す値の代わりにはならない。","4":"この作りは、表の行を2つとも動かしても答えにならない。動かせそうに見える行は2つある。1つは「反映は週3回。打刻の取り込みのコードは毎週書き換わる」という変更の頻度そのもの。もう1つは自動化スイートの「10か月前に組んだまま。書き換わった部分を踏めているかは未確認」という積み残しである。どちらも当てはめで動かせる側にあるが、一方だけでは足りない。頻度のほうだけを落として、反映も改修も年に2回にすると、原文が例に挙げる頻繁に変更される環境ではなくなる。それでも、その手前に置かれた「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」は動かず、半期ごとに書き換わった部分をスイートが踏めているか分からないままなら、その網羅率はこの報告のニーズに当たり続ける。逆に積み残しのほうだけを消しても、毎週書き換わる以上、次に変わる部分への追随を追う理由は消えない。さらにこの作りは中心を重点箇所の消化とシフト自動作成の仕様の確かめ方の2つに絞っており、表に「打刻の二重計上や深夜割増の取り違えなどの消化と、欠陥の解決は毎週取れる」とあるのに、欠陥の片付きが落ちている。この欠落はどちらの行を動かしても残り、欠陥の片付きを中心に据えている作りのほうが残る。"},"quote":"システムテスト、システム統合テスト、受け入れテスト、セキュリティテストのようなより高いレベルのテストでは、主要なテストベースは、通常、要件仕様書、ユースケース、ユーザーストーリー、プロダクトリスクのような作業成果物である。構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。テストマネジメントは、テストがテスト対象システムの構造をどの程度実行しているかを測定するためにコードカバレッジのメトリクスを使用することができるが、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することである。…プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力は、プロジェクト終了時に特定の方法で測定され、報告される。…カバレッジに関するメトリクスは以下の通り：…要件カバレッジ：テストケースによってカバーしている要件の割合。…コードカバレッジ：テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合。","ref":"2.1.3（構造カバレッジはより低いレベルのテストに適用できる／より高いレベルの報告はプロジェクトのコンテキストとニーズに合わせる／頻繁に変更される環境でのコードカバレッジ／構造カバレッジ100％でも高いレベルでの対処は残る／報告の目的／要件カバレッジとコードカバレッジ）","misconception":"コードの網羅率は低いレベルのテストのものだから高いレベルの報告には載せない、あるいは逆に、低いレベルで100%に達したのだからそれを品質の裏づけに置いて高いレベルの報告は絞ってよい、と一律に決めてしまい、頻繁に変更される環境かどうかという、シラバスが例に挙げる場面によってその扱いが変わることを見ていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["下の工程で取った網羅率の100%を品質の裏づけに置き、システムテストの結果の報告を影響の大きいものに絞ってよいと読ませる","測って出せる網羅率を、古株の安定度の評点に置き換えさせる","コードの網羅率は低いレベルのものという対応だけで決めさせ、頻繁に変更される環境という条件のついた但し書きを落とさせる"],"distractorTypes":["D2","D10","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-24","MP-22","MP-28","MP-109"]}},{"id":"q-2.2.1-A-1","lo":"TM-2.2.1","cluster":"2.2.1-A","variant":1,"chapter":2,"section":"2.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、次のリリースのテスト計画に載せる見積りを組み立てている。","question":"テスト見積りで考慮すべき事項の説明として、最も適切なものはどれか。1つ選べ。","choices":["納期が先に決まっている場合は、時間・コスト・品質のうち品質の水準を下げた値を置いて、見積りを納期に合わせる。","見積るコストはテスト担当者の人件費であり、テスト環境やツールにかかる費用は設備の予算として見積りの外に置く。","テストタスクの人時を積み上げても、それがそのまま経過時間になるとは限らず、活動の総期間は別に見積る。","見積りの最初の作業は、過去の類似プロジェクトの実績データを集めて1件あたりの所要時間を求めることである。"],"answer":[2],"explanation":{"signals":"効くのは「テスト見積りで考慮すべき事項」という設問の指定だけで、次のリリースという場面はどの節の話かを示しているにすぎない。4つとも見積りの現場で実際に口にされる言い方なので、実務上もっともらしいかどうかでは切れない。分かれるのは、シラバスが見積りの対象として並べる工数・時間・コストについて、それぞれ何をどこまでと定めているかである。","why":"人時を積み上げて出てくる工数と、実際に流れる経過時間は同じものではない ── だから「テストタスクの人時を積み上げても、それがそのまま経過時間になるとは限らず、活動の総期間は別に見積る」が、見積りで考慮すべき事項の説明として正しい。シラバスは見積りの主な特徴として工数・時間・コストを並べ、工数を「プロジェクトのテストタスクを完了するために必要な労力またはストーリーポイントで計算される」ものとしたうえで、「多くの場合、テスト工数とテスト期間（経過時間）は異なることがあり、テストマネジメントは活動の総期間を見積る必要があるかもしれない」と続けている。工数が答える問いは「完了するのに何人時がかかるのか」であり、時間が答える問いは「テストプロジェクトを完了させるのに、どれくらいの時間がかかるのか」である。この2つは別の問いだからこそ、シラバスは時間の側について「テスト計画では、テスト工数をカレンダー日数と稼働日数で見積る必要がある」と、工数の数字を暦と稼働日に置き直す作業をあらためて置いている。","distractors":["納期を先に固定して、残りの値を机上で置き直す ── シラバスはこのやり方を退けている。テストはプロジェクトのサブプロジェクトであるため見積りに影響を与えるプロジェクト制約は常にあり妥協が必要だと述べたうえで、「これらの値を恣意的に操作することはできない」と明示しているからである。ここで持ち出されている時間-コスト-品質の三角形も、シラバスでは「相互依存する3 つの値」として置かれており、どれか1つを譲れば残りを好きに決められるという道具ではない。制約があって妥協が要るという前半はシラバスと同じなので、そこから「だから品質を下げて辻褄を合わせる」へ進んだ人が選ぶ","テスト環境やツールの費用は、シラバスがコストの中身として名指ししているものである。シラバスはコストを「コストはプロジェクトの予算である。これには、テストリソース、ツール、インフラの費用を含む」と定義しており、ツールとインフラは見積りの外ではなく中にある。ツールや環境の費用を別の予算科目で管理している組織は実在するため、会計上の切り分けをそのまま見積りの範囲の切り分けに持ち込んだ人が選ぶ",null,"実績データを集めること自体が誤りなのではなく、それを見積りの「最初の作業」に置いたことが誤りである。シラバスは「テスト見積りを行うには、最初のステップは、テストレベル、テスト活動、テストタスクを識別する」と出発点を定め、次に主要なテスト活動へ分割し、その次にテスト工数と予想コストを見積るとしている。何を見積るのかが決まっていなければ、集めた実績値を当てる先が無い。見積りとは過去実績からの換算だと考えている人が選ぶ"],"flip":[null,null,null,null],"flipNote":{"1":"時間-コスト-品質の三角形そのものはシラバスにある。ただしシラバスはそれを「相互依存する3 つの値で構成されており、それぞれが密接に関連し合い、互いに影響を与える」ものとして置き、同じ段落で「これらの値を恣意的に操作することはできない」と続けている。動かせないのは納期に合わせて値を置き直すという部分であって、制約があるから妥協が要るという部分はそのまま残せる。ただしそこまで直すと、工数と経過時間の関係を述べた記述も正しいまま残るので、正しい説明が2つ並び、1つだけを選べなくなる。","2":"テストリソース、ツール、インフラの費用は、シラバスがコストの定義の中に「含む」と書いて名指ししているものである。環境とツールを見積りの外へ置く部分を取り去り、人件費に加えてツールとインフラまで見積ると書き替えれば、コストについての正しい説明になる。ところがそのとき、工数と経過時間の関係を述べた記述は手つかずで正しいまま残るので、正しい説明が2つになる。この記述がそのまま答えになるのは、シラバスがコストの範囲からツールとインフラを外したときだけで、それは問題の条件を変えることではなく原文を書き替えることである。","4":"過去の統計が見積りを支えること自体はシラバスも述べており、この記述の誤りは行為の中身ではなく、それを見積りの「最初の作業」に置いた位置にある。シラバスは最初のステップをテストレベル・テスト活動・テストタスクの識別と定め、主要なテスト活動への分割を経てから工数とコストを見積るとしている。「最初の」を外して、実績データを工数見積りの材料として使うという記述に直せばシラバスに沿うが、そのとき工数と経過時間の関係を述べた記述も正しいまま残るため、正しい説明が2つになる。"},"quote":"多くの場合、テスト工数とテスト期間（経過時間）は異なることがあり、テストマネジメントは活動の総期間を見積る必要があるかもしれない。","ref":"2.2.1","misconception":"テスト見積りを人時の積み上げと同じものと考えており、シラバスが工数・時間・コストを見積りの対象として並べていること、とりわけ経過時間としての期間を工数から切り離して見積る必要が出てくることを押さえていない"},"meta":{"concept":"テスト見積りで考慮する対象と制約","distractorIntent":["コストの範囲からツールとインフラを外し、見積りの対象を人件費だけに絞る","三角形の相互依存を「1つを譲れば他は自由」と読み、納期に合わせて値を置き直す","見積りの最初のステップを、識別ではなく過去実績の収集に置く"],"distractorTypes":["D1","D6","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-2.2.1 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-53"]}},{"id":"q-2.2.2-A-1","lo":"TM-2.2.2","cluster":"2.2.2-A","variant":1,"chapter":2,"section":"2.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、次のリリースでテスト工数が膨らみそうな事情を洗い出し、要因の種類ごとに並べ直している。","question":"テストコンテキストに関連する要因の例にあたるものはどれか。1つ選べ。","choices":["テスト対象が扱う業務分野は歴史が長く、その分野特有の商慣行や例外規則が何層にも積み重なっている。","テストを3つの国の別会社に分担し、一部のチームはオンサイトではなくバーチャルで働いている。","テストを担当する予定の要員は、この業務分野の仕事を扱うのが初めてである。","自動化の実行基盤とテスト環境をいつから使えるかを、いま開発側と調整している。"],"answer":[1],"explanation":{"signals":"効くのは「テストコンテキストに関連する要因」という設問の指定だけである。4つともシラバスがテスト工数に影響を与える要因として実際に挙げているものなので、工数が膨らむかどうかでは切れない。分かれるのは、シラバスがその要因をプロダクト・開発プロセス・人・テスト結果・テストコンテキストのどの見出しの下に置いているかである。","why":"3つの国の別会社への分担と、一部のチームのバーチャル勤務 ── これがテストコンテキストに関連する要因にあたる。シラバスはテスト工数に影響を与える要因をプロダクト、開発プロセス、人、テスト結果、テストコンテキストの見出しに分けて並べており、テストコンテキストの下に置いているのが「複数の組織にわたるテストの分散、チームの構成と所在地、プロジェクトの複雑度（複数のサブシステムなど）」と「働き方（例：バーチャル、またはオンサイト）」だからである。別会社への分担は複数の組織にわたるテストの分散に、3つの国という置かれ方はチームの構成と所在地に、バーチャルで働いていることは働き方に、それぞれそのまま当たる。シラバスはこれを受けて「コンテキストに関連する要因とは、テスト見積り全体に影響する要因である」と説明している。残る3つも同じ一覧に載っているが、載っている見出しが違う ── 業務分野の歴史はプロダクト、要員の経験は人、自動化基盤とテスト環境をいつ使えるかは開発プロセスである。","distractors":["業務分野の歴史の長さと、そこに積み上がった商慣行や例外規則は、シラバスがプロダクトの見出しの下に置く「プロダクトドメインの複雑度（環境、インフラ、歴史など）」に当たる。シラバスはプロダクトに関連する要因を「テスト対象システム特有のコンテキストを作り出す」と説明しており、この説明に出てくる「コンテキスト」の語に引かれて、テストコンテキストの側へ寄せた人が選ぶ",null,"この業務分野の仕事を扱うのが初めてであることは、シラバスが人の見出しの下に置く「関与する人のスキルや経験、特に類似のプロジェクトやプロダクトに関する経験（ドメイン知識など）」に当たる。誰がどんな人かという話題からチームの構成を連想し、テストコンテキストの側へ寄せた人が選ぶ","自動化の実行基盤やテスト環境をいつから使えるかは、シラバスが開発プロセスの見出しの下に置く「物理的な要因（テスト自動化、ツール、テスト環境の可用性など）」に当たる。開発側との調整という周辺事情に見えるためコンテキストの側に寄せられやすいが、シラバスは「テストは開発に直接関係するため」としてこれらを開発プロセスに関連する要因に置いている"],"flip":[null,null,null,null],"flipNote":{"1":"プロダクトドメインの複雑度は、シラバスがプロダクトの見出しの下に例として挙げているものである。業務分野の歴史という中身を、複数のサブシステムにまたがるプロジェクトの複雑度の話に書き替えればテストコンテキストの側へ移るが、そのとき別会社への分担とバーチャル勤務を述べた記述も同じ側に残るため、当てはまるものが2つになって1つだけを選べなくなる。この記述がそのまま答えになるのはプロダクトに関連する要因を問われたときで、それは問題の条件を変えることではなく設問そのものを変えることである。","3":"類似のプロジェクトやプロダクトに関する経験の有無は、シラバスが人の見出しの下に例として挙げているものである。要員の経験という中身を、チームがどこに置かれているか・どんな働き方をしているかの話に書き替えればテストコンテキストへ移るが、そのとき別会社への分担とバーチャル勤務を述べた記述も同じ側に残るので、当てはまるものが2つになる。ドメイン知識の有無という中身を残したまま、この記述をテストコンテキストへ移す条件は無い。","4":"テスト自動化、ツール、テスト環境の可用性は、シラバスが開発プロセスの見出しの下に「物理的な要因」としてまとめて挙げているものである。いつから使えるかという可用性の話を、テストを複数の組織へ分散させたことそのものの話に書き替えればテストコンテキストへ移るが、それは中身を別の要因に差し替えることであり、しかもそのとき別会社への分担とバーチャル勤務を述べた記述も同じ側に残るため、当てはまるものが2つになる。可用性という中身を残したままこの記述を答えにできる条件は無い。"},"quote":"複数の組織にわたるテストの分散、チームの構成と所在地、プロジェクトの複雑度（複数のサブシステムなど）。…働き方（例：バーチャル、またはオンサイト）","ref":"2.2.2","misconception":"テスト工数に影響する要因を「工数が増える理由」としてひとまとめに覚えており、シラバスがそれをプロダクト・開発プロセス・人・テスト結果・テストコンテキストの見出しに分けて置いていることを区別できていない"},"meta":{"concept":"テスト工数に影響する要因のグループ","distractorIntent":["プロダクトドメインの複雑度を、説明文の「コンテキスト」という語に引かれてテストコンテキストに置く","人のスキルや経験を、チームの構成という語の連想からテストコンテキストに置く","テスト自動化・ツール・テスト環境の可用性を、開発プロセスではなくテストコンテキストに置く"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-2.2.2 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-100"]}},{"id":"q-2.2.3-A-1","lo":"TM-2.2.3","cluster":"2.2.3-A","variant":1,"chapter":2,"section":"2.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは、倉庫の入出荷を扱うシステムを自社で作っている会社のテストマネージャーである。開発は2週間の反復で進めており、同じ顔ぶれのチームが4年続いている。反復ごとに、どの懸念の確認にどれだけ時間を使ったかを毎回記録に残してある。\n\n次の反復のテストの進め方は、3つに分けて決めた。中心は、出荷が止まる恐れの大きい箇所から順に確かめる進め方である。今回確かめる懸念は、前の反復の終わりに行ったリスクの見直しで選び出してあり、その件数は計画会議を待たずに確定している。荷主ごとの料金計算の画面は毎回作り替えが入るため、ここは手順を先に書かず、画面を操作しながら確かめる。この役は、この業務を10年見てきた運用担当者2名が引き受ける。基幹の在庫更新については、自動化済みの確認のうち一部だけを今回の対象とすることが決まっている。\n\n次の反復で開発側が積む総作業量は、反復の計画会議が終わるまで確定しない。テストの見積りは、その会議の前に出す必要がある。倉庫の現場からは、画面の文字が小さいという声が前から届いている。","question":"この状況で、次の反復のテスト工数の見積りの作り方として適切なものはどれか。2つ選べ。","choices":["在庫更新については、自動化済みの確認を端から端まで通す前提に立ち、1件あたりの実行時間に確認の全件数を掛けて工数を出す。","出荷が止まる恐れの大きい箇所から順に確かめる分は、これまでの反復の記録から、1件の懸念の確認に実際にかかった時間の平均を出し、今回挙げた件数に掛けて工数を出す。","反復の総作業量に対するテストの割合をこれまでの反復の記録から求め、その割合を次の反復の総作業量に掛けて、3つの進め方をまとめた1つの値として出す。","毎回作り替えが入る画面の分は、長く現場を見ている2名の判断で、1回に確かめる時間の枠と確かめる回数を決め、その積を工数とする。","長く現場を見ている2名の判断で、中心の進め方と画面を操作して確かめる分を合わせた1つの値を置いて今回のテストの見積りとし、自動化済みの在庫更新の確認は人手がかからないため、この値の中で吸収できるものとして扱う。"],"answer":[1,3],"explanation":{"signals":"判断を決めているのは、3つに分けて決めた進め方それぞれについて、いま何が手元にあるかである。中心の進め方の側には、反復ごとにどの懸念の確認にどれだけ時間を使ったかの記録が毎回残っており、今回確かめる懸念の件数も前の反復の終わりのリスクの見直しで選び出されて確定している ── 1件あたりの実績と、それを掛ける相手の両方がある。毎回作り替えが入る荷主ごとの料金計算の画面の側は、手順を先に書かないので数える対象が無い代わりに、その業務を10年見てきた運用担当者2名が確認を引き受ける。基幹の在庫更新については、自動化済みの確認のうち一部だけを今回の対象とすることが決まっており、ここは対象の広さが限られている。そして、次の反復で開発側が積む総作業量は反復の計画会議が終わるまで確定せず、テストの見積りはその会議の前に出す必要がある。見積りを出す時点で数として確定しているのは懸念の件数であって、反復の総作業量ではない。倉庫の現場から前から届いている、画面の文字が小さいという声は、どの作り方を選ぶかには関わらない。","why":"中心の進め方の分は、これまでの反復の記録から出した、懸念1件の確認にかかった時間の平均を、今回確定している件数に掛けて出す。毎回作り替えが入る画面の分は、長く現場を見ている2名の判断で1回の時間の枠と確かめる回数を置き、その積を取る。この2つを併せた形が、ここでの見積りの作り方である。そう選ばせているのは、進め方ごとに手元にある入力が違うという一点で、前者には反復ごとの記録と確定した件数という測れる入力があり、後者には手順を先に書かない代わりに長く業務を見てきた人の判断がある。\nシラバスは、見積り技法の選択がデータの可用性や専門家の可用性などの要因に左右されるとし、手法によっては過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあること、また正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となる手法もあることを挙げて、比率や外挿による見積りは過去のデータに依存し、デルファイ法やプランニングポーカーは専門家やチームメンバーの意見や判断に依存する、と例を示している。技法はそれぞれ入力を要求するのだから、入力が無いところに当てれば根拠のない値しか出ない。1つの技法に統一せず、進め方ごとに入力の揃っている手を当てて併用することが、この状況での作り方になる。\nシラバスはまた、テスト見積りがテストプロセスに関わるすべての活動を対象とすべきであるとも述べている。3つに分けて決めた進め方はいずれも見積りの対象であり、基幹の在庫更新のうち今回の対象と決まった一部も外せない。在庫更新を名指しする2つの案は、一方が今回の対象より広く全件を通す前提に立ち、もう一方がその分を見積らずに他の値の中へ吸収させていて、どちらも対象の扱いで外れる。3つの進め方をまとめて1つの値で出す案は、その値の中に在庫更新の分も入るが、割合を掛ける相手である次の反復の総作業量が見積りを出す時点で確定していない。しかも反復ごとに残しているのは懸念1件の確認に使った時間であって、反復の総作業量もテストに使った工数の合計も残していないため、掛ける割合そのものもこの記録からは取り出せない。掛ける相手と掛ける割合の両方を欠くので、こちらは入力の側で立たない。選ぶのは3本すべてを覆う組み合わせではなく、入力が揃っていて対象の限定にも反しない作り方である。\n履歴の平均を使う作り方は、今回選び出した懸念の重さの構成が過去の反復と大きく違わないことを前提にしている。シラバスはテスト見積りにおける前提条件を常に見積りの一部として文書化すべきであるとし、見積りは新しい情報や変化する情報を反映して更新されるべきであるとも述べているので、この前提は書き出しておき、偏りが見えた時点で見積りを直す。掛ける相手が見積りの時点で確定していない案と違い、ここでは掛ける件数そのものが計画会議を待たずに確定しているので、この前提は作り方の成立までを妨げはしない。\nなお、原文 2.2.1 はアジャイルプロジェクトについて、テスト活動は開発作業の中で見積ることが多く、個別の値として見積ることはない、と述べている。後半まで読めば、これはテストの工数をどこに置いて示すかについての記述であり、テストの分だけを別立ての項目として切り出さないところまでを含む。ただし、開発の作業量の中に含めて示すとしても、その中身にあたる値を何から作るかは残る。ここで問われているのはその作り方であり、それを決めるのは 2.2.3 が挙げる入力の可用性であって、開発の進め方ではない。","distractors":["自動化済みの確認は、端から端まで通すのではなく、そのうち一部だけを今回の対象とすることが決まっている。その限定を外して全件を数えれば、今回は行わない確認まで工数に積むことになり、出てくるのは今回のテストの見積りではなくなる。1件あたりの実行時間に件数を掛けるという形そのものは、中心の進め方で採る作り方と同じであり、自動化済みなら何件通しても手間は変わらないという感覚も手伝って、対象を限定した一文を読み飛ばしたまま選ばれやすい。",null,"この作り方が落ちる理由は2つある。1つは、割合を掛ける相手が見積りを出す時点に無いことである。次の反復で開発側が積む総作業量は、反復の計画会議が終わるまで確定せず、テストの見積りはその会議の前に出さなければならない。見積りの時点で確定しているのは今回確かめる懸念の件数のほうであって、反復の総作業量ではない。もう1つは、掛ける割合そのものもこの記録からは取り出せないことである。反復ごとに残しているのはどの懸念の確認にどれだけ時間を使ったかであって、反復の総作業量も、テストに使った工数の合計も残していない。反復ごとに記録が残っているという一点だけを見ると、履歴を使う作り方として中心の進め方の見積りと同じ資格があるように見えるため、選ばれやすい。",null,"基幹の在庫更新の確認は、今回の対象として決まっている進め方の1つである。人手がかからないことは工数が無いことを意味せず、対象に入っている活動を他の値の中へ吸収させれば、その分だけ見積りは低く出る。長く現場を見ている2名の判断を使うこと自体は妨げられていないが、それは見積りの対象の範囲を狭めてよい理由にはならない。自動化済みの作業を工数の外に置く現場の習慣から、吸収させるという言い方が自然に見えて選ばれやすい。"],"flip":[null,null,null,null,null],"flipNote":{"1":"今回の対象が自動化済みの確認の全件だったなら、この案は対象の広さの点では外れなくなる。それでも選ばれる側には回らない。このシナリオが記録として残しているのは、どの懸念の確認にどれだけ時間を使ったかであって、自動化済みの確認1件あたりの実行時間も、その件数も与えられていない ── 対象の限定を外しても、この案は掛ける値と掛ける相手の両方を欠いたままである。加えて、記録と確定した件数がそろう中心の進め方の作り方も、長く現場を見ている2名の判断で時間の枠と回数を置く画面の分の作り方も、何も失わずに残る。2つを選ぶ形はそのまま成り立ち、選ばれるのはこの2つのままである。","3":"見積りを出す時点で次の反復の総作業量が確定していれば、割合を掛ける相手は手に入る。それでも、この案は選ばれる側には回らない。このシナリオが記録として残しているのは、どの懸念の確認にどれだけ時間を使ったかであって、反復の総作業量も、テストに使った工数の合計も与えられていない ── 掛ける割合そのものを取り出せる記録が無い。母数が手に入るだけでは割合の側を欠いたままで、記録と確定した件数がそろう中心の進め方の作り方も、2名の判断で時間の枠と回数を置く画面の分の作り方も、何も失わずに残る。割合を掛けて出す手そのものは、シラバスが比率による見積りを、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する例として挙げているとおり、その傾向を取り出せる過去のデータがある場面の手である。","5":"この扱いが通るのは、基幹の在庫更新の確認が今回の進め方から外れて見積りの範囲が2本になり、かつ反復ごとの記録が残っておらず2名の判断に頼るほかない場合である。前者だけでは、1件あたりの実績と確定した件数がそろう中心の進め方に記録を使う作り方が当たるので、2名の判断で1つの値にまとめる必要が無い。後者だけでは、今回の対象と決まっている在庫更新の確認を他の値へ吸収させる点が残り、その分だけ見積りが低く出る。2つの条件がそろってはじめて、この扱いが選ばれる側に回る。2つの条件を当てても、毎回作り替えが入る画面の分を2名の判断で時間の枠と回数から置く作り方は何も失わずに残る。したがって選ばれるのはその作り方とこの扱いの2つで、数のうえでは2つを選ぶ形に合う。ただしこの扱いは画面を操作して確かめる分を自分の値の中に含んでいるので、中心の進め方と画面の分で対象を分け合う本来の組み合わせとは違い、画面の分を二重に数える組み合わせになる。"},"quote":"テスト見積りは、テストプロセスに関わるすべての活動を対象とすべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。","ref":"2.2.3（見積りの対象範囲、データの可用性、専門家の可用性）／2.2.1（アジャイルでのテスト活動の見積りの示し方）","misconception":"進め方が3つに分けて決まっていても、1つの技法にまとめたり、今回の対象と決まった活動を他の値に吸収させたりしてよいと考え、技法がそれぞれ要求する入力（履歴・人の判断・掛ける母数）が手元にあるかを確かめずに選ぶ。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["限定表現（一部だけが対象）を読み飛ばし、自動化済みの確認を全件通す前提で積む","履歴があることだけを見て割合による見積りを選び、割合を掛ける母数が未確定であることと、記録が懸念1件ごとの時間しか持たず掛ける割合そのものも取り出せないことの2つを見落とす","熟練者の判断という与件だけを見て全体を1つの値で置き、対象と決まった活動を、自動化済みで人手がかからないという理由でその値に吸収させる"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-50","MP-108"]}},{"id":"q-2.2.3-A-2","lo":"TM-2.2.3","cluster":"2.2.3-B","variant":1,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、電力会社の検針データを処理して請求額を出すシステムの更改を請け負う会社のテストマネージャーである。開発は工程を順に進める形で、契約で決めた範囲と期日は動かせない。要件定義書は先週承認され、確認すべき要件の一覧は確定している。\n\n同じ発注元の更改は、これまでに2度、同じ体制で担当した。そのときのテストの実績は、要件1件あたりに何時間かかったかまで社内に残してある。\n\n今回のテストの担当者の顔ぶれは、要員の調整がつく来月まで決まらない。この分野に詳しい技術者はいずれも別の案件に出ており、今回の見積りに意見を出してもらえる見込みは薄い。設計と製造を合わせた今回の総工数は、分担が決まる来月まで確定しない。見積りは来週の契約前の会議に一度で出す必要があり、関係者が集まって突き合わせを重ねる時間は取れない。作業場所は今回から発注元の事務所ではなく自社の拠点になる。","question":"この状況で、契約前の会議に出すテスト工数の見積りをどう作るかを判断する。最も適切なものはどれか。1つ選べ。","choices":["承認された要件の一覧の件数に、これまで2度担当した更改で残した1件あたりの実績時間の平均を当てはめて全体の工数を積み上げ、置いた前提を見積りに添える。","これまで2度担当した更改の実績から、開発工数に対するテストの割合を求め、今回の総工数にその割合を掛けた値を全体の工数とする。","要件1件あたりに何時間かかるかを、今回の担当予定者とこの分野の有識者の見立てで、楽観的な値、悲観的な値、最も可能性の高い値の3つとして置き、期待値とばらつきを計算して全体の工数にまとめる。","経験のある担当者がそれぞれ個別に値を出し、差の大きい項目を持ち寄って根拠を説明し合い、値が寄るまで繰り返したうえで、合意した値と置いた前提を見積りに添える。"],"answer":[0],"explanation":{"signals":"見るべきは、それぞれの作り方が要求する入力が、来週の会議までに手元にあるかどうかである。数える対象の側は、要件定義書が先週承認され、確認すべき要件の一覧が確定している。1件あたりの値の側は、同じ発注元の更改をこれまでに2度、同じ体制で担当し、そのときのテストの実績が要件1件あたりに何時間かかったかまで社内に残っている。逆に、人を入力とする側は塞がっている ── 今回のテストの担当者の顔ぶれは要員の調整がつく来月まで決まらず、この分野に詳しい技術者はいずれも別の案件に出ていて、今回の見積りに意見を出してもらえる見込みは薄い。時間の側も塞がっており、見積りは来週の契約前の会議に一度で出す必要があって、関係者が集まって突き合わせを重ねる時間は取れない。設計と製造を合わせた今回の総工数が、分担の決まる来月まで確定しないことも効く。この時点で確定しているのは要件の件数であって、総工数ではない。開発が工程を順に進める形であることは、どの作り方が使えるかを決めない。作業場所が今回から発注元の事務所ではなく自社の拠点になることも、使える作り方を入れ替えはしないが、過去の実績をそのまま当てはめてよいかという前提には関わるので、選んだ作り方に添える前提として書き出す対象になる。","why":"承認された要件の一覧の件数に、2度の更改で残した要件1件あたりの実績時間の平均を当てはめて全体の工数を積み上げ、置いた前提を添えて出す ── これが来週の契約前の会議に持っていける作り方である。そう選ばせているのは、数える対象と1件あたりの値が、どちらも見積りを出す時点で手元にそろっているという点である。\nシラバスは、見積り技法の選択がデータの可用性や専門家の可用性などのさまざまな要因に左右されるとし、データの可用性については、手法によっては過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここでは同じ発注元の更改を2度、同じ体制で担当し、要件1件あたりに何時間かかったかまで社内に残っているので、履歴データを要件とする作り方は、その要件を満たしている。掛ける相手である要件の件数も、要件定義書が先週承認されて一覧が確定していることで手元にある。\n専門家の可用性についてシラバスは、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となる手法もあるとし、デルファイ法やプランニングポーカーは専門家やチームメンバーの意見や判断に依存すると述べている。この作り方が他と決定的に違うのは、担当者の顔ぶれが決まっていなくても、また意見を出せる技術者がいなくても、来週の時点で値を出せるところにある。\nなお、シラバスが一般的な実践例として挙げているのは、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることである。この作り方が数えるのはテストケースではなく要件そのものの件数だから、実践例とそのまま重なるわけではない。実践例はここでは、テストベースが確定していることがこの種の作り方の成立条件だと示す補助として読む。支えているのは、履歴データと数える対象がどちらも手元にあるという事実のほうである。\nシラバスは、テスト見積りにおける前提条件は常に見積りの一部として文書化すべきであるとも述べている。添える前提の中身はこの状況にある。残っている実績は同じ体制で担当した2度の更改で出た値で、今回は担当者の顔ぶれが未定であり、作業場所も発注元の事務所ではなく自社の拠点に変わる。その平均を今回もそのまま当てはめられるという判断そのものが前提であり、書き出しておけば、顔ぶれや条件が決まった時点で見積りを更新する根拠が残る。\n開発が工程を順に進める形であることから作り方を決めてはならない。シラバスが開発モデルと技法を結びつけている段落は「例えば」で始まり、述語は「使用できる」であって、データや専門家の可用性のように要件となるとは書かれていない。","distractors":[null,"この作り方が落ちる理由は2つある。1つは、割合を掛ける相手が見積りを出す時点に無いことである。設計と製造を合わせた今回の総工数は、分担が決まる来月まで確定せず、見積りは来週の契約前の会議に出さなければならない。見積りの時点で確定しているのは承認された要件の一覧の件数のほうであって、今回の総工数ではない。もう1つは、掛ける割合そのものもこの実績からは取り出せないことである。社内に残っているのは2度の更改で出たテストの実績、それも要件1件あたりに何時間かかったかまでであって、そのときの開発工数は残っていない。開発工数に対するテストの割合は、その両方がそろってはじめて出る。社内にテストの実績が残っているという一点だけを見ると成立しているように見え、さらに、工程を順に進める形で範囲が固定された案件には割合による見積りが向くという知識も、この案を後押しする。","この作り方は、楽観的な値、悲観的な値、最も可能性の高い値の3つを、今回の担当予定者とこの分野の有識者の見立てから置くとしている。ところが今回のテストの担当者の顔ぶれは要員の調整がつく来月まで決まらず、この分野に詳しい技術者はいずれも別の案件に出ていて、今回の見積りに意見を出してもらえる見込みは薄い。3つの値を置く人が見積りの時点にいないのだから、この作り方は入力を持てない。期待値とばらつきを数式で出す見た目から、人の見立てに依存しない客観的な作り方だと受け取られやすい。","個別に出した値を持ち寄り、差の大きい項目について根拠を説明し合って値が寄るまで繰り返す進め方は、参加する者が決まっていることと、繰り返すための時間があることの両方を前提にする。担当者の顔ぶれは来月まで決まらず、見積りは来週の会議に一度で出す必要があって、関係者が集まって突き合わせを重ねる時間も取れない。合意した値に置いた前提を添えて出すという締めくくりは正しい作り方と同じなので、そこだけを見ると差が無く見えるうえ、工程を順に進める形では有効だという知識も働くため選ばれやすい。"],"flip":[null,null,null,null],"flipNote":{"2":"見積りを出す時点で今回の総工数が確定していれば、割合を掛ける相手は手に入る。それでも、この案は選ばれる側には回らない。このシナリオが過去2度の更改について残していると述べているのはテストの実績、それも要件1件あたりに何時間かかったかまでであって、そのときの開発工数は与えられていない ── 開発工数に対するテストの割合そのものを取り出せる記録が無い。掛ける相手が手に入るだけでは割合の側を欠いたままで、承認された要件の一覧の件数と、2度の更改で残した要件1件あたりの実績時間という、より直接の入力がそろった作り方も何も失わずに残る。この案が入力をそろえるには、掛ける母数が確定することに加えて、過去2度の更改について開発工数とテスト工数の内訳まで記録に残っていることが同時に要る。割合を掛けて出す手そのものは、シラバスが比率による見積りを、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する例として挙げているとおり、その割合を取り出せる過去のデータがある場面の手である。","3":"3つの値を見立てで置くには、見立てを出す人が要る。担当者の顔ぶれが来月まで決まらないことと、この分野に詳しい技術者が別の案件に出ていることは別々の条件で、どちらか一方を動かしても、残る一方が同じ理由でこの作り方の入力を欠かせる。さらに両方がそろったとしても、要件の件数と1件あたりの実績という実測の入力がある以上、見立てを入力とするこの作り方が、それに代わって選ばれることにはならない。","4":"値が寄るまで繰り返す進め方には、参加する者が決まっていることと、繰り返すための時間があることの2つが要る。担当者の顔ぶれが来月まで決まらないことと、見積りを来週の会議に一度で出す必要があり突き合わせを重ねる時間が取れないことは別々の条件で、片方だけを動かしても、残る片方がこの進め方の前提を欠かせる。加えて実測の入力がそろっている以上、両方が満たされても、この作り方が要件の件数と実績の平均による作り方に代わって選ばれることにはならない。"},"quote":"一般的な実践例は、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることである。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…見積り技法の選択は、以下のようなさまざまな要因に左右される…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。","ref":"2.2.3（一般的な実践例、前提条件の文書化、見積り技法の選択を左右する要因）","misconception":"作り方が要求する入力（見立てを出せる人、掛ける母数、値を寄せるための時間）が見積りを出す時点にあるかを確かめる前に、開発の進め方や技法の一般的な長所で見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["社内に実績が残っていることだけを見て割合による見積りを選び、割合を掛ける母数が未確定であることと、残っているのがテストの実績だけで開発工数に対する割合そのものを取り出せないことの2つを見落とす","3つの値を置く手を、数式を使うからデータに基づく手だと読み、3つの値を見立てで置く人が見積りの時点でいないことを見落とす","繰り返して値を寄せる手を、工程を順に進める形に合う手として選び、参加者と時間の条件を見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-47","MP-48","MP-51","MP-108"]}},{"id":"q-2.2.3-B-2","lo":"TM-2.2.3","cluster":"2.2.3-B","variant":2,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、損害保険会社の自動車保険の契約管理システムを受託して改修する会社のテストマネージャーである。制度改正に合わせた改修で、開発は工程を順に進める形で行う。テスト工数の見積りは今週末の見積提示に一度で出す。手元の材料は次のとおりである。\n\n・改修する機能の一覧は先月確定して発注元の承認が下りており、対象は58件である。\n・この改修は過去に3回担当し、そのつど機能1件あたりのテストに何時間を要したかを社内の作業記録に残している。\n・作業記録に残るのはテストに要した時間で、設計や製造にかけた工数は書き留めていない。\n・設計と製造を含む改修全体の工数は、発注元との範囲の詰めが残っており、来月の契約時まで確定しない。\n・今回の改修を担当する要員の割り当ては、社内の調整がつく翌月まで決まらない。\n・保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。\n・見積提示までの日程は詰まっており、関係者を集めて値を突き合わせる場は設けられない。\n・直近の改修から、回帰の確認の一部を自動で流すようになった。\n・発注元の担当部署の名称は、4月に変わる予定である。","question":"この状況で、見積提示に出すテスト工数をどう見積るかを判断する。最も適切なものはどれか。1つ選べ。","choices":["過去3回の改修の作業記録から、開発工数に占めるテストの割合を求め、今回の改修全体の工数にその割合を掛けた値をテスト工数とし、機能の一覧の58件はその値を配分するときの目安にする。","機能1件あたりの所要時間を、今回の改修を担当する要員と保険の制度に明るい技術者の見立てで、短く済む場合、長引く場合、最も見込まれる場合の3つの値として置き、期待値とばらつきを計算してテスト工数とし、置いた前提を見積りに添える。","承認された機能の一覧の58件に、作業記録にある機能1件あたりのテスト時間の平均を掛けてテスト工数を出し、その平均を今回に当てはめた前提を見積りに添える。","担当の候補となる要員と保険の制度に明るい技術者を同じ場に呼び、機能ごとに各自の値を出しては根拠を述べ合い、値の開きが無くなるまで出し直して得た合計をテスト工数とする。"],"answer":[2],"explanation":{"signals":"効くのは、それぞれの作り方が求める入力が今週末までに手元にあるかどうかである。掛ける相手の側は、改修する機能の一覧は先月確定して発注元の承認が下りており、対象は58件である。掛ける値の側は、この改修は過去に3回担当し、そのつど機能1件あたりのテストに何時間を要したかを社内の作業記録に残している。一方で、人を入力とする側は塞がっている。今回の改修を担当する要員の割り当ては、社内の調整がつく翌月まで決まらない。保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。日程の側も塞がっており、見積提示までの日程は詰まっており、関係者を集めて値を突き合わせる場は設けられない。割合を使う道も開いていない。設計と製造を含む改修全体の工数は、発注元との範囲の詰めが残っており、来月の契約時まで確定しない。作業記録に残るのはテストに要した時間で、設計や製造にかけた工数は書き留めていない。開発を工程を順に進める形で行うことは、どの作り方が使えるかを決めない。直近の改修から回帰の確認の一部を自動で流すようになったことは、使える作り方を入れ替えはしないが、過去の平均をそのまま当てはめてよいかという前提に関わるので、添える前提として書き出す対象になる。発注元の担当部署の名称が4月に変わることは、どの作り方を選ぶかには関わらない。","why":"承認された機能の一覧の58件に、作業記録にある機能1件あたりのテスト時間の平均を掛けてテスト工数を出し、その平均を今回に当てはめた前提を添えて出す ── これが今週末の見積提示に持っていける作り方である。そう選ばせているのは、掛ける相手と掛ける値が、どちらも見積りを出す時点で手元にそろっているという一点である。\n掛ける相手については、改修する機能の一覧は先月確定して発注元の承認が下りており、対象は58件である。掛ける値については、この改修は過去に3回担当し、そのつど機能1件あたりのテストに何時間を要したかを社内の作業記録に残している。\nシラバスは、見積り技法の選択がデータの可用性や専門家の可用性などのさまざまな要因に左右されるとし、データの可用性について、手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。求める単位で残った履歴と、それを掛ける件数の両方がここにはあるので、履歴データを要件とするこの作り方は、その要件を満たしている。\n専門家の可用性についてシラバスは、手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあると述べている。この作り方が他と決定的に違うのは、見立てを出す人が見積りの時点にいなくても値を置けるところにある。\nシラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとも述べている。添える前提の中身はこの状況にある。直近の改修から回帰の確認の一部を自動で流すようになっており、過去3回の平均をそのまま今回にも当てはめられるという判断そのものが前提である。書き出しておけば、担当する要員が決まり、自動で流す分の効き方が見えた時点で、見積りを直す根拠が残る。\n工程を順に進める形の開発であることを手がかりに作り方を決めてはならない。シラバスが開発モデルごとに技法を挙げているのは例示であって、データの可用性や専門家の可用性のように、その技法が何を要件とするかを述べたものではない。","distractors":["割合を使うこの作り方は、掛ける相手と、掛ける割合を取り出す元の2つを求める。どちらもこの状況には無い。設計と製造を含む改修全体の工数は、発注元との範囲の詰めが残っており、来月の契約時まで確定しない。見積りは今週末の見積提示に出さなければならないので、掛ける相手は間に合わない。割合の側も同じで、作業記録に残るのはテストに要した時間で、設計や製造にかけた工数は書き留めていない。開発工数に占めるテストの割合は、その両方が残っていてはじめて取り出せる。過去に3回担当した改修の作業記録が社内に残っているという一点だけが目に入ると、記録があるのだから全体の工数に対するテストの割合もそこから取り出せるはずだという見当が働き、この案は成立して見える。","3つの値を置くこの作り方は、その3つを今回の改修を担当する要員と保険の制度に明るい技術者の見立てから置くとしている。ところが今回の改修を担当する要員の割り当ては、社内の調整がつく翌月まで決まらない。また保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。見立てを出す人が見積りの時点にいないのだから、この作り方は入力を持てない。期待値とばらつきを数式で導く見た目から、人の見立てによらない客観的な作り方だと受け取られやすい。",null,"同じ場で値を出し合い、開きが無くなるまで出し直す進め方は、呼んだ相手が見立てを出せることと、それを重ねる日程があることの両方を前提にする。ところがこの案が呼ぶ相手の一方について、保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。担当の候補となる要員を呼べても、制度の側の見立ては場に出てこない。さらに見積提示までの日程は詰まっており、関係者を集めて値を突き合わせる場は設けられない。経験のある人が集まって合意した値は確からしく見えるうえ、工程を順に進める形の開発では有効だという知識も働くため、選ばれやすい。"],"flip":[null,null,null,null],"flipNote":{"1":"このシナリオは、設計と製造を含む改修全体の工数は、発注元との範囲の詰めが残っており、来月の契約時まで確定しない。と述べている。仮にこれが見積りの時点で確定していれば、割合を掛ける相手は手に入る。それでもこの案は選ばれる側に回らない。このシナリオが過去の改修について述べているのは、作業記録に残るのはテストに要した時間で、設計や製造にかけた工数は書き留めていない。という状態だからである。掛ける割合そのものを取り出す材料が無い以上、掛ける相手だけが手に入っても割合の側は空いたままになる。この案が入力をそろえるには、掛ける母数が確定することと、過去の改修について設計・製造とテストの内訳まで記録に残っていることの2つが同時に要る。割合を当てて出す手そのものは、シラバスが比率による見積りを、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する例として挙げているとおり、その割合を取り出せる記録がある場面の手である。","2":"3つの値を見立てで置くには、見立てを出す人が要る。今回の改修を担当する要員の割り当ては、社内の調整がつく翌月まで決まらない。保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。この2つは別々の条件で、片方が動いても、残る片方が同じ理由でこの作り方の入力を欠かせる。さらに両方が動いたとしても、承認された件数と作業記録の実績という実測の入力がそろっている以上、見立てを入力とするこの作り方が、それに代わって選ばれることにはならない。","4":"値の開きが無くなるまで出し直す進め方には、呼んだ相手が見立てを出せることと、それを何度か重ねる日程の余裕の2つが要る。保険の制度に明るい技術者はいずれも別の大型案件に出ており、見立てを出してもらうことはできない。見積提示までの日程は詰まっており、関係者を集めて値を突き合わせる場は設けられない。この2つは別々の条件で、片方が動いても、残る片方がこの進め方を成り立たなくする。加えて、掛ける件数と機能1件あたりの実績がそろっている以上、2つとも動いたところで、この進め方が実測から積む作り方に代わって選ばれることにはならない。"},"quote":"一般的な実践例は、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることである。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…見積り技法の選択は、以下のようなさまざまな要因に左右される…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。","ref":"2.2.3（一般的な実践例、前提条件の文書化、見積り技法の選択を左右する要因）","misconception":"その作り方が求める入力（見立てを出せる人、割合を掛ける母数、割合を取り出す記録、値を寄せる場と日程）が見積りを出す時点にあるかを確かめる前に、開発の進め方や技法の一般的な長所で見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["社内に改修の記録が残っていることだけを見て割合による見積りを選び、掛ける母数が未確定であることと、残っているのがテストに要した時間だけで割合を取り出せないことの2つを見落とす","3つの値を置く手を、数式を使うからデータに基づく手だと読み、その3つを置く人が見積りの時点にいないことを見落とす","合意まで出し直す進め方を、工程を順に進める形の開発に合う手として選び、呼ぶ相手の一方である保険の制度に明るい技術者が見立てを出せないことと、値を突き合わせる場を設けられないことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-47","MP-48","MP-51","MP-108"]}},{"id":"q-2.2.3-B-3","lo":"TM-2.2.3","cluster":"2.2.3-B","variant":3,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、私立大学の情報センターで履修登録システムの更改を担当するテストマネージャーである。更改は工程を順に進める形で行い、稼働日は学年暦で動かせない。今回作り直す画面と帳票の一覧は、教務課との詰めが先月終わって確定しており、47件ある。\n\n情報センターには、過去2回の更改について、画面や帳票を1件確かめるのにテストが何時間かかったかを書き留めた記録がある。書き留めてあるのはテストに使った時間で、設計や製造に何時間かけたかは残していない。更改全体の工数は、外部に委託する範囲が理事会の決裁を待っている段階で、今月末まで確定しない。\n\n情報センター長からは「見積りは今月中の予算折衝に一度で出してほしい。折衝までの日程は詰まっていて、関係者を何度も集めて値を突き合わせる場は取れない」と言われている。履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。テストを担当する派遣の要員は、契約の手続きが終わる翌月まで顔ぶれが決まらない。過去2回の更改は学内の要員で進めたが、今回はテストの一部を外部に委託する見込みである。学生からは、ログイン画面の配色を変えてほしいという要望が届いている。","question":"この状況で、予算折衝に出すテスト工数の見積りの作り方を選択する。最も妥当なものはどれか。1つ選べ。","choices":["1件あたりの所要時間を、派遣の要員と履修の制度に明るい職員の見立てで、短く済む場合、長引く場合、最も見込まれる場合の3通り置き、期待値とばらつきを求めて合計し、置いた前提を見積りに書き添える。","過去2回の更改の記録から1件あたりの所要時間の平均を出し、一覧にある47件の画面と帳票にそれを当てて合計とし、この平均を今回にも当てはめられるとした前提を見積りに書き添える。","過去2回の更改の記録から、更改全体の工数に占めるテストの割合を割り出し、今回の更改全体の工数にその割合を掛けた値を合計とし、一覧にある47件の画面と帳票はその値を割り振るときの目安に使い、置いた前提を見積りに書き添える。","履修の制度に明るい職員と情報センターの担当者を同じ場に呼び、1件ずつ値を出しては根拠を述べ合い、値の開きが無くなるまで出し直して得た値を合計とする。"],"answer":[1],"explanation":{"signals":"判断を決めているのは、それぞれの作り方が求める入力が今月中に手元にあるかどうかである。掛ける相手については、今回作り直す画面と帳票の一覧は、教務課との詰めが先月終わって確定しており、47件ある。掛ける値については、情報センターには、過去2回の更改について、画面や帳票を1件確かめるのにテストが何時間かかったかを書き留めた記録がある。人を入力とする側は塞がっている。履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。テストを担当する派遣の要員は、契約の手続きが終わる翌月まで顔ぶれが決まらない。日程の側も塞がっており、情報センター長は、折衝までの日程は詰まっていて、関係者を何度も集めて値を突き合わせる場は取れないと言っている。割合を使う道も開いていない。更改全体の工数は、外部に委託する範囲が理事会の決裁を待っている段階で、今月末まで確定しない。書き留めてあるのはテストに使った時間で、設計や製造に何時間かけたかは残していない。更改を工程を順に進める形で行うことは、どの作り方が使えるかを決めない。今回はテストの一部を外部に委託する見込みであることは、使える作り方を入れ替えはしないが、学内の要員で進めた2回の平均をそのまま当てはめてよいかという前提に関わるので、書き添える前提の材料になる。ログイン画面の配色を変えてほしいという学生の要望は、どの作り方を選ぶかには関わらない。","why":"過去2回の更改の記録から1件あたりの所要時間の平均を出し、一覧にある47件の画面と帳票にそれを当てて合計とし、この平均を今回にも当てはめられるとした前提を書き添えて出す ── これが今月中の予算折衝に間に合う作り方である。そう選ばせているのは、掛ける相手と掛ける値の両方が、見積りを出す時点で情報センターの手元にそろっている点である。\n掛ける相手については、今回作り直す画面と帳票の一覧は、教務課との詰めが先月終わって確定しており、47件ある。掛ける値については、情報センターには、過去2回の更改について、画面や帳票を1件確かめるのにテストが何時間かかったかを書き留めた記録がある。\nシラバスは、見積り技法の選択がデータの可用性や専門家の可用性などのさまざまな要因に左右されるとし、データの可用性について、手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここで残っている記録は1件ずつの単位で、掛ける相手の件数も確定しているのだから、履歴データを要件とするこの作り方は、その要件を満たしている。\n専門家の可用性についてシラバスは、手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあると述べている。この作り方の強みは、見立てを出す職員や派遣の要員がまだいなくても、折衝の時点で値を置けるところにある。\nシラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとも述べている。書き添える前提の中身はこの状況にある。過去2回の更改は学内の要員で進めたが、今回はテストの一部を外部に委託する見込みであり、その平均を今回にも当てはめられるという判断そのものが前提である。書き出しておけば、委託の範囲が決まった時点で見積りを直す根拠が残る。\n工程を順に進める形の更改であることから作り方を決めてはならない。シラバスが開発モデルごとに技法を挙げているのは例示であって、その技法が何を要件とするかを述べたものではない。","distractors":["3通りの値を置くこの作り方は、その3通りを派遣の要員と履修の制度に明るい職員の見立てから置くとしている。ところがテストを担当する派遣の要員は、契約の手続きが終わる翌月まで顔ぶれが決まらない。また履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。見立てを出す人が折衝の時点にいないのだから、この作り方は入力を持てない。期待値とばらつきを求める手つきから、人の見立てによらない手だと読まれやすい。",null,"割合を使うこの作り方は、掛ける相手と、割合を割り出す元の2つを求める。どちらもこの状況には無い。更改全体の工数は、外部に委託する範囲が理事会の決裁を待っている段階で、今月末まで確定しない。見積りは今月中に出さなければならないので、掛ける相手は間に合わない。割り出す元も同じで、書き留めてあるのはテストに使った時間で、設計や製造に何時間かけたかは残していない。更改全体の工数に占めるテストの割合は、その両方が残っていてはじめて割り出せる。情報センターに過去2回の記録が残っているという一点だけが目に入ると成立して見えるうえ、稼働日が動かせない更改には全体から割り振る見積りが向くという知識も、この案を後押しする。","同じ場で値を出し合い、開きが無くなるまで出し直す進め方は、呼ばれた人がその場に出られることと、出し直しを重ねる日程があることの両方を前提にする。履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。情報センター長も、折衝までの日程は詰まっていて、関係者を何度も集めて値を突き合わせる場は取れないと言っている。1件ずつ根拠を述べ合って得た値は確からしく見えるため、日程と人の側の条件を読み飛ばしたまま選ばれやすい。"],"flip":[null,null,null,null],"flipNote":{"1":"3通りの値を見立てで置くには、見立てを出す人が要る。テストを担当する派遣の要員は、契約の手続きが終わる翌月まで顔ぶれが決まらない。履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。この2つは別々の条件で、片方が動いても、残る片方が同じ理由でこの作り方の入力を欠かせる。さらに両方が動いたとしても、確定した47件と1件ずつ書き留めた記録という実測の入力がそろっている以上、見立てを入力とするこの作り方が、それに代わって選ばれることにはならない。","3":"このシナリオは、更改全体の工数は、外部に委託する範囲が理事会の決裁を待っている段階で、今月末まで確定しない。と述べている。仮にこれが折衝の時点で確定していれば、割合を掛ける相手は手に入る。それでもこの案は選ばれる側に回らない。このシナリオが過去2回の更改について述べているのは、書き留めてあるのはテストに使った時間で、設計や製造に何時間かけたかは残していない。という状態だからである。割り出す元が無い以上、掛ける相手だけが手に入っても割合の側は空いたままになる。この案が入力をそろえるには、掛ける母数が確定することと、過去2回の更改について設計や製造の工数まで残っていることの2つが同時に要る。全体に割合を当てて出す手そのものは、シラバスが比率による見積りを、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する例として挙げているとおり、その割合を割り出せる記録がある場面の手である。","4":"同じ場に呼んで出し直す進め方には、呼ばれた人が出られることと、出し直しを重ねる日程の2つが要る。履修の制度に明るい職員は、いずれも入試の業務に入っており、見立てを出してもらう時間は取れない。そして情報センター長の言うとおり、折衝までの日程は詰まっていて、関係者を何度も集めて値を突き合わせる場は取れない。この2つは別々の条件で、片方が動いても、残る片方がこの進め方を成り立たなくする。加えて、掛ける件数と1件あたりの記録がそろっている以上、2つとも動いたところで、この進め方が実測から積む作り方に代わって選ばれることにはならない。"},"quote":"一般的な実践例は、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることである。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…見積り技法の選択は、以下のようなさまざまな要因に左右される…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。","ref":"2.2.3（一般的な実践例、前提条件の文書化、見積り技法の選択を左右する要因）","misconception":"その作り方が求める入力（見立てを出せる人、割合を掛ける母数、割合を割り出す記録、値を突き合わせる場と日程）が見積りを出す時点にあるかを確かめる前に、更改の進め方や技法の一般的な長所で見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["3通りの値を置く手を、期待値とばらつきを求めるからデータに基づく手だと読み、その3通りを置く人が折衝の時点にいないことを見落とす","情報センターに過去2回の記録が残っていることだけを見て割合による見積りを選び、掛ける母数が未確定であることと、残っているのがテストに使った時間だけで割合を割り出せないことの2つを見落とす","同じ場で出し直して合わせる進め方を、1件ずつ確かめる更改に合う手として選び、呼ばれた人が出られるかと日程の条件を見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-47","MP-48","MP-51","MP-108"]}},{"id":"q-2.2.3-C-1","lo":"TM-2.2.3","cluster":"2.2.3-C","variant":1,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、全国に調剤薬局を展開する会社の情報システム部門のテストマネージャーである。調剤の記録と保険請求を扱う基幹システムを、同じベンダーのパッケージの次期版へ入れ替える。入れ替える範囲は契約で確定しており、来週の部門会議に見積りを出す。手元にあるのは次のとおりである。\n\n・同じベンダーの版の入れ替えは、過去3回この部門が担当した。3回とも、入れ替え全体に使った工数と、そのうちテストに使った工数の合計が部門の記録に残っている。\n・今回の入れ替え全体の工数は、先月の役員会で承認された実施計画に数値として入っており、この数値は動かさない。\n・部門の記録は工程ごとの合計であり、画面や帳票の単位で何時間かかったかは残していない。今回入れ替える画面と帳票の一覧は、ベンダーから届いている。\n・期待値やばらつきを統計の計算で扱える要員は、部門にも協力会社にもいない。\n・調剤業務と保険請求に詳しい担当者3名は、別の統合作業に張り付いており、見積りの会には出せない。\n・店舗からは、レシートの印字が薄いという声が届いている。","question":"この状況で、来週の部門会議に出すテスト工数をどう見積るかを決める。最も適切なものはどれか。1つ選べ。","choices":["ベンダーから届いた画面と帳票の一覧の件数に、部門の記録から求めた1件あたりの実績時間を当てはめ、積み上げてテスト工数を出す。","過去3回の記録から、入れ替え全体の工数に占めるテストの割合を求め、その割合を、役員会で承認されている今回の全体の工数に掛けた値をテスト工数とし、置いた前提を見積りに添える。","過去3回の記録の推移に統計のモデルを当てはめて今回のテスト工数を数式で推定し、推定の幅と、置いた前提を見積りに添える。","調剤業務と保険請求に詳しい担当者3名を集めた場で、画面と帳票を1件ずつ取り上げて各自の値を出し合い、値がそろうまで出し直したうえで、積み上げた合計をテスト工数とする。"],"answer":[1],"explanation":{"signals":"効くのは、割合を出す元と、その割合を掛ける相手が、いま手元にそろっているかである。部門の記録には、同じベンダーの版の入れ替えを3回担当したときの、入れ替え全体に使った工数と、そのうちテストに使った工数の合計が残っている。掛ける相手にあたる今回の入れ替え全体の工数は、先月の役員会で承認された実施計画に数値として入っており、動かさないことが決まっている。ここで同じ記録がもう一方向にも効く ── その記録は工程ごとの合計であって、画面や帳票の単位で何時間かかったかは残していないので、1件あたりの時間を取り出すことはできない。人と数式の側は塞がっている。期待値やばらつきを統計の計算で扱える要員は部門にも協力会社にもおらず、調剤業務と保険請求に詳しい担当者3名は別の統合作業に張り付いていて見積りの会には出せない。画面と帳票の一覧がベンダーから届いていることは、数える対象があることを示すだけで、それに掛ける値までは与えない。店舗から届いているレシートの印字が薄いという声は、どの作り方を選ぶかには関わらない。","why":"過去3回の記録から入れ替え全体の工数に占めるテストの割合を求め、それを、役員会で承認されている今回の全体の工数に掛け、置いた前提を添えて出す ── これが来週の部門会議に持っていける作り方である。そう選ばせているのは、この手が要求する入力が2つとも数値として確定しているからである。割合の元になる過去の実績は3回分あり、割合を掛ける相手である今回の全体工数は役員会で承認され、動かさないことが決まっている。\nシラバスはデータの可用性を見積り技法の選択を左右する要因に挙げ、手法によっては過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があるとし、比率や外挿による見積りは、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存すると述べている。この状況で分かれ目になるのは、記録があるかどうかではなく、記録がどの単位で残っているかである。工程ごとの合計という粒度は、全体に占めるテストの割合を出すには足りるが、画面や帳票1件あたりの時間を取り出すには足りない。同じ一文が、一方の作り方を支え、もう一方の作り方を落としている。\n添える前提についてもシラバスに根拠がある。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとされており、これは選んだ技法によらない。ここで書き出す前提は状況の中にある ── 過去3回と今回で入れ替えの作りが大きく変わらないこと、承認された全体工数が動かないことの2つである。書き出しておけば、範囲や全体工数が動いたときに、どの前提が崩れたから見積りを直すのかを示せる。","distractors":["部門の記録は工程ごとの合計であり、画面や帳票の単位で何時間かかったかは残していないと明記されている。したがって、その記録から1件あたりの実績時間を求めることはできない。この案が有力に見えるのは、入力の片方が本当に手元にあるからである。今回入れ替える画面と帳票の一覧はベンダーから届いており、数える対象は確定している。しかもシラバスは、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることを一般的な実践例として挙げており、数えられる対象に1件あたりの値を掛けるこの形は、その実践例と地続きに見える。欠けているのは数える対象ではなく、その件数に掛ける1件あたりの値のほうである。",null,"期待値やばらつきを統計の計算で扱える要員は、部門にも協力会社にもいないと明記されている。シラバスはモデリングの知識も技法選択を左右する要因に挙げ、手法によっては見積りを計算するために数学的モデルや数式を使用する要件があるため、モデリングに関するスキルや知識が必要になる場合があるとし、その例として外挿や三点見積りを挙げている。過去3回分の記録があるのだから、平均を取るより精密に扱いたいという考えは自然であり、置いた前提を添える締めくくりも正しい。しかし精密さは、それを扱える人が手元にあって初めて手に入る。","この3名は別の統合作業に張り付いており、見積りの会には出せないと明記されている。人の判断を入力とする手は、その人が場に出られることを成立条件に持つ。シラバスは専門家の可用性を要因に挙げ、デルファイ法やプランニングポーカーは専門家やチームメンバーの意見や判断に依存していると述べている。業務を深く知る人が社内にいて、数える対象の一覧も届いている以上、その人たちに1件ずつ当たってもらう案は現場の感覚に合う。しかし値を出す人が集まらなければ、この進め方は1つの数字も生まない。"],"flip":[null,null,null,null],"flipNote":{"1":"この作り方を退けているのは、部門の記録が工程ごとの合計で、画面や帳票1件あたりの時間を取り出せないという一点である。では記録が1件あたりの実績時間で残っていたらどうなるか ── 過去3回の入れ替え全体の工数とそのうちテストに使った工数の合計も、役員会で承認されて動かない今回の全体の工数も、そのまま残る。割合を掛けて出す作り方はこの2つの与件だけで立ち、しかも1件あたりの実績があればテストに使った工数の合計はその総和からも出るので、割合はむしろ強く成り立つ。最も適切な案が2つになるので、記録の粒度を替えるだけでは唯一の答えにはならない。この案を唯一の答えにするには、役員会で承認された今回の入れ替え全体の工数が確定した数値ではなくなり、割合を掛ける相手そのものが無くなることが同時に要る。そこまで動かせば、ベンダーから届いた画面と帳票の一覧の件数も、記録から取れる1件あたりの実績時間も手元に残るので、この案は立ったまま、割合を掛ける作り方だけが掛ける相手を失って落ちる。動かす条件は、記録の粒度と、全体の工数が確定しているかどうかの2つになる。件数に1件あたりの値を掛けて積み上げる進め方そのものは、その単位の実績が残っている場面では正面から採れる手である。シラバスが一般的な実践例に挙げているのは、テストベース（要件やユーザーストーリーなど）から導き出されたテストケースの数を見積ることであって、その数に1件あたりの時間を掛ける手順までを述べているわけではない。実践例はここでは、数える対象が確定していることがこの種の作り方の成立条件だと示す側として読む。","3":"この作り方を退けているのは、統計の計算を扱える要員が部門にも協力会社にもいないという一点である。では扱える要員を1名置いたらどうなるか ── 過去3回の記録と、承認済みの実施計画の全体工数はそのまま残るので、割合を掛けて出す作り方も同じように成り立ち、最も適切な案が2つになる。1つ条件を動かすだけでは、この案が唯一の答えにはならない。数式で期待値やばらつきを導く進め方そのものは、シラバスがモデリングの知識を技法選択の要因に挙げ、外挿や三点見積りをその例に置いているとおり、扱える人がいる場面では正面から採れる手である。","4":"この作り方を退けているのは、値を出す3名が見積りの会に出られないという一点である。では3名の都合がついたらどうなるか ── 部門の記録と承認済みの全体工数はそのまま残るため、割合を掛けて出す作り方も立ち、最も適切な案が2つになる。この案を唯一の答えにするには、記録の側も今回に当てはめられなくなることが同時に要り、動かす条件が2つになる。人を集めて値を寄せる進め方そのものは、シラバスが専門家の可用性を要因に挙げ、デルファイ法やプランニングポーカーをその例に置いているとおり、参加する人を確保できる場面で成り立つ手である。"},"quote":"テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。例えば、比率や外挿による見積りは、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。…モデリングの知識：手法によっては，見積りを計算するために数学的モデルや数式を使用する要件があるため，モデリングに関するスキルや知識が必要になる場合がある．例えば、外挿や三点見積りは、見積りの期待値と標準偏差を導き出すために数式を使用する。","ref":"2.2.3（データの可用性、専門家の可用性、モデリングの知識、前提条件の文書化）","misconception":"過去の記録が残っていることと、その記録がその技法の入力になることを同じだと考え、記録がどの単位で残っているか、そして数式や人を要件とする手ならそれが手元にあるかを確かめずに見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["テストベースから導いた数を見積るという一般的な実践例と、記録が残っているという事実の2つだけを見て、その記録が工程ごとの合計であり1件あたりの時間を取り出せないことを確かめない","履歴が3回分あるならより精密に扱えるはずだと考え、期待値やばらつきを数式で導く手が、それを扱える要員を成立条件に持つことを見落とす","業務に詳しい人が社内にいることだけを見て人の判断を入力とする手を選び、その人たちが見積りの場に出られないことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-51","MP-108"]}},{"id":"q-2.2.3-C-2","lo":"TM-2.2.3","cluster":"2.2.3-C","variant":2,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、印刷会社の情報システム部門で、受注から進行までを扱う基幹システムの基盤の載せ替えを担当するテストマネージャーである。サーバーの保守切れに合わせた載せ替えで、載せ替える範囲は確定しており、テスト工数の見積りは来週の部門会議に出す。\n\n部門の記録には、過去4回の載せ替えについて、載せ替え1回ごとの全体の工数と、そのうちテストに使った工数が残っている。ただしこの記録は載せ替え1回ごとの合計で、機能や帳票の単位で何時間かかったかは残していない。今回の載せ替え全体の工数は、承認された年度計画に数値で入っており、この数値は動かさない。載せ替える機能の一覧は76件で確定している。\n\n期待値や標準偏差を数式で扱える要員は、社内にも委託先にもいない。受注と進行の業務に詳しい2名は、繁忙期の応援で現場に出ており、見積りの場には出られない。事務所の移転は、秋に予定されている。","question":"この状況で、部門会議に出すテスト工数の見積りの作り方を選択する。最も妥当なものはどれか。1つ選べ。","choices":["過去4回の載せ替えの記録からテストに使った工数が全体の工数のどれだけを占めるかを出し、その比を今回の載せ替えの全体の工数に当てた値をテスト工数とし、置いた前提を見積りに書き添える。","受注と進行の業務に詳しい2名に集まってもらい、載せ替える機能を1件ずつ取り上げて各自の値を出し、値がそろうまで出し直したうえで、積み上げた合計をテスト工数とする。","76件で確定している機能の一覧に、部門の記録から割り出した機能1件あたりのテスト時間を掛け合わせて全体のテスト工数を出す。","過去4回の載せ替えの記録にある全体の工数の伸びに数式のモデルを当てはめて今回のテスト工数を推定し、推定の幅と、置いた前提を見積りに書き添える。"],"answer":[0],"explanation":{"signals":"効くのは、取り分を出す元と、その取り分を当てる相手が、どちらも数値として手元にあるかどうかである。部門の記録には、過去4回の載せ替えについて、載せ替え1回ごとの全体の工数と、そのうちテストに使った工数が残っている。取り分を当てる相手にあたる今回の載せ替え全体の工数は、承認された年度計画に数値で入っており、この数値は動かさない。同じ記録がもう一方向にも効く ── ただしこの記録は載せ替え1回ごとの合計で、機能や帳票の単位で何時間かかったかは残していない。機能1件あたりの時間は、この記録からは取り出せない。人と数式の側は塞がっている。期待値や標準偏差を数式で扱える要員は、社内にも委託先にもいない。受注と進行の業務に詳しい2名は、繁忙期の応援で現場に出ており、見積りの場には出られない。載せ替える機能の一覧が76件で確定していることは、数える対象があることを示すだけで、それに掛ける値までは与えない。秋に予定されている事務所の移転は、どの作り方を選ぶかには関わらない。","why":"過去4回の記録から、テストに使った工数が全体の工数のどれだけを占めるかを出し、その比を今回の載せ替えの全体の工数に当て、置いた前提を書き添えて出す ── これが来週の部門会議に持っていける作り方である。そう選ばせているのは、この手が求める2つの入力が、どちらも数値として確定していることである。\n取り分の元になるのは過去の実績で、部門の記録には、過去4回の載せ替えについて、載せ替え1回ごとの全体の工数と、そのうちテストに使った工数が残っている。当てる相手のほうも、今回の載せ替え全体の工数は、承認された年度計画に数値で入っており、この数値は動かさない。\nシラバスはデータの可用性を見積り技法の選択を左右する要因に挙げ、例えば、比率や外挿による見積りは、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存すると述べている。この状況で分かれ目になるのは、記録があるかどうかではなく、記録がどの単位で残っているかである。ただしこの記録は載せ替え1回ごとの合計で、機能や帳票の単位で何時間かかったかは残していない。載せ替え1回ごとの合計という粒度は、全体に占める取り分を出すには足りるが、機能1件あたりの時間を取り出すには足りない。同じ一文が、一方の作り方を支え、もう一方の作り方を落としている。\n添える前提にもシラバスの根拠がある。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとされており、これは選んだ技法によらない。ここで書き出す前提は状況の中にある ── 過去4回と今回で載せ替えの作りが大きく変わらないこと、承認された年度計画の全体の工数が動かないことの2つである。書き出しておけば、範囲や全体の工数が動いたときに、どの前提が崩れたから見積りを直すのかを示せる。","distractors":[null,"人の判断を入力とするこの手は、値を出す人がその場に出られることを成立条件に持つ。ところが受注と進行の業務に詳しい2名は、繁忙期の応援で現場に出ており、見積りの場には出られない。シラバスも専門家の可用性を技法選択の要因に挙げ、手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあると述べている。業務を深く知る人が社内にいて、載せ替える機能の一覧も確定している以上、その2名に1件ずつ値を出してもらう案は現場の感覚に合う。しかし値を出す人が集まらなければ、この進め方は1つの数字も生まない。","この案が必要とするのは、機能1件あたりのテスト時間である。ところがただしこの記録は載せ替え1回ごとの合計で、機能や帳票の単位で何時間かかったかは残していない。その値は部門の記録からは割り出せない。この案が有力に見えるのは、入力の片方が本当に手元にあるからである。載せ替える機能の一覧は76件で確定しており、数える対象は決まっている。しかもシラバスは、テストベースから導き出されたテストケースの数を見積ることを一般的な実践例として挙げているので、数えられる対象に1件あたりの値を掛けるこの形は、その実践例と地続きに見える。欠けているのは数える対象ではなく、その件数に掛ける1件あたりの値のほうである。","数式のモデルを当てはめるこの手は、それを扱える人を成立条件に持つ。ところが期待値や標準偏差を数式で扱える要員は、社内にも委託先にもいない。シラバスもモデリングの知識を技法選択の要因に挙げ、手法によっては、見積りを計算するために数学的モデルや数式を使用する要件があるため、モデリングに関するスキルや知識が必要になる場合があると述べ、その例として外挿や三点見積りを挙げている。過去4回分の記録があるのだから、取り分の平均を取るより精密に扱いたいという考えは自然であり、置いた前提を書き添える締めくくりも正しい。しかし精密さは、それを扱える人が手元にあって初めて手に入る。"],"flip":[null,null,null,null],"flipNote":{"2":"この案を退けているのは、値を出す2名が見積りの場に出られないという一点である。では応援が終わって2名の都合がついたらどうなるか ── 部門の記録も、承認された年度計画の全体の工数もそのまま残るので、取り分を当てて出す作り方は何も失わずに立ち、最も適切な案が2つになる。この案を唯一の答えにするには、記録の側も今回に当てはめられなくなることが同時に要り、動かす条件が2つになる。人を集めて値を寄せる進め方そのものは、シラバスが専門家の可用性を要因に挙げているとおり、参加する人を確保できる場面では正面から採れる手である。","3":"この案を退けているのは、部門の記録が載せ替え1回ごとの合計で、機能1件あたりの時間を取り出せないという一点である。では記録が1件あたりの時間で残っていたらどうなるか ── 載せ替え1回ごとの全体の工数とテストに使った工数も、承認された年度計画の今回の全体の工数もそのまま残る。取り分を当てて出す作り方はその2つだけで立ち、しかも1件あたりの実績があればテストに使った工数はその総和からも出るので、取り分の側はむしろ強くなる。最も適切な案が2つになるので、記録の粒度を替えるだけでは唯一の答えにはならない。この案を唯一の答えにするには、年度計画の全体の工数が確定した数値ではなくなり、取り分を当てる相手そのものが消えることが同時に要る。件数に1件あたりの値を掛けて積む進め方そのものは、その単位の実績が残っている場面では正面から採れる手である。","4":"この案を退けているのは、数式を扱える要員が社内にも委託先にもいないという一点である。では扱える要員を1名置いたらどうなるか ── 過去4回の記録と、承認された年度計画の全体の工数はそのまま残るので、取り分を当てて出す作り方も同じように成り立ち、最も適切な案が2つになる。1つ条件を動かすだけでは、この案が唯一の答えにはならない。数式で推定の幅まで出す進め方そのものは、シラバスがモデリングの知識を要因に挙げ、外挿や三点見積りをその例に置いているとおり、扱える人がいる場面では正面から採れる手である。"},"quote":"テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。例えば、比率や外挿による見積りは、現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存する。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。…モデリングの知識：手法によっては，見積りを計算するために数学的モデルや数式を使用する要件があるため，モデリングに関するスキルや知識が必要になる場合がある．例えば、外挿や三点見積りは、見積りの期待値と標準偏差を導き出すために数式を使用する。","ref":"2.2.3（データの可用性、専門家の可用性、モデリングの知識、前提条件の文書化）","misconception":"記録が残っていることと、その記録がその技法の入力になることを同じだと考え、記録がどの単位で残っているか、そして数式や人を要件とする手ならそれが手元にあるかを確かめずに見積り技法を決めてしまう。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["業務に詳しい人が社内にいることだけを見て人の判断を入力とする手を選び、その2名が見積りの場に出られないことを見落とす","数える対象の件数が確定していることと、記録が残っていることの2つだけを見て、その記録が載せ替え1回ごとの合計であり1件あたりの時間を取り出せないことを確かめない","履歴が4回分あるならより精密に扱えるはずだと考え、数式のモデルを当てはめる手が、それを扱える要員を成立条件に持つことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-47","MP-48","MP-51","MP-108"]}},{"id":"q-2.2.3-D-1","lo":"TM-2.2.3","cluster":"2.2.3-D","variant":1,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、農業機械メーカーが新事業として立ち上げる、機械の稼働を遠隔で見守るサービスのテストマネージャーである。機械側の通信装置、通信網、クラウド側の画面の3層にまたがる作りで、この形のサービスを世に出した経験は社内に無い。投資判断の会が3週間後にあり、そこにテスト工数の見積りを出す。新事業に充てる全体の工数枠は、事業計画として承認されている。\n\n社内の記録に残っているのは、機械に組み込む制御ソフトの案件ばかりである。工程ごとの工数は残っているものの、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。\n\n通信とクラウドの両方を扱ってきた技術者3名が、今回のプロジェクトに専任で入っている。この3名を集めた会は、投資判断の会までの3週間に3回開ける。一方、実際に開発とテストを行う要員はこれから社外に発注して集めるため、顔ぶれが決まるのは2か月後になる。見積りの期待値やばらつきを数式で導いた経験は社内に無く、それを扱える要員もいない。事業部の名称は、同じ時期に変わる予定である。","question":"この状況で、投資判断の会に出すテスト工数の見積りの作り方を選択する。最も適切なものはどれか。1つ選べ。","choices":["社内に残っている制御ソフトの案件の記録から、工程ごとの工数に占めるテストの割合を求め、その割合を承認済みの全体の工数枠に掛けた値をテスト工数とし、置いた前提を見積りに添える。","専任で入っている技術者3名が各自の見立てで楽観的な値、悲観的な値、最も可能性の高い値を出し、期待値とばらつきを計算して、幅を付けたテスト工数とし、置いた前提を見積りに添える。","これから社外に発注して集める開発とテストの要員が顔を合わせ、機能の単位で各自の値を出し、値がそろうまで出し直して積み上げた合計をテスト工数とする。","専任で入っている3名が、3週間に開く3回の会で各自の値を根拠とともに突き合わせ、値が寄るまで繰り返して合意した値をテスト工数とし、そのとき置いた前提を見積りに添える。"],"answer":[3],"explanation":{"signals":"効くのは、今回の対象について値を出せる人が3週間のあいだに手元にあるか、そして数字の側の入力がどこまで使えるかである。社内の記録に残っているのは機械に組み込む制御ソフトの案件ばかりで、工程ごとの工数は残っているものの、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断されている ── 記録そのものはあるが、今回の比率を導き出す元としては使えない。対象の側は、通信装置・通信網・クラウド側の画面の3層にまたがり、この形のサービスを世に出した経験が社内に無い。人の側は分かれている。通信とクラウドの両方を扱ってきた技術者3名は専任で入っており、3週間に3回の会を開ける。これに対して、実際に開発とテストを行う要員が決まるのは2か月後で、見積りを出す時点にはいない。数式の側も塞がっており、見積りの期待値やばらつきを数式で導いた経験は社内に無く、扱える要員もいない。承認済みの全体の工数枠は、割合を掛ける相手としては使えるが、掛ける割合のほうを与えはしない。事業部の名称が同じ時期に変わることは、どの作り方を選ぶかには関わらない。","why":"専任で入っている3名が、3週間に開く3回の会で各自の値を根拠とともに突き合わせ、値が寄るまで繰り返して合意した値を工数とし、置いた前提を添えて出す ── これが投資判断の会に持っていける作り方である。そう選ばせているのは、この手が要求する入力が2つとも状況の中にあることである。知識と経験を持つ人は通信とクラウドの両方を扱ってきた3名として専任で確保されており、値を寄せるための場は3週間に3回開ける。\nシラバスは専門家の可用性を見積り技法の選択を左右する要因に挙げ、手法によっては正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあるとし、デルファイ法やプランニングポーカーは専門家やチームメンバーの意見や判断に依存していると述べている。この状況では、その要件を満たせる人がいる。あわせてシラバスは、適切な見積り技法を選択するにはまず対象の複雑度を判断するという例を挙げ、複雑度が低い場合はメトリクスベースの技法を、複雑度が高い場合は専門家ベースの技法を使用できるとしている。3層にまたがり社内に前例が無い今回の対象は、この例で言えば後者の側にある。\n数字の側が使えないことも同じ方向に働く。シラバスはデータの可用性について、手法によっては過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここでは記録そのものは残っているが、作りの違う案件のものなので、今回に当てはめられる割合や傾向を導き出す元としては信頼できない ── データが入手できない場合と並べて挙げられているのがこの側であり、その例としてシラバスは、比率や外挿による見積りは現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存すると述べている。\n締めくくりの前提の文書化にも根拠がある。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとされている。合意した値がどの3名の判断に拠るものかを添えておけば、構成や範囲が変わったときに、どの前提が崩れたから見積りを直すのかを示せる。","distractors":["社内の記録は機械に組み込む制御ソフトの案件ばかりで、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと状況が述べている。シラバスは、過去のプロジェクトや類似プロジェクトの履歴データを要件とする手法があるとしたうえで、これらのデータが入手できない、または信頼できない場合があると述べている。ここで欠けているのは記録の有無ではなく、その記録から今回に当てはめられる割合や傾向を導き出せるかである。この案が有力に見えるのは、割合を掛ける相手にあたる全体の工数枠が事業計画として承認済みで、置いた前提を添える締めくくりも正しいからである。足りないのは掛ける相手ではなく、掛ける割合の根拠のほうである。","見積りの期待値やばらつきを数式で導いた経験は社内に無く、それを扱える要員もいないと状況が述べている。シラバスはモデリングの知識も技法選択を左右する要因に挙げ、手法によっては見積りを計算するために数学的モデルや数式を使用する要件があるため、モデリングに関するスキルや知識が必要になる場合があるとし、その例として外挿や三点見積りを挙げている。3つの値を出せる専任の技術者が3名いるので入力はそろって見えるうえ、前例の無い対象では幅を添えて示したいという考えにも理があり、置いた前提を添える締めくくりも正しい。しかし、その3つの値を1つの工数にまとめる計算を担える人が社内にいない。","実際に開発とテストを行う要員はこれから社外に発注して集めるため、顔ぶれが決まるのは2か月後であり、見積りを出す投資判断の会は3週間後である。値を出す人が実際に作業をする人であることがこの進め方の眼目であり、シラバスも専門家の可用性の例にプランニングポーカーを挙げて、専門家やチームメンバーの意見や判断に依存すると述べている。作業する人が自分で見積る形は、その値に責任が伴う点で現場の支持を得やすい。しかしこの状況では、見積りを出す時点にその人たちがまだいない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは、社内の記録から今回に当てはめられる割合や傾向が取り出せないという一点である。では記録が今回と同じ3層の構成の案件のものに替わったらどうなるか ── 通信とクラウドの両方を扱ってきた3名と、3週間に3回開ける会はそのまま残るので、人の判断から出す作り方も入力を失わず、最も適切な案が2つになる。この案を唯一の答えにするには、記録の側を替えることに加えて、値を出せる3名か会の枠のどちらかが失われることが同時に要る。割合を掛けて出す手そのものは、シラバスがデータの可用性の例に比率による見積りを挙げ、それが現在のプロジェクトの比率や傾向を導き出すために過去のデータに依存すると述べているとおり、その傾向を取り出せる過去のデータがある場面の手である。","2":"この案を退けているのは、期待値やばらつきを数式で導く計算を担える人が社内にいないという一点である。では扱える要員を1名置いたらどうなるか ── 3つの値を出す3名も、値を寄せるための3回の会もそのまま残るため、合意で1つの値に収れんさせる作り方が同じように立ち、最も適切な案が2つになる。楽観的推定値、悲観的推定値、および最も可能性の高い推定値から期待値と標準偏差を計算する三点見積りは、シラバスが見積り誤差とモデリングの知識の両方の例に挙げている手であり、扱える人がいて不確実性の幅を示す必要がある場面のものである。","3":"この案を退けているのは、値を出す当の要員が見積りの時点にまだいないという一点である。では要員が先に確保されていたらどうなるか ── 専任の技術者3名と3回の会はそのまま残るので、その3名の合意で出す作り方も立ち、最も適切な案が2つになる。この案を唯一の答えにするには、要員が先に確保されることに加えて、今回の構成を扱ってきた3名が手元からいなくなることが同時に要る。作業をする人が機能の単位で値を出し合う進め方について、シラバスは専門家の可用性の例にプランニングポーカーを挙げ、専門家やチームメンバーの意見や判断に依存していると述べている。値を出す人が実際に作業をする人であることはこの進め方の眼目であり、その顔ぶれが見積りの時点で決まっている場面で成り立つ手である。"},"quote":"テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。…モデリングの知識：手法によっては，見積りを計算するために数学的モデルや数式を使用する要件があるため，モデリングに関するスキルや知識が必要になる場合がある．例えば、外挿や三点見積りは、見積りの期待値と標準偏差を導き出すために数式を使用する。…例えば、適切な見積り技法を選択するには、まず対象の複雑度を判断する。複雑度が低い場合は、メトリクスベースの技法を使用することができる。複雑度が高い場合は、専門家ベースの技法を使用できる。","ref":"2.2.3（データの可用性、専門家の可用性、モデリングの知識、複雑度による例示、前提条件の文書化）","misconception":"履歴の記録が社内に残っていれば数字から出す手が使えると考え、その記録から今回に当てはめられる割合や傾向が取り出せるかを確かめない。また、人の判断を入力とする手を一括りにして、誰が値を出せるのか、その値をまとめる計算を誰が担うのかまでは見ない。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["社内に記録が残っていることと、掛ける相手の工数枠が承認済みであることだけを見て、その記録からは今回に当てはめられる割合や傾向が取り出せないという状況の判断を読み飛ばす","値を出せる技術者が3名いることで入力がそろったと考え、3つの値を1つの工数にまとめる計算を担える人がいないことを見落とす","作業をする人が自分で見積るのが筋だという考えから、その要員が見積りを出す時点にはまだ確保されていないことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-51","MP-108"]}},{"id":"q-2.2.3-D-2","lo":"TM-2.2.3","cluster":"2.2.3-D","variant":2,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、食品メーカーが新しく立ち上げる消費者向けの定期宅配サービスのテストマネージャーである。投資判断の会が4週間後にあり、そこにテスト工数の見積りを出す。今回のサービスと手元の材料は次のとおりである。\n\n・会員の登録と管理、代金の決済、配送の計画の3つにまたがる作りで、この形のサービスを自社で運んだ経験は無い。\n・社内の記録に残るのは取引先との受発注の仕組みの案件ばかりで、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。\n・新しい事業に充てる全体の工数枠は、事業計画として承認されている。\n・会員向けの仕組みと決済の両方を扱ってきた技術者2名が、今回の立ち上げに専任で入っている。\n・この2名を集めた会は、投資判断の会までの4週間に4回開ける。\n・実際に開発とテストを行う要員は、これから協力会社に依頼して集めるため、顔ぶれが決まるのは2か月後になる。\n・見積りの期待値やばらつきを数式で導ける要員は、社内にも協力会社にもいない。\n・商品の箱の意匠は、来年に変える予定である。","question":"この状況で、投資判断の会に出すテスト工数の見積りの作り方を選択する。最も妥当なものはどれか。1つ選べ。","choices":["取引先との受発注の案件で工程ごとに残っている工数からテストの取り分を出し、事業計画で承認された工数枠にそれを当てた値をテスト工数として、置いた前提を見積りに添える。","立ち上げに専任で入っている2名に、順調に進んだ場合と難航した場合と最も見込まれる場合の3つの値を出してもらい、そこから期待値と標準偏差を求めて幅の付いたテスト工数にまとめ、置いた前提を見積りに添える。","協力会社から集める開発とテストの担当者に、画面や処理の単位でそれぞれ値を出してもらい、食い違いが無くなるまで出し直した合計をテスト工数とする。","会員向けの仕組みと決済の両方を扱ってきた2名に、4週間で4回の会を通じて互いの見立てとその根拠を示し合ってもらい、開きが埋まったところの値をテスト工数とし、置いた前提を見積りに添える。"],"answer":[3],"explanation":{"signals":"効くのは、今回の対象について値を出せる人が4週間のあいだに手元にあるか、そして数字の側の入力がどこまで使えるかである。社内の記録に残るのは取引先との受発注の仕組みの案件ばかりで、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。記録そのものはあるが、今回の比率を導き出す元としては使えない。対象の側は、会員の登録と管理、代金の決済、配送の計画の3つにまたがる作りで、この形のサービスを自社で運んだ経験は無い。人の側は分かれている。会員向けの仕組みと決済の両方を扱ってきた技術者2名が、今回の立ち上げに専任で入っている。この2名を集めた会は、投資判断の会までの4週間に4回開ける。これに対して、実際に開発とテストを行う要員は、これから協力会社に依頼して集めるため、顔ぶれが決まるのは2か月後になる。見積りを出す時点には、その人たちはいない。数式の側も塞がっており、見積りの期待値やばらつきを数式で導ける要員は、社内にも協力会社にもいない。承認済みの全体の工数枠は、取り分を当てる相手としては使えるが、当てる取り分のほうを与えはしない。来年に変える予定の商品の箱の意匠は、どの作り方を選ぶかには関わらない。","why":"会員向けの仕組みと決済の両方を扱ってきた2名に、4週間で4回の会を通じて互いの見立てとその根拠を示し合ってもらい、開きが埋まったところの値を工数として、置いた前提を添えて出す ── これが投資判断の会に持っていける作り方である。そう選ばせているのは、この手が求める2つの入力がどちらも状況の中にあることである。\n知識と経験を持つ人については、会員向けの仕組みと決済の両方を扱ってきた技術者2名が、今回の立ち上げに専任で入っている。値を寄せるための場についても、この2名を集めた会は、投資判断の会までの4週間に4回開ける。\nシラバスは専門家の可用性を見積り技法の選択を左右する要因に挙げ、手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあるとし、例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存していると述べている。この状況では、その要件を満たせる人がいる。あわせてシラバスは、適切な見積り技法を選択するにはまず対象の複雑度を判断するという例を挙げ、複雑度が低い場合はメトリクスベースの技法を、複雑度が高い場合は専門家ベースの技法を使用できるとしている。3つにまたがり自社に前例が無い今回の対象は、この例で言えば後者の側にある。\n数字の側が使えないことも同じ方向に働く。シラバスはデータの可用性について、手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここでは記録そのものは残っているが、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。つまり、入手できない場合と並べて挙げられている側にある。\n締めくくりの前提にも根拠がある。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとされている。落ち着いた値がどの2名の判断に拠るものかを添えておけば、構成や範囲が変わったときに、どの前提が崩れたから見積りを直すのかを示せる。","distractors":["この案は、社内の記録から今回に当てはめられる取り分を取り出せることを前提にしている。ところが状況は、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。シラバスは、過去のプロジェクトや類似プロジェクトの履歴データを要件とする手法があるとしたうえで、これらのデータが入手できない、または信頼できない場合があると述べている。ここで欠けているのは記録の有無ではなく、その記録から今回に当てはめられる取り分を導き出せるかである。この案が有力に見えるのは、取り分を当てる相手にあたる全体の工数枠が事業計画として承認済みで、置いた前提を添える締めくくりも正しいからである。足りないのは当てる相手ではなく、当てる取り分の根拠のほうである。","この案は、3つの値から期待値と標準偏差を求める計算を前提にしている。ところが見積りの期待値やばらつきを数式で導ける要員は、社内にも協力会社にもいない。シラバスはモデリングの知識も技法選択を左右する要因に挙げ、手法によっては、見積りを計算するために数学的モデルや数式を使用する要件があるため、モデリングに関するスキルや知識が必要になる場合があるとし、その例として外挿や三点見積りを挙げている。3つの値を出せる専任の技術者が2名いるので入力はそろって見えるうえ、前例の無い対象では幅を添えて示したいという考えにも理があり、置いた前提を添える締めくくりも正しい。しかし、その3つの値を1つの工数にまとめる計算を担える人が手元にいない。","この進め方は、値を出す人が実際に作業をする人であることを眼目にしている。ところが実際に開発とテストを行う要員は、これから協力会社に依頼して集めるため、顔ぶれが決まるのは2か月後になる。見積りを出す投資判断の会は4週間後である。シラバスも専門家の可用性の例にプランニングポーカーを挙げ、専門家やチームメンバーの意見や判断に依存していると述べている。作業する人が自分で見積る形は、その値に責任が伴う点で現場の支持を得やすい。しかしこの状況では、見積りを出す時点にその人たちがまだいない。加えてこの案は、他の3つと違って、置いた前提を見積りに添える締めくくりを持たない。シラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとしており、これは選んだ技法によらない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案を退けているのは、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる割合や傾向は取り出せないと判断した。という一点である。では記録が今回と同じ作りの案件のものに替わったらどうなるか ── 会員向けの仕組みと決済の両方を扱ってきた2名と、4週間に4回開ける会はそのまま残るので、人の判断から出す作り方も入力を失わず、最も妥当な案が2つになる。この案を唯一の答えにするには、記録の側を替えることに加えて、値を出せる2名か会の枠のどちらかが失われることが同時に要る。取り分を当てて出す手そのものは、シラバスがデータの可用性の例に比率による見積りを挙げているとおり、その傾向を取り出せる過去のデータがある場面の手である。","2":"この案を退けているのは、見積りの期待値やばらつきを数式で導ける要員は、社内にも協力会社にもいない。という一点である。では扱える要員を1名置いたらどうなるか ── 3つの値を出す2名も、4週間に4回開ける会もそのまま残るため、互いの根拠を示し合って1つの値に落ち着かせる作り方が同じように立ち、最も妥当な案が2つになる。楽観的推定値、悲観的推定値、および最も可能性の高い推定値から期待値と標準偏差を計算する三点見積りは、シラバスが見積り誤差とモデリングの知識の両方の例に挙げている手であり、扱える人がいて不確実性の幅を示す必要がある場面のものである。","3":"この案を退けている条件は2つある。1つは、実際に開発とテストを行う要員は、これから協力会社に依頼して集めるため、顔ぶれが決まるのは2か月後になる。という状況で、値を出す当の人が見積りを出す時点にいないことである。もう1つは、この案だけが置いた前提を見積りに添える締めくくりを持たないことで、シラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとしており、これは選んだ技法によらない。だから要員が先に確保されても、前提を添えない点はそのまま残るので、この案は外れたままである。仮にその2つを両方埋めたとしても、会員向けの仕組みと決済の両方を扱ってきた専任の2名も、4週間に4回開ける会も失われないので、その2名で値を落ち着かせる作り方が並び立つ。1つ条件を動かしても、2つ動かしても、この案が唯一の答えにはならない。作業をする人が単位ごとに値を出し合う進め方について、シラバスは専門家の可用性の例にプランニングポーカーを挙げ、専門家やチームメンバーの意見や判断に依存していると述べている。値を出す人が実際に作業をする人であることはこの進め方の眼目であり、その顔ぶれが見積りの時点で決まっている場面で成り立つ手である。"},"quote":"テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。…モデリングの知識：手法によっては，見積りを計算するために数学的モデルや数式を使用する要件があるため，モデリングに関するスキルや知識が必要になる場合がある．例えば、外挿や三点見積りは、見積りの期待値と標準偏差を導き出すために数式を使用する。…例えば、適切な見積り技法を選択するには、まず対象の複雑度を判断する。複雑度が低い場合は、メトリクスベースの技法を使用することができる。複雑度が高い場合は、専門家ベースの技法を使用できる。","ref":"2.2.3（データの可用性、専門家の可用性、モデリングの知識、複雑度による例示、前提条件の文書化）","misconception":"履歴の記録が社内に残っていれば数字から出す手が使えると考え、その記録から今回に当てはめられる取り分や傾向が取り出せるかを確かめない。また、人の判断を入力とする手を一括りにして、誰が値を出せるのか、その値をまとめる計算を誰が担うのかまでは見ない。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["社内に記録が残っていることと、当てる相手の工数枠が承認済みであることだけを見て、その記録からは今回に当てはめられる取り分や傾向が取り出せないという状況の判断を読み飛ばす","値を出せる技術者が2名いることで入力がそろったと考え、3つの値を1つの工数にまとめる計算を担える人がいないことを見落とす","作業をする人が自分で見積るのが筋だという考えから、その要員が見積りを出す時点にはまだ確保されていないことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-51","MP-108"]}},{"id":"q-2.2.3-D-3","lo":"TM-2.2.3","cluster":"2.2.3-D","variant":3,"chapter":2,"section":"2.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは、自治体向けの防災の仕組みを作る会社で、避難所の受け入れ状況を住民に知らせる新しいサービスのテストマネージャーである。避難所に置く端末、状況を集める通信、住民が見る地図の画面の3つにまたがる作りで、この形のサービスを世に出した経験は社内に無い。受注時の契約で、このサービスに充てる全体の工数は確定している。テスト工数の見積りは来月の着手判断の会に出す。\n\n洗い出した条件は次のとおりである。\n\n1. 社内の記録は庁内の文書管理システムの案件ばかりで、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる取り分や傾向は取り出せないと判断した。\n2. 端末と地図の画面の両方を扱ってきた技術者4名が、今回のサービスに専任で入っている。\n3. この4名が顔を合わせる会は、着手判断の会までの4週間に2回開ける。\n4. 実際に開発とテストを行う要員は協力会社から集めるため、顔ぶれが決まるのは3か月後になる。\n5. 見積りの期待値や標準偏差を数式で導ける要員は、社内にも協力会社にもいない。\n6. 社員食堂の運営会社は、来年度から変わる。","question":"この状況で、着手判断の会に出すテスト工数の見積りの作り方として最も適切なものを1つ選べ。","choices":["専任の技術者4名に、4週間で2回の会を通じて各自の見立てと根拠を突き合わせてもらい、開きが埋まったところで定まった値をテスト工数とし、置いた前提を見積りに添える。","専任の技術者4名から、各自が順調に運んだ場合と難航した場合と最も見込まれる場合として置く3つの値を集め、そこから期待値と標準偏差を求めて幅の付いたテスト工数とし、置いた前提を見積りに添える。","庁内の文書管理システムの案件で工程ごとに残っている工数からテストの取り分を割り出し、契約で確定している全体の工数にそれを当てた値をテスト工数とし、置いた前提を見積りに添える。","協力会社から集める予定の開発とテストの担当者が、機能ごとに各自の値を同時に示し合い、開きが無くなるまで出し直して積んだ合計をテスト工数とする。"],"answer":[0],"explanation":{"signals":"効くのは、今回の対象について値を出せる人が来月までに手元にあるか、そして数字の側の入力がどこまで使えるかである。社内の記録は庁内の文書管理システムの案件ばかりで、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる取り分や傾向は取り出せないと判断した。記録そのものはあるが、今回の取り分を導き出す元としては使えない。対象の側は、避難所に置く端末、状況を集める通信、住民が見る地図の画面の3つにまたがる作りで、この形のサービスを世に出した経験は社内に無い。人の側は分かれている。端末と地図の画面の両方を扱ってきた技術者4名が、今回のサービスに専任で入っている。この4名が顔を合わせる会は、着手判断の会までの4週間に2回開ける。これに対して、実際に開発とテストを行う要員は協力会社から集めるため、顔ぶれが決まるのは3か月後になる。見積りを出す時点には、その人たちはいない。数式の側も塞がっており、見積りの期待値や標準偏差を数式で導ける要員は、社内にも協力会社にもいない。契約で確定している全体の工数は、取り分を当てる相手としては使えるが、当てる取り分のほうを与えはしない。来年度から変わる社員食堂の運営会社は、どの作り方を選ぶかには関わらない。","why":"専任の技術者4名に、4週間で2回の会を通じて各自の見立てと根拠を突き合わせてもらい、開きが埋まったところで定まった値を工数として、置いた前提を添えて出す ── これが着手判断の会に持っていける作り方である。そう選ばせているのは、この手が求める2つの入力がどちらも条件の中にあることである。\n知識と経験を持つ人については、端末と地図の画面の両方を扱ってきた技術者4名が、今回のサービスに専任で入っている。値を寄せるための場についても、この4名が顔を合わせる会は、着手判断の会までの4週間に2回開ける。\nシラバスは専門家の可用性を見積り技法の選択を左右する要因に挙げ、手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもあるとし、例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存していると述べている。ここでは、その要件を満たせる人がいる。あわせてシラバスは、適切な見積り技法を選択するにはまず対象の複雑度を判断するという例を挙げ、複雑度が低い場合はメトリクスベースの技法を、複雑度が高い場合は専門家ベースの技法を使用できるとしている。3つにまたがり社内に前例が無い今回の対象は、この例で言えば後者の側にある。\n数字の側が使えないことも同じ方向に働く。シラバスはデータの可用性について、手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合があると述べている。ここでは記録そのものは残っているが、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる取り分や傾向は取り出せないと判断した。つまり、入手できない場合と並べて挙げられている側にある。\n締めくくりの前提にも根拠がある。テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとされている。定まった値がどの4名の判断に拠るものかを添えておけば、構成や範囲が変わったときに、どの前提が崩れたから見積りを直すのかを示せる。","distractors":[null,"この案は、3つの値から期待値と標準偏差を求める計算を前提にしている。ところが見積りの期待値や標準偏差を数式で導ける要員は、社内にも協力会社にもいない。シラバスはモデリングの知識も技法選択を左右する要因に挙げ、手法によっては、見積りを計算するために数学的モデルや数式を使用する要件があるため、モデリングに関するスキルや知識が必要になる場合があるとし、その例として外挿や三点見積りを挙げている。3つの値を出せる専任の技術者が4名いるので入力はそろって見えるうえ、前例の無い対象では幅を添えて示したいという考えにも理があり、置いた前提を添える締めくくりも正しい。しかし、その3つの値を1つの工数にまとめる計算を担える人が手元にいない。","この案は、社内の記録から今回に当てはめられる取り分を割り出せることを前提にしている。ところが条件には、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる取り分や傾向は取り出せないと判断した。とある。シラバスは、過去のプロジェクトや類似プロジェクトの履歴データを要件とする手法があるとしたうえで、これらのデータが入手できない、または信頼できない場合があると述べている。ここで欠けているのは記録の有無ではなく、その記録から今回に当てはめられる取り分を割り出せるかである。この案が有力に見えるのは、取り分を当てる相手にあたる全体の工数が契約で確定しており、置いた前提を添える締めくくりも正しいからである。足りないのは当てる相手ではなく、当てる取り分の根拠のほうである。","この進め方は、値を出す人が実際に作業をする人であることを眼目にしている。ところが実際に開発とテストを行う要員は協力会社から集めるため、顔ぶれが決まるのは3か月後になる。見積りを出す着手判断の会は来月である。シラバスも専門家の可用性の例にプランニングポーカーを挙げ、専門家やチームメンバーの意見や判断に依存していると述べている。作業する人が自分で見積る形は、その値に責任が伴う点で現場の支持を得やすい。しかしこの状況では、見積りを出す時点にその人たちがまだいない。加えてこの案は、他の3つと違って、置いた前提を見積りに添える締めくくりを持たない。シラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとしており、これは選んだ技法によらない。"],"flip":[null,null,null,null],"flipNote":{"2":"この案を退けているのは、見積りの期待値や標準偏差を数式で導ける要員は、社内にも協力会社にもいない。という一点である。では扱える要員を1名置いたらどうなるか ── 3つの値を出す4名も、4週間に2回開ける会もそのまま残るため、各自の根拠を突き合わせて1つの値に定める作り方が同じように立ち、最も適切な案が2つになる。楽観的推定値、悲観的推定値、および最も可能性の高い推定値から期待値と標準偏差を計算する三点見積りは、シラバスが見積り誤差とモデリングの知識の両方の例に挙げている手であり、扱える人がいて不確実性の幅を示す必要がある場面のものである。","3":"この案を退けているのは、工程ごとの工数は残っているが、今回とは作りが違うため、今回に当てはめられる取り分や傾向は取り出せないと判断した。という一点である。では記録が今回と同じ作りの案件のものに替わったらどうなるか ── 端末と地図の画面の両方を扱ってきた4名と、4週間に2回開ける会はそのまま残るので、人の判断から出す作り方も入力を失わず、最も適切な案が2つになる。この案を唯一の答えにするには、記録の側を替えることに加えて、値を出せる4名か会の枠のどちらかが失われることが同時に要る。取り分を当てて出す手そのものは、シラバスがデータの可用性の例に比率による見積りを挙げているとおり、その傾向を取り出せる過去のデータがある場面の手である。","4":"この案を退けている条件は2つある。1つは、実際に開発とテストを行う要員は協力会社から集めるため、顔ぶれが決まるのは3か月後になる。という条件で、値を出す当の人が見積りを出す時点にいないことである。もう1つは、この案だけが置いた前提を見積りに添える締めくくりを持たないことで、シラバスは、テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきであるとしており、これは選んだ技法によらない。だから要員が先に確保されても、前提を添えない点はそのまま残るので、この案は外れたままである。仮にその2つを両方埋めたとしても、端末と地図の画面の両方を扱ってきた専任の4名も、4週間に2回開ける会も失われないので、その4名で値を定める作り方が並び立つ。1つ条件を動かしても、2つ動かしても、この案が唯一の答えにはならない。作業をする人が単位ごとに値を出し合う進め方について、シラバスは専門家の可用性の例にプランニングポーカーを挙げ、専門家やチームメンバーの意見や判断に依存していると述べている。値を出す人が実際に作業をする人であることはこの進め方の眼目であり、その顔ぶれが見積りの時点で決まっている場面で成り立つ手である。"},"quote":"テスト見積りにおける前提条件は、常に見積りの一部として文書化すべきである。…データの可用性：手法によっては、過去のプロジェクトや類似プロジェクトの履歴データを要件とするものがあるが、これらのデータが入手できない、または信頼できない場合がある。…専門家の可用性：手法によっては、正確で現実的な見積りを提供するための知識と経験を持つ専門家の関与が要件となるものもある。例えば、デルファイ法やプランニングポーカーは、専門家やチームメンバーの意見や判断に依存している。…モデリングの知識：手法によっては，見積りを計算するために数学的モデルや数式を使用する要件があるため，モデリングに関するスキルや知識が必要になる場合がある．例えば、外挿や三点見積りは、見積りの期待値と標準偏差を導き出すために数式を使用する。…例えば、適切な見積り技法を選択するには、まず対象の複雑度を判断する。複雑度が低い場合は、メトリクスベースの技法を使用することができる。複雑度が高い場合は、専門家ベースの技法を使用できる。","ref":"2.2.3（データの可用性、専門家の可用性、モデリングの知識、複雑度による例示、前提条件の文書化）","misconception":"履歴の記録が社内に残っていれば数字から出す手が使えると考え、その記録から今回に当てはめられる取り分や傾向が取り出せるかを確かめない。また、人の判断を入力とする手を一括りにして、誰が値を出せるのか、その値をまとめる計算を誰が担うのかまでは見ない。"},"meta":{"concept":"テスト見積り技法の選択","distractorIntent":["値を出せる技術者が4名いることで入力がそろったと考え、3つの値を1つの工数にまとめる計算を担える人がいないことを見落とす","社内に記録が残っていることと、当てる相手の工数が契約で確定していることだけを見て、その記録からは今回に当てはめられる取り分や傾向が割り出せないという条件を読み飛ばす","作業をする人が自分で見積るのが筋だという考えから、その要員が見積りを出す時点にはまだ確保されていないことを見落とす"],"distractorTypes":["D2b","D2b","D2b"],"conceptNote":"jstqb-al-tm/kb/concepts/test-estimation-technique-selection.md","mistakePatterns":["MP-51","MP-108"]}},{"id":"q-2.3.1-A-1","lo":"TM-2.3.1","cluster":"2.3.1-A","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"業務用複合機の組込みソフトウェアを開発している。コンポーネントの実装はテスト駆動開発で進めており、開発者は実装より先に自動コンポーネントテストを書く。\n\n社内の欠陥報告規程は次の3つである。\n(1) (3)に当たる場合を除き、実際の結果が期待する結果と違うことを確認したら、原因の切り分けが済んでいなくても欠陥レポートを作成する。テスト環境やテストケースの側に原因があると後で分かったときは、理由を選んで却下へ移す。\n(2) すでに登録されている欠陥と同じ現象は、新しいレポートを作らずそのレポートを更新する。確認テストで同じ現象が再現したときは、そのレポートを再オープンする。\n(3) 例外はこれだけである。テスト駆動開発として書いた自動コンポーネントテストが、対応する機能の実装が終わる前に不合格になるものは、レポートを作成せず開発タスクの中で扱う。","question":"この規程を適用したとき、欠陥レポートによって追跡しないのはどれか。1つ選べ。","choices":["結合テストで用紙サイズの判定が誤った。調べるとテスト環境の給紙センサーの設定が本番機と違っており、製品側の問題ではない可能性が高い。","給紙元を選ぶ処理は、開発者がテストを先に書いて実装を進めている途中である。判定はまだ書かれておらず、この自動コンポーネントテストは不合格のままである。","解決へ移された用紙詰まりの誤検知について、テスト担当者が確認テストを実施したところ、同じ誤検知が再現した。","トナー残量の換算処理は先週実装を終えて結合済みである。今朝の自動コンポーネントテストの一括実行で、この換算処理のテストが1本不合格になり、以後の実行でも不合格が続いている。"],"answer":[1],"explanation":{"signals":"規程(3)が例外に置いている2つの条件 ── テスト駆動開発として書いた自動コンポーネントテストであること、対応する機能の実装が終わる前の不合格であること ── が、状況ごとにそろっているかを見る。規程(1)は、原因の切り分けが済んでいなくても欠陥レポートを作成するとし、テスト環境やテストケースの側に原因があると後で分かったときの行き先を却下と定めている。規程(2)は、確認テストで同じ現象が再現したときはそのレポートを再オープンすると定めている。どちらの道もレポートの上を通るので、切り分けの結果が環境だったことも、確認テストで再現したことも、欠陥レポートで追跡するかどうかを変えない。不合格が繰り返し出ているか一度きりかは、規程のどの条にも現れない。","why":"追跡しないのは、給紙元を選ぶ処理のように、開発者がテストを先に書いて実装を進めている途中で、判定がまだ書かれていないために不合格のままになっている自動コンポーネントテストである。規程(3)が例外として書いているのは、テスト駆動開発として書いた自動コンポーネントテストであることと、対応する機能の実装が終わる前の不合格であることの両方がそろう場合で、この状況はその両方を満たす。だから欠陥レポートは作らず、開発タスクの中で扱う。規程(3)はシラバスの記述を社内の規則に写したものである。シラバスは、テストが不合格だとしても欠陥レポートが作成されるとは限らないと述べ、その例としてテスト駆動開発を挙げて、そこでは通常、自動化されたコンポーネントテストが実行可能な設計仕様書の一形態として使用されるとしている。そのうえで、コンポーネントの開発が完了するまではテストの一部または全部を最初は不合格にしなければならず、このようなテスト結果は必ずしも欠陥が原因とは限らないため、通常、欠陥レポートによって追跡されることはない、と続けている。テストが実装に先立つ仕様の形で置かれている以上、不合格であることは欠陥の表れではなく、実装がまだ済んでいないことの表れだ、という筋である。規程(1)と(2)が扱う道は、却下へ移す場合も再オープンする場合も、いずれも欠陥レポートの上で進む。","distractors":["この不一致は規程(1)の本線に乗る。原因の切り分けが済んでいなくても欠陥レポートを作成するのが(1)であり、テスト環境やテストケースの側に原因があると後で分かったときの行き先も、理由を選んで却下へ移す、と書かれている。切り分けの結果が給紙センサーの設定だったことは、レポートを作らない理由ではなく、作ったレポートに付ける却下の理由である。製品側の問題でないと見えている以上、欠陥の一覧に載せるのは筋違いで、環境を直せば済む ── 現場ではよくある読み方だが、規程はその1件も一度はレポートに載せて追跡する。規程(3)の例外は自動コンポーネントテストについてのものなので、結合テストで観測されたこの不一致には掛からない",null,"新しいレポートを作らないことと、レポートの外で扱うことは別である。用紙詰まりの誤検知が確認テストで再現した以上、規程(2)の後段 ── 確認テストで同じ現象が再現したときはそのレポートを再オープンする ── が働き、この再現は既存のレポートの状態を動かす形で扱われる。つまり追跡はレポートの上で続いており、設問が問うているのは欠陥レポートによって追跡するかどうかである。欠陥レポートは1つの故障につき1つで、そのレポートはすでにあるのだから、確認テストの結果はテスト実行の記録に書けばよい ── そう考えると、新規に作らないことを追跡しないことと重ねてしまう","規程(3)の例外は、テスト駆動開発として書いた自動コンポーネントテストであることだけでは成立しない。対応する機能の実装が終わる前の不合格であることをあわせて要求しており、この換算処理は先週実装を終えて結合済みで、実装が終わった後の不合格である。実装を終えたコンポーネントのテストが不合格になったことは、設計仕様としてのテストが実装に先行している状態ではなく、通常の不一致であって、規程(1)により欠陥レポートを作成する。自動コンポーネントテストの不合格は開発チームの中で片づく話で、欠陥レポートは結合以降のテストが使うものだ、と覚えていると選ぶ。以後の実行でも不合格が続いていることも、例外の条件とは関係しない"],"flip":[null,null,null,null],"quote":"テストが不合格だとしても、欠陥レポートが作成されるとは限らない。（例えば、テスト駆動開発では、通常自動化されたコンポーネントテストが、実行可能な設計仕様書の一形態として使用される）。コンポーネントの開発が完了するまでは、テストの一部または全部を、最初は不合格にしなければならない。したがって、このようなテスト結果は、必ずしも欠陥が原因とは限らず、通常、欠陥レポートによって追跡されることはない。","ref":"2.3.1","misconception":"「欠陥レポートを作らない」場合を、却下されそうなもの・自動コンポーネントテストの不合格・すでにレポートがあるものにまで広げてしまう。規程が例外としているのは、テスト駆動開発として書いた自動コンポーネントテストが、対応する機能の実装が終わる前に不合格になる場合だけである","flipNote":{"1":"規程(3)の例外を、調べた結果として製品側の問題ではないと判断したものを環境課題の一覧で扱う形に差し替えれば、この不一致はレポートの外に出る。ただし差し替えた世界では、例外から外れたテスト駆動開発の自動コンポーネントテストの実装が終わる前の不合格が規程(1)に回り、欠陥レポートを作る側になる。それは、コンポーネントの開発が完了するまではテストの一部または全部を最初は不合格にしなければならず、そのような結果は必ずしも欠陥が原因とは限らない、という規程(3)が写している原文を裏返すことであり、受験者が動かせる条件ではない。差し替えた例外は規程(1)の後段とも食い違う。テスト環境やテストケースの側に原因があると後で分かったときの行き先を、理由を選んで却下へ移すことだと後段が定めており、却下はレポートの上の状態だからである。差し替えても、この不一致はレポートを作らない場合と理由を選んで却下へ移す場合の両方に当たり、どちらとも決まらない。この不一致が置かれているのは、切り分けの結果として却下の理由のどれを選ぶかという話であって、欠陥レポートを作るか作らないかという話ではない","3":"確認テストでの再現を再オープンと定めている規程(2)の後段を、実行の結果報告の中で扱う形に変えれば、この再現は欠陥レポートの外に出る。ただしその世界でも、実装が終わる前に不合格になっているテスト駆動開発の自動コンポーネントテストは規程(3)の例外に当たったままなので、追跡しないものが2つになり、1つ選べが成り立たない。規程(3)の例外そのものをこの再現の場合に置き換えれば1つに絞れるが、今度は再オープンを定める規程(2)と食い違う。この再現が置かれているのは、確認テストで同じ現象が出たレポートをどう動かすかという話であって、レポートを作るか作らないかという話ではない","4":"この状況は、規程(3)の例外が要求する2つの条件のうち、テスト駆動開発として書いた自動コンポーネントテストであることは満たし、対応する機能の実装が終わる前の不合格であることだけを満たしていない。実装が終わる前という条件を外して例外を実装後の不合格まで広げると、実装前の不合格も例外のままなので、追跡しないものが2つになる。例外を実装後の不合格だけに限れば1つに絞れるが、それは規程(3)が写している原文 ── コンポーネントの開発が完了するまではテストの一部または全部を最初は不合格にしなければならず、そのような結果は必ずしも欠陥が原因とは限らない ── を裏返すことであり、受験者が動かせる条件ではない"}},"meta":{"concept":"欠陥マネジメントの実装","distractorIntent":["原因が製品ではなく環境にあると切り分けたことを、レポートを作らない理由として扱う（規程が定める行き先は却下であって不作成ではない）","テスト駆動開発の例外を、自動コンポーネントテスト一般と実装完了後の不合格にまで広げる","新規のレポートを作らないことと、欠陥レポートの外で追跡することを同一視する"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-72","MP-73","MP-74"]}},{"id":"q-2.3.1-A-2","lo":"TM-2.3.1","cluster":"2.3.1-B","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"全社共通の欠陥ワークフローを見直している。いまの状態はオープン、進行中、却下、解決、クローズの5つで、欠陥はオープンから始まり、進行中で分析と修正を行い、済むと解決へ移して確認テストを行う。\n\nここに2つ足す。明確化は、報告の内容だけでは分析を始められず、報告者に追加の情報を求めている状態。受け入れは、分析の結果として直すと決まったが、まだ修正に着手していない状態である。\n\n追加にあたっての規則は次の4つである。\n(1) 明確化へ移してよいのは、オープンまたは進行中の欠陥である。報告者から回答が得られた欠陥は進行中へ移す。\n(2) 受け入れへ移してよいのは、進行中で分析を終えた欠陥である。受け入れの欠陥は、修正に着手するときに進行中へ移す。\n(3) 終端ステータスはクローズだけとする。\n(4) ここに挙げた遷移だけを認め、他は追加しない。","question":"2つの状態を足す遷移の設計として、4つの規則をすべて満たすのはどれか。1つ選べ。","choices":["オープン→明確化、進行中→明確化、明確化→進行中、進行中→受け入れ、受け入れ→進行中。情報が足りない報告は明確化へ送り、分析を終えて直すと決まった欠陥は受け入れで待たせる。","進行中→明確化、明確化→進行中、明確化→却下、進行中→受け入れ、受け入れ→解決。回答が返ってこない報告は明確化から却下へ落とし、直し終えた欠陥は受け入れから解決へ送る。","オープン→明確化、明確化→進行中、進行中→受け入れ、受け入れ→クローズ、クローズ→明確化。分析の結果として直さないと決めた欠陥は受け入れからクローズし、異議が出たものはクローズから明確化へ戻す。","却下→明確化、明確化→進行中、オープン→受け入れ、進行中→受け入れ、受け入れ→進行中。却下に異議のある報告は明確化へ送り、報告の時点で直すと決まった欠陥はオープンから受け入れへ送る。"],"answer":[0],"explanation":{"signals":"規則(1)は明確化の入口をオープンと進行中に限り、出口を進行中と定めている。規則(2)は受け入れの入口を進行中で分析を終えた欠陥に限り、出口を進行中と定めている。規則(3)は終端をクローズだけとしており、クローズから出ていく線を1本でも引けば、クローズは終端ではなくなる。そして規則(4)が、認める遷移を(1)から(3)の挙げたものに閉じているので、禁止の文が無いことは線を足してよい理由にならない。2つの状態の定義文も同じ働きをする ── 明確化は報告の内容だけでは分析を始められず報告者に追加の情報を求めている状態、受け入れは分析の結果として直すと決まったがまだ修正に着手していない状態で、どちらも入口の条件を言い直している。","why":"4つの規則をすべて満たすのは、明確化への入口をオープンと進行中に取り、明確化からは進行中へ戻し、受け入れへは進行中から入って受け入れからも進行中へ戻す設計である。この5本はどれも規則(1)と規則(2)が名指しした遷移そのもので、規則の挙げていない線を1本も足していないから規則(4)にも掛からず、クローズから出ていく線が無いので、終端をクローズだけとする規則(3)も保たれる。1本ずつ当てるとこうなる。オープン→明確化と進行中→明確化は、明確化へ移してよいのはオープンまたは進行中の欠陥だという規則(1)の入口である。明確化→進行中は、報告者から回答が得られた欠陥は進行中へ移すという規則(1)の後段。進行中→受け入れは、受け入れへ移してよいのは進行中で分析を終えた欠陥だという規則(2)の入口で、受け入れ→進行中は、受け入れの欠陥は修正に着手するときに進行中へ移すというその後段である。遷移のルールをここまで本文が書き出しているのは、シラバスが与えていないからである。シラバスは、単純な欠陥ワークフローが、与えられたコンテキストに関連する他の欠陥状態（再オープン・受け入れ・明確化・見送りが例として挙がる）を使用することによって拡張されると述べるが、拡張した状態の遷移のルールまでは定めておらず、欠陥ワークフローは欠陥ステータスの名称、欠陥ステータス間の遷移のルール、特定の欠陥ステータスのタスクに責任を持つ役割という点で、組織によって異なる場合があるとしている。だから照合の相手になるのは、本文の4つの規則と2つの定義である。シラバスが示すのは設計の作法のほうで、1つの終端ステータスのみを使用することを推奨し、終端ステータスを除く各欠陥ステータスには1つ以上の遷移先を持つべきであるとしている。この設計では明確化にも受け入れにも遷移先があり、その作法にも沿う。","distractors":[null,"規則が挙げていない線が2本入っている。明確化から却下への線は、規則(1)が明確化について書いている行き先 ── 報告者から回答が得られた欠陥は進行中へ移す ── のどこにも無い。受け入れから解決への線も、受け入れの欠陥は修正に着手するときに進行中へ移すという規則(2)の後段と違う行き先である。受け入れは、分析の結果として直すと決まったが、まだ修正に着手していない状態と定義されているのだから、修正が済んだことを表す解決へ直接進むこともできない。規則(4)が認める遷移をここに挙げたものだけに閉じている以上、禁止の文が無いことは線を引いてよい理由にならない。回答が返ってこない報告をいつまでも明確化に置くわけにいかず無効な情報として却下する、直し終えた欠陥を解決へ送る ── どちらも実務の流れとしては自然に見える","受け入れからクローズへ抜ける線と、クローズから明確化へ戻る線が、規則に当たっている。規則(2)が受け入れについて書いている行き先は、修正に着手するときに進行中へ移す、であってクローズではない。そしてクローズ→明確化は、規則(1)が明確化の入口として挙げるオープンにも進行中にもクローズが入っていないうえ、終端ステータスはクローズだけとする規則(3)にも反する ── ある状態から出ていく線を引けば、その状態はそこで終わらない状態になり、終端ではなくなるからである。修正しないという結論も終結の一種なのだからクローズへ直行させたくなるし、異議が出たものを戻す道を用意するのは閉じたまま放置しない工夫として説得力があるが、規則はどちらも挙げていない","明確化と受け入れの入口が、規則の挙げた状態の外へ広がっている。規則(1)が明確化へ移してよいとしているのはオープンまたは進行中の欠陥で、却下はそこに入っていない。規則(2)が受け入れへ移してよいとしているのは進行中で分析を終えた欠陥なので、オープンから直接送ることもできない。受け入れの定義も、分析の結果として直すと決まった状態、と分析を経ることを述べている。却下に納得しない報告者から追加の情報が出てくることはあり、報告の時点で直すと決まっている欠陥を分析の手間をかけずに待たせるのも待ち時間を減らす工夫に見えるが、規則はその2本を挙げていない"],"flip":[null,null,null,null],"quote":"単純な欠陥ワークフローは、多くの組織で使用され、与えられたコンテキストに関連する他の欠陥状態（例えば、再オープン、受け入れ、明確化、見送り）を使用することによって拡張される。…欠陥ワークフローは、欠陥ステータスの名称、欠陥ステータス間の遷移のルール、特定の欠陥ステータスのタスクに責任を持つ役割という点で、組織によって異なる場合がある。…1 つの終端ステータス（例えば、クローズ）のみを使用することを推奨する。…終端ステータスを除く各欠陥ステータスには、次のステップに関して責任を持つ役割が判断できるように、1 つ以上の遷移先を持つべきである。","ref":"2.3.1","misconception":"列挙された遷移の規則を開いた集合として読み、禁止の文が無い線は引いてよいと考える。また状態の定義文を説明とみなして照合に使わず、終端に指定した状態から出ていく線を引いてしまう","flipNote":{"2":"この設計には、規則が挙げていない線が2本ある。明確化→却下と、受け入れ→解決である。片方を認める形に規則を書き換えても、もう片方が規則(4)に掛かって外れたままになる。両方を認めるには規則(1)の後段と規則(2)の後段を同時に書き換えることになり、条件を1つ動かした結果ではない。この設計が寄りかかっているのは、規則に書かれていない行き先でも実務の流れに合えば引いてよい、という読み方である","3":"この設計は、受け入れ→クローズが規則(2)の定める行き先と違う点と、クローズ→明確化が明確化の入口と終端の両方に掛かる点で外れている。クローズは、規則(1)が明確化の入口として挙げるオープンにも進行中にも入っていない。さらにクローズから出ていく線を引けば、クローズはそこで終わらない状態になるので、終端をクローズだけとする規則(3)にも反する。つまりこの1本だけで2つの規則に当たっており、受け入れの行き先を広げる書き換えを足しても、明確化の入口を広げる書き換えを足しても、残りの規則で外れたままである。4つの規則を満たす形にするには、受け入れの行き先・明確化の入口・終端の定めの3か所、すなわち規則(1)(2)(3)を同時に動かすことになり、条件を1つ動かした結果ではない。この設計が寄りかかっているのは、修正しないという結論はクローズへ直行させてよく、閉じたものにも戻り道を用意してよい、という読み方である","4":"この設計は、却下→明確化が規則(1)の挙げる明確化の入口（オープンと進行中）に無い点と、オープン→受け入れが規則(2)の挙げる受け入れの入口（進行中で分析を終えた欠陥）に無い点の、2つで外れている。片方だけを広げても、もう片方が残る。両方を広げる形に規則(1)と規則(2)を書き換えると、規則の挙げた入口と復帰先だけで組んだ設計もそのまま4つの規則を満たすため、すべてを満たすものが2つになる"}},"meta":{"concept":"欠陥マネジメントの実装","distractorIntent":["規則が挙げていない出口（明確化から却下）を、禁止されていないから引いてよいと読み、あわせて受け入れの復帰先を解決に取り違える","修正しないという結論を終端へ直行させ、さらに終端に指定した状態から戻る道を引いて、終端をクローズだけとする規則を崩す","明確化と受け入れの入口を、規則が挙げた状態の外（却下・オープン）へ広げ、受け入れが分析を経た後の状態であるという定義を飛ばす"],"distractorTypes":["D11","D11","D11"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-75","MP-77","MP-78"]}},{"id":"q-2.3.1-A-3","lo":"TM-2.3.1","cluster":"2.3.1-C","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"損害保険の保険金支払システムを開発している。欠陥ワークフローの状態ごとに、タスク・担当する役割・移せる先を次のように決めた。\n・オープン：内容を確かめ、割り当て先を決める。担当はテストリーダーで、決まると進行中へ移す。\n・進行中：分析と修正を行う。担当は開発担当者で、修正を終えるとこの人が解決へ移す。\n・解決：確認テストを行う。担当はテスト担当者で、故障が再び現れるとこの人が進行中へ移す。\n・却下：却下の理由を記録する。担当は開発リーダーで、オープンまたは進行中の欠陥を、内容を処理したこの人が移す。\n・クローズ：終端で、タスクは置かない。確認テストの成功、または報告者が却下を受け入れたことを終結の理由に選び、テスト担当者が移す。\nほかに2つ。(1) 隣り合う2つの状態は別の役割が担当する。同じ役割が続けて担当するときは理由を定義書に残す。(2) ここに書いた担当と移し先だけを認める。","question":"この取り決めに沿った操作はどれか。1つ選べ。","choices":["進行中の欠陥を分析した開発担当者が、報告された手順では現象が起きず、調べるのに足りる情報も付いていないと判断し、その理由を記録して却下へ移した。","修正を終えた開発担当者が、続けて自分で確認テストを行い、故障が現れないことを確かめたうえで、終結の理由に確認テストの成功を選んでクローズへ移した。","解決にある欠陥について、テスト担当者が確認テストを行ったところ同じ故障が再び現れたので、テスト担当者がこの欠陥を進行中へ移した。","却下された欠陥について、報告したテスト担当者が理由に納得しなかったため、テストリーダーが内容を見直したうえで、この欠陥を進行中へ移した。"],"answer":[2],"explanation":{"signals":"却下へ移すのは、オープンまたは進行中の欠陥について内容を処理した開発リーダーだと決めてある。クローズへ移すのはテスト担当者で、確認テストの成功か、報告者が却下を受け入れたことを終結の理由に選ぶ。隣り合う2つの状態は別の役割が担当し、同じ役割が続けて担当するならその理由を定義書に残す。そして、ここに書いた担当と移し先だけを認める。移し先としては解決から進行中へ戻す道が書かれている一方、却下から先に書かれているのは、報告者が却下を受け入れたことを終結の理由にテスト担当者がクローズへ移す道だけで、進行中へ戻る道は書かれていない。誰の役職が上か、判断の中身がもっともらしいかは、この取り決めのどの行にも現れない。","why":"解決にある欠陥をテスト担当者が確認テストにかけ、同じ故障が再び現れたのでその人が進行中へ移す ── これが取り決めのとおりの操作である。解決の行は、タスクを確認テスト、担当をテスト担当者とし、故障が再び現れるとこの人が進行中へ移す、と書いている。担当も移し先もその行のままであり、隣り合う解決と進行中の担当はテスト担当者と開発担当者で別だから、同じ役割が続けて担当するときに求められる定義書への理由の記録も要らない。どの状態のタスクを誰が担い、誰がどの遷移を実行できるかは、組織が決めることである。シラバスは、欠陥ワークフローが、欠陥ステータスの名称、欠陥ステータス間の遷移のルール、特定の欠陥ステータスのタスクに責任を持つ役割という点で、組織によって異なる場合があると述べており、役割はその3点目に当たる。シラバスは役割と遷移の対応表までは与えていないので、この組織はそれを本文に書き出した。照合の相手はその取り決めである。取り決めの中身自体はシラバスの述べるところに沿って作られている。シラバスは、これらの状態のほとんどにおいて1人が欠陥レポートを所有し、分析・欠陥除去・確認テストといったタスクの実行を担当するとし、解決については、テスト担当者が、修正によって欠陥が本当に解決されたかどうかを判断するために、欠陥レポートに記載された欠陥の再現手順にしたがって確認テストを実施するとしている。連続する欠陥ステータスは異なる責任を持つ役割に割り当てるべきで、同じ役割に割り当てるなら正当な理由があるべきだ、という記述も、取り決めの(1)に写されている。","distractors":["却下へ移す役が違う。この組織は却下の担当を開発リーダーと決め、オープンまたは進行中の欠陥を、内容を処理したこの人が移すと書き、そのうえで書いた担当と移し先だけを認めている。分析した本人が事情をいちばんよく分かっているのだから、そのまま却下まで進めるのが速い、という運びは実際によく見られるし、シラバスも却下について、欠陥レポートはそれを処理した人（通常は開発者やアナリスト）が却下していると述べているので、開発担当者が却下を行うこと自体が一般に誤りだというわけではない。しかし役割の割り当ては、シラバスが組織によって異なる点として名指ししているところであり、ここでは書き出された取り決めが照合の相手になる。理由を記録したこと自体は取り決めに反していない","クローズへ移すのはテスト担当者だと書かれており、開発担当者はこの遷移を行えない。加えて確認テストは解決の状態のタスクで、その担当もテスト担当者である。修正を終えた開発担当者が続けて確認テストまで行えば、隣り合う進行中と解決を同じ役割が続けて担当することになり、そのときに求められる定義書への理由の記録も無い。引き継ぎの待ちが無くなり、直した本人がその場で確かめられるのだから速い、という案は改善の提案として実際に出てくるが、この取り決めは担当と移し先を、書いたものだけに限っている",null,"却下から進行中へ戻る道が、取り決めに書かれていない。却下に関わる移し先として書かれているのは、オープンまたは進行中の欠陥を開発リーダーが却下へ移す道と、報告者が却下を受け入れたことを終結の理由にテスト担当者がクローズへ移す道である。書いた担当と移し先だけを認めるとしている以上、禁じる文が無いことは、その遷移を引いてよい理由にならない。テストリーダーに割り当てられているのはオープンの状態であって、却下された欠陥を動かす役ではない。却下に異議が出たときの戻り道は要るというのはもっともな見方で、内容を見直してから戻すのは手続きとしても丁寧に見えるが、その道はこの取り決めに無い"],"flip":[null,null,null,null],"quote":"これらの状態のほとんどにおいて、1 人が欠陥レポートを所有し、タスク（例えば、分析、欠陥除去、確認テスト）の実行を担当する。…欠陥ワークフローは、欠陥ステータスの名称、欠陥ステータス間の遷移のルール、特定の欠陥ステータスのタスクに責任を持つ役割という点で、組織によって異なる場合がある。…連続する欠陥ステータスは、異なる責任を持つ役割に割り当てるべきである。連続する2 つ以上のステータスを同じ責任を持つ役割に割り当てる場合は、正当な理由があるべきである（例えば、欠陥ステータスに費やされた時間を測定するため）。","ref":"2.3.1","misconception":"誰がどの状態を担当し、どの遷移を実行できるかを、役職の上下や手際の良さで決めてよいと考える。欠陥ワークフローで組織が決めるのはステータスの名称・遷移のルール・タスクに責任を持つ役割であり、書き出された割り当てに反する操作は、実務として自然に見えても取り決めに沿っていない","flipNote":{"1":"却下の担当を開発リーダーから開発担当者へ置き換えても、この操作は取り決めに沿わない。置き換えた世界では、隣り合う進行中と却下を開発担当者が続けて担当することになり、同じ役割が続けて担当するときに取り決め(1)が求める定義書への理由の記録が、そこに無いからである。この操作で記録されたのは却下の理由であって、続けて担当することの理由ではない。当てはめ直しても、取り決めのとおりに運んだ操作は、解決で確認テストを行い同じ故障が再び現れたのでテスト担当者が進行中へ移すものである。沿わせるには、担当の置き換えに加えて、続けて担当する理由を定義書に残すことまで要る。この操作が寄りかかっているのは、却下を誰が行うかという役割の割り当てであり、それはステータスの名称・ステータス間の遷移のルールと並んで、組織によって異なる点としてシラバスが挙げている3つ目である","2":"この操作は、独立した2つの行に当たっている。クローズへ移すのはテスト担当者だという行と、隣り合う2つの状態は別の役割が担当し、同じ役割が続けて担当するなら理由を定義書に残すという行である。クローズへ移せる役割を広げても、進行中と解決を同じ役割が続けて担当しながら理由の記録が無い点は残る。逆に連続する担当についての条件だけを緩めても、クローズへ移すのはテスト担当者だという行が残る。片方を動かしても、もう片方が同じ理由でこの操作を退ける","4":"却下から進行中へ戻る道を取り決めに書き足しても、テストリーダーが移したこの操作は沿わないままである。取り決めは遷移ごとに、それを実行する人を名指ししている。却下の行に書かれているのは、オープンまたは進行中の欠陥を、内容を処理した開発リーダーが却下へ移すという入口だけで、却下から出る先は1本も書かれていない。却下から出る唯一の道は、報告者が却下を受け入れたことを終結の理由に選んでテスト担当者がクローズへ移すもので、これを実行するのもテスト担当者である。テストリーダーとして書かれているのはオープンの担当だけなので、戻る道を1本足しても、それを実行する人は取り決めのどこにも決まらず、書いた担当と移し先だけを認める以上、決まっていない実行者をテストリーダーだと読むことはできない。書き足して当てはめ直しても、取り決めのとおりに運んだ操作は、解決で確認テストを行い同じ故障が再び現れたのでテスト担当者が進行中へ移すものである。沿わせるには、戻る道を足すことと、その遷移を実行する役をテストリーダーに定めることの2つが要る。この操作の居場所は、取り決めが遷移ごとに名指しした実行者の側であって、テストリーダーの役職がどこまでの見直しを許すかという側ではない"}},"meta":{"concept":"欠陥マネジメントの実装","distractorIntent":["分析を行った本人が、そのまま却下まで進めてよいと考え、組織が決めた却下の担当を手際のよさで上書きする","修正した開発担当者が続けて確認テストとクローズまで行い、隣り合う状態を同じ役割が続けて担当することと、クローズへ移す役割の定めの両方を外れる","却下された欠陥に戻り道が要ると考え、書かれていない遷移を、禁じる文が無いことを理由に引いてよいと読む"],"distractorTypes":["D11","D11","D11"],"conceptNote":"jstqb-al-tm/kb/concepts/defect-management-workflow-and-data.md","mistakePatterns":["MP-77","MP-80"]}},{"id":"q-2.3.1-A-4","lo":"TM-2.3.1","cluster":"2.3.1-D","variant":1,"chapter":2,"section":"2.3","k":3,"points":2,"type":"single","minutes":3,"scenario":"鉄道の座席予約システムをテストしている。報告の仕方を四半期ごとに見直せるようにするため、却下の扱いを次のように決めた。\n(1) 観察した不正は、テストの側に原因があったものも、登録済みの欠陥と同じ現象だったものも、まず欠陥レポートを作る。\n(2) 調べた結果、そのレポートで修正を進めないと決めたときは却下へ移し、移すときに理由を1つ選ぶ。理由は、重複（登録済みの欠陥と同じ現象）、偽陽性（製品に問題は無く、テストの環境かデータの側に原因があった）、無効な情報（調べるのに足りる情報が報告に無い）、誤ったテスト（手順か期待結果が仕様と合っていない）の4つである。\n(3) 作った欠陥レポートは、却下したものも含めて消さずに残す。四半期ごとに却下の理由の内訳を数え、重複と偽陽性の割合を報告の仕方の見直しに使う。\n(4) 却下を報告者が受け入れたら、クローズへ移す。","question":"この取り決めに従っていない扱いはどれか。1つ選べ。","choices":["テスト用の座席在庫データが本番と違っていたために現れた不一致について、開発リーダーは欠陥レポートを残したまま、理由に偽陽性を選んで却下へ移した。","予約の取り消しで現れた不一致が、3日前に登録された欠陥と同じ現象だと分かった。開発リーダーは理由に重複を選んでこのレポートを却下へ移し、観察した内容を先のレポートに書き足した。","期待結果が旧版の運賃表のまま書かれていたテストが不合格になった。開発リーダーは理由に誤ったテストを選んで却下へ移し、テストチームはそのテストを直した。","再現の手順が書かれておらず、開発リーダーは、調べるのに足りる情報が無いのでこのレポートでは修正を進められないと判断した。報告者に書き直しを頼み、そのレポートは一覧から消した。"],"answer":[3],"explanation":{"signals":"(1)は、テストの側に原因があったものも、登録済みの欠陥と同じ現象だったものも、まず欠陥レポートを作ると決めている。(2)は、却下へ移すときに理由を1つ選ぶと決め、重複・偽陽性・無効な情報・誤ったテストのそれぞれについて、当てはまる場合まで書いている。(3)は、作った欠陥レポートを却下したものも含めて消さずに残し、四半期ごとに却下の理由の内訳を数えて、重複と偽陽性の割合を報告の仕方の見直しに使うと決めている。つまりここでの却下は終わりの手続きではなく、後で数えるための記録である。原因がテストの側にあったかどうかは、レポートを作るかどうかには効かない ── (1)がどちらも作ると決めているからである。","why":"取り決めに従っていないの
