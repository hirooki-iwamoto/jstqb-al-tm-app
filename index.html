ることを含む。…これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.2.7（包括的なスコープ定義／リソース配置戦略／実行の監視／品質ゲートマネジメント）","misconception":"本番で起きた症状を実行の量の不足として読み、範囲の決め方・役割の決め方・進退を決める段取りという、計画とモニタリングとコントロールの側の欠落に戻して考えていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","relatedConcepts":["包括的なスコープ定義","リソース配置戦略","実行の監視","品質ゲートマネジメント"],"distractorIntent":["症状に対して実行の手数を増やすことで応えたつもりになる（探索的テストと回帰のケース数）","人手の追加と実行件数の目標配分で応え、役割の定義と計画に照らした追跡に戻らない","自動実行と可視化までは置くが、見えたずれを受けて何を変えるかと、進退を決める段取りが無い"],"distractorTypes":["D13","D13","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","confidence":"高","basis":"シラバス1.2.7（3群8活動）。公式サンプル SET B 問7（本番で表面化した症状の列挙から、対応するテストマネジメント活動2つを構成する5択TWO。誤答は量で応える型2つと、自動化はあるがコントロールが無い部分的に正しい型1つ）の構造。業種と症状の組はフィンテックの不正検知から差し替えた","mistakePatterns":["MP-07","MP-33","MP-38"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1・3）は計画／モニタリング＋コントロールの分担で一意。flip は全 null、flipNote 3本とも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-syllabus-2026-09-13-t3.md","sig":"71ea3950b41e","explSig":"5c34b9aa0477","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"正答への経路は実務としても成立する。出荷判定まわりに2件、中で報告する","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-qa-2026-09-12.md","sig":"71ea3950b41e","explSig":"5c34b9aa0477","fieldSig":{"scenario":"172b08f705eb","選択肢3":"9cd59674eecf","explanation.flip[5]":"e3b0c44298fc"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3つはいずれも選ぶ人の思考を書ける。誤答5の吸引が強く TWO の片方として成立しかけている点と、誤答4が前提を自己開示している点は中。","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-item-2026-09-12.md","sig":"71ea3950b41e","explSig":"5c34b9aa0477","fieldSig":{"scenario":"172b08f705eb","選択肢5":"5cdfa8b4f855","explanation.distractors[5]":"3d7a0009aca4","選択肢4":"02ca0fc21132"}}]}},{"id":"q-1.2.7-A-2","lo":"TM-1.2.7","cluster":"1.2.7-A","clusterName":"プロジェクトのコンテキストからテストマネジメント活動を決める","variantAxis":"プロジェクトの文脈の列挙から、支配的な関心に直結する活動の組合せを順にたどる（公式問8型・文脈の列挙／4択ONE）","variant":2,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは証券会社の顧客資産管理システムを、自社のデータセンターからクラウドへ移す作業のテストマネージャーである。移行は口座の種別ごとに6回に分けて行い、期間中は新旧の環境が並行して動く。開発は2週間の反復で、移行と並行して既存機能の改修も続く。チームは東京・大阪・ホーチミンの3拠点に分かれている。利用者は約40万人で、残高の照会の9割はモバイルアプリからである。\n\n各回を実施してよいかは、その時点の残高計算の突合の結果と、その回で新たに見えた懸念の扱いを踏まえて決めると社内で合意している。ただし、突合で出た差異をどこまでなら可とするのか、最終的に誰が可否を決めるのかは回ごとの会議での相談に委ねられており、前回はその場で結論が出ず、判断は持ち越されたままである。回を追うごとに対象の口座の種別が変わり、前の回には無かった懸念が毎回出ている。経営会議では、今回最優先に置くのは、各回について進めてよいかを根拠をもって示せる状態を保つことと、回ごとに変わる懸念を取りこぼさないことだと確認された。","question":"テストマネジメント活動の組合せとして、この文脈で最も適切な判断はどれか。1つ選べ。","choices":["回ごとに懸念を洗い直して軽減の手立てを計画に反映し、計画に照らして実行の進み具合と欠陥の状況を追い、次の回へ進む条件と決める人をあらかじめ定めて、その結果を受けて残りの回の進め方を組み直す。","3拠点それぞれの担当範囲と役割を計画で明確にし、回ごとの引き継ぎと連絡の手順を定めて、どの拠点でも同じ手順書と同じ環境で確認できる状態を整える。","回ごとに移行先の環境へ本番と同等の口座のデータを用意し直し、環境とテストデータの版を管理の対象に加えて、どの版でどの種別をどこまで確認したのかを、後から証跡としてそのまま取り出せる形に整えておく。","各回の結果を経営会議と監査部門が同じ情報で判断できるよう、突合の件数と検出した欠陥の推移をまとめた報告の様式を整え、毎回の定例で共有する。"],"answer":[0],"explanation":{"signals":"効くのは経営会議で確認された最優先の2点である。各回について進めてよいかを根拠をもって示せる状態を保つことと、回ごとに変わる懸念を取りこぼさないことである。これを補強する事実が2つ置かれている。各回の実施可否について社内で合意しているのは、突合の結果とその回で新たに見えた懸念の扱いを踏まえるという判断材料の種類までであり、どこまでなら可とするのかも最終的に誰が決めるのかも回ごとの会議に委ねられたままで、前回は結論が出ずに持ち越されていること、そして前の回には無かった懸念が毎回出ていることである。したがってこの文脈が求めるのは、懸念を回ごとに捉え直すこと、その状況を計画に照らして追うこと、進めてよいかを決めて次の回の進め方を変えることが、ひとつながりになっている状態である。利用者が約40万人で残高の照会の9割がモバイルアプリからであることは、どの選択肢の当否にも関与しない。4つの選択肢はいずれもシラバスに載っている活動であり、誤りの事実はどこにも無い。分かれ目は、最優先に置かれた2点に直接応えるかどうかだけである。","why":"シラバスはテスト計画のリスクの項で、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならないとし、軽減戦略の策定を重要だとしている。前の回には無かった懸念が毎回出ているのだから、この分析は一度で終わらず、回ごとに洗い直して計画へ戻す必要がある。次にシラバスは実行の監視を、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることとしている。計画に照らして追うからこそ、洗い直した懸念に対して手当てが効いているかが見える。そして進めてよいかの判断はテストコントロールの側にある。シラバスは品質ゲートマネジメントを、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含むとしている。各回の可否を根拠をもって示せる状態とは、まさに何をもって進めてよいとするかを定義し、それに照らして決めることである。このプロジェクトで合意されているのは判断材料の種類までであり、どこまでの差異なら可とするのかも最終的な決定者も回ごとの会議に委ねられたままで、前回は決めきれずに持ち越されている。何をもって進めてよいとするかの定義と、それを決める人を先に置くことがまだ済んでいないからこそ、この要素が効く。さらにシラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応してテストプロセスを動的に調整することと定めており、決めた結果を残りの回の進め方に反映するところまでが含まれる。この4つはそれぞれ計画・モニタリング・コントロールの活動であり、最優先に置かれた2点に順に対応している。\n他の3つが誤っているのは、活動として不適切だからではない。シラバスはそのいずれも明示的に求めている。誤っているのは順位である。この文脈で削れないものとして置かれたのは各回の進退の判断と懸念の取りこぼしであり、その2つに直接応える活動が他にあるときに、それらより前に置く根拠がない。","distractors":[null,"分散した拠点の担当範囲と役割、引き継ぎと連絡の手順を計画で定めることは、シラバスがリソース配置戦略として明記している活動である。原文はさらに、オンサイト／オフサイトモデルのようにチームが分散している環境では、同期を保ち、円滑な協力を確保するために、この点を維持することが特に重要になる、と分散環境を名指ししており、3拠点という事実はこの案を後押しする。それでも最優先に置かれたのは各回の進退を根拠をもって示せることと懸念の取りこぼしを防ぐことである。どの拠点でも同じ手順で確認できる状態が整っても、回ごとに新しく出る懸念を洗い直す手立ても、何をもって次の回へ進んでよいとするかの条件も、そこからは生まれない。拠点名が3つ並んでいるため文脈の語と一致して見え、シラバスの記述にも裏打ちされているぶん、最も選ばれやすい。","移行先に本番と同等のデータを用意し、環境とテストデータの版を管理して確認の証跡を取り出せるようにすることは、金融機関の移行では現実に欠かせない備えであり、シラバスもツールとテスト環境の賢明な選択と使用を重要だとしている。ただしこれは済んだ確認を後から示すための整備である。シラバスはテストマネージャーに、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めることを求め、テストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することと定めている。版をたどれるようにすることは、毎回新しく出る懸念を突き止めることでも、それを受けて次の回の進め方を変えることでもない。","テストのステータスをステークホルダーに伝えることはシラバスが明示的に求めており、特に重要なのは、プロジェクトやビジネスのステークホルダーにとって理解しやすく、関連性のある形でテスト作業成果物や活動のステータスを伝える必要があることである、と述べている。経営会議と監査部門が同じ情報を見る状態は、この文脈でも確かに要る。ただし最優先に置かれたのは、各回について進めてよいかを根拠をもって示せる状態を保つことである。シラバスは品質ゲートマネジメントを、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む、としており、定義と意思決定の両方を求めている。推移をまとめて配る案は、何をもって進めてよいとするかの定義を置かないまま、その判断を受け手の側に預けている。どこまでの差異なら可とするのかも最終的な決定者も回ごとの会議に委ねられたままである以上、同じ数字を同じ様式で配っても、前回のように結論が出ないまま持ち越される状態は変わらない。"],"flip":[null,null,null,null],"flipNote":{"2":"最優先の一文を3拠点の粒度そろえに差し替えても、シナリオには2つの文が残る。突合で出た差異をどこまで可とするのかも最終的な決定者も回ごとの会議に委ねられ、前回は結論が出ないまま持ち越されていること。そして、回を追うごとに対象の種別が変わり前の回には無かった懸念が毎回出ていること。選択肢1はこの2つに正面から応えるので、条件を当てても正しいまま立ち、妥当な案が2つになる。一方、拠点の粒度そろえが解く手戻りや二重作業は、シナリオに症状として1つも現れていない。この案だけを答えにするには、求めの差し替えに加えて、残る2文が描く状態も先に片づいていることまで要る。","3":"最優先の一文を、当局の検査へそのまま示せることに差し替えても、前の回には無かった懸念が毎回出ているという一文と、許容幅も決定者も会議に委ねられ判断が持ち越されたままだという一文は残る。版をたどれるようにすることは、毎回新しく出る懸念を突き止めることでも、次の回へ進んでよい条件と決める人を置くことでもないので、その2文に応える選択肢1は正しいまま立ち、妥当な案が2つになる。証跡の整備が単独で首位に立つには、求めの差し替えに加えて、懸念の出方と可否の決め方が既に落ち着いていることまで併せて要る。","4":"求めを、経営会議と監査部門が同じ情報で理解できることに差し替えても、差異の許容幅も最終的な決定者も回ごとの会議に委ねられたままだという一文は残る。同じ数字を同じ様式で配っても前回のように持ち越される状態は変わらないので、そこを定める選択肢1が正しいまま立ち、妥当な案が2つになる。逆に、許容幅と決定者が先に定まった世界を条件にしても、今度は前の回には無かった懸念が毎回出ているという一文が残り、それを回ごとに洗い直す選択肢1がやはり立つ。報告の整備がこの状況の答えになるには、2文の両方が片づいていることが要り、条件が2つになる。"},"quote":"テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.2.7（リスクアセスメントと軽減計画／実行の監視／適応的なプロセスマネジメント／品質ゲートマネジメント）","misconception":"選択肢に書かれた活動がシラバス上正しいかどうかだけで判定し、このプロジェクトで最優先に置かれた関心に直接応えているかを判定していない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","relatedConcepts":["リスクアセスメントと軽減計画","実行の監視","適応的なプロセスマネジメント","品質ゲートマネジメント"],"distractorIntent":["分散チームへの手当て（リソース配置戦略）を、明示された最優先より前に置く","環境とデータの版管理という済んだ確認の整備を、毎回変わる懸念の把握と進退の判断より前に置く","ステークホルダーへの報告の整備を、何をもって進めてよいとするかの定義と意思決定の代わりに置く"],"distractorTypes":["D4","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","confidence":"中","basis":"シラバス1.2.7（3群8活動）＋1.1.2（ステータスの伝達）。公式サンプル SET B 問8（プロジェクトの文脈の列挙から、支配的関心に直結する組合せを選ぶ4択ONE。誤答3つはいずれも誤りの事実を含まず、必要だがこの文脈の第一の焦点ではない型）の構造。支配的関心は規制・機能安全ではなく、段階的な移行における各回の進退の判断と毎回変わる懸念に置き替え、シナリオに1文で明示した","mistakePatterns":["MP-35","MP-38"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は最優先の2点への直答で一意。残る flip 3本はいずれも成立せず、null＋flipNote へ落とすべき（中1件）","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-syllabus-2026-09-13-t3.md","sig":"b8eec21f7d55","explSig":"4e11c2429a24","fieldSig":{"scenario":"c34405d93c39","explanation.distractors[3]":"1ed0979d6f59"}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"前巡の重大（正答の柱「次の回へ進む条件と決める人」をシナリオの合意文がすでに満たしていた＝T2）は、追加された1文で解消を確認。以下、T1・T2を正答4要素に当てた結果。","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-qa-2026-09-12-r2.md","sig":"b8eec21f7d55","explSig":"4e11c2429a24","fieldSig":{"scenario":"c34405d93c39"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"D4×3 はすべてシナリオが明示した最優先の1文で落ちる。誤答4だけ最優先の片側に届きかけている点は中。","ref":"jstqb-al-tm/kb/reviews/TM-1.2.7-item-2026-09-12.md","sig":"b8eec21f7d55","explSig":"4e11c2429a24","fieldSig":{"scenario":"c34405d93c39","選択肢4":"7c9121dbb182"}}]},"noShuffle":true},{"id":"q-1.3.4-A-1","lo":"TM-1.3.4","cluster":"1.3.4-A","clusterName":"リスクレベルに応じたテスト活動の選択","variant":1,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはオンライン損害保険の契約申込システムのテストマネージャーである。このシステムは金融庁の監督指針の対象で、保険料計算の正確性については検証の根拠を記録として残すことが求められている。利用者は個人・代理店・法人窓口と幅広い。\n\n制約として、本番同等の負荷環境は月に1回・4時間しか確保できず、リリースまでに使える枠は1回だけである。実機での表示確認は、情報セキュリティ規程により外部の端末サービスを使えないため、社内に用意した主要3機種までしかできない。リリースは繁忙期の直前で、日程は動かせない。\n\n洗い出した懸念とその評価は次のとおりである。","table":{"caption":"洗い出した懸念の評価（影響額の単位は百万円）","headers":["ID","内容","発生可能性","影響額"],"rows":[["A","保険料の計算を誤り、過少請求のまま契約が成立する","20%","400"],["B","申込のピーク時に応答が遅延し、利用者の離脱が発生する","60%","80"],["C","保険料試算結果のグラフが一部の端末で崩れる","70%","10"],["D","本人確認書類のアップロードでデータが破損する","15%","200"]]},"question":"評価された数値と、明記された制約の両方を踏まえた対応計画として、最も適切なものはどれか。1つ選べ。","choices":["Cのグラフ崩れを主要3機種で確認して表示系に人手を厚く配分し、Bには4時間の枠をそのまま充てる。AとDは結合テストの範囲にとどめ、検証の根拠はその記録をもって残す。","Aは開発と並行して探索的テストで確認し、Bには本番同等の環境をもう1系統用意して長時間の負荷テストを行う。Dは結合テストで確認し、Cは主要3機種で確認する。","Aを要件由来のテストで網羅的に検証して根拠を記録に残し、成立後は独立に実装した参照計算と突合して差異を検知し訂正につなぐ。Bは4時間の枠をピーク時間帯に絞って使い、Dは結合レベルでデータ完全性を確認する。Cは主要3機種にとどめて受容する。","Dにはデータ完全性のテストを厚く配分し、Bには4時間の枠のうち1時間を割いて傾向を確認する。Aは要件を網羅するテストで検証して根拠を記録に残し、成立後は別に実装した参照計算との突合で差異を拾い出し、訂正に回す。Cは主要3機種にとどめて受容する。"],"answer":[2],"explanation":{"signals":"効くのは表の8つの数値と、本文に置かれた3つの制約である。保険料計算については検証の根拠を記録として残すこと、本番同等の負荷環境はリリースまでに1回・4時間しか使えないこと、実機での表示確認は主要3機種までであること。積を取ると A=80 > B=48 > D=30 > C=7 となり、発生可能性だけの順（C>B>A>D）とも影響額だけの順（A>D>B>C）とも一致しない。どの選択肢も並べ方の原則を宣言していないので、順位は配分の中身から読み取り、自分で積を計算しないと決まらない。最上位のAに対するテスト以外の手当ては2つの案が同じ形で持っているので、差はBとDのどちらを厚くするかの1点に絞られる。「利用者は個人・代理店・法人窓口と幅広い」は、どの選択肢の当否にも関与しないノイズである。","why":"まず評価された数値から、発生可能性と影響額の積を求める。A=0.2×400=80、B=0.6×80=48、C=0.7×10=7、D=0.15×200=30（単位は百万円）。したがって A > B > D > C の順になる。シラバスはテストの開発と実行に関連する時間と労力をリスクレベルに比例させ、高いリスクレベルに対しては早期に開始してより厳密なテスト技法を用いるべきであるとし、そのうえでテストアイテム・品質特性・テストレベル・規制要件といったコンテキストに基づく要因を分析してテストアプローチを選ぶべきだとしている。この選択肢は、積の順に労力を配分したうえで、規制要件（Aの検証根拠を記録に残す）、テスト環境の可用性（Bを4時間の枠に収める）、テストレベルの選択（Dを結合レベルで扱う）という制約すべてに整合している。さらにAについては、シラバスがテスト以外のリスク軽減手段として挙げるもの（コンティンジェンシープラン、サードパーティへのリスク移転、リスク受容）のうち、差異の検知とその訂正の手続きを併せており、テストで取り切れない分を別の手段で受け止めている。ここで効くのは突合の相手が独立に実装した参照計算であることである。同じロジックで再計算しても、料率の取り違えや区分の当てはめ誤りは同じ結果を再現するだけで差異は出ない。また検知だけでは軽減にならず、過少請求のまま成立した契約をどう訂正するかまで用意して初めて、テストの外で受け止めたと言える。\nこの計画が何を引き受けるのかも見ておく。Cは主要3機種の外を受容するので、それ以外の端末で試算結果のグラフが崩れたまま繁忙期を迎える可能性が残る。Bは枠が1回しかないため、測って直して測り直す反復ができず、合否のしきい値を先に決めた1回勝負になる。Dを結合レベルに限定することは、破損の条件がストレージや変換の実装に依存する場合にシステムレベルの確認が残ることを意味する。比例配分は、これらを「なぜ薄くしたのか」に答えられる形で残す判断とセットになる。","distractors":["Cの積は7で4件のうち最も軽く、Aの80とは一桁違う。そのCに人手を厚く配分する一方で、最も重いAを結合テストの範囲にとどめている。発生可能性だけを見れば C(70%) と B(60%) が上位に来るが、シラバスはテストマネージャーがリスク可能性とリスク影響を組み合わせてリスクレベルを決定するとしており、時間と労力はそのリスクレベルに比例すべきである。記録は残しているので規制要件には触れないが、最も重いリスクに最も薄い労力が当たる点で比例原則から外れている","本番同等の負荷環境はリリースまでに1回・4時間しか使えないと明記されているのに、この計画はもう1系統を用意することを前提にしている。加えて、保険料計算の正確性については検証の根拠を記録として残すことが求められているのに、最も重いAについてその手当てが計画に含まれていない。シラバスは規制要件をテストアプローチの選択で分析すべきコンテキスト要因に挙げ、テストマネージャーはこれらが守られていることを保証しなければならないとしている。なお、開発と並行して着手すること自体は、高いリスクレベルに対するテストを早期に開始するという記述にむしろ沿っており、そこが誤りなのではない。誤っているのは、明記された資源の上限を超えたことと、明記された記録の求めを引き受けていないことの2点である",null,"Aへの対応も、Bを4時間の枠に収めることも、Cを主要3機種にとどめることも、明記された制約にはすべて従っている。最上位のAに対するテスト以外の手当ても、正解と同じ形で置いている。誤っているのは配分の順位だけである。Dの積は30で、B（48）より軽い3番目である。Dを厚く配分し、Bには4時間のうち1時間しか充てないと、より重いリスクに薄い労力が当たることになる。影響額はDが200でBの80より大きいが、時間と労力が比例すべき相手は影響額ではなくリスクレベルであり、リスクレベルは可能性と影響の組み合わせで決まる"],"flip":[null,null,null,"Dの発生可能性が仮に30%であれば積は60となってB（48）を上回り、DをBより厚く扱うこの配分が正しくなる。この選択肢は3つの制約すべてに従い、テスト以外の手当ても正解と同じ形で置いているので、積を計算しない限り正解と区別できない。誤っているのは配分の仕方ではなく、順位の出し方である"],"flipNote":{"1":"発生可能性の順にそのまま配るこの案が正しくなるのは、影響額の列が4件とも同じ高さに並んだときである。だが4つの値は表にそれぞれ独立に置かれており、まとめて動かす一文はシナリオのどこにもない。表の数値を1つだけ動かしても順位は作れない。Cの影響額を上げてCを首位にしても、A（積80）がB（積48）を上回ったまま残るので、Bに4時間の枠を充ててAを結合どまりにするこの配分は比例しない。逆にA側の数値を下げても、C（積7）は最下位のままで、最下位に人手を厚くする形が残る。反転にはCを上げることとAを下げることの2つが要る。誤っているのは可能性を見たことではなく、影響額と組み合わせなかったことである。","2":"この案の誤りは2つある。本番同等の負荷環境はリリースまでに1回・4時間と明記されているのにもう1系統を用意することを前提にしている点と、保険料計算について求められている検証の根拠の記録を引き受けていない点である。片方だけを動かしてももう片方が残る。両方を動かしても、積が最も大きいAに充てているのが開発と並行した探索的テストにとどまるため、Aを要件由来のテストで網羅的に検証し独立に実装した参照計算との突合まで置く案のほうが、労力をリスクレベルに比例させるという原則に沿ったまま残る。1条件では反転しない。"},"quote":"テスト計画において、テストの開発と実行に関連する時間と労力は、リスクレベルに比例すべきである。高いリスクレベルに対するテストは、早期に開始し、より厳密なテスト技法を用いるべきであるが、低いリスクレベルに対するテストは、後半に開始する場合があってよく、厳密ではないテスト技法を用いるべきである。／テストマネージャーは、リスク可能性とリスク影響を組み合わせて、リスクレベルを決定する。","ref":"1.3.4（比例原則・コンテキスト要因）／1.3.3（リスクレベルの決定）","misconception":"リスクの順位を発生可能性か影響額の一方だけで決めており、両者の積で決まること、および制約を守っていても順位を誤れば計画は成立しないことを踏まえていない"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスクエクスポージャー","テストアプローチの選択","テストレベルの選択"],"distractorIntent":["発生可能性の高いものを厚くし、積を取らない","明記された資源の上限を超え、最上位のリスクに求められている記録の手当てを置かない","制約はすべて守るが、積の順位でDをBより上に置く（宣言軸を担う誤答）"],"distractorTypes":["D4","D2","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.3/1.3.4 ＋ 公式サンプル SET B 問11（数値表→計算→順位）の構造。誤答3は制約をすべて満たし積の順位だけを崩すため、表を計算しないと正解と区別できない（公式問11 の誤答b『DをCより後回し』に対応する装置）。誤答3にも正解と同じテスト以外の手当てを持たせ、2つの差をBとDの配分1点に絞った","mistakePatterns":["MP-03"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢3）は積の順位と3制約で一意。flip[0] の条件が表の1列に及び成立しない（中1件）","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-syllabus-2026-09-13-t3.md","sig":"ad7e8aa5fd2b","explSig":"7911f7f61e77","fieldSig":{"explanation.flip[0]":"e3b0c44298fc","explanation.signals":"cd9daf7cd9e2","table":"2c9273d37ac1"}},{"lens":"qa","date":"2026-09-11","round":4,"result":"pass","note":"誤答2の flip が2条件の同時反転で、反転しても最上位リスクに最も緩い技法が残る／誤答4は積を計算せずに消せる手掛かりを持っている","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-qa-2026-09-11-r4.md","sig":"ad7e8aa5fd2b","explSig":"7911f7f61e77","fieldSig":{"explanation.flip[2]":"01ba4719c80b","選択肢2":"bc6c86a447cc","explanation.distractors[2]":"b47c4b108beb","選択肢4":"8169d3496dee","scenario":"59a812b53de2","explanation.flip[4]":"4adec08b739a","選択肢3":"20e57c3d7bfe"}},{"lens":"item","date":"2026-09-11","round":4,"result":"pass","note":"表を計算しなくても、選択肢どうしの要素の多数決だけで正解が一意に定まる","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-item-2026-09-11-r4.md","sig":"ad7e8aa5fd2b","explSig":"7911f7f61e77","fieldSig":{"選択肢3":"20e57c3d7bfe","選択肢4":"8169d3496dee","選択肢1":"1bbff1917d1b","選択肢2":"bc6c86a447cc","scenario":"59a812b53de2"}}]},"variantAxis":"リスクレベルの算出 ＋ 比例配分（公式問11型）"},{"id":"q-1.3.4-A-2","lo":"TM-1.3.4","cluster":"1.3.4-A","clusterName":"リスクレベルに応じたテスト活動の選択","variant":2,"chapter":1,"section":"1.3","k":4,"points":3,"type":"multi","minutes":4,"scenario":"公共交通のIC乗車券システムを刷新している。1日の利用は延べ400万件で、朝夕のピークに集中する。改札機のファームウェアは鉄道会社11社ごとに版が異なり、自社で検証できるのは主要4社ぶんまでで、残る7社ぶんは各社が自社の受入検証で確認する取り決めになっている。リリース日は運賃改定に合わせており、動かせない。\n\n洗い出した懸念について、重さの評価と、それがどういう状態で現れるかを次のように整理した。","table":{"caption":"洗い出した懸念と、それが現れる条件","headers":["ID","内容","重さ","現れる条件"],"rows":[["A","残高計算を誤り、運賃が過大に引き落とされる","重い","計算のロジック単体で再現できる"],["B","ピーク時に改札機との通信が遅延し、入場に失敗する","重い","改札機と連携した状態でのみ現れる"],["C","利用履歴画面の表示順が誤る","軽い","画面単体で再現できる"],["D","定期券の期限判定を誤り、期限切れでも通過できる","重い","日付をまたぐ運用条件でのみ現れる"]]},"question":"各懸念の重さと現れ方を分析したとき、テスト活動の割り当てとして適切なものを2つ選べ。","choices":["Aには単体のレベルで最も厳密な技法を充て、最も適任の担当者を割り当てる","Cは短い時間で終えられるため、まずここから着手して早い段階で片付ける","Dには期限判定のロジックを対象に、単体のレベルで最も厳密な技法を充てて軽減を終える","Bは主要4社ぶんの版を対象に、改札機と連携したレベルで軽減する","残る7社ぶんは主要4社ぶんの結果で代表できるとみなし、不具合が出た時点で各社に確認を依頼する"],"answer":[0,3],"explanation":{"signals":"効くのは重さの評価そのものではなく、現れる条件の列である。A・B・Dはいずれも重いと評価されており、重さだけではこの3件の扱いを分けられない。分けるのは、その不具合がどういう状態で現れるかである。シラバスは「ある種のリスクは、特定のテストレベルで動的にテストするだけでよい」としており、どのレベルなら軽減できるかは現れ方で決まる。加えて、自社で検証できるのは主要4社ぶんまでで、残る7社ぶんは各社の受入検証で確認する取り決めがあることが効く。1日400万件という規模は状況の重さを伝えるだけで、どの選択肢の当否も決めない。","why":"Aは計算のロジック単体で再現できるため、統合を待たずにそのレベルで軽減できる。重いリスクに対して最も厳密な技法を充て、最もリスクレベルの高いテストアイテムに最も適任な担当者を割り当てることは、労力をリスクレベルに比例させるという記述と、テストチームに関する記述の両方に沿う。Bは改札機と連携した状態でのみ現れるため、単体のレベルでいくら厚く見ても軽減できない。連携したレベルで扱い、かつ自社で検証できる主要4社ぶんに対象を収めている点が、明記された制約と整合する。A・B・Dは重さが同じであるにもかかわらず充てるレベルが異なる。重さは労力の量を決め、現れ方は労力を置く場所を決める。この2つを分けて読むことが、この状況で求められている分析である。\nこの割り当てが残すものもある。Bは4社ぶんの版でしか確認できないため、残る7社ぶんの版に固有の通信の挙動は自社では取り切れず、各社の受入検証に依存する。Dについても、日付をまたぐ運用条件を再現できる枠をどこに確保するかが別途の課題として残る。","distractors":[null,"軽いものから着手する理由として、作業が短い時間で終わることを挙げている。しかし着手の早さを決めるのはリスクレベルである。シラバスはリスクレベルが高いほどテストを早期に開始すべきであるとし、低いリスクレベルに対するテストは後半に開始する場合があってよいとしている。短時間で終わるCを先に片付けること自体に害はなく、実務でもよく行われる。害が出るのは、それが重い3件の着手を遅らせるときであり、この選択肢は「まずここから」と着手順の先頭に置いている点で順序の根拠を取り違えている","Dが重いという評価は正しく、重いものに最も厳密な技法を充てるという方向も比例原則に沿っている。誤っているのは、軽減するレベルの選び方だけである。Dが現れるのは日付をまたぐ運用条件であって、期限判定のロジックを単体で確認しても、その条件自体は再現されない。重さが同じでも、単体で再現できるAと、運用条件でのみ現れるDを同じ扱いにはできない。重さの列だけを見ればAへの割り当てと区別がつかず、現れる条件の列を読んで初めて誤りが分かる",null,"残る7社ぶんは各社が自社の受入検証で確認する取り決めになっており、自社が一方的に代表とみなしてよいかを決める話ではない。加えて、不具合が出た時点で各社に確認を依頼するという進め方は、リリース前にリスクを軽減する機会を使っていない。シラバスは、テストで欠陥が明らかになった場合にリリース前に欠陥に気づき対処する機会を提供することでテストがプロダクトリスクの軽減に役立つとし、可能な限り早期にすべてのテストアイテムのテストを行うことで、ライフサイクルの後期に重大な欠陥が発見され、内部失敗コストや遅延が増大するリスクを軽減できるとしている。リスク受容やサードパーティへのリスク移転は、テスト以外の正規の軽減手段としてシラバスに挙げられている。この選択肢が誤るのは移転したことではなく、取り決めの範囲を自社の判断で広げ、確認を不具合の後に回している点である"],"flip":[null,null,null,null,null],"flipNote":{"2":"着手順の根拠を作業時間の短さに置いてよくなるのは、Cの重さが他の3件と並ぶときである。ただしそのときも、計算のロジック単体で再現できるAを単体のレベルで扱う割り当てと、改札機と連携した状態でのみ現れるBを連携したレベルで扱う割り当ては、どちらも正しいまま残る。適切な割り当てが3つになり、2つ選べという形式が成り立たない。重さの列をどう動かしても、この案が2つの席のどちらかを奪う形にはならない。","3":"Dの現れる条件が「日付をまたぐ運用条件でのみ現れる」ではなく「ロジック単体で再現できる」であれば、この割り当て自体は正しくなる。ただしそのときもAへの割り当てとBへの割り当ては正しいままなので、適切な割り当てが3つになり、2つ選べが成り立たない。この案が2つのうちの1つになるには、あわせてAが単体では再現できない形に変わることまで必要で、条件が2つになる。","5":"この案の誤りは2つある。各社の受入検証という取り決めの範囲を自社の判断で広げて代表とみなしたことと、確認をリリース前ではなく不具合が出た後に回したことである。渡す確認の内容と合否の基準を事前に取り決めて各社の同意を得ることと、基準からの逸脱が出た場合に照会する手順を決めることは別々の条件であり、どちらか一方だけでは成り立たない。しかも両方を置いたときには、AとBへの割り当ても正しいまま残るため、適切な割り当てが3つになって2つ選べが成り立たない。"},"quote":"ある種のリスクは、特定のテストレベルで動的にテストするだけでよい。他のリスクは、静的テスト（例えば、保守性のための静的解析とコードレビュー）、またはその両方の組み合わせ（例えば、アーキテクチャのレビューとセキュリティの脆弱性のための統合したシステムの動的テスト）によってテストを行う。","ref":"1.3.4","misconception":"リスクの重さだけでテストの厚みとレベルを決め、その不具合がどういう状態で現れるか（＝どのテストレベルなら軽減できるか）を見ていない"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスクエクスポージャー","テストアプローチの選択","テストレベルの選択"],"distractorIntent":["作業の短さを着手順の根拠にする","重さには比例させるが、現れる条件と軽減するレベルが噛み合わない（宣言軸を担う誤答）","移転の取り決めを代表確認と事後依頼に置き換える"],"distractorTypes":["D4","D2","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.4（テストレベルとテストタイプ、比例原則、テストチーム）。重さはA・B・Dで同じにし、扱いを分けるのは現れる条件だけにした。誤答3は重さに比例させているため、現れる条件の列を読まないと正解と区別できない","mistakePatterns":["MP-03","MP-02"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1・4）は「重さ」×「現れる条件」で一意。flip は全 null、flipNote 3本とも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-syllabus-2026-09-13-t3.md","sig":"7639007b0a2a","explSig":"80ceec5f4dd3","fieldSig":{}},{"lens":"qa","date":"2026-09-11","round":3,"result":"pass","note":"flip[4] は2要素をともに反転させる形になり、誤答5を実際に成立側へ移している。","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-qa-2026-09-11-r3.md","sig":"7639007b0a2a","explSig":"80ceec5f4dd3","fieldSig":{}},{"lens":"item","date":"2026-09-11","round":3,"result":"pass","note":"2巡目から横ばい。伏せると1つ目の正解は確定するが2つ目が決まらない（選択肢4に約60%）。誤答3が5問中最良級の惜しい誤答であることも変わらない。I13（「まず」「軽減を終える」）が軽として残る","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-item-2026-09-11-r3.md","sig":"7639007b0a2a","explSig":"80ceec5f4dd3","fieldSig":{}}]},"variantAxis":"現れる条件からテストレベルを選ぶ（1.3.4 テストレベルとテストタイプ）"},{"id":"q-1.3.4-A-3","lo":"TM-1.3.4","cluster":"1.3.4-A","clusterName":"リスクレベルに応じたテスト活動の選択","variant":3,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"クラウド会計SaaSに、他社サービスからのデータ移行機能を追加する。利用者の多くは小規模事業者で、確定申告期に処理が集中する。リリースは確定申告期の受付開始に合わせており、日程は動かせない。\n\n経営陣は3週間後の経営会議で、リリース可否を決める材料として、追加する機能全体の品質がどうなっているかの説明を求めている。\n\n洗い出した懸念について、見込まれる損失はすでに算出されている。","table":{"caption":"洗い出した懸念と、算出済みの見込み損失（単位は百万円）","headers":["ID","内容","見込まれる損失"],"rows":[["A","移行したデータから仕訳を生成する際に勘定科目のマッピングを誤る","48"],["B","確定申告期のピークに移行処理が滞留する","20"],["C","移行後の帳票でフォントの表示が崩れる","3"],["D","他社サービスからの移行でデータの欠損が生じる","45"]]},"question":"この状況を分析したとき、テスト実行の進め方として最も妥当なものはどれか。1つ選べ。","choices":["どの件も未着手のまま残さないよう、4件に1つずつテストを配って一巡させる。そのあとは残りのテストを4件へ同じ数ずつ割り振り、どれも同じ厚みで確認してから報告する。","見込まれる損失の大きいものから厳格に降順で実行する。Aを深く掘り下げきってからDに移り、Aで分かった欠陥の傾向はDの計画に反映してから着手する。BとCは前の2件が終わってから着手する。最も大きい損失を可能な限り早期に軽減することを優先し、各件の残存リスクを報告に載せる。","AとDを深く掘り下げることに割り当てた時間を使い切ることを前提に計画し、BとCは今回のテストの範囲から外す。外した2件は、残っているリスクを受け入れる前提で経営会議に報告する。","A〜Dのそれぞれに、まず最優先のテストを少なくとも1つずつ割り当てて一巡させる。一巡したあとの残りのテストは、見込まれる損失の大きいものから順に優先順位を付けて進め、各件の残存リスクを報告に載せる。"],"answer":[3],"explanation":{"signals":"効くのは数値そのものよりも、経営陣がリリース可否を決める材料として、追加する機能全体の品質がどうなっているかの説明を求めているという一文である。シラバスはテスト実行の優先順位の付け方を2つ挙げ、どちらが適するかをステークホルダーの求めで分けている。算出済みの数値（A=48 > D=45 > B=20 > C=3）は、一巡したあとの残りの優先順位を決めるために使う。AとDの差がわずか3しかないことも効く。降順に進めるとAだけで3週間を使い切りかねない。利用者の多くが小規模事業者であることは、どの選択肢の当否にも関与しない。","why":"シラバスは横型探索を「各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」進め方と定義し、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適するとしている。経営会議でリリース可否を決める材料として機能全体の品質状況を求められている状況が、まさにこれにあたる。この選択肢は前半で一巡して全体像を成立させ、後半では残りを損失の大きい順に並べており、定義の前半と後半の両方を満たしている。加えてシラバスは、リスクベースドテストが任意の時点における残存リスクレベルに関するテスト進捗の報告を可能にし、それによってステークホルダーがリリースの判定を行えるとしている。各件の残存リスクを報告に載せることで、横型探索で得た全体像がリリース判定に使える形になる。\nこの進め方が失うものもある。一巡に時間を使う分、最上位のA（48）の掘り下げは縦型で進めた場合より遅れる。全体像を早く得ることと、最も重いリスクを最速で下げることは同時には取れず、この状況では経営陣の求めが前者を選ばせている。","distractors":["前半の一巡は横型探索の定義どおりで正しい。しかし後半で4件に同じ数ずつ割り振っている点が、「その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける」という定義の後半に反し、労力をリスクレベルに比例させるという原則にも反する。C（3）にA（48）と同じ数のテストを充てることになり、分析して算出した数値が計画に反映されない","これは縦型探索であり、進め方として自己矛盾はない。Aで分かった欠陥の傾向をDの計画に反映してから着手するという段取りは、順に掘り下げるこの進め方だからこそ取れるもので、それ自体に誤りはない。シラバスは縦型探索を、最も高いレベルのリスクを可能な限り早期に軽減することが重要な場合に適するとしており、正規の選択肢である。多くの状況ではこちらが妥当であり、この選択肢が誤るのは一点だけ——この状況のステークホルダーの求めと噛み合わないことである。A（48）とD（45）の差は3しかなく、Aを掘り下げきる前に3週間が尽きればDすら手つかずになる。BとCが未着手のまま経営会議を迎えれば、残存リスクを報告しても2件については「まだ何も分かっていない」としか言えず、機能全体の品質がどうなっているかという求めに答えられない","BとCを最初から範囲の外に置く計画である。B（20）は4件のうち3番目で、計画段階で落とす根拠が数値にない。またシラバスは、割り当てた時間が計画したテストをすべて実行できないまま消費されることがあると認めたうえで、その時点でテストを延長するか残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することがリスクベースドテストの利点だとしている。ここでは受容が提案ではなく前提として持ち込まれており、経営陣には選ぶ余地が残らない。しかも2件を一度もテストしないため、報告できるのは損失の見積りだけで、機能全体の品質がどうなっているかという求めには届かない",null],"flip":[null,"経営陣の求めが「全体像」ではなく「最も重い懸念をリリース前に潰すこと」であれば、厳格に降順で進めるこの進め方が正解になる。誤っているのは進め方そのものではなく、この状況の求めと噛み合っていない点だけである。求めを読まなければ、この選択肢は正解と区別できない",null,null],"flipNote":{"1":"一巡したあとの残りを同じ数ずつ割り振ることが結果として比例配分になるのは、4件の見込み損失が同程度のときである。ただしそのときは、残りを見込み損失の大きい順に優先順位を付ける案も同じ配分に行き着くため、2つの案を分ける根拠が無くなり、どちらか一方を選べない。一巡後の配分を決めているのは算出済みの数値だけなので、この案が単独で正解になる条件は、数値の側にも経営陣の求めの側にも無い。","3":"経営陣の求めを、最も重い2件を掘り下げた結果と残る2件を受け入れてよいかの判断に差し替えると、同じ一文が縦型探索の案（選択肢2）の唯一の誤りも同時に消す。あの案が誤るのは進め方そのものではなく、この状況の求めと噛み合わない一点だけだからである。条件を当てると妥当な案が2つ立つ。しかも縦型の案は範囲から何も落とさず各件の残存リスクを報告するので、テストを延長するか残ったリスクを受け入れるかの提案をマネジメントに上げるという原文には、受容を提案ではなく前提として持ち込むこの案よりも近い。この案だけが残るには、求めの差し替えに加えて、B（20）を計画段階で範囲外にしてよい数値まで併せて要る。"},"quote":"あるいは、各リスクに対して少なくとも1つのテストが最優先として割り当てられる。その他のテストは、カバーするリスクのレベルに基づいて優先順位を付ける。このアプローチは横型探索(breadth-first)と呼び、ステークホルダーがプロダクト品質の全体像をできるだけ早い段階で把握したい場合に適している。","ref":"1.3.4","misconception":"実行順序はリスクの大きい順に決まるものだと思い込み、ステークホルダーが全体像を求めている場合に横型探索を選ぶ判断を持っていない"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスクエクスポージャー","テストアプローチの選択","テストレベルの選択"],"distractorIntent":["一巡は正しいが、後半で算出済みの数値を使わない","縦型探索として整合した計画を、全体像を求める文脈に当てる（宣言軸を担う誤答）","2件を計画段階で範囲から外し、受容を提案ではなく前提として報告する"],"distractorTypes":["D3","D2","D2+D3"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.4（縦型探索／横型探索、残存リスクの報告、時間切れ時の提案）。公式サンプル SET B 問12 と同じく計算を求めない型。誤答2は縦型探索として自己整合しており、経営陣の求めを読まないと正解と区別できない","mistakePatterns":["MP-07"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢4）は横型探索の定義で一意。flip[2] が誤答2の唯一の誤りまで消すため成立しない（中1件）","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-syllabus-2026-09-13-t3.md","sig":"b91fb6d3c61a","explSig":"242561e7138c","fieldSig":{"explanation.distractors[1]":"1d9dbd205540","explanation.flip[2]":"8420ea362689","syllabus":"79c0ba4a0756"}},{"lens":"qa","date":"2026-09-11","round":3,"result":"pass","note":"2巡目から変更なし。指摘は無く、材料が未採用のまま残る","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-qa-2026-09-11-r3.md","sig":"b91fb6d3c61a","explSig":"242561e7138c","fieldSig":{}},{"lens":"item","date":"2026-09-11","round":3,"result":"pass","note":"**K4 としての失格状態は解消した**（照応経路が消え、80%→55〜60%）。ただし**選択肢4の行動集合が選択肢2の行動集合を完全に包含している**ため、「最も網羅的な案を選ぶ」受験技術が依然として正解を指す。潰すのは選択肢2に固有の","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-item-2026-09-11-r3.md","sig":"b91fb6d3c61a","explSig":"242561e7138c","fieldSig":{}}]},"variantAxis":"ステークホルダーの求めから縦型／横型を選ぶ（1.3.4 縦型探索・横型探索）","noShuffle":true},{"id":"q-1.3.4-A-4","lo":"TM-1.3.4","cluster":"1.3.4-A","clusterName":"リスクレベルに応じたテスト活動の選択","variant":4,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは自動車メーカーの車載ソフトウェア無線更新（OTA）基盤のテストマネージャーである。この基盤は走行中を除くタイミングで車両のソフトウェアを更新する。日欧向けの型式認証の対象であり、更新の完全性を保証する仕組みについては、申請時に検証の記録を提出する必要がある。\n\n提携する通信事業者は地域ごとに異なる。\n\n洗い出した懸念とその評価、および使える検証環境と要員は次のとおりである。","table":{"caption":"洗い出した懸念と、算出済みの見込み損失（単位は百万円）","headers":["ID","内容","見込まれる損失"],"rows":[["A","更新中の電源断で車両が起動不能になる","240"],["B","地域ごとの通信事業者の差により更新が中断する","56"],["C","更新後の設定画面の文言が一部の言語で崩れる","4"],["D","更新パッケージの署名検証を誤り、不正な更新を受け入れる","200"]]},"table2":{"caption":"利用できる検証環境と要員","headers":["資源","利用できる量","備考"],"rows":[["実車","月2台・各3日","更新失敗時にどこまで戻せるかは実車でしか確認できない"],["模擬環境","常時2台","電源断・通信断に加え、地域ごとの事業者網の接続設定とタイムアウトの挙動まで再現できる。車両の起動挙動は再現できない"],["署名検証の専門要員","1名","暗号実装の経験10年。検証専任で代われる者がいない"],["多言語表示の確認","外部委託が可能","費用は軽微で、日程の制約もない"]]},"question":"2つの表と明記された制約を分析したとき、検証計画として最も適切なものはどれか。1つ選べ。","choices":["Dの署名検証は型式認証の申請時に検証の記録を求められるため、実車の枠をすべてここに充てる。Aの電源断とBの通信中断、更新失敗時の復帰は模擬環境で確認し、Cの文言崩れは外部に委託する。","Dの署名検証には専門要員を専任で充て、申請に提出できる形の検証記録を残す。Aの電源断は模擬環境で再現し、実車の枠は更新失敗時の復帰の確認に充てる。Bの通信事業者の差は模擬環境の地域設定を切り替えて確認し、Cは外部に委託する。","Aの電源断は模擬環境で再現し、実車の枠はBの地域ごとの通信事業者の差の確認に充てる。Dの署名検証は要員の手当てが付く範囲に絞り、浮いた工数をAとBの確認に回す。Cは費用の軽い外部委託にとどめる。","Aの電源断を実車で再現して月2台の枠をすべて使い、Dの署名検証は専門要員が他の作業と兼務しながら進める。Bの通信事業者の差は模擬環境で確認し、Cは外部に委託する。"],"answer":[1],"explanation":{"signals":"1つ目の表は算出済みの損失を与えるだけで、この問題の難しさはそこにない。効くのは2つ目の表との対応関係である。実車でしか確認できないのは更新失敗時の復帰であること、電源断・通信断の再現も、地域ごとの事業者網の接続設定とタイムアウトの挙動の再現も模擬環境で行えること、署名検証の要員は1名で代われる者がいないこと、多言語表示の確認は費用も日程も制約なく外部に委託できること。型式認証の申請に検証の記録を提出するという義務は、Dをどこまで見て何を残すかの下限を与える与件であって、4つの案の優劣そのものを決めるわけではない。","why":"見込まれる損失は算出済みで、A=240 > D=200 > B=56 > C=4 である。この問題で効くのは、その順位そのものよりも2つ目の表との突き合わせである。Aは2段で軽減する。電源断を起こすこと自体は模擬環境で再現でき、その後に車両が起動不能にならずに戻せるかは実車でしか確認できない。したがって月2台・各3日しかない実車の枠は復帰の確認に充てるのが合理的で、電源断の再現そのものに使い切る必要はない。Dは代われる者がいない専門要員を専任にし、申請に提出できる形の記録まで残す。認証で求められる記録は、リスクの重さとは独立に下限を与える。比例配分はその下限の上で働くので、記録を残すことと専任を置くことは択一ではない。シラバスは、リスクレベルが高いほどテストは労力をより集中させて行うべきであるとし、時間と労力はリスクレベルに比例すべきであるとしている。Bは事業者網の接続設定とタイムアウトの挙動まで切り替えられる模擬環境で確認でき、Cは最も軽いうえ外部委託に費用も日程の制約もないため委託で足りる。シラバスはテストアイテム・品質特性・テストレベル・テストチームといったコンテキストに基づく要因を分析して適切なテストアプローチを選ぶべきだとしており、この計画はいずれの要因にも整合する。\nこの計画が引き受けるものもある。実車は月2台・各3日しかないため、復帰の確認は限られた条件でしか行えず、車種と地域の組み合わせすべてを実車で見ることはできない。事業者網の確認を模擬環境で行う以上、実際の商用網でしか出ない挙動は確認しないまま残る。またDを1名に専任させることは、その1名が単一障害点になることを引き受ける判断でもあり、知識の移転や外部の評価機関への一部移転を別途手当てする必要がある。","distractors":["前提は正しい。Dの署名検証は型式認証の申請時に検証の記録を求められる対象であり、記録を残す必要がある。誤っているのは希少な資源の充て先だけである。署名検証は実車でしか確認できない性質のものではなく、実車でしか確認できないのは更新失敗時の復帰である。実車の枠をすべて署名検証に充てたうえで、復帰の確認を模擬環境に回しているが、模擬環境では車両の起動挙動を再現できない。どの資源でしか確認できないかは2つ目の表にしか書かれておらず、損失の順位からは決まらない。この選択肢は損失の順位にも制約にも反しておらず、2つ目の表を読まない限り正解と区別できない",null,"Aの電源断を模擬環境で再現するところまでは正解と同じである。誤りは2つある。1つは実車の枠の充て先で、Bの地域ごとの通信事業者の差は模擬環境の地域設定を切り替えれば確認できるのに、月2台・各3日しかない実車をそこに使っており、実車でしか確認できない更新失敗時の復帰の確認が計画から消える。もう1つはDの扱いで、手元の要員で手当てできる範囲までDの署名検証を絞っている。Dの見込み損失は200で4件のうち2番目に重い。資源が足りないことは、そのリスクを軽減しなくてよいことを意味しない。シラバスは時間と労力をリスクレベルに比例させるべきだとしており、比例させる相手はリスクレベルであって手元の要員数ではない。要員が不足するのであれば、それ自体を制約として示し、移転や増員を含めて判断を仰ぐ筋になる","Aの電源断は模擬環境で再現できるため、実車の枠をその再現に使い切る根拠がない。使い切ると、実車でしか確認できない復帰の確認が残らない。またDの署名検証を他の作業と兼務しながら進める点は、リスクレベルが高いほどテストは労力をより集中させて行うべきであり、時間と労力はリスクレベルに比例すべきであるという記述から外れる。Dは200で2番目に重く、労力を分散させる相手ではない"],"flip":[null,null,null,null],"flipNote":{"1":"この案を正しくするには、2つ目の表の2行をどちらも書き換える必要がある。署名検証が実車の上でしか成立しない仕組みに変えても、更新失敗時の復帰は依然として実車でしか確認できないため、実車の枠をすべて署名検証に使い切るこの案では復帰の確認が残らない。逆に復帰を模擬環境で確認できる仕組みに変えても、署名検証に実車を充てる理由は生まれず、代われる者のいない専門要員を専任に置く案のほうが残る。1条件では反転しない。","3":"この案の誤りは2つある。模擬環境の地域設定を切り替えれば確認できるBに月2台・各3日しかない実車を充てて、実車でしか確認できない更新失敗時の復帰を計画から落としたことと、Dの厚みを手元の要員数に合わせて絞ったことである。地域ごとの事業者網を実車でしか確かめられない仕組みに変えても、復帰の確認が計画から消えることは変わらない。Dの絞り込みが正当になるのは同等の経験を持つ要員が他にいるか、Dが最も軽い場合で、いずれも別の条件になる。1条件では反転しない。","4":"この案の誤りは2つある。模擬環境で再現できる電源断に月2台の実車の枠をすべて使ったことと、見込み損失が2番目に重いDの署名検証を兼務で進めたことである。電源断が模擬環境では再現できない仕組みに変えれば実車を充てる理由は立つが、そのときも枠を使い切れば更新失敗時の復帰の確認が残らず、労力を集中させるべきDを兼務にする点も変わらない。兼務を正当化するには4件の見込み損失が同程度であることまで必要で、条件が2つになる。"},"quote":"テストを通じて全体的なリスクを最もよく軽減するために、テストマネージャーは、次のようなコンテキストに基づく要因を分析し、適切なテストアプローチを選択すべきである／リスクレベルが高いほど、テストは早期に開始して、労力をより集中させて長期間にわたって行うべきである。","ref":"1.3.4（コンテキスト要因・比例原則）／1.3（労力の集中）","misconception":"リスクの重さだけで資源を配分し、その資源でしか確認できないものは何かという観点を持っていない。また資源が足りないことを、リスクを軽減しなくてよい理由として使ってしまう"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスクエクスポージャー","テストアプローチの選択","テストレベルの選択"],"distractorIntent":["希少な資源を、それでしか確認できない対象に充てない（宣言軸を担う誤答）","希少な資源を模擬環境で足りる相手に充て、資源の不足を上位のリスクの範囲を絞る理由にする","模擬で足りる対象に希少資源を使い切り、上位のリスクに労力を集中させない"],"distractorTypes":["D2","D2+D3","D2+D4"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3/1.3.4（比例原則、労力の集中、コンテキスト要因）＋ 公式サンプル SET B 問11 の「資源の制約が選択肢の絞り込みに効く」構造。誤答1は2つ目の表を読まないと消えず、誤答3は正解と1要素だけ違う惜しい誤答にした。誤答3は実車の充て先を正解とずらし、2つ目の表を読まないと落とせないようにした。規制要件（申請用の記録）は正解の内側でも働かせ、誤答を殺すだけの与件にしていない","mistakePatterns":["MP-05","MP-04"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2）は2つ目の表（実車でしか確認できないもの）で一意。flipNote 3本とも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-syllabus-2026-09-13-t3.md","sig":"e379dea3ebb2","explSig":"6f7af8b82ee3","fieldSig":{}},{"lens":"qa","date":"2026-09-11","round":3,"result":"pass","note":"正解への記録の追加は解消。ただし誤答3の実車の充て先を B に変えた結果、","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-qa-2026-09-11-r3.md","sig":"e379dea3ebb2","explSig":"6f7af8b82ee3","fieldSig":{}},{"lens":"item","date":"2026-09-11","round":3,"result":"pass","note":"I6・I7 とも解消し、宣言軸が最後の2択（1 対 2）に戻った。代わりに**「更新失敗時の復帰」を名指しするのが正解だけ**になり、伏せた状態で正解が一意に目立つ。誤答1に同じ対象への言及を1つ置けば消える。分量が5問中最大（947字）で","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-item-2026-09-11-r3.md","sig":"e379dea3ebb2","explSig":"6f7af8b82ee3","fieldSig":{}}]},"variantAxis":"希少な資源でしか確認できないものは何か（2表の突き合わせ）"},{"id":"q-1.3.4-A-5","lo":"TM-1.3.4","cluster":"1.3.4-A","clusterName":"リスクレベルに応じたテスト活動の選択","variant":5,"chapter":1,"section":"1.3","k":4,"points":3,"type":"single","minutes":4,"scenario":"総合ECモールで週次のリリースを回している。テスト要員は8名で、うちセキュリティ診断の経験者は2名である。性能を測れる環境は週に1回・6時間しか確保できない。\n\n決済はカード情報を扱う部分を外部の決済代行サービスに委ねている。自社に残る代行との連携部分は、直近の四半期に外部の脆弱性診断を受けて指摘の是正まで終えており、今週のリリースにこの部分の変更は入っていない。レビュー投稿は画像と自由記述を受け付け、そのまま商品ページに表示する。\n\n各機能について、品質特性ごとの重さを次のように整理した。","table":{"caption":"機能ごとの重さ（品質特性別）","headers":["機能","セキュリティ","性能効率性","機能適合性"],"rows":[["決済","中","高","高"],["会員認証","高","中","中"],["検索","低","高","中"],["レビュー投稿","高","低","中"]]},"question":"この整理と制約を分析したとき、テスト活動の割り当てとして最も適切なものはどれか。1つ選べ。","choices":["セキュリティ診断の経験者2名を会員認証とレビュー投稿に1名ずつ置き、決済のセキュリティは代行との連携部分に絞る。性能環境の週1枠は決済と検索に使い、機能面の厚みは決済に寄せる。","セキュリティ診断の経験者2名は決済と会員認証に1名ずつ充て、レビュー投稿のセキュリティは通常の確認にとどめる。検索と決済には週1回の性能環境を割り当て、代行との連携部分を含む決済の機能面も厚く確認する。","変更した画面数の多い機能から順に労力を配分し、セキュリティ診断の経験者2名は変更量の多い機能に割り当てる。週1回の性能環境は、その週に変更のあった機能の確認に充てる。","週の前半は4機能を一巡して様子を見ることに充て、どこに労力を寄せるかはその結果を見てから決める。週1回の性能環境は、一巡で気になった機能の確認に充てる。"],"answer":[0],"explanation":{"signals":"効くのは機能×品質特性の12マスと、本文に置かれた2つの但し書き、そして2つの資源の制約である。決済は、自社に残る代行との連携部分について直近の四半期に外部の脆弱性診断と是正を終えており、今週のリリースにその部分の変更が入っていない。この2つがこの週の可能性を下げているため、セキュリティは中に置かれている。カード情報を扱う部分を決済代行に委ねたことで、自社が見る範囲は代行との連携部分に絞られている。そのうえでこの週は、その部分の可能性も下がっている。一方でレビュー投稿は画像と自由記述をそのまま商品ページに表示するため、セキュリティが高に置かれている。ECの一般的な感覚では決済のセキュリティが最も重く、レビュー投稿は軽いと考えがちなので、表と但し書きを読まずに配分すると、ここで外れる。セキュリティ診断の経験者が2名であること、性能を測れる環境が週1回・6時間しかないことが、配分の上限を決める。表は数値ではなく高・中・低の順序尺度なので、積を計算するのではなく、高が立っている軸を見る。","why":"高が立っているマスを軸ごとに拾う。セキュリティが高いのは会員認証とレビュー投稿、性能効率性が高いのは決済と検索、機能適合性が高いのは決済である。シラバスは、特定の品質特性に影響するリスクは、特定のテスト労力・テスト環境・テストスキルを必要とする関連するテストタイプによって軽減されるべきであるとし、最もリスクレベルの高いテストアイテムは最も適任な担当者がテストすべきであるとしている。したがって、限られたセキュリティ診断の経験者2名はセキュリティが高い会員認証とレビュー投稿に1名ずつ充てるのが、スキルという資源の置き方として正しい。決済のセキュリティは中であり、自社に残る攻撃面が代行との連携部分に集中していることを踏まえて、そこに絞るのが妥当である。週1回しかない性能環境は、性能効率性が高い決済と検索に配分する。機能適合性が高いのは決済だけなので、機能面の厚みは決済に寄せる。\nこの配分が残すものもある。性能環境が週1回・6時間である以上、決済と検索の測定は事前にピークのシナリオとしきい値を決めた一度きりになり、測って直して測り直す反復はその週には入らない。決済のセキュリティを連携部分に絞ることは、代行側の実装に依存する部分を自社では見ないという判断でもあり、その範囲は代行との取り決めで押さえておく必要がある。決済の重さが中なのは、代行への移転で自社が見る範囲が連携部分に絞られ、そのうえでこの週はその部分の可能性も下がっているからである。移転による範囲の絞り込みはこの先も続くが、可能性の低下はこの週の条件に依存するので、決済まわりに変更が入る週や、診断からの間隔が空いた時点では、この配分をそのまま持ち越せない。","distractors":[null,"セキュリティの重さを、整理した表からではなく機能の名前から判断している。決済とセキュリティ、レビュー投稿と軽さという結び付きは多くのECで実際に成り立つため、この配分はもっともらしく見える。しかしこの状況の表では決済のセキュリティは中、レビュー投稿のセキュリティは高であり、その理由は本文に書かれている。決済は代行との連携部分について直近の四半期に診断と是正を終えており、今週のリリースにその部分の変更が入っていない。レビュー投稿は画像と自由記述をそのまま商品ページに表示する。限られた経験者2名を、高が立っていない決済に1名充て、高が立っているレビュー投稿を通常の確認にとどめる点が、最もリスクレベルの高いテストアイテムに最も適任な担当者を充てるという記述から外れる。性能環境と機能面の配分は正解と同じであり、誤りはセキュリティの1軸だけにある","変更した画面数を配分の基準にしている。週次リリースで変更のあったところを見るのは実務でよく行われる進め方であり、それ自体が誤りというわけではない。誤りは、品質特性ごとの重さを整理した表があるのに、それを別の指標で置き換えている点である。変更率はリスク可能性を左右する要因の1つであり、表に織り込むべき入力であって、表を上書きする指標ではない。この基準では、セキュリティが高い会員認証やレビュー投稿にその週の変更が無ければ、経験者2名がそこに充てられない","整理した表を配分の根拠に使わず、一巡した結果を見てから決めることにしている。シラバスは、特定の品質特性に影響するリスクは、特定のテスト労力・テスト環境・テストスキルを必要とする関連するテストタイプによって軽減されるべきであるとしており、どの機能にどの特性の重さが立っているかはすでに整理されている。週1回しかない性能環境を「一巡で気になった機能」に充てることは、性能効率性が高いと整理された決済と検索にその枠が渡る保証がないことを意味する。また、リスクレベルが高いほどテストは早期に開始すべきであり、経験者の割り当てを一巡のあとまで待つ理由が表からは出てこない"],"flip":[null,"レビュー投稿が画像と自由記述をそのまま商品ページに表示せず、あらかじめ用意した定型の評価だけを選ばせる仕組みで、表のレビュー投稿のセキュリティが低であれば、セキュリティが高いのは会員認証だけになり、限られた経験者2名は会員認証と、次に重い決済に置くことになるので、この配分が正しくなる。誤っているのは決済にセキュリティの手を入れたことではなく、高が立っている機能を表で確かめずに機能の名前で配ったことである。",null,null],"flipNote":{"3":"変更した画面数を配分の起点にしてよいのは、品質特性ごとの重さの整理が手元に無いときである。しかしその整理はこの状況に与えられた入力そのものであり、取り去れば、整理と制約を分析してどこに労力を置くかを決めるという問い自体が立たなくなる。表を残したまま変更量を正しい起点に変える条件は状況の側に無い。変更率はリスク可能性を左右する要因として表に織り込むべき入力であって、表を置き換える指標ではないからである。","4":"一巡して様子を見てから配分を決めるのが合理的になるのは、機能ごとの重さが事前に分かっていないときである。しかし品質特性ごとの重さの整理はこの状況に与えられた入力そのもので、それを取り去る条件は問い自体を消してしまう。表が与えられたまま一巡を先に置く理由は、経験者2名・週1回6時間の性能環境という資源の制約の側からも出てこない。どちらの資源も、どこに置くかは表を読めば決まるからである。"},"quote":"品質特性：特定の品質特性に影響するリスクは、特定のテスト労力、テスト環境、テストスキルを必要とする関連するテストタイプによって軽減されるべきである。／テストチーム：最もリスクレベルの高いテストアイテムは、最も適任な担当者がテストすべきである。","ref":"1.3.4","misconception":"品質特性ごとの重さを、整理された表ではなく機能の名前や変更量から決めてしまい、限られたスキルと環境をどこに置くかを常識で配ってしまう"},"meta":{"concept":"リスクベースドテスト","relatedConcepts":["リスクエクスポージャー","テストアプローチの選択","テストレベルの選択"],"distractorIntent":["セキュリティの重さを表ではなく機能の名前から判断する（宣言軸を担う誤答）","整理された表を変更量で置き換える","配分の判断を一巡の結果まで待つ"],"distractorTypes":["D4","D2","D7"],"conceptNote":"jstqb-al-tm/kb/concepts/risk-based-testing.md","confidence":"高","basis":"シラバス1.3.4（品質特性、テストチーム、比例原則）＋ 公式サンプル SET B 問12（順序尺度の表→比例配分）の構造。表のセキュリティ列を業種の常識と食い違う配置にし、その理由を本文に置いた。誤答1は常識どおりの配分で、表を読まないと正解と区別できない。決済のセキュリティを中に置く根拠は、委託による自社の範囲の絞り込みに、1.3.3 の可能性要因（直近の品質保証活動と、その部分の変更の有無）を重ねて置いた","mistakePatterns":["MP-05","MP-03"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は表の「高」3軸で一意。flip[1] は本文の一文と表のマスが従属関係にあるため1条件として成立","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-syllabus-2026-09-13-t3.md","sig":"80ffa3ef8603","explSig":"89f3d5238354","fieldSig":{}},{"lens":"qa","date":"2026-09-11","round":4,"result":"pass","note":"シナリオの現実味・判断の実在性・解説の深さ・flip とも指摘なし（厚くする材料を2件）","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-qa-2026-09-11-r4.md","sig":"80ffa3ef8603","explSig":"89f3d5238354","fieldSig":{"scenario":"d388fb40f215","選択肢1":"88e6dcd21d64","選択肢3":"127b974e2f44"}},{"lens":"item","date":"2026-09-11","round":4,"result":"pass","note":"表と但し書きが担うはずの「決済＝中」の反転を、選択肢の文面が自己開示している","ref":"jstqb-al-tm/kb/reviews/TM-1.3.4-item-2026-09-11-r4.md","sig":"80ffa3ef8603","explSig":"89f3d5238354","fieldSig":{"選択肢1":"88e6dcd21d64","選択肢2":"1375ec35bdb7","scenario":"d388fb40f215","explanation.signals":"26004c471436","選択肢3":"127b974e2f44","選択肢4":"6e3781d114ad"}}]},"variantAxis":"順序尺度の表から品質特性ごとのテストタイプへ配分（公式問12型）"},{"id":"q-1.4.2-A-1","lo":"TM-1.4.2","cluster":"1.4.2-A","clusterName":"組織的テスト戦略とプロジェクトコンテキストからテストアプローチを組み立てる","variantAxis":"V字・規制ドメインで、希少な台上の枠と使えない納入記録という2つの資源の制約を突き合わせ、静的テストとコンポーネントテストをどこで誰がいつ行うかを決める（制約3項目の箇条書き・公式問15型）","variant":1,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは商用車の電動パーキングブレーキの制御ソフトのテストマネージャーである。開発はV字モデルで、機能安全の規格への適合を社外の審査で示す。ハードウェアと一部のソフトウェアは3社のサプライヤから調達し、残りは自社で開発する。納入物にはソースコードと設計書が含まれ、中身を自社で見られる。\n\n組織のテスト方針は、テストレベルごとの検証の記録と、要件から個々のテストまでの対応づけを全社に求める。コンポーネント単位の実行は開発用の模擬環境で行えるが、結合から先は実際のハードウェアがつながるため台上の設備でしか行えない。設備は1式で他の車種が通年で押さえ、審査まで6週間しか取れず、増設も借用も間に合わない。この枠は、3社と自社がつながった状態でしか見られない項目でほぼ埋まる。3社の納入は審査の4か月前に終わり、模擬環境での作業は枠の前に収まる。\n\nただし、次の3点がある。\n\n・3社のうち2社はコンポーネント単位の検証の記録に消極的で、納入時の適合の宣言までだと回答している。契約は締結済みで提出を新たに義務づけられない。残る1社は記録を出すが、自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても使えない\n・経営層は、納期を1か月縮めるため形式的な静的解析の工程を省くことを検討している。審査機関は、納入分も含めたコード全体の静的解析と規約適合の証拠を、コンポーネントの段階でそろえて示すよう求めている\n・前回の審査では、不具合の分類が担当者ごとにばらつき、レビューの網羅の記録がないと指摘された","question":"この状況を分析したうえで、テストアプローチとして最も適切なものはどれか。1つ選べ。","choices":["記録を出す1社の分は提出された記録を受け入れの根拠とし、残る2社の分を自社で見る。静的解析は納入分について結合の前に終え、規約適合の証拠までそろえるが、コンポーネントテストは工数の山を避けて着手を台上の枠が始まる時期にそろえ、結合の確認と並行して行う。対応づけはどのレベルでも切らさず、レビューの網羅と不具合の分類の統一、根本原因の分析を行い、サプライヤの不具合報告にも自社の区分を当てる。","3社から納入されたコンポーネントは、いずれも受け入れの時点で自社が静的解析とコンポーネントテストを行い、結合を始める前に終えて記録に残す。台上の枠は、つないだときにしか現れない事象を見ることに充てる。対応づけは全テストレベルで保ち、形式的なレビューの網羅と、統一した区分による不具合の分類および根本原因の分析も行う。","記録の出る1社については提出された記録を受け入れの判断に用い、残る2社の分は自社が静的解析とコンポーネントテストを行って結合の前に終える。静的解析は、安全上の影響が大きいと分類した部位に絞って納期を1か月縮める案に応じ、空いた工数は台上での確認の厚みに回す。対応づけはテストレベルを問わず保ち、レビューの網羅も記録し、不具合の分類の統一と根本原因の分析も行う。","提出される記録がある1社については自社での実施を省き、納入時の適合の宣言までだとする2社の分は受け入れの時点で静的解析とコンポーネントテストを済ませ、結合に入る前に終える。結合の確認は開発用の模擬環境で一通り前倒しして済ませ、台上の6週間は最終の確認に絞る。対応づけはユニットから受け入れまで切らさず、レビューの網羅を記録し、不具合の分類をそろえて根本原因まで分析する。"],"answer":[1],"explanation":{"signals":"判断に効くのは3点の箇条書きと、その前段に置かれた資源の条件である。納入物にソースコードと設計書が含まれ、中身を自社で見られることは、納入されたコンポーネントに自社が静的解析とコンポーネントテストを行う道が開いていることを意味する。コンポーネント単位の実行は開発用の模擬環境で行えるが、実際のハードウェアがつながる結合から先は台上でしか行えず、その台上は1式で6週間しか取れないうえ、つながった状態でしか見られない項目が枠をほぼ使い切る。3社の納入は審査の4か月前に終わり、模擬環境での作業に充てる要員と期間は枠の前に確保できている。組織のテスト方針は、テストレベルごとの検証の記録と、要件から個々のテストまでの対応づけを全社に求め、プロジェクト側で下げられない与件である。箇条書きの1点目は、2社が記録を出さず契約でも新たに求められないことに加え、記録を出す残る1社の記録も独自の項目立てで、方針が求める検証の記録としても対応づけとしても、そのままでは使えないと述べる。2点目は、経営層の省略案に対して、審査機関がコード全体の静的解析と規約適合の証拠をコンポーネントの段階で求めていることを置く。3点目は不具合の分類のばらつきとレビューの記録の欠落を論点に上げる。一方、短縮の幅が1か月であることと、ハードウェアが混在すること自体は、どの選択肢の当否も決めない。","why":"シラバスは、適切なテストアプローチを選ぶために分析しなければならない要因として、ドメイン、組織のゴールと包括的な品質の特徴、プロジェクトのゴールとプロジェクトのタイプ、テストリソース、ソフトウェア開発ライフサイクルモデル、他のシステムとのインターフェース、テストデータの可用性を挙げ、結論として、それらの要因や制約を満たす最適なアプローチとして、テスト技法・テストレベル・テストタイプの組み合わせを決定しなければならないとしている。したがって正答は、どれか1つの要因に答えた案ではなく、挙がった条件を1つずつ全部満たす組み合わせになる。ドメインの要因は、規格への適合を社外の審査で示す立場にあることであり、シラバスはドメイン固有の規制・標準・慣行が、テストの厳密さや求められる文書化とその詳細レベルを変えうると述べている。ここで審査機関は、納入分も含めたコード全体の静的解析と規約適合の証拠をコンポーネントの段階で求めているため、静的解析の対象を絞ることも、後段に回すこともできない。なお、自社開発分の静的解析は組織のテスト方針から来る与件であって選択の対象ではなく、本問の論点は、記録の出ない納入分をどう埋めるかである。テストリソースの要因は二重に効く。1つは台上の設備で、1式で6週間しかなく、つながった状態でしか見られない項目が枠をほぼ使い切るため、模擬環境で済ませられる作業をこの枠に持ち込む余地はない。もう1つは納入された記録で、2社は出さず、出す1社の記録も方針が求める形では使えないため、3社ぶんの検証の記録と対応づけは自社で埋めるほかない。この案は、納入物に含まれるソースコードと設計書を自社で見るという形でその穴を埋め、静的解析とコンポーネントテストを結合の前に終えることで、前段で取り除ける欠陥を希少な枠に流し込まずに済ませている。そのうえでレビューの網羅の記録と、不具合の分類の統一および根本原因の分析で前回の審査の指摘に応えている。記録を出す1社の分まで自社で見る工数を負う点は、この案が引き受けるコストであるが、納入は審査の4か月前に終わり、模擬環境での作業は台上の枠の前に収まるため実行できる。受け入れの根拠を何に置いたかが自社の記録として残るので、審査の場でもそのまま説明できる。挙がった条件のすべてに対応しているのはこの案だけである。","distractors":["記録の出る1社の分は提出された記録で済ませ、残る2社だけを自社で見るという配分は、工数の使い方として最も効率がよく見える。静的解析もコード全体に対して結合の前に終えており、対応づけ、レビューの網羅の記録、不具合の分類の統一と根本原因の分析まで覆っているうえ、サプライヤから届く報告に自社の区分を当てる上乗せもある。しかし本文は、その1社の記録が自社の要件と結びつかない独自の項目立てで、方針が求める検証の記録としても対応づけとしても、そのままでは使えないと述べており、この案では納入分のうち1社ぶんの記録と対応づけが埋まらない。さらに、コンポーネントテストの着手を台上の枠が始まる時期にそろえると、模擬環境で先に取り除けたはずの欠陥が、1式で6週間しかない枠の中で、3社と自社がつながった状態から切り分けられることになる。本文は、つながった状態でしか見られない項目がその枠をほぼ使い切ると述べており、シラバスがテストリソースの要因として挙げるテストインフラの可用性の制約を、この配分は満たしていない",null,"日程の短縮に応じつつ、空いた工数を台上での確認の厚みに回すという交換は、限られた資源の使い方として現場では通りやすい。対応づけ、レビューの網羅の記録、不具合の分類の統一と根本原因の分析も覆っており、残る2社の分は結合の前に自社で見ている。しかし本文は、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠を、コンポーネントの段階でそろえて示すよう求めていると述べている。安全上の影響が大きいと分類した部位に絞る案は、この求めに届かない。シラバスが言うとおり、ドメイン固有の規制・標準・慣行はテストの厳密さと求められる文書化の詳細レベルを変えるのであり、日程を理由にその水準を下げる交換はこのドメインでは成立しない。加えてこの案も、記録の出る1社の記録を受け入れの判断に用いるが、その記録は方針が求める形では使えない","結合の確認を模擬環境で前倒しして済ませ、希少な台上の枠を最終の確認に絞るという組み立ては、限られた設備の使い方として最も筋が通って見える。残る2社の分は結合の前に自社で見ており、対応づけもレビューの網羅の記録も不具合の分類の統一も覆っている。しかし本文は、コンポーネント単位の実行は開発用の模擬環境で行えるが、実際のハードウェアがつながる結合から先は台上の設備でしか行えないと述べている。この案は、模擬環境で結合の確認を代替できるという、本文が明示的に否定した前提の上に立っており、前倒しした分は実行できない。さらに、提出される記録がある1社について自社での実施を省くため、その1社ぶんの検証の記録と対応づけが方針の求める形で残らない"],"flip":[null,null,null,null],"flipNote":{"1":"この案には独立した誤りが2つある。記録を出す1社の分を提出された記録で済ませる点と、コンポーネントテストの着手を台上の枠が始まる時期にそろえる点である。前者は、その1社の記録が自社の要件と結びつかない独自の項目立てで方針の求める形では使えないという本文の1文が退け、後者は、台上が1式で6週間しか取れず、つながった状態でしか見られない項目でほぼ埋まるという条件が退ける。どちらか一方の条件を変えても、残るもう一方が同じ理由でこの案を退けるため、条件を1つ動かしてこの案を選ばせる書き方はない。","3":"この案の誤りも独立に2つある。静的解析を安全上の影響が大きいと分類した部位に絞る点と、記録を出す1社の記録を受け入れの判断に用いる点である。前者は、審査機関が納入分も含めたコード全体の静的解析と規約適合の証拠をコンポーネントの段階で求めるという1文が退け、後者は、その記録が方針の求める検証の記録としても対応づけとしても使えないという1文が退ける。求められる証拠の範囲を安全上の影響が大きい部位に狭めても、記録の穴はそのまま残る。","4":"この案の誤りも独立に2つある。結合の確認を開発用の模擬環境で前倒しして済ませる点と、記録がある1社について自社での実施を省く点である。前者は、実際のハードウェアがつながる結合から先は台上の設備でしか行えないという1文が退け、後者は、その1社の記録が方針の求める形では使えないという1文が退ける。模擬環境で見られる範囲を広げても、省いた1社ぶんの検証の記録と対応づけは埋まらない。"},"quote":"適切なテストアプローチを選択するためには、通常以下の要因を分析しなければならない：ドメイン：プロダクトが作成または修正されるドメイン。ドメイン固有の規制、標準、慣行が、テストの厳密さや求められる文書化、およびその詳細レベルを変える可能性がある。……テストマネージャーは、組織的テスト戦略、プロジェクトコンテキスト、テストに関連するその他の要因や制約を満たす最適なアプローチとして、テスト技法、テストレベル、テストタイプの組み合わせを決定しなければならない。","ref":"1.4.2","misconception":"手元にある記録や設備をそのまま使えるものとして数えてしまい、その記録が方針の求める形になっているか、その設備で行える範囲はどこまでかを、書かれた条件と突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","relatedConcepts":["組織的テスト戦略","ドメイン要因と厳密さ","テストリソースの可用性","静的テストの実施時期"],"distractorIntent":["記録の出る1社の分を提出記録で済ませたうえで、模擬環境で行えるコンポーネントテストの着手を、1式で6週間しかない台上の枠にそろえる（前段で取れる欠陥を希少な枠に持ち込む）","記録の出る1社の分を提出記録で済ませたうえで、審査機関がコード全体に求めている静的解析を、影響の大きい部位に絞って日程の短縮と交換する","記録の出る1社の分の自社実施を省いたうえで、結合の確認を模擬環境で前倒しできるという、本文が否定した前提に立つ"],"distractorTypes":["D3","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス1.4.2（分析すべき7要因、ドメインの具体例、テストリソースの可用性に関するあらゆる制約、結論の一文）、1.4 イントロダクション（組織的テスト戦略は与件）、1.4.1（テストレベル・テストタイプ・テスト技法の組み合わせ）。公式サンプル SET B 問15（V字・機能安全・複数サプライヤ、制約3項目の箇条書き）の構造","mistakePatterns":["MP-32","MP-02"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答は一意、3誤答の否定根拠はシナリオの明示文に実在、quote は 1.4.2 に逐語一致。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-syllabus-2026-09-13-t3.md","sig":"803904cf7bfe","explSig":"7d4cdc631f0d","fieldSig":{"explanation.why":"6d831a65ad25","scenario":"bb916cd99a22"}},{"lens":"qa","date":"2026-09-12","round":5,"result":"pass","note":"正答の4要素すべてに T1 を当てたが、実行の前提（コードの可視性・模擬環境・納入時期）はシナリオが明示的に与えている。T2 も手順2で外れる","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-qa-2026-09-12-r5.md","sig":"803904cf7bfe","explSig":"7d4cdc631f0d","fieldSig":{"explanation.flip[0]":"e3b0c44298fc"}},{"lens":"item","date":"2026-09-12","round":5,"result":"pass","note":"誤答3つとも否定根拠が実在文で、選ぶ人の思考も書ける。T1/T2 いずれも不成立","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-item-2026-09-12-r5.md","sig":"803904cf7bfe","explSig":"7d4cdc631f0d","fieldSig":{"scenario":"bb916cd99a22","選択肢4":"85f582219633","選択肢2":"35f3b3c49d96","選択肢3":"c5e9096864c8"}}],"unfrozen":{"date":"2026-09-12","decidedBy":"user","reason":"凍結の理由書きどおり、r4 の重大は 2026-09-12 の門で判定し直した。qa・item を r5 として一から当て直し、4観点とも重大0。凍結時の本文から1文字も変えていない（sig 不変）。各 r5 は「門の改訂で落ちた」のか「手順を当てても立たない」のかを分けて記録している。","previouslyFrozen":{"date":"2026-09-12","decidedBy":"user","reason":"r4 まで回しても qa・item の重大が残り、修正2巡の上限を超えた（発散）。syllabus は両問とも pass で、シラバス上の正しさは確認できている。残る重大は 2026-09-12 の新しい門ではほぼ中に落ちる種類のため、ユーザーの判断で今の版のまま凍結し、backlog に送る。作り直しはしない。"}}}},{"id":"q-1.4.2-A-2","lo":"TM-1.4.2","cluster":"1.4.2-A","clusterName":"組織的テスト戦略とプロジェクトコンテキストからテストアプローチを組み立てる","variantAxis":"反復型の一般則と規制が逆向きに引くとき、繰り返しの回数・保守できる要員・記録を出せる時点を突き合わせて、確認をどのテストレベルに配分するかを選ぶ（文脈8項目・公式問16型）","variant":2,"chapter":1,"section":"1.4","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは資金移動業の会社で送金アプリのテストマネージャーである。開発は3週間のスプリントで進め、サービスの拡張には当局の審査と監査人の確認を受ける。\n\n組織のコンテキスト\n・テストの方針は、進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くことを求める\n・要件とテストと実行結果の対応づけを記録に残し、当局や監査人の照会に速やかに提示できる状態に置く\n・自動化の度合いを高めることをゴールに掲げるが、自動テストを保守できる要員は2名で成熟度は中程度である\n・品質のゴールは不具合の検出の効率と、不正な送金を防ぐセキュリティに置く\n\nプロジェクトのコンテキスト\n・スプリントごとにリリース候補を作り、そのたびに送金の主要な経路を確認する。審査まで11回ある\n・予算は追加できず要員も増やせない。審査は8か月後で日程を動かせない\n・外部の決済ネットワーク2社と接続する。先方は模擬応答を返す窓口を常時提供するが、実際の接続で流せるのは調整した期間に限られる。端から端までの通しは応答の型の組み合わせが多く、自動化しても保守の負担が大きい\n・対象の端末とOSの版は多岐にわたり、担当者6名のうち3名はこの領域が初めてである","question":"組織とプロジェクトのコンテキストを分析したとき、採るべきテストアプローチはどれか。1つ選べ。","choices":["ユニットから受け入れまでの4つのテストレベルを置き、それぞれに開始と終了の条件を定める。ユニットと統合は開発者と組み、不正な送金に関わる経路から順に、2名で保守できる範囲で自動化する。経路の確認は各テストレベルに割り振り、端から端まで一度に流すのは実接続が使える時期に限る。対応づけはスプリントのたびに更新し、照会に個々のテストと実行結果をそのまま示せる形で保つ。","4つのテストレベルを置き、レベルごとに開始と終了の条件も定める。実行は手順を書いたチェックリストによる手動の確認を主軸に据え、自動化は要員を増やせた段階で不正な送金に関わる経路から広げる。リリース候補ごとに、先方の模擬応答を使って端から端まで通しで流す。対応づけは要件とテストと実行結果を結んだままスプリントごとに更新し、当局や監査人の照会に速やかに提示できる状態に置く。","テストレベルは分けず、スプリントごとにリリース候補が受け入れの条件を満たすかを確認し、足りない分を探索的テストで補う。自動化は回帰の確認に絞り、不正な送金に関わる経路には探索的テストの時間を多めに割く。毎スプリントのリリース候補では、先方の模擬応答を相手に端から端まで通す。対応づけの更新はスプリントの終わりに行い、当局や監査人の照会にはそのつど示せるようにする。","4つのテストレベルと、レベルごとの開始と終了の条件を置く。自動化は不正な送金に関わる経路を中心に、2名で保守できる範囲にとどめる。リリース候補を作るたびに、先方の模擬応答で端から端までの通しを流し、実接続の確認は調整できた期間にまとめて行う。対応づけの更新は審査に向けた節目でまとめて行い、審査の時点で当局や監査人の照会に示せる形に整える。"],"answer":[0],"explanation":{"signals":"効くのは組織のコンテキストの4項目すべてと、プロジェクトのコンテキストの前の3項目である。テストレベルの明示とレベルごとの開始・終了の条件、および照会に速やかに提示できる状態に置く対応づけの記録は、開発の進め方によらず全社に求められる与件である。自動化はゴールでありながら、保守できる要員は2名で成熟度は中程度にとどまり、予算も要員も増やせない。送金の主要な経路を確認する回はスプリントごとに発生して審査まで11回ある。接続先については、先方が模擬応答を返す窓口を常時提供する一方、実際の接続で流せるのは調整した期間に限られ、しかも端から端までの通しは応答の型の組み合わせが多く、自動化しても保守の負担が大きいと置かれている。つまり、模擬応答があるかどうかではなく、11回ぶんの通しを2名で保守できるかが論点である。最後の1項目、すなわち端末とOSの版の多さと、担当者6名のうち3名がこの領域に初めて携わることは、どの選択肢の当否も決めないノイズである。","why":"シラバスは、ソフトウェア開発ライフサイクルモデルを、適切なテストアプローチを選ぶために分析する要因の1つとして挙げているが、それは並ぶ要因のうちの1つにすぎない。ドメインの要因は、ドメイン固有の規制・標準・慣行がテストの厳密さや求められる文書化とその詳細レベルを変えうるというものであり、組織のゴールの要因は、テスト自動化の度合いを高める必要性や、テストの成熟度・欠陥検出の効率性といったテストプロセスの品質の特徴を含み、これらによって適応すべきテストレベルやテストタイプを決定することがあるというものである。したがって、3週間のスプリントで進めていること自体は、テストレベルを明示しない理由にはならない。もっとも、4つのテストレベルを置く案は1つではない。残りを分けるのは、送金の主要な経路の確認をどのテストレベルに配分するかと、記録をいつ照会に出せる状態にするかである。シラバスは、他のシステムとのインターフェースの要因について、システムオブシステムズでは他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠であると述べている。本問では、端から端までの通しは応答の型の組み合わせが多く自動化しても保守の負担が大きいうえ、確認の回は審査まで11回あり、保守できる要員は2名で増やせない。したがって、毎回の通しを積み上げるのではなく、確認を各テストレベルに配分し、端から端までの通しは実接続が使える時期に合わせるのが、この条件のもとで成り立つ配分である。この案は、4つのテストレベルとレベルごとの開始・終了の条件で組織のテストの方針に応え、2名で保守できる範囲に絞った自動化で、自動化を高めるというゴールと成熟度が中程度であるという条件の双方に収まり、不正な送金に関わる経路から順に手当てを厚くすることで品質のゴールと増やせない予算に応え、スプリントごとに更新する対応づけで、当局と監査人の照会に速やかに提示できる状態を常に保っている。判断に効く項目のすべてを満たすのはこの案だけである。","distractors":[null,"テストレベルも開始と終了の条件も置き、対応づけはスプリントごとに更新して照会に出せる状態にし、模擬応答を使った通しの確認まで計画に入れており、必要な項目には一通り答えている。自動テストを保守できる要員が限られることを理由に手動を主軸に置く判断も、現場では筋が通って見える。しかし本文は、送金の主要な経路を確認する回がスプリントごとに発生し、審査まで11回あると述べている。手順を書いたチェックリストによる手動の確認を主軸に据えると、同じ確認を11回繰り返すことになり、しかも要員は増やせないと本文にあるため、自動化を増員の後に広げるという前提そのものが成り立たず、組織が掲げた自動化の度合いを高めるというゴールに到達しない。加えて、保守の負担が大きい端から端までの通しをリリース候補ごとに積み上げる点も、2名という保守の枠に収まらない","スプリントごとに受け入れの条件を満たすかを確認し、足りない部分を探索的テストで補う進め方は、反復型の開発では広く使われており、それ自体は妥当である。対応づけをスプリントごとに更新する点も満たしている。しかし組織のテストの方針は、進め方によらずテストレベルを明示し、レベルごとに開始と終了の条件を置くことを求めており、この案はそこに応えていない。開発の進め方から来る一般的な傾向を、ドメインと組織の方針が課す条件より優先している。さらに、保守の負担が大きい端から端までの通しをリリース候補ごとに流す一方で、自動化を回帰の確認に絞る配分は、11回という回数と2名という保守の枠に照らしても成り立たない","4つのテストレベルと開始・終了の条件を置き、自動化も2名で保守できる範囲にとどめ、実接続の確認も先方と調整できた期間にまとめており、正答と同じ範囲を覆っている。対応づけの更新をまとめて行うのは、限られた要員の使い方として現場では通りやすい。しかし本文は、対応づけを記録に残し、当局や監査人の照会に速やかに提示できる状態に置くことを組織の方針として求めており、節目までその状態が空く計画はこれを満たさない。加えて、模擬応答を使った端から端までの通しをリリース候補ごとに流すと、応答の型の組み合わせの多さから保守の負担が11回ぶん積み上がり、2名で保守できる範囲という枠を、自動化の本来の対象である不正な送金に関わる経路から奪うことになる"],"flip":[null,null,null,null],"flipNote":{"2":"この案の誤りは2つある。手順を書いたチェックリストによる手動の確認を主軸に据える点と、保守の負担が大きい端から端までの通しをリリース候補ごとに流す点である。前者は、送金の主要な経路を確認する回が審査まで11回あることと、要員を増やせないことの双方に支えられて退けられ、後者は、自動テストを保守できる要員が2名で成熟度が中程度であるという条件に退けられる。要員を増やせる条件に変えても、正答の案はどの条件にも触れずに成り立ったままなので、この案がそれに代わって選ばれることにはならない。","3":"この案の誤りは2つある。テストレベルを分けない点と、端から端までの通しをリリース候補ごとに流す点である。前者は、進め方によらずテストレベルを明示しレベルごとに開始と終了の条件を置くという組織のテストの方針が退け、後者は、保守できる要員が2名であることと確認の回が11回あることが退ける。方針がテストレベルの置き方をプロジェクトに委ねる条件に変えても、通しの保守が2名の枠に収まらない点は残る。","4":"この案の誤りは2つある。対応づけの更新を審査に向けた節目にまとめる点と、端から端までの通しをリリース候補ごとに流す点である。前者は、対応づけを当局や監査人の照会に速やかに提示できる状態に置くという組織の方針が退け、後者は2名という保守の枠が退ける。照会が審査の時点にまとめて来る条件に変えても、11回ぶんの通しの保守は2名の枠を超えたままである。"},"quote":"組織のゴールと包括的な品質の特徴：組織のゴールには、テストの価値の説明の必要性、テスト自動化の度合いを高める必要性、テストの成熟度や欠陥検出の効率性などテストプロセスの品質の特徴を含む。これらによって、適応すべきテストレベルやテストタイプを決定することがある。……他のシステムとのインターフェース：システムオブシステムズでは、テストを他のチームやプロジェクトと調整し、特にシステム統合テストのために適切なテストレベルを選択することが不可欠である。","ref":"1.4.2","misconception":"反復型の開発では軽くしてよいという一般的な傾向を、ドメインと組織の方針が課す条件より優先し、さらに、端から端まで通しで確認する回を増やすほど手厚いと考えて、その保守を審査までに何回、何人で負うのかまでは突き合わせていない"},"meta":{"concept":"プロジェクトテスト戦略とテストアプローチの選択","relatedConcepts":["組織的テスト戦略","組織のゴールと自動化の成熟度","他のシステムとのインターフェース","テストレベルの選択"],"distractorIntent":["必要な項目には一通り答えるが、手動のチェックリストを主軸に据え、自動化を増員の後に回す（繰り返しの回数と、増やせない要員に合わない）","反復型の一般則に従いテストレベルを明示せず、受け入れの条件と探索的テストで代える","正答と同じ範囲を覆うが、対応づけの更新を審査の節目にまとめ、保守の負担が大きい通しの確認をリリース候補ごとに積み上げる"],"distractorTypes":["D3","D2","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス1.4.2（ドメイン、組織のゴールと包括的な品質の特徴、テストリソース、ソフトウェア開発ライフサイクルモデル、他のシステムとのインターフェースの各要因と具体例）。公式サンプル SET B 問16（アジャイル3週スプリント＋規制、組織コンテキスト4項目とプロジェクトコンテキスト4項目の箇条書き）の構造","mistakePatterns":["MP-11","MP-07"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"同上。flipNote 3本はいずれも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-syllabus-2026-09-13-t3.md","sig":"bc95aaa5d2a3","explSig":"a8b839ac06b6","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":5,"result":"pass","note":"正答の4要素は与えられた要員・期間・接続の窓で実行でき、柱のいずれもシナリオが先回りして満たしていない。重大は立たない","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-qa-2026-09-12-r5.md","sig":"bc95aaa5d2a3","explSig":"a8b839ac06b6","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":5,"result":"pass","note":"同上。誤答3つが共有する語（収束）は残るが reportOnly であって門ではない","ref":"jstqb-al-tm/kb/reviews/TM-1.4.2-item-2026-09-12-r5.md","sig":"bc95aaa5d2a3","explSig":"a8b839ac06b6","fieldSig":{"選択肢2":"e4960220032c","選択肢4":"095d0ac2bde0","選択肢1":"7a00aaa1cd4c"}}],"unfrozen":{"date":"2026-09-12","decidedBy":"user","reason":"凍結の理由書きどおり、r4 の重大は 2026-09-12 の門で判定し直した。qa・item を r5 として一から当て直し、4観点とも重大0。凍結時の本文から1文字も変えていない（sig 不変）。各 r5 は「門の改訂で落ちた」のか「手順を当てても立たない」のかを分けて記録している。","previouslyFrozen":{"date":"2026-09-12","decidedBy":"user","reason":"r4 まで回しても qa・item の重大が残り、修正2巡の上限を超えた（発散）。syllabus は両問とも pass で、シラバス上の正しさは確認できている。残る重大は 2026-09-12 の新しい門ではほぼ中に落ちる種類のため、ユーザーの判断で今の版のまま凍結し、backlog に送る。作り直しはしない。"}}}},{"id":"q-1.4.3-A-1","lo":"TM-1.4.3","cluster":"1.4.3-A","clusterName":"スマートの法則をテスト目的の定義に適用する","variantAxis":"与えられた曖昧な目的を書き直す（公式問17型・状況は散文）。欠落させる文字は A ／ S・A ／ S・T","variant":1,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは私立大学の履修登録システムを刷新するプロジェクトのテストマネージャーである。履修登録の確定は、教務基幹システムの履修データ更新と、外部の学費収納サービスへの納入状況照会を経る。学費収納サービスには検証用の接続先があり、照会の応答は本番と同じ平均2秒で、本プロジェクトでは改善できない。\n\n教務部長からは「4月の履修登録が集中しても止まらず、速く動くシステムにしてほしい」と伝えられている。プロジェクトのゴールは、履修登録の期間に窓口へ回る問い合わせを前年より増やさないことだと合意されている。\n\nテスト担当は3名。応答時間を測れる検証環境は1系統で、負荷ツールで測れるのはそこに置いた自大学のシステムに限られる。システムテストは3月20日に終える計画である。前年、同時に操作した学生は最多の時間帯で1,200人前後であった。","question":"教務部長の要望を書き直した次の案のうち、スマートの法則を適用したテスト目的として最も適切なものはどれか。","choices":["教務基幹システムと学費収納サービスへの連携を含めた履修登録の確定処理が、同時3,000人でも1秒以内に応答することを、3月20日までに確認すること","履修登録の確定までの一連の処理で、同時1,500人の応答が3秒以内であることを、3月20日までに確認すること","他大学が導入している同種のシステムと比べて、履修登録の応答が2割以上速く、より安定して動くことを、3月20日までに確認すること","履修登録の確定処理について、性能に関する3つの指標がいずれも基準値を満たしていることを、リリース前までに確認すること"],"answer":[1],"explanation":{"signals":"効くのは、第1段落の連携経路と第3段落の検証側の制約である。履修登録の確定が学費収納サービスへの照会を経ること、その照会には検証用の接続先があり応答は本番と同じ平均2秒で本プロジェクトでは改善できないこと、検証環境が1系統で、負荷ツールで測れるのはそこに置いた自大学のシステムに限られること。これらが、案の掲げる水準にこのプロジェクトの手が届くか、そもそも測れるか（A）を判定する物差しになる。前年の同時利用が最も多い時間帯で1,200人前後であったことは、掲げる同時利用数が見込みの延長にあるかの目安になる。合意されたゴール、すなわち履修登録の期間に窓口へ回る問い合わせを前年より増やさないことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になる。システムテストを3月20日に終える計画は、完了期限（T）を日付で書ける状態にあることを示す。テスト担当が3名であることは、案の当否を分けない。","why":"スマートの法則は5つの要素が同時に立って初めて成立する。シラバスは S を「明確あるべきで曖昧ではないものであるべき」、M を「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」、A を「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」、R を「プロジェクト全体の目的に沿ったものでなければならない」、T を「具体的な時間枠と完了期限を定めるべきである」と定めている。正解の案は、測る対象を「履修登録の確定までの一連の処理」と一意に書いているため S が立つ。同時1,500人・応答3秒以内という進捗基準を持つため M が立つ。同時1,500人は前年の最大1,200人前後の見込みの延長にあり、確定処理の経路にある学費収納サービスには検証用の接続先が用意されているため、外部照会を含めた一連の処理にこの負荷をかけて測ることができる。応答3秒以内は、改善できない照会（平均2秒）を含めても、残り1秒を自システム側の処理に充てられる水準である。測る条件を1本に絞っているため、1系統の検証環境でも3月20日までに実施できる。ここで A が立つ。混雑しても止まらず問い合わせを増やさないというゴールに直結するため R が立ち、3月20日という完了期限があるため T が立つ。他の3案はいずれも、数値を含んでいながら、この5つのうち1つ以上を欠いている。","distractors":["対象も期限も数値も揃っており、正解の案より高い水準を掲げているため、より良い案に見える。落ちるのは A（達成可能な）である。根拠はシナリオの明示条件1つにある。この案は学費収納サービスへの照会を含む確定処理を対象にしているが、その照会だけで応答に平均2秒かかり、検証用の接続先でも本番と同じで、本プロジェクトでは改善できない。照会を含む処理が1秒以内に応答することは、この系の「能力」では実現しない。同時3,000人が前年の最大1,200人前後の倍を超える点は見込みからの乖離を示すが、落とす決め手は照会の2秒である。数値が入っていることと達成可能であることは別であり、シナリオの数値と突き合わせて初めて落とせる案である。",null,"他と比べるという形を取るため、基準があるように読める。落ちるのは S（具体的な）と A（達成可能な）である。S は、比べる相手が「他大学が導入している同種のシステム」としか書かれておらず、どの大学のどのシステムを指すのかが定まらない点、および「より安定して動く」に基準が置かれていない点で満たされない。A は、他大学のシステムが本プロジェクトの管理下になく、同じ負荷・同じ経路で測る手段がこのプロジェクトに無い点で満たされない。シナリオは、負荷ツールで測れるのは検証環境に置いた自大学のシステムに限られると明記しており、人や環境を足せば済む話ではない。なお「速く安定して動く」という方向そのものはプロジェクトのゴールと矛盾しないため、この案が落ちているのは R（妥当な）ではなく、対象の定まらなさと測る手段の不在である。","測る対象を履修登録の確定処理と書き、「3つの指標」「基準値」という言い方が、どこかに定義が用意されているかのように読ませる。落ちるのは S（具体的な）と T（タイムリーな）である。S は、3つの指標が何であるかも、基準値がいくつであるかもこの文からは定まらない点で満たされない。T は、「リリース前まで」が完了期限になっていない点で満たされない。シラバスは T を「具体的な時間枠と完了期限を定めるべきである」と定めており、工程の手前を漠然と指すだけでは足りない。数えているのは指標の個数であって達成状況ではないため、M も部分的にしか立たない。"],"flip":[null,null,null,null],"flipNote":{"1":"この案が A（達成可能な）を満たすには、履修登録の確定処理の経路から学費収納サービスへの照会が外れるか、その平均2秒が1秒を大きく下回るまで縮む必要がある。ただしその条件を置いても、同時1,500人で3秒以内という案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。この案だけが残るには、前年の同時利用が3,000人規模であったことまで併せて必要で、条件が2つになる。","3":"この案は S（具体的な）と A（達成可能な）の2つを欠いている。比べる相手を特定の製品に定めれば S は立つが、その相手が本プロジェクトの管理下になく、負荷ツールで測れるのが検証環境に置いた自大学のシステムに限られることは変わらない。同じ条件で測れる形で相手の応答時間が手に入ることまで置いて初めて A が立つので、条件が2つになる。しかもその2つを置いても、正解の案は5つの要素を満たしたまま残る。","4":"この案は S（具体的な）と T（タイムリーな）の2つを欠いている。3つの指標が何かと基準値を書き出せば S が立ち、完了期限を3月20日のように日付で示せば T が立つが、それは状況の条件を動かすことではなく案そのものを書き直すことであり、2つを同時に行う必要がある。書き直したあとも、正解の案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値が書かれていることをもって測定可能だと判断し、その水準にこの系の能力で到達できるか、そもそもこのプロジェクトの環境で測れるか（A）をシナリオの条件と突き合わせないまま、最も高い水準を掲げた案を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","relatedConcepts":["テスト目的","終了基準","プロジェクトテスト戦略"],"distractorIntent":["「同時3,000人でも1秒以内」の案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、改善できない外部照会（検証用の接続先でも平均2秒）を含む処理は1秒以内に到達しない。シナリオの明示条件1つだけで落ちる","「他大学の同種システムより2割速く、より安定して」の案: S（具体的な）と A（達成可能な）が欠ける。比べる相手が定まらず、「より安定」に基準が無く、他大学のシステムは管理外で、測れるのは自大学のシステムに限られると明記されている","「リリース前までに3つの指標が基準値を満たす」の案: S（具体的な）と T（タイムリーな）が欠ける。指標の中身と基準値が定まらず、完了期限が日付ではなく工程の手前で示されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス1.4.3（スマートの法則の5定義、および「テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある」）。公式サンプル SET B 問17（経営が与えた曖昧な目的への修正案4つから、5要素をすべて満たす1案を選ばせる。誤答3つはすべて D9）の構造。誤答の A 欠落は一般原則（全数テスト不可能・欠陥ゼロは示せない）ではなく、シナリオの明示条件（改善できない外部照会の応答時間、測れるのは自大学のシステムに限られること）で落とす。正答の A は、外部サービスに検証用の接続先があるという明示条件で、外部を含めた経路を測れることまで支える","mistakePatterns":["MP-12"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2）はスマートの法則5要素で一意。flip は全 null、flipNote 3本とも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-syllabus-2026-09-13-t3.md","sig":"01bdb0af389d","explSig":"977a9c3c0028","fieldSig":{}},{"lens":"qa","date":"2026-09-13","round":4,"result":"pass","note":"T1/T2 いずれにも当たらない。T3 で flip が全 null＋flipNote に置き換わったが、qa の門に触れる変化は無い","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-qa-2026-09-13-r4.md","sig":"01bdb0af389d","explSig":"977a9c3c0028","fieldSig":{"scenario":"499b09bd5c59"}},{"lens":"item","date":"2026-09-13","round":4,"result":"pass","note":"誤答3つとも T1/T2 を通過。中1件（選択肢4が最も弱い）","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-item-2026-09-13-r4.md","sig":"01bdb0af389d","explSig":"977a9c3c0028","fieldSig":{"選択肢4":"1d6284e5773b","syllabus":"79c0ba4a0756","scenario":"499b09bd5c59"}}]}},{"id":"q-1.4.3-A-2","lo":"TM-1.4.3","cluster":"1.4.3-A","clusterName":"スマートの法則をテスト目的の定義に適用する","variantAxis":"挙がった候補から選ぶ（公式問18型・条件は箇条書きで提示）。欠落させる文字は M ／ R ／ T","variant":2,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは物流倉庫のピッキング用ハンディ端末アプリを刷新するプロジェクトのテストマネージャーである。\n\nプロジェクトのゴールは、繁忙期に作業員を増やさず出荷量をさばききることと、棚と品目の取り違えによる出荷の誤りを前年より減らすことの2つと合意されている。情報システム部から端末とサーバ間の通信量を減らす要望も出ているが、今回のゴールには含めない。\n\n・テスト担当は2名。実機は5台まで借りられ、倉庫での検証は週2日の夜間のみ\n・指示の投入から完了応答までは検証用の仕組みで自動化でき、実機で受けられる。取り違えの確認は作業員役が実機で行う\n・受け入れテストは11月15日に終える\n・前年の繁忙期はピーク1時間に1,100件前後の指示を処理し、取り違えによる出荷の誤りは指示件数の0.8%前後だった\n・今年の繁忙期の始まりはまだ読めていない","question":"次のテスト目的の候補のうち、スマートの法則を使用したとき5つの要素をすべて満たすものはどれか。","choices":["11月15日までに、1時間あたり1,200件のピッキング指示を実機5台で処理し、指示された棚と品目の取り違えによる誤りが0.5%未満にとどまることを確認すること","11月15日までに、テストで新たに見つかる欠陥が3週続けて週20件を下回ったことをもって、ピッキング指示の棚と品目の取り違えが起きにくくなっていることを確認すること","11月15日までに、端末とサーバ間の1日あたりの通信量が、新アプリでは現行の7割以下に収まっていることをサーバ側の通信ログで確認すること","繁忙期が始まるまでに、ピッキング1件あたりの所要時間が現行より15%短くなっていることを、倉庫の実機で確認すること"],"answer":[0],"explanation":{"signals":"効くのはゴールの段落と箇条書きの各行である。ゴールは出荷量をさばききることと取り違えによる誤りを減らすことの2つであり、通信量の削減は要望として出ているが今回のゴールには含めないと明記されている。これが妥当性（R）の判定基準になる。テスト担当2名・実機5台・週2日の夜間という条件と、指示の投入から完了応答までは自動化でき取り違えの確認は作業員役が行うという条件は、掲げた水準を実際に確かめられるか（A）を決める。前年のピークが1時間で1,100件前後、取り違えによる誤りが指示件数の0.8%前後という実績は、目標値が届く範囲にあり、かつ前年より減らす方向にあるかの物差しになる。受け入れテストを11月15日に終えるという事実は、完了期限（T）を日付で書ける状態にあることを示し、今年の繁忙期の始まりが読めていないという事実は、繁忙期を期限の代わりに使えないことを示す。","why":"スマートの法則は5つの要素が同時に立って初めて成立する。正解の案は、測る対象を「ピッキング指示の処理」と「指示された棚と品目の取り違えによる誤り」に絞っているため S が立ち、1時間あたり1,200件・0.5%未満という数値を置いているため、シラバスが M に求める「達成状況を判断するための具体的な進捗基準」を備える。前年のピークが1,100件前後であるから1,200件は見込みの延長にあり、指示の投入から完了応答までを検証用の仕組みで自動化して実機5台で受けられるため、1,200件の処理は人手に依らず、担当2名でも夜間の枠で1時間規模の計測が行える。取り違えの確認は作業員役が実機で行うと定められており、0.5%は前年の指示件数比0.8%前後から減らす方向にある現実的な水準である。分母が指示件数で揃っているため、指示あたりの取り違えが減れば出荷の誤りも減り、ゴールの2つ目と直接つながる。ここでシラバスが A に求める「リソースの可用性、時間枠、能力を考慮し、実現可能」を満たす。処理件数はゴールの1つ目（作業員を増やさずに出荷量をさばききる）に、取り違えによる誤りの率はゴールの2つ目（前年より減らす）に直接対応するため R が立つ。11月15日という完了期限があるため T が立つ。他の3案は、測る手段が対象を測っていない、ゴールに含めないと合意した指標を目的に据えている、期限が日付で定まっていない、という形でそれぞれ1つの要素を落としている。","distractors":[null,"テストで見つかる欠陥が減ってきたことを品質の目安にするのは現場でよく行われており、3週続けて週20件という数値も期限も入っているため、測れているように読める。落ちるのは M（測定可能な）である。シラバスが M に求めているのは「達成状況を判断するための具体的な進捗基準」であり、測る手段が測りたい対象を測っていなければ成立しない。テストで新たに見つかる欠陥の件数は、テストの進み具合やどこを重点的に試したかで増減する数であって、作業員が棚と品目を取り違える頻度を表さない。取り違えの起きにくさを知りたいのであれば取り違えそのものを数える必要があり、シナリオは作業員役が実機で確認するという手段を用意している。","通信量の削減は情報システム部から実際に出ている要望であり、現行の7割以下という数値、11月15日という期限、サーバ側の通信ログで測るという手段も揃っているため、目的として通る案に見える。落ちるのは R（妥当な）である。シラバスは R を「プロジェクト全体の目的に沿ったものでなければならない」と定めているが、このプロジェクトのゴールは出荷量をさばききることと取り違えによる誤りを減らすことの2つであり、通信量の削減は「今回のゴールには含めない」とシナリオに明記されている。ステークホルダーから要望が出ていることと、それがプロジェクトの目的に組み込まれていることは別であり、測れて達成もできるが、合意したゴールの達成度を何も語らない数字を追うことになる。","現行との比較で15%という基準を置き、測る対象も1件あたりの所要時間として定まっており、倉庫の実機で確かめるという手段も現実的である。落ちるのは T（タイムリーな）である。シラバスは T を「具体的な時間枠と完了期限を定めるべきである」と定めているが、「繁忙期が始まるまでに」はいつまでに終えるのかを示していない。今年の繁忙期の始まりはまだ読めていないと明記されており、受け入れテストの完了が11月15日と決まっているのに、期限を書ける状態にありながら書いていない。"],"flip":[null,null,"今回のプロジェクトのゴールが、繁忙期に出荷量をさばききることと取り違えによる誤りを減らすことではなく、端末とサーバ間の通信量を減らすことだと合意されているのであれば、この案は R（妥当な）が立ち、5つの要素をすべて満たす唯一の案になる。そのとき、1時間あたりの処理件数と取り違えの率を掲げた案のほうが、合意されたゴールの達成度を語らないという理由で R を欠くことになる。",null],"flipNote":{"2":"この案が M（測定可能な）を満たすには、数える対象を、テストで新たに見つかる欠陥の件数から、作業員役の試行に現れる取り違えそのものに置き換えるしかない。それは状況の条件を動かすことではなく、案の中身を別の案に書き直すことである。仮に書き直しても、正解の案は5つの要素を満たしたまま残るので、5つの要素をすべて満たすものはどれかという問いに対して答えが2つになる。","4":"この案が T（タイムリーな）を満たすには、「繁忙期が始まるまでに」を11月15日のような日付に書き換えるしかない。今年の繁忙期の始まりはまだ読めていないのだから、状況の側にそれを完了期限に変える条件は無く、書き換えは条件の変更ではなく案の書き直しである。しかも日付を入れれば、1件あたりの所要時間の短縮は出荷量をさばききるというゴールに沿っているため正解の案と並んで5つの要素を満たし、答えが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値と期限が並んでいれば測定可能だと判断し、その数値がゴールそのものを測っているか、またその指標がプロジェクトのゴールとして合意されたものかを確かめない。とくにステークホルダーから出た要望を、そのままプロジェクトの目的と取り違える"},"meta":{"concept":"スマートの法則によるテスト目的の定義","relatedConcepts":["テスト目的","終了基準","テストメトリクス"],"distractorIntent":["「テストで見つかる欠陥が3週続けて週20件を下回ったことをもって確認する」案: M（測定可能な）が欠ける。数値と期限はあるが、測る手段が測りたい対象（ピッキング指示の取り違えの起きにくさ）を測っていない","「通信量が現行の7割以下」の案: R（妥当な）が欠ける。S・M・A・T は揃うが、通信量の削減は「今回のゴールには含めない」とシナリオに明記された指標であり、プロジェクト全体の目的に沿っていない","「繁忙期が始まるまでに所要時間を15%短縮」の案: T（タイムリーな）が欠ける。完了期限が日付で定まっておらず、今年の繁忙期の始まりは読めないと明記されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","confidence":"高","basis":"シラバス1.4.3（スマートの法則の5定義）。公式サンプル SET B 問18（候補4つから5要素を最もよく体現するものを選ばせる。誤答3つはすべて D9）の構造。ただし公式の誤答3つが M・T の欠落で重複している点は模倣せず、M ／ R ／ T と欠落パターンを分散させた。M 欠落は SET A 問17 誤答b（測定手段が対象を測っていない）、R 欠落は SET A 問18 誤答b（プロジェクト全体の目的と無関係な対象を測る）の型に合わせ、シナリオに「今回のゴールには含めない」と明記した指標で落とす。正答の A は、指示の投入から完了応答までを自動化できる仕組みと作業員役による確認という明示条件で支え、前年実績の分母を正答と同じ指示件数比に揃えている","mistakePatterns":["MP-12"],"reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は5要素で一意。flip[2]（合意したゴールの差し替え）は1条件で成立し、維持してよい","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-syllabus-2026-09-13-t3.md","sig":"221b616bb2df","explSig":"fb403d459ed6","fieldSig":{"選択肢4":"621247b3f9b8","scenario":"d8056fe0408e","syllabus":"79c0ba4a0756"}},{"lens":"qa","date":"2026-09-13","round":4,"result":"pass","note":"正答の3要素とも、シナリオが測る手段・期限・実績を名指しで与えている。T1 不成立・T2 不成立","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-qa-2026-09-13-r4.md","sig":"221b616bb2df","explSig":"fb403d459ed6","fieldSig":{"scenario":"d8056fe0408e","選択肢1":"43fcfeb6b4cb"}},{"lens":"item","date":"2026-09-13","round":4,"result":"pass","note":"誤答3つとも T1/T2 を通過。旧 r0 の重大は現本文には当たらない。中2件","ref":"jstqb-al-tm/kb/reviews/TM-1.4.3-item-2026-09-13-r4.md","sig":"221b616bb2df","explSig":"fb403d459ed6","fieldSig":{"選択肢2":"55aa0205e6dc","explanation.distractors[1]":"6b6b7ed5b737","scenario":"d8056fe0408e","選択肢4":"621247b3f9b8","選択肢3":"0ca5365808d6"}}]}},{"id":"q-1.5.4-A-1","lo":"TM-1.5.4","cluster":"1.5.4-A","clusterName":"ふりかえりの実装 — 議題の選別と進め方","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"multi","minutes":3,"scenario":"あなたは、住宅設備メーカーの遠隔点検サービスを開発するチームのテストマネージャーである。開発は2週間のイテレーションで進め、各イテレーションの終わりに、開発担当・テスト担当・プロダクトオーナーの全員が出席してふりかえりを行っている。議題の原案は、あなたが準備する。\n\n先週のリリース後、利用者から、点検予約が重複して登録される、通知メールの文面が分かりにくい、という2件の苦情が届いた。イテレーション中の出来事としては、受け入れ条件が固まらないまま着手してテストの設計を2度やり直したこと、テストの観点を口頭でしか渡さず、開発担当が直したつもりの箇所をテスト担当が確認していなかったことが、チームから挙がっている。","question":"このイテレーションのふりかえりの議題として適切なものはどれか。2つ選べ。","choices":["点検予約が重複して登録された不具合について、開発担当とテスト担当で、どの処理で起きたのかを切り分け、次のイテレーションでの修正方針を決める。","受け入れ条件が固まらないまま着手してテストの設計をやり直した経緯を起きた順に並べ、なぜ同じことが繰り返されたのかを全員で掘り下げる。","通知メールの文面を利用者に分かりやすい表現へ書き直し、次のイテレーションで配信できるようにする。","テストの観点を口頭でしか渡していなかったやり方を取り上げ、開発担当とテスト担当の間で何をどう渡すかを決め直す。","届いた苦情を機能ごとに集計し、次のイテレーションで作り込む機能の順番を組み替える。"],"answer":[1,3],"explanation":{"signals":"シナリオが出す材料は2種類ある。1つは利用者から届いた2件の苦情（予約の重複登録、通知メールの文面）で、これはできあがった製品の側で起きていることである。もう1つはチームから挙がった2件の出来事（受け入れ条件が固まらないまま着手してテストの設計を2度やり直した、テストの観点を口頭でしか渡していなかった）で、こちらはチームの仕事の進め方と受け渡しの側で起きていることである。苦情が2件並ぶため議論は製品の直し方へ向かいやすいが、議題の適否を決めるのはどちらの側の話かである。プロダクトオーナーが出席している点は、製品側の案を議題にしてよい理由にはならない。","why":"シラバスは、ふりかえりをチームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓を把握して改善のための変更と行動を決めるミーティングであると定義し、取り上げるトピックとしてプロセス、人、組織、コラボレーション、ツールを挙げている。この定義もトピックの並びも、対象は一貫してチームの側にあり、製品そのものは入っていない。したがって議題の候補は、それを実行したときに変わるのが製品か、チームの働き方かで切り分けられる。受け入れ条件が固まらないまま着手してテストの設計をやり直した経緯は、イテレーション中に起こったことに関するデータであり、それを時系列に並べて繰り返しの理由を掘り下げることは、データの収集から改善策の導出へ進む流れそのものである。テストの観点を口頭でしか渡していなかったことは、開発担当とテスト担当の間の受け渡し、すなわちコラボレーションの問題であり、渡し方を決め直せば次のイテレーションのやり方が変わる。一方、苦情が指している重複登録も通知メールの文面も、直しても変わるのは製品であって、チームのやり方ではない。シラバスが「テストとテスト以外の課題の両方について」と書いているのはテストか否かの軸であり、製品か進め方かの軸ではない点に注意する。","distractors":["変わるのは製品の作りであって、チームのやり方ではない。ふりかえりが取り上げるプロセス、人、組織、コラボレーション、ツールといったトピックはいずれもチームの側にあり、不具合の原因箇所の切り分けと修正方針の決定はそこに入らない。開発担当とテスト担当が一緒に当たるとしても、変わるのは製品の側である。苦情の中でこれだけが機能の不具合であり、テストで見つけられなかった事象でもあるため、テストの話題として議題に入れてよいように見える。",null,"文面を書き直して配信できるようにすることは製品の改善であり、チームの働き方は何も変わらない。読みにくさが利用者に届いてしまった以上、次のイテレーションで手を打つべき課題ではあるが、それはプロダクトオーナーとチームが製品の作り込みとして扱う話である。ふりかえりが「テスト以外の課題も扱う」ことを、製品の課題も扱えることだと読み替えると選んでしまう。",null,"集計そのものは定量的なデータを集める作業に見えるが、集めた結果を使って組み替えるのは製品として次に作る機能の順番であり、チームのやり方ではない。苦情という手元のデータから次の行動を決める形をとっているため、データの収集から改善アクションの決定へ至る流れに当てはまっているように見える。ふりかえりで集めるのは、イテレーション中に自分たちに起こったことに関するデータである。"],"flip":[null,null,null,null,null],"quote":"ふりかえりとは、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓（よい点 と悪い点の両方）を把握し、（テストとテスト以外の課題の両方について）改善を達成するための変更と 行動を決定するためのミーティングである。ふりかえりでは、プロセス、人、組織、コラボレーション、ツールなどのトピックを取り上げる。","ref":"1.5.4（ふりかえりの定義／取り上げるトピック／データの収集）","misconception":"「テストとテスト以外の課題の両方」という一句を「製品の課題も扱う」と読み替え、苦情が指している製品そのものの直し方をふりかえりの議題にしてしまう。","flipNote":{"1":"この肢が誤りなのは、実行して変わるのが製品の側だからであり、シナリオのどの1文を動かしてもその性質は変わらない。議題を、不具合の直し方ではなく、それが利用者に届くまで見つからなかった経緯をたどる形に置き換えれば、自分たちのやり方の側の話になって議題として成立する。ただしそれはこの肢が書いている行為の置き換えであり、そのとき適切な議題は、受け入れ条件の件とテストの観点の受け渡しの件と合わせて3つになるため、2つ選べという形式が成り立たない","3":"文面を書き直して配信することは製品の改善であり、苦情の件数や内容をシナリオで動かしても、変わるのが製品の側であることは変わらない。文面をだれも読み合わせていない進め方のほうを議題にすればプロセスの改善として成立するが、それはこの肢が書いている行為（文面を書き直して次のイテレーションで配信する）の置き換えであり、そのうえ適切な議題が3つになって2つ選べが成り立たなくなる","5":"集計した結果を使って組み替えるのが、次に作る機能の順番である限り、この肢は製品側の議題のままである。同じ集計を、自分たちのテストが苦情に至った欠陥をどの段階まで見逃していたかを測るために使うのであれば、イテレーション中に自分たちに起こったことに関するデータの収集になるが、それはこの肢の後半の置き換えであり、そのうえ適切な議題が3つになって2つ選べが成り立たなくなる"}},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","relatedConcepts":["ふりかえりが取り上げるトピック","データの収集","改善策の導出","プロセスとプロダクトの境界"],"distractorIntent":["苦情のうち機能の不具合だけはテストの話題だと考え、原因箇所の切り分けと修正方針の決定を議題に入れる","「テスト以外の課題も扱う」を「製品の課題も扱う」と読み替え、製品側の改善作業を議題に入れる","手元のデータを集めて次の行動につなげる形だけを見て、集計の対象と行き先が製品側であることを確かめない"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-64"],"confidence":"高","basis":"シラバス 1.5.4（定義文「チームが自分たちのやり方とコラボレーションをレビューし」／トピックの並び「プロセス、人、組織、コラボレーション、ツール」）＋公式サンプル SET B 問21 の構造（製品側の症状を餌にし、誤答を1つの軸で揃える5択TWO）。業種（物流の荷物追跡アプリ→住宅設備の遠隔点検）と議題候補のプールを差し替え、誤答の題材（不具合の修正方針／文面の書き直し／苦情の集計と機能順の組み替え）は公式と重ならないものにした","notes":"誤答5（苦情を集計して次に作る機能の順番を組み替える）が突く誤解——データを集めて次の行動を決める形だけを見て、対象と行き先が製品側であることを確かめない——は MP-64 の範囲に収まるが、MP-64 の「この誤解を持つ人が選ぶ選択肢」には集計型の例が無い。MP 側に例を1つ足す余地がある","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢2・4）は 1.5.4 の定義文とトピック5語で一意。flipNote 3本はいずれも「置き換えると適切な議題が3つになり2つ選べが壊れる」型で、数え方は選択肢と一致。新規の重大・中なし","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-syllabus-2026-09-13-t3.md","sig":"fcdec74bcc54","explSig":"9a8561de3627","fieldSig":{"explanation.flipNote[\"1\"]":"a0fc3e2ef02e"}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"T1・T2 とも不成立。誤答5の「集計」が苦情2件と釣り合わない（中）","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-qa-2026-09-12.md","sig":"fcdec74bcc54","explSig":"9a8561de3627","fieldSig":{"scenario":"ca13ca77e153"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"門（T1／T2）該当なし。誤答3つがプロセス／プロダクトの1軸に揃いすぎ、伏せ確度95","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-item-2026-09-12.md","sig":"fcdec74bcc54","explSig":"9a8561de3627","fieldSig":{"選択肢1":"738b9a9ea82d","選択肢3":"e76dbe4910da","選択肢5":"79aa86968d47","explanation.distractors[0]":"861261fa8038","explanation.distractors[4]":"afd717b4f97b","question":"52775e459cfc"}}]},"variantAxis":"利用者の苦情（製品側）とチームから挙がった出来事（やり方の側）が混在する議題候補のプールから、ふりかえりが取り上げるトピック（プロセス・人・組織・コラボレーション・ツール）に当たるものだけを拾う（公式問21型・5択TWO）。切り分けの軸はプロセスかプロダクトかの1軸で、テストかテスト以外かの軸は使わない"},{"id":"q-1.5.4-A-2","lo":"TM-1.5.4","cluster":"1.5.4-A","clusterName":"ふりかえりの実装 — 議題の選別と進め方","variant":2,"chapter":1,"section":"1.5","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、自動車部品メーカーの生産管理システムを更改するプロジェクトのテストマネージャーである。開発はシーケンシャル開発モデルで進めており、受け入れテストが終わった後、テスト完了の作業の一部としてふりかえりを行う。\n\nこのプロジェクトでは、結合テストで見つかるはずの不具合がシステムテストに持ち越され、修正と再テストの手戻りが最後まで続いた。テストレベルごとの欠陥の検出数と検出時期、テスト実行の日次記録は残っている。ふりかえりには開発担当とテスト担当が出席する予定で、時間は2時間を確保している。結果をどう残し、誰に伝えるかも、あなたが決める。","question":"このふりかえりの進め方として最も適切なものはどれか。","choices":["テストレベルごとの欠陥の検出数と検出時期がわかる記録、およびテスト実行の日次記録を持ち寄って共有し、結合テストで検出できなかった理由を出席者で掘り下げる。出た改善案に優先順位を付けて責任者を決め、発見事項と結論、推奨事項を組織のメンバーに配布する。","改善には予算と他部門の協力が要るため、事業部長と品質保証部門長にも出席を依頼する。テストレベルごとの欠陥の検出時期の記録を示して、結合テストで見つからなかった理由をその場で掘り下げ、実施する改善と責任者を決めてもらい、決まった内容を組織のメンバーに配布する。","限られた時間を有効に使うため、本番に影響した重大な欠陥3件に絞って理由を掘り下げ、小さな手戻りや日々の段取りの問題は今回の議題から外す。出てきた改善案に優先順位を付け、責任者を決めて次のプロジェクトの計画に引き継ぐ。","テスト担当だけでテスト実行の日次記録と欠陥の記録を読み合わせて手戻りが続いた理由をまとめ、決まった改善とその責任者を一覧にする。まとめた内容は、次に同じ製品を担当するテスト担当が読めるよう、テストの作業手順書に追記する。"],"answer":[0],"explanation":{"signals":"効くのは4つである。①開発がシーケンシャル開発モデルで、ふりかえりはテスト完了の作業の一部として行われること、②テストレベルごとの欠陥の検出数と検出時期、テスト実行の日次記録という定量的なデータが手元に残っていること、③出席予定が開発担当とテスト担当であること、④結果をどう残し誰に伝えるかを決める権限があなたにあること。①と④は出口の形を、②は最初のステップで何を持ち寄れるかを、③はこの場が誰の場かを決めている。2時間という枠は、議題を重大な欠陥だけに絞る理由にはならない。","why":"シラバスは、典型的なふりかえりを、イントロダクション、データの収集、改善策の導出、改善アクションの決定、クロージングの各ステップで構成されるとしている。データの収集では、イテレーションまたはプロジェクト中に起こったことを集め、メトリクスの定量的データを提示することもできるとし、改善策の導出では、収集したデータを分析して現状を把握し、例えば根本原因分析を適用して改善のアイデアを生み出すとしている。つまり原因の掘り下げは、手元のデータを分析した上に乗る。ここでは欠陥の検出数と検出時期、テスト実行の日次記録が残っているので、まずそれを持ち寄って何が起きたかを共有し、そこから結合テストで検出できなかった理由へ降りる順序が取れる。次にシラバスは、改善アクションの決定で、アクションを導き出して優先順位を付け、改善計画と責任者を定義するとし、さらに結果を適切に文書化することが重要であるとしたうえで、シーケンシャル開発モデルでは発見事項、結論、および推奨事項を組織のメンバーに分かりやすい方法で配布し、伝達する必要があるとしている。このプロジェクトは逐次型であり、結果をどう残して誰に伝えるかを決めるのはあなたである。したがって、データを持ち寄る、理由を掘り下げる、優先順位と責任者を決める、組織のメンバーに配布するまでを一続きに置いた進め方が、この状況での実装になる。","distractors":[null,"データを持ち寄って理由を掘り下げ、責任者を決め、結果を配布するところまでは原文の求めと合っているが、出席者に事業部長と品質保証部門長を加える点が外れている。シラバスはふりかえりをチーム全体で行うものとし、最初のステップで非難や判断を下すことなく問題を話し合えるよう相互信頼の雰囲気を作るとしている。公式サンプル問題の解説も、上級管理職の同席は率直な発言を妨げるため誤りであり、結果は事後に要約して管理層へ共有するのが正しいと裁定している。改善の実行に決裁が要るのは実務では確かであり、意思決定者がその場にいれば話が早いという判断から選ばれやすい。","重大な欠陥3件に絞り、小さな手戻りや日々の段取りの問題を議題から外す点が外れている。シラバスは、ふりかえりで把握するのは学んだ教訓のよい点と悪い点の両方であるとしており、重大度による足切りは求めていない。公式サンプル問題の解説も、包括的なふりかえりは重大な故障と、将来のテストサイクルに影響しうる小さな問題の両方を分析すべきであり、小さな非効率を無視すれば継続的な改善の機会を失うと裁定している。掘り下げも優先順位付けも責任者の決定も備えているうえ、2時間という枠が示されているため、限られた時間の使い方として妥当に見える。","出席者をテスト担当だけにし、結果をテストの作業手順書への追記にとどめる点が外れている。シラバスはふりかえりをチーム全体で行うものとしており、シナリオでも開発担当とテスト担当が出席する予定である。手戻りの理由は結合テストとシステムテストの両方にまたがるため、開発担当を欠いた場では片側からしか見えない。また逐次型では、発見事項、結論、および推奨事項を組織のメンバーに配布し伝達する必要があるが、テストの作業手順書への追記は次に同じ製品を担当するテスト担当にしか届かない。手順書に残せば確実に使われるという実務の感覚から選ばれやすい。"],"flip":[null,null,null,null],"quote":"改善策の導出：収集したデータを分析して現状を把握し、改善のアイデアを生み出す。…改善アクションの決定：改善案を実施するためのアクションを導き出し、優先順位を付ける。改善計画と責任者を定義する。…ふりかえりの結果を適切に文書化することが重要である。シーケンシャル開発モデルでは、発見事項、結論、および推奨事項を、組織のメンバーに分かりやすい方法で配布し、伝達する必要がある。","ref":"1.5.4（典型的なふりかえりのステップ／改善アクションの決定／結果の文書化と配布）","misconception":"ふりかえりを「課題を出して改善を決める場」とだけ捉え、誰がその場に居るか、手元のデータから理由へ降りているか、結果が組織のメンバーまで届くかという、原文が定めた条件を確かめない。","flipNote":{"2":"上級管理職が同席している点は、シナリオの出席予定や確保した時間を動かしても反転しない。原文はふりかえりをチーム全体で行うものとし、非難や判断を下すことなく問題を話し合えるよう相互信頼の雰囲気を作ることを最初のステップに置いているからである。同席の要素をこの肢から外し、結果を受け取って実行の可否を判断する立場に置き換えれば記述としては正しくなるが、そのときこの肢は正解の進め方とほぼ同じものを述べることになり、最も適切なものが2つになる","3":"重大な欠陥3件に絞り、小さな手戻りや日々の段取りの問題を議題から外す点は、確保した時間を動かしても反転しない。原文が把握するとしているのは学んだ教訓のよい点と悪い点の両方であり、重大度による足切りは求めていないからである。足切りをやめて議題を全部載せる形に変えても、この肢の出口は次のプロジェクトの計画への引き継ぎにとどまり、シーケンシャル開発モデルで求められる、発見事項・結論・推奨事項を組織のメンバーに配布し伝達することを満たさないため、最も適切な進め方にはならない","4":"この肢は、出席者がテスト担当だけであることと、残した内容がテストの作業手順書への追記にとどまることの2点が外れている。どちらか一方だけを変えても、もう一方が残って誤答のままである。2点とも変えれば正しい進め方になるが、それは条件を1つ動かした結果ではなく、しかもそのときこの肢は正解の進め方に残し方を1つ足したものになり、最も適切なものが2つになる"}},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","relatedConcepts":["典型的なふりかえりの5ステップ","データの収集と改善策の導出の依存関係","改善計画と責任者","シーケンシャル開発モデルでの結果の配布と伝達"],"distractorIntent":["改善の実行に決裁が要ることを重く見て、意思決定者を場に入れる（場の条件より決裁の速さを優先する）","会議時間の制約を議題の絞り込みの根拠にし、重大度で足切りする（絞るべきなのは同時に実施する改善の数であることを取り違える）","ふりかえりをテスト側の内省と捉え、出席者と結果の届け先をテストの内側に閉じる"],"distractorTypes":["D6","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-68","MP-67","MP-70","MP-71"],"confidence":"高","basis":"シラバス 1.5.4（ステップ3「収集したデータを分析して現状を把握し」／ステップ4「優先順位を付ける。改善計画と責任者を定義する」／文書化「シーケンシャル開発モデルでは、発見事項、結論、および推奨事項を……配布し、伝達する必要がある」／「チーム全体で行う」／ステップ1「相互信頼の雰囲気を作る」）＋公式サンプル SET B 問22 の構造（進め方を4択ONEで問い、実務では妥当な案を誤答に置く）。業種（大規模開発一般→自動車部品の生産管理システム更改）を替え、SDLC を逐次型に固定して出口を組織への配布・伝達に定めた。第3の誤答は公式の業界標準モデル型を使わず、出席者と出口をテストの内側に閉じる案に差し替えた","notes":"誤答4は出席者と出口の2点が外れているため flip に2条件を書いた。上級管理職の同席（誤答2）の否定根拠は原文の2文（チーム全体で行う／相互信頼の雰囲気）に加えて公式サンプル解説の裁定に依るため、解説では原文と解説を区別して書いた","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢1）は5ステップと出口（責任者・配布）で一意。flipNote 3本は原文の該当文と照合して成立。新規の重大・中なし","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-syllabus-2026-09-13-t3.md","sig":"6541821d71c5","explSig":"f3598706d589","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":1,"result":"pass","note":"T1・T2 とも不成立。T2 回避の書き方は効いている。改善の担い手と誤答4の推せなさが中","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-qa-2026-09-12.md","sig":"6541821d71c5","explSig":"f3598706d589","fieldSig":{"選択肢4":"5e7605841119","scenario":"8b9c6ccf0831"}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"門（T1／T2）該当なし。優越が完全に残存、伏せ確度97","ref":"jstqb-al-tm/kb/reviews/TM-1.5.4-item-2026-09-12.md","sig":"6541821d71c5","explSig":"f3598706d589","fieldSig":{"選択肢1":"7f810c86f490","選択肢2":"eabd7978b3d1","選択肢4":"5e7605841119"}}]},"variantAxis":"逐次型プロジェクトで、残っている定量データ・出席者・結果の届け先という3つの与件に対し、データの収集から改善アクションの決定と結果の配布まで、ふりかえりのステップを順に当てはめる（公式問22型・4択ONE）。誤答は場に居る人・議題の範囲・結果の届け先をそれぞれ1点ずつ外している"},{"id":"q-1.6.3-A-1","lo":"TM-1.6.3","cluster":"1.6.3-A","clusterName":"ツール選定とROI評価のための状況分析","variant":1,"chapter":1,"section":"1.6","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは社会人向けのオンライン学習サービスを運営する会社のテストマネージャーである。回帰テストはいまも手作業で行っており、テスト自動化の実績はなく、いまの進め方が自動化に見合うかを確かめたこともない。\n\nテスト実行を自動化するツールを入れることになり、商用の2製品まで候補を絞った。経営会議には、どちらの候補も3年でプラスの投資回収に達する試算が出ており、その差は最終の判断には用いないことが決まっている。この試算は、現行のライセンス条件と保守条件がこの先も続くことを前提に作られている。\n\n試用の結果、2つの候補は社内の講習体制で同等の期間で習得できることが確認された。また、次期版でベンダーが予定している機能は評価に含めず、候補の製品については、いま検証できた能力と総所有コストだけで決めることになっている。調達部門は、発注番号を四半期末までに確定したいと言っている。","question":"この状況で、最終の判断の根拠として用いるべきものはどれか。2つ選べ。","choices":["テスト担当者がどれだけ短い期間で使いこなせるかを最上位に置き、習得で浮いた工数を回帰テストの範囲拡大に充てる。","3年間の投資回収額の見込みが大きい候補を上位に置き、その差額を次年度のテスト環境の増強に回せるかで比べる。","自社のテストプロセスが自動化の次の段階に耐えるかを取得の判断より先に評価し、足りない部分を導入計画と要員配置に織り込めるかで比べる。","ベンダーが次期版で予定している機能を候補の能力に加えて比べ、いまの版で足りない範囲を暫定の手順で運用できるかを見る。","ベンダーの保守方針が変わったときに自社側で増える作業量を候補ごとに見積もり、経常のコストと非経常のコストの双方に織り込んで比べる。"],"answer":[2,4],"explanation":{"signals":"効くのは3つの明示と、2つの空白である。明示は、両候補が同等の期間で習得できると確認されたこと、3年でプラスの投資回収に達する点の差は最終の判断に用いないと決まっていること、次期版で予定されている機能は評価に含めないことの3つで、いずれも一般には妥当な着眼（習得の早さ・投資回収額の大きさ・将来の機能）を、この状況では候補を分ける力のないものに変えている。3つ目の明示は候補の製品の評価範囲を限る文であり、総所有コストは範囲に残されている。空白は、テスト自動化の実績がなくいまの進め方が自動化に見合うかを確かめていないことと、投資回収の試算が現行のライセンス条件と保守条件の継続を前提にしていることの2つである。調達部門が発注番号を四半期末までに確定したいという事情は、どちらの候補を採るかには関与しないノイズである。ただし判断を進める枠としては残る。取得を決める前に自社の進め方を評価するなら、その評価は四半期末までに終わる範囲で計画しなければならない。この期限は候補の優劣ではなく、評価の段取りのほうに効く。","why":"シラバスは、ツールを選択する際に考慮すべき ROI に関するリスクとして、組織の未熟さがツールの非効率的な使用につながること、ベンダーのメンテナンス・ポリシーが変更されると作業量が増えること、コストが予想を上回ること、利益が予想を下回ることを挙げている。このシナリオの2つの空白は、そのうち前の2つにそのまま対応する。\n自動化の実績がなく、いまの進め方が自動化に見合うかを確かめていない組織では、ツールを入れても非効率な使い方に落ち着き、見込んだ利益が出ない。だから取得を決める前に、自分たちの進め方が次の段階に耐えるかを評価し、足りない部分を導入計画と要員配置に織り込めるかどうかが、候補を比べる軸になる。これは候補の製品の能力ではなく自社の状態を見るものなので、候補の製品の評価範囲を限る明示の対象ではない。足りない部分を導入計画と要員配置にどう織り込むかは、与件が両候補で同等だと明示した属性には含まれていない。同等だと確認されたのは習得の期間であり、判断に用いないと決まったのは投資回収額の差、評価に含めないと決まったのは次期版の機能である。明示のないところまで同じだと見なす読みは、与件が言っていないことを足すことになる。なお、シラバスが取得または構築の前に置いているのは費用対効果分析であって、テストプロセスの成熟度の評価を取得の判断より先に行えとは書かれていない。ここでの順序は、組織の未熟さがツールの非効率的な使用につながるという ROI に関するリスクから導いたものである。未熟さを抱えたまま取得を決めれば、その費用対効果分析が見込んだ利益の側が崩れる。評価に要する期間が四半期末までの決定を妨げない範囲に収まるかは、この段取りの中で確かめればよい。ツールが未熟さを埋めるのではなく、未熟さがツールの効果を減じる、というのがシラバスの向きである。\nもう一方の空白は、試算の前提そのものにある。試算は現行のライセンス条件と保守条件が続くことを前提に置いているが、シラバスはベンダーの保守方針の変更を ROI のリスクとして名指ししている。前提が崩れたときに自社側で増える作業量は、製品ごとのライセンス条件と保守条件の定め方に依存するので、候補ごとに見積もってみるまで分からない。ここでも、両候補で同じだと確認された事実は与件に無い。習得の期間のように同等だと確認されて、はじめてその属性は比較から降りる。シラバスは費用対効果分析について経常的なコストと非経常的なコストの両方を考慮に入れるべきだとしているので、見積もった増分は、定期的なライセンス料や保守料といった経常側と、再教育や移行といった非経常側の双方に反映させて初めて比較に使える。候補の製品の評価範囲を限る明示も総所有コストを範囲に残しているので、この見積りを妨げない。「いま検証できた」は能力に掛かる語である。総所有コストは取得から運用までの期間にかかる費用を数えたものであり、シラバスが経常的なコストと非経常的なコストの両方を考慮せよとしている以上、はじめから見積りを含む。いま支払った額だけを指す語ではない。\nこの2つは、3つの明示によって基準の地位を失った着眼とは違い、与件が同等だとも判断に用いないとも言っていない。候補ごとに見積もって初めて答えが出る種類のものであり、したがって最終の判断の根拠になるのはこの2つである。","distractors":["使用性はシラバスが「ツールを使う人にとって、使用性は非常に重要である」と述べる正しい考慮事項であり、導入後の定着を左右するという見方にも無理はない。それでもこの状況では根拠にならない。試用の結果、2つの候補は社内の講習体制で同等の期間で習得できることが確認されているからである。与件が両候補で同じ値だと明示した属性は、どちらを選ぶかを決められない。この規則が働くのは同等だと確認された属性についてであって、与件が何も言っていない属性まで同じだと見なしてよいわけではない。習得の早さで工数が浮くという前提自体も、同等と確認された時点で成り立たなくなる","投資回収額の大きい方を選ぶのは、経営幹部にとってプラスの ROI が要件だというシラバスの記述と地続きに見える。しかしシラバスが求めているのはプラスであることであって、大きさで順位をつけることではない。加えてこのシナリオでは、どちらの候補も3年でプラスの投資回収に達する試算が出ており、その差は最終の判断には用いないと経営会議が決めている。足切りは両候補とも通過済みであり、差額の使い道を比べても候補は分かれない",null,"ツールは長期の投資であり、シラバスも商用ツールを検討する場合はベンダーを評価するとしているから、次期版の予定を見ること自体は一般には筋が通る。しかしこのシナリオは、次期版でベンダーが予定している機能は評価に含めず、候補の製品についてはいま検証できた能力と総所有コストだけで決めると定めている。予定された機能を候補の能力に加えて比べることは、この決めごとを外して候補を並べ直すことになる。不足を暫定の手順で運用できるかという見方も、その予定を前提にしている以上、同じ理由で根拠にならない",null],"flip":[null,null,null,null,null],"flipNote":{"1":"習得の早さが候補を分ける基準になるのは、2つの候補の習得に要する期間に差があるときである。ただしそのときも、自社のテストプロセスが自動化の次の段階に耐えるかという根拠と、ベンダーの保守方針が変わったときに増える作業量という根拠は、どちらも ROI に関するリスクとして残る。用いるべき根拠が3つになり、2つ選べという形式が成り立たない。どちらかの根拠を消すには、自動化の実績が無いことか、試算が現行のライセンス条件と保守条件の継続を前提にしていることまで併せて動かす必要があり、条件が2つ以上になる。","2":"投資回収を判断の根拠に戻す道は2つあるが、どちらもこの案を単独の正解にしない。一方の候補だけがプラスに届かない形にすれば投資回収は足切りとして働くが、それはこの案が言う「見込みが大きいほうを上位に置く」という比べ方を正当化しない。投資回収の大きさで順位を決めると経営会議が定め直せばこの比べ方は正当になるが、そのときも組織の未熟さとベンダーの保守方針の変更に由来する2つの根拠は残るため、用いるべき根拠が3つになって2つ選べが成り立たない。","4":"次期版で予定されている機能を評価に含めてよいと決め直せば、この着眼は候補を比べる材料にはなる。ただしそのときも、組織の未熟さとベンダーの保守方針の変更という ROI に関するリスクに由来する2つの根拠は残るため、用いるべき根拠が3つになり、2つ選べという形式が成り立たない。どちらかを消すには、自動化の実績が無いことか、試算の前提のどちらかを併せて動かす必要があり、条件が2つ以上になる。"},"quote":"ツールの取得または構築の前に、それが組織にとって有益であることを確実にするために、費用対効果分析を行うべきである。この分析では、経常的なコストと非経常的なコストの両方を考慮に入れるべきである。…ツールを選択する際には、ROI に関する以下のリスクを考慮すべきである：組織の未熟さが、ツールの非効率的な使用につながる可能性がある。ベンダーのメンテナンス・ポリシーが変更されると、作業量が増える可能性がある。","ref":"1.6.3（ROI に関するリスク・費用対効果分析が対象とする経常／非経常のコスト）／1.6.1（適切なツールのサポートを受けながら、プロセス改善の機会を識別する）","misconception":"一般には妥当な着眼（習得の早さ・投資回収額の大きさ・将来の機能）を、シナリオがそれらを候補の区別に使えないものにしていても判断の根拠として持ち込み、ROI に関するリスクとして名指しされている組織の未熟さとベンダーの保守方針の変更を見落とす"},"meta":{"concept":"テストツールの選定とROI","relatedConcepts":["ROI に関するリスク","経常コストと非経常コスト","テストプロセスの成熟度"],"distractorIntent":["使用性を最上位の基準に置く（両候補で同等と確認された属性を比較に使う）","プラスの ROI を足切りではなく最大化の対象と読む","ベンダーのロードマップと現行の検証済み能力を同列に扱う"],"distractorTypes":["D2a","D2a","D2a"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-39","MP-42","MP-44","MP-46"],"confidence":"高","basis":"シラバス 1.6.3（ROI に関するリスク4項目・経常/非経常コスト）＋公式サンプル SET B 問24 の構造（最終段落の無効化文が誤答を1つずつ殺す5択TWO）。業種と無効化文の組（習得期間は同等／投資回収の差は用いない／次期版の予定機能は含めない）を差し替え、残る基準を ROI に関するリスク側に置いた","reviews":[{"lens":"syllabus","date":"2026-09-13","round":1,"result":"pass","note":"正答（選択肢3・5）は ROI に関するリスク（組織の未熟さ／ベンダーの保守方針の変更）で一意。flip は全 null、flipNote 3本とも成立","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-syllabus-2026-09-13-t3.md","sig":"63db2c882e34","explSig":"6673dd61d308","fieldSig":{}},{"lens":"qa","date":"2026-09-12","round":2,"result":"pass","note":"正答2肢の4要素とも T1 / T2 のどちらにも当たらない。新しい限定文は実行可能性を狭めていない","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-qa-2026-09-12-r2.md","sig":"63db2c882e34","explSig":"6673dd61d308","fieldSig":{}},{"lens":"item","date":"2026-09-12","round":1,"result":"pass","note":"誤答3個とも T1/T2 に当たらず。否定根拠はすべてシナリオの明示文で成立している。正答5の差別化力の裏づけが中1件","ref":"jstqb-al-tm/kb/reviews/TM-1.6.3-item-2026-09-12.md","sig":"63db2c882e34","explSig":"6673dd61d308","fieldSig":{"scenario":"d3539931c9ef","explanation.why":"4a6dd92189ec","explanation.distractors[1]":"72684547308c"}}]},"variantAxis":"無効化文により判断基準の地位を失うものを確定し、残る基準を ROI に関するリスク（組織の未熟さ・ベンダーの保守方針変更）に求める（公式問24型・散文の制約層・5択TWO）。「カバーできるリスク」は読み①＝ツール投資が抱える ROI リスクで採る"},{"id":"q-1.6.3-A-2","lo":"TM-1.6.3","cluster":"1.6.3-A","clusterName":"ツール選定とROI評価のための状況分析","variant":2,"chapter":1,"section":"1.6","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはクレジットカードの決済代行サービスを提供する会社のテストマネージャーである。手作業の回帰テストに年間2,400万円をかけており、テスト管理ツールを入れ替えることになった。\n\nカード業界のセキュリティ基準の認定は毎年更新している。その審査では、要件から検査結果までの追跡を記録で示すことと、セキュリティテストの計画と結果を同じツール上で管理することが求められる。経営層は3年以内にプラスの投資回収に達することを条件とし、開発チームは短い期間で習得できるものを、運用部門は保守の負
