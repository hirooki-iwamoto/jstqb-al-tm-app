こと、負荷環境が1月の第1週から2週間あることは、案が掲げる件数と負荷に手が届くかの物差しになる。合意されたゴール、すなわち検査オーダーと結果の取り違えによる再検査を無くすことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になり、システムテストを1月31日に終えることは、完了期限（T）を日付で書ける状態にあることを示す。負荷環境が検査部門システムの代わりに同じ電文を返す仕組みを使うことは、負荷をかける確認では実機との連携を同時には見られないことを裏から示している。","why":"実機につないだ連携の確認と、外来集中時と同じ1時間900件の負荷は、このプロジェクトでは同じ期間に作れない。検査部門システムの実機とつなげるのは連携環境だけ、1時間900件を流せるのは負荷環境だけで、サーバ枠の都合で2つを同じ期間には立ち上げられないからである。だから終了基準は、連携環境で流した検査オーダー7,200件の結果に取り違えが0件であること、負荷環境で1時間900件を流したときにも取り違えが0件であること、という2本立てで書くことになる。これが採るべき案である。\nシラバスは「テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある」と述べており、A（「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」）はまさにこの考慮で決まる。件数も枠に収まっている。連携環境は12月の4週間使え、1週間あたり1,800件を流した実績があるから7,200件はその期間の中で流せる。1時間900件はそれができる唯一の環境である負荷環境の側に置かれ、その環境は1月の第1週からの2週間として確保されている。確認が別々の期間に置かれているので、2つの環境を同時に立ち上げる必要が無い。\n点検の対象が終了基準であることも原文のとおりである。シラバスは、プロジェクトでテストへリリースするフィーチャーに関連してプロジェクトのテスト目的と終了基準を定義しなければならず、これはスマートの法則を使って行うことができるとしている。残る要素も当たる。測る対象を2つの確認として書き分けているので S（「明確あるべきで曖昧ではないものであるべきである」）、取り違えが0件という件数で達成が決まるので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）、取り違えによる再検査を無くすという合意されたゴールに直結するので R（「プロジェクト全体の目的に沿ったものでなければならない」）、システムテストの終了日である1月31日を置いているので T（「具体的な時間枠と完了期限を定めるべきである」）が立つ。","distractors":["落ちるのは A（達成可能な）である。検査部門システムの実機とつなげるのは連携環境だけであり、1時間900件を流せるのは負荷環境だけである。そしてサーバ枠の都合で、この2つの環境を同じ期間に立ち上げることはできない。実機につないだまま1時間900件を流すという状態は、このプロジェクトのどの期間にも作れない。シラバスは、テスト環境はすべて同時に利用できるとは限らないことを挙げ、達成可能なテスト目的と終了基準を策定する際にはこの点を考慮する必要があると述べている。本番では実機との連携と混雑が同時に起きるのだから終了基準もその状態で満たされていなければ意味がない、と考える人が選ぶ。対象も数値も期限も揃っており、正解の案より本番に近い状態を求めているぶん厳しく正しい案に見えるが、数値が入っていることと、その状態を作れることは別である。","落ちるのは S（具体的な）である。「連携が安定して動いており」「外来が集中する時間帯でも支障が無い」は、何がどうなっていれば達成なのかを定めていない。シラバスは S を、明確あるべきで曖昧ではないものであるべきであると定めており、判断する人を決めても、判断の基準が無ければ達成したかどうかは決まらない。M が求める達成状況を判断するための具体的な進捗基準も、この文からは取り出せない。数値にできない側面はステークホルダーの確認で締めるのが実務だと考える人が選ぶ。シラバス自身、プロジェクトのテスト目的の集計や測定とは別に、業界の専門家やステークホルダーによる品質レベルのアセスメントも考慮すべきであると述べており、責任者が確認するという手段そのものが否定されているわけではない。定まっていないのは、確認する中身のほうである。",null,"落ちるのは T（タイムリーな）である。「確認がひととおり済んだ段階で」は、終わる時点を確認作業そのもので指しているだけで、いつまでに終えるのかを何も示していない。シラバスは T を、具体的な時間枠と完了期限を定めるべきであると定めている。シナリオはシステムテストを1月31日に終えると置いており、期限を書ける状態にありながら書いていない。対象は2つの環境それぞれについて示されており、取り違えが0件という基準も置かれているため、達成したかどうかを判定できる案に見える。確認すべきことが終わったかどうかで区切るのが終了基準だ、と考えるとここで止まってしまう。"],"flip":[null,null,null,null],"flipNote":{"1":"この案の A（達成可能な）を落としているのは、検査部門システムの実機とつなげるのは連携環境だけ、外来集中時と同じ1時間900件の検査オーダーを流せるのは負荷環境だけ、という能力の分かれ方である。実機につなぐことと1時間900件を流すことが別々の環境にしか無いのだから、実機につないだまま1時間900件を流す状態は、どちらの環境を立ち上げても作れない。サーバ枠の都合で2つの環境を同じ期間には立ち上げられないことは、その分かれ方を重ねて確かめる与件であって、そこだけを動かしても、実機につないだまま1時間900件を流す状態が作れるようになるわけではない。仮に環境の制約が両方とも変わったとしても、連携環境の7,200件と負荷環境の1時間900件に分けて書いた案は5つの要素を満たしたまま残るため、条件を当てた結果は「この案だけが残る」ではなく「最も適切な案が2つになる」である。","2":"この案が S（具体的な）を満たすには、「安定して動いており」「支障が無い」を、何件のうち何件までといった読み手の間で揺れない言い方に置き換えるしかない。それは状況の側の条件を1つ動かすことではなく、案そのものを別の案に書き直すことである。しかも書き直したあとは、その案も、連携環境と負荷環境に分けて書いた案も5つの要素を満たすため、最も適切な案が2つになる。責任者が確認するという手段は残してよく、定まっていないのは確認する中身のほうである。","4":"この案が T（タイムリーな）を満たすには、「ひととおり済んだ段階で」を1月31日のような期限に置き換えるしかない。シナリオはすでにその期限を与えているので、状況の側に動かす余地は無く、変わるのは案の文面である。そのうえ期限を入れれば、この案は連携環境と負荷環境に分けて書いた案と同じく5つの要素を満たすので、最も適切な案が2つになる。終了基準の期限は、確認作業が終わった時点を指すのではなく、外から決まっている日付や工程の終わりで与える。"},"quote":"プロジェクトでテストへリリースするフィーチャーに関連して、プロジェクトのテスト目的と終了基準を定義しなければならない。これは、スマートの法則を使って行うことができる：S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。…テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある。","ref":"1.4.3","misconception":"終了基準は本番と同じ条件で満たされていなければ意味が無いと考え、テスト環境をすべて同時には利用できないという制約を達成可能（A）の判定に持ち込まないまま、いちばん本番に近い状態を求めた案を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的と終了基準の定義","distractorIntent":["「実機につないだまま1時間900件を流す」案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、実機とつなげる環境と1時間900件を流せる環境が別だと明記されており、どちらの環境を立ち上げてもその状態は作れない。サーバ枠の都合で2つの環境を同じ期間には立ち上げられないことは、それを重ねて確かめる与件である","「連携が安定して動き支障が無いことを責任者が確認」案: S（具体的な）が欠ける。判断する人は決まっているが、何がどうなれば達成なのかが定まっておらず、M が求める進捗基準も取り出せない。ステークホルダーによるアセスメントを考慮してよいという原文の記述が吸引力になる","「確認がひととおり済んだ段階で」案: T（タイムリーな）が欠ける。対象と基準は定まっているが、完了期限が作業の終わりで自己参照的に書かれており、1月31日という書ける期限を使っていない"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-A-4","lo":"TM-1.4.3","cluster":"1.4.3-D","variant":1,"chapter":1,"section":"1.4","k":3,"points":2,"type":"multi","minutes":3,"scenario":"あなたはカーシェアリングの予約・解錠アプリを作り直すプロジェクトのテストマネージャーである。合意されたゴールは、予約した利用者が車の前で待たされないことと、予約した車とは別の車が解錠される事象を無くすことの2つである。\n\n検証に使える車載機は貸出用の2台だけで、営業所に配備されている車両はテストに使えない。予約から解錠までの試行は、この2台に対して自動で繰り返すことができ、1日あたり400回を流した実績がある。別の車を指す予約を作って解錠を試す手順も、この2台で組める。結合テストは2月20日、受け入れテストは3月10日に終える計画である。利用が本格化する時期はまだ決まっていない。","question":"スマートの法則を使用して定めたテスト目的として、5つの要素をいずれも満たしているものを2つ選べ。","choices":["結合テストの終了までに、貸出用の車載機2台を使い、予約から解錠までの操作で利用者が待たされず、画面の表示も安定していることを確認すること","3月10日までに、予約から解錠までの応答が、貸出用の車載機2台で行う500回の試行の95%で3秒以内に収まることを確認すること","3月10日までに、営業所に配備された50台の車両で同時に解錠を行い、そのいずれもが3秒以内に応答することを確認すること","予約から解錠までの応答が、200回の試行で平均2秒を下回っていることを、利用が本格化したあとも継続して確認していくこと","結合テストの終了までに、予約した車とは別の車が解錠される事象が、貸出用の車載機2台で行う800回の試行で1件も起きないことを確認すること"],"answer":[1,4],"explanation":{"signals":"分かれ目は第2段落に置かれた検証の条件である。検証に使える車載機が貸出用の2台だけで営業所に配備されている車両はテストに使えないこと、その2台に対して予約から解錠までの試行を自動で繰り返せ1日あたり400回を流した実績があること、別の車を指す予約を作って解錠を試す手順もその2台で組めること ── これが、案の掲げる水準をこのプロジェクトの資源と能力で確かめられるか（A）を決める。結合テストが2月20日、受け入れテストが3月10日に終わることは、完了期限（T）として書ける時点が用意されていることを示し、利用が本格化する時期が決まっていないことは、その時期を期限の代わりに置けないことを示す。合意されたゴール、すなわち予約した利用者が車の前で待たされないことと、予約した車とは別の車が解錠される事象を無くすことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になる。","why":"選ぶのは、予約から解錠までの応答を「500回の試行の95%で3秒以内」と書いた案と、予約した車とは別の車が解錠される事象を「800回の試行で1件も起きない」と書いた案である。どちらも試行は貸出用の車載機2台で行うと書いており、合意されたゴールを、手元の資源で回せる試行回数と、達成したかどうかが数で決まる水準に翻訳している。期限も、終わりの決まった時点に置かれている。\nつまずきやすいのは期限の置き方である。別の車の解錠を見る案は「結合テストの終了までに」と書いているが、シラバスが T（タイムリーな）に求めているのは「具体的な時間枠と完了期限を定めるべきである」であって、暦の日付でなければならないとは述べていない。結合テストは2月20日に終える計画であるから、この書き方はいつまでに終えるのかが定まった時点を指しており、T は立つ。応答を見るほうの案は、受け入れテストの終了日である3月10日をそのまま期限にしている。\n資源の側も揃っている。予約から解錠までの試行は貸出用の車載機2台に対して自動で繰り返すことができ、1日あたり400回の実績があるので、500回も800回も2日ぶんの枠に収まり、それぞれ3月10日と2月20日までに流せる。別の車を指す予約を作って解錠を試す手順も、この2台で組めるとシナリオが明記している。ここでシラバスが A（達成可能な）に求める「リソースの可用性、時間枠、能力を考慮し、実現可能」が立つ。\n残る要素も原文の定義に当たる。測る対象を、予約から解錠までの応答と、予約した車とは別の車が解錠される事象にそれぞれ定めているので S（「明確あるべきで曖昧ではないものであるべきである」）、500回の試行の95%で3秒以内・800回の試行で1件も起きないという進捗基準を置いているので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。そして前者は予約した利用者が車の前で待たされないこと、後者は予約した車とは別の車が解錠される事象を無くすことという、合意されたゴールにそれぞれ正面から対応するので R（「プロジェクト全体の目的に沿ったものでなければならない」）が立つ。","distractors":["落ちるのは S（具体的な）である。シラバスは S を、明確あるべきで曖昧ではないものであるべきであると定めているが、「利用者が待たされず」「画面の表示も安定している」は、何がどこまでなら達成なのかを定めていない。達成したかどうかを後から判定できないため、M が求める達成状況を判断するための具体的な進捗基準も取り出せない。この案は期限を結合テストの終了に置き、検証に使える貸出用の車載機2台で確かめるとし、待たされないことという合意されたゴールも正面から受けている ── 期限と機材とゴールの押さえ方が正しいことが、そのまま吸引力になっている。欠けているのは水準の書き方だけである。",null,"落ちるのは A（達成可能な）である。シナリオは、検証に使える車載機が貸出用の2台だけで、営業所に配備されている車両はテストに使えないと明記している。50台で同時に解錠するという水準は、このプロジェクトのリソースと能力では実施できない。シラバスは A を、リソースの可用性、時間枠、能力を考慮し、実現可能でなければならないと定めており、数値が入っていることと、その確認を行えることは別である。実際に配備されている車両で本番と同じ規模を確かめるのだから、これ以上たしかな目的は無いように読ませるのがこの案の吸引力で、3秒以内という水準も3月10日という期限も入っているため、測定可能（M）の側では欠けが見つからない。","落ちるのは T（タイムリーな）である。シラバスは T を、具体的な時間枠と完了期限を定めるべきであると定めているが、「利用が本格化したあとも継続して確認していく」には終わりが置かれていない。利用が本格化する時期はまだ決まっていないとシナリオにあり、その時期を期限の代わりに置くこともできない。結合テストが2月20日、受け入れテストが3月10日に終わると決まっているのだから、期限を書ける状態にありながら書いていない。性能は一度測って終わりではなく、使われ方が変わるたびに見続けるべきだという考え方は実務で広く共有されており、対象も試行回数も平均の水準も置かれているため、達成したかどうかを判定できる目的に見える。",null],"flip":[null,null,null,null,null],"flipNote":{"1":"動かせるのは状況の側ではなく、案の文面のほうである。S（具体的な）を立てるには「待たされず」「安定している」を、何回のうち何秒までといった読み手の間で揺れない言い方に置き換えるしかなく、それは条件を1つ変えることではない。しかも書き直せば、この案は結合テストの終了という期限と、貸出用の車載機2台という手元の機材を正しく持ったまま5つの要素を満たすので、条件を満たす案が3つになって必要数の2つを超え、2つ選べという問いが成り立たなくなる。","3":"この案が A（達成可能な）を満たすには、営業所に配備された50台の車両をテストに使えることが要る。シナリオはそれができないと明記している。仮に使えるようにしても、貸出用の車載機2台で測る2つの案は5つの要素を満たしたまま残るため、起きるのは入れ替わりではなく、条件を満たす案が3つになって必要数の2つを超えることである。50台という数を2台に直すのは、状況ではなく案の書き直しにあたる。","4":"この案が T（タイムリーな）を満たすには、「利用が本格化したあとも継続して」を、3月10日や結合テストの終了のように終わりが定まった期限に置き換えるしかない。利用が本格化する時期は決まっていないとシナリオにあるため、状況の側にその時期を期限へ変える条件は無い。しかも期限を入れれば、200回の試行で平均2秒を下回るという水準は待たされないというゴールに沿っているので5つの要素が揃い、条件を満たす案が3つになって必要数の2つを超える。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"タイムリー（T）を暦の日付が書かれていることと同一視し、終わる日が決まっている工程の終了時点を期限とみなさない。その結果、「結合テストの終了までに」と書いた案を期限の無いものとして外し、日付は入っているが掲げた水準をこのプロジェクトの資源では確かめられない案のほうを選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「利用者が待たされず、画面の表示も安定している」案: S（具体的な）が欠ける。期限は工程の終了で正しく置かれ、使う機材も手元にある貸出用の車載機2台に収め、合意されたゴールも受けているが、何がどこまでなら達成なのかが定まらず、M が求める進捗基準も取り出せない。期限と機材とゴールの押さえ方が正しいことが吸引力になる","「営業所の50台で同時に解錠」案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、検証に使える車載機は貸出用の2台だけで営業所の車両はテストに使えないとシナリオに明記されている","「200回の試行で平均2秒を下回っていることを継続して確認していく」案: T（タイムリーな）が欠ける。対象・試行回数・水準はそろい、機材の制約にも収まっているが完了期限が無く、本格化の時期も決まっていないため、その時期を期限の代わりに置くこともできない"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-A-5","lo":"TM-1.4.3","cluster":"1.4.3-A","variant":2,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは市役所のコンビニ交付システムを更改するプロジェクトのテストマネージャーである。交付の確定は、住民記録システムでの本人確認と、発行センターへの発行要求を経る。発行センターには検証用の受付口があり、発行要求の応答は本番と同じ平均4秒で、今回の更改では短縮できない。\n\n市民課長からは「年度末でも、交付が途中で止まらず、待たされないようにしてほしい」と伝えられている。プロジェクトのゴールは、年度末に窓口へ並ぶ来庁者の待ち時間を前年より延ばさないことだと合意されている。\n\n処理時間を測れる検証環境は1系統で、負荷をかけて測れるのは市側に置いたシステムである。結合テストは12月19日、総合テストは2月13日に終える計画である。前年の年度末、コンビニ交付の要求は最多の時間帯で1時間あたり320件前後であった。窓口の受付時間は変えない。","question":"市民課長の要望を書き直した案のうち、スマートの法則を適用したテスト目的として最も適切なものはどれか。","choices":["住民記録システムでの本人確認と発行センターへの発行要求を含むコンビニ交付の確定処理が、1時間あたり960件の要求に対して2秒以内に応答することを、2月13日までに確認すること","12月19日までに、近隣の自治体が導入している同種の交付サービスと比べて、コンビニでの交付が短い時間で終わり、交付の取り消しがより起きにくいことを確認すること","交付の処理時間に関わる主要な指標がいずれも目標の範囲に収まっていることを、本番への切り替えの前までに確認すること","2月13日までに、コンビニでの交付の確定に要する時間が、1時間あたり480件の要求のもとで8秒以内に収まっていることを確認すること"],"answer":[3],"explanation":{"signals":"効くのは、交付の確定が通る経路と、市の側で測れる範囲である。交付の確定は、住民記録システムでの本人確認と、発行センターへの発行要求を経ること、その発行要求の応答は本番と同じ平均4秒で、今回の更改では短縮できないこと、負荷をかけて測れるのは市側に置いたシステムであること ── この3点が、案の掲げる水準に手が届くか、そもそも測れるか（A）の物差しになる。前年の年度末、コンビニ交付の要求は最多の時間帯で1時間あたり320件前後であったという実績は、掲げる要求量が見込みの延長にあるかの目安である。合意されたゴール、すなわち年度末に窓口へ並ぶ来庁者の待ち時間を前年より延ばさないことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になり、結合テストは12月19日、総合テストは2月13日に終える計画であることは、完了期限（T）を日付で書ける状態にあることを示す。窓口の受付時間を変えないことは、どの案の当否も分けない。","why":"書き直しとして採るべきは、2月13日までに、コンビニでの交付の確定に要する時間が、1時間あたり480件の要求のもとで8秒以内に収まっていることを確かめる、と置いた案である。手の届く水準を決めているのは、交付の確定が必ず経由する発行センターへの発行要求で、発行要求の応答は本番と同じ平均4秒で、今回の更改では短縮できない。\nシラバスは A（達成可能な）を「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」と定めている。8秒という水準は、縮められない4秒を含んだうえで残りを市側の処理に充てられる幅であり、前年の年度末、コンビニ交付の要求は最多の時間帯で1時間あたり320件前後であったから、1時間あたり480件もその延長にある。しかも発行センターには検証用の受付口があるので、外部への発行要求を含んだ経路のまま負荷をかけて測れる。測る条件を1本に絞っているため、検証環境が1系統でも総合テストの終了日までに実施できる。ここで A が立つ。\n残る要素も原文の定義にそのまま当たる。交付の確定は、住民記録システムでの本人確認と、発行センターへの発行要求を経るのだから、測る対象を交付の確定に要する時間と書けば、どこからどこまでを測るのかが定まり S（「明確あるべきで曖昧ではないものであるべきである」）が立つ。1時間あたり480件・8秒以内という、達成したかどうかを判断できる進捗基準を持つので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。R（「プロジェクト全体の目的に沿ったものでなければならない」）を測る物差しになるのは、プロジェクトのゴールは、年度末に窓口へ並ぶ来庁者の待ち時間を前年より延ばさないことだと合意されている、という一文である。コンビニでの交付が年度末の混み合う時間帯に返ってくるかどうかを測るこの案は、そのゴールに沿っており、R が立つ。結合テストは12月19日、総合テストは2月13日に終える計画であり、案はそのうち2月13日を期限に置いているので T（「具体的な時間枠と完了期限を定めるべきである」）も立つ。\n止まらないことと待たされないことは、市民課長から伝えられた要望であって、合意されたゴールそのものではない。しかも要望のほうは、測る対象も水準も期限も置いていない。書き直すとは、その要望を、合意されたゴールを崩さないために保つべき水準として、状況の側の数値に置き直すことである。","distractors":["落ちるのは A（達成可能な）である。この案は発行センターへの発行要求を含むコンビニ交付の確定処理を対象にしているが、発行要求の応答は本番と同じ平均4秒で、今回の更改では短縮できない。発行要求を含む処理が2秒以内に応答することは、この系の「能力」では実現しない。1時間あたり960件が前年の最多の時間帯の320件前後の3倍にあたる点も見込みからの乖離を示すが、落とす決め手は発行要求の4秒のほうである。対象も期限も数値も揃っていて、正解の案より高い水準を掲げているぶん良い案に見えるのがこの案の吸引力だが、数値が入っていることと達成できることは別であり、状況の側の数値と突き合わせて初めて落とせる。","落ちるのは S（具体的な）と A（達成可能な）である。比べる相手が「近隣の自治体が導入している同種の交付サービス」としか書かれておらず、どの自治体のどのサービスを指すのかが定まらない。「短い時間で終わり」「より起きにくい」にも基準が置かれていない。ここで S を欠く。測る手段の側も、近隣の自治体のサービスは本プロジェクトの管理下になく、状況は負荷をかけて測れるのは市側に置いたシステムであると定めている。同じ負荷・同じ経路で相手方を測る手立てがこのプロジェクトに無いので A も欠ける。人や環境を足せば済む話ではない。他と比べるという形が基準のあるように読ませるのが吸引力だが、基準の所在が外にあることと、基準が定まっていることは違う。なお、短い時間で終わるという方向そのものは市民課長が伝えた要望の側にあるもので、来庁者の待ち時間を前年より延ばさないという合意されたゴールから外れる向きでもない。この案が落ちているのは R（妥当な）ではない。","落ちるのは S（具体的な）と T（タイムリーな）である。「主要な指標」が何であるかも、「目標の範囲」がどの値からどの値までを指すのかも、この文からは定まらない。測る対象を交付の処理時間と書いていても、達成したかどうかを後から判定できないので S は立たない。期限のほうも、「本番への切り替えの前までに」では、シラバスが T に求める「具体的な時間枠と完了期限」にならない。状況は、結合テストは12月19日、総合テストは2月13日に終える計画であると置いており、日付で書ける状態にありながら工程の手前を漠然と指している。「主要な」「目標の範囲」という言い方が、どこかに定義が用意されているかのように読ませるのが、この案の吸引力である。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案が A（達成可能な）を満たすには、交付の確定の経路から発行センターへの発行要求が外れるか、発行要求の応答は本番と同じ平均4秒で、今回の更改では短縮できないという条件が消えて2秒を大きく下回るまで縮む必要がある。ただしその条件を置いても、1時間あたり480件で8秒以内と書いた案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。この案だけが残る形にするには、前年の要求量が1時間あたり960件規模であったという条件まで併せて要り、動かす条件が2つになる。","2":"比べる相手を特定のサービスに定めても、「短い時間で終わり」「より起きにくい」に基準が置かれていないので、S（具体的な）はなお立たない。S を立てるには、相手を定めることと、交付がどこまで短く終われば達成なのかを数で置くことと、取り消しがどこまで起きなければ達成なのかを数で置くことの3か所を、案の文面の側で書き直す必要がある。さらに、その相手が本プロジェクトの管理下になく、負荷をかけて測れるのは市側に置いたシステムであることは、それでは変わらない。同じ条件で測った相手方の交付に要する時間が手に入ることと、同じ条件で数えた相手方の取り消しの件数が手に入ることの2つを条件として置いて初めて A（達成可能な）が立つので、動かすところは S だけで3か所、A で2か所の合わせて5つになる。しかもその5つを置いても、1時間あたり480件で8秒以内と書いた案は5つの要素を満たしたまま残る。","3":"どの指標をどの値まで下げるのかを書き出せば S（具体的な）が立ち、完了期限を2月13日のように日付で示せば T（タイムリーな）が立つ。結合テストは12月19日、総合テストは2月13日に終える計画であると状況が与えているので、期限の側に足りない条件は無く、動くのは案の文面のほうである。しかも2つを同時に書き直す必要があり、書き直したあとも、1時間あたり480件で8秒以内と書いた案は5つの要素を満たしたまま残るため、最も適切なものが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"掲げた数値が大きいほど良い目的だと考え、その水準にこの系の能力で到達できるか、そもそもこのプロジェクトの環境で測れるか（A）を状況の条件と突き合わせないまま、最も高い水準を掲げた案を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「1時間あたり960件で2秒以内」の案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、短縮できない外部への発行要求（検証用の受付口でも平均4秒）を含む処理は2秒以内に到達しない。状況の明示条件1つだけで落ちる","「近隣の自治体の同種サービスより短い時間で、取り消しが起きにくい」の案: S（具体的な）と A（達成可能な）が欠ける。比べる相手が定まらず、「短い時間で終わり」「より起きにくい」に基準が無く、近隣の自治体のサービスは管理外で、負荷をかけて測る対象は市側に置いたシステムだと明記されている","「本番への切り替えの前までに主要な指標が目標の範囲に収まる」の案: S（具体的な）と T（タイムリーな）が欠ける。指標の中身と範囲が定まらず、完了期限が日付ではなく工程の手前で示されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-A-6","lo":"TM-1.4.3","cluster":"1.4.3-A","variant":3,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは都市ガス会社の検針・請求システムを刷新するプロジェクトのテストマネージャーである。請求金額の算定は、検針値の取り込みと料金表に基づく計算を経る。検証環境に投入できる検針データは抜き取り分の5万件までで、全契約60万件分は提供を受けられない。\n\n営業部長からは「新しい仕組みでも、請求書の金額が狂わないようにしてほしい」と伝えられている。プロジェクトのゴールは、請求内容の問い合わせに伴う訂正を前年より減らすことだと合意されている。\n\n算定した請求金額は旧システムの結果と自動で突き合わせられ、1日あたり2万件まで流せる。他社の請求の結果は入手できず、突き合わせの相手は旧システムの結果である。結合テストは8月8日、システムテストは9月26日に終える計画である。前年、請求内容の訂正は請求書1万通あたり12件であった。検針員の担当区は変えない。","question":"営業部長の要望を書き直した案のうち、スマートの法則の5要素をいずれも満たすものはどれか。","choices":["請求の正確さに関わるいくつかの観点で所定の水準に達していることを、請求業務が新しい仕組みに移りきるまでに確かめること","本番と同じ全契約60万件の検針データで算定した請求金額を旧システムの結果と突き合わせ、食い違いが1件も無いことを、9月26日までに確かめること","8月8日までに、同じ規模の他社の請求の仕組みと比べて、請求金額の誤りがより少なく、請求書の発行がより早いことを確かめること","9月26日までに、抜き取り分5万件の検針データで算定した請求金額が、旧システムの結果と1件も食い違わないことを確かめること"],"answer":[3],"explanation":{"signals":"分かれ目は、検証に回せるデータと、突き合わせの相手である。検証環境に投入できる検針データは抜き取り分の5万件までで、全契約60万件分は提供を受けられないこと、他社の請求の結果は入手できず、突き合わせの相手は旧システムの結果であること ── この2点が、案の掲げる確認をこのプロジェクトで行えるか（A）の物差しになる。算定した請求金額は旧システムの結果と自動で突き合わせられ、1日あたり2万件まで流せることは、掲げた件数を期限までにさばけるかを決める。合意されたゴール、すなわち請求内容の問い合わせに伴う訂正を前年より減らすことは、案がプロジェクト全体の目的に沿っているか（R）の判定基準になり、結合テストは8月8日、システムテストは9月26日に終える計画であることは、完了期限（T）を日付で書ける状態にあることを示す。検針員の担当区を変えないことは、どの案の当否も分けない。","why":"5つの要素がそろうのは、9月26日までに、抜き取り分5万件の検針データで算定した請求金額が、旧システムの結果と1件も食い違わないことを確かめる、と置いた案である。掲げた確認がこのプロジェクトで行えるからで、それを決めているのは投入できるデータの量と突き合わせの手段である。\nシラバスは A（達成可能な）を「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」と定めている。検証環境に投入できる検針データは抜き取り分の5万件までで、全契約60万件分は提供を受けられないのだから、5万件はそのまま手当てできる量である。算定した請求金額は旧システムの結果と自動で突き合わせられ、1日あたり2万件まで流せるので、5万件は3日ぶんの枠に収まり、システムテストの終了日までに流し終えられる。ここで A が立つ。\n残る要素も原文の定義に当たる。請求金額の算定は、検針値の取り込みと料金表に基づく計算を経るのだから、その算定の結果を旧システムの結果と突き合わせると書けば、何をどこと比べるのかが定まり、S（「明確あるべきで曖昧ではないものであるべきである」）が立つ。食い違いが1件も無いことという、達成したかどうかを判断できる進捗基準を置いているので、M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。R（「プロジェクト全体の目的に沿ったものでなければならない」）を測る物差しになるのは、プロジェクトのゴールは、請求内容の問い合わせに伴う訂正を前年より減らすことだと合意されている、という一文である。請求金額が旧システムの結果と食い違わないことを確かめるこの案は、そのゴールに沿っており、R が立つ。前年、請求内容の訂正は請求書1万通あたり12件であったという実績は、訂正を前年より減らせたかを後から比べる相手になる。結合テストは8月8日、システムテストは9月26日に終える計画であり、案はそのうち9月26日を期限に置いているので、T（「具体的な時間枠と完了期限を定めるべきである」）も立つ。\n金額が狂わないようにしてほしいというのは営業部長から伝えられた要望であって、測る対象も水準も期限も置いていない。書き直すとは、その要望を、合意されたゴールを崩さないために保つべき水準として、状況の側の数値に置き直すことである。","distractors":["落ちるのは S（具体的な）と T（タイムリーな）である。「いくつかの観点」が何であるかも、「所定の水準」がどの値であるかも、この文からは定まらない。請求の正確さを対象だと書いていても、達成したかどうかを後から判定できないので S は立たない。期限のほうも、「請求業務が新しい仕組みに移りきるまでに」は、終わる時点を移行の進み具合で指しているだけで、シラバスが T に求める「具体的な時間枠と完了期限」にならない。状況は、結合テストは8月8日、システムテストは9月26日に終える計画であると置いており、日付で書ける状態にありながら使っていない。「所定の」という言い方が、どこかに水準が用意されているかのように読ませるのが、この案の吸引力である。","落ちるのは A（達成可能な）である。状況は、検証環境に投入できる検針データは抜き取り分の5万件までで、全契約60万件分は提供を受けられないと定めている。全契約60万件の検針データで算定して突き合わせるという確認は、このプロジェクトの資源では行えない。シラバスは A を、リソースの可用性、時間枠、能力を考慮し、実現可能でなければならないと定めており、本番と同じ規模で確かめられればいちばん確かだという見方がこの案の吸引力になる。対象も期限も数値も揃っていて、正解の案より広い範囲を押さえているぶん厳しく正しい案に見えるが、数値が入っていることと、その確認を行えることは別である。","落ちるのは S（具体的な）と A（達成可能な）である。比べる相手が「同じ規模の他社の請求の仕組み」としか書かれておらず、どの会社のどの仕組みを指すのかが定まらない。「より少なく」「より早い」にも基準が置かれていない。ここで S を欠く。測る手段の側も、他社の請求の結果は入手できず、突き合わせの相手は旧システムの結果であると状況が定めている。同じ条件で相手方の結果を取る手立てがこのプロジェクトに無いので A も欠ける。人や環境を足せば済む話ではない。他社と比べるという形が基準のあるように読ませるのが吸引力だが、基準の所在が外にあることと、基準が定まっていることは違う。なお、請求金額の誤りを少なくするという方向そのものは、訂正処理の件数を前年より減らすという合意されたゴールから外れる向きではない。この案が落ちているのは R（妥当な）ではない。",null],"flip":[null,null,null,null],"flipNote":{"1":"どの観点をどの値まで満たすのかを書き出せば S（具体的な）が立ち、完了期限を9月26日のように日付で示せば T（タイムリーな）が立つ。結合テストは8月8日、システムテストは9月26日に終える計画であると状況が与えているので、期限の側に足りない条件は無く、動くのは案の文面のほうである。しかも2つを同時に書き直す必要があり、書き直したあとも、抜き取り分5万件で突き合わせると書いた案は5つの要素を満たしたまま残るため、条件を満たす案が2つになる。","2":"この案が A（達成可能な）を満たすには、検証環境に全契約60万件分の検針データを投入できる必要がある。検証環境に投入できる検針データは抜き取り分の5万件までで、全契約60万件分は提供を受けられないと状況が定めているので、そこを動かすことはこの状況では条件の差し替えにならない。仮に提供が受けられるようにしても、抜き取り分5万件で突き合わせると書いた案は5つの要素を満たしたまま残るため、起きるのは入れ替わりではなく、5つの要素をいずれも満たす案が2つになることである。","3":"比べる相手を特定の会社の仕組みに定めても、「より少なく」「より早い」に基準が置かれていないので、S（具体的な）はなお立たない。S を立てるには、相手を定めることと、誤りの件数と発行の速さをどの値で見るのかを書き出すことの2か所を、案の文面の側で書き直す必要がある。さらに、他社の請求の結果は入手できず、突き合わせの相手は旧システムの結果であることは、それでは変わらない。同じ条件で測った他社の結果が手に入るという条件まで置いて初めて A（達成可能な）が立つので、動かすところは S だけで2か所、A で1か所の合わせて3つになる。しかもその3つを置いても、抜き取り分5万件で突き合わせると書いた案は5つの要素を満たしたまま残る。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"本番と同じ範囲を丸ごと確かめる目的ほど良いと考え、その確認に必要な入力をこのプロジェクトが手当てできるか（A）を状況の条件と突き合わせないまま、いちばん広い範囲を掲げた案を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「新しい仕組みに移りきるまでにいくつかの観点で所定の水準」の案: S（具体的な）と T（タイムリーな）が欠ける。観点と水準が定まらず、完了期限が日付ではなく移行の進み具合で示されている","「全契約60万件で誤り0件」の案: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、検証環境に投入できるのは抜き取り分5万件までで、全契約60万件分の提供は受けられないと状況に明記されている","「同じ規模の他社の仕組みより誤りが少なく、発行が早い」の案: S（具体的な）と A（達成可能な）が欠ける。比べる相手が定まらず、「より少なく」「より早い」に基準が無く、他社の請求の結果は入手できないと明記されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-B-2","lo":"TM-1.4.3","cluster":"1.4.3-B","variant":2,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたはオンライン学習サービスの受講管理システムを刷新するプロジェクトのテストマネージャーである。\n\nプロジェクトのゴールは、申し込みが途中で失敗して問い合わせに至る件数を前年より減らすことと、修了証の記載の誤りを前年より減らすことの2つと合意されている。マーケティング部から申し込み画面の離脱率を下げたいという要望も出ているが、ゴールには含めない。\n\n・申し込みから修了証の発行までは検証環境で自動で繰り返せ、1日あたり600件を流した実績がある\n・修了証の記載は、受講データと突き合わせて自動で確認できる\n・結合テストは9月12日、受け入れテストは10月31日に終える\n・前年、途中で失敗して問い合わせに至った申し込みは1万件あたり40件、修了証の記載の誤りは発行1万通あたり6件だった\n・新年度の受講登録の開始時期はまだ決まっていない","question":"挙がった候補のうち、スマートの法則を使用したとき5つの要素をすべて満たすテスト目的はどれか。","choices":["10月31日までに、申し込みから修了証の発行までを900件通しで試し、途中で失敗する申し込みが2件以下、修了証の記載の誤りが0件であることを確認すること","10月31日までに、受講者アンケートでわかりにくいという回答が2割を下回ったことをもって、途中で失敗する申し込みと修了証の記載の誤りがいずれも減っていることを確認すること","9月12日までに、申し込み画面から離脱する利用者の割合が現行より3割低いことを、画面の操作ログで確認すること","新年度の受講登録が始まるまでに、修了証の記載の誤りが、500件の試行で1件も出ないことを確認すること"],"answer":[0],"explanation":{"signals":"まず効くのは、ゴールとして合意された範囲である。プロジェクトのゴールは、申し込みが途中で失敗して問い合わせに至る件数を前年より減らすことと、修了証の記載の誤りを前年より減らすことの2つと合意されている。一方、マーケティング部から申し込み画面の離脱率を下げたいという要望も出ているが、ゴールには含めないと書かれている ── これが妥当性（R）の判定基準になる。次に、申し込みから修了証の発行までは検証環境で自動で繰り返せ、1日あたり600件を流した実績があること、修了証の記載は、受講データと突き合わせて自動で確認できることが、掲げた水準を実際に確かめられるか（A）と、測る手段が測りたいものを測っているか（M）を決める。前年、途中で失敗して問い合わせに至った申し込みは1万件あたり40件、修了証の記載の誤りは発行1万通あたり6件だったという実績は、目標値が届く範囲にあり、かつ前年より減らす向きにあるかの物差しである。結合テストは9月12日、受け入れテストは10月31日に終えることは完了期限（T）を日付で書ける状態にあることを示し、新年度の受講登録の開始時期はまだ決まっていないことは、その時期を期限の代わりに使えないことを示す。","why":"5つの要素がそろっているのは、10月31日までに、申し込みから修了証の発行までを900件通しで試し、途中で失敗する申し込みが2件以下、修了証の記載の誤りが0件であることを確認する、と置いた候補である。合意された2つのゴールを、手元で回せる試行の中で数えられる形に直しているからである。\nシラバスが R（妥当な）に求める「プロジェクト全体の目的に沿ったものでなければならない」は、この対応関係で満たされる。プロジェクトのゴールは、申し込みが途中で失敗して問い合わせに至る件数を前年より減らすことと、修了証の記載の誤りを前年より減らすことの2つと合意されている。途中で失敗する申し込みを件数で、修了証の記載の誤りを件数で置いたこの候補は、その2つのゴールを減らす向きにそのまま重なる。記載の誤りはゴールが数えている量そのものであり、途中で失敗する申し込みは、ゴールが数えている問い合わせに至った申し込みを内側に含む広い数え方だからである。\n掲げた数に手が届くことも、条件の側が支えている。申し込みから修了証の発行までは検証環境で自動で繰り返せ、1日あたり600件を流した実績があるのだから、900件は2日ぶんの枠に収まる。修了証の記載は、受講データと突き合わせて自動で確認できるので、記載の誤りを数えるのに人手は要らない。ここでシラバスが A（達成可能な）に求める「リソースの可用性、時間枠、能力を考慮し、実現可能」が立つ。\n水準の置き方も前年の実績から決まっている。前年、途中で失敗して問い合わせに至った申し込みは1万件あたり40件、修了証の記載の誤りは発行1万通あたり6件だった。合意されたゴールが数えているのは、申し込みが途中で失敗して問い合わせに至る件数のほうであり、この候補が数える途中で失敗する申し込みは、そのうち問い合わせに至らなかったものまで含む、より広い数え方である。広いほうを900件のうち2件以下に抑えれば、その内側にある問い合わせに至った申し込みも900件のうち2件以下に収まる。1万件あたり40件は900件あたりおよそ3.6件にあたるから、ゴールが数えている量は前年より少ない側にあると言える。記載の誤り0件も、1万通あたり6件だった前年より少ない側にある。測る対象を申し込みの失敗と修了証の記載の誤りに絞っているので S（「明確あるべきで曖昧ではないものであるべきである」）、2件以下・0件という進捗基準を置いているので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。結合テストは9月12日、受け入れテストは10月31日に終えるのだから、10月31日という完了期限は工程の終わりと重なっており、T（「具体的な時間枠と完了期限を定めるべきである」）も立つ。\n残る3つは、数値と期限を備えていても、測る手段が対象を測っていない、ゴールに含めないと合意した指標を据えている、期限を日付で置いていない、という形で外れる。","distractors":[null,"落ちるのは M（測定可能な）である。シラバスが M に求めているのは「達成状況を判断するための具体的な進捗基準」で、測る手段が測りたい対象を測っていなければ、数値が入っていても成立しない。受講者がわかりにくいと答えたかどうかは、手続きの印象であって、申し込みが途中で失敗した件数でも、そのうち問い合わせに至った件数でも、修了証の記載が誤っていた件数でもない。この状況では、修了証の記載は、受講データと突き合わせて自動で確認できるのだから、誤りそのものを数える手段が手元にある。利用者の声を品質の目安にするのは現場でよく行われており、2割という数値も10月31日という期限も入っているため、測れているように読めるのがこの候補の吸引力である。","落ちるのは R（妥当な）である。シラバスは R を「プロジェクト全体の目的に沿ったものでなければならない」と定めているが、マーケティング部から申し込み画面の離脱率を下げたいという要望も出ているが、ゴールには含めないと状況に書かれている。離脱する利用者の割合が現行より3割低いという水準も、9月12日という期限も、画面の操作ログという測る手段も揃っており、しかも実際に部署から出ている要望なので、目的として通る候補に見える。だが、ステークホルダーから要望が出ていることと、それがプロジェクトの目的に組み込まれていることは別であり、この候補を追うと、測れて達成もできるのに合意したゴールの達成度を何も語らない数字が残る。","落ちるのは T（タイムリーな）である。シラバスは T を「具体的な時間枠と完了期限を定めるべきである」と定めているが、「新年度の受講登録が始まるまでに」はいつまでに終えるのかを示していない。新年度の受講登録の開始時期はまだ決まっていないのだから、この書き方は日付に置き換わらない。しかも結合テストは9月12日、受け入れテストは10月31日に終えると決まっており、期限を書ける状態にありながら書いていない。500件の試行で1件も出ないという基準は置かれ、測る対象も修了証の記載の誤りとして定まっており、手段も手元にあるぶん、期限だけが抜けていることに気づきにくい。"],"flip":[null,null,"このプロジェクトのゴールは、申し込みが途中で失敗して問い合わせに至る件数を前年より減らすことと、修了証の記載の誤りを前年より減らすことの2つだと合意されている。この合意が、申し込み画面の離脱率を下げることに置き換わっていれば、この候補は R（妥当な）が立ち、5つの要素をすべて満たす唯一の候補になる。そのとき、900件通しの試行で失敗と誤りの件数を置いた候補のほうが、合意されたゴールの達成度を語らないという理由で R を欠くことになる。",null],"flipNote":{"2":"この候補が M（測定可能な）を満たすには、数える対象を、受講者がわかりにくいと答えた割合から、実際に途中で失敗した申し込み（合意されたゴールが数えているのは、そのうち問い合わせに至ったものである）と、実際に記載が誤っていた修了証そのものに置き換えるしかない。それは状況の側の条件を動かすことではなく、候補の中身を別の候補に書き直すことである。仮に書き直しても、900件通しの試行で2件以下・0件と置いた候補は5つの要素を満たしたまま残るので、5つの要素をすべて満たすものはどれかという問いに対して答えが2つになる。","4":"この候補が T（タイムリーな）を満たすには、いつまでに終えるのかが定まっている必要がある。新年度の受講登録の開始時期はまだ決まっていないのだから、「新年度の受講登録が始まるまでに」は日付に置き換わらず、完了期限にならない。落ちている条件はこの1つである。期限の側は状況がすでに与えており、結合テストは9月12日、受け入れテストは10月31日に終えるのだから、日付を書き入れることは状況の条件を動かすことではなく、候補の文面を書き直すことである。そのうえ開始時期が日付で決まったとしても、修了証の記載の誤りを500件の試行で1件も出さないという水準は合意されたゴールに沿っているため5つの要素が揃い、900件通しの試行で2件以下・0件と置いた候補と並んで答えが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値と期限が並んでいれば測定可能だと判断し、その数値が合意されたゴールそのものを数えているか、またその指標がプロジェクトのゴールとして合意されたものかを確かめない。とくに利用者の印象を尋ねた割合を、起きた件数の代わりに置いてしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「受講者アンケートでわかりにくいという回答が2割を下回ったことをもって確認する」候補: M（測定可能な）が欠ける。数値と期限はあるが、測る手段（印象を尋ねた割合）が測りたい対象（途中で失敗した申し込みの件数と、そのうち問い合わせに至った件数、および記載が誤っていた修了証の件数）を測っていない","「申し込み画面の離脱率が現行より3割低い」候補: R（妥当な）が欠ける。S・M・A・T は揃うが、離脱率はゴールに含めないと状況に明記された指標であり、プロジェクト全体の目的に沿っていない","「新年度の受講登録が始まるまでに記載の誤りを500件の試行で1件も出さない」候補: T（タイムリーな）が欠ける。完了期限が日付で定まらず、新年度の受講登録の開始時期も決まっていないと明記されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-B-3","lo":"TM-1.4.3","cluster":"1.4.3-B","variant":3,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは食品スーパーのセルフレジを入れ替えるプロジェクトのテストマネージャーである。\n\nプロジェクトのゴールは、待ち行列が伸びて応援を呼ぶ回数を前年より減らすことと、会計のやり直しにつながる読み取りの誤りを前年より減らすことの2つと合意されている。販売促進部からクーポンの利用率を上げたいという要望も出ているが、ゴールには含めない。\n\n・検証用のセルフレジは3台まで借りられる\n・読み取りから支払いまでは自動で繰り返せ、3台で1日あたり4,000件を流せる\n・読み取りの誤りは、登録された商品と突き合わせて自動で確認できる\n・結合テストは5月9日、受け入れテストは6月14日に終える\n・前年、混み合う時間帯の会計は1台あたり1時間に55件前後、読み取りの誤りは会計1万件あたり25件だった\n・新しいレジを全店へ広げる時期はまだ決まっていない","question":"次の候補のうち、スマートの法則を使用したとき5つの要素をいずれも満たすテスト目的はどれか。","choices":["6月14日までに、セルフレジの稼働率が前年より1割高くなっていることをもって、待ち行列が伸びにくくなっていることと読み取りの誤りが減っていることを確認すること","6月14日までに、検証用のセルフレジ3台で会計8,000件を流し、1時間あたり210件を処理できることと、読み取りの誤りが16件以下であることを確認すること","5月9日までに、クーポンの利用率が現行の1.5倍になっていることを、会計のログで確認すること","新しいレジを全店へ広げる時期までに、読み取りの誤りが会計4,000件あたり5件を下回っていることを、登録された商品との突き合わせで確認すること"],"answer":[1],"explanation":{"signals":"効くのは、ゴールとして合意された範囲と、手元で回せる試行の量である。プロジェクトのゴールは、待ち行列が伸びて応援を呼ぶ回数を前年より減らすことと、会計のやり直しにつながる読み取りの誤りを前年より減らすことの2つと合意されている。一方、販売促進部からクーポンの利用率を上げたいという要望も出ているが、ゴールには含めないと書かれている ── これが妥当性（R）の判定基準になる。検証用のセルフレジは3台まで借りられること、読み取りから支払いまでは自動で繰り返せ、3台で1日あたり4,000件を流せること、読み取りの誤りは、登録された商品と突き合わせて自動で確認できることが、掲げた水準をこのプロジェクトで確かめられるか（A）と、測る手段が測りたいものを測っているか（M）を決める。前年、混み合う時間帯の会計は1台あたり1時間に55件前後、読み取りの誤りは会計1万件あたり25件だったという実績は、掲げた処理量と誤りの水準が、届く範囲にあり、かつ前年より良い側にあるかの物差しになる。結合テストは5月9日、受け入れテストは6月14日に終えることは完了期限（T）を日付で書ける状態にあることを示し、新しいレジを全店へ広げる時期はまだ決まっていないことは、その時期を期限の代わりに置けないことを示す。","why":"条件をすべて満たすのは、6月14日までに、検証用のセルフレジ3台で会計8,000件を流し、1時間あたり210件を処理できることと、読み取りの誤りが16件以下であることを確認する、と置いた候補である。合意された2つのゴールを、手元で回せる試行の中で数えられる形に直しているからである。\nシラバスが R（妥当な）に求める「プロジェクト全体の目的に沿ったものでなければならない」は、この対応で満たされる。プロジェクトのゴールは、待ち行列が伸びて応援を呼ぶ回数を前年より減らすことと、会計のやり直しにつながる読み取りの誤りを前年より減らすことの2つと合意されている。1時間あたり210件は1台あたりでは70件にあたり、前年、混み合う時間帯の会計は1台あたり1時間に55件前後だったのだから、混み合う時間帯の会計を前年より多くさばける状態を数で置いたことになる。待ち行列が伸びて応援を呼ぶ回数を前年より減らすという1つ目のゴールに、この水準は沿う向きである。2つ目のゴールに対しては、やり直しにつながる読み取りの誤りそのものを16件以下と件数で置いており、数える対象がゴールと同じである。\n掲げた数に手が届くことも、条件の側が支えている。読み取りから支払いまでは自動で繰り返せ、3台で1日あたり4,000件を流せるのだから、8,000件は2日ぶんの枠に収まる。読み取りの誤りは、登録された商品と突き合わせて自動で確認できるので、誤りを数えるのに人手は要らない。ここでシラバスが A（達成可能な）に求める「リソースの可用性、時間枠、能力を考慮し、実現可能」が立つ。\n水準の置き方も前年の実績から決まっている。前年、混み合う時間帯の会計は1台あたり1時間に55件前後、読み取りの誤りは会計1万件あたり25件だった。1台1時間55件前後だったのだから3台では165件前後で、1時間あたり210件はその延長にある。8,000件のうち16件以下という水準は、1万件あたり25件、すなわち8,000件あたり20件だった前年より少ない側にある。測る対象を処理件数と読み取りの誤りに絞っているので S（「明確あるべきで曖昧ではないものであるべきである」）、1時間あたり210件・16件以下という進捗基準を置いているので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）が立つ。結合テストは5月9日、受け入れテストは6月14日に終えるのだから、6月14日という完了期限は工程の終わりと重なっており、T（「具体的な時間枠と完了期限を定めるべきである」）も立つ。\n残る3つは、数値と期限を備えていても、測る手段が対象を測っていない、ゴールに含めないと合意した指標を据えている、期限を日付で置いていない、という形で外れる。","distractors":["落ちるのは M（測定可能な）である。シラバスが M に求めているのは「達成状況を判断するための具体的な進捗基準」で、測る手段が測りたい対象を測っていなければ、数値が入っていても成立しない。セルフレジがどれだけ使われたかを表す稼働率は、使われた割合であって件数ではない。その割合が前年より1割高いという数字からは、混み合う時間帯にどれだけの会計をさばけたのかも、やり直しにつながった読み取りの誤りが何件だったのかも取り出せず、合意された2つのゴールに結び付く件数が1件も出てこない。この状況では、読み取りの誤りは、登録された商品と突き合わせて自動で確認できるのだから、誤りそのものを数える手段が手元にある。機械がよく使われていれば列は短いはずだという見立ては現場でよく語られ、1割という数値も6月14日という期限も入っているため、測れているように読めるのがこの候補の吸引力である。",null,"落ちるのは R（妥当な）である。シラバスは R を「プロジェクト全体の目的に沿ったものでなければならない」と定めているが、販売促進部からクーポンの利用率を上げたいという要望も出ているが、ゴールには含めないと状況に書かれている。現行の1.5倍という水準も、5月9日という期限も、会計のログという測る手段も揃っており、しかも実際に部署から出ている要望なので、目的として通る候補に見える。だが、ステークホルダーから要望が出ていることと、それがプロジェクトの目的に組み込まれていることは別であり、この候補を追うと、測れて達成もできるのに合意したゴールの達成度を何も語らない数字が残る。","落ちるのは T（タイムリーな）である。シラバスは T を「具体的な時間枠と完了期限を定めるべきである」と定めているが、「新しいレジを全店へ広げる時期までに」はいつまでに終えるのかを示していない。新しいレジを全店へ広げる時期はまだ決まっていないのだから、この書き方は日付に置き換わらない。しかも結合テストは5月9日、受け入れテストは6月14日に終えると決まっており、期限を書ける状態にありながら書いていない。会計4,000件あたり5件という基準は置かれ、測る対象も読み取りの誤りとして定まっており、突き合わせの手段も手元にあるぶん、期限だけが抜けていることに気づきにくい。"],"flip":[null,null,"このプロジェクトのゴールが、応援を呼ぶ回数と読み取りの誤りを減らすことではなく、クーポンの利用率を上げることだと合意されているのであれば、この候補は R（妥当な）が立ち、5つの要素をいずれも満たす唯一の候補になる。そのとき、会計8,000件を流して処理件数と誤りの件数を置いた候補のほうが、合意されたゴールの達成度を語らないという理由で R を欠くことになる。",null],"flipNote":{"1":"この候補が M（測定可能な）を満たすには、数える対象を、使われた割合であるセルフレジの稼働率から、混み合う時間帯にさばける会計の件数ややり直しにつながった読み取りの誤りの件数といった、ゴールに結び付く件数に置き換えるしかない。それは状況の側の条件を動かすことではなく、候補の中身を別の候補に書き直すことである。仮に書き直しても、会計8,000件を流して1時間あたり210件・誤り16件以下と置いた候補は5つの要素を満たしたまま残るので、いずれも満たすものはどれかという問いに対して答えが2つになる。","4":"この候補が T（タイムリーな）を満たすには、いつまでに終えるのかが定まっている必要がある。新しいレジを全店へ広げる時期はまだ決まっていないのだから、「新しいレジを全店へ広げる時期までに」は日付に置き換わらず、完了期限にならない。落ちている条件はこの1つである。期限の側は状況がすでに与えており、結合テストは5月9日、受け入れテストは6月14日に終えるのだから、日付を書き入れることは状況の条件を動かすことではなく、候補の文面を書き直すことである。そのうえ全店へ広げる時期が日付で決まったとしても、読み取りの誤りを会計4,000件あたり5件より少なくするという水準は合意されたゴールに沿っているため5つの要素が揃い、会計8,000件を流して処理件数と誤りの件数を置いた候補と並んで答えが2つになる。"},"quote":"S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。","ref":"1.4.3","misconception":"数値と期限が並んでいれば測定可能だと判断し、その数値が合意されたゴールそのものを数えているか、またその指標がプロジェクトのゴールとして合意されたものかを確かめない。とくに機械の使われ方を表す割合を、起きた回数や件数の代わりに置いてしまう"},"meta":{"concept":"スマートの法則によるテスト目的の定義","distractorIntent":["「セルフレジの稼働率が前年より1割高いことをもって確認する」候補: M（測定可能な）が欠ける。数値と期限はあるが、測る手段（機械の使われ方の割合）は件数を与えず、ゴールに結び付く件数（混み合う時間帯にさばける会計の件数、やり直しにつながる読み取りの誤りの件数）を1件も取り出せない","「クーポンの利用率が現行の1.5倍」候補: R（妥当な）が欠ける。S・M・A・T は揃うが、クーポンの利用率はゴールに含めないと状況に明記された指標であり、プロジェクト全体の目的に沿っていない","「全店へ広げる時期までに読み取りの誤りを会計4,000件あたり5件より少なく」候補: T（タイムリーな）が欠ける。完了期限が日付で定まらず、全店へ広げる時期も決まっていないと明記されている"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-C-2","lo":"TM-1.4.3","cluster":"1.4.3-C","variant":2,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは地方銀行のインターネットバンキングを入れ替えるプロジェクトのテストマネージャーである。合意されたゴールは、他行あての振込で振込先を取り違えないことである。テスト目的は「勘定系との連携で振込先の取り違えが起きないことを示す」と定めてあり、いまは終了基準を決める段階にある。\n\n・勘定系の実機とつなげる環境は接続環境のほかに無く、給与振込が集中する日と同じ毎時800件の振込を流せる環境は高負荷環境のほかに無い\n・検証用のサーバ枠は1つで、2つの環境を同じ期間には立ち上げられない。接続環境は9月の4週間、高負荷環境は10月の第2週から2週間を使う\n・接続環境では振込の投入と結果の受信を自動で繰り返せる。1週間あたり180件を流した実績がある\n・高負荷環境は勘定系の代わりに同じ電文を返す仕組みを使う\n・システムテストは10月30日に終える","question":"この目的から導く終了基準として、スマートの法則を使用したときに最も適切なものはどれか。","choices":["10月30日までに、勘定系の実機につないだ状態のまま、給与振込が集中する日と同じ毎時800件を流し、そのときに振込先の取り違えが0件であること","システムテストの終了までに、勘定系との連携に問題が無く、給与振込が集中する日でも滞りが出ないことを、事務統括部と開発部の責任者が認めていること","接続環境では振込720件を通して取り違えが0件であること、高負荷環境では毎時800件を流しても取り違えが0件であることを、10月30日までに満たすこと","接続環境と高負荷環境の両方で確認を終えた時点で、どちらの環境でも振込先の取り違えが1件も起きていないこと"],"answer":[2],"explanation":{"signals":"判断は箇条書きの1行目と2行目で決まる。勘定系の実機とつなげる環境は接続環境のほかに無く、給与振込が集中する日と同じ毎時800件の振込を流せる環境は高負荷環境のほかに無い。そして検証用のサーバ枠は1つで、2つの環境を同じ期間には立ち上げられない。基準の掲げる状態をこのプロジェクトで作れるか（A）は、ここで決まる。接続環境は9月の4週間、高負荷環境は10月の第2週から2週間を使うこと、接続環境では振込の投入と結果の受信を自動で繰り返せる。1週間あたり180件を流した実績があることは、基準が掲げる件数と負荷に手が届くかの物差しになる。合意されたゴールは、他行あての振込で振込先を取り違えないことであるから、他行あての振込で振込先を取り違えないことが、基準がプロジェクト全体の目的に沿っているか（R）の判定基準になり、システムテストは10月30日に終えることは、完了期限（T）を日付で書ける状態にあることを示す。高負荷環境は勘定系の代わりに同じ電文を返す仕組みを使うことは、負荷をかける確認では実機との連携を同時には見られないことを裏から示している。","why":"実機につないだ連携の確認と、給与振込が集中する日と同じ毎時800件の負荷は、このプロジェクトでは同じ期間に作れない。勘定系の実機とつなげる環境は接続環境のほかに無く、給与振込が集中する日と同じ毎時800件の振込を流せる環境は高負荷環境のほかに無い。そのうえ検証用のサーバ枠は1つで、2つの環境を同じ期間には立ち上げられないからである。だから終了基準は、接続環境では振込720件を通して取り違えが0件であること、高負荷環境では毎時800件を流しても取り違えが0件であることを、10月30日までに満たすこと、という2本立てで書くことになる。これが採るべき基準である。\nシラバスは「テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある」と述べており、A（「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」）はまさにこの考慮で決まる。件数も枠に収まっている。接続環境は9月の4週間、高負荷環境は10月の第2週から2週間を使うのだから、接続環境では振込の投入と結果の受信を自動で繰り返せる。1週間あたり180件を流した実績があることと合わせて、4週間で720件は流せる。毎時800件は、それができる唯一の環境である高負荷環境の側に置かれ、その環境は10月の第2週からの2週間として確保されている。確認が別々の期間に置かれているので、2つの環境を同じ期間に立ち上げる必要が無い。\n点検の対象が終了基準であることも原文のとおりである。シラバスは、プロジェクトでテストへリリースするフィーチャーに関連してプロジェクトのテスト目的と終了基準を定義しなければならず、これはスマートの法則を使って行うことができるとしている。残る要素も当たる。測る対象を2つの確認として書き分けているので S（「明確あるべきで曖昧ではないものであるべきである」）、取り違えが0件という件数で達成が決まるので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）、合意されたゴールは、他行あての振込で振込先を取り違えないことであるから、振込先の取り違えを出さないことはそのゴールに直結するので R（「プロジェクト全体の目的に沿ったものでなければならない」）、システムテストは10月30日に終えるのだから、その終了日である10月30日を置いているので T（「具体的な時間枠と完了期限を定めるべきである」）が立つ。","distractors":["落ちるのは A（達成可能な）である。勘定系の実機とつなげる環境は接続環境のほかに無く、給与振込が集中する日と同じ毎時800件の振込を流せる環境は高負荷環境のほかに無い。そして検証用のサーバ枠は1つで、2つの環境を同じ期間には立ち上げられない。実機につないだまま毎時800件を流すという状態は、このプロジェクトのどの期間にも作れない。シラバスは、テスト環境はすべて同時に利用できるとは限らないことを挙げ、達成可能なテスト目的と終了基準を策定する際にはこの点を考慮する必要があると述べている。本番では勘定系との連携と混雑が同時に起きるのだから終了基準もその状態で満たされていなければ意味がない、と考える人が選ぶ。対象も数値も期限も揃っており、正解の基準より本番に近い状態を求めているぶん厳しく正しい基準に見えるが、数値が入っていることと、その状態を作れることは別である。","落ちるのは S（具体的な）である。「連携に問題が無く」「滞りが出ない」は、何がどうなっていれば達成なのかを定めていない。シラバスは S を、明確あるべきで曖昧ではないものであるべきであると定めており、判断する人を決めても、判断の基準が無ければ達成したかどうかは決まらない。M が求める達成状況を判断するための具体的な進捗基準も、この文からは取り出せない。数値にできない側面はステークホルダーの確認で締めるのが実務だと考える人が選ぶ。シラバス自身、プロジェクトのテスト目的の集計や測定とは別に、業界の専門家やステークホルダーによる品質レベルのアセスメントも考慮すべきであると述べており、責任者が認めるという手段そのものが否定されているわけではない。定まっていないのは、認める中身のほうである。",null,"落ちるのは T（タイムリーな）である。「両方で確認を終えた時点で」は、終わる時点を確認作業そのもので指しているだけで、いつまでに終えるのかを何も示していない。シラバスは T を、具体的な時間枠と完了期限を定めるべきであると定めている。状況はシステムテストは10月30日に終えると置いており、期限を書ける状態にありながら書いていない。対象は2つの環境それぞれについて示されており、取り違えが1件も起きていないという基準も置かれているため、達成したかどうかを判定できる基準に見える。確認すべきことが終わったかどうかで区切るのが終了基準だ、と考えるとここで止まってしまう。"],"flip":[null,null,null,null],"flipNote":{"1":"この基準の A（達成可能な）を落としているのは、勘定系の実機とつなげる環境は接続環境のほかに無く、給与振込が集中する日と同じ毎時800件の振込を流せる環境は高負荷環境のほかに無い、という能力の分かれ方である。実機につなぐことと毎時800件を流すことが別々の環境にしか無いのだから、実機につないだまま毎時800件を流す状態は、どちらの環境を立ち上げても作れない。検証用のサーバ枠は1つで、2つの環境を同じ期間には立ち上げられないことは、その分かれ方を重ねて確かめる与件であって、そこだけを動かしても、実機につないだまま毎時800件を流す状態が作れるようになるわけではない。仮に環境の制約が両方とも変わったとしても、接続環境の720件と高負荷環境の毎時800件に分けて書いた基準は5つの要素を満たしたまま残るため、条件を当てた結果は「この基準だけが残る」ではなく「最も適切な基準が2つになる」である。","2":"この基準が S（具体的な）を満たすには、「問題が無く」「滞りが出ない」を、何件のうち何件までといった読み手の間で揺れない言い方に置き換えるしかない。それは状況の側の条件を1つ動かすことではなく、基準そのものを別の基準に書き直すことである。しかも書き直したあとは、その基準も、接続環境と高負荷環境に分けて書いた基準も5つの要素を満たすため、最も適切な基準が2つになる。責任者が認めるという手段は残してよく、定まっていないのは認める中身のほうである。","4":"この基準が T（タイムリーな）を満たすには、「両方で確認を終えた時点で」を10月30日のような期限に置き換えるしかない。状況はすでにその期限を与えているので、動かす余地があるのは状況の側ではなく基準の文面である。そのうえ期限を入れれば、この基準は接続環境と高負荷環境に分けて書いた基準と同じく5つの要素を満たすので、最も適切な基準が2つになる。終了基準の期限は、確認作業が終わった時点を指すのではなく、外から決まっている日付や工程の終わりで与える。"},"quote":"プロジェクトでテストへリリースするフィーチャーに関連して、プロジェクトのテスト目的と終了基準を定義しなければならない。これは、スマートの法則を使って行うことができる：S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。…テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある。","ref":"1.4.3","misconception":"終了基準は本番と同じ条件で満たされていなければ意味が無いと考え、テスト環境をすべて同時には利用できないという制約を達成可能（A）の判定に持ち込まないまま、いちばん本番に近い状態を求めた基準を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的と終了基準の定義","distractorIntent":["「実機につないだまま毎時800件を流す」基準: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、実機とつなげる環境と毎時800件を流せる環境が別だと明記されており、どちらの環境を立ち上げてもその状態は作れない。検証用のサーバ枠が1つで2つの環境を同じ期間には立ち上げられないことは、それを重ねて確かめる与件である","「連携に問題が無く滞りが出ないことを責任者が認めている」基準: S（具体的な）が欠ける。認める人は決まっているが、何がどうなれば達成なのかが定まっておらず、M が求める進捗基準も取り出せない。ステークホルダーによるアセスメントを考慮してよいという原文の記述が吸引力になる","「両方で確認を終えた時点で」基準: T（タイムリーな）が欠ける。対象と基準は定まっているが、完了期限が作業の終わりで自己参照的に書かれており、10月30日という書ける期限を使っていない"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.4.3-C-3","lo":"TM-1.4.3","cluster":"1.4.3-C","variant":3,"chapter":1,"section":"1.4","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは自動車部品工場の生産管理システムを入れ替えるプロジェクトのテストマネージャーである。合意されたゴールは、部品の取り違えによる手直しを無くすことである。テスト目的は「設備制御システムとの連携で取り違えが起きないことを示す」と定めてあり、いまは終了基準を決める段階にある。\n\n・実機とつなげる環境は実機環境のほかに無く、ラインが最も立て込む時間帯と同じ毎時600件の指示を流せる環境は量テスト環境のほかに無い\n・借りられる制御盤は1台で、2つの環境を同じ期間には立ち上げられない。実機環境は6月の3週間、量テスト環境は7月の第2週から2週間を使う\n・実機環境では組み付け指示の投入と結果の受信を自動で繰り返せる。1週間あたり120件を流した実績がある\n・量テスト環境は設備制御システムの代わりに同じ応答を返す\n・総合テストは7月19日に終える","question":"この目的から導く終了基準のうち、スマートの法則を使用したとき最も適切なものはどれか。","choices":["7月19日までに、設備制御システムの実機につないだ状態のまま、ラインが最も立て込む時間帯と同じ毎時600件を流し、そのときに指示の取り違えが0件であること","総合テストの終了までに、設備制御システムとの受け渡しに乱れが無く、ラインが立て込む時間帯でも作業が止まらないことを、製造部と保全部の責任者が認めていること","実機環境では組み付け指示360件を流して取り違えが0件であること、量テスト環境では毎時600件の負荷のもとでも取り違えが0件であることを、7月19日までに満たすこと","実機環境と量テスト環境の両方で確認を終えた時点で、どちらの環境でも組み付け指示の取り違えが1件も起きていないこと"],"answer":[2],"explanation":{"signals":"判断は箇条書きの1行目と2行目で決まる。実機とつなげる環境は実機環境のほかに無く、ラインが最も立て込む時間帯と同じ毎時600件の指示を流せる環境は量テスト環境のほかに無い。そして借りられる制御盤は1台で、2つの環境を同じ期間には立ち上げられない。基準の掲げる状態をこのプロジェクトで作れるか（A）は、ここで決まる。実機環境は6月の3週間、量テスト環境は7月の第2週から2週間を使うこと、実機環境では組み付け指示の投入と結果の受信を自動で繰り返せる。1週間あたり120件を流した実績があることは、基準が掲げる件数と負荷に手が届くかの物差しになる。合意されたゴールは、部品の取り違えによる手直しを無くすことであるから、部品の取り違えを起こさないことが、基準がプロジェクト全体の目的に沿っているか（R）の判定基準になり、総合テストは7月19日に終えることは、完了期限（T）を日付で書ける状態にあることを示す。量テスト環境は設備制御システムの代わりに同じ応答を返すことは、負荷をかける確認では実機との連携を同時には見られないことを裏から示している。","why":"実機につないだ連携の確認と、ラインが最も立て込む時間帯と同じ毎時600件の負荷は、このプロジェクトでは同じ期間に作れない。実機とつなげる環境は実機環境のほかに無く、ラインが最も立て込む時間帯と同じ毎時600件の指示を流せる環境は量テスト環境のほかに無い。そのうえ借りられる制御盤は1台で、2つの環境を同じ期間には立ち上げられないからである。だから終了基準は、実機環境では組み付け指示360件を流して取り違えが0件であること、量テスト環境では毎時600件の負荷のもとでも取り違えが0件であることを、7月19日までに満たすこと、という2本立てで書くことになる。これが採るべき基準である。\nシラバスは「テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある」と述べており、A（「リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない」）はまさにこの考慮で決まる。件数も枠に収まっている。実機環境は6月の3週間、量テスト環境は7月の第2週から2週間を使うのだから、実機環境では組み付け指示の投入と結果の受信を自動で繰り返せる。1週間あたり120件を流した実績があることと合わせて、3週間で360件は流せる。毎時600件は、それができる唯一の環境である量テスト環境の側に置かれ、その環境は7月の第2週からの2週間として確保されている。確認が別々の期間に置かれているので、2つの環境を同じ期間に立ち上げる必要が無い。\n点検の対象が終了基準であることも原文のとおりである。シラバスは、プロジェクトでテストへリリースするフィーチャーに関連してプロジェクトのテスト目的と終了基準を定義しなければならず、これはスマートの法則を使って行うことができるとしている。残る要素も当たる。測る対象を2つの確認として書き分けているので S（「明確あるべきで曖昧ではないものであるべきである」）、取り違えが0件という件数で達成が決まるので M（「数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない」）、合意されたゴールは、部品の取り違えによる手直しを無くすことであるから、組み付け指示の取り違えを出さないことはそのゴールに直結するので R（「プロジェクト全体の目的に沿ったものでなければならない」）、総合テストは7月19日に終えるのだから、その終了日である7月19日を置いているので T（「具体的な時間枠と完了期限を定めるべきである」）が立つ。","distractors":["落ちるのは A（達成可能な）である。実機とつなげる環境は実機環境のほかに無く、ラインが最も立て込む時間帯と同じ毎時600件の指示を流せる環境は量テスト環境のほかに無い。そして借りられる制御盤は1台で、2つの環境を同じ期間には立ち上げられない。実機につないだまま毎時600件を流すという状態は、このプロジェクトのどの期間にも作れない。シラバスは、テスト環境はすべて同時に利用できるとは限らないことを挙げ、達成可能なテスト目的と終了基準を策定する際にはこの点を考慮する必要があると述べている。本番では設備制御システムとの連携とラインの立て込みが同時に起きるのだから終了基準もその状態で満たされていなければ意味がない、と考える人が選ぶ。対象も数値も期限も揃っており、正解の基準より本番に近い状態を求めているぶん厳しく正しい基準に見えるが、数値が入っていることと、その状態を作れることは別である。","落ちるのは S（具体的な）である。「受け渡しに乱れが無く」「作業が止まらない」は、何がどうなっていれば達成なのかを定めていない。シラバスは S を、明確あるべきで曖昧ではないものであるべきであると定めており、判断する人を決めても、判断の基準が無ければ達成したかどうかは決まらない。M が求める達成状況を判断するための具体的な進捗基準も、この文からは取り出せない。数値にできない側面はステークホルダーの確認で締めるのが実務だと考える人が選ぶ。シラバス自身、プロジェクトのテスト目的の集計や測定とは別に、業界の専門家やステークホルダーによる品質レベルのアセスメントも考慮すべきであると述べており、責任者が認めるという手段そのものが否定されているわけではない。定まっていないのは、認める中身のほうである。",null,"落ちるのは T（タイムリーな）である。「両方で確認を終えた時点で」は、終わる時点を確認作業そのもので指しているだけで、いつまでに終えるのかを何も示していない。シラバスは T を、具体的な時間枠と完了期限を定めるべきであると定めている。状況は総合テストは7月19日に終えると置いており、期限を書ける状態にありながら書いていない。対象は2つの環境それぞれについて示されており、組み付け指示の取り違えが1件も起きていないという基準も置かれているため、達成したかどうかを判定できる基準に見える。確認すべきことが終わったかどうかで区切るのが終了基準だ、と考えるとここで止まってしまう。"],"flip":[null,null,null,null],"flipNote":{"1":"この基準の A（達成可能な）を落としているのは、実機とつなげる環境は実機環境のほかに無く、ラインが最も立て込む時間帯と同じ毎時600件の指示を流せる環境は量テスト環境のほかに無い、という能力の分かれ方である。実機につなぐことと毎時600件を流すことが別々の環境にしか無いのだから、実機につないだまま毎時600件を流す状態は、どちらの環境を立ち上げても作れない。借りられる制御盤は1台で、2つの環境を同じ期間には立ち上げられないことは、その分かれ方を重ねて確かめる与件であって、そこだけを動かしても、実機につないだまま毎時600件を流す状態が作れるようになるわけではない。仮に環境の制約が両方とも変わったとしても、実機環境の360件と量テスト環境の毎時600件に分けて書いた基準は5つの要素を満たしたまま残るため、条件を当てた結果は「この基準だけが残る」ではなく「最も適切な基準が2つになる」である。","2":"この基準が S（具体的な）を満たすには、「受け渡しに乱れが無く」「作業が止まらない」を、何件のうち何件までといった読み手の間で揺れない言い方に置き換えるしかない。それは状況の側の条件を1つ動かすことではなく、基準そのものを別の基準に書き直すことである。しかも書き直したあとは、その基準も、実機環境と量テスト環境に分けて書いた基準も5つの要素を満たすため、最も適切な基準が2つになる。責任者が認めるという手段は残してよく、定まっていないのは認める中身のほうである。","4":"この基準が T（タイムリーな）を満たすには、「両方で確認を終えた時点で」を7月19日のような期限に置き換えるしかない。状況はすでにその期限を与えているので、動かす余地があるのは状況の側ではなく基準の文面である。そのうえ期限を入れれば、この基準は実機環境と量テスト環境に分けて書いた基準と同じく5つの要素を満たすので、最も適切な基準が2つになる。終了基準の期限は、確認作業が終わった時点を指すのではなく、外から決まっている日付や工程の終わりで与える。"},"quote":"プロジェクトでテストへリリースするフィーチャーに関連して、プロジェクトのテスト目的と終了基準を定義しなければならない。これは、スマートの法則を使って行うことができる：S＝具体的な。プロジェクトのテスト目的と終了基準は、明確あるべきで曖昧ではないものであるべきである。M＝測定可能な。数値化可能で、達成状況を判断するための具体的な進捗基準を持っていなければならない。A＝達成可能な。リソースの可用性、時間枠、能力を考慮し、実現可能でなければならない。R＝妥当な。プロジェクト全体の目的に沿ったものでなければならない。T＝タイムリーな。具体的な時間枠と完了期限を定めるべきである。…テスト環境はすべて同時に利用できるとは限らない。達成可能なテスト目的と終了基準を策定する際には、この点を考慮する必要がある。","ref":"1.4.3","misconception":"終了基準は本番と同じ条件で満たされていなければ意味が無いと考え、テスト環境をすべて同時には利用できないという制約を達成可能（A）の判定に持ち込まないまま、いちばん本番に近い状態を求めた基準を選んでしまう"},"meta":{"concept":"スマートの法則によるテスト目的と終了基準の定義","distractorIntent":["「実機につないだまま毎時600件を流す」基準: A（達成可能な）が欠ける。対象・数値・期限は揃っているが、実機とつなげる環境と毎時600件を流せる環境が別だと明記されており、どちらの環境を立ち上げてもその状態は作れない。借りられる制御盤が1台で2つの環境を同じ期間には立ち上げられないことは、それを重ねて確かめる与件である","「受け渡しに乱れが無く作業が止まらないことを責任者が認めている」基準: S（具体的な）が欠ける。認める人は決まっているが、何がどうなれば達成なのかが定まっておらず、M が求める進捗基準も取り出せない。ステークホルダーによるアセスメントを考慮してよいという原文の記述が吸引力になる","「両方で確認を終えた時点で」基準: T（タイムリーな）が欠ける。対象と基準は定まっているが、完了期限が作業の終わりで自己参照的に書かれており、7月19日という書ける期限を使っていない"],"distractorTypes":["D9","D9","D9"],"conceptNote":"jstqb-al-tm/kb/concepts/project-test-strategy.md","mistakePatterns":["MP-12"]}},{"id":"q-1.5.1-A-1","lo":"TM-1.5.1","cluster":"1.5.1-A","variant":1,"chapter":1,"section":"1.5","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは業務用パッケージを開発する部署のテストマネージャーである。テストのやり方を見直すことは決まり、どこまでを対象にするかもステークホルダーと合意している。直近3イテレーションの記録を調べ、手直しが集中している工程とその引き金も洗い出した。候補は10件ほど挙がったが、その先の段取りはこれからである。","question":"IDEAL モデルに沿って進めるとき、次に行うこととして最も適切なものはどれか。1つ選べ。","choices":["着手する順番を投資効果やリスク、戦略との整合から決め、実行するアクションを一覧にした文書にまとめる。","見直しで何をどこまで扱うかを、ステークホルダーと改めて確かめて合意を取り直す。","いまのやり方をもう一度調べ、どこに直せるところがあるかを洗い出す。","変更後の進め方について講習を開き、一部の工程でまず試してから、チーム全体に広げていく。"],"answer":[0],"explanation":{"signals":"判断に効くのは、シナリオが置いた進捗の位置である。どこまでを対象にするかはステークホルダーと合意済みで、直近3イテレーションの記録から手直しが集中している工程とその引き金まで洗い出し終えている。そのうえで、挙がった候補の段取りはこれからだと述べられている。業務用パッケージという業種と候補が10件ほどという数は、次に来る活動を変えない。","why":"次に来るのは、挙がっている候補に着手の順番を付け、実行するアクションを一覧にした文書にまとめることである。IDEAL でいうテストプロセス改善計画の確立にあたる。シラバスは改善プロセスの開始を、プロセス改善の目的とスコープをステークホルダーと合意することとし、現状の診断を、現在のテストプロセスをアセスメントし改善の可能性を特定することとしている。シナリオは対象の範囲の合意も、記録に基づく洗い出しも済んだと述べているので、この2つは通り過ぎている。続く計画の確立について原文は、テストプロセス改善計画書が、改善を達成するために実行しなければならない詳細なアクションをすべて列挙した形式的な文書となるとし（コンテキストによっては、計画は非常に非形式的で非常に軽量的なものになるとも断っている）、可能なプロセス改善のリストには優先順位を付けるべきだとしている。優先順位付けの根拠として原文が挙げるのが、投資効果(ROI)、リスク、プロジェクトまたはチームの戦略との整合性、達成すべき測定可能な定量的または定性的な利益である。着手の順番を投資効果やリスク、戦略との整合から決めるという中身は、この記述にそのまま対応する。","distractors":[null,"見直しで何をどこまで扱うかをステークホルダーと合意することは、シラバスが改善プロセスの開始に置いている活動そのもので、行為として誤ってはいない。外れるのは時期である。シナリオは、どこまでを対象にするかをステークホルダーと合意していると述べている。念のため確かめ直すのは丁寧に見えるが、開始の段階はすでに通り過ぎており、いま行うことではない。","いまのやり方をもう一度調べ、直せるところを洗い出すことは、シラバスが現状の診断に置いている活動、すなわち現在のテストプロセスをアセスメントし改善の可能性を特定することにあたる。しかしシナリオでは、記録を調べて手直しが集中している工程とその引き金まで洗い出し、改善の候補も挙がっている。改善の可能性はすでに特定されているので、調べ直すのは終わった段階をなぞることになる。","変更後の進め方についての講習と、一部の工程での試行、そしてチーム全体への展開は、シラバスが行動の段階に置いている活動である。原文は行動を、改善を展開するためのテストプロセス改善計画書を実装することとし、これには通常、変更されたプロセスのトレーニングとパイロット実施、およびプロジェクトまたはチームへの完全な展開が含まれるとしている。つまり計画書があってはじめて成り立つ活動で、候補が並んでいるだけの状態では、何をどの順で試し、何を広げるのかが定まらない。"],"flip":[null,null,null,"候補の扱いがこれからだと述べるシナリオの最後の一文が、「着手の順番も決まり、実行するアクションを一覧にした文書もまとめ終えている」に置き換われば、計画の確立まで済んだ状態になり、この活動が次に来る段階になる。"],"flipNote":{"2":"見直しの目的と範囲をステークホルダーと合意することは、シラバスが改善プロセスの開始に置いている活動であり、中身そのものは原文どおりである。外れているのは時期だけなので、合意が済んでいると述べる一文を「まだ合意していない」に置き換えたくなる。ところが同じシナリオには、記録を調べて手直しの集中する工程と引き金を洗い出し終えたという記述が残る。後の段階が済んでいて最初の段階だけが未了という状態は IDEAL の並びと合わず、この活動を次に来るものにするには一文の置き換えでは足りない。","3":"現状を調べて直せるところを洗い出すことは、シラバスが現状の診断に置いている活動であり、中身そのものは原文どおりである。外れているのはやはり時期だが、洗い出しを終えたと述べる一文を「現状を調べる作業はこれからである」に置き換えても、候補が10件ほど挙がっているという記述が残る。改善の可能性が特定されている状態は、原文が診断の成果として挙げるものそのものである。したがって診断が未了だという記述と食い違い、着手の順番を決めて実行するアクションを文書にまとめる活動がなお立つ。段階の境目を後ろへ戻す側は、その後ろに残る記述も同時に取り消さなければならず、一文の置き換えでは足りない。"},"quote":"改善プロセスの開始時に、プロセス改善の目的とスコープをステークホルダーと合意する。…現在のテストプロセスをアセスメントし、改善の可能性を特定する。…テストプロセス改善計画書は、改善を達成するために実行しなければならない詳細なアクションをすべて列挙した、形式的な文書となる。…可能なプロセス改善のリストには、優先順位を付けるべきである。優先順位付けは、投資効果(ROI)、リスク、プロジェクトまたはチームの戦略との整合性、および/または達成すべき測定可能な定量的または定性的な利益に基づいて行うことができる。","ref":"1.5.1","misconception":"IDEAL を頭文字の並びとしては覚えていても、目の前の状況がどの段階まで進んでいるかを読み取れず、済んだ段階の活動や、計画の確立を飛ばした先の段階の活動を「次にやること」として選ぶ"},"meta":{"concept":"テストプロセス改善の実装活動(IDEAL)","distractorIntent":["合意が済んでいる開始の段階の活動を、次に行うこととして選ぶ","洗い出しが済んでいる診断の段階に戻る","計画の確立を飛ばして行動の段階へ進む"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-93"]}},{"id":"q-1.5.2-A-1","lo":"TM-1.5.2","cluster":"1.5.2-A","variant":1,"chapter":1,"section":"1.5","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは金融機関向けの照会システムを開発するプロジェクトのテストマネージャーである。会社はテスト改善モデルを使った改善に取り組むことにしたが、まずはこのプロジェクトの中だけで始めることになった。","question":"この取り組みの進め方として、最も適切なものはどれか。1つ選べ。","choices":["チームで何がうまくいき何がうまくいかなかったかを持ち寄り、そこで挙がった声から改善の対象を決める。","モデルが定める領域を、組織のポリシーや体制にあたる部分も含めて、定義されたままの形で判定の対象にする。","モデルは改善を段階的に進めるものなので、まず組織全体が下位の成熟度レベルを満たし、それを確かめてからプロジェクトでの適用に入る。","評価の焦点をテスト計画やテスト設計といったプロジェクト側の活動に当て、組織のポリシーや体制にあたる領域はプロジェクトに合う形に調整する。"],"answer":[3],"explanation":{"signals":"決め手は、改善をテスト改善モデルを使って進めると決まっていることと、対象がこのプロジェクトの中だけだということである。金融機関向けの照会システムという業種は、どの進め方が適切かを変えない。","why":"進め方として取るのは、評価の焦点をテスト計画やテスト設計といったプロジェクト側の活動に当て、テストポリシーやテスト組織にあたる領域はプロジェクトに合う形に調整することである。シラバスは、モデルベースの改善はプロジェクトレベルで適用することもできるとし、このような場合、アセスメントと改善プロセスは、プロジェクトレベルの活動（テスト計画やテスト設計など）に関連するテストプロセスや、モデルで定義された重要な領域に特に焦点を当て、組織レベルの活動（テストポリシーやテスト組織など）は大きく除外されることが多いと述べている。そのうえで、組織レベルに対応するプラクティスを、プロジェクトのコンテキストに合わせて適切に調整することもできるとしている。プロジェクト側の活動に焦点を絞ることも、組織レベルの領域を持ち込むならコンテキストに合わせて調整することも、原文がプロジェクトレベルでの当てはめとして述べていることであり、この進め方はその両方をそのまま言っている。","distractors":["チーム自身が持ち寄った、何がうまくいき何がうまくいかなかったかという材料から改善の対象を決める案である。改善の手立てとしては実際に行われているが、シラバスがそれを置いているのは、プロジェクトやチーム自体のデータに基づいて問題を識別する分析的アプローチの側である。テスト改善モデルを使うと決めた取り組みが用いる入力は、テストの最良の実践例に基づくテスト改善モデルのほうである。","モデルが定める領域を、組織のポリシーや体制にあたる部分も含めて、定義されたままの形で判定の対象にする案である。モデルに沿うならモデルの定めどおりに測るべきだという考えは筋が通って見える。しかしシラバスは、プロジェクトレベルで適用する場合には組織レベルの活動は大きく除外されることが多いとし、持ち込むとしてもプロジェクトのコンテキストに合わせて適切に調整することができると述べている。定義されたままの形で当てはめることは、そのどちらの記述にも当たらない。","モデルが改善を段階的に進めるという性質を、組織全体が下位の段を踏み終えるまでプロジェクトでは使えないという意味にまで広げた案である。シラバスはモデルベースの改善はプロジェクトレベルで適用することもできると述べており、組織側の達成を先に求めてはいない。段階的に進むのはモデルが示すテスト改善の道筋であって、適用できる範囲の順序ではない。",null],"flip":[null,"取り組みをこのプロジェクトの中だけで始めると述べるシナリオの一文が、「会社全体を対象に取り組むことになった」に置き換われば、モデルが定める領域を定義されたままの形で判定することが適切な進め方になる。",null,null],"flipNote":{"1":"チームで何がうまくいき何がうまくいかなかったかを持ち寄って改善の対象を決めることは、プロジェクトやチーム自体のデータから問題を識別する分析的アプローチとしてシラバスに居場所がある活動で、手立てとして誤ってはいない。外れているのは、それをテスト改善モデルを使う取り組みの進め方として置いた点である。どちらのアプローチで進めるかを決めているのは設問ではなく、会社がテスト改善モデルを使った改善に取り組むことにしたと述べるシナリオの一文で、そこをチーム自身のデータに基づく改善に置き換えれば、たしかにこの案は一意の正答になる。しかしそのとき問が測るのは、モデルベースの改善をプロジェクトにどう当てはめるか（シラバス 1.5.2 項）ではなく、分析ベースの改善の進め方（同 1.5.3 項）に移ってしまう。","3":"この案の誤りは、モデルが改善を段階的に進めるという性質を、適用できる範囲の順序にすり替えた点にある。シラバスはモデルベースの改善をプロジェクトレベルで適用することもできると述べており、組織全体が下位の段を満たすことを前提にしていない。待つ相手を組織から別のものに替えても、プロジェクトでの適用を後回しにする進め方を支える記述は原文に無い。段階的に進むという記述はモデルの中身についてのものであって、この案を正しくする側には働かない。"},"quote":"モデルベースの改善は、プロジェクトレベルで適用することもできる。このような場合、アセスメントと改善プロセスは、プロジェクトレベルの活動（テスト計画やテスト設計など）に関連するテストプロセスや、モデルで定義された重要な領域に特に焦点を当て、組織レベルの活動（テストポリシーやテスト組織など）は大きく除外されることが多い。あるいは、組織レベルに対応するプラクティスを、プロジェクトのコンテキストに合わせて適切に調整することもできる。","ref":"1.5.2","misconception":"テスト改善モデルは組織全体を測る道具であり、プロジェクトで使うにはモデルの定めをそのまま持ち込むか、組織の達成を待つしかないと考え、プロジェクトレベルの活動に焦点を絞ること、組織レベルのプラクティスをコンテキストに合わせて調整できることを知らない"},"meta":{"concept":"モデルベースのテストプロセス改善","distractorIntent":["組織レベルの領域を、調整せずそのままプロジェクトの評価に持ち込む","モデルの段階性を、適用できる範囲の順序と読み替える","モデルベースの改善の入力を、チーム自身の経験に置き換える"],"distractorTypes":["D1","D5","D1"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-65"]}},{"id":"q-1.5.3-A-1","lo":"TM-1.5.3","cluster":"1.5.3-A","variant":1,"chapter":1,"section":"1.5","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは物流会社の配車システムを保守するチームのテストマネージャーである。過去1年分の欠陥の記録とテスト実行の記録がそろっており、これを使ってテストのやり方を直すことになった。","question":"分析に基づく改善アプローチの進め方として、最も適切なものはどれか。1つ選べ。","choices":["担当者ごとに検出した欠陥の数と修正にかかった日数を集計し、その数値を次の期の一人ひとりの目標と人事評価の材料として反映する。","欠陥の適切なセットを選んでまとまりを見つけ、重いまとまりの根本原因を特性要因図で突き止めて、同じ欠陥を防ぐ手立てを導く。","いま取れているメトリクスを先に洗い出し、そこから答えられる質問を組み立てて、測定のゴールは後から定める。","モデルが定めるキーエリアごとのチェックポイントに照らして、いまの成熟度を判定する。"],"answer":[1],"explanation":{"signals":"効く情報は、手元にあるのが過去1年分のこのチーム自身の欠陥の記録とテスト実行の記録であることと、問われているのが分析に基づく改善の進め方であることである。物流会社の配車システムという業種は、どの進め方が当てはまるかを変えない。","why":"欠陥の適切なセットを選んでまとまりを見つけ、重いまとまりの根本原因を特性要因図で突き止め、同じ欠陥を防ぐ手立てを導く ── これは原文が根本原因分析の「考えられる分析手順」として示した順そのものである。シラバスは分析的アプローチを、プロジェクトやチーム自体のデータに基づいて問題を識別するものとし、その例として根本原因分析、尺度・メトリクス・指標を用いた分析、GQM アプローチを挙げている。根本原因分析については、問題の根本原因を特定するための調査であり、単に目先の明らかな症状に対処するのではなく、問題の原因を取り除く解決策を識別することができると述べたうえで、欠陥の適切なセットを選択し、このデータからクラスターを識別し、特性要因図を使用して重要な欠陥クラスターの根本原因を識別し、同様の欠陥の発生を防止するための改善策を導き出す、という手順を示している。手元にある1年分の欠陥の記録は、この手順をそのまま始められる入力である。","distractors":["尺度やメトリクスを、担当者一人ひとりの成績として集計し、目標と人事評価に反映する案である。数値で測る点は分析に基づく改善に似ており、成果を見えるようにしたいという動機も現場にある。しかしシラバスは、尺度、メトリクス、指標を、プロジェクトやチームにおけるテストプロセスがどの程度うまく実行されているかをアセスメントするための定量的な方法として使用するとしている。原文が測る先として名指しているのはテストプロセスの実行状況であって、担当者一人ひとりではない。",null,"いま取れている数値を出発点にして、測定のゴールを後から当てはめる案である。手元のデータから始める方が早いという言い分は会議で通りやすいが、シラバスが示す GQM の順序は逆である。まず測定ゴールが、特定の目的、視点、コンテキストのために測定する必要がある対象物の品質側面を定義する。そのゴールをステークホルダーの視点から品質の側面を定義する質問へ洗練し、そして質問に答えるために必要な情報を提供するメトリクスを選択する。向きを裏返すと、選んだメトリクスが誰のどの情報ニーズに応えるものかが決まらない。","外部のモデルが定めるキーエリアごとのチェックポイントに現状を照らす案である。改善の手立てとしては有効だが、シラバスはそれを、プロジェクトやチームのテストアプローチを外部の最良の実践例と比較するモデルベースの改善の側に置いている。分析的アプローチが問題の識別に使う入力は、プロジェクトやチーム自体のデータである。"],"flip":[null,null,null,null],"flipNote":{"1":"テストプロセスの実行状況を尺度、メトリクス、指標で測ること自体は、シラバスが分析的アプローチの例として挙げているもので、この案が外れているのは測る先を担当者個人に移した点だけである。測る先をテストプロセスに戻せば原文どおりの進め方になるが、そのとき根本原因分析の手順を述べた案と並び立ち、正しい進め方が2つになって1つ選べの形が壊れる。測る先はこの案の中で動かせる要素ではあっても、他の案の当否を同時に切り替える条件ではない。","3":"この案が持ち出している測定ゴール、質問、メトリクスは、どれもシラバスが GQM の説明で使っている語であり、GQM 自体は分析的アプローチの例として原文に挙がっている。外れているのは導出の向きだけである。向きをゴールから始まる原文どおりの順に戻せば正しい進め方になるが、そのときも根本原因分析の手順を述べた案は正しいままなので、正しい進め方が2つ並ぶ。向きはこの案の中の1要素ではあるが、それを直しても他の案の当否は動かない。","4":"外部のモデルが定めるチェックポイントに照らして成熟度を判定することは、シラバスがモデルベースの改善アプローチとして説明している活動であり、中身自体は原文に居場所がある。外れているのは、それを分析に基づく改善の進め方として置いた点である。この案が答えになるのは、外部の最良の実践例との比較を扱う問いに変わったときであり、それはシナリオや選択肢の条件の変更ではなく、問いそのものの入れ替えである。"},"quote":"根本原因分析とは、問題の根本原因を特定するための調査である。これにより、単に目先の明らかな症状に対処するのではなく、問題の原因を取り除く解決策を識別することができる。考えられる分析手順としては、欠陥の適切なセットを選択し、このデータからクラスターを識別し、特性要因図（石川ダイアグラムまたは魚の骨ダイアグラムとも呼ばれる）を使用して、重要な欠陥クラスターの根本原因を識別する。そして、同様の欠陥の発生を防止するための改善策を導き出す。","ref":"1.5.3","misconception":"分析に基づく改善を「数字を集めること」と大づかみに覚えており、原文が挙げる手順の中身──根本原因分析がどの順で進むか、メトリクスが測る対象は何か、GQM がゴールから始まること──を区別できていない"},"meta":{"concept":"分析ベースのテストプロセス改善アプローチ","distractorIntent":["テストプロセスを測るメトリクスを、個人を測る道具として使う","GQM の導出方向を、手元のメトリクスからゴールへ逆にたどる","外部モデルとの比較を、分析に基づく改善の進め方に数える"],"distractorTypes":["D10","D10","D1"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-65","MP-94","MP-95"]}},{"id":"q-1.5.3-B-1","lo":"TM-1.5.3","cluster":"1.5.3-B","variant":1,"chapter":1,"section":"1.5","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはホテルチェーンの予約システムを保守するチームのテストマネージャーである。テストのやり方を見直すことになったが、動かせるのは次のリリースまでの3か月とこのチームの中だけで、外部の機関に評価を依頼する予算も期間も取れない。手元には1年分の欠陥とテスト実行の記録がある。","question":"分析に基づく改善の進め方として、この状況に**適切でないもの**はどれか。1つ選べ。","choices":["手元の記録から測れる項目を、有効性、効率性、予測性という側面ごとに1つずつ選び、集めた値を分析して直すべき領域を絞り込む。","外部に公開されている実践例と照らし合わせて、分析から導いた改善策に偏りがないかを自分たちで確かめる。","改善の効果を後で確かめられるよう、前後で見る主要な項目を先に決め、現在の値を手元の記録から出しておく。","組織全体のテストプロセスを外部のモデルの尺度で判定してもらい、不足とされた領域を今回の見直しの出発点にする。"],"answer":[3],"explanation":{"signals":"効くのは2つである。1つは、動かせるのが次のリリースまでの3か月とこのチームの中だけで、外部の機関に評価を依頼する予算も期間も取れないこと。もう1つは、手元に1年分の欠陥とテスト実行の記録があることである。ホテルチェーンの予約システムという業種は、どの進め方が状況に合わないかを変えない。","why":"この状況に合わないのは、組織全体のテストプロセスを外部のモデルの尺度で判定してもらい、不足とされた領域を見直しの出発点にする進め方である。シラバスは、モデルベースの改善アプローチを用いると、プロジェクトやチームのテストアプローチを外部の最良の実践例と比較することで改善がもたらされるとし、分析的アプローチでは、プロジェクトやチーム自体のデータに基づいて問題を識別すると述べて、2つを区別している。外部のモデルによる判定を出発点に置く進め方は、問題を識別する入口をチーム自身のデータではなく外部の判定に置き換えており、この区別と食い違う。加えてシナリオは、動かせるのが次のリリースまでの3か月とこのチームの中だけで、外部の機関に評価を依頼する予算も期間も取れないと述べている。組織全体を対象とする判定は、この範囲と期間にも収まらない。なお原文は、分析的アプローチを、結果を検証し、多様性を提供するために、モデルベースのアプローチとともに使用することができるとも述べている。外部の実践例に照らすこと自体が退けられるのではなく、問題の識別そのものを外部の判定に委ねた点と、その判定が組織全体を対象とする点が、この状況に合わない。","distractors":["シラバスは、尺度、メトリクス、指標を、プロジェクトやチームにおけるテストプロセスがどの程度うまく実行されているかをアセスメントするための定量的な方法として使用するとし、考慮すべきテストプロセスの主な属性は、有効性、効率性、予測性であるとして、これらの属性ごとに1つまたは複数のメトリクスを選択することができるとしている。この進め方はその記述どおりで、測る値の出どころも手元の記録である。3つの側面を測るのは3か月には重いと見えるため状況に合わないものとして選ばれやすいが、原文は属性ごとに1つでもよいとしており、値はすでにある記録から取れる。","シラバスは、分析的アプローチは、結果を検証し、多様性を提供するために、モデルベースのアプローチとともに使用することができると述べている。分析から導いた改善策を外部に公開されている実践例と照らして確かめることは、その併用にあたる。外部という語が出るだけで別の改善アプローチの活動だと見て、分析に基づく改善には持ち込まないと考える人が選ぶ。しかしここで行うのは公開されている実践例を自分たちで照らし合わせることであり、外部の機関への依頼を伴わないので、予算と期間の制約にも触れない。","シラバスは、テストプロセスをアセスメントし、改善が成功したかどうかを評価するためには、主要なパラメーターの定義と測定が必要となると述べている。前後で見る主要な項目を先に決め、現在の値を出しておくことは、その定義と測定にあたる。効果を測るのは改善を実施してからでよいと考えると、着手前に現在の値を取る作業は本題から外れて見えるが、原文は評価の条件としてパラメーターの定義と測定を置いている。現在の値は手元の1年分の記録から出せるので、3か月という枠にも収まる。",null],"flip":[null,null,null,null],"flipNote":{"1":"有効性、効率性、予測性という属性ごとにメトリクスを選び、対応するデータを収集、分析して改善が必要な主要領域を識別することは、シラバスが分析的アプローチの例として挙げている尺度、メトリクス、指標の使い方そのものである。これを状況に合わないものにするには、属性ごとに1つまたは複数のメトリクスを選択することができるという原文の記述が変わるか、手元の記録から値が取れなくなるかのどちらかが要る。前者は受験者が動かせる条件ではない。後者は1年分の記録という、この問題に与えられた入力そのものを取り去ることである。しかも取り去れば、現在の値を同じ記録から出しておく効果測定の準備も足場を失い、問題の識別を外部のモデルによる判定に置く進め方は記録の有無と関わりなく合わないままなので、合わないものが3つ並ぶ。","2":"分析的アプローチを、結果を検証し、多様性を提供するためにモデルベースのアプローチとともに使用することは、原文が明示して認めている。この進め方が状況に合わないものになるのは、自分たちで照らし合わせる形が外部の機関に評価を依頼する形に変わったときだが、それは中身を、組織全体の判定を外部に依頼する進め方とほぼ同じものに書き換えることであり、そのとき予算と期間の制約に触れるものが2つ並ぶ。併用を認めた原文の一文のほうを外せば1つに絞れるが、原文は受験者が動かせる条件ではない。","3":"改善が成功したかどうかを評価するために主要なパラメーターを定義して測定することは、シラバスがテストプロセスのアセスメントの条件として置いている活動であり、この進め方の居場所は原文の中にある。効果を確かめる機会が無いという条件を置けば宙に浮くが、それには次のリリースが3か月後にあるという記述を取り去る必要があり、そこは改善を当てはめる期間そのもの、つまりこの問題の入力である。しかも取り去ったところで、問題の識別を外部のモデルによる判定に置く進め方は、チーム自体のデータから問題を識別するという分析的アプローチの説明と食い違ったままなので、合わないものが2つ並ぶ。"},"quote":"前節で説明したように、モデルベースの改善アプローチを用いると、プロジェクトやチームのテストアプローチを外部の最良の実践例と比較することで改善がもたらされる。分析的アプローチでは、プロジェクトやチーム自体のデータに基づいて問題を識別する。これらの問題の分析から、適切な改善策を導き出すことができる。分析的アプローチは、結果を検証し、多様性を提供するために、モデルベースのアプローチとともに使用することができる。","ref":"1.5.3","misconception":"分析に基づく改善を「データを使う改善」とだけ覚えており、問題を識別する入力がチーム自身のデータであるという入り口の条件と、その進め方がプロジェクトの期間と範囲に収まるかという当てはめを見ていない"},"meta":{"concept":"分析ベースのテストプロセス改善アプローチ","distractorIntent":["有効性・効率性・予測性の3つを測ることを、3か月の枠には重すぎる活動と見る","外部の実践例に照らす活動を、分析に基づく改善とは併用できないものと見る","改善の効果を測る準備を、改善を実施してから考えればよい後工程と見る"],"distractorTypes":["D12","D12","D12"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-65"]}},{"id":"q-1.5.4-A-1","lo":"TM-1.5.4","cluster":"1.5.4-A","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"multi","minutes":3,"scenario":"あなたは、住宅設備メーカーの遠隔点検サービスを開発するチームのテストマネージャーである。開発は2週間のイテレーションで進め、各イテレーションの終わりに、開発担当・テスト担当・プロダクトオーナーの全員が出席してふりかえりを行っている。議題の原案は、あなたが準備する。\n\n先週のリリース後、利用者から、点検予約が重複して登録される、通知メールの文面が分かりにくい、という2件の苦情が届いた。イテレーション中の出来事としては、受け入れ条件が固まらないまま着手してテストの設計を2度やり直したこと、テストの観点を口頭でしか渡さず、開発担当が直したつもりの箇所をテスト担当が確認していなかったことが、チームから挙がっている。","question":"このイテレーションのふりかえりの議題として適切なものはどれか。2つ選べ。","choices":["点検予約が重複して登録された不具合について、開発担当とテスト担当で、どの処理で起きたのかを切り分け、次のイテレーションでの修正方針を決める。","受け入れ条件が固まらないまま着手してテストの設計をやり直した経緯を起きた順に並べ、なぜ同じことが繰り返されたのかを全員で掘り下げる。","通知メールの文面を利用者に分かりやすい表現へ書き直し、次のイテレーションで配信できるようにする。","テストの観点を口頭でしか渡していなかったやり方を取り上げ、開発担当とテスト担当の間で何をどう渡すかを決め直す。","届いた苦情を機能ごとに集計し、次のイテレーションで作り込む機能の順番を組み替える。"],"answer":[1,3],"explanation":{"signals":"シナリオが出す材料は2種類ある。1つは利用者から届いた2件の苦情（点検予約の重複登録、通知メールの文面）で、これはできあがった製品の側で起きていることである。もう1つはチームから挙がった2件の出来事（受け入れ条件が固まらないまま着手してテストの設計を2度やり直した、テストの観点を口頭でしか渡していなかった）で、こちらはチームの仕事の進め方と担当者間の受け渡しの側で起きていることである。苦情が先に目に入るので議論は製品の直し方へ向かいやすいが、議題の適否を決めるのは、その案を実行したときに変わるのが製品か、チームの働き方かである。プロダクトオーナーが出席していることは、製品側の案を議題にしてよい理由にはならない。","why":"議題にすべきは、受け入れ条件が固まらないまま着手してテストの設計をやり直した経緯を起きた順に並べ、なぜ同じことが繰り返されたのかを掘り下げること、そして、テストの観点を口頭でしか渡していなかったやり方を取り上げ、何をどう渡すかを決め直すことである。どちらも、実行して変わるのはチーム自身の進め方と担当者間の受け渡しであり、ふりかえりが対象にしているのはそこだからである。シラバスはふりかえりを、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓を把握して改善を達成するための変更と行動を決定するためのミーティングであると定義し、取り上げるトピックとしてプロセス、人、組織、コラボレーション、ツールを挙げている。この定義もトピックの並びも、対象は一貫してチームの側にあり、製品そのものは入っていない。設計をやり直した経緯をたどることは、イテレーション中に起こったことに関するデータを集め、そこから現状を把握して改善のアイデアへ進む、データの収集から改善策の導出への流れそのものである。観点を口頭でしか渡していなかったことは開発担当とテスト担当のあいだの受け渡し、すなわちコラボレーションの問題であり、渡し方を決め直せば次のイテレーションのやり方が変わる。一方、苦情が指している重複登録も通知メールの文面も、手を入れて変わるのは製品であって、チームのやり方ではない。シラバスが「テストとテスト以外の課題の両方について」と書いているのはテストか否かの軸であって、製品か進め方かの軸ではない点に注意する。","distractors":["どの処理で起きたのかを切り分けて次のイテレーションでの修正方針を決めても、変わるのは製品の作りであって、チームのやり方ではない。シラバスがふりかえりのトピックとして挙げるプロセス、人、組織、コラボレーション、ツールはいずれもチームの側にあり、不具合の原因箇所の切り分けと修正方針の決定はそこに入らない。開発担当とテスト担当が一緒に当たる形をとっていても、出てくる結論は製品の直し方である。2件の苦情のうち機能の不具合はこれだけで、しかもリリースまで気づかれずに利用者の手元で起きた事象であるため、テストの話題として議題に入れてよいように見える。",null,"文面を利用者に分かりやすい表現へ書き直して配信できるようにすることは製品の改善であり、チームの働き方は何も変わらない。読みにくさが利用者に届いてしまった以上、次のイテレーションで手を打つべき課題ではあるが、それはプロダクトオーナーとチームが製品の作り込みとして扱う話である。ふりかえりが「テストとテスト以外の課題の両方について」扱うという一句を、製品の課題も扱えることだと読み替えると選んでしまう。",null,"苦情を機能ごとに集計するところまでは定量的なデータを集める作業に見えるが、集めた結果を使って組み替えるのは次のイテレーションで作り込む機能の順番、すなわち製品の側である。シラバスはふりかえりを、チームが自分たちのやり方とコラボレーションをレビューし、改善を達成するための変更と行動を決定するためのミーティングであると定義し、取り上げるトピックとしてプロセス、人、組織、コラボレーション、ツールを挙げているが、次のイテレーションで作り込む機能の順番はそのどれにも当たらない。手元のデータから次の行動を決めるという形をとっているため、データの収集から改善アクションの決定へ至る流れに当てはまっているように見える。"],"flip":[null,null,null,null,null],"quote":"ふりかえりとは、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓（よい点 と悪い点の両方）を把握し、（テストとテスト以外の課題の両方について）改善を達成するための変更と 行動を決定するためのミーティングである。ふりかえりでは、プロセス、人、組織、コラボレーション、ツールなどのトピックを取り上げる。…データの収集：データは、イテレーションまたはプロジェクト中に起こったことに関して収集する。","ref":"1.5.4（ふりかえりの定義／取り上げるトピック／データの収集）","misconception":"「テストとテスト以外の課題の両方について」という一句を「製品の課題も扱う」と読み替え、苦情が指している製品そのものの直し方をふりかえりの議題にしてしまう。","flipNote":{"1":"どの処理で起きたのかを切り分けて修正方針を決める案が落ちるのは、実行して変わるのが製品の側だからであり、苦情の件数や中身をシナリオでどう動かしても、その性質は変わらない。不具合の直し方ではなく、それが利用者に届くまで気づかれなかった経緯をたどる形に置き換えれば自分たちのやり方の側の話になるが、それはこの選択肢が書いている行為そのものの置き換えであり、しかもそのとき、受け入れ条件の件とテストの観点の受け渡しの件に並んで適切な議題が増え、2つ選べという形式が成り立たなくなる","3":"文面を書き直して次のイテレーションで配信することは製品の改善であり、苦情をシナリオでどう増減させても、変わるのが製品の側であることは変わらない。文面をだれも読み合わせないまま出していた進め方のほうを議題にすればプロセスの改善として成立するが、それはこの選択肢が書いている行為（文面を書き直して配信できるようにする）の置き換えであり、そのうえ適切な議題が増えて2つ選べが成り立たなくなる","5":"集計した結果を使って組み替えるのが次に作り込む機能の順番である限り、この案は製品側の議題のままである。同じ集計を、自分たちのテストがこの2件の苦情に至った不具合をどの段階まで見逃していたかを確かめるために使うのであれば、自分たちのやり方を見直すためのデータの収集になるが、それはこの選択肢の後半（次のイテレーションで作り込む機能の順番を組み替える）の置き換えであり、そのうえ適切な議題が増えて2つ選べが成り立たなくなる"}},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","distractorIntent":["苦情のうち機能の不具合だけはテストの話題だと考え、原因箇所の切り分けと修正方針の決定を議題に入れる","「テスト以外の課題も扱う」を「製品の課題も扱う」と読み替え、製品側の改善作業を議題に入れる","手元のデータを集めて次の行動につなげる形だけを見て、集計の対象と行き先が製品側であることを確かめない"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-64"]}},{"id":"q-1.5.4-A-2","lo":"TM-1.5.4","cluster":"1.5.4-B","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、自動車部品メーカーの生産管理システムを更改するプロジェクトのテストマネージャーである。開発はシーケンシャル開発モデルで進めており、受け入れテストが終わった後、テスト完了の作業の一部としてふりかえりを行う。\n\nこのプロジェクトでは、結合テストで見つかるはずの不具合がシステムテストに持ち越され、修正と再テストの手戻りが最後まで続いた。テストレベルごとの欠陥の検出数と検出時期、テスト実行の日次記録は残っている。ふりかえりには開発担当とテスト担当が出席する予定で、時間は2時間を確保している。結果をどう残し、誰に伝えるかも、あなたが決める。","question":"このふりかえりの進め方として最も適切なものはどれか。","choices":["テストレベルごとの欠陥の検出数と検出時期がわかる記録、およびテスト実行の日次記録を持ち寄って共有し、結合テストで検出できなかった理由を出席者で掘り下げる。出た改善案に優先順位を付けて責任者を決め、発見事項と結論、推奨事項を組織のメンバーに配布する。","改善には予算と他部門の協力が要るため、事業部長と品質保証部門長にも出席を依頼する。テストレベルごとの欠陥の検出時期の記録を示して、結合テストで見つからなかった理由をその場で掘り下げ、実施する改善と責任者を決めてもらい、決まった内容を組織のメンバーに配布する。","限られた時間を有効に使うため、本番に影響した重大な欠陥3件に絞って理由を掘り下げ、小さな手戻りや日々の段取りの問題は今回の議題から外す。出てきた改善案に優先順位を付け、責任者を決めて次のプロジェクトの計画に引き継ぐ。","テスト担当だけでテスト実行の日次記録と欠陥の記録を読み合わせて手戻りが続いた理由をまとめ、決まった改善とその責任者を一覧にする。まとめた内容は、次に同じ製品を担当するテスト担当が読めるよう、テストの作業手順書に追記する。"],"answer":[0],"explanation":{"signals":"効くのは4つである。開発がシーケンシャル開発モデルで、ふりかえりはテスト完了の作業の一部として行われること。テストレベルごとの欠陥の検出数と検出時期、テスト実行の日次記録という定量的なデータが手元に残っていること。出席予定が開発担当とテスト担当であること。そして、結果をどう残し誰に伝えるかを決める権限があなたにあること。開発モデルと権限の2つが出口の形を、手元に残っている定量的なデータが原因の掘り下げをどこから始められるかを、出席予定がこの場を誰の場として扱うかを決めている。ただし、残っている記録をどこまで持ち寄るかで案の適否が分かれるわけではない。原文はデータの収集について、定性的なデータを収集することが可能である、さらにメトリクスの定量的データを提示することもできると述べており、手元の記録を残らず持ち寄ることまでは求めていないからである。確保した時間が2時間であることは、議題を重大な欠陥だけに絞る理由にはならない。","why":"取るべき進め方は、テストレベルごとの欠陥の検出数と検出時期がわかる記録およびテスト実行の日次記録を持ち寄って共有し、そこから結合テストで検出できなかった理由を出席者で掘り下げ、出た改善案に優先順位を付けて責任者を決め、発見事項と結論、推奨事項を組織のメンバーに配布するものである。手元に定量的なデータが残っていることと、このプロジェクトがシーケンシャル開発モデルであることが、この形を決めている。シラバスは典型的なふりかえりを、イントロダクション、データの収集、改善策の導出、改善アクションの決定、クロージングの各ステップで構成されるとしている。データの収集ではイテレーションまたはプロジェクト中に起こったことに関してデータを集め、メトリクスの定量的データを提示することもできるとし、改善策の導出では収集したデータを分析して現状を把握し、例えば根本原因分析を適用して改善のアイデアを生み出すとしている。つまり原因の掘り下げは、手元のデータを分析した上に乗る。続く改善アクションの決定では、改善案を実施するためのアクションを導き出して優先順位を付け、改善計画と責任者を定義するとしている。さらにシラバスは、ふりかえりの結果を適切に文書化することが重要であるとしたうえで、シーケンシャル開発モデルでは発見事項、結論、および推奨事項を、組織のメンバーに分かりやすい方法で配布し、伝達する必要があるとしている。結果をどう残して誰に伝えるかを決めるのはあなたであり、データを持ち寄る、理由を掘り下げる、優先順位と責任者を決める、組織のメンバーに配布する、までを一続きに置いた進め方が、この状況でのふりかえりの実装になる。","distractors":[null,"この案が原文の求めのうち満たしていないのは、アクションの優先順位付けと、配布するものの中身である。シラバスは改善アクションの決定で、改善案を実施するためのアクションを導き出して優先順位を付け、改善計画と責任者を定義するとしているのに、この案は実施する改善と責任者を決めてもらうだけで、優先順位を付ける手順を欠いている。配布するものも「決まった内容」にとどまり、シーケンシャル開発モデルについて原文が配布と伝達を求めている発見事項、結論、および推奨事項ではない。事業部長と品質保証部門長に出席を依頼している点は、原文の求めではなく公式サンプル問題の解説の裁定によって落ちる。原文が参加者について定めているのは、ふりかえりをチーム全体で行うということであり、開発担当とテスト担当に事業部長と品質保証部門長を加えるこの案は、チーム全体で行っていないわけではない。チーム以外の同席を禁じる一文は原文には無い。公式サンプル問題の解説のほうが、ふりかえりはチーム主導で外部からの圧力のない率直な議論を行う場であり、上級管理職を同席させると率直なやり取りが妨げられかねないため誤りで、ふりかえりの結果は事後に要約して管理層と共有するのが正しいと裁定している。原文の側でこの裁定を支えているのは、ふりかえりをチーム全体で行うものとし、最初のステップで、非難や判断を下すことなく問題を話し合うことができるよう相互信頼の雰囲気を作るとしている2文であり、これはこの場がチーム主導の場であることを示すにとどまる。なお、示す記録が欠陥の検出時期だけである点は、この案が原文から外れる理由には数えない。データの収集について原文は、主要な出来事のタイムラインといった定性的なデータを収集することが可能であるとし、さらにメトリクスの定量的データを提示することもできるとしていて、手元に残る記録を残らず持ち寄ることまでは求めていないからである。改善の実行に決裁が要るのは実務では確かであり、意思決定者がその場にいれば話が早いという判断から選ばれやすい。","この案が原文の求めのうち満たしていないのは、配布するものの中身と、結果の届け先である。次のプロジェクトの計画へ引き継いでいるのは出てきた改善案と、その優先順位および責任者だけで、発見事項と結論は引き継ぐものに入っていない。届け先も次のプロジェクトの計画にとどまるため、シーケンシャル開発モデルについて原文が求める、発見事項、結論、および推奨事項を組織のメンバーに分かりやすい方法で配布し、伝達することにはならない。議題を重大度で切っている点は、原文の求めではなく公式サンプル問題の解説の裁定によって落ちる。本番に影響した重大な欠陥3件に絞り、小さな手戻りや日々の段取りの問題を今回の議題から外しているが、公式サンプル問題の解説は、包括的なふりかえりは重大な故障と、将来のテストサイクルに影響しうる小さな問題の両方を分析すべきであり、小さな非効率を無視すれば継続的な改善の機会を失うと裁定している。シラバス側でふりかえりが把握するとしているのは学んだ教訓のよい点と悪い点の両方であって、これは良否の軸であり、重大度で議題を切ってよいかをそのまま定めた一文ではない。掘り下げも優先順位付けも責任者の決定も備えているうえ、確保できたのが2時間であることが示されているため、限られた時間の使い方として妥当に見える。","この案が原文の求めのうち満たしていないのは、出席者、結果の届け先、そしてアクションの優先順位付けである。出席者をテスト担当だけにしている点について、シラバスはふりかえりをチーム全体で行うものとしており、シナリオでも開発担当とテスト担当が出席する予定である。手戻りの理由は結合テストとシステムテストの両方にまたがるため、開発担当を欠いた場では片側からしか見えない。また逐次型では、発見事項、結論、および推奨事項を組織のメンバーに分かりやすい方法で配布し、伝達する必要があるが、テストの作業手順書への追記は、次に同じ製品を担当するテスト担当にしか届かない。さらにこの案が決めているのは改善とその責任者の一覧までで、シラバスが改善アクションの決定で求める、アクションに優先順位を付けることが無い。手順書に残せば確実に使われるという実務の感覚から選ばれやすい。"],"flip":[null,null,null,null],"quote":"ふりかえりはチーム全体で行うため、チーム全体アプローチを支援し、継続的な改善を促進する。…イントロダクション：ふりかえりのゴールと課題を確認する。そして非難や判断を下すことなく問題を話し合うことができるよう、相互信頼の雰囲気を作る。…改善策の導出：収集したデータを分析して現状を把握し、改善のアイデアを生み出す。…改善アクションの決定：改善案を実施するためのアクションを導き出し、優先順位を付ける。改善計画と責任者を定義する。…ふりかえりの結果を適切に文書化することが重要である。シーケンシャル開発モデルでは、発見事項、結論、および推奨事項を、組織のメンバーに分かりやすい方法で配布し、伝達する必要がある。","ref":"1.5.4（ふりかえりの担い手＝チーム全体／典型的なふりかえりのステップ／イントロダクション／改善アクションの決定／結果の文書化と配布）、公式サンプル問題の解説（SET B 問22 c ＝ 包括的なふりかえりは重大な故障と、将来のテストサイクルに影響しうる小さな問題の両方を分析する／SET B 問22 b ＝ 上級管理職を同席させると率直なやり取りが妨げられかねない）","misconception":"ふりかえりを「課題を出して改善を決める場」とだけ捉え、誰がその場に居るか、出た改善案に優先順位を付けているか、何を誰に届けるかという、原文が定めた条件を確かめない。","flipNote":{"2":"事業部長と品質保証部門長を場に入れる点は、シナリオの出席予定や確保した時間を動かしても反転しない。公式サンプル問題の解説が、ふりかえりはチーム主導で外部からの圧力のない率直な議論を行う場であり、上級管理職を同席させると率直なやり取りが妨げられかねないと裁定しているからである。チーム以外の同席そのものを禁じる一文は原文には無く、この点を落としているのはこの裁定である。原文の側は、ふりかえりをチーム全体で行うものとし、非難や判断を下すことなく問題を話し合うことができるよう相互信頼の雰囲気を作ることを最初のステップに置いており、この場がチーム主導の場であることを支えている。両者を、結果を受け取って実行の可否を判断する立場に置き換えて同席の点を消しても、この案は最も適切な進め方にはならない。改善と責任者を決めてもらうだけで優先順位を付ける手順が無く、シラバスは改善アクションの決定で、改善案を実施するためのアクションを導き出して優先順位を付け、改善計画と責任者を定義するとしているからである。配布するものも「決まった内容」にとどまり、シーケンシャル開発モデルで求められる発見事項、結論、および推奨事項ではない。同席を動かしても、この案が原文の求めのうち満たしていないアクションの優先順位付けと配布するものの中身はそのまま残るので、記録を持ち寄って理由を掘り下げ、優先順位と責任者を決め、発見事項と結論、推奨事項を組織のメンバーに配布する進め方が最も適切なままである","3":"重大な欠陥3件に絞り、小さな手戻りや日々の段取りの問題を議題から外す点は、確保した時間を動かしても反転しない。公式サンプル問題の解説が、包括的なふりかえりは重大な故障と、将来のテストサイクルに影響しうる小さな問題の両方を分析すべきであり、小さな非効率を無視すれば継続的な改善の機会を失うと裁定しているからである。足切りをやめて議題を全部載せる形に変えても、この案の出口は次のプロジェクトの計画への引き継ぎにとどまり、シーケンシャル開発モデルで求められる、発見事項・結論・推奨事項を組織のメンバーに配布し伝達することを満たさないため、最も適切な進め方にはならない","4":"この案が原文の求めのうち満たしていないのは、出席者、結果の届け先、そしてアクションの優先順位付けである。出席者をテスト担当だけにしている点は、ふりかえりをチーム全体で行うものとするシラバスの記述が退ける。残し方をテストの作業手順書への追記にとどめている点は、シーケンシャル開発モデルで求められる、発見事項、結論、および推奨事項を組織のメンバーに分かりやすい方法で配布し、伝達するという求めが退ける。決めているのが改善とその責任者の一覧までである点は、改善アクションの決定でアクションに優先順位を付けるという求めが退ける。どれか1つを補っても、残りが同じ理由でこの案を退けるので、動かせる1条件がない。挙げたものをすべて補えば、記録を持ち寄って理由を掘り下げ、優先順位と責任者を決め、発見事項と結論、推奨事項を組織のメンバーに配布する進め方と同じことを述べることになり、最も適切な進め方が2つ並んで1つに決まらない"}},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","distractorIntent":["改善の実行に決裁が要ることを重く見て、意思決定者を場に入れる（場の条件より決裁の速さを優先する）","会議時間の制約を議題の絞り込みの根拠にし、重大度で足切りする（絞るべきなのは同時に実施する改善の数であることを取り違える）","ふりかえりをテスト側の内省と捉え、出席者と結果の届け先をテストの内側に閉じる"],"distractorTypes":["D6","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-68","MP-67","MP-70","MP-71"]}},{"id":"q-1.5.4-A-3","lo":"TM-1.5.4","cluster":"1.5.4-C","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"multi","minutes":3,"scenario":"あなたは、損害保険会社の保険金支払システムを刷新するチームのテストマネージャーである。開発は3週間のスプリントで進めている。テストがうまく回らない状態が続いたため、スプリントごとの通常のふりかえりとは別に、テストの課題に対処するための専用のふりかえりを1回設けた。この場で扱うのはテストの課題に限ると、あなたはチームに伝えてある。議題はあなたが決める。\n\n事前にチームから挙がった困りごとは次のとおりである。\n・3スプリント続けて、前に直したはずの不具合が同じ画面で再び出た\n・自動化したテストが不安定で、失敗しても原因を調べずに再実行している\n・本番相当のテストデータが半年前のままで、実行のたびに手で直している\n・未実行のテストが残り、次のスプリントに持ち越した\n・要件の確定が他部門の回答待ちで遅れ、着手が毎回後ろにずれている","question":"この専用のふりかえりで取り上げる議題として適切なものはどれか。2つ選べ。","choices":["前に直したはずの不具合が同じ画面で繰り返し出ていたことについて、出た時期と見つかった工程を並べ、どの段階で気づけたはずだったのかをたどる。","要件の確定が他部門の回答待ちで遅れ、着手が毎回後ろにずれている件を取り上げ、どこで滞っているのかを確かめて、確定までの段取りを関係部門と決め直す。","失敗しても原因を調べずに再実行していた自動テストの扱いを取り上げ、失敗をどこまで確かめてから再実行するかをチームで決める。","次のスプリントに持ち越した未実行のテストを取り上げ、重いものから消化できるよう実行順を組み替えて、だれがどこを担当するかを割り当て直す。","半年前のままの本番相当のテストデータを取り上げ、次のスプリントの開始までに最新化して取り込む作業の担当と期限を決める。"],"answer":[0,2],"explanation":{"signals":"効くのは2つである。1つは、この場がテストの課題に対処するための専用のふりかえりとして設けられ、扱うのはテストの課題に限るとチームに伝えてあること。もう1つは、事前に挙がった5件の困りごとが、取り上げたときに何が変わるかで散らばっていることである。次のスプリント以降の自分たちのテストのしかたが変わるもの、今回残った作業のさばき方が決まるだけのもの、その都度必要になる運用の作業が片付くだけのもの、そしてテストの外に原因があるものが混じっている。5件はいずれもチームが実際に困っている事柄であり、困りごとの大きさは議題の適否を決めない。決めるのは、その案がテストの課題かどうかと、取り上げて変わるのがどこかである。","why":"取り上げるべきは、前に直したはずの不具合が同じ画面で繰り返し出ていたことについて、出た時期と見つかった工程を並べ、どの段階で気づけたはずだったのかをたどることと、失敗しても原因を調べずに再実行していた自動テストについて、失敗をどこまで確かめてから再実行するかをチームで決めることである。この2件だけが、テストに固有の課題であり、かつ取り上げて変わるのが次のスプリント以降の自分たちのテストのしかただからである。シラバスはふりかえりを、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓を把握して、テストとテスト以外の課題の両方について改善を達成するための変更と行動を決定するためのミーティングであると定義し、取り上げるトピックとしてプロセス、人、組織、コラボレーション、ツールを挙げている。だからふりかえり一般では、テスト以外の課題も正当な議題である。同時にシラバスは、テストの課題に対処するために専用のふりかえりが必要となることがあるとして、テストに絞った場を認めており、ここで設けたのがその場である。不具合が繰り返し出た経緯をたどることは、イテレーション中に起こったことに関するデータを集め、そこから現状を把握して改善のアイデアへ進む流れであり、自動テストの失敗をどこまで確かめてから再実行するかを決めることは、ツールの扱いという自分たちのやり方を決め直すものである。残る候補のうち、持ち越した未実行のテストの実行順と担当を決め直すことは今回残った作業を消化するための段取りであり、公式サンプル問題の解説はこの種の活動をテストコントロールの一部であってふりかえりの一部ではないと裁定している。テストデータを最新化して取り込む作業の担当と期限を決めることはその都度必要になる運用の作業であり、公式サンプル問題の解説はテストデータの更新を運用的な計画作業であってふりかえりの中核活動ではないと裁定している。原文の側から見ても、この2件が決めているのは今回残った作業や毎回必要になる作業をどう実施するかであって、シラバスがふりかえりの定義に置いた、改善を達成するための変更と行動には当たらない。","distractors":[null,"他部門の回答待ちで要件の確定が遅れることは、ふりかえりで扱うに値する課題であり、シラバスもふりかえりを、テストとテスト以外の課題の両方について改善を達成するための変更と行動を決定する場だと定義している。この案が落ちるのは中身のためではなく、この場がテストの課題に対処するための専用のふりかえりとして設けられ、扱うのはテストの課題に限るとシナリオに置かれているからである。着手の遅れはテストに使える時間を削る原因でもあるため、テストの課題の裏返しとして選ばれやすい。",null,"持ち越した未実行のテストについて実行順を組み替え、だれがどこを担当するかを割り当て直すことは、今回残った作業を次のスプリントで消化するための段取りであり、進行中のテストを軌道に戻す是正処置である。シラバスがふりかえりを、改善を達成するための変更と行動を決定するためのミーティングと定義しているのに対し、この案が決めているのは今回残った作業をどう実施するかであって、次のスプリント以降のやり方を変えることではない。公式サンプル問題の解説は、この種の活動をテストコントロールの一部であってふりかえりの一部ではないと裁定している。持ち越しは目の前の実害で、次のスプリントが始まる前に決めておく必要があるため、この場で決めてしまうのが効率的に見える。","本番相当のテストデータを最新化して取り込む作業の担当と期限を決めることは、その都度必要になる運用の作業の段取りである。公式サンプル問題の解説は、テストデータの更新を運用的な計画作業であってふりかえりの中核活動ではないと裁定している。担当と期限まで決める形は、シラバスが改善アクションの決定で求める改善計画と責任者の定義に似て見えるが、シラバスがふりかえりを、改善を達成するための変更と行動を決定するためのミーティングと定義しているのに照らすと、ここで決めているのは改善ではなく作業そのものであり、変わるのは次のスプリント以降のやり方ではなく、この1回の作業の段取りである。データが半年前のままで実行のたびに手で直していることは実際に手戻りを生んでいるため、真っ先に手を打つべき項目に見える。"],"flip":[null,null,null,null,null],"flipNote":{"2":"要件の確定の遅れを取り上げる案が落ちるのは、この場がテストの課題に対処するための専用のふりかえりとして設けられ、扱うのはテストの課題に限るとシナリオに置かれているからである。シラバス自身は、ふりかえりでテストとテスト以外の課題の両方について改善のための変更と行動を決めると定義しているので、この限定の1文を外せばこの議題も正当になる。ただしそのとき、繰り返し出た不具合の件と自動テストの再実行の件と並んで適切な議題が増え、2つ選べという形式が成り立たなくなる","4":"実行順の組み替えと担当の割り当ては、進行中のテストを軌道に戻す是正処置であり、公式サンプル問題の解説がテストコントロールの一部でありふりかえりの一部ではないと裁定している側に入る。持ち越し分をどう消化するかではなく、毎スプリント未実行が残ってしまう見積りと進め方のほうを取り上げれば自分たちのやり方の議題になるが、それはこの選択肢が書いている行為の置き換えであり、そのうえ適切な議題が増えて2つ選べが成り立たなくなる","5":"テストデータの更新は、公式サンプル問題の解説が運用的な計画作業でありふりかえりの中核活動ではないと裁定している側に入る。同じ材料でも、データが半年前のまま放置され実行のたびに手で直す状態が続いていることそのものを見直すのであれば、ツールとプロセスの議題になるが、それはこの選択肢が書いている行為（最新化して取り込む作業の担当と期限を決める）の置き換えであり、そのうえ適切な議題が増えて2つ選べが成り立たなくなる"},"quote":"ふりかえりとは、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓（よい点 と悪い点の両方）を把握し、（テストとテスト以外の課題の両方について）改善を達成するための変更と 行動を決定するためのミーティングである。ふりかえりでは、プロセス、人、組織、コラボレーション、ツールなどのトピックを取り上げる。…テストの課題に対処するために、専用のふりかえりが必要となることがある。","ref":"1.5.4（ふりかえりの定義＝決めるのは改善を達成するための変更と行動であって作業そのものではない／取り上げるトピック／テストの課題に対処するための専用のふりかえり）、公式サンプル問題の解説（SET A 問21 d ＝ テストコントロールの一部でありふりかえりの一部ではない／SET B 問21 b ＝ テストデータの更新は運用的な計画作業であってふりかえりの中核活動ではない）","misconception":"テストに限ると置かれた場でもプロジェクト全体の課題を議題にしてよいと考え、さらに今回のテスト実行を立て直す段取りやその都度の運用の作業まで、テストをよくする行動であればふりかえりの議題に数えてしまう。"},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","distractorIntent":["シラバスがテストとテスト以外の課題の両方を扱うと書いていることを、シナリオが置いた限定より優先し、テストに固有でない課題を議題にする","今回残った作業を消化するための段取り（進行中のテストの是正処置）を、テストをよくする行動だからふりかえりの議題になると考える","担当と期限を決める形だけを見て、決めている対象が改善ではなくその都度の運用の作業であることを確かめない"],"distractorTypes":["D2","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-69","MP-66"]}},{"id":"q-1.5.4-A-4","lo":"TM-1.5.4","cluster":"1.5.4-D","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、通信事業者の料金システムを保守するチームのテストマネージャーである。四半期ごとのリリースを終えるたびに、チーム全体でふりかえりを行っている。今回のリリースでは本番で請求額の誤りが2件見つかり、臨時の修正リリースを2回出した。チームは半年前に集められたばかりで、メンバーは互いの仕事のしかたをまだよく知らない。手元には、四半期中のテスト進捗と欠陥検出のメトリクス、および日々の出来事を書き留めた記録が残っている。来週のふりかえりをどう進めるかはあなたが決める。進め方の案として次の4つが挙がっている。","question":"これらの案のうち、典型的なふりかえりの構成に**含まれないもの**はどれか。1つ選べ。","choices":["最初に、この場のゴールと扱う課題を全員で確認し、互いをまだよく知らない状態でも、非難や判断を下すことなく問題を話し合える雰囲気を作る。","続いて、四半期中に起きた主な出来事を時系列に並べ、それぞれの出来事について各メンバーがどう感じたかを挙げてもらい、あわせてテスト進捗と欠陥検出のメトリクスを示して、何が起きていたのかを全員で共有する。","そのうえで、自分たちのテストのしかたとツールを、業界で広く使われている成熟度モデルのキーエリアに照らして評価し、まだ届いていない項目を洗い出す。","最後に、今回のふりかえりの進め方そのものを取り上げ、うまくいった点とこれから変えたい点を挙げて、次の四半期のふりかえりに反映する。"],"answer":[2],"explanation":{"signals":"効くのは、シラバスが挙げる典型的なふりかえりのステップと、4つの案がそれぞれなぞっている中身との対応である。手元にあるのは四半期中のテスト進捗と欠陥検出のメトリクス、および日々の出来事を書き留めた記録で、いずれもこのチーム自身のデータである。チームが半年前に集められたばかりで互いの仕事のしかたをまだよく知らないことは、最初のステップがこの回で軽くないことを示す。本番で請求額の誤りが2件見つかり臨時の修正リリースを2回出したことは、この回で扱う出来事を供給する。ただし、どの案が構成に含まれるかを決めるのはこれらの事情ではなく、シラバスが列挙するステップのほうである。","why":"典型的なふりかえりの構成に含まれないのは、自分たちのテストのしかたとツールを、業界で広く使われている成熟度モデルのキーエリアに照らして評価する案である。外部のモデルと突き合わせて届いていない項目を洗い出すことは、自分たちのデータから問題を見つける活動ではないからである。シラバス 1.5.3 は、モデルベースの改善アプローチを用いると、プロジェクトやチームのテストアプローチを外部の最良の実践例と比較することで改善がもたらされるとし、分析的アプローチでは、プロジェクトやチーム自体のデータに基づいて問題を識別する、と書き分けたうえで、ふりかえりを後者の側で紹介している。公式サンプル問題の解説も、テストプロセスとツールを業界の最良の実践例に照らして評価することは典型的なふりかえりの一部ではなく、テストプロセス改善活動の側であると裁定している。残る3つの案は、シラバスが典型的なふりかえりのステップとして挙げている中身をそのままなぞっている。この場のゴールと扱う課題を全員で確認し、非難や判断を下すことなく問題を話し合えるよう相互信頼の雰囲気を作ることはイントロダクションの中身である。四半期中の主な出来事を時系列に並べて各メンバーの感じ方を挙げてもらい、あわせてテスト進捗と欠陥検出のメトリクスを示すことは、データの収集が挙げる定性的なデータと定量的なデータの両方にあたる。ふりかえりの進め方そのものを取り上げ、うまくいった点とこれから変えたい点を挙げることは、ふりかえりプロセスの長所と改善点を識別するためにふりかえり自体をレビューするという、クロージングの中身である。","distractors":["この案が書いているのは、シラバスがイントロダクションの中身として挙げていることそのものである。ふりかえりのゴールと課題を確認する、そして非難や判断を下すことなく問題を話し合うことができるよう、相互信頼の雰囲気を作る、と書かれている。場を温める配慮は会議を円滑にする作法であって、ふりかえりという活動の構成要素ではないと考える人が選ぶ。チームが半年前に集められたばかりという事情がシナリオに書かれているため、今回に固有の配慮であって典型的な構成の外だ、とも読みやすい。","この案が書いているのは、シラバスがデータの収集の中身として挙げていることそのものである。イテレーションまたはプロジェクト中に起こったことに関してデータを収集するとしたうえで、各チームメンバーが課題事項についてどのように感じているかを列挙した主要な出来事のタイムラインといった定性的なデータと、テスト進捗や欠陥検出といったメトリクスの定量的データの両方が挙げられている。メンバーがどう感じたかという主観を集めることはふりかえりの構成要素ではなく、扱うべきなのは客観的な数字だけだと考える人が選ぶ。",null,"この案が書いているのは、シラバスがふりかえりのクロージングの中身として挙げていることそのものである。この最後のステップでは、ふりかえりプロセスの長所と改善点を識別するために、ふりかえり自体をレビューすると書かれており、継続的な改善はふりかえり自体にも適用されるとも述べられている。ふりかえりをふりかえるのは入れ子で冗長に見えるため、チームが必要に応じて付け足す運用であって典型的な構成には入らない、と考える人が選ぶ。"],"flip":[null,null,null,null],"flipNote":{"1":"この案が書いているのは、ゴールと課題を確認し、非難や判断を下すことなく問題を話し合えるよう相互信頼の雰囲気を作ること、すなわちシラバスがイントロダクションの中身として挙げていることそのものである。これを含まれない側へ動かすには、原文が列挙するステップからイントロダクションが外れている必要があるが、それは条件の変更ではなく原文の変更である。仮にそうなったとすれば、含まれないものが、成熟度モデルのキーエリアに照らして評価する案と並んで2つになり、1つ選べという形式も成り立たなくなる","2":"この案は、四半期中の主な出来事を時系列に並べること、各メンバーがどう感じたかを挙げてもらうこと、テスト進捗と欠陥検出のメトリクスを示すことの3つを述べており、どれもシラバスがデータの収集の中身として挙げているものである。感じ方を集める部分を落としても、主要な出来事のタイムラインとメトリクスの提示が同じステップの中身として残り、逆にメトリクスの提示を落としても、タイムラインという定性的なデータが残る。この案を含まれない側へ動かすにはデータの収集が挙げる中身を残らず落とすしかなく、そのときこの案は別の案に置き換わってしまう","4":"この案が書いているのは、ふりかえりプロセスの長所と改善点を識別するためにふりかえり自体をレビューすること、すなわちシラバスがふりかえりのクロージングの中身として挙げていることそのものである。次の四半期のふりかえりに反映するという結びも、継続的な改善はふりかえり自体にも適用されるという原文の記述の内側にある。これを含まれない側へ動かすにはステップの列挙からクロージングが外れている必要があり、それは条件の変更ではなく原文の変更で、そのとき含まれないものが2つになる"},"quote":"典型的なふりかえりは、以下のステップで構成される：イントロダクション：ふりかえりのゴールと課題を確認する。そして非難や判断を下すことなく問題を話し合うことができるよう、相互信頼の雰囲気を作る。データの収集：データは、イテレーションまたはプロジェクト中に起こったことに関して収集する。課題事項を特定し、各チームメンバーがそれらの課題事項についてどのように感じているかを列挙した、主要な出来事のタイムラインといった定性的なデータを収集することが可能である。さらに、メトリクスの定量的データを提示することもできる。…改善策の導出：収集したデータを分析して現状を把握し、改善のアイデアを生み出す。…改善アクションの決定：改善案を実施するためのアクションを導き出し、優先順位を付ける。改善計画と責任者を定義する。…ふりかえりのクロージング:この最後のステップでは、ふりかえりプロセスの長所と改善点を識別するために、ふりかえり自体をレビューする。…モデルベースの改善アプローチを用いると、プロジェクトやチームのテストアプローチを外部の最良の実践例と比較することで改善がもたらされる。分析的アプローチでは、プロジェクトやチーム自体のデータに基づいて問題を識別する。","ref":"1.5.4（典型的なふりかえりの5つのステップ＝イントロダクション／データの収集／改善策の導出／改善アクションの決定／クロージング）、1.5.3（モデルベースの改善アプローチと分析的アプローチ）、公式サンプル問題の解説（SET A 問22 d ＝ テストプロセスとツールを業界の最良の実践例に照らして評価することは典型的なふりかえりの一部ではなく、テストプロセス改善活動の側である）","misconception":"1.5 節の改善の手立ては互いに置き換えがきくと考え、外部の成熟度モデルに照らして自分たちのテストのしかたを評価することを、ふりかえりの構成に含まれる活動と数えてしまう。"},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","distractorIntent":["相互信頼の雰囲気づくりを会議の作法とみなし、ふりかえりの構成要素から外す（イントロダクションの中身であることを見落とす）","メンバーの感じ方のような定性的なデータの収集を、客観性を欠く進め方と考えて構成の外に置く（原文が定性と定量の両方を挙げていることを見落とす）","ふりかえり自体のレビューを入れ子の冗長な手続きとみなし、典型的な構成に入らない付け足しと考える"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-65"]}},{"id":"q-1.5.4-A-5","lo":"TM-1.5.4","cluster":"1.5.4-E","variant":1,"chapter":1,"section":"1.5","k":3,"points":2,"type":"single","minutes":3,"scenario":"あなたは、スポーツ用品の通信販売サイトの受注システムを開発するチームのテストマネージャーである。開発は2週間のイテレーションで進め、その終わりに開発担当・テスト担当・プロダクトオーナーがそろってふりかえりを行っている。この場はテストの課題に限らず、イテレーション中のやり方全般を扱うとチームで合意している。\n\n今回は、起きた出来事を順に並べ、イテレーションごとに自動で集計しているテスト進捗・欠陥検出・テスト有効性の数値もあわせて見て、なぜそうなったのかを掘り下げた。改善のアイデアは9件挙がった。自動テストの失敗時の扱いやテスト環境の準備手順といったテストの作業に関わるものと、受け入れ条件の伝え方やレビューの進め方といった開発担当とテスト担当の間のやり方に関わるものが混じっている。次のイテレーションから何を変えるかは、この場で決める。","question":"挙がった9件から、次のイテレーションの改善アクションを決めるやり方として最も適切なものはどれか。","choices":["9件を候補から1つも落とさず、重要度の上位から並べたうえで、9件とも次のイテレーションで取り組む改善と決める。1件ずつに進める担当と計画、効果を見るゴールと関連メトリクスを割り当て、決めた内容と取り上げた問題は次のふりかえりで見直せるよう記録に残す。","挙がった案をすべて候補に残したまま優先順位を付け、上位のいくつかだけを次のイテレーションで取り組む改善と決める。絞った案それぞれについて、何をどう変えるかの計画と進める担当を定め、取り上げた問題と決めたことを、次のふりかえりで見直せる形に書き残す。","挙がった案に優先順位を付け、上位のいくつかを次のイテレーションの改善と決める。ふりかえりはチーム全体で行う場なので、どれも全員の共通の課題として扱い、担当は1人に決めない。決めたことは全員が聞いたので書き残さず、次のイテレーションの初日に口頭で確かめ合う。","受け入れ条件の伝え方やレビューの進め方のように開発担当の作業に関わるものは、テストのふりかえりで決めることではないとして候補から外す。残るテストの作業に閉じたものに優先順位を付け、上位のいくつかについて担当と、次のふりかえりで見直すための記録まで決める。"],"answer":[1],"explanation":{"signals":"効くのは3つである。1つは、改善のアイデアが9件と多く挙がっていること。もう1つは、次のイテレーションから何を変えるかをこの場で決めると置かれていること。3つめは、この場がテストの課題に限らずイテレーション中のやり方全般を扱う場だとチームで合意していることである。9件のうちどれがいちばん困ったかという重さは、ここでの判断を分けない。分けるのは、次のイテレーションに載せる数と、絞った案について何をどう変えるかまで定めるか、決めたことをだれに預けてどこに残すか、そして候補をどこまで広げるかである。自動で集計しているテスト進捗・欠陥検出・テスト有効性の数値は、この場のデータを集める段階ですでに見終えたものであり、そこに何が出ていたかがどの案を採るかを動かすわけではない。効いてくるのは、次のイテレーションでこの数値が動いたときに、どの改善が効いたのかをたどれるかどうかの側である。","why":"取るべきは、挙がった案をすべて候補に残したまま優先順位を付け、上位のいくつかだけを次のイテレーションで取り組む改善と決めて、絞った案それぞれに計画と進める担当を定め、取り上げた問題と決めたことを次のふりかえりで見直せる形に書き残す案である。決め手は2つあり、シラバスの根拠はそれぞれ別の箇所にある。1つは載せる数を絞ることである。これは改善アクションの決定のステップにあり、シラバスはそこで「一度に多くの改善を実施することは、検証可能なステップでマネジメントすることが困難となる」と述べており、9件挙がったからといって9件とも次のイテレーションに載せる進め方は、この一文が困難だとしているやり方そのものであり、上位に絞る案に劣る。絞るのは手を抜くためではなく、次のイテレーションでテスト進捗・欠陥検出・テスト有効性の数値が動いたときに、どの改善が効いたのかをたどれるようにするためである。もう1つは、決めたことを計画と人と記録に降ろすことである。このうち改善計画と責任者については、同じ改善アクションの決定のステップが「改善計画と責任者を定義する」ことを求めている。記録については、5つのステップの列挙が終わったあとに置かれた、ふりかえりの結果の文書化についての記述が、アジャイルソフトウェア開発では「次のイテレーションで問題とその潜在的な影響をレビューできるように、問題とアクションも文書化する必要がある」と述べている。この案は改善計画、責任者、記録のいずれもそのまま満たしている。候補の側では、この場がテストの課題に限らずやり方全般を扱う場だとチームで合意しているため、受け入れ条件の伝え方やレビューの進め方のような開発担当とテスト担当の間のやり方も候補に残る。シラバスの定義も、ふりかえりをテストとテスト以外の課題の両方について改善を達成するための変更と行動を決めるミーティングだとしている。","distractors":["9件を重要度の上位から並べる点はシラバスが求める優先順位付けにあたる。1件ずつに進める担当と計画、効果を見るゴールと関連メトリクスを割り当てる点も、シラバスが改善アクションの決定のステップに挙げていることと合っており、決めた内容と取り上げた問題を次のふりかえりで見直せるよう記録に残す点は、アジャイルソフトウェア開発で問題とアクションを文書化することを求める記述と合っている。原文の求めのうち、この案が満たしていない項目は無い。上位に絞る案に劣るのは、次のイテレーションに載せる数においてである。シラバスは「一度に多くの改善を実施することは、検証可能なステップでマネジメントすることが困難となる」と述べており、9件を一度に載せる進め方は、この一文が困難だとしているやり方そのものである。9件を同時に走らせると、次のイテレーションで自動集計しているテスト進捗・欠陥検出・テスト有効性の数値が動いても、その動きをどの改善によるものとしてたどればよいかが分からない。シラバスはゴールと関連メトリクスを、識別した問題に対するアクションの影響を評価するために定義することができるとしているが、この案が1件ずつに割り当てた効果を見るゴールと関連メトリクスは、同時に載せる数を絞らないことで、どの改善の影響を評価しているのかを示せなくなる。挙がった案を1つも落とさないという網羅性の言い分は強く、順位付けも担当も記録もそろい、効果の見方まで決めているため、いちばん手厚い案に見える。",null,"この案が原文の求めのうち満たしていないのは、何をどう変えるかの改善計画、改善を進める担当、そして記録である。上位のいくつかに絞るところまではシラバスの求めに沿っているが、この案が決めているのはどれを次のイテレーションの改善にするかまでで、それぞれについて何をどう変えるかを定めず、担当を1人に決めず、決めたことを書き残しもしない。シラバスは改善アクションの決定で「改善計画と責任者を定義する」ことを求め、アジャイルソフトウェア開発では次のイテレーションで問題とその潜在的な影響をレビューできるように、問題とアクションも文書化する必要があるとしている。次のイテレーションの初日に口頭で確かめ合うとしているが、それでは何をどう変えるかも、進める人も、次のふりかえりで見直せる記録も残らない。ふりかえりはチーム全体で行うというシラバスの記述を、だれか1人に負わせないことの根拠として読み替えると、この案がいちばんチームらしく見える。そこで全体で行うと述べられているのは場の持ち方であって、改善を進める人を置かないことではない。","受け入れ条件の伝え方やレビューの進め方は、開発担当とテスト担当の間のやり方そのものであり、シラバスがふりかえりで取り上げるトピックとして挙げるプロセス、人、組織、コラボレーション、ツールのうち、プロセスとコラボレーションにあたる。シラバスはふりかえりを、テストとテスト以外の課題の両方について改善を達成するための変更と行動を決めるミーティングだとも定義している。この場は開発担当もプロダクトオーナーもそろって行い、テストの課題に限らずやり方全般を扱うとチームで合意した場なので、これらを候補から外す根拠はシラバスにもシナリオにもない。加えて、この案が原文の求めのうち満たしていないのは、何をどう変えるかの改善計画である。決めているのは担当と、次のふりかえりで見直すための記録までで、シラバスが改善アクションの決定で求める改善計画を定めていない。テストのふりかえりで決めることではないという線引きは、自分が決められる範囲で確実に回そうとする言い分として実務では通りやすい。"],"flip":[null,null,null,null],"flipNote":{"1":"外れているのが載せる数だけなので、件数を減らす条件を当てれば直るように見える。しかし件数を減らすと、この案は優先順位を付けて上位だけを次のイテレーションに載せる案と同じことを述べることになり、適切な案が2つ並んで1つに決まらない。シラバスが困難だとしているのは一度に多くの改善を実施することであって、9という数そのものではないため、数を動かす条件ではこの案だけを立たせられない。","3":"この案が満たしていないのは、何をどう変えるかの改善計画、改善を進める担当、そして記録である。改善計画と担当はシラバスの「改善計画と責任者を定義する」が求めており、記録はアジャイルソフトウェア開発で問題とアクションを次のイテレーションでレビューできるように文書化するという求めが要求している。どれか1つを補っても、残りが同じ理由でこの案を退けるので、動かせる1条件がない。挙げたものをすべて補えば、上位のいくつかに絞って計画と担当と記録まで決める案と同じことを述べることになり、適切な案が2つ並んで1つに決まらない","4":"この場で扱うのはテストの課題に限るとチームが置いていれば、テストに固有でない課題を候補から外す判断そのものはシラバスの立場と合う。シラバスはテストの課題に対処するために専用のふりかえりが必要となることがあると認めている。ただしこの案が外すと名指ししている受け入れ条件の伝え方とレビューの進め方は、開発担当とテスト担当の間のやり方であってテストの進め方と切り離せないため、限定を置いただけではこの2つを外す根拠にならない。外す対象がテストと関わらない課題に入れ替わって初めて成り立つ。しかも候補の側をそう入れ替えても、何をどう変えるかの改善計画を定めていない点が残るので、動かせる1条件がない。"},"quote":"ふりかえりとは、チームが自分たちのやり方とコラボレーションをレビューし、学んだ教訓（よい点 と悪い点の両方）を把握し、（テストとテスト以外の課題の両方について）改善を達成するための変更と 行動を決定するためのミーティングである。ふりかえりでは、プロセス、人、組織、コラボレーション、ツールなどのトピックを取り上げる。…改善アクションの決定：改善案を実施するためのアクションを導き出し、優先順位を付ける。改善計画と責任者を定義する。識別した問題に対するアクションの影響を評価するために、ゴールと関連メトリクスを定義することができる。一度に多くの改善を実施することは、検証可能なステップでマネジメントすることが困難となる。…アジャイルソフトウェア開発では、次のイテレーションで問題とその潜在的な影響をレビューできるように、問題とアクションも文書化する必要がある。","ref":"1.5.4（改善アクションの決定／アジャイルソフトウェア開発での文書化／ふりかえりの定義）","misconception":"ふりかえりで出た改善案は、多く走らせるほど、またチーム全員で抱えるほど前に進むと考え、一度に多くの改善を実施するとマネジメントが困難になるという一文と、改善計画と責任者を定義して問題とアクションを文書化するという出口を落としてしまう。"},"meta":{"concept":"ふりかえりの実装 — 何を議題にし、どう進め、何を出口にするか","distractorIntent":["挙がった改善案は多く走らせるほど改善が進むと考え、一度に多くの改善を実施すると検証可能なステップでマネジメントすることが困難になるという一文を見落とす（順位付け・担当・記録がそろっているため、数だけが外れていることに気づきにくい）","ふりかえりはチーム全体で行うという記述を、改善を進める人を置かないことの根拠として読み替え、出口を口頭の合意で止める","ふりかえりの範囲が限定されていないのに、テスト以外の作業に関わる改善候補を、テストの場で決めることではないとして外す"],"distractorTypes":["D5","D3","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/retrospectives.md","mistakePatterns":["MP-70","MP-110","MP-111"]}},{"id":"q-1.6.1-A-1","lo":"TM-1.6.1","cluster":"1.6.1-A","variant":1,"chapter":1,"section":"1.6","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは通信機器メーカーのテストマネージャーとして、新しいテスト管理ツールの導入を任されている。","question":"ツールの採用と展開の進め方として、よい実践例に**当てはまらない**ものはどれか。1つ選べ。","choices":["選定の基準と要件が妥当かをパイロットプロジェクトで確かめ、いまの進め方にど
