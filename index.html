   D  CONTROL 面 --warn-fill   9.28  枠 --warn 9.28            / 下 --ground     →  9.28:1  OK   例: .act-danger.is-armed
   D  GRAPHIC 面 --ink        11.48  枠 --surface 1.14         / 下 --sunk       → 11.48:1  OK   例: .forecast-pass
   D  GRAPHIC 面 --ink        13.07                           / 下 --surface    → 13.07:1  OK   例: .legend-line.is-pass
   D  CONTROL 面 --on-brand   14.05  枠 --on-brand 14.05       / 下 --brand      → 14.05:1  OK   例: .field-brand .appbar-act[aria-pr

   --- 非文字UI のうち、上の表に出ない線 ---
   --line-2  on --surface / --ground / --sunk   明 4.01 / 3.67 / 3.41   暗 4.56 / 5.24 / 4.01
*/

/* --------------------------------------------------------------- 1. reset */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body, h1, h2, h3, h4, p, figure, blockquote, dl, dd, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }

/* ------------------------------------------------------------- 2. tokens */
:root {
  color-scheme: light;

  /* -- 書体（外部読み込みなし。3OS の実装フォントだけで組む） --------- */
  --body: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
  --disp: var(--body);

  /* -- 面：ブランド（紺）。SPEC §6.0 実測 ---------------------------- */
  --brand:        #1c409a;
  --brand-deep:   #12285f;
  --brand-card:   #3053a4;
  --brand-card-2: #1c3a7a;

  /* -- 面：強調（青＝演習・模試・解説の地）。SPEC §6.0 実測 ---------- */
  --study:      #1c80e7;
  --study-deep: #0d63bd;   /* 青の面に小さい白文字を置くための濃色 */
  --arc:        #4aa2e0;   /* リングの弧 */

  /* -- 面の階層 1〜3 と境界線 ---------------------------------------- */
  --surface: #ffffff;   /* 1: カード */
  --ground:  #f2f5fa;   /* 2: 地 */
  --sunk:    #e8edf5;   /* 3: 沈めた面（シナリオ枠・引用・入れ子の背） */
  --line:    #d9e0ec;   /* 仕切り線（装飾） */
  --line-2:  #767f94;   /* 意味のある境界（選択肢・入力枠。非文字UI 3:1 を満たす） */

  /* -- 文字 ----------------------------------------------------------- */
  --ink:        #24243f;  /* 主 */
  --ink-2:      #4c5670;  /* 副 */
  --ink-3:      #5a6378;  /* 淡（それでも 4.5:1 以上） */
  --ink-on:     #ffffff;  /* 反転（濃い塗りの上） */
  --on-brand:   #ffffff;  /* 紺の色面の主文 */
  --on-brand-2: #cddaf5;  /* 紺の色面の副文 */
  --on-study:   #ffffff;  /* 青の色面の主文（大きい文字のみ） */

  /* -- 状態：正解 ----------------------------------------------------- */
  --ok:      #127c77;  /* 文字・線 */
  --ok-fill: #3ec1bd;  /* 塗り（実測のミント。この上には --ink を置く） */
  --ok-soft: #e8f7f6;  /* 淡面 */
  --ok-line: #8fdcd9;

  /* -- 状態：不正解 --------------------------------------------------- */
  --no:      #b01a9e;
  --no-fill: #de30c9;  /* 実測のマゼンタ。文字を載せない塗り専用 */
  --no-soft: #fcedfa;
  --no-line: #efa8e6;

  /* -- 状態：保留／あとで復習（実測の紫） ----------------------------- */
  --hold:      #6247c9;
  --hold-fill: #8e79eb;
  --hold-soft: #f0ecfd;
  --hold-line: #c3b7f4;

  /* -- 状態：注意（琥珀。破棄・時間切れ・未書き出し） ------------------ */
  --warn:      #8a5a00;
  --warn-fill: #8a5a00;
  --warn-soft: #fdf2dc;
  --warn-line: #e0c48a;

  /* -- 操作（主ボタン・リンク・選択中） -------------------------------- */
  --act:      #0d63bd;
  --act-soft: #e7f0fc;
  --act-line: #4a80bd;   /* 枠だけで輪郭を作る操作子（.act-sub）。面が地と1.09:1 しか
                            違わないので、非文字UI 3:1（WCAG 1.4.11）はこの線が担う */

  /* -- 色面（紺）の上に浮かせる面。明暗で「明るい／暗い」が入れ替わらないこと --
     明色は --surface（白）で足りるが、暗色の --surface は画面でいちばん暗い色なので、
     そのまま使うと主ボタンと選択中チップが紺の色面に沈んで「無効」に見える（1.13:1）。
     面の役割を独立したトークンに切り出し、暗色では明るい側の色を入れる */
  --raise:    #ffffff;
  --on-raise: #0d63bd;

  /* -- 誤答型：4系統 × 4形。詳細は先頭コメント ------------------------ */
  --dt-a: #1c409a;  --dt-a-soft: #e9eefa;   /* A 読み取り   D2 D12 D11 D9 */
  --dt-b: #0d63bd;  --dt-b-soft: #e7f0fc;   /* B 取り違え   D1 D8 D10 D14 */
  --dt-c: #6247c9;  --dt-c-soft: #f0ecfd;   /* C 判断の歪み D4 D7 D13 D5 */
  --dt-d: #8a5a00;  --dt-d-soft: #fdf2dc;   /* D 知識のズレ D3 D6 */
  --dt-none: var(--ink-3);                   /* 未出題の型は色で語らずラベルで示す */

  /* -- 角丸：3種だけ（SPEC §6.0） -------------------------------------- */
  --r-card: 12px;
  --r-ctl:  10px;
  --r-chip: 999px;

  /* -- 余白：5段だけ（4の倍数。SPEC §6.0） ----------------------------- */
  --s1:  4px;
  --s2:  8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;

  /* -- 文字：5段だけ（SPEC §6.0） -------------------------------------- */
  --fs-1: 22px;  /* 数字・画面見出し */
  --fs-2: 17px;  /* 小見出し・設問 */
  --fs-3: 15px;  /* 本文 */
  --fs-4: 13px;  /* 補助・表・メタ */
  --fs-5: 11px;  /* ラベル・凡例 */
  --lh:       1.7;   /* 本文・選択肢・表・ラベル */
  --lh-tight: 1.35;  /* 見出し・数字 */
  --lh-long:  1.85;  /* 連続した読み物だけ（最長667字のシナリオ・解説・引用・折りたたみ本文）。
                        ここが3段目。4段目は作らない */

  /* -- 影：2段だけ（SPEC §6.0） ---------------------------------------- */
  --sh-1: 0 1px 2px rgba(18, 40, 95, .08), 0 1px 1px rgba(18, 40, 95, .04);
  --sh-2: 0 6px 16px rgba(18, 40, 95, .14), 0 2px 4px rgba(18, 40, 95, .08);

  /* -- 動き（SPEC §6.0。これ以上は付けない） --------------------------- */
  --t-screen: 200ms;
  --t-mark:   150ms;
  --ease: cubic-bezier(.2, .0, .2, 1);

  /* -- 触る的（SPEC §6.0。44 は下限、実際はこれより大きく取る） -------- */
  /* 44px（WCAG 2.5.5 の下限）は使わない。SPEC §6.0 が理由つきで48pxを要求している
     ——「揺れる電車で片手。44px では足りない」。§6.2 の「選択肢は最小高44px」も
     下限の言い換えで、実際の選択肢は --tap-choice 56px 以上になる */
  --tap-btn:    48px;
  --tap-choice: 56px;
  --tap-hero:   56px;   /* ホームの主ボタン。72px は「下限」ではなく「主役だから大きくした」
                           値だったが、390px の実機で縦に場所を取りすぎていた。
                           主役であることは、高さではなく 面（色面の中で唯一の白い塊）と
                           文字の大きさ（--fs-1）で作る。--tap-choice と同値だが役割が違う
                           ので別のトークンのままにする（片方だけ動かせる余地を残す）。 */

  /* -- 線幅と焦点の輪（余白の5段とは別の軸。ここ以外に生の値を書かない） --- */
  --hair:    1px;   /* 仕切り・枠 */
  --hair-2:  2px;   /* 選択中・正誤の枠、グラフの線 */
  --hair-3:  4px;   /* 帯の左の縦線 */
  --hatch-on:  2px; /* 「在庫なし」の斜線のピッチ */
  --hatch-off: 5px;
  --focus-w: 3px;   /* :focus-visible の輪 */

  /* -- 図形の実寸（文字サイズでも余白でもないもの） ----------------------- */
  --tile:       28px;   /* 選択肢の記号タイル */
  --dot:        12px;   /* 誤答型の形 */
  --key:        14px;   /* 凡例の見本 */
  --swatch-w:   22px;   /* 学習目標の状態の見本（横長） */
  --swatch-h:   12px;
  --box:        20px;   /* チェック・ラジオ */
  --box-lg:     24px;
  --ring-d:    112px;   /* 今週の学習のリング */
  --ring-t:     11px;   /* 同・太さ */
  --score-d:   128px;   /* 結果のリング（SVG） */
  --score-t:    12px;
  --track-h:    10px;   /* 横棒の器 */
  --track-h-lg: 14px;   /* 予想得点のバー */
  --progress-h:  4px;   /* ヘッダ直下の進捗 */
  --week-h:     72px;   /* 曜日別の棒の高さ */
  --chart-h:   176px;   /* 推移グラフの器の高さ */
  --weekbar-w:  18px;

  /* -- 器 -------------------------------------------------------------- */
  --wrap:      46rem;
  --gutter:    var(--s4);
  --tabbar-h:  56px;
  --appbar-h:  52px;

  /* -- セーフエリア ------------------------------------------------------ */
  /* 半透明の面（ベタ面に彫る溝・ダイアログの覆い）。生の rgba を散らさない */
  --scrim:        rgba(18, 40, 95, .50);    /* ダイアログの背後 */
  --on-brand-dim: rgba(255, 255, 255, .18); /* 紺の色面に彫る溝 */
  --on-study-dim: rgba(255, 255, 255, .30); /* 青の色面に彫る溝 */

  --safe-t: env(safe-area-inset-top,    0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left,   0px);
  --safe-r: env(safe-area-inset-right,  0px);

  /* -- 下部に固定される高さの合計（画面の padding-bottom に使う） -------- */
  /* 下に固定されるものの合計高さ。.app.tabs-off で下タブぶんが抜ける。
     .screen の padding-bottom と .dock の bottom は必ずこの2つ経由で書く */
  --chrome-b:    calc(var(--tabbar-h) + var(--safe-b));  /* 画面が下に空けるべき高さ */
  --dock-bottom: calc(var(--tabbar-h) + var(--safe-b));  /* .dock を浮かせる位置 */
  --dock-safe:   0px;                                    /* .dock 自身が足すセーフエリア */
  --dock-h:      88px;  /* 主ボタン48 + 補助行 + 余白。画面ごとに .screen へ上書きしてよい */
}

/* -- 暗色。SPEC §6.0 の「暗色」列と §6.7 のテーマ設定に対応 ------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #12285f; --brand-deep: #0c1c45; --brand-card: #1c3a7a; --brand-card-2: #132a5c;
    --study: #1c80e7; --study-deep: #0d63bd; --arc: #4aa2e0;
    --surface: #1a2235; --ground: #0f1524; --sunk: #222c42;
    --line: #2a3450; --line-2: #7c8aa6;
    --ink: #e6e9f2; --ink-2: #b7c0d4; --ink-3: #9aa5bd; --ink-on: #0f1524;
    --on-brand: #ffffff; --on-brand-2: #b9c9ee; --on-study: #ffffff;
    --ok: #4fd3ce; --ok-fill: #3ec1bd; --ok-soft: #123033; --ok-line: #2c6b6a;
    --no: #f07ae0; --no-fill: #de30c9; --no-soft: #3a1436; --no-line: #7e3d75;
    --hold: #a897f5; --hold-fill: #8e79eb; --hold-soft: #231f45; --hold-line: #55499a;
    --warn: #e0b25f; --warn-fill: #e0b25f; --warn-soft: #332612; --warn-line: #6f5a2c;
    --act: #5fb0f5; --act-soft: #102a3f; --act-line: #548cc4;
    --raise: #5fb0f5; --on-raise: #0f1524;
    --dt-a: #8fb4ff; --dt-a-soft: #16223d;
    --dt-b: #5fb0f5; --dt-b-soft: #102a3f;
    --dt-c: #a897f5; --dt-c-soft: #231f45;
    --dt-d: #e0b25f; --dt-d-soft: #332612;
    --scrim: rgba(0, 0, 0, .64);
    --on-brand-dim: rgba(255, 255, 255, .14);
    --on-study-dim: rgba(255, 255, 255, .26);
    --sh-1: 0 1px 2px rgba(0, 0, 0, .45);
    --sh-2: 0 6px 16px rgba(0, 0, 0, .55), 0 2px 4px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #12285f; --brand-deep: #0c1c45; --brand-card: #1c3a7a; --brand-card-2: #132a5c;
  --study: #1c80e7; --study-deep: #0d63bd; --arc: #4aa2e0;
  --surface: #1a2235; --ground: #0f1524; --sunk: #222c42;
  --line: #2a3450; --line-2: #7c8aa6;
  --ink: #e6e9f2; --ink-2: #b7c0d4; --ink-3: #9aa5bd; --ink-on: #0f1524;
  --on-brand: #ffffff; --on-brand-2: #b9c9ee; --on-study: #ffffff;
  --ok: #4fd3ce; --ok-fill: #3ec1bd; --ok-soft: #123033; --ok-line: #2c6b6a;
  --no: #f07ae0; --no-fill: #de30c9; --no-soft: #3a1436; --no-line: #7e3d75;
  --hold: #a897f5; --hold-fill: #8e79eb; --hold-soft: #231f45; --hold-line: #55499a;
  --warn: #e0b25f; --warn-fill: #e0b25f; --warn-soft: #332612; --warn-line: #6f5a2c;
  --act: #5fb0f5; --act-soft: #102a3f; --act-line: #548cc4;
  --raise: #5fb0f5; --on-raise: #0f1524;
  --dt-a: #8fb4ff; --dt-a-soft: #16223d;
  --dt-b: #5fb0f5; --dt-b-soft: #102a3f;
  --dt-c: #a897f5; --dt-c-soft: #231f45;
  --dt-d: #e0b25f; --dt-d-soft: #332612;
  --scrim: rgba(0, 0, 0, .64);
  --on-brand-dim: rgba(255, 255, 255, .14);
  --on-study-dim: rgba(255, 255, 255, .26);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .45);
  --sh-2: 0 6px 16px rgba(0, 0, 0, .55), 0 2px 4px rgba(0, 0, 0, .35);
}

/* --------------------------------------------------------------- 3. base */
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--fs-3);
  line-height: var(--lh);
  overflow-x: hidden;                  /* 門 E-T2 */
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
}
h1, h2, h3, h4 { line-height: var(--lh-tight); font-weight: 700; text-wrap: balance; }
h1 { font-size: var(--fs-1); }
h2 { font-size: var(--fs-2); }
h3 { font-size: var(--fs-3); }
h4 { font-size: var(--fs-4); }
a { color: var(--act); }
:focus-visible { outline: var(--focus-w) solid var(--act); outline-offset: var(--hair-2); border-radius: var(--s1); }
/* overflow で切る器の中では、焦点の輪を要素の内側に描く。
   .segbar（横スクロール）の padding は --s1（4px）、.scenario / .fold は overflow:clip で、
   どれも輪の 5px（--hair-2 の離れ ＋ --focus-w の太さ）には足りない。
   器を太らせると帯や折りたたみが縦に伸びるので、輪の側を内側へ寄せる。 */
.segbar .seg:focus-visible,
.scenario > summary:focus-visible,
.fold > summary:focus-visible { outline-offset: calc(var(--focus-w) * -1); }
::selection { background: var(--act-soft); color: var(--ink); }

.sr-only {
  position: absolute; width: var(--hair); height: var(--hair); padding: 0; margin: calc(var(--hair) * -1);
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* -------------------------------------------------------------- 4. shell */
.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
/* 解く画面・模試画面・解説画面は下タブを隠してよい（667px の端末で固定領域が
   可視高の24%を占めると最長667字のシナリオが読めない）。
   隠している間の出口はヘッダの「中断／戻る」が担う（袋小路を作らない）。
   隠すのはタブだけで、.dock（解答する／あとで復習する）は残す。
   ui.js は器（.app）に .tabs-off を付け外しするだけでよい。
   .tabbar と .dock は必ず .app の中に置くこと（下の :has() は念のための保険）。 */
.app.tabs-off .tabbar { display: none; }   /* 直下でなくても効かせる */
.app.tabs-off {
  --chrome-b:    var(--safe-b);   /* 下タブぶんを抜く */
  --dock-bottom: 0;               /* ドックが最下段に降りる（値ではなくゼロ） */
  --dock-safe:   var(--safe-b);   /* 降りたぶんのセーフエリアはドックが持つ */
}
:root:has(.app.tabs-off) {
  --chrome-b:    var(--safe-b);
  --dock-bottom: 0;
  --dock-safe:   var(--safe-b);
}

/* 画面の器。ui.js は section[data-screen] に .screen を付け、el.hidden で1枚だけ出す */
.screen {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;                  /* 門 E-T2 */
  padding-bottom: calc(var(--chrome-b) + var(--s5));
}
.screen.has-dock { padding-bottom: calc(var(--chrome-b) + var(--dock-h) + var(--s5)); }

/* 画面ごとの地（SPEC §6.0「画面ごとの地」） */
.field-plain { background: var(--ground); }
.field-brand { background: var(--ground); }                    /* 上部だけ .brandpanel が紺 */
.field-study { background: var(--study); }                     /* 演習・模試・解答解説 */
.field-study .card { box-shadow: var(--sh-2); }                /* 青の上で白カードを浮かせる */

/* 本文の列。片手スマホ基準、375px で 343px = 15px 本文で約22字/行 */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* ヘッダ */
.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: var(--appbar-h);
  padding-top: var(--safe-t);
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding-inline: var(--s2);
  background: var(--surface);
  border-bottom: var(--hair) solid var(--line);
  color: var(--ink);
}
.field-brand .appbar { background: var(--brand); color: var(--on-brand); border-bottom-color: transparent; }
.field-study .appbar { background: var(--study-deep); color: var(--on-study); border-bottom-color: transparent; }
.appbar-back, .appbar-act {
  flex: 0 0 auto;
  min-width: var(--tap-btn);
  min-height: var(--tap-btn);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-ctl);
  color: inherit;
  font-size: var(--fs-2);
}
.appbar-act {
  margin-left: auto;
  border: var(--hair) solid currentColor;   /* 押せるものに見えること（題字の一部に見えていた） */
  border-radius: var(--r-chip);
  padding-inline: var(--s3);
  font-size: var(--fs-4);
  font-weight: 700;
  gap: var(--s2);
}
/* 入・切のある操作子。記号（□／■）で状態を示すので、色を落としても入切が分かる */
.appbar-act[aria-pressed]::before { content: "□"; font-size: var(--fs-3); line-height: 1; }
.appbar-act[aria-pressed="true"]::before { content: "■"; }
.appbar-act[aria-pressed="true"] {
  background: var(--act);
  color: var(--ink-on);
  border-color: var(--act);
}
/* 色面（青・紺）の上では --act が同系で沈む（機械の検算で 1.57:1 と出た）。
   面を白にして、その色面の濃い色を文字に載せる */
.field-study .appbar-act[aria-pressed="true"] {
  background: var(--on-study);
  color: var(--study-deep);
  border-color: var(--on-study);
}
.field-brand .appbar-act[aria-pressed="true"] {
  background: var(--on-brand);
  color: var(--brand);
  border-color: var(--on-brand);
}
.appbar-title {
  font-size: var(--fs-2);
  font-weight: 700;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.appbar-meta {
  margin-left: auto;
  font-size: var(--fs-4);
  font-variant-numeric: tabular-nums;
  opacity: .9;
  white-space: nowrap;
}
.appbar-act + .appbar-meta { margin-left: 0; }

/* 進捗バー（ヘッダ直下） */
.progress {
  --progress: 0%;                      /* ui.js が上書きする */
  height: var(--progress-h);
  background: var(--line);
  overflow: hidden;
}
.field-study .progress { background: var(--on-study-dim); }
.progress-fill {
  height: 100%;
  width: var(--progress, 0%);
  background: var(--act);
  transition: width var(--t-screen) var(--ease);
}
.field-study .progress-fill { background: var(--on-study); }

/* 下タブ（ホーム / 記録 / 設定 の3つだけ。常時固定。門 D-T8） */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  padding-inline: var(--safe-l) var(--safe-r);
  background: var(--surface);
  border-top: var(--hair) solid var(--line);
  box-shadow: var(--sh-2);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--hair-2);
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  color: var(--ink-3);
  font-size: var(--fs-5);
  font-weight: 600;
  line-height: var(--lh-tight);
}
.tab-icon { font-size: var(--fs-2); line-height: var(--lh-tight); }
.tab.is-current { color: var(--act); }
.tab.is-current .tab-icon { transform: translateY(calc(var(--hair) * -1)); }

/* 下部固定バー（解く・読む画面の主ボタン。本文が伸びても位置が動かない） */
.dock {
  position: fixed;
  left: 0; right: 0;
  bottom: var(--dock-bottom);
  z-index: 30;
  padding-block: var(--s2) calc(var(--s2) + var(--dock-safe));
  padding-inline: calc(var(--gutter) + var(--safe-l)) calc(var(--gutter) + var(--safe-r));
  background: var(--surface);
  border-top: var(--hair) solid var(--line);
  box-shadow: var(--sh-2);
}
.dock-inner {
  max-width: var(--wrap);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.dock-row { display: flex; gap: var(--s2); align-items: center; }
.dock-row > .act { flex: 1 1 0; }
.dock-hint {
  font-size: var(--fs-4);
  color: var(--ink-2);
  text-align: center;
  min-height: 1.3em;
}

/* ---------------------------------------------------------- 5. primitives */
.card {
  background: var(--surface);
  border: var(--hair) solid var(--line);
  border-radius: var(--r-card);
  box-shadow: var(--sh-1);
  padding: var(--s4);
}
.card.is-raised { box-shadow: var(--sh-2); }
.card + .card { margin-top: var(--s3); }
.card-title {
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: .04em;
  margin-bottom: var(--s2);
}
.section { margin-top: var(--s5); }
.section-title {
  font-size: var(--fs-2);
  font-weight: 700;
  margin-bottom: var(--s3);
}

/* ボタン */
.act {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: var(--tap-btn);
  padding: var(--s3) var(--s4);
  border-radius: var(--r-ctl);
  font-size: var(--fs-3);
  font-weight: 700;
  line-height: var(--lh-tight);
  text-align: center;
  text-decoration: none;
  border: var(--hair) solid transparent;
  transition: background var(--t-mark) var(--ease), border-color var(--t-mark) var(--ease);
}
.act-main {
  width: 100%;
  background: var(--act);
  color: var(--ink-on);
  box-shadow: var(--sh-1);
}
.act-hero {
  width: 100%;
  min-height: var(--tap-hero);
  font-size: var(--fs-1);   /* 高さを詰めたぶん、文字で主役を作る */
  background: var(--act);
  color: var(--ink-on);
  border-radius: var(--r-ctl);
  box-shadow: var(--sh-2);
}
.field-brand .act-hero { background: var(--raise); color: var(--on-raise); }
/* 紺の色面の上の副ボタン（「新しく 続ける（5問）」）。既定のままだと壊れる：
   明色では面が --surface（白）で、主ボタンの --raise（白）と**同じ白い塊**になり主従が消える。
   暗色では面が画面でいちばん暗い色になり、紺の面に対して 1.13:1 で沈む（A-4 と同じ壊れ方）。
   すぐ上に並ぶチップと同じ組み方にする —— 主は「塗り」、副は「輪郭」。
   利用者は選択中／非選択のチップで同じ対比を先に見ているので、学び直す必要がない。
   面 1.29 / 1.30 は 3:1 に届かないが、輪郭が 6.64 / 8.47 で担保する（WCAG 1.4.11）。 */
.field-brand .act-sub {
  background: var(--brand-card);
  border-color: var(--on-brand-2);
  color: var(--on-brand);
}
.act-sub {
  background: var(--surface);
  color: var(--act);
  border-color: var(--act-line);
}
.act-quiet {
  background: transparent;
  color: var(--ink-2);
  border-color: var(--line-2);
}
/* 取り返しのつかない操作（全消去・置き換え・破棄）。
   SPEC §6.0 が名指しで禁じているとおり、マゼンタ（--no）を兼用しない。
   兼用すると「間違い」と「危険」が同じ色になり、不正解の画面を見慣れた目に
   危険が埋もれる。危険は琥珀（--warn）で、輪郭 → 塗り の2段で強まる */
.act-danger {
  background: transparent;
  color: var(--warn);
  border-color: var(--warn);
  font-weight: 700;
}
.act-danger.is-armed { background: var(--warn-fill); color: var(--ink-on); border-color: var(--warn); }
/* 破棄・時間切れ提出など、取り返しの重い操作。赤ではなく琥珀（消去とは別の重さ） */
.act-warn { background: var(--warn-fill); color: var(--ink-on); border-color: var(--warn); }
.act:disabled, .act[aria-disabled="true"] {
  background: var(--sunk);
  color: var(--ink-3);
  border-color: var(--line);
  box-shadow: none;
  cursor: not-allowed;
  opacity: 1;                          /* 薄くして読めなくしない */
}
.act-note { font-size: var(--fs-5); font-weight: 400; opacity: .85; }

/* チップ（問題数 5/10/15/20/25、絞り込み） */
.chipset {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}
.chip {
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  padding: var(--s2) var(--s4);
  border-radius: var(--r-chip);
  border: var(--hair) solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-3);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-mark) var(--ease), color var(--t-mark) var(--ease);
}
.chip.is-on { background: var(--act); border-color: var(--act); color: var(--ink-on); }
.chip:disabled {
  background: var(--sunk);
  border-color: var(--line);
  color: var(--ink-3);
  cursor: not-allowed;
  text-decoration: line-through;       /* 在庫を超える数は形でも分かる */
}
.field-brand .chipset .chip { background: var(--brand-card); border-color: var(--on-brand-2); color: var(--on-brand); }
.field-brand .chipset .chip.is-on { background: var(--raise); border-color: var(--raise); color: var(--on-raise); }
.field-brand .chipset .chip:disabled { background: var(--brand-deep); border-color: var(--brand-card); color: var(--on-brand-2); }

/* 小さいラベル（K レベル・配点・件数） */
.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  padding: var(--hair-2) var(--s2);
  border-radius: var(--r-chip);
  border: var(--hair) solid currentColor;
  font-size: var(--fs-5);
  font-weight: 700;
  letter-spacing: .04em;
  white-space: nowrap;
  color: var(--ink-2);
}
.pill.is-k2 { color: var(--ok); }
.pill.is-k3 { color: var(--act); }
.pill.is-k4 { color: var(--hold); }
.pill.is-ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }
.pill.is-no { color: var(--no); background: var(--no-soft); border-color: var(--no-line); }
.pill.is-hold { color: var(--hold); background: var(--hold-soft); border-color: var(--hold-line); }
.pill.is-warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }

/* 数字を大きく、単位を小さく（SPEC §6.0「数値の見せ方」） */
.big {
  font-family: var(--disp);
  font-size: var(--fs-1);
  font-weight: 700;
  line-height: var(--lh-tight);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.unit {
  font-size: var(--fs-4);
  font-weight: 700;
  margin-inline-start: var(--hair-2);
  opacity: .85;
}

/* 淡い色の帯で全幅に区切る見出し（SPEC §6.0「帯の見出し」）。カードを入れ子にしない */
.band {
  margin: var(--s5) calc(var(--gutter) * -1) var(--s3);
  padding: var(--s2) var(--gutter);
  background: var(--sunk);
  border-left: var(--hair-3) solid var(--line-2);
  font-size: var(--fs-4);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink-2);
}
.band.is-mine   { background: var(--act-soft);  border-left-color: var(--act);  color: var(--act); }
.band.is-wrong  { background: var(--no-soft);   border-left-color: var(--no);   color: var(--no); }
.band.is-answer { background: var(--ok-soft);   border-left-color: var(--ok);   color: var(--ok); }
.band.is-hold   { background: var(--hold-soft); border-left-color: var(--hold); color: var(--hold); }
.band.is-warn   { background: var(--warn-soft); border-left-color: var(--warn); color: var(--warn); }

/* 問題データ由来の強調（strong.emph）。53問中11問、すべて否定形の設問で
   「適切で**ない**もの」を囲む。唯一の否定の手がかりなので、見落とされたら
   このアプリ自身が教えている D12「否定形設問の正メンバー」を自分で誘発する。

   .qtext は既に font-weight:700 なので、太字は手がかりにならない。
   蛍光ペンと同じ形 —— 淡い面＋下線＋余白 —— を当てる。手がかりが3つあり、
   下線という「形」が色と独立に効くので、色だけに頼っていない（SPEC §6.6）。
   面は自分で持つので、地が --surface / --sunk / --ok-soft / --no-soft / --act-soft の
   どれであっても本文の比は変わらない（--ink on --warn-soft ＝ 明 13.52 / 暗 12.13）。
   下線の --warn は、その5つの地すべてに対して 5.0:1 以上ある（面が地に埋もれても線は残る）。
   色は新設せず 注意（琥珀）を借りる —— 「ここを読み落とすな」は注意そのものなので */
.emph {
  background: var(--warn-soft);
  color: var(--ink);
  font-weight: 700;
  padding-inline: var(--s1);
  border-bottom: var(--hair-2) solid var(--warn);
  border-radius: var(--hair-3) var(--hair-3) 0 0;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;   /* 行をまたいでも面と下線が続く */
}

/* 補注・限界の但し書き（「合格可能性は出さない」「初見31問に基づく」等） */
.note {
  font-size: var(--fs-4);
  color: var(--ink-2);
  line-height: var(--lh);
}
.caveat {
  margin-top: var(--s2);
  padding: var(--s2) var(--s3);
  border-left: var(--hair-3) solid var(--warn-line);
  background: var(--warn-soft);
  color: var(--warn);
  font-size: var(--fs-4);
  border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
}

/* 凡例（すべての図に置く。SPEC §6.6「例外なし」） */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s4);
  margin-top: var(--s3);
  font-size: var(--fs-5);
  color: var(--ink-2);
}
.legend-item { display: inline-flex; align-items: center; gap: var(--s1); }
.legend-key {
  flex: 0 0 auto;
  width: var(--key); height: var(--key);
  border-radius: var(--hair-3);
  border: var(--hair) solid var(--line-2);
  background: var(--ink-3);
}
.legend-key.is-ok   { background: var(--ok);        border-color: var(--ok); }
.legend-key.is-no   { background: var(--no-fill);   border-color: var(--no); }
.legend-key.is-hold { background: var(--hold-fill); border-color: var(--hold); }
.legend-key.is-none { background: transparent; }
.legend-key.is-thin { background: transparent; border-style: dashed; }
/* 計測できず。行の見本（.lo-swatch）と同じ形にする。凡例が本体と違う形なら凡例ではない */
.legend-key.is-excluded {
  background: linear-gradient(var(--line-2), var(--line-2)) no-repeat center / 100% var(--hair-2);
}
.legend-key.is-measured { background: var(--act); border-color: var(--act); }
.legend-key.is-nostock {
  background: repeating-linear-gradient(45deg,
    var(--line-2) 0 var(--hatch-on), transparent var(--hatch-on) var(--hatch-off));
}

/* 図の「線」の凡例。3種を色と線種の両方で分ける（SPEC §6.6「色だけで区別しない」）。
   --chart-line / --chart-passline とクラス名の対応をそろえてあるので、
   ui.js は .legend-line / .legend-line.is-memo / .legend-line.is-pass を並べるだけでよい。
     無印      実線・--act     初見ベース（実力）
     .is-memo  点線・--ink-3   全試行ベース（覚え込み）
     .is-pass  破線・--ink     合格ライン（価値を持たない色。意味は文字が担う）
   この2本の開きが「暗記による嵩上げの量」そのものなので、取り違えられない形にする。 */
.legend-line {
  flex: 0 0 auto;
  display: inline-block;
  width: calc(var(--key) * 2);
  height: 0;
  border-top: var(--hair-2) solid var(--act);
}
.legend-line.is-memo { border-top-style: dotted; border-top-color: var(--ink-3); }
.legend-line.is-pass { border-top-style: dashed; border-top-color: var(--ink); }
/* ui.js が小さな inline SVG（.chart-line / .chart-passline）で凡例を描く経路も
   そのまま動くようにしておく。線の見た目の定義は §11 の .chart-* が持つ */
.legend svg { flex: 0 0 auto; overflow: visible; }

/* 折りたたみ */
.fold {
  margin-top: var(--s3);
  border: var(--hair) solid var(--line);
  border-radius: var(--r-ctl);
  background: var(--surface);
  overflow: clip;
  overflow-clip-margin: var(--focus-w);   /* summary の焦点の輪を切り落とさない */
}
.fold > summary {
  min-height: var(--tap-btn);
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--act);
  cursor: pointer;
  list-style: none;
  background: var(--sunk);
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before {
  content: "▸";
  transition: transform var(--t-mark) var(--ease);
}
.fold[open] > summary::before { transform: rotate(90deg); }
.fold-body { padding: var(--s3); font-size: var(--fs-4); line-height: var(--lh-long); color: var(--ink-2); }

/* 行リンク（右に ›） */
.rowlink {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: var(--tap-choice);
  padding: var(--s3) var(--s4);
  background: var(--surface);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  color: var(--ink);
  text-align: start;
  font-size: var(--fs-3);
}
.rowlink + .rowlink { margin-top: var(--s2); }
.rowlink::after {
  content: "›";
  margin-inline-start: auto;
  color: var(--ink-3);
  font-size: var(--fs-2);
  flex: 0 0 auto;
}
.rowlink-main { min-width: 0; flex: 1 1 auto; }
.rowlink-name { font-weight: 700; overflow-wrap: break-word; }
/* 右端のメタ（`未着手 · 2問`）。縮ませると1文字ずつ縦に割れるので、
   ここで潰れない性質を持たせる（呼ぶ側が .unit-stock を重ね掛けしなくて済む） */
.rowlink-meta { flex: 0 0 auto; white-space: nowrap; font-size: var(--fs-4); color: var(--ink-2); }
.rowlink:disabled, .rowlink[aria-disabled="true"] {
  background: var(--sunk);
  color: var(--ink-3);
  cursor: not-allowed;
}
.rowlink:disabled::after, .rowlink[aria-disabled="true"]::after { content: ""; }

/* 空の状態（在庫なし・まだ記録なし） */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s2);
  padding: var(--s5) var(--s4);
  text-align: center;
  color: var(--ink-2);
  background: var(--sunk);
  border: var(--hair) dashed var(--line-2);
  border-radius: var(--r-card);
}
.empty-icon { font-size: var(--fs-1); line-height: var(--lh-tight); color: var(--ink-3); }
.empty-msg { font-size: var(--fs-3); font-weight: 700; color: var(--ink); }
.empty-sub { font-size: var(--fs-4); }

/* エラー表示 */
.error {
  padding: var(--s3) var(--s4);
  border-radius: var(--r-card);
  background: var(--no-soft);
  border: var(--hair) solid var(--no-line);
  border-left: var(--hair-3) solid var(--no);
  color: var(--no);
}
.error-title { font-size: var(--fs-3); font-weight: 700; }
.error-detail {
  margin-top: var(--s1);
  font-size: var(--fs-4);
  color: var(--ink-2);
  font-family: var(--mono);
  overflow-wrap: break-word;
}
.notice {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-ctl);
  background: var(--warn-soft);
  border: var(--hair) solid var(--warn-line);
  color: var(--warn);
  font-size: var(--fs-4);
}
.notice .act { flex: 0 0 auto; margin-inline-start: auto; min-height: var(--tap-btn); min-width: var(--tap-btn); white-space: nowrap; padding-inline: var(--s3); }

/* シート・確認ダイアログ */
.sheet {
  width: min(100% - var(--s5), 32rem);
  display: flex;              /* 頭・本文・ボタンを縦に積み、ボタンを外へ押し出させない */
  flex-direction: column;
  max-height: 82vh;           /* dvh が効かない端末の控え。この行を消さないこと */
  max-height: 82dvh;
  padding: 0;
  border: 0;
  border-radius: var(--r-card);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh-2);
  overflow: hidden;
}
.sheet::backdrop { background: var(--scrim); }
.sheet-head {
  padding: var(--s4);
  border-bottom: var(--hair) solid var(--line);
  font-size: var(--fs-2);
  font-weight: 700;
}
.sheet-head, .sheet-acts { flex: 0 0 auto; }
.sheet-body {
  flex: 1 1 auto;
  padding: var(--s4);
  overflow-y: auto;
  max-height: 55vh;           /* dvh が効かない端末の控え。この行を消さないこと */
  max-height: 55dvh;
}
.sheet-acts {
  display: flex;
  gap: var(--s2);
  padding: var(--s3) var(--s4) calc(var(--s4) + var(--safe-b));
  border-top: var(--hair) solid var(--line);
}
.sheet-acts > .act { flex: 1 1 0; }

/* ----------------------------------------------------------- 6. ホーム §6.1 */
.brandpanel {
  background: var(--brand);
  color: var(--on-brand);
  padding: var(--s4) 0 var(--s5);
  border-radius: 0 0 var(--r-card) var(--r-card);
}
.brandpanel .card-title,
.brandpanel .note { color: var(--on-brand-2); }
/* 紺の色面の中に置く入れ子の枠。カードを重ねず、面の濃さだけで段を作る */
.brandpanel-box {
  background: var(--brand-card-2);
  border-radius: var(--r-card);
  padding: var(--s4);
  color: var(--on-brand);
}

/* 今週の学習のリング。--ring-pct を ui.js が 0〜100 で入れる */
.ring {
  --ring-pct: 0;
  position: relative;
  width: var(--ring-d); height: var(--ring-d);
  flex: 0 0 auto;
  border-radius: var(--r-chip);   /* 正方形なので真円になる */
  background:
    conic-gradient(var(--arc) calc(var(--ring-pct) * 1%), var(--on-brand-dim) 0);
  display: grid;
  place-items: center;
}
.ring::after {
  content: "";
  position: absolute;
  inset: var(--ring-t);
  border-radius: var(--r-chip);   /* 正方形なので真円になる */
  background: var(--brand);
}
.ring-label {
  position: relative;
  z-index: 1;
  text-align: center;
  line-height: var(--lh-tight);
}
.ring-value { font-size: var(--fs-1); font-weight: 700; font-variant-numeric: tabular-nums; }
.ring-unit  { font-size: var(--fs-5); color: var(--on-brand-2); display: block; }

/* SVG で描くリング（ui.js が inline SVG を使う場合） */
.score-ring { display: block; width: var(--score-d); height: var(--score-d); }
.score-ring-track { fill: none; stroke: var(--line); stroke-width: var(--score-t); }
.score-ring-arc {
  fill: none;
  stroke: var(--act);
  stroke-width: var(--score-t);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset var(--t-screen) var(--ease);
}
.score-ring-arc.is-ok { stroke: var(--ok-fill); }
.score-ring-arc.is-no { stroke: var(--no-fill); }

/* 月〜日の7本の棒 */
.weekbars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--s1);
  align-items: end;
  height: var(--week-h);
}
.weekbar { display: flex; flex-direction: column; align-items: center; gap: var(--s1); height: 100%; justify-content: flex-end; }
.weekbar-track {
  width: 100%;
  max-width: var(--weekbar-w);
  flex: 1 1 auto;
  display: flex;
  align-items: flex-end;
  background: var(--on-brand-dim);
  border-radius: var(--r-chip);
  overflow: hidden;
}
.weekbar-fill {
  --bar: 0;
  width: 100%;
  height: calc(var(--bar) * 1%);
  min-height: var(--hair-3);
  background: var(--arc);
  border-radius: var(--r-chip);
  transition: height var(--t-screen) var(--ease);
}
.weekbar-day { font-size: var(--fs-5); color: var(--on-brand-2); }
.weekbar.is-today .weekbar-fill { background: var(--ok-fill); }
.weekbar.is-today .weekbar-day { color: var(--on-brand); font-weight: 700; }
.weekbar.is-today .weekbar-track { outline: var(--hair-2) solid var(--on-brand); outline-offset: var(--hair); }

/* 数値カード3つ：連続日数 / 総解答 / 学習時間 */
.statcards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s2);
}
.statcard {
  background: var(--brand-card);
  border-radius: var(--r-card);
  padding: var(--s3) var(--s2);
  text-align: center;
  color: var(--on-brand);
}
.statcard-num { font-size: var(--fs-1); font-weight: 700; font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
.statcard-unit { font-size: var(--fs-5); font-weight: 700; margin-inline-start: var(--hair-2); }
.statcard-label { font-size: var(--fs-5); color: var(--on-brand-2); margin-top: var(--s1); }

/* 連続日数 */
.streak { display: inline-flex; align-items: baseline; gap: var(--s1); }
/* 連続日数の記号。紺のカード（--brand-card）の上に浮かせるので、主ボタン・選択中チップと
   同じ --raise / --on-raise を使う。面 7.24 / 4.66、文字 5.94 / 7.82（明 / 暗）。
   ミント（--ok-fill）は面としては 3.30 / 4.94 で足りるが、その上に置ける文字が無い
   —— --ink は暗色で明るい側へ反転して 1.81、--ink-on は明色で白になって 2.19、
   --on-raise は明色で 2.71。塗り専用と決めた色に文字を乗せない、の実際の意味がこれ。
   消えている日は面を外して淡い反転文字（--on-brand-2 on --brand-card 明5.15/暗6.54）*/
.streak-flame {
  display: inline-grid;
  place-items: center;
  min-width: 1.5em;
  padding-inline: var(--s1);
  border-radius: var(--r-chip);
  background: var(--raise);
  color: var(--on-raise);
  font-size: var(--fs-2);
  font-weight: 700;
  line-height: var(--lh-tight);
}
.streak.is-cold .streak-flame { background: transparent; color: var(--on-brand-2); }

/* 続きから / 中断中のセッション（最大2件。各1行） */
.resume {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-ctl);
  background: var(--surface);
  border: var(--hair) solid var(--act-line);
  border-left: var(--hair-3) solid var(--act);
  box-shadow: var(--sh-1);
  flex-wrap: wrap;         /* 収まらなければボタンを次の行へ（縮めない） */
  row-gap: var(--s2);
}
.resume + .resume { margin-top: var(--s2); }
/* 幅が足りないときは、文言側ではなくボタンを次の行へ送る。
   ボタンを縮めると「破棄」が幅39pxで縦2行に割れ、門 D-T7 の48pxを幅だけ割っていた
   （高さは61pxあるので、高さだけ測る検査では通っていた） */
.resume-title { flex: 1 1 12rem; min-width: 0; font-size: var(--fs-4); font-weight: 700; overflow-wrap: break-word; }
/* 破棄は取り返しがつかない。再開との間隔を余白の最大段まで広げる（押し間違い対策）*/
.resume-acts { flex: 0 0 auto; display: flex; gap: var(--s5); margin-inline-start: auto; }
.resume-acts .act {
  flex: 0 0 auto;
  width: auto;             /* .act-main の width:100% を打ち消す。
                              百分率の子は親の max-content 計算を壊すので、
                              「再開」が枠を食い尽くして「破棄」が39pxに潰れていた */
  min-width: var(--tap-btn);
  min-height: var(--tap-btn);
  padding-inline: var(--s3);
  font-size: var(--fs-4);
  white-space: nowrap;     /* 「破」「棄」に割らない */
}
/* 主たる操作のほうを大きく保つ。48pxは下限であって、再開と破棄が同じ大きさでよい
   という意味ではない（同じ大きさだと、取り返しのつかない側が同格に見える） */
/* 幅の下限。破棄（52px）のおよそ2倍。主ボタンの「高さ」のトークンに相乗りしていたので、
   高さを詰めたときに巻き込まれないよう、幅は幅で書く */
.resume-acts .act-main { min-width: calc(var(--tap-btn) * 2); }

/* 予想得点（§8.4） */
.forecast-head { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.forecast-score { font-family: var(--disp); font-size: var(--fs-1); font-weight: 700; font-variant-numeric: tabular-nums; }
.forecast-max { font-size: var(--fs-4); color: var(--ink-2); }
.forecast-bar {
  position: relative;
  height: var(--track-h-lg);
  margin-top: var(--s2);
  border-radius: var(--r-chip);
  background: var(--sunk);
  border: var(--hair) solid var(--line);
  overflow: hidden;
}
.forecast-bar-fill {
  --pct: 0;
  height: 100%;
  width: calc(var(--pct) * 1%);
  background: var(--act);
  border-radius: var(--r-chip);
  transition: width var(--t-screen) var(--ease);
}
.forecast-bar-fill.is-pass { background: var(--ok); }
/* 合格ライン。**価値を持たない色**にする（SPEC §6.6 は色と破線の両方を要求）。
   マゼンタ（--no）はこのアプリでは「不正解」なので、下から近づいていく学習者に
   自分の目標を間違いの色で見せることになる。かといってミント（--ok）にすると
   「もう合格している」と読める。基準線は、越えたか越えていないかで意味が変わっては
   いけないので、本文と同じ中立色（--ink）の破線にし、意味はラベルの文字が担う。
   バーの塗り（--act / --ok）の上では --ink が 2.53:1 まで落ちるので、明るい縁
   （--surface）を1px添える。器の上では線が、塗りの上では縁が 3:1 を担保する。 */
.forecast-pass {
  --at: 66;
  position: absolute;
  top: calc(var(--hair-3) * -1); bottom: calc(var(--hair-3) * -1);
  left: calc(var(--at) * 1%);
  width: 0;
  border-left: var(--hair-2) dashed var(--ink);
  box-shadow: 0 0 0 var(--hair) var(--surface);
}
.forecast-pass-label {
  position: absolute;
  top: calc(100% + var(--hair-2));
  left: calc(var(--at) * 1%);
  transform: translateX(-50%);
  font-size: var(--fs-5);
  color: var(--ink);
  font-weight: 700;
  white-space: nowrap;
}
.forecast-legend { margin-top: var(--s4); }
.forecast-unknown { font-size: var(--fs-3); font-weight: 700; color: var(--ink-2); }

/* 弱いところから（誤答型の上位3つを着手ボタンに） */
.weaklist { display: flex; flex-direction: column; gap: var(--s2); }

/* --------------------------------------------- 7. 自分で選ぶ §6.8 / 記録のタブ */
.segbar {
  display: flex;
  gap: var(--s1);
  padding: var(--s1);
  background: var(--sunk);
  border-radius: var(--r-chip);
  overflow-x: auto;
  scrollbar-width: none;
}
.segbar::-webkit-scrollbar { display: none; }
.seg {
  flex: 1 0 auto;
  min-height: var(--tap-btn);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-chip);
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
  border: var(--hair) solid transparent;   /* 選択時に幅が動かないよう先に確保 */
}
/* 面（--surface）は器（--sunk）と 1.22:1 しか違わない。輪郭で 3:1 を作る（5.05 / 5.98）*/
.seg.is-current {
  background: var(--surface);
  border-color: var(--act);
  color: var(--act);
  box-shadow: var(--sh-1);
}

.unitlist { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
.unit-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: var(--tap-choice);
  padding: var(--s2) var(--s3);
  background: var(--surface);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  text-align: start;
  color: var(--ink);
}
.unit-code {
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--ink-2);
  min-width: 3.2em;
}
.unit-main { flex: 1 1 auto; min-width: 0; }
.unit-name { font-size: var(--fs-3); overflow-wrap: break-word; }
.unit-meta { font-size: var(--fs-5); color: var(--ink-2); }
.unit-stock {
  flex: 0 0 auto;
  font-size: var(--fs-4);
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  white-space: nowrap;
}
.unit-rate { flex: 0 0 auto; font-size: var(--fs-4); font-weight: 700; font-variant-numeric: tabular-nums; }
/* いま選んでいる範囲。.chip.is-on と同じ「一目で分かる」流儀だが、
   行は中に4色の文字を抱えるのでベタ塗りにせず、.choice.is-sel と同じ
   淡面＋2px枠＋✓ でそろえる（色だけに頼らない） */
.unit-row.is-current {
  background: var(--act-soft);
  border-color: var(--act);
  border-width: var(--hair-2);
  padding: calc(var(--s2) - var(--hair)) calc(var(--s3) - var(--hair));
}
.unit-row.is-current .unit-name { font-weight: 700; }
.unit-row.is-current .unit-code,
.unit-row.is-current .unit-meta,
.unit-row.is-current .unit-stock,
.unit-row.is-current .unit-rate { color: var(--act); }
.unit-row.is-current::after {
  content: "✓";
  flex: 0 0 auto;
  color: var(--act);
  font-size: var(--fs-2);
  font-weight: 700;
  line-height: var(--lh-tight);
}
.unit-row:disabled, .unit-row[aria-disabled="true"] {
  background: var(--sunk);
  color: var(--ink-3);
  border-style: dashed;
  cursor: not-allowed;
}
.countpicker { margin-top: var(--s4); }
.countpicker-title { font-size: var(--fs-4); font-weight: 700; margin-bottom: var(--s2); }

/* ------------------------------------------------------------ 8. 演習 §6.2 */
.q-body { overflow-wrap: break-word; }
/* 設問に添える札（K4 · 3点）。読み物ではないので、本文を上げたぶんここを下げる */
.q-meta {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
  margin-bottom: var(--s3);
  font-size: var(--fs-5);
  color: var(--ink-3);
}

/* シナリオ（折りたたみ・再展開できる） */
.scenario {
  margin: 0 0 var(--s3);
  background: var(--sunk);
  border-left: var(--hair-3) solid var(--line-2);
  border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
  overflow: clip;
  overflow-clip-margin: var(--focus-w);
}
.scenario > summary {
  min-height: var(--tap-btn);
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--ink-2);
  cursor: pointer;
  list-style: none;
}
.scenario > summary::-webkit-details-marker { display: none; }
.scenario > summary::before { content: "▸"; transition: transform var(--t-mark) var(--ease); }
.scenario[open] > summary::before { transform: rotate(90deg); }
.scenario-text {
  padding: 0 var(--s3) var(--s3);
  font-size: var(--fs-3);
  line-height: var(--lh-long);
  color: var(--ink);
  white-space: pre-wrap;
}

/* 表。自前の横スクロール枠に入れ、本文側に横スクロールを出さない（門 E-T2） */
.tbl {
  margin: 0 0 var(--s3);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: var(--hair) solid var(--line);
  border-radius: var(--r-ctl);
  background: var(--surface);
}
.tbl:focus-visible { outline: var(--focus-w) solid var(--act); outline-offset: var(--hair-2); }
.tbl table { width: 100%; min-width: 19rem; font-size: var(--fs-4); }
.tbl th {
  position: relative;
  text-align: start;
  font-size: var(--fs-5);
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink-2);
  background: var(--sunk);
  border-bottom: var(--hair) solid var(--line-2);
  padding: var(--s2) var(--s3);
  white-space: nowrap;
}
.tbl td {
  border-bottom: var(--hair) solid var(--line);
  padding: var(--s2) var(--s3);
  vertical-align: top;
  color: var(--ink-2);
  overflow-wrap: break-word;
}
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: end; white-space: nowrap; color: var(--ink); }
/* 1列目の固定は ui.js が幅の条件を満たしたときだけ .stick を付ける。
   上限幅を置き、可視幅を食い潰して2列目が永久に隠れるのを防ぐ */
.tbl .stick {
  position: sticky;
  left: 0;
  z-index: 1;
  max-width: 40%;
  background: var(--surface);
  box-shadow: var(--hair) 0 0 var(--line);
  white-space: normal;
}
.tbl th.stick { background: var(--sunk); }
.tbl-cap {
  padding: var(--s2) var(--s3);
  font-size: var(--fs-5);
  color: var(--ink-2);
  border-top: var(--hair) solid var(--line);
}

.qtext {
  font-size: var(--fs-2);
  font-weight: 700;
  line-height: var(--lh);
  margin: 0 0 var(--s3);
  overflow-wrap: break-word;
}

/* 選択肢。肢そのものがタップ領域。高さ 56px 以上（門 D-T7） */
.choices { display: flex; flex-direction: column; gap: var(--s2); }
.choice {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  width: 100%;
  min-height: var(--tap-choice);
  padding: var(--s3);
  text-align: start;
  background: var(--surface);
  color: var(--ink);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  font-size: var(--fs-3);
  line-height: var(--lh);
  position: relative;
  transition: background var(--t-mark) var(--ease), border-color var(--t-mark) var(--ease);
}
/* 選択肢の記号は四角い色つきタイル（SPEC §6.0「正誤の表示」） */
.choice-tile {
  flex: 0 0 auto;
  width: var(--tile); height: var(--tile);
  display: grid;
  place-items: center;
  border-radius: var(--r-ctl);
  background: var(--sunk);
  color: var(--ink-2);
  border: var(--hair) solid var(--line-2);
  font-family: var(--mono);
  font-size: var(--fs-4);
  font-weight: 700;
  line-height: var(--lh-tight);
}
.choice-body { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
/* 読む状態（解説）では ○／✕ の印が付く肢と付かない肢が混ざる。印を流し込みの
   項目にすると、印の有無で本文の幅が 27px ずれ、同じ意味の肢が違う形に見える。
   印は流れから外し、代わりに**すべての肢**に同じ幅の余白を確保する
   （B-5 と同じ「印が本文と幅を取り合う」問題の、小さいほうの残り） */
.choice-mark {
  position: absolute;
  top: var(--s3);
  inset-inline-end: var(--s3);
  font-size: var(--fs-2);
  font-weight: 700;
  line-height: var(--lh-tight);
}
.choice[aria-disabled="true"] .choice-body { padding-inline-end: calc(var(--s5) + var(--s2)); }

/* 選択中（確定前。何度でも選び直せる） */
.choice.is-sel {
  background: var(--act-soft);
  border-color: var(--act);
  border-width: var(--hair-2);
  padding: calc(var(--s3) - var(--hair));
}
.choice.is-sel .choice-tile { background: var(--act); border-color: var(--act); color: var(--ink-on); }
.choice.is-sel .choice-mark { color: var(--act); }

/* 確定後の正誤（読む状態） */
.choice.is-ok {
  background: var(--ok-soft);
  border-color: var(--ok);
  border-width: var(--hair-2);
  padding: calc(var(--s3) - var(--hair));
}
.choice.is-ok .choice-tile { background: var(--ok); border-color: var(--ok); color: var(--ink-on); }
.choice.is-ok .choice-mark { color: var(--ok); }
.choice.is-no {
  background: var(--no-soft);
  border-color: var(--no);
  border-width: var(--hair-2);
  padding: calc(var(--s3) - var(--hair));
}
.choice.is-no .choice-tile { background: var(--no); border-color: var(--no); color: var(--ink-on); }
.choice.is-no .choice-mark { color: var(--no); }
/* 正答なのに選ばなかった肢 */
.choice.is-missed { border-color: var(--ok); border-style: dashed; border-width: var(--hair-2); padding: calc(var(--s3) - var(--hair)); }
.choice.is-missed .choice-tile { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.choice[aria-disabled="true"], .choice:disabled { cursor: default; }
.pickhint { margin-top: var(--s2); font-size: var(--fs-4); color: var(--ink-2); min-height: 1.3em; }

/* あとで復習する（下部固定バーの中） */
.laterflag {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: var(--tap-btn);
  padding: var(--s1) var(--s3);
  border-radius: var(--r-chip);
  border: var(--hair) solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-4);
  font-weight: 700;
  cursor: pointer;
}
.laterflag input { width: var(--box); height: var(--box); accent-color: var(--hold); margin: 0; }
.laterflag.is-on { background: var(--hold-soft); border-color: var(--hold); color: var(--hold); }

/* ------------------------------------------------------------ 9. 解説 §6.3 */
/* 正誤は画面最上部に枠つきで大きく。スクロールして探させない */
.verdict {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin-bottom: var(--s4);
  padding: var(--s3) var(--s4);
  border-radius: var(--r-card);
  border: var(--hair-2) solid currentColor;
  font-size: var(--fs-1);
  font-weight: 700;
  line-height: var(--lh-tight);
  animation: verdict-in var(--t-mark) var(--ease);
}
.verdict-mark { font-size: var(--fs-1); line-height: var(--lh-tight); flex: 0 0 auto; }
.verdict-text { font-size: var(--fs-1); }
.verdict-sub { display: block; font-size: var(--fs-4); font-weight: 400; color: var(--ink-2); }
.verdict.is-ok    { background: var(--ok-soft);   color: var(--ok); }
.verdict.is-no    { background: var(--no-soft);   color: var(--no); }
.verdict.is-blank { background: var(--sunk);      color: var(--ink-2); }
@keyframes verdict-in {
  from { opacity: 0; transform: translateY(calc(var(--hair-3) * -1)); }
  to   { opacity: 1; transform: none; }
}

.expl { padding-bottom: var(--s5); }
/* 解説の本文と、シナリオの本文。ここが §6.3「★このアプリの本体」で、
   いちばん読ませたい文章。副文の色（--ink-2）で組むと、すでに答え終わった
   選択肢（--ink）より引っ込む。コントラストは通っていても主従が逆になる。
   文字の濃さを3段に整理しなおした：
     --ink   読ませたい本文 …… 設問・選択肢・シナリオ本文・解説本文
     --ink-2 添える文     …… 引用・折りたたみの中身・注記・行のメタ・凡例
     --ink-3 索引と記号   …… 連番・出典・K レベルなどの札、タブの非選択
   シナリオと引用は --sunk の面と左の罫線で構造的に引っ込んでいるので、
   文字まで薄くする必要がない（面で引っ込め、字は読ませる）。 */
.expl-text { font-size: var(--fs-3); line-height: var(--lh-long); color: var(--ink); overflow-wrap: break-word; white-space: pre-wrap; }
.expl-text + .expl-text { margin-top: var(--s3); }

/* 誤答型のバッジ。色は系統、形は系統内の位置、記号と名前は常に併記 */
.dtype {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s1) var(--s3);
  border-radius: var(--r-chip);
  border: var(--hair) solid currentColor;
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--dt-a);
  background: var(--dt-a-soft);
}
.dtype.dt-a { color: var(--dt-a); background: var(--dt-a-soft); }
.dtype.dt-b { color: var(--dt-b); background: var(--dt-b-soft); }
.dtype.dt-c { color: var(--dt-c); background: var(--dt-c-soft); }
.dtype.dt-d { color: var(--dt-d); background: var(--dt-d-soft); }
.dtype-code { font-family: var(--mono); letter-spacing: .02em; }
.dtype-name { font-weight: 700; }
.dtype-sub { font-weight: 400; opacity: .9; }
/* 形：系統の中の位置。sh-1 ● / sh-2 ■ / sh-3 ◆ / sh-4 ▲ */
.dtype-dot {
  flex: 0 0 auto;
  width: var(--dot); height: var(--dot);
  background: currentColor;
  border-radius: var(--r-chip);   /* 正方形なので真円になる */
}
.dtype-dot.sh-1 { border-radius: var(--r-chip);   /* 正方形なので真円になる */ }
.dtype-dot.sh-2 { border-radius: var(--hair-2); }
.dtype-dot.sh-3 { border-radius: var(--hair-2); transform: rotate(45deg); }
.dtype-dot.sh-4 { background: transparent; clip-path: polygon(50% 0, 100% 100%, 0 100%); box-shadow: inset 0 0 0 var(--dot) currentColor; }
.dtype.is-none { color: var(--dt-none); background: var(--sunk); border-style: dashed; }
.dtype.is-none .dtype-dot { background: transparent; box-shadow: inset 0 0 0 var(--hair) currentColor; }

/* 引用（シラバス原文）と出典 */
.quote {
  margin: var(--s3) 0;
  padding: var(--s3) var(--s4);
  background: var(--sunk);
  border-left: var(--hair-3) solid var(--act);
  border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
  font-size: var(--fs-3);
  line-height: var(--lh-long);
  color: var(--ink-2);
  overflow-wrap: break-word;
}
.quote-cite {
  display: block;
  margin-top: var(--s2);
  font-family: var(--mono);
  font-size: var(--fs-5);
  font-style: normal;
  color: var(--ink-3);
}
/* 「この肢が正解になる条件は作れない」 */
.noflip {
  margin-top: var(--s2);
  padding: var(--s2) var(--s3);
  border: var(--hair) dashed var(--no-line);
  border-radius: var(--r-ctl);
  background: var(--no-soft);
  color: var(--no);
  font-size: var(--fs-4);
  font-weight: 700;
}

/* 解答解説（全問）のインデックス帯。専用の横スクロール枠 */
.idx-strip {
  display: flex;
  gap: var(--s1);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  /* 現在地の印はセルの外側に出るが、overflow-x:auto は縦も横も切る。
     実測（390px・25問）にもとづいて、必要なぶんだけ場所を空ける：
       上  輪が 4px（--hair-2 の離れ ＋ --hair-2 の太さ）  → --s2（8px）で足りる
       下  指し棒が 12px（--s2 の間隔 ＋ --hair-3 の高さ）→ --s4（16px）
       左右 輪が 4px。1番目のセルの左と、最後のセルの右が切れていた（実測 +4px）。
            --s1（4px）だと余裕が 0 になるので --s2（8px）を取り、4px の余白を残す
     左右は padding を足すとセルが列から内側にずれるので、同じ量の負の余白で
     帯ごと外へ広げ、セルの位置は動かさない（外へ出るのは gutter の中）。 */
  padding-block: var(--s2) var(--s4);
  padding-inline: var(--s2);
  margin-inline: calc(var(--s2) * -1);
}
.idx-cell {
  flex: 0 0 auto;
  width: var(--tap-btn);
  height: var(--tap-btn);
  display: grid;
  place-items: center;
  border-radius: var(--r-ctl);
  border: var(--hair) solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-4);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  position: relative;
}
.idx-cell.is-ok    { background: var(--ok-soft);  border-color: var(--ok);  color: var(--ok); }
.idx-cell.is-no    { background: var(--no-soft);  border-color: var(--no);  color: var(--no); }
.idx-cell.is-blank { background: var(--sunk);     border-style: dashed;     color: var(--ink-3); }
/* 現在地。帯の地は青（--study）なので、--act の枠は同系で溶ける（実機で指摘された）。
   正誤の色（セルの面と枠）はそのまま残し、**別の軸**で現在地を示す：
     1. セルの外側に白い輪（--on-study）。地の青に対して 3.97:1（非文字UI の 3:1 を満たす）
     2. 真下に白い指し棒。色ではなく「形と位置」で指す（色を落としても残る）
   輪はセルの外側に置くので、淡い面（--ok-soft / --no-soft）と重ならず、正誤も潰れない */
.idx-cell.is-current {
  outline: var(--hair-2) solid var(--on-study);
  outline-offset: var(--hair-2);
  /* 影は付けない。青のベタ面の上では紺の影がほとんど見えず、
     そのくせ上へ広がって帯の高さを 8px 押し上げるだけだった（印の側を小さくする） */
}
.idx-cell.is-current::after {
  content: "";
  position: absolute;
  top: calc(100% + var(--s2));
  left: 50%;
  width: var(--s5);
  height: var(--hair-3);
  margin-inline-start: calc(var(--s5) / -2);
  border-radius: var(--r-chip);
  background: var(--on-study);
}

/* ページ送り */
.pager { display: flex; gap: var(--s2); }
.pager > .act { flex: 1 1 0; }

/* ---------------------------------------------------------- 10. 結果 §6.4 */
.result-head {
  display: flex;
  align-items: center;
  gap: var(--s4);
  flex-wrap: wrap;
}
.score { display: flex; align-items: baseline; gap: var(--s1); }
.score-num { font-family: var(--disp); font-size: var(--fs-1); font-weight: 700; font-variant-numeric: tabular-nums; }
.score-unit { font-size: var(--fs-4); font-weight: 700; color: var(--ink-2); }
/* 分母を3つとも出す（正解 7 / 解答 15（未解答 10））。
   flex にすると地の文の断片ひとつひとつが独立した項目になって別々に折り返し、
   閉じ括弧だけが次の行の頭に落ちる。1文なので素直に行内で流す（禁則が効く） */
.score-denoms {
  display: block;
  font-size: var(--fs-4);
  color: var(--ink-2);
}
.score-denoms b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* 内訳（誤答型・K レベル）。横棒＋数値ラベル＋凡例 */
.breakdown { display: flex; flex-direction: column; gap: var(--s2); }
.bd-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--s1) var(--s2);
  align-items: center;
}
.bd-label { font-size: var(--fs-4); overflow-wrap: break-word; }
.bd-count { font-size: var(--fs-4); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bd-bar {
  grid-column: 1 / -1;
  height: var(--track-h);
  border-radius: var(--r-chip);
  background: var(--sunk);
  border: var(--hair) solid var(--line);
  overflow: hidden;
}
.bd-bar-fill {
  --pct: 0;
  height: 100%;
  width: calc(var(--pct) * 1%);
  min-width: var(--hair-2);
  background: var(--no-fill);
  border-radius: var(--r-chip);
  transition: width var(--t-screen) var(--ease);
}
/* ミント（--ok-fill）は --sunk の器の上で 1.87:1 しかない。図形は --ok を使う（4.60 / 7.79）*/
.bd-bar-fill.is-ok { background: var(--ok); }
.bd-bar-fill.dt-a { background: var(--dt-a); }
.bd-bar-fill.dt-b { background: var(--dt-b); }
.bd-bar-fill.dt-c { background: var(--dt-c); }
.bd-bar-fill.dt-d { background: var(--dt-d); }

/* 全問の一覧（行タップで解説へ） */
.itemlist { display: flex; flex-direction: column; gap: var(--s1); }
/* 番号・○✕・LO・問題文・K・秒 を横一列に詰めると、320pxで問題文が7文字になり
   1行が8行に折れる。問題文は自分の行に降ろす（order で最後へ送って全幅を取る）。
   横に並べて読めるのは、実測で 768px 以上のときだけ */
.item-row {
  display: flex;
  flex-wrap: wrap;
  row-gap: var(--s1);
  align-items: center;
  gap: var(--s2);
  width: 100%;
  min-height: var(--tap-btn);
  padding: var(--s2) var(--s3);
  background: var(--surface);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  text-align: start;
  font-size: var(--fs-4);
  color: var(--ink);
}
.item-no { flex: 0 0 auto; width: 2em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.item-mark { flex: 0 0 auto; width: 1.4em; text-align: center; font-weight: 700; }
.item-mark.is-ok { color: var(--ok); }
.item-mark.is-no { color: var(--no); }
.item-mark.is-blank { color: var(--ink-3); }
.item-id { flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-5); color: var(--ink-2); }
.item-main { order: 1; flex: 1 1 100%; min-width: 0; overflow-wrap: break-word; }
.item-time { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }

/* ---------------------------------------------------------- 11. 記録 §6.6 */
/* 推移グラフの器。縦軸0〜88点の1本だけ。合格ライン58点を色と破線の両方で引く */
.chart {
  position: relative;
  margin-top: var(--s3);
  padding: var(--s3) var(--s2) var(--s4) var(--s5);
  background: var(--surface);
  border: var(--hair) solid var(--line);
  border-radius: var(--r-card);
}
.chart-plot { position: relative; height: var(--chart-h); }
.chart-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-axis { stroke: var(--line-2); stroke-width: 1; }
.chart-ytick, .chart-xtick {
  font-size: var(--fs-5);
  fill: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
/* 合格ライン。中立色（--ink）の破線。3本は色と線種の両方で分かれる：
     初見ベース（実力）     --act   実線  2.5
     全試行ベース（覚え込み） --ink-3 点線  2（dasharray 3 4）
     合格ライン             --ink   破線  2（dasharray 6 4） ← 価値を持たない色 */
.chart-passline { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 4; }
.chart-passlabel { font-size: var(--fs-5); fill: var(--ink); font-weight: 700; }
/* 初見ベース（実力）＝実線、全試行ベース（覚え込み）＝点線。2本が開くほど暗記寄り */
.chart-line { fill: none; stroke: var(--act); stroke-width: 2.5; stroke-linejoin: round; }
.chart-line.is-memo { stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 3 4; }
.chart-dot { fill: var(--act); stroke: var(--surface); stroke-width: 2; }
.chart-dot.is-memo { fill: var(--ink-3); }
.chart-empty { display: grid; place-items: center; height: var(--chart-h); color: var(--ink-2); font-size: var(--fs-4); }

/* 学習目標ごとの4状態。形＋テキストラベルを必ず添える（SPEC §6.6） */
.lorows { display: flex; flex-direction: column; gap: var(--s1); margin-top: var(--s3); }
/* 行そのものが「自分で選ぶ」の絞り込みへの入口（button）。
   押せる行と押せない行が見た目で分かることが、この機能の要 */
.lo-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  min-height: var(--tap-btn);
  padding: var(--s2) var(--s3);
  border-bottom: var(--hair) solid var(--line);
  font-size: var(--fs-4);
  text-align: start;
  color: inherit;
  background: transparent;
  cursor: pointer;
}
.lo-row::after {
  content: "›";                      /* 押せることを形で示す（色に頼らない） */
  margin-inline-start: auto;
  flex: 0 0 auto;
  color: var(--ink-3);
  font-size: var(--fs-2);
  line-height: var(--lh-tight);
}
.lo-code { flex: 0 0 auto; font-family: var(--mono); font-size: var(--fs-5); color: var(--ink-2); min-width: 3.4em; }
.lo-name { flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
.lo-state {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  font-weight: 700;
  white-space: nowrap;
  font-size: var(--fs-5);
}
.lo-swatch {
  flex: 0 0 auto;
  width: var(--swatch-w); height: var(--swatch-h);
  border-radius: var(--hair-3);
  border: var(--hair) solid var(--line-2);
}
/* 在庫なし：斜線のベタ（解いても埋まらない。48行中23行） */
.lo-row.is-nostock { color: var(--ink-2); }
.lo-row.is-nostock .lo-swatch {
  background: repeating-linear-gradient(45deg, var(--line-2) 0 var(--hatch-on), transparent var(--hatch-on) var(--hatch-off));
}
/* 未着手：白抜き（問題はある。解けば埋まる） */
.lo-row.is-none .lo-swatch { background: transparent; }
/* 計測できず：実線の枠＋中を横切る取り消し線。
   枠を「未着手」と同じ実線にしているのは、どちらも**学習者が自分で埋められる**状態だから
   （「在庫なし」は何をしても埋まらない。そこが性格の違い）。
   そのうえで、解いた記録が数えられなかったことを「取り消し線」という形で示す。
   斜めの線は「在庫なし」が使い切っているので使わない（横一文字にする）。
     在庫なし … 斜線でびっしり埋めた面
     未着手  … 実線の枠・中は空
     計測できず… 実線の枠・中に横一文字        ← ここ
     データ不足… 破線の枠・中は空
     測定済み … --act のベタ
   5つとも塗り方も線種も違うので、色を落としても見分けが付く（門 F-T2） */
.lo-row.is-excluded .lo-swatch {
  background: linear-gradient(var(--line-2), var(--line-2)) no-repeat center / 100% var(--hair-2);
}
.lo-row.is-excluded .lo-state { color: var(--warn); }
/* データ不足：破線（試行1〜2。数字は出さない） */
.lo-row.is-thin .lo-swatch { background: transparent; border-style: dashed; }
.lo-row.is-thin .lo-state { color: var(--warn); }
/* 測定済み：実線ベタ＋正答率 */
.lo-row.is-measured .lo-swatch { background: var(--act); border-color: var(--act); }
.lo-row.is-measured .lo-state { color: var(--ink); }
.lo-rate { font-variant-numeric: tabular-nums; }

/* 押した感触。子要素の下の面を変えないよう、背景ではなく内側の帯で示す
   （面を変えると、行の中の4色の文字がすべて別の地の上に乗ることになる） */
.lo-row:active, .dt-row:active { box-shadow: inset var(--hair-3) 0 0 var(--act); }
@media (hover: hover) {
  .lo-row:hover, .dt-row:hover { box-shadow: inset var(--hair-3) 0 0 var(--act-line); }
}
/* 在庫0の23目標。押せないことを、面・文字・輪郭・記号の4つで示す */
.lo-row[aria-disabled="true"], .dt-row[aria-disabled="true"] {
  background: var(--sunk);
  color: var(--ink-3);
  border-bottom-style: dashed;
  cursor: not-allowed;
  box-shadow: none;
}
.lo-row[aria-disabled="true"]::after { content: ""; }

/* 誤答型ごとの弱点（横棒14本） */
.dtrows { display: flex; flex-direction: column; gap: var(--s3); margin-top: var(--s3); }
.dt-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--s1) var(--s2);
  align-items: center;
  width: 100%;
  padding: var(--s2) var(--s3);
  border-radius: var(--r-ctl);
  text-align: start;
  color: inherit;
  background: transparent;
  cursor: pointer;
}
.dt-head { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.dt-figure { font-size: var(--fs-4); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* 横棒は結果画面と同じ .bd-bar を借りる（棒の部品は1つに保つ）。
   .bd-bar 自身も grid-column: 1 / -1 を持つが、.bd-row 側の都合で外されても
   ここが崩れないよう、記録画面でも明示しておく */
.dt-row .bd-bar { grid-column: 1 / -1; }
/* 出題されたことがない型は、色ではなくラベルで示す */
.dt-never {
  grid-column: 1 / -1;
  font-size: var(--fs-5);
  color: var(--ink-2);
  border: var(--hair) dashed var(--line-2);
  border-radius: var(--r-ctl);
  padding: var(--s1) var(--s2);
  background: var(--sunk);
}

/* 試行一覧 */
.tries { display: flex; flex-direction: column; gap: var(--s1); margin-top: var(--s3); }
.try-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  width: 100%;
  min-height: var(--tap-btn);
  padding: var(--s2) var(--s3);
  background: var(--surface);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  text-align: start;
  font-size: var(--fs-4);
}
.try-row.is-excluded { background: var(--sunk); color: var(--ink-2); border-style: dashed; }
.try-reason { font-size: var(--fs-5); color: var(--ink-2); }
.try-row[aria-disabled="true"] { cursor: not-allowed; }
.discarded { margin-top: var(--s3); }

/* ---------------------------------------------------------- 12. 模試 §6.5 */
.timer {
  display: inline-flex;
  align-items: baseline;
  gap: var(--s1);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: var(--fs-3);
}
.timer.is-urgent { color: var(--warn); font-size: var(--fs-2); }
.field-study .timer.is-urgent { color: var(--on-study); text-decoration: underline; text-underline-offset: var(--hair-3); }

.flagbtn {
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s1);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-ctl);
  border: var(--hair) solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-4);
  font-weight: 700;
}
.flagbtn.is-on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

/* 未解答一覧の番号グリッド。形と記号で区別（凡例つき） */
.gridsheet {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tap-btn), 1fr));
  gap: var(--s2);
}
.gridcell {
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  display: grid;
  place-items: center;
  border-radius: var(--r-ctl);
  border: var(--hair) solid var(--line-2);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-4);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  position: relative;
}
.gridcell.is-done  { background: var(--act-soft);  border-color: var(--act);  color: var(--act); }
.gridcell.is-blank { background: var(--sunk); border-style: dashed; color: var(--ink-3); }
.gridcell.is-flag  { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.gridcell.is-flag::after {
  content: "⚑";
  position: absolute;
  top: var(--hair); inset-inline-end: var(--hair-3);
  font-size: var(--fs-5);
  line-height: var(--lh-tight);
}
.gridcell.is-current { outline: var(--focus-w) solid var(--act); outline-offset: var(--hair); }

/* 中断復帰の案内 */
.resume-detail { font-size: var(--fs-4); color: var(--ink-2); }
.resume-detail dt { font-weight: 700; color: var(--ink); }
.resume-detail dd { margin: 0 0 var(--s2); }

/* ---------------------------------------------------------- 13. 設定 §6.7 */
.setgroup { margin-top: var(--s4); }
.setgroup-title {
  font-size: var(--fs-4);
  font-weight: 700;
  color: var(--ink-2);
  letter-spacing: .04em;
  margin-bottom: var(--s2);
}
.setrow {
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex-wrap: wrap;
  min-height: var(--tap-choice);
  padding: var(--s2) var(--s4);
  background: var(--surface);
  border-bottom: var(--hair) solid var(--line);
}
.setgroup .setrow:first-of-type { border-radius: var(--r-card) var(--r-card) 0 0; }
.setgroup .setrow:last-of-type { border-radius: 0 0 var(--r-card) var(--r-card); border-bottom: 0; }
.setrow-label { flex: 1 1 12rem; min-width: 0; font-size: var(--fs-3); }
.setrow-sub { display: block; font-size: var(--fs-5); color: var(--ink-2); }
/* 拡大表示（200%＝幅188px相当）で操作子が画面の外へ出ていた。
   flex:0 0 auto が折り返しを止め、overflow-x:hidden で切られて、
   「設定を変えられない＝文字サイズを戻せない」袋小路になっていた */
.setrow-ctl {
  flex: 0 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: center;
}
.radioset, .radio, .switch, .numfield { max-width: 100%; }

.radioset { display: flex; flex-wrap: wrap; gap: var(--s2); }
.radio {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);   /* 折り返してよいが、48px より細くはしない（門 D-T7）*/
  padding: var(--s1) var(--s3);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-chip);
  font-size: var(--fs-4);
  cursor: pointer;
}
.radio input { width: var(--box); height: var(--box); accent-color: var(--act); margin: 0; }
.radio.is-on { border-color: var(--act); background: var(--act-soft); color: var(--act); font-weight: 700; }

.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  cursor: pointer;
}
.switch input { width: var(--box-lg); height: var(--box-lg); accent-color: var(--act); margin: 0; }

.numfield {
  min-height: var(--tap-btn);
  min-width: var(--tap-btn);
  width: 5.5em;
  padding: var(--s1) var(--s2);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-3);
  font-variant-numeric: tabular-nums;
  text-align: end;
}

.danger-zone {
  margin-top: var(--s5);
  padding: var(--s4);
  border: var(--hair) solid var(--warn-line);
  border-radius: var(--r-card);
  background: var(--warn-soft);
}
.danger-zone .setgroup-title { color: var(--warn); }

/* 書き出しが成立しなかったときに全文を画面へ出す段 */
.exporttext {
  width: 100%;
  min-height: 12rem;
  margin-top: var(--s2);
  padding: var(--s3);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  background: var(--sunk);
  color: var(--ink);
  font-family: var(--mono);
  font-size: var(--fs-4);
  line-height: var(--lh);
  resize: vertical;
  white-space: pre;
  overflow: auto;
}
/* 貼り付け欄。書き出しの全文（読み取り専用の .exporttext）と見た目を分ける。
   こちらは編集できる入力なので、面は --surface、輪郭は他の入力欄と同じ --line-2 */
.importtext {
  width: 100%;
  min-height: 8rem;
  margin-top: var(--s2);
  padding: var(--s3);
  border: var(--hair) solid var(--line-2);
  border-radius: var(--r-ctl);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--mono);
  font-size: var(--fs-4);
  line-height: var(--lh);
  resize: vertical;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* 2段階確認 */
.confirmsteps { display: flex; flex-direction: column; gap: var(--s3); }
.confirmstep {
  padding: var(--s3);
  border-radius: var(--r-ctl);
  background: var(--surface);
  border: var(--hair) solid var(--line);
  font-size: var(--fs-4);
}
/* 2段階確認の現在地。ここも破壊操作の一部なので琥珀にそろえる（B-11）*/
.confirmstep.is-current { border-color: var(--warn); border-left: var(--hair-3) solid var(--warn); }
.confirmstep.is-done { color: var(--ink-2); }
.diffcount {
  display: flex;
  gap: var(--s4);
  flex-wrap: wrap;
  font-size: var(--fs-4);
  font-variant-numeric: tabular-nums;
}
.diffcount b { font-size: var(--fs-2); }

/* ------------------------------------------------ 14. 端末幅・動き・印刷外 */

/* 320px（iPhone SE 初代）でも破綻させない */
@media (max-width: 359px) {
  :root { --gutter: var(--s3); --ring-d: 96px; }
  /* 5段の問題数チップ（5/10/15/20/25）が1行に収まらず「25」だけ2行目に残る。
     的の下限（--tap-btn 48px）は保ったまま、左右の余白だけ詰める */
  .chip { padding-inline: var(--s2); }
  .statcards { gap: var(--s1); }
  .statcard { padding: var(--s2) var(--s1); }
  .resume-acts { width: 100%; }
  .resume-acts .act { flex: 1 1 0; }
}

/* 横持ち・小さい高さのとき、上下の固定物で本文が潰れないようにする */
@media (max-height: 480px) and (orientation: landscape) {
  :root { --ring-d: 84px; --week-h: 52px; }
  .appbar { position: static; }
  .brandpanel { padding-block: var(--s3); }
}

/* 幅が広いときだけ、問題文を meta と同じ行に戻す */
@media (min-width: 768px) {
  .item-main { order: 0; flex: 1 1 12rem; }
}

/* タブレット以上：紺の色面の中を2段に割る */
@media (min-width: 600px) {
  :root { --gutter: var(--s5); }
  .brandpanel-grid {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: var(--s5);
    align-items: center;
  }
}

/* PC：下タブは残す（門 D-T8）。本文だけ中央に寄せる */
@media (min-width: 1024px) {
  .tabbar { max-width: var(--wrap); margin-inline: auto; border-radius: var(--r-card) var(--r-card) 0 0; }
  .dock { padding-inline: 0; }
  .dock-inner { padding-inline: var(--gutter); }
}

/* 動きを止める（SPEC §6.0「prefers-reduced-motion で全部止める」） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* コントラストを上げたい利用者向けに境界を太くする（減点にはならない上積み） */
@media (prefers-contrast: more) {
  .card, .choice, .rowlink, .unit-row, .item-row, .try-row { border-color: var(--line-2); }
  .band { border-left-width: calc(var(--hair-3) * 1.5); }
}
