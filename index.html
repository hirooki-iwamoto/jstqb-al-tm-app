<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<!-- ============================================================
     最後の砦（起動失敗の可視化）。SPEC §6 の「起動失敗の画面」は ui.js が描くが、
     ui.js 自身が動かない種類の失敗では誰も何も出せず、#app が
     「読み込んでいます…」のまま黙って止まる（実機で実際に起きた）。
     失敗を報せる仕組みを、失敗する当人（ui.js）から切り離すための砦。

     置き場所: <head> の中、他のどのスクリプトよりも先。
       外部参照なし・インライン（SPEC §3 制約1・2）。

     ★ 砦が画面を置き換えてよいのは「起動が終わるまで」だけ（M-03）。
       起動しきったあとの例外まで拾って全画面を潰すと、学習者からは
       「タップ1つでその回がまるごと消えた」ように見える。実際には記録は
       残っているのに、画面が「起動に失敗しました」では本人に区別が付かない。
       60分の模試の最中なら最悪なので、起動後は画面に触らず、
       console.error ＋ 小さな通知（閉じられる帯）だけにする。黙りはしない。

     起動が終わった合図は、ui.js が #app を描き換えたこと＝初期表示の
     .altm-boot が消えたこと。ui.js 側の bootBail も同じ目印で二重表示を
     避ける約束になっている（src/ui.js の hasBootMark）。この約束は壊さない。

     書き方の約束（この1ブロックだけの例外。理由を残す）:
       * const / let / アロー関数 / テンプレートリテラルを使わず var と function で書く。
         新しい構文で書いた砦が古い Safari で構文エラーになったら、砦の意味が無い。
         ES5 の範囲なら、落ちる側の端末でも確実に解釈される。
       * 見た目は style 属性で直接当てる。styles.css（altm-style）が
         読めていない・差し込みに失敗した場合にも読めなければならないので、
         ここだけは CSS に依存させない。白地に濃い文字で固定する。
       * 正常に起動したら何もしない。ui.js が #app を置き換えた（.altm-boot が
         消えた）ことを見て黙る。
     ============================================================ -->
<script>
(function () {
  'use strict';

  var WATCHDOG_MS = 3000;   /* 読み込みから3秒。inline script は同期実行なので、
                               この timer が組み立ての途中で割り込むことはない。 */
  var shown = false;        /* 全画面の診断を一度出したら上書きしない
                               （最初の失敗が一番情報を持つ） */
  var noticeBox = null;     /* 起動後の通知の帯。1本だけ使い回す */
  var noticeN = 0;          /* 起動後に拾った件数 */

  /* --- style 属性に直接当てる見た目（CSS に依存しない。上のコメント参照） --- */
  var S_BOX   = 'display:block;background:#ffffff;color:#1a1a1a;margin:0;padding:16px;' +
                'font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;' +
                'font-size:15px;line-height:1.7;text-align:left;-webkit-text-size-adjust:100%;';
  var S_H     = 'display:block;margin:0 0 12px;padding:0;color:#8a1414;' +
                'font-size:19px;font-weight:700;line-height:1.4;';
  var S_P     = 'display:block;margin:0 0 12px;padding:0;color:#1a1a1a;';
  var S_ROW   = 'display:block;margin:0 0 4px;padding:0;color:#1a1a1a;' +
                'word-break:break-all;overflow-wrap:break-word;';
  var S_LABEL = 'color:#4a4a4a;font-weight:700;';
  var S_PRE   = 'display:block;margin:12px 0;padding:8px;background:#f2f2f2;color:#1a1a1a;' +
                'border:1px solid #c8c8c8;font-size:12px;line-height:1.5;' +
                'white-space:pre-wrap;word-break:break-all;overflow-x:auto;';
  var S_NOTE  = 'display:block;margin:12px 0 0;padding:8px;background:#fdf6e3;color:#1a1a1a;' +
                'border:1px solid #c8c8c8;';
  /* 起動後の通知。画面の上に重ねるだけで、下のアプリは生かしたままにする。
     z-index は最大値。下タブ（画面の下端）は塞がないよう上に出す。 */
  var S_TOAST = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;' +
                'box-sizing:border-box;margin:0;padding:10px 12px;' +
                'padding-top:calc(10px + env(safe-area-inset-top, 0px));' +
                'background:#fdf6e3;color:#1a1a1a;border-bottom:2px solid #8a1414;' +
                'font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;' +
                'font-size:13px;line-height:1.6;text-align:left;-webkit-text-size-adjust:100%;';
  var S_TOAST_T = 'display:block;margin:0 0 2px;padding:0;color:#8a1414;font-weight:700;';
  var S_TOAST_B = 'display:block;margin:0;padding:0;color:#1a1a1a;' +
                  'word-break:break-all;overflow-wrap:break-word;';
  var S_CLOSE = 'display:inline-block;margin:6px 0 0;padding:6px 14px;' +
                'background:#ffffff;color:#1a1a1a;border:1px solid #8a1414;' +
                'font-size:13px;line-height:1.4;font-family:inherit;';

  function el(tag, style, text) {
    var e = document.createElement(tag);
    e.setAttribute('style', style);
    if (text !== undefined && text !== null) e.appendChild(document.createTextNode(String(text)));
    return e;
  }

  function row(parent, label, value) {
    var p = el('p', S_ROW);
    p.appendChild(el('span', S_LABEL, label + ': '));
    p.appendChild(document.createTextNode(value === undefined || value === null || value === ''
      ? '(不明)' : String(value)));
    parent.appendChild(p);
    return p;
  }

  function emptyNode(n) {
    while (n.firstChild) n.removeChild(n.firstChild);
  }

  /* --- 起動が終わったかの判定 -------------------------------------
   * ui.js は #app の中身を丸ごと置き換える（buildShell → empty(mount)）。
   * 初期表示の .altm-boot が残っていれば、まだ誰も画面を組んでいない。
   * ui.js の bootBail も同じ目印を見る（src/ui.js hasBootMark）。合わせること。 */
  function hasBootMark(node) {
    if (!node) return false;
    var cls = node.getAttribute ? node.getAttribute('class') : null;
    if (cls && (' ' + cls + ' ').indexOf(' altm-boot ') >= 0) return true;
    var kids = node.childNodes || [];
    for (var i = 0; i < kids.length; i++) if (hasBootMark(kids[i])) return true;
    return false;
  }

  function appNode() {
    try { return document.getElementById ? document.getElementById('app') : null; }
    catch (e) { return null; }
  }

  /* 見張り用。#app があって、まだ初期表示のまま。
     #app 自体が無いときは ui.js の bootBail が出す約束なので false。 */
  function stillBooting() {
    var a = appNode();
    return !!a && hasBootMark(a);
  }

  /* エラー捕捉用。まだ起動の途中か＝全画面で出してよいか。
     #app がまだ無い（head や body のパース中）段階も起動中に含める。 */
  function inBootPhase() {
    var a = appNode();
    if (a) return hasBootMark(a);
    var rs = null;
    try { rs = document.readyState; } catch (e) { rs = null; }
    return rs === 'loading' || rs === null;
  }

  /* --- 出す先。#app が無い段（head 実行中など）でも捨てない --- */
  function mount() {
    return appNode() || document.body || null;
  }

  function paint(box) {
    var m = mount();
    if (!m) {   /* body すらまだ無い。組み上がってから出す。 */
      if (document.addEventListener) {
        document.addEventListener('DOMContentLoaded', function () {
          var m2 = mount();
          if (m2) { emptyNode(m2); m2.appendChild(box); }
        }, false);
      }
      return;
    }
    emptyNode(m);
    m.appendChild(box);
  }

  function tail(box) {
    box.appendChild(el('p', S_NOTE,
      'この画面をそのまま（スクリーンショットでも構いません）開発の担当者に見せてください。' +
      '文字が途中で切れていても、見えているところまでで原因の特定に役立ちます。'));
  }

  function logLine(prefix, kind, message, file, line, col) {
    var s = '[ALTM 砦] ' + prefix + ' ' + kind + ': ' + (message || '(内容なし)');
    if (file) s += ' @ ' + file + ':' + (line === 0 || line ? line : '?') +
                   ':' + (col === 0 || col ? col : '?');
    try { if (window.console && window.console.error) window.console.error(s); } catch (e) { /* console が無い */ }
  }

  /* --- 1. 起動中の失敗 → 全画面の診断（従来どおり） ----------------- */
  function showError(kind, message, file, line, col, err) {
    if (shown) return;
    shown = true;
    var box = el('div', S_BOX);
    box.appendChild(el('h1', S_H, '起動に失敗しました'));
    box.appendChild(el('p', S_P,
      'このアプリは起動の途中で止まりました。以下がその内容です。'));
    row(box, '種別', kind);
    row(box, 'エラー', message);
    row(box, 'ファイル', file);
    row(box, '行番号', (line === 0 || line) ? line : null);
    row(box, '列番号', (col === 0 || col) ? col : null);

    var stack = null;
    try { stack = err && err.stack ? String(err.stack) : null; } catch (e1) { stack = null; }
    if (stack) {
      box.appendChild(el('p', S_ROW, ''));
      box.appendChild(el('span', S_LABEL, 'stack（先頭5行）'));
      box.appendChild(el('pre', S_PRE, stack.split('\n').slice(0, 5).join('\n')));
    }
    tail(box);
    paint(box);
  }

  /* --- 2. 起動後の失敗 → 画面は触らない。console と小さな帯だけ ----- */
  function showNotice(kind, message, file, line, col) {
    noticeN++;
    var body = document.body;
    if (!body || !body.appendChild) return;   /* console には既に出してある */

    var where = file ? (String(file).replace(/^.*\//, '') + ':' +
                        (line === 0 || line ? line : '?')) : null;
    var text = (message ? String(message) : '(内容なし)');
    if (text.length > 200) text = text.slice(0, 200) + '…';

    if (!noticeBox) {
      noticeBox = el('div', S_TOAST);
      noticeBox.setAttribute('role', 'alert');
      body.appendChild(noticeBox);
    } else if (!noticeBox.parentNode) {
      body.appendChild(noticeBox);            /* 画面の作り直しで外れていたら戻す */
    }
    emptyNode(noticeBox);
    noticeBox.appendChild(el('strong', S_TOAST_T,
      'アプリの中で不具合が起きました' + (noticeN > 1 ? '（' + noticeN + '件）' : '')));
    noticeBox.appendChild(el('span', S_TOAST_B,
      text + (where ? '（' + where + '）' : '')));
    noticeBox.appendChild(el('span', S_TOAST_B,
      '学習の記録はこの端末に残っています。今の操作をやり直すか、画面を開き直してください。'));
    var btn = el('button', S_CLOSE, '閉じる');
    btn.setAttribute('type', 'button');
    if (btn.addEventListener) {
      btn.addEventListener('click', function () {
        if (noticeBox && noticeBox.parentNode) noticeBox.parentNode.removeChild(noticeBox);
      }, false);
    }
    noticeBox.appendChild(btn);
  }

  /* --- 3. 入口。起動中か起動後かで行き先を分ける -------------------- */
  function onFailure(kind, message, file, line, col, err) {
    if (inBootPhase()) {
      logLine('起動中の', kind, message, file, line, col);
      showError(kind, message, file, line, col, err);
    } else {
      /* 起動後。画面は置き換えない（M-03）。ただし黙らない。 */
      logLine('起動後の', kind, message, file, line, col);
      showNotice(kind, message, file, line, col);
    }
  }

  if (window.addEventListener) {
    window.addEventListener('error', function (ev) {
      var err = null;
      try { err = ev && ev.error ? ev.error : null; } catch (e) { err = null; }
      var msg = null;
      try {
        msg = (ev && ev.message) || (err && err.message) || null;
      } catch (e2) { msg = null; }
      onFailure('スクリプトエラー (error)', msg,
        ev && ev.filename, ev && ev.lineno, ev && ev.colno, err);
    }, false);

    window.addEventListener('unhandledrejection', function (ev) {
      var r = null;
      try { r = ev && ev.reason; } catch (e) { r = null; }
      var msg = null;
      try { msg = (r && r.message) ? r.message : String(r); } catch (e2) { msg = '(理由を読めない)'; }
      onFailure('未処理の Promise 失敗 (unhandledrejection)', msg,
        (r && r.fileName) || null, (r && r.lineNumber) || null, (r && r.columnNumber) || null, r);
    }, false);
  }

  /* --- 4. 見張り（ウォッチドッグ） --------------------------------- */
  function blockInfo(box, label, id) {
    var n = null, len = null;
    try { n = document.getElementById(id); } catch (e) { n = null; }
    if (n) {
      try { len = (n.textContent || '').length; } catch (e2) { len = null; }
    }
    row(box, label, n ? ('あり / ' + (len === null ? '長さ不明' : (len + ' 文字'))) : 'なし');
  }

  function showStall() {
    /* 起動が終わっていれば（.altm-boot が消えていれば）黙る。 */
    if (shown || !stillBooting()) return;
    shown = true;
    var box = el('div', S_BOX);
    box.appendChild(el('h1', S_H, '起動が完了しませんでした'));
    box.appendChild(el('p', S_P,
      '読み込みから ' + (WATCHDOG_MS / 1000) + ' 秒たっても画面が組み上がりませんでした。' +
      'エラーは1件も報告されていません。止まった時点で分かっていることを並べます。'));

    row(box, 'core（window.ALTM）', window.ALTM ? 'あり' : 'なし');
    row(box, 'ui（window.ALTM_UI）', window.ALTM_UI ? 'あり' : 'なし');
    blockInfo(box, '問題データ (altm-items)', 'altm-items');
    blockInfo(box, 'シラバス (altm-syllabus)', 'altm-syllabus');
    blockInfo(box, '模試セット (altm-examsets)', 'altm-examsets');
    blockInfo(box, 'core.js (altm-core)', 'altm-core');
    blockInfo(box, 'ui.js (altm-ui)', 'altm-ui');
    blockInfo(box, 'CSS (altm-style)', 'altm-style');
    row(box, 'readyState', document.readyState);
    row(box, 'userAgent', (window.navigator && navigator.userAgent) || null);

    tail(box);
    paint(box);
  }

  if (window.setTimeout) window.setTimeout(showStall, WATCHDOG_MS);
})();
</script>
<!-- viewport-fit=cover: iOS のセーフエリア（下タブ・ホームインジケータ）を
     env(safe-area-inset-*) で拾えるようにする。SPEC §6.0「下タブ 56px + env(safe-area-inset-bottom)」。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- SPEC §6.0 配色表の紺。明色 #1c409a / 暗色 #12285f。 -->
<meta name="theme-color" content="#1c409a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12285f" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AL-TM">
<meta name="robots" content="noindex">
<!-- 空の data URI。favicon.ico への問い合わせを止める。外部参照ではない。 -->
<link rel="icon" href="data:,">
<title>JSTQB AL-TM 学習</title>

<!-- ============================================================
     外部ネットワーク参照はこのファイルに1つも書かない（SPEC §3 制約2）。
     CDN・Web フォント（Google Fonts 等）は禁止。日本語は OS 内蔵フォントで組む。
     パスは全部相対（SPEC §3 制約1）。
     このファイルは骨組み。中身は build_app.py が src/ から差し込む（SPEC §3.1）。
     ============================================================ -->

<!-- build_app.py が src/styles.css の全文をここへ差し込む。
     印は HTML コメントではなく実在タグの中身。空のまま出荷されても
     ビルドの検算が長さを突き合わせて気づける。 -->
<style id="altm-style">/* ============================================================================
   JSTQB AL-TM 学習アプリ — 見た目の土台
   SPEC.md 第6版 §6.0〜§6.8 に対応。build 時に単一の style 要素へそのまま差し込む。

   [方針]
   - 生の色・寸法は :root のトークンにだけ書く（門 E-T4）。以降は var() のみ。
   - 面（塗り）は SPEC §6.0 のスタディサプリ実測値。文字は実測値から暗くした派生値。
     実測値をそのまま文字に使うと 白 on ミント 2.19:1 / 白 on マゼンタ 3.91:1 /
     白 on 青 3.97:1 で門 E-T1 に当たるため、文字専用の濃色を別に持つ。
   - 外部参照は一切しない（Web フォント禁止・url() は data URI のみ・ここでは未使用）。
   - 角丸3種・余白5段・文字5段・影2段以外を使わない（SPEC §6.0 レイアウト表）。
     線幅（--hair / --hair-2 / --hair-3 / --focus-w）と図形の実寸（--tile / --dot /
     --ring-d など）は SPEC の5段とは別の軸なので、独立したトークン群にした。
     検査：このファイルに :root の外の生の px・生の色は残っていない。

   [下タブの出し入れ — 仕様第7版]
   解く画面・模試画面・解説画面では下タブ3つを隠してよい。器に .app.tabs-off を
   付けるだけで、タブが消え、--chrome-b（画面が下に空ける高さ）と .dock の位置・
   セーフエリアの持ち手が同時に切り替わる。隠す対象はタブだけで .dock は残す。
   隠している間はヘッダに「中断」または「戻る」を出すこと（袋小路を作らない。ui.js の責務）。

   [行間は3段。4段目は作らない]
   --lh-tight 1.35（見出し・数字）／--lh 1.7（本文・選択肢・表・ラベル）／
   --lh-long 1.85（連続した読み物だけ：.scenario-text .expl-text .quote .fold-body）。
   文字サイズは SPEC §6.0 の5段のまま。14.5px / 13.5px は入れていない。

   [暗色について — 親からの指示との差分]
   親の指示は「SPEC に指示が無ければダークモードをやらない」だったが、
   SPEC §6.0 の配色表が「暗色」列を持ち §6.7 が「表示テーマ OS追従／明／暗
   （settings.theme）」を要求しているため、暗色を実装した。
   切替は :root[data-theme="dark"] / ["light"]、無指定時は prefers-color-scheme に従う。

   [14種の誤答型の描き分け方針]
   14色を別々に用意すると識別も対比も破綻するので、
   **誤りの系統4つ＝4色 × 系統内の位置4つ＝4形（● ■ ◆ ▲）**で区別し、
   記号（D4 等）と名前のテキストを常に併記する（色だけで区別しない。SPEC §6.6）。
     系統A 読み取り（条件・設問文の読み落とし）: D2 ● / D12 ■ / D11 ◆ / D9 ▲
     系統B 取り違え（語・帰属・主体の混同）    : D1 ● / D8  ■ / D10 ◆ / D14 ▲
     系統C 判断の歪み（優先順位・態度）        : D4 ● / D7  ■ / D13 ◆ / D5 ▲
     系統D 知識のズレ（部分正解・実務との差）  : D3 ● / D6  ■
   ui.js は .dtype-dot に .dt-a〜.dt-d と .sh-1〜.sh-4 を付けるだけでよい。

   [コントラスト — CSS の宣言の全集合から機械で作って計算した値。目視ではない]
   正本は tests/contrast_audit.py。下の表はその出力の写しなので、CSS を直したら
   `python3 jstqb-al-tm/app/tests/contrast_audit.py` を回し直して貼り替えること。
   作り方と、この検査が過去に取りこぼした4種（カスケード／暗色の片側反転／祖先の面／
   面と面の軸そのもの）は、そのスクリプトの冒頭に書いてある。

   基準は3つ。混ぜないこと。
     [文字]    文字 × 背景     4.5:1（WCAG 1.4.3 / 門 E-T1）
     [面・図形] 面 × 下の面     3.0:1（WCAG 1.4.11）。面・枠・線・縁のどれかが届けばよい
     [触る的]  幅も高さも 48px 以上（門 D-T7）
   実際に画面に出る組は 文字 94組 / 面 112組。基準割れはどれも 0。

   --- 文字 4.5:1 / 明色 ---
   L  --ok         on --ok-soft        4.57:1  OK   例: .pill.is-ok
   L  --ok         on --ground         4.60:1  OK   例: .pill.is-k2
   L  --ok         on --surface        5.03:1  OK   例: .pill.is-k2
   L  --ink-on     on --ok             5.03:1  OK   例: .choice.is-ok .choice-tile
   L  --act        on --sunk           5.05:1  OK   例: .fold > summary
   L  --ink-3      on --sunk           5.12:1  OK   例: .act:disabled
