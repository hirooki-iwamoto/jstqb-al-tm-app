        var n = isNum(f.value) ? f.value : (isStr(f.value) && /^[0-9]+$/.test(f.value) ? Number(f.value) : null);
        return n === null ? null : { kind: 'chapter', value: n };
      }
      if (!isStr(f.value) || f.value === '') return null;
      return { kind: kind, value: f.value };
    }

    /* 古い形（第7版までの filter が exam / review を持っていた記録）を mode / profile へ寄せる。
     * 寄せたあと filter は null。Store の読み込みと migrate(0→1) の両方から呼ぶ。 */
    function coerceLegacy(sess) {
      var f = sess.filter;
      if (!isObj(f)) return false;
      if (f.kind === 'exam') {
        sess.mode = 'exam';
        if (!sess.profile && isStr(f.value) && f.value !== '') sess.profile = f.value;
        sess.filter = null;
        return true;
      }
      if (f.kind === 'review') {
        if (sess.mode !== 'exam') sess.mode = 'review';
        sess.filter = null;
        return true;
      }
      return false;
    }

    /* 「自分で選ぶ」の単位（Bank.units の1件）→ 記録に残す構造。 */
    function fromUnit(unit) {
      if (!unit || !unit.kind) return null;
      if (unit.kind === 'dtype') return { kind: 'distractorType', value: unit.key };
      if (unit.kind === 'lo') return { kind: 'lo', value: unit.key };
      if (unit.kind === 'section') return { kind: 'section', value: String(unit.key) };
      if (unit.kind === 'chapter') return { kind: 'chapter', value: Number(unit.key) };
      return null;
    }

    /* 構造 → 在庫。Sched に渡す itemIds はここから引く。 */
    function itemIds(f, bank) {
      var n = normalize(f);
      if (!n) return null;
      var i;
      if (n.kind === 'distractorType') {
        var u = bank.units('dtype');
        for (i = 0; i < u.length; i++) if (u[i].key === n.value) return u[i].itemIds.slice();
        return [];
      }
      if (n.kind === 'lo') {
        var los = bank.los();
        for (i = 0; i < los.length; i++) if (los[i].code === n.value) return los[i].itemIds.slice();
        return [];
      }
      var secs = bank.sections(), out = [];
      for (i = 0; i < secs.length; i++) {
        var hit = n.kind === 'section'
          ? String(secs[i].no) === String(n.value)
          : String(secs[i].chapter) === String(n.value);
        if (hit) out = out.concat(secs[i].itemIds);
      }
      return out;
    }

    /* 範囲だけの文言。3つ組の文言はこの下の label が組み立てる。 */
    function rangeLabel(f) {
      var n = normalize(f);
      if (!n) return null;
      if (n.kind === 'distractorType') {
        var name = DTYPE_NAME[n.value];
        return name ? (n.value + ' ' + name + ' の回') : (n.value + ' の回');
      }
      if (n.kind === 'lo') return '学習目標 ' + n.value + ' の回';
      if (n.kind === 'section') return '節 ' + n.value + ' の回';
      return '章 ' + n.value + ' の回';
    }

    /* 表示文言。(mode, profile, filter) の3つ組1つに対して1つだけ対応する（門 A-T8）。 */
    function label(mode, profile, filter, bank) {
      var range = rangeLabel(filter);
      var base;
      if (mode === 'exam') {
        var p = profile && EXAM.profiles[profile] ? EXAM.profiles[profile] : null;
        base = p ? p.label : (profile ? '模試 ' + profile : '模試');
      } else if (mode === 'review') {
        base = '間違えた問題';
      } else {
        base = '演習';
      }
      if (!range) return base;
      if (mode === 'exam' || mode === 'review') return base + '（' + range + '）';
      return range;
    }

    /* セッション1件からの近道。 */
    function sessionLabel(sess, bank) {
      if (!sess) return '演習';
      return label(sess.mode, sess.profile, sess.filter, bank);
    }

    function kinds() { return KINDS.slice(); }

    return {
      normalize: normalize, coerceLegacy: coerceLegacy, fromUnit: fromUnit,
      itemIds: itemIds, rangeLabel: rangeLabel, label: label, sessionLabel: sessionLabel, kinds: kinds
    };
  })();

  /* ===================================================================
   * 4. Bank（SPEC §3 制約4・§4.2 / DESIGN §2）
   *
   * 生データ（altm-items / altm-syllabus / altm-examsets）を読むのはここだけ。
   * 長さ3の配列・1始まりのキー・選択肢順の配列を、正規化の時点で全部
   * 「選択肢オブジェクト」に畳む。以後アプリの中に「誤答の何番目か」は無い。
   * =================================================================== */

  var Bank = (function () {

    var state = {
      booted: false,
      items: [],            // 正規化済み・健全な Item（安定順）
      byId: null,           // Map
      quarantine: [],       // {id, reasons[], raw} 壊れていて出題に使えない問題
      los: [],              // 48件
      sections: [],         // 11件
      clusters: null,       // Map<cluster, Item[]>
      sets: {},             // {half-A: [id], ...}
      examMeta: null,
      issues: [],           // integrity()
      warnings: [],
      syllabusMeta: null
    };

    /* --- 生データの取り出し（DOM に触れるのはこの関数だけ。SPEC §3 制約4） --- */
    function readBlock(id) {
      var doc = null;
      try { doc = (global && global.document) || (typeof document !== 'undefined' ? document : null); } catch (e) { doc = null; }
      if (!doc || !doc.getElementById) return { node: null, text: null };
      var node = doc.getElementById(id);
      return { node: node, text: node ? node.textContent : null };
    }

    function parseBlock(id, fallback) {
      var b = readBlock(id);
      if (b.text === null || b.text === undefined || String(b.text).trim() === '') {
        return { value: fallback, node: b.node, missing: true };
      }
      var v;
      try {
        v = JSON.parse(b.text);
      } catch (e) {
        throw new Error('埋め込みデータ ' + id + ' が JSON として読めない: ' + ((e && e.message) || e));
      }
      return { value: v, node: b.node, missing: false };
    }

    /* --- 整合の検査（SPEC §4.2 の3つの罠 / DESIGN §2.4 の assert） ---
     * fatal が1つでもあれば、その問題は隔離する（落とさない。記録は残す）。
     */
    function inspect(q) {
      var fatal = [], warn = [];
      if (!isObj(q)) return { fatal: ['問題がオブジェクトでない'], warn: [] };
      if (!isStr(q.id) || q.id === '') fatal.push('id が無い');
      if (!isArr(q.choices) || q.choices.length < 2) fatal.push('choices が無い');
      if (!isArr(q.answer) || q.answer.length < 1) fatal.push('answer が無い');
      var e = isObj(q.explanation) ? q.explanation : null;
      var m = isObj(q.meta) ? q.meta : null;
      if (!e) fatal.push('explanation が無い');
      if (!m) fatal.push('meta が無い');
      if (fatal.length) return { fatal: fatal, warn: warn };

      var n = q.choices.length;
      for (var i = 0; i < q.answer.length; i++) {
        var a = q.answer[i];
        if (!(isNum(a) && a === Math.floor(a) && a >= 0 && a < n)) fatal.push('answer が choices の範囲外: ' + a);
      }
      // 罠1: distractors / flip の長さは choices と同じ（SPEC §4.2）
      if (!isArr(e.distractors) || e.distractors.length !== n) fatal.push('explanation.distractors の長さが choices と違う');
      if (!isArr(e.flip) || e.flip.length !== n) fatal.push('explanation.flip の長さが choices と違う');
      // 罠2: 長さ3の配列は「誤答だけを選択肢順に詰めたもの」。誤答位置と meta の対応
      var wrongCount = 0;
      for (var w = 0; w < n; w++) if (q.answer.indexOf(w) < 0) wrongCount++;
      if (!isArr(m.distractorTypes) || m.distractorTypes.length !== wrongCount) fatal.push('meta.distractorTypes の長さが誤答の数と違う');
      if (!isArr(m.distractorIntent) || m.distractorIntent.length !== wrongCount) fatal.push('meta.distractorIntent の長さが誤答の数と違う');
      if (fatal.length) return { fatal: fatal, warn: warn };

      for (var j = 0; j < n; j++) {
        var isAns = q.answer.indexOf(j) >= 0;
        if (isAns) {
          if (e.distractors[j] !== null && e.distractors[j] !== undefined) warn.push('正答位置の distractors が null でない (' + j + ')');
          if (e.flip[j] !== null && e.flip[j] !== undefined) warn.push('正答位置の flip が null でない (' + j + ')');
        } else {
          if (!isStr(e.distractors[j]) || e.distractors[j] === '') warn.push('誤答位置の distractors が空 (' + j + ')');
          var hasFlip = isStr(e.flip[j]) && e.flip[j] !== '';
          var note = isObj(e.flipNote) ? e.flipNote[String(j + 1)] : null;
          var hasNote = isStr(note) && note !== '';
          // SPEC §4.1: flip が無いスロットには flipNote が入っている（143/143）
          if (!hasFlip && !hasNote) warn.push('flip も flipNote も無い誤答スロット (' + j + ')');
          if (hasFlip && hasNote) warn.push('flip と flipNote が両方ある誤答スロット (' + j + ')');
        }
      }
      // 罠3: table / table2 を落とすと解答不能になる（SPEC §4.2）
      var tabs = [q.table, q.table2];
      for (var t = 0; t < tabs.length; t++) {
        var tb = tabs[t];
        if (!tb) continue;
        if (!isArr(tb.headers) || !isArr(tb.rows)) { warn.push('table の形が違う (' + (t ? 'table2' : 'table') + ')'); continue; }
        for (var r = 0; r < tb.rows.length; r++) {
          if (!isArr(tb.rows[r]) || tb.rows[r].length !== tb.headers.length) {
            warn.push('table の列数が headers と違う (' + (t ? 'table2' : 'table') + ' 行' + (r + 1) + ')');
          }
        }
      }
      for (var f = 0; f < EXPL_TEXT.length; f++) {
        if (!isStr(e[EXPL_TEXT[f]]) || e[EXPL_TEXT[f]] === '') warn.push('explanation.' + EXPL_TEXT[f] + ' が空');
      }
      return { fatal: fatal, warn: warn };
    }

    var EXPL_TEXT = ['why', 'signals', 'misconception', 'quote', 'ref'];

    /* 画面に出す文字列を全部なめる（SPEC §3.1 の走査対象）。 */
    function displayStrings(q) {
      var out = [];
      var e = isObj(q.explanation) ? q.explanation : {};
      var keys = ['signals', 'why', 'distractors', 'flip', 'flipNote', 'misconception', 'note'];
      for (var i = 0; i < keys.length; i++) {
        var v = e[keys[i]];
        if (isStr(v)) out.push(['explanation.' + keys[i], v]);
        else if (isArr(v)) {
          for (var j = 0; j < v.length; j++) if (isStr(v[j])) out.push(['explanation.' + keys[i] + '[' + j + ']', v[j]]);
        } else if (isObj(v)) {
          var ks = Object.keys(v);
          for (var k = 0; k < ks.length; k++) if (isStr(v[ks[k]])) out.push(['explanation.' + keys[i] + '[' + ks[k] + ']', v[ks[k]]]);
        }
      }
      var m = isObj(q.meta) ? q.meta : {};
      if (isArr(m.distractorIntent)) {
        for (var d = 0; d < m.distractorIntent.length; d++) {
          if (isStr(m.distractorIntent[d])) out.push(['meta.distractorIntent[' + d + ']', m.distractorIntent[d]]);
        }
      }
      return out;
    }

    /* SPEC §4.2 のアダプタ。wrong.indexOf(i) と String(i+1) はこの関数にしか現れない。 */
    function normalizeItem(q, refHits) {
      var ans = q.answer.slice().sort(function (a, b) { return a - b; });
      var wrong = [];
      for (var i = 0; i < q.choices.length; i++) if (ans.indexOf(i) < 0) wrong.push(i);
      var fnote = isObj(q.explanation.flipNote) ? q.explanation.flipNote : {};
      var e = q.explanation, m = q.meta;

      var choices = q.choices.map(function (text, idx) {
        var isAnswer = ans.indexOf(idx) >= 0;
        var wi = wrong.indexOf(idx);
        var fn = fnote[String(idx + 1)];                                   // ★1始まり → ここで終わり
        return Object.freeze({
          idx: idx,
          text: String(text),
          isAnswer: isAnswer,
          why: isAnswer ? null : (isStr(e.distractors[idx]) ? e.distractors[idx] : null),
          flip: isAnswer ? null : (isStr(e.flip[idx]) ? e.flip[idx] : null),
          flipNote: isAnswer ? null : (isStr(fn) ? fn : null),
          intent: isAnswer ? null : (isStr(m.distractorIntent[wi]) ? m.distractorIntent[wi] : null),
          dtype: isAnswer ? null : DType.normalize(m.distractorTypes[wi])   // ★長さ3 → ここで終わり
        });
      });

      var tables = [];
      if (q.table) tables.push(normTable(q.table));
      if (q.table2) tables.push(normTable(q.table2));

      // SPEC §3.1。ビルドが noShuffle を立て損ねていても、本文に番号参照があれば
      // ここで立てる（門 G-T5 の二重の網。DESIGN §2.7 の最後の1本）。
      var noShuffle = (q.noShuffle === true) || refHits.length > 0;

      return deepFreeze({
        id: q.id,
        lo: q.lo, cluster: q.cluster, clusterName: q.clusterName || null,
        variant: isNum(q.variant) ? q.variant : 1,
        variantAxis: q.variantAxis || null,
        chapter: q.chapter, section: q.section,
        k: q.k, points: isNum(q.points) ? q.points : (EXAM.pointsByK[q.k] || 1),
        minutes: isNum(q.minutes) ? q.minutes : (EXAM.minutesByK[q.k] || 1),
        type: q.type === 'multi' ? 'multi' : 'single',
        pickCount: ans.length,                     // SPEC §4.2「answer.length を根拠にしてよい」
        scenario: isStr(q.scenario) && q.scenario !== '' ? q.scenario : null,
        tables: tables,
        question: q.question,
        choices: choices,
        answerIdx: ans,
        wrongIdx: wrong,
        why: e.why, signals: e.signals, misconception: e.misconception,
        quote: e.quote, ref: e.ref,
        note: isStr(e.note) && e.note !== '' ? e.note : null,
        noShuffle: noShuffle
        // meta.unfrozen / notes / confidenceNote / basis / reviews は載せない（SPEC §4.2）
      });
    }

    function normTable(t) {
      return {
        caption: isStr(t.caption) ? t.caption : '',
        headers: isArr(t.headers) ? t.headers.map(String) : [],
        rows: isArr(t.rows) ? t.rows.map(function (r) { return isArr(r) ? r.map(String) : [String(r)]; }) : []
      };
    }

    function itemOrder(a, b) {
      return (a.chapter - b.chapter) || cmpStr(String(a.section), String(b.section)) ||
        cmpStr(String(a.lo), String(b.lo)) || cmpStr(a.id, b.id);
    }

    /* --- boot ---
     * raw を渡せば DOM を読まない（テストと、将来の分割読み込みのため）。
     * DOM から読んだ場合はノードを取り除き、生データへの到達経路を消す（DESIGN §1.4）。
     */
    function boot(raw) {
      var itemsRaw, syllabusRaw, setsRaw, nodes = [];
      if (isObj(raw)) {
        itemsRaw = raw.items || [];
        syllabusRaw = raw.syllabus || {};
        setsRaw = raw.examsets || {};
      } else {
        var a = parseBlock('altm-items', []);
        var b = parseBlock('altm-syllabus', {});
        var c = parseBlock('altm-examsets', {});
        itemsRaw = a.value; syllabusRaw = b.value; setsRaw = c.value;
        nodes = [a.node, b.node, c.node];
      }
      if (!isArr(itemsRaw)) itemsRaw = [];

      state.items = [];
      state.quarantine = [];
      state.issues = [];
      state.warnings = [];
      state.byId = new Map();

      var seen = {};
      for (var i = 0; i < itemsRaw.length; i++) {
        var q = itemsRaw[i];
        var id = (isObj(q) && isStr(q.id)) ? q.id : ('(id なし #' + i + ')');
        var chk = inspect(q);
        if (seen[id]) chk.fatal.push('id が重複している');
        seen[id] = true;
        if (chk.fatal.length) {
          // 落とさない。隔離して、その旨を記録する。
          state.quarantine.push({ id: id, reasons: chk.fatal, index: i });
          state.issues.push({ kind: 'quarantined', id: id, detail: chk.fatal.join(' / ') });
          continue;
        }
        var refs = [];
        var strs = displayStrings(q);
        for (var s = 0; s < strs.length; s++) if (CHOICE_REF.test(strs[s][1])) refs.push(strs[s][0]);
        var item;
        try {
          item = normalizeItem(q, refs);
        } catch (err) {
          state.quarantine.push({ id: id, reasons: ['正規化に失敗: ' + ((err && err.message) || err)], index: i });
          state.issues.push({ kind: 'quarantined', id: id, detail: String((err && err.message) || err) });
          continue;
        }
        for (var wI = 0; wI < chk.warn.length; wI++) {
          state.issues.push({ kind: 'field', id: id, detail: chk.warn[wI] });
        }
        if (refs.length && q.noShuffle !== true) {
          state.issues.push({
            kind: 'choice-ref-unshuffled', id: id,
            detail: '本文が選択肢を番号で名指ししているのに noShuffle が立っていない（' + refs.join(', ') + '）。この場でシャッフルを止めた'
          });
        }
        if (item.choices.some(function (c) { return c.dtype && c.dtype.unknown; })) {
          state.issues.push({ kind: 'dtype-unknown', id: id, detail: '語彙表に無い誤答型がある' });
        }
        state.items.push(item);
        state.byId.set(item.id, item);
      }
      state.items = stableSort(state.items, itemOrder);

      /* 学習目標（48件）と節（11件）。在庫が無いものも必ず返す（SPEC §6.6 / §8.1）。 */
      state.syllabusMeta = isObj(syllabusRaw) ? { version: syllabusRaw.version || null, exam: syllabusRaw.exam || null } : null;
      var los = [], secs = [], secIndex = {};
      var chapters = (isObj(syllabusRaw) && isArr(syllabusRaw.chapters)) ? syllabusRaw.chapters : [];
      if (chapters.length) {
        for (var ci = 0; ci < chapters.length; ci++) {
          var ch = chapters[ci];
          var sections = isArr(ch.sections) ? ch.sections : [];
          for (var si = 0; si < sections.length; si++) {
            var sec = sections[si];
            var srow = { no: String(sec.no), title: sec.title || '', chapter: ch.no, chapterTitle: ch.title || '', itemIds: [] };
            secs.push(srow); secIndex[srow.no] = srow;
            var lolist = isArr(sec.los) ? sec.los : [];
            for (var li = 0; li < lolist.length; li++) {
              var lo = lolist[li];
              los.push({
                code: lo.code, k: lo.k, text: lo.text || '',
                chapter: ch.no, chapterTitle: ch.title || '',
                section: String(sec.no), sectionTitle: sec.title || '',
                itemIds: []
              });
            }
          }
        }
      } else if (isArr(syllabusRaw && syllabusRaw.los)) {
        // build_app.py の load_syllabus() が平らにした形も受ける
        for (var fi = 0; fi < syllabusRaw.los.length; fi++) {
          var flo = syllabusRaw.los[fi];
          los.push({
            code: flo.code, k: flo.k, text: flo.text || '',
            chapter: flo.chapter, chapterTitle: flo.chapterTitle || '',
            section: String(flo.section), sectionTitle: flo.sectionTitle || '',
            itemIds: []
          });
          if (!secIndex[String(flo.section)]) {
            var s2 = { no: String(flo.section), title: flo.sectionTitle || '', chapter: flo.chapter, chapterTitle: flo.chapterTitle || '', itemIds: [] };
            secs.push(s2); secIndex[s2.no] = s2;
          }
        }
      }
      var loIndex = {};
      for (var x = 0; x < los.length; x++) loIndex[los[x].code] = los[x];
      for (var y = 0; y < state.items.length; y++) {
        var it = state.items[y];
        if (loIndex[it.lo]) loIndex[it.lo].itemIds.push(it.id);
        else state.issues.push({ kind: 'lo-missing', id: it.id, detail: 'altm-syllabus に無い lo: ' + it.lo });
        if (secIndex[String(it.section)]) secIndex[String(it.section)].itemIds.push(it.id);
        else state.issues.push({ kind: 'section-missing', id: it.id, detail: 'altm-syllabus に無い節: ' + it.section });
      }
      state.los = los;
      state.sections = secs;

      /* クラスタ（同じ論点の別バリアント） */
      state.clusters = new Map();
      for (var z = 0; z < state.items.length; z++) {
        var itc = state.items[z];
        var key = itc.cluster || ('(' + itc.lo + ')');
        if (!state.clusters.has(key)) state.clusters.set(key, []);
        state.clusters.get(key).push(itc);
      }
      state.clusters.forEach(function (list) {
        list.sort(function (p, q2) { return (p.variant - q2.variant) || cmpStr(p.id, q2.id); });
      });

      /* 模試のセット */
      state.sets = (isObj(setsRaw) && isObj(setsRaw.sets)) ? setsRaw.sets : {};
      state.examMeta = isObj(setsRaw) ? { target: setsRaw.target || null } : null;
      var names = Object.keys(state.sets);
      for (var ni = 0; ni < names.length; ni++) {
        var nm = names[ni], ids = state.sets[nm];
        if (!isArr(ids)) continue;
        var clus = {};
        for (var ii = 0; ii < ids.length; ii++) {
          if (!state.byId.has(ids[ii])) {
            state.issues.push({ kind: 'examset-missing', id: ids[ii], detail: nm + ' が指す問題が無い' });
            continue;
          }
          var cl = state.byId.get(ids[ii]).cluster;
          // 予備（spare）は「同じクラスタの余り」なので重複が正しい（SPEC §5.1）
          if (nm !== 'spare' && clus[cl]) state.issues.push({ kind: 'examset-cluster-dup', id: ids[ii], detail: nm + ' に同一クラスタが2問以上（' + cl + '）' });
          clus[cl] = true;
        }
        if (nm !== 'spare') {
          var target = EXAM.profiles[nm] ? EXAM.profiles[nm].targetByK : null;
          if (target) {
            var got = { 2: 0, 3: 0, 4: 0 };
            for (var gi = 0; gi < ids.length; gi++) {
              var gitem = state.byId.get(ids[gi]);
              if (gitem) got[gitem.k] = (got[gitem.k] || 0) + 1;
            }
            if (got[2] !== target[2] || got[3] !== target[3] || got[4] !== target[4]) {
              state.issues.push({
                kind: 'examset-k', id: nm,
                detail: 'K 配分が目標と違う（K2 ' + got[2] + ' / K3 ' + got[3] + ' / K4 ' + got[4] + '）'
              });
            }
          }
        }
      }
      var inSet = {};
      Object.keys(state.sets).forEach(function (nm2) {
        if (isArr(state.sets[nm2])) state.sets[nm2].forEach(function (id2) { inSet[id2] = true; });
      });
      for (var oi = 0; oi < state.items.length; oi++) {
        if (!inSet[state.items[oi].id]) state.issues.push({ kind: 'no-set', id: state.items[oi].id, detail: 'どのセットにも属さない' });
      }

      /* 生データへの到達経路を消す（DESIGN §1.4） */
      for (var nI = 0; nI < nodes.length; nI++) {
        var nd = nodes[nI];
        try { if (nd && nd.parentNode) nd.parentNode.removeChild(nd); } catch (e2) { /* 無視 */ }
      }

      state.booted = true;
      return {
        items: state.items.length,
        quarantined: state.quarantine.slice(),
        los: state.los.length,
        sections: state.sections.length,
        sets: Object.keys(state.sets).length,
        issues: state.issues.slice()
      };
    }

    function all() { return state.items.slice(); }
    function get(id) { return state.byId && state.byId.has(id) ? state.byId.get(id) : null; }
    function has(id) { return !!(state.byId && state.byId.has(id)); }
    function explain(id) { return get(id); }   // Phase 1 は全部入り（DESIGN §2.10）
    function los() { return state.los.map(function (l) { return { code: l.code, k: l.k, text: l.text, chapter: l.chapter, chapterTitle: l.chapterTitle, section: l.section, sectionTitle: l.sectionTitle, itemIds: l.itemIds.slice() }; }); }
    function sections() { return state.sections.map(function (s) { return { no: s.no, title: s.title, chapter: s.chapter, chapterTitle: s.chapterTitle, itemIds: s.itemIds.slice() }; }); }
    function clusters() { return state.clusters || new Map(); }
    function quarantined() { return state.quarantine.slice(); }
    function integrity() { return state.issues.slice(); }
    function syllabusMeta() { return state.syllabusMeta; }

    function examSet(profile) {
      var ids = state.sets[profile];
      if (!isArr(ids)) return null;
      var out = [];
      for (var i = 0; i < ids.length; i++) {
        var it = get(ids[i]);
        if (it) out.push(it);      // 欠けた id は integrity() に出ている
      }
      return out;
    }
    function examProfiles() {
      return Object.keys(state.sets).filter(function (n) { return n !== 'spare'; });
    }
    /* SPEC §5。フル模試は在庫が2回ぶんに届くまで開放しない。 */
    function fullUnlocked() {
      var c = { 2: 0, 3: 0, 4: 0 };
      for (var i = 0; i < state.items.length; i++) c[state.items[i].k] = (c[state.items[i].k] || 0) + 1;
      return c[2] >= EXAM.fullUnlockStock[2] && c[3] >= EXAM.fullUnlockStock[3] && c[4] >= EXAM.fullUnlockStock[4];
    }

    /* 表示用。noShuffle が設定より強い（SPEC §3.1 / DESIGN §2.8）。 */
    function view(item, seed, shuffle) {
      if (!item) return null;
      var use = !!shuffle && !item.noShuffle;
      var ordered = use ? fisherYates(item.choices, rng(hash32(String(seed || item.id)))) : item.choices.slice();
      return { item: item, ordered: ordered, shuffled: use };
    }

    /* 「自分で選ぶ」の単位（SPEC §6.8 / DESIGN §2.3）。 */
    function units(kind) {
      var out = [], i, j;
      if (kind === 'dtype') {
        var byType = {};
        for (i = 0; i < DTYPE_VOCAB.length; i++) byType[DTYPE_VOCAB[i].code] = [];
        for (i = 0; i < state.items.length; i++) {
          var it = state.items[i], mains = {};
          for (j = 0; j < it.wrongIdx.length; j++) {
            var dt = it.choices[it.wrongIdx[j]].dtype;
            if (!dt) continue;
            for (var m = 0; m < dt.mains.length; m++) mains[dt.mains[m]] = true;
          }
          Object.keys(mains).forEach(function (code) { if (byType[code]) byType[code].push(it.id); });
        }
        for (i = 0; i < DTYPE_VOCAB.length; i++) {
          out.push({
            kind: 'dtype', key: DTYPE_VOCAB[i].code,
            label: DTYPE_VOCAB[i].code + ' ' + DTYPE_VOCAB[i].name,
            name: DTYPE_VOCAB[i].name,
            itemIds: byType[DTYPE_VOCAB[i].code].slice()
          });
        }
        return out;
      }
      if (kind === 'section') {
        var secs = sections();
        for (i = 0; i < secs.length; i++) {
          out.push({ kind: 'section', key: secs[i].no, label: secs[i].no + ' ' + secs[i].title, chapter: secs[i].chapter, itemIds: secs[i].itemIds });
        }
        return out;
      }
      if (kind === 'chapter') {
        var byCh = {}, order = [];
        var secs2 = sections();
        for (i = 0; i < secs2.length; i++) {
          var c = secs2[i].chapter;
          if (!byCh[c]) { byCh[c] = { kind: 'chapter', key: String(c), label: '章' + c + ' ' + (secs2[i].chapterTitle || ''), itemIds: [] }; order.push(c); }
          byCh[c].itemIds = byCh[c].itemIds.concat(secs2[i].itemIds);
        }
        for (i = 0; i < order.length; i++) out.push(byCh[order[i]]);
        return out;
      }
      if (kind === 'lo') {
        var ls = los();
        for (i = 0; i < ls.length; i++) {
          out.push({ kind: 'lo', key: ls[i].code, label: ls[i].code + ' ' + ls[i].text, k: ls[i].k, itemIds: ls[i].itemIds });
        }
        return out;
      }
      return out;
    }

    return {
      boot: boot, all: all, get: get, has: has, explain: explain,
      los: los, sections: sections, clusters: clusters,
      examSet: examSet, examProfiles: examProfiles, fullUnlocked: fullUnlocked,
      view: view, units: units, integrity: integrity, quarantined: quarantined,
      syllabusMeta: syllabusMeta,
      get booted() { return state.booted; }
    };
  })();

  /* ===================================================================
   * 4.5 出す順（SPEC §7.1 の「並べ替え」は“選び方”の話。ここは“見せ方”）
   *
   * 「どの問題を選ぶか」は Sched.pick が決定論で決める（乱数を入れると被覆枠の保証が
   * 測れなくなる）。★変えるのは選んだあとの並びだけ。
   *
   *   - 種はセッションに紐づく（selected choices と同じ考え方：Bank.view は sessionId|itemId）
   *   - 同じ種なら同じ順。順はセッションの itemIds に焼き付けるので、中断して再開しても
   *     「3問目」は同じ問題のまま（記録と食い違わない）
   *   - ただ散らすだけだと偶然かたまるので、同じ学習目標・同じ節が隣り合いにくいように
   *     貪欲に選び直す。まとめ練習より交互練習のほうが定着が良いことが知られていて、
   *     節を順に潰す並びはその弱いほうにあたる。5問しかない回で完全な分散は無理なので
   *     「できる範囲で離す」に留める。
   * =================================================================== */

  function orderForSession(ids, seed) {
    if (!isArr(ids) || ids.length <= 1) return (ids || []).slice();
    var pool = fisherYates(ids, rng(hash32(String(seed === undefined || seed === null ? '' : seed))));
    var out = [], prevLo = null, prevSec = null;
    while (pool.length) {
      var at = 0, best = -1;
      for (var i = 0; i < pool.length; i++) {
        var it = Bank.get(pool[i]);
        var lo = it ? it.lo : null;
        var sec = it ? String(it.section) : null;
        var score = 0;
        if (lo === null || lo !== prevLo) score += 2;     // 学習目標が変わるほうを強く好む
        if (sec === null || sec !== prevSec) score += 1;  // 節も変わればなお良い
        if (score > best) { best = score; at = i; if (score === 3) break; }
      }
      var id = pool.splice(at, 1)[0];
      var item = Bank.get(id);
      prevLo = item ? item.lo : null;
      prevSec = item ? String(item.section) : null;
      out.push(id);
    }
    return out;
  }

  /* ===================================================================
   * 5. Rec（記録の素材づくり。派生値は作らない）
   * =================================================================== */

  var Rec = (function () {

    function blank() {
      return {
        schema: SCHEMA,
        app: APP_ID,
        savedAt: null,
        attempts: [],
        sessions: [],
        settings: clone(DEFAULT_SETTINGS)
      };
    }

    function nextId(rec, kind) {
      var list = kind === 'session' ? rec.sessions : rec.attempts;
      var prefix = kind === 'session' ? 's-' : 'a-';
      var max = 0;
      for (var i = 0; i < list.length; i++) {
        var id = String(list[i] && list[i].id || '');
        if (id.indexOf(prefix) === 0) {
          var n = parseInt(id.slice(prefix.length), 10);
          if (!isNaN(n) && n > max) max = n;
        }
      }
      var num = String(max + 1);
      while (num.length < (kind === 'session' ? 4 : 6)) num = '0' + num;
      return prefix + num;
    }

    /* SPEC §4.4 / §4.6。白紙は chosen 空・correct null・unanswered true。 */
    function makeAttempt(o) {
      var unanswered = o.unanswered === true || !isArr(o.chosen) || o.chosen.length === 0;
      var a = {
        id: o.id,
        itemId: o.itemId,
        sessionId: o.sessionId,
        mode: o.mode || 'practice',
        chosen: unanswered ? [] : o.chosen.slice().sort(function (x, y) { return x - y; }),
        correct: unanswered ? null : !!o.correct,
        ms: isNum(o.ms) ? o.ms : 0,
        at: isStr(o.at) ? o.at : isoOf(nowMs(o.now))
      };
      if (unanswered) a.unanswered = true;
      // SPEC §4.4 / §8.4。解説画面に到達したかどうかの事実。初見はこの欄が消費する。
      a.seenExplanation = o.seenExplanation === true;
      if (o.review === true) a.review = true;
      return a;
    }

    function makeSession(o) {
      return {
        id: o.id,
        mode: o.mode || 'practice',
        profile: o.profile || null,
        // SPEC §4.4。その回が何で絞られたかの事実。表示文字列は持たない（門 A-T8）
        filter: Filter.normalize(o.filter),
        /* ★出す順はここで確定して焼き付ける（§4.5 の orderForSession）。
         * 種はこのセッションの id なので、再開しても同じ順に戻る。
         * o.order === false を渡せば渡された順のまま（模試の固定セットを素で使いたいとき）。 */
        itemIds: o.order === false ? (o.itemIds || []).slice() : orderForSession(o.itemIds || [], o.id),
        cursor: 0,
        answers: {},
        flagged: [],
        spentMs: {},
        opts: {
          explainMode: (o.opts && o.opts.explainMode) || DEFAULT_SETTINGS.explainMode,
          shuffleChoices: o.opts && isBool(o.opts.shuffleChoices) ? o.opts.shuffleChoices : DEFAULT_SETTINGS.shuffleChoices
        },
        startedAt: isStr(o.startedAt) ? o.startedAt : isoOf(nowMs(o.now)),
        endedAt: null,
        remainingMs: isNum(o.remainingMs) ? o.remainingMs : null,
        state: 'active'
      };
    }

    /* SPEC §4.7 の不変条件を先に確かめてから積む。 */
    function appendAttempt(draft, attempt) {
      for (var i = 0; i < draft.attempts.length; i++) {
        var a = draft.attempts[i];
        if (a.sessionId === attempt.sessionId && a.itemId === attempt.itemId) {
          var err = new Error('同一セッション×同一問題の試行が既にある: ' + attempt.sessionId + ' / ' + attempt.itemId);
          err.code = 'DUP_ATTEMPT';
          throw err;
        }
      }
      draft.attempts.push(attempt);
      return attempt;
    }

    function findSession(rec, id) {
      for (var i = 0; i < rec.sessions.length; i++) if (rec.sessions[i].id === id) return rec.sessions[i];
      return null;
    }

    /* 解説画面に到達した事実を記録する（SPEC §4.4 / §8.4・門 F-T5）。
     * 試行の追加ではないので門 A-T6 に触れない。 */
    function markSeen(draft, sessionId, itemId) {
      for (var i = 0; i < draft.attempts.length; i++) {
        var a = draft.attempts[i];
        if (a.sessionId === sessionId && a.itemId === itemId) { a.seenExplanation = true; return a; }
      }
      return null;
    }

    /* 「あとで復習する」の印（SPEC §4.4 / §6.3）。最新の試行のフラグが有効なので、
     * 新しい試行を作らずに、その問題の最後の試行の review を書き換える。
     * 試行の追加ではないので門 A-T6 に触れない。 */
    function setReview(draft, itemId, value) {
      var target = null, best = -Infinity;
      for (var i = 0; i < draft.attempts.length; i++) {
        var a = draft.attempts[i];
        if (a.itemId !== itemId) continue;
        var t = safeTs(a.at);
        if (t >= best) { best = t; target = a; }
      }
      if (!target) return null;
      if (value === true) target.review = true;
      else delete target.review;
      return target;
    }

    /* 未完了セッションは模試1つ＋演習1つまで（SPEC §9）。
     * mode:"practice" と mode:"review" は同じ演習枠。 */
    function activeSessions(rec) {
      var out = { practice: null, exam: null };
      var list = rec && rec.sessions ? rec.sessions : [];
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (s.state !== 'active') continue;
        var slot = s.mode === 'exam' ? 'exam' : 'practice';
        if (!out[slot] || safeTs(s.startedAt) >= safeTs(out[slot].startedAt)) out[slot] = s;
      }
      return out;
    }

    /* 復帰位置は cursor ではなく answers が決める（SPEC §4.7 / DESIGN §3.3）。 */
    function resumeIndex(sess) {
      for (var i = 0; i < sess.itemIds.length; i++) {
        if (!Object.prototype.hasOwnProperty.call(sess.answers || {}, sess.itemIds[i])) return { done: false, index: i };
      }
      return { done: true, index: sess.itemIds.length };
    }

    return {
      blank: blank, nextId: nextId, makeAttempt: makeAttempt, makeSession: makeSession,
      appendAttempt: appendAttempt, findSession: findSession, resumeIndex: resumeIndex,
      setReview: setReview, activeSessions: activeSessions, markSeen: markSeen,
      SCHEMA: SCHEMA, DEFAULT_SETTINGS: clone(DEFAULT_SETTINGS)
    };
  })();

  /* ===================================================================
   * 6. Store（SPEC §3 制約3・§4.4〜§4.7）
   *
   * 公開は get / set / clear / export / import / status の6本。
   * load と commitImport は DESIGN §4.2 が挙げている補助で、いずれも
   * 同じ層の中にある（保存 I/O はこのファイルのこの節にしか無い）。
   * =================================================================== */

  var Store = (function () {

    var mem = null;
    var lastRaw = null;          // 最後に読んだ／書いた生の文字列。他のタブの書き込みを見分ける
    var subs = [];               // 記録が外から変わったことの通知先（I/O ではない）
    var externalReloads = 0;
    var unwatch = null;
    var loaded = false;
    var frozen = false;          // 自分より新しい schema を読んだ（SPEC §4.5）
    var writable = true;
    var lastError = null;
    var lastCode = null;
    var bytes = 0;
    var report = null;
    var extraKeys = [];          // 読み込んだ未知のトップレベルキー（前方互換）

    var TOP_KEYS = ['schema', 'app', 'savedAt', 'attempts', 'sessions', 'settings'];
    var ATTEMPT_KEYS = ['id', 'itemId', 'sessionId', 'mode', 'chosen', 'correct', 'unanswered', 'review', 'seenExplanation', 'ms', 'at'];
    var SESSION_KEYS = ['id', 'mode', 'profile', 'filter', 'itemIds', 'cursor', 'answers', 'flagged', 'spentMs', 'opts', 'startedAt', 'endedAt', 'remainingMs', 'state'];

    /* --- 検証（SPEC §4.4 / DESIGN §4.4 の14段） --- */
    function validate(obj) {
      var warnings = [], errors = [];
      if (!isObj(obj)) return { ok: false, errors: ['記録がオブジェクトでない'], warnings: warnings, value: null };
      /* SPEC §4.5。`app` 欄の「値が違う」と「欠落」は別物。
       *   値が違う → 別のアプリの記録。読まない。
       *   欠落     → 第1版より前の自分の記録。app を打つのは migrate(0→1) の仕事なので、
       *              ここで弾くと up0to1 が死にコードになり、読めるはずの記録が
       *              「壊れている」として .broken に落ちる（門 A-T2）。
       * 欠落を通すのは「旧版の記録の形をしているとき」だけに絞る。
       * そうしないと、app を持たない他アプリの JSON を取り込む穴になる。 */
      if (obj.app !== undefined && obj.app !== null) {
        if (obj.app !== APP_ID) {
          return { ok: false, errors: ['別のアプリの記録（app=' + String(obj.app) + '）'], warnings: warnings, value: null };
        }
      } else {
        var looksLegacy = Number.isInteger(obj.schema) && obj.schema < SCHEMA &&
          (isArr(obj.attempts) || isArr(obj.sessions));
        if (!looksLegacy) {
          return { ok: false, errors: ['このアプリの記録ではない（app 欄が無く、旧版の記録の形でもない）'], warnings: warnings, value: null };
        }
        warnings.push('app 欄の無い旧版の記録として読み込んだ');
      }
      if (!Number.isInteger(obj.schema)) return { ok: false, errors: ['schema が整数でない'], warnings: warnings, value: null };
      if (obj.schema > SCHEMA) {
        return { ok: false, newer: true, errors: ['この記録は新しい版（schema ' + obj.schema + '）で作られている。アプリを新しくしてから読み込むこと'], warnings: warnings, value: null };
      }
      var o = clone(obj);
      o = migrate(o);

      if (!isArr(o.attempts)) { o.attempts = []; warnings.push('attempts が配列でないので空にした'); }
      if (!isArr(o.sessions)) { o.sessions = []; warnings.push('sessions が配列でないので空にした'); }
      if (!isObj(o.settings)) { o.settings = {}; warnings.push('settings がオブジェクトでないので既定にした'); }

      var st = clone(DEFAULT_SETTINGS);
      Object.keys(DEFAULT_SETTINGS).forEach(function (k) {
        if (o.settings[k] !== undefined && o.settings[k] !== null) st[k] = o.settings[k];
        else if (k === 'lastExportAt') st[k] = o.settings[k] === undefined ? null : o.settings[k];
      });
      if (st.explainMode !== 'batch' && st.explainMode !== 'immediate') { st.explainMode = 'batch'; warnings.push('explainMode が不正なので batch にした'); }
      if (!isBool(st.shuffleChoices)) { st.shuffleChoices = true; warnings.push('shuffleChoices が不正なので ON にした'); }
      // SPEC §7.0。段（5/10/15/20/25）以外は、数なら最も近い段へ、数でなければ既定へ倒す
      if (!isNum(st.count)) {
        if (o.settings.count !== undefined && o.settings.count !== null) {
          warnings.push('1回の問題数が数でないので既定（' + DEFAULT_SETTINGS.count + '問）にした');
        }
        st.count = DEFAULT_SETTINGS.count;
      } else if (COUNT_STEPS.indexOf(st.count) < 0) {
        var want = st.count, near = COUNT_STEPS[0];
        for (var ci = 1; ci < COUNT_STEPS.length; ci++) {
          if (Math.abs(COUNT_STEPS[ci] - want) < Math.abs(near - want)) near = COUNT_STEPS[ci];
        }
        warnings.push('1回の問題数 ' + want + ' は段に無いので ' + near + '問に寄せた');
        st.count = near;
      }
      if (!isNum(st.minSecondsPerItem) || st.minSecondsPerItem < 0) { st.minSecondsPerItem = 5; warnings.push('minSecondsPerItem が不正なので5秒にした'); }
      else if (st.minSecondsPerItem > MAX_MIN_SECONDS) {
        // 上限を越えると全試行が外れ値になり、記録があるのに「未着手」と出る（§8.1 の語を壊す）
        warnings.push('外れ値のしきい値 ' + st.minSecondsPerItem + ' 秒を上限 ' + MAX_MIN_SECONDS + ' 秒に丸めた');
        st.minSecondsPerItem = MAX_MIN_SECONDS;
      }
      o.settings = st;

      var sessIds = {};
      var sessions = [];
      for (var i = 0; i < o.sessions.length; i++) {
        var s = o.sessions[i];
        if (!isObj(s) || !isStr(s.id)) { warnings.push('セッション1件を落とした（id が無い）'); continue; }
        if (sessIds[s.id]) { warnings.push('セッション id の重複を落とした: ' + s.id); continue; }
        sessIds[s.id] = true;
        if (!isArr(s.itemIds)) s.itemIds = [];
        if (!isObj(s.answers)) s.answers = {};
        // answers の値は choices への0始まりの添字の配列（SPEC §4.4）。
        // 形が違うまま復帰すると、肢を1つ押した瞬間に画面が落ちる
        (function (sess) {
          var keys = Object.keys(sess.answers), dropped = 0;
          for (var ai = 0; ai < keys.length; ai++) {
            var v = sess.answers[keys[ai]], okv = isArr(v);
            if (okv) {
              for (var vi = 0; vi < v.length; vi++) {
                if (!(isNum(v[vi]) && v[vi] >= 0 && v[vi] === Math.floor(v[vi]))) { okv = false; break; }
              }
            }
            if (!okv) { delete sess.answers[keys[ai]]; dropped++; }
          }
          if (dropped) warnings.push('セッション ' + sess.id + ' の answers から、添字の配列でない値を ' + dropped + ' 件外した');
        })(s);
        for (var fi2 = (s.flagged || []).length - 1; fi2 >= 0; fi2--) {
          if (!isStr(s.flagged[fi2])) s.flagged.splice(fi2, 1);
        }
        if (s.remainingMs !== null && s.remainingMs !== undefined && !isNum(s.remainingMs)) s.remainingMs = null;
        if (!isArr(s.flagged)) s.flagged = [];
        if (!isObj(s.spentMs)) { s.spentMs = {}; }
        if (s.state !== 'active' && s.state !== 'done' && s.state !== 'discarded') {
          warnings.push('セッション ' + s.id + ' の state が不明なので done として読んだ');
          s.state = 'done';
        }
        if (!isObj(s.opts)) {
          // ★ 現在の設定ではなく既定値で読む（SPEC §4.4）
          s.opts = { explainMode: DEFAULT_SETTINGS.explainMode, shuffleChoices: DEFAULT_SETTINGS.shuffleChoices };
          warnings.push('セッション ' + s.id + ' の opts が無いので既定値（batch / シャッフルON）で読んだ');
        } else {
          if (s.opts.explainMode !== 'batch' && s.opts.explainMode !== 'immediate') s.opts.explainMode = DEFAULT_SETTINGS.explainMode;
          if (!isBool(s.opts.shuffleChoices)) s.opts.shuffleChoices = DEFAULT_SETTINGS.shuffleChoices;
        }
        if (!isNum(s.cursor) || s.cursor < 0) s.cursor = 0;
        ['startedAt', 'endedAt'].forEach(function (key) {
          if (s[key] === null || s[key] === undefined) { s[key] = null; return; }
          var si = parseAtInfo(s[key]);
          if (!isNaN(si.ts) && si.repaired) s[key] = isoOf(si.ts);
        });
        // SPEC §4.4。絞り込みは「範囲」だけを構造で持つ。
        // 古い形（filter.kind が exam / review）は mode / profile へ寄せてから null にする。
        if (s.filter !== null && s.filter !== undefined) {
          if (Filter.coerceLegacy(s)) {
            warnings.push('セッション ' + s.id + ' の古い filter を mode / profile へ寄せた');
          } else {
            var nf = Filter.normalize(s.filter);
            if (!nf) warnings.push('セッション ' + s.id + ' の filter が知らない形なので null にした');
            s.filter = nf;
          }
        } else {
          s.filter = null;
        }
        if (s.mode !== 'exam') s.profile = null;   // profile は mode==="exam" のときだけ
        if (s.mode !== 'practice' && s.mode !== 'exam' && s.mode !== 'review') {
          warnings.push('セッション ' + s.id + ' の mode が不明なので practice として読んだ');
          s.mode = 'practice';
        }
        sessions.push(s);
      }
      o.sessions = sessions;

      var attempts = [], pair = {}, dup = 0, attIds = {}, badAt = 0, repairedAt = 0;
      for (var j = 0; j < o.attempts.length; j++) {
        var a = o.attempts[j];
        if (!isObj(a) || !isStr(a.itemId) || !isStr(a.sessionId)) { warnings.push('試行1件を落とした（itemId/sessionId が無い）'); continue; }
        if (!isStr(a.id) || a.id === '') a.id = 'a-auto-' + j;
        if (attIds[a.id]) a.id = a.id + '-' + j;
        attIds[a.id] = true;
        if (a.mode !== 'practice' && a.mode !== 'exam' && a.mode !== 'review') a.mode = 'practice';
        if (!isArr(a.chosen)) a.chosen = [];
        var badChoice = false;
        for (var c = 0; c < a.chosen.length; c++) {
          if (!(isNum(a.chosen[c]) && a.chosen[c] >= 0 && a.chosen[c] === Math.floor(a.chosen[c]))) badChoice = true;
        }
        if (badChoice) { warnings.push('試行1件を落とした（chosen が0始まりの添字でない）: ' + a.id); continue; }
        /* ★at が読めなくても試行を落とさない（数か月ぶんの履歴が消えるのが最悪の障害）。
         * スペース区切り（2026-09-13 10:00）や epoch ミリ秒のような揺れは寄せて読み、
         * 正規形に書き直して warnings に出す。どうしても読めないものは、そのまま残して
         * 集計側で「日時不明」として除外し、件数を出す（§4.4「黙って消さない」）。 */
        var info = parseAtInfo(a.at);
        if (isNaN(info.ts)) {
          badAt++;
        } else if (info.repaired) {
          a.at = isoOf(info.ts);
          repairedAt++;
        }
        if (!isNum(a.ms) || a.ms < 0) a.ms = 0;
        if (a.review !== undefined && !isBool(a.review)) { warnings.push('試行1件を落とした（review が真偽値でない）: ' + a.id); continue; }
        // SPEC §4.4。seenExplanation が無い古い記録は true として読む
        // （false と読むと過去の解答が全部「初見を使っていない」ことになり、初見の母数が二重に膨らむ）
        if (a.seenExplanation === undefined || a.seenExplanation === null) a.seenExplanation = true;
        else if (!isBool(a.seenExplanation)) { a.seenExplanation = true; warnings.push('seenExplanation が真偽値でないので true にした: ' + a.id); }
        // SPEC §4.6 の形の強制
        var blank = a.unanswered === true || a.chosen.length === 0;
        if (blank) {
          if (a.chosen.length !== 0 || a.correct !== null) warnings.push('白紙の形を正規化した: ' + a.id);
          a.unanswered = true; a.chosen = []; a.correct = null;
        } else {
          if (a.unanswered === true) { warnings.push('白紙の形を正規化した: ' + a.id); }
          delete a.unanswered;
          if (!isBool(a.correct)) { a.correct = false; warnings.push('correct が真偽値でないので false にした: ' + a.id); }
        }
        var key = a.sessionId + SEP + a.itemId;
        if (pair[key]) {
          // SPEC §4.7。消さない。at が最も古い1件だけを集計に載せる（Stats.base の段3）
          dup++;
        } else {
          pair[key] = true;
        }
        if (!sessIds[a.sessionId]) { /* 親セッションが無い。落とさない */ }
        attempts.push(a);
      }
      if (repairedAt) warnings.push('at の書式を正規形に寄せた試行が ' + repairedAt + ' 件ある（スペース区切りなど）');
      if (badAt) warnings.push('at が日時として読めない試行が ' + badAt + ' 件ある。記録は残すが、集計からは除く');
      // at 昇順に整えてから重複の「2件目以降」を決められるようにする。
      // 読めないものは safeTs が「最古」に置くので、順序が不定にならない。
      o.attempts = stableSort(attempts, function (x, y) { return safeTs(x.at) - safeTs(y.at); });
      if (dup > 0) warnings.push('同一セッション×同一問題の試行が ' + dup + ' 件ある。古い1件だけを集計に使う（SPEC §4.7）');

      var orphanSess = 0;
      for (var k2 = 0; k2 < o.attempts.length; k2++) if (!sessIds[o.attempts[k2].sessionId]) orphanSess++;
      if (orphanSess) warnings.push('親セッションの無い試行が ' + orphanSess + ' 件ある（集計には使う）');

      extraKeys = Object.keys(o).filter(function (k) { return TOP_KEYS.indexOf(k) < 0; });
      if (extraKeys.length) warnings.push('知らない項目を保持した: ' + extraKeys.join(', '));

      return { ok: true, errors: errors, warnings: warnings, value: o, dup: dup };
    }

    /* SPEC §4.5。前方向のみ・表駆動。 */
    function migrate(o) {
      if (o.schema === null || o.schema === undefined) o.schema = 0;
      while (o.schema < SCHEMA) {
        if (o.schema === 0) { o = up0to1(o); }
        else break;
        o.schema += 1;
      }
      return o;
    }
    function up0to1(o) {
      if (!isArr(o.attempts)) o.attempts = [];
      if (!isArr(o.sessions)) o.sessions = [];
      if (!isObj(o.settings)) o.settings = {};
      o.app = APP_ID;
      // filter が exam / review を持っていた記録を mode / profile へ寄せる
      for (var i = 0; i < o.sessions.length; i++) {
        if (isObj(o.sessions[i])) Filter.coerceLegacy(o.sessions[i]);
      }
      return o;
    }

    /* 派生値を保存しないための射影（DESIGN §4.7）。 */
    function project(o) {
      var out = {};
      for (var i = 0; i < TOP_KEYS.length; i++) if (o[TOP_KEYS[i]] !== undefined) out[TOP_KEYS[i]] = o[TOP_KEYS[i]];
      for (var e = 0; e < extraKeys.length; e++) if (o[extraKeys[e]] !== undefined) out[extraKeys[e]] = o[extraKeys[e]];
      out.schema = SCHEMA;
      out.app = APP_ID;
      out.attempts = (o.attempts || []).map(function (a) { return pick(a, ATTEMPT_KEYS); });
      uniquifyIds(out.attempts);
      out.sessions = (o.sessions || []).map(function (s) {
        var t = pick(s, SESSION_KEYS);
        t.opts = t.opts ? pick(t.opts, ['explainMode', 'shuffleChoices']) : { explainMode: 'batch', shuffleChoices: true };
        return t;
      });
      out.settings = pick(o.settings || {}, Object.keys(DEFAULT_SETTINGS));
      return out;
    }
    function pick(o, keys) {
      var t = {};
      for (var i = 0; i < keys.length; i++) if (o[keys[i]] !== undefined) t[keys[i]] = o[keys[i]];
      return t;
    }

    function pairCounts(list) {
      var c = {};
      for (var i = 0; i < (list || []).length; i++) {
        var key = list[i].sessionId + SEP + list[i].itemId;
        c[key] = (c[key] || 0) + 1;
      }
      return c;
    }

    /* SPEC §4.7 の不変条件を書き込み経路で強制する（門 A-T6）。
     *
     * ★弾くのは「この書き込みで新たに作られた重複」だけ。
     *   §4.4 段12 と validate() は、既にある重複を “持ったまま読む”（消さずに集計から外す）と
     *   定めている。ここで一律に投げると、その記録を持つ利用者は以後1件も保存できなくなり、
     *   1日解いても何も残らない。不変条件の目的は「新たに2件目を書かせない」ことであって、
     *   「既にある記録を読めなくする」ことではない。2つの守りを validate 側に揃えた。
     */
    function assertNoDupAttempt(draft, baseline) {
      var base = pairCounts(baseline);
      var got = pairCounts(draft.attempts);
      var keys = Object.keys(got);
      for (var i = 0; i < keys.length; i++) {
        if (got[keys[i]] > 1 && got[keys[i]] > (base[keys[i]] || 0)) {
          var parts = keys[i].split(SEP);
          var err = new Error('同一セッション×同一問題の試行を新たに作ろうとした: ' + parts[0] + ' / ' + parts[1]);
          err.code = 'DUP_ATTEMPT';
          throw err;
        }
      }
    }

    /* 試行 id の重複を直す。2つのタブが同時に a-000001 を採番しても記録を壊さない。 */
    function uniquifyIds(list) {
      var seen = {}, n = 0;
      for (var i = 0; i < list.length; i++) {
        var id = list[i].id;
        if (!isStr(id) || id === '') id = 'a-auto-' + i;
        if (seen[id]) { id = id + '~' + i; n++; }
        seen[id] = true;
        list[i].id = id;
      }
      return n;
    }

    /* --- 読み込み（起動時1回。get() が自動で呼ぶ） --- */
    function load() {
      if (loaded) return { rec: mem, report: report };
      loaded = true;
      extraKeys = [];
      var rep = {
        warnings: [], errors: [], migrated: false, restored: false,
        broken: false, newer: false, lost: false, probe: null
      };
      var probe = Platform.probe();
      rep.probe = probe;
      if (!probe.ok) {
        writable = false;
        lastCode = probe.code;
        lastError = probe.error;
        rep.warnings.push('この環境では記録を保存できない（' + (probe.code || 'unknown') + '）。書き出しは使える');
      }
      if (!unwatch) unwatch = Platform.onExternalChange(onStorage);
      var text = Platform.read(STORE_KEYS.records);
      lastRaw = text;
      var probeText = Platform.read(STORE_KEYS.probe);
      if ((text === null || text === '') && probeText) {
        // 記録だけが消えている（iOS の7日削除・サイトデータ削除）
        rep.lost = true;
        var pinfo = null;
        try { pinfo = JSON.parse(probeText); } catch (e) { pinfo = null; }
        rep.lostInfo = pinfo;
        rep.warnings.push('以前あった記録が見つからない' + (pinfo && isNum(pinfo.attempts) ? '（試行 ' + pinfo.attempts + ' 件ぶん）' : ''));
      }
      if (text === null || text === '') {
        mem = Rec.blank();
        report = rep;
        bytes = 0;
        return { rec: mem, report: rep };
      }
      var obj = null;
      try {
        obj = JSON.parse(text);
      } catch (e) {
        rep.broken = true;
        rep.errors.push('記録が壊れていて読めない: ' + ((e && e.message) || e));
        Platform.write(STORE_KEYS.broken, text);   // 退避。捨てない
        mem = Rec.blank();
        report = rep;
        return { rec: mem, report: rep };
      }
      var fromSchema = isObj(obj) ? obj.schema : null;
      var v = validate(obj);
      if (!v.ok) {
        if (v.newer) { frozen = true; rep.newer = true; }
        else { rep.broken = true; Platform.write(STORE_KEYS.broken, text); }
        rep.errors = rep.errors.concat(v.errors);
        mem = Rec.blank();
        report = rep;
        return { rec: mem, report: rep };
      }
      if (isNum(fromSchema) && fromSchema < SCHEMA) {
        rep.migrated = true;
        Platform.write(STORE_KEYS.bak, text);      // 移行前を1世代残す
      }
      rep.warnings = rep.warnings.concat(v.warnings);
      rep.dup = v.dup;
      mem = v.value;
      bytes = text.length;
      report = rep;
      return { rec: mem, report: rep };
    }

    /* --- 他のタブの書き込みへの追随（止1） ---
     *
     * Store は起動時に1回読むだけだったので、開きっぱなしの別タブが設定を1つ変えるだけで
     * そのタブの古い記録が丸ごと上書きされ、何か月ぶんの履歴が消えた。
     * 2段で塞ぐ。
     *   (1) storage イベントで、他の文書の書き込みを即座に取り込む（画面にも知らせる）
     *   (2) 書き込む直前に必ず読み直す —— イベントが来ない環境でも、上書きの前に気づける
     */
    function refresh() {
      if (frozen) return false;
      var text = Platform.read(STORE_KEYS.records);
      if (text === lastRaw) return false;          // 自分が最後に読んだ／書いたものと同じ
      lastRaw = text;
      if (text === null || text === '') {
        // 他のタブが全消去した
        mem = Rec.blank();
        extraKeys = [];
        bytes = 0;
        externalReloads++;
        return true;
      }
      var obj = null;
      try { obj = JSON.parse(text); } catch (e) { return false; }   // 壊れていたら自分の記録を守る
      var v = validate(obj);
      if (!v.ok) return false;
      mem = v.value;
      bytes = text.length;
      externalReloads++;
      return true;
    }

    function onStorage(key) {
      if (key !== null && key !== STORE_KEYS.records) return;
      if (refresh()) notify('external');
    }

    function notify(reason) {
      for (var i = 0; i < subs.length; i++) {
        try { subs[i](reason, mem); } catch (e) { /* 画面の都合で保存を止めない */ }
      }
    }

    /* 記録が外から変わったことの通知。記録の読み書きではないので §3 制約3 の6本に入らない
     * （受け取った側は Store.get() を呼び直す）。 */
    function subscribe(cb) {
      if (typeof cb !== 'function') return function () {};
      if (!loaded) load();
      subs.push(cb);
      return function () {
        for (var i = 0; i < subs.length; i++) if (subs[i] === cb) { subs.splice(i, 1); return; }
      };
    }

    /* --- 6本の口 --- */

    function get() {
      if (!loaded) load();
      return mem;
    }

    /* opts.replace: 記録を「差し替える」書き込み（取り込み・全消去）。
     *   - 失敗したらメモリ上も元に戻す（原子的）。差し替えは途中まで効いてはいけない
     *   - 重複の検査は validate 済みの中身をそのまま採るので通す
     * 既定（追記していく普通の保存）は SPEC §4.6 どおり、失敗してもメモリ上の記録を保つ。 */
    function set(mutator, opts) {
      if (!loaded) load();
      if (frozen) {
        return { ok: false, code: 'frozen', error: 'この記録より新しい版で作られた記録があるため、書き込みを止めている', rec: mem };
      }
      opts = opts || {};
      // ★書く前に必ず読み直す（止1）。他のタブが書いていたら、その上に自分の変更を載せる
      var reloaded = refresh();
      var before = mem;
      var beforeRaw = lastRaw;
      var draft = clone(mem);
      var ret = mutator ? mutator(draft) : draft;
      if (isObj(ret)) draft = ret;
      // ★ 新たな重複だけを弾く（SPEC §4.7 / 門 A-T6）。既にある重複は validate と同じく持ったまま
      assertNoDupAttempt(draft, opts.replace ? draft.attempts : (before ? before.attempts : []));
      var clean = project(draft);
      clean.savedAt = isoOf(Date.now());
      mem = clean;                                   // 保存に失敗してもメモリ上は保つ（§4.6）
      var text;
      try {
        text = JSON.stringify(clean);
      } catch (e) {
        if (opts.replace) { mem = before; lastRaw = beforeRaw; }
        lastError = '記録を文字列にできない'; lastCode = 'serialize';
        return { ok: false, code: 'serialize', error: lastError, rec: mem };
      }
      var w = Platform.write(STORE_KEYS.records, text);
      if (!w.ok) {
        writable = false;
        lastError = w.error; lastCode = w.code;
        // ★差し替えが保存に失敗したら、メモリ上も元に戻す（止2）。
        //   戻さないと「保存できませんでした」と言った操作が、次の保存成功で記録を全部消す。
        if (opts.replace) { mem = before; lastRaw = beforeRaw; }
        return { ok: false, code: w.code, error: w.error, rec: mem, rolledBack: opts.replace === true, reloaded: reloaded };
      }
      writable = true; lastError = null; lastCode = null;
      bytes = text.length;
      lastRaw = text;                                // 自分の書き込みを storage イベントと見分ける
      Platform.write(STORE_KEYS.probe, JSON.stringify({ attempts: clean.attempts.length, sessions: clean.sessions.length, at: clean.savedAt }));
      if (reloaded) notify('external');
      return { ok: true, code: null, error: null, rec: mem, bytes: bytes, reloaded: reloaded };
    }

    /* opts.includeRecovery: 退避（.broken / .prev / .bak）も消す。
     * 既定では残す —— 壊れた記録の唯一の控えなので、全消去のついでに消さない（§4.6 / M-01）。
     * 設定画面が「退避も消す」を別に用意できるよう、口だけ開けておく。 */
    function clear(opts) {
      if (!loaded) load();
      opts = opts || {};
      var before = mem, beforeRaw = lastRaw;
      var r1 = Platform.remove(STORE_KEYS.records);
      if (!r1.ok) {
        // ★消せていないのにメモリだけ空にしない（次の保存成功で「空」が書き戻る）
        mem = before; lastRaw = beforeRaw;
        lastError = r1.error; lastCode = r1.code;
        return { ok: false, code: r1.code, error: r1.error, rec: mem };
      }
      Platform.remove(STORE_KEYS.probe);
      if (opts.includeRecovery) {
        Platform.remove(STORE_KEYS.broken);
        Platform.remove(STORE_KEYS.prev);
        Platform.remove(STORE_KEYS.bak);
      }
      mem = Rec.blank();
      extraKeys = [];
      lastRaw = null;
      frozen = false;
      bytes = 0; lastError = null; lastCode = null;
      return { ok: true, code: null, error: null, rec: mem };
    }

    function export_() {
      if (!loaded) load();
      var out = project(clone(mem));
      out.savedAt = isoOf(Date.now());
      var d = new Date();
      var name = 'jstqb-altm-records-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
        '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
      return { filename: name, text: JSON.stringify(out, null, 1), counts: { attempts: out.attempts.length, sessions: out.sessions.length } };
    }

    /* 検証して差分を返すだけ。commit:true のときだけ置き換える（SPEC §6.7）。 */
    function import_(text, opts) {
      if (!loaded) load();
      opts = opts || {};
      var obj = null;
      try {
        obj = JSON.parse(text);
      } catch (e) {
        return { ok: false, errors: ['ファイルが JSON として読めない'], warnings: [], diff: null };
      }
      var v = validate(obj);
      if (!v.ok) return { ok: false, newer: !!v.newer, errors: v.errors, warnings: v.warnings, diff: null };
      var diff = {
        current: { attempts: mem.attempts.length, sessions: mem.sessions.length },
        incoming: { attempts: v.value.attempts.length, sessions: v.value.sessions.length },
        delta: { attempts: v.value.attempts.length - mem.attempts.length, sessions: v.value.sessions.length - mem.sessions.length }
      };
      var res = { ok: true, errors: [], warnings: v.warnings, diff: diff, value: v.value, committed: false };
      if (opts.commit === true) {
        var prev = Platform.read(STORE_KEYS.records);
        if (prev !== null) Platform.write(STORE_KEYS.prev, prev);   // 1世代退避
        var incoming = v.value;
        var w = set(function () { return incoming; }, { replace: true });
        res.committed = w.ok;
        res.write = w;
      }
      return res;
    }

    /* 退避してあるものを取り出す（M-01）。
     * 「退避してあります」と言いながら読み戻す道が無いのは、利用者にとって失われたのと同じ。
     * 画面はここで得た text を Store.import(text) に渡すか、Platform.saveText で書き出す。
     *   kind = 'broken'（壊れて読めなかった記録）/ 'prev'（取り込みで置き換える前の記録）
     *        / 'bak'（スキーマ移行の前の記録）
     */
    function recover(kind) {
      if (!loaded) load();
      var key = STORE_KEYS[kind];
      if (!key || kind === 'records' || kind === 'probe') {
        return { ok: false, code: 'unknown-kind', error: '知らない退避の種類: ' + String(kind) };
      }
      var text = Platform.read(key);

    if (lv === 'nostock') return '在庫なし';
    if (lv === 'excluded') return '計測できず ' + excludedCount(row) + '件';
    if (lv === 'none') return '未着手';
    if (lv === 'thin') return 'n=' + row.n;
    if (row.rate === null || row.rate === undefined) return 'データ不足';
    return Math.round(row.rate * 100) + '%';
  }
  var LEVEL_LABEL = {
    nostock: '在庫なし', none: '未着手', thin: 'データ不足',
    measured: '測定済み', excluded: '計測できず'
  };
  function levelLabel(lv) { return LEVEL_LABEL[lv] || '不明'; }
  /* 凡例に出す5つ。並びは「埋まらない → 解けば埋まる → 足りない → 測れた」の順で、
     「計測できず」は未着手のすぐ隣（取り違えやすい2つを並べて違いを見せる）。 */
  var LEVELS = ['nostock', 'none', 'excluded', 'thin', 'measured'];

  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  function fmtDateTime(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    if (m < 60) return m + '分' + pad2(s % 60) + '秒';
    return Math.floor(m / 60) + '時間' + pad2(m % 60) + '分';
  }
  function fmtClock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + pad2(s % 60);
  }
  var WEEKDAY = ['日', '月', '火', '水', '木', '金', '土'];

  /* 選択肢の記号。表示順の位置で振る（元添字ではない）。 */
  function tileChar(i) { return String.fromCharCode(65 + i); }

  /* ===================================================================
   * 3. 誤答型のバッジ（色＋形＋記号＋名前。色だけで区別しない）
   * =================================================================== */

  /* styles.css の割り当て表そのまま。系統4色 × 系統内4形。 */
  var DT_SHAPE = {
    D2: ['a', 1], D12: ['a', 2], D11: ['a', 3], D9: ['a', 4],
    D1: ['b', 1], D8: ['b', 2], D10: ['b', 3], D14: ['b', 4],
    D4: ['c', 1], D7: ['c', 2], D13: ['c', 3], D5: ['c', 4],
    D3: ['d', 1], D6: ['d', 2]
  };

  /* code は 'D4' など。none:true で「未出題の型」。sub は 'D2a' など。
     compact:true は記号だけのチップ（狭い行で名前が折り返して丸くなるのを防ぐ）。
     ★compact を使う側は、名前をチップのすぐ隣にテキストで置くこと。
       記号と名前の併記は「行として」満たす（SPEC §6.6「色だけで区別しない」）。 */
  function dtypeBadge(code, sub, none, compact) {
    var m = DT_SHAPE[code];
    var cls = 'dtype' + (m ? ' dt-' + m[0] : '') + (none || !m ? ' is-none' : '');
    var el = h('span', cls);
    add(el, h('span', 'dtype-dot' + (m ? ' sh-' + m[1] : '')));
    add(el, h('span', 'dtype-code', code));
    if (!compact) add(el, h('span', 'dtype-name', DType.name(code) || '未分類'));
    if (sub) add(el, h('span', 'dtype-sub', '（' + sub + '）'));
    return el;
  }

  /* Choice.dtype（DType.normalize の結果）から並べる。複合は2枚出す。 */
  function dtypeBadges(dt) {
    var out = [];
    if (!dt) return out;
    for (var i = 0; i < dt.mains.length; i++) {
      out.push(dtypeBadge(dt.mains[i], i === 0 ? dt.sub : null, false));
    }
    if (dt.unknown) {
      var el = h('span', 'dtype is-none');
      add(el, h('span', 'dtype-dot'));
      add(el, h('span', 'dtype-code', dt.raw ? String(dt.raw) : '—'));
      add(el, h('span', 'dtype-name', '未分類'));
      out.push(el);
    }
    return out;
  }

  /* ヘッダ。back を渡すと「戻る／中断」が出る（下タブを隠す画面では必須）。 */

  /* 帯の色は1色1意味（B-18）。
       is-mine（青）＝自分のこと / is-wrong（マゼンタ）＝誤り /
       is-hold（紫）＝診断 / is-answer（ミント）＝正解とその説明 /

  function bandRow(kind, text) { return h('p', 'band' + (kind ? ' is-' + kind : ''), text); }

  function noticeNode() {

    /* 「取り出せます」と言うなら、そこへ行く道を同じ場所に置く（M-01 / B-15）。

    if (S.notice.act) add(n, btn('act act-sub', S.notice.act.act, null, S.notice.act.text));
    add(n, btn('act act-quiet', 'dismiss-notice', null, '閉じる'));
