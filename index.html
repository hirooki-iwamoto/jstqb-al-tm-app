として覚えている人が選ぶ",null],"flip":[null,null,null,null],"flipNote":{"1":"構成管理システムへの一時的な保管は、シラバスがテストウェアを保管する作業として実際に書いている行為で、テスト完了の作業から外れるものではない。相手の取り違えも無い。この案を退けているのは、それで引き渡しは済んだものとするという最後の一言だけである。その一言を落として保管するところまでにとどめれば、この案はシラバスが求める作業になるが、延期した既知の欠陥を保守チームと運用担当に伝えることも同じく求められたまま残るので、次に求められるものが2つ立ち、1つ選べの形が壊れる。保管が伝達を兼ねると原文が書いていれば一意になるが、それはシラバスの書き換えであって、この状況の条件を変えることではない。","2":"この案が退けられるのは相手が違うからである。シラバスが引き渡しの相手として挙げているのは、テストウェアを使う人々、あるいはテストウェアの使用をサポートする人々であり、契約業務を行う利用部門はそのどちらでもない。周知の場をリリースノート以外に移しても、相手が利用部門のままなら同じ理由で退けられる。相手を保守チームと運用担当に変えれば正しくなるが、それは延期した欠陥の内容を伝えるという答えと同じ主張になり、正答が2つになる。","3":"テスト完了レポートの作成と承認、承認後の関連するステークホルダーへの通知は、シラバスがテスト完了に求める作業そのもので、テスト完了の内側にある行為である。これが退けられる理由は2つあって、その作業がこの状況では済んでいることと、それをもって既知の欠陥の伝達に代えていることである。承認と通知を終えているというシナリオの1文を、まだ作成していないに差し替えても、完了レポートを改めて作ることが求められるようになるだけで、テストウェアを使う人々への伝達が消えるわけではない。正答が2つ立ち、1つ選べの形が壊れる。"},"quote":"テストウェアを引き渡す…このタスクでは、必要とする人にとって価値ある作業成果物を引き渡す。例えば、延期された、あるいは受け入れられた既知の欠陥は、テストウェアを使う人々、あるいはテストウェアの使用をサポートする人々に伝達すべきである。","ref":"1.1.3","misconception":"延期や受け入れが決まった既知の欠陥は、完了レポートに載せて承認と通知を済ませるか、成果物を保管して参照できるようにすれば扱いが終わると考えており、テストウェアを引き渡す作業が、それを使う人々とその使用をサポートする人々への伝達まで求めていることと結び付けられていない"},"meta":{"concept":"テスト完了","distractorIntent":["相手は正しく捉えたうえで、構成管理システムへの保管をテストウェアを使う人々への伝達に代える","既知の欠陥の伝達先を、テストウェアを使う人々ではなく製品の利用部門と考える","済んでいるテスト完了レポートの承認と通知を繰り返し、それで既知の欠陥の伝達に代える"],"distractorTypes":["D1","D10","D8"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-83"]}},{"id":"q-1.2.1-A-1","lo":"TM-1.2.1","cluster":"1.2.1-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、新しい受発注システムのプロジェクトで、誰にどのように関わってもらうかを整理している。","question":"運用チームがテストに関わる理由として、シラバスが述べているものはどれか。1つ選べ。","choices":["本稼働に移せる状態かを見る立場から受け入れのテストに加わり、非機能の要件の定義にも関与する","実装したものの欠陥への対応を担う立場からユニットテストに関与し、テストプロセスに貢献する","テスト計画書とテストウェアを準備する立場から、テスト設計・テスト実行と欠陥の追跡や報告に携わる","要件を仕様化して求められる品質のレベルを定める立場から、テスト結果に基づく判定に関わる"],"answer":[0],"explanation":{"signals":"効くのは、どの立場について問われているかという一点だけである。四つとも、シラバスが誰かの関与として実際に挙げている内容で、行為そのものが誤っているものは無い。新しい受発注システムで誰にどう関わってもらうかを整理しているという場面も、どれが答えかを変えない。","why":"本稼働に移せる状態かを自分たちの目で確かめ、稼働後に動かし続けるために要る非機能の要件を定義の段階から持ち込む ── シラバスが運用チームの関与として置いているのがこれである。原文は運用チームについて、運用受け入れテストに従事し、システムの本稼働への準備を確実にし、非機能要件の定義に貢献する、と述べている。だからこの立場がテストに関わる理由は、受け入れのテストに加わることと、非機能の要件の定義に関わることになる。シラバス1.2.1 は、テストステークホルダーをプロダクトの品質に直接的または間接的な関心を持つ個人またはグループとしたうえで、テストにおける多様な関心を反映するように調整した典型的なリストとして、開発を担う側、テストを担う側、事業を担う側、運用チーム、顧客とユーザーに、それぞれ別の関与を割り当てている。残る三つは、そのうち開発を担う側・テストを担う側・事業を担う側に割り当てられた関与であり、記述としてはどれも正しいが、運用チームがテストに関わる理由として挙げられているものではない。","distractors":[null,"実装したものの欠陥への対応とユニットテストへの関与は、シラバスが開発担当者・開発リーダー・開発マネージャーの関与として挙げている内容である。システムを動かし続ける側も不具合の影響を強く受けるので、同じ理由でテストに関わっていると見えやすいが、原文はこの関与を実装する側に割り当てており、運用チームの側には置いていない。","テスト計画書の作成とテストウェアの準備、テスト設計・テスト実行、欠陥追跡と報告は、シラバスがテスト担当者・テストリーダー・テストマネージャーの関与として挙げている内容である。テストプロセスへの貢献としていちばん目立つため、関与の内容を問われると反射的に選ばれやすいが、これはテストを担う側に割り当てられた関与である。","要件の仕様化、求められる品質レベルの定義、テスト結果に基づく判定は、シラバスがプロジェクトマネージャー・プロダクトオーナー・ビジネスユーザーの関与として挙げている内容である。本稼働に移してよいかという判断に関わる点が、稼働後を引き受ける立場の関わり方と地続きに見えるため紛れやすいが、原文はこの判定を事業を担う側に割り当てている。"],"flip":[null,null,null,null],"flipNote":{"2":"実装したものの欠陥への対応とユニットテストへの関与は、シラバスが開発担当者・開発リーダー・開発マネージャーに割り当てている記述である。行為の中身は原文どおりで、誤っているのは、それを運用チームがテストに関わる理由として置いた点だけである。この選択肢が答えになるのは、どの立場について問うかを開発を担う側に入れ替えたときだが、そのとき運用チームの関与を述べた記述のほうが誤りに変わる。動いているのはシナリオや選択肢の条件ではなく、問いそのものである。","3":"テスト計画書の作成とテストウェアの準備、テスト設計・テスト実行、欠陥追跡と報告は、シラバスがテスト担当者・テストリーダー・テストマネージャーに割り当てている記述であり、どれもテストの中心にある仕事として正しい。この選択肢が答えになるのは、問う立場をテストを担う側に入れ替えたときだけで、そのとき運用チームの関与を述べた記述は誤りに変わる。立場の入れ替えはシナリオや選択肢の条件ではなく、設問そのものの取り替えである。","4":"要件の仕様化と求められる品質レベルの定義、テスト結果に基づく判定は、シラバスがプロジェクトマネージャー・プロダクトオーナー・ビジネスユーザーに割り当てている記述である。判定という語のために本稼働の可否を引き受ける側の関心と重なって見えるが、原文はこの関与を事業を担う側に置いている。問う立場を事業を担う側に替えればこの選択肢が答えになる一方、運用チームの関与を述べた記述は誤りに変わるため、変わっているのは条件ではなく問いである。"},"quote":"運用チーム：運用受け入れテストに従事し、システムの本稼働への準備を確実にし、非機能要件の定義に貢献する。","ref":"1.2.1","misconception":"ステークホルダーを「みな品質に関心がある」という一般論で括ってしまい、シラバスが立場ごとに別々の関与を割り当てていることを区別できていない"},"meta":{"concept":"テストステークホルダーと、その関与の内容","distractorIntent":["開発側の関与を、稼働を引き受ける側の関わる理由として置く","テストを担う側の関与を、どのステークホルダーにも当てはまる一般の関与として置く","事業側の判定への関与を、稼働を引き受ける側の関わる理由として置く"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-89"]}},{"id":"q-1.2.2-A-1","lo":"TM-1.2.2","cluster":"1.2.2-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、プロジェクトのステークホルダーを洗い出し、影響力と関心度の2軸のマトリクスに並べたところである。","question":"このマトリクスがテストマネジメントにとって重要である理由として、最も適切なものはどれか。1つ選べ。","choices":["テストの結果を誰の承認で受け入れるかを定め、リリースの可否を決める人をあらかじめ確定できるから","誰の関与をどこまで手厚くするかに順序を付け、それぞれの期待に効率よく応える指針になるから","関わりの薄い相手を報告の対象から外し、伝える相手を絞って手間を減らせるから","性能やセキュリティに詳しい担当者を社内で見つけ出し、テストの担当に割り当てられるから"],"answer":[1],"explanation":{"signals":"効くのは、この道具が何のためのものかという一点である。四つとも、テストマネージャーが実際に必要とする仕事を述べており、実務での有用さでは区別がつかない。影響力と関心度の二軸に並べたところだという場面は、どの節の話かを指しているだけである。","why":"誰の関与をどこまで手厚くするかに順序を付け、それぞれの期待に効率よく応える ── シラバスがステークホルダーマトリクスに与えている役目はこれであり、だからこの表がテストマネジメントにとって重要になる。原文は、しばしば権力と関心度のマトリクスと呼ばれるこの表を、テストマネージャーがステークホルダーの関与に優先順位を付けて効率的に期待値をマネジメントするための指針となるもの、と述べている。1.2.2 はさらに、この表が戦略的なツールであることを、ステークホルダーの専門知識を活用すること、関心と影響力を明らかにして積極的なリスク軽減の努力を促しリスクマネジメントを支援すること、価値あるフィードバックによる多様な視点を重視することとして示し、影響力と関心度の高低で推進者・潜在的協力者・擁護者・無関心者の四象限に分けたうえで、それぞれとの関わり方を述べている。どの象限の相手とどう関わるかを決めるための指針であって、承認の権限を割り当てたり、報告する相手を絞ったり、要員を配置したりするための表ではない。","distractors":["テスト結果に基づいて判定を行うのは、シラバスが 1.2.1 でプロジェクトマネージャー・プロダクトオーナー・ビジネスユーザーの関与として挙げていることである。マトリクスが与えるのは関与の濃淡を決める指針であって、承認の権限を誰に持たせるかの割り当てではない。期待値をマネジメントするという言い方が、合意の取り付けや承認の段取りと同じものに見えるために選ばれる。",null,"原文は、影響力も関心も低い無関心者について、密接には関与しないとしながらも、重要なマイルストーンで報告したり、特定の課題に関する意見を求めたりすることで、独自の洞察を得ることができる、と述べている。関与の濃淡を決める道具ではあるが、報告の相手から外すための道具ではない。限られた時間で関係者を絞り込みたいという実務の感覚に合うため、吸引力が高い。","この節が述べる専門知識の活用は、エンドユーザーや技術チームが性能やセキュリティに関するフィードバックや洞察を提供する、という形のものである。この記述は、活用の仕方をフィードバックや洞察の提供から要員の割り当てにすり替えている。専門知識という語だけを拾うと原文どおりに見える。"],"flip":[null,null,null,null],"flipNote":{"1":"誰がテスト結果に基づいて判定を行うかを定めているのは 1.2.1 の事業側の関与の記述であり、1.2.2 がマトリクスに与えているのは、影響力と関心度の二軸で関与に優先順位を付け、期待値を効率的にマネジメントするための指針だという位置づけである。関与の濃淡を承認の権限に読み替える条件はシナリオにも選択肢にも無く、読み替えた時点で、この節が道具に与えている目的そのものを別のものに差し替えることになる。","3":"影響力も関心も低い無関心者についても、原文は、重要なマイルストーンで報告したり、特定の課題に関する意見を求めたりすることで、独自の洞察を得ることができる、と述べている。つまりいちばん関与の薄い象限でも報告は残る。関与を薄くする条件をいくら足しても、報告そのものをやめてよいという記述がこの節に無いため、この選択肢は正しくならない。誤っているのは関与の濃淡の付け方ではなく、原文が残すと述べている接点を消してしまった点である。","4":"原文がこの節で述べる専門知識の活用は、エンドユーザーや技術チームが性能やセキュリティに関するフィードバックや洞察を提供することである。要員のスキルをアセスメントして担当に割り当てる話は、シラバスがテストチームメンバーのスキルを扱う 3.1 の側の話であって、ここでマトリクスに与えられている目的ではない。活用する相手と活用の仕方を社内の要員の配置に入れ替えると、この節ではなく別の節を問う設問に変わってしまう。"},"quote":"ステークホルダーマトリクスは、しばしば権力と関心度のマトリクスと呼ばれ、テストマネージャーがステークホルダーの関与に優先順位を付けて効率的に期待値をマネジメントするための指針となる。","ref":"1.2.2","misconception":"ステークホルダーマトリクスを、関与に優先順位を付けるための指針ではなく、承認の権限を割り当てる表や、報告する相手を絞り込むための表として読んでいる"},"meta":{"concept":"ステークホルダーマトリクス（権力と関心度のマトリクス）","distractorIntent":["マトリクスを、承認の権限とリリース判定者を決める表として読む","関与が薄い区分を、報告の対象から外してよいと読む","ステークホルダーの専門知識の活用を、社内の要員のスキル評価と配置の話として読む"],"distractorTypes":["D1","D5","D10"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-26"]}},{"id":"q-1.2.3-A-1","lo":"TM-1.2.3","cluster":"1.2.3-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、工程ごとに区切る従来の進め方を残したまま、一部の開発をスプリントに切り替えた組織で働いている。","question":"ハイブリッドソフトウェア開発モデルで行うテストマネジメント活動として、シラバスが挙げているものはどれか。1つ選べ。","choices":["チームが両方の進め方に慣れるまでは、テストの進め方を従来のフェーズのままに保つ","従来の手法の構造とアジャイルプラクティスの柔軟性を組み合わせ、移行を容易にするバランスの取れたアプローチを提供する","スプリント内のテスト活動とテストケースの追跡は自動化されたダッシュボードに任せ、従来のテストフェーズの調整に専念する","従来の方法論とアジャイル方法論の間を円滑に移行するために、チームの理解と能力を評価する"],"answer":[3],"explanation":{"signals":"効くのは、問われているのがハイブリッド環境でのテストマネジメント活動だという一点である。工程ごとに区切る進め方とスプリントが併存しているという場面は、1.2.3 の話だと示すだけで、どれが答えかを決めない。四つのうち一つはモデルそのものの説明で、残りは活動の形をしている。","why":"従来の方法論とアジャイル方法論の間を円滑に移行するために、チームの理解と能力を評価する ── これは、シラバスがハイブリッド環境でのテストマネジメント活動として最初に挙げているものである。1.2.3 は、ハイブリッドソフトウェア開発モデルを使用する一般的な理由を先に述べ、そのあとで「ハイブリッド環境では、テストマネジメント活動には以下を含む場合がある」として別の一覧を置いており、この評価はその一覧の中にある。続けて並ぶのも、ハイブリッドアプローチへの適応における強みと弱みの識別、構造化されたプロセスとアジャイルな柔軟性を組み合わせることへの習熟の担保、テストチームとステークホルダーとの協調の強化、テスト担当者向けのスクラムオブスクラムのような協調的な取り組みへの参加、スプリント内で行うテスト活動とテストケースの追跡とレビューで、いずれもテストマネージャーがチームや関係者に働きかける行為である。モデルそのものの説明、時期が来るまで動かさないという段取り、追跡を道具に任せる形は、この一覧には無い。","distractors":["原文はこの環境での活動として、チームが構造化されたプロセスとアジャイルな柔軟性を組み合わせることに習熟していることを担保する、と述べている。習熟は待って様子を見る対象ではなく、テストマネージャーが確かめて担保する対象である。混乱を避けるためにしばらく従来のフェーズのままにしておくという段取りは現場で語られるが、この環境での活動としてシラバスが挙げているものではない。","これは、シラバスがハイブリッドソフトウェア開発モデルそのものを説明した一文で、従来の手法からアジャイル手法への移行を容易にするという、モデルを使用する理由の側に置かれている。テストマネージャーが行う活動の一覧の中にある記述ではない。節の中でいちばん目を引く一文であるため、活動を問われたときにそのまま持ち出されやすい。","原文は、アジャイルプラクティスに沿っていることを確認するために、スプリント内で行うテスト活動とテストケースを追跡してレビューすることを、この環境での活動として挙げている。追跡とレビューそのものがテストマネージャーの活動であり、道具が動いていることでは置き換えられない。さらに原文は、協調を強化してスプリントや従来のテストフェーズにおけるテストをよりよくマネジメントすると述べており、従来のフェーズの側だけに専念する形でもない。",null],"flip":[null,null,null,null],"flipNote":{"1":"原文がこの環境での活動として挙げているのは、チームが構造化されたプロセスとアジャイルな柔軟性を組み合わせることに習熟していることを担保することである。担保するのはテストマネージャーであり、習熟は待つ対象ではない。据え置く期間の長さを変えても、テストの進め方を従来のフェーズのままに保つことを支える記述は、この節が並べている活動の一覧に無い。この選択肢が立っているのは、一覧にある働きかけを、いつ動くかという時期の判断に置き換えてしまった点である。","2":"この文は、シラバスがハイブリッドソフトウェア開発モデルそのものを説明し、アジャイルへの移行を容易にするというモデルを使用する理由の側に置いている一文である。テストマネジメント活動として原文が並べているのは、チームの理解と能力の評価、適応における強みと弱みの識別、習熟の担保、ステークホルダーとの協調の強化、スクラムオブスクラムのような取り組みへの参加、スプリント内で行うテスト活動とテストケースの追跡とレビューであり、この文はその一覧の外にある。モデルを使う理由を問う設問なら答えになるが、それは条件の変更ではなく設問の変更である。","3":"この選択肢には誤りが二つある。一つは、原文がスプリント内で行うテスト活動とテストケースを追跡してレビューすることを活動として挙げているのに、その追跡を道具の稼働に委ねている点である。もう一つは、関わる先を従来のテストフェーズの側だけに狭めている点で、原文は協調の強化によってスプリントや従来のテストフェーズにおけるテストをよりよくマネジメントすると述べている。片方を直しても、もう片方が同じ理由でこの選択肢を退ける。"},"quote":"従来の方法論とアジャイル方法論の間を円滑に移行するためのチームの理解と能力を評価する。","ref":"1.2.3","misconception":"ハイブリッドモデルそのものの説明（なぜ使うのか）と、ハイブリッド環境でテストマネージャーが行う活動とを同じものとして読んでいる"},"meta":{"concept":"ハイブリッドソフトウェア開発モデルにおけるテストマネジメント","distractorIntent":["モデルそのものの説明文を、テストマネジメント活動として選ぶ","追跡とレビューを道具の稼働に委ね、関与を従来のフェーズだけに狭める","習熟を、働きかける対象ではなく待つ対象として扱う"],"distractorTypes":["D10","D10","D7"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-33"]}},{"id":"q-1.2.3-B-1","lo":"TM-1.2.3","cluster":"1.2.3-B","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは医療機器メーカーのテストマネージャーである。規制当局へ提出する部分は、設計から検証までを順に区切って進めるよう規制で定められ、スプリントに置き換えられない。利用者向けアプリの部分は要望に合わせてスプリントで進めることが求められている。全社をアジャイル手法へ切り替える計画は無い。","question":"この組織がハイブリッドソフトウェア開発モデルを使う理由として、シラバスの説明に合うものはどれか。1つ選べ。","choices":["従来の手法からアジャイル手法への移行が、業務の流れや文化の根本的な変化により困難であるため、その移行を容易にするバランスの取れたアプローチとしてハイブリッドモデルを使っている","テストチームとステークホルダーとの協調を強化し、スプリントや従来のテストフェーズにおけるテストをよりよくマネジメントするためにハイブリッドモデルを使っている","アジャイルに移行できない事情があり、シーケンシャルなタスクを要件とする部分とアジャイルプラクティスを要件とする部分があるため、目的に合わせてハイブリッドモデルを使っている","規制当局へ提出する部分も利用者向けアプリの部分も、担当してきたチームが慣れた進め方を変えずに続けられるようにするため、両方を残す形でハイブリッドモデルを使っている"],"answer":[2],"explanation":{"signals":"効くのは二つの記述である。一つは、規制当局へ提出する部分は順に区切って進めるよう規制で定められスプリントに置き換えられない一方で、利用者向けアプリの部分はスプリントで進めることが求められている、という進め方の分かれ方である。もう一つは、全社をアジャイル手法へ切り替える計画は無い、という記述で、これがこの組織を移行の途上に置かない。医療機器という業種は、規制で進め方が定められていることの裏づけであって、それだけで理由が決まるわけではない。","why":"アジャイルに移行できない事情があり、シーケンシャルなタスクを要件とする部分とアジャイルプラクティスを要件とする部分がある ── この組織が当てはまるのは、シラバスが目的に合わせたハイブリッドとして述べている側である。規制当局へ提出する部分は順に区切って進めるよう規制で定められてスプリントに置き換えられず、利用者向けアプリの部分はスプリントで進めることが求められている。要件が部分ごとに分かれているこの姿は、原文が、組織やプロジェクトによってはアジャイルに移行できない場合があり、リスクの高いプロジェクトでは、あるものにはシーケンシャルなタスクが要件となり、別のものにはアジャイルプラクティスが要件となることがある、と述べているものにそのまま重なる。シラバス1.2.3 がモデルを使用する一般的な理由としてもう一方に置いているのは、アジャイルへの移行としてのハイブリッド ── 従来の手法からアジャイル手法への移行が、業務の流れ、文化、チームダイナミクスの根本的な変化により困難な場合に、従来の手法の構造とアジャイルプラクティスの柔軟性を組み合わせて、その移行を容易にするという説明である。この組織は全社をアジャイル手法へ切り替える計画を持たないので、容易にすべき移行そのものが無い。なお、この節が理由に続けて並べているテストマネジメント活動は、ハイブリッド環境で何を行うかの一覧であって、モデルを使用する理由ではない。","distractors":["この記述は、シラバスがアジャイルへの移行としてのハイブリッドとして挙げているものである。ただしその説明は、従来の手法からアジャイル手法への移行が困難な場合に、その移行を容易にするというもので、移行しようとしている組織の話である。この組織は全社をアジャイル手法へ切り替える計画を持たず、移行の途上にない。ハイブリッドと聞いてまず思い浮かぶのが移行の途中段階であるため、状況を確かめずに選ばれやすい。","テストチームとステークホルダーとの協調を強化し、スプリントや従来のテストフェーズにおけるテストをよりよくマネジメントするという記述を、シラバスはハイブリッド環境でのテストマネジメント活動の一覧に置いている。モデルを使用する一般的な理由として挙げているものではない。ハイブリッド環境で行うことや、そこで得られる良いことを、そのまま採用の理由に読み替えると選ばれる。",null,"シラバスが目的に合わせたハイブリッドとして述べているのは、あるものにはシーケンシャルなタスクが要件となり、別のものにはアジャイルプラクティスが要件となる、という要件の分かれ方である。慣れた進め方を変えずに済ませることは、原文が説明を与えている二つの理由のどちらでもない。この組織でも、規制当局へ提出する部分が順に区切って進むのは規制でそう定められているからであり、利用者向けアプリの部分がスプリントで進むのは要望に合わせてそれが求められているからで、これまでのやり方を残した結果ではない。原文は、組織やプロジェクトによっては他の理由もあり得るとも述べているが、ここで問われているのはシラバスが説明を与えている理由である。二つの進め方が並んでいるという姿は正しく捉えているため、その並びを何が決めているかまで確かめずに選ばれやすい。"],"flip":[null,null,null,null],"flipNote":{"1":"この記述自体は誤りではなく、シラバスがモデルを使用する一般的な理由の一方として挙げているものである。ただしこの組織に当てはめるには、全社をアジャイル手法へ切り替える計画は無い、という文を差し替えるだけでは足りない。規制で順に区切ることが定められた部分と、スプリントで進めることが求められる部分とが分かれているという記述が残るかぎり、目的に合わせたハイブリッドという説明も同時に成り立ち、正解が二つになる。二つの記述を同時に変えなければ、この選択肢は一意にならない。","2":"この記述が居るのは、原文の別の一覧である。シラバスは、ハイブリッド環境では、テストマネジメント活動には以下を含む場合がある、として活動を並べており、テストチームとステークホルダーとの協調を強化し、スプリントや従来のテストフェーズにおけるテストをよりよくマネジメントすることは、その中の一つである。いっぽうモデルを使用する一般的な理由として並べられているのは、アジャイルへの移行としてのハイブリッドと、目的に合わせたハイブリッドで、この記述はその外にある。ハイブリッド環境でのテストマネジメント活動を問う設問なら答えになるが、それは条件の変更ではなく設問の変更である。","4":"この選択肢が理由として挙げているのは、慣れた進め方を変えずに済ませることである。これは、シラバスがモデルを使用する一般的な理由として説明している二つ、すなわちアジャイルへの移行としてのハイブリッドと、目的に合わせたハイブリッドのどちらにも入っていない。そのため、状況の側を一か所変えても答えにはならない。たとえば、規制で順に区切ることが定められているという記述を、担当してきたチームが慣れているからという記述に差し替えると、要件が部分ごとに分かれているという与件のほうが失われるので、目的に合わせたハイブリッドという説明も同時に成り立たなくなり、シラバスの説明に合う理由がどれも残らない。この選択肢を答えにできるのは原文の理由の一覧そのものを書き換えたときだけであり、原文が変われば別の問題で、条件の変更ではない。"},"quote":"目的に合わせたハイブリッド：組織やプロジェクトによっては、アジャイルに移行できない場合がある。リスクの高いプロジェクトでは、あるものにはシーケンシャルなタスクが要件となり、別のものにはアジャイルプラクティスが要件となることがある。そのようなプロジェクトでは、目的に合わせてハイブリッドモデルを使うことができる。","ref":"1.2.3","misconception":"ハイブリッドモデルを使う理由を常にアジャイルへの移行の途中段階として読み、アジャイルに移行できず進め方が部分ごとに分かれるという、もう一方の理由を見落としている"},"meta":{"concept":"ハイブリッドソフトウェア開発モデルを使用する一般的な理由","distractorIntent":["移行としてのハイブリッドの説明を、移行の計画が無い組織にも当てはめる","ハイブリッド環境でのテストマネジメント活動の記述を、モデルを使用する理由として読む","進め方が部分ごとに分かれている根拠を、原文が述べる要件ではなく、慣れた進め方を変えずに済ませたいという現場の事情として読む"],"distractorTypes":["D1","D1","D6"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-106"]}},{"id":"q-1.2.4-A-1","lo":"TM-1.2.4","cluster":"1.2.4-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、V字モデルで進めてきた組織がスクラムに移るのに合わせ、テストマネジメントの活動を見直している。","question":"イテレーティブ開発モデルでのモニタリングと報告について、シラバスが述べているものはどれか。1つ選べ。","choices":["従来の指標に加えて、チームのベロシティやバーンダウンチャートを併せて用いる","常時更新されるダッシュボードと日々の状況共有によって、途切れなく状況を伝える","継続的なテストを支えるために、CI/CD と自動化のためのツールを中心に据える","適応性とフィードバックに重点を置き、テストの進め方をイテレーションの中に組み込む"],"answer":[1],"explanation":{"signals":"効くのは、イテレーティブ側のどの行について問われているかという一点である。四つとも比較表がイテレーティブ開発モデルの側に置いている記述で、アジャイルらしいかどうかでは絞れない。V字モデルからスクラムへ移るという場面は、表のどちらの側の話かを指しているだけである。","why":"常時更新されるダッシュボードと日々の状況共有で途切れなく伝える ── シラバスの比較表がイテレーティブ開発モデルのモニタリングと報告に置いているのはこれで、原文の言い方ではリアルタイムダッシュボードとデイリーステータスアップデートによる継続的な報告をする、である。表1 は活動ごとに行を立て、シーケンシャル開発モデル（例：V字モデル）での姿とイテレーティブ開発モデル（例：スクラム）での姿を並べており、モニタリングと報告の行では、シーケンシャル側がマイルストーンベースの報告とオプションの自動ダッシュボードとされている。残る三つも同じイテレーティブ側の記述だが、置かれている行はメトリクス、ツール、テストアプローチで、いま問われている行のものではない。","distractors":["チームのベロシティとバーンダウンチャートは、比較表がメトリクスの行に、従来のメトリクスに加えて含むイテレーション追跡のためのものとして挙げている。どちらも進捗を共有する場で目にする図なので、報告の行の中身に見えやすいが、表の上では別の行にある。",null,"CI/CD と自動化のためのツールを中心に据え、継続的なテストをサポートすることは、比較表がツールの行のイテレーティブ側に置いている。継続的という語が継続的な報告と重なるために紛れやすいが、問われているのはモニタリングと報告の行である。","適応性とフィードバックに重点を置き、イテレーションの中に組み込むことは、比較表がテストアプローチの行のイテレーティブ側に置いている。フィードバックという語が状況を共有する行為と結びついて見えるため選ばれやすいが、これはテストをどう進めるかの話であって、状況をどう伝えるかの話ではない。"],"flip":[null,null,null,null],"flipNote":{"1":"チームのベロシティとバーンダウンチャートは、比較表のメトリクスの行が、従来のメトリクスに加えて含むものとして挙げている記述である。イテレーションを追跡するための指標であり、記述としては正しい。この選択肢が答えになるのは、問う行をメトリクスに入れ替えたときだけで、そのときモニタリングと報告の行を述べた記述は誤りに変わる。行の入れ替えはシナリオや選択肢の条件ではなく、設問そのものの取り替えである。","3":"CI/CD と自動化のためのツールを中心に据えることは、比較表のツールの行のイテレーティブ側に置かれている記述である。継続的という語が報告の説明と重なって見えるが、表の上では別の行にある。問う行をツールに替えればこの選択肢が答えになり、同時にモニタリングと報告の行を述べた記述は誤りに変わる。つまり変えられるのは条件ではなく、どの行を問うかという設問の側である。","4":"適応性とフィードバックに重点を置き、テストの進め方をイテレーションの中に組み込むことは、比較表のテストアプローチの行のイテレーティブ側に置かれている記述である。フィードバックを重んじる姿勢は報告の話と隣り合って見えるが、表の行は別である。問う行をテストアプローチに替えればこの選択肢が答えになる一方で、モニタリングと報告の行を述べた記述は誤りに変わるため、これは条件の変更ではなく問いの取り替えにあたる。"},"quote":"モニタリングと報告 … マイルストーンベースの報告、オプションの自動ダッシュボード … リアルタイムダッシュボードとデイリーステータスアップデートによる継続的な報告をする","ref":"1.2.4（表1）","misconception":"比較表を「シーケンシャル側かイテレーティブ側か」という側の違いだけで覚えており、同じ側の中で活動ごとの行がどう分かれているかを区別できていない"},"meta":{"concept":"SDLCモデル別のテストマネジメント活動の比較","distractorIntent":["アジャイルメトリクスを、モニタリングと報告の欄の中身として選ぶ","ツールの欄の記述を、継続的という語の重なりから報告の欄の中身として選ぶ","テストアプローチの欄の記述を、フィードバックという語の重なりから報告の欄の中身として選ぶ"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-90"]}},{"id":"q-1.2.4-B-1","lo":"TM-1.2.4","cluster":"1.2.4-B","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは物流会社のテストマネージャーである。倉庫管理システムはV字モデルで、配送状況を知らせる利用者向けアプリはスクラムで進めており、両者の違いを新任のテストリーダーに説明するために、活動ごとにシーケンシャル開発モデルでの姿を前、イテレーティブ開発モデルでの姿を後にして並べたメモを用意した。","question":"メモの記述のうち、シラバスが述べているとおりのものはどれか。1つ選べ。","choices":["テスト自動化は、戦略的に組み立ててさまざまな段階で実施する形から、イテレーションの終盤にまとめて作り、次のイテレーションの回帰確認に充てる形になる","テストウェアは、戦略や計画書、テストケース、スケジュール、レポートを揃える形から、同じ文書一式をイテレーションの単位に割り直して保つ形になる","役割は、テストマネージャーが進行の調整に専念し、意思決定は開発側の管理者が担う形から、役割が統合されてファシリテーターやコーチがその任を引き継ぐ形になる","見積りは、テストレベルごとに早い段階で詳細を固める形から、イテレーションごとのストーリーの計画づくりの一部として繰り返し見積る形になる"],"answer":[3],"explanation":{"signals":"効くのは、名指しされた活動について、比較表がシーケンシャル側とイテレーティブ側にそれぞれ何を置いているかだけである。どのメモも前にシーケンシャル側、後ろにイテレーティブ側を置く並べ方は同じなので、形では絞れない。どれも少なくとも片側は表の記述と一致しており、食い違いがあるとすればもう片側で、そちらもモデルの一般像としては自然に読めるように書いてある。物流会社という業種と、倉庫管理システムと利用者向けアプリという二つの製品は、両方のモデルが同時に動いている状況を示すだけで、どれが表と一致するかには効かない。","why":"見積りを述べたメモが、シーケンシャル側もイテレーティブ側も原文どおりである。比較表の見積りの行は、シーケンシャル開発モデルにテストレベルごとの早期詳細見積りを、イテレーティブ開発モデルにイテレーションごとのストーリープランニングの一部としてのイテレーティブな見積りを置いており、テストレベルごとに早い段階で詳細を固める形から、イテレーションごとのストーリーの計画づくりの一部として繰り返し見積る形になる、という記述はその両方にそのまま重なる。残るメモは、扱っている活動そのものは表にあるが、置かれている姿が食い違う ── テストウェアとテスト自動化はイテレーティブ側が、役割はシーケンシャル側が、表の記述と別のことを言っている。","distractors":["比較表はテスト自動化の行のイテレーティブ側に、CI/CD における自動リグレッションに重点を置き、初期段階から組み込まれている、と置いている。イテレーションの終盤にまとめて自動化し、次の回の回帰確認に回す運用は現場に多く、しかも前半のシーケンシャル側（戦略的に実装し、さまざまな段階で実施できる）は表のとおりなので、後半も正しく見える。","比較表はテストウェアの行のイテレーティブ側に、受け入れ基準と完了の定義に重点を置き、文書化は最小限にとどめる、と置いている。前半のシーケンシャル側の列挙は表のとおりで、シーケンシャル側で整えた文書の資産を捨てずにイテレーションの単位へ割り直す姿は、移行の途中の組織で実際によく採られるため自然に読める。しかし表が置いているのは、文書化を最小限にとどめる側である。","後半のイテレーティブ側は表のとおりだが、前半が食い違う。比較表はシーケンシャル側の役割に、テストマネージャーは意思決定とチームマネジメントを統括する、と置いている。意思決定を開発側の管理者が担い、テストマネージャーは進行の調整に専念するという分担は、組織によっては実際にそうなっているため通りやすいが、表が置いている姿ではない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この記述の後半を原文に合わせるには、CI/CD における自動リグレッションに重点を置き初期段階から組み込む、という比較表のテスト自動化の行のイテレーティブ側の記述に入れ替えることになる。ところがその入れ替えは、見積りを述べたメモの正しさに何の影響も与えないので、表と一致するメモが二つ並び、一つを選ぶ形が崩れる。終盤にまとめて自動化するという運用は、表のどの行にも置かれていない現場の姿である。","2":"この記述の後半を原文に合わせるには、受け入れ基準と完了の定義に重点を置き文書化は最小限にとどめる、という比較表のテストウェアの行のイテレーティブ側の記述に入れ替えるほかない。しかしその入れ替えは、見積りを述べたメモには何の影響も与えず、表と一致するメモが二つ並んで、一つを選ぶ設問として成り立たなくなる。この記述が居る場所は表のテストウェアの行で、そこに置かれているイテレーティブ側の姿は、文書化を最小限にとどめる側である。","3":"この記述の前半を原文に合わせるには、テストマネージャーは意思決定とチームマネジメントを統括する、という比較表の役割の行のシーケンシャル側の記述に入れ替えることになる。しかしそれは見積りを述べたメモの正しさを少しも損なわないため、やはり表と一致するメモが二つ並ぶ。後半は表の役割の行のイテレーティブ側と同じ内容で、誤っているのは前半だけだが、そこを直しても一つを選ぶ形には戻らない。"},"quote":"見積り テストレベルごとの早期詳細見積り イテレーションごとのストーリープランニングの一部としてのイテレーティブな見積り","ref":"1.2.4（表1）","misconception":"比較表を「シーケンシャル側かイテレーティブ側か」というモデルの一般像としてだけ覚えており、活動ごとに原文がどちらの側に何を置いたかを確かめていない"},"meta":{"concept":"SDLCモデル別のテストマネジメント活動の比較","distractorIntent":["イテレーションの終盤にまとめて自動化する現場の運用を、テスト自動化の欄のイテレーティブ側の姿として選ぶ","移行の途中の組織で実際に採られる文書の扱いを、テストウェアの欄のイテレーティブ側の姿として選ぶ","テストマネージャーが調整に専念し意思決定は開発側が担うという実際の分担を、役割の欄のシーケンシャル側の姿として選ぶ"],"distractorTypes":["D6","D6","D8"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-90"]}},{"id":"q-1.2.5-A-1","lo":"TM-1.2.5","cluster":"1.2.5-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、開発チームが行うユニットテストの進め方をチームと詰めている。","question":"コンポーネントテストのレベルでのテストマネジメント活動として、**適切でない**ものはどれか。1つ選べ。","choices":["コードレビューのような従来の役割を越えた活動にテスト担当者を加え、その分析のスキルが生きるようにする","このレベルのテストのスコープ、目的、完了基準を定める","受け入れ基準を満たしたかをステークホルダーとレビューし、利用部門が行うテストの段取りを整える","課題事項の解決や、ユニットテストへの貢献のために開発チームと調整する"],"answer":[2],"explanation":{"signals":"効くのは、コンポーネントテストのレベルという指定と、適切でないものを選ぶという否定形の二つである。四つとも、シラバスがいずれかのテストレベルの活動として挙げている内容で、行為として誤っているものは無い。開発チームとユニットテストの進め方を詰めているという場面は、どのレベルの話かを指しているだけである。","why":"受け入れ基準を満たしたかをステークホルダーとレビューし、利用部門が行うテストの段取りを整える ── これだけが、シラバスがコンポーネントテストの活動として並べているものに無い。原文はこれを受け入れテストの側に置いており、ステークホルダーと協力し、受け入れ基準の充足のレビューと確認を行い、UAT におけるユーザーテストのマネジメントを含むテスト活動を計画する、と述べている。コンポーネントテストの側に並んでいるのは、コンポーネントテスト（ユニットテスト）のスコープ、目的、完了基準を定義すること、テスト担当者をコードレビューのような従来のテストの役割を超えた活動に参加させて分析スキルが付加価値を生むようにすること、課題事項の解決やユニットテストの貢献のために開発チームと調整することで、残る三つはこれにそのまま当たる。1.2.5 はテストレベルごとにテストマネジメント活動を分けて並べており、問われているのは行為として正しいかどうかではなく、どのレベルの下に置かれているかである。","distractors":["テスト担当者を、コードレビューのような従来のテストの役割を超えた活動に参加させ、その分析スキルが付加価値を生むようにすることは、原文がコンポーネントテストの活動として挙げている。コードを読む作業は開発側の仕事だと考えるとこれを外したくなるが、シラバスはテスト担当者を参加させることをこのレベルのマネジメント活動に数えている。","コンポーネントテスト（ユニットテスト）のスコープ、目的、完了基準を定義することは、原文がこのレベルの活動の筆頭に挙げている。スコープや完了基準はテスト計画で一括して決めるものだと考えると、このレベルの活動ではないように見えるが、シラバスはレベルごとに定めるものとして置いている。",null,"課題事項の解決やユニットテストの貢献のために開発チームと調整することは、原文がこのレベルの活動として挙げている。開発チームとの調整は開発側の管理者の役目に見えるため、テストマネジメントの活動から外したくなるが、シラバスはこれをテストマネージャーの活動の側に置いている。"],"flip":[null,null,null,null],"flipNote":{"1":"テスト担当者を、コードレビューのような従来のテストの役割を超えた活動に参加させ、その分析スキルが付加価値を生むようにすることは、シラバスがコンポーネントテストの活動として名指しで挙げている。したがって、これが適切でないものになる余地は原文の側に無い。問うレベルを受け入れテストに替えれば適切でない側に回るが、そのときスコープ・目的・完了基準の定義も、開発チームとの調整も同時に適切でない側に回り、答えが三つになって一つ選べという形が成り立たない。","2":"コンポーネントテスト（ユニットテスト）のスコープ、目的、完了基準を定義することは、シラバスがこのレベルの活動の筆頭に挙げている。原文がそう置いている以上、これが適切でないものになることはない。問うレベルを受け入れテストに替えれば適切でない側に回るが、そのときコードレビューへの参加も開発チームとの調整も同時に適切でない側に回るため、やはり答えが三つになって一つ選べという形が壊れる。","4":"課題事項の解決やユニットテストの貢献のために開発チームと調整することは、シラバスがこのレベルの活動として挙げている。原文がそう置いている以上、これが適切でないものになることはない。問うレベルを替えたときに起きることも同じで、コンポーネントテストの活動が三つそろって適切でない側に回り、一つ選べという形が壊れる。"},"quote":"コンポーネントテスト（ユニットテスト）のスコープ、目的、完了基準を定義する。","ref":"1.2.5","misconception":"テストレベルごとの活動を、そのレベルでテストを実行する人が誰かで割り振っており、シラバスがどのレベルの下にどの活動を置いているかを区別できていない"},"meta":{"concept":"テストレベル別のテストマネジメント活動","distractorIntent":["レベルごとのスコープと完了基準の定義を、テスト計画に一括される活動だと考える","コードレビューへのテスト担当者の参加を、開発側の作業でこのレベルの活動ではないと考える","開発チームとの調整を、開発側の管理者の役目でテストマネジメントの活動ではないと考える"],"distractorTypes":["D12","D12","D12"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-91"]}},{"id":"q-1.2.6-A-1","lo":"TM-1.2.6","cluster":"1.2.6-A","variant":1,"chapter":1,"section":"1.2","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、テストタイプごとに何に重点を置くのかを、加わったばかりのメンバーに説明している。","question":"ブラックボックステストのマネジメントと、ホワイトボックステストのマネジメントの違いとして、最も適切なものはどれか。1つ選べ。","choices":["前者はユーザーに焦点を当てて外部との相互作用のカバーを見るのに対し、後者はコード構造に立って内部ロジックのカバーを見る","前者はコードカバレッジツールでギャップを見つけるのに対し、後者はステークホルダーから意見を集めてアプローチを洗練する","前者は定義した要件どおりに機能が動くことを確かめるのに対し、後者は性能やセキュリティといった属性を検証する","前者は要件と目的に沿ったテスト戦略を定めて進捗を追うのに対し、後者は機能面をカバーできるよう人と技術のリソースを割り当てる"],"answer":[0],"explanation":{"signals":"効くのは、どの二つのテストタイプを対比しているかという一点である。四つとも、シラバスが実在するテストタイプのマネジメントについて述べている内容を素材にしており、記述を単独で見れば原文どおりのものが多い。説明の相手が加わったばかりのメンバーであることは、どれが答えかを変えない。","why":"見る対象が外部との相互作用か、コードの内部ロジックか ── ブラックボックステストのマネジメントとホワイトボックステストのマネジメントを分けているのはここである。シラバス1.2.6 は、ブラックボックステストのマネジメントを、テストがユーザーに焦点を当てたものであり、想定されるすべての外部との相互作用を確実にカバーしていくものとし、ホワイトボックステストのマネジメントを、コード構造を理解し、テストが内部ロジックを徹底的にカバーすることを重視するものとしている。だから、ユーザーに焦点を当てて外部との相互作用のカバーを見るか、コード構造に立って内部ロジックのカバーを見るか、が正しい対比になる。定義した要件どおりに機能が動くかと、性能やセキュリティといった属性を検証するかという分かれ目は、同じ節が機能テストと非機能テストについて述べているものであって、この二つを分ける線ではない。","distractors":[null,"シラバスは、コードカバレッジツールの使用を統括してギャップを識別することをホワイトボックステストのマネジメントに、ステークホルダーからのフィードバックを収集してアプローチや欠陥修正を洗練することをブラックボックステストのマネジメントに置いている。この記述は、その二つをそっくり入れ替えている。どちらも原文に実在する活動であるため、語だけを拾うと正しく見える。","これは、シラバスが機能テストのマネジメントと非機能テストのマネジメントの違いとして述べている内容である。テストタイプの対比としては原文どおりだが、対にしている相手が違う。四つのテストタイプの分かれ目を一本の軸で覚えていると、そのまま当てはめてしまう。","機能要件とプロジェクト目的に沿った詳細なテスト戦略の策定と進捗モニタリングも、システムのすべての機能的側面をカバーするための人的および技術的リソースの効率的な割り当ても、シラバスはどちらも機能テストのマネジメントの下に並べている。この記述は、一つのテストタイプに属する二つの活動を、二つのテストタイプに割り振っている。"],"flip":[null,null,null,null],"flipNote":{"2":"この記述には誤りが二つある。シラバスはコードカバレッジツールの使用の統括をホワイトボックステストのマネジメントに、ステークホルダーからのフィードバックの収集をブラックボックステストのマネジメントに置いており、ここでは前半と後半の両方が入れ替わっている。前半だけを原文どおりに戻しても後半の割り当てが食い違い、後半だけを戻しても前半が食い違うため、一つの条件では正しくならない。","3":"前半は機能テストのマネジメント、後半は非機能テストのマネジメントについて、シラバスが述べている分かれ目である。記述そのものは原文どおりで、誤っているのは、どの二つを対比しているかという点だけである。機能テストと非機能テストの違いを問う設問であれば答えになるが、それは条件の変更ではなく設問の変更であり、そのときブラックボックスとホワイトボックスの対比を述べた記述のほうが誤りに変わる。","4":"戦略的な計画と進捗の追跡も、リソースの調整も、シラバスはどちらも機能テストのマネジメントの下に並べている二つの活動である。この記述の誤りは、その二つを別々のテストタイプに割り振った点にある。前半をブラックボックステストのマネジメントの記述に入れ替えても後半が機能テストの活動のまま残り、後半を入れ替えても前半が残るため、一つの条件では正しくならない。"},"quote":"ブラックボックステストのマネジメントは、テストがユーザーに焦点を当てたものであり、想定されるすべての外部との相互作用を確実にカバーしていく。ホワイトボックステストのマネジメントは、コード構造を理解し、テストが内部ロジックを徹底的にカバーすることを重視する。","ref":"1.2.6","misconception":"テストタイプのマネジメントの違いを「機能か非機能か」という一つの軸だけで覚えており、ブラックボックスとホワイトボックスを分ける軸（ユーザー視点の外部との相互作用か、コード構造の内部ロジックか）と区別できていない"},"meta":{"concept":"テストタイプ別のテストマネジメント活動","distractorIntent":["ブラックボックスとホワイトボックスの活動を、そのまま入れ替えて割り当てる","機能テストと非機能テストの分かれ目を、この対の分かれ目として当てはめる","機能テストのマネジメントの2つの活動を、2つのテストタイプに割り振る"],"distractorTypes":["D14","D1","D1"],"conceptNote":"未作成（K2 は conceptGate の対象外。TM-1.2.1〜1.2.6 を担当する概念ノートはまだ無い）","mistakePatterns":["MP-92"]}},{"id":"q-1.2.7-A-1","lo":"TM-1.2.7","cluster":"1.2.7-A","variant":1,"chapter":1,"section":"1.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは航空券と宿泊をまとめて予約できるオンライン旅行サービスのテストマネージャーである。開発は2週間の反復で進め、できた機能は随時本番に出している。利用者の8割はスマートフォンから予約し、決済は3社の代行サービスを使い分けている。\n\n先週の連休直前に出した版で、次の3つが起きた。ひとつ、予約が集中した時間帯に検索が返らなくなったが、応答時間や同時に使える人数は、そもそも確認すべき項目として挙がっていなかった。ふたつ、国内拠点と海外拠点が同じ画面を二重に見ていた一方、在庫連携の異常系はどちらの担当でもないまま抜けていた。みっつ、欠陥の滞留も反復ごとの計画とのずれも、出荷判定の会議で初めて共有された。","question":"次の反復から手を打つ。この3つに直接応えるテストマネジメント活動として、優先して着手すべきものを2つ選べ。","choices":["機能の要求と非機能の要求の両方を洗い出して計画上のテストの範囲に入れ直し、あわせて拠点ごとの担当範囲と役割、拠点間で何をいつ引き継ぐかの段取りを計画に書き込む。","反復ごとに各拠点で探索的テストのセッションを設け、回帰テストのケース数も1.5倍に増やして、これまで表に出ていなかった不具合を数多く見つける。","反復ごとの計画に照らして実行の進み具合と欠陥の滞留を継続的に確かめる枠組みを置き、そこで見えたずれを受けて、本番へ出してよいかを何を根拠に誰が決めるのかを先に取り決める。","性能の確認まで手が回らない状況なので、来月から実行担当を2名増やし、拠点ごとに反復あたりのテスト実行件数の目標値を割り当てて進み具合を測る。","性能テストと回帰テストをCI/CDパイプラインに組み込んで毎晩自動で流し、実行結果と欠陥の滞留を、拠点を問わず全員が見られるダッシュボードに常時映し出す。"],"answer":[0,2],"explanation":{"signals":"効くのは、先週の連休直前に出した版で起きた3つの出来事そのものである。応答時間や同時に使える人数が、そもそも確認すべき項目として挙がっていなかったこと。国内拠点と海外拠点が同じ画面を二重に見ていた一方で、在庫連携の異常系はどちらの担当でもないまま抜けていたこと。欠陥の滞留も反復ごとの計画とのずれも、出荷判定の会議で初めて共有されたこと。どれも「実行が足りなかった」という形では書かれておらず、何を確認すべき項目として挙げるか、誰がどこを持つか、状況をどう追って進退を決めるかという、テスト計画・テストモニタリング・テストコントロールの側の欠落として書かれている。利用者の8割がスマートフォンから予約していることと、決済に3社の代行サービスを使い分けていることは、どの選択肢の当否にも関与しない。","why":"着手すべきは、機能の要求と非機能の要求の両方を洗い出して計画上のテストの範囲に入れ直し、あわせて拠点ごとの担当範囲と役割、拠点間の引き継ぎの段取りまで計画に書き込む案と、反復ごとの計画に照らして実行の進み具合と欠陥の滞留を継続的に確かめる枠組みを置いたうえで、本番へ出してよいかを何を根拠に誰が決めるのかを先に取り決める案である。この2案を選ばせているのは、起きた3つの出来事が、どれも実行の量の不足としてではなく、確認すべき項目の決め方・担当の決め方・進退の決め方の欠落として書かれていることである。\n応答時間や同時に使える人数が、そもそも確認すべき項目として挙がっていなかった ── これは実行の失敗ではなく、範囲の決め方の失敗である。シラバスは包括的なスコープ定義について、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含む、と述べている。だから手当ては、非機能の要求を計画上の範囲に入れ直すところから始まる。国内拠点と海外拠点が同じ画面を二重に見ていた一方で、在庫連携の異常系がどちらの担当でもないまま抜けていたことも、同じテスト計画の活動に戻る。シラバスはリソース配置戦略を単なる配置にとどまらないものとし、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含むとしたうえで、オンサイト／オフサイトモデルのようにチームが分散している環境では、この点を維持することが特に重要になると名指ししている。二重と抜けが同時に起きるのは、担当の境目が引かれていないときの現れ方であって、手数では埋まらない。この2つはどちらも計画の側なので、範囲と役割を計画に書き直す1つの案にまとまる。\n残る1つは性質が違う。症状は、欠陥の滞留や計画とのずれがあったこと自体ではなく、それが出荷判定の会議まで共有されなかったことである。シラバスは実行の監視に、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含めている。ただし追うだけでは出荷の場面は変わらない。シラバスはテストコントロールの側に品質ゲートマネジメントを置き、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含むとしている。滞留とずれを計画に照らして追う枠組みと、出してよいかの根拠と決める人を先に置くことが組になって、初めてこの出来事に応える。こうして、前の2つは範囲と役割を計画に書き直す案が、残る1つは追う枠組みと出荷の取り決めを組にする案が引き受ける。","distractors":[null,"探索的テストのセッションを反復ごとに設け、回帰テストのケース数を1.5倍に増やすというのは、起きたことを実行の量の不足として読んだときの答えである。しかし3つのどれも、量の不足としては書かれていない。応答時間や同時に使える人数は、そもそも確認すべき項目として挙がっていなかったのだから、すでに挙がっているケースを1.5倍にしても、挙がっていない要求は増えた分のどこにも現れない。シラバスが包括的なスコープ定義に、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含むと述べているのは、まさにこの手前の段階である。探索的テストを反復ごとに回すこと自体は有効で、どちらの担当でもないまま抜けていた在庫連携の異常系が、その場で偶然見つかることもある。手数を増やす案が現場でいちばん早く効きそうに見えるのはそのためである。それでも、在庫連携の異常系を次からどちらの拠点が持つのかは決まらないままで、滞留とずれが出荷判定の会議まで共有されない段取りも、そのまま残る。",null,"実行担当を2名増やせば性能の確認に人手が回るので、ひとつ目の出来事には届いたように見える。だが、そこで足りなかったのは人手ではない。応答時間や同時に使える人数は確認すべき項目として挙がってすらいなかったので、人を足しても、誰も挙げていない項目は誰の担当にもならない。シラバスはリソース配置戦略について、これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む、と述べている。人数を足して拠点ごとに実行件数の目標値を配ることは、この文が単なる配置と呼んでいる側で止まっており、在庫連携の異常系をどちらの拠点が持つのかという空白は動かない。追う尺度も届いていない。シラバスは実行の監視に、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む、と述べている。拠点ごとの実行件数は消化した量を数えるだけで、欠陥の滞留も、出荷判定の場で何を根拠に誰が決めるのかも、そこからは見えるようにならない。","性能テストと回帰テストを毎晩自動で流し、実行結果と欠陥の滞留を拠点を問わず全員が見られるようにするこの案は、起きた3つのうち2つに手を伸ばしている。性能テストをパイプラインに載せれば、これまで確認すべき項目に挙がっていなかった性能は、この先は毎晩測られる。滞留が拠点を問わず常時見えるようになれば、出荷判定の会議で初めて知るという状態も変わる。それでも足りないものが残る。ひとつは、見えたずれを受けて何を変えるのか、本番へ出してよいかを何を根拠に誰が決めるのかである。シラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することと定め、品質ゲートマネジメントには、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。数字が常時映っていることと、その数字で進退を決める取り決めがあることは別である。もうひとつは担当の境目で、この案は在庫連携の異常系をどちらの拠点が持つのかには触れていない。全員が同じ画面を見られることと、誰がどこを持つかが決まっていることも、やはり別である。毎晩流す対象に何を入れるかも、結局どの要求を確認すべき項目として挙げたかで決まるので、範囲を決め直す手当ての代わりにはならない。"],"flip":[null,null,null,null,null],"flipNote":{"2":"この案が正面の答えになるのは、ひとつ目の出来事が「応答時間も同時に使える人数も確認すべき項目には挙がっていたが、反復の中で消化しきれず、未実施のまま出荷した」という形に変わったときである。だがその世界でも、在庫連携の異常系がどちらの担当でもないまま抜けていたことと、滞留とずれが出荷判定の会議まで共有されなかったことは、そのまま残る。範囲と役割を計画に書き直す案は担当の側でなお立ち、追う枠組みと出荷の取り決めを組にする案も立つので、優先して着手すべきものが3つになり、2つ選べという形式が成り立たなくなる。範囲の決め方と担当の決め方という2つの欠落を1つの案がまとめて引き受けている構造なので、出来事をひとつ動かしても、この案が入る席はできない。","4":"この案には独立した誤りが2つある。ひとつは前提で、増員が効くのは、応答時間や同時に使える人数が計画上の範囲には入っていたのに手が回らなかった場合だが、ここで起きているのは項目そのものの挙げ漏れである。もうひとつは追う尺度で、拠点ごとの実行件数は消化した量の集計であって、確立した計画に照らしたレビューでも、表面化した欠陥のマネジメントでもない。前提だけを差し替えても尺度の側が残り、両方を差し替えると、今度は優先して着手すべきものが3つになって2つ選べが成り立たなくなる。1条件では反転しない。","5":"この案が欠いているのは、見えたずれを受けて何を変えるのかと、本番へ出してよいかを何を根拠に誰が決めるのかの取り決めである。それを補うには、みっつ目の出来事を「滞留とずれを追う枠組みも、出してよいかの根拠と決める人も定まっているのに、拠点ごとに別々の表で見ていて同じ数字を全員が見られない」という形に変える必要があり、追う枠組みと出荷の取り決めの両方を、すでにあるものとしなければならない。片方だけを置いた世界では、その2つを組にして置く案が正しいまま立ち、この案は2つ目の席を取れない。要る条件が2つになるので、ここには条件を書かない。なお、在庫連携の異常系を誰が持つのかは、どの書き換えをしてもこの案の外にある。この案が取りにいけるのは、滞留を見えるようにする側の席だけである。反復ごとの計画とのずれは、計画に照らす相手を先に置いた案の側にしか現れない。"},"quote":"これには、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含む。…これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.2.7（包括的なスコープ定義／リソース配置戦略／実行の監視／品質ゲートマネジメント）","misconception":"本番で表面化した出来事を実行の量の不足として読み、確認すべき項目の決め方・担当の決め方・進退を決める段取りという、テスト計画・テストモニタリング・テストコントロールの側の欠落に戻して考えていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["症状に対して実行の手数を増やすことで応えたつもりになる（探索的テストと回帰のケース数）","人手の追加と実行件数の目標配分で応え、役割の定義と計画に照らした追跡に戻らない","自動実行と可視化までは置くが、見えたずれを受けて何を変えるかと、進退を決める段取りが無い"],"distractorTypes":["D13","D13","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-07","MP-33","MP-38"]}},{"id":"q-1.2.7-A-2","lo":"TM-1.2.7","cluster":"1.2.7-B","variant":1,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは証券会社の顧客資産管理システムを、自社のデータセンターからクラウドへ移す作業のテストマネージャーである。移行は口座の種別ごとに6回に分けて行い、期間中は新旧の環境が並行して動く。開発は2週間の反復で、移行と並行して既存機能の改修も続く。チームは東京・大阪・ホーチミンの3拠点に分かれている。利用者は約40万人で、残高の照会の9割はモバイルアプリからである。\n\n各回を実施してよいかは、その時点の残高計算の突合の結果と、その回で新たに見えた懸念の扱いを踏まえて決めると社内で合意している。ただし、突合で出た差異をどこまでなら可とするのか、最終的に誰が可否を決めるのかは回ごとの会議での相談に委ねられており、前回はその場で結論が出ず、判断は持ち越されたままである。回を追うごとに対象の口座の種別が変わり、前の回には無かった懸念が毎回出ている。経営会議では、今回最優先に置くのは、各回について進めてよいかを根拠をもって示せる状態を保つことと、回ごとに変わる懸念を取りこぼさないことだと確認された。","question":"テストマネジメント活動の組合せとして、この文脈で最も適切な判断はどれか。1つ選べ。","choices":["回ごとに懸念を洗い直して軽減の手立てを計画に反映し、計画に照らして実行の進み具合と欠陥の状況を追い、次の回へ進む条件と決める人をあらかじめ定めて、その結果を受けて残りの回の進め方を組み直す。","3拠点それぞれの担当範囲と役割を計画で明確にし、回ごとの引き継ぎと連絡の手順を定めて、どの拠点でも同じ手順書と同じ環境で確認できる状態を整える。","回ごとに移行先の環境へ本番と同等の口座のデータを用意し直し、環境とテストデータの版を管理の対象に加えて、どの版でどの種別をどこまで確認したのかを、後から証跡としてそのまま取り出せる形に整えておく。","各回の結果を経営会議と監査部門が同じ情報で判断できるよう、突合の件数と検出した欠陥の推移をまとめた報告の様式を整え、毎回の定例で共有する。"],"answer":[0],"explanation":{"signals":"効くのは、経営会議で今回最優先に置くと確認された2点である。各回について進めてよいかを根拠をもって示せる状態を保つことと、回ごとに変わる懸念を取りこぼさないことである。これを支える与件が2つ置かれている。各回の実施可否はその時点の残高計算の突合の結果と、その回で新たに見えた懸念の扱いを踏まえて決めると社内で合意しているものの、突合で出た差異をどこまでなら可とするのかも、最終的に誰が可否を決めるのかも回ごとの会議での相談に委ねられたままで、前回はその場で結論が出ず判断が持ち越されていること。そして、回を追うごとに対象の口座の種別が変わり、前の回には無かった懸念が毎回出ていることである。利用者が約40万人で残高の照会の9割がモバイルアプリからであることは、どの選択肢の当否にも関与しない。4つの案はどれもテストマネジメントの活動として筋が通っており、事実として誤っているものは無い。分かれ目は、最優先に置かれた2点に直接応えているかだけである。","why":"採るべきは、回ごとに懸念を洗い直して軽減の手立てを計画に反映し、計画に照らして実行の進み具合と欠陥の状況を追い、次の回へ進む条件と決める人をあらかじめ定めて、その結果を受けて残りの回の進め方を組み直す案である。これを選ばせているのは、経営会議が今回最優先に置くと確認した2点 ── 各回について進めてよいかを根拠をもって示せる状態を保つことと、回ごとに変わる懸念を取りこぼさないこと ── に、この案が要素ごとに対応していることである。\n懸念の側から見る。回を追うごとに対象の口座の種別が変わり、前の回には無かった懸念が毎回出ている。シラバスはテスト計画の不可欠な要素として強固なリスクマネジメントの枠組みがあるとし、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、軽減戦略の策定は重要である、と述べている。毎回新しい懸念が出る以上、この分析は初回で終わらず、回ごとに洗い直して計画へ戻すことになる。洗い直した手当てが効いているかは、シラバスが実行の監視に含めている、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることによって見える。\n進退の側はテストコントロールに移る。このプロジェクトで合意できているのは、突合の結果とその回で新たに見えた懸念の扱いを踏まえるという判断材料の種類までで、差異をどこまで可とするのかも、最終的に誰が決めるのかも回ごとの会議に委ねられたままであり、前回はその場で結論が出なかった。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。各回の可否を根拠をもって示せる状態とは、この定義と意思決定が先に置かれている状態のことであり、次の回へ進む条件と決める人をあらかじめ定めるという要素が効くのはそのためである。さらにシラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することと定めており、決めた結果を残りの回の進め方に反映するところまでが、この活動に含まれる。\n残る3つが外れるのは、活動として不適切だからではない。どれもシラバスに活動としての裏づけがある。ただし裏づけの置かれ方は同じではない。拠点ごとの担当範囲と役割を計画で定めることはリソース配置戦略そのものであり、状況をステークホルダーに分かる形で伝えることもシラバスが特に重要だとしている。一方、環境とテストデータの版を管理して証跡として取り出せるようにすることの裏づけは、シラバスがツールと環境の最適化に置いている、テストツールとテスト環境の賢明な選択と使用は、テスト戦略をサポートするために非常に重要である、という一文にある。ただしこの案が整えているのは、済んだ確認を後からたどれるようにする側であって、毎回新しく出る懸念を突き止めることでも、各回の進退を決めることでもない。外れるのは順位である。この文脈で削れないものとして置かれたのは各回の進退の判断と懸念の取りこぼしであり、その2つに直接応える案が他にあるときに、それらより前に置く根拠が無い。","distractors":[null,"3拠点の担当範囲と役割を計画で明確にし、回ごとの引き継ぎと連絡の手順を定めることは、シラバスがリソース配置戦略として明記している活動である。原文はさらに、オンサイト／オフサイトモデルのようにチームが分散している環境では、同期を保ち、円滑な協力を確保するために、この点を維持することが特に重要になる、と分散した環境を名指ししており、東京・大阪・ホーチミンという事実がこの案を後押しする。文脈の語とシラバスの記述の両方が揃うので、最も選ばれやすい。それでも最優先に置かれたのは、各回の進退を根拠をもって示せることと、懸念の取りこぼしを防ぐことである。どの拠点でも同じ手順書と同じ環境で確認できる状態が整っても、回ごとに新しく出る懸念を洗い直す手立てはそこからは生まれないし、差異をどこまで可とするのかも、誰が決めるのかも、回ごとの会議に委ねられたままである。","移行先の環境へ本番と同等の口座のデータを用意し直し、環境とテストデータの版を管理して、どの版でどの種別をどこまで確認したのかを証跡として取り出せるようにすることは、金融機関の移行では現実に欠かせない備えである。シラバスもツールと環境の最適化について、テストツールとテスト環境の賢明な選択と使用は、テスト戦略をサポートするために非常に重要である、としている。ただし、この案が置いているのは、済んだ確認を後からたどれるようにする整備である。シラバスがテストマネージャーに求めているのは、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めることであり、テストコントロールは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。版をたどれるようにすることは、前の回には無かった懸念を毎回突き止めることでも、それを受けて次の回の進め方を変えることでもない。","各回の結果を経営会議と監査部門が同じ情報で判断できるようにすることは、この文脈でも確かに要る。シラバスも、特に重要なのは、プロジェクトやビジネスのステークホルダーにとって理解しやすく、関連性のある形でテスト作業成果物や活動のステータスを伝える必要があることである、と述べている。この案が届かないのは、最優先の片方、各回について進めてよいかを根拠をもって示せる状態のほうである。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めており、定義と意思決定の両方を求めている。突合の件数と検出した欠陥の推移をまとめた様式を整えて毎回の定例で配ることは、何をもって進めてよいとするかの定義を置かないまま、その判断を受け手の側に預けることである。差異をどこまで可とするのかも最終的な決定者も回ごとの会議に委ねられたままである以上、同じ数字を同じ様式で配っても、前回のように結論が出ないまま持ち越される状態は変わらない。もう片方の、毎回新しく出る懸念を洗い直すことにも触れていない。"],"flip":[null,null,null,null],"flipNote":{"2":"最優先の一文を、3拠点の間で確認の粒度をそろえることに差し替えても、この状況には2つの文が残る。突合で出た差異をどこまで可とするのかも最終的な決定者も回ごとの会議に委ねられ、前回は結論が出ないまま持ち越されていること。そして、回を追うごとに対象の種別が変わり、前の回には無かった懸念が毎回出ていること。懸念を回ごとに洗い直して計画に照らして追い、進む条件と決める人を先に定める案はこの2文に正面から応えるので、条件を当ててもそのまま立ち、妥当な案が2つになる。一方、拠点の粒度そろえが解くはずの手戻りや二重作業は、この状況に症状として1つも現れていない。この案だけを答えにするには、求めの差し替えに加えて、残る2文が描く状態も先に片づいていることまで要る。","3":"最優先の一文を、当局の検査へそのまま示せることに差し替えても、前の回には無かった懸念が毎回出ているという一文と、許容できる差異の幅も決定者も会議に委ねられ判断が持ち越されたままだという一文は残る。版をたどれるようにすることは、毎回新しく出る懸念を突き止めることでも、次の回へ進んでよい条件と決める人を置くことでもないので、その2文に応える案 ── 懸念を回ごとに洗い直し、計画に照らして追い、進む条件と決める人を先に定める案 ── が正しいまま立ち、妥当な案が2つになる。証跡の整備が単独で首位に立つには、求めの差し替えに加えて、懸念の出方と可否の決め方が既に落ち着いていることまで併せて要る。","4":"求めを、経営会議と監査部門が同じ情報で理解できることに差し替えても、差異の許容幅も最終的な決定者も回ごとの会議に委ねられたままだという一文は残る。同じ数字を同じ様式で配っても前回のように持ち越される状態は変わらないので、そこを先に定める案が正しいまま立ち、妥当な案が2つになる。逆に、許容幅と決定者が先に定まった世界を条件にすると、今度は前の回には無かった懸念が毎回出ているという一文が残り、それを回ごとに洗い直す案がやはり立つ。報告の整備がこの状況の答えになるには、2文の両方が片づいていることが要り、条件が2つになる。"},"quote":"テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.1.2（ステータスの伝達）、1.2.7（リスクアセスメントと軽減計画／実行の監視／適応的なプロセスマネジメント／品質ゲートマネジメント）","misconception":"選択肢に書かれた活動がシラバス上正しいかどうかだけで判定し、このプロジェクトで最優先に置かれた関心に直接応えているかを判定していない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["分散チームへの手当て（リソース配置戦略）を、明示された最優先より前に置く","環境とデータの版管理という済んだ確認の整備を、毎回変わる懸念の把握と進退の判断より前に置く","ステークホルダーへの報告の整備を、何をもって進めてよいとするかの定義と意思決定の代わりに置く"],"distractorTypes":["D4","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-38"]}},{"id":"q-1.2.7-A-3","lo":"TM-1.2.7","cluster":"1.2.7-A","variant":2,"chapter":1,"section":"1.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは食品スーパーのネットスーパーのテストマネージャーである。開発は1週間の反復で進め、毎週金曜に本番へ出している。取扱商品は約2万点で、注文の6割は平日の夜8時以降に入る。\n\n本番で起きた不具合について、ふりかえりで次の3点が挙がった。\n\n・出た不具合の多くは、クーポンと会員区分と配送枠の期限が重なったときの計算違いだが、テストケースは画面の操作手順からだけ起こしており、処理の分岐をたどる観点からは作っていなかった\n・開発側は改修のたびに影響の及ぶ範囲を把握していたが、それがテスト側に伝わるのは本番へ出す前日で、事前に確かめる対象を組み替える余地が無かった\n・検証用の環境は、注文を受ける側の設定が半年前のままで本番と食い違っており、毎晩の自動テストもそこで流れている。食い違いは月次の報告に載っているが、テストの進め方は着手時のままである\n\n検証用の環境は、この先も配送の委託先の追加や決済の切り替えに合わせて設定が変わる予定がある。テスト担当は5名で、毎週の反復の初めに時間を取ることはできる。","question":"次の1か月で手を打つ。この3点に直接応えるテストマネジメント活動として、優先して着手すべきものを2つ選べ。","choices":["本番で出た不具合それぞれに、画面の操作手順をなぞって同じ条件を再現するテストケースを足し、毎週の反復で流すケースの総数を増やして、同じ不具合の再発を止める。","画面の操作手順からたどる観点に加えて処理の分岐をたどる観点もテストの範囲に入れ直し、改修で影響の及ぶ範囲を開発チームと持ち寄る場を毎週の反復の初めに設け、確かめる対象を事前に決める。","毎晩の自動テストで流すケースを全商品区分に広げ、落ちたケースはその都度テスト担当5名で手分けして確かめて、一晩あたりの確認の量を厚くする。","検証用の環境と自動テストへの組み込みが、いま確かめたい対象に合っているかを継続的に確かめる枠組みを置き、そこで見えた食い違いを受けて反復の途中でもテストの対象と進め方を組み直す。","検証用の環境を本番と同じ設定に作り直し、その構築の手順を毎晩の自動テストに組み込んで、以後は毎回そろった環境で流せるようにする。"],"answer":[1,3],"explanation":{"signals":"効くのは、ふりかえりで挙がった3点そのものである。テストケースは画面の操作手順からだけ起こしており、処理の分岐をたどる観点からは作っていなかったこと。開発側は改修のたびに影響の及ぶ範囲を把握していたが、それがテスト側に伝わるのは本番へ出す前日で、事前に確かめる対象を組み替える余地が無かったこと。検証用の環境は、注文を受ける側の設定が半年前のままで本番と食い違っており、その旨が月次の報告に載っていてもテストの進め方は着手時のままであること。どれも実行の件数が足りなかったという形では書かれていない。手当ての形を決めるのは、さらに2つの与件である。検証用の環境は、この先も配送の委託先の追加や決済の切り替えに合わせて設定が変わる予定があること。そして、毎週の反復の初めに時間を取ることはできることである。取扱商品が約2万点であることと、注文の6割が平日の夜8時以降に入ることは、どの選択肢の当否にも関与しない。","why":"着手すべきは、画面の操作手順からたどる観点に加えて処理の分岐をたどる観点もテストの範囲に入れ直し、改修で影響の及ぶ範囲を開発チームと持ち寄る場を毎週の反復の初めに設ける案と、検証用の環境と自動テストへの組み込みが、いま確かめたい対象に合っているかを継続的に確かめる枠組みを置いて、見えた食い違いを受けて反復の途中でも対象と進め方を組み直す案である。この2つを選ばせているのは、ふりかえりで挙がった3点が、どれも確認の量が足りなかったという形では書かれていないことである。\n1点目と2点目は、どちらも同じ手当てに戻る。1点目は、テストケースは画面の操作手順からだけ起こしており、処理の分岐をたどる観点からは作っていなかった、と書かれている。足りないのは件数ではなく観点であり、シラバスは包括的なスコープ定義について、ブラックボックステストとホワイトボックステストの両方の方法論を考慮し、開発したテストケースであらゆる角度からシステムの妥当性を確認できるようにすることも含む、と述べている。クーポンと会員区分と配送枠の期限が重なったときの計算違いは、画面をたどる順序からは出てこない道筋で起きるので、範囲の決め方をここへ戻すところから始まる。2点目は、開発側が改修のたびに影響の及ぶ範囲を把握していたのに、それがテスト側に伝わるのは本番へ出す前日で、事前に確かめる対象を組み替える余地が無かった、という形である。シラバスは開発チームとのコラボレーションについて、ホワイトボックスとブラックボックスの両方の視点からの洞察を活用して、潜在的な課題事項に事前に対処すべきである、としている。前日に届く知らせでは事前に対処できないが、毎週の反復の初めに時間を取ることはできるのだから、持ち寄る場をそこに置ける。この2点は、どの観点でテストケースを起こすかと、改修の影響をいつ受け取るかという一続きの手当てなので、1つの案にまとまる。\n残る1点は性質が違う。検証用の環境は、注文を受ける側の設定が半年前のままで本番と食い違っており、その食い違いは月次の報告に載っているのに、テストの進め方は着手時のままである。シラバスはツールと環境の最適化について、継続的モニタリングによって、それらがCI/CD パイプラインに効果的に統合され、と述べている。統合が保たれる手立てとしてここに置かれているのが継続的なモニタリングであり、環境と自動テストへの組み込みが、いま確かめたい対象に合っているかを見続けることがそれに当たる。そしてシラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めている。合っているかを継続的に確かめる枠組みと、そこで見えた食い違いを受けて対象と進め方を組み直すことが組になって、初めてこの1点に応える。こうして、前の2点は観点と持ち寄る場を置く案が、残る1点は継続的に確かめる枠組みと組み直しを対にする案が引き受ける。","distractors":["本番で出た不具合それぞれに、画面の操作手順をなぞって同じ条件を再現するテストケースを足すのは、起きたことを二度と起こさないための、現場でいちばん早く手の付く策である。だが1点目は、テストケースは画面の操作手順からだけ起こしており、処理の分岐をたどる観点からは作っていなかった、という形で書かれている。すでに表に出た不具合を再現する分を足しても、まだ出ていない分岐の重なりは、増えたケースのどこにも現れない。シラバスが包括的なスコープ定義に、ブラックボックステストとホワイトボックステストの両方の方法論を考慮し、開発したテストケースであらゆる角度からシステムの妥当性を確認できるようにすることも含む、と書いているのは、この手前の段階である。改修の影響がテスト側に届く時点も、検証用の環境の食い違いも、この案の外に残る。",null,"毎晩の自動テストで流すケースを全商品区分に広げ、落ちたケースをその都度5名で手分けして確かめる案は、一晩あたりに確かめる量を確かに厚くする。厚くなるのは量で、流す先は変わらない。検証用の環境は、注文を受ける側の設定が半年前のままで本番と食い違っており、そこで何件流しても、本番で起きる条件を確かめたことにはならない。シラバスはツールと環境の最適化について、継続的モニタリングによって、それらがCI/CD パイプラインに効果的に統合され、と述べている。統合が保たれる手立てとしてここに置かれているのは継続的なモニタリングであって、一晩に流す件数でも手分けする人数でもない。",null,"検証用の環境を本番と同じ設定に作り直し、その構築の手順を毎晩の自動テストに組み込む案は、3点目の原因に正面から応えており、食い違いの是正を人手に頼らない形にまでしている点で、5つの中でもっとも手堅く見える。それでも足りないものが2つ残る。ひとつは持ちである。検証用の環境は、この先も配送の委託先の追加や決済の切り替えに合わせて設定が変わる予定があるので、いま一度そろえても、次に設定が変わった時点で同じ食い違いが戻る。合っているかを継続的に確かめる枠組みを置かないかぎり、気づくのはまた月次の報告になる。もうひとつは、見えた食い違いを受けて何を変えるのかである。シラバスはテストコントロールを、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めている。環境がそろうことと、そろっていないと分かったときにテストの対象と進め方が動くことは別である。"],"flip":[null,null,null,null,null],"flipNote":{"1":"この案が正面の答えになるのは、1点目が「処理の分岐をたどる観点でもテストケースは起こしてあったが、反復の中で流し切れず、未実施のまま出荷していた」という形に変わったときである。だがその世界でも、改修で影響の及ぶ範囲がテスト側に届くのは本番へ出す前日のままで、検証用の環境が本番と食い違っている状態も残る。観点と持ち寄る場を置く案は2点目の側でなお立ち、継続的に確かめる枠組みと組み直しを対にする案も立つので、優先して着手すべきものが3つになり、2つ選べという形式が成り立たなくなる。どの観点でケースを起こすかと、改修の影響をいつ受け取るかの2つを1つの案がまとめて引き受けている構造なので、挙がった1点を書き換えても、この案が入る席はできない。","3":"この案には独立した誤りが2つある。ひとつは流す先で、検証用の環境は、注文を受ける側の設定が半年前のままで本番と食い違っているため、一晩の件数を増やしても本番の条件は確かめられない。もうひとつは起こし方で、広げる対象はもともと画面の操作手順からだけ起こしたケースなので、全商品区分に広げても分岐の重なりには届かない。環境をそろえる条件を当てれば起こし方の側が残り、起こし方を直す条件を当てれば流す先の側が残る。両方を同時に直した世界では、観点と持ち寄る場を置く案も継続的に確かめる枠組みを置く案もそのまま立つので、今度は優先して着手すべきものが3つになる。1条件では反転しない。","5":"この案を正面の答えにするには、検証用の環境の設定がこの先変わらないと置いたうえで、見えた食い違いを受けて対象と進め方を組み直す段取りも、すでにあるものとしなければならない。要る書き換えが2つになるので、ここには条件を書かない。片方だけを置いた世界では、継続的に確かめる枠組みと組み直しを対にする案が正しいまま立ち、この案は2つ目の席を取れない。なお、どの観点でテストケースを起こすかと、改修で影響の及ぶ範囲をいつ受け取るかは、どの書き換えをしてもこの案の外にある。この案が取りにいけるのは、検証用の環境の側の席だけである。"},"quote":"ブラックボックステストとホワイトボックステストの両方の方法論を考慮し、開発したテストケースであらゆる角度からシステムの妥当性を確認できるようにすることも含む。…継続的モニタリングによって、それらがCI/CD パイプラインに効果的に統合され、アジャイル開発プロセスに不可欠な継続的テストと即時フィードバックループが促進される。…ホワイトボックスとブラックボックスの両方の視点からの洞察を活用して、潜在的な課題事項に事前に対処すべきである。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。","ref":"1.2.7（包括的なスコープ定義／ツールと環境の最適化／開発チームとのコラボレーション／適応的なプロセスマネジメント）","misconception":"本番で表面化した出来事を確認の量の不足として読み、どの観点でテストケースを起こすか、改修の影響をいつ受け取るか、環境と自動テストが確かめたい対象に合っているかを継続的に見て進め方を組み直すか、というテスト計画・テストモニタリング・テストコントロールの側の欠落に戻して考えていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["すでに表に出た不具合の再現を積み増すことで、観点の欠落に応えたつもりになる","一晩に流す量と手分けする人数を増やし、流す先の環境が本番と食い違っていることに戻らない","環境の食い違いを一度そろえるところまでは置くが、合っているかを継続的に確かめることと、見えた食い違いを受けて進め方を組み直すことが無い"],"distractorTypes":["D13","D13","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-07","MP-33","MP-38"]}},{"id":"q-1.2.7-A-4","lo":"TM-1.2.7","cluster":"1.2.7-A","variant":3,"chapter":1,"section":"1.2","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは自動車保険のオンライン見積もり・契約サービスのテストマネージャーである。開発は2週間の反復で進め、できた機能はその反復の終わりに本番へ出している。契約の約7割は他社からの乗り換えで、書類の受け渡しは代理店の窓口と郵送の2つの経路がある。\n\n先月の更新が集中する時期に出した版で起きたことについて、ふりかえりで3人が次のように述べた。\n\n運用の担当: 見積もりの一覧が開かなくなったのは申込が重なった時間帯だが、同時にさばける申込の数も画面が返るまでの時間も、確かめる項目として挙げていなかった。\n拠点のリーダー: 東京と福岡の2拠点で契約の入力画面を重ねて確かめていた一方、代理店から届く書類の取り込みで様式が崩れたときの動きは、どちらの拠点の受け持ちにもなっていなかった。\n品質の会議の記録: 直っていない欠陥がたまっていることも、反復ごとの計画との開きも、本番へ出すかを決める会議の場で初めて表に出た。","question":"次の反復から手を打つ。この3つに直接応えるテストマネージャーの手立てとして、先に着手すべきものを2つ選べ。","choices":["確認まで手が回っていないので、来月から実行の担当を2名足し、拠点ごとに反復あたりの確認の件数の目標を配って進み具合を測る。","同時にさばける申込の数と画面が返るまでの時間を確かめる項目として計画上の範囲に入れ直し、あわせて2拠点それぞれの受け持ちと、代理店から届く書類の取り込みを誰がいつ確かめるのかの段取りを計画に書き足す。","見積もりの応答と契約の入力の確認を毎晩自動で流す形にして、流した結果と直っていない欠陥のたまり方を、拠点を問わず誰でも開ける画面に常時映し出す。","更新の集中期に出た不具合をなぞる再現の手順を反復ごとに書き足し、毎回流す確認の本数を二倍にして、これまで拾えていなかった不具合を数多く拾う。","反復ごとの計画と突き合わせて実行の進み具合と直っていない欠陥のたまり方を絶えず確かめる場を置き、そこで見えた開きをもとに本番へ出してよいと言える根拠と決める人を先に取り決める。"],"answer":[1,4],"explanation":{"signals":"手がかりは、ふりかえりで3人が述べたことそのものである。同時にさばける申込の数も画面が返るまでの時間も、確かめる項目として挙げていなかったこと。東京と福岡の2拠点で契約の入力画面を重ねて確かめていた一方、代理店から届く書類の取り込みで様式が崩れたときの動きは、どちらの拠点の受け持ちにもなっていなかったこと。直っていない欠陥がたまっていることも、反復ごとの計画との開きも、本番へ出すかを決める会議の場で初めて表に出たこと。3つとも、確認をこなす量が足りなかったという形では述べられておらず、何を確かめる項目として挙げるか、誰がどこを持つか、状況をどう追って進退を決めるかという側の抜けとして述べられている。契約の約7割が他社からの乗り換えであることと、書類の受け渡しに代理店の窓口と郵送の2つの経路があることは、どの案の当否にも関わらない。","why":"先に着手すべきは、確かめる項目と受け持ちを計画に書き直す案と、計画と突き合わせて追う場を置いたうえで出してよいと言える根拠と決める人を取り決める案である。3人が述べたことが、どれも確認の量の不足としてではなく、項目の決め方・受け持ちの決め方・進退の決め方の抜けとして述べられているからである。\n同時にさばける申込の数も画面が返るまでの時間も、確かめる項目として挙げていなかった ── これは実行の失敗ではなく、範囲の決め方の失敗である。シラバスは包括的なスコープ定義について、これには、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含む、と述べている。だから手当ては、挙げていなかった項目を計画上の範囲へ入れ直すところから始まる。東京と福岡の2拠点で契約の入力画面を重ねて確かめていた一方、代理店から届く書類の取り込みで様式が崩れたときの動きは、どちらの拠点の受け持ちにもなっていなかったことも、同じ計画の活動に戻る。シラバスはリソース配置戦略を、これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む、としている。重なりと抜けが同時に起きるのは、受け持ちの境目が引かれていないときの現れ方であって、手数では埋まらない。この2つはどちらも計画の側なので、範囲と受け持ちを書き直す1つの案にまとまる。\n残る1つは性質が違う。述べられているのは、欠陥がたまっていたことや計画との開きがあったこと自体ではなく、直っていない欠陥がたまっていることも、反復ごとの計画との開きも、本番へ出すかを決める会議の場で初めて表に出たことである。シラバスは実行の監視に、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含めている。ただし追うだけでは出す場面は変わらない。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む、としている。絶えず確かめる場と、出してよいと言える根拠と決める人の取り決めが組になって、初めてこの1つに応える。こうして、前の2つは範囲と受け持ちを書き直す案が、残る1つは追う場と出す取り決めを組にする案が引き受ける。","distractors":["実行の担当を2名足せば確認に人手が回るので、1つ目に述べられたことには届いたように見える。だが、そこで足りなかったのは人手ではない。同時にさばける申込の数も画面が返るまでの時間も、確かめる項目として挙げていなかったのだから、人を足しても、誰も挙げていない項目は誰の受け持ちにもならない。シラバスはリソース配置戦略について、これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む、と述べている。人数を足して拠点ごとに件数の目標を配ることは、この文が単なる配置と呼んでいる側で止まっており、書類の取り込みで様式が崩れたときの動きをどちらの拠点が持つのかという空白は動かない。追う尺度も届いていない。シラバスは実行の監視に、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む、と述べている。拠点ごとの件数はこなした量を数えるだけで、直っていない欠陥のたまり方も、出すかを決める場で何を根拠に誰が決めるのかも、そこからは見えるようにならない。",null,"見積もりの応答と契約の入力の確認を毎晩自動で流し、結果とたまり方を誰でも開ける画面に映し出すこの案が手を伸ばしているのは、述べられた3つのうち、たまった欠陥と計画との開きが本番へ出すかを決める会議で初めて表に出た、という1つである。毎晩自動で流す形にすれば、いま挙げている確認が落ちたことに気づくのは早くなり、たまり方が常時見えるようになれば、会議で初めて表に出るという運びも変わる。それでも残るものがある。1つは、見えた開きを受けて何を変えるのか、本番へ出してよいと言える根拠と決める人をどう置くのかである。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む、としている。数字が常時映っていることと、その数字で進退を決める取り決めがあることは別である。もう1つは受け持ちの境目で、この案は、代理店から届く書類の取り込みで様式が崩れたときの動きをどちらの拠点が持つのかには触れていない。誰でも同じ画面を開けることと、誰がどこを持つかが決まっていることも、やはり別である。そして、毎晩流す対象に何を入れるかも、結局どれを確かめる項目として挙げたかで決まる。同時にさばける申込の数も画面が返るまでの時間も挙げていなかったのだから、毎晩自動で流す形にしただけでは、その2つは流す対象に入らず、範囲を決め直す手当ての代わりにはならない。","出た不具合をなぞる再現の手順を書き足し、毎回流す確認の本数を二倍にするというのは、起きたことを確認の量の不足として読んだときの答えである。しかし3つのどれも、量の不足としては述べられていない。同時にさばける申込の数も画面が返るまでの時間も、確かめる項目として挙げていなかったのだから、すでに挙がっている確認を二倍にしても、挙げていなかった項目は増えた分のどこにも現れない。シラバスが包括的なスコープ定義に、これには、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含む、と述べているのは、この手前の段階である。出た不具合をなぞること自体は有効で、書類の取り込みで様式が崩れたときの動きが、その過程で偶然見つかることもある。手数を増やす案が現場でいちばん早く効きそうに見えるのはそのためである。それでも、その動きを次からどちらの拠点が持つのかは決まらないままで、たまった欠陥と計画との開きが出すかを決める会議まで表に出ない運びも、そのまま残る。",null],"flip":[null,null,null,null,null],"flipNote":{"4":"この案が正面の答えになるのは、1つ目に述べられたことが「同時にさばける申込の数も画面が返るまでの時間も確かめる項目には挙がっていたが、反復の中で流しきれず、未実施のまま出した」という形に変わったときである。だがその世界でも、書類の取り込みで様式が崩れたときの動きがどちらの拠点の受け持ちにもなっていなかったことと、たまった欠陥と計画との開きが出すかを決める会議で初めて表に出たことは、そのまま残る。範囲と受け持ちを書き直す案は受け持ちの側でなお立ち、追う場と出す取り決めを組にする案も立つので、先に着手すべきものが3つになり、2つ選べという形式が成り立たなくなる。範囲の決め方と受け持ちの決め方という2つの抜けを1つの案がまとめて引き受けている構造なので、述べられたことを1つ動かしても、この案が入る席はできない。","3":"この案が欠いているのは、見えた開きを受けて何を変えるのかと、本番へ出してよいと言える根拠と決める人の取り決めである。それを補うには、3つ目に述べられたことを「たまり方を追う場も、出してよいと言える根拠と決める人も定まっているのに、拠点ごとに別々の表で見ていて同じ数字を誰も突き合わせられない」という形に変える必要があり、追う場と出す取り決めの両方を、すでにあるものとしなければならない。片方だけを置いた世界では、その2つを組にして置く案が正しいまま立ち、この案は2つ目の席を取れない。要る条件が2つになるので、ここには条件を書かない。なお、書類の取り込みで様式が崩れたときの動きを誰が持つのかは、どの書き換えをしてもこの案の外にある。この案が取りにいけるのは、たまり方を見えるようにする側の席だけである。","1":"この案には独立した誤りが2つある。1つは前提で、人を足すことが効くのは、同時にさばける申込の数や画面が返るまでの時間が計画上の範囲には入っていたのに手が回らなかった場合だが、ここで述べられているのは項目そのものを挙げていなかったことである。もう1つは追う尺度で、拠点ごとの件数はこなした量の集計であって、確立した計画に照らしたレビューでも、表面化した欠陥のマネジメントでもない。前提だけを差し替えても尺度の側が残り、両方を差し替えると、今度は先に着手すべきものが3つになって2つ選べが成り立たなくなる。1つの条件では反転しない。"},"quote":"これには、完全なテストカバレッジを確保するために、すべての機能要件と非機能要件を識別することを含む。…これは単なる配置にとどまらず、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを含む。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.2.7（包括的なスコープ定義／リソース配置戦略／実行の監視／品質ゲートマネジメント）","misconception":"本番で表に出たことを確認の量の不足として読み、確かめる項目の決め方・受け持ちの決め方・進退を決める段取りという、テスト計画・テストモニタリング・テストコントロールの側の抜けに戻して考えていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["人手の追加と件数の目標配分で応え、役割の明確化と計画に照らした追跡に戻らない","自動実行と常時の表示までは置くが、見えた開きを受けて何を変えるかと、進退を決める段取りが無い","述べられたことに確認の手数を増やすことで応えたつもりになる（再現の手順の積み増しと本数の二倍）"],"distractorTypes":["D13","D3","D13"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-07","MP-33","MP-38"]}},{"id":"q-1.2.7-B-2","lo":"TM-1.2.7","cluster":"1.2.7-B","variant":2,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは放送局の見逃し配信サービスを作り直すテストマネージャーである。分かっているのは次のとおりである。\n・公開は3つの節目に分けて範囲を広げる。社員向けの先行公開、2県に限った限定公開、全国公開の順である。\n・開発は3週間の反復で進める。\n・受け皿は自社アプリとテレビ受像機向けアプリの2つで、字幕と広告は外部の2社が担う。\n・視聴は夜9時台に集中し、同時視聴数は平均の6倍になる。\n・各節目へ進んでよいかは、その時点の再生の失敗率と、新しく分かった懸念の扱いを見て決めることで社内は一致している。\n・ただし、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられている。先月の会議は結論が出ないまま終わった。\n・節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ている。\n・編成局との打ち合わせでは、今回いちばん重く置くのは、各節目で公開に進んでよいかを根拠とともに示せる状態を保つことと、節目ごとに出てくる懸念を取りこぼさないことだと確認された。","question":"この状況で重く置くテストマネジメント活動の組合せとして、最も妥当な判断はどれか。1つ選べ。","choices":["自社アプリとテレビ受像機向けアプリの担当と外部2社の役割分担を計画で線引きし、節目ごとの受け渡しと連絡の道筋を定めて、どの担当でも同じ手順で同じ結果を確かめられるようにする。","節目ごとに新しく見えてきた懸念を洗い出し直して手当ての段取りを計画へ組み入れ、立てた計画と見比べて進み方と欠陥のさばき方を追い、次の節目へ進めてよい線と最後に決める人を先に置き、その決定に合わせて残る節目の運び方を組み替える。","節目ごとに本番へ近づけた配信環境と視聴履歴のデータをそろえ直し、環境と番組データの版を管理の対象に加えて、どの版でどの画面をどこまで確かめたのかを後からたどれる形に整えておく。","編成局と広告主が同じ材料で状況をつかめるよう、再生の失敗率と未解決の欠陥の推移をまとめた報告の形をそろえ、節目の前の定例で配る。"],"answer":[1],"explanation":{"signals":"判断を分けるのは、編成局との打ち合わせで今回いちばん重く置くと確認された2つである。各節目で公開に進んでよいかを根拠とともに示せる状態を保つことと、節目ごとに出てくる懸念を取りこぼさないことである。この2つに結び付く与件が2か所に置かれている。1つは、各節目へ進んでよいかは再生の失敗率と新しく分かった懸念の扱いを見て決めると社内は一致している一方で、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられており、先月の会議が結論の出ないまま終わったことである。もう1つは、節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ていることである。視聴が夜9時台に集中し、同時視聴数が平均の6倍になることは、どの案を採るかには関わらない。4つの案はいずれも配信の作り直しで実際に行う活動であり、事実として誤っているものは1つも無い。分かれるのは、重く置くと決まった2つに正面から届いているかどうかだけである。","why":"この状況で採るべきは、節目ごとに新しく見えてきた懸念を洗い出し直して手当ての段取りを計画へ組み入れ、立てた計画と見比べて進み方と欠陥のさばき方を追い、次の節目へ進めてよい線と最後に決める人を先に置き、その決定に合わせて残る節目の運び方を組み替える案である。編成局との打ち合わせで重く置くと確認された2つに、この案の要素が1つずつ対応しているからである。\nまず懸念の側から見る。この作り直しでは、節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ている。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、と述べ、軽減戦略の策定は重要であるとしている。出てくる懸念が節目ごとに入れ替わるのだから、この分析は最初の一度では終わらず、節目ごとに繰り返して計画へ戻すことになる。戻した手当てが効いているかどうかは、シラバスが実行の監視に含めている、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることによって初めて見える。\n次に進退の側である。ここで社内が一致しているのは判断に使う材料の種類までで、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられている。先月の会議はそのまま結論が出ずに終わった。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。公開に進んでよいかを根拠とともに示せる状態とは、この定義と意思決定が会議より前に置かれている状態のことであり、進めてよい線と決める人を先に置く要素が効くのはそこである。さらにシラバスは、テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めており、決めた結果を残る節目の運び方へ返すところまでがこの活動に入る。\n残る3つが外れるのは、活動として誤っているからではない。担当の線引きと連絡の道筋を定めることはリソース配置戦略に、環境と番組データの版を管理することはツールと環境の最適化に、状況を同じ材料で伝えることはステータスの伝達に、それぞれ裏づけがある。外れるのは順位である。この打ち合わせで削れないものとして置かれたのは各節目の進退と懸念の取りこぼしであり、その2つに直接応える案が並んでいる以上、それより前に置く理由が無い。","distractors":["自社アプリとテレビ受像機向けアプリ、そして字幕と広告を担う外部2社という並びは、担当の線引きと連絡の道筋を整えるべき状況に見える。シラバスもリソース配置戦略として、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを挙げ、チームが分散している環境ではこの点を維持することが特に重要になるとしている。文脈の語とシラバスの記述が両方そろうので、最も引きの強い案である。それでも、編成局との打ち合わせでは、今回いちばん重く置くのは、各節目で公開に進んでよいかを根拠とともに示せる状態を保つことと、節目ごとに出てくる懸念を取りこぼさないことだと確認された。どの担当でも同じ手順で同じ結果を確かめられるようになっても、毎回入れ替わる懸念を拾い直す手立てはそこからは出てこないし、可否の線と決める人が会議に委ねられたままである点も動かない。",null,"本番へ近づけた配信環境と視聴履歴のデータをそろえ、版をたどれるようにしておくことは、放送の配信では現実に手放せない備えである。シラバスもツールと環境の最適化として、テストツールとテスト環境の賢明な選択と使用は、テスト戦略をサポートするために非常に重要である、としている。ただしこの案が整えるのは、済んだ確認を後から追えるようにする側である。この状況では、節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ている。シラバスがテストマネージャーに求めているのは、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めることであって、版を追えるようにすることは、毎回新しく現れる懸念を突き止めることにも、次の節目へ進んでよいかを決めることにもならない。","編成局と広告主が同じ材料で状況をつかめるようにすることは、この作り直しでも確かに要る。シラバスも、特に重要なのは、プロジェクトやビジネスのステークホルダーにとって理解しやすく、関連性のある形でテスト作業成果物や活動のステータスを伝える必要があることである、と述べている。この案が届かないのは、重く置くと決まった片方、各節目で公開に進んでよいかを根拠とともに示せる状態のほうである。ただし、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられている。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めており、定義と意思決定の両方を求めている。同じ数字を同じ書式で配っても、何をもって進んでよいとするかが置かれない限り、先月のように結論が出ないまま終わる運びは変わらない。もう片方の、節目ごとに出てくる懸念を洗い出し直すことにも触れていない。"],"flip":[null,null,null,null],"flipNote":{"1":"重く置くものを、担当の間で確認の粒度をそろえることに差し替えても、この状況には2つの文が残る。ただし、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられていること。そして、節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ていることである。懸念を節目ごとに洗い出し直して計画と見比べながら追い、進めてよい線と決める人を先に置く案はこの2文に正面から応えるので、差し替えた後もそのまま立ち、妥当な案が2つになる。加えて、担当の粒度をそろえることで消えるはずの手戻りや二重の確認は、この状況では症状として1つも現れていない。この案だけを答えにするには、重く置くものの差し替えに加えて、残る2文が描く状態も先に片づいていることまで要る。","3":"重く置くものを、放送の記録として後から示せることに差し替えても、節目ごとに公開する画面と受け皿の組み合わせが変わり、前の節目には無かった懸念が毎回出ているという文と、可否の水準も決める人も会議での相談に委ねられているという文は残る。版を後からたどれるようにすることは、毎回新しく現れる懸念を突き止めることでも、次の節目へ進んでよい線と決める人を置くことでもないので、その2文に応える案が正しいまま立ち、妥当な案が2つになる。版の管理が単独で先頭に立つには、重く置くものの差し替えに加えて、懸念の出方と可否の決め方が既に落ち着いていることまで併せて要る。","4":"重く置くものを、編成局と広告主が同じ材料で状況をつかめることに差し替えても、失敗率をどの水準まで許すのかも、最後に誰が可否を決めるのかも、節目ごとの会議での相談に委ねられているという文は残る。同じ数字を同じ書式で配っても先月のように結論が出ない運びは変わらないので、そこを先に置く案が正しいまま立ち、妥当な案が2つになる。逆に、可否の水準と決める人が先に定まった世界を条件にすると、今度は前の節目には無かった懸念が毎回出ているという文が残り、それを節目ごとに拾い直す案がやはり立つ。報告の整備がこの状況の答えになるには2つの文の両方が片づいている必要があり、条件が2つになる。"},"quote":"テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.1.2（ステータスの伝達）、1.2.7（リスクアセスメントと軽減計画／実行の監視／適応的なプロセスマネジメント／品質ゲートマネジメント）","misconception":"案に書かれた活動がシラバス上の活動として正しいかどうかだけを見て、この状況で重く置くと決まった関心に直接届いているかを見ていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["分散した担当への手当て（リソース配置戦略）を、重く置くと決まった2つより前に置く","環境と版の管理という済んだ確認の整備を、毎回入れ替わる懸念の把握と節目の進退より前に置く","ステークホルダーへの報告の整備を、何をもって進んでよいとするかの定義と意思決定の代わりに置く"],"distractorTypes":["D4","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-38"]}},{"id":"q-1.2.7-B-3","lo":"TM-1.2.7","cluster":"1.2.7-B","variant":3,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは私立大学の入試出願システムを作り直すテストマネージャーである。出願の受付は総合型選抜・学校推薦型選抜・一般選抜の3期に分かれ、期ごとに受け付ける区分と必要な書類が入れ替わる。開発は1か月の反復で進め、間に合った機能から順に本番へ出す。受験料の支払いは4社の決済代行を通す。志願者の問い合わせは受付の開始直後に集中する。\n\n各期の受付を始めてよいかは、その直前に行う試験運用で出た申込の取りこぼしの件数と、その期までに新たに分かった懸念の扱いを見て決めることで、入試委員会と情報センターの間は一致している。もっとも、取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも、期ごとの打ち合わせでその都度相談することになっており、前の期の打ち合わせは結論が出ないまま終わった。区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ている。入試委員会は、今年度いちばん重く見るのは、各期の受付を始めてよいと言える根拠をその場で示せる状態にしておくことと、期ごとに現れる懸念を取りこぼさないことだと申し合わせた。","question":"残る期について、テストマネージャーが取る手立てとして最も妥当と判断できる組合せはどれか。1つ選べ。","choices":["決済代行4社との受け渡しを含めて、本番と同じ作りの出願データを期ごとにそろえ直し、環境と書式の版を管理の対象に加えて、どの版で何をどこまで確かめたのかを後から取り出せる形にしておく。","入試委員会と情報センターが同じ材料で状況を見られるよう、試験運用で出た取りこぼしの件数と未解決の欠陥の数を並べた報告の書式を決め、期の初めの打ち合わせで配って判断の材料にする。","情報センターと運用を委ねている事業者の受け持ちを計画に書き分け、期ごとの引き継ぎと連絡の順路を決めて、誰が当たっても同じ段取りで確かめられるようにする。","期ごとに現れた懸念を拾い直して手当てを計画へ書き足し、日々の記録を計画と引き比べて消化の具合と欠陥の片づき方を確かめ、受付を始めてよいと言える線とそれを決める人を先に決めておき、その判断をもとに残る期の進め方を見直す。"],"answer":[3],"explanation":{"signals":"決め手になるのは、入試委員会が今年度いちばん重く見ると申し合わせた2つである。各期の受付を始めてよいと言える根拠をその場で示せる状態にしておくことと、期ごとに現れる懸念を取りこぼさないことである。その2つに結び付く与件が2つある。受付を始めてよいかの判断材料の種類までは入試委員会と情報センターの間で一致しているのに、取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも打ち合わせでその都度相談することになっており、前の期の打ち合わせが結論の出ないまま終わっていること。そして、区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ていることである。受験料の支払いが4社の決済代行を通ることや、問い合わせが受付の開始直後に集中することは、どの案を採るかには効かない。4つの案はどれも出願の作り直しで実際に行う活動で、誤った事実を含むものは無い。分かれるのは、申し合わせた2つに正面から応えているかどうかである。","why":"ここで採るべきは、期ごとに現れた懸念を拾い直して手当てを計画へ書き足し、日々の記録を計画と引き比べて消化の具合と欠陥の片づき方を確かめ、受付を始めてよいと言える線とそれを決める人を先に決めておき、その判断をもとに残る期の進め方を見直す案である。入試委員会が重く見ると申し合わせた2つに、この案の要素が1つずつ当たっているからである。\n懸念の側から見る。この出願の作り直しでは、区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ている。シラバスは、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、と述べている。期ごとに顔ぶれの変わる懸念を相手にする以上、この分析は最初の一度では足りず、期ごとに拾い直して計画へ書き足すことになる。書き足した手当てが働いているかは、シラバスが実行の監視に含めている、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることによって確かめられる。\n受付を始めてよいかの側は、テストコントロールの話になる。ここで一致しているのは材料の種類までで、取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも、期ごとの打ち合わせでその都度相談することになっており、前の期の打ち合わせは結論が出ないまま終わった。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。始めてよいと言える根拠をその場で示せる状態とは、この定義と意思決定が打ち合わせより前に済んでいる状態である。そしてシラバスは、テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めており、決めた結果を残る期の進め方へ返すところまでが含まれる。\n残る3つが外れるのは、書かれた活動が誤っているからではない。出願データと版の整備はツールと環境の最適化に、同じ材料での状況の共有はステータスの伝達に、受け持ちの書き分けと連絡の順路はリソース配置戦略に、それぞれ裏づけがある。外れるのは順位である。申し合わせで削れないものとして置かれたのは受付の可否と懸念の取りこぼしであり、その2つに直接応える案が並んでいる以上、先に置く理由が無い。","distractors":["受験料の支払いが4社の決済代行を通り、期ごとに書類が入れ替わるという並びを読むと、出願データをそろえ直して版を管理したくなる。シラバスもツールと環境の最適化として、テストツールとテスト環境の賢明な選択と使用は、テスト戦略をサポートするために非常に重要である、としている。ただしこの案が用意するのは、済んだ確認を後から取り出せるようにする側である。この状況では、区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ている。シラバスがテストマネージャーに求めているのは、詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めることであって、版を取り出せるようにすることは、毎回現れる懸念を突き止めることにも、受付を始めてよいかを決めることにもならない。","入試委員会と情報センターが同じ材料で状況を見られるようにすることは、この作り直しでも要る。シラバスも、特に重要なのは、プロジェクトやビジネスのステークホルダーにとって理解しやすく、関連性のある形でテスト作業成果物や活動のステータスを伝える必要があることである、と述べている。この案が届かないのは、申し合わせた片方、受付を始めてよいと言える根拠をその場で示せる状態のほうである。取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも、期ごとの打ち合わせでその都度相談することになっており、前の期の打ち合わせは結論が出ないまま終わった。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めており、定義と意思決定の両方を求めている。件数と欠陥の数を並べた書式を配っても、何件までなら始めてよいのかが置かれない限り、打ち合わせは前の期と同じ終わり方をする。もう片方の、期ごとに現れる懸念を拾い直すことにも触れていない。","運用を外の事業者に委ねている以上、受け持ちを書き分けて連絡の順路を決めることは筋が通っており、シラバスもリソース配置戦略として、チームの構造を定義し、役割を明確にし、コミュニケーションの手順を確立することを挙げている。それでも入試委員会は、今年度いちばん重く見るのは、各期の受付を始めてよいと言える根拠をその場で示せる状態にしておくことと、期ごとに現れる懸念を取りこぼさないことだと申し合わせた。誰が当たっても同じ段取りで確かめられるようになっても、期ごとに顔ぶれの変わる懸念を拾い直す手立てはそこからは生まれず、始めてよいと言える線と決める人が相談に委ねられている点もそのまま残る。",null],"flip":[null,null,null,null],"flipNote":{"1":"重く見るものを、出願の受け付けを後から検証できる形で残すことに差し替えても、区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ているという文と、始めてよい件数も決める人も相談に委ねられているという文は残る。版を後から取り出せるようにすることは、毎回現れる懸念を突き止めることでも、受付を始めてよいと言える線と決める人を置くことでもないので、その2文に応える案が正しいまま立ち、妥当な案が2つになる。版の整備が単独で先頭に立つには、重く見るものの差し替えに加えて、懸念の出方と可否の決め方が既に落ち着いていることまで要る。","2":"重く見るものを、入試委員会と情報センターが同じ材料で状況を見られることに差し替えても、取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも、期ごとの打ち合わせでその都度相談することになっており、前の期の打ち合わせは結論が出ないまま終わったという文は残る。同じ書式で数字を配っても終わり方は変わらないので、そこを先に決めておく案が正しいまま立ち、妥当な案が2つになる。逆に、許す件数と決める人が先に定まった世界を条件にすると、今度は前の期には見えていなかった懸念が毎回出ているという文が残り、それを拾い直す案がやはり立つ。報告の整備がこの状況の答えになるには2つの文の両方が片づいている必要があり、条件が2つになる。","3":"重く見るものを、外の事業者との間で確かめ方をそろえることに差し替えても、この状況には2つの文が残る。取りこぼしを何件まで許すのかも、最後に誰が開始を決めるのかも相談に委ねられていること。そして、区分と書類が入れ替わるため、前の期には見えていなかった懸念が毎回出ていることである。懸念を期ごとに拾い直して記録を計画と引き比べ、始めてよい線と決める人を先に決めておく案はこの2文に応えるので、差し替えた後も立ったままで、妥当な案が2つになる。加えて、受け持ちを書き分けることで消えるはずの取り違えや二度手間は、この状況に症状として現れていない。この案だけを答えにするには、重く見るものの差し替えに加えて、残る2文が描く状態も先に片づいていることまで要る。"},"quote":"テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。","ref":"1.1.2（ステータスの伝達）、1.2.7（リスクアセスメントと軽減計画／実行の監視／適応的なプロセスマネジメント／品質ゲートマネジメント）","misconception":"案に並ぶ活動がシラバス上の活動として正しいかどうかで選び、この状況で重く見ると申し合わせた関心に直接応えているかを見ていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["環境とデータの版の整備を、毎回現れる懸念の把握と受付の可否より前に置く","ステークホルダーへの報告の整備を、何件までなら始めてよいとするかの定義と意思決定の代わりに置く","受け持ちの書き分け（リソース配置戦略）を、重く見ると申し合わせた2つより前に置く"],"distractorTypes":["D4","D4","D4"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-38"]}},{"id":"q-1.2.7-C-1","lo":"TM-1.2.7","cluster":"1.2.7-C","variant":1,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは求人情報サイトのテストマネージャーとして、先月このプロジェクトを引き継いだ。開発は毎日1回、その日にできた分を本番に出している。引き継ぎの資料には、いまのやり方が次のように書かれていた。\n\n・自動の回帰テストは毎晩1回動いており、ケースごとの合否は出力されているが、どのリリースで何件が通り何件が落ちたのかを残した記録は無い\n・欠陥の起票はしているが、どの機能のどの懸念に対応するものかは結び付けていない\n・本番に出してよいかは、その日の当番が大きな不具合が無ければ出すという形で決めている\n・テスト担当は4名で、毎朝、当日の対象を短く打ち合わせる時間は取れている\n\n出稿する企業からの問い合わせは応募の締切前に集中する。経営からは、次の四半期が始まるまでの6週間で、リリースのたびに起きる不具合を抑えることを求められている。","question":"この6週間で優先して着手するテストマネジメント活動の組合せとして、最も適切と判断できるものはどれか。1つ選べ。","choices":["毎晩の実行結果と欠陥の起票の状況を、関係者の誰もが同じ数字で見られる画面に常時映し出し、週に一度は開発と合同でその数字を読む場を設けて、気になる動きを早い段階で持ち寄れるようにする。","毎晩の回帰テストを朝と夕方の2回に増やして落ちたケースを早く拾い、その日の落ち方を見て翌日に確かめる対象と順番を組み直し、直し切れていない分は翌日の先頭に回して片づける。","どこまで満たしていれば良しとするかの目安を先に置いて夜間の合否を日々の記録に残し、計画とのずれが見えたら翌日に確かめる対象と順番を組み直し、あわせてリリースしてよいと言える条件と、それを決める人と、満たさないときの扱いを取り決める。","この6週間で確かめるべき箇所を機能ごとに洗い直して懸念の重さを付け直し、重い箇所から順にテストを厚く割り付けたうえで、各回のリリースで本番に出してよいと言える条件と、それを決める人を文書として定めて関係者に配る。"],"answer":[2],"explanation":{"signals":"効くのは引き継ぎの資料に並んだ4つの記述である。ケースごとの合否は毎晩出力されているのに、どのリリースで何件が通り何件が落ちたのかの記録が無いこと。欠陥の起票が、どの機能のどの懸念に対応するものかと結び付いていないこと。本番に出してよいかが、大きな不具合が無ければ出すという当番の判断で決まっていること。そしてテスト担当は4名のままだが、毎朝、当日の対象を短く打ち合わせる時間は取れていること。最後の1つは、手当てを新しい人手を足さずに置けるかどうかに効く。出稿する企業からの問い合わせが応募の締切前に集中することは、どの案の当否も動かさない。","why":"優先すべきは、どこまで満たしていれば良しとするかの目安を先に置いて夜間の合否を日々の記録に残し、計画とのずれが見えたら翌日に確かめる対象と順番を組み直し、あわせてリリースしてよいと言える条件と、それを決める人と、満たさないときの扱いを取り決める案である。これを選ばせているのは、引き継いだ状態が、集めること・それを受けて変えること・出してよいかを決めることのどこも欠いたまま、毎日のリリースを続けている点である。\n集めるところから見る。ケースごとの合否は毎晩出力されているのに、どのリリースで何件が通り何件が落ちたのかは残っていない。シラバスは、テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない、としたうえで、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。合否が出力されていることと、目安を持って計画に照らして追えていることは別である。シラバスは実行の監視に、確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む、と述べている。夜間の合否がその場で流れていくだけの状態は、確立した計画に照らした継続的なレビューにも、表面化した欠陥のマネジメントにも届いていない。\n次に、追ったものは何かに使われなければならない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。計画とのずれが見えたら翌日に確かめる対象と順番を組み直すという要素が効くのはそのためである。\n最後が進退である。いまは大きな不具合が無ければ出すという当番の判断で決まっており、何をもって出してよいとするのかも、誰が決めるのかも置かれていない。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。この3つを6週間で置ききれるのは、毎朝、当日の対象を短く打ち合わせる時間がすでに取れているからであり、4名という人数を動かさずに始められる。","distractors":["毎晩の結果と欠陥の起票の状況を誰もが同じ数字で見られるようにし、週に一度は開発と合同でその数字を読む場を設けるこの案は、いま誰も見ていないものを見えるようにするという点では正面から効く。数字がどこにも残っていない状態を引き継いだのだから、最初の一手としてこれを推す人は多い。それでもこの案は、数字を見たあとに何を変えるのかを置いていない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。数字が見えるようになることは、その情報を使って何かを是正したことにはならない。合同で読む場についても、シラバスは開発チームとのコラボレーションについて、テストを成功させるためには、開発チームと緊密な協力関係を維持することが不可欠であるとし、この協力関係では、テストへの包括的なアプローチをサポートし、ホワイトボックスとブラックボックスの両方の視点からの洞察を活用して、潜在的な課題事項に事前に対処すべきである、と述べている。本番に出してよいかを何を根拠に誰が決めるのかは、この項目には現れない。大きな不具合が無ければ出すという決め方は、この案を採ってもそのまま残る。","毎晩の回帰テストを朝と夕方の2回に増やし、その日の落ち方を見て翌日の対象と順番を組み直し、直し切れていない分を翌日の先頭に回すこの案は、毎日のリリースという速さにいちばん噛み合って見える。実行の間隔が半分になれば、落ちたことに気づくまでの時間は確かに短くなる。足りないのは、何に照らしてずれていると言うのかである。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、としている。目安を置かないまま毎日対象と順番を組み替えると、比べる相手のほうが日ごとに動くので、遅れているのかどうかを言える基準が残らない。本番に出してよいかの決め方にも手が付いていないので、大きな不具合が無ければ出すという状態も変わらない。",null,"確かめるべき箇所を機能ごとに洗い直して懸念の重さを付け直し、重い箇所から順に厚く割り付けたうえで、各回のリリースで本番に出してよいと言える条件と、それを決める人を文書として定めて配るこの案は、シラバスがテスト計画とテストコントロールの双方で求めていることを並べており、筋は通っている。引き継いだ直後に計画から立て直すという運びも自然に見える。しかし、定めた条件を満たしたかどうかを何で示すのかが決まっていない。ケースごとの合否は毎晩出力されてはいるが、どのリリースで何件が通り何件が落ちたのかは残っていない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。条件と決める人を文書にして配ることは、その情報を集める枠組みを置くことの代わりにはならない。欠けているのはそれだけではない。計画とのずれが見えたときに確かめる対象と順番を組み直すという要素も、この案には無い。機能ごとの洗い直しと重み付けは着手の時点で一度置く並べ替えであって、追ったものを受けて動かす手当てではない。シラバスは適応的なプロセスマネジメントについて、テストコントロールとは、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と述べている。"],"flip":[null,null,null,null],"flipNote":{"1":"この案が欠いているのは2つある。数字を見たあとに何を変えるのかと、本番に出してよいかを何を根拠に誰が決めるのかである。経営から求められているものを、リリースのたびの不具合を抑えることではなく、いまの状況が関係者の誰にも見えていないことの解消に差し替えても、大きな不具合が無ければ出すという当番の判断はそのまま残るので、出してよい条件と決める人を先に置く案が正しいまま立ち、優先して着手すべきものが2つになる。片方を足しても、もう片方が同じ理由でこの案を退ける。","2":"この案にも独立した誤りが2つある。ひとつは、何をどこまで満たしていれば良しとするかの目安が無いまま毎日対象と順番を組み替えることで、比べる相手が日ごとに動く以上、何に対して遅れているのかを言える基準が残らない。もうひとつは、本番に出してよいかの決め方に手を付けていないことである。引き継ぎの資料は、ケースごとの合否は出力されていると書いており、目安を置く材料そのものはすでに手元にある。目安を足しても出してよいかの決め方は当番に残り、決め方を足しても目安は無いままなので、ひとつの条件では入れ替わらない。","4":"この案が寄りかかっているのは、定めた条件を満たしたかどうかを誰かが示せるという前提である。ところがこの状況では、ケースごとの合否は出力されていても、どのリリースで何件が通り何件が落ちたのかは残っていない。条件と決める人を文書にして配るだけでは、その材料はできない。では引き継ぎの資料の一文を、日々の記録がすでに取れている状況に差し替えればよいかというと、そのときに埋まるのは記録の側だけである。どこまで満たしていれば良しとするかの目安も、計画とのずれが見えたときに確かめる対象と順番を組み直すことも、この案には無いままなので、条件を当てても妥当な案は増えない。目安を先に置いて夜間の合否を日々の記録に残し、ずれを受けて対象と順番を組み直し、出してよい条件と決める人と満たさないときの扱いまで置く案が、そのまま1つだけ正しい。ひとつの条件では入れ替わらない。"},"quote":"テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。…テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する。","ref":"1.1.2（モニタリングの枠組み）、1.2.7（実行の監視／品質ゲートマネジメント）、2.1.2（収集と是正の分業）","misconception":"見えるようにすること、速く回すこと、条件を文書にすることのいずれかひとつを置けば手当てになると考え、計画に照らして集める枠組みと、見えたずれを受けた組み直しと、出してよいかの取り決めが順につながって初めて効くことを見ていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["集めて見えるようにすることと、開発との協働の場を置くことで、テストモニタリングとテストコントロールの両方を満たしたと考える","実行の間隔を詰めて日々組み替えることを適応と考え、計画に照らす目安と目標値が無いまま基準を動かし続ける","計画側の立て直しと、出してよい条件と決める人の文書化までは置くが、その条件を満たしたかを示す材料を集める枠組みも、見えたずれを受けた対象と順番の組み直しも置かない"],"distractorTypes":["D3","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-38","MP-33","MP-34"]}},{"id":"q-1.2.7-C-2","lo":"TM-1.2.7","cluster":"1.2.7-C","variant":2,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは歯科医院向けの予約・問診サービスのテストマネージャーとして、今月このプロダクトの担当になった。本番への反映は週に2回、火曜と金曜である。前任者から渡された棚卸しのメモには、いまのやり方がこう書かれていた。\n\n・夜間の自動テストはケースごとの合否をログに出しているが、どの回で何件通って何件落ちたのかをまとめた記録は残っていない\n・見つけた不具合は一覧に登録しているが、どの機能のどの懸念に当たるものかは結び付けていない\n・本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めている\n・テスト担当は3名で、週の初めに30分の打ち合わせ枠は確保できている\n\n医院からの問い合わせは月初に集中する。開発部長からは、今四半期の残り8週間で、反映のたびに起きる不具合を抑えることを求められている。","question":"この8週間で先に着手するテストマネジメント活動の組合せとして、最も妥当と判断できるものはどれか。1つ選べ。","choices":["夜間の自動テストを反映の直前にもう一度流す形にして落ちたケースを早く拾い、その回の落ち方を見て次の回で確かめる範囲と順番を入れ替え、直し切れない分は次の回の先頭に回して片づける。","残り8週間で確かめる範囲を画面ごとに引き直して懸念の重さを付け直し、重い画面から順にテストを厚くしたうえで、本番へ出してよいと言える線とそれを決める人を運用の手順書へ書き加えて関係者に配る。","反映のたびにどこまで通っていれば良しとするかの水準を先に決めて夜間の結果を回ごとに束ねて残し、水準を割った回が出たら次の回で確かめる範囲と順番を入れ替え、あわせて本番へ出してよいと言える線とそれを決める人を定め、線に届かないときの扱いまで取り決める。","医院からの問い合わせと不具合の登録を突き合わせた週ごとのまとめを作り、開発と運用が同じ資料で状況を確かめる場を週の初めの打ち合わせに置いて、気になる動きを早い段階で持ち寄れるようにする。"],"answer":[2],"explanation":{"signals":"読み解く先は棚卸しのメモに並んだ4行である。夜間の自動テストはケースごとの合否をログに出しているのに、どの回で何件通って何件落ちたのかをまとめた記録が残っていないこと。見つけた不具合が、どの機能のどの懸念に当たるものかと結び付いていないこと。本番へ出してよいかが、目立つ不具合が無ければ出すという担当の裁量で決まっていること。そしてテスト担当は3名のままだが、週の初めに30分の打ち合わせ枠は確保できていることである。最後の1行は、人を増やさずに手当てを置けるかどうかに効く。医院からの問い合わせが月初に集中することは、どの案の当否にも関わらない。","why":"先に着手すべきは、反映のたびにどこまで通っていれば良しとするかの水準を先に決めて夜間の結果を回ごとに束ねて残し、水準を割った回が出たら次の回で確かめる範囲と順番を入れ替え、あわせて本番へ出してよいと言える線とそれを決める人を定め、線に届かないときの扱いまで取り決める案である。引き継いだ状態が、集めること・集めたものを受けて変えること・出してよいかを決めることの3つを、どれも欠いたまま週2回の反映を続けているからである。\n集めるところから見る。夜間の自動テストはケースごとの合否をログに出しているが、どの回で何件通って何件落ちたのかをまとめた記録は残っていない。シラバスは、テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない、としたうえで、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。合否がログに出ていることと、水準を持って追えていることは別である。水準を先に決めて回ごとに束ねて残すという要素は、この尺度や目標値を置いて枠組みを作ることに当たる。\n集めたものは、使われなければ止まる。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。水準を割った回が出たときに次の回で確かめる範囲と順番を入れ替えるという要素が効くのはここである。\n最後が出してよいかの決め方である。いまは、本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めており、何をもって出してよいとするのかも、誰が決めるのかも置かれていない。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。この3つを8週間で置ききれるのは、テスト担当は3名で、週の初めに30分の打ち合わせ枠は確保できているからであり、人数を動かさずに始められる。","distractors":["夜間の自動テストを反映の直前にもう一度流し、その回の落ち方を見て次の回の範囲と順番を入れ替えるこの案は、週2回という速さにいちばん噛み合って見える。流す回数が増えれば、落ちたことに気づくまでの時間は確かに縮む。足りないのは、何に照らしてずれていると言うのかである。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、としている。水準を置かないまま毎回範囲と順番を組み替えると、比べる相手のほうが回ごとに動くので、遅れているのかどうかを言えるよりどころが残らない。本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めている状態も、この案では動かない。","確かめる範囲を画面ごとに引き直して懸念の重さを付け直し、重いところから厚くしたうえで、出してよい線と決める人を手順書に書いて配るこの案は、計画の側から立て直す運びとして自然に見えるし、シラバスがテスト計画とテストコントロールの双方で求めていることを並べてもいる。足りないのは、その線を満たしたかどうかを何で示すのかである。夜間の自動テストはケースごとの合否をログに出しているが、どの回で何件通って何件落ちたのかをまとめた記録は残っていない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。線と決める人を手順書に書くことは、その情報を集める枠組みを置くことの代わりにはならない。",null,"問い合わせと不具合の登録を突き合わせたまとめを作り、開発と運用が同じ資料で状況を確かめる場を置くこの案は、いま誰も見ていないものを見えるようにする点では正面から効く。回ごとにまとめた数字がどこにも残っていない状態を引き継いだのだから、最初の一手にこれを推す人は多い。それでもこの案は、見たあとに何を変えるのかを置いていない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。見えるようになることは、その情報を使って何かを是正したことにはならない。加えて、本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めている状態も、この案を採ってそのまま残る。"],"flip":[null,null,null,null],"flipNote":{"1":"この案には独立した欠けが2つある。1つは、どこまで通っていれば良しとするかの水準が無いまま毎回範囲と順番を組み替えることで、比べる相手が回ごとに動く以上、何に対して遅れているのかを言えるよりどころが残らない。もう1つは、本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めているのに、そこへ手を付けていないことである。棚卸しのメモはケースごとの合否がログに出ていると書いており、水準を置く材料そのものは手元にある。水準を足しても出してよいかの決め方は担当に残り、決め方を足しても水準は無いままなので、1つの条件では入れ替わらない。","2":"この案が寄りかかっているのは、書いた線を満たしたかどうかを誰かが示せるという前提である。ところがこの引き継ぎでは、夜間の自動テストはケースごとの合否をログに出しているが、どの回で何件通って何件落ちたのかをまとめた記録は残っていない。線と決める人を手順書に書き加えるだけでは、その材料はできない。では記録がすでに束ねられている状況に差し替えればよいかというと、そのときに埋まるのは記録の側だけである。どこまで通っていれば良しとするかの水準も、見えたずれを受けて確かめる範囲と順番を入れ替えることも、この案には無いままなので、条件を当てても妥当な案は増えない。水準を先に決めて回ごとに束ねて残し、ずれを受けて範囲と順番を入れ替え、出してよい線と決める人と届かないときの扱いまで置く案が、そのまま1つだけ正しい。1つの条件では入れ替わらない。","4":"この案が欠いているのも2つある。見たあとに何を変えるのかと、本番へ出してよいかを何を根拠に誰が決めるのかである。開発部長から求められているものを、反映のたびの不具合を抑えることではなく、回ごとにまとめた状況が関係者の誰にも見えていないことの解消に差し替えても、この案が作るのは医院からの問い合わせと不具合の登録を突き合わせた週ごとのまとめであり、本番への反映は週に2回なのだから、どの回で何件通って何件落ちたのかをまとめた記録は残っていないという状態も、どこまで通っていれば良しとするかの水準が無いことも、そのままである。差し替えた求めにも届かないうえ、本番へ出してよいかは、その週の担当が目立つ不具合が無ければ出すという形で決めている状態も残るので、条件を当てても妥当な案は増えない。水準を先に決めて回ごとに束ねて残し、ずれを受けて範囲と順番を入れ替え、出してよい線と決める人と届かないときの扱いまで置く案が、そのまま1つだけ正しい。片方を足しても、もう片方が同じ理由でこの案を退ける。1つの条件では入れ替わらない。"},"quote":"テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。…テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する。","ref":"1.1.2（モニタリングの枠組み）、1.2.7（実行の監視／品質ゲートマネジメント）、2.1.2（収集と是正の分業）","misconception":"見えるようにすること、速く流すこと、線を文書にすることのどれか1つを置けば手当てになると考え、水準を持って集める枠組みと、見えたずれを受けた入れ替えと、出してよいかの取り決めが順につながって初めて効くことを見ていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["流す回数を増やして毎回組み替えることを適応と考え、計画に照らす水準が無いまま比べる相手を動かし続ける","計画側の引き直しと、出してよい線と決める人の文書化までは置くが、その線を満たしたかを示す材料を集める枠組みを置かない","突き合わせて見えるようにすることと開発との場を置くことで、テストモニタリングとテストコントロールの両方を満たしたと考える"],"distractorTypes":["D3","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-38"]}},{"id":"q-1.2.7-C-3","lo":"TM-1.2.7","cluster":"1.2.7-C","variant":3,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは運送会社の集荷アプリのテストマネージャーである。今期から立て直しを任され、現場への聞き取りでいまのやり方を書き出した。配信は隔週で、営業所の端末へまとめて配っている。\n\n・端末向けの自動テストは毎朝1回動き、ケースごとの合否は端末に残るが、どの配信でどれだけ通ったのかを束ねたものは無い\n・不具合は受付簿に控えているが、どの業務のどの懸念に当たるのかまでは結び付けていない\n・配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めている\n・テスト担当は5名で、隔日の朝に15分だけ集まる時間は取れている\n\n集荷の依頼は月末に増える。営業本部からは、次の繁忙期までの5週間で、集荷の取りこぼしにつながる不具合を止めることを求められている。","question":"この5週間でテストマネージャーが先に手を付ける組合せとして、最も適切と判断できる案はどれか。1つ選べ。","choices":["端末向けの自動テストを朝と夕方の2回に増やして落ちたケースを早く拾い、その日の落ち方を見て翌日に当たる範囲と順番を入れ替え、直し切れない分は翌日の先頭へ回して片づける。","毎朝の結果と受付簿の控えを一枚のまとめに載せ、営業所と開発が同じまとめを見られるようにして、隔日の朝の集まりでその数字を読み合わせ、気になる動きを早めに持ち寄れるようにする。","次の繁忙期までに当たる範囲を業務ごとに引き直して懸念の重さを付け直し、重い業務から順にテストを厚くして当たる順番も組み直したうえで、営業所へ配ってよいと言える条件と、それを決める人を運用の取り決めに加えて現場へ知らせる。","配信ごとにどこまで通っていればよいとする目標値を先に引いて端末に残る合否を配信の単位で束ね直し、目標値を下回った配信が出たら次の配信で当たる範囲と順番を入れ替え、さらに営業所へ配ってよいと言える条件とそれを決める人を置き、条件に届かないときの運びまで決めておく。"],"answer":[3],"explanation":{"signals":"手がかりは聞き取りで書き出した4行である。端末向けの自動テストは毎朝1回動き、ケースごとの合否は端末に残るのに、どの配信でどれだけ通ったのかを束ねたものが無いこと。不具合の控えが、どの業務のどの懸念に当たるのかと結び付いていないこと。配ってよいかが、現場から強い苦情が出ていなければ配るという当番の見立てで決まっていること。そしてテスト担当は5名のままだが、隔日の朝に15分だけ集まる時間は取れていることである。最後の1行は、要員を増やさずに手当てを置けるかどうかに効く。集荷の依頼が月末に増えることは、どの案の当否にも効かない。","why":"先に手を付けるべきは、配信ごとにどこまで通っていればよいとする目標値を先に引いて端末に残る合否を配信の単位で束ね直し、目標値を下回った配信が出たら次の配信で当たる範囲と順番を入れ替え、さらに営業所へ配ってよいと言える条件とそれを決める人を置き、条件に届かないときの運びまで決めておく案である。いまのやり方が、束ねること・束ねたものを受けて変えること・配ってよいかを決めることの3つを、どれも欠いたまま隔週の配信を続けているからである。\n束ねるところから見る。端末向けの自動テストは毎朝1回動き、ケースごとの合否は端末に残るが、どの配信でどれだけ通ったのかを束ねたものは無い。シラバスは、テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない、としたうえで、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。端末に合否が残っていることと、目標値を持って配信の単位で追えていることは別である。\n束ねたものは、使われて初めて効く。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。目標値を下回った配信が出たときに、次の配信で当たる範囲と順番を入れ替えるという要素が置かれているのはそのためである。\n残るのが配ってよいかの決め方である。いまは、配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めており、何をもって配ってよいとするのかも、誰が決めるのかも置かれていない。シラバスは品質ゲートマネジメントに、テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含めている。この3つを5週間で置ききれるのは、テスト担当は5名で、隔日の朝に15分だけ集まる時間は取れているからであり、要員を動かさずに始められる。","distractors":["端末向けの自動テストを朝と夕方の2回に増やし、その日の落ち方を見て翌日に当たる範囲と順番を入れ替えるこの案は、配信のたびに現場が困るという訴えにいちばん早く応えて見える。流す回数が倍になれば、落ちたことに気づくまでの時間は縮む。足りないのは、何に照らして下回っていると言うのかである。シラバスは、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、としている。目標値が無いまま毎日範囲と順番を組み替えると、比べる相手のほうが日ごとに動くので、遅れているのかどうかを言えるよりどころが残らない。配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めている状態も、この案では動かない。","毎朝の結果と受付簿の控えを一枚のまとめに載せ、営業所と開発が同じまとめを見て読み合わせるこの案は、いま誰も見ていないものを見えるようにする点で正面から効く。数字がどこにも束ねられていない状態なのだから、最初の一手にこれを推す人は多い。それでもこの案は、読み合わせたあとに何を変えるのかを置いていない。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。同じまとめを見られるようになることは、その情報を使って何かを是正したことにはならない。加えて、配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めている状態も、この案を採ってそのまま残る。","当たる範囲を業務ごとに引き直して懸念の重さを付け直し、重いところから厚くして順番も組み直したうえで、配ってよい条件と決める人を取り決めに加えて知らせるこの案は、繁忙期を前にした立て直しとして筋が通っており、シラバスがテスト計画とテストコントロールの双方で求めていることを並べてもいる。足りないのは、その条件を満たしたかどうかを何で示すのかである。端末向けの自動テストは毎朝1回動き、ケースごとの合否は端末に残るが、どの配信でどれだけ通ったのかを束ねたものは無い。シラバスは、テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する、としている。条件と決める人を取り決めに加えることは、その情報を束ねる枠組みを置くことの代わりにはならない。",null],"flip":[null,null,null,null],"flipNote":{"1":"この案には独立した欠けが2つある。1つは、どこまで通っていればよいとする目標値が無いまま毎日範囲と順番を組み替えることで、比べる相手が日ごとに動く以上、何に対して下回っているのかを言えるよりどころが残らない。もう1つは、配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めているのに、そこへ手が付いていないことである。聞き取りの書き出しは、ケースごとの合否は端末に残ると書いており、目標値を引く材料そのものは手元にある。目標値を足しても配ってよいかの決め方は当番に残り、決め方を足しても目標値は無いままなので、1つの条件では入れ替わらない。","2":"この案が欠いているのも2つある。読み合わせたあとに何を変えるのかと、配ってよいかを何を根拠に誰が決めるのかである。営業本部から求められているものを、集荷の取りこぼしにつながる不具合を止めることではなく、いまの状況が営業所にも開発にも見えていないことの解消に差し替えても、配ってよいかは、その週の当番が現場から強い苦情が出ていなければ配るという形で決めている状態は残るので、配ってよい条件と決める人を先に置く案が正しいまま立ち、先に手を付けるべきものが2つになる。片方を足しても、もう片方が同じ理由でこの案を退ける。","3":"この案が寄りかかっているのは、取り決めに加えた条件を満たしたかどうかを誰かが示せるという前提である。ところがこの現場では、端末向けの自動テストは毎朝1回動き、ケースごとの合否は端末に残るが、どの配信でどれだけ通ったのかを束ねたものは無い。条件と決める人を知らせるだけでは、その材料はできない。では配信の単位で束ねた記録がすでにある状況に差し替えればよいかというと、そのときに埋まるのは束ね直しの側だけである。どこまで通っていればよいとする目標値は、この案のどこにも置かれていない。シラバスが枠組みに求める詳細な尺度や目標値を欠いたままなので、条件を当てても妥当な案は増えず、目標値を先に引いて束ね直し、下回った配信を受けて範囲と順番を入れ替え、配ってよい条件と決める人と届かないときの運びまで置く案が、そのまま1つだけ正しい。1つの条件では入れ替わらない。"},"quote":"テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない。…この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない。…確立した計画に照らしてテスト実行を継続的にレビューし、テストケースの進捗を追跡し、表面化した欠陥をマネジメントすることを含む。…テストライフサイクル内で何が品質ゲートかを定義し、テストフェーズの進行においてプロダクトの整合性を維持するために重要となる情報に基づいた意思決定を行うことを含む。…テストコントロールは、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する。","ref":"1.1.2（モニタリングの枠組み）、1.2.7（実行の監視／品質ゲートマネジメント）、2.1.2（収集と是正の分業）","misconception":"束ねて見せること、速く流すこと、条件を取り決めに書くことのどれか1つで足りると考え、目標値を持って束ねる枠組みと、下回りを受けた入れ替えと、配ってよいかの取り決めが順につながって初めて効くことを見ていない"},"meta":{"concept":"テスト計画・テストモニタリング・テストコントロール","distractorIntent":["流す回数を増やして毎日組み替えることを適応と考え、計画に照らす目標値が無いまま比べる相手を動かし続ける","一枚のまとめで見えるようにすることと読み合わせの場を置くことで、テストモニタリングとテストコントロールの両方を満たしたと考える","計画側の引き直しと、配ってよい条件と決める人の取り決めまでは置くが、その条件を満たしたかを示す材料を束ねる枠組みを置かない"],"distractorTypes":["D3","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-planning-monitoring-control.md","mistakePatterns":["MP-35","MP-38"]}},{"id":"q-1.2.7-D-1","lo":"TM-1.2.7","cluster":"1.2.7-D","variant":1,"chapter":1,"section":"1.2","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは自治体の窓口予約システムのテストマネージャーである。開発は3週間の反復で進めており、来年1月の運用開始まで残り4か月ある。テストはこれまで、反復あたりの実行件数と、欠陥が解決するまでの日数を目安に、計画に照らして追ってきた。懸念の洗い出しは着手時に一度行ったきりで、その重さ付けもそのまま使っている。\n\n先月、この仕組みで子育て支援の手当の申請も受け付けることが決まり、扱う個人情報の範囲が広がった。あわせて、運用開始の前に外部の監査を受けることが決まった。運用開始の日も、テストにあてられる4名の要員も変えられない。庁内では、今回いちばんに置くのは、運用開始までに、どの要件をどのテストで確認したのかを裏付けとともに示せる状態にすることだと確認された。\n\n直近の反復でも計画どおりの件数を消化している。反復の着手時に計画を見直す時間は、これまでどおり取れている。利用者の多くは平日の昼間に予約を入れる。","question":"残り4か月のテストマネジメント活動として、どの判断が最も適切か。1つ選べ。","choices":["監査に示す資料の様式を先に固め、これまでに実施したテストの結果と挙げてある懸念を、どの要件をどのテストで確認したのかが分かる形に整理し直したうえで、残りの反復でも同じ様式で記録を積み上げ、反復ごとに監査の窓口へ渡していく。","広がった範囲について懸念を洗い直して重さを付け直し、4名の枠の中でテストの対象と優先度を組み替えて計画に反映し、追ってきた目安も、どの要件をどのテストで確認できたのかが分かるものに置き換える。","広がった範囲について開発チームと合同で仕様の読み合わせを行い、確認すべき観点を設計の段階から持ち寄る場を反復ごとに設けて、行き違いを早い段階で拾えるようにする。","広がった範囲の分だけ確かめることが増えるので、反復あたりの実行件数の目標を引き上げ、テストにあてる時間を一日あたり延ばして、残りの反復で消化する。"],"answer":[1],"explanation":{"signals":"効くのは、途中で変わったことと、変わっていないことの組である。変わったのは、手当の申請を受け付けることが決まって扱う個人情報の範囲が広がったことと、運用開始の前に外部の監査を受けることになったこと、そして庁内が置いた最優先である。変わっていないのは、懸念の洗い出しが着手時の一度きりで重さ付けもそのままであること、追ってきた目安が反復あたりの実行件数と欠陥が解決するまでの日数であること、運用開始の日と4名という要員である。直近の反復でも計画どおりの件数を消化していることは、足りないのが量ではないことを示す。利用者の多くが平日の昼間に予約を入れることは、どの案の当否も動かさない。","why":"採るべきは、広がった範囲について懸念を洗い直して重さを付け直し、4名の枠の中でテストの対象と優先度を組み替えて計画に反映し、追ってきた目安も、どの要件をどのテストで確認できたのかが分かるものに置き換える案である。これを選ばせているのは、プロジェクトの条件が途中で変わったのに、懸念の洗い出しも追う目安も着手時のまま使われているという一点である。\nまず計画の側に戻る理由である。シラバスは、テスト計画は、多くの場合、プロジェクト中に変更やフィードバックに対応するために再計画を必要とするイテレーティブなプロセスである、と述べている。テストコントロールについても、新たな洞察や課題、進化するプロジェクトのダイナミクスに対応して、テストプロセスを動的に調整することである、と定めている。扱う範囲が広がり、外部の監査という新しい求めが加わったことは、まさにこの調整が要る変化である。何を確かめるべきかを決めているのは着手時に一度きりで行った洗い出しなので、そこに戻らない限り、広がった分はどの活動の対象にも入らない。シラバスはテスト計画の不可欠な要素として強固なリスクマネジメントの枠組みがあるとし、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、としている。\n次に、目安まで置き換える理由である。運用開始の日も4名という要員も動かせない以上、洗い直しの結果は対象と優先度の組み替えとして現れる。ところが追ってきた目安は反復あたりの実行件数と、欠陥が解決するまでの日数である。組み替えたあとにこの目安だけを据え置くと、追っている数字は組み替える前の計画に対するものになり、庁内が求めた、どの要件をどのテストで確認したのかを裏付けとともに示せる状態にも届かない。シラバスは、テストマネジメントが効率的なテストコントロールを行うためには、テストスケジュールとモニタリングの枠組みを確立し、テストのステータスと進捗状況を追跡できるようにしなければならない、としたうえで、この枠組みには、テスト作業成果物やリソースの状況を、計画書や戦略の目的に関連付けるために必要となる詳細な尺度や目標値が含まれていなければならない、と述べている。目安は計画書や戦略の目的につながっている必要があり、目的が変わったならつなぎ直す側も動く。この洗い直しと置き換えを新たな人手なしで置けるのは、反復の着手時に計画を見直す時間がこれまでどおり取れているからである。","distractors":["監査に示す様式を先に固め、これまでの結果と挙げてある懸念を、どの要件をどのテストで確認したのかが分かる形に整理し直すこの案は、庁内が置いた求めに正面から応えているように見える。反復ごとに監査の窓口へ渡すところまで置いているので、監査への備えとしては隙が無いようにも見えるし、この整理は運用開始までにどこかで要る作業でもある。届かないのは範囲のほうである。懸念の洗い出しは着手時に一度行ったきりで、その重さ付けもそのまま使われている。手当の申請を受け付けることが決まって広がった分は、そこにまだ挙がっていない。挙がっていない要件は、様式をどれだけ整えても記録の中に現れない。シラバスはテスト計画の不可欠な要素として強固なリスクマネジメントの枠組みがあるとし、テストマネージャーは詳細なリスク分析を行い、プロジェクトの一連の進行や最終的なプロダクトに影響を与える潜在的な脆弱性や課題を突き止めなければならない、と述べている。様式を整えることは、この分析の代わりにはならない。",null,"開発チームと合同で仕様を読み合わせ、確認すべき観点を設計の段階から持ち寄ることは、シラバスが開発チームとのコラボレーションとしてテストモニタリングの側に挙げている活動であり、広がった範囲に正面から向き合ってもいる。早い段階で行き違いを拾えれば、残り4か月での手戻りも減る。それでも、庁内が置いた最優先は、運用開始までに、どの要件をどのテストで確認したのかを裏付けとともに示せる状態にすることである。読み合わせの場を反復ごとに重ねても、どの要件がどのテストで確かめられたのかは、それ自体としては残らない。シラバスはこの協働について、テストを成功させるためには、開発チームと緊密な協力関係を維持することが不可欠であるとし、この協力関係では、テストへの包括的なアプローチをサポートし、ホワイトボックスとブラックボックスの両方の視点からの洞察を活用して、潜在的な課題事項に事前に対処すべきである、と述べている。確認したことの裏付けを取り出せるようにすることは、この項目には挙がっていない。","広がった分だけ確かめることが増えるという読みは自然で、実行件数の目標を引き上げる案は、現場でいちばん早く動かせる手にも見える。しかしこの状況で足りていないのは量ではない。直近の反復でも計画どおりの件数は消化しており、要員は変えられないので、増やせるのは一日あたりの時間だけである。そのうえ庁内が置いた最優先は件数ではなく、どの要件をどのテストで確認したのかを裏付けとともに示せる状態である。件数の目標を引き上げても、着手時に一度きり行った洗い出しの外にある要件は
