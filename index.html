う合うかを見る。","対象の部門で足並みがそろうよう、導入するツールは全部門で同じ日から使い始める。","ツールの使い方の指針をまとめ、使う人への教育と現場での指導を行う。","ツールが実際にどう使われているかの情報を集める仕組みを用意し、その後の改善に使う。"],"answer":[1],"explanation":{"signals":"効くのは、よい実践例に当てはまらないものを選ぶという問いの向きだけである。通信機器メーカーという業種とテスト管理ツールという対象は、どれが原文の一覧に載っているかを変えない。","why":"よい実践例から外れるのは、導入するツールを全部門で同じ日から一斉に使い始める進め方である。シラバスはツールの採用と展開における一般的なよい実践例を列挙しており、その中に「ツールを段階的に組織に展開する」が入っている。全部門で同じ日から切り替える進め方は、この段階的な展開と正面から食い違う。調達や教育の手間をまとめられる、部門間で足並みがそろうといった理由は実務で語られるが、原文が置いているのは段階を踏んで広げるという方針である。残りは、パイロットプロジェクトを実施して選択基準と要件を妥当性確認しツールの適合を評価すること、ツール使用のガイドラインを定めてツールユーザーのトレーニング、コーチング、指導を行うこと、さらなる改善のためにツールの実際の使用から情報を収集する方法を実装することで、いずれも同じ一覧に並んでいる。","distractors":["選定の基準と要件が妥当かをパイロットプロジェクトで確かめ、ツールがいまの進め方にどう合うかを見ることは、シラバスが採用と展開のよい実践例の先頭に挙げている項目そのものである。原文は、パイロットプロジェクトを実施し、選択基準と要件を妥当性確認し、ツールが既存のプロセスや実践にどのように適合するかを評価すると書いている。パイロットを「まだ本番ではない段階」と軽く見ると、一覧に載っていない補助的な作業に見えてしまう。",null,"ツールの使い方の指針をまとめることと、使う人への教育と現場での指導は、シラバスがよい実践例として別々に挙げている、ツール使用のガイドラインを定めること、およびツールユーザーのトレーニング、コーチング、指導を行うことにそのまま対応する。教育や指導は導入そのものではなく事後の運用だと考えると一覧から外して読んでしまうが、原文は採用と展開の実践例の中に置いている。","ツールが実際にどう使われているかの情報を集める仕組みを用意して後の改善に使うことは、さらなる改善のために、ツールの実際の使用から情報を収集する方法を実装する、という実践例にあたる。使用状況の収集は導入が落ち着いてからの話に見えるため一覧の外だと思われやすいが、原文は展開時に用意すべきこととして並べている。"],"flip":[null,null,null,null],"flipNote":{"1":"パイロットプロジェクトを実施し、選択基準と要件を妥当性確認し、ツールが既存のプロセスや実践にどのように適合するかを評価することは、シラバスがツールの採用と展開のよい実践例として挙げている項目そのものである。これを当てはまらないものにするには、原文の一覧からこの項目が消えている必要があり、それは受験者が動かせる条件ではない。しかも消したところで、全部門で同じ日から一斉に使い始める進め方は段階的な展開と食い違ったままなので、当てはまらないものが2つになる。","3":"ツール使用のガイドラインを定めることも、ツールユーザーのトレーニング、コーチング、指導を行うことも、シラバスがよい実践例として並べている項目である。これを当てはまらないものにするには、原文の一覧から2つの項目が同時に消えていなければならない。それは受験者が動かせる条件ではなく、消したとしても一斉に切り替える進め方は段階的な展開と食い違ったままで、当てはまらないものが2つ立つ。","4":"さらなる改善のために、ツールの実際の使用から情報を収集する方法を実装することは、シラバスがよい実践例として挙げている項目である。この中身は原文の一覧に居場所を持っているので、一斉に切り替える進め方と当否が入れ替わることはない。当てはまらないものを2つ並べずにここへ移すには一覧そのものが変わるほかなく、それは条件の変更ではない。"},"quote":"ツールの採用と展開における一般的なよい実践例には、以下のようなものがある：…パイロットプロジェクトを実施し、選択基準と要件を妥当性確認し、ツールが既存のプロセスや実践にどのように適合するかを評価する。…ツール使用のガイドラインを定める…ツールユーザーのトレーニング、コーチング、指導を行う…ツールを段階的に組織に展開する…さらなる改善のために、ツールの実際の使用から情報を収集する方法を実装する。","ref":"1.6.1","misconception":"ツール導入のよい実践例を「導入前の評価と選定」の話だと思い込み、展開の仕方まで原文が定めていること──とりわけ段階的に広げるという方針──を覚えていない"},"meta":{"concept":"ツール導入のためのよい実践","distractorIntent":["パイロットの実施を、一覧に載らない補助的な作業と見る","ガイドラインと教育・指導を、導入後の運用の話として一覧の外に置く","使用状況の収集を、展開が落ち着いてからの話として一覧の外に置く"],"distractorTypes":["D12","D12","D12"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-96"]}},{"id":"q-1.6.2-A-1","lo":"TM-1.6.2","cluster":"1.6.2-A","variant":1,"chapter":1,"section":"1.6","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、どの種類のテストツールを使うかを検討する会議に出ている。商用のもの、オープンソースのもの、自社で作るものが候補に挙がっている。","question":"ツールの種類の判定に影響する側面の説明として、最も適切なものはどれか。1つ選べ。","choices":["法令遵守の対象となる組織では、要件への適合を自分たちの手で細かく作り込める自社開発のものが好まれることが多い。","初期の費用がいくらになるか読みにくいのはオープンソースのもので、コミュニティの活動量に左右される。","他のツールでは必要な機能が得られない場合、個々の要件をすべて満たせる自社開発のものが最良の選択になり得る。","優先するベンダーがある既存のツール構成では、別のベンダーの製品へ移しやすい。"],"answer":[2],"explanation":{"signals":"効くのは、どの側面がどの種類のツールを押すかという対応だけである。会議の場という設定と、商用・オープンソース・自社開発の3種類が候補に挙がっていることは、どの説明が原文どおりかを変えない。","why":"自社開発のツールは、個々の要件をすべて満たし、他のツールでは必要な機能が得られない場合に、最良の選択となり得る ── シラバスがステークホルダーの要件の項で明記しているのはこの向きで、この説明はそこにそのまま対応する。原文は同じ項で、最適なツールを評価し特定するためにはすべてのステークホルダーから要件を収集することが重要だとしたうえで、商用ツールやオープンソースツールは、必ずしもすべての要件を詳細に満たすとは限らないと述べている。だから要件を細部まで満たす必要が残る場面で自社開発が最良になり得る、という筋になる。ツールの導入と使用に関する判定には、このほかに規制とセキュリティ、経済的側面、既存のソフトウェアランドスケープとツール戦略が影響するとされており、残る3つの説明は、そちらの側面について原文が述べている向きを取り違えている。","distractors":["法令遵守の対象となる組織が好むツールを、自社開発の側に置いた説明である。要件に合うものを自分たちで作れば適合は確実だという考えは会議で出やすい。しかしシラバスは、セーフティクリティカルまたはミッションクリティカルなソフトウェアを開発する組織、あるいは法令遵守の対象となる組織は、商用ツールの方が要件に適合していることが多く、適切な認定を取得していることが多いため、商用ツールを好むかもしれないと述べている。原文が規制とセキュリティの側面に結び付けているのは商用ツールである。","初期費用の読みにくさをオープンソースの側に置いた説明である。コミュニティ次第で手間が変わるという実感はあるが、シラバスが初期費用を決定するのは難しいと述べているのはカスタムツール、すなわち自社開発のツールのほうで、理由として要件とツールの開発段階に依存することを挙げている。オープンソースツールについては、コミュニティによるサポートや開発があるため、通常、初期費用が安いとされている。",null,"既存のツール構成に優先するベンダーがある場合の向きを裏返した説明である。同じベンダーでそろえていれば乗り換えの窓口も一本化できるという見方は成り立ちそうに見えるが、シラバスが述べているのは、優先するベンダーがある場合、他のベンダーに変更しづらい場合があるということである。"],"flip":[null,null,null,null],"flipNote":{"1":"法令遵守の対象となる組織についてシラバスが述べているのは、商用ツールの方が要件に適合していることが多く、適切な認定を取得していることが多いため、商用ツールを好むかもしれないという向きである。好まれる理由として原文が置くのはその適合と認定であり、要件への適合を自分たちの手で細かく作り込めることは、個々の要件をすべて満たす側として原文が名指すカスタムツール、すなわち自社開発のものの話である。だからツールの種類を商用に替えるだけでは、自分たちの手で細かく作り込めるという理由の句が自社開発の側に属したまま残り、原文どおりの説明にはならない。種類と理由の句という2つをそろって入れ替えて初めて原文と重なるが、それは説明の中の1要素を動かすことではなく、この説明を別の説明に差し替えることである。しかも差し替えた先が原文と重なれば、個々の要件をすべて満たせる自社開発のものが最良の選択になり得るという説明も正しいままなので、正しい説明が2つ並び、1つ選べの形が成り立たない。","2":"初期の費用がいくらになるか決めるのが難しいと原文が述べているのは、要件とツールの開発段階に依存するカスタムツール、すなわち自社開発のものの側である。コミュニティが出てくるのはそこではなく、コミュニティによるサポートや開発があるため通常は初期費用が安い、というオープンソースツールの安さの理由としてである。だからツールの種類をカスタムに替えるだけでは、コミュニティの活動量に左右されるという理由の句がオープンソースの側に属したまま残り、原文どおりの説明にはならない。種類と理由の句という2つをそろって入れ替えて初めて原文と重なるが、それは説明の中の1要素を動かすことではなく、この説明を別の説明に差し替えることである。しかも差し替えた先が原文と重なれば、個々の要件をすべて満たせる自社開発のものが最良の選択になり得るという説明も正しいままなので、正しい説明が2つ並び、1つ選べの形が成り立たない。","4":"既存のツール構成に優先するベンダーがある場合についてシラバスが述べているのは、他のベンダーに変更しづらい場合があるということで、この説明はその向きを裏返している。向きを原文どおりに戻せば正しい説明になるが、そのときも自社開発が最良の選択になり得るという説明は正しいままなので、やはり正しい説明が2つ並ぶ。"},"quote":"セーフティクリティカルまたはミッションクリティカルなソフトウェアを開発する組織、あるいは法令遵守の対象となる組織は、商用ツールの方が要件に適合していることが多く、適切な認定を取得していることが多いため、商用ツールを好むかもしれない。…オープンソースツールは、コミュニティによるサポートや開発があるため、通常、初期費用が安い。…カスタムツールの初期費用は、要件とツールの開発段階に依存するため、決定するのは難しい。…カスタムツールは、個々の要件をすべて満たし、他のツールでは必要な機能が得られない場合に、最良の選択となり得る。","ref":"1.6.2","misconception":"規制・経済・要件・既存構成という4つの側面は覚えていても、それぞれが商用・オープンソース・カスタムのどれを押すかの対応を取り違え、自分の実感に合う組み合わせで読んでしまう"},"meta":{"concept":"ツール選定のための技術的側面とビジネス的側面","distractorIntent":["初期費用が読みにくい種類を、カスタムからオープンソースへ移す","法令遵守の対象となる組織が押す種類を、商用からカスタムへ移す","既存構成に優先ベンダーがある場合の向きを裏返す"],"distractorTypes":["D14","D14","D8"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-97"]}},{"id":"q-1.6.3-A-1","lo":"TM-1.6.3","cluster":"1.6.3-A","variant":1,"chapter":1,"section":"1.6","k":4,"points":3,"type":"multi","minutes":4,"scenario":"あなたは社会人向けのオンライン学習サービスを運営する会社のテストマネージャーである。回帰テストはいまも手作業で行っており、テスト自動化の実績はなく、いまの進め方が自動化に見合うかを確かめたこともない。\n\nテスト実行を自動化するツールを入れることになり、商用の2製品まで候補を絞った。経営会議には、どちらの候補も3年でプラスの投資回収に達する試算が出ており、その差は最終の判断には用いないことが決まっている。この試算は、現行のライセンス条件と保守条件がこの先も続くことを前提に作られている。\n\n試用の結果、2つの候補は社内の講習体制で同等の期間で習得できることが確認された。また、次期版でベンダーが予定している機能は評価に含めず、候補の製品については、いま検証できた能力と総所有コストだけで決めることになっている。調達部門は、発注番号を四半期末までに確定したいと言っている。","question":"この状況で、最終の判断の根拠として用いるべきものはどれか。2つ選べ。","choices":["テスト担当者がどれだけ短い期間で使いこなせるかを最上位に置き、習得で浮いた工数を回帰テストの範囲拡大に充てる。","3年間の投資回収額の見込みが大きい候補を上位に置き、その差額を次年度のテスト環境の増強に回せるかで比べる。","自社のテストプロセスが自動化の次の段階に耐えるかを取得の判断より先に評価し、足りない部分を導入計画と要員配置に織り込めるかで比べる。","ベンダーが次期版で予定している機能を候補の能力に加えて比べ、いまの版で足りない範囲を暫定の手順で運用できるかを見る。","ベンダーの保守方針が変わったときに自社側で増える作業量を候補ごとに見積もり、経常のコストと非経常のコストの双方に織り込んで比べる。"],"answer":[2,4],"explanation":{"signals":"判断を決めるのは、シナリオが答えを埋めていない2か所である。テスト自動化の実績がなく、いまの進め方が自動化に見合うかを確かめたこともないこと。もう1か所は、投資回収の試算が、現行のライセンス条件と保守条件がこの先も続くことを前提に置いていることである。どちらも候補ごとに調べてみるまで差が分からない。いっぽう、一般には妥当な着眼のうち3つは、与件がその場で無力にしている。試用の結果、2つの候補は社内の講習体制で同等の期間で習得できると確認された（習得の早さ）。3年でプラスの投資回収に達する点の差は最終の判断には用いないと決まっている（投資回収額の大きさ）。次期版でベンダーが予定している機能は評価に含めないと決まっている（将来の機能）。3つ目の決めごとは「候補の製品については、いま検証できた能力と総所有コストだけで決める」という形で評価の範囲を限る文であり、総所有コストは範囲に残されている。調達部門が発注番号を四半期末までに確定したいという事情は、どちらの候補を採るかには関与しないノイズである。ただし段取りには効く。取得を決める前に自社の進め方を評価するなら、その評価をいつまでに終える形で組むかという話になる。四半期末はここでは調達部門の希望として述べられているだけで、守るべき期限として置かれた与件ではない。いずれにせよ候補の優劣ではなく、評価の進め方のほうに掛かる。","why":"最終の判断に使うべきなのは、自社のテストプロセスが自動化の次の段階に耐えるかを取得の判断より先に評価して、足りない部分を導入計画と要員配置に織り込めるかで比べることと、ベンダーの保守方針が変わったときに自社側で増える作業量を候補ごとに見積もり、経常のコストと非経常のコストの双方に織り込んで比べることである。この2つを選ばせているのは、シラバスがツールを選択する際に考慮すべき ROI に関するリスクとして名指ししている「組織の未熟さが、ツールの非効率的な使用につながる可能性がある」と「ベンダーのメンテナンス・ポリシーが変更されると、作業量が増える可能性がある」が、このシナリオではどちらも手つかずのまま残っていることである。\n自社の進め方を評価するほうから見る。自動化の実績がなく、いまの進め方が自動化に見合うかを確かめていない組織では、ツールを入れても非効率な使い方に落ち着き、見込んだ利益が予想を下回る可能性がある。だから足りない部分を導入計画と要員配置に織り込めるかどうかが、候補を比べる軸になる。これは候補の製品の能力ではなく自社の状態を見るものなので、「候補の製品については、いま検証できた能力と総所有コストだけで決める」という評価範囲を限る決めごとは掛からない。織り込み方が両候補で同じだという与件も無い。同等だと確認されたのは習得の期間、判断に用いないと決まったのは投資回収額の差、評価に含めないと決まったのは次期版の機能であって、明示のないところまで同じだと見なす読みは、与件が言っていないことを足すことになる。ひとつ補っておくと、シラバスが取得または構築の前に置いているのは費用対効果分析であって、テストプロセスの成熟度の評価を取得の判断より先に行えとは書かれていない。ここでの順序は、組織の未熟さがツールの非効率的な使用につながるという ROI に関するリスクから導いたものである。未熟さを抱えたまま取得を決めれば、その費用対効果分析が見込んだ利益の側が崩れうる。ツールが未熟さを埋めるのではなく、未熟さがツールの効果を減じる、というのがシラバスの向きである。\n保守方針の見積りのほうは、投資回収の試算の前提そのものに根がある。試算は現行のライセンス条件と保守条件が続くことを前提に置いているが、シラバスはベンダーのメンテナンス・ポリシーの変更を ROI に関するリスクとして名指ししている。前提が崩れたときに自社側で増える作業量は、製品ごとのライセンス条件と保守条件の定め方に依存するので、候補ごとに見積もってみるまで分からない。ここでも、両候補で同じだと確認された事実は与件に無い。習得の期間のように同等だと確認されて、はじめてその属性は比較から降りる。そしてシラバスは、費用対効果分析について経常的なコストと非経常的なコストの両方を考慮に入れるべきだとしている。経常的なコストには定期的なライセンス料とサポート料やメンテナンスコストが、非経常的なコストには初期使用のためのツールの購入・適応・開発や、既存のツールランドスケープへのツールの統合が入る。保守方針が変われば、払い続ける側の額も、作り直しになる側の作業も動きうるので、片側だけを数えた見積りは候補の比較に使えない。評価範囲を限る決めごとも総所有コストを範囲に残しているので、この見積りを妨げない。「いま検証できた」は能力に掛かる語である。総所有コストは取得から運用までの期間にかかる費用を数えたものであり、経常的なコストと非経常的なコストの両方を考慮せよという以上、はじめから見積りを含む。いま支払った額だけを指す語ではない。","distractors":["習得の早さは、この状況では候補を分けない。試用の結果、2つの候補は社内の講習体制で同等の期間で習得できることが確認されているからである。与件が同じ値だと明示した属性は、どちらを選ぶかを決められず、習得で工数が浮いてその分を回帰テストの範囲拡大に充てられるという前提も、同等と確認された時点で成り立たなくなる。使用性そのものは、シラバスが「ツールを使う人にとって、使用性は非常に重要である」と述べる正しい考慮事項であり、導入後の定着を左右するという見方にも無理はない。だから最上位に置きたくなる。効かなくしているのは原文ではなく、この状況のほうである。なお、同じ値だから比較から降りるという扱いが働くのは与件が同等だと確認した属性についてだけで、与件が何も言っていない属性まで同じだと見なしてよいわけではない","3年でプラスの投資回収に達する点について、経営会議はその差を最終の判断には用いないと決めている。だから見込み額の大きいほうを上位に置いても候補は分かれず、差額を次年度のテスト環境の増強に回せるかを比べても同じである。この比べ方が筋に見えるのは、経営幹部にとってプラスの ROI が要件となるというシラバスの記述と地続きだからだが、そこで要件とされているのはプラスであることである。両候補ともその足切りは通過済みで、通過したあとの大小を、この状況は順位づけに使わせない",null,"次期版でベンダーが予定している機能は評価に含めないと決まっており、候補の製品はいま検証できた能力と総所有コストだけで決めることになっている。予定された機能を候補の能力に加えて比べることは、この決めごとを外して候補を並べ直すことである。ツールは長期の投資になりうるものなので、将来の版まで見越して選びたくなるのは自然であり、いまの版で足りない範囲を暫定の手順で運用できるかという見方にも実務の手触りがある。しかしその見方も、評価に含めないと決めた予定を前提にしている以上、同じ理由で根拠にならない",null],"flip":[null,null,null,null,null],"flipNote":{"1":"習得の早さが候補を分ける基準になるには、2つの候補の習得に要する期間に差があればよい。ただしそれだけでは、この着眼は単独の正解にならない。自社のテストプロセスが自動化の次の段階に耐えるかという根拠も、ベンダーの保守方針が変わったときに増える作業量という根拠も、どちらも ROI に関するリスクとして残るからである。用いるべき根拠が3つになり、2つ選べという形式が成り立たない。どちらかの根拠を消すには、自動化の実績が無いことか、試算が現行のライセンス条件と保守条件の継続を前提にしていることまで併せて動かす必要があり、条件が2つ以上になる。","2":"投資回収を判断の根拠に戻す道はあるが、どれもこの比べ方を単独の正解にしない。一方の候補だけがプラスに届かない形にすれば投資回収は足切りとして働くが、それは見込みが大きいほうを上位に置くという比べ方を正当化しない。投資回収の大きさで順位を決めると経営会議が定め直せばこの比べ方は正当になるが、そのときも組織の未熟さとベンダーの保守方針の変更に由来する根拠は残るため、用いるべき根拠が3つになって2つ選べが成り立たない。","4":"次期版で予定されている機能を評価に含めてよいと決め直せば、この着眼は候補を比べる材料にはなる。それでも単独の正解にはならない。組織の未熟さとベンダーの保守方針の変更という ROI に関するリスクに由来する根拠がそのまま残り、用いるべき根拠が3つになって2つ選べという形式が成り立たないからである。どちらかを消すには、自動化の実績が無いことか、試算の前提のどちらかを併せて動かす必要があり、条件が2つ以上になる。"},"quote":"ツールの取得または構築の前に、それが組織にとって有益であることを確実にするために、費用対効果分析を行うべきである。この分析では、経常的なコストと非経常的なコストの両方を考慮に入れるべきである。…ツールを選択する際には、ROI に関する以下のリスクを考慮すべきである：組織の未熟さが、ツールの非効率的な使用につながる可能性がある。ベンダーのメンテナンス・ポリシーが変更されると、作業量が増える可能性がある。","ref":"1.6.3（ROI に関するリスク・費用対効果分析が対象とする経常／非経常のコスト）／1.6.1（適切なツールのサポートを受けながら、プロセス改善の機会を識別する）","misconception":"習得の早さ・投資回収額の大きさ・将来の機能という一般には妥当な着眼を、シナリオがそれらを候補の区別に使えないものにしていても判断の根拠として持ち込み、ROI に関するリスクとして名指しされている組織の未熟さとベンダーの保守方針の変更を見落とす"},"meta":{"concept":"テストツールの選定とROI","distractorIntent":["使用性を最上位の基準に置く（両候補で同等と確認された属性を比較に使う）","プラスの ROI を足切りではなく最大化の対象と読む","ベンダーのロードマップと現行の検証済み能力を同列に扱う"],"distractorTypes":["D2a","D2a","D2a"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-39","MP-42","MP-44","MP-46"]}},{"id":"q-1.6.3-A-2","lo":"TM-1.6.3","cluster":"1.6.3-B","variant":1,"chapter":1,"section":"1.6","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたはクレジットカードの決済代行サービスを提供する会社のテストマネージャーである。手作業の回帰テストに年間2,400万円をかけており、テスト管理ツールを入れ替えることになった。\n\nカード業界のセキュリティ基準の認定は毎年更新している。その審査では、要件から検査結果までの追跡を記録で示すことと、セキュリティテストの計画と結果を同じツール上で管理することが求められる。経営層は3年以内にプラスの投資回収に達することを条件とし、開発チームは短い期間で習得できるものを、運用部門は保守の負担が軽いものを望んでいる。調達部門は取引実績のあるベンダーへ集約したいと考えている。\n\n年間の保守費は導入費用の20%である。評価・教育・移行に要する工数は、下表の削減見込みには含めていない。この工数は、習得期間が最も長い候補でも3年間で200万円を超えない。","table":{"caption":"候補3製品の比較（金額の単位は万円）","headers":["ツール","導入費用","年間の削減見込み","要件から結果までの追跡","セキュリティテストの管理","習得期間"],"rows":[["P","600","1,300","検査結果のみ記録（要件との対応付けは手作業）","対応なし","2週間"],["Q","1,000","1,200","要件から結果まで自動で記録","対応なし","4週間"],["R","1,600","1,000","要件から結果まで自動で記録","計画と結果を管理できる","8週間"]]},"question":"どの候補をどう扱うかの判断として、最も適切なものはどれか。1つ選べ。","choices":["要件から結果までの追跡とセキュリティテストの管理をともに満たすRを採る。3年でプラスの投資回収に達することを確かめたうえで、導入費と初期教育の工数は非経常のコスト、毎年の保守費は経常のコスト、習得の8週間に費やす時間は機会コストとして計画に見込む。","要件から結果までの追跡を自動で記録でき、3年間の投資回収額もRを上回るQを採る。セキュリティテストは外部の診断サービスに年2回委託し、その報告書を審査の場に提出する。","3候補とも3年でプラスの投資回収に達するため、投資回収の差は決め手にならない。追跡とセキュリティテストの管理の差も運用手順の整備で吸収できる範囲なので、最も早く立ち上げられる候補から段階的に導入する。","3年間の導入費と保守費の合計が最も低く、年間の削減見込みが最も大きく、習得期間も2週間で済むPを採る。要件との対応付けとセキュリティテストの記録は、現行の管理台帳を審査用に整えて示す。"],"answer":[0],"explanation":{"signals":"候補を分けるのは、カード業界のセキュリティ基準の認定の審査が求める2点だけである。要件から検査結果までの追跡を記録で示すことと、セキュリティテストの計画と結果を同じツール上で管理することであり、表ではこの2つの列がPとQに空きを作っている。表の金額のほうは順位を決めない。年間の保守費は導入費用の20%なので、3年間の費用はPが960、Qが1,600、Rが2,560、削減見込みの3年分はPが3,900、Qが3,600、Rが3,000である。削減見込みに含めていない評価・教育・移行の工数は3年間で200万円を超えないので、これを費用側に加えてもPは2,740、Qは1,800、Rは240の余裕が残り、3候補とも経営層の条件を満たす。つまり投資回収は足切りとしてしか働かない。開発チームが望む短い習得期間も、運用部門が望む軽い保守負担も、審査の求めを代替しない。調達部門が取引実績のあるベンダーへ集約したいという希望は、表のどの列とも結びつかないノイズである。","why":"採るべきはRである。カード業界のセキュリティ基準の認定の審査は、要件から検査結果までの追跡を記録で示すことと、セキュリティテストの計画と結果を同じツール上で管理することを求めており、表でその両方に対応しているのがRだからである。Pは要件との対応付けが手作業のままでセキュリティテストの管理にも対応しておらず、Qは追跡を自動で記録できるがセキュリティテストの管理を欠く。Rは導入費用が最も高く、年間の削減見込みが最も小さく、習得にも8週間かかるが、コストと使用性の優位は、審査で求められる要件の欠落を埋め合わせない。\nなぜ審査の求めが、開発チームの習得期間の希望や運用部門の保守負担、調達部門のベンダー集約より先に来るのか。シラバスは、ビジネスツールを選択する際には組織やステークホルダーの要件や規制をすべて考慮しなければならないとし、最適なツールを評価し特定するためにはすべてのステークホルダーから要件を収集することが重要だと述べている。規制や認定に由来する求めは、考慮するかどうかを選べる項目ではない。ただし集めた要件のうちどれが外せないかを決めるのは、この状況のほうである。認定は毎年更新しており、その審査が2点を求めるとシナリオが明示している。交渉で外せる性質のものではない。シラバスはツールの利点の1つにツールがサポートする特定のテストタイプのカバレッジ向上を挙げており、セキュリティテストを扱えるかどうかは、このツールがどの範囲の品質リスクを引き受けられるかを直接に決める。追跡についても同じで、記録で示せなければ認定が維持できない。\nもっとも、Rを採ると決めるには、経営層が置いた3年以内のプラスの投資回収を満たしていることを確かめておかなければならない。シラバスは経営幹部にとってプラスの ROI が要件となるとし、取得または構築の前に費用対効果分析を行い、経常的なコストと非経常的なコストの両方を考慮すべきだとしている。年間の保守費は導入費用の20%だから、3年間の費用はPが600＋360＝960、Qが1,000＋600＝1,600、Rが1,600＋960＝2,560である。削減見込みの3年分はそれぞれ3,900、3,600、3,000で、どの候補も費用を上回る。削減見込みに含めていない評価・教育・移行の工数は、習得期間が最も長い候補でも3年間で200万円を超えないから、これを費用に加えてもPは2,740、Qは1,800、Rは240の余裕が残り、最も余裕の小さいRでもプラスは崩れない。条件は3候補とも通過するので、投資回収の大小は順位づけの根拠にならない。\n残るのは、Rを選んだあとにその費用をどう計上するかである。シラバスは、初期使用のためのツールの購入・適応・開発やツールの初期トレーニングを非経常的なコストに、定期的なライセンス料とサポート料およびメンテナンスコストを経常的なコストに数え、さらに機会コストとして、ツールの評価・管理・トレーニング・使用に費やされた時間は代わりに実際のテストタスクに費やすことができた可能性があると述べている。導入費と初期の教育の工数は非経常のコストに、毎年発生する保守費は経常のコストに、習得の8週間に費やす時間はその間テスト作業に充てられない分の機会コストに当たる。いずれも計画に見込むべきものであって、候補を落とす理由にはならない。","distractors":[null,"外部の診断サービスに年2回委託して報告書を審査の場に提出しても、セキュリティテストの計画と結果が同じツール上で管理される状態は作られない。テストの実施を外に出すだけだからである。Qは要件から結果までの追跡を自動で記録でき、3年間の投資回収額もRを上回るので、審査への備えと経済性を両立しているように見え、審査が求める2点のうち欠けているのもセキュリティテストの管理だけである。しかしその欠落が、審査の求めそのものに当たる。認定を維持できるかどうかの結論は、欠落が1つに減っても変わらない","3候補とも3年でプラスの投資回収に達するという計算は正しく、そこから投資回収は決め手にならないと読むところまでも正しい。外れるのはその先である。投資回収が候補を分けないのなら、残った差でこそ決めなければならないのに、この案はその差まで吸収できる範囲として扱っている。追跡とセキュリティテストの管理は、認定の審査が求めている2点であり、運用手順の整備で置き換えられる性質のものではない。最も早く立ち上げられる候補から段階的に導入するという進め方は、候補を分ける差を1つも使わずに順番だけを決めていることになる","Pは審査が求める2点をどちらも欠く。要件との対応付けは手作業のままで、セキュリティテストの管理には対応していない。3年間の導入費と保守費の合計が最も低く、年間の削減見込みが最も大きく、立ち上げも2週間で最も早いので、経営層の条件も満たしており、コストと使用性の両面で最初に手が伸びる案である。しかし現行の管理台帳を審査用に整えて示すという補い方は、セキュリティテストの計画と結果を同じツール上で管理するという求めには届かない。コストと使用性の優位は、審査で求められる要件の欠落を埋め合わせない"],"flip":[null,"セキュリティテストの計画と結果を同じツール上で管理するという求めが、外部の診断サービスの報告書で代替できるのであれば、追跡を自動で記録でき投資回収額も大きいQが最良の選択になる",null,null],"flipNote":{"3":"この案が単独で正しくなる条件は、1つでは作れない。成り立つとすれば、審査が求める2点を3候補とも満たすか、その2点が運用手順で補ってよいものになるかのどちらかだが、どちらを置いても、最も安く最も早く立ち上がるPを採ると述べている案が同時に正しくなり、最も適切なものが2つになる。この案だけを残すには、表の費用や削減見込みの並びまで併せて動かす必要があり、条件が2つ以上になる。","4":"認定の審査が、要件との対応付けやセキュリティテストの記録を台帳での提示で認めるのであれば、3年間の費用が最も低く削減見込みも最大のPを採るこの案は正しくなる。ただし同じ条件のもとでは、追跡とセキュリティテストの管理の差は運用手順の整備で吸収できるとして最も早く立ち上げられる候補から段階的に導入する案も同時に正しくなり、最も適切なものが2つになる。この案だけを残す条件は、審査の求めの側にも表の側にも1つでは見つからない。"},"quote":"ビジネスツールを選択する際には、組織やステークホルダーの要件や規制をすべて考慮しなければならない。…経営幹部にとっては、プラスのROI が要件となる。…ツールの取得または構築の前に、それが組織にとって有益であることを確実にするために、費用対効果分析を行うべきである。この分析では、経常的なコストと非経常的なコストの両方を考慮に入れるべきである。非経常的な活動およびコストには以下のものを含む：…初期使用のためのツールの購入、適応、開発…ツールの初期トレーニング…経常的な活動やコストには以下のものを含む：…定期的なライセンス料とサポート料…メンテナンスコスト…機会コストも考慮しなければならない。つまり、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性がある。…ツールがサポートする特定のテストタイプのカバレッジ向上","ref":"1.6.3（プラスのROI・費用対効果分析の経常／非経常のコスト・機会コスト・ツールの利点）／1.6.2（ステークホルダーの要件: すべてのステークホルダーから要件を収集する）／1.6（ツールの選択では組織やステークホルダーの要件や規制をすべて考慮する）","misconception":"プラスの投資回収を順位づけの指標だと読み、コストと使用性の優位が、規制・認定に由来する要件の欠落を埋め合わせると考える"},"meta":{"concept":"テストツールの選定とROI","distractorIntent":["欠落が1点だけの候補を、外部委託で補えると考えて選ぶ（惜しい誤答）","全候補がプラスの投資回収に達することから、候補間の差そのものを無視できると扱う","コストと使用性の優位で、審査に由来する要件を2つとも欠く候補を選ぶ"],"distractorTypes":["D3","D5","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-39","MP-41","MP-43","MP-46"]}},{"id":"q-1.6.3-C-1","lo":"TM-1.6.3","cluster":"1.6.3-C","variant":1,"chapter":1,"section":"1.6","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは物流会社向けの倉庫管理システムを開発する会社のテストマネージャーである。社内にはWeb画面、ハンディ端末、基幹システム連携の3つのチームがあり、いずれもサービス間のやり取りを確かめるテストを手作業で行っている。手作業に最も時間を費やしているのはハンディ端末チームである。\n\n全社のツール戦略は2つを定めている。新しく入れるテストツールは、全社共通のテスト管理ツールMと双方向にやり取りでき、実行結果と不具合の状況がM上に集まること。もう1つは、保守とライセンス管理の手間を増やさないため、同じ用途のツールを複数持たないことである。\n\n候補は3つある。Xは3チームのどの対象にも対応し、Mと双方向に連携できる。Yはハンディ端末の通信方式に特化していて、その領域の評価は3候補で最も高く、Mとも双方向に連携できるが、他の2チームの対象は扱えない。Zは3チームのどの対象も扱え、機能の評価はXを上回るが、Mとの連携機能を持たない。\n\n試用に割ける枠は、1つの候補を1つの領域で試す程度である。社内の勉強会では、Zの画面が最も見やすいという声が多い。","question":"この状況でのツールの選択と導入の進め方として、最も適切なものはどれか。1つ選べ。","choices":["ハンディ端末には評価が最も高いYを、残る2チームにはXを入れる。どちらもMと双方向に連携できるので実行結果と不具合の状況はM上に集まり、領域ごとに最も評価の高い道具を持てる。2本分のライセンス料と保守費は、削減できる手作業の時間で賄える見込みである。","機能の評価が最も高く3チームのどの対象も扱えるZを入れ、実行結果は月ごとにM上へ書き写し、不具合の状況は担当者が既存の一覧で突き合わせて、書き写しの漏れを月次の点検で防ぐ。","3チームのどの対象にも使えてMと双方向に連携できるXに一本化する。取得を決める前に、まずハンディ端末の領域に限って試して自動化できる範囲を確かめ、ライセンス料と保守費に試用と教育の工数を加えた費用対効果を見たうえで、対象を段階的に広げる。","3つの候補を3チームで並行して試し、領域ごとの削減時間を実測する。手作業に最も時間を費やしているハンディ端末での結果を重く見て、合計の削減が最も大きい候補に一本化する。"],"answer":[2],"explanation":{"signals":"効くのは全社のツール戦略の2つの定めと、候補ごとの守備範囲である。1つ目は、新しく入れるテストツールがMと双方向にやり取りでき、実行結果と不具合の状況がM上に集まること。2つ目は、保守とライセンス管理の手間を増やさないため、同じ用途のツールを複数持たないことである。候補の側では、3チームのどの対象にも使えるのはXとZ、Mと双方向に連携できるのはXとYで、両方に当てはまるのはXである。ハンディ端末チームの手作業が最も多いことと、その領域の評価がYで最も高いことはどちらも与件だが、Yは他の2チームの対象を扱えないので、Yで3チームを賄おうとすれば2本目が要る。試用に割ける枠が1つの候補を1つの領域で試す程度であることは、どれを採るかではなく、採ったあとの進め方に効く。社内の勉強会でZの画面が見やすいという声が多いことは、好みの話であって判断には関与しないノイズである。","why":"採るべきはXに一本化する案である。3チームのどの対象にも使えて、なおかつMと双方向に連携できる候補がXだからである。全社のツール戦略は、新しく入れるテストツールがMと双方向にやり取りでき実行結果と不具合の状況がM上に集まることと、保守とライセンス管理の手間を増やさないため同じ用途のツールを複数持たないことの2つを定めている。Zは3チームのどの対象も扱えるがMとの連携機能を持たず、Yは連携できるが他の2チームの対象を扱えないので、Yで3チームを賄う形はどれも2本目を前提にする。\nシラバスは、サポートおよび運用チームの立場について、組織全体で使用されるツールの数は限られているが必要な数であることが望ましく、より多くのツールを保守し、ライセンスをマネジメントし、ツールの数をマネジメントすることはコストや時間のかかることであってはならない、と述べている。節の最後では、組織の総 ROI は通常テストに使用されるすべてのツールの ROI の混合であり、ツールは情報を共有し協調して動作する必要があるとして、リスク、コスト、利益を含むテストツールの長期的かつ包括的な戦略が望ましいとしている。評価の単位は1本のツールの出来ではなく、組織のツール群としての回収である。ハンディ端末の領域だけを見ればYの評価が最も高く、その領域の手作業が最も多いことも与件だが、そこでの優位は、2本目を持つことで増える保守とライセンス管理の手間を差し引いた先で評価される。\n採ったあとの進め方も与件から決まる。試用に割ける枠は1つの候補を1つの領域で試す程度なので、試す先はXがYに評価で劣り、しかも手作業が最も多いハンディ端末の領域に置く。シラバスは採用と展開のよい実践として、パイロットプロジェクトを実施し、選択基準と要件を妥当性確認し、ツールが既存のプロセスや実践にどのように適合するかを評価することと、ツールを段階的に組織に展開することを挙げている。そのうえで、ツールの取得または構築の前に費用対効果分析を行い、経常的なコストと非経常的なコストの両方を考慮に入れるべきだとしている。毎年のライセンス料と保守費は経常の側、試用と教育に費やす工数は非経常の側にあたるので、取得を決める前に両方を入れて確かめる。","distractors":["ハンディ端末の領域でYの評価が最も高いことも、その領域の手作業がいちばん多いことも、XとYがどちらもMと双方向に連携できることも与件どおりで、実行結果と不具合の状況はM上に集まるので、全社のツール戦略の1つ目は満たされる。外れるのは2つ目のほうである。同じ用途のツールを2本持つことになり、保守とライセンス管理の手間を増やさないという定めに反する。2本分のライセンス料と保守費が手作業の削減で賄えるかどうかは、ここでの応えになっていない。シラバスがサポートおよび運用チームの立場として挙げているのは、より多くのツールを保守し、ライセンスをマネジメントし、ツールの数をマネジメントすることがコストや時間のかかることであってはならない、という手間の側だからである。領域ごとに最も評価の高い道具を持つ形は、組織の総 ROI は通常すべてのツールの ROI の混合であるという見方の外に出ている。","Zは3チームのどの対象も扱え、機能の評価はXを上回る。ツールを1本に保つ点でも全社のツール戦略に沿っており、社内の勉強会でも画面の見やすさが支持されている。だが、この戦略のもう1つの定めは、新しく入れるテストツールがMと双方向にやり取りでき、実行結果と不具合の状況がM上に集まることである。Zはその連携機能を持たない。月ごとの書き写しと月次の点検という補い方は、人手による転記を毎月増やすものであって、情報がM上に集まる状態を作らない。シラバスはツールの利点の1つにテストに関する情報への迅速なアクセスを挙げ、ツールは情報を共有し協調して動作する必要があるとしている。機能の評価の高さは、この定めの欠落を埋め合わせない。",null,"実測で決めるという考え方そのものは、シラバスが明確な要件と客観的な基準に照らしてツールを評価すると述べていることに沿っており、手作業に最も時間を費やしているハンディ端末での結果を重く見る点にも筋がある。成り立たないのは規模のほうである。試用に割ける枠は1つの候補を1つの領域で試す程度だと与件が述べており、3候補を3チームで並行して試す余地はない。シラバスは、ツールの評価や管理やトレーニングや使用に費やされた時間は代わりに実際のテストタスクに費やすことができた可能性があるとして、機会コストを考慮しなければならないとしている。評価を厚くするほど、その時間は手作業のテストから引かれる。さらに、削減時間の合計だけで一本化すると、Mとの連携も3チームの守備範囲も見ないまま候補が決まることになり、全社のツール戦略が先に置いている2つの定めを素通りする。"],"flip":[null,null,null,null],"flipNote":{"1":"同じ用途のツールを複数持たないという定めのほうを緩めれば、2本を持つこの形は戦略には反しなくなる。それでも単独の正解にはならない。3チームのどの対象にも使えてMと双方向に連携できるXが候補に残っており、1本で同じ範囲を賄える案が同時に成り立つからである。この案だけを残すには、定めを緩めることに加えて、Xがハンディ端末の対象を扱えないところまで併せて動かす必要があり、条件が2つ以上になる。","2":"全社のツール戦略の1つ目は、新しく入れるテストツールがMと双方向にやり取りできることと、実行結果と不具合の状況がM上に集まることの2つを同時に求めている。月ごとの書き写しを、情報がM上に集まる手立てとして認める読み替えを置いても、満たせるのは後半だけである。Zは連携機能そのものを持たないので、Mと双方向にやり取りできるという前半は読み替えの外に残り、この案は戦略に反したままである。前半についても人手の転記で代替してよいと定め直せば、この案は戦略に反しなくなる。それでも単独の正解にはならない。3チームのどの対象にも使えてMと双方向に連携できるXに一本化する案が、その定め直しのもとでも戦略を満たしたまま残るからである。この案だけを残すには、連携機能の欠落を戦略の外に出すことに加えて、Xの側の条件も併せて動かす必要があり、条件が2つ以上になる。","4":"試す枠を3つの候補を3つの領域で同時に試せるだけ広げれば、この進め方は実行できるようになる。それでも単独の正解にはならない。削減時間の合計が最も大きい候補がZであれば、Mとの連携を欠いたまま一本化することになり、新しく入れるツールがMと双方向にやり取りでき実行結果と不具合の状況がM上に集まることという1つ目の定めに反する。Yであれば他の2チームの対象は手作業のまま残る。削減時間の実測は、全社のツール戦略が先に置いている条件を置き換えない。"},"quote":"サポートおよび運用チームにとっては、組織全体で使用されるツールの数は限られているが、必要な数であることが望ましい。より多くのツールを保守し、ライセンスをマネジメントし、ツールの数をマネジメントすることは、コストや時間のかかることであってはならない。…ツールの取得または構築の前に、それが組織にとって有益であることを確実にするために、費用対効果分析を行うべきである。この分析では、経常的なコストと非経常的なコストの両方を考慮に入れるべきである。…組織の総 ROI は通常、テストに使用されるすべてのツールのROI の混合である。ツールは情報を共有し、協調して動作する必要がある。リスク、コスト、利益を含むテストツールの長期的かつ包括的な戦略が望ましい。","ref":"1.6.3（サポートおよび運用チームの視点＝ツールの数の抑制／組織の総 ROI の混合とツール間の情報共有／費用対効果分析が対象とする経常・非経常のコスト／機会コスト／利点のうちテストに関する情報への迅速なアクセス）／1.6.1（明確な要件と客観的な基準・パイロットプロジェクト・段階的な展開）","misconception":"1本のツールの評価の高さで選び、ツールの本数が増えることで生じる保守とライセンス管理の手間と、既存のツール群との情報の共有を、組織の総 ROI の側から見ない"},"meta":{"concept":"テストツールの選定とROI","distractorIntent":["領域ごとに最も評価の高い専用ツールを持つ形を選び、ツールの本数が増えることによる保守とライセンス管理の手間を、金額で賄えるかどうかに読み替える（惜しい誤り。ツール戦略の2つのうち1つだけを欠く）","機能の評価とツールの本数は満たすが、Mと双方向にやり取りできることと情報がM上に集まることの2つを求める定めを、人手の転記で代替できると考える","候補ごとの実測を積み増せば選定が決まると考え、評価に費やす時間の機会コストと、先に置かれているツール戦略を見ない"],"distractorTypes":["D3","D2a","D13"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-45","MP-40","MP-107"]}},{"id":"q-1.6.3-D-1","lo":"TM-1.6.3","cluster":"1.6.3-D","variant":1,"chapter":1,"section":"1.6","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは人事給与のクラウドサービスを提供する会社のテストマネージャーである。法令の改正に合わせて毎月リリースしており、そのたびに回帰テストを手作業で行っている。この手作業は、外部への委託分を含めて年間4,500万円にあたる。\n\nテスト実行を自動化するツールの導入を経営会議に諮ることになった。導入後は手作業の回帰テストの6割を自動化できる見込みである。候補のツールは、いまは道具がなくて実施できていない性能テストの実行も扱え、実行の記録は製品の中に一元的に残る。過去1年の本番障害5件のうち3件は、手順の飛ばしによる確認漏れだった。いまの記録は担当者ごとの表計算ファイルに散っており、問い合わせのたびに集め直している。\n\nリリースの日は法令の施行日に合わせて決まっており、テストに要する期間が短くなっても前倒しはできない。テスト担当者は8名で毎月の対応に手一杯であり、自動化するテストの作成と運用の習得もこの8名が行う。最初の1年は、自動化したテストを作りながら手作業の回帰テストも従来どおり続ける必要がある。人事部門は、来期に社内の勤怠システムを入れ替える。","question":"導入によって得られる便益の評価として、最も適切なものはどれか。1つ選べ。","choices":["自動化によってテストに要する期間が短くなる分、毎月のリリースを前倒しできることを便益の中心に置き、法令の改正に前もって備えられる回数の増加として示す。","手作業の削減に加えて、実施できていない性能テストまで扱えるようになること、確認漏れによる本番障害が減ること、記録が1か所に残り問い合わせにすぐ答えられることも便益に数える。最初の1年は作成と習得に8名の時間が取られ手作業も続くため、削減は初年度には現れないものとして示す。","年4,500万円の6割にあたる2,700万円の削減を初年度から見込み、性能テストを扱えるようになること、確認漏れによる本番障害の減少、記録が1か所に残ることも便益に加える。作成と習得は毎月の対応の合間に収まるものとして、要員を増やさずに初年度から回収が始まり、翌年以降も同じ水準で続く形で示す。","経営会議には金額で示す必要があるため、便益は手作業の削減額だけを数え、年4,500万円の6割にあたる2,700万円を初年度から計上する。性能テストや確認漏れ、記録の散らばりについては、参考として付記するにとどめる。"],"answer":[1],"explanation":{"signals":"効くのは、便益の側にある事実と、時期の側にある事実である。便益の側では、候補のツールがいま道具のない性能テストの実行も扱えること、実行の記録が製品の中に一元的に残ること、過去1年の本番障害5件のうち3件が手順の飛ばしによる確認漏れだったこと、いまの記録が担当者ごとの表計算ファイルに散っていて問い合わせのたびに集め直していることが効く。時期の側では、テスト担当者が8名で毎月の対応に手一杯であること、自動化するテストの作成と運用の習得もこの8名が行うこと、最初の1年は自動化したテストを作りながら手作業の回帰テストも従来どおり続ける必要があることが効く。リリースの日が法令の施行日で決まり、テストに要する期間が短くなっても前倒しはできないという一文は、一般にはツールの利点に数えられるテストサイクルの短縮を、この状況では便益として数えられなくしている。人事部門が来期に社内の勤怠システムを入れ替えることは、便益の見立てに関与しないノイズである。","why":"示すべきなのは、手作業の削減に加えて、性能テストまで扱えるようになること、確認漏れによる本番障害が減ること、記録が1か所に残り問い合わせにすぐ答えられることも便益に数え、そのうえで削減は初年度には現れないものとして置く見立てである。\n便益の広がりのほうから見る。シラバスはテストツールの利点として、手作業による繰り返し作業の削減、自動化によるテストサイクルのスピードアップ、手作業の減少によるテスト実行コストの削減、ツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスを挙げている。この状況には、そのうちのいくつかに当たる事実が置かれている。毎月の回帰テストの手作業とその年間の金額、いまは道具がなくて実施できていない性能テストを候補のツールが扱えること、過去1年の本番障害5件のうち3件が手順の飛ばしによる確認漏れであったこと、実行の記録が担当者ごとの表計算ファイルに散っていて問い合わせのたびに集め直していることである。金額に直せるのは手作業の削減だけだが、残りを落とすと、この投資がどの範囲を引き受けるようになるのかが見立てから消える。いっぽう、テストサイクルのスピードアップは原文の利点に並んでいても、この状況では数えられない。リリースの日は法令の施行日に合わせて決まっており、テストに要する期間が短くなっても前倒しはできないからである。\n時期のほうは機会コストの話である。シラバスは、機会コストも考慮しなければならないとしたうえで、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性があるとし、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性があると述べている。この状況では、テスト担当者は8名で毎月の対応に手一杯であり、自動化するテストの作成と運用の習得もこの8名が行う。しかも最初の1年は、自動化したテストを作りながら手作業の回帰テストも従来どおり続ける必要がある。手作業が従来どおり残る以上、その分の削減は初年度には現れず、作成と習得に取られる時間の分だけ、実際のテスト作業に充てられる時間はむしろ減る。経営会議に初年度からの削減を約束すると、導入の途中でその約束のほうが先に崩れ、稼働前に工数が増える期間を持ちこたえられなくなる。","distractors":["自動化によるテストサイクルのスピードアップは、シラバスがテストツールの利点として実際に挙げているものである。だからこの見立ては、原文の一項目にまっすぐ対応しているように見える。効かなくしているのは状況のほうで、リリースの日は法令の施行日に合わせて決まっており、テストに要する期間が短くなっても前倒しはできない。前倒しができない以上、法令の改正に前もって備えられる回数は増えず、この便益はここでは立たない。加えて、便益をこれだけに絞ると、候補のツールが扱える性能テストの範囲も、確認漏れによる本番障害の減少も、記録が1か所に残ることも、見立てから外れる。",null,"便益の数え方そのものは広く取れており、性能テストを扱えるようになること、確認漏れによる本番障害の減少、記録が1か所に残ることを挙げている点は、シラバスが利点に挙げるツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスにそのまま対応する。欠けているのは時期のほうである。最初の1年は、自動化したテストを作りながら手作業の回帰テストも従来どおり続ける必要があり、その作成と運用の習得は、毎月の対応に手一杯の8名が行う。シラバスは機会コストを考慮しなければならないとし、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性があると述べている。要員を増やさないまま初年度から回収が始まるという形は、この与件とも原文とも合わない。","経営会議に金額で示したいという判断そのものは自然である。与件が述べているのは手作業の回帰テストの6割を自動化できるという割合であって、削減額がその割合になるとまで述べているわけではないが、自動化できる割合をそのまま削減額の割合に置いて年4,500万円の6割を計上する数え方には、見積りとしての筋がある。外れるのは便益の範囲と時期の両方である。シラバスはツールの利点として、ツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスを挙げており、この状況には、いま実施できていない性能テストを候補のツールが扱えること、本番障害5件のうち3件が手順の飛ばしによる確認漏れであったこと、実行の記録が担当者ごとに散っていて問い合わせのたびに集め直していることが、それぞれ置かれている。金額に直せないものを参考の付記に落とすと、この投資がどの範囲の品質リスクを引き受けるようになるのかが見立てから消える。さらに、最初の1年は手作業を従来どおり続ける必要があるのだから、初年度からの計上も与件と合わない。"],"flip":[null,null,null,null],"flipNote":{"1":"リリースの日が法令の施行日に縛られず、テストが早く終わった月から前倒しできるのであれば、テストサイクルのスピードアップはこの状況でも便益として立つ。それでもこの見立てが単独の正解になることはない。前倒しを便益の中心に置くこの案は、性能テストを扱えるようになる範囲も、確認漏れによる本番障害の減少も、記録が1か所に残ることも数えていないままであり、手作業を続けながら作る最初の1年の扱いにも触れていない。1つの条件では、立たない便益が1つ立つところまでしか動かない。","3":"最初の1年に手作業の回帰テストを続ける必要が無くなれば、削減の一部は初年度から現れる。それでもこの見立てのままでは正解にならない。自動化するテストの作成と運用の習得は、毎月の対応に手一杯の8名が行う。シラバスは、ツールの評価や管理やトレーニングや使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性があるとして、意図した活動に使用する前にはより多くのテストリソースが必要になる可能性があると述べている。要員を増やさないまま6割分の削減が初年度に出る形にするには、作成と習得を誰が担うかまで併せて動かす必要があり、条件が2つ以上になる。","4":"金額に直せない便益を参考の付記にとどめてよいのは、そこに置かれた事実がそもそも無い場合である。しかし、候補のツールが性能テストを扱えること、本番障害5件のうち3件が手順の飛ばしによる確認漏れであったこと、実行の記録が散っていて問い合わせのたびに集め直していることは、いずれもこの状況に与えられた入力そのものであり、これらを取り去ると便益を見立てるという問いが立たなくなる。さらにこの案は初年度から計上する形も併せ持っているので、時期の扱いを直しても便益の範囲のほうが残る。"},"quote":"機会コストも考慮しなければならない。つまり、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性がある。したがって、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性がある。…テストツールには次のような利点がある：手作業による繰り返し作業の削減（リグレッションテストなど）・自動化によるテストサイクルのスピードアップ・手作業の減少によるテスト実行コストの削減・ツールがサポートする特定のテストタイプのカバレッジ向上・手作業の減少によるヒューマンエラーの削減・テストに関する情報への迅速なアクセス","ref":"1.6.3（テストツールの利点6項目／機会コスト／費用対効果分析は取得または構築の前に行う）","misconception":"ツール導入の便益を金額に直せる手作業の削減だけで数え、しかもその削減が導入の初年度からそのまま現れると見込む"},"meta":{"concept":"テストツールの選定とROI","distractorIntent":["原文の利点に並ぶテストサイクルの短縮を、状況がそれを便益にしないと述べているのに便益の中心に置く","便益の範囲は正しく取りながら、機会コストと初年度の並行運用を落として削減が初年度から出ると見込む（惜しい誤り）","便益を金額に直せる手作業の削減だけに絞り、あわせて初年度から計上する（範囲と時期の両方を誤る）"],"distractorTypes":["D2a","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-43","MP-41"]}},{"id":"q-1.6.3-D-2","lo":"TM-1.6.3","cluster":"1.6.3-D","variant":2,"chapter":1,"section":"1.6","k":4,"points":3,"type":"single","minutes":4,"scenario":"あなたは通信事業者の料金計算システムのテストマネージャーである。毎月の料金改定のたびに回帰テストを人手で行っている。この人手の作業は年間2,800万円にあたり、導入後はその5割を自動化できる見込みである。テスト実行を自動化する製品の導入を経営会議に諮ることになった。\n\n現場からの申し送りは次の4点である。\n\n・候補の製品は、いまは道具がなくて行えていない機種をまたぐ互換性の確認も扱え、実行と判定の記録が製品の中に一続きで残る\n・直近1年の本番の不具合7件のうち4件は、確認の手順を飛ばしたことによる見落としだった\n・いまの記録は担当者ごとの文書に分かれており、問い合わせのたびに集め直している\n・テスト担当者は6名で毎月の締めの確認に追われており、自動化するテストの作成と運用の習得もこの6名が行う\n\n最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要がある。切替は他社との相互接続の作業に合わせて年4回の決まった日にしか行えず、テストが早く終わってもその日は動かせない。経理部門は来期から経費の精算をオンラインに切り替える。","question":"導入で得られる便益をどう見積もるかの判断として、最も適切なものはどれか。1つ選べ。","choices":["テストに要する期間が短くなる分だけ提供の開始を早められることを便益の中心に置き、料金改定に前もって備えられる回数の増加として示す。人手の回帰テストの削減額は、自動化が軌道に乗ってから改めて見積もる。","人手の回帰テストの削減、機種をまたぐ互換性の確認、手順の飛ばしによる見落としの減少、記録が一続きで残ることを便益に数える。6名の時間が作成と習得に取られる分は毎月の締めの合間に収まるものとして、要員を増やさずに初年度から回収が始まり、翌年以降も同じ水準で続く形で示す。","経営会議には金額で示す必要があるため、便益は手作業の削減額だけで数え、年2,800万円の5割にあたる1,400万円を初年度から計上する。互換性の確認や見落とし、記録の散らばりは参考として付記するにとどめる。","人手の作業が減ることに加えて、いま行えていない機種をまたぐ互換性の確認まで扱えるようになること、手順の飛ばしによる見落としが減ること、記録が一続きで残るので問い合わせにその場で答えられることも便益に数える。最初の1年は6名の時間が作成と習得に取られ人手の回帰テストも続くため、初年度は削減が表に出ないものとして示す。"],"answer":[3],"explanation":{"signals":"効くのは便益の側の事実と、時期の側の事実である。便益の側では、候補の製品が、いまは道具がなくて行えていない機種をまたぐ互換性の確認も扱え、実行と判定の記録が製品の中に一続きで残ること、直近1年の本番の不具合7件のうち4件は、確認の手順を飛ばしたことによる見落としだったこと、いまの記録は担当者ごとの文書に分かれており、問い合わせのたびに集め直していることが効く。時期の側では、テスト担当者が6名で毎月の締めの確認に追われていること、作成と運用の習得もこの6名が行うこと、最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要があることが効く。切替は他社との相互接続の作業に合わせて年4回の決まった日にしか行えず、テストが早く終わってもその日は動かせないという一文は、一般にはツールの利点に数えられるテストサイクルのスピードアップを、この状況では便益として数えられなくしている。経理部門が来期から経費の精算をオンラインに切り替えることは、便益の見立てに関与しない。","why":"示すべきなのは、手作業の削減に加えて、機種をまたぐ互換性の確認まで扱えるようになること、手順の飛ばしによる見落としが減ること、記録が一続きで残って問い合わせにすぐ応じられることも便益に数え、そのうえで削減は初年度には現れないものとして置く見立てである。\nまず便益の広がりから見る。シラバスはテストツールの利点として、手作業による繰り返し作業の削減、自動化によるテストサイクルのスピードアップ、手作業の減少によるテスト実行コストの削減、ツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスを挙げている。この状況には、そのいくつかに当たる事実が置かれている。人手の作業は年間2,800万円にあたり、導入後はその5割を自動化できる見込みであること。候補の製品は、いまは道具がなくて行えていない機種をまたぐ互換性の確認も扱え、実行と判定の記録が製品の中に一続きで残ること。直近1年の本番の不具合7件のうち4件は、確認の手順を飛ばしたことによる見落としだったこと。いまの記録は担当者ごとの文書に分かれており、問い合わせのたびに集め直していること。金額に直せるのは手作業の削減だけだが、残りを落とすと、この投資がどの範囲を引き受けるようになるのかが見立てから消える。いっぽうテストサイクルのスピードアップは、原文の利点に並んでいてもこの状況では数えられない。切替は他社との相互接続の作業に合わせて年4回の決まった日にしか行えず、テストが早く終わってもその日は動かせないからである。\n時期のほうは機会コストの話である。シラバスは、機会コストも考慮しなければならないとしたうえで、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性があるとし、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性があると述べている。この状況では、テスト担当者は6名で毎月の締めの確認に追われており、自動化するテストの作成と運用の習得もこの6名が行う。しかも最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要がある。人手の作業がそのまま残る以上、その分の削減は初年度には現れず、作成と習得に取られる時間の分だけ、実際のテスト作業に充てられる時間はむしろ減る。初年度からの削減を経営会議に約束すれば、稼働までに工数が増える期間を持ちこたえられなくなる。","distractors":["自動化によるテストサイクルのスピードアップは、シラバスがテストツールの利点として実際に挙げているものである。だからこの見立ては、原文の一項目にまっすぐ対応しているように見える。効かなくしているのは状況のほうで、切替は他社との相互接続の作業に合わせて年4回の決まった日にしか行えず、テストが早く終わってもその日は動かせない。動かせない以上、料金改定に前もって備えられる回数は増えず、この便益はここでは立たない。さらに便益の中心をこれに置くと、機種をまたぐ互換性の確認も、見落としの減少も、記録が一続きで残ることも見立てに入らない。人手の回帰テストの削減額は、自動化が軌道に乗ってから改めて見積もるとして時期を後ろへ送っているが、初年度に何をどう見込むかはこの案からは分からないままである","便益の数え方そのものは広く取れており、機種をまたぐ互換性の確認、見落としの減少、記録が一続きで残ることを挙げている点は、シラバスが利点に挙げるツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスにそのまま対応する。欠けているのは時期のほうである。最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要があり、その作成と運用の習得は、毎月の締めの確認に追われている6名が行う。シラバスは機会コストを考慮しなければならないとし、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性があると述べている。要員を増やさないまま初年度から回収が始まるという形は、この与件とも原文とも合わない","経営会議に金額で示したいという構えそのものは自然であり、自動化できる割合をそのまま削減額の割合に置く数え方にも、見積りとしての筋はある。外れるのは便益の範囲と時期の両方である。シラバスはツールの利点として、ツールがサポートする特定のテストタイプのカバレッジ向上、手作業の減少によるヒューマンエラーの削減、テストに関する情報への迅速なアクセスを挙げており、この状況には、候補の製品が、いまは道具がなくて行えていない機種をまたぐ互換性の確認も扱え、実行と判定の記録が製品の中に一続きで残ることが置かれている。金額に直せないものを参考の付記に落とすと、この投資がどの範囲の品質リスクを引き受けるようになるのかが見立てから消える。そのうえ、最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要があるのだから、初年度からの計上も与件と合わない",null],"flip":[null,null,null,null],"flipNote":{"1":"切替の日が相互接続の作業に縛られず、テストが早く終わった月から前に動かせるのであれば、テストサイクルのスピードアップはこの状況でも便益として立つ。それでもこの見立てが単独の正解になることはない。提供の開始を早めることを中心に置くこの案は、機種をまたぐ互換性の確認も、見落としの減少も、記録が一続きで残ることも数えておらず、人手の回帰テストの削減額は自動化が軌道に乗ってから改めて見積もるとしか述べていないので、初年度に人手の回帰テストと作成・習得が二重に要ることを便益の見立てに織り込んでいない。1つの条件では、立たない便益が1つ立つところまでしか動かない。","2":"最初の1年に人手の回帰テストを同じ量だけ続ける必要が無くなれば、削減の一部は初年度から現れる。それでもこの見立てのままでは正解にならない。自動化するテストの作成と運用の習得は、毎月の締めの確認に追われている6名が行う。シラバスは、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性があるとし、意図した活動に使用する前には、より多くのテストリソースが必要になる可能性があると述べている。要員を増やさないまま5割分の削減が初年度に出る形にするには、作成と習得を誰が担うかまで併せて動かす必要があり、条件が2つ以上になる。","3":"金額に直せない便益を付記にとどめてよいのは、そこに置かれた事実がそもそも無い場合である。しかし、候補の製品が機種をまたぐ互換性の確認を扱えることも、不具合7件のうち4件が手順の飛ばしによる見落としだったことも、記録が担当者ごとの文書に分かれていることも、いずれもこの状況に与えられた入力そのもので、取り去ると便益を見立てるという問いが立たなくなる。さらに、最初の1年は、自動化を進めながら人手の回帰テストも同じ量だけ続ける必要があるのだから、時期の扱いを直しても便益の範囲のほうが残る。"},"quote":"機会コストも考慮しなければならない。つまり、ツールの評価、管理、トレーニング、使用に費やされた時間は、代わりに実際のテストタスクに費やすことができた可能性がある。したがって、ツールを意図した活動に使用する前に、より多くのテストリソースが必要になる可能性がある。…テストツールには次のような利点がある：手作業による繰り返し作業の削減（リグレッションテストなど）・自動化によるテストサイクルのスピードアップ・手作業の減少によるテスト実行コストの削減・ツールがサポートする特定のテストタイプのカバレッジ向上・手作業の減少によるヒューマンエラーの削減・テストに関する情報への迅速なアクセス","ref":"1.6.3（テストツールの利点6項目／機会コスト／費用対効果分析は取得または構築の前に行う）","misconception":"ツール導入の便益を金額に直せる手作業の削減だけで数え、しかもその削減が導入の初年度からそのまま現れると見込む"},"meta":{"concept":"テストツールの選定とROI","distractorIntent":["原文の利点に並ぶテストサイクルの短縮を、状況がそれを便益にしないと述べているのに便益の中心に置く","便益の範囲は正しく取りながら、機会コストと初年度の並行運用を落として削減が初年度から出ると見込む（惜しい誤り）","便益を金額に直せる手作業の削減だけに絞り、あわせて初年度から計上する（範囲と時期の両方を誤る）"],"distractorTypes":["D2a","D3","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-tool-selection-roi.md","mistakePatterns":["MP-43","MP-41"]}},{"id":"q-1.6.4-A-1","lo":"TM-1.6.4","cluster":"1.6.4-A","variant":1,"chapter":1,"section":"1.6","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたは製造装置向けソフトウェアを開発する部署のテストマネージャーで、部署で使っている欠陥管理ツールの扱いを決める立場にある。このツールは有効期間を過ぎたと判断され、新しいツールに移る利点と機会がコストとリスクを上回るという結論が出ている。","question":"いまこのツールに対して行うこととして、最も適切なものはどれか。1つ選べ。","choices":["やり取りする他のツールとのデータ交換の進め方を決め、成果物のバックアップと復元の方法を定める。","このツールの所有者を割り当て、作業成果物の命名規則と置き場所を先に決めておく。","このツールが担っていた機能の引き継ぎ先を決め、蓄えてきたデータを保存するか保管する。","環境やビジネスニーズの変化に合わせて設定を変え、運用環境の複雑さが利用を妨げないかを見極める。"],"answer":[2],"explanation":{"signals":"効くのは、このツールが有効期間を過ぎたと判断され、新しいツールに移る利点と機会がコストとリスクを上回るという結論が出ている、という一文だけである。製造装置向けという業種と欠陥管理ツールという種類は、どのステージの活動かを変えない。","why":"いま行うのは、このツールが担っていた機能の引き継ぎ先を決め、蓄えてきたデータを保存するか保管することである。シナリオの一文は、シラバスが廃棄のステージについて述べていることとそのまま重なる。原文は、ツールの有効期間が過ぎたら、そのツールは廃棄すべきであるとし、ほとんどの場合、ツールによって提供される機能は置換され、データは保存および/または保管されなければならないと述べている。そこへ入る時期についても、ベンダーの決定に基づくか、または新しいツールに移行する利点と機会がコストとリスクを上回る段階に達したときだとしており、シナリオが置いているのは後者である。残りは、ツールのライフサイクルの別のステージ ── 調達、サポートとメンテナンス、進化 ── に原文が置いている活動である。","distractors":["やり取りする他のツールとのデータ交換の進め方を決め、成果物のバックアップと復元の方法を定めることは、シラバスがサポートとメンテナンスのステージに置いている活動である。原文は、相互運用が行われる場合、データ交換、および連携とコミュニケーションのプロセスを考慮しなければならないとし、ツールに関連する成果物のバックアップと復元に関する決定も要件となるとしている。どちらも使い続ける前提の取り決めであり、置き換えが決まった段階の活動ではない。","所有者の割り当てと、作業成果物の命名規則や置き場所の決定は、シラバスが調達のステージに置いている活動である。原文は、最初にツールを選定する判定が下され、次の段階でツールの所有者を割り当てる必要があるとし、この人物が作業成果物の命名規則や、これらの作業成果物の保管場所などの決定を行うとしている。前もってこれらの決定を行うことがツールの最終的な ROI に大きな違いをもたらす可能性があるとも述べられているが、それは使い始める側の話であり、有効期間を過ぎたツールの扱いではない。",null,"環境やビジネスニーズの変化に合わせて設定を変え、運用環境の複雑さが利用を妨げないかを見極めることは、シラバスが進化のステージに置いている活動である。原文は、時間の経過とともに、環境、ビジネスニーズ、またはベンダーによる決定により、ツールの変更が必要となることがあるとし、ツールの運用環境が複雑化すればするほど、変更によってその利用が妨げられやすくなると述べている。変更して使い続けるための活動であり、移行の利点と機会がコストとリスクを上回ると結論が出た段階には合わない。"],"flip":["有効期間を過ぎたと述べるシナリオの一文が、「このツールは導入から2年がたち、所有者も決まって日々の運用に定着している」に置き換われば、データ交換の取り決めとバックアップや復元の方法を定めることが、いま行う活動になる。","有効期間を過ぎたと述べるシナリオの一文が、「このツールを使うことが決まり、これから使い始めるところである」に置き換われば、所有者の割り当てと命名規則や置き場所の決定が、いま行う活動になる。",null,"有効期間を過ぎたと述べるシナリオの一文が、「このツールは運用に定着しているが、ベンダーが来年から提供基盤を切り替えると通知してきた」に置き換われば、変化に合わせて設定を変え、運用環境の複雑さを見極めることが、いま行う活動になる。"],"quote":"ツールのライフサイクルには4 つの異なるステージがある。…調達：最初に、ツールを選定する判定が下される。次の段階では、ツールの所有者を割り当てる必要がある。…廃棄：ツールの有効期間が過ぎたら、そのツールは廃棄すべきである。ほとんどの場合、ツールによって提供される機能は置換され、データは保存および/または保管されなければならない。","ref":"1.6.4","misconception":"ツールのライフサイクルの4つのステージを名前としては覚えていても、所有者の割り当て・バックアップの取り決め・変化への追随・機能の引き継ぎとデータの保存が、それぞれどのステージの活動かを結び付けられていない"},"meta":{"concept":"ツールのライフサイクル","distractorIntent":["調達のステージの活動を、廃棄の段階の活動として選ぶ","サポートとメンテナンスのステージの活動を、廃棄の段階の活動として選ぶ","進化のステージの活動を、廃棄の段階の活動として選ぶ"],"distractorTypes":["D1","D1","D1"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-98"]}},{"id":"q-1.6.5-A-1","lo":"TM-1.6.5","cluster":"1.6.5-A","variant":1,"chapter":1,"section":"1.6","k":2,"points":1,"type":"single","minutes":1,"scenario":"あなたはテストマネージャーとして、いま使っているツールから取れるデータを整理し、どのツールに何を求めるかを一覧にまとめている。","question":"ツールとそこから得られるメトリクスの組み合わせとして、最も適切なものはどれか。1つ選べ。","choices":["欠陥マネジメントツールから、テストアイテムのステータス、重要度、優先度、欠陥密度を得る。","静的解析ツールから、テストアイテムの欠陥密度と重要度の分布を得る。","コードカバレッジツールから、合格および不合格のテストケースによる要件カバレッジのトレーサビリティを得る。","テストマネジメントツールから、テスト対象のどの部分がテストによって実行されたかを得る。"],"answer":[0],"explanation":{"signals":"効くのは、どの種類のツールがどのタイプのデータを収集することに重点を置いているかという対応だけである。一覧にまとめているという場面は、どの組み合わせが原文どおりかを変えない。","why":"欠陥マネジメントツールから、テストアイテムのステータス、重要度、優先度、欠陥密度を得る ── この組み合わせがシラバスの列挙にそのまま載っている。原文は、異なるツールは異なるタイプのデータを収集することに重点を置いているとしたうえで、欠陥マネジメントツールは、テストアイテムのステータス、重要度、優先度、欠陥密度などの欠陥情報を提供することができると述べている。同じ箇所で、欠陥検出率や、テストレベルで検出された欠陥の混入から検出までのリードタイムなどはプロセス改善の推進に役立つが、欠陥マネジメントツールだけで提供できるとは限らないと断ってもおり、この組み合わせはその断りに触れない範囲に収まっている。","distractors":[null,"テストアイテムの欠陥密度や重要度は、シラバスが欠陥マネジメントツールの提供する欠陥情報として挙げているものである。静的解析ツールについて原文が挙げているのは、コードの複雑度に関連するメトリクスである。静的解析ツールは指摘を重要度付きで大量に出すので、その件数をコード量で割った値を欠陥密度と呼び、重要度ごとの内訳をそのまま品質の指標として使っている現場は珍しくない。そこから、欠陥密度と重要度の分布はこのツールから取れるものだと考えた人が選ぶ。","合格および不合格のテストケースによる要件カバレッジに関するトレーサビリティは、シラバスが要件マネジメントツールの提供するものとして挙げている。コードカバレッジツールについて原文が挙げているのは、テスト対象のどの部分がテストによって実行されたかを理解するのに役立つことである。どちらもカバレッジという語を使うため入れ替わりやすいが、一方が数えるのは要件、もう一方はコードである。","テスト対象のどの部分がテストによって実行されたかは、シラバスがコードカバレッジツールについて述べているものである。テストマネジメントツールについて原文が挙げているのは、利用できるテストアイテム、テストケース、実行を計画したテストケース、および現在と過去のテスト実行状況に関連するメトリクスである。実行という語が両方に現れるが、テストマネジメントツールが数えるのはテストケースの実行状況であって、テスト対象の中で通った部分ではない。"],"flip":[null,null,null,null],"flipNote":{"2":"テストアイテムの欠陥密度と重要度を、シラバスが欠陥情報として結び付けている相手は欠陥マネジメントツールである。この組み合わせで動かせる要素はツールの名前と得られるデータの2つだが、どちらを直しても答えは1つに定まらない。名前を欠陥マネジメントツールに直せば、欠陥情報を挙げている組み合わせと同じことを述べることになり、正しい組み合わせが2つ並ぶ。データの側をコードの複雑度に関連するメトリクスに替えれば静的解析ツールについて原文どおりになるが、そのときも欠陥情報の組み合わせは正しいままで、やはり2つになる。","3":"合格および不合格のテストケースによる要件カバレッジに関するトレーサビリティを、シラバスが結び付けている相手は要件マネジメントツールである。ここでツールの名前を要件マネジメントツールに直せば原文どおりの組み合わせになるが、そのとき欠陥マネジメントツールと欠陥情報の組み合わせも正しいままなので、正しい組み合わせが2つになり、答えが1つに定まらない。","4":"テスト対象のどの部分がテストによって実行されたかを、シラバスが結び付けている相手はコードカバレッジツールである。ここでツールの名前をコードカバレッジツールに直せば原文どおりの組み合わせになるが、そのときも欠陥マネジメントツールと欠陥情報の組み合わせは正しいままで、正しい組み合わせが2つ立つ。ツールの名前はこの組み合わせの中の1要素ではあっても、他の組み合わせの当否を同時に切り替える条件ではない。"},"quote":"テストマネジメントツールは、利用できるテストアイテム、テストケース、実行を計画したテストケース、および現在と過去のテスト実行状況（合格、不合格、スキップ、ブロック、実行予定など）に関連するさまざまなメトリクスを提供する。…要件マネジメントツールは、合格および不合格のテストケースによる要件カバレッジに関するトレーサビリティを提供する。…欠陥マネジメントツールは、テストアイテムのステータス、重要度、優先度、欠陥密度などの欠陥情報を提供することができる。…静的解析ツールは、コードの複雑度に関連するメトリクスを提供する。…性能テストツールは、負荷がピークの際の応答時間や故障率などの貴重な情報を提供する。…コードカバレッジツールは、テスト対象のどの部分がテストによって実行されたかを理解するのに役立つ。","ref":"1.6.5","misconception":"ツールがメトリクスを出してくれることは知っていても、どの種類のツールがどのデータを重点的に集めるかの対応を覚えておらず、語感の近さで組み合わせを決めてしまう"},"meta":{"concept":"ツールメトリクス","distractorIntent":["欠陥マネジメントツールが提供する欠陥情報を、静的解析ツールに帰属させる","要件マネジメントツールが提供するトレーサビリティを、コードカバレッジツールに帰属させる","コードカバレッジツールが提供する情報を、テストマネジメントツールに帰属させる"],"distractorTypes":["D14","D14","D14"],"conceptNote":"未作成（policy.json conceptGate.K2=false のため K2 は概念ノートを門にしない）","mistakePatterns":["MP-99"]}},{"id":"q-2.1.1-A-1","lo":"TM-2.1.1","cluster":"2.1.1-A","variant":1,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"保険の契約管理システムの開発で、テスト計画にメトリクスの一覧を載せようとしている。","question":"シラバスが示すメトリクスと、それを使うテストマネジメント活動の対応として正しいものはどれか。1つ選べ。","choices":["実際のテストコスト 対 計画したテストコストは完了でのみ使い、プロダクトリスクカバレッジはモニタリングとコントロールでのみ使う","実際の自動化テストケース 対 計画した自動化テストケースはモニタリングとコントロールでのみ使い、テストケースのステータスごとの実行割合 対 計画したテストケースは完了でのみ使う","実際のテストコスト 対 計画したテストコストはモニタリングとコントロールでのみ使い、実際の自動化テストケース 対 計画した自動化テストケースは完了でのみ使う","コードカバレッジは完了でのみ使い、要件カバレッジはモニタリングとコントロールでのみ使う"],"answer":[2],"explanation":{"signals":"効くのは、それぞれのメトリクスがどちらのテストマネジメント活動で使うものとして表2 に載っているか、その一点だけである。保険の契約管理システムという業種も、テスト計画に載せようとしている段階であることも、○ の位置を変えない。4つはどれも表2 に実在するメトリクスの組み合わせなので、聞き覚えがあるかどうかでは選り分けられない。","why":"実際のテストコスト 対 計画したテストコストをテストモニタリングとテストコントロールの側に置き、実際の自動化テストケース 対 計画した自動化テストケースをテスト完了の側に置いた組み合わせが、表2 の ○ の位置とそのまま一致する。表2 はテストコストの行にテストモニタリングとテストコントロールの欄だけ ○ を付け、自動化テストケースの行にはテスト完了の欄だけ ○ を付けている。「どちらでのみ使うか」という言い方が成り立つのは、この2行のように ○ が片側にしかない行だけである ── シラバスは、テストモニタリングとテストコントロールに ○ が付くメトリクスは主に進捗を測るために使ってテスト進捗レポートで報告し、テスト完了に ○ が付くものは主にテスト目的の達成度を測るために使ってテスト完了レポートで報告し、両方の欄に ○ が付くものはどちらにも使えると述べているからである。費用は締めてから確定するもの、自動化の消化は日々積み上がるもの、という直感はこの2行では表と逆を向いており、意味から推測すると外す。","distractors":["費用は締めてから確定し、リスクの消化は日々の進み具合、という感覚にはよく合う。だが表2 は実際のテストコスト 対 計画したテストコストにテストモニタリングとテストコントロールの欄だけ ○ を付けており、プロダクトリスクカバレッジには両方の欄に ○ を付けている。金額だから完了側という当てはめも、リスクだからモニタリングとコントロールでのみ使うという限定も、表と合っていない","自動化した件数は日々積み上がるので進捗の数字に見え、テストケースの消化状況は最後に締める達成度に見える。しかし表2 で実際の自動化テストケース 対 計画した自動化テストケースに ○ が付いているのはテスト完了の欄だけで、テストケースのステータスごとの実行割合 対 計画したテストケースには両方の欄に ○ が付いている。直感の向きが、表の配置とちょうど入れ替わっている",null,"カバレッジという同じ語でくくると、片方を達成度、もう片方を進捗へ振り分けたくなる。しかし表2 はコードカバレッジにテストモニタリングとテストコントロールの欄だけ ○ を付け、要件カバレッジには両方の欄に ○ を付けている。カバレッジという語は、どちらの欄に載るかを決めていない"],"flip":[null,null,null,null],"flipNote":{"1":"実際のテストコスト 対 計画したテストコストをテスト完了専用と読む点と、プロダクトリスクカバレッジをテストモニタリングとテストコントロール専用と読む点の、2か所で表2 と食い違っている。片方の読みを直しても、もう片方が同じ理由で退けられる。2か所を同時に成り立たせるには表2 の ○ の配置そのものを書き替えることになり、それは条件を変えたのではなくシラバスを変えたことになる。","2":"自動化テストケースの実績をテストモニタリングとテストコントロール専用、テストケースのステータスごとの実行割合を完了専用と読む向きは、表2 の2行と同時に食い違っている。しかも実行割合の行は両方の欄に ○ が付いているので、「完了でのみ使う」という限定が成り立つ余地がそもそも無い。自動化の側だけを直しても、実行割合の側の限定が誤りのまま残る。","4":"コードカバレッジを完了専用、要件カバレッジをテストモニタリングとテストコントロール専用と読む向きも、表2 の2行と同時に食い違っている。要件カバレッジは両方の欄に ○ が付いているため、どちらか一方に限定する言い方そのものが表と合わない。コードカバレッジの側だけを直しても、この組み合わせは答えにならない。"},"quote":"テストモニタリングとテストコントロールで ○ が付いているメトリクスは、主に進捗を測定するために使い、テスト進捗レポート(CTFL)で報告する。テスト完了に ○ が付いているメトリクスは、主にテスト目的の達成度を測定するために使い、テスト完了レポート(CTFL)で報告する。両方の欄に ○ が付いているメトリクスは、どちらにも使用できる。","ref":"2.1.1","misconception":"表2 の ○ の位置を、メトリクスの意味からの推測で決めている。金額は締めてからの総括、自動化の消化は日々の進捗、という直感が、この2行では表の配置と逆であることを知らない"},"meta":{"concept":"テストマネジメント活動のためのメトリクス","distractorIntent":["金額は完了時の総括、リスクの消化は進捗と推測する","自動化の実績を進捗、テストケースの消化を達成度と推測する","カバレッジという語で、2つの指標の帰属を振り分ける"],"distractorTypes":["D14","D14","D14"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-29"]}},{"id":"q-2.1.1-A-2","lo":"TM-2.1.1","cluster":"2.1.1-B","variant":1,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"自治体向けの窓口システムのテストが終わり、報告する数値をカテゴリーごとに仕分けている。","question":"シラバスがコストとテスト労力のカテゴリーに挙げているものはどれか。1つ選べ。","choices":["テストに費やしたリソース時間についての、計画に対する実績","識別したプロダクトリスクのうち、テストケースによって軽減した割合","テストレベルやイテレーションごとの、欠陥の混入件数・検出件数・修正件数","テストしていないコンポーネントに欠陥がある場合の、潜在的な影響と可能性"],"answer":[3],"explanation":{"signals":"効くのは、それぞれの指標がシラバスのどの目的の列挙に載っているか、それだけである。自治体の窓口システムという領域も、テストが終わった段階であることも、載っている場所を変えない。4つはいずれも 2.1.3 に実在するメトリクスなので、指標として妥当かどうかでは選り分けられない。","why":"答えは、テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性である。シラバスがコストとテスト労力に関するメトリクスとして並べているのは、この「テストしていないコンポーネントの残存リスク」と、「テストコスト：テストコストの計画に対する実績」である。シラバスは、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力をプロジェクト終了時に測定し報告するものとして挙げ、そのあと目的別にメトリクスを列挙しており、残存リスクはその列挙の中でコストとテスト労力の側に置かれている。リスクという語が付くためプロダクトリスクの列挙を連想しやすいが、そちらに並んでいるのはすべてのテストが合格したリスクの割合、一部またはすべてのテストが不合格になったリスクの割合、まだ全部がテストできていないリスクの割合であり、テストしていないコンポーネントの残存リスクはそこには入っていない。","distractors":["計画に対する実績という形はテストコストとそろっており、カテゴリー名にも労力の語があるため、いちばん紛れやすい。しかしシラバスはこれをテスト進捗に関するメトリクスに「テスト工数：テストに費やしたリソース時間の計画に対する実績」として置いている。コストとテスト労力に並ぶのはテストしていないコンポーネントの残存リスクとテストコストであり、テストに費やした時間はそこには挙がっていない","テストしていない部分の残存リスクと対になる情報に見える。だがシラバスはこれをカバレッジに関するメトリクスに「プロダクトリスクのカバレッジ：識別したプロダクトリスクのうち、テストケースによって軽減した割合」として置いている。同じリスクという語を使っていても、列挙されている場所が違う","シラバスはこれを欠陥に関するメトリクスに、「欠陥の数または割合の内訳」の一項目（テストレベルまたはイテレーションでの混入件数、検出件数、修正件数）として置いている。シラバスは欠陥に関するメトリクスについて、欠陥の検出と解決のプロセスをモニタリングし、欠陥密度や欠陥の重要度が高い領域を特定し、テストの効率性と有効性を評価するために使えると述べており、効率という語が出てくるぶん、かけた労力の話に引き寄せられやすい。それでも列挙されている場所は欠陥の側である",null],"flip":[null,null,null,null],"flipNote":{"1":"テストに費やしたリソース時間の計画に対する実績は、シラバスがテスト進捗に関するメトリクスにテスト工数として挙げているものである。これが答えになるのは設問がテスト進捗のカテゴリーを問うたときで、それは条件を変えたのではなく設問を変えたことになる。選択肢の側で「リソース時間」を「テストコスト」に替えればコストとテスト労力の側へ移るが、そのときテストしていないコンポーネントの残存リスクを述べた選択肢も同じ側に残るので、正解が2つになって1つ選べが成り立たない。","2":"識別したプロダクトリスクのうちテストケースによって軽減した割合は、シラバスがカバレッジに関するメトリクスにプロダクトリスクのカバレッジとして挙げている。コストとテスト労力へ移すには、この指標の定義そのものを書き替えるか、シラバスの列挙のほうを動かすことになる。仮に移したとしても、テストしていないコンポーネントの残存リスクを述べた選択肢はコストとテスト労力に残ったままなので、正解が2つ立って1つ選べが成り立たない。","3":"テストレベルまたはイテレーションでの混入件数・検出件数・修正件数は、シラバスが欠陥に関するメトリクスの内訳として挙げている。設問を欠陥のカテゴリーを問う形に替えれば当てはまるが、それは条件ではなく設問の変更である。選択肢の側を書き替えてコストとテスト労力に寄せても、テストしていないコンポーネントの残存リスクを述べた選択肢が同じ側に残るため、正解が2つになる。"},"quote":"コストとテスト労力に関するメトリクスは以下の通り：テストしていないコンポーネントの残存リスク：テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性。テストコスト：テストコストの計画に対する実績。","ref":"2.1.3","misconception":"指標がどのカテゴリーに挙げられているかを語の印象で決めている。リスクという語があればプロダクトリスク、計画に対する実績の時間があればコストと労力、という当てはめは、シラバスの列挙とは合わない","note":"4つの選択肢はいずれもシラバス 2.1.3 に実在するメトリクスであり、記述として誤っているものはない。問われているのは所属するカテゴリーである。"},"meta":{"concept":"テスト報告の5カテゴリー","distractorIntent":["計画対比の時間をコストと労力の項だと思う","リスクの軽減割合をコストと労力の対と思う","欠陥の混入・検出件数を労力の指標だと思う"],"distractorTypes":["D1","D1","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-29","MP-28"]}},{"id":"q-2.1.2-A-1","lo":"TM-2.1.2","cluster":"2.1.2-A","variant":1,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"物流会社の配車システムのテストが始まり、週ごとにメトリクスを集めて状況を見ている。","question":"シラバスが挙げるテストコントロールの例として**適切でないもの**はどれか。1つ選べ。","choices":["手戻りが生じた対象について、開始基準や終了基準を満たすかどうかを評価し直す","イテレーションの区切りで、学んだ教訓やテストウェアを集めて統合する","課題事項になったリスクが出てきたため、テストの優先順位を付け直す","提供が遅れているテスト環境に合わせて、テストの日程を後ろにずらす"],"answer":[1],"explanation":{"signals":"効くのは、週ごとに集めた数値を受けて何をするか、という場面である。4つはどれもテストマネジメントが実際に行う活動で、良し悪しでは分かれない。分かれるのは、モニタリングで得た情報を使って進め方を変える活動か、テストレベルやイテレーションの完了で情報をまとめる活動か、という点である。","why":"外れるのは、イテレーションの区切りで学んだ教訓やテストウェアを集めて統合する活動である。シラバスはこれをテストコントロールではなくテスト完了の説明として述べており、テスト完了はテストレベルの完了、イテレーションの完了、テストプロジェクトの完了（または中止）、メンテナンスリリースの完了などのプロジェクトのマイルストーンで発生するとしている。残る3つは、シラバスがテストコントロールに関する例として名指しで挙げているものである ── 識別したリスクが課題事項となった場合のテストの再優先順位付け、手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価、テスト環境の提供の遅れを考慮したテストスケジュールの調整（シラバスはこのほかに、必要なとき必要な場所での新しいリソースの追加も例に挙げている）。シラバスはテストコントロールを、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するために、テストモニタリングからの情報を利用する活動としている。集めた数値を受けて進め方を変えるのがテストコントロールで、区切りで情報を集めて統合するのはテスト完了の側である。","distractors":["手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価は、シラバスがテストコントロールに関する例として明記している。基準を確かめるという言い方から、データを収集するテストモニタリングの側に見えることがあるが、手戻りを受けて判断をやり直し、進め方を決め直す行為であり、是正措置の側に挙げられている",null,"識別したリスクが課題事項となった場合のテストの再優先順位付けは、シラバスがテストコントロールに関する例の先頭に挙げているものである。リスクの話であるためリスクマネジメントの活動に見えることがあるが、モニタリングで得た情報を受けて進め方を変えている点でテストコントロールにあたる","テスト環境の提供の遅れを考慮したテストスケジュールの調整も、シラバスがテストコントロールに関する例に挙げている。日程の調整はプロジェクトマネジメントの仕事に見えるため、テストの活動ではないとして外しやすい"],"flip":[null,null,null,null],"flipNote":{"1":"開始基準または終了基準を満たすかどうかの再評価は、原文がテストコントロールに関する例として名指しで挙げている。原文が変わらない限り、この活動が「テストコントロールの例として適切でないもの」になることはない。設問をテスト完了にあたらない活動を選ぶ形に替えれば当てはまるが、そのときは再優先順位付けもスケジュールの調整も同じく当てはまり、答えが3つ立って1つ選べが成り立たない。","3":"テストの再優先順位付けは、原文がテストコントロールに関する例の先頭に置いている。これが適切でないものになるには、原文の例の並びからこの行が消える必要があり、受験者が動かせる条件ではない。設問をテスト完了にあたらない活動を選ぶ形に替えると、基準の再評価とテスト環境の遅れに合わせた日程の調整も同時に当てはまってしまう。","4":"テスト環境の提供の遅れを考慮したテストスケジュールの調整も、原文がテストコントロールに関する例に挙げている。設問をテストモニタリングにあたる活動を選ばせる形に替えても、この活動はデータを収集する活動ではないので答えの側には回らない。答えになるのは、テストコントロールに関する例の並びそのものが変わったときだけである。"},"quote":"テストコントロールに関する例には、識別したリスクが課題事項となった場合のテストの再優先順位付け、手戻りによりテストアイテムが開始基準または終了基準を満たすかどうかの再評価、テスト環境の提供の遅れを考慮したテストスケジュールの調整、必要なとき必要な場所での新しいリソースの追加などが含まれる。","ref":"2.1.2","misconception":"テストコントロールを、テスト中に行うマネジメント活動の総称として広く取っている。集めた情報を受けて進め方を変えるのがテストコントロールで、マイルストーンで教訓やテストウェアを統合するのはテスト完了だ、という境界を持っていない"},"meta":{"concept":"モニタリング、コントロール、完了","distractorIntent":["基準の再評価をモニタリングの側と思う","日程の調整をプロジェクトマネジメントの側と思う","再優先順位付けをリスクマネジメント側の活動と思う"],"distractorTypes":["D12","D12","D12"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-21"]}},{"id":"q-2.1.2-A-2","lo":"TM-2.1.2","cluster":"2.1.2-B","variant":1,"chapter":2,"section":"2.1","k":2,"points":1,"type":"single","minutes":1,"scenario":"医療機器の付属アプリのテストが後半に入り、期日までに終えられるかを早めに見極めたい。","question":"テストの進み具合をコントロールするためのメトリクスの使い方として最も適切なものはどれか。1つ選べ。","choices":["テストに充てた時間を計画と並べ、週ごとの推移から期日までの見通しを立てる","テストへ充てた時間の累計を集計し、その総量を週次の報告に載せる","しきい値を下回った指標が、テストの優先順位を自動で組み替えるようにしておく","自動化したテストケースの数を計画した数と毎週対比し、その達成割合で進み具合を評価する"],"answer":[0],"explanation":{"signals":"効くのは、期日までに終えられるかを早めに見極めたい、という目的である。この一文があるため、測っていること自体ではなく、測った値から進め方の変更が導けるかどうかが判定の軸になる。医療機器の付属アプリという領域は場面を与えるだけで、答えは変えない。","why":"採るべきは、テストに充てた時間を計画と並べ、週ごとの推移から期日までの見通しを立てる使い方である。早めに見極めて手を打ちたいのだから、必要なのは、値を見て進め方を変えられることである。シラバスはテストメトリクスを、テストがどこまで進んだか、終了基準または関連するテストタスクが達成されたかどうかを示す指標と定義し、テストコントロールはそのテストモニタリングからの情報を利用して、効果的かつ効率的なテストを達成するためのガイダンスと是正措置を提供するとしている。そこから逆算すると、使い方の良否を決めるのは、比べる相手があるかと、変化が見えるかである。シラバスはテスト工数を「テストに費やしたリソース時間の計画に対する実績」と定義しており、表2 も時間単位の実績を計画時の見積りと対比する形で挙げている。さらにシラバスは、メトリクスはある時点のスナップショットとして報告することも、傾向を評価するために時系列的な変遷として報告することもできると述べている。計画との対比を週ごとに追う形は、この2つをそのまま満たしている。","distractors":[null,"テストに充てた時間そのものは、シラバスがテスト工数として挙げているメトリクスなので、測る対象は外していない。欠けているのは比べる相手である。シラバスの定義は計画に対する実績、表2 が挙げるのは実績 対 見積りであり、総量だけでは多いのか少ないのか、期日に対して遅れているのかが読み取れず、何を是正すべきかも出てこない","しきい値を割ったら手を打つという流れは、コントロールの狙いに沿って見える。しかしシラバスはメトリクスを、進捗や達成を示す指標と定義しており、ガイダンスと是正措置を提供するのはテストコントロールの側である。指標そのものが優先順位を決める形は、この役割の分かれ方を飛び越えている","計画した数との対比があり、毎週見るという点でも進捗の管理らしく見える。しかし表2 で「実際の自動化テストケース 対 計画した自動化テストケース」に ○ が付いているのはテスト完了の欄だけで、テストモニタリングとテストコントロールの欄には付いていない。テスト完了に ○ が付くメトリクスは主にテスト目的の達成度を測るために使うものだとシラバスは述べており、期日に間に合うかを見て是正を導く用途には置かれていない。自動化の実績は進捗だという直感で帰属を決めると、この違いを見落とす"],"flip":[null,null,null,null],"flipNote":{"2":"テストに充てた時間は、シラバスがテスト進捗に関するメトリクスにテスト工数として挙げているもので、この使い方に欠けているのは比べる相手だけである。ただし比べる相手を足すと、計画と実績を週ごとに並べる使い方になり、正解とほぼ同じものになる。正解の側には手が加わらず正しいまま残るため、答えが2つ立って1つ選べが成り立たない。1つの条件でこの使い方だけを答えにすることはできない。","3":"是正を決めるのをメトリクスから人に戻せば、この使い方そのものは原文の役割の分かれ方に沿ったものになる。ただし正解の側には手が加わらないため、しきい値を合図に人が優先順位を見直す運びと、計画との対比を時系列で追って見通しを立てる使い方が同時に成り立ち、1つ選べが成り立たない。","4":"表2 は「実際の自動化テストケース 対 計画した自動化テストケース」にテスト完了の欄だけ ○ を付けている。シナリオの目的をテストレベルやイテレーションの完了時点での到達度の評価に置き替えても、設問が問うているのは進み具合をコントロールするためのメトリクスの使い方なので、この使い方は答えにならない。この指標がテストモニタリングとテストコントロールの側に回るのは、表2 の ○ の配置そのものが変わったときだけである。"},"quote":"メトリクスは、ある時点におけるメトリクスのスナップショットとして報告することも、傾向を評価するために時系列的なメトリクスの変遷として報告することもできる。","ref":"2.1.2 / 2.1.3","misconception":"数値を集めて報告していれば進み具合をコントロールできると考えている。計画という比べる相手と時系列の変化がなければ是正の判断につながらないこと、是正を決めるのはメトリクスではなくテストコントロールであること、その指標がどの活動で使うものとして挙げられているかを捉えていない"},"meta":{"concept":"モニタリング、コントロール、完了","distractorIntent":["工数を計画対比ではなく総量で報告する","メトリクスが是正措置の主体だと考える","テスト完了の欄にだけ ○ が付く指標を、進捗のコントロールにも使えると考える"],"distractorTypes":["D3","D10","D1"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-21","MP-23","MP-29"]}},{"id":"q-2.1.3-A-1","lo":"TM-2.1.3","cluster":"2.1.3-A","variant":1,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"食品メーカーの受発注システムを刷新中で、2日後にリリース判定の会議がある。リリースの可否を決めるのは、会議に出る事業部長である。終了基準は着手前に関係者で合意し、以後見直していない。\n\nまだテストが済んでいないのは、取引先ごとの単価の適用と、締め日をまたぐ受注の扱いの2つで、誤れば請求金額や売上の計上先がずれる。どちらも連携先の基幹システムの改修待ちで、連携先はこの改修でインターフェースの仕様自体を見直している。仕様が固まるのは改修の完了と同時であるため、模擬データで先に流すこともできない。\n\n日次バッチの結果はそのまま会計に渡り、請求書を出す前に人が確かめる工程はない。旧システムはリリース当日に停止する。\n\n改修完了は6週間後との回答で、そこから2週間でこの2つは流せる。リリース予定日は取引先に通知済みで、延期には再調整が要る。新規の欠陥は直近2週間で週14件から3件に減った。","table":{"caption":"合意済みの終了基準と、会議2日前の現状","headers":["合意した終了基準","会議2日前の現状"],"rows":[["重い品質リスク12件すべてのテストを終えていること","10件が完了。2件は未着手"],["未解決の重大な欠陥がないこと","0件"],["テストケースの実行率が90%以上であること","94%"]]},"question":"テスト結果を分析し、リリース判定の会議に向けた報告として最も妥当なものはどれか。1つ選べ。","choices":["連携先の改修完了を待たず、インターフェースの仕様に沿った模擬データで単価の適用と締め日をまたぐ受注を先に流し、残るのは本番接続での疎通確認だけになるという見通しを添えて、予定どおりのリリースを提案する。","済んでいない2つが何であり、残したまま出せば業務のどこがどこまで狂い、それがどの程度起こりうるのかを示したうえで、8週間延ばして2つを流す案と、残したまま予定どおり出す案を、それぞれ何を引き受けるのかとともに並べて報告する。","済んでいない2つを流し終えるまではリリースできないと判断し、リリースを8週間延ばすことをテストマネージャーとして決めたうえで、再判定までの日程、追加で必要になるテストの工数、延期の間に旧システムを動かし続ける段取り、取引先への再調整の要否を整理して報告する。","合意した終了基準として決めた3項目はいずれも満たされており、済んでいない2つはその対象に入っていないものとして、各項目の達成状況の一覧に、2つが連携先の改修待ちであることを添えて報告する。"],"answer":[1],"explanation":{"signals":"判断を分けるのは次の点である。リリースの可否を決めるのは2日後の会議に出る事業部長であり、テストマネージャーはその場に材料を出す側である。表の1行目で合意した終了基準は「重い品質リスク12件すべてのテストを終えていること」で、現状は10件完了・2件未着手だから、済んでいない2つはこの12件の中にある。終了基準は着手前に関係者で合意したきりで見直していないので、対象の範囲を報告の側で狭めることはできない。済んでいない2つは取引先ごとの単価の適用と締め日をまたぐ受注の扱いで、誤れば請求金額や売上の計上先がずれる。連携先はこの改修でインターフェースの仕様自体を見直しており、仕様が固まるのは改修の完了と同時なので、模擬データで先に流して確かめる道は無い。請求書を出す前に人が確かめる工程も無く、旧システムはリリース当日に停止するので、出したあとに人手で食い止める工程も、戻す先も用意されていない。改修完了が6週間後で、そこから2週間でこの2つは流せるという回答が、延ばす場合の8週間の出どころである。延期には取引先への再調整が要るとも書かれている。\n判断を分けないもの: 表の残り2行（未解決の重大な欠陥は0件、実行率は94%で基準の90%以上を満たす）と、新規の欠陥が直近2週間で週14件から3件に減っていること。どれも良い方向の数値だが、請求金額と売上の計上先に関わる領域に手が付いていない以上、延ばす側にも出す側にも味方しない。食品メーカーの受発注システムという業種も、どの報告を選ぶかを変えない。","why":"済んでいない2つが何であり、残したまま出せば業務のどこがどこまで狂い、それがどの程度起こりうるのかを示し、8週間延ばして2つを流す案と、残したまま予定どおり出す案を、それぞれ何を引き受けるのかとともに並べる——これが2日後の会議に出すべき報告である。そう決まる理由は、可否を決めるのが会議に出る事業部長であること、そして済んでいない2つが合意した終了基準の中にあり、その中身が請求金額と売上の計上先に及ぶことにある。\n決めるのは受け手だという線は原文にある。シラバスは「リスクベースドテストは、この時点でテストを延長するか、残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にする。」と述べ、残存リスクレベルに関するテスト進捗の報告は、開発チームとステークホルダーが残存リスクレベルに基づいてリリースの判定を含むモニタリングとコントロールを行うことを支援するものだとしている。そのためには「ステークホルダーが理解できる方法で、テスト結果をリスクの観点から報告する」ことが必要だ、とも書いている。テストマネージャーが出すのは提案であり、比べられる形にして渡すことがその中身である。\n合意した基準の側も、達成の一覧では閉じない。表の1行目「重い品質リスク12件すべてのテストを終えていること」に対して現状は10件で、残る2件は連携先の改修待ちのまま未着手である。シラバスは「テスト実行を継続し、識別される欠陥が少なくなってきたら、テストを終了する判断を下すことができる。この判断は、メトリクスの報告と合意された終了基準に基づくべきである。」としており、新規の欠陥が週14件から3件に減ったことは前半に当たるものの、合意した基準が1項目未達である以上、それだけで終了を語ることはできない。\n残るのは、延ばすか、残ったリスクを引き受けて出すかである。どれだけ残っているかは数で言える——重い品質リスク12件のうち2件で、これはシラバスがプロダクトリスクのメトリクスに挙げる「まだ全部がテストできていないリスクの割合」にあたる。だが、その割合だけでは引き受けるかどうかは決められない。決める人が要るのはその2件の中身、すなわちシラバスがコストとテスト労力の側に「テストしていないコンポーネントの残存リスク：テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性。」として置いている、影響と可能性のほうである。この場面では影響を請求金額と売上の計上先として名指しでき、請求書を出す前に人が確かめる工程が無いことから、誤りが外へ出る度合いも書ける。延ばす案と出す案を、それぞれ何を引き受けるのかとともに並べるこの報告は、その影響と可能性を示したうえで両方の代償を同じ土俵に載せており、シラバスがメトリクスの報告の目的に置く「マネジメントの目的のために情報に対する素早い理解を提供すること」を、2日後に決める事業部長に対して果たす。どちらか一方に寄せて結論を出してもいないし、基準の達成状況だけを伝えてもいない。","distractors":["模擬データで先に流すという前提が、シナリオの明示文でそのまま否定されている。連携先はこの改修でインターフェースの仕様自体を見直しており、仕様が固まるのは改修の完了と同時である。突き合わせる相手が無いだけでなく、模擬データを組み立てる元になる仕様がまだ存在しない。だから「残るのは本番接続での疎通確認だけになる」という見通しにも根拠が無く、取れない道を判定の材料として事業部長に差し出すことになる。外部の完成を待たずに手元でできるところまで進めるのは、待ちが生じた場面で実際によく取られる手で、日程を動かさずに残りを疎通確認だけに縮められるなら判定会議に出す案としては強い。仕様の見直しに触れた1文を読み落とすと、この案がいちばん前向きに見える",null,"外しているのは、誰が決めるかである。会議に出るのはリリースの可否を決める事業部長であり、リリースを8週間延ばすことをテストマネージャーとして決めたうえで段取りを報告するこの形は、判定を先に済ませて事後の通知に変えている。シラバスは「リスクベースドテストは、この時点でテストを延長するか、残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にする。」とし、残存リスクレベルの報告は、開発チームとステークホルダーがリリースの判定を行うことを支援するものだとしている。提案する側と判定する側の境界を越えている。未検証のまま出さないという構えも、改修完了6週間とそこからの2週間から出した8週間という期間も、再判定までの日程・追加のテスト工数・延期の間に旧システムを動かし続ける段取り・取引先への再調整という整理の軸も、どれも妥当であるため、中身の正しさだけを追うと止まらない","表と合わない。1行目の合意は「重い品質リスク12件すべてのテストを終えていること」で、現状は10件、済んでいない2つはこの12件の中にある。3項目はいずれも満たされているという記述も、済んでいない2つはその対象に入っていないとする整理も、この1行で落ちる。終了基準は着手前に関係者で合意したきりで見直していないのだから、対象の範囲を報告の側で動かすこともできない。満たした基準を一覧にして示すこと自体は報告の形として正しく、済んでいない2つが連携先の改修待ちであるという理由も添えてあるので、自分たちの手の届かない遅れを抱えた場面では説得力がある。合意の文面は表にしか無いため、表の1行目を読み飛ばすとそのまま通してしまう"],"flip":[null,null,null,null],"flipNote":{"1":"連携先のインターフェースの仕様は既に固まっていて模擬データで先に流せる、とシナリオの1文を差し替えても、この案が一意の正答になることはない。表の1行目「重い品質リスク12件すべて」は2件が未着手のまま未達であり、改修完了は6週間後なので、本番接続での疎通確認はリリース後にしか行えない。請求金額と売上の計上先に関わる危険は残ったままで、可否を決めるのは会議に出る事業部長である。その影響と可能性を示し、延ばす案と残したまま出す案を、それぞれ何を引き受けるのかとともに並べる報告は依然として要る。つまり条件を当てた世界では判定の材料として筋の通る報告が2つ立ち、1つ選べという形が成り立たなくなる。","3":"この報告で足りるのは、2日後の会議が可否を決める場でなくなったときだけで、それは与件の変更ではなく、リリース判定の会議に向けた報告を問うている設問そのものの変更である。動かせるほうの与件、つまり可否を決めるのを事業部長からテストマネージャーに差し替える1文だけを当てても、済んでいない2つは請求金額と売上の計上先に関わり、請求書を出す前に人が確かめる工程も無いのだから、その影響と可能性を示して延ばす案と出す案を並べる報告は、会議に出す材料として依然として要る。延期という結論だけを先に置くこの案は、決定者が変わっても、引き受けるものを比べられる形にはならない。延長か受容かについて正当な提案を受け取って決めるのはマネジメントの側だという線も、この条件では動かない。","4":"表の1行目の合意が、連携先に依存する項目を除いた範囲で定められていた、と読み替えれば、この一覧は表と食い違わなくなる。ただしそれだけでは、この報告が判定の材料として選ばれることにはならない。済んでいない2つは請求金額と売上の計上先に関わり、請求書を出す前に人が確かめる工程も無いため、テストしていない部分の影響と可能性を示す報告のほうが、2日後に可否を決める立場には依然として必要である。この一覧が一意の正答になるには、終了基準の範囲と、残っている危険の大きさの両方が動かなければならず、条件は1つでは足りない。"},"quote":"1.3.4 適切なテストによる品質リスク軽減…テストモニタリングとテストコントロールにおいて、リスクベースドテストは任意の時点における残存リスクレベルに関するテスト進捗の報告を可能にする。これにより、開発チームとステークホルダーが、残存リスクレベルに基づいて、リリースの判定を含むソフトウェア開発のモニタリングとコントロールを行うことを支援する。そのためには、ステークホルダーが理解できる方法で、テスト結果をリスクの観点から報告することが必要である。…リスクベースドテストは、この時点でテストを延長するか、残ったリスクを受け入れるかについて、正当な提案をマネジメントに提供することを可能にする。…2.1.3 テスト報告…プロダクトリスクに関連するメトリクスは以下の通り：…まだ全部がテストできていないリスクの割合…コストとテスト労力に関するメトリクスは以下の通り：…テストしていないコンポーネントの残存リスク：テストしていないコンポーネントに欠陥がある場合の潜在的な影響と可能性。…テスト実行を継続し、識別される欠陥が少なくなってきたら、テストを終了する判断を下すことができる。この判断は、メトリクスの報告と合意された終了基準に基づくべきである。","ref":"1.3.4（残存リスクレベルに関するテスト進捗の報告とリリースの判定／テストを延長するか残ったリスクを受け入れるかの提案）、2.1.3（まだ全部がテストできていないリスクの割合はプロダクトリスクのメトリクス／テストしていないコンポーネントの残存リスクはコストとテスト労力のメトリクスで、示すのは潜在的な影響と可能性／終了の判断はメトリクスの報告と合意された終了基準に基づく）","misconception":"テスト報告を、合意した終了基準に届いたかどうかの答え合わせだと考えており、届かなかった部分について、可否を決める人が何を引き受けることになるのかを示す材料だとは捉えていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["連携先を待たずに模擬データで先に確かめ、残存リスクを疎通確認だけに縮めて予定どおり出す（シナリオの明示条件で成立しない案）","延期という結論をテストマネージャーが先に決め、判定を事後の報告に変える","合意した終了基準の対象を取り違え、3項目とも満たしたものとして達成状況の一覧で済ませる"],"distractorTypes":["D2","D10","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-25","MP-26","MP-27"]}},{"id":"q-2.1.3-A-2","lo":"TM-2.1.3","cluster":"2.1.3-B","variant":1,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"製薬会社で、複数の工場の製造実行を管理するシステムを刷新している。あなたはシステムテストと受け入れテストのテストマネージャーで、月末の進捗会議に出す定例レポートの項目を決める。会議には本社の品質保証統括部門とシステム部門の役員が出席する。\n\n・出荷の可否に関わるため、規制当局の査察では、仕様書に書かれた項目の一つひとつについて検証した記録を示すことが求められる\n・開発は工程を順に進める形で、各工程の成果物を文書に残し、承認を得てから次へ進んでいる\n・仕様は着手時に凍結してあり、変更管理委員会の承認がなければ動かせない。今期の変更は0件である\n・単体と結合の工程は開発部門が担当し、その結果は開発部門の報告書にまとめられていて、今回のレポートの範囲に入らない\n\n着手前に洗い出した重点箇所（電子記録の改ざん防止、工程間のデータ引き継ぎなど）は一覧で管理しており、テストは実行の途中で、まだ着手できていないものが残っている。テスト環境は3拠点に分かれているが、いずれも同じ構成である。","question":"この状況を分析し、査察で示す記録と出荷の可否の見通しを同じレポートで役員に伝えるために、載せる指標の組み合わせとして最も適合するものはどれか。1つ選べ。","choices":["重点箇所のうち、テストが全件通ったもの・一部が不合格のもの・まだ手が付いていないものの割合／欠陥数の累計に対する解決済みの累計／計画したテストの総数に対する、実行・合格・不合格・ブロックの件数／仕様書に挙がっている項目のうちテストケースで確認できている割合／テストに投入した時間の計画に対する実績","重点箇所のうち、テストが全件通ったものと一部が不合格のものの割合／システムテストと受け入れテストで見つけた欠陥を、混入した工程で分けた件数の内訳／計画したテストのうち実行を終えたものの割合と、その週ごとの推移／重点箇所のうち、テストケースで軽減できている割合／テストに費やした時間の計画に対する実績","重点箇所のうち、テストが全件通ったものの割合／欠陥の重要度ごとの件数と、そのうち解決を終えた件数／実行したテストケースのうち合格したものと不合格のものの件数／仕様書の項目のうち、テストケースで検証できている割合／テストに要した時間の計画に対する実績","単体と結合の工程で得たステートメントとブランチの網羅率の推移／変更管理委員会に持ち込まれた仕様変更の件数の月ごとの推移／欠陥のステータス別（オープン、クローズ、却下など）の件数／計画したテストのうち実行を終えた件数とブロックされている件数／テストに使った時間の計画と実績の差"],"answer":[0],"explanation":{"signals":"判断を分けるのは、シナリオが挙げる条件のうち次のものである。規制当局の査察が、仕様書に書かれた項目の一つひとつについて検証した記録を示すことを求めていること——これがカバレッジの分母を仕様書の項目に固定する。着手前に洗い出した重点箇所に、まだ着手できていないものが残っていること——これが、全件通ったものと一部が不合格のものだけでなく、手が付いていない分まで見える形を外せなくする。開発が工程を順に進める形で、単体と結合は開発部門の担当であり今回のレポートの範囲に入らないこと——これが、下位の工程で取る網羅率をこのレポートの外へ押し出す。仕様が着手時に凍結され、今期の変更が0件であること——これが、仕様変更の件数を動かない数値にする。\n判断を分けないもの: テスト環境が3拠点に分かれていることは、いずれも同じ構成なので、どの組み合わせを選ぶかに効かない。製薬会社の製造実行管理という業種も、査察が何を求めるかがシナリオに書かれている以上、それ以上の手がかりにはならない。","why":"載せるべきは、重点箇所を「テストが全件通ったもの・一部が不合格のもの・まだ手が付いていないもの」の3つに分けて割合で示し、カバレッジを「仕様書に挙がっている項目のうちテストケースで確認できている割合」で取る組み合わせである。この2つが、設問がこのレポートに与えた2つの役目——査察で示す記録と、出荷の可否の見通し——にそのまま対応している。\n査察が示せと求めるのは、仕様書に書かれた項目の一つひとつについて検証した記録である。だからカバレッジの分母は仕様書の項目でなければならず、これはシラバスがカバレッジの下に置く「要件カバレッジ：テストケースによってカバーしている要件の割合。」にあたる。同じカバレッジでも、分母を自分たちで洗い出した重点箇所に置き換えると、査察が求める記録にはならない。\n出荷の可否を見通すほうは、重点箇所の消化が、全件通ったものと一部が不合格のものに加えて、まだ手が付いていないものまで分かれている必要がある。シラバスがプロダクトリスクのメトリクスとして挙げるのは「すべてのテストが合格したリスクの割合」「一部またはすべてのテストが不合格になったリスクの割合」「まだ全部がテストできていないリスクの割合」で、重点箇所の一覧に着手できていないものが残っているこの場面では、3つ目が落ちると残っている危険の量が読めない。\nこの選び方を求めているのもシラバスである。テストマネジメントはコードカバレッジのメトリクスを使用することができるとしたうえで、「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである」と述べている。ここで言うコンテキストが、査察の求めと、まだ手が付いていない重点箇所が残っているという状況である。\n残りの欄は、この2つの役目を分けるところまでは行かない。欠陥の欄と時間の欄は、4つの候補のどれもが 2.1.3 の列挙に対応する項目を置いている。この組み合わせの「欠陥数の累計に対する解決済みの累計」は「欠陥数累計に対する解決済み欠陥数累計」にあたり、「テストに投入した時間の計画に対する実績」は、シラバスがテスト進捗の下に置く「テスト工数：テストに費やしたリソース時間の計画に対する実績」であって、コストの欄ではない。進捗の欄は候補ごとに形が違うが、計画を分母に置いた候補は他にもあるので、ここだけでは決まらない。この組み合わせの「計画したテストの総数に対する、実行・合格・不合格・ブロックの件数」は「テスト実行状況：計画、実装、実行、合格、不合格、ブロック、スキップしたテストの総数」にあたる。","distractors":[null,"カバレッジが「重点箇所のうち、テストケースで軽減できている割合」で置かれていて、分母が自分たちで洗い出した重点箇所である。査察が示せと求めるのは仕様書に書かれた項目の一つひとつについての検証の記録なので、この分母では答えられない。重点箇所の消化も、全件通ったものと一部が不合格のものの2つにとどまり、まだ手が付いていない分が読めないため、出荷の可否の見通しにも届かない。レポートの2つの役目のどちらにも当たらない。指標として誤っているものは1つも無く、混入した工程で分けた欠陥の内訳は、どの工程で作り込みどこで取り逃がしているかを示すので、検出を前の工程へ寄せる改善に取り組む場面ではむしろ最も効く。週ごとの推移まで持っていて整って見えるため、1つずつの妥当性で選ぶとこれを取ってしまう","重点箇所の消化を「テストが全件通ったものの割合」だけで示している。重点箇所の一覧にはまだ着手できていないものが残っているので、この割合だけでは、残りが不合格で止まっているのか、そもそも手が付いていないのかが区別できない。シラバスはプロダクトリスクのメトリクスに「すべてのテストが合格したリスクの割合」「一部またはすべてのテストが不合格になったリスクの割合」「まだ全部がテストできていないリスクの割合」の3つを別立てで挙げており、まだ手が付いていない分は3つ目でしか読めない。出荷の可否をこのレポートで見通す以上、そこが空いたままかどうかは外せない。査察が求める仕様書の項目ごとの確認状況は持ち、欠陥も解決の進みまで示し、時間も計画に対する実績で出しているので、定例レポートの体裁としてはほぼ整って見える。なお、この組み合わせがこの設問の答えになるには、重点箇所の区分を増やすだけでは足りない——進捗を「実行したテストケースのうち合格したものと不合格のものの件数」で置いていて、計画したテストの総数という分母を持たないからである","査察が求める仕様書の項目ごとの検証の記録にあたる指標も、重点箇所の消化を示す指標も、この組み合わせには入っていない。そのうえ単体と結合の工程は開発部門が担当し今回のレポートの範囲に入らず、シラバスは構造カバレッジのメトリクスを、コンポーネントテストやコンポーネント統合テストのようなより低いレベルのテストに適用できるものとして位置づけている。ただし同じ段落には「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう」という条件つきの但し書きが続いており、テストレベルだけで一律に外れるわけではない。この場面で外れるのは、まず単体と結合の結果が今回のレポートの範囲に入らないとシナリオが明示しているからであり、但し書きの側も、開発が工程を順に進める形で仕様が着手時に凍結されている以上、コードが頻繁に変更される環境には当たらないからである。仕様変更の件数も、その凍結ゆえに、報告の欄を1つ使って動かない数値を載せることになる（2.1.3 が目的別に挙げるメトリクスの例の中にも、この項目に対応する名前は無い）。ステートメントとブランチの網羅率はコードをどこまで実行したかを測る指標として実在し、数値としても明快であり、欠陥のステータス別の件数も、実行とブロックの件数も、時間の計画と実績の差もそれぞれ妥当であるため、5つのうち2つの欄を空費していることが見えにくい"],"flip":[null,null,null,null],"flipNote":{"2":"この組み合わせが最も効くのは、レポートの役目が、査察への備えや出荷の可否ではなく、どの工程で欠陥を作り込みどこで取り逃がしているかを突き止めることに変わったときである。それは設問が定めるレポートの役目そのものの変更であって、シナリオの条件を1つ動かしても届かない。査察の求めや重点箇所の残り方をシナリオの側で変えても、この組み合わせのカバレッジの分母は自分たちで洗い出した重点箇所のままで、仕様書の項目ごとの検証の記録にはならないからである。","3":"重点箇所の一覧に着手できていないものが残っていない、という条件を置けば、全件通った割合だけでも消化の状況は言い尽くせる。ただしそれだけでは足りない。この組み合わせは進捗を、実行したテストケースのうち合格したものと不合格のものの件数で置いていて、計画したテストの総数を分母に持たない。テストは実行の途中なのだから、出荷の可否を見通すには、どこまで進んでどれだけ残っているかが読める形が要る。重点箇所の区分と、進捗を測る分母の両方が動かなければ一意の正答にならず、条件は1つでは足りない。","4":"この組み合わせには、査察が求める仕様書の項目ごとの検証の記録にあたる指標も、重点箇所の消化を示す指標も入っていない。単体と結合の結果を今回のレポートの範囲に含める条件を置いても、仕様が頻繁に変更される条件を置いても、この2つの欠落は埋まらない——どちらの条件も、入っていない指標をこの組み合わせに入れることはしないからである。一意の正答にするにはレポートが担う2つの役目そのものを置き換える必要があり、条件を1つ変えて届く距離ではない。"},"quote":"テストマネジメントは、テストがテスト対象システムの構造をどの程度実行しているかを測定するためにコードカバレッジのメトリクスを使用することができるが、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。…プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力は、プロジェクト終了時に特定の方法で測定され、報告される。以下は、目的別に使用できるメトリクスの例である：…プロダクトリスクに関連するメトリクスは以下の通り：…すべてのテストが合格したリスクの割合…一部またはすべてのテストが不合格になったリスクの割合…まだ全部がテストできていないリスクの割合…欠陥に関するメトリクスは以下の通りである：…欠陥数累計に対する解決済み欠陥数累計…テスト進捗に関連するメトリクスは以下の通り：…テスト実行状況：計画、実装、実行、合格、不合格、ブロック、スキップしたテストの総数…テスト工数：テストに費やしたリソース時間の計画に対する実績…カバレッジに関するメトリクスは以下の通り：…要件カバレッジ：テストケースによってカバーしている要件の割合。…コストとテスト労力に関するメトリクスは以下の通り：…テストしていないコンポーネントの残存リスク…テストコスト：テストコストの計画に対する実績。","ref":"2.1.3","misconception":"メトリクスを、1つずつの妥当性や、プロダクトリスク・欠陥・テスト進捗・カバレッジという枠が埋まっているかで選べると考えており、そのレポートが果たす役目に対して、要るものが要る形（どの分母で取るか、どこまで区分を分けるか）で入っているかで見ていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["早期の欠陥検出を改善する目的には最も効く整った集合を置き、査察の記録の単位と出荷可否の見通しという、このレポートの目的から外す","査察の記録の単位も計画対比の工数も満たした整った集合から、まだ着手できていない重点箇所の区分だけを落とす","シナリオが無効化した指標（下位レベルの網羅率・仕様変更の件数）を一般論の妥当性で選ぶ"],"distractorTypes":["D4","D3","D2"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-24","MP-25","MP-28"]}},{"id":"q-2.1.3-C-1","lo":"TM-2.1.3","cluster":"2.1.3-C","variant":1,"chapter":2,"section":"2.1","k":4,"points":3,"type":"multi","minutes":4,"scenario":"損害保険会社で、事故の受付から保険金の支払いまでを扱うシステムを刷新中である。あなたはシステムテストのテストマネージャーで、毎週の定例会に出す報告を見直す。定例会に出る支払い部門の担当役員と開発の責任者は、この場でしかレポートに目を通す時間が取れない。10週間後に代理店向けの切り替え説明会があり、日付は通知済みで動かない。役員からは「間に合わないと分かってから言われても手が打てない」と言われた。\n\n・テストの担い手は他案件と兼務で、週に使える時間は40〜120時間で振れる。この先の週に使える見込みは要員計画から毎週引き直している\n・残っているテストケースの見積り時間は、実績に合わせて毎週置き直している\n・着手前に洗い出した重点箇所は影響の重さで3段に分けてあり、箇所ごとの合否と未実施は毎週取れる。重い側にはまだ一度も流していないものが残っている\n・欠陥の混入工程と根本原因はツールの必須入力で、毎月の改善会で扱う\n\nテスト環境は2面あり、片方は他案件と共用だが、実行の待ちは出ていない。","question":"テスト結果を分析し、予定に対する遅れを手が打てるうちに伝えられるようにするために、この報告に加える指標として最も妥当なものはどれか。2つ選べ。","choices":["見つかった欠陥を、混入した工程と根本原因で分けた件数の内訳にし、週ごとの推移とともに載せる。どこで作り込み、どこで取り逃がしているかが読める形にする。","残っているテストケースの見積り時間の合計を、翌週以降に使える見込みの時間と並べ、説明会までの週ごとにどれだけ足りなくなるかが読める形で載せる。","これまでの週あたりの平均消化件数で、重点箇所の分も合わせた残りのテストケースの件数を割り、説明会までに終わるかどうかを完了予定週として載せる。","重点箇所を影響の重さの3段に分け、段ごとに、すべてのテストが合格した割合、一部またはすべてのテストが不合格になった割合、まだ全部がテストできていない割合を載せる。","報告を週1回から日次に切り替え、その日に実行したテストの記録と、まだ実行していないテストケースの全件一覧を添える。"],"answer":[1,3],"explanation":{"signals":"判断を分けるのは次の与件である。役員の「間に合わないと分かってから言われても手が打てない」という求め——これが報告の役目を、いまどこまで進んだかの説明から、この先どこで足りなくなるかの見通しに変える。週に使える時間が40〜120時間で振れ、この先の週に使える見込みを毎週引き直していること——これが、過去の消化ペースをそのまま先に延ばす形を成り立たなくし、同時に、先を見通すための物差しを与える。残っているテストケースの見積り時間を実績に合わせて毎週置き直していること——これが、残りの仕事量を時間で置ける材料になる。重点箇所が影響の重さで3段に分けてあり、箇所ごとの合否と未実施が毎週取れて、重い側にまだ一度も流していないものが残っていること。欠陥の混入工程と根本原因が毎月の改善会ですでに扱われていること。二人ともこの定例の場でしかレポートに目を通せないこと。\n判断を分けないもの: テスト環境が2面あり片方を他案件と共用していることは、実行の待ちが出ていない以上、どの指標を加えるかを動かさない。損害保険という業種も、役員が何を求めているかがそのまま書かれている以上、それ以上の手がかりにはならない。","why":"加えるのは、残っているテストケースの見積り時間を翌週以降に使える見込みの時間と並べる形と、重点箇所を影響の重さの3段に分けて、すべてのテストが合格した割合・一部またはすべてのテストが不合格になった割合・まだ全部がテストできていない割合を段ごとに示す形の2つである。役員が求めているのは、間に合わないと分かる前に手を打てる材料である。手を打つには、いつ足りなくなるかと、どこが足りていないかの両方が要る。前者を引き受けるのが時間を並べる形で、後者を引き受けるのが重さの段ごとに消化を分けて示す形であり、どちらか一方だけでは打つ手が決まらない。\n前者は、残りの仕事量を時間に直したうえで、週ごとに使える見込みの時間と突き合わせる。週に使える時間は40〜120時間で振れ、その見込みは毎週引き直されているのだから、足りなくなる週がどこで来るかは、この2つを並べて初めて読める。シラバスがテスト進捗のメトリクスに挙げているのは「テスト実行状況：計画、実装、実行、合格、不合格、ブロック、スキップしたテストの総数」と「テスト工数：テストに費やしたリソース時間の計画に対する実績」で、どちらもいまどこまで来たかを数える形であり、この先どの週で足りなくなるかまでは出てこない。残りの見積り時間を、毎週引き直している使える見込みの時間と週ごとに並べる形は、その先を読むために、この場で毎週取れる材料で組み替えたものである。\n後者は、重い側の遅れを軽い側の進みで埋もれさせない。シラバスがプロダクトリスクのメトリクスとして挙げるのは「すべてのテストが合格したリスクの割合」「一部またはすべてのテストが不合格になったリスクの割合」「まだ全部がテストできていないリスクの割合」の3つで、重い側にまだ一度も流していないものが残っているこの場面では、3つ目が段ごとに見えて初めて、説明会までに間に合わない箇所が名指しできる。\nこの組み替えを求めているのもシラバスである。報告の目的は「マネジメントの目的のために情報に対する素早い理解を提供すること」であり、「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである」。ここでのニーズは、手が打てるうちに遅れを知ることである。ただし原文が言っているのは合わせるべきだというところまでで、何に合わせるかを決めているのはこの場面の与件である——週に使える時間が40〜120時間で振れその見込みを毎週引き直していることと、重い側にまだ一度も流していないものが残っていることの2文が、これまでの平均消化件数で残りの件数を割って完了予定週を一点で出す形ではなく、この2つを選ばせている。またシラバスは、メトリクスをある時点のスナップショットとして報告することも、傾向を評価するために時系列的なメトリクスの変遷として報告することもできるとしている。重い側の未消化を段ごとに示す形は、いまどこが空いているかを映す前者にあたる。残りの見積り時間と翌週以降に使える見込みを並べる形のほうは、どちらも測り終えた値の見せ方であるこの2つのいずれでもなく、この場のニーズに合わせて組み替えた、この先の見通しである。","distractors":["欠陥をどこで作り込み、どこで取り逃がしているかを示す内訳で、シラバスも欠陥のメトリクスとして、テストレベルまたはイテレーションでの混入件数・検出件数・修正件数や根本原因の内訳を挙げている。指標として誤ってはおらず、検出をもっと前の工程へ寄せたいときには、まさにこの内訳が要る。外れるのは役目のほうである。この内訳が指しているのは、見つかった欠陥がどこで生まれどこで見逃されたかであって、この先やり残しがどこに残り、どの週で時間が足りなくなるかではない。しかもこの内訳は、混入工程と根本原因がツールの必須入力になっていて、毎月の改善会ですでに扱われている。妥当な指標であることと、いま求められている役目に応えることを分けずに選ぶとこれを取る。",null,"先の完了時期を出そうとしている点では役員の求めに向き合っており、残件数を平均ペースで割るだけなので毎週すぐ作れる。だが、この場面には二つ当てはまらないところがある。週に使える時間は40〜120時間で振れると書かれているのに、これまでの平均消化件数を先にそのまま延ばしていて、毎週引き直している見込みの時間を使っていない。加えて、重点箇所の分を残り件数に合算してしまうため、重い側にまだ一度も流していないものが残っていても、軽い側の消化に紛れて完了予定週の一点に丸められる。手が打てるうちに伝えるには、どこが足りないのかが見えている必要がある。",null,"情報を増やせば早く気づけるはずだ、という読み方から出てくる案で、監査や障害対応の場では実際に求められる形でもある。だがシラバスは、メトリクスを報告する目的を、マネジメントの目的のために情報に対する素早い理解を提供することだとしている。実行の記録と未実行の一覧は、いつどこで足りなくなるかを読み手の代わりに計算しない。そのうえ、役員も開発の責任者も週1回のこの場でしかレポートに目を通す時間が取れないと言っているのだから、日次に切り替えた分は読まれない。伝える回数と、伝わる中身は別である。"],"flip":[null,null,null,null,null],"flipNote":{"1":"この内訳が報告の柱になるのは、会議の役目が、説明会に間に合うかどうかではなく、欠陥をどの工程で作り込み、どこで取り逃がしているかを突き止めて次に活かすことに変わったときである。それは設問が定めた報告の役目そのものの入れ替えであって、シナリオの与件を1つ動かして届くものではない。加えてこの問は2つを選ぶ形なので、この内訳を持ち上げる条件を当てても、残り時間と使える時間を並べる案と、重い側の未消化を段ごとに示す案は、それぞれ別の理由で立ったままである。選ぶべきものが3つになり、2つを選ぶ形が成り立たなくなる。","3":"この案が答えになるには、二つの与件が同時に動かなければならない。週に使える時間の振れがなくなり平均ペースで先を語れるようになること、そして重点箇所の重さの段が完了予定週の一点に丸められても差し支えなくなること——重い側に未着手が残っているかぎり、後者は残る。片方を動かしても、もう片方が同じ理由でこの案を退ける。さらに、2つを選ぶ形である以上、この案を持ち上げても、重い側の未消化を段ごとに示す案は別の根拠で立ったままなので、選ぶべきものの数が合わなくなる。","5":"日次への切り替えと全件一覧の添付が答えになるのは、読み手が毎日レポートに目を通せて、かつ生の記録から自分で先を見通す場合である。この場面では、役員も開発の責任者も週1回の定例でしかレポートに目を通す時間が取れないと書かれており、その一文を外しても、実行の記録と未実行の一覧が、いつどこで足りなくなるかを示す値に変わるわけではない。報告の回数と添付の量を動かす案は、載せる指標を入れ替える案とは土俵が違い、2つを選ぶ形のもう一方の答えを押しのけることもない。"},"quote":"より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。…メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することである。メトリクスは、ある時点におけるメトリクスのスナップショットとして報告することも、傾向を評価するために時系列的なメトリクスの変遷として報告することもできる。…プロダクトリスクに関連するメトリクスは以下の通り：…すべてのテストが合格したリスクの割合…一部またはすべてのテストが不合格になったリスクの割合…まだ全部がテストできていないリスクの割合…欠陥の数または割合の内訳：…テストレベルまたはイテレーションでの混入件数、検出件数、修正件数…根本原因…テスト進捗に関連するメトリクスは以下の通り：…テスト実行状況：計画、実装、実行、合格、不合格、ブロック、スキップしたテストの総数…テスト工数：テストに費やしたリソース時間の計画に対する実績","ref":"2.1.3（より高いレベルの報告はプロジェクトのコンテキストとニーズに合わせる／報告の目的は素早い理解／スナップショットと傾向／プロダクトリスクの3つの割合／欠陥の内訳／テスト進捗のメトリクス）","misconception":"報告の役目が「いまどこまで進んだか」から「この先どこで足りなくなるか」に変わっても、指標を1つずつの妥当さで選んでしまい、その指標が先を向いているか、シナリオが与えた振れ幅や重みをそのまま使っているかで選べていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["欠陥の混入工程と根本原因の内訳という、検出を前へ寄せる目的には最も効く指標を置き、遅れを手が打てるうちに伝えるという役目から外す","先の完了時期を出す形にしながら、毎週引き直している使える時間の見込みを使わず、重点箇所の重さの段を合算して丸める","報告の回数と添付の量を増やすことで、早く気づけるようにしたつもりにさせる"],"distractorTypes":["D4","D3","D13"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-28","MP-25","MP-20"]}},{"id":"q-2.1.3-D-1","lo":"TM-2.1.3","cluster":"2.1.3-D","variant":1,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"動画配信サービスの会員登録と課金を扱う基盤を、動かしながら作り替えている。あなたはシステムテストのテストマネージャーで、月に一度の運営会議に出す報告の作りを決める。会議に出る事業責任者がそこで決めたいのは、次の四半期に新しい料金プランを出せるかどうかである。\n\n・本番への反映は週2回あり、決済連携のコードには毎週手が入る。半年前に組んだシステムテストの自動化スイートが、その後に変わった部分を通せているかは分かっていない。どこが変わったかは構成管理から取れ、スイートを流したときのコードの網羅率も毎回取れている\n・コンポーネントテストとコンポーネント統合テストは開発チームが自動で回していて、ステートメントの網羅率は先月100%に達した。その先月、そこをすべて通っていた月次の締め処理で、他システムとつないだ状態でしか出ない不具合が本番で1件出た\n・重点箇所（二重請求、解約の取りこぼしなど）の一覧があり、消化状況と欠陥の解決状況は毎週取れる\n\nテストデータは本番から匿名化して作っているが、その手順は半年前から変えていない。","question":"テスト結果を分析し、この会議に出す報告の作りとして最も妥当なものはどれか。1つ選べ。","choices":["コンポーネントテストとコンポーネント統合テストのステートメントの網羅率が100%に達したことを品質の裏づけとして前に置き、システムテストの結果は重点箇所のうち重い側に絞って報告する。","変わった部分に自動化スイートが追いつけているかは数字にしにくいので、開発チームの経験者による安定度の評価を毎月聞き取り、重点箇所ごとの消化状況に添えて、コードの網羅率に代えて報告に載せる。","重点箇所ごとの消化状況に、料金プランの仕様のうちテストケースで確認できている割合を足して報告の柱とし、コードの網羅率は、より低いレベルのテストで扱うものとして報告の外に置く。","重点箇所ごとの消化状況と欠陥の解決の進み具合を報告の柱に据え、週2回の反映で変わった部分を自動化スイートがどれだけ通せているかを、コードの網羅率で併せて示す。"],"answer":[3],"explanation":{"signals":"判断を分けるのは次の与件である。決済連携のコードに毎週手が入り、半年前に組んだ自動化スイートがその後に変わった部分を通せているかが分かっていないこと——これが、コードの網羅率をこの報告に置く理由を作る。どこが変わったかが構成管理から取れ、スイートを流したときの網羅率も毎回取れていること——これが、その置き方を実際に測れるものにする。コンポーネントの工程でステートメントの網羅率が100%に達した直後に、そこをすべて通っていた月次の締め処理で、つないだ状態でしか出ない不具合が本番に出たこと——これが、下の工程の100%を品質の裏づけとして報告の前に置き、システムテストの側を重い側だけに絞る根拠にさせない。事業責任者がこの会議で決めたいのが、次の四半期に新しい料金プランを出せるかどうかであること——これが報告の柱を、重点箇所の消化と欠陥の解決に定める。\n判断を分けないもの: テストデータを本番から匿名化して作っており、その手順が半年前から変わっていないことは、どの作りを選ぶかに効かない。","why":"採るべきは、重点箇所ごとの消化状況と欠陥の解決の進み具合を柱に据え、そこへ、変わった部分を自動化スイートがどれだけ通せているかをコードの網羅率で添える作りである。事業責任者がこの会議で決めるのは次の四半期に新しい料金プランを出せるかどうかであり、その材料になるのは重点箇所の消化と欠陥の解決のほうで、コードの網羅率はそれに代わるものではない。添えるのは、この場面が、シラバスがコードカバレッジを有用であろうと述べた例——頻繁に変更される環境——にそのまま当たるからである。\nシラバスは、構造カバレッジのメトリクスをコンポーネントテストやコンポーネント統合テストのようなより低いレベルのテストに適用できるものとしたうえで、より高いレベルのテスト結果の報告はプロジェクトの特定のコンテキストとニーズに合わせるべきだとし、その一例として「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう」と続けている。本番への反映が週2回あり決済連携のコードに毎週手が入っているこの状況が、原文の言う頻繁に変更される環境にあたる。そして原文がそこで挙げている用途——テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別すること——が、半年前に組んだスイートが変わった部分を通せているか分かっていないという積み残しにそのまま当たる。しかも、どこが変わったかは構成管理から取れ、スイートを流したときの網羅率も毎回取れているので、添える値は実際に測れる。\n柱を重点箇所の消化と欠陥の解決に置く根拠も同じ節にある。シラバスは、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力が、プロジェクト終了時に特定の方法で測定され報告されるとしており、メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することだとしている。次の四半期に料金プランを出せるかを決める人が読むのは、二重請求や解約の取りこぼしといった重点箇所がどこまで片付き、見つかった欠陥がどこまで解決したかである。\nなお、コンポーネントの工程でステートメントの網羅率が100%に達していることは、それを品質の裏づけとして報告の前に置き、システムテストの結果を重い側だけに絞ってよい理由にはならない。シラバスは「構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る」と述べており、先月そこをすべて通っていた締め処理で、つないだ状態でしか出ない不具合が本番に出たことが、それをそのまま示している。高いレベルで対処が残っているものを報告のほうで絞れば、次の四半期に料金プランを出せるかを決める人には、残っている分が見えなくなる。","distractors":["下の工程で取った網羅率が100%に達したことを品質の裏づけに置き、システムテストの側を重い側だけに絞る作りである。だがシラバスは、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残ると述べている。先月そこをすべて通っていた月次の締め処理で、他システムとつないだ状態でしか出ない不具合が本番に出たのは、その通りのことが起きた例である。100%という数字は動かしようがなく、開発チームが自動で回して取ったものなので、報告の一番前に置きたくなる。","重点箇所ごとの消化状況を載せるところまでは同じで、そこから先で、測った値を人の見立てに置き換える作りである。経験者の見立てを添えること自体は報告を厚くするが、ここでは網羅率に代えて載せるとしており、変わった部分をスイートがどれだけ通せているかという測った値が報告から消える。しかも、数字にしにくいという前提がこの場面では成り立たない。どこが変わったかは構成管理から取れ、スイートを流したときのコードの網羅率も毎回取れていると書かれている。シラバスがカバレッジのメトリクスとして挙げるコードカバレッジも、テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合という、測って出す値である。自動化スイートの追随を数字で語りにくいという現場の実感があるため、もっともらしく響く。","重点箇所の消化に、料金プランの仕様のうちテストケースで確認できている割合を足す柱立ては、シラバスがカバレッジのメトリクスに挙げる要件カバレッジそのもので、誤りではない。外れるのはまず、コードの網羅率を、より低いレベルのテストで扱うものとして報告の外に置いた点である。シラバスは確かに構造カバレッジのメトリクスをより低いレベルのテストに適用できるとしているが、同じ節で、より高いレベルのテスト結果の報告はプロジェクトの特定のコンテキストとニーズに合わせるべきだとし、頻繁に変更される環境ではコードカバレッジがテストスイートに対するコード変更の影響をモニタリングするのに有用であろうと続けている。決済連携のコードに毎週手が入り、半年前のスイートが変わった部分を通せているか分かっていないこの場面では、その続きのほうが効く。柱の立て方にも欠けがある。重点箇所の一覧があり「消化状況と欠陥の解決状況は毎週取れる」のに、この柱には見つかった欠陥がどこまで解決したかが入っていない。テストレベルと指標の対応だけを覚えていると、条件のついた但し書きが落ちる。",null],"flip":[null,null,null,null],"flipNote":{"1":"この作りには、独立に効く誤りが二つある。ひとつは、下の工程で取ったステートメントの網羅率100%を品質の裏づけとして報告の前に置いていること。これを退けているのはシラバスの「コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る」という一文で、受験者が当てはめで動かせる側には無い——先月そこをすべて通っていた締め処理で本番に不具合が1件出たという与件は、その一文が起きたところを見せている例にすぎず、外しても読みは残る。もうひとつは、システムテストの結果を重点箇所のうち重い側だけに絞っていること。この会議に出る事業責任者が決めたいのは次の四半期に新しい料金プランを出せるかどうかで、重い側だけに絞れば、決める人には残りが見えなくなる。こちらは絞るという中身をこの案の側で入れ替えれば動かせるが、動かせるのはそちらだけで、前者は原文の側にある。片方を直しても、もう片方が同じ理由でこの案を退ける。","2":"この作りが答えになるには、二つのうちどちらかが動かなければならないが、どちらを当てても一意にはならない。ひとつは、網羅率に代えるという置き換えをやめて添える形にすること。もうひとつは、数字にしにくいというこの案自身の前提が成り立つ場面にすることである。前者は選択肢の中身そのものの入れ替えで、後者はシナリオの与件の入れ替えである。前者を当てても、この案には欠陥の解決の進み具合が無く、毎月の聞き取りが柱の隣に残るので、報告の作りとして選ばれるところまでは届かない。後者、つまり網羅率が取れないという与件に置き換えれば、今度はコードの網羅率を報告の外に置く作りのほうが立つ。どこが変わったかは構成管理から取れ、網羅率も毎回取れているとシナリオに書かれている以上、経験者の見立ては、シラバスがカバレッジのメトリクスに挙げる、割合として測って出す値の代わりにはならない。","3":"この作りは、シナリオの与件を二つとも動かしても答えにはならない。動かせそうに見える与件は二つある。ひとつは、決済連携のコードに毎週手が入り本番への反映が週2回あるという変更の頻度そのもの。もうひとつは、半年前に組んだスイートがその後に変わった部分を通せているか分かっていないという積み残しである。どちらも当てはめで動かせる側にあるが、一方だけでは足りない。頻度のほうだけを落として、コードに手が入るのも反映も四半期に一度にすると、原文が「例えば、頻繁に変更される環境では」と例に挙げる場面ではなくなる。それでも、その手前に置かれた「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである」は動かず、四半期ごとに変わった部分をスイートが通せているか分からないままなら、その網羅率はこの報告のニーズに当たり続け、コードの網羅率を報告の外に置くこの作りは一意にならない。逆に積み残しのほうだけを消しても、毎週手が入る以上、次に変わる部分への追随を追う理由は消えない。さらにこの作りは、柱を重点箇所の消化と料金プランの仕様のうちテストケースで確認できている割合の二つに絞っており、重点箇所の一覧があり「消化状況と欠陥の解決状況は毎週取れる」のに、見つかった欠陥がどこまで解決したかが落ちている。この欠けはどちらの与件を動かしても埋まらず、欠陥の解決まで柱に据えた作りのほうが残る。"},"quote":"システムテスト、システム統合テスト、受け入れテスト、セキュリティテストのようなより高いレベルのテストでは、主要なテストベースは、通常、要件仕様書、ユースケース、ユーザーストーリー、プロダクトリスクのような作業成果物である。構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。テストマネジメントは、テストがテスト対象システムの構造をどの程度実行しているかを測定するためにコードカバレッジのメトリクスを使用することができるが、より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することである。…プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力は、プロジェクト終了時に特定の方法で測定され、報告される。…カバレッジに関するメトリクスは以下の通り：…要件カバレッジ：テストケースによってカバーしている要件の割合。…コードカバレッジ：テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合。","ref":"2.1.3（構造カバレッジはより低いレベルのテストに適用できる／より高いレベルの報告はプロジェクトのコンテキストとニーズに合わせる／頻繁に変更される環境でのコードカバレッジ／構造カバレッジ100％でも高いレベルでの対処は残る／報告の目的／要件カバレッジとコードカバレッジ）","misconception":"コードの網羅率は低いレベルのテストのものだから高いレベルの報告には載せない、あるいは逆に、低いレベルで100%に達したのだからそれを品質の裏づけに置いて高いレベルの報告は絞ってよい、と一律に決めてしまい、頻繁に変更される環境かどうかという、シラバスが例に挙げる場面によってその扱いが変わることを見ていない"},"meta":{"concept":"テストメトリクスと報告","distractorIntent":["下の工程で取った網羅率の100%を品質の裏づけに置き、システムテストの結果の報告を重い側だけに絞ってよいと読ませる","測って出せる網羅率を、経験者の安定度の見立てに置き換えさせる","コードの網羅率は低いレベルのものという対応だけで決めさせ、頻繁に変更される環境という条件のついた但し書きを落とさせる"],"distractorTypes":["D2","D10","D3"],"conceptNote":"jstqb-al-tm/kb/concepts/test-metrics-reporting.md","mistakePatterns":["MP-24","MP-22","MP-28","MP-109"]}},{"id":"q-2.1.3-D-2","lo":"TM-2.1.3","cluster":"2.1.3-D","variant":2,"chapter":2,"section":"2.1","k":4,"points":3,"type":"single","minutes":4,"scenario":"ネットスーパーの注文受付と配送枠の割り当てを、動かしながら作り替えている。あなたはシステムテストのテストマネージャーで、四半期ごとの事業レビューに出す報告の作りを決める。レビューに出る事業部の責任者がそこで決めたいのは、来期に置き配の取り扱いを始めてよいかどうかである。\n\n本番への反映は毎日あり、配送枠の割り当てのコードにはほぼ毎週手が入る。8か月前に組んだ自動化スイートが、その後に書き換わった部分を通せているかは確かめていない。どこが書き換わったかはリポジトリの差分から取れ、スイートを流したときのコードの網羅率も実行のたびに取れている。\n\nコンポーネントテストとコンポーネント統合テストは開発チームが自動で回し、ステートメントの網羅率は先々月に100%へ達した。その先々月、そこをすべて通っていた在庫の引き当てで、決済の外部サービスとつないだ状態でしか出ない不具合が本番で2件出た。\n\n重点箇所（配送枠の二重割り当て、キャンセル時の返金漏れなど）の一覧があり、消化状況と欠陥の解決状況は毎週取れる。問い合わせ窓口の応答は前期より速い。","question":"テスト結果を分析し、このレビューに出す報告の作りとして最も妥当なものはどれか。1つ選べ。","choices":["レビューに出す柱は重点箇所の消化と、見つかった欠陥がどこまで解決したかとし、そこへ、直近に書き換わったコードを自動化スイートがどこまで踏めているかを、実行ごとに取れる網羅率で添える。","開発チームが自動で回している工程で網羅率が100%まで届いたことを、品質が確かめられた証としてレビューの冒頭に据え、システムテストからは影響の重い重点箇所の結果に絞って報告する。","自動化スイートの追随ぶりは測りようがないという前提に立ち、開発チームの熟練者が四半期ごとに申告する安定度の段階を、重点箇所の消化状況に添え、コードの網羅率の代わりとしてレビューに出す。","コードの網羅率は下位の工程の指標に当たるとして報告から外し、重点箇所の消化状況と、置き配の仕様のうちテストケースで押さえられている割合の2つを柱に据える。"],"answer":[0],"explanation":{"signals":"判断を分けるのは次の与件である。本番への反映は毎日あり、配送枠の割り当てのコードにはほぼ毎週手が入ること、そして8か月前に組んだ自動化スイートが、その後に書き換わった部分を通せているかは確かめていないこと——この2つが、コードの網羅率をこの報告に置く理由を作る。どこが書き換わったかはリポジトリの差分から取れ、スイートを流したときのコードの網羅率も実行のたびに取れていること——これが、その置き方を実際に測れるものにする。下の工程でステートメントの網羅率が100%へ達した直後に、その先々月、そこをすべて通っていた在庫の引き当てで、決済の外部サービスとつないだ状態でしか出ない不具合が本番で2件出たこと——これが、下の工程の100%を品質の裏づけとして冒頭に据え、システムテストの側を重い側に絞る根拠にさせない。事業部の責任者が決めたいのは、来期に置き配の取り扱いを始めてよいかどうかであること——これが報告の柱を、重点箇所の消化と欠陥の解決に定める。\n判断を分けないもの: 問い合わせ窓口の応答が前期より速いことは、どの作りを選ぶかに効かない。","why":"採るべきは、レビューに出す柱は重点箇所の消化と、見つかった欠陥がどこまで解決したかとし、そこへ、直近に書き換わったコードを自動化スイートがどこまで踏めているかを、実行ごとに取れる網羅率で添える作りである。この場で決めるのは来期に置き配の取り扱いを始めてよいかどうかで、その材料になるのは重点箇所の消化と欠陥の解決のほうであり、コードの網羅率はそれに代わるものではない。添えるのは、この場面が、シラバスがコードカバレッジを有用であろうと述べた例——頻繁に変更される環境——にそのまま当たるからである。\nシラバスは「構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。」としたうえで、「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」とし、その一例として「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。」と続けている。本番への反映は毎日あり、配送枠の割り当てのコードにはほぼ毎週手が入るのだから、ここは原文の言う頻繁に変更される環境にあたる。そして原文がそこで挙げている用途——テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別すること——が、8か月前に組んだ自動化スイートが、その後に書き換わった部分を通せているかは確かめていないという積み残しにそのまま当たる。しかもどこが書き換わったかはリポジトリの差分から取れ、スイートを流したときのコードの網羅率も実行のたびに取れているので、添える値は実際に測れる。\n柱を重点箇所の消化と欠陥の解決に置く根拠も同じ節にある。シラバスは、プロダクトリスク、欠陥、テスト進捗、カバレッジ、関連コスト、テストの労力が、プロジェクト終了時に特定の方法で測定され報告されるとしており、メトリクスを報告する目的は、マネジメントの目的のために情報に対する素早い理解を提供することだとしている。置き配を始めてよいかを決める人が読むのは、配送枠の二重割り当てやキャンセル時の返金漏れといった重点箇所がどこまで片付き、見つかった欠陥がどこまで解決したかであり、消化状況と欠陥の解決状況は毎週取れる。\nなお、下の工程でステートメントの網羅率が100%に達していることは、それを品質の裏づけとして冒頭に据え、システムテストの結果を重い側に絞ってよい理由にはならない。シラバスは「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」と述べており、その先々月、そこをすべて通っていた在庫の引き当てで、決済の外部サービスとつないだ状態でしか出ない不具合が本番で2件出たことが、それをそのまま示している。","distractors":[null,"下の工程で取った網羅率が100%に届いたことを品質の証に据え、システムテストの側を重い重点箇所に絞る作りである。だがシラバスは「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」と述べている。その先々月、そこをすべて通っていた在庫の引き当てで、決済の外部サービスとつないだ状態でしか出ない不具合が本番で2件出たのは、その通りのことが起きた例である。100%という数字は動かしようがなく、開発チームが自動で回して取ったものなので、レビューの冒頭に置きたくなる。加えて、この場で決めるのは来期に置き配の取り扱いを始めてよいかどうかであり、重い側に絞れば、決める人には残りが見えなくなる。","重点箇所の消化状況を載せるところまでは同じで、そこから先で、自動化スイートの追随という測った値を人の申告に置き換える作りである。熟練者の見立てを添えること自体は報告を厚くするが、ここでは網羅率の代わりとしており、書き換わった部分をスイートがどこまで踏めているかという測った値が報告から消える。しかも、測りようがないというこの案自身の前提が、この場面では成り立たない。どこが書き換わったかはリポジトリの差分から取れ、スイートを流したときのコードの網羅率も実行のたびに取れていると書かれている。シラバスがカバレッジのメトリクスとして挙げる「コードカバレッジ：テストケースによって実行されるコードのステートメント、ブランチ、パス、または条件の割合。」も、測って出す値である。自動化スイートの追随を数字で語りにくいという現場の実感があるため、もっともらしく響く。","重点箇所の消化に、置き配の仕様のうちテストケースで押さえられている割合を足す柱立ては、シラバスがカバレッジのメトリクスに挙げる要件カバレッジそのもので、誤りではない。外れるのは、コードの網羅率を下位の工程の指標に当たるとして報告から外した点である。シラバスは確かに「構造カバレッジのメトリクスは、コンポーネントテスト（ステートメントカバレッジなど）やコンポーネント統合テスト（インターフェースカバレッジなど）のような、より低いレベルのテストに適用できる。」としているが、同じ節で「より高いレベルのテスト結果の報告は、プロジェクトの特定のコンテキストとニーズに合わせるべきである。」とし、「例えば、頻繁に変更される環境では、コードカバレッジのメトリクスは、テストスイートに対するコード変更の影響をモニタリングし、潜在的なギャップやリスクを識別するのに有用であろう。」と続けている。配送枠の割り当てのコードにはほぼ毎週手が入るうえに、8か月前に組んだ自動化スイートが、その後に書き換わった部分を通せているかは確かめていないこの場面では、その続きのほうが効く。テストレベルと指標の対応だけを覚えていると、条件のついた但し書きが落ちる。"],"flip":[null,null,null,null],"flipNote":{"2":"この作りには、独立に効く誤りが2つある。1つは、下の工程で取った網羅率100%を品質の証としてレビューの冒頭に据えていることで、これを退けているのはシラバスの「加えて、コンポーネントテストとコンポーネント統合テストにて構造カバレッジ100％を達成したとしても、欠陥と品質リスクはより高いレベルのテストレベルで対処する必要が残る。」という一文である。受験者が当てはめで動かせる側には無く、その先々月、そこをすべて通っていた在庫の引き当てで、決済の外部サービスとつないだ状態でしか出ない不具合が本番で2件出たという与件は、その一文が起きたところを見せている例にすぎない。もう1つは、システムテストの結果を影響の重い重点箇所に絞っていることで、この場で決めたいのは、来期に置き配の取り扱いを始めてよいかどうかである以上、絞れば決める人には残りが見えなくなる。こちらはこの案の側で絞るのをやめれば動かせるが、動かせるのはそちらだけで、前者は原文の側にある。片方を直しても、もう片方が同じ理由でこの案を退ける。","3":"この作りが答えになるには、2つのうちどちらかが動かなければならないが、どちらを当てても1つには絞られない。1つは、網羅率の代わりとする置き換えをやめて添える形にすること。もう1つは、測りようがないというこの案自身の前提が成り立つ場面にすることである。前者は選択肢の中身そのものの入れ替えで、後者は状況の与件の入れ替えである。前者を当てても、この案には欠陥の解決の進み具合が無く——重点箇所の一覧があり「消化状況と欠陥の解決状況は毎週取れる」のに、この案が添えるのは消化状況だ
